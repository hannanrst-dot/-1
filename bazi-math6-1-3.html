<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>دروازه‌های بخش‌پذیری</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--bg0:#0b1020;--bg1:#151d3a;--ink:#eef2ff;--muted:#a9b6e0;
    --gr:#3ddc97;--gd:#ffc857;--pk:#ff5c8a;--bl:#5cc8ff;
    --card:rgba(255,255,255,.06);--line:rgba(255,255,255,.14);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:'Vazirmatn',sans-serif;color:var(--ink);
    background:radial-gradient(120% 80% at 50% 0%,#20264d 0%,var(--bg0) 60%,#05070f 100%);
    min-height:100vh;padding:8px;overflow:hidden;user-select:none}
  .wrap{max-width:440px;margin:0 auto;position:relative}
  .hud{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:6px 10px;font-weight:800;font-size:14px;display:flex;gap:6px;align-items:center}
  .chip .lbl{color:var(--muted);font-size:11px;font-weight:700}.grow{flex:1}.hearts{font-size:15px}
  .qbar{background:linear-gradient(90deg,rgba(255,92,138,.16),rgba(92,200,255,.14));
    border:1px solid var(--line);border-radius:14px;padding:8px 12px;text-align:center;margin-bottom:6px}
  .qbar b{font-size:16px;font-weight:900}.qbar .s{color:var(--muted);font-size:12px;margin-top:2px}
  .track{height:8px;background:rgba(0,0,0,.35);border-radius:6px;overflow:hidden;margin-bottom:6px}
  #prog{height:100%;width:0;background:linear-gradient(90deg,var(--bl),var(--gr));transition:width .2s}
  .stage{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);
    background:linear-gradient(180deg,#111a36,#0b1226)}
  canvas{display:block;width:100%;touch-action:none}
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;padding:22px;gap:12px;background:rgba(6,8,18,.9);z-index:5}
  .ov h1{margin:0;font-size:23px}.ov p{margin:0;color:var(--muted);font-size:14px;line-height:1.9;font-weight:700}
  .btn{border:0;cursor:pointer;font-family:inherit;font-weight:900;font-size:18px;color:#06121f;
    padding:13px 30px;border-radius:16px;background:linear-gradient(180deg,#ffe08a,var(--gd));
    box-shadow:0 8px 22px rgba(255,200,87,.35);margin-top:4px}.btn:active{transform:translateY(2px)}
  .stars{font-size:40px;letter-spacing:6px}.emoji{font-size:44px}.hidden{display:none}
  .pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:800;color:var(--muted)}
  .scoreBig{font-size:15px;font-weight:800}.scoreBig b{color:var(--gd);font-size:22px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div class="chip"><span class="lbl">امتیاز</span><span id="score">۰</span></div>
    <div class="chip"><span class="lbl">مرحله</span><span id="round">۱/۶</span></div>
    <div class="grow"></div>
    <div class="chip hearts" id="hearts">❤️❤️❤️</div>
  </div>
  <div class="qbar"><b id="q">توپ را به دروازه‌ی درست بفرست!</b><div class="s" id="qs"></div></div>
  <div class="track"><div id="prog"></div></div>
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="ov" id="ovStart">
      <div class="emoji">⚽</div><h1>دروازه‌های بخش‌پذیری</h1>
      <p>توپ‌های عددی از بالا می‌آیند.<br>
      هر توپ را با ضربه به دروازه‌ی درست بفرست:<br>
      <b>«بخش‌پذیر»</b> یا <b>«بخش‌پذیر نیست»</b>.<br>
      قاعده‌ی هر مرحله بالای صفحه نوشته می‌شود.</p>
      <button class="btn" id="btnStart">شروع بازی</button>
    </div>
    <div class="ov hidden" id="ovEnd">
      <div class="emoji" id="ef">🎉</div><h1 id="et">آفرین!</h1>
      <div class="stars" id="es">⭐⭐⭐</div>
      <div class="scoreBig">امتیاز: <b id="esc">۰</b></div>
      <div class="pill" id="em"></div>
      <button class="btn" id="btnAgain">دوباره</button>
    </div>
  </div>
</div>
<script>
(function(){"use strict";
  const GAMEID='math6-1-3';
  const fa=s=>(''+s).replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
  const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  let AC=null;const ac=()=>{if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC};
  function beep(f,d,t,v){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();
    o.type=t||'sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);const n=c.currentTime;
    g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v||.16,n+.01);
    g.gain.exponentialRampToValueAtTime(.0001,n+(d||.15));o.start(n);o.stop(n+(d||.15)+.02);}
  const sOk=()=>{beep(660,.09,'square',.13);setTimeout(()=>beep(880,.11,'square',.12),70)};
  const sBad=()=>beep(150,.28,'sawtooth',.17);
  const sWin=()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.16,'square',.15),i*110));
  const sLose=()=>[392,330,262].forEach((f,i)=>setTimeout(()=>beep(f,.2,'sawtooth',.15),i*140));

  // قواعدِ بخش‌پذیری (کتاب: بخش‌پذیری بر ۲،۳،۵،۹،۱۰)
  const RULES=[
    {d:2, name:'بخش‌پذیر بر ۲ (زوج)', hint:'رقمِ یکانش زوج باشد'},
    {d:5, name:'بخش‌پذیر بر ۵',        hint:'رقمِ یکان ۰ یا ۵'},
    {d:10,name:'بخش‌پذیر بر ۱۰',       hint:'رقمِ یکان ۰'},
    {d:3, name:'بخش‌پذیر بر ۳',        hint:'مجموعِ رقم‌ها بر ۳ بخش‌پذیر'},
    {d:9, name:'بخش‌پذیر بر ۹',        hint:'مجموعِ رقم‌ها بر ۹ بخش‌پذیر'},
    {d:2, name:'بخش‌پذیر بر ۲ (زوج)', hint:'رقمِ یکانش زوج باشد'},
  ];
  const TOTAL=RULES.length, PER=6; // ۶ توپ در هر مرحله

  const cv=$('cv'),ctx=cv.getContext('2d');let W,H,dpr;
  function layout(){const st=cv.parentElement;W=st.clientWidth;
    H=Math.max(360,Math.min(480,Math.round(window.innerHeight-190)));
    dpr=Math.min(2,window.devicePixelRatio||1);cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);}
  layout();window.addEventListener('resize',layout);

  let state='start',ri=0,score=0,lives=3,rule,ball,left,right,done,fx=[],confetti=[];

  function gateY(){return H-64;}
  function loadRound(i){
    ri=i;rule=RULES[i];done=0;
    left ={x:W*0.26,label:'بخش‌پذیر',ok:true};
    right={x:W*0.74,label:'نیست',ok:false};
    $('round').textContent=fa((i+1)+'/'+TOTAL);
    $('q').textContent=rule.name;
    $('qs').textContent='راهنما: '+rule.hint;
    spawnBall();updateHud();
  }
  function randNum(){
    // نیمی بخش‌پذیر، نیمی نه؛ اعداد ۲ تا ۳ رقمی
    const wantDiv=Math.random()<0.5;
    for(let t=0;t<40;t++){const n=10+Math.floor(Math.random()*490);
      if((n%rule.d===0)===wantDiv)return n;}
    return 12;
  }
  function spawnBall(){const n=randNum();
    ball={n,x:W/2,y:-10,vy:70+ri*8,divisible:(n%rule.d===0),moving:null};}
  function updateHud(){$('score').textContent=fa(score);
    $('hearts').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);
    $('prog').style.width=(100*ri/TOTAL)+'%';}

  cv.addEventListener('pointerdown',e=>{
    if(state!=='play'||!ball||ball.moving)return;
    const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*(W/r.width);
    const gate=(x<W/2)?left:right;
    ball.moving={tx:gate.x,gateOk:gate.ok};
  });

  function draw(dt){
    ctx.clearRect(0,0,W,H);
    // دروازه‌ها
    [left,right].forEach(g=>{
      const y=gateY();
      ctx.fillStyle=g.ok?'rgba(61,220,151,.16)':'rgba(255,92,138,.16)';
      ctx.strokeStyle=g.ok?'var(--gr)':'var(--pk)';ctx.strokeStyle=g.ok?'#3ddc97':'#ff5c8a';
      ctx.lineWidth=2;
      ctx.beginPath();ctx.roundRect(g.x-64,y,128,52,12);ctx.fill();ctx.stroke();
      ctx.fillStyle='#eef2ff';ctx.font='900 16px Vazirmatn';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(g.label,g.x,y+26);
    });
    ctx.textBaseline='alphabetic';
    // توپ
    if(state==='play'&&ball){
      if(ball.moving){
        ball.x+=(ball.moving.tx-ball.x)*0.25; ball.y+=(gateY()+24-ball.y)*0.25;
        if(Math.abs(ball.x-ball.moving.tx)<3&&Math.abs(ball.y-(gateY()+24))<4){resolveBall();}
      } else {
        ball.y+=ball.vy*dt;
        if(ball.y>gateY()-4){ // به کف رسید بدون انتخاب
          missBall();
        }
      }
      if(ball){drawBall(ball.x,ball.y,ball.n);}
      // فلش راهنما
      if(ball&&!ball.moving){ctx.fillStyle='rgba(238,242,255,.55)';ctx.font='800 12px Vazirmatn';
        ctx.textAlign='center';ctx.fillText('روی نیمه‌ی درستِ صفحه بزن 👆',W/2,30);}
    }
    fx=fx.filter(p=>{p.t+=dt*2;ctx.globalAlpha=clamp(1-p.t,0,1);
      ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x+Math.cos(p.a)*p.t*40,p.y+Math.sin(p.a)*p.t*40,3,0,7);ctx.fill();
      ctx.globalAlpha=1;return p.t<1;});
    confetti=confetti.filter(c=>{c.vy+=.35;c.x+=c.vx;c.y+=c.vy;c.r+=c.vr;c.life-=.02;
      ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.r);ctx.globalAlpha=clamp(c.life,0,1);
      ctx.fillStyle=c.c;ctx.fillRect(-4,-3,8,5);ctx.restore();return c.life>0&&c.y<H+20;});
    ctx.globalAlpha=1;
  }
  function drawBall(x,y,n){
    ctx.save();ctx.shadowColor='rgba(92,200,255,.4)';ctx.shadowBlur=12;
    const g=ctx.createRadialGradient(x-6,y-6,3,x,y,24);g.addColorStop(0,'#fff');g.addColorStop(1,'#5cc8ff');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,24,0,7);ctx.fill();ctx.shadowBlur=0;
    ctx.strokeStyle='#1a3a55';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#06121f';ctx.font='900 18px Vazirmatn';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(fa(n),x,y);ctx.restore();ctx.textBaseline='alphabetic';
  }
  if(!CanvasRenderingContext2D.prototype.roundRect){
    CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){this.beginPath();
      this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);
      this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this};}
  function burst(x,y,ok){const cols=ok?['#3ddc97','#5cc8ff','#ffc857']:['#ff5c8a','#ff8f5c'];
    for(let i=0;i<10;i++)fx.push({x,y,a:i/10*7,t:0,c:cols[i%cols.length]});}
  function spawnConf(x,y){const cols=['#ffc857','#ff5c8a','#5cc8ff','#3ddc97','#c084fc'];
    return{x,y,vx:(Math.random()-.5)*8,vy:-Math.random()*7-2,r:Math.random()*6,vr:(Math.random()-.5)*.4,
      c:cols[(Math.random()*cols.length)|0],life:1.4+Math.random()};}

  function resolveBall(){
    const correct=(ball.moving.gateOk===ball.divisible);
    burst(ball.x,ball.y,correct);
    if(correct){score+=10;sOk();}else{lives--;sBad();}
    done++;ball=null;updateHud();
    if(lives<=0){endGame(false);return;}
    if(done>=PER){for(let i=0;i<12;i++)confetti.push(spawnConf(W/2,H/2));setTimeout(next,500);}
    else setTimeout(spawnBall,250);
  }
  function missBall(){ // نرسیدن به انتخاب = از دست رفتن
    burst(ball.x,gateY(),false);lives--;sBad();done++;ball=null;updateHud();
    if(lives<=0){endGame(false);return;}
    if(done>=PER)setTimeout(next,500);else setTimeout(spawnBall,250);
  }
  function next(){if(ri>=TOTAL-1){endGame(true);return;}loadRound(ri+1);}

  function endGame(won){state='end';const pct=score/(TOTAL*PER*10);
    const stars=pct>=.8?3:pct>=.55?2:1;
    for(let i=0;i<60;i++)confetti.push(spawnConf(Math.random()*W,-Math.random()*30));
    $('ef').textContent=won?'🎉':'😅';$('et').textContent=won?'تمام شد، آفرین!':'باختی! دوباره تلاش کن';
    $('es').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);$('esc').textContent=fa(score);
    $('em').textContent=won?'قاعده‌های بخش‌پذیری را یاد گرفتی!':'به راهنمای هر قاعده دقت کن 💪';
    $('prog').style.width='100%';$('ovEnd').classList.remove('hidden');won?sWin():sLose();
    if(window.parent!==window){window.parent.postMessage(
      {type:'setareh_game',event:'complete',score:score,stars:stars,gameId:GAMEID},'*');}
  }
  let last=0;function loop(ts){if(!last)last=ts;let dt=(ts-last)/1000;last=ts;dt=Math.min(dt,.05);
    draw(state==='play'?dt:0);requestAnimationFrame(loop);}
  $('btnStart').onclick=()=>{ac();$('ovStart').classList.add('hidden');score=0;lives=3;loadRound(0);state='play';};
  $('btnAgain').onclick=()=>{$('ovEnd').classList.add('hidden');score=0;lives=3;confetti=[];loadRound(0);state='play';};
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
