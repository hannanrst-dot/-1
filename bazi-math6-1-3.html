<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>دروازه‌های بخش‌پذیری</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1a2452;--muted:#5b6bb0;--card:rgba(255,255,255,.8);--line:rgba(120,120,200,.25);
    --pk:#ff5d8f;--or:#ff9f45;--yl:#ffd23f;--gr:#22c993;--bl:#3aa0ff;--pu:#9b6cff;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:'Vazirmatn',sans-serif;color:var(--ink);
    background:linear-gradient(160deg,#7ee0ff 0%,#a99bff 48%,#ffb0d8 100%);
    min-height:100vh;padding:8px;overflow:hidden;user-select:none}
  .wrap{max-width:440px;margin:0 auto;position:relative}
  .hud{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .chip{background:#fff;border-radius:16px;padding:6px 12px;font-weight:800;font-size:14px;
    display:flex;gap:6px;align-items:center;box-shadow:0 4px 12px rgba(80,80,160,.18)}
  .chip .lbl{color:var(--muted);font-size:11px;font-weight:700}.grow{flex:1}.hearts{font-size:15px}
  .qbar{background:#fff;border-radius:16px;padding:9px 12px;text-align:center;margin-bottom:6px;
    box-shadow:0 4px 12px rgba(80,80,160,.18)}
  .qbar b{font-size:16px;font-weight:900}.qbar .s{color:var(--muted);font-size:12px;margin-top:2px}
  .track{height:9px;background:#fff;border-radius:6px;overflow:hidden;margin-bottom:6px;box-shadow:0 2px 8px rgba(80,80,160,.14)}
  #prog{height:100%;width:0;background:linear-gradient(90deg,var(--bl),var(--gr));transition:width .2s}
  .stage{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(80,80,160,.25)}
  canvas{display:block;width:100%;touch-action:none}
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:22px;gap:12px;background:rgba(255,255,255,.86);backdrop-filter:blur(3px);z-index:5}
  .ov h1{margin:0;font-size:24px;color:var(--pu)}.ov p{margin:0;color:#43508f;font-size:14px;line-height:1.9;font-weight:700}
  .btn{border:0;cursor:pointer;font-family:inherit;font-weight:900;font-size:18px;color:#fff;padding:14px 34px;
    border-radius:18px;background:linear-gradient(180deg,#ff86b3,var(--pk));box-shadow:0 8px 20px rgba(255,93,143,.45);margin-top:4px}
  .btn:active{transform:translateY(2px)}
  .stars{font-size:40px;letter-spacing:6px}.emoji{font-size:46px}.hidden{display:none}
  .pill{background:#eef1ff;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:800;color:var(--muted)}
  .scoreBig{font-size:15px;font-weight:800}.scoreBig b{color:var(--pk);font-size:22px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div class="chip"><span class="lbl">امتیاز</span><span id="score">۰</span></div>
    <div class="chip"><span class="lbl">مرحله</span><span id="round">۱/۶</span></div>
    <div class="grow"></div>
    <div class="chip hearts" id="hearts">❤️❤️❤️</div>
  </div>
  <div class="qbar"><b id="q">توپ را به سبدِ درست بفرست!</b><div class="s" id="qs"></div></div>
  <div class="track"><div id="prog"></div></div>
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="ov" id="ovStart">
      <div class="emoji">⚽🧺</div><h1>سبدهای بخش‌پذیری</h1>
      <p>توپ‌های عددی از بالا می‌آیند.<br>
      هر توپ را با ضربه به سمتِ سبدِ درست بفرست:<br>
      <b>«بخش‌پذیر»</b> یا <b>«بخش‌پذیر نیست»</b>.<br>
      قاعده‌ی هر مرحله بالای صفحه نوشته می‌شود. 🎯</p>
      <button class="btn" id="btnStart">شروع بازی</button>
    </div>
    <div class="ov hidden" id="ovEnd">
      <div class="emoji" id="ef">🎉</div><h1 id="et">آفرین!</h1>
      <div class="stars" id="es">⭐⭐⭐</div>
      <div class="scoreBig">امتیاز: <b id="esc">۰</b></div>
      <div class="pill" id="em"></div>
      <button class="btn" id="btnAgain">دوباره</button>
    </div>
  </div>
</div>
<script>
(function(){"use strict";
  const GAMEID='math6-1-3';
  const fa=s=>(''+s).replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
  const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  let AC=null;const ac=()=>{if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC};
  function beep(f,d,t,v){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();
    o.type=t||'sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);const n=c.currentTime;
    g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v||.16,n+.01);
    g.gain.exponentialRampToValueAtTime(.0001,n+(d||.15));o.start(n);o.stop(n+(d||.15)+.02);}
  const sOk=()=>{beep(680,.09,'square',.13);setTimeout(()=>beep(920,.11,'square',.12),70)};
  const sBad=()=>beep(160,.28,'sawtooth',.16);
  const sWin=()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.16,'square',.15),i*110));
  const sLose=()=>[392,330,262].forEach((f,i)=>setTimeout(()=>beep(f,.2,'sawtooth',.14),i*140));

  const RULES=[
    {d:2, name:'بخش‌پذیر بر ۲ (زوج)', hint:'رقمِ یکانش زوج باشد'},
    {d:5, name:'بخش‌پذیر بر ۵',        hint:'رقمِ یکان ۰ یا ۵'},
    {d:10,name:'بخش‌پذیر بر ۱۰',       hint:'رقمِ یکان ۰'},
    {d:3, name:'بخش‌پذیر بر ۳',        hint:'مجموعِ رقم‌ها بر ۳ بخش‌پذیر'},
    {d:9, name:'بخش‌پذیر بر ۹',        hint:'مجموعِ رقم‌ها بر ۹ بخش‌پذیر'},
    {d:2, name:'بخش‌پذیر بر ۲ (زوج)', hint:'رقمِ یکانش زوج باشد'},
  ];
  const TOTAL=RULES.length, PER=6;

  const cv=$('cv'),ctx=cv.getContext('2d');let W,H,dpr;
  function layout(){const st=cv.parentElement;W=st.clientWidth;
    H=Math.max(360,Math.min(480,Math.round(window.innerHeight-190)));
    dpr=Math.min(2,window.devicePixelRatio||1);cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);}
  layout();window.addEventListener('resize',layout);

  let state='start',ri=0,score=0,lives=3,rule,ball,left,right,done,fx=[],confetti=[];
  const gateY=()=>H-70;
  function loadRound(i){ri=i;rule=RULES[i];done=0;
    left ={x:W*0.26,label:'بخش‌پذیر',col:'#22c993',ok:true};
    right={x:W*0.74,label:'نیست',col:'#ff5d8f',ok:false};
    $('round').textContent=fa((i+1)+'/'+TOTAL);
    $('q').textContent=rule.name;$('qs').textContent='راهنما: '+rule.hint;
    spawnBall();updateHud();}
  function randNum(){const wantDiv=Math.random()<0.5;
    for(let t=0;t<50;t++){const n=10+Math.floor(Math.random()*490);if((n%rule.d===0)===wantDiv)return n;}return 12;}
  function spawnBall(){const n=randNum();
    ball={n,x:W/2,y:-10,vy:62+ri*14,divisible:(n%rule.d===0),moving:null,col:['#3aa0ff','#ff9f45','#9b6cff','#ffd23f'][Math.floor(Math.random()*4)]};}
  function updateHud(){$('score').textContent=fa(score);
    $('hearts').textContent='❤️'.repeat(lives)+'🤍'.repeat(3-lives);
    $('prog').style.width=(100*ri/TOTAL)+'%';}

  cv.addEventListener('pointerdown',e=>{
    if(state!=='play'||!ball||ball.moving)return;
    const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*(W/r.width);
    const gate=(x<W/2)?left:right;ball.moving={tx:gate.x,gateOk:gate.ok};});

  function draw(dt){
    // آسمانِ روشن
    const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#bdecff');sky.addColorStop(1,'#e9f7ff');
    ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
    // ابرها
    ctx.fillStyle='rgba(255,255,255,.85)';
    cloud(W*0.22,H*0.16,20);cloud(W*0.72,H*0.10,16);
    // چمن
    ctx.fillStyle='#8fe388';ctx.beginPath();ctx.moveTo(0,H*0.8);
    for(let x=0;x<=W;x+=24)ctx.lineTo(x,H*0.8+Math.sin(x*0.05)*4);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
    if(state!=='start'&&left&&right){
      [left,right].forEach(g=>{drawBasket(g);});
      if(state==='play'&&ball){
        if(ball.moving){ball.x+=(ball.moving.tx-ball.x)*0.28;ball.y+=(gateY()-6-ball.y)*0.28;
          if(Math.abs(ball.x-ball.moving.tx)<3&&Math.abs(ball.y-(gateY()-6))<5)resolveBall();}
        else{ball.y+=ball.vy*dt;if(ball.y>gateY()-6)missBall();}
        if(ball)drawBall(ball.x,ball.y,ball.n,ball.col);
        if(ball&&!ball.moving){ctx.fillStyle='rgba(26,36,82,.6)';ctx.font='800 12px Vazirmatn';
          ctx.textAlign='center';ctx.fillText('روی نیمه‌ی درستِ صفحه بزن 👆',W/2,H*0.09);}
      }
    }
    fx=fx.filter(p=>{p.t+=dt*2.2;ctx.globalAlpha=clamp(1-p.t,0,1);ctx.fillStyle=p.c;
      ctx.beginPath();ctx.arc(p.x+Math.cos(p.a)*p.t*46,p.y+Math.sin(p.a)*p.t*46,3.5,0,7);ctx.fill();
      ctx.globalAlpha=1;return p.t<1;});
    confetti=confetti.filter(c=>{c.vy+=.35;c.x+=c.vx;c.y+=c.vy;c.r+=c.vr;c.life-=.02;
      ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.r);ctx.globalAlpha=clamp(c.life,0,1);
      ctx.fillStyle=c.c;ctx.fillRect(-4,-3,8,5);ctx.restore();return c.life>0&&c.y<H+20;});
    ctx.globalAlpha=1;
  }
  function cloud(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.arc(x+r,y+4,r*0.8,0,7);
    ctx.arc(x-r,y+4,r*0.8,0,7);ctx.arc(x,y+8,r,0,7);ctx.fill();}
  function drawBasket(g){const y=gateY();
    ctx.fillStyle=g.col;ctx.strokeStyle='rgba(0,0,0,.12)';ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(g.x-62,y,124,58,16);ctx.fill();ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.28)';ctx.beginPath();ctx.roundRect(g.x-62,y,124,18,{tl:16,tr:16,br:0,bl:0});ctx.fill();
    ctx.fillStyle='#fff';ctx.font='900 17px Vazirmatn';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(g.label,g.x,y+30);ctx.textBaseline='alphabetic';}
  function drawBall(x,y,n,col){
    ctx.save();ctx.shadowColor='rgba(0,0,0,.15)';ctx.shadowBlur=8;ctx.shadowOffsetY=4;
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,25,0,7);ctx.fill();ctx.shadowBlur=0;ctx.shadowOffsetY=0;
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(x-8,y-9,7,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='900 20px Vazirmatn';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(fa(n),x,y);ctx.restore();ctx.textBaseline='alphabetic';}
  // roundRect با پشتیبانی از شعاعِ گوشه‌ایِ متفاوت
  const _rr=CanvasRenderingContext2D.prototype.roundRect;
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(typeof r==='object'){this.beginPath();this.moveTo(x+r.tl,y);
      this.arcTo(x+w,y,x+w,y+h,r.tr);this.arcTo(x+w,y+h,x,y+h,r.br);
      this.arcTo(x,y+h,x,y,r.bl);this.arcTo(x,y,x+w,y,r.tl);this.closePath();return this;}
    if(_rr)return _rr.call(this,x,y,w,h,r);
    this.beginPath();this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this;};
  function burst(x,y,ok){const cols=ok?['#22c993','#3aa0ff','#ffd23f']:['#ff5d8f','#ff9f45'];
    for(let i=0;i<12;i++)fx.push({x,y,a:i/12*7,t:0,c:cols[i%cols.length]});}
  function spawnConf(x,y){const cols=['#ffd23f','#ff5d8f','#3aa0ff','#22c993','#9b6cff','#ff9f45'];
    return{x,y,vx:(Math.random()-.5)*8,vy:-Math.random()*7-2,r:Math.random()*6,vr:(Math.random()-.5)*.4,
      c:cols[(Math.random()*cols.length)|0],life:1.4+Math.random()};}

  function resolveBall(){const correct=(ball.moving.gateOk===ball.divisible);
    burst(ball.x,ball.y,correct);
    if(correct){score+=10;sOk();}else{lives--;sBad();}
    done++;ball=null;updateHud();
    if(lives<=0){endGame(false);return;}
    if(done>=PER){for(let i=0;i<14;i++)confetti.push(spawnConf(W/2,H/2));setTimeout(next,520);}
    else setTimeout(()=>{if(state==='play')spawnBall();},240);}
  function missBall(){burst(ball.x,gateY(),false);lives--;sBad();done++;ball=null;updateHud();
    if(lives<=0){endGame(false);return;}
    if(done>=PER)setTimeout(next,520);else setTimeout(()=>{if(state==='play')spawnBall();},240);}
  function next(){if(ri>=TOTAL-1){endGame(true);return;}loadRound(ri+1);}

  function endGame(won){state='end';const pct=score/(TOTAL*PER*10);
    const stars=pct>=.8?3:pct>=.55?2:1;
    for(let i=0;i<70;i++)confetti.push(spawnConf(Math.random()*W,-Math.random()*30));
    $('ef').textContent=won?'🎉':'😅';$('et').textContent=won?'تمام شد، آفرین!':'باختی! دوباره تلاش کن';
    $('es').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);$('esc').textContent=fa(score);
    $('em').textContent=won?'قاعده‌های بخش‌پذیری را یاد گرفتی!':'به راهنمای هر قاعده دقت کن 💪';
    $('prog').style.width='100%';$('ovEnd').classList.remove('hidden');won?sWin():sLose();
    if(window.parent!==window){window.parent.postMessage(
      {type:'setareh_game',event:'complete',score:score,stars:stars,gameId:GAMEID},'*');}}
  let last=0;function loop(ts){if(!last)last=ts;let dt=(ts-last)/1000;last=ts;dt=Math.min(dt,.05);
    draw(state==='play'?dt:0);requestAnimationFrame(loop);}
  $('btnStart').onclick=()=>{ac();$('ovStart').classList.add('hidden');score=0;lives=3;loadRound(0);state='play';};
  $('btnAgain').onclick=()=>{$('ovEnd').classList.add('hidden');score=0;lives=3;confetti=[];loadRound(0);state='play';};
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
