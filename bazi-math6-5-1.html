<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>مزرعه‌ساز — طول و سطح</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1a2452;--muted:#5b6bb0;--pk:#ff5d8f;--or:#ff9f45;--yl:#ffd23f;--gr:#22c993;--bl:#3aa0ff;--pu:#9b6cff;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:'Vazirmatn',sans-serif;color:var(--ink);
    background:linear-gradient(160deg,#a8e063 0%,#56ab2f 55%,#3a8c4f 100%);
    min-height:100vh;padding:8px;overflow:hidden;user-select:none}
  .wrap{max-width:440px;margin:0 auto;position:relative}
  .hud{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .chip{background:#fff;border-radius:16px;padding:6px 12px;font-weight:800;font-size:14px;display:flex;gap:6px;align-items:center;box-shadow:0 4px 12px rgba(30,60,20,.2)}
  .chip .lbl{color:var(--muted);font-size:11px;font-weight:700}.grow{flex:1}.hearts{font-size:15px}
  .qbar{background:#fff;border-radius:16px;padding:9px 12px;text-align:center;margin-bottom:6px;box-shadow:0 4px 12px rgba(30,60,20,.2)}
  .qbar b{font-size:16px;font-weight:900}.qbar .s{color:var(--muted);font-size:12px;margin-top:2px}
  .track{height:9px;background:#fff;border-radius:6px;overflow:hidden;margin-bottom:6px;box-shadow:0 2px 8px rgba(30,60,20,.16)}
  #prog{height:100%;width:0;background:linear-gradient(90deg,var(--yl),var(--gr));transition:width .2s}
  .stage{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(30,60,20,.3)}
  canvas{display:block;width:100%;touch-action:none}
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;gap:12px;background:rgba(255,255,255,.9);backdrop-filter:blur(3px);z-index:5}
  .ov h1{margin:0;font-size:23px;color:#3a8c4f}.ov p{margin:0;color:#3a5a3a;font-size:14px;line-height:1.9;font-weight:700}
  .btn{border:0;cursor:pointer;font-family:inherit;font-weight:900;font-size:18px;color:#fff;padding:14px 34px;border-radius:18px;background:linear-gradient(180deg,#7ec850,var(--gr));box-shadow:0 8px 20px rgba(34,201,147,.45);margin-top:4px}.btn:active{transform:translateY(2px)}
  .stars{font-size:40px;letter-spacing:6px}.emoji{font-size:46px}.hidden{display:none}
  .pill{background:#eafbe6;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:800;color:var(--muted)}
  .scoreBig{font-size:15px;font-weight:800}.scoreBig b{color:#3a8c4f;font-size:22px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div class="chip"><span class="lbl">امتیاز</span><span id="score">۰</span></div>
    <div class="chip"><span class="lbl">مرحله</span><span id="round">۱/۸</span></div>
    <div class="grow"></div>
    <div class="chip hearts" id="hearts">❤️❤️❤️</div>
  </div>
  <div class="qbar"><b id="q">مزرعه‌ای به این مساحت بساز:</b><div class="s" id="qs"></div></div>
  <div class="track"><div id="prog"></div></div>
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="ov" id="ovStart">
      <div class="emoji">🌾</div><h1>مزرعه‌ساز</h1>
      <p>روی زمین <b>انگشتت را بکش</b> تا یک مستطیل بسازی.<br>
      مساحت = <b>طول × عرض</b> است و روی مزرعه نوشته می‌شود.<br>
      مستطیلی بساز که مساحتش دقیقاً برابرِ عددِ خواسته‌شده باشد! 🎯</p>
      <button class="btn" id="btnStart">شروع بازی</button>
    </div>
    <div class="ov hidden" id="ovEnd">
      <div class="emoji" id="ef">🎉</div><h1 id="et">آفرین!</h1>
      <div class="stars" id="es">⭐⭐⭐</div>
      <div class="scoreBig">امتیاز: <b id="esc">۰</b></div>
      <div class="pill" id="em"></div>
      <button class="btn" id="btnAgain">دوباره</button>
    </div>
  </div>
</div>
<script>
(function(){"use strict";
  const GAMEID='math6-5-1';
  const fa=s=>(''+s).replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
  const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  let AC=null;const ac=()=>{if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC};
  function beep(f,d,t,v){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();
    o.type=t||'sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);const n=c.currentTime;
    g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v||.16,n+.01);
    g.gain.exponentialRampToValueAtTime(.0001,n+(d||.15));o.start(n);o.stop(n+(d||.15)+.02);}
  const sDraw=()=>beep(420,.03,'square',.05);
  const sOk=()=>{beep(680,.1,'square',.14);setTimeout(()=>beep(940,.12,'square',.13),80)};
  const sBad=()=>beep(160,.28,'sawtooth',.16);
  const sWin=()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.16,'square',.15),i*110));
  const sLose=()=>[392,330,262].forEach((f,i)=>setTimeout(()=>beep(f,.2,'sawtooth',.14),i*140));

  const COLS=8,ROWS=6;
  const TARGETS=[6,8,12,10,15,16,20,24], TOTAL=TARGETS.length;
  const cv=$('cv'),ctx=cv.getContext('2d');let W,H,dpr;
  function layout(){const st=cv.parentElement;W=st.clientWidth;
    H=Math.max(340,Math.min(420,Math.round(W*0.82)));dpr=Math.min(2,window.devicePixelRatio||1);
    cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);}
  layout();window.addEventListener('resize',layout);

  let state='start',ri=0,score=0,lives=3,target,drag=null,locked=null,confetti=[],flash=0;
  function cell(){return Math.min((W-30)/COLS,(H-70)/ROWS);}
  function gx0(){return (W-cell()*COLS)/2;} function gy0(){return 46;}
  function toCell(x,y){return{c:clamp(Math.floor((x-gx0())/cell()),0,COLS-1),r:clamp(Math.floor((y-gy0())/cell()),0,ROWS-1)};}
  function loadRound(i){ri=i;target=TARGETS[i];drag=null;locked=null;flash=0;
    $('round').textContent=fa((i+1)+'/'+TOTAL);$('qs').textContent='مساحتِ هدف: '+fa(target)+' واحد مربع';updateHud();}
  function updateHud(){$('score').textContent=fa(score);
    $('hearts').textContent='❤️'.repeat(Math.max(0,lives))+'🤍'.repeat(Math.max(0,3-lives));
    $('prog').style.width=(100*ri/TOTAL)+'%';}

  function rectOf(a,b){return{c0:Math.min(a.c,b.c),r0:Math.min(a.r,b.r),c1:Math.max(a.c,b.c),r1:Math.max(a.r,b.r)};}
  function dims(rc){return{w:rc.c1-rc.c0+1,h:rc.r1-rc.r0+1};}
  cv.addEventListener('pointerdown',e=>{if(state!=='play'||locked)return;const p=xy(e);drag={a:toCell(p.x,p.y),b:toCell(p.x,p.y)};sDraw();});
  cv.addEventListener('pointermove',e=>{if(state!=='play'||!drag||locked)return;const p=xy(e);const nb=toCell(p.x,p.y);
    if(nb.c!==drag.b.c||nb.r!==drag.b.r){drag.b=nb;sDraw();}});
  cv.addEventListener('pointerup',()=>{if(state!=='play'||!drag||locked)return;release();});
  cv.addEventListener('pointerleave',()=>{if(state==='play'&&drag&&!locked)release();});
  function xy(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*(W/r.width),y:(e.clientY-r.top)*(H/r.height)};}
  function release(){const rc=rectOf(drag.a,drag.b),d=dims(rc),area=d.w*d.h;drag=null;
    if(area===target){locked={rc,good:true};score+=10;sOk();
      for(let i=0;i<18;i++)confetti.push(spawnConf(W/2,gy0()+cell()*ROWS/2));updateHud();setTimeout(next,900);}
    else{locked={rc,good:false};sBad();lives--;flash=1;updateHud();
      if(lives<=0){setTimeout(()=>endGame(false),500);return;}
      setTimeout(()=>{locked=null;},700);}}
  function next(){if(ri>=TOTAL-1){endGame(true);return;}loadRound(ri+1);}

  function draw(dt){
    ctx.fillStyle='#7cbf4f';ctx.fillRect(0,0,W,H);
    const s=cell(),ox=gx0(),oy=gy0();
    // زمینِ شخم‌خورده
    ctx.fillStyle='#caa06a';ctx.fillRect(ox,oy,s*COLS,s*ROWS);
    for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++){ctx.fillStyle=(c+r)%2?'#c39a63':'#cba471';
      ctx.fillRect(ox+c*s,oy+r*s,s,s);}
    ctx.strokeStyle='rgba(90,60,20,.25)';ctx.lineWidth=1;
    for(let c=0;c<=COLS;c++){ctx.beginPath();ctx.moveTo(ox+c*s,oy);ctx.lineTo(ox+c*s,oy+s*ROWS);ctx.stroke();}
    for(let r=0;r<=ROWS;r++){ctx.beginPath();ctx.moveTo(ox,oy+r*s);ctx.lineTo(ox+s*COLS,oy+r*s);ctx.stroke();}
    // مستطیلِ فعلی یا قفل‌شده
    const rc = drag?rectOf(drag.a,drag.b):(locked?locked.rc:null);
    if(rc){const d=dims(rc),area=d.w*d.h;
      const good = locked?locked.good:(area===target);
      const x=ox+rc.c0*s,y=oy+rc.r0*s,w=d.w*s,h=d.h*s;
      ctx.fillStyle=good?'rgba(34,201,147,.55)':'rgba(255,159,69,.5)';ctx.fillRect(x,y,w,h);
      ctx.strokeStyle=good?'#12a06e':'#e07a1e';ctx.lineWidth=3;ctx.strokeRect(x,y,w,h);
      // برچسبِ طول×عرض=مساحت
      ctx.fillStyle='#1a2452';ctx.font='900 16px Vazirmatn';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(fa(d.w)+' × '+fa(d.h)+' = '+fa(area),x+w/2,y+h/2);ctx.textBaseline='alphabetic';
      // اندازه‌ها روی لبه‌ها
      ctx.fillStyle='#1a2452';ctx.font='800 12px Vazirmatn';ctx.textAlign='center';
      ctx.fillText(fa(d.w),x+w/2,y-4);ctx.save();ctx.translate(x-6,y+h/2);ctx.rotate(-Math.PI/2);ctx.fillText(fa(d.h),0,0);ctx.restore();
    }
    if(flash>0){ctx.fillStyle='rgba(255,93,143,'+(flash*0.2)+')';ctx.fillRect(0,0,W,H);flash=Math.max(0,flash-dt*3);}
    if(!drag&&!locked){ctx.fillStyle='rgba(255,255,255,.85)';ctx.font='800 12px Vazirmatn';ctx.textAlign='center';
      ctx.fillText('انگشتت را روی زمین بکش ✋',W/2,oy+s*ROWS+18);}
    confetti=confetti.filter(c=>{c.vy+=.35;c.x+=c.vx;c.y+=c.vy;c.r+=c.vr;c.life-=.02;
      ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.r);ctx.globalAlpha=clamp(c.life,0,1);
      ctx.fillStyle=c.c;ctx.fillRect(-4,-3,8,5);ctx.restore();return c.life>0&&c.y<H+20;});
    ctx.globalAlpha=1;}
  function spawnConf(x,y){const cols=['#ffd23f','#ff5d8f','#3aa0ff','#22c993','#9b6cff','#ff9f45'];
    return{x,y,vx:(Math.random()-.5)*8,vy:-Math.random()*7-2,r:Math.random()*6,vr:(Math.random()-.5)*.4,
      c:cols[(Math.random()*cols.length)|0],life:1.4+Math.random()};}

  function endGame(won){state='end';const pct=score/(TOTAL*10);
    const stars=pct>=.8?3:pct>=.55?2:1;
    for(let i=0;i<70;i++)confetti.push(spawnConf(Math.random()*W,-Math.random()*30));
    $('ef').textContent=won?'🎉':'😅';$('et').textContent=won?'تمام شد، آفرین!':'باختی! دوباره تلاش کن';
    $('es').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);$('esc').textContent=fa(score);
    $('em').textContent=won?'مساحتِ مستطیل = طول × عرض را یاد گرفتی!':'مساحت = طول × عرض 💪';
    $('prog').style.width='100%';$('ovEnd').classList.remove('hidden');won?sWin():sLose();
    if(window.parent!==window){window.parent.postMessage(
      {type:'setareh_game',event:'complete',score:score,stars:stars,gameId:GAMEID},'*');}}
  let last=0;function loop(ts){if(!last)last=ts;let dt=(ts-last)/1000;last=ts;dt=Math.min(dt,.05);
    draw(dt);requestAnimationFrame(loop);}
  $('btnStart').onclick=()=>{ac();$('ovStart').classList.add('hidden');score=0;lives=3;loadRound(0);state='play';};
  $('btnAgain').onclick=()=>{$('ovEnd').classList.add('hidden');score=0;lives=3;confetti=[];loadRound(0);state='play';};
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
