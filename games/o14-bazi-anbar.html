<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2a1f16">
<title>انبارِ خانه — از گذشته تا آینده (بازی)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>
  /* صفحه نباید هیچ‌جا اسکرول یا زوم شود؛ بازی باید مثل یک برنامه رفتار کند. */
  html, body {
    margin: 0; padding: 0; background: #2a1f16;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body {
    position: fixed; inset: 0;          /* جلوی کشیده‌شدنِ صفحه در سافاریِ گوشی */
    width: 100%; height: 100vh; height: 100dvh;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none; -webkit-touch-callout: none;
  }

  /* گوشیِ عمودی صحنه را ریز می‌کند؛ بچه باید گوشی را بچرخاند. */
  #rotate { display: none; }
  @media (orientation: portrait) and (max-width: 860px) {
    #stage { display: none; }
    #rotate {
      display: flex; position: fixed; inset: 0;
      z-index: 9;
      flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      background: #2a1f16; color: #f6ead2;
      font: 700 20px "Vazirmatn", Tahoma, sans-serif; text-align: center; padding: 32px;
    }
    #rotate svg { animation: tilt 2.4s ease-in-out infinite; }
    @keyframes tilt { 0%, 45% { transform: rotate(0deg); } 65%, 100% { transform: rotate(-90deg); } }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="rotate">
  <svg width="86" height="126" viewBox="0 0 86 126" fill="none" aria-hidden="true">
    <rect x="3" y="3" width="80" height="120" rx="12" stroke="#e8b448" stroke-width="5"/>
    <rect x="15" y="19" width="56" height="88" rx="5" fill="#e8b448" opacity=".28"/>
    <circle cx="43" cy="115" r="4" fill="#e8b448"/>
  </svg>
  <div>گوشی را بچرخان</div>
  <div style="font-weight:400;opacity:.7;font-size:16px">این بازی خوابیده بازی می‌شود</div>
</div>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   هستهٔ مشترکِ بازی‌ها — سبک «کاغذبُری»
   ───────────────────────────────────────────────────────────────────────
   این فایل جعبه‌ابزار است، نه چارچوب: هر بازی حلقه و وضعیت خودش را دارد
   و فقط از این توابع برای کشیدن استفاده می‌کند. دلیلش این است که هر بازی
   باید حس‌وحال خودش را داشته باشد، نه اینکه همه شبیه هم دربیایند.

   قاعده‌های ثابتِ تصویری:
   • نور همیشه از بالا-چپ می‌تابد، پس سایه‌ها به پایین-راست می‌افتند.
   • هیچ لبه‌ای کاملاً صاف نیست؛ همه کمی موج دارند (انگار با قیچی بریده).
   • هیچ خاکستریِ خالصی نداریم؛ همه‌ی خنثی‌ها به گرمیِ صحنه می‌زنند.
   • یک لایه‌ی دانه‌دانه‌ی کاغذ روی کلِ تصویر ضرب می‌شود.
   ═══════════════════════════════════════════════════════════════════════ */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const FA_D = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
const fa = (n) => String(n).replace(/\d/g, (d) => FA_D[+d]);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeIn = (t) => t * t * t;
const easeInOut = (t) => (t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2);
const easeBack = (t) => 1 + 2.7 * Math.pow(t-1, 3) + 1.7 * Math.pow(t-1, 2);
const easeElastic = (t) => t === 0 || t === 1 ? t : Math.pow(2, -9*t) * Math.sin((t*10 - .75) * 2.094) + 1;

/** تصادفِ تکرارپذیر: با یک بذر همیشه همان عدد. برای اینکه تزئین‌ها هر فریم نپرند. */
function noise1(x) {
  const s = Math.sin(x * 127.1) * 43758.5453;
  return s - Math.floor(s);
}
const pick = (arr, seed) => arr[Math.floor(noise1(seed) * arr.length) % arr.length];

/* ───────── بوم و صحنهٔ ثابت ───────── */

let ctx, SW, SH, CV, _refit = null;
let view = { scale: 1, ox: 0, oy: 0, w: 0, h: 0, dpr: 1 };
let _grain = null, _grainDark = null;

function initStage(canvas, w, h) {
  CV = canvas; SW = w; SH = h;
  ctx = canvas.getContext('2d');

  /* اندازه را از خودِ بوم می‌گیریم نه از innerHeight؛ چون در سافاریِ گوشی
     نوارِ آدرس باز و بسته می‌شود و innerHeight دروغ می‌گوید. */
  const fit = () => {
    const r = canvas.getBoundingClientRect();
    const vw = Math.round(r.width), vh = Math.round(r.height);
    if (vw < 20 || vh < 20) return;
    const dpr = Math.min(devicePixelRatio || 1, QUALITY > 0 ? 2 : 1);
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    const scale = Math.min(vw / SW, vh / SH);
    view = { scale, ox: (vw - SW*scale)/2, oy: (vh - SH*scale)/2, w: vw, h: vh, dpr };
    _grain = buildGrain();
  };
  _refit = fit;
  addEventListener('resize', fit);
  /* چرخاندنِ گوشی: اندازهٔ درست چند لحظه بعد می‌رسد، پس چندبار اندازه می‌گیریم. */
  addEventListener('orientationchange', () => {
    fit(); setTimeout(fit, 140); setTimeout(fit, 460);
  });
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(canvas);

  /* صدا در گوشی فقط بعد از اوّلین لمس اجازهٔ پخش دارد. */
  const unlock = () => { sfx._c(); removeEventListener('pointerdown', unlock); removeEventListener('touchstart', unlock); };
  addEventListener('pointerdown', unlock, { passive: true });
  addEventListener('touchstart', unlock, { passive: true });
  /* نگه‌داشتنِ انگشت نباید منوی مرورگر را باز کند. */
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  fit();
  return ctx;
}

/** قابِ صحنه را باز می‌کند: بعد از این، مختصات همیشه در فضای SW×SH است. */
function beginScene(bg) {
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, view.w, view.h);
  ctx.save();
  ctx.translate(view.ox, view.oy);
  ctx.scale(view.scale, view.scale);
  ctx.beginPath();
  ctx.rect(0, 0, SW, SH);
  ctx.clip();
}

/* ───────── پوششِ پایانِ قاب ─────────
   دانه‌های کاغذ و تیرگیِ گوشه‌ها هر دو ثابت‌اند و تغییر نمی‌کنند، ولی
   قبلاً هر فریم از نو کشیده می‌شدند: یکی با «multiply» روی کلِّ صفحه و
   یکی با یک گرادیانِ شعاعیِ تازه. اندازه‌گیری نشان داد همین دو تا
   ۱۱ تا ۱۶ میلی‌ثانیه از هر فریم را می‌خوردند — بیشتر از کشیدنِ خودِ
   صحنه. حالا یک بار در یک بومِ جدا پخته می‌شوند و هر فریم فقط یک
   drawImage است.                                                       */

let _ovl = null, _ovlKey = '';

function overlayLayer(grainAlpha, vignette) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const w = Math.max(2, Math.round(SW * q)), h = Math.max(2, Math.round(SH * q));
  const key = w + 'x' + h + '|' + grainAlpha + '|' + vignette;
  if (_ovl && _ovlKey === key) return _ovl;
  let c;
  try {
    c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g2 = c.getContext('2d');
    if (!g2) return null;
    if (_grainDark && grainAlpha > 0) {
      /* همان دانه‌ها، ولی به‌جای multiply به شکلِ سیاهِ کم‌رنگ */
      g2.globalAlpha = clamp(grainAlpha * 1.15, 0, 1);
      g2.fillStyle = g2.createPattern(_grainDark, 'repeat');
      g2.fillRect(0, 0, w, h);
      g2.globalAlpha = 1;
    }
    if (vignette) {
      const g = g2.createRadialGradient(w / 2, h / 2, h * .42, w / 2, h / 2, h * 1.05);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, vignette);
      g2.fillStyle = g;
      g2.fillRect(0, 0, w, h);
    }
  } catch (e) { return null; }
  _ovl = c; _ovlKey = key;
  return c;
}

/** بافتِ کاغذ، تیرگیِ گوشه‌ها، رنگ‌بندی و درخششِ نور را می‌گذارد و قاب را می‌بندد. */
function endScene(grainAlpha = .15, vignette = 'rgba(48,28,14,.30)', bloom = .34, grade = .14) {
  /* درخششِ نور خاموش است. اندازه‌گیری نشان داد هر فریم ۲۱ میلی‌ثانیه
     می‌گیرد — بیشتر از تمامِ کارهای دیگرِ یک فریم روی هم — چون برای
     ساختنش باید کلِّ بوم دوباره خوانده شود. از آن بدتر: متنِ فارسی را
     مه‌آلود می‌کرد و خواندنش را سخت‌تر. بی‌آن، صحنه تمیزتر است. */
  bloom = 0;
  if (QUALITY < 1) { grade = 0; grainAlpha *= .5; }
  if (QUALITY < 2) grade = 0;
  if (grade > 0) {
    /* رنگ‌بندیِ نرم: بالای صحنه گرم‌تر، پایین سردتر — عمق می‌دهد */
    const g = ctx.createLinearGradient(0, 0, 0, SH);
    g.addColorStop(0, `rgba(255, 214, 150, ${grade})`);
    g.addColorStop(.55, 'rgba(255, 255, 255, 0)');
    g.addColorStop(1, `rgba(40, 60, 110, ${grade * .9})`);
    ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalCompositeOperation = 'source-over';
  }
  const ov = (grainAlpha > 0 || vignette) ? overlayLayer(grainAlpha, vignette) : null;
  if (ov) ctx.drawImage(ov, 0, 0, SW, SH);
  ctx.restore();
  bloomPass(bloom);
}

/* ───────── درخششِ نور (bloom) ─────────
   قابِ رسم‌شده را کوچک می‌کنیم، دو بار در خودش ضرب می‌کنیم تا فقط
   روشن‌ها بمانند، محوش می‌کنیم و با حالتِ «lighter» رویش می‌گذاریم.
   نتیجه: چراغ‌ها، شعله‌ها و رنگ‌های روشن نور پخش می‌کنند. */
let _bl, _blc, _bl2, _bl2c, _blNo = false, _blTick = 0;

function bloomPass(amount) {
  if (!amount || _blNo || !CV.width) return;
  /* کوچک‌کردن و بزرگ‌کردنِ دوباره، خودش محو می‌کند — از filter خیلی ارزان‌تر است */
  const W = Math.max(4, Math.round(CV.width * .2)), H = Math.max(4, Math.round(CV.height * .2));
  const W2 = Math.max(2, Math.round(W * .28)), H2 = Math.max(2, Math.round(H * .28));
  try {
    if (!_bl) {
      _bl = document.createElement('canvas'); _blc = _bl.getContext('2d');
      _bl2 = document.createElement('canvas'); _bl2c = _bl2.getContext('2d');
      if (!_blc || !_bl2c) { _blNo = true; return; }
    }
    if (_bl.width !== W || _bl.height !== H) { _bl.width = W; _bl.height = H; }
    if (_bl2.width !== W2 || _bl2.height !== H2) { _bl2.width = W2; _bl2.height = H2; }
    /* ساختنِ نور یک قاب در میان کافی است؛ گذاشتنش هر قاب. */
    _blTick = (_blTick + 1) & 1;
    if (!_blTick) {
      _blc.globalCompositeOperation = 'source-over';
      _blc.clearRect(0, 0, W, H);
      _blc.drawImage(CV, 0, 0, W, H);
      _blc.globalCompositeOperation = 'multiply';
      _blc.drawImage(_bl, 0, 0);
      _blc.drawImage(_bl, 0, 0);
      _blc.globalCompositeOperation = 'source-over';
      _bl2c.clearRect(0, 0, W2, H2);
      _bl2c.drawImage(_bl, 0, 0, W2, H2);
    }

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = amount;
    ctx.drawImage(_bl2, 0, 0, CV.width, CV.height);
    ctx.restore();
  } catch (e) { _blNo = true; }
}

/* ───────── لایهٔ ثابت ─────────
   هرچه در صحنه تکان نمی‌خورد را یک‌بار می‌کشیم و بعد فقط کپی می‌کنیم. */
const _layers = {};
function staticLayer(key, w, h, paint) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const L = _layers[key];
  if (L && L.q === q && L.w === w && L.h === h) return L.cv;
  const off = document.createElement('canvas');
  off.width = Math.max(1, Math.round(w * q));
  off.height = Math.max(1, Math.round(h * q));
  const c = off.getContext('2d');
  c.setTransform(q, 0, 0, q, 0, 0);
  const prev = ctx;
  ctx = c;
  try { paint(); } finally { ctx = prev; }
  _layers[key] = { cv: off, q, w, h };
  return off;
}

/* ───────── نورپردازی و بافت ─────────
   کارِ این‌ها این است که هیچ سطحی «تختِ یک‌رنگ» نماند. */

/** شیبِ عمودی: بالا روشن، پایین تیره. */
function vgrad(y0, y1, top, bot) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, top); g.addColorStop(1, bot);
  return g;
}

/** حجمِ کروی: نور از بالا-چپ، سایه در پایین-راست. */
function ball(cx, cy, r, lit, base, dark) {
  const g = ctx.createRadialGradient(cx - r * .38, cy - r * .42, r * .06, cx, cy, r * 1.06);
  g.addColorStop(0, lit); g.addColorStop(.45, base); g.addColorStop(1, dark);
  return g;
}

/** لبهٔ روشنِ بالا-چپِ یک مسیر — همان «rim light». */
function rim(pathFn, col, w = 2.2) {
  ctx.save();
  ctx.beginPath(); pathFn();
  ctx.clip();
  ctx.beginPath(); pathFn();
  ctx.strokeStyle = col; ctx.lineWidth = w * 2; ctx.lineJoin = 'round';
  ctx.translate(-w * .5, -w * .6);
  ctx.stroke();
  ctx.restore();
}

/** سایهٔ چسبیده به زمین — چیزها را روی سطح می‌نشاند. */
function contact(cx, cy, rx, ry, alpha = .26) {
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
  g.addColorStop(0, `rgba(20, 12, 6, ${alpha})`);
  g.addColorStop(1, 'rgba(20, 12, 6, 0)');
  ctx.save();
  ctx.fillStyle = g;
  ctx.translate(cx, cy); ctx.scale(1, ry / Math.max(rx, ry));
  ctx.beginPath(); ctx.arc(0, 0, Math.max(rx, ry), 0, TAU); ctx.fill();
  ctx.restore();
}

const _tex = {};
/** بافتِ تکرارشونده؛ یک‌بار ساخته و بعد از حافظه خوانده می‌شود. */
function texture(key, w, h, paint) {
  if (_tex[key]) return _tex[key];
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const c = off.getContext('2d');
  paint(c, w, h);
  _tex[key] = ctx.createPattern(off, 'repeat');
  return _tex[key];
}

/** رگهٔ چوب. */
function texWood(base, grain) {
  return texture('w' + base + grain, 120, 120, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = grain; c.lineWidth = 1.4;
    for (let i = 0; i < 9; i++) {
      c.globalAlpha = .18 + noise1(i * 3.1) * .3;
      c.beginPath();
      const y0 = i * 14 + noise1(i) * 6;
      c.moveTo(0, y0);
      for (let x = 0; x <= w; x += 10) c.lineTo(x, y0 + Math.sin(x * .09 + i) * 2.6);
      c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** تارِ پارچه. */
function texCloth(base, thread) {
  return texture('c' + base + thread, 16, 16, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = thread; c.lineWidth = 1; c.globalAlpha = .5;
    for (let i = 0; i < w; i += 4) {
      c.beginPath(); c.moveTo(i, 0); c.lineTo(i, h); c.stroke();
      c.beginPath(); c.moveTo(0, i); c.lineTo(w, i); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** دانه‌های سنگ. */
function texStone(base, spec) {
  return texture('s' + base + spec, 90, 90, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) {
      c.globalAlpha = .05 + noise1(i * 1.7) * .16;
      c.fillStyle = spec;
      const r = .6 + noise1(i * 5.3) * 1.9;
      c.beginPath();
      c.arc(noise1(i * 2.1) * w, noise1(i * 3.7 + 1) * h, r, 0, TAU);
      c.fill();
    }
    c.globalAlpha = 1;
  });
}

/** الیافِ کاغذ. */
function texPaper(base) {
  return texture('p' + base, 100, 100, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 130; i++) {
      c.globalAlpha = .04 + noise1(i * 2.3) * .07;
      c.strokeStyle = i % 2 ? '#ffffff' : '#5a4326';
      c.lineWidth = .9;
      const x = noise1(i * 1.3) * w, y = noise1(i * 4.1 + 2) * h;
      const a = noise1(i * 7.7) * TAU, l = 4 + noise1(i * 9.1) * 12;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

function buildGrain() {
  const s = 260;
  const off = document.createElement('canvas');
  off.width = off.height = s;
  const c = off.getContext('2d');
  const img = c.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    const v = 214 + Math.random() * 41;
    img.data[i*4] = v; img.data[i*4+1] = v; img.data[i*4+2] = v; img.data[i*4+3] = 255;
  }
  c.putImageData(img, 0, 0);
  /* همان دانه‌ها به شکلِ سیاهِ کم‌رنگ، تا بشود بدونِ multiply گذاشتشان */
  const d = document.createElement('canvas');
  d.width = d.height = s;
  const dc = d.getContext('2d');
  const dimg = dc.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    dimg.data[i*4] = 0; dimg.data[i*4+1] = 0; dimg.data[i*4+2] = 0;
    dimg.data[i*4+3] = 255 - img.data[i*4];
  }
  dc.putImageData(dimg, 0, 0);
  _grainDark = d;
  _ovl = null; _ovlKey = '';
  return ctx.createPattern(off, 'repeat');
}

function toStage(e) {
  const r = CV.getBoundingClientRect();
  return {
    x: (e.clientX - r.left - view.ox) / view.scale,
    y: (e.clientY - r.top - view.oy) / view.scale,
  };
}

const inRect = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
const inCircle = (p, b, pad = 0) => Math.hypot(p.x - b.x, p.y - b.y) <= b.r + pad;

/* ───────── قلم‌های کاغذبُری ───────── */

/** دایره‌ای که انگار با قیچی بریده شده. */
function wobbleCircle(cx, cy, r, seed = 0, amp = 2.2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const rr = r + Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp * .45;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** بیضیِ ناصاف — برای چیزهایی که گرد نیستند ولی نرم‌اند. */
function wobbleEllipse(cx, cy, rx, ry, rot = 0, seed = 0, amp = 2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const w = 1 + (Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp*.45) / Math.max(rx, ry);
    const px = Math.cos(a) * rx * w, py = Math.sin(a) * ry * w;
    const x = cx + px*Math.cos(rot) - py*Math.sin(rot);
    const y = cy + px*Math.sin(rot) + py*Math.cos(rot);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** مستطیلِ گِرد با گوشه‌های کمی کج. */
function wobbleRect(x, y, w, h, r = 12, seed = 0, amp = 1.6) {
  const j = (k) => (noise1(seed*9.7 + k) - .5) * amp * 2;
  ctx.beginPath();
  ctx.moveTo(x + r + j(1), y + j(2));
  ctx.lineTo(x + w - r + j(3), y + j(4));
  ctx.quadraticCurveTo(x + w + j(5), y + j(6), x + w + j(7), y + r + j(8));
  ctx.lineTo(x + w + j(9), y + h - r + j(10));
  ctx.quadraticCurveTo(x + w + j(11), y + h + j(12), x + w - r + j(13), y + h + j(14));
  ctx.lineTo(x + r + j(15), y + h + j(16));
  ctx.quadraticCurveTo(x + j(17), y + h + j(18), x + j(19), y + h - r + j(20));
  ctx.lineTo(x + j(21), y + r + j(22));
  ctx.quadraticCurveTo(x + j(23), y + j(24), x + r + j(1), y + j(2));
  ctx.closePath();
}

/** سایهٔ نرم؛ نور از بالا-چپ. */
function withShadow(blur, dy, alpha, fn, hue = '78, 46, 24') {
  ctx.save();
  ctx.shadowColor = `rgba(${hue}, ${alpha})`;
  ctx.shadowBlur = blur;
  ctx.shadowOffsetY = dy;
  ctx.shadowOffsetX = dy * .35;
  fn();
  ctx.restore();
}

/** یک برگه‌ی کاغذ با سایه — پایه‌ی همه‌ی کارت‌ها و تابلوها. */
function paper(x, y, w, h, fill, seed = 1, r = 12, shadow = .26) {
  withShadow(16, 7, shadow, () => {
    ctx.fillStyle = fill;
    wobbleRect(x, y, w, h, r, seed, 2);
    ctx.fill();
  });
  /* الیافِ کاغذ و لبهٔ روشن، تا سطح تخت نماند */
  ctx.save();
  ctx.beginPath(); wobbleRect(x, y, w, h, r, seed, 2); ctx.clip();
  ctx.globalAlpha = .5;
  ctx.fillStyle = texPaper(fill);
  ctx.fillRect(x, y, w, h);
  ctx.globalAlpha = 1;
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.4, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(90,60,20,.1)');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
}

function text(str, x, y, o = {}) {
  const size = o.size || 20;
  const fam = o.family || 'Vazirmatn';
  ctx.save();
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.font = `${fam === 'Lalezar' ? '400' : (o.weight || 700)} ${size}px "${fam}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.baseline || 'middle';
  ctx.fillStyle = o.color || '#43291b';
  ctx.direction = 'rtl';
  if (o.stroke) {
    ctx.lineWidth = o.strokeWidth || 5;
    ctx.strokeStyle = o.stroke;
    ctx.lineJoin = 'round';
    ctx.strokeText(str, x, y, o.maxWidth);
  }
  ctx.fillText(str, x, y, o.maxWidth);
  ctx.restore();
}

/** متنِ چندخطی که خودش می‌شکند. ارتفاعِ اشغال‌شده را برمی‌گرداند. */
function textWrap(str, x, y, maxW, o = {}) {
  const size = o.size || 19, lh = o.lineHeight || size * 1.7;
  ctx.font = `${o.weight || 700} ${size}px "${o.family || 'Vazirmatn'}", Tahoma, sans-serif`;
  const lines = [];
  for (const para of str.split('\n')) {
    let line = '';
    for (const wd of para.split(' ')) {
      const t = line ? line + ' ' + wd : wd;
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = wd; }
      else line = t;
    }
    lines.push(line);
  }
  lines.forEach((l, i) => text(l, x, y + i * lh, o));
  return lines.length * lh;
}

/* ───────── ذره‌ها ───────── */

class Bits {
  constructor() { this.list = []; }
  add(x, y, n, kind, colors, opts = {}) {
    for (let i = 0; i < n; i++) {
      const a = opts.dir !== undefined ? opts.dir + (Math.random()-.5) * (opts.spread || 1) : Math.random() * TAU;
      const sp = (opts.speed || 200) * (.4 + Math.random());
      this.list.push({
        kind, x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - (opts.lift || 0),
        r: (opts.size || 4) * (.5 + Math.random()),
        rot: Math.random() * TAU, vr: (Math.random()-.5) * 10,
        col: colors[(Math.random() * colors.length) | 0],
        grav: opts.grav === undefined ? 620 : opts.grav,
        drag: opts.drag || .995,
        life: (opts.life || .9) * (.6 + Math.random() * .8), age: 0,
      });
    }
  }
  confetti(x, y, n, colors) {
    this.add(x, y, n, 'flake', colors, { speed: 420, lift: 190, size: 5, life: 1.6, grav: 780 });
  }
  spark(x, y, n, colors) {
    this.add(x, y, n, 'dot', colors, { speed: 180, lift: 30, size: 3.4, life: .7, grav: 260, drag: .93 });
  }
  step(dt) {
    for (const p of this.list) {
      p.age += dt;
      p.vy += p.grav * dt;
      p.vx *= p.drag; p.vy *= p.drag;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    }
    this.list = this.list.filter((p) => p.age < p.life);
  }
  draw() {
    for (const p of this.list) {
      const k = clamp(1 - p.age / p.life, 0, 1);
      ctx.save();
      ctx.globalAlpha = k;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.col;
      if (p.kind === 'flake') ctx.fillRect(-p.r, -p.r*1.5, p.r*2, p.r*3);
      else if (p.kind === 'leaf') { wobbleEllipse(0, 0, p.r*1.8, p.r*.8, 0, p.r, .6); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(0, 0, p.r * k, 0, TAU); ctx.fill(); }
      ctx.restore();
    }
  }
  clear() { this.list.length = 0; }
}

/* ───────── صدا (بدون فایل صوتی) ───────── */

const sfx = {
  ac: null, on: true,
  _c() {
    if (!this.on) return null;
    if (!this.ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; this.ac = new A(); }
    if (this.ac.state === 'suspended') this.ac.resume();
    return this.ac;
  },
  tone(f, dur = .16, type = 'sine', gain = .13, delay = 0) {
    const c = this._c(); if (!c) return;
    const t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(t0 + dur + .04);
  },
  tap()  { this.tone(430, .07, 'triangle', .09); },
  place(){ this.tone(620, .11, 'sine', .12); },
  pop()  { this.tone(760, .09, 'sine', .11); },
  slide(){ this.tone(240, .22, 'sine', .07); },
  good() { [523, 659, 784].forEach((f,i) => this.tone(f, .22, 'sine', .13, i*.07)); },
  win()  { [523, 659, 784, 1047].forEach((f,i) => this.tone(f, .34, 'triangle', .13, i*.10)); },
  nope() { this.tone(180, .2, 'sawtooth', .07); },
  tick() { this.tone(1100, .04, 'square', .05); },
};

/* ───────── قطعه‌های آماده ───────── */

function star(x, y, r, col, rot = 0) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = col;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI/2 + i * Math.PI/5;
    const rr = i % 2 ? r * .45 : r;
    const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/** دکمهٔ کاغذی. hovered را خودِ بازی می‌دهد؛ اینجا فقط کشیده می‌شود. */
/** رنگ را روشن‌تر (k>0) یا تیره‌تر (k<0) می‌کند. */
function shade(col, k) {
  const c = String(col).trim();
  let r, g2, b2;
  if (c[0] === '#') {
    const h = c.length === 4 ? c[1]+c[1]+c[2]+c[2]+c[3]+c[3] : c.slice(1, 7);
    r = parseInt(h.slice(0,2), 16); g2 = parseInt(h.slice(2,4), 16); b2 = parseInt(h.slice(4,6), 16);
  } else {
    const m = c.match(/[\d.]+/g);
    if (!m || m.length < 3) return col;
    r = +m[0]; g2 = +m[1]; b2 = +m[2];
  }
  const f = (v) => Math.round(clamp(k < 0 ? v * (1 + k) : v + (255 - v) * k, 0, 255));
  return 'rgb(' + f(r) + ',' + f(g2) + ',' + f(b2) + ')';
}

function button(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 3 : 0;
  const fill = o.disabled ? (o.off || '#bcaa92') : (hot ? (o.hotFill || o.fill) : o.fill);
  const r = o.r === undefined ? 14 : o.r;
  /* لبهٔ زیرینِ تیره — دکمه از صفحه بیرون می‌زند */
  ctx.fillStyle = shade(fill, -.36);
  wobbleRect(b.x, b.y + dy + 7, b.w, b.h, r, b.x + b.y, 2);
  ctx.fill();
  withShadow(hot ? 22 : 14, hot ? 5 : 8, .32, () => {
    ctx.fillStyle = fill;
    wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2);
    ctx.fill();
  });
  /* حجم: روشن از بالا، تیره به پایین */
  ctx.save();
  ctx.beginPath(); wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2); ctx.clip();
  const g = ctx.createLinearGradient(0, b.y + dy, 0, b.y + dy + b.h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.45, 'rgba(255,255,255,.04)');
  g.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = g;
  ctx.fillRect(b.x, b.y + dy, b.w, b.h);
  /* برقِ باریکِ لبهٔ بالا */
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.fillRect(b.x + r, b.y + dy + 2, b.w - r * 2, 2);
  ctx.restore();
  text(label, b.x + b.w/2, b.y + b.h/2 + dy - (o.sub ? 9 : 0), {
    size: o.size || 26, color: o.color || '#fdf6e8', family: o.family || 'Lalezar',
  });
  if (o.sub) text(o.sub, b.x + b.w/2, b.y + b.h/2 + dy + 17,
    { size: 14, color: o.subColor || 'rgba(255,255,255,.88)' });
}

/** دکمهٔ گرد کوچک (مثل + و −). */
function roundButton(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 2 : 0;
  withShadow(10, hot ? 3 : 5, .3, () => {
    ctx.fillStyle = o.disabled ? '#cbbba3' : (hot ? (o.hotFill || o.fill) : o.fill);
    wobbleCircle(b.x, b.y + dy, b.r, b.x, 1.4);
    ctx.fill();
  });
  text(label, b.x, b.y + dy - 1,
    { size: o.size || 32, color: o.disabled ? '#a8988a' : (o.color || '#fdf6e8'), family: 'Lalezar' });
}

/** پرده‌ی تمام‌صفحه: برای شروعِ پرده و برای جشنِ پایان. */
function overlay(o) {
  const k = easeOut(clamp(o.t / .5, 0, 1));
  ctx.fillStyle = `rgba(30, 22, 16, ${.66 * k})`;
  ctx.fillRect(0, 0, SW, SH);

  const w = o.w || 700, h = o.h || 290;
  const x = (SW - w) / 2, y = o.y || (SH * .22);
  const s = lerp(.9, 1, easeBack(clamp(o.t / .65, 0, 1)));
  ctx.save();
  ctx.translate(SW/2, y + h/2);
  ctx.scale(s, s);
  ctx.translate(-SW/2, -(y + h/2));

  withShadow(30, 14, .42, () => {
    ctx.fillStyle = o.paper || '#fbf3e2';
    wobbleRect(x, y, w, h, 18, 121, 2.4);
    ctx.fill();
  });
  ctx.fillStyle = o.band || '#c8434f';
  wobbleRect(x, y, w, 12, 6, 123, 1);
  ctx.fill();

  if (o.icon) o.icon(SW/2, y + 56);
  text(o.title, SW/2, y + (o.icon ? 108 : 62),
    { size: o.titleSize || 36, color: o.ink || '#43291b', family: 'Lalezar', alpha: k });
  textWrap(o.body, SW/2, y + (o.icon ? 158 : 116), w - 90,
    { size: 19, color: o.inkSoft || '#8a6a52', alpha: k });
  ctx.restore();

  button(o.btn, o.btnLabel, { hot: o.btnHot, fill: o.btnFill || '#7fa356', hotFill: o.btnHotFill || '#8fb45f', size: 28 });
}

/** پیامِ کوتاهِ بالای صحنه. */
class Toast {
  constructor() { this.msg = null; this.t = 0; this.kind = 'info'; }
  say(msg, kind = 'info') { this.msg = msg; this.kind = kind; this.t = 2.6; }
  step(dt) { if (this.t > 0) { this.t -= dt; if (this.t <= 0) this.msg = null; } }
  draw(y = 24, colors = {}) {
    if (!this.msg) return;
    const k = clamp(this.t, 0, 1) * clamp((2.6 - this.t) * 5, 0, 1);
    ctx.save();
    ctx.globalAlpha = k;
    ctx.font = `700 19px "Vazirmatn", Tahoma, sans-serif`;
    const w = ctx.measureText(this.msg).width + 76;
    const fill = this.kind === 'good' ? (colors.good || '#7fa356')
               : this.kind === 'bad' ? (colors.bad || '#c8434f')
               : (colors.info || '#fbf3e2');
    paper(SW/2 - w/2, y, w, 48, fill, 151, 12, .3);
    text(this.msg, SW/2, y + 25,
      { size: 19, color: this.kind === 'info' ? (colors.ink || '#43291b') : '#fff8ec' });
    ctx.restore();
  }
}

/* ───────── آموزشِ پرده‌ای ─────────
   پرده‌هایی که منتظرِ کارِ بچه نیستند با یک ضربه جلو می‌روند. تایمر فقط
   پشتیبان است؛ بچهٔ کلاس سومی باید فرصتِ خواندن داشته باشد، نه اینکه
   متن قبل از تمام شدنِ خواندنش برود.                                    */

/** اگر پردهٔ فعلی خواندنی است، ضربه را می‌خورد و می‌رود پردهٔ بعد. */
function tutTap(tut, tapSteps, lastStep) {
  if (!tut.on || tapSteps.indexOf(tut.step) < 0) return false;
  if (tut.step >= lastStep) tut.on = false;
  else { tut.step++; tut.t = 0; }
  sfx.tap();
  return true;
}

/** نشانهٔ «برای ادامه بزن» — زیرِ کارتِ آموزش. */
function tutMore(cx, y, t, ink = '#3a2a18', bg = 'rgba(255, 250, 238, .94)') {
  ctx.save();
  ctx.globalAlpha = .62 + .38 * Math.sin(t * 3.2);
  ctx.font = '700 15px "Vazirmatn", Tahoma, sans-serif';
  const label = 'برای ادامه، هرجا را بزن';
  const w = ctx.measureText(label).width + 40, h = 32, x = cx - w / 2, r = 16;
  withShadow(10, 4, .3, () => {
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath(); ctx.fill();
  });
  text(label, cx, y + h / 2, { size: 15, color: ink });
  ctx.restore();
}

/** فونت‌ها را می‌آورد و بعد بازی را شروع می‌کند.
    مهم: هر دو راه (رسیدنِ فونت و مهلتِ پشتیبان) ممکن است برسند، ولی
    شروع فقط باید یک بار انجام شود؛ وگرنه دو حلقهٔ فریم راه می‌افتد و
    بازی دوبرابر سریع می‌شود. */
function whenFontsReady(start) {
  let done = false;
  const go = () => { if (done) return; done = true; start(); };
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('400 40px Lalezar'),
      document.fonts.load('700 20px Vazirmatn'),
      document.fonts.load('900 20px Vazirmatn'),
    ]).then(go, go);
    setTimeout(go, 2600);
  } else go();
}

/** حلقهٔ فریم با dtِ محدودشده. */
/* ───────── کیفیتِ خودکار ─────────
   اگر دستگاه کُند بود، اوّل درخشش و بعد رنگ‌بندی خاموش می‌شود تا بازی
   روان بماند. روی دستگاهِ قوی همه‌چیز روشن است. */
let QUALITY = 2;
let _fAcc = 0, _fN = 0, _qHold = 0;

function _qualityTick(gap) {
  if (gap <= 0 || gap > 200) return;
  _fAcc += gap; _fN++;
  if (_fN < 45) return;
  const avg = _fAcc / _fN;
  _fAcc = 0; _fN = 0;
  if (_qHold > 0) { _qHold--; return; }
  /* فاصلهٔ بالا و پایین باید باز باشد، وگرنه کیفیت بین دو پله بالا و
     پایین می‌پرد و بازی مدام تغییرِ ظاهر می‌دهد. */
  const before = QUALITY;
  if (avg > 21 && QUALITY > 0) { QUALITY--; _qHold = 4; }
  else if (avg < 13.5 && QUALITY < 2) { QUALITY++; _qHold = 10; }
  /* در پایین‌ترین کیفیت، صحنه را با نقطه‌های کمتر می‌کشیم */
  if (before !== QUALITY && (before === 0 || QUALITY === 0) && _refit) _refit();
}

/* یک حلقه، نه بیشتر — دو حلقه یعنی زمانِ بازی دوبرابر می‌گذرد.

   MOTION: تا پیش از این، به‌خاطرِ باگِ دو حلقه، همهٔ بازی‌ها عملاً با
   سرعتِ دو برابر اجرا می‌شدند و زمان‌بندی‌ها هم با همان حس تنظیم شده
   بودند. حالا که باگ رفع شده، سرعتِ درست (یک برابر) کُند به نظر
   می‌رسد. این ضریب جانِ حرکت‌ها را برمی‌گرداند، ولی نه تا آن دو برابرِ
   تصادفی. فقط روی جانِ حرکت اثر دارد، نه روی هیچ قانونِ علمی. */
const MOTION = 1.45;
let _looping = false;
function runLoop(step) {
  if (_looping) return;
  _looping = true;
  let last = performance.now();
  const frame = (now) => {
    const gap = now - last;
    /* بریدنِ بعد از ضرب، تا یک فریمِ کُند پرشِ بزرگ نسازد */
    const dt = Math.min(gap / 1000 * MOTION, 1/15);
    last = now;
    _qualityTick(gap);
    step(dt);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

/* ═════════════════ بازی ═════════════════ */
/* ═══════════════════════════════════════════════════════════════════════
   انبارِ خانه — علومِ سوم، درس ۱۴ «از گذشته تا آینده»

   کتاب سه راهِ قدیمیِ نگه‌داریِ خوراکی را نشان می‌دهد:
     نمک زدن (نمک‌سود)، خشک کردن در آفتاب، و خنک نگه داشتن
     (سرداب و یخدان).

   ── قانونِ بازی ─────────────────────────────────────────────────
   خوراکی وقتی فاسد می‌شود که هم آب داشته باشد و هم گرم باشد.
   پس آهنگِ فاسد شدن اینجا حاصلِ‌ضربِ دو چیز است:

       سرعتِ خرابی  =  پایه × گرمای جا × آبِ خوراکی

   نمک و آفتاب «آبِ خوراکی» را کم می‌کنند، سرداب و یخدان «گرمای جا»
   را. هیچ‌کدام بهتر از دیگری نیستند؛ هر خوراکی راهِ خودش را دارد:
   شیر و انار نه خشک می‌شوند نه نمک‌سود، پس فقط جای خنک به کارشان
   می‌آید. و آفتابِ تابستان تند است و آفتابِ پاییز کم‌جان — پس هر
   کاری فصلِ خودش را دارد.

   بازی هیچ‌کدامِ این‌ها را نمی‌نویسد؛ نوارِ سلامتِ هر خوراکی جلوی
   چشم پایین می‌رود و بچّه خودش می‌بیند کدام راه برای کدام خوراکی
   جواب داده است.
   ═══════════════════════════════════════════════════════════════════════ */

const SCENE_W = 1200, SCENE_H = 760;
const HUD_H = 56;

const P = {
  sky: '#9fc8dc', skyLo: '#6fa4c0', skyWin: '#c8d8e4', skyHot: '#bfe0ec',
  sun: '#ffe9a8', cloud: '#f2f6f8', snow: '#f4f8fb',
  wall: '#c9a878', wallLo: '#a8865a', wallDk: '#7a5f3d',
  wood: '#8a6238', woodLo: '#5f4225', woodLt: '#ab7f4c',
  brick: '#b07a52', brickDk: '#8a5c3a',
  earth: '#6a4d31', earthLo: '#4a3520',
  cellar: '#3f3226', cellarLo: '#2a2118',
  ice: '#cfe6f0', iceLt: '#eaf6fb', iceDk: '#8fb8c8',
  salt: '#f0ece0', saltDk: '#c8c0ac',
  straw: '#c9a45c',
  paper: '#fbf7ec', card: '#ffffff',
  ink: '#33281c', inkSoft: '#8a7a62',
  good: '#5e9f5e', bad: '#c0503a', gold: '#e0a63f', accent: '#4c9ec4',
  meat: '#c2634f', meatDk: '#8a3f2f', fish: '#8fa8b8', fishDk: '#5f7d90',
  milk: '#f6f2e6', milkDk: '#cfc7b0',
  leaf: '#5aa03f', leafDk: '#38702a', grape: '#7a4a9c', grapeDk: '#4f2f6a',
  tomato: '#d34f3a', apple: '#c83a4a', anar: '#c0392f', anarDk: '#8a2418',
  rot: '#6a6a4a', rotDk: '#454531',
};

/* ───────── فصل‌ها و هوا ───────── */

const SEASONS = [
  { n: 'بهار',    warm: 1.0,  sun: .85 },
  { n: 'تابستان', warm: 1.35, sun: 1.35 },
  { n: 'پاییز',   warm: .85,  sun: .40 },
  { n: 'زمستان',  warm: .50,  sun: .15 },
];
const SEASON_T = 22;                 /* هر فصل چند ثانیه */
const YEAR_T = SEASON_T * 4;
const BASE = .036;                   /* آهنگِ پایهٔ خرابی */
const DRY_NEED = 6;                  /* آفتاب‌ثانیهٔ لازم برای خشک شدن */
const NEED_GOOD = 10;                /* برای بردن چند خوراکی سالم بماند */

/* ───────── جاهای نگه‌داری ───────── */

const STORES = {
  dry:    { n: 'خشک‌کنِ آفتاب', cap: 4, x: 262, y: 70,  w: 438, h: 222, cols: 4 },
  ice:    { n: 'یخدان',        cap: 3, x: 712, y: 70,  w: 472, h: 222, cols: 3 },
  shelf:  { n: 'طاقچه',        cap: 8, x: 262, y: 304, w: 428, h: 216, cols: 4 },
  salt:   { n: 'نمک‌سود',      cap: 4, x: 702, y: 304, w: 482, h: 216, cols: 2 },
  cellar: { n: 'سرداب',        cap: 8, x: 262, y: 532, w: 922, h: 214, cols: 8 },
};
const ORDER = ['dry', 'ice', 'shelf', 'salt', 'cellar'];
/* گرمای هر جا نسبت به بیرون */
const WARMTH = { dry: 1, shelf: 1, salt: 1, cellar: .34, ice: .10, basket: 1 };

const BASKET = { x: 16, y: 70, w: 234, h: 676 };

/* ───────── خوراکی‌ها ───────── */

const KINDS = {
  shir:  { n: 'شیر',      dry: false, salt: false },
  sabzi: { n: 'سبزی',     dry: true,  salt: false },
  mahi:  { n: 'ماهی',     dry: true,  salt: true },
  angur: { n: 'انگور',    dry: true,  salt: false },
  gojeh: { n: 'گوجه',     dry: true,  salt: false },
  anar:  { n: 'انار',     dry: false, salt: false },
  sib:   { n: 'سیب',      dry: true,  salt: false },
  gusht: { n: 'گوشت',     dry: true,  salt: true },
};
const DRIED_N = { sabzi: 'سبزیِ خشک', angur: 'کشمش', gojeh: 'گوجهٔ خشک',
  sib: 'برگهٔ سیب', mahi: 'ماهیِ خشک', gusht: 'قدید' };

/* هر فصل سه خوراکی می‌رسد */
const ARRIVE = [
  ['shir', 'sabzi', 'mahi'],
  ['angur', 'gojeh', 'shir'],
  ['anar', 'sib', 'gusht'],
  ['gusht', 'sabzi', 'anar'],
];

const S = {
  phase: 'intro', phaseT: 0,
  day: 0, season: 0, next: 0,
  items: [], sel: null,
  score: 0, best: 0,
  won: false, winT: 0, lost: 0,
  t: 0, hover: null, tip: '', tipT: 0, shake: 0,
  tut: { on: false, step: 0, t: 0 },
};

const bits = new Bits();
const toast = new Toast();
const cv = document.getElementById('stage');
initStage(cv, SCENE_W, SCENE_H);

function tip(msg) { S.tip = msg; S.tipT = 4; }
const SE = () => SEASONS[clamp(S.season, 0, 3)];
const inStore = (k) => S.items.filter((i) => i.at === k);
const alive = (i) => i.f > 0 && !i.ruined;
const goodCount = () => S.items.filter(alive).length;

/** آبِ خوراکی: نمک و خشکی آن را کم می‌کند. */
function water(i) {
  if (i.dried) return .22;
  if (i.salted) return .30;
  /* زیرِ آفتاب، آبش کم‌کم می‌رود؛ پس همان‌جا هم کندتر خراب می‌شود */
  if (i.at === 'dry' && KINDS[i.kind].dry) return 1 - .78 * clamp(i.dry / DRY_NEED, 0, 1);
  return 1;
}
/** آهنگِ خرابی در هر ثانیه. */
function rate(i) {
  return BASE * WARMTH[i.at === 'basket' ? 'basket' : i.at] * SE().warm * water(i);
}

function addItem(kind) {
  S.items.push({
    id: S.items.length, kind, at: 'basket',
    f: 1, dry: 0, dried: false, salted: false, ruined: false, born: S.day,
    ph: Math.random() * TAU,
  });
}

function resetGame() {
  S.day = 0; S.season = 0; S.next = 0;
  S.items.length = 0; S.sel = null;
  S.won = false; S.winT = 0; S.lost = 0;
  for (const k of ARRIVE[0]) addItem(k);
}

function startGame(keep) {
  S.phase = 'play'; S.phaseT = 0;
  if (!keep) S.score = 0;
  S.tut.on = !keep; S.tut.step = 0; S.tut.t = 0;
  resetGame();
}

/* ───────── چیدن ───────── */

function slotOf(store, n) {
  const st = STORES[store];
  const cols = st.cols, rows = Math.ceil(st.cap / cols);
  const cw = st.w / cols, ch = (st.h - 26) / rows;
  const r = Math.floor(n / cols), c = n % cols;
  return { x: st.x + cw * (cols - 1 - c) + cw / 2, y: st.y + 26 + ch * r + ch / 2 };
}
function basketSlot(n) {
  const c = n % 2, r = Math.floor(n / 2);
  return { x: BASKET.x + 60 + (1 - c) * 114, y: BASKET.y + 118 + r * 132 };
}
function posOf(i) {
  if (i.at === 'basket') return basketSlot(inStore('basket').indexOf(i));
  return slotOf(i.at, inStore(i.at).indexOf(i));
}

function place(item, store) {
  if (item.at === store) { S.sel = null; return; }
  if (store !== 'basket' && inStore(store).length >= STORES[store].cap) {
    tip('اینجا دیگر جا ندارد.');
    S.shake = .12; sfx.nope();
    return;
  }
  item.at = store;
  if (store === 'salt' && !item.salted) {
    item.salted = true;
    if (!KINDS[item.kind].salt) {
      item.ruined = true;
      sfx.nope();
      toast.say('نمک این یکی را خراب کرد', 'bad');
    } else {
      sfx.good();
      toast.say('نمک‌سود شد', 'good');
    }
  } else sfx.tap();
  S.sel = null;
}

/* ───────── ورودی ───────── */

const BTN_GO = { x: SCENE_W / 2 - 150, y: 500, w: 300, h: 68 };
const BTN_AGAIN = { x: SCENE_W / 2 - 150, y: 506, w: 300, h: 68 };
const TUT_TAP = [0, 1, 2], TUT_LAST = 2;

function itemAt(p) {
  for (const i of S.items) {
    const q = posOf(i);
    if (Math.hypot(q.x - p.x, q.y - p.y) < 40) return i;
  }
  return null;
}
function storeAt(p) {
  for (const k of ORDER) {
    const st = STORES[k];
    if (inRect(p, st)) return k;
  }
  if (inRect(p, BASKET)) return 'basket';
  return null;
}

cv.addEventListener('pointermove', (e) => {
  const p = toStage(e);
  S.hover = null;
  if (S.phase === 'intro') { if (inRect(p, BTN_GO)) S.hover = BTN_GO; }
  else if (S.phase === 'won') { if (inRect(p, BTN_AGAIN)) S.hover = BTN_AGAIN; }
  else {
    const i = itemAt(p);
    if (i) S.hover = { k: 'item', id: i.id };
    else { const st = storeAt(p); if (st) S.hover = { k: 'store', s: st }; }
  }
  cv.style.cursor = S.hover ? 'pointer' : 'default';
});

cv.addEventListener('pointerdown', (e) => {
  const p = toStage(e);
  if (S.phase === 'intro') { if (inRect(p, BTN_GO)) { startGame(); sfx.good(); } return; }
  if (S.phase === 'won') {
    if (inRect(p, BTN_AGAIN)) { S.phase = 'intro'; S.phaseT = 0; S.score = 0; resetGame(); sfx.tap(); }
    return;
  }
  if (S.tut.on && tutTap(S.tut, TUT_TAP, TUT_LAST)) return;
  if (S.winT) return;
  const it = itemAt(p);
  if (it) {
    if (!alive(it)) { tip('این یکی دیگر به درد نمی‌خورد.'); return; }
    S.sel = S.sel === it.id ? null : it.id;
    sfx.tick();
    return;
  }
  const st = storeAt(p);
  if (st && S.sel !== null) {
    const item = S.items.find((x) => x.id === S.sel);
    if (item) place(item, st);
    return;
  }
  if (st) tip('اوّل یک خوراکی را بزن، بعد جایش را.');
});

/* ───────── حلقه ───────── */

function step(dt) {
  S.t += dt;
  if (S.phaseT < 9) S.phaseT += dt;
  if (S.tipT > 0) S.tipT -= dt;
  if (S.shake > 0) S.shake = Math.max(0, S.shake - dt);
  if (S.tut.on) S.tut.t += dt;

  if (S.phase === 'play' && !S.winT && !S.tut.on) {
    S.day += dt;
    const se = Math.min(3, Math.floor(S.day / SEASON_T));
    if (se !== S.season) {
      S.season = se;
      toast.say(SE().n + ' رسید', 'info');
    }
    /* رسیدنِ خوراکی‌های تازه */
    while (S.next < 4 && S.day >= S.next * SEASON_T) {
      if (S.next > 0) for (const k of ARRIVE[S.next]) addItem(k);
      S.next++;
    }
    for (const i of S.items) {
      if (!alive(i)) continue;
      /* خشک شدن زیرِ آفتاب */
      if (i.at === 'dry' && !i.dried && !i.salted) {
        if (KINDS[i.kind].dry) {
          i.dry += SE().sun * dt;
          if (i.dry >= DRY_NEED) {
            i.dried = true;
            sfx.good();
            const q = posOf(i);
            bits.confetti(q.x, q.y, 12, [P.gold, P.card, P.straw]);
            toast.say(DRIED_N[i.kind] + ' شد', 'good');
          }
        } else i.dry = 0;
      }
      const before = i.f;
      i.f = Math.max(0, i.f - rate(i) * dt);
      if (before > 0 && i.f <= 0) {
        S.lost++;
        sfx.nope();
        toast.say(KINDS[i.kind].n + ' فاسد شد', 'bad');
      }
    }
    if (S.day >= YEAR_T) {
      S.winT = .001;
      const g = goodCount();
      S.score = g * 100;
      if (S.score > S.best) S.best = S.score;
      S.won = g >= NEED_GOOD;
      if (S.won) sfx.win(); else sfx.nope();
    }
  }
  if (S.winT) {
    S.winT += dt;
    if (S.winT > 1.6) { S.winT = 0; S.phase = 'won'; S.phaseT = 0; }
  }
  bits.step(dt);
  toast.step(dt);
  draw();
}

whenFontsReady(() => { resetGame(); runLoop(step); });

/* ───────── ابزارِ نقاشی ───────── */

function rrPath(x, y, w, h, r) {
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function numText(str, x, y, o = {}) {
  ctx.save();
  ctx.direction = 'ltr';
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = o.color || P.ink;
  ctx.font = `${o.weight || 700} ${o.size || 18}px "${o.family || 'Vazirmatn'}", Tahoma, sans-serif`;
  ctx.fillText(str, x, y);
  ctx.restore();
}

function spot(shapes, alpha) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, SCENE_W, SCENE_H);
  for (const s of shapes) { ctx.moveTo(s.x + s.r, s.y); ctx.arc(s.x, s.y, s.r, 0, TAU, true); }
  ctx.fillStyle = `rgba(28, 20, 12, ${alpha})`;
  ctx.fill('evenodd');
  ctx.restore();
}

function tutCard(x, y, w, lines, title) {
  const h = 26 + (title ? 44 : 0) + lines.length * 30;
  withShadow(24, 10, .5, () => {
    ctx.fillStyle = 'rgba(255, 253, 244, .97)';
    wobbleRect(x, y, w, h + 20, 16, 101, 2.2); ctx.fill();
  }, '40, 28, 14');
  ctx.fillStyle = P.gold;
  wobbleRect(x, y, w, 9, 4, 103, 1); ctx.fill();
  let yy = y + 34;
  if (title) { text(title, x + w / 2, yy + 6, { size: 25, family: 'Lalezar', color: P.ink }); yy += 44; }
  for (const l of lines) { text(l, x + w / 2, yy, { size: 18, color: P.inkSoft }); yy += 30; }
  return h + 20;
}

/* ───────── خوراکی‌ها ───────── */

function foodArt(i, x, y, s) {
  const k = i.kind, d = i.dried, rot = i.f <= 0, ru = i.ruined;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  if (rot) ctx.globalAlpha = .9;
  const A = rot ? P.rot : null, B = rot ? P.rotDk : null;
  const c1 = (a) => (rot ? A : a), c2 = (b) => (rot ? B : b);
  if (k === 'shir') {
    ctx.fillStyle = c1(P.milk);
    ctx.beginPath();
    ctx.moveTo(-16, 18); ctx.lineTo(-13, -8);
    ctx.quadraticCurveTo(-13, -16, -6, -18);
    ctx.lineTo(6, -18);
    ctx.quadraticCurveTo(13, -16, 13, -8);
    ctx.lineTo(16, 18);
    ctx.quadraticCurveTo(0, 24, -16, 18);
    ctx.fill();
    ctx.fillStyle = c2(P.milkDk);
    ctx.beginPath(); ctx.ellipse(0, -18, 8, 4, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.beginPath(); ctx.ellipse(-7, 4, 3.4, 10, .1, 0, TAU); ctx.fill();
  } else if (k === 'sabzi') {
    ctx.strokeStyle = c2(d ? '#7f6a34' : P.leafDk); ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (let j = -2; j <= 2; j++) {
      ctx.beginPath(); ctx.moveTo(j * 3, 20);
      ctx.quadraticCurveTo(j * 7, 0, j * 11 - 1, d ? -8 : -18); ctx.stroke();
    }
    ctx.fillStyle = c1(d ? '#a08d48' : P.leaf);
    for (let j = -2; j <= 2; j++) {
      ctx.save();
      ctx.translate(j * 11 - 1, d ? -8 : -18); ctx.rotate(j * .3);
      ctx.beginPath(); ctx.ellipse(0, 0, d ? 6 : 9, d ? 3.4 : 6, 0, 0, TAU); ctx.fill();
      ctx.restore();
    }
    ctx.strokeStyle = c2('#9a7a3a'); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-9, 14); ctx.lineTo(9, 14); ctx.stroke();
  } else if (k === 'mahi') {
    ctx.fillStyle = c1(d ? '#a08258' : P.fish);
    ctx.beginPath();
    ctx.moveTo(18, 0);
    ctx.quadraticCurveTo(4, -13, -14, -8);
    ctx.quadraticCurveTo(-20, 0, -14, 8);
    ctx.quadraticCurveTo(4, 13, 18, 0);
    ctx.fill();
    ctx.fillStyle = c2(d ? '#7a6040' : P.fishDk);
    ctx.beginPath();
    ctx.moveTo(-14, 0); ctx.lineTo(-26, -9); ctx.lineTo(-26, 9); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fdfaf2';
    ctx.beginPath(); ctx.arc(11, -3, 3.2, 0, TAU); ctx.fill();
    ctx.fillStyle = '#1b2530';
    ctx.beginPath(); ctx.arc(11.6, -3, 1.7, 0, TAU); ctx.fill();
  } else if (k === 'angur') {
    const col = d ? '#6a4a2c' : P.grape, colD = d ? '#452e18' : P.grapeDk;
    ctx.strokeStyle = c2('#7f6a34'); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(2, -12); ctx.stroke();
    const R = d ? 4.4 : 6;
    for (const q of [[0, -6], [-8, 0], [8, 0], [-4, 8], [5, 8], [0, 16], [-11, -8], [11, -8]]) {
      ctx.fillStyle = ball(q[0], q[1], R, 'rgba(255,255,255,.6)', c1(col), c2(colD));
      ctx.beginPath(); ctx.arc(q[0] * (d ? .8 : 1), q[1] * (d ? .8 : 1), R, 0, TAU); ctx.fill();
    }
  } else if (k === 'gojeh') {
    if (d) {
      ctx.fillStyle = c1('#a8442e');
      for (const q of [[-8, -4], [6, -6], [-2, 8]]) {
        ctx.save(); ctx.translate(q[0], q[1]); ctx.rotate(q[0] * .1);
        ctx.beginPath(); ctx.ellipse(0, 0, 11, 5, 0, 0, TAU); ctx.fill();
        ctx.restore();
      }
    } else {
      ctx.fillStyle = ball(0, -6, 19, '#f08a70', c1(P.tomato), c2('#8f2c20'));
      ctx.beginPath(); ctx.arc(0, 2, 18, 0, TAU); ctx.fill();
      ctx.fillStyle = c2(P.leafDk);
      for (let j = 0; j < 5; j++) {
        ctx.save(); ctx.translate(0, -14); ctx.rotate(j * 1.26);
        ctx.beginPath(); ctx.ellipse(0, -4, 3.4, 7, 0, 0, TAU); ctx.fill();
        ctx.restore();
      }
    }
  } else if (k === 'anar') {
    ctx.fillStyle = ball(0, -6, 20, '#e8705f', c1(P.anar), c2(P.anarDk));
    ctx.beginPath(); ctx.arc(0, 2, 19, 0, TAU); ctx.fill();
    ctx.fillStyle = c2(P.anarDk);
    ctx.beginPath();
    ctx.moveTo(-6, -16); ctx.lineTo(-3, -24); ctx.lineTo(0, -18);
    ctx.lineTo(3, -24); ctx.lineTo(6, -16);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.28)';
    ctx.beginPath(); ctx.ellipse(-7, -4, 6, 4, -.5, 0, TAU); ctx.fill();
  } else if (k === 'sib') {
    if (d) {
      ctx.fillStyle = c1('#d8b47e');
      for (const q of [[-8, -2], [7, -6], [-1, 9]]) {
        ctx.beginPath(); ctx.arc(q[0], q[1], 8, 0, TAU); ctx.fill();
        ctx.fillStyle = c2('#b08d55');
        ctx.beginPath(); ctx.arc(q[0], q[1], 3, 0, TAU); ctx.fill();
        ctx.fillStyle = c1('#d8b47e');
      }
    } else {
      ctx.fillStyle = ball(0, -6, 19, '#ef7a86', c1(P.apple), c2('#8a2430'));
      ctx.beginPath();
      ctx.moveTo(0, -10);
      ctx.bezierCurveTo(-22, -18, -20, 16, 0, 18);
      ctx.bezierCurveTo(20, 16, 22, -18, 0, -10);
      ctx.fill();
      ctx.strokeStyle = c2('#6a4a24'); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, -12); ctx.quadraticCurveTo(3, -20, 8, -22); ctx.stroke();
      ctx.fillStyle = c1(P.leaf);
      ctx.beginPath(); ctx.ellipse(-7, -18, 7, 4, -.5, 0, TAU); ctx.fill();
    }
  } else if (k === 'gusht') {
    ctx.fillStyle = c1(d ? '#8a4a34' : P.meat);
    ctx.beginPath();
    ctx.moveTo(-16, -8);
    ctx.quadraticCurveTo(0, -20, 16, -8);
    ctx.quadraticCurveTo(22, 4, 10, 14);
    ctx.quadraticCurveTo(-6, 20, -16, 8);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = c2(d ? '#5f2f1e' : P.meatDk);
    for (let j = -1; j <= 1; j++) {
      ctx.beginPath();
      ctx.ellipse(j * 8, -2 + j * 3, 3.4, 8, .3, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.ellipse(-4, -8, 8, 3.4, -.3, 0, TAU); ctx.fill();
  }
  /* دانه‌های نمک */
  if (i.salted && !rot) {
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    for (let j = 0; j < 9; j++) {
      const a = j * 2.1 + i.ph;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * 15, Math.sin(a) * 12, 1.8, 0, TAU); ctx.fill();
    }
  }
  /* مگس‌های فاسد */
  if (rot) {
    ctx.fillStyle = '#2a2a20';
    for (let j = 0; j < 3; j++) {
      const a = S.t * 3 + j * 2.1 + i.ph;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * 22, -18 + Math.sin(a * 1.7) * 8, 2.4, 0, TAU); ctx.fill();
    }
  }
  ctx.restore();
  /* نشانِ خراب‌شده با نمک */
  if (ru && !rot) {
    ctx.save();
    ctx.strokeStyle = P.bad; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x - 16, y - 16); ctx.lineTo(x + 16, y + 16);
    ctx.moveTo(x + 16, y - 16); ctx.lineTo(x - 16, y + 16);
    ctx.stroke();
    ctx.restore();
  }
}

function drawItem(i) {
  const q = posOf(i);
  const selected = S.sel === i.id;
  const hot = S.hover && S.hover.k === 'item' && S.hover.id === i.id;
  const dy = selected ? -6 + Math.sin(S.t * 6) * 3 : (hot ? -3 : 0);
  ctx.save();
  if (i.at === 'dry' && !i.dried && KINDS[i.kind].dry) {
    /* آویزان از بند */
    ctx.strokeStyle = '#8a7448'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(q.x, STORES.dry.y + 54); ctx.lineTo(q.x, q.y - 20); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(20, 12, 4, .22)';
  ctx.beginPath(); ctx.ellipse(q.x, q.y + 26, 22, 6, 0, 0, TAU); ctx.fill();
  foodArt(i, q.x, q.y + dy, 1);
  /* نوارِ سلامت */
  const bw = 44, by = q.y + 34;
  ctx.fillStyle = 'rgba(16, 10, 4, .62)';
  ctx.beginPath(); rrPath(q.x - bw / 2 - 2, by - 2, bw + 4, 11, 5); ctx.fill();
  const f = clamp(i.f, 0, 1);
  ctx.fillStyle = i.ruined ? P.inkSoft : f > .55 ? P.good : f > .25 ? P.gold : P.bad;
  ctx.beginPath(); rrPath(q.x - bw / 2, by, bw * f, 7, 3.5); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); rrPath(q.x - bw / 2, by, bw, 7, 3.5); ctx.stroke();
  /* پیشرفتِ خشک شدن */
  if (i.at === 'dry' && !i.dried && KINDS[i.kind].dry) {
    ctx.strokeStyle = P.gold; ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(q.x, q.y + dy, 30, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(i.dry / DRY_NEED, 0, 1));
    ctx.stroke();
  }
  if (selected) {
    ctx.strokeStyle = P.gold; ctx.lineWidth = 3.4;
    ctx.beginPath(); ctx.arc(q.x, q.y + dy, 34 + Math.sin(S.t * 6) * 2, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}

function bayPath(st, pad) {
  const q = pad || 0;
  ctx.beginPath();
  rrPath(st.x - q, st.y - q, st.w + q * 2, st.h + q * 2, 14);
}

function drawWallBack() {

/** خشک‌کنِ آفتاب: بیرونِ خانه، زیرِ آسمان. */
function drawDryBay() {
  const st = STORES.dry, se = SE();
  ctx.save();
  bayPath(st); ctx.clip();
  const g = ctx.createLinearGradient(0, st.y, 0, st.y + st.h);
  g.addColorStop(0, se.warm > 1.1 ? P.skyHot : (se.warm < .7 ? P.skyWin : P.skyLo));
  g.addColorStop(1, P.sky);
  ctx.fillStyle = g;
  ctx.fillRect(st.x, st.y, st.w, st.h);
  /* آفتاب */
  const sx2 = st.x + st.w - 62, sy2 = st.y + 58;
  ctx.save();
  ctx.globalAlpha = clamp(se.sun, .18, 1);
  const hg = ctx.createRadialGradient(sx2, sy2, 12, sx2, sy2, 76);
  hg.addColorStop(0, 'rgba(255, 233, 168, .85)');
  hg.addColorStop(1, 'rgba(255, 233, 168, 0)');
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.arc(sx2, sy2, 76, 0, TAU); ctx.fill();
  ctx.fillStyle = P.sun;
  ctx.beginPath(); ctx.arc(sx2, sy2, 24, 0, TAU); ctx.fill();
  ctx.strokeStyle = P.sun; ctx.lineWidth = 4; ctx.lineCap = 'round';
  for (let j = 0; j < 8; j++) {
    const a2 = j * TAU / 8 + S.t * .14;
    ctx.beginPath();
    ctx.moveTo(sx2 + Math.cos(a2) * 32, sy2 + Math.sin(a2) * 32);
    ctx.lineTo(sx2 + Math.cos(a2) * 42, sy2 + Math.sin(a2) * 42);
    ctx.stroke();
  }
  ctx.restore();
  if (se.sun < .6) {
    ctx.save();
    ctx.globalAlpha = clamp(1 - se.sun, 0, 1) * .95;
    ctx.fillStyle = P.cloud;
    for (const c of [[sx2 - 40, sy2 + 4, 44], [sx2 + 8, sy2 - 10, 32], [sx2 - 84, sy2 + 12, 30]]) {
      ctx.beginPath();
      ctx.ellipse(c[0] + Math.sin(S.t * .3 + c[0]) * 6, c[1], c[2], c[2] * .6, 0, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }
  if (se.warm < .7) {
    ctx.fillStyle = P.snow;
    for (let j = 0; j < 40; j++) {
      const x = st.x + (noise1(j * 2.7) * st.w + S.t * 12) % st.w;
      const y = st.y + ((noise1(j * 5.1) * st.h + S.t * 30) % st.h);
      ctx.globalAlpha = .8;
      ctx.beginPath(); ctx.arc(x, y, 1.4 + noise1(j * 7) * 1.6, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  /* لبهٔ بام */
  ctx.fillStyle = P.woodLo;
  ctx.fillRect(st.x, st.y + st.h - 22, st.w, 22);
  ctx.fillStyle = P.wood;
  ctx.fillRect(st.x, st.y + st.h - 26, st.w, 8);
  /* بندِ رخت */
  ctx.strokeStyle = P.wood; ctx.lineWidth = 7; ctx.lineCap = 'round';
  for (const x of [st.x + 26, st.x + st.w - 26]) {
    ctx.beginPath(); ctx.moveTo(x, st.y + st.h - 26); ctx.lineTo(x, st.y + 44); ctx.stroke();
  }
  ctx.strokeStyle = '#8a7448'; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(st.x + 26, st.y + 50);
  ctx.quadraticCurveTo(st.x + st.w / 2, st.y + 62, st.x + st.w - 26, st.y + 50);
  ctx.stroke();
  ctx.restore();
  ctx.strokeStyle = P.wallDk; ctx.lineWidth = 4;
  bayPath(st); ctx.stroke();
}

/** یخدان: گنبدِ سرد. */
function drawIceBay() {
  const st = STORES.ice;
  ctx.save();
  bayPath(st); ctx.clip();
  const g = ctx.createLinearGradient(0, st.y, 0, st.y + st.h);
  g.addColorStop(0, P.iceLt); g.addColorStop(1, P.iceDk);
  ctx.fillStyle = g;
  ctx.fillRect(st.x, st.y, st.w, st.h);
  /* طاقِ گنبد */
  ctx.strokeStyle = 'rgba(120, 150, 165, .45)'; ctx.lineWidth = 3;
  for (let j = 0; j < 6; j++) {
    ctx.beginPath();
    ctx.arc(st.x + st.w / 2, st.y + st.h + 40, 60 + j * 46, Math.PI, TAU);
    ctx.stroke();
  }
  /* قالب‌های یخ */
  ctx.fillStyle = 'rgba(255,255,255,.6)';
  for (let j = 0; j < 14; j++) {
    const x = st.x + 14 + noise1(j * 3.1) * (st.w - 28);
    const y = st.y + 26 + noise1(j * 7.3) * (st.h - 40);
    ctx.save(); ctx.translate(x, y); ctx.rotate(noise1(j) * 2);

    ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1.4;
    ctx.strokeRect(-11, -7, 22, 14);

  ctx.fillStyle = 'rgba(255,255,255,.22)';

      54, 12, 0, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
  ctx.strokeStyle = '#6f8fa0'; ctx.lineWidth = 4;
  bayPath(st); ctx.stroke();
}

/** طاقچه: تختهٔ چوبی روی دیوار. */
function drawShelfBay() {

/** نمک‌سود: خمرهٔ نمک. */
function drawSaltBay() {
  const st = STORES.salt;
  ctx.save();
  bayPath(st); ctx.clip();
  ctx.fillStyle = 'rgba(70, 46, 20, .22)';
  ctx.fillRect(st.x, st.y, st.w, st.h);
  /* بدنهٔ خمره */
  const jx = st.x + 24, jw = st.w - 48, jy = st.y + 32, jh = st.h - 44;
  ctx.fillStyle = P.brick;
  ctx.beginPath();
  ctx.moveTo(jx + 10, jy);
  ctx.quadraticCurveTo(jx - 24, jy + jh * .5, jx + 26, jy + jh);
  ctx.lineTo(jx + jw - 26, jy + jh);
  ctx.quadraticCurveTo(jx + jw + 24, jy + jh * .5, jx + jw - 10, jy);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = P.brickDk;
  ctx.beginPath(); ctx.ellipse(jx + jw / 2, jy, jw / 2 - 8, 16, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = P.salt;
  ctx.beginPath(); ctx.ellipse(jx + jw / 2, jy + 3, jw / 2 - 16, 11, 0, 0, TAU); ctx.fill();
  /* نمکِ درونِ خمره */
  ctx.fillStyle = 'rgba(240, 236, 224, .5)';
  ctx.beginPath();
  ctx.ellipse(jx + jw / 2, jy + jh - 22, jw / 2 - 22, 34, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = P.saltDk;
  for (let j = 0; j < 40; j++) {
    const x = jx + 24 + noise1(j * 2.3) * (jw - 48);
    const y = jy + jh - 52 + noise1(j * 5.9) * 54;
    ctx.beginPath(); ctx.arc(x, y, 1.6 + noise1(j) * 1.6, 0, TAU); ctx.fill();
  }
  ctx.strokeStyle = P.woodLo; ctx.lineWidth = 6;
  for (const yy of [jy + jh * .38, jy + jh * .78]) {
    ctx.beginPath(); ctx.moveTo(jx - 16, yy); ctx.lineTo(jx + jw + 16, yy); ctx.stroke();
  }
  ctx.restore();
  ctx.strokeStyle = P.wallDk; ctx.lineWidth = 4;
  bayPath(st); ctx.stroke();
}

function drawLabels() {
  for (const k of ORDER) {

function jarIcon(x, y) {

  ctx.moveTo(-16, -14);

  ctx.quadraticCurveTo(26, 4, 16, -14);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = P.brickDk;
  ctx.beginPath(); ctx.ellipse(0, -14, 17, 6, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = P.salt;
  ctx.beginPath(); ctx.ellipse(0, -13, 13, 4, 0, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawIntro() {
  overlay({
    t: S.phaseT, w: 920, h: 340, y: 126,
    paper: P.paper, band: P.gold, ink: P.ink, inkSoft: P.inkSoft,
    icon: jarIcon,
    title: 'انبارِ خانه',
    body: 'یخچال نداریم. یک سال وقت داری و پنج راهِ قدیمی:\nخشک‌کنِ آفتاب، نمک‌سود، طاقچه، سرداب و یخدان.\nآخرِ سال باید دستِ‌کم ده خوراکی سالم مانده باشد.',
    btn: BTN_GO, btnLabel: 'شروع', btnHot: S.hover === BTN_GO,
    btnFill: '#a5763a', btnHotFill: '#c08d47',
  });
}

function drawWon() {
  const g = goodCount();
  overlay({
    t: S.phaseT, w: 940, h: 350, y: 122,
    paper: P.paper, band: S.won ? P.good : P.bad, ink: P.ink, inkSoft: P.inkSoft,
    icon: jarIcon,
    title: S.won ? 'زمستان را رد کردی' : 'سال تمام شد',
    body: (S.won
      ? 'از دوازده خوراکی، ' + fa(g) + ' تا سالم ماند.\n'
      : 'از دوازده خوراکی فقط ' + fa(g) + ' تا سالم ماند.\n') +
      'نمک و آفتاب آبِ خوراکی را می‌گیرند و سرداب و یخدان\nگرما را — و خوراکی بی آب یا بی گرما دیر فاسد می‌شود.',
    btn: BTN_AGAIN, btnLabel: 'از نو', btnHot: S.hover === BTN_AGAIN,
    btnFill: '#a5763a', btnHotFill: '#c08d47',
  });
}

/* ───────── قاب ───────── */

function draw() {
  beginScene('#2a1f16');
  ctx.save();
  if (S.shake > 0) {
    const k = S.shake * 10;
    ctx.translate(Math.sin(S.t * 55) * k, 0);
  }
  drawWallBack();
  drawDryBay();
  drawIceBay();
  drawShelfBay();
  drawSaltBay();
  drawCellarBay();
  drawBasket();
  drawLabels();
  for (const i of S.items) drawItem(i);
  bits.draw();
  ctx.restore();
  drawHUD();
  if (!(S.phase === 'play' && S.tut.on)) toast.draw(HUD_H + 10, { good: P.good, bad: P.bad, info: P.card, ink: P.ink });
  if (S.phase === 'play' && S.tut.on) drawTutorial();
  if (S.phase === 'intro') drawIntro();
  if (S.phase === 'won') drawWon();
  if (S.tipT > 0) {
    ctx.save();
    ctx.globalAlpha = clamp(S.tipT, 0, 1);
    const w = 560;
    paper(SCENE_W / 2 - w / 2, SCENE_H - 46, w, 38, P.card, 91, 12, .3);
    text(S.tip, SCENE_W / 2, SCENE_H - 27, { size: 17, color: P.ink });
    ctx.restore();
  }
  endScene(.12, 'rgba(30, 18, 6, .38)', .2, .12);
}

</script>
