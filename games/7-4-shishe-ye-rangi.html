<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b1410">
<title>کارگاهِ شیشهٔ رنگی — نمودار دایره‌ای</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>
  /* صفحه نباید هیچ‌جا اسکرول یا زوم شود؛ بازی باید مثل یک برنامه رفتار کند. */
  html, body {
    margin: 0; padding: 0; background: #1b1410;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body {
    position: fixed; inset: 0;          /* جلوی کشیده‌شدنِ صفحه در سافاریِ گوشی */
    width: 100%; height: 100vh; height: 100dvh;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none; -webkit-touch-callout: none;
  }

  /* گوشیِ عمودی صحنه را ریز می‌کند؛ بچه باید گوشی را بچرخاند. */
  #rotate { display: none; }
  @media (orientation: portrait) and (max-width: 860px) {
    #stage { display: none; }
    #rotate {
      display: flex; position: fixed; inset: 0;
      z-index: 9;
      flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      background: #1b1410; color: #f6ead2;
      font: 700 20px "Vazirmatn", Tahoma, sans-serif; text-align: center; padding: 32px;
    }
    #rotate svg { animation: tilt 2.4s ease-in-out infinite; }
    @keyframes tilt { 0%, 45% { transform: rotate(0deg); } 65%, 100% { transform: rotate(-90deg); } }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="rotate">
  <svg width="86" height="126" viewBox="0 0 86 126" fill="none" aria-hidden="true">
    <rect x="3" y="3" width="80" height="120" rx="12" stroke="#e8b448" stroke-width="5"/>
    <rect x="15" y="19" width="56" height="88" rx="5" fill="#e8b448" opacity=".28"/>
    <circle cx="43" cy="115" r="4" fill="#e8b448"/>
  </svg>
  <div>گوشی را بچرخان</div>
  <div style="font-weight:400;opacity:.7;font-size:16px">این بازی خوابیده بازی می‌شود</div>
</div>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   هستهٔ مشترکِ بازی‌ها — سبک «کاغذبُری»
   ───────────────────────────────────────────────────────────────────────
   این فایل جعبه‌ابزار است، نه چارچوب: هر بازی حلقه و وضعیت خودش را دارد
   و فقط از این توابع برای کشیدن استفاده می‌کند. دلیلش این است که هر بازی
   باید حس‌وحال خودش را داشته باشد، نه اینکه همه شبیه هم دربیایند.

   قاعده‌های ثابتِ تصویری:
   • نور همیشه از بالا-چپ می‌تابد، پس سایه‌ها به پایین-راست می‌افتند.
   • هیچ لبه‌ای کاملاً صاف نیست؛ همه کمی موج دارند (انگار با قیچی بریده).
   • هیچ خاکستریِ خالصی نداریم؛ همه‌ی خنثی‌ها به گرمیِ صحنه می‌زنند.
   • یک لایه‌ی دانه‌دانه‌ی کاغذ روی کلِ تصویر ضرب می‌شود.
   ═══════════════════════════════════════════════════════════════════════ */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const FA_D = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
const fa = (n) => String(n).replace(/\d/g, (d) => FA_D[+d]);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeIn = (t) => t * t * t;
const easeInOut = (t) => (t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2);
const easeBack = (t) => 1 + 2.7 * Math.pow(t-1, 3) + 1.7 * Math.pow(t-1, 2);
const easeElastic = (t) => t === 0 || t === 1 ? t : Math.pow(2, -9*t) * Math.sin((t*10 - .75) * 2.094) + 1;

/** تصادفِ تکرارپذیر: با یک بذر همیشه همان عدد. برای اینکه تزئین‌ها هر فریم نپرند. */
function noise1(x) {
  const s = Math.sin(x * 127.1) * 43758.5453;
  return s - Math.floor(s);
}
const pick = (arr, seed) => arr[Math.floor(noise1(seed) * arr.length) % arr.length];

/* ───────── بوم و صحنهٔ ثابت ───────── */

let ctx, SW, SH, CV, _refit = null;
let view = { scale: 1, ox: 0, oy: 0, w: 0, h: 0, dpr: 1 };
let _grain = null;

function initStage(canvas, w, h) {
  CV = canvas; SW = w; SH = h;
  ctx = canvas.getContext('2d');

  /* اندازه را از خودِ بوم می‌گیریم نه از innerHeight؛ چون در سافاریِ گوشی
     نوارِ آدرس باز و بسته می‌شود و innerHeight دروغ می‌گوید. */
  const fit = () => {
    const r = canvas.getBoundingClientRect();
    const vw = Math.round(r.width), vh = Math.round(r.height);
    if (vw < 20 || vh < 20) return;
    const dpr = Math.min(devicePixelRatio || 1, QUALITY > 0 ? 2 : 1);
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    const scale = Math.min(vw / SW, vh / SH);
    view = { scale, ox: (vw - SW*scale)/2, oy: (vh - SH*scale)/2, w: vw, h: vh, dpr };
    _grain = buildGrain();
  };
  _refit = fit;
  addEventListener('resize', fit);
  /* چرخاندنِ گوشی: اندازهٔ درست چند لحظه بعد می‌رسد، پس چندبار اندازه می‌گیریم. */
  addEventListener('orientationchange', () => {
    fit(); setTimeout(fit, 140); setTimeout(fit, 460);
  });
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(canvas);

  /* صدا در گوشی فقط بعد از اوّلین لمس اجازهٔ پخش دارد. */
  const unlock = () => { sfx._c(); removeEventListener('pointerdown', unlock); removeEventListener('touchstart', unlock); };
  addEventListener('pointerdown', unlock, { passive: true });
  addEventListener('touchstart', unlock, { passive: true });
  /* نگه‌داشتنِ انگشت نباید منوی مرورگر را باز کند. */
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  fit();
  return ctx;
}

/** قابِ صحنه را باز می‌کند: بعد از این، مختصات همیشه در فضای SW×SH است. */
function beginScene(bg) {
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, view.w, view.h);
  ctx.save();
  ctx.translate(view.ox, view.oy);
  ctx.scale(view.scale, view.scale);
  ctx.beginPath();
  ctx.rect(0, 0, SW, SH);
  ctx.clip();
}

/** بافتِ کاغذ، تیرگیِ گوشه‌ها، رنگ‌بندی و درخششِ نور را می‌گذارد و قاب را می‌بندد. */
function endScene(grainAlpha = .15, vignette = 'rgba(48,28,14,.30)', bloom = .34, grade = .14) {
  if (QUALITY < 1) { grade = 0; grainAlpha *= .5; }
  if (QUALITY < 2) bloom = 0;
  if (grade > 0) {
    /* رنگ‌بندیِ نرم: بالای صحنه گرم‌تر، پایین سردتر — عمق می‌دهد */
    const g = ctx.createLinearGradient(0, 0, 0, SH);
    g.addColorStop(0, `rgba(255, 214, 150, ${grade})`);
    g.addColorStop(.55, 'rgba(255, 255, 255, 0)');
    g.addColorStop(1, `rgba(40, 60, 110, ${grade * .9})`);
    ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalCompositeOperation = 'source-over';
  }
  if (_grain && grainAlpha > 0) {
    ctx.globalCompositeOperation = 'multiply';
    ctx.globalAlpha = grainAlpha;
    ctx.fillStyle = _grain;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
  if (vignette) {
    const g = ctx.createRadialGradient(SW/2, SH/2, SH*.42, SW/2, SH/2, SH*1.05);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, vignette);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
  }
  ctx.restore();
  bloomPass(bloom);
}

/* ───────── درخششِ نور (bloom) ─────────
   قابِ رسم‌شده را کوچک می‌کنیم، دو بار در خودش ضرب می‌کنیم تا فقط
   روشن‌ها بمانند، محوش می‌کنیم و با حالتِ «lighter» رویش می‌گذاریم.
   نتیجه: چراغ‌ها، شعله‌ها و رنگ‌های روشن نور پخش می‌کنند. */
let _bl, _blc, _bl2, _bl2c, _blNo = false, _blTick = 0;

function bloomPass(amount) {
  if (!amount || _blNo || !CV.width) return;
  /* کوچک‌کردن و بزرگ‌کردنِ دوباره، خودش محو می‌کند — از filter خیلی ارزان‌تر است */
  const W = Math.max(4, Math.round(CV.width * .2)), H = Math.max(4, Math.round(CV.height * .2));
  const W2 = Math.max(2, Math.round(W * .28)), H2 = Math.max(2, Math.round(H * .28));
  try {
    if (!_bl) {
      _bl = document.createElement('canvas'); _blc = _bl.getContext('2d');
      _bl2 = document.createElement('canvas'); _bl2c = _bl2.getContext('2d');
      if (!_blc || !_bl2c) { _blNo = true; return; }
    }
    if (_bl.width !== W || _bl.height !== H) { _bl.width = W; _bl.height = H; }
    if (_bl2.width !== W2 || _bl2.height !== H2) { _bl2.width = W2; _bl2.height = H2; }
    /* ساختنِ نور یک قاب در میان کافی است؛ گذاشتنش هر قاب. */
    _blTick = (_blTick + 1) & 1;
    if (!_blTick) {
      _blc.globalCompositeOperation = 'source-over';
      _blc.clearRect(0, 0, W, H);
      _blc.drawImage(CV, 0, 0, W, H);
      _blc.globalCompositeOperation = 'multiply';
      _blc.drawImage(_bl, 0, 0);
      _blc.drawImage(_bl, 0, 0);
      _blc.globalCompositeOperation = 'source-over';
      _bl2c.clearRect(0, 0, W2, H2);
      _bl2c.drawImage(_bl, 0, 0, W2, H2);
    }

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = amount;
    ctx.drawImage(_bl2, 0, 0, CV.width, CV.height);
    ctx.restore();
  } catch (e) { _blNo = true; }
}

/* ───────── لایهٔ ثابت ─────────
   هرچه در صحنه تکان نمی‌خورد را یک‌بار می‌کشیم و بعد فقط کپی می‌کنیم. */
const _layers = {};
function staticLayer(key, w, h, paint) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const L = _layers[key];
  if (L && L.q === q && L.w === w && L.h === h) return L.cv;
  const off = document.createElement('canvas');
  off.width = Math.max(1, Math.round(w * q));
  off.height = Math.max(1, Math.round(h * q));
  const c = off.getContext('2d');
  c.setTransform(q, 0, 0, q, 0, 0);
  const prev = ctx;
  ctx = c;
  try { paint(); } finally { ctx = prev; }
  _layers[key] = { cv: off, q, w, h };
  return off;
}

/* ───────── نورپردازی و بافت ─────────
   کارِ این‌ها این است که هیچ سطحی «تختِ یک‌رنگ» نماند. */

/** شیبِ عمودی: بالا روشن، پایین تیره. */
function vgrad(y0, y1, top, bot) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, top); g.addColorStop(1, bot);
  return g;
}

/** حجمِ کروی: نور از بالا-چپ، سایه در پایین-راست. */
function ball(cx, cy, r, lit, base, dark) {
  const g = ctx.createRadialGradient(cx - r * .38, cy - r * .42, r * .06, cx, cy, r * 1.06);
  g.addColorStop(0, lit); g.addColorStop(.45, base); g.addColorStop(1, dark);
  return g;
}

/** لبهٔ روشنِ بالا-چپِ یک مسیر — همان «rim light». */
function rim(pathFn, col, w = 2.2) {
  ctx.save();
  ctx.beginPath(); pathFn();
  ctx.clip();
  ctx.beginPath(); pathFn();
  ctx.strokeStyle = col; ctx.lineWidth = w * 2; ctx.lineJoin = 'round';
  ctx.translate(-w * .5, -w * .6);
  ctx.stroke();
  ctx.restore();
}

/** سایهٔ چسبیده به زمین — چیزها را روی سطح می‌نشاند. */
function contact(cx, cy, rx, ry, alpha = .26) {
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
  g.addColorStop(0, `rgba(20, 12, 6, ${alpha})`);
  g.addColorStop(1, 'rgba(20, 12, 6, 0)');
  ctx.save();
  ctx.fillStyle = g;
  ctx.translate(cx, cy); ctx.scale(1, ry / Math.max(rx, ry));
  ctx.beginPath(); ctx.arc(0, 0, Math.max(rx, ry), 0, TAU); ctx.fill();
  ctx.restore();
}

const _tex = {};
/** بافتِ تکرارشونده؛ یک‌بار ساخته و بعد از حافظه خوانده می‌شود. */
function texture(key, w, h, paint) {
  if (_tex[key]) return _tex[key];
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const c = off.getContext('2d');
  paint(c, w, h);
  _tex[key] = ctx.createPattern(off, 'repeat');
  return _tex[key];
}

/** رگهٔ چوب. */
function texWood(base, grain) {
  return texture('w' + base + grain, 120, 120, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = grain; c.lineWidth = 1.4;
    for (let i = 0; i < 9; i++) {
      c.globalAlpha = .18 + noise1(i * 3.1) * .3;
      c.beginPath();
      const y0 = i * 14 + noise1(i) * 6;
      c.moveTo(0, y0);
      for (let x = 0; x <= w; x += 10) c.lineTo(x, y0 + Math.sin(x * .09 + i) * 2.6);
      c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** تارِ پارچه. */
function texCloth(base, thread) {
  return texture('c' + base + thread, 16, 16, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = thread; c.lineWidth = 1; c.globalAlpha = .5;
    for (let i = 0; i < w; i += 4) {
      c.beginPath(); c.moveTo(i, 0); c.lineTo(i, h); c.stroke();
      c.beginPath(); c.moveTo(0, i); c.lineTo(w, i); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** دانه‌های سنگ. */
function texStone(base, spec) {
  return texture('s' + base + spec, 90, 90, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) {
      c.globalAlpha = .05 + noise1(i * 1.7) * .16;
      c.fillStyle = spec;
      const r = .6 + noise1(i * 5.3) * 1.9;
      c.beginPath();
      c.arc(noise1(i * 2.1) * w, noise1(i * 3.7 + 1) * h, r, 0, TAU);
      c.fill();
    }
    c.globalAlpha = 1;
  });
}

/** الیافِ کاغذ. */
function texPaper(base) {
  return texture('p' + base, 100, 100, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 130; i++) {
      c.globalAlpha = .04 + noise1(i * 2.3) * .07;
      c.strokeStyle = i % 2 ? '#ffffff' : '#5a4326';
      c.lineWidth = .9;
      const x = noise1(i * 1.3) * w, y = noise1(i * 4.1 + 2) * h;
      const a = noise1(i * 7.7) * TAU, l = 4 + noise1(i * 9.1) * 12;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

function buildGrain() {
  const s = 260;
  const off = document.createElement('canvas');
  off.width = off.height = s;
  const c = off.getContext('2d');
  const img = c.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    const v = 214 + Math.random() * 41;
    img.data[i*4] = v; img.data[i*4+1] = v; img.data[i*4+2] = v; img.data[i*4+3] = 255;
  }
  c.putImageData(img, 0, 0);
  return ctx.createPattern(off, 'repeat');
}

function toStage(e) {
  const r = CV.getBoundingClientRect();
  return {
    x: (e.clientX - r.left - view.ox) / view.scale,
    y: (e.clientY - r.top - view.oy) / view.scale,
  };
}

const inRect = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
const inCircle = (p, b, pad = 0) => Math.hypot(p.x - b.x, p.y - b.y) <= b.r + pad;

/* ───────── قلم‌های کاغذبُری ───────── */

/** دایره‌ای که انگار با قیچی بریده شده. */
function wobbleCircle(cx, cy, r, seed = 0, amp = 2.2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const rr = r + Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp * .45;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** بیضیِ ناصاف — برای چیزهایی که گرد نیستند ولی نرم‌اند. */
function wobbleEllipse(cx, cy, rx, ry, rot = 0, seed = 0, amp = 2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const w = 1 + (Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp*.45) / Math.max(rx, ry);
    const px = Math.cos(a) * rx * w, py = Math.sin(a) * ry * w;
    const x = cx + px*Math.cos(rot) - py*Math.sin(rot);
    const y = cy + px*Math.sin(rot) + py*Math.cos(rot);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** مستطیلِ گِرد با گوشه‌های کمی کج. */
function wobbleRect(x, y, w, h, r = 12, seed = 0, amp = 1.6) {
  const j = (k) => (noise1(seed*9.7 + k) - .5) * amp * 2;
  ctx.beginPath();
  ctx.moveTo(x + r + j(1), y + j(2));
  ctx.lineTo(x + w - r + j(3), y + j(4));
  ctx.quadraticCurveTo(x + w + j(5), y + j(6), x + w + j(7), y + r + j(8));
  ctx.lineTo(x + w + j(9), y + h - r + j(10));
  ctx.quadraticCurveTo(x + w + j(11), y + h + j(12), x + w - r + j(13), y + h + j(14));
  ctx.lineTo(x + r + j(15), y + h + j(16));
  ctx.quadraticCurveTo(x + j(17), y + h + j(18), x + j(19), y + h - r + j(20));
  ctx.lineTo(x + j(21), y + r + j(22));
  ctx.quadraticCurveTo(x + j(23), y + j(24), x + r + j(1), y + j(2));
  ctx.closePath();
}

/** سایهٔ نرم؛ نور از بالا-چپ. */
function withShadow(blur, dy, alpha, fn, hue = '78, 46, 24') {
  ctx.save();
  ctx.shadowColor = `rgba(${hue}, ${alpha})`;
  ctx.shadowBlur = blur;
  ctx.shadowOffsetY = dy;
  ctx.shadowOffsetX = dy * .35;
  fn();
  ctx.restore();
}

/** یک برگه‌ی کاغذ با سایه — پایه‌ی همه‌ی کارت‌ها و تابلوها. */
function paper(x, y, w, h, fill, seed = 1, r = 12, shadow = .26) {
  withShadow(16, 7, shadow, () => {
    ctx.fillStyle = fill;
    wobbleRect(x, y, w, h, r, seed, 2);
    ctx.fill();
  });
  /* الیافِ کاغذ و لبهٔ روشن، تا سطح تخت نماند */
  ctx.save();
  ctx.beginPath(); wobbleRect(x, y, w, h, r, seed, 2); ctx.clip();
  ctx.globalAlpha = .5;
  ctx.fillStyle = texPaper(fill);
  ctx.fillRect(x, y, w, h);
  ctx.globalAlpha = 1;
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.4, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(90,60,20,.1)');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
}

function text(str, x, y, o = {}) {
  const size = o.size || 20;
  const fam = o.family || 'Vazirmatn';
  ctx.save();
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.font = `${fam === 'Lalezar' ? '400' : (o.weight || 700)} ${size}px "${fam}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.baseline || 'middle';
  ctx.fillStyle = o.color || '#43291b';
  ctx.direction = 'rtl';
  if (o.stroke) {
    ctx.lineWidth = o.strokeWidth || 5;
    ctx.strokeStyle = o.stroke;
    ctx.lineJoin = 'round';
    ctx.strokeText(str, x, y, o.maxWidth);
  }
  ctx.fillText(str, x, y, o.maxWidth);
  ctx.restore();
}

/** متنِ چندخطی که خودش می‌شکند. ارتفاعِ اشغال‌شده را برمی‌گرداند. */
function textWrap(str, x, y, maxW, o = {}) {
  const size = o.size || 19, lh = o.lineHeight || size * 1.7;
  ctx.font = `${o.weight || 700} ${size}px "${o.family || 'Vazirmatn'}", Tahoma, sans-serif`;
  const lines = [];
  for (const para of str.split('\n')) {
    let line = '';
    for (const wd of para.split(' ')) {
      const t = line ? line + ' ' + wd : wd;
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = wd; }
      else line = t;
    }
    lines.push(line);
  }
  lines.forEach((l, i) => text(l, x, y + i * lh, o));
  return lines.length * lh;
}

/* ───────── ذره‌ها ───────── */

class Bits {
  constructor() { this.list = []; }
  add(x, y, n, kind, colors, opts = {}) {
    for (let i = 0; i < n; i++) {
      const a = opts.dir !== undefined ? opts.dir + (Math.random()-.5) * (opts.spread || 1) : Math.random() * TAU;
      const sp = (opts.speed || 200) * (.4 + Math.random());
      this.list.push({
        kind, x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - (opts.lift || 0),
        r: (opts.size || 4) * (.5 + Math.random()),
        rot: Math.random() * TAU, vr: (Math.random()-.5) * 10,
        col: colors[(Math.random() * colors.length) | 0],
        grav: opts.grav === undefined ? 620 : opts.grav,
        drag: opts.drag || .995,
        life: (opts.life || .9) * (.6 + Math.random() * .8), age: 0,
      });
    }
  }
  confetti(x, y, n, colors) {
    this.add(x, y, n, 'flake', colors, { speed: 420, lift: 190, size: 5, life: 1.6, grav: 780 });
  }
  spark(x, y, n, colors) {
    this.add(x, y, n, 'dot', colors, { speed: 180, lift: 30, size: 3.4, life: .7, grav: 260, drag: .93 });
  }
  step(dt) {
    for (const p of this.list) {
      p.age += dt;
      p.vy += p.grav * dt;
      p.vx *= p.drag; p.vy *= p.drag;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    }
    this.list = this.list.filter((p) => p.age < p.life);
  }
  draw() {
    for (const p of this.list) {
      const k = clamp(1 - p.age / p.life, 0, 1);
      ctx.save();
      ctx.globalAlpha = k;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.col;
      if (p.kind === 'flake') ctx.fillRect(-p.r, -p.r*1.5, p.r*2, p.r*3);
      else if (p.kind === 'leaf') { wobbleEllipse(0, 0, p.r*1.8, p.r*.8, 0, p.r, .6); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(0, 0, p.r * k, 0, TAU); ctx.fill(); }
      ctx.restore();
    }
  }
  clear() { this.list.length = 0; }
}

/* ───────── صدا (بدون فایل صوتی) ───────── */

const sfx = {
  ac: null, on: true,
  _c() {
    if (!this.on) return null;
    if (!this.ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; this.ac = new A(); }
    if (this.ac.state === 'suspended') this.ac.resume();
    return this.ac;
  },
  tone(f, dur = .16, type = 'sine', gain = .13, delay = 0) {
    const c = this._c(); if (!c) return;
    const t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(t0 + dur + .04);
  },
  tap()  { this.tone(430, .07, 'triangle', .09); },
  place(){ this.tone(620, .11, 'sine', .12); },
  pop()  { this.tone(760, .09, 'sine', .11); },
  slide(){ this.tone(240, .22, 'sine', .07); },
  good() { [523, 659, 784].forEach((f,i) => this.tone(f, .22, 'sine', .13, i*.07)); },
  win()  { [523, 659, 784, 1047].forEach((f,i) => this.tone(f, .34, 'triangle', .13, i*.10)); },
  nope() { this.tone(180, .2, 'sawtooth', .07); },
  tick() { this.tone(1100, .04, 'square', .05); },
};

/* ───────── قطعه‌های آماده ───────── */

function star(x, y, r, col, rot = 0) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = col;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI/2 + i * Math.PI/5;
    const rr = i % 2 ? r * .45 : r;
    const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/** دکمهٔ کاغذی. hovered را خودِ بازی می‌دهد؛ اینجا فقط کشیده می‌شود. */
/** رنگ را روشن‌تر (k>0) یا تیره‌تر (k<0) می‌کند. */
function shade(col, k) {
  const c = String(col).trim();
  let r, g2, b2;
  if (c[0] === '#') {
    const h = c.length === 4 ? c[1]+c[1]+c[2]+c[2]+c[3]+c[3] : c.slice(1, 7);
    r = parseInt(h.slice(0,2), 16); g2 = parseInt(h.slice(2,4), 16); b2 = parseInt(h.slice(4,6), 16);
  } else {
    const m = c.match(/[\d.]+/g);
    if (!m || m.length < 3) return col;
    r = +m[0]; g2 = +m[1]; b2 = +m[2];
  }
  const f = (v) => Math.round(clamp(k < 0 ? v * (1 + k) : v + (255 - v) * k, 0, 255));
  return 'rgb(' + f(r) + ',' + f(g2) + ',' + f(b2) + ')';
}

function button(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 3 : 0;
  const fill = o.disabled ? (o.off || '#bcaa92') : (hot ? (o.hotFill || o.fill) : o.fill);
  const r = o.r === undefined ? 14 : o.r;
  /* لبهٔ زیرینِ تیره — دکمه از صفحه بیرون می‌زند */
  ctx.fillStyle = shade(fill, -.36);
  wobbleRect(b.x, b.y + dy + 7, b.w, b.h, r, b.x + b.y, 2);
  ctx.fill();
  withShadow(hot ? 22 : 14, hot ? 5 : 8, .32, () => {
    ctx.fillStyle = fill;
    wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2);
    ctx.fill();
  });
  /* حجم: روشن از بالا، تیره به پایین */
  ctx.save();
  ctx.beginPath(); wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2); ctx.clip();
  const g = ctx.createLinearGradient(0, b.y + dy, 0, b.y + dy + b.h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.45, 'rgba(255,255,255,.04)');
  g.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = g;
  ctx.fillRect(b.x, b.y + dy, b.w, b.h);
  /* برقِ باریکِ لبهٔ بالا */
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.fillRect(b.x + r, b.y + dy + 2, b.w - r * 2, 2);
  ctx.restore();
  text(label, b.x + b.w/2, b.y + b.h/2 + dy - (o.sub ? 9 : 0), {
    size: o.size || 26, color: o.color || '#fdf6e8', family: o.family || 'Lalezar',
  });
  if (o.sub) text(o.sub, b.x + b.w/2, b.y + b.h/2 + dy + 17,
    { size: 14, color: o.subColor || 'rgba(255,255,255,.88)' });
}

/** دکمهٔ گرد کوچک (مثل + و −). */
function roundButton(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 2 : 0;
  withShadow(10, hot ? 3 : 5, .3, () => {
    ctx.fillStyle = o.disabled ? '#cbbba3' : (hot ? (o.hotFill || o.fill) : o.fill);
    wobbleCircle(b.x, b.y + dy, b.r, b.x, 1.4);
    ctx.fill();
  });
  text(label, b.x, b.y + dy - 1,
    { size: o.size || 32, color: o.disabled ? '#a8988a' : (o.color || '#fdf6e8'), family: 'Lalezar' });
}

/** پرده‌ی تمام‌صفحه: برای شروعِ پرده و برای جشنِ پایان. */
function overlay(o) {
  const k = easeOut(clamp(o.t / .5, 0, 1));
  ctx.fillStyle = `rgba(30, 22, 16, ${.66 * k})`;
  ctx.fillRect(0, 0, SW, SH);

  const w = o.w || 700, h = o.h || 290;
  const x = (SW - w) / 2, y = o.y || (SH * .22);
  const s = lerp(.9, 1, easeBack(clamp(o.t / .65, 0, 1)));
  ctx.save();
  ctx.translate(SW/2, y + h/2);
  ctx.scale(s, s);
  ctx.translate(-SW/2, -(y + h/2));

  withShadow(30, 14, .42, () => {
    ctx.fillStyle = o.paper || '#fbf3e2';
    wobbleRect(x, y, w, h, 18, 121, 2.4);
    ctx.fill();
  });
  ctx.fillStyle = o.band || '#c8434f';
  wobbleRect(x, y, w, 12, 6, 123, 1);
  ctx.fill();

  if (o.icon) o.icon(SW/2, y + 56);
  text(o.title, SW/2, y + (o.icon ? 108 : 62),
    { size: o.titleSize || 36, color: o.ink || '#43291b', family: 'Lalezar', alpha: k });
  textWrap(o.body, SW/2, y + (o.icon ? 158 : 116), w - 90,
    { size: 19, color: o.inkSoft || '#8a6a52', alpha: k });
  ctx.restore();

  button(o.btn, o.btnLabel, { hot: o.btnHot, fill: o.btnFill || '#7fa356', hotFill: o.btnHotFill || '#8fb45f', size: 28 });
}

/** پیامِ کوتاهِ بالای صحنه. */
class Toast {
  constructor() { this.msg = null; this.t = 0; this.kind = 'info'; }
  say(msg, kind = 'info') { this.msg = msg; this.kind = kind; this.t = 2.6; }
  step(dt) { if (this.t > 0) { this.t -= dt; if (this.t <= 0) this.msg = null; } }
  draw(y = 24, colors = {}) {
    if (!this.msg) return;
    const k = clamp(this.t, 0, 1) * clamp((2.6 - this.t) * 5, 0, 1);
    ctx.save();
    ctx.globalAlpha = k;
    ctx.font = `700 19px "Vazirmatn", Tahoma, sans-serif`;
    const w = ctx.measureText(this.msg).width + 76;
    const fill = this.kind === 'good' ? (colors.good || '#7fa356')
               : this.kind === 'bad' ? (colors.bad || '#c8434f')
               : (colors.info || '#fbf3e2');
    paper(SW/2 - w/2, y, w, 48, fill, 151, 12, .3);
    text(this.msg, SW/2, y + 25,
      { size: 19, color: this.kind === 'info' ? (colors.ink || '#43291b') : '#fff8ec' });
    ctx.restore();
  }
}

/* ───────── آموزشِ پرده‌ای ─────────
   پرده‌هایی که منتظرِ کارِ بچه نیستند با یک ضربه جلو می‌روند. تایمر فقط
   پشتیبان است؛ بچهٔ کلاس سومی باید فرصتِ خواندن داشته باشد، نه اینکه
   متن قبل از تمام شدنِ خواندنش برود.                                    */

/** اگر پردهٔ فعلی خواندنی است، ضربه را می‌خورد و می‌رود پردهٔ بعد. */
function tutTap(tut, tapSteps, lastStep) {
  if (!tut.on || tapSteps.indexOf(tut.step) < 0) return false;
  if (tut.step >= lastStep) tut.on = false;
  else { tut.step++; tut.t = 0; }
  sfx.tap();
  return true;
}

/** نشانهٔ «برای ادامه بزن» — زیرِ کارتِ آموزش. */
function tutMore(cx, y, t, ink = '#3a2a18', bg = 'rgba(255, 250, 238, .94)') {
  ctx.save();
  ctx.globalAlpha = .62 + .38 * Math.sin(t * 3.2);
  ctx.font = '700 15px "Vazirmatn", Tahoma, sans-serif';
  const label = 'برای ادامه، هرجا را بزن';
  const w = ctx.measureText(label).width + 40, h = 32, x = cx - w / 2, r = 16;
  withShadow(10, 4, .3, () => {
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath(); ctx.fill();
  });
  text(label, cx, y + h / 2, { size: 15, color: ink });
  ctx.restore();
}

/** فونت‌ها را می‌آورد و بعد بازی را شروع می‌کند.
    مهم: هر دو راه (رسیدنِ فونت و مهلتِ پشتیبان) ممکن است برسند، ولی
    شروع فقط باید یک بار انجام شود؛ وگرنه دو حلقهٔ فریم راه می‌افتد و
    بازی دوبرابر سریع می‌شود. */
function whenFontsReady(start) {
  let done = false;
  const go = () => { if (done) return; done = true; start(); };
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('400 40px Lalezar'),
      document.fonts.load('700 20px Vazirmatn'),
      document.fonts.load('900 20px Vazirmatn'),
    ]).then(go, go);
    setTimeout(go, 2600);
  } else go();
}

/** حلقهٔ فریم با dtِ محدودشده. */
/* ───────── کیفیتِ خودکار ─────────
   اگر دستگاه کُند بود، اوّل درخشش و بعد رنگ‌بندی خاموش می‌شود تا بازی
   روان بماند. روی دستگاهِ قوی همه‌چیز روشن است. */
let QUALITY = 2;
let _fAcc = 0, _fN = 0, _qHold = 0;

function _qualityTick(gap) {
  if (gap <= 0 || gap > 200) return;
  _fAcc += gap; _fN++;
  if (_fN < 45) return;
  const avg = _fAcc / _fN;
  _fAcc = 0; _fN = 0;
  if (_qHold > 0) { _qHold--; return; }
  const before = QUALITY;
  if (avg > 25 && QUALITY > 0) { QUALITY--; _qHold = 3; }
  else if (avg < 18.5 && QUALITY < 2) { QUALITY++; _qHold = 6; }
  /* در پایین‌ترین کیفیت، صحنه را با نقطه‌های کمتر می‌کشیم */
  if (before !== QUALITY && (before === 0 || QUALITY === 0) && _refit) _refit();
}

/* یک حلقه، نه بیشتر — دو حلقه یعنی زمانِ بازی دوبرابر می‌گذرد. */
let _looping = false;
function runLoop(step) {
  if (_looping) return;
  _looping = true;
  let last = performance.now();
  const frame = (now) => {
    const gap = now - last;
    const dt = Math.min(gap / 1000, 1/20);
    last = now;
    _qualityTick(gap);
    step(dt);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

/* ═════════════════ بازی ═════════════════ */
/* ═══════════════════════════════════════════════════════════════════════
   کارگاهِ شیشهٔ رنگی — ریاضی سوم، فصل ۷، درس ۴ (نمودار دایره‌ای)
   ───────────────────────────────────────────────────────────────────────
   کتاب می‌گوید: «دایره‌ی زیر ۱۲ قسمت دارد. کارهای روزانهٔ این دانش‌آموز
   را با رنگ کردن این قسمت‌ها نشان دهید»، و در تمرینِ بعد: «هر قسمت از
   دایره، نشان‌دهندهٔ ۵ کتاب است.»

   اینجا آن دایره یک پنجرهٔ گلِ شیشه‌ایِ کارگاه است. سفارش می‌رسد — مثلاً
   ۲۵ کتابِ سرگرمی و ۱۰ کتابِ درسی — و روی برگه، هر مقدار به شکلِ یک
   نوارِ خط‌کشی‌شده کنارِ خودش کشیده شده که خط‌هایش پنج‌تا پنج‌تا دسته
   شده‌اند. هر شیشه که در پنجره می‌گذاری، یک دسته از آن نوار روشن می‌شود.

   پس بچّه «۲۵ تقسیم بر ۵» را حساب نمی‌کند؛ می‌بیند که نوار با پنج شیشه
   پُر می‌شود. عددِ جواب هیچ‌جا نوشته نیست — فقط سفارش، و کارِ خودش.

   آفتاب از پشتِ پنجره می‌تابد و همان نسبت‌ها را روی زمینِ کارگاه پهن
   می‌کند: نمودار، سایهٔ خودش را هم نشان می‌دهد.
   ═══════════════════════════════════════════════════════════════════════ */

  { name: 'تا آفتاب هست', n: 12, cats: 4, scale: 0, quota: 0, time: 88, endless: true,
    hint: 'تا آفتاب هست، پنجره بساز.' },
];

const ROSE = { x: 372, y: 400, r: 202 };
const ORDER = { x: 640, y: 88, w: 330, h: 456 };
const RACK = { x: 992, y: 88, w: 184, h: 456 };
const BTN_GO = { x: 470, y: 566, w: 260, h: 76 };

/* ───────── وضعیت ───────── */

const S = {
  phase: 'intro',
  level: 0, n: 6, scale: 1,
  theme: 0, cats: [],        /* { name, col, qty } */
  pane: [],                  /* رنگِ هر قسمت، یا ‑۱ برای خالی */
  brush: 0,
  done: 0, lit: 0,
  timeLeft: 0, panesLeft: 3,
  cleared: 0, quota: 0,
  score: 0, best: 0, combo: 0,
  motes: [], drawing: false,
  t: 0, phaseT: 0, hover: null, shake: 0, nope: 0,
  tut: { on: true, step: 0, t: 0 },
};

const bits = new Bits();
const toast = new Toast();
const L = () => LEVELS[S.level];
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const paneCount = (k) => S.pane.reduce((a, v) => a + (v === k ? 1 : 0), 0);

function loadBest() { try { return +localStorage.getItem('shishe-best') || 0; } catch { return 0; } }
function saveBest(v) { try { localStorage.setItem('shishe-best', String(v)); } catch { /* حالتِ خصوصی */ } }

const cv = document.getElementById('stage');
initStage(cv, SCENE_W, SCENE_H);
S.best = loadBest();

/* ───────── سفارشِ تازه ───────── */

function newOrder() {
  const lv = L();
  const n = lv.n;
  const k = lv.cats;
  const scale = lv.scale || [1, 2, 5][R(0, 2)];
  /* n قسمت را بینِ k دسته پخش می‌کنیم، هر دسته دستِ‌کم یکی */
  const part = new Array(k).fill(1);
  for (let i = 0; i < n - k; i++) part[R(0, k - 1)]++;
  const th = R(0, THEMES.length - 1);
  const names = THEMES[th].cats.slice();
  const cols = [0, 1, 2, 3, 4];
  for (let i = cols.length - 1; i > 0; i--) { const j = R(0, i); const t = cols[i]; cols[i] = cols[j]; cols[j] = t; }
  S.theme = th;
  S.n = n; S.scale = scale;
  S.cats = [];
  for (let i = 0; i < k; i++) S.cats.push({ name: names[i], col: cols[i], qty: part[i] * scale });
  S.pane = new Array(n).fill(-1);
  S.brush = S.cats[0].col;
  S.done = 0;
  S.lit = 0;
}

function startLevel(i, keep) {
  const lv = LEVELS[i];
  S.level = i;
  S.cleared = 0;
  S.quota = lv.endless ? Infinity : lv.quota;
  S.combo = 0;
  S.timeLeft = lv.time;
  if (!keep) { S.score = 0; S.panesLeft = 3; }
  S.phase = 'play'; S.phaseT = 0;
  S.tut.on = i === 0 && !keep; S.tut.step = 0; S.tut.t = 0;
  newOrder();
  toast.say(lv.hint, 'info');
}

/* ───────── حلقه ───────── */

newOrder();
whenFontsReady(() => runLoop(step));

const catOK = (i) => paneCount(S.cats[i].col) * S.scale === S.cats[i].qty;
const allSet = () => S.cats.every((_, i) => catOK(i)) && S.pane.every((v) => v >= 0);

function step(dt) {
  S.t += dt; S.phaseT += dt;
  if (S.shake > 0) S.shake -= dt;
  if (S.nope > 0) S.nope -= dt;
  if (S.lit > 0 && S.lit < 1) S.lit = Math.min(1, S.lit + dt * 1.6);

  if (Math.random() < dt * 8 && S.motes.length < 60) {
    S.motes.push({ x: 120 + Math.random() * 700, y: 200 + Math.random() * 500,
                   r: .8 + Math.random() * 1.8, v: 6 + Math.random() * 14, p: Math.random() * 6 });
  }
  for (const m of S.motes) { m.y -= m.v * dt; m.x += Math.sin(m.p + S.t * .6) * 8 * dt; }
  S.motes = S.motes.filter((m) => m.y > 140);

  if (S.phase === 'play') {
    const frozen = S.tut.on && S.tut.step < 2;
    if (!frozen && !S.done) {
      S.timeLeft -= dt;
      if (S.timeLeft <= 0) { S.timeLeft = 0; losePane('آفتاب رفت و کارگاه بسته شد!'); }
    }
    if (S.done) { S.done += dt; if (S.done > 2.3) { newOrder(); S.timeLeft = L().time; } }
    if (S.tut.on) S.tut.t += dt;
  }
  bits.step(dt);
  toast.step(dt);
  draw();
}

function losePane(msg) {
  if (S.done) return;
  S.panesLeft--;
  S.combo = 0;
  S.shake = .5;
  sfx.nope();
  toast.say(msg, 'bad');
  if (S.panesLeft <= 0) { S.phase = 'lost'; S.phaseT = 0; return; }
  S.timeLeft = L().time;
  newOrder();
}

/** شیشه گذاشتن یا برداشتن. */
function setPane(i, remove) {
  if (S.phase !== 'play' || S.done) return;
  if (i < 0 || i >= S.n) return;
  if (remove) {
    if (S.pane[i] < 0) return;
    S.pane[i] = -1;
    sfx.tone(300, .06, 'sine', .05);
  } else {
    if (S.pane[i] === S.brush) return;
    S.pane[i] = S.brush;
    sfx.tone(660 + i * 12, .07, 'triangle', .06);
    const a = (i + .5) / S.n * TAU - Math.PI / 2;
    bits.add(ROSE.x + Math.cos(a) * ROSE.r * .66, ROSE.y + Math.sin(a) * ROSE.r * .66, 5, 'dot',
      [GLASS[S.brush].c, '#fff'], { speed: 120, lift: 30, size: 3, life: .4, grav: 260 });
  }
  if (S.tut.on && S.tut.step === 1 && S.pane.filter((v) => v >= 0).length >= 2) { S.tut.step = 2; S.tut.t = 0; }
  if (allSet()) finish();
}

function finish() {
  S.done = .001;
  S.lit = .001;
  S.combo++;
  S.cleared++;
  S.score += 320 + S.n * 20 + Math.round(S.timeLeft * 4) + Math.min(S.combo, 6) * 70;
  if (S.score > S.best) { S.best = S.score; saveBest(S.best); }
  bits.confetti(ROSE.x, ROSE.y, 48, [P.gold, P.brassLt, GLASS[0].c, GLASS[1].c, '#fff']);
  sfx.win();
  toast.say('آفتاب از پنجره تابید!', 'good');
  if (S.tut.on) S.tut.on = false;
  if (!L().endless && S.cleared >= S.quota) { S.score += 800; S.phase = 'won'; S.phaseT = 0; }
}

/* ───────── ورودی ───────── */

const TUT_TAP = [0, 2], TUT_LAST = 2;

function glassBox(i) {
  const h = 62, gap = 12;
  return { x: RACK.x + 18, y: RACK.y + 62 + i * (h + gap), w: RACK.w - 36, h };
}

function paneAt(p) {
  const dx = p.x - ROSE.x, dy = p.y - ROSE.y;
  const d = Math.hypot(dx, dy);
  if (d > ROSE.r || d < 44) return -1;
  let a = Math.atan2(dy, dx) + Math.PI / 2;
  a = ((a % TAU) + TAU) % TAU;
  return Math.floor(a / (TAU / S.n)) % S.n;
}

cv.addEventListener('pointermove', (e) => {
  const p = toStage(e);
  if (S.phase !== 'play') { S.hover = inRect(p, BTN_GO) ? BTN_GO : null; cv.style.cursor = S.hover ? 'pointer' : 'default'; return; }
  if (S.drawing) { const i = paneAt(p); if (i >= 0 && S.pane[i] < 0) setPane(i, false); return; }
  S.hover = null;
  const i = paneAt(p);
  if (i >= 0) S.hover = { k: 'pane', i };
  for (let g = 0; g < S.cats.length; g++) if (inRect(p, glassBox(g))) S.hover = { k: 'glass', i: g };
  cv.style.cursor = S.hover ? 'pointer' : 'default';
});

cv.addEventListener('pointerdown', (e) => {
  const p = toStage(e);
  if (S.phase === 'intro') { startLevel(0); return; }
  if (S.phase === 'won') {
    if (!inRect(p, BTN_GO)) return;
    if (L().endless) startLevel(S.level, true);
    else if (S.level + 1 < LEVELS.length) startLevel(S.level + 1, true);
    else startLevel(0);
    return;
  }
  if (S.phase === 'lost') { if (inRect(p, BTN_GO)) startLevel(S.level); return; }
  if (tutTap(S.tut, TUT_TAP, TUT_LAST)) return;
  for (let g = 0; g < S.cats.length; g++) if (inRect(p, glassBox(g))) { S.brush = S.cats[g].col; sfx.tap(); return; }
  const i = paneAt(p);
  if (i >= 0) {
    if (S.pane[i] >= 0) setPane(i, true);
    else { S.drawing = true; setPane(i, false);
      try { cv.setPointerCapture(e.pointerId); } catch { /* بعضی مرورگرها */ } }
  }
});

cv.addEventListener('pointerup', () => { S.drawing = false; });
cv.addEventListener('pointercancel', () => { S.drawing = false; });

/* ───────── ابزارِ نقاشی ───────── */

function rrPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function numText(str, x, y, o = {}) {
  ctx.save();
  ctx.font = `${o.family === 'Vazirmatn' ? (o.weight || 700) : '400'} ${o.size || 20}px "${o.family || 'Lalezar'}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  ctx.direction = 'ltr';
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.fillStyle = o.color || P.ink;
  ctx.fillText(str, x, y);
  ctx.restore();
}

function spot(rects, alpha) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, SCENE_W, SCENE_H);
  for (const r of rects) rrPath(r.x - 12, r.y - 12, r.w + 24, r.h + 24, 22);
  ctx.fillStyle = `rgba(10, 6, 3, ${alpha})`;
  ctx.fill('evenodd');
  ctx.restore();
}

function tutCard(x, y, w, lines, title) {
  const h = 26 + (title ? 44 : 0) + lines.length * 30;
  withShadow(24, 10, .5, () => {
    ctx.fillStyle = 'rgba(244, 233, 208, .97)';
    wobbleRect(x, y, w, h + 20, 16, 101, 2.2); ctx.fill();
  }, '10, 6, 3');
  ctx.fillStyle = P.brassDk;
  wobbleRect(x, y, w, 9, 4, 103, 1); ctx.fill();
  let yy = y + 34;
  if (title) { text(title, x + w / 2, yy + 6, { size: 25, family: 'Lalezar', color: P.ink }); yy += 44; }
  for (const l of lines) { text(l, x + w / 2, yy, { size: 18, color: '#7a6a52' }); yy += 30; }
  return h + 20;
}

/* ───────── پس‌زمینهٔ ثابت ───────── */

function paintShopStatic() {
  const g = ctx.createLinearGradient(0, 0, 0, SCENE_H);
  g.addColorStop(0, P.wallLo); g.addColorStop(.4, P.wall); g.addColorStop(1, '#170f09');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, SCENE_W, SCENE_H);
  ctx.save();
  ctx.globalAlpha = .45;
  ctx.fillStyle = texStone(P.stone, P.stoneLt);
  ctx.fillRect(0, 0, SCENE_W, SCENE_H);
  ctx.restore();
  /* سنگ‌چینِ دیوار */
  ctx.strokeStyle = 'rgba(0,0,0,.34)'; ctx.lineWidth = 3;
  for (let y = HUD_H + 52; y < 620; y += 52) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(SCENE_W, y); ctx.stroke();
    const off = ((y / 52) | 0) % 2 ? 46 : 0;
    for (let x = off; x < SCENE_W; x += 92) {
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - 52); ctx.stroke();
    }
  }
  ctx.strokeStyle = 'rgba(255, 224, 168, .07)'; ctx.lineWidth = 2;
  for (let y = HUD_H + 54; y < 620; y += 52) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(SCENE_W, y); ctx.stroke();
  }
  /* طاقِ سنگیِ دورِ پنجره */
  ctx.fillStyle = P.stoneDk;
  ctx.beginPath(); ctx.arc(ROSE.x, ROSE.y, ROSE.r + 48, 0, TAU); ctx.fill();
  ctx.fillStyle = texStone(P.stoneLt, P.stone);
  ctx.beginPath(); ctx.arc(ROSE.x, ROSE.y, ROSE.r + 40, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 3;
  for (let i = 0; i < 24; i++) {
    const a = i / 24 * TAU;
    ctx.beginPath();
    ctx.moveTo(ROSE.x + Math.cos(a) * (ROSE.r + 14), ROSE.y + Math.sin(a) * (ROSE.r + 14));
    ctx.lineTo(ROSE.x + Math.cos(a) * (ROSE.r + 40), ROSE.y + Math.sin(a) * (ROSE.r + 40));
    ctx.stroke();
  }
  const ag = ctx.createRadialGradient(ROSE.x - 40, ROSE.y - 40, ROSE.r, ROSE.x, ROSE.y, ROSE.r + 48);
  ag.addColorStop(0, 'rgba(255, 224, 168, .16)');
  ag.addColorStop(1, 'rgba(0,0,0,.4)');
  ctx.fillStyle = ag;
  ctx.beginPath(); ctx.arc(ROSE.x, ROSE.y, ROSE.r + 48, 0, TAU); ctx.fill();

  /* کفِ کارگاه */
  ctx.fillStyle = '#241811';
  ctx.fillRect(0, 620, SCENE_W, SCENE_H - 620);
  ctx.fillStyle = texStone('#3a2a1c', '#55402c');
  ctx.fillRect(0, 628, SCENE_W, SCENE_H - 628);
  ctx.fillStyle = 'rgba(255, 224, 168, .1)';
  ctx.fillRect(0, 628, SCENE_W, 3);
  const fg = ctx.createLinearGradient(0, 628, 0, SCENE_H);
  fg.addColorStop(0, 'rgba(0,0,0,.16)'); fg.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = fg;
  ctx.fillRect(0, 628, SCENE_W, SCENE_H - 628);

  /* میزِ کارِ شیشه‌گر */
  ctx.fillStyle = P.woodDk;
  ctx.beginPath(); rrPath(ORDER.x - 26, ORDER.y - 22, RACK.x + RACK.w - ORDER.x + 52, ORDER.h + 44, 14); ctx.fill();
  ctx.fillStyle = texWood(P.wood, P.woodDk);
  ctx.beginPath(); rrPath(ORDER.x - 20, ORDER.y - 16, RACK.x + RACK.w - ORDER.x + 40, ORDER.h + 32, 10); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.fillRect(ORDER.x - 20, ORDER.y + ORDER.h + 16, RACK.x + RACK.w - ORDER.x + 40, 8);
}

/* ───────── صحنه ───────── */

function draw() {
  beginScene(P.wall);
  ctx.save();
  if (S.shake > 0) {
    const k = S.shake * 10;
    ctx.translate(Math.sin(S.t * 55) * k, Math.cos(S.t * 43) * k * .4);
  }
  ctx.drawImage(staticLayer('shop', SCENE_W, SCENE_H, paintShopStatic), 0, 0, SCENE_W, SCENE_H);
  drawFloorLight();
  drawRose();
  drawMotes();
  drawOrder();
  drawRack();
  bits.draw();
  ctx.restore();

  drawHUD();
  if (!(S.phase === 'play' && S.tut.on)) toast.draw(HUD_H + 8, { good: P.good, bad: P.bad, info: P.paper, ink: P.ink });
  if (S.phase === 'play' && S.tut.on) drawTutorial();
  if (S.phase === 'intro') drawIntro();
  if (S.phase === 'won') drawWon();
  if (S.phase === 'lost') drawLost();
  endScene(.11, 'rgba(8, 4, 2, .5)', .44, .16);
}

/** نورِ رنگیِ پنجره روی زمینِ کارگاه — همان نسبت‌ها، پهن‌شده. */
function drawFloorLight() {
  const filled = S.pane.filter((v) => v >= 0).length;
  if (!filled) return;
  const k = .5 + (S.lit > 0 ? S.lit * .7 : 0);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.beginPath(); ctx.rect(0, 616, SCENE_W, SCENE_H - 616); ctx.clip();
  const stepA = TAU / S.n;
  for (let i = 0; i < S.n; i++) {
    if (S.pane[i] < 0) continue;
    const a0 = -Math.PI / 2 + i * stepA, a1 = a0 + stepA;
    /* پرتوِ هر قسمت، کشیده به پایین و پهن‌شده روی کف */
    ctx.save();
    ctx.globalAlpha = k * .62;
    const g = ctx.createLinearGradient(ROSE.x, 610, ROSE.x, SCENE_H + 40);
    g.addColorStop(0, shade(GLASS[S.pane[i]].c, .25));
    g.addColorStop(.55, GLASS[S.pane[i]].d);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    const x0 = ROSE.x + Math.cos(a0) * ROSE.r * 1.05, x1 = ROSE.x + Math.cos(a1) * ROSE.r * 1.05;
    ctx.beginPath();
    ctx.moveTo(x0, 616); ctx.lineTo(x1, 616);
    ctx.lineTo(ROSE.x + (x1 - ROSE.x) * 2.1, SCENE_H);
    ctx.lineTo(ROSE.x + (x0 - ROSE.x) * 2.1, SCENE_H);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function drawMotes() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const m of S.motes) {
    ctx.fillStyle = `rgba(255, 224, 168, ${.1 + m.r * .1})`;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawRose() {
  const { x, y, r } = ROSE;
  const stepA = TAU / S.n;
  /* شیشه‌ها */
  for (let i = 0; i < S.n; i++) {
    const a0 = -Math.PI / 2 + i * stepA, a1 = a0 + stepA;
    const k = S.pane[i];
    ctx.beginPath();
    ctx.moveTo(x, y); ctx.arc(x, y, r, a0, a1); ctx.closePath();
    if (k < 0) {
      ctx.fillStyle = 'rgba(18, 12, 7, .82)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(125, 120, 108, .5)'; ctx.lineWidth = 1.6;
      ctx.setLineDash([6, 6]); ctx.stroke(); ctx.setLineDash([]);
    } else {
      const mid = (a0 + a1) / 2;
      const gx = x + Math.cos(mid) * r * .45, gy = y + Math.sin(mid) * r * .45;
      const g = ctx.createRadialGradient(gx, gy, 4, x, y, r * 1.1);
      g.addColorStop(0, shade(GLASS[k].c, .45));
      g.addColorStop(.55, GLASS[k].c);
      g.addColorStop(1, GLASS[k].d);
      ctx.fillStyle = g;
      ctx.fill();
      /* رگه‌های شیشه */
      ctx.save();
      ctx.clip();
      ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 2;
      for (let s = 0; s < 4; s++) {
        const aa = a0 + (s + .5) / 4 * stepA;
        ctx.beginPath();
        ctx.moveTo(x + Math.cos(aa) * 46, y + Math.sin(aa) * 46);
        ctx.lineTo(x + Math.cos(aa + .04) * r, y + Math.sin(aa + .04) * r);
        ctx.stroke();
      }
      ctx.restore();
    }
    if (S.hover && S.hover.k === 'pane' && S.hover.i === i && !S.done) {
      ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, r, a0, a1); ctx.closePath();
      ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fill();
    }
  }
  /* سرب‌های میانِ شیشه‌ها */
  ctx.strokeStyle = P.leadDk; ctx.lineWidth = 9; ctx.lineCap = 'round';
  for (let i = 0; i < S.n; i++) {
    const a = -Math.PI / 2 + i * stepA;
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(a) * 40, y + Math.sin(a) * 40);
    ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    ctx.stroke();
  }
  ctx.strokeStyle = P.leadLt; ctx.lineWidth = 3;
  for (let i = 0; i < S.n; i++) {
    const a = -Math.PI / 2 + i * stepA;
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(a) * 40, y + Math.sin(a) * 40);
    ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    ctx.stroke();
  }
  /* حلقهٔ سربیِ لبه و توپیِ میانه */
  ctx.strokeStyle = P.leadDk; ctx.lineWidth = 14;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
  ctx.strokeStyle = P.leadLt; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(x, y, r - 2, 0, TAU); ctx.stroke();
  ctx.fillStyle = P.leadDk;
  ctx.beginPath(); ctx.arc(x, y, 42, 0, TAU); ctx.fill();
  ctx.fillStyle = ball(x - 12, y - 12, 76, P.brassLt, P.brass, P.brassDk);
  ctx.beginPath(); ctx.arc(x, y, 34, 0, TAU); ctx.fill();
  numText(fa(S.n), x, y + 1, { size: 30, color: '#3b2c0a' });
  text('قسمت', x, y + 24, { size: 11, color: 'rgba(59, 44, 10, .7)' });
  /* درخششِ پایان */
  if (S.lit > 0) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = S.lit * .5;
    const g = ctx.createRadialGradient(x, y, r * .3, x, y, r * 1.6);
    g.addColorStop(0, 'rgba(255, 224, 168, .6)');
    g.addColorStop(1, 'rgba(255, 224, 168, 0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r * 1.6, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

/** برگهٔ سفارش: هر مقدار یک نوارِ خط‌کشی‌شده دارد که پنج‌تا پنج‌تا دسته شده. */
function drawOrder() {
  paper(ORDER.x, ORDER.y, ORDER.w, ORDER.h, P.card, 31, 12, .34);
  const th = THEMES[S.theme];
  text(th.t, ORDER.x + ORDER.w - 22, ORDER.y + 30, { size: 23, family: 'Lalezar', color: P.ink, align: 'right' });
  /* مقیاس: هر قسمت چندتا */
  const sy = ORDER.y + 62;
  ctx.fillStyle = 'rgba(207, 167, 78, .2)';
  ctx.beginPath(); rrPath(ORDER.x + 20, sy - 20, ORDER.w - 40, 40, 10); ctx.fill();
  ctx.strokeStyle = 'rgba(143, 115, 39, .5)'; ctx.lineWidth = 1.6;
  ctx.beginPath(); rrPath(ORDER.x + 20, sy - 20, ORDER.w - 40, 40, 10); ctx.stroke();
  /* نشانِ یک قسمت */
  ctx.fillStyle = P.leadDk;
  ctx.beginPath(); ctx.moveTo(ORDER.x + ORDER.w - 44, sy);
  ctx.arc(ORDER.x + ORDER.w - 44, sy, 15, -1.9, -.55); ctx.closePath(); ctx.fill();
  text('هر قسمت', ORDER.x + ORDER.w - 68, sy, { size: 15, color: P.ink, align: 'right' });
  numText('=', ORDER.x + ORDER.w - 152, sy + 1, { size: 20, color: P.inkSoft });
  numText(fa(S.scale), ORDER.x + ORDER.w - 182, sy + 1, { size: 24, color: P.ink });
  text(th.u, ORDER.x + 40, sy, { size: 16, color: P.ink, align: 'left' });

  for (let i = 0; i < S.cats.length; i++) {
    const c = S.cats[i];
    const y = ORDER.y + 118 + i * 84;
    const have = paneCount(c.col) * S.scale;
    const ok = have === c.qty;
    const over = have > c.qty;
    ctx.fillStyle = ok ? 'rgba(93, 162, 111, .15)' : (over ? 'rgba(205, 91, 69, .12)' : 'rgba(51, 38, 26, .05)');
    ctx.beginPath(); rrPath(ORDER.x + 18, y - 26, ORDER.w - 36, 74, 12); ctx.fill();
    ctx.strokeStyle = ok ? P.good : (over ? P.bad : 'rgba(51, 38, 26, .16)'); ctx.lineWidth = ok || over ? 2.2 : 1.4;
    ctx.beginPath(); rrPath(ORDER.x + 18, y - 26, ORDER.w - 36, 74, 12); ctx.stroke();
    /* شیشهٔ نمونه و نام */
    ctx.fillStyle = GLASS[c.col].d;
    ctx.beginPath(); rrPath(ORDER.x + ORDER.w - 56, y - 16, 26, 26, 5); ctx.fill();
    ctx.fillStyle = GLASS[c.col].c;
    ctx.beginPath(); rrPath(ORDER.x + ORDER.w - 55, y - 17, 24, 24, 5); ctx.fill();
    text(c.name, ORDER.x + ORDER.w - 66, y - 4, { size: 18, family: 'Lalezar', color: P.ink, align: 'right' });
    numText(fa(c.qty), ORDER.x + 46, y - 3, { size: 24, color: P.ink, align: 'left' });

    /* نوارِ خط‌کشی: هر دسته یک قسمت از پنجره */
    const groups = c.qty / S.scale;
    const bw = ORDER.w - 76, bx = ORDER.x + 38, by = y + 16;
    const gw = Math.min(46, (bw - (groups - 1) * 6) / groups);
    const totalW = groups * gw + (groups - 1) * 6;
    const filled = paneCount(c.col);
    for (let g = 0; g < groups; g++) {
      const gx = bx + (bw - totalW) / 2 + g * (gw + 6);
      ctx.fillStyle = g < filled ? GLASS[c.col].c : 'rgba(51, 38, 26, .1)';
      ctx.beginPath(); rrPath(gx, by - 11, gw, 22, 5); ctx.fill();
      ctx.strokeStyle = 'rgba(51, 38, 26, .3)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); rrPath(gx, by - 11, gw, 22, 5); ctx.stroke();
      /* خط‌های داخلِ دسته — همان‌قدر که مقیاس می‌گوید */
      ctx.strokeStyle = g < filled ? 'rgba(255,255,255,.55)' : 'rgba(51, 38, 26, .3)';
      ctx.lineWidth = 1.4;
      for (let t = 1; t < S.scale; t++) {
        const tx = gx + gw * t / S.scale;
        ctx.beginPath(); ctx.moveTo(tx, by - 7); ctx.lineTo(tx, by + 7); ctx.stroke();
      }
    }
    if (over) {
      numText('+' + fa(have - c.qty), ORDER.x + 46, y + 22, { size: 15, color: P.bad, align: 'left' });
    }
  }
}

function drawRack() {
  ctx.fillStyle = 'rgba(20, 12, 6, .7)';
  ctx.beginPath(); rrPath(RACK.x, RACK.y, RACK.w, RACK.h, 14); ctx.fill();
  ctx.strokeStyle = 'rgba(207, 167, 78, .34)'; ctx.lineWidth = 2;
  ctx.beginPath(); rrPath(RACK.x, RACK.y, RACK.w, RACK.h, 14); ctx.stroke();
  text('قفسهٔ شیشه', RACK.x + RACK.w / 2, RACK.y + 32, { size: 20, family: 'Lalezar', color: P.brassLt });
  for (let i = 0; i < S.cats.length; i++) {
    const b = glassBox(i), c = S.cats[i];
    const on = S.brush === c.col;
    const hot = S.hover && S.hover.k === 'glass' && S.hover.i === i;
    ctx.fillStyle = on ? 'rgba(242, 221, 153, .18)' : 'rgba(255,255,255,.04)';
    ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 10); ctx.fill();
    if (on || hot) {
      ctx.strokeStyle = on ? P.brassLt : 'rgba(242, 221, 153, .4)'; ctx.lineWidth = on ? 3 : 2;
      ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 10); ctx.stroke();
    }
    /* ورقهٔ شیشه، کمی کج، با برقِ لبه */
    ctx.save();
    ctx.translate(b.x + 40, b.y + b.h / 2);
    ctx.rotate(-.08);
    ctx.fillStyle = GLASS[c.col].d;
    ctx.beginPath(); rrPath(-25, -22, 50, 44, 5); ctx.fill();
    const gg = ctx.createLinearGradient(-25, -22, 25, 22);
    gg.addColorStop(0, shade(GLASS[c.col].c, .4));
    gg.addColorStop(.6, GLASS[c.col].c);
    gg.addColorStop(1, GLASS[c.col].d);
    ctx.fillStyle = gg;
    ctx.beginPath(); rrPath(-23, -20, 46, 40, 4); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.3)';
    ctx.beginPath(); ctx.moveTo(-20, 16); ctx.lineTo(-2, -17); ctx.lineTo(6, -17); ctx.lineTo(-12, 16);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    text(c.name, b.x + b.w - 12, b.y + b.h / 2, { size: 17, family: 'Lalezar', color: on ? P.brassLt : '#efe2c8', align: 'right' });
    /* چندتا گذاشته‌ای */
    ctx.fillStyle = 'rgba(0,0,0,.5)';
    ctx.beginPath(); rrPath(b.x + 6, b.y + b.h - 20, 30, 20, 6); ctx.fill();
    numText(fa(paneCount(c.col)), b.x + 21, b.y + b.h - 9, { size: 15, color: P.brassLt });
  }
  const left = S.pane.filter((v) => v < 0).length;
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  ctx.beginPath(); rrPath(RACK.x + 18, RACK.y + RACK.h - 58, RACK.w - 36, 40, 10); ctx.fill();
  text('خالی', RACK.x + RACK.w - 34, RACK.y + RACK.h - 38, { size: 14, color: 'rgba(244, 233, 208, .6)', align: 'right' });
  numText(fa(left), RACK.x + 46, RACK.y + RACK.h - 37, { size: 22, color: left ? P.brassLt : P.good });
}

function drawHUD() {
  ctx.fillStyle = 'rgba(20, 12, 6, .93)';
  ctx.fillRect(0, 0, SCENE_W, HUD_H);
  ctx.fillStyle = 'rgba(207, 167, 78, .3)';
  ctx.fillRect(0, HUD_H - 2, SCENE_W, 2);
  text(L().name, SCENE_W - 24, HUD_H / 2, { size: 23, family: 'Lalezar', color: P.paper, align: 'right' });
  for (let i = 0; i < 3; i++) {
    const x = SCENE_W - 226 - i * 30;
    ctx.save();
    ctx.globalAlpha = i < S.panesLeft ? 1 : .22;
    ctx.fillStyle = i < S.panesLeft ? GLASS[i % GLASS.length].c : '#5f584e';
    ctx.beginPath(); rrPath(x - 9, HUD_H / 2 - 10, 18, 20, 4); ctx.fill();
    ctx.strokeStyle = i < S.panesLeft ? P.leadLt : '#7d786c'; ctx.lineWidth = 2;
    ctx.beginPath(); rrPath(x - 9, HUD_H / 2 - 10, 18, 20, 4); ctx.stroke();
    ctx.restore();
  }
  if (!L().endless) {
    numText(fa(Math.min(S.cleared, L().quota)) + ' / ' + fa(L().quota), SCENE_W / 2, HUD_H / 2, { size: 22, color: P.gold });
  } else {
    text('بی‌پایان', SCENE_W / 2, HUD_H / 2, { size: 22, family: 'Lalezar', color: P.gold });
  }
  numText(fa(S.score), 24, HUD_H / 2, { size: 25, color: P.gold, align: 'left' });
  numText('بیشترین ' + fa(S.best), 140, HUD_H / 2 + 1,
    { size: 14, color: 'rgba(244, 233, 208, .5)', align: 'left', family: 'Vazirmatn', weight: 700 });
  if (S.combo > 1) numText('×' + fa(S.combo), 248, HUD_H / 2, { size: 22, color: P.gold, align: 'left' });
  const k = clamp(S.timeLeft / L().time, 0, 1);
  ctx.fillStyle = 'rgba(0,0,0,.4)';
  ctx.beginPath(); rrPath(SCENE_W / 2 - 150, HUD_H - 8, 300, 6, 3); ctx.fill();
  ctx.fillStyle = k > .3 ? P.brass : P.bad;
  ctx.beginPath(); rrPath(SCENE_W / 2 - 150, HUD_H - 8, 300 * k, 6, 3); ctx.fill();
}

function drawTutorial() {
  const st = S.tut.step;
  if (st === 0) {
    spot([{ x: ORDER.x, y: ORDER.y, w: ORDER.w, h: ORDER.h }], .78);
    const h = tutCard(80, 210, 520,
      ['سفارش می‌گوید از هر چیز چقدر.', 'کنارِ هر مقدار، یک نوارِ خط‌کشی‌شده هست.'], 'کارگاهِ شیشهٔ رنگی');
    tutMore(340, 210 + h + 8, S.t, P.ink);
  } else if (st === 1) {
    spot([{ x: ROSE.x - ROSE.r - 30, y: ROSE.y - ROSE.r - 30, w: ROSE.r * 2 + 60, h: ROSE.r * 2 + 60 },
          { x: RACK.x, y: RACK.y, w: RACK.w, h: RACK.h }], .74);
    tutCard(300, 96, 600, ['شیشه را از قفسه بردار و در قسمت‌های پنجره بگذار.',
      'هر شیشه که می‌گذاری، یک دسته از نوار روشن می‌شود.']);
  } else {
    spot([{ x: ORDER.x, y: ORDER.y, w: ORDER.w, h: ORDER.h }], .74);
    const h = tutCard(60, 150, 540,
      ['نوار که پُر شد، آن سفارش جور است.', 'روی شیشهٔ گذاشته‌شده بزنی، برمی‌داری.',
       'پنجره که کامل شود، آفتاب می‌تابد.'], 'نوار را نگاه کن');
    tutMore(330, 150 + h + 8, S.t, P.ink);
  }
}

/* ───────── پرده‌ها ───────── */

function roseIcon(x, y) {
  const r = 32, n = 8;
  for (let i = 0; i < n; i++) {
    const a0 = -Math.PI / 2 + i / n * TAU, a1 = a0 + TAU / n;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, r, a0, a1); ctx.closePath();
    ctx.fillStyle = GLASS[i % 4].c; ctx.fill();
    ctx.strokeStyle = P.leadDk; ctx.lineWidth = 3; ctx.stroke();
  }
  ctx.fillStyle = P.brass;
  ctx.beginPath(); ctx.arc(x, y, 8, 0, TAU); ctx.fill();
}

function drawIntro() {
  overlay({
    t: S.phaseT, w: 800, h: 300, y: 128,
    paper: P.paper, band: P.brassDk, ink: P.ink, inkSoft: '#7a6a52',
    icon: roseIcon,
    title: 'کارگاهِ شیشهٔ رنگی',
    body: 'پنجرهٔ کارگاه چند قسمت دارد و سفارش می‌گوید از هر چیز چقدر.\nکنارِ هر مقدار یک نوارِ خط‌کشی‌شده هست؛ هر شیشه که می‌گذاری،\nیک دسته از آن نوار روشن می‌شود. نوارها که پُر شوند، آفتاب می‌تابد.',
    btn: BTN_GO, btnLabel: 'کارگاه را باز کن', btnHot: S.hover === BTN_GO,
    btnFill: '#8f7327', btnHotFill: '#b08f38',
  });
}

function drawWon() {
  const last = S.level + 1 >= LEVELS.length;
  overlay({
    t: S.phaseT, w: 720, h: 250, y: 160,
    paper: P.paper, band: P.gold, ink: P.ink, inkSoft: '#7a6a52',
    icon: roseIcon,
    title: L().endless ? 'آفتاب رفت' : 'همهٔ پنجره‌ها ساخته شد!',
    body: 'امتیاز: ' + fa(S.score) + (last ? '\nهمهٔ کارگاه‌ها را گرداندی. از اوّل؟' : ''),
    btn: BTN_GO, btnLabel: last ? 'دوباره' : 'سفارشِ بعد', btnHot: S.hover === BTN_GO,
    btnFill: '#8f7327', btnHotFill: '#b08f38',
  });
}

function drawLost() {
  overlay({
    t: S.phaseT, w: 720, h: 250, y: 160,
    paper: P.paper, band: P.bad, ink: P.ink, inkSoft: '#7a6a52',
    icon: (x, y) => {
      ctx.fillStyle = GLASS[0].d;
      ctx.beginPath(); ctx.moveTo(x - 40, y + 20); ctx.lineTo(x - 14, y - 18); ctx.lineTo(x - 2, y + 20); ctx.closePath(); ctx.fill();
      ctx.fillStyle = GLASS[1].d;
      ctx.beginPath(); ctx.moveTo(x + 4, y + 20); ctx.lineTo(x + 24, y - 12); ctx.lineTo(x + 40, y + 20); ctx.closePath(); ctx.fill();
      roseIcon(x + 74, y + 2);
    },
    title: 'شیشه‌ها تمام شد',
    body: 'امتیاز: ' + fa(S.score) + '\nنوارِ کنارِ سفارش می‌گوید چند دسته مانده.',
    btn: BTN_GO, btnLabel: 'دوباره', btnHot: S.hover === BTN_GO,
    btnFill: '#8f7327', btnHotFill: '#b08f38',
  });
}
