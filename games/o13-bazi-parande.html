<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#cfe6ee">
<title>از تخم تا پرنده — چرخهٔ زندگی (بازی)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>
  /* صفحه نباید هیچ‌جا اسکرول یا زوم شود؛ بازی باید مثل یک برنامه رفتار کند. */
  html, body {
    margin: 0; padding: 0; background: #cfe6ee;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body {
    position: fixed; inset: 0;          /* جلوی کشیده‌شدنِ صفحه در سافاریِ گوشی */
    width: 100%; height: 100vh; height: 100dvh;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none; -webkit-touch-callout: none;
  }

  /* گوشیِ عمودی صحنه را ریز می‌کند؛ بچه باید گوشی را بچرخاند. */
  #rotate { display: none; }
  @media (orientation: portrait) and (max-width: 860px) {
    #stage { display: none; }
    #rotate {
      display: flex; position: fixed; inset: 0;
      z-index: 9;
      flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      background: #cfe6ee; color: #f6ead2;
      font: 700 20px "Vazirmatn", Tahoma, sans-serif; text-align: center; padding: 32px;
    }
    #rotate svg { animation: tilt 2.4s ease-in-out infinite; }
    @keyframes tilt { 0%, 45% { transform: rotate(0deg); } 65%, 100% { transform: rotate(-90deg); } }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="rotate">
  <svg width="86" height="126" viewBox="0 0 86 126" fill="none" aria-hidden="true">
    <rect x="3" y="3" width="80" height="120" rx="12" stroke="#e8b448" stroke-width="5"/>
    <rect x="15" y="19" width="56" height="88" rx="5" fill="#e8b448" opacity=".28"/>
    <circle cx="43" cy="115" r="4" fill="#e8b448"/>
  </svg>
  <div>گوشی را بچرخان</div>
  <div style="font-weight:400;opacity:.7;font-size:16px">این بازی خوابیده بازی می‌شود</div>
</div>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   هستهٔ مشترکِ بازی‌ها — سبک «کاغذبُری»
   ───────────────────────────────────────────────────────────────────────
   این فایل جعبه‌ابزار است، نه چارچوب: هر بازی حلقه و وضعیت خودش را دارد
   و فقط از این توابع برای کشیدن استفاده می‌کند. دلیلش این است که هر بازی
   باید حس‌وحال خودش را داشته باشد، نه اینکه همه شبیه هم دربیایند.

   قاعده‌های ثابتِ تصویری:
   • نور همیشه از بالا-چپ می‌تابد، پس سایه‌ها به پایین-راست می‌افتند.
   • هیچ لبه‌ای کاملاً صاف نیست؛ همه کمی موج دارند (انگار با قیچی بریده).
   • هیچ خاکستریِ خالصی نداریم؛ همه‌ی خنثی‌ها به گرمیِ صحنه می‌زنند.
   • یک لایه‌ی دانه‌دانه‌ی کاغذ روی کلِ تصویر ضرب می‌شود.
   ═══════════════════════════════════════════════════════════════════════ */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const FA_D = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
const fa = (n) => String(n).replace(/\d/g, (d) => FA_D[+d]);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeIn = (t) => t * t * t;
const easeInOut = (t) => (t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2);
const easeBack = (t) => 1 + 2.7 * Math.pow(t-1, 3) + 1.7 * Math.pow(t-1, 2);
const easeElastic = (t) => t === 0 || t === 1 ? t : Math.pow(2, -9*t) * Math.sin((t*10 - .75) * 2.094) + 1;

/** تصادفِ تکرارپذیر: با یک بذر همیشه همان عدد. برای اینکه تزئین‌ها هر فریم نپرند. */
function noise1(x) {
  const s = Math.sin(x * 127.1) * 43758.5453;
  return s - Math.floor(s);
}
const pick = (arr, seed) => arr[Math.floor(noise1(seed) * arr.length) % arr.length];

/* ───────── بوم و صحنهٔ ثابت ───────── */

let ctx, SW, SH, CV, _refit = null;
let view = { scale: 1, ox: 0, oy: 0, w: 0, h: 0, dpr: 1 };
let _grain = null, _grainDark = null;

function initStage(canvas, w, h) {
  CV = canvas; SW = w; SH = h;
  ctx = canvas.getContext('2d');

  /* اندازه را از خودِ بوم می‌گیریم نه از innerHeight؛ چون در سافاریِ گوشی
     نوارِ آدرس باز و بسته می‌شود و innerHeight دروغ می‌گوید. */
  const fit = () => {
    const r = canvas.getBoundingClientRect();
    const vw = Math.round(r.width), vh = Math.round(r.height);
    if (vw < 20 || vh < 20) return;
    const dpr = Math.min(devicePixelRatio || 1, QUALITY > 0 ? 2 : 1);
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    const scale = Math.min(vw / SW, vh / SH);
    view = { scale, ox: (vw - SW*scale)/2, oy: (vh - SH*scale)/2, w: vw, h: vh, dpr };
    _grain = buildGrain();
  };
  _refit = fit;
  addEventListener('resize', fit);
  /* چرخاندنِ گوشی: اندازهٔ درست چند لحظه بعد می‌رسد، پس چندبار اندازه می‌گیریم. */
  addEventListener('orientationchange', () => {
    fit(); setTimeout(fit, 140); setTimeout(fit, 460);
  });
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(canvas);

  /* صدا در گوشی فقط بعد از اوّلین لمس اجازهٔ پخش دارد. */
  const unlock = () => { sfx._c(); removeEventListener('pointerdown', unlock); removeEventListener('touchstart', unlock); };
  addEventListener('pointerdown', unlock, { passive: true });
  addEventListener('touchstart', unlock, { passive: true });
  /* نگه‌داشتنِ انگشت نباید منوی مرورگر را باز کند. */
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  fit();
  return ctx;
}

/** قابِ صحنه را باز می‌کند: بعد از این، مختصات همیشه در فضای SW×SH است. */
function beginScene(bg) {
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, view.w, view.h);
  ctx.save();
  ctx.translate(view.ox, view.oy);
  ctx.scale(view.scale, view.scale);
  ctx.beginPath();
  ctx.rect(0, 0, SW, SH);
  ctx.clip();
}

/* ───────── پوششِ پایانِ قاب ─────────
   دانه‌های کاغذ و تیرگیِ گوشه‌ها هر دو ثابت‌اند و تغییر نمی‌کنند، ولی
   قبلاً هر فریم از نو کشیده می‌شدند: یکی با «multiply» روی کلِّ صفحه و
   یکی با یک گرادیانِ شعاعیِ تازه. اندازه‌گیری نشان داد همین دو تا
   ۱۱ تا ۱۶ میلی‌ثانیه از هر فریم را می‌خوردند — بیشتر از کشیدنِ خودِ
   صحنه. حالا یک بار در یک بومِ جدا پخته می‌شوند و هر فریم فقط یک
   drawImage است.                                                       */

let _ovl = null, _ovlKey = '';

function overlayLayer(grainAlpha, vignette) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const w = Math.max(2, Math.round(SW * q)), h = Math.max(2, Math.round(SH * q));
  const key = w + 'x' + h + '|' + grainAlpha + '|' + vignette;
  if (_ovl && _ovlKey === key) return _ovl;
  let c;
  try {
    c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g2 = c.getContext('2d');
    if (!g2) return null;
    if (_grainDark && grainAlpha > 0) {
      /* همان دانه‌ها، ولی به‌جای multiply به شکلِ سیاهِ کم‌رنگ */
      g2.globalAlpha = clamp(grainAlpha * 1.15, 0, 1);
      g2.fillStyle = g2.createPattern(_grainDark, 'repeat');
      g2.fillRect(0, 0, w, h);
      g2.globalAlpha = 1;
    }
    if (vignette) {
      const g = g2.createRadialGradient(w / 2, h / 2, h * .42, w / 2, h / 2, h * 1.05);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, vignette);
      g2.fillStyle = g;
      g2.fillRect(0, 0, w, h);
    }
  } catch (e) { return null; }
  _ovl = c; _ovlKey = key;
  return c;
}

/** بافتِ کاغذ، تیرگیِ گوشه‌ها، رنگ‌بندی و درخششِ نور را می‌گذارد و قاب را می‌بندد. */
function endScene(grainAlpha = .15, vignette = 'rgba(48,28,14,.30)', bloom = .34, grade = .14) {
  /* درخششِ نور خاموش است. اندازه‌گیری نشان داد هر فریم ۲۱ میلی‌ثانیه
     می‌گیرد — بیشتر از تمامِ کارهای دیگرِ یک فریم روی هم — چون برای
     ساختنش باید کلِّ بوم دوباره خوانده شود. از آن بدتر: متنِ فارسی را
     مه‌آلود می‌کرد و خواندنش را سخت‌تر. بی‌آن، صحنه تمیزتر است. */
  bloom = 0;
  if (QUALITY < 1) { grade = 0; grainAlpha *= .5; }
  if (QUALITY < 2) grade = 0;
  if (grade > 0) {
    /* رنگ‌بندیِ نرم: بالای صحنه گرم‌تر، پایین سردتر — عمق می‌دهد */
    const g = ctx.createLinearGradient(0, 0, 0, SH);
    g.addColorStop(0, `rgba(255, 214, 150, ${grade})`);
    g.addColorStop(.55, 'rgba(255, 255, 255, 0)');
    g.addColorStop(1, `rgba(40, 60, 110, ${grade * .9})`);
    ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalCompositeOperation = 'source-over';
  }
  const ov = (grainAlpha > 0 || vignette) ? overlayLayer(grainAlpha, vignette) : null;
  if (ov) ctx.drawImage(ov, 0, 0, SW, SH);
  ctx.restore();
  bloomPass(bloom);
}

/* ───────── درخششِ نور (bloom) ─────────
   قابِ رسم‌شده را کوچک می‌کنیم، دو بار در خودش ضرب می‌کنیم تا فقط
   روشن‌ها بمانند، محوش می‌کنیم و با حالتِ «lighter» رویش می‌گذاریم.
   نتیجه: چراغ‌ها، شعله‌ها و رنگ‌های روشن نور پخش می‌کنند. */
let _bl, _blc, _bl2, _bl2c, _blNo = false, _blTick = 0;

function bloomPass(amount) {
  if (!amount || _blNo || !CV.width) return;
  /* کوچک‌کردن و بزرگ‌کردنِ دوباره، خودش محو می‌کند — از filter خیلی ارزان‌تر است */
  const W = Math.max(4, Math.round(CV.width * .2)), H = Math.max(4, Math.round(CV.height * .2));
  const W2 = Math.max(2, Math.round(W * .28)), H2 = Math.max(2, Math.round(H * .28));
  try {
    if (!_bl) {
      _bl = document.createElement('canvas'); _blc = _bl.getContext('2d');
      _bl2 = document.createElement('canvas'); _bl2c = _bl2.getContext('2d');
      if (!_blc || !_bl2c) { _blNo = true; return; }
    }
    if (_bl.width !== W || _bl.height !== H) { _bl.width = W; _bl.height = H; }
    if (_bl2.width !== W2 || _bl2.height !== H2) { _bl2.width = W2; _bl2.height = H2; }
    /* ساختنِ نور یک قاب در میان کافی است؛ گذاشتنش هر قاب. */
    _blTick = (_blTick + 1) & 1;
    if (!_blTick) {
      _blc.globalCompositeOperation = 'source-over';
      _blc.clearRect(0, 0, W, H);
      _blc.drawImage(CV, 0, 0, W, H);
      _blc.globalCompositeOperation = 'multiply';
      _blc.drawImage(_bl, 0, 0);
      _blc.drawImage(_bl, 0, 0);
      _blc.globalCompositeOperation = 'source-over';
      _bl2c.clearRect(0, 0, W2, H2);
      _bl2c.drawImage(_bl, 0, 0, W2, H2);
    }

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = amount;
    ctx.drawImage(_bl2, 0, 0, CV.width, CV.height);
    ctx.restore();
  } catch (e) { _blNo = true; }
}

/* ───────── لایهٔ ثابت ─────────
   هرچه در صحنه تکان نمی‌خورد را یک‌بار می‌کشیم و بعد فقط کپی می‌کنیم. */
const _layers = {};
function staticLayer(key, w, h, paint) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const L = _layers[key];
  if (L && L.q === q && L.w === w && L.h === h) return L.cv;
  const off = document.createElement('canvas');
  off.width = Math.max(1, Math.round(w * q));
  off.height = Math.max(1, Math.round(h * q));
  const c = off.getContext('2d');
  c.setTransform(q, 0, 0, q, 0, 0);
  const prev = ctx;
  ctx = c;
  try { paint(); } finally { ctx = prev; }
  _layers[key] = { cv: off, q, w, h };
  return off;
}

/* ───────── نورپردازی و بافت ─────────
   کارِ این‌ها این است که هیچ سطحی «تختِ یک‌رنگ» نماند. */

/** شیبِ عمودی: بالا روشن، پایین تیره. */
function vgrad(y0, y1, top, bot) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, top); g.addColorStop(1, bot);
  return g;
}

/** حجمِ کروی: نور از بالا-چپ، سایه در پایین-راست. */
function ball(cx, cy, r, lit, base, dark) {
  const g = ctx.createRadialGradient(cx - r * .38, cy - r * .42, r * .06, cx, cy, r * 1.06);
  g.addColorStop(0, lit); g.addColorStop(.45, base); g.addColorStop(1, dark);
  return g;
}

/** لبهٔ روشنِ بالا-چپِ یک مسیر — همان «rim light». */
function rim(pathFn, col, w = 2.2) {
  ctx.save();
  ctx.beginPath(); pathFn();
  ctx.clip();
  ctx.beginPath(); pathFn();
  ctx.strokeStyle = col; ctx.lineWidth = w * 2; ctx.lineJoin = 'round';
  ctx.translate(-w * .5, -w * .6);
  ctx.stroke();
  ctx.restore();
}

/** سایهٔ چسبیده به زمین — چیزها را روی سطح می‌نشاند. */
function contact(cx, cy, rx, ry, alpha = .26) {
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
  g.addColorStop(0, `rgba(20, 12, 6, ${alpha})`);
  g.addColorStop(1, 'rgba(20, 12, 6, 0)');
  ctx.save();
  ctx.fillStyle = g;
  ctx.translate(cx, cy); ctx.scale(1, ry / Math.max(rx, ry));
  ctx.beginPath(); ctx.arc(0, 0, Math.max(rx, ry), 0, TAU); ctx.fill();
  ctx.restore();
}

const _tex = {};
/** بافتِ تکرارشونده؛ یک‌بار ساخته و بعد از حافظه خوانده می‌شود. */
function texture(key, w, h, paint) {
  if (_tex[key]) return _tex[key];
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const c = off.getContext('2d');
  paint(c, w, h);
  _tex[key] = ctx.createPattern(off, 'repeat');
  return _tex[key];
}

/** رگهٔ چوب. */
function texWood(base, grain) {
  return texture('w' + base + grain, 120, 120, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = grain; c.lineWidth = 1.4;
    for (let i = 0; i < 9; i++) {
      c.globalAlpha = .18 + noise1(i * 3.1) * .3;
      c.beginPath();
      const y0 = i * 14 + noise1(i) * 6;
      c.moveTo(0, y0);
      for (let x = 0; x <= w; x += 10) c.lineTo(x, y0 + Math.sin(x * .09 + i) * 2.6);
      c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** تارِ پارچه. */
function texCloth(base, thread) {
  return texture('c' + base + thread, 16, 16, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = thread; c.lineWidth = 1; c.globalAlpha = .5;
    for (let i = 0; i < w; i += 4) {
      c.beginPath(); c.moveTo(i, 0); c.lineTo(i, h); c.stroke();
      c.beginPath(); c.moveTo(0, i); c.lineTo(w, i); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** دانه‌های سنگ. */
function texStone(base, spec) {
  return texture('s' + base + spec, 90, 90, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) {
      c.globalAlpha = .05 + noise1(i * 1.7) * .16;
      c.fillStyle = spec;
      const r = .6 + noise1(i * 5.3) * 1.9;
      c.beginPath();
      c.arc(noise1(i * 2.1) * w, noise1(i * 3.7 + 1) * h, r, 0, TAU);
      c.fill();
    }
    c.globalAlpha = 1;
  });
}

/** الیافِ کاغذ. */
function texPaper(base) {
  return texture('p' + base, 100, 100, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 130; i++) {
      c.globalAlpha = .04 + noise1(i * 2.3) * .07;
      c.strokeStyle = i % 2 ? '#ffffff' : '#5a4326';
      c.lineWidth = .9;
      const x = noise1(i * 1.3) * w, y = noise1(i * 4.1 + 2) * h;
      const a = noise1(i * 7.7) * TAU, l = 4 + noise1(i * 9.1) * 12;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

function buildGrain() {
  const s = 260;
  const off = document.createElement('canvas');
  off.width = off.height = s;
  const c = off.getContext('2d');
  const img = c.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    const v = 214 + Math.random() * 41;
    img.data[i*4] = v; img.data[i*4+1] = v; img.data[i*4+2] = v; img.data[i*4+3] = 255;
  }
  c.putImageData(img, 0, 0);
  /* همان دانه‌ها به شکلِ سیاهِ کم‌رنگ، تا بشود بدونِ multiply گذاشتشان */
  const d = document.createElement('canvas');
  d.width = d.height = s;
  const dc = d.getContext('2d');
  const dimg = dc.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    dimg.data[i*4] = 0; dimg.data[i*4+1] = 0; dimg.data[i*4+2] = 0;
    dimg.data[i*4+3] = 255 - img.data[i*4];
  }
  dc.putImageData(dimg, 0, 0);
  _grainDark = d;
  _ovl = null; _ovlKey = '';
  return ctx.createPattern(off, 'repeat');
}

function toStage(e) {
  const r = CV.getBoundingClientRect();
  return {
    x: (e.clientX - r.left - view.ox) / view.scale,
    y: (e.clientY - r.top - view.oy) / view.scale,
  };
}

const inRect = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
const inCircle = (p, b, pad = 0) => Math.hypot(p.x - b.x, p.y - b.y) <= b.r + pad;

/* ───────── قلم‌های کاغذبُری ───────── */

/** دایره‌ای که انگار با قیچی بریده شده. */
function wobbleCircle(cx, cy, r, seed = 0, amp = 2.2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const rr = r + Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp * .45;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** بیضیِ ناصاف — برای چیزهایی که گرد نیستند ولی نرم‌اند. */
function wobbleEllipse(cx, cy, rx, ry, rot = 0, seed = 0, amp = 2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const w = 1 + (Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp*.45) / Math.max(rx, ry);
    const px = Math.cos(a) * rx * w, py = Math.sin(a) * ry * w;
    const x = cx + px*Math.cos(rot) - py*Math.sin(rot);
    const y = cy + px*Math.sin(rot) + py*Math.cos(rot);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** مستطیلِ گِرد با گوشه‌های کمی کج. */
function wobbleRect(x, y, w, h, r = 12, seed = 0, amp = 1.6) {
  const j = (k) => (noise1(seed*9.7 + k) - .5) * amp * 2;
  ctx.beginPath();
  ctx.moveTo(x + r + j(1), y + j(2));
  ctx.lineTo(x + w - r + j(3), y + j(4));
  ctx.quadraticCurveTo(x + w + j(5), y + j(6), x + w + j(7), y + r + j(8));
  ctx.lineTo(x + w + j(9), y + h - r + j(10));
  ctx.quadraticCurveTo(x + w + j(11), y + h + j(12), x + w - r + j(13), y + h + j(14));
  ctx.lineTo(x + r + j(15), y + h + j(16));
  ctx.quadraticCurveTo(x + j(17), y + h + j(18), x + j(19), y + h - r + j(20));
  ctx.lineTo(x + j(21), y + r + j(22));
  ctx.quadraticCurveTo(x + j(23), y + j(24), x + r + j(1), y + j(2));
  ctx.closePath();
}

/** سایهٔ نرم؛ نور از بالا-چپ. */
function withShadow(blur, dy, alpha, fn, hue = '78, 46, 24') {
  ctx.save();
  ctx.shadowColor = `rgba(${hue}, ${alpha})`;
  ctx.shadowBlur = blur;
  ctx.shadowOffsetY = dy;
  ctx.shadowOffsetX = dy * .35;
  fn();
  ctx.restore();
}

/** یک برگه‌ی کاغذ با سایه — پایه‌ی همه‌ی کارت‌ها و تابلوها. */
function paper(x, y, w, h, fill, seed = 1, r = 12, shadow = .26) {
  withShadow(16, 7, shadow, () => {
    ctx.fillStyle = fill;
    wobbleRect(x, y, w, h, r, seed, 2);
    ctx.fill();
  });
  /* الیافِ کاغذ و لبهٔ روشن، تا سطح تخت نماند */
  ctx.save();
  ctx.beginPath(); wobbleRect(x, y, w, h, r, seed, 2); ctx.clip();
  ctx.globalAlpha = .5;
  ctx.fillStyle = texPaper(fill);
  ctx.fillRect(x, y, w, h);
  ctx.globalAlpha = 1;
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.4, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(90,60,20,.1)');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
}

function text(str, x, y, o = {}) {
  const size = o.size || 20;
  const fam = o.family || 'Vazirmatn';
  ctx.save();
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.font = `${fam === 'Lalezar' ? '400' : (o.weight || 700)} ${size}px "${fam}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.baseline || 'middle';
  ctx.fillStyle = o.color || '#43291b';
  ctx.direction = 'rtl';
  if (o.stroke) {
    ctx.lineWidth = o.strokeWidth || 5;
    ctx.strokeStyle = o.stroke;
    ctx.lineJoin = 'round';
    ctx.strokeText(str, x, y, o.maxWidth);
  }
  ctx.fillText(str, x, y, o.maxWidth);
  ctx.restore();
}

/** متنِ چندخطی که خودش می‌شکند. ارتفاعِ اشغال‌شده را برمی‌گرداند. */
function textWrap(str, x, y, maxW, o = {}) {
  const size = o.size || 19, lh = o.lineHeight || size * 1.7;
  ctx.font = `${o.weight || 700} ${size}px "${o.family || 'Vazirmatn'}", Tahoma, sans-serif`;
  const lines = [];
  for (const para of str.split('\n')) {
    let line = '';
    for (const wd of para.split(' ')) {
      const t = line ? line + ' ' + wd : wd;
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = wd; }
      else line = t;
    }
    lines.push(line);
  }
  lines.forEach((l, i) => text(l, x, y + i * lh, o));
  return lines.length * lh;
}

/* ───────── ذره‌ها ───────── */

class Bits {
  constructor() { this.list = []; }
  add(x, y, n, kind, colors, opts = {}) {
    for (let i = 0; i < n; i++) {
      const a = opts.dir !== undefined ? opts.dir + (Math.random()-.5) * (opts.spread || 1) : Math.random() * TAU;
      const sp = (opts.speed || 200) * (.4 + Math.random());
      this.list.push({
        kind, x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - (opts.lift || 0),
        r: (opts.size || 4) * (.5 + Math.random()),
        rot: Math.random() * TAU, vr: (Math.random()-.5) * 10,
        col: colors[(Math.random() * colors.length) | 0],
        grav: opts.grav === undefined ? 620 : opts.grav,
        drag: opts.drag || .995,
        life: (opts.life || .9) * (.6 + Math.random() * .8), age: 0,
      });
    }
  }
  confetti(x, y, n, colors) {
    this.add(x, y, n, 'flake', colors, { speed: 420, lift: 190, size: 5, life: 1.6, grav: 780 });
  }
  spark(x, y, n, colors) {
    this.add(x, y, n, 'dot', colors, { speed: 180, lift: 30, size: 3.4, life: .7, grav: 260, drag: .93 });
  }
  step(dt) {
    for (const p of this.list) {
      p.age += dt;
      p.vy += p.grav * dt;
      p.vx *= p.drag; p.vy *= p.drag;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    }
    this.list = this.list.filter((p) => p.age < p.life);
  }
  draw() {
    for (const p of this.list) {
      const k = clamp(1 - p.age / p.life, 0, 1);
      ctx.save();
      ctx.globalAlpha = k;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.col;
      if (p.kind === 'flake') ctx.fillRect(-p.r, -p.r*1.5, p.r*2, p.r*3);
      else if (p.kind === 'leaf') { wobbleEllipse(0, 0, p.r*1.8, p.r*.8, 0, p.r, .6); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(0, 0, p.r * k, 0, TAU); ctx.fill(); }
      ctx.restore();
    }
  }
  clear() { this.list.length = 0; }
}

/* ───────── صدا (بدون فایل صوتی) ───────── */

const sfx = {
  ac: null, on: true,
  _c() {
    if (!this.on) return null;
    if (!this.ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; this.ac = new A(); }
    if (this.ac.state === 'suspended') this.ac.resume();
    return this.ac;
  },
  tone(f, dur = .16, type = 'sine', gain = .13, delay = 0) {
    const c = this._c(); if (!c) return;
    const t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(t0 + dur + .04);
  },
  tap()  { this.tone(430, .07, 'triangle', .09); },
  place(){ this.tone(620, .11, 'sine', .12); },
  pop()  { this.tone(760, .09, 'sine', .11); },
  slide(){ this.tone(240, .22, 'sine', .07); },
  good() { [523, 659, 784].forEach((f,i) => this.tone(f, .22, 'sine', .13, i*.07)); },
  win()  { [523, 659, 784, 1047].forEach((f,i) => this.tone(f, .34, 'triangle', .13, i*.10)); },
  nope() { this.tone(180, .2, 'sawtooth', .07); },
  tick() { this.tone(1100, .04, 'square', .05); },
};

/* ───────── قطعه‌های آماده ───────── */

function star(x, y, r, col, rot = 0) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = col;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI/2 + i * Math.PI/5;
    const rr = i % 2 ? r * .45 : r;
    const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/** دکمهٔ کاغذی. hovered را خودِ بازی می‌دهد؛ اینجا فقط کشیده می‌شود. */
/** رنگ را روشن‌تر (k>0) یا تیره‌تر (k<0) می‌کند. */
function shade(col, k) {
  const c = String(col).trim();
  let r, g2, b2;
  if (c[0] === '#') {
    const h = c.length === 4 ? c[1]+c[1]+c[2]+c[2]+c[3]+c[3] : c.slice(1, 7);
    r = parseInt(h.slice(0,2), 16); g2 = parseInt(h.slice(2,4), 16); b2 = parseInt(h.slice(4,6), 16);
  } else {
    const m = c.match(/[\d.]+/g);
    if (!m || m.length < 3) return col;
    r = +m[0]; g2 = +m[1]; b2 = +m[2];
  }
  const f = (v) => Math.round(clamp(k < 0 ? v * (1 + k) : v + (255 - v) * k, 0, 255));
  return 'rgb(' + f(r) + ',' + f(g2) + ',' + f(b2) + ')';
}

function button(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 3 : 0;
  const fill = o.disabled ? (o.off || '#bcaa92') : (hot ? (o.hotFill || o.fill) : o.fill);
  const r = o.r === undefined ? 14 : o.r;
  /* لبهٔ زیرینِ تیره — دکمه از صفحه بیرون می‌زند */
  ctx.fillStyle = shade(fill, -.36);
  wobbleRect(b.x, b.y + dy + 7, b.w, b.h, r, b.x + b.y, 2);
  ctx.fill();
  withShadow(hot ? 22 : 14, hot ? 5 : 8, .32, () => {
    ctx.fillStyle = fill;
    wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2);
    ctx.fill();
  });
  /* حجم: روشن از بالا، تیره به پایین */
  ctx.save();
  ctx.beginPath(); wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2); ctx.clip();
  const g = ctx.createLinearGradient(0, b.y + dy, 0, b.y + dy + b.h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.45, 'rgba(255,255,255,.04)');
  g.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = g;
  ctx.fillRect(b.x, b.y + dy, b.w, b.h);
  /* برقِ باریکِ لبهٔ بالا */
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.fillRect(b.x + r, b.y + dy + 2, b.w - r * 2, 2);
  ctx.restore();
  text(label, b.x + b.w/2, b.y + b.h/2 + dy - (o.sub ? 9 : 0), {
    size: o.size || 26, color: o.color || '#fdf6e8', family: o.family || 'Lalezar',
  });
  if (o.sub) text(o.sub, b.x + b.w/2, b.y + b.h/2 + dy + 17,
    { size: 14, color: o.subColor || 'rgba(255,255,255,.88)' });
}

/** دکمهٔ گرد کوچک (مثل + و −). */
function roundButton(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 2 : 0;
  withShadow(10, hot ? 3 : 5, .3, () => {
    ctx.fillStyle = o.disabled ? '#cbbba3' : (hot ? (o.hotFill || o.fill) : o.fill);
    wobbleCircle(b.x, b.y + dy, b.r, b.x, 1.4);
    ctx.fill();
  });
  text(label, b.x, b.y + dy - 1,
    { size: o.size || 32, color: o.disabled ? '#a8988a' : (o.color || '#fdf6e8'), family: 'Lalezar' });
}

/** پرده‌ی تمام‌صفحه: برای شروعِ پرده و برای جشنِ پایان. */
function overlay(o) {
  const k = easeOut(clamp(o.t / .5, 0, 1));
  ctx.fillStyle = `rgba(30, 22, 16, ${.66 * k})`;
  ctx.fillRect(0, 0, SW, SH);

  const w = o.w || 700, h = o.h || 290;
  const x = (SW - w) / 2, y = o.y || (SH * .22);
  const s = lerp(.9, 1, easeBack(clamp(o.t / .65, 0, 1)));
  ctx.save();
  ctx.translate(SW/2, y + h/2);
  ctx.scale(s, s);
  ctx.translate(-SW/2, -(y + h/2));

  withShadow(30, 14, .42, () => {
    ctx.fillStyle = o.paper || '#fbf3e2';
    wobbleRect(x, y, w, h, 18, 121, 2.4);
    ctx.fill();
  });
  ctx.fillStyle = o.band || '#c8434f';
  wobbleRect(x, y, w, 12, 6, 123, 1);
  ctx.fill();

  if (o.icon) o.icon(SW/2, y + 56);
  text(o.title, SW/2, y + (o.icon ? 108 : 62),
    { size: o.titleSize || 36, color: o.ink || '#43291b', family: 'Lalezar', alpha: k });
  textWrap(o.body, SW/2, y + (o.icon ? 158 : 116), w - 90,
    { size: 19, color: o.inkSoft || '#8a6a52', alpha: k });
  ctx.restore();

  button(o.btn, o.btnLabel, { hot: o.btnHot, fill: o.btnFill || '#7fa356', hotFill: o.btnHotFill || '#8fb45f', size: 28 });
}

/** پیامِ کوتاهِ بالای صحنه. */
class Toast {
  constructor() { this.msg = null; this.t = 0; this.kind = 'info'; }
  say(msg, kind = 'info') { this.msg = msg; this.kind = kind; this.t = 2.6; }
  step(dt) { if (this.t > 0) { this.t -= dt; if (this.t <= 0) this.msg = null; } }
  draw(y = 24, colors = {}) {
    if (!this.msg) return;
    const k = clamp(this.t, 0, 1) * clamp((2.6 - this.t) * 5, 0, 1);
    ctx.save();
    ctx.globalAlpha = k;
    ctx.font = `700 19px "Vazirmatn", Tahoma, sans-serif`;
    const w = ctx.measureText(this.msg).width + 76;
    const fill = this.kind === 'good' ? (colors.good || '#7fa356')
               : this.kind === 'bad' ? (colors.bad || '#c8434f')
               : (colors.info || '#fbf3e2');
    paper(SW/2 - w/2, y, w, 48, fill, 151, 12, .3);
    text(this.msg, SW/2, y + 25,
      { size: 19, color: this.kind === 'info' ? (colors.ink || '#43291b') : '#fff8ec' });
    ctx.restore();
  }
}

/* ───────── آموزشِ پرده‌ای ─────────
   پرده‌هایی که منتظرِ کارِ بچه نیستند با یک ضربه جلو می‌روند. تایمر فقط
   پشتیبان است؛ بچهٔ کلاس سومی باید فرصتِ خواندن داشته باشد، نه اینکه
   متن قبل از تمام شدنِ خواندنش برود.                                    */

/** اگر پردهٔ فعلی خواندنی است، ضربه را می‌خورد و می‌رود پردهٔ بعد. */
function tutTap(tut, tapSteps, lastStep) {
  if (!tut.on || tapSteps.indexOf(tut.step) < 0) return false;
  if (tut.step >= lastStep) tut.on = false;
  else { tut.step++; tut.t = 0; }
  sfx.tap();
  return true;
}

/** نشانهٔ «برای ادامه بزن» — زیرِ کارتِ آموزش. */
function tutMore(cx, y, t, ink = '#3a2a18', bg = 'rgba(255, 250, 238, .94)') {
  ctx.save();
  ctx.globalAlpha = .62 + .38 * Math.sin(t * 3.2);
  ctx.font = '700 15px "Vazirmatn", Tahoma, sans-serif';
  const label = 'برای ادامه، هرجا را بزن';
  const w = ctx.measureText(label).width + 40, h = 32, x = cx - w / 2, r = 16;
  withShadow(10, 4, .3, () => {
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath(); ctx.fill();
  });
  text(label, cx, y + h / 2, { size: 15, color: ink });
  ctx.restore();
}

/** فونت‌ها را می‌آورد و بعد بازی را شروع می‌کند.
    مهم: هر دو راه (رسیدنِ فونت و مهلتِ پشتیبان) ممکن است برسند، ولی
    شروع فقط باید یک بار انجام شود؛ وگرنه دو حلقهٔ فریم راه می‌افتد و
    بازی دوبرابر سریع می‌شود. */
function whenFontsReady(start) {
  let done = false;
  const go = () => { if (done) return; done = true; start(); };
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('400 40px Lalezar'),
      document.fonts.load('700 20px Vazirmatn'),
      document.fonts.load('900 20px Vazirmatn'),
    ]).then(go, go);
    setTimeout(go, 2600);
  } else go();
}

/** حلقهٔ فریم با dtِ محدودشده. */
/* ───────── کیفیتِ خودکار ─────────
   اگر دستگاه کُند بود، اوّل درخشش و بعد رنگ‌بندی خاموش می‌شود تا بازی
   روان بماند. روی دستگاهِ قوی همه‌چیز روشن است. */
let QUALITY = 2;
let _fAcc = 0, _fN = 0, _qHold = 0;

function _qualityTick(gap) {
  if (gap <= 0 || gap > 200) return;
  _fAcc += gap; _fN++;
  if (_fN < 45) return;
  const avg = _fAcc / _fN;
  _fAcc = 0; _fN = 0;
  if (_qHold > 0) { _qHold--; return; }
  /* فاصلهٔ بالا و پایین باید باز باشد، وگرنه کیفیت بین دو پله بالا و
     پایین می‌پرد و بازی مدام تغییرِ ظاهر می‌دهد. */
  const before = QUALITY;
  if (avg > 21 && QUALITY > 0) { QUALITY--; _qHold = 4; }
  else if (avg < 13.5 && QUALITY < 2) { QUALITY++; _qHold = 10; }
  /* در پایین‌ترین کیفیت، صحنه را با نقطه‌های کمتر می‌کشیم */
  if (before !== QUALITY && (before === 0 || QUALITY === 0) && _refit) _refit();
}

/* یک حلقه، نه بیشتر — دو حلقه یعنی زمانِ بازی دوبرابر می‌گذرد.

   MOTION: تا پیش از این، به‌خاطرِ باگِ دو حلقه، همهٔ بازی‌ها عملاً با
   سرعتِ دو برابر اجرا می‌شدند و زمان‌بندی‌ها هم با همان حس تنظیم شده
   بودند. حالا که باگ رفع شده، سرعتِ درست (یک برابر) کُند به نظر
   می‌رسد. این ضریب جانِ حرکت‌ها را برمی‌گرداند، ولی نه تا آن دو برابرِ
   تصادفی. فقط روی جانِ حرکت اثر دارد، نه روی هیچ قانونِ علمی. */
const MOTION = 1.45;
let _looping = false;
function runLoop(step) {
  if (_looping) return;
  _looping = true;
  let last = performance.now();
  const frame = (now) => {
    const gap = now - last;
    /* بریدنِ بعد از ضرب، تا یک فریمِ کُند پرشِ بزرگ نسازد */
    const dt = Math.min(gap / 1000 * MOTION, 1/15);
    last = now;
    _qualityTick(gap);
    step(dt);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

/* ═════════════════ بازی ═════════════════ */
/* ═══════════════════════════════════════════════════════════════════════
   از تخم تا پرنده — علومِ سوم، درس ۱۳ «پرندگان»

   کتاب می‌گوید پرندگان تخم می‌گذارند، بدنشان از پَر پوشیده است و
   همین پرها به آن‌ها کمک می‌کند پرواز کنند. اینجا هر چهارتای این
   جمله‌ها یک کار است، نه یک جمله:

     تخم       جوجه از درون به پوسته نوک می‌زند تا بشکند.
     جوجهٔ بی‌پر  هنوز پَر ندارد و چشمش باز نیست؛ فقط وقتی مادر سرِ
               لانه می‌رسد باید دهانش را باز کند — نه زودتر، نه
               دیرتر، وگرنه لقمه به جوجهٔ بغلی می‌رسد.
     پَر درآوردن  حالا پَر دارد؛ باید بال بزند تا بالِ خودش قوی شود.
     اوّلین پرواز  از لانه تا شاخه‌ها. پایین نرود، که گربه آنجاست.
     پرنده     برمی‌گردد سرِ لانه و چرخه بسته می‌شود.
   ═══════════════════════════════════════════════════════════════════════ */

const SCENE_W = 1200, SCENE_H = 760;
const HUD_H = 56;

const P = {
  sky: '#d6ecf4', skyLo: '#a8d6e8', sun: '#fff2c4',
  far: '#9fc6a4', farLo: '#7fae87',
  ground: '#6f9a52', groundLo: '#4d7038', soil: '#6a4d31',
  bark: '#7a5738', barkLo: '#523a24', barkLt: '#9c7450',
  leaf: '#4f9440', leafLt: '#79bd5e', leafDk: '#33702c',
  nest: '#a9773f', nestLt: '#c99a5c', nestDk: '#6f4c25',
  egg: '#e8dfc8', eggDot: '#a08a62',
  chick: '#e8a888', chickDk: '#b87a5e', chickLt: '#f7cdb2',
  down: '#c9b48c',
  bird: '#8a6a48', birdLt: '#c4a37c', birdDk: '#5c4530', bib: '#3a2a1c',
  beak: '#e0a63f', worm: '#d2705f',
  cat: '#5a5a66', catLt: '#8a8a98', catEye: '#e8c44a',
  paper: '#fbf7ec', card: '#ffffff',
  ink: '#2c2a20', inkSoft: '#7d7862',
  good: '#5fb07f', bad: '#d3624a', gold: '#e5b344', accent: '#5fa8d8',
};

/* ───────── درخت و لانه ───────── */

const GROUND = 700;
const NEST = { x: 424, y: 300 };
const PERCH = [
  { x: 706, y: 202 }, { x: 940, y: 356 }, { x: 618, y: 530 }, { x: 1046, y: 214 },
];
const TRUNK = [
  { x0: 210, y0: GROUND + 20, x1: 268, y1: 180, w0: 54, w1: 18 },
  { x0: 1118, y0: GROUND + 20, x1: 1074, y1: 150, w0: 46, w1: 15 },
];
/* شاخه‌ها: از تنه تا هر نشیمن */
const BRANCH = [
  { from: 0, x: NEST.x, y: NEST.y + 26 },
  { from: 0, x: PERCH[0].x, y: PERCH[0].y + 16 },
  { from: 1, x: PERCH[1].x, y: PERCH[1].y + 16 },
  { from: 0, x: PERCH[2].x, y: PERCH[2].y + 16 },
  { from: 1, x: PERCH[3].x, y: PERCH[3].y + 16 },
];
const LEAFY = [
  { x: 250, y: 170, r: 130 }, { x: 400, y: 128, r: 96 }, { x: 150, y: 250, r: 92 },
  { x: 1080, y: 130, r: 120 }, { x: 950, y: 190, r: 86 }, { x: 1170, y: 250, r: 84 },
  { x: 620, y: 150, r: 74 },
];

const GRAV = 780;
const FLAP = 1450;
const FEED_WIN = 1.15;          /* چند ثانیه دهان باز باشد */

const STAGES = [
  { n: 'تخم', need: 5 },
  { n: 'جوجهٔ بی‌پر', need: 6 },
  { n: 'بال درآوردن', need: 5 },
  { n: 'اوّلین پرواز', need: PERCH.length },
  { n: 'پرنده', need: 1 },
];

const S = {
  phase: 'intro', phaseT: 0,
  stage: 0, got: 0, score: 0, best: 0,
  x: NEST.x, y: NEST.y - 6, vx: 0, vy: 0, ang: 0,
  aim: null, wig: 0, gape: 0, flapT: 0, lift: 0,
  mom: null, momT: 2,           /* مادر با لقمه */
  sib: [{ g: 0 }, { g: 0 }],
  perched: -1, done: [false, false, false, false],
  cat: { x: 620, dir: 1, pounce: 0 },
  hurt: 0, won: false, winT: 0,
  t: 0, hover: null, tip: '', tipT: 0, shake: 0,
  tut: { on: false, step: 0, t: 0 },
};

const bits = new Bits();
const toast = new Toast();
const cv = document.getElementById('stage');
initStage(cv, SCENE_W, SCENE_H);

const ST = () => STAGES[Math.min(S.stage, STAGES.length - 1)];
function tip(msg) { S.tip = msg; S.tipT = 3.4; }
const canFly = () => S.stage >= 3;
const bodyR = () => (S.stage <= 1 ? 20 : S.stage === 2 ? 24 : 26);
const momHere = () => S.mom && S.mom.t > .75 && S.mom.t < .75 + FEED_WIN;

function resetGame() {
  S.stage = 0; S.got = 0;
  S.x = NEST.x; S.y = NEST.y - 6; S.vx = 0; S.vy = 0; S.ang = 0;
  S.aim = null; S.wig = 0; S.gape = 0; S.flapT = 0; S.lift = 0;
  S.mom = null; S.momT = 2.4;
  S.sib = [{ g: 0 }, { g: 0 }];
  S.perched = -1; S.done = [false, false, false, false];
  S.cat = { x: 620, dir: 1, pounce: 0 };
  S.hurt = 0; S.won = false; S.winT = 0;
}

function startGame(keep) {
  S.phase = 'play'; S.phaseT = 0;
  if (!keep) S.score = 0;
  S.tut.on = !keep; S.tut.step = 0; S.tut.t = 0;
  resetGame();
}

/* ───────── پیشرفتِ مرحله ───────── */

function grow() {
  S.got = 0;
  S.stage++;
  S.score += 100;
  if (S.score > S.best) S.best = S.score;
  sfx.win();
  bits.confetti(S.x, S.y, 20, [P.birdLt, P.gold, P.card]);
  if (S.stage === 1) toast.say('از تخم بیرون آمدی', 'good');
  if (S.stage === 2) { S.mom = null; toast.say('پَر درآوردی — بال بزن', 'good'); }
  if (S.stage === 3) { S.y = NEST.y - 30; S.vy = -120; toast.say('حالا از لانه بپر', 'good'); }
  if (S.stage === 4) toast.say('برگرد سرِ لانه', 'good');
}

function collect() {
  S.got++;
  S.score += 20;
  if (S.score > S.best) S.best = S.score;
  sfx.pop();
  if (S.got >= ST().need) grow();
}

function finish() {
  S.won = true; S.winT = .001;
  S.score += 250;
  if (S.score > S.best) S.best = S.score;
  sfx.win();
  bits.confetti(NEST.x, NEST.y, 34, [P.egg, P.gold, P.card, P.leafLt]);
}

/* ───────── ورودی ───────── */

const BTN_GO = { x: SCENE_W / 2 - 150, y: 494, w: 300, h: 68 };
const BTN_AGAIN = { x: SCENE_W / 2 - 150, y: 500, w: 300, h: 68 };
const TUT_TAP = [0, 1, 2], TUT_LAST = 2;

cv.addEventListener('pointermove', (e) => {
  const p = toStage(e);
  if (S.aim) { S.aim.x = p.x; S.aim.y = p.y; return; }
  S.hover = null;
  if (S.phase === 'intro') { if (inRect(p, BTN_GO)) S.hover = BTN_GO; }
  else if (S.phase === 'won') { if (inRect(p, BTN_AGAIN)) S.hover = BTN_AGAIN; }
  cv.style.cursor = S.hover ? 'pointer' : 'default';
});

cv.addEventListener('pointerdown', (e) => {
  const p = toStage(e);
  if (S.phase === 'intro') { if (inRect(p, BTN_GO)) { startGame(); sfx.good(); } return; }
  if (S.phase === 'won') {
    if (inRect(p, BTN_AGAIN)) { S.phase = 'intro'; S.phaseT = 0; S.score = 0; resetGame(); sfx.tap(); }
    return;
  }
  if (S.tut.on && tutTap(S.tut, TUT_TAP, TUT_LAST)) return;
  if (S.winT) return;
  if (S.stage === 0) {
    S.got++; S.wig = 1;
    sfx.tick();
    bits.spark(S.x, S.y, 4, [P.egg, P.card]);
    if (S.got >= ST().need) grow();
    return;
  }
  if (S.stage === 1) {
    /* دهان را باز کن */
    S.gape = .9;
    if (momHere() && !S.mom.given) {
      S.mom.given = 'me';
      collect();
      bits.spark(S.x, S.y - 18, 8, [P.worm, P.beak]);
    } else if (!momHere()) {
      sfx.tick();
    }
    return;
  }
  S.aim = { x: p.x, y: p.y };
  try { cv.setPointerCapture(e.pointerId); } catch { /* ok */ }
});

function release() { S.aim = null; }
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
addEventListener('blur', release);

/* ───────── حرکت ───────── */

function flapStep(dt) {
  if (S.stage === 2) {
    /* تمرینِ بال، همان‌جا روی لانه */
    if (S.aim) {
      S.lift = Math.min(1, S.lift + dt * 1.9);
      S.flapT += dt;
      if (S.flapT >= 1.2) { S.flapT = 0; collect(); }
    } else {
      S.lift = Math.max(0, S.lift - dt * 2.4);
      S.flapT = Math.max(0, S.flapT - dt * .8);
    }
    S.x = NEST.x + Math.sin(S.t * 9) * 5 * S.lift;
    S.y = NEST.y - 6 - S.lift * 62 + Math.sin(S.t * 13) * 4 * S.lift;
    return;
  }
  /* پرواز */
  if (S.aim) {
    const dx = S.aim.x - S.x, dy = S.aim.y - S.y;
    const d = Math.max(1, Math.hypot(dx, dy));
    S.vx += dx / d * FLAP * dt;
    S.vy += dy / d * FLAP * dt;
    S.flapT += dt;
  } else S.flapT = 0;
  S.vy += GRAV * dt;
  const k = Math.exp(-1.7 * dt);
  S.vx *= k; S.vy *= k;
  const v = Math.hypot(S.vx, S.vy);
  const MX = 430;
  if (v > MX) { S.vx = S.vx / v * MX; S.vy = S.vy / v * MX; }
  S.x += S.vx * dt; S.y += S.vy * dt;
  S.ang = clamp(S.vy / 700, -.5, .5) + (S.vx < 0 ? 0 : 0);
  S.x = clamp(S.x, 40, SCENE_W - 40);
  if (S.y < HUD_H + 30) { S.y = HUD_H + 30; S.vy = Math.abs(S.vy) * .3; }
  /* نشستن روی شاخه */
  const list = S.stage === 4 ? [{ x: NEST.x, y: NEST.y - 6, nest: true }] : PERCH;
  for (let i = 0; i < list.length; i++) {
    const q = list[i];
    if (Math.hypot(q.x - S.x, q.y - S.y) > 44) continue;
    if (q.nest) { finish(); return; }
    if (S.done[i]) { S.perched = i; continue; }
    S.done[i] = true;
    S.perched = i;
    S.x = q.x; S.y = q.y - 4; S.vx = 0; S.vy = 0;
    bits.confetti(q.x, q.y, 14, [P.leafLt, P.gold, P.card]);
    collect();
    return;
  }
  /* زمین: گربه آنجاست */
  if (S.y > GROUND - 46) {
    S.y = GROUND - 46;
    if (S.hurt <= 0) {
      S.hurt = 1.8; S.shake = .24;
      S.cat.pounce = 1;
      sfx.nope();
      toast.say('گربه!', 'bad');
      const back = S.perched >= 0 ? PERCH[S.perched] : { x: NEST.x, y: NEST.y - 20 };
      S.x = back.x; S.y = back.y - 30; S.vx = 0; S.vy = -160;
      /* شاخه‌های رفته پس گرفته نمی‌شوند، فقط امتیاز کم می‌شود */
      S.score = Math.max(0, S.score - 30);
    }
  }
}

/* ───────── مادر ───────── */

function stepMom(dt) {
  if (S.stage !== 1) { S.mom = null; return; }
  if (S.mom) {
    S.mom.t += dt;
    const m = S.mom;
    if (m.t > .75 + FEED_WIN && !m.given) {
      /* لقمه به جوجهٔ بغلی رسید */
      m.given = 'sib';
      const i = Math.floor(Math.random() * S.sib.length);
      S.sib[i].g = 1;
      sfx.nope();
      toast.say('لقمه به جوجهٔ بغلی رسید', 'bad');
    }
    if (m.t > 2.6) { S.mom = null; S.momT = 1.4 + Math.random() * 1.6; }
    return;
  }
  S.momT -= dt;
  if (S.momT <= 0) { S.mom = { t: 0, given: null, side: Math.random() < .5 ? -1 : 1 }; sfx.slide(); }
}

function stepCat(dt) {
  const c = S.cat;
  if (c.pounce > 0) { c.pounce -= dt; return; }
  if (!canFly()) return;
  const want = clamp(S.x, 380, 980);
  c.x += clamp(want - c.x, -70 * dt, 70 * dt) * 1.6;
  c.dir = want > c.x ? 1 : -1;
}

/* ───────── حلقه ───────── */

function step(dt) {
  S.t += dt;
  if (S.phaseT < 9) S.phaseT += dt;
  if (S.tipT > 0) S.tipT -= dt;
  if (S.shake > 0) S.shake = Math.max(0, S.shake - dt);
  if (S.hurt > 0) S.hurt -= dt;
  if (S.tut.on) S.tut.t += dt;
  if (S.wig > 0) S.wig = Math.max(0, S.wig - dt * 2);
  if (S.gape > 0) S.gape = Math.max(0, S.gape - dt * 1.4);
  for (const b of S.sib) if (b.g > 0) b.g = Math.max(0, b.g - dt * .5);

  if (S.phase === 'play' && !S.winT) {
    if (S.stage === 0) { /* تخم */ }
    else if (S.stage === 1) stepMom(dt);
    else flapStep(dt);
    stepCat(dt);
  }
  if (S.winT) {
    S.winT += dt;
    if (S.winT > 2.8) { S.winT = 0; S.phase = 'won'; S.phaseT = 0; }
  }
  bits.step(dt);
  toast.step(dt);
  draw();
}

whenFontsReady(() => { resetGame(); runLoop(step); });

/* ───────── ابزارِ نقاشی ───────── */

function rrPath(x, y, w, h, r) {
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function numText(str, x, y, o = {}) {
  ctx.save();
  ctx.direction = 'ltr';
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = o.color || P.ink;
  ctx.font = `${o.weight || 700} ${o.size || 18}px "${o.family || 'Vazirmatn'}", Tahoma, sans-serif`;
  ctx.fillText(str, x, y);
  ctx.restore();
}

function spot(shapes, alpha) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, SCENE_W, SCENE_H);
  for (const s of shapes) { ctx.moveTo(s.x + s.r, s.y); ctx.arc(s.x, s.y, s.r, 0, TAU, true); }
  ctx.fillStyle = `rgba(24, 22, 12, ${alpha})`;
  ctx.fill('evenodd');
  ctx.restore();
}

function tutCard(x, y, w, lines, title) {
  const h = 26 + (title ? 44 : 0) + lines.length * 30;
  withShadow(24, 10, .5, () => {
    ctx.fillStyle = 'rgba(255, 253, 244, .97)';
    wobbleRect(x, y, w, h + 20, 16, 101, 2.2); ctx.fill();
  }, '30, 26, 12');
  ctx.fillStyle = P.leaf;
  wobbleRect(x, y, w, 9, 4, 103, 1); ctx.fill();
  let yy = y + 34;
  if (title) { text(title, x + w / 2, yy + 6, { size: 25, family: 'Lalezar', color: P.ink }); yy += 44; }
  for (const l of lines) { text(l, x + w / 2, yy, { size: 18, color: P.inkSoft }); yy += 30; }
  return h + 20;
}

/* ───────── باغ ───────── */

function paintYardStatic() {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, P.skyLo); g.addColorStop(.65, P.sky); g.addColorStop(1, '#eef6e6');
  ctx.fillStyle = g; ctx.fillRect(0, 0, SCENE_W, GROUND);
  ctx.fillStyle = 'rgba(255, 244, 196, .8)';
  ctx.beginPath(); ctx.arc(620, 120, 44, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255, 248, 214, .3)';
  ctx.beginPath(); ctx.arc(620, 120, 78, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.6)';
  for (const q of [[190, 120, 76], [330, 96, 48], [860, 150, 64], [1010, 112, 44]]) {
    ctx.beginPath(); ctx.ellipse(q[0], q[1], q[2], q[2] * .48, 0, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = P.farLo;
  ctx.beginPath();
  ctx.moveTo(0, GROUND);
  for (let x = 0; x <= SCENE_W; x += 20) ctx.lineTo(x, 596 + Math.sin(x * .007) * 34);
  ctx.lineTo(SCENE_W, GROUND); ctx.fill();
  ctx.fillStyle = P.far;
  ctx.beginPath();
  ctx.moveTo(0, GROUND);
  for (let x = 0; x <= SCENE_W; x += 20) ctx.lineTo(x, 646 + Math.sin(x * .011 + 2) * 20);
  ctx.lineTo(SCENE_W, GROUND); ctx.fill();
  const sg = ctx.createLinearGradient(0, GROUND, 0, SCENE_H);
  sg.addColorStop(0, P.ground); sg.addColorStop(1, P.groundLo);
  ctx.fillStyle = sg; ctx.fillRect(0, GROUND, SCENE_W, SCENE_H - GROUND);
  for (const b of [[480, 706, 66], [860, 712, 54], [1130, 708, 60], [90, 710, 58]]) {
    ctx.fillStyle = '#4f8f3e';
    ctx.beginPath(); ctx.ellipse(b[0], b[1], b[2], b[2] * .56, 0, Math.PI, TAU); ctx.fill();
    ctx.fillStyle = '#63a850';
    for (let i = 0; i < 4; i++) {
      const A = Math.PI + .34 + i * .78;
      ctx.beginPath();
      ctx.arc(b[0] + Math.cos(A) * b[2] * .56, b[1] + Math.sin(A) * b[2] * .36, b[2] * .3, 0, TAU);
      ctx.fill();
    }
  }
  ctx.strokeStyle = '#5f8f44'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (let i = 0; i < 80; i++) {
    const x = noise1(i * 3.7) * SCENE_W;
    ctx.beginPath(); ctx.moveTo(x, GROUND + 6);
    ctx.quadraticCurveTo(x + 6, GROUND - 12, x + (i % 2 ? 13 : -13), GROUND - 24 - noise1(i) * 12);
    ctx.stroke();
  }
}

function taper(x0, y0, x1, y1, w0, w1, cx, cy) {
  ctx.beginPath();
  const px = cx === undefined ? (x0 + x1) / 2 : cx;
  const py = cy === undefined ? (y0 + y1) / 2 : cy;
  const N = 18;
  const pt = (t) => ({
    x: (1 - t) * (1 - t) * x0 + 2 * (1 - t) * t * px + t * t * x1,
    y: (1 - t) * (1 - t) * y0 + 2 * (1 - t) * t * py + t * t * y1,
  });
  const side = (sgn) => {
    for (let i = 0; i <= N; i++) {
      const t = sgn > 0 ? i / N : 1 - i / N;
      const a = pt(Math.max(0, t - .02)), b = pt(Math.min(1, t + .02));
      const dx = b.x - a.x, dy = b.y - a.y, dl = Math.max(.001, Math.hypot(dx, dy));
      const w = lerp(w0, w1, t) * sgn;
      const q = pt(t);
      const X = q.x + (dy / dl) * w, Y = q.y - (dx / dl) * w;
      (i === 0 && sgn > 0) ? ctx.moveTo(X, Y) : ctx.lineTo(X, Y);
    }
  };
  side(1); side(-1);
  ctx.closePath();
}

function drawTrees() {
  /* برگ‌های پشت */
  for (const l of LEAFY) {
    ctx.fillStyle = P.leafDk;
    wobbleCircle(l.x, l.y, l.r, l.x * .1, 6); ctx.fill();
  }
  for (const t of TRUNK) {
    withShadow(16, 8, .28, () => {
      ctx.fillStyle = P.bark;
      taper(t.x0, t.y0, t.x1, t.y1, t.w0, t.w1, t.x0 - 26, (t.y0 + t.y1) / 2);
      ctx.fill();
    }, '40, 30, 16');
    ctx.save();
    taper(t.x0, t.y0, t.x1, t.y1, t.w0, t.w1, t.x0 - 26, (t.y0 + t.y1) / 2);
    ctx.clip();
    ctx.strokeStyle = P.barkLo; ctx.lineWidth = 3;
    for (let i = 0; i < 8; i++) {
      ctx.beginPath();
      ctx.moveTo(t.x0 - 20 + i * 9, t.y0);
      ctx.quadraticCurveTo(t.x0 - 34 + i * 9, (t.y0 + t.y1) / 2, t.x1 - 14 + i * 5, t.y1);
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(255,255,255,.12)';
    ctx.fillRect(t.x0 - t.w0, t.y1, t.w0 * .5, t.y0 - t.y1);
    ctx.restore();
  }
  for (const b of BRANCH) {
    const t = TRUNK[b.from];
    const u = clamp((t.y0 - b.y) / (t.y0 - t.y1), 0, 1);
    const bx = lerp(t.x0, t.x1, u), by = b.y + 40;
    const cx = (bx + b.x) / 2, cy = by - 54;
    ctx.fillStyle = P.bark;
    taper(bx, by, b.x, b.y, 14, 5, cx, cy);
    ctx.fill();
    ctx.fillStyle = P.barkLt;
    ctx.save();
    taper(bx, by, b.x, b.y, 14, 5, cx, cy);
    ctx.clip();
    ctx.globalAlpha = .3;
    ctx.fillRect(bx - 200, by - 40, 500, 8);
    ctx.restore();
    /* برگ‌های روی شاخه، دو طرف و نامنظم */
    for (let i = 0; i < 9; i++) {
      const u2 = .22 + i * .088;
      const t2 = u2;
      const px2 = (1 - t2) * (1 - t2) * bx + 2 * (1 - t2) * t2 * cx + t2 * t2 * b.x;
      const py2 = (1 - t2) * (1 - t2) * by + 2 * (1 - t2) * t2 * cy + t2 * t2 * b.y;
      const sd = i % 2 ? 1 : -1;
      ctx.fillStyle = i % 3 ? P.leaf : P.leafLt;
      ctx.save();
      ctx.translate(px2 + noise1(i * 2.3) * 10 - 5, py2 + sd * 13);
      ctx.rotate(Math.sin(S.t * 1.2 + i) * .12 + sd * .55 + noise1(i) * .4);
      ctx.beginPath(); ctx.ellipse(0, 0, 22, 10, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = P.leafDk; ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.moveTo(-20, 0); ctx.lineTo(20, 0); ctx.stroke();
      ctx.restore();
    }
  }
  /* برگ‌های جلو */
  for (const l of LEAFY) {
    ctx.fillStyle = P.leaf;
    wobbleCircle(l.x - l.r * .12, l.y - l.r * .14, l.r * .82, l.x * .2, 6); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.16)';
    wobbleCircle(l.x - l.r * .3, l.y - l.r * .34, l.r * .4, l.x * .3, 5); ctx.fill();
  }
}

function drawNest() {
  const x = NEST.x, y = NEST.y;
  withShadow(14, 7, .3, () => {
    ctx.fillStyle = P.nestDk;
    ctx.beginPath(); ctx.ellipse(x, y + 22, 92, 34, 0, 0, TAU); ctx.fill();
  }, '40, 30, 16');
  ctx.fillStyle = P.nest;
  ctx.beginPath(); ctx.ellipse(x, y + 14, 92, 36, 0, Math.PI, TAU); ctx.fill();
  ctx.fillStyle = P.nestDk;
  ctx.beginPath(); ctx.ellipse(x, y + 6, 70, 18, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = P.nestLt; ctx.lineWidth = 4; ctx.lineCap = 'round';
  for (let i = 0; i < 26; i++) {
    const a = noise1(i * 3.1) * TAU;
    const rx = 60 + noise1(i * 1.7) * 44;
    const x0 = x + Math.cos(a) * rx, y0 = y + 12 + Math.sin(a) * rx * .34;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x0 + Math.cos(a + 1.5) * 34, y0 + Math.sin(a + 1.5) * 11);
    ctx.stroke();
  }
}

function drawEggInNest() {
  const w = S.wig * Math.sin(S.t * 40) * 3;
  for (let i = -1; i <= 1; i++) {
    const me = i === 0;
    const x = NEST.x + i * 34 + (me ? w : 0), y = NEST.y - 2 + Math.abs(i) * 4;
    ctx.fillStyle = ball(x, y, 22, '#f7f0dc', P.egg, '#bfae8c');
    ctx.beginPath(); ctx.ellipse(x, y, me ? 22 : 19, me ? 27 : 24, i * .12, 0, TAU); ctx.fill();
    ctx.fillStyle = P.eggDot;
    ctx.globalAlpha = .5;
    for (let k = 0; k < 7; k++) {
      const a = k * 2.3 + i;
      ctx.beginPath();
      ctx.arc(x + Math.cos(a) * 11, y + Math.sin(a) * 15, 2.4, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (me && S.got > 0) {
      ctx.strokeStyle = P.barkLo; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x - 16, y - 6);
      for (let k = 1; k <= Math.min(6, S.got + 1); k++) {
        ctx.lineTo(x - 16 + k * 5.6, y - 6 + (k % 2 ? 7 : -5));
      }
      ctx.stroke();
    }
  }
}

/* ───────── جوجه و پرنده ───────── */

function chickArt(gape, downy) {
  /* بدنِ لخت با کرکِ کم؛ سر بزرگ و چشمِ بسته */
  ctx.fillStyle = ball(0, -6, 26, P.chickLt, P.chick, P.chickDk);
  ctx.beginPath(); ctx.ellipse(0, 4, 22, 19, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-2, -22, 18, 16, 0, 0, TAU); ctx.fill();
  /* بالِ کوچکِ بی‌پر */
  ctx.fillStyle = P.chickDk;
  ctx.beginPath(); ctx.ellipse(16, 6, 10, 6, .6, 0, TAU); ctx.fill();
  if (downy) {
    ctx.strokeStyle = P.down; ctx.lineWidth = 2;
    for (let i = 0; i < 9; i++) {
      const a = -2.6 + i * .32;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * 16, -22 + Math.sin(a) * 14);
      ctx.lineTo(Math.cos(a) * 26, -22 + Math.sin(a) * 24);
      ctx.stroke();
    }
  }
  /* چشمِ بسته */
  ctx.strokeStyle = P.chickDk; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(-10, -24, 6, .3, 2.6); ctx.stroke();
  /* منقارِ باز */
  const g = clamp(gape, 0, 1);
  ctx.fillStyle = P.beak;
  ctx.beginPath();
  ctx.moveTo(-14, -20);
  ctx.lineTo(-34, -24 - g * 10);
  ctx.lineTo(-14, -16);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#c8503f';
  ctx.beginPath();
  ctx.moveTo(-14, -18);
  ctx.lineTo(-34, -14 + g * 12);
  ctx.lineTo(-14, -12);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = P.beak;
  ctx.beginPath();
  ctx.moveTo(-14, -16);
  ctx.lineTo(-34, -12 + g * 14);
  ctx.lineTo(-14, -10);
  ctx.closePath(); ctx.fill();
}

function birdArt(L, flap, o = {}) {
  const b = o.body || P.bird, lt = o.light || P.birdLt, dk = o.dark || P.birdDk;
  /* بالِ دور */
  ctx.fillStyle = dk;
  ctx.beginPath();
  ctx.moveTo(4, -4);
  ctx.quadraticCurveTo(L * .5, -L * .5 * flap, L * 1.15, -L * .18 * flap);
  ctx.quadraticCurveTo(L * .45, L * .12, 4, -4);
  ctx.fill();
  /* دُم */
  ctx.fillStyle = dk;
  ctx.beginPath();
  ctx.moveTo(L * .5, 2); ctx.lineTo(L * 1.25, -L * .2); ctx.lineTo(L * 1.3, L * .16);
  ctx.closePath(); ctx.fill();
  /* بدن */
  ctx.fillStyle = ball(0, -L * .25, L, lt, b, dk);
  ctx.beginPath(); ctx.ellipse(0, 0, L * .78, L * .56, .06, 0, TAU); ctx.fill();
  ctx.fillStyle = '#f2e8d6';
  ctx.beginPath(); ctx.ellipse(-L * .1, L * .22, L * .5, L * .3, .06, 0, TAU); ctx.fill();
  /* سر */
  ctx.fillStyle = ball(-L * .5, -L * .5, L * .45, lt, b, dk);
  ctx.beginPath(); ctx.arc(-L * .58, -L * .38, L * .4, 0, TAU); ctx.fill();
  ctx.fillStyle = P.bib;
  ctx.beginPath(); ctx.ellipse(-L * .66, -L * .18, L * .18, L * .13, .3, 0, TAU); ctx.fill();
  /* منقار */
  ctx.fillStyle = P.beak;
  ctx.beginPath();
  ctx.moveTo(-L * .9, -L * .44);
  ctx.lineTo(-L * 1.28, -L * .34);
  ctx.lineTo(-L * .9, -L * .24);
  ctx.closePath(); ctx.fill();
  if (o.worm) {
    ctx.strokeStyle = P.worm; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-L * 1.2, -L * .3);
    ctx.quadraticCurveTo(-L * 1.5, -L * .1 + Math.sin(S.t * 8) * 4, -L * 1.2, L * .12);
    ctx.stroke();
  }
  /* چشم */
  ctx.fillStyle = '#fdfaf2';
  ctx.beginPath(); ctx.arc(-L * .72, -L * .52, L * .12, 0, TAU); ctx.fill();
  ctx.fillStyle = '#1e1a12';
  ctx.beginPath(); ctx.arc(-L * .74, -L * .52, L * .07, 0, TAU); ctx.fill();
  /* پا */
  if (o.legs) {
    ctx.strokeStyle = P.beak; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
    for (const sd of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(-L * .1 + sd * L * .16, L * .5);
      ctx.lineTo(-L * .1 + sd * L * .16, L * .82);
      ctx.moveTo(-L * .1 + sd * L * .16, L * .82);
      ctx.lineTo(-L * .3 + sd * L * .16, L * .92);
      ctx.moveTo(-L * .1 + sd * L * .16, L * .82);
      ctx.lineTo(L * .08 + sd * L * .16, L * .92);
      ctx.stroke();
    }
  }
  /* بالِ نزدیک */
  ctx.fillStyle = lt;
  ctx.beginPath();
  ctx.moveTo(0, -6);
  ctx.quadraticCurveTo(L * .45, -L * .85 * flap, L * 1.05, -L * .5 * flap);
  ctx.quadraticCurveTo(L * .4, L * .06, 0, -6);
  ctx.fill();
  ctx.strokeStyle = dk; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, -6);
  ctx.quadraticCurveTo(L * .45, -L * .85 * flap, L * 1.05, -L * .5 * flap);
  ctx.stroke();
}

function drawSibs() {
  if (S.stage > 1) return;
  for (let i = 0; i < S.sib.length; i++) {
    const x = NEST.x + (i ? 46 : -46), y = NEST.y - 2;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(i ? -.86 : .86, .86);
    chickArt(S.sib[i].g * .9 + (momHere() ? .5 : 0), true);
    ctx.restore();
  }
}

function drawHero() {
  ctx.save();
  if (S.hurt > 0) ctx.globalAlpha = .5 + .5 * Math.sin(S.t * 28);
  ctx.translate(S.x, S.y);
  if (S.stage === 1) {
    ctx.scale(1.05, 1.05);
    chickArt(S.gape, true);
  } else if (S.stage === 2) {
    const fl = .35 + .65 * Math.abs(Math.sin(S.t * 12));
    ctx.rotate(Math.sin(S.t * 9) * .05 * S.lift);
    birdArt(26, S.lift > .05 ? fl : .25, { legs: true });
  } else {
    ctx.rotate(S.ang);
    if (S.vx < -6) ctx.scale(1, 1);
    const fl = S.flapT > 0 ? .3 + .7 * Math.abs(Math.sin(S.t * 15)) : .5;
    birdArt(28, fl, { legs: S.vy > -20 });
  }
  ctx.restore();
}

function drawMom() {
  if (!S.mom) return;
  const m = S.mom;
  const u = clamp(m.t / .75, 0, 1);
  const away = m.t > .75 + FEED_WIN ? clamp((m.t - .75 - FEED_WIN) / .8, 0, 1) : 0;
  const fromX = m.side > 0 ? SCENE_W + 120 : -120;
  const x = away > 0 ? lerp(NEST.x, fromX, easeIn(away)) : lerp(fromX, NEST.x, easeOut(u));
  const y = NEST.y - 96 + Math.sin(S.t * 4) * 6;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(m.side > 0 ? -1 : 1, 1);
  const fl = .25 + .75 * Math.abs(Math.sin(S.t * 13));
  birdArt(34, fl, { worm: !m.given, legs: false });
  ctx.restore();
  if (momHere() && !m.given) {
    ctx.save();
    ctx.globalAlpha = .5 + .4 * Math.sin(S.t * 9);
    ctx.strokeStyle = P.gold; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(NEST.x, NEST.y - 24, 62 + Math.sin(S.t * 9) * 5, 0, TAU); ctx.stroke();
    ctx.restore();
  }
}

function drawCat() {
  const c = S.cat;
  const y = GROUND - 6 - (c.pounce > 0 ? Math.sin(clamp(c.pounce, 0, 1) * Math.PI) * 90 : 0);
  ctx.save();
  ctx.translate(c.x, y);
  ctx.scale(c.dir >= 0 ? -1 : 1, 1);
  ctx.fillStyle = 'rgba(30, 40, 20, .25)';
  ctx.beginPath(); ctx.ellipse(0, 6, 56, 10, 0, 0, TAU); ctx.fill();
  /* دُم */
  ctx.strokeStyle = P.cat; ctx.lineWidth = 11; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(44, -26);
  ctx.quadraticCurveTo(80, -34, 74, -74 + Math.sin(S.t * 2.2) * 10);
  ctx.stroke();
  ctx.fillStyle = ball(0, -46, 52, P.catLt, P.cat, '#3a3a44');
  ctx.beginPath(); ctx.ellipse(4, -34, 50, 26, -.05, 0, TAU); ctx.fill();
  ctx.fillStyle = P.cat;
  for (const x of [-28, 30]) ctx.fillRect(x - 6, -22, 13, 24);
  ctx.beginPath(); ctx.ellipse(-46, -56, 26, 23, 0, 0, TAU); ctx.fill();
  for (const sd of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(-46 + sd * 12, -72); ctx.lineTo(-52 + sd * 20, -98);
    ctx.lineTo(-32 + sd * 14, -84); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = P.catEye;
  for (const sd of [-1, 1]) {
    ctx.beginPath(); ctx.ellipse(-56 + sd * 10, -60, 6, 8, 0, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = '#20202a';
  for (const sd of [-1, 1]) {
    ctx.beginPath(); ctx.ellipse(-56 + sd * 10, -60, 2, 7, 0, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = '#d0787f';
  ctx.beginPath();
  ctx.moveTo(-70, -52); ctx.lineTo(-62, -52); ctx.lineTo(-66, -46); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1.6;
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath(); ctx.moveTo(-68, -48); ctx.lineTo(-100, -56 + i * 9); ctx.stroke();
  }
  ctx.restore();
}

/* ───────── نوار و پرده‌ها ───────── */

function drawHUD() {
  ctx.fillStyle = 'rgba(38, 44, 26, .82)';
  ctx.fillRect(0, 0, SCENE_W, HUD_H);
  ctx.fillStyle = 'rgba(229, 179, 68, .3)';
  ctx.fillRect(0, HUD_H - 2, SCENE_W, 2);
  text(ST().n, SCENE_W - 120, HUD_H / 2, { size: 25, family: 'Lalezar', color: P.paper });
  const need = ST().need;
  for (let k = 0; k < need; k++) {
    const x = SCENE_W - 250 - k * 26;
    ctx.fillStyle = k < S.got ? P.gold : 'rgba(255,255,255,.2)';
    ctx.beginPath(); ctx.arc(x, HUD_H / 2, 8, 0, TAU); ctx.fill();
  }
  numText(fa(S.score), 120, HUD_H / 2, { size: 22, color: P.gold });
  text('امتیاز', 192, HUD_H / 2, { size: 16, color: 'rgba(255,255,255,.7)' });
  for (let k = 0; k < STAGES.length; k++) {
    const x = 320 + k * 42;
    ctx.fillStyle = k < S.stage ? P.leafLt : k === S.stage ? P.gold : 'rgba(255,255,255,.18)';
    ctx.beginPath(); ctx.arc(x, HUD_H / 2, k === S.stage ? 9 : 6, 0, TAU); ctx.fill();
    if (k) {
      ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x - 34, HUD_H / 2); ctx.lineTo(x - 12, HUD_H / 2); ctx.stroke();
    }
  }
  /* نوارِ قوّتِ بال */
  if (S.stage === 2) {
    const bx = 560, bw = 240;
    ctx.fillStyle = 'rgba(255,255,255,.16)';
    ctx.beginPath(); rrPath(bx, HUD_H / 2 - 7, bw, 14, 7); ctx.fill();
    ctx.fillStyle = P.accent;
    ctx.beginPath(); rrPath(bx, HUD_H / 2 - 7, bw * clamp(S.flapT / 1.2, 0, 1), 14, 7); ctx.fill();
  }
}

function drawTargets() {
  if (S.stage !== 3 && S.stage !== 4) return;
  if (S.stage === 4) {
    const k = .5 + .5 * Math.sin(S.t * 3);
    ctx.save();
    ctx.globalAlpha = .35 + k * .4;
    ctx.strokeStyle = P.gold; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(NEST.x, NEST.y - 4, 66 + k * 10, 0, TAU); ctx.stroke();
    ctx.restore();
    return;
  }
  for (let i = 0; i < PERCH.length; i++) {
    const q = PERCH[i];
    const k = .5 + .5 * Math.sin(S.t * 3 + i);
    ctx.save();
    ctx.globalAlpha = S.done[i] ? .3 : .35 + k * .45;
    ctx.strokeStyle = S.done[i] ? P.good : P.gold;
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(q.x, q.y - 4, 34 + (S.done[i] ? 0 : k * 8), 0, TAU); ctx.stroke();
    ctx.restore();
  }
}

function drawAim() {
  if (!S.aim || S.tut.on || S.stage < 3) return;
  ctx.save();
  ctx.globalAlpha = .45;
  ctx.strokeStyle = P.card; ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.arc(S.aim.x, S.aim.y, 16 + Math.sin(S.t * 7) * 3, 0, TAU); ctx.stroke();
  ctx.restore();
}

function drawTutorial() {
  const st = S.tut.step;
  if (st === 0) {
    spot([{ x: NEST.x, y: NEST.y, r: 130 }], .68);
    const h = tutCard(420, 430, 520, ['اینجا لانه است و یکی از این تخم‌ها تویی.'], 'از تخم تا پرنده');
    tutMore(680, 430 + h + 8, S.t, P.ink);
  } else if (st === 1) {
    spot([{ x: NEST.x, y: NEST.y, r: 130 }], .66);
    const h = tutCard(420, 430, 520, ['چند بار روی صفحه بزن', 'تا پوسته بشکند.']);
    tutMore(680, 430 + h + 8, S.t, P.ink);
  } else {
    spot([{ x: NEST.x, y: NEST.y - 60, r: 170 }], .62);
    const h = tutCard(420, 452, 540,
      ['بعد وقتی مادر سرِ لانه رسید، بزن', 'تا دهانت باز شود و لقمه به تو برسد.']);
    tutMore(690, 452 + h + 8, S.t, P.ink);
  }
}

function birdIcon(x, y) {
  ctx.save();
  ctx.translate(x + 8, y); ctx.scale(.66, .66);
  birdArt(30, .8, { legs: true });
  ctx.restore();
}

function drawIntro() {
  overlay({
    t: S.phaseT, w: 900, h: 330, y: 128,
    paper: P.paper, band: P.leaf, ink: P.ink, inkSoft: P.inkSoft,
    icon: birdIcon,
    title: 'از تخم تا پرنده',
    body: 'یک تخم در لانه است. اوّل جوجه‌ای می‌شوی که هنوز پَر ندارد\nو باید سرِ وقت دهانش را باز کند، بعد پَر درمی‌آوری،\nو آخر از لانه پرواز می‌کنی. پایین نرو — گربه آنجاست.',
    btn: BTN_GO, btnLabel: 'شروع', btnHot: S.hover === BTN_GO,
    btnFill: '#4f9440', btnHotFill: '#65ab53',
  });
}

function drawWon() {
  overlay({
    t: S.phaseT, w: 900, h: 330, y: 132,
    paper: P.paper, band: P.gold, ink: P.ink, inkSoft: P.inkSoft,
    icon: birdIcon,
    title: 'چرخه بسته شد',
    body: 'تخم، جوجهٔ بی‌پر، جوجهٔ پَردار، پرنده — و باز هم تخم در لانه.\nهمان پرهایی که آخر درآوردی، همان‌هایی هستند که\nبدنت را گرم نگه می‌دارند و با آن‌ها پرواز می‌کنی.',
    btn: BTN_AGAIN, btnLabel: 'از نو', btnHot: S.hover === BTN_AGAIN,
    btnFill: '#4f9440', btnHotFill: '#65ab53',
  });
}

/* ───────── قاب ───────── */

function draw() {
  beginScene(P.sky);
  ctx.save();
  if (S.shake > 0) {
    const k = S.shake * 10;
    ctx.translate(Math.sin(S.t * 55) * k, Math.cos(S.t * 47) * k * .5);
  }
  ctx.drawImage(staticLayer('yard', SCENE_W, SCENE_H, paintYardStatic), 0, 0, SCENE_W, SCENE_H);
  drawTrees();
  drawCat();
  drawNest();
  drawTargets();
  if (S.stage === 0) drawEggInNest();
  else { drawSibs(); drawHero(); }
  drawMom();
  drawAim();
  bits.draw();
  ctx.restore();
  drawHUD();
  if (!(S.phase === 'play' && S.tut.on)) toast.draw(HUD_H + 10, { good: P.good, bad: P.bad, info: P.card, ink: P.ink });
  if (S.phase === 'play' && S.tut.on) drawTutorial();
  if (S.phase === 'intro') drawIntro();
  if (S.phase === 'won') drawWon();
  if (S.tipT > 0) {
    ctx.save();
    ctx.globalAlpha = clamp(S.tipT, 0, 1);
    const w = 560;
    paper(SCENE_W / 2 - w / 2, SCENE_H - 52, w, 40, P.card, 91, 12, .3);
    text(S.tip, SCENE_W / 2, SCENE_H - 32, { size: 17, color: P.ink });
    ctx.restore();
  }
  if (S.winT) {
    ctx.save();
    ctx.globalAlpha = clamp(S.winT / 1.2, 0, 1) * .45;
    ctx.fillStyle = '#fff8e0';
    ctx.fillRect(0, 0, SCENE_W, SCENE_H);
    ctx.restore();
  }
  endScene(.1, 'rgba(40, 40, 16, .3)', .3, .12);
}
