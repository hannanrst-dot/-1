<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14100d">
<title>ماشینِ نماد — روش‌های نمادین</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>
  /* صفحه نباید هیچ‌جا اسکرول یا زوم شود؛ بازی باید مثل یک برنامه رفتار کند. */
  html, body {
    margin: 0; padding: 0; background: #14100d;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body {
    position: fixed; inset: 0;          /* جلوی کشیده‌شدنِ صفحه در سافاریِ گوشی */
    width: 100%; height: 100vh; height: 100dvh;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none; -webkit-touch-callout: none;
  }

  /* گوشیِ عمودی صحنه را ریز می‌کند؛ بچه باید گوشی را بچرخاند. */
  #rotate { display: none; }
  @media (orientation: portrait) and (max-width: 860px) {
    #stage { display: none; }
    #rotate {
      display: flex; position: fixed; inset: 0;
      z-index: 9;
      flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      background: #14100d; color: #f6ead2;
      font: 700 20px "Vazirmatn", Tahoma, sans-serif; text-align: center; padding: 32px;
    }
    #rotate svg { animation: tilt 2.4s ease-in-out infinite; }
    @keyframes tilt { 0%, 45% { transform: rotate(0deg); } 65%, 100% { transform: rotate(-90deg); } }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="rotate">
  <svg width="86" height="126" viewBox="0 0 86 126" fill="none" aria-hidden="true">
    <rect x="3" y="3" width="80" height="120" rx="12" stroke="#e8b448" stroke-width="5"/>
    <rect x="15" y="19" width="56" height="88" rx="5" fill="#e8b448" opacity=".28"/>
    <circle cx="43" cy="115" r="4" fill="#e8b448"/>
  </svg>
  <div>گوشی را بچرخان</div>
  <div style="font-weight:400;opacity:.7;font-size:16px">این بازی خوابیده بازی می‌شود</div>
</div>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   هستهٔ مشترکِ بازی‌ها — سبک «کاغذبُری»
   ───────────────────────────────────────────────────────────────────────
   این فایل جعبه‌ابزار است، نه چارچوب: هر بازی حلقه و وضعیت خودش را دارد
   و فقط از این توابع برای کشیدن استفاده می‌کند. دلیلش این است که هر بازی
   باید حس‌وحال خودش را داشته باشد، نه اینکه همه شبیه هم دربیایند.

   قاعده‌های ثابتِ تصویری:
   • نور همیشه از بالا-چپ می‌تابد، پس سایه‌ها به پایین-راست می‌افتند.
   • هیچ لبه‌ای کاملاً صاف نیست؛ همه کمی موج دارند (انگار با قیچی بریده).
   • هیچ خاکستریِ خالصی نداریم؛ همه‌ی خنثی‌ها به گرمیِ صحنه می‌زنند.
   • یک لایه‌ی دانه‌دانه‌ی کاغذ روی کلِ تصویر ضرب می‌شود.
   ═══════════════════════════════════════════════════════════════════════ */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const FA_D = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
const fa = (n) => String(n).replace(/\d/g, (d) => FA_D[+d]);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeIn = (t) => t * t * t;
const easeInOut = (t) => (t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2);
const easeBack = (t) => 1 + 2.7 * Math.pow(t-1, 3) + 1.7 * Math.pow(t-1, 2);
const easeElastic = (t) => t === 0 || t === 1 ? t : Math.pow(2, -9*t) * Math.sin((t*10 - .75) * 2.094) + 1;

/** تصادفِ تکرارپذیر: با یک بذر همیشه همان عدد. برای اینکه تزئین‌ها هر فریم نپرند. */
function noise1(x) {
  const s = Math.sin(x * 127.1) * 43758.5453;
  return s - Math.floor(s);
}
const pick = (arr, seed) => arr[Math.floor(noise1(seed) * arr.length) % arr.length];

/* ───────── بوم و صحنهٔ ثابت ───────── */

let ctx, SW, SH, CV, _refit = null;
let view = { scale: 1, ox: 0, oy: 0, w: 0, h: 0, dpr: 1 };
let _grain = null, _grainDark = null;

function initStage(canvas, w, h) {
  CV = canvas; SW = w; SH = h;
  ctx = canvas.getContext('2d');

  /* اندازه را از خودِ بوم می‌گیریم نه از innerHeight؛ چون در سافاریِ گوشی
     نوارِ آدرس باز و بسته می‌شود و innerHeight دروغ می‌گوید. */
  const fit = () => {
    const r = canvas.getBoundingClientRect();
    const vw = Math.round(r.width), vh = Math.round(r.height);
    if (vw < 20 || vh < 20) return;
    const dpr = Math.min(devicePixelRatio || 1, QUALITY > 0 ? 2 : 1);
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    const scale = Math.min(vw / SW, vh / SH);
    view = { scale, ox: (vw - SW*scale)/2, oy: (vh - SH*scale)/2, w: vw, h: vh, dpr };
    _grain = buildGrain();
  };
  _refit = fit;
  addEventListener('resize', fit);
  /* چرخاندنِ گوشی: اندازهٔ درست چند لحظه بعد می‌رسد، پس چندبار اندازه می‌گیریم. */
  addEventListener('orientationchange', () => {
    fit(); setTimeout(fit, 140); setTimeout(fit, 460);
  });
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(canvas);

  /* صدا در گوشی فقط بعد از اوّلین لمس اجازهٔ پخش دارد. */
  const unlock = () => { sfx._c(); removeEventListener('pointerdown', unlock); removeEventListener('touchstart', unlock); };
  addEventListener('pointerdown', unlock, { passive: true });
  addEventListener('touchstart', unlock, { passive: true });
  /* نگه‌داشتنِ انگشت نباید منوی مرورگر را باز کند. */
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  fit();
  return ctx;
}

/** قابِ صحنه را باز می‌کند: بعد از این، مختصات همیشه در فضای SW×SH است. */
function beginScene(bg) {
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, view.w, view.h);
  ctx.save();
  ctx.translate(view.ox, view.oy);
  ctx.scale(view.scale, view.scale);
  ctx.beginPath();
  ctx.rect(0, 0, SW, SH);
  ctx.clip();
}

/* ───────── پوششِ پایانِ قاب ─────────
   دانه‌های کاغذ و تیرگیِ گوشه‌ها هر دو ثابت‌اند و تغییر نمی‌کنند، ولی
   قبلاً هر فریم از نو کشیده می‌شدند: یکی با «multiply» روی کلِّ صفحه و
   یکی با یک گرادیانِ شعاعیِ تازه. اندازه‌گیری نشان داد همین دو تا
   ۱۱ تا ۱۶ میلی‌ثانیه از هر فریم را می‌خوردند — بیشتر از کشیدنِ خودِ
   صحنه. حالا یک بار در یک بومِ جدا پخته می‌شوند و هر فریم فقط یک
   drawImage است.                                                       */

let _ovl = null, _ovlKey = '';

function overlayLayer(grainAlpha, vignette) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const w = Math.max(2, Math.round(SW * q)), h = Math.max(2, Math.round(SH * q));
  const key = w + 'x' + h + '|' + grainAlpha + '|' + vignette;
  if (_ovl && _ovlKey === key) return _ovl;
  let c;
  try {
    c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g2 = c.getContext('2d');
    if (!g2) return null;
    if (_grainDark && grainAlpha > 0) {
      /* همان دانه‌ها، ولی به‌جای multiply به شکلِ سیاهِ کم‌رنگ */
      g2.globalAlpha = clamp(grainAlpha * 1.15, 0, 1);
      g2.fillStyle = g2.createPattern(_grainDark, 'repeat');
      g2.fillRect(0, 0, w, h);
      g2.globalAlpha = 1;
    }
    if (vignette) {
      const g = g2.createRadialGradient(w / 2, h / 2, h * .42, w / 2, h / 2, h * 1.05);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, vignette);
      g2.fillStyle = g;
      g2.fillRect(0, 0, w, h);
    }
  } catch (e) { return null; }
  _ovl = c; _ovlKey = key;
  return c;
}

/** بافتِ کاغذ، تیرگیِ گوشه‌ها، رنگ‌بندی و درخششِ نور را می‌گذارد و قاب را می‌بندد. */
function endScene(grainAlpha = .15, vignette = 'rgba(48,28,14,.30)', bloom = .34, grade = .14) {
  /* درخششِ نور خاموش است. اندازه‌گیری نشان داد هر فریم ۲۱ میلی‌ثانیه
     می‌گیرد — بیشتر از تمامِ کارهای دیگرِ یک فریم روی هم — چون برای
     ساختنش باید کلِّ بوم دوباره خوانده شود. از آن بدتر: متنِ فارسی را
     مه‌آلود می‌کرد و خواندنش را سخت‌تر. بی‌آن، صحنه تمیزتر است. */
  bloom = 0;
  if (QUALITY < 1) { grade = 0; grainAlpha *= .5; }
  if (QUALITY < 2) grade = 0;
  if (grade > 0) {
    /* رنگ‌بندیِ نرم: بالای صحنه گرم‌تر، پایین سردتر — عمق می‌دهد */
    const g = ctx.createLinearGradient(0, 0, 0, SH);
    g.addColorStop(0, `rgba(255, 214, 150, ${grade})`);
    g.addColorStop(.55, 'rgba(255, 255, 255, 0)');
    g.addColorStop(1, `rgba(40, 60, 110, ${grade * .9})`);
    ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalCompositeOperation = 'source-over';
  }
  const ov = (grainAlpha > 0 || vignette) ? overlayLayer(grainAlpha, vignette) : null;
  if (ov) ctx.drawImage(ov, 0, 0, SW, SH);
  ctx.restore();
  bloomPass(bloom);
}

/* ───────── درخششِ نور (bloom) ─────────
   قابِ رسم‌شده را کوچک می‌کنیم، دو بار در خودش ضرب می‌کنیم تا فقط
   روشن‌ها بمانند، محوش می‌کنیم و با حالتِ «lighter» رویش می‌گذاریم.
   نتیجه: چراغ‌ها، شعله‌ها و رنگ‌های روشن نور پخش می‌کنند. */
let _bl, _blc, _bl2, _bl2c, _blNo = false, _blTick = 0;

function bloomPass(amount) {
  if (!amount || _blNo || !CV.width) return;
  /* کوچک‌کردن و بزرگ‌کردنِ دوباره، خودش محو می‌کند — از filter خیلی ارزان‌تر است */
  const W = Math.max(4, Math.round(CV.width * .2)), H = Math.max(4, Math.round(CV.height * .2));
  const W2 = Math.max(2, Math.round(W * .28)), H2 = Math.max(2, Math.round(H * .28));
  try {
    if (!_bl) {
      _bl = document.createElement('canvas'); _blc = _bl.getContext('2d');
      _bl2 = document.createElement('canvas'); _bl2c = _bl2.getContext('2d');
      if (!_blc || !_bl2c) { _blNo = true; return; }
    }
    if (_bl.width !== W || _bl.height !== H) { _bl.width = W; _bl.height = H; }
    if (_bl2.width !== W2 || _bl2.height !== H2) { _bl2.width = W2; _bl2.height = H2; }
    /* ساختنِ نور یک قاب در میان کافی است؛ گذاشتنش هر قاب. */
    _blTick = (_blTick + 1) & 1;
    if (!_blTick) {
      _blc.globalCompositeOperation = 'source-over';
      _blc.clearRect(0, 0, W, H);
      _blc.drawImage(CV, 0, 0, W, H);
      _blc.globalCompositeOperation = 'multiply';
      _blc.drawImage(_bl, 0, 0);
      _blc.drawImage(_bl, 0, 0);
      _blc.globalCompositeOperation = 'source-over';
      _bl2c.clearRect(0, 0, W2, H2);
      _bl2c.drawImage(_bl, 0, 0, W2, H2);
    }

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = amount;
    ctx.drawImage(_bl2, 0, 0, CV.width, CV.height);
    ctx.restore();
  } catch (e) { _blNo = true; }
}

/* ───────── لایهٔ ثابت ─────────
   هرچه در صحنه تکان نمی‌خورد را یک‌بار می‌کشیم و بعد فقط کپی می‌کنیم. */
const _layers = {};
function staticLayer(key, w, h, paint) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const L = _layers[key];
  if (L && L.q === q && L.w === w && L.h === h) return L.cv;
  const off = document.createElement('canvas');
  off.width = Math.max(1, Math.round(w * q));
  off.height = Math.max(1, Math.round(h * q));
  const c = off.getContext('2d');
  c.setTransform(q, 0, 0, q, 0, 0);
  const prev = ctx;
  ctx = c;
  try { paint(); } finally { ctx = prev; }
  _layers[key] = { cv: off, q, w, h };
  return off;
}

/* ───────── نورپردازی و بافت ─────────
   کارِ این‌ها این است که هیچ سطحی «تختِ یک‌رنگ» نماند. */

/** شیبِ عمودی: بالا روشن، پایین تیره. */
function vgrad(y0, y1, top, bot) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, top); g.addColorStop(1, bot);
  return g;
}

/** حجمِ کروی: نور از بالا-چپ، سایه در پایین-راست. */
function ball(cx, cy, r, lit, base, dark) {
  const g = ctx.createRadialGradient(cx - r * .38, cy - r * .42, r * .06, cx, cy, r * 1.06);
  g.addColorStop(0, lit); g.addColorStop(.45, base); g.addColorStop(1, dark);
  return g;
}

/** لبهٔ روشنِ بالا-چپِ یک مسیر — همان «rim light». */
function rim(pathFn, col, w = 2.2) {
  ctx.save();
  ctx.beginPath(); pathFn();
  ctx.clip();
  ctx.beginPath(); pathFn();
  ctx.strokeStyle = col; ctx.lineWidth = w * 2; ctx.lineJoin = 'round';
  ctx.translate(-w * .5, -w * .6);
  ctx.stroke();
  ctx.restore();
}

/** سایهٔ چسبیده به زمین — چیزها را روی سطح می‌نشاند. */
function contact(cx, cy, rx, ry, alpha = .26) {
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
  g.addColorStop(0, `rgba(20, 12, 6, ${alpha})`);
  g.addColorStop(1, 'rgba(20, 12, 6, 0)');
  ctx.save();
  ctx.fillStyle = g;
  ctx.translate(cx, cy); ctx.scale(1, ry / Math.max(rx, ry));
  ctx.beginPath(); ctx.arc(0, 0, Math.max(rx, ry), 0, TAU); ctx.fill();
  ctx.restore();
}

const _tex = {};
/** بافتِ تکرارشونده؛ یک‌بار ساخته و بعد از حافظه خوانده می‌شود. */
function texture(key, w, h, paint) {
  if (_tex[key]) return _tex[key];
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const c = off.getContext('2d');
  paint(c, w, h);
  _tex[key] = ctx.createPattern(off, 'repeat');
  return _tex[key];
}

/** رگهٔ چوب. */
function texWood(base, grain) {
  return texture('w' + base + grain, 120, 120, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = grain; c.lineWidth = 1.4;
    for (let i = 0; i < 9; i++) {
      c.globalAlpha = .18 + noise1(i * 3.1) * .3;
      c.beginPath();
      const y0 = i * 14 + noise1(i) * 6;
      c.moveTo(0, y0);
      for (let x = 0; x <= w; x += 10) c.lineTo(x, y0 + Math.sin(x * .09 + i) * 2.6);
      c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** تارِ پارچه. */
function texCloth(base, thread) {
  return texture('c' + base + thread, 16, 16, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = thread; c.lineWidth = 1; c.globalAlpha = .5;
    for (let i = 0; i < w; i += 4) {
      c.beginPath(); c.moveTo(i, 0); c.lineTo(i, h); c.stroke();
      c.beginPath(); c.moveTo(0, i); c.lineTo(w, i); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** دانه‌های سنگ. */
function texStone(base, spec) {
  return texture('s' + base + spec, 90, 90, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) {
      c.globalAlpha = .05 + noise1(i * 1.7) * .16;
      c.fillStyle = spec;
      const r = .6 + noise1(i * 5.3) * 1.9;
      c.beginPath();
      c.arc(noise1(i * 2.1) * w, noise1(i * 3.7 + 1) * h, r, 0, TAU);
      c.fill();
    }
    c.globalAlpha = 1;
  });
}

/** الیافِ کاغذ. */
function texPaper(base) {
  return texture('p' + base, 100, 100, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 130; i++) {
      c.globalAlpha = .04 + noise1(i * 2.3) * .07;
      c.strokeStyle = i % 2 ? '#ffffff' : '#5a4326';
      c.lineWidth = .9;
      const x = noise1(i * 1.3) * w, y = noise1(i * 4.1 + 2) * h;
      const a = noise1(i * 7.7) * TAU, l = 4 + noise1(i * 9.1) * 12;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

function buildGrain() {
  const s = 260;
  const off = document.createElement('canvas');
  off.width = off.height = s;
  const c = off.getContext('2d');
  const img = c.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    const v = 214 + Math.random() * 41;
    img.data[i*4] = v; img.data[i*4+1] = v; img.data[i*4+2] = v; img.data[i*4+3] = 255;
  }
  c.putImageData(img, 0, 0);
  /* همان دانه‌ها به شکلِ سیاهِ کم‌رنگ، تا بشود بدونِ multiply گذاشتشان */
  const d = document.createElement('canvas');
  d.width = d.height = s;
  const dc = d.getContext('2d');
  const dimg = dc.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    dimg.data[i*4] = 0; dimg.data[i*4+1] = 0; dimg.data[i*4+2] = 0;
    dimg.data[i*4+3] = 255 - img.data[i*4];
  }
  dc.putImageData(dimg, 0, 0);
  _grainDark = d;
  _ovl = null; _ovlKey = '';
  return ctx.createPattern(off, 'repeat');
}

function toStage(e) {
  const r = CV.getBoundingClientRect();
  return {
    x: (e.clientX - r.left - view.ox) / view.scale,
    y: (e.clientY - r.top - view.oy) / view.scale,
  };
}

const inRect = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
const inCircle = (p, b, pad = 0) => Math.hypot(p.x - b.x, p.y - b.y) <= b.r + pad;

/* ───────── قلم‌های کاغذبُری ───────── */

/** دایره‌ای که انگار با قیچی بریده شده. */
function wobbleCircle(cx, cy, r, seed = 0, amp = 2.2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const rr = r + Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp * .45;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** بیضیِ ناصاف — برای چیزهایی که گرد نیستند ولی نرم‌اند. */
function wobbleEllipse(cx, cy, rx, ry, rot = 0, seed = 0, amp = 2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const w = 1 + (Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp*.45) / Math.max(rx, ry);
    const px = Math.cos(a) * rx * w, py = Math.sin(a) * ry * w;
    const x = cx + px*Math.cos(rot) - py*Math.sin(rot);
    const y = cy + px*Math.sin(rot) + py*Math.cos(rot);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** مستطیلِ گِرد با گوشه‌های کمی کج. */
function wobbleRect(x, y, w, h, r = 12, seed = 0, amp = 1.6) {
  const j = (k) => (noise1(seed*9.7 + k) - .5) * amp * 2;
  ctx.beginPath();
  ctx.moveTo(x + r + j(1), y + j(2));
  ctx.lineTo(x + w - r + j(3), y + j(4));
  ctx.quadraticCurveTo(x + w + j(5), y + j(6), x + w + j(7), y + r + j(8));
  ctx.lineTo(x + w + j(9), y + h - r + j(10));
  ctx.quadraticCurveTo(x + w + j(11), y + h + j(12), x + w - r + j(13), y + h + j(14));
  ctx.lineTo(x + r + j(15), y + h + j(16));
  ctx.quadraticCurveTo(x + j(17), y + h + j(18), x + j(19), y + h - r + j(20));
  ctx.lineTo(x + j(21), y + r + j(22));
  ctx.quadraticCurveTo(x + j(23), y + j(24), x + r + j(1), y + j(2));
  ctx.closePath();
}

/** سایهٔ نرم؛ نور از بالا-چپ. */
function withShadow(blur, dy, alpha, fn, hue = '78, 46, 24') {
  ctx.save();
  ctx.shadowColor = `rgba(${hue}, ${alpha})`;
  ctx.shadowBlur = blur;
  ctx.shadowOffsetY = dy;
  ctx.shadowOffsetX = dy * .35;
  fn();
  ctx.restore();
}

/** یک برگه‌ی کاغذ با سایه — پایه‌ی همه‌ی کارت‌ها و تابلوها. */
function paper(x, y, w, h, fill, seed = 1, r = 12, shadow = .26) {
  withShadow(16, 7, shadow, () => {
    ctx.fillStyle = fill;
    wobbleRect(x, y, w, h, r, seed, 2);
    ctx.fill();
  });
  /* الیافِ کاغذ و لبهٔ روشن، تا سطح تخت نماند */
  ctx.save();
  ctx.beginPath(); wobbleRect(x, y, w, h, r, seed, 2); ctx.clip();
  ctx.globalAlpha = .5;
  ctx.fillStyle = texPaper(fill);
  ctx.fillRect(x, y, w, h);
  ctx.globalAlpha = 1;
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.4, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(90,60,20,.1)');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
}

function text(str, x, y, o = {}) {
  const size = o.size || 20;
  const fam = o.family || 'Vazirmatn';
  ctx.save();
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.font = `${fam === 'Lalezar' ? '400' : (o.weight || 700)} ${size}px "${fam}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.baseline || 'middle';
  ctx.fillStyle = o.color || '#43291b';
  ctx.direction = 'rtl';
  if (o.stroke) {
    ctx.lineWidth = o.strokeWidth || 5;
    ctx.strokeStyle = o.stroke;
    ctx.lineJoin = 'round';
    ctx.strokeText(str, x, y, o.maxWidth);
  }
  ctx.fillText(str, x, y, o.maxWidth);
  ctx.restore();
}

/** متنِ چندخطی که خودش می‌شکند. ارتفاعِ اشغال‌شده را برمی‌گرداند. */
function textWrap(str, x, y, maxW, o = {}) {
  const size = o.size || 19, lh = o.lineHeight || size * 1.7;
  ctx.font = `${o.weight || 700} ${size}px "${o.family || 'Vazirmatn'}", Tahoma, sans-serif`;
  const lines = [];
  for (const para of str.split('\n')) {
    let line = '';
    for (const wd of para.split(' ')) {
      const t = line ? line + ' ' + wd : wd;
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = wd; }
      else line = t;
    }
    lines.push(line);
  }
  lines.forEach((l, i) => text(l, x, y + i * lh, o));
  return lines.length * lh;
}

/* ───────── ذره‌ها ───────── */

class Bits {
  constructor() { this.list = []; }
  add(x, y, n, kind, colors, opts = {}) {
    for (let i = 0; i < n; i++) {
      const a = opts.dir !== undefined ? opts.dir + (Math.random()-.5) * (opts.spread || 1) : Math.random() * TAU;
      const sp = (opts.speed || 200) * (.4 + Math.random());
      this.list.push({
        kind, x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - (opts.lift || 0),
        r: (opts.size || 4) * (.5 + Math.random()),
        rot: Math.random() * TAU, vr: (Math.random()-.5) * 10,
        col: colors[(Math.random() * colors.length) | 0],
        grav: opts.grav === undefined ? 620 : opts.grav,
        drag: opts.drag || .995,
        life: (opts.life || .9) * (.6 + Math.random() * .8), age: 0,
      });
    }
  }
  confetti(x, y, n, colors) {
    this.add(x, y, n, 'flake', colors, { speed: 420, lift: 190, size: 5, life: 1.6, grav: 780 });
  }
  spark(x, y, n, colors) {
    this.add(x, y, n, 'dot', colors, { speed: 180, lift: 30, size: 3.4, life: .7, grav: 260, drag: .93 });
  }
  step(dt) {
    for (const p of this.list) {
      p.age += dt;
      p.vy += p.grav * dt;
      p.vx *= p.drag; p.vy *= p.drag;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    }
    this.list = this.list.filter((p) => p.age < p.life);
  }
  draw() {
    for (const p of this.list) {
      const k = clamp(1 - p.age / p.life, 0, 1);
      ctx.save();
      ctx.globalAlpha = k;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.col;
      if (p.kind === 'flake') ctx.fillRect(-p.r, -p.r*1.5, p.r*2, p.r*3);
      else if (p.kind === 'leaf') { wobbleEllipse(0, 0, p.r*1.8, p.r*.8, 0, p.r, .6); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(0, 0, p.r * k, 0, TAU); ctx.fill(); }
      ctx.restore();
    }
  }
  clear() { this.list.length = 0; }
}

/* ───────── صدا (بدون فایل صوتی) ───────── */

const sfx = {
  ac: null, on: true,
  _c() {
    if (!this.on) return null;
    if (!this.ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; this.ac = new A(); }
    if (this.ac.state === 'suspended') this.ac.resume();
    return this.ac;
  },
  tone(f, dur = .16, type = 'sine', gain = .13, delay = 0) {
    const c = this._c(); if (!c) return;
    const t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(t0 + dur + .04);
  },
  tap()  { this.tone(430, .07, 'triangle', .09); },
  place(){ this.tone(620, .11, 'sine', .12); },
  pop()  { this.tone(760, .09, 'sine', .11); },
  slide(){ this.tone(240, .22, 'sine', .07); },
  good() { [523, 659, 784].forEach((f,i) => this.tone(f, .22, 'sine', .13, i*.07)); },
  win()  { [523, 659, 784, 1047].forEach((f,i) => this.tone(f, .34, 'triangle', .13, i*.10)); },
  nope() { this.tone(180, .2, 'sawtooth', .07); },
  tick() { this.tone(1100, .04, 'square', .05); },
};

/* ───────── قطعه‌های آماده ───────── */

function star(x, y, r, col, rot = 0) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = col;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI/2 + i * Math.PI/5;
    const rr = i % 2 ? r * .45 : r;
    const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/** دکمهٔ کاغذی. hovered را خودِ بازی می‌دهد؛ اینجا فقط کشیده می‌شود. */
/** رنگ را روشن‌تر (k>0) یا تیره‌تر (k<0) می‌کند. */
function shade(col, k) {
  const c = String(col).trim();
  let r, g2, b2;
  if (c[0] === '#') {
    const h = c.length === 4 ? c[1]+c[1]+c[2]+c[2]+c[3]+c[3] : c.slice(1, 7);
    r = parseInt(h.slice(0,2), 16); g2 = parseInt(h.slice(2,4), 16); b2 = parseInt(h.slice(4,6), 16);
  } else {
    const m = c.match(/[\d.]+/g);
    if (!m || m.length < 3) return col;
    r = +m[0]; g2 = +m[1]; b2 = +m[2];
  }
  const f = (v) => Math.round(clamp(k < 0 ? v * (1 + k) : v + (255 - v) * k, 0, 255));
  return 'rgb(' + f(r) + ',' + f(g2) + ',' + f(b2) + ')';
}

function button(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 3 : 0;
  const fill = o.disabled ? (o.off || '#bcaa92') : (hot ? (o.hotFill || o.fill) : o.fill);
  const r = o.r === undefined ? 14 : o.r;
  /* لبهٔ زیرینِ تیره — دکمه از صفحه بیرون می‌زند */
  ctx.fillStyle = shade(fill, -.36);
  wobbleRect(b.x, b.y + dy + 7, b.w, b.h, r, b.x + b.y, 2);
  ctx.fill();
  withShadow(hot ? 22 : 14, hot ? 5 : 8, .32, () => {
    ctx.fillStyle = fill;
    wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2);
    ctx.fill();
  });
  /* حجم: روشن از بالا، تیره به پایین */
  ctx.save();
  ctx.beginPath(); wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2); ctx.clip();
  const g = ctx.createLinearGradient(0, b.y + dy, 0, b.y + dy + b.h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.45, 'rgba(255,255,255,.04)');
  g.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = g;
  ctx.fillRect(b.x, b.y + dy, b.w, b.h);
  /* برقِ باریکِ لبهٔ بالا */
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.fillRect(b.x + r, b.y + dy + 2, b.w - r * 2, 2);
  ctx.restore();
  text(label, b.x + b.w/2, b.y + b.h/2 + dy - (o.sub ? 9 : 0), {
    size: o.size || 26, color: o.color || '#fdf6e8', family: o.family || 'Lalezar',
  });
  if (o.sub) text(o.sub, b.x + b.w/2, b.y + b.h/2 + dy + 17,
    { size: 14, color: o.subColor || 'rgba(255,255,255,.88)' });
}

/** دکمهٔ گرد کوچک (مثل + و −). */
function roundButton(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 2 : 0;
  withShadow(10, hot ? 3 : 5, .3, () => {
    ctx.fillStyle = o.disabled ? '#cbbba3' : (hot ? (o.hotFill || o.fill) : o.fill);
    wobbleCircle(b.x, b.y + dy, b.r, b.x, 1.4);
    ctx.fill();
  });
  text(label, b.x, b.y + dy - 1,
    { size: o.size || 32, color: o.disabled ? '#a8988a' : (o.color || '#fdf6e8'), family: 'Lalezar' });
}

/** پرده‌ی تمام‌صفحه: برای شروعِ پرده و برای جشنِ پایان. */
function overlay(o) {
  const k = easeOut(clamp(o.t / .5, 0, 1));
  ctx.fillStyle = `rgba(30, 22, 16, ${.66 * k})`;
  ctx.fillRect(0, 0, SW, SH);

  const w = o.w || 700, h = o.h || 290;
  const x = (SW - w) / 2, y = o.y || (SH * .22);
  const s = lerp(.9, 1, easeBack(clamp(o.t / .65, 0, 1)));
  ctx.save();
  ctx.translate(SW/2, y + h/2);
  ctx.scale(s, s);
  ctx.translate(-SW/2, -(y + h/2));

  withShadow(30, 14, .42, () => {
    ctx.fillStyle = o.paper || '#fbf3e2';
    wobbleRect(x, y, w, h, 18, 121, 2.4);
    ctx.fill();
  });
  ctx.fillStyle = o.band || '#c8434f';
  wobbleRect(x, y, w, 12, 6, 123, 1);
  ctx.fill();

  if (o.icon) o.icon(SW/2, y + 56);
  text(o.title, SW/2, y + (o.icon ? 108 : 62),
    { size: o.titleSize || 36, color: o.ink || '#43291b', family: 'Lalezar', alpha: k });
  textWrap(o.body, SW/2, y + (o.icon ? 158 : 116), w - 90,
    { size: 19, color: o.inkSoft || '#8a6a52', alpha: k });
  ctx.restore();

  button(o.btn, o.btnLabel, { hot: o.btnHot, fill: o.btnFill || '#7fa356', hotFill: o.btnHotFill || '#8fb45f', size: 28 });
}

/** پیامِ کوتاهِ بالای صحنه. */
class Toast {
  constructor() { this.msg = null; this.t = 0; this.kind = 'info'; }
  say(msg, kind = 'info') { this.msg = msg; this.kind = kind; this.t = 2.6; }
  step(dt) { if (this.t > 0) { this.t -= dt; if (this.t <= 0) this.msg = null; } }
  draw(y = 24, colors = {}) {
    if (!this.msg) return;
    const k = clamp(this.t, 0, 1) * clamp((2.6 - this.t) * 5, 0, 1);
    ctx.save();
    ctx.globalAlpha = k;
    ctx.font = `700 19px "Vazirmatn", Tahoma, sans-serif`;
    const w = ctx.measureText(this.msg).width + 76;
    const fill = this.kind === 'good' ? (colors.good || '#7fa356')
               : this.kind === 'bad' ? (colors.bad || '#c8434f')
               : (colors.info || '#fbf3e2');
    paper(SW/2 - w/2, y, w, 48, fill, 151, 12, .3);
    text(this.msg, SW/2, y + 25,
      { size: 19, color: this.kind === 'info' ? (colors.ink || '#43291b') : '#fff8ec' });
    ctx.restore();
  }
}

/* ───────── آموزشِ پرده‌ای ─────────
   پرده‌هایی که منتظرِ کارِ بچه نیستند با یک ضربه جلو می‌روند. تایمر فقط
   پشتیبان است؛ بچهٔ کلاس سومی باید فرصتِ خواندن داشته باشد، نه اینکه
   متن قبل از تمام شدنِ خواندنش برود.                                    */

/** اگر پردهٔ فعلی خواندنی است، ضربه را می‌خورد و می‌رود پردهٔ بعد. */
function tutTap(tut, tapSteps, lastStep) {
  if (!tut.on || tapSteps.indexOf(tut.step) < 0) return false;
  if (tut.step >= lastStep) tut.on = false;
  else { tut.step++; tut.t = 0; }
  sfx.tap();
  return true;
}

/** نشانهٔ «برای ادامه بزن» — زیرِ کارتِ آموزش. */
function tutMore(cx, y, t, ink = '#3a2a18', bg = 'rgba(255, 250, 238, .94)') {
  ctx.save();
  ctx.globalAlpha = .62 + .38 * Math.sin(t * 3.2);
  ctx.font = '700 15px "Vazirmatn", Tahoma, sans-serif';
  const label = 'برای ادامه، هرجا را بزن';
  const w = ctx.measureText(label).width + 40, h = 32, x = cx - w / 2, r = 16;
  withShadow(10, 4, .3, () => {
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath(); ctx.fill();
  });
  text(label, cx, y + h / 2, { size: 15, color: ink });
  ctx.restore();
}

/** فونت‌ها را می‌آورد و بعد بازی را شروع می‌کند.
    مهم: هر دو راه (رسیدنِ فونت و مهلتِ پشتیبان) ممکن است برسند، ولی
    شروع فقط باید یک بار انجام شود؛ وگرنه دو حلقهٔ فریم راه می‌افتد و
    بازی دوبرابر سریع می‌شود. */
function whenFontsReady(start) {
  let done = false;
  const go = () => { if (done) return; done = true; start(); };
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('400 40px Lalezar'),
      document.fonts.load('700 20px Vazirmatn'),
      document.fonts.load('900 20px Vazirmatn'),
    ]).then(go, go);
    setTimeout(go, 2600);
  } else go();
}

/** حلقهٔ فریم با dtِ محدودشده. */
/* ───────── کیفیتِ خودکار ─────────
   اگر دستگاه کُند بود، اوّل درخشش و بعد رنگ‌بندی خاموش می‌شود تا بازی
   روان بماند. روی دستگاهِ قوی همه‌چیز روشن است. */
let QUALITY = 2;
let _fAcc = 0, _fN = 0, _qHold = 0;

function _qualityTick(gap) {
  if (gap <= 0 || gap > 200) return;
  _fAcc += gap; _fN++;
  if (_fN < 45) return;
  const avg = _fAcc / _fN;
  _fAcc = 0; _fN = 0;
  if (_qHold > 0) { _qHold--; return; }
  /* فاصلهٔ بالا و پایین باید باز باشد، وگرنه کیفیت بین دو پله بالا و
     پایین می‌پرد و بازی مدام تغییرِ ظاهر می‌دهد. */
  const before = QUALITY;
  if (avg > 21 && QUALITY > 0) { QUALITY--; _qHold = 4; }
  else if (avg < 13.5 && QUALITY < 2) { QUALITY++; _qHold = 10; }
  /* در پایین‌ترین کیفیت، صحنه را با نقطه‌های کمتر می‌کشیم */
  if (before !== QUALITY && (before === 0 || QUALITY === 0) && _refit) _refit();
}

/* یک حلقه، نه بیشتر — دو حلقه یعنی زمانِ بازی دوبرابر می‌گذرد.

   MOTION: تا پیش از این، به‌خاطرِ باگِ دو حلقه، همهٔ بازی‌ها عملاً با
   سرعتِ دو برابر اجرا می‌شدند و زمان‌بندی‌ها هم با همان حس تنظیم شده
   بودند. حالا که باگ رفع شده، سرعتِ درست (یک برابر) کُند به نظر
   می‌رسد. این ضریب جانِ حرکت‌ها را برمی‌گرداند، ولی نه تا آن دو برابرِ
   تصادفی. فقط روی جانِ حرکت اثر دارد، نه روی هیچ قانونِ علمی. */
const MOTION = 1.45;
let _looping = false;
function runLoop(step) {
  if (_looping) return;
  _looping = true;
  let last = performance.now();
  const frame = (now) => {
    const gap = now - last;
    /* بریدنِ بعد از ضرب، تا یک فریمِ کُند پرشِ بزرگ نسازد */
    const dt = Math.min(gap / 1000 * MOTION, 1/15);
    last = now;
    _qualityTick(gap);
    step(dt);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

/* ═════════════════ بازی ═════════════════ */
/* ═══════════════════════════════════════════════════════════════════════
   ماشینِ نماد — ریاضی سوم، فصل ۴، درس ۱ (حلّ مسئله: روش‌های نمادین)
   ───────────────────────────────────────────────────────────────────────
   جملهٔ خودِ کتاب: «تبدیل کردن مسئله به یک تساوی، درک مسئله را بهتر می‌کند
   و راهِ پیدا کردنِ جواب را هم مشخّص می‌سازد.»

   پس در این بازی، کارِ بچه پیدا کردنِ جواب نیست؛ نوشتنِ تساوی است.
   جواب را ماشین حساب می‌کند:

     تا وقتی تساویِ درستی روی ریل نچیده‌ای، ماشین نمی‌چرخد. تساوی که
     جور شد، خودش جواب را روی نوارِ کاغذی چاپ می‌کند و قفلِ جعبه باز
     می‌شود.

   و چون یک مسئله چند تساویِ درست دارد، ماشین همه‌شان را قبول می‌کند:
   «۱۰۰۰ − ۹۹۹ = ☐» به همان خوبیِ «۹۹۹ + ☐ = ۱۰۰۰» است. تنها شرطش این
   است که تساوی راست باشد و فقط با یک عددِ خاص راست باشد — یعنی واقعاً
   جوابِ مسئله را معیّن کند.

   کارت‌های ماشین شمرده‌اند، پس چیدنِ الکی و چرخاندن جواب نمی‌دهد.

   مسئله‌های ۲ و ۳ و ۴ دقیقاً همان‌هایی‌اند که در صفحهٔ ۶۲ کتاب آمده.
   ═══════════════════════════════════════════════════════════════════════ */

const SCENE_W = 1200, SCENE_H = 760;
const SLOTS = 7;

const P = {
  wallHi:  '#3a2f24',
  wallLo:  '#120e0a',
  desk:    '#5c3d24',
  deskLit: '#7b5330',
  deskDk:  '#3a2514',
  felt:    '#2f4a3c',
  feltLit: '#3c5c4a',
  brass:   '#d3a349',
  brassLit:'#efc878',
  brassDk: '#8f6a24',
  iron:    '#4b443c',
  ironLit: '#6d6459',
  glass:   'rgba(210, 240, 230, .18)',
  lamp:    '#2f6a52',
  lampLit: '#57a483',
  glow:    'rgba(255, 214, 140, .22)',
  tape:    '#f6efdc',
  tapeDk:  '#ded4bb',
  paper:   '#fbf3e2',
  paperDk: '#e6d9bd',
  ink:     '#2a231b',
  inkSoft: '#7d7264',
  numTile: '#e8dcc0',
  opTile:  '#c98a4a',
  eqTile:  '#7f9ac2',
  boxTile: '#b06a8a',
  good:    '#6fa85c',
  bad:     '#cf5f4a',
  gold:    '#f0c552',
};

/* ───────── مسئله‌ها ─────────
   tray هیچ‌وقت خودِ جواب را ندارد، وگرنه «☐ = جواب» می‌شد یک راهِ مفت.  */

const LEVELS = [
  { story: 'پنج تا گردو داشتم. مادرم چندتای دیگر داد و شدند دوازده تا.\nچندتا داد؟',
    ans: 7, nums: [5, 12, 3], cards: 3,
    hint: 'عددهای مسئله و جای خالی را روی ریل بچین تا یک تساوی شود.' },
  { story: 'بعد از ۹۹۹ چه عددی است؟\nیعنی چه عددی با ۹۹۹ جمع شود تا هزار شود؟',
    ans: 1, nums: [999, 1000, 990], cards: 3,
    hint: 'مسئلهٔ صفحهٔ ۶۲ کتاب.' },
  { story: 'از هزار چند واحد برداریم تا نهصد و نود به دست بیاید؟',
    ans: 10, nums: [1000, 990, 999], cards: 3,
    hint: 'اینجا کم می‌کنیم، پس علامتِ منها لازم است.' },
  { story: 'عددی را با هزار جمع کردیم؛ حاصل هزار و صد شد.\nآن عدد چند بود؟',
    ans: 100, nums: [1000, 1100, 900], cards: 3,
    hint: 'همان مسئلهٔ دوّمِ کتاب.' },
  { story: 'بیست و پنج تا مداد در جعبه بود. چندتا برداشتیم و هجده تا ماند.\nچندتا برداشتیم؟',
    ans: 7, nums: [25, 18, 43], cards: 3,
    hint: 'برداشتن یعنی کم کردن.' },
  { story: 'در قلّکم چهارده سکّه داشتم. شش تا خرج کردم و بعد چندتا انداختم.\nحاال بیست تا دارم. چندتا انداختم؟',
    ans: 12, nums: [14, 6, 20], cards: 3,
    hint: 'این مسئله دو کار دارد: کم کردن و بعد جمع کردن.' },
  { endless: true, cards: 3,
    hint: 'مسئله‌ها پشتِ سرِ هم می‌آیند.' },
];

/* ───────── وضعیت ───────── */

const S = {
  phase: 'intro',        // intro | play | print | won | lost
  level: 0,
  story: '', ans: 0,
  tray: [],              // { kind:'n'|'op'|'eq'|'box', v, used }
  rail: new Array(SLOTS).fill(null),   // اندیسِ کارت در tray
  cards: 0, cardsMax: 0,
  crank: 0,              // انیمیشنِ چرخاندن
  tapeMsg: '', tapeOk: false, tapeT: 0,
  solved: 0,
  hearts: 3,
  score: 0, best: 0,
  t: 0, phaseT: 0,
  hover: null,
  shake: 0,
  motes: [],
  floats: [],
  tut: { on: true, step: 0, t: 0 },
};

const bits = new Bits();
const toast = new Toast();
const L = () => LEVELS[S.level];

function loadBest() { try { return +localStorage.getItem('namad-best') || 0; } catch { return 0; } }
function saveBest(v) { try { localStorage.setItem('namad-best', String(v)); } catch { /* حالت خصوصی */ } }

/* ───────── چیدمان ───────── */

const HUD_H = 52;
const SLIP = { x: 28, y: 82, w: 300, h: 226 };
const BOX = { x: 62, y: 342, w: 232, h: 196 };
const MACH = { x: 356, y: 96, w: 812, h: 462 };
const TAPE = { x: 452, y: 132, w: 620, h: 104 };
const RAIL_Y = 302, SLOT_W = 96, SLOT_H = 92, SLOT_GAP = 12;
const RAIL_X = MACH.x + MACH.w / 2 - (SLOTS * SLOT_W + (SLOTS - 1) * SLOT_GAP) / 2;
const BTN_CRANK = { x: MACH.x + MACH.w / 2 - 116, y: 434, w: 232, h: 74 };
const TRAY_Y = 592;
const BTN_GO = { x: 470, y: 566, w: 260, h: 76 };

function slotBox(i) { return { x: RAIL_X + i * (SLOT_W + SLOT_GAP), y: RAIL_Y, w: SLOT_W, h: SLOT_H }; }
function trayBox(i) {
  const n = S.tray.length, w = 84, gap = 12, per = Math.min(n, 9);
  const rows = Math.ceil(n / per);
  const r = Math.floor(i / per), c = i % per;
  const inRow = Math.min(per, n - r * per);
  const x0 = SCENE_W / 2 - (inRow * w + (inRow - 1) * gap) / 2;
  return { x: x0 + c * (w + gap), y: TRAY_Y + r * 84, w, h: 72 };
}

/* ───────── حلقه ───────── */

const cv = document.getElementById('stage');
initStage(cv, SCENE_W, SCENE_H);
S.best = loadBest();
for (let i = 0; i < 26; i++) {
  S.motes.push({ x: Math.random() * SCENE_W, y: Math.random() * SCENE_H,
                 ph: Math.random() * TAU, sp: .2 + Math.random() * .4, r: .8 + Math.random() * 1.6 });
}
whenFontsReady(() => runLoop(step));

/** مسئلهٔ تصادفیِ حالتِ آزاد. جوابش هیچ‌وقت روی کارت‌ها نیست. */
function randomProblem() {
  const kind = Math.floor(Math.random() * 3);
  let a, b, ans, story;
  if (kind === 0) {                               // a + ☐ = b
    a = 3 + Math.floor(Math.random() * 40);
    ans = 2 + Math.floor(Math.random() * 30);
    b = a + ans;
    story = `${fa(a)} تا داشتم. چندتای دیگر آمد و شدند ${fa(b)} تا.\nچندتا آمد؟`;
  } else if (kind === 1) {                        // a − ☐ = b
    a = 12 + Math.floor(Math.random() * 40);
    ans = 2 + Math.floor(Math.random() * (a - 6));
    b = a - ans;
    story = `${fa(a)} تا داشتم. چندتا رفت و ${fa(b)} تا ماند.\nچندتا رفت؟`;
  } else {                                        // a − b + ☐ = c
    a = 14 + Math.floor(Math.random() * 30);
    b = 3 + Math.floor(Math.random() * 8);
    ans = 3 + Math.floor(Math.random() * 20);
    const c = a - b + ans;
    story = `${fa(a)} تا داشتم. ${fa(b)} تا خرج کردم و بعد چندتا اضافه شد.\nحاال ${fa(c)} تا دارم. چندتا اضافه شد؟`;
    const nums = [a, b, c].filter((n) => n !== ans);
    while (nums.length < 3) nums.push(a + b);
    return { story, ans, nums };
  }
  const nums = [a, b];
  let extra = a + b;
  while (extra === ans || nums.indexOf(extra) >= 0) extra++;
  nums.push(extra);
  return { story, ans, nums };
}

function loadProblem(pr) {
  S.story = pr.story;
  S.ans = pr.ans;
  S.tray = [];
  for (const n of pr.nums) S.tray.push({ kind: 'n', v: n });
  S.tray.push({ kind: 'op', v: '+' }, { kind: 'op', v: '+' },
               { kind: 'op', v: '−' }, { kind: 'op', v: '−' },
               { kind: 'eq' }, { kind: 'box' });
  S.rail = new Array(SLOTS).fill(null);
  S.cards = L().cards;
  S.cardsMax = L().cards;
  S.tapeMsg = ''; S.tapeT = 0;
}

function startLevel(i, keep) {
  const lv = LEVELS[i];
  S.level = i;
  loadProblem(lv.endless ? randomProblem() : { story: lv.story, ans: lv.ans, nums: lv.nums });
  if (!keep) { S.hearts = 3; S.solved = 0; }
  S.phase = 'play'; S.phaseT = 0;
  S.crank = 0;
  S.tut.on = i === 0 && !keep; S.tut.step = 0; S.tut.t = 0;
  toast.say(lv.hint, 'info');
}

function floatText(x, y, txt, col, size) { S.floats.push({ x, y, txt, col, t: 0, size: size || 24 }); }

function step(dt) {
  S.t += dt; S.phaseT += dt;
  if (S.shake > 0) S.shake -= dt;
  if (S.crank > 0) S.crank = Math.max(0, S.crank - dt * 1.6);
  if (S.tapeT > 0) S.tapeT -= dt;
  for (const m of S.motes) {
    m.ph += dt * m.sp; m.y -= dt * (5 + m.sp * 10); m.x += Math.sin(m.ph) * dt * 8;
    if (m.y < -10) { m.y = SCENE_H + 10; m.x = Math.random() * SCENE_W; }
  }
  for (const f of S.floats) { f.t += dt; f.y -= 42 * dt; }
  S.floats = S.floats.filter((f) => f.t < 1.5);
  if (S.phase === 'play' && S.tut.on) tutStep(dt);
  bits.step(dt);
  toast.step(dt);
  draw();
}

/* ───────── چیدنِ ریل ───────── */

const onRail = (i) => S.rail.indexOf(i) >= 0;

function placeCard(i) {
  if (S.phase !== 'play' || onRail(i)) return;
  const k = S.rail.indexOf(null);
  if (k < 0) { S.shake = .16; sfx.nope(); return; }
  S.rail[k] = i;
  sfx.place();
}

function pullCard(k) {
  if (S.phase !== 'play' || S.rail[k] === null) return;
  /* کارت‌های بعدی می‌آیند جلو تا وسطِ تساوی جای خالی نماند. */
  S.rail.splice(k, 1);
  S.rail.push(null);
  sfx.tap();
}

function clearRail() { S.rail = new Array(SLOTS).fill(null); sfx.slide(); }

/* ───────── خواندنِ تساوی ─────────
   ماشین هر تساویِ درستی را قبول می‌کند، نه فقط یک شکلِ خاص را.        */

function tokens() { return S.rail.filter((i) => i !== null).map((i) => S.tray[i]); }

/** آیا چیدمان یک تساویِ خوش‌ساخت است؟ */
function parseEq(tk) {
  const eqs = tk.filter((t) => t.kind === 'eq').length;
  const boxes = tk.filter((t) => t.kind === 'box').length;
  const nums = tk.filter((t) => t.kind === 'n').length;
  if (eqs !== 1) return { err: 'یک علامتِ مساوی لازم است' };
  if (boxes !== 1) return { err: 'یک جای خالی لازم است' };
  if (nums < 2) return { err: 'دستِ‌کم دو عدد لازم است' };
  const at = tk.findIndex((t) => t.kind === 'eq');
  const left = tk.slice(0, at), right = tk.slice(at + 1);
  for (const side of [left, right]) {
    if (!side.length) return { err: 'دو طرفِ مساوی باید پُر باشد' };
    for (let i = 0; i < side.length; i++) {
      const wantVal = i % 2 === 0;
      const isVal = side[i].kind === 'n' || side[i].kind === 'box';
      if (wantVal !== isVal) return { err: 'ترتیبِ عدد و علامت جور نیست' };
    }
    if (side.length % 2 === 0) return { err: 'یک عدد کم است' };
  }
  return { left, right };
}

function evalSide(side, x) {
  const v = (t) => (t.kind === 'box' ? x : t.v);
  let s = v(side[0]);
  for (let i = 1; i < side.length; i += 2) {
    s = side[i].v === '+' ? s + v(side[i + 1]) : s - v(side[i + 1]);
  }
  return s;
}

function crank() {
  if (S.phase !== 'play') return;
  const p = parseEq(tokens());
  S.crank = 1;
  sfx.tone(180, .26, 'sawtooth', .06);
  if (p.err) {
    S.cards--;
    S.shake = .3;
    S.tapeMsg = p.err; S.tapeOk = false; S.tapeT = 3.4;
    sfx.nope();
    return outOfCards();
  }
  const holds = (x) => evalSide(p.left, x) === evalSide(p.right, x);
  if (!holds(S.ans)) {
    S.cards--;
    S.shake = .3;
    S.tapeMsg = 'این تساوی راست نیست'; S.tapeOk = false; S.tapeT = 3.4;
    sfx.nope();
    return outOfCards();
  }
  /* تساوی باید فقط با یک عدد راست باشد، وگرنه جواب را معیّن نمی‌کند. */
  if (holds(S.ans + 1) || holds(S.ans - 1)) {
    S.cards--;
    S.shake = .26;
    S.tapeMsg = 'این تساوی با هر عددی راست است'; S.tapeOk = false; S.tapeT = 3.4;
    sfx.nope();
    return outOfCards();
  }
  /* درست شد — حاال ماشین جواب را حساب می‌کند، نه بچه. */
  S.tapeMsg = `جای خالی = ${fa(S.ans)}`;
  S.tapeOk = true; S.tapeT = 6;
  const pts = 300 + S.cards * 150;
  S.score += pts;
  if (S.score > S.best) { S.best = S.score; saveBest(S.best); }
  S.solved++;
  floatText(MACH.x + MACH.w / 2, TAPE.y + 40, `+${fa(pts)}`, P.gold);
  bits.confetti(BOX.x + BOX.w / 2, BOX.y + 40, 60, [P.gold, P.brassLit, P.tape, '#fff']);
  sfx.win();
  S.phase = 'won'; S.phaseT = 0;
}

function outOfCards() {
  if (S.cards > 0) return;
  S.hearts--;
  if (S.hearts <= 0) { S.phase = 'lost'; S.phaseT = 0; return; }
  S.cards = S.cardsMax;
  S.rail = new Array(SLOTS).fill(null);
  toast.say('کارت‌ها تمام شد — یک دل کم شد', 'bad');
}

/* ───────── آموزش ───────── */

const TUT_TAP = [0, 2], TUT_LAST = 2;

function tutStep(dt) {
  S.tut.t += dt;
  if (S.tut.step === 0 && S.tut.t > 30) { S.tut.step = 1; S.tut.t = 0; }
  if (S.tut.step === 1 && S.rail.some((q) => q !== null)) { S.tut.step = 2; S.tut.t = 0; }
  if (S.tut.step === 2 && S.tut.t > 30) S.tut.on = false;
}

/* ───────── ورودی ───────── */

const BTN_CLEAR = { x: MACH.x + MACH.w - 190, y: 442, w: 150, h: 56 };

function hitTest(p) {
  if (S.phase !== 'play') return inRect(p, BTN_GO) ? BTN_GO : null;
  if (inRect(p, BTN_CRANK)) return BTN_CRANK;
  if (inRect(p, BTN_CLEAR)) return BTN_CLEAR;
  for (let k = 0; k < SLOTS; k++) if (inRect(p, slotBox(k))) return { slot: k };
  for (let i = 0; i < S.tray.length; i++) if (inRect(p, trayBox(i))) return { card: i };
  return null;
}

cv.addEventListener('pointermove', (e) => {
  S.hover = hitTest(toStage(e));
  cv.style.cursor = S.hover ? 'pointer' : 'default';
});
cv.addEventListener('pointerleave', () => { S.hover = null; });
cv.addEventListener('pointerdown', (e) => {
  if (S.phase === 'play' && tutTap(S.tut, TUT_TAP, TUT_LAST)) return;
  const h = hitTest(toStage(e));
  if (S.phase === 'intro') { if (h) startLevel(0); return; }
  if (S.phase === 'won') {
    if (!h) return;
    if (L().endless) startLevel(S.level, true);
    else if (S.level + 1 < LEVELS.length) startLevel(S.level + 1, true);
    else { S.score = 0; startLevel(0); }
    return;
  }
  if (S.phase === 'lost') { if (h) { S.score = 0; startLevel(S.level); } return; }
  if (!h) return;
  if (h === BTN_CRANK) return crank();
  if (h === BTN_CLEAR) return clearRail();
  if (h.slot !== undefined) return pullCard(h.slot);
  if (h.card !== undefined) return placeCard(h.card);
});

/* ───────── ابزارِ نقاشی ───────── */

function rrPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function numText(str, x, y, o = {}) {
  ctx.save();
  ctx.font = `${o.family === 'Vazirmatn' ? (o.weight || 700) : '400'} ${o.size || 20}px "${o.family || 'Lalezar'}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  ctx.direction = 'ltr';
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.fillStyle = o.color || P.ink;
  ctx.fillText(str, x, y);
  ctx.restore();
}

function spot(rects, alpha) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, SCENE_W, SCENE_H);
  for (const r of rects) rrPath(r.x - 12, r.y - 12, r.w + 24, r.h + 24, 20);
  ctx.fillStyle = `rgba(10, 7, 4, ${alpha})`;
  ctx.fill('evenodd');
  ctx.restore();
}

function pointHand(x, y) {
  const bob = Math.sin(S.t * 3.4) * 8;
  ctx.save();
  ctx.translate(x, y + bob);
  withShadow(12, 5, .4, () => {
    ctx.fillStyle = '#f6dfc0';
    ctx.beginPath();
    ctx.moveTo(0, -6);
    ctx.quadraticCurveTo(-9, -2, -10, 16);
    ctx.quadraticCurveTo(-11, 34, 0, 36);
    ctx.quadraticCurveTo(11, 34, 10, 16);
    ctx.quadraticCurveTo(9, -2, 0, -6);
    ctx.closePath(); ctx.fill();
    wobbleCircle(0, -12, 8, 4, 1); ctx.fill();
  }, '20, 12, 6');
  ctx.strokeStyle = '#c9a982'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-7, 18); ctx.lineTo(7, 18); ctx.stroke();
  ctx.restore();
}

/** یک کارتِ نماد. */
function cardFace(c, b, o = {}) {
  const dy = o.hot ? 3 : 0;
  const col = c.kind === 'n' ? P.numTile
    : c.kind === 'op' ? P.opTile
      : c.kind === 'eq' ? P.eqTile : P.boxTile;
  withShadow(12, o.hot ? 3 : 6, .38, () => {
    ctx.fillStyle = col;
    wobbleRect(b.x, b.y + dy, b.w, b.h, 10, b.x + b.y, 1.4); ctx.fill();
  }, '20, 12, 6');
  ctx.fillStyle = 'rgba(255,255,255,.24)';
  wobbleRect(b.x + 4, b.y + 4 + dy, b.w - 8, 8, 4, b.x + 1, .8); ctx.fill();
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2 + dy;
  if (c.kind === 'n') {
    const s = c.v >= 1000 ? 26 : (c.v >= 100 ? 30 : 36);
    numText(fa(c.v), cx, cy, { size: s, color: P.ink });
  } else if (c.kind === 'op') {
    numText(c.v === '+' ? '+' : '−', cx, cy - 2, { size: 44, color: '#fff6e8' });
  } else if (c.kind === 'eq') {
    ctx.strokeStyle = '#fff6e8'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - 15, cy - 8); ctx.lineTo(cx + 15, cy - 8);
    ctx.moveTo(cx - 15, cy + 8); ctx.lineTo(cx + 15, cy + 8);
    ctx.stroke();
  } else {
    ctx.strokeStyle = '#fff6e8'; ctx.lineWidth = 4;
    ctx.setLineDash([7, 5]);
    ctx.beginPath(); rrPath(cx - 17, cy - 17, 34, 34, 6); ctx.stroke();
    ctx.setLineDash([]);
  }
}

/* ───────── صحنه ───────── */

function draw() {
  beginScene('#14100d');
  ctx.save();
  if (S.shake > 0) {
    const k = S.shake * 13;
    ctx.translate(Math.sin(S.t * 58) * k, Math.cos(S.t * 45) * k * .5);
  }

  drawOffice();
  drawSlip();
  drawBox();
  drawMachine();
  drawRail();
  drawTray();
  bits.draw();
  drawFloats();
  ctx.restore();

  drawHUD();
  if (!(S.phase === 'play' && S.tut.on)) {
    ctx.save();
    ctx.translate(MACH.x + MACH.w / 2 - SCENE_W / 2, 0);
    toast.draw(HUD_H + 8, { good: P.good, bad: P.bad, info: P.paper, ink: P.ink });
    ctx.restore();
  }

  if (S.phase === 'play' && S.tut.on) drawTutorial();
  if (S.phase === 'intro') drawIntro();
  if (S.phase === 'won') drawWon();
  if (S.phase === 'lost') drawLost();

  endScene(.14, 'rgba(6, 4, 2, .58)');
}

function drawOffice() {
  const g = ctx.createLinearGradient(200, 80, 900, 760);
  g.addColorStop(0, P.wallHi);
  g.addColorStop(1, P.wallLo);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, SCENE_W, SCENE_H);

  /* قابِ چوبیِ دیوار */
  ctx.save();
  ctx.globalAlpha = .16;
  ctx.strokeStyle = '#0d0906'; ctx.lineWidth = 4;
  for (let i = 0; i < 10; i++) {
    ctx.beginPath(); ctx.moveTo(i * 124, 0); ctx.lineTo(i * 124, SCENE_H); ctx.stroke();
  }
  ctx.restore();

  /* چراغِ سبزِ روی میز */
  const lx = 190, ly = 92;
  const gl = ctx.createRadialGradient(lx, ly + 60, 20, lx, ly + 60, 560);
  gl.addColorStop(0, P.glow);
  gl.addColorStop(1, 'rgba(255, 214, 140, 0)');
  ctx.fillStyle = gl;
  ctx.fillRect(0, 0, SCENE_W, SCENE_H);

  /* گردوغبارِ توی نور */
  ctx.save();
  for (const m of S.motes) {
    ctx.globalAlpha = .05 + .1 * (.5 + .5 * Math.sin(m.ph * 2));
    ctx.fillStyle = '#ffe9c4';
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, TAU); ctx.fill();
  }
  ctx.restore();

  /* میزِ چوبی */
  ctx.fillStyle = P.deskDk;
  ctx.fillRect(0, 556, SCENE_W, SCENE_H - 556);
  ctx.fillStyle = P.desk;
  wobbleRect(0, 550, SCENE_W, 22, 0, 21, 1.4); ctx.fill();
  ctx.fillStyle = P.deskLit;
  wobbleRect(0, 548, SCENE_W, 7, 0, 23, .8); ctx.fill();
  ctx.fillStyle = P.felt;
  wobbleRect(150, 572, SCENE_W - 300, SCENE_H - 572, 6, 25, 2); ctx.fill();
  ctx.fillStyle = P.feltLit;
  wobbleRect(150, 572, SCENE_W - 300, 6, 3, 27, .8); ctx.fill();

  /* دوات و قلم و مُهر، گوشهٔ میز */
  ctx.save();
  ctx.translate(96, 700);
  ctx.fillStyle = '#1e2a34';
  wobbleRect(-26, -26, 52, 40, 5, 31, 1.2); ctx.fill();
  ctx.fillStyle = '#2c3d4a';
  wobbleEllipse(0, -26, 26, 8, 0, 33, 1); ctx.fill();
  ctx.strokeStyle = '#c9a06a'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(6, -30); ctx.lineTo(40, -78); ctx.stroke();
  ctx.fillStyle = '#e8dcc0';
  ctx.beginPath();
  ctx.moveTo(38, -80); ctx.lineTo(48, -72); ctx.lineTo(58, -96);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.translate(SCENE_W - 104, 704);
  ctx.fillStyle = P.desk;
  wobbleRect(-30, -14, 60, 22, 4, 35, 1); ctx.fill();
  ctx.fillStyle = P.deskLit;
  wobbleRect(-12, -44, 24, 32, 5, 37, 1); ctx.fill();
  ctx.fillStyle = '#8a3a3a';
  wobbleRect(-30, 6, 60, 8, 3, 39, .8); ctx.fill();
  ctx.restore();
}

/** برگهٔ مسئله، زیرِ نورِ چراغ. */
function drawSlip() {
  const b = SLIP;
  ctx.save();
  ctx.rotate(-.012);
  withShadow(20, 9, .45, () => {
    ctx.fillStyle = P.paper;
    wobbleRect(b.x, b.y, b.w, b.h, 6, 41, 2.6); ctx.fill();
  }, '20, 12, 6');
  ctx.fillStyle = P.opTile;
  wobbleRect(b.x, b.y, b.w, 9, 4, 43, .8); ctx.fill();
  ctx.save();
  ctx.globalAlpha = .1;
  ctx.fillStyle = '#9a7c4a';
  for (let i = 0; i < 5; i++) {
    wobbleCircle(b.x + 30 + noise1(i * 4.1) * (b.w - 60), b.y + 30 + noise1(i * 8.3) * (b.h - 60),
      16 + noise1(i * 2) * 26, i * 3, 2.2);
    ctx.fill();
  }
  ctx.restore();
  text('مسئله', b.x + b.w / 2, b.y + 36, { size: 22, family: 'Lalezar', color: P.inkSoft });
  ctx.strokeStyle = 'rgba(125, 114, 100, .3)'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(b.x + 24, b.y + 52); ctx.lineTo(b.x + b.w - 24, b.y + 52); ctx.stroke();
  textWrap(S.story, b.x + b.w / 2, b.y + 84, b.w - 44, { size: 17, color: P.ink, lineHeight: 28 });
  ctx.restore();
}

/** جعبهٔ قفل‌دار: با تساویِ درست باز می‌شود. */
function drawBox() {
  const b = BOX;
  const open = S.phase === 'won' ? easeOut(clamp(S.phaseT * 1.4, 0, 1)) : 0;
  if (open > .05) {
    const gl = ctx.createRadialGradient(b.x + b.w / 2, b.y + 40, 8, b.x + b.w / 2, b.y + 40, 220);
    gl.addColorStop(0, `rgba(255, 220, 130, ${.36 * open})`);
    gl.addColorStop(1, 'rgba(255, 220, 130, 0)');
    ctx.fillStyle = gl;
    ctx.fillRect(b.x - 160, b.y - 160, b.w + 320, b.h + 320);
    numText(fa(S.ans), b.x + b.w / 2, b.y + 34, { size: 54, color: '#ffeec0' });
  }
  /* در */
  ctx.save();
  ctx.translate(b.x + b.w / 2, b.y + 28);
  ctx.rotate(-open * .95);
  ctx.translate(-(b.x + b.w / 2), -(b.y + 28));
  ctx.fillStyle = P.deskLit;
  wobbleRect(b.x + 6, b.y + 12, b.w - 12, 32, 6, 51, 1.2); ctx.fill();
  ctx.fillStyle = P.brass;
  wobbleRect(b.x + b.w / 2 - 22, b.y + 20, 44, 18, 4, 53, .8); ctx.fill();
  ctx.restore();
  /* بدنه */
  withShadow(20, 10, .42, () => {
    ctx.fillStyle = P.desk;
    wobbleRect(b.x, b.y + 40, b.w, b.h - 40, 8, 55, 1.6); ctx.fill();
  }, '20, 12, 6');
  ctx.fillStyle = P.brassDk;
  wobbleRect(b.x + 10, b.y + 40, 12, b.h - 40, 3, 57, 1); ctx.fill();
  wobbleRect(b.x + b.w - 22, b.y + 40, 12, b.h - 40, 3, 59, 1); ctx.fill();
  ctx.fillStyle = open > .05 ? P.brassLit : P.iron;
  wobbleRect(b.x + b.w / 2 - 20, b.y + 62, 40, 36, 6, 61, 1); ctx.fill();
  ctx.strokeStyle = open > .05 ? P.brassLit : P.ironLit;
  ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath();
  if (open > .05) ctx.arc(b.x + b.w / 2 + 10, b.y + 56, 12, Math.PI * .9, Math.PI * 2.1);
  else ctx.arc(b.x + b.w / 2, b.y + 56, 12, Math.PI, TAU);
  ctx.stroke();
  text('جوابِ مسئله', b.x + b.w / 2, b.y - 16, { size: 16, color: 'rgba(251, 243, 226, .6)' });
}

/* ───────── ماشین ───────── */

function drawMachine() {
  const b = MACH;
  withShadow(28, 14, .5, () => {
    ctx.fillStyle = P.brassDk;
    wobbleRect(b.x, b.y, b.w, b.h, 18, 71, 2); ctx.fill();
  }, '20, 12, 6');
  ctx.fillStyle = P.brass;
  wobbleRect(b.x + 8, b.y + 8, b.w - 16, b.h - 16, 14, 73, 1.6); ctx.fill();
  ctx.fillStyle = P.brassLit;
  wobbleRect(b.x + 8, b.y + 8, b.w - 16, 12, 6, 75, 1); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  wobbleRect(b.x + 8, b.y + b.h - 26, b.w - 16, 18, 6, 77, 1); ctx.fill();
  for (const cx of [b.x + 26, b.x + b.w - 26]) for (const cy of [b.y + 26, b.y + b.h - 26]) {
    ctx.fillStyle = P.brassDk;
    ctx.beginPath(); ctx.arc(cx, cy, 7, 0, TAU); ctx.fill();
    ctx.fillStyle = P.brassLit;
    ctx.beginPath(); ctx.arc(cx - 2, cy - 2, 3, 0, TAU); ctx.fill();
  }

  /* قابِ تیرهٔ پشتِ ریل */
  ctx.fillStyle = 'rgba(30, 20, 8, .34)';
  wobbleRect(RAIL_X - 34, RAIL_Y - 20, SLOTS * (SLOT_W + SLOT_GAP) - SLOT_GAP + 68, SLOT_H + 52, 12, 79, 1.6);
  ctx.fill();

  /* چرخ‌دنده‌های کناری */
  for (const gx of [b.x + 40, b.x + b.w - 40]) {
    const rot = S.t * .5 + (gx > b.x + b.w / 2 ? 1 : 0) + (S.crank > 0 ? (1 - S.crank) * 5 : 0);
    ctx.save();
    ctx.translate(gx, RAIL_Y + SLOT_H / 2);
    ctx.rotate(rot);
    ctx.fillStyle = P.brassDk;
    for (let i = 0; i < 9; i++) {
      ctx.save();
      ctx.rotate(i / 9 * TAU);
      wobbleRect(-5, -30, 10, 12, 2, i, .6); ctx.fill();
      ctx.restore();
    }
    ctx.beginPath(); ctx.arc(0, 0, 22, 0, TAU); ctx.fill();
    ctx.fillStyle = P.brass;
    ctx.beginPath(); ctx.arc(0, 0, 16, 0, TAU); ctx.fill();
    ctx.fillStyle = P.brassDk;
    ctx.beginPath(); ctx.arc(0, 0, 6, 0, TAU); ctx.fill();
    ctx.restore();
  }

  /* نوارِ کاغذی که از بالای ماشین بیرون می‌آید */
  const t = TAPE;
  ctx.fillStyle = P.iron;
  wobbleRect(t.x - 14, t.y - 16, t.w + 28, 14, 5, 81, 1); ctx.fill();
  withShadow(14, 6, .34, () => {
    ctx.fillStyle = P.tape;
    wobbleRect(t.x, t.y, t.w, t.h, 4, 83, 1.6); ctx.fill();
  }, '20, 12, 6');
  ctx.fillStyle = P.tapeDk;
  for (let i = 0; i < 2; i++) {
    for (let x = t.x + 12; x < t.x + t.w - 8; x += 26) {
      ctx.beginPath();
      ctx.arc(x, i ? t.y + t.h - 8 : t.y + 8, 3.4, 0, TAU);
      ctx.fill();
    }
  }
  if (S.tapeT > 0) {
    ctx.save();
    ctx.globalAlpha = clamp(S.tapeT, 0, 1);
    text(S.tapeMsg, t.x + t.w / 2, t.y + t.h / 2,
      { size: S.tapeOk ? 30 : 21, family: S.tapeOk ? 'Lalezar' : 'Vazirmatn',
        color: S.tapeOk ? P.good : P.bad });
    ctx.restore();
  } else {
    text('ماشینِ نماد', t.x + t.w / 2, t.y + t.h / 2 - 12,
      { size: 24, family: 'Lalezar', color: 'rgba(42, 35, 27, .45)' });
    text('تساوی را روی ریل بچین و اهرم را بکش', t.x + t.w / 2, t.y + t.h / 2 + 18,
      { size: 14, color: 'rgba(42, 35, 27, .38)' });
  }

  /* کارت‌های مانده */
  for (let i = 0; i < S.cardsMax; i++) {
    const x = MACH.x + 44 + i * 30, y = 452;
    ctx.save();
    ctx.globalAlpha = i < S.cards ? 1 : .22;
    ctx.fillStyle = i < S.cards ? P.tape : '#7d7264';
    wobbleRect(x - 10, y - 14, 22, 30, 3, i * 3 + 1, .8); ctx.fill();
    ctx.restore();
  }
  text('کارت', MACH.x + 44 + (S.cardsMax - 1) * 15, 486, { size: 13, color: 'rgba(42, 35, 27, .6)' });

  /* اهرم */
  const pull = S.crank > 0 ? Math.sin((1 - S.crank) * Math.PI) : 0;
  button({ x: BTN_CRANK.x, y: BTN_CRANK.y + pull * 6, w: BTN_CRANK.w, h: BTN_CRANK.h },
    'اهرم را بکش', {
      hot: S.hover === BTN_CRANK, disabled: S.phase !== 'play',
      fill: '#8f6a24', hotFill: '#a97f2e', size: 26,
    });
  button(BTN_CLEAR, 'ریل را خالی کن', {
    hot: S.hover === BTN_CLEAR, disabled: S.phase !== 'play',
    fill: '#6a5b4a', hotFill: '#7d6c58', size: 15, r: 12, family: 'Vazirmatn',
  });
}

function drawRail() {
  /* میلهٔ ریل */
  ctx.fillStyle = P.iron;
  wobbleRect(RAIL_X - 18, RAIL_Y + SLOT_H - 6, SLOTS * (SLOT_W + SLOT_GAP) - SLOT_GAP + 36, 16, 5, 91, 1);
  ctx.fill();
  ctx.fillStyle = P.ironLit;
  wobbleRect(RAIL_X - 18, RAIL_Y + SLOT_H - 6, SLOTS * (SLOT_W + SLOT_GAP) - SLOT_GAP + 36, 5, 3, 93, .8);
  ctx.fill();

  for (let k = 0; k < SLOTS; k++) {
    const b = slotBox(k);
    const idx = S.rail[k];
    if (idx === null) {
      ctx.save();
      ctx.globalAlpha = .5;
      ctx.strokeStyle = 'rgba(40, 30, 16, .6)'; ctx.lineWidth = 3;
      ctx.setLineDash([8, 7]);
      ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 10); ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    } else {
      cardFace(S.tray[idx], b, { hot: S.hover && S.hover.slot === k });
    }
  }
}

function drawTray() {
  for (let i = 0; i < S.tray.length; i++) {
    const b = trayBox(i);
    if (onRail(i)) {
      ctx.save();
      ctx.globalAlpha = .2;
      ctx.strokeStyle = '#e8dcc0'; ctx.lineWidth = 2.4;
      ctx.setLineDash([6, 6]);
      ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 10); ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
      continue;
    }
    cardFace(S.tray[i], b, { hot: S.hover && S.hover.card === i });
  }
}

function drawFloats() {
  for (const f of S.floats) {
    const k = clamp(1 - f.t / 1.5, 0, 1);
    numText(f.txt, f.x, f.y, { size: f.size, color: f.col, alpha: k });
  }
}

function drawHUD() {
  ctx.fillStyle = 'rgba(20, 14, 8, .8)';
  ctx.fillRect(0, 0, SCENE_W, HUD_H);
  ctx.fillStyle = 'rgba(211, 163, 73, .45)';
  ctx.fillRect(0, HUD_H - 3, SCENE_W, 3);
  for (let i = 0; i < 3; i++) {
    const x = SCENE_W - 32 - i * 33;
    ctx.save();
    ctx.globalAlpha = i < S.hearts ? 1 : .22;
    ctx.fillStyle = i < S.hearts ? '#d4574a' : '#574c40';
    ctx.translate(x, HUD_H / 2);
    const s = i < S.hearts ? 1 + Math.sin(S.t * 3 + i) * .05 : 1;
    ctx.scale(s, s);
    ctx.beginPath();
    ctx.moveTo(0, 9);
    ctx.bezierCurveTo(-14, -2, -9, -13, 0, -6);
    ctx.bezierCurveTo(9, -13, 14, -2, 0, 9);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  const nm = L().endless ? 'مسئله‌های آزاد' : `مسئلهٔ ${fa(S.level + 1)} از ${fa(LEVELS.length - 1)}`;
  text(nm, SCENE_W - 146, HUD_H / 2, { size: 18, family: 'Lalezar', color: '#f4e5c6', align: 'right' });
  numText(fa(S.score), 26, HUD_H / 2 - 1, { size: 26, color: P.gold, align: 'left' });
  text(`رکورد ${fa(S.best)}`, 108, HUD_H / 2, { size: 14, color: 'rgba(244, 229, 198, .58)', align: 'left' });
  if (S.solved) text(`${fa(S.solved)} حل‌شده`, 216, HUD_H / 2, { size: 15, color: P.good, align: 'left' });
}

/* ───────── آموزش ───────── */

function drawTutorial() {
  const st = S.tut.step;
  let holes = [], msg = '', hand = null;

  if (st === 0) {
    holes = [{ x: SLIP.x - 6, y: SLIP.y - 6, w: SLIP.w + 12, h: SLIP.h + 12 },
             { x: BOX.x - 6, y: BOX.y - 6, w: BOX.w + 12, h: BOX.h + 40 }];
    msg = 'جوابِ مسئله توی جعبهٔ قفل‌دار است. تو قرار نیست حسابش کنی.';
  } else if (st === 1) {
    holes = [{ x: trayBox(0).x - 10, y: TRAY_Y - 10, w: SCENE_W - 2 * (trayBox(0).x - 10), h: 92 },
             { x: RAIL_X - 20, y: RAIL_Y - 12, w: SLOTS * (SLOT_W + SLOT_GAP), h: SLOT_H + 30 }];
    msg = 'کارت‌ها را بزن تا روی ریل بروند و یک تساوی بسازند.';
    hand = { x: trayBox(0).x + 42, y: TRAY_Y - 62 };
  } else {
    holes = [{ x: BTN_CRANK.x - 10, y: BTN_CRANK.y - 10, w: BTN_CRANK.w + 20, h: BTN_CRANK.h + 20 },
             { x: TAPE.x - 8, y: TAPE.y - 22, w: TAPE.w + 16, h: TAPE.h + 30 }];
    msg = 'اهرم را که بکشی، اگر تساوی درست باشد ماشین خودش جواب را چاپ می‌کند.';
  }

  spot(holes, .6);
  /* کارتِ آموزش گوشهٔ چپ می‌نشیند، چون وسطِ صحنه همیشه هدفِ نورافکن است. */
  const w = 310, h = 150, x = 22, y = 580;
  paper(x, y, w, h, P.paper, 61, 14, .45);
  ctx.fillStyle = P.opTile;
  wobbleRect(x, y, 9, h, 4, 63, .8); ctx.fill();
  textWrap(msg, x + w / 2 + 6, y + 40, w - 46, { size: 16, color: P.ink, lineHeight: 25 });
  if (TUT_TAP.indexOf(st) >= 0) tutMore(x + w / 2, y - 42, S.t, P.ink);
  if (hand) pointHand(hand.x, hand.y);
}

function drawLost() {
