<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a2a2e">
<title>تصفیه‌خانه — زندگی ما و آب (بازی)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>
  /* صفحه نباید هیچ‌جا اسکرول یا زوم شود؛ بازی باید مثل یک برنامه رفتار کند. */
  html, body {
    margin: 0; padding: 0; background: #1a2a2e;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body {
    position: fixed; inset: 0;          /* جلوی کشیده‌شدنِ صفحه در سافاریِ گوشی */
    width: 100%; height: 100vh; height: 100dvh;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none; -webkit-touch-callout: none;
  }

  /* گوشیِ عمودی صحنه را ریز می‌کند؛ بچه باید گوشی را بچرخاند. */
  #rotate { display: none; }
  @media (orientation: portrait) and (max-width: 860px) {
    #stage { display: none; }
    #rotate {
      display: flex; position: fixed; inset: 0;
      z-index: 9;
      flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      background: #1a2a2e; color: #f6ead2;
      font: 700 20px "Vazirmatn", Tahoma, sans-serif; text-align: center; padding: 32px;
    }
    #rotate svg { animation: tilt 2.4s ease-in-out infinite; }
    @keyframes tilt { 0%, 45% { transform: rotate(0deg); } 65%, 100% { transform: rotate(-90deg); } }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="rotate">
  <svg width="86" height="126" viewBox="0 0 86 126" fill="none" aria-hidden="true">
    <rect x="3" y="3" width="80" height="120" rx="12" stroke="#e8b448" stroke-width="5"/>
    <rect x="15" y="19" width="56" height="88" rx="5" fill="#e8b448" opacity=".28"/>
    <circle cx="43" cy="115" r="4" fill="#e8b448"/>
  </svg>
  <div>گوشی را بچرخان</div>
  <div style="font-weight:400;opacity:.7;font-size:16px">این بازی خوابیده بازی می‌شود</div>
</div>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   هستهٔ مشترکِ بازی‌ها — سبک «کاغذبُری»
   ───────────────────────────────────────────────────────────────────────
   این فایل جعبه‌ابزار است، نه چارچوب: هر بازی حلقه و وضعیت خودش را دارد
   و فقط از این توابع برای کشیدن استفاده می‌کند. دلیلش این است که هر بازی
   باید حس‌وحال خودش را داشته باشد، نه اینکه همه شبیه هم دربیایند.

   قاعده‌های ثابتِ تصویری:
   • نور همیشه از بالا-چپ می‌تابد، پس سایه‌ها به پایین-راست می‌افتند.
   • هیچ لبه‌ای کاملاً صاف نیست؛ همه کمی موج دارند (انگار با قیچی بریده).
   • هیچ خاکستریِ خالصی نداریم؛ همه‌ی خنثی‌ها به گرمیِ صحنه می‌زنند.
   • یک لایه‌ی دانه‌دانه‌ی کاغذ روی کلِ تصویر ضرب می‌شود.
   ═══════════════════════════════════════════════════════════════════════ */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const FA_D = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
const fa = (n) => String(n).replace(/\d/g, (d) => FA_D[+d]);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeIn = (t) => t * t * t;
const easeInOut = (t) => (t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2);
const easeBack = (t) => 1 + 2.7 * Math.pow(t-1, 3) + 1.7 * Math.pow(t-1, 2);
const easeElastic = (t) => t === 0 || t === 1 ? t : Math.pow(2, -9*t) * Math.sin((t*10 - .75) * 2.094) + 1;

/** تصادفِ تکرارپذیر: با یک بذر همیشه همان عدد. برای اینکه تزئین‌ها هر فریم نپرند. */
function noise1(x) {
  const s = Math.sin(x * 127.1) * 43758.5453;
  return s - Math.floor(s);
}
const pick = (arr, seed) => arr[Math.floor(noise1(seed) * arr.length) % arr.length];

/* ───────── بوم و صحنهٔ ثابت ───────── */

let ctx, SW, SH, CV, _refit = null;
let view = { scale: 1, ox: 0, oy: 0, w: 0, h: 0, dpr: 1 };
let _grain = null, _grainDark = null;

function initStage(canvas, w, h) {
  CV = canvas; SW = w; SH = h;
  ctx = canvas.getContext('2d');

  /* اندازه را از خودِ بوم می‌گیریم نه از innerHeight؛ چون در سافاریِ گوشی
     نوارِ آدرس باز و بسته می‌شود و innerHeight دروغ می‌گوید. */
  const fit = () => {
    const r = canvas.getBoundingClientRect();
    const vw = Math.round(r.width), vh = Math.round(r.height);
    if (vw < 20 || vh < 20) return;
    const dpr = Math.min(devicePixelRatio || 1, QUALITY > 0 ? 2 : 1);
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    const scale = Math.min(vw / SW, vh / SH);
    view = { scale, ox: (vw - SW*scale)/2, oy: (vh - SH*scale)/2, w: vw, h: vh, dpr };
    _grain = buildGrain();
  };
  _refit = fit;
  addEventListener('resize', fit);
  /* چرخاندنِ گوشی: اندازهٔ درست چند لحظه بعد می‌رسد، پس چندبار اندازه می‌گیریم. */
  addEventListener('orientationchange', () => {
    fit(); setTimeout(fit, 140); setTimeout(fit, 460);
  });
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(canvas);

  /* صدا در گوشی فقط بعد از اوّلین لمس اجازهٔ پخش دارد. */
  const unlock = () => { sfx._c(); removeEventListener('pointerdown', unlock); removeEventListener('touchstart', unlock); };
  addEventListener('pointerdown', unlock, { passive: true });
  addEventListener('touchstart', unlock, { passive: true });
  /* نگه‌داشتنِ انگشت نباید منوی مرورگر را باز کند. */
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  fit();
  return ctx;
}

/** قابِ صحنه را باز می‌کند: بعد از این، مختصات همیشه در فضای SW×SH است. */
function beginScene(bg) {
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, view.w, view.h);
  ctx.save();
  ctx.translate(view.ox, view.oy);
  ctx.scale(view.scale, view.scale);
  ctx.beginPath();
  ctx.rect(0, 0, SW, SH);
  ctx.clip();
}

/* ───────── پوششِ پایانِ قاب ─────────
   دانه‌های کاغذ و تیرگیِ گوشه‌ها هر دو ثابت‌اند و تغییر نمی‌کنند، ولی
   قبلاً هر فریم از نو کشیده می‌شدند: یکی با «multiply» روی کلِّ صفحه و
   یکی با یک گرادیانِ شعاعیِ تازه. اندازه‌گیری نشان داد همین دو تا
   ۱۱ تا ۱۶ میلی‌ثانیه از هر فریم را می‌خوردند — بیشتر از کشیدنِ خودِ
   صحنه. حالا یک بار در یک بومِ جدا پخته می‌شوند و هر فریم فقط یک
   drawImage است.                                                       */

let _ovl = null, _ovlKey = '';

function overlayLayer(grainAlpha, vignette) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const w = Math.max(2, Math.round(SW * q)), h = Math.max(2, Math.round(SH * q));
  const key = w + 'x' + h + '|' + grainAlpha + '|' + vignette;
  if (_ovl && _ovlKey === key) return _ovl;
  let c;
  try {
    c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g2 = c.getContext('2d');
    if (!g2) return null;
    if (_grainDark && grainAlpha > 0) {
      /* همان دانه‌ها، ولی به‌جای multiply به شکلِ سیاهِ کم‌رنگ */
      g2.globalAlpha = clamp(grainAlpha * 1.15, 0, 1);
      g2.fillStyle = g2.createPattern(_grainDark, 'repeat');
      g2.fillRect(0, 0, w, h);
      g2.globalAlpha = 1;
    }
    if (vignette) {
      const g = g2.createRadialGradient(w / 2, h / 2, h * .42, w / 2, h / 2, h * 1.05);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, vignette);
      g2.fillStyle = g;
      g2.fillRect(0, 0, w, h);
    }
  } catch (e) { return null; }
  _ovl = c; _ovlKey = key;
  return c;
}

/** بافتِ کاغذ، تیرگیِ گوشه‌ها، رنگ‌بندی و درخششِ نور را می‌گذارد و قاب را می‌بندد. */
function endScene(grainAlpha = .15, vignette = 'rgba(48,28,14,.30)', bloom = .34, grade = .14) {
  /* درخششِ نور خاموش است. اندازه‌گیری نشان داد هر فریم ۲۱ میلی‌ثانیه
     می‌گیرد — بیشتر از تمامِ کارهای دیگرِ یک فریم روی هم — چون برای
     ساختنش باید کلِّ بوم دوباره خوانده شود. از آن بدتر: متنِ فارسی را
     مه‌آلود می‌کرد و خواندنش را سخت‌تر. بی‌آن، صحنه تمیزتر است. */
  bloom = 0;
  if (QUALITY < 1) { grade = 0; grainAlpha *= .5; }
  if (QUALITY < 2) grade = 0;
  if (grade > 0) {
    /* رنگ‌بندیِ نرم: بالای صحنه گرم‌تر، پایین سردتر — عمق می‌دهد */
    const g = ctx.createLinearGradient(0, 0, 0, SH);
    g.addColorStop(0, `rgba(255, 214, 150, ${grade})`);
    g.addColorStop(.55, 'rgba(255, 255, 255, 0)');
    g.addColorStop(1, `rgba(40, 60, 110, ${grade * .9})`);
    ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalCompositeOperation = 'source-over';
  }
  const ov = (grainAlpha > 0 || vignette) ? overlayLayer(grainAlpha, vignette) : null;
  if (ov) ctx.drawImage(ov, 0, 0, SW, SH);
  ctx.restore();
  bloomPass(bloom);
}

/* ───────── درخششِ نور (bloom) ─────────
   قابِ رسم‌شده را کوچک می‌کنیم، دو بار در خودش ضرب می‌کنیم تا فقط
   روشن‌ها بمانند، محوش می‌کنیم و با حالتِ «lighter» رویش می‌گذاریم.
   نتیجه: چراغ‌ها، شعله‌ها و رنگ‌های روشن نور پخش می‌کنند. */
let _bl, _blc, _bl2, _bl2c, _blNo = false, _blTick = 0;

function bloomPass(amount) {
  if (!amount || _blNo || !CV.width) return;
  /* کوچک‌کردن و بزرگ‌کردنِ دوباره، خودش محو می‌کند — از filter خیلی ارزان‌تر است */
  const W = Math.max(4, Math.round(CV.width * .2)), H = Math.max(4, Math.round(CV.height * .2));
  const W2 = Math.max(2, Math.round(W * .28)), H2 = Math.max(2, Math.round(H * .28));
  try {
    if (!_bl) {
      _bl = document.createElement('canvas'); _blc = _bl.getContext('2d');
      _bl2 = document.createElement('canvas'); _bl2c = _bl2.getContext('2d');
      if (!_blc || !_bl2c) { _blNo = true; return; }
    }
    if (_bl.width !== W || _bl.height !== H) { _bl.width = W; _bl.height = H; }
    if (_bl2.width !== W2 || _bl2.height !== H2) { _bl2.width = W2; _bl2.height = H2; }
    /* ساختنِ نور یک قاب در میان کافی است؛ گذاشتنش هر قاب. */
    _blTick = (_blTick + 1) & 1;
    if (!_blTick) {
      _blc.globalCompositeOperation = 'source-over';
      _blc.clearRect(0, 0, W, H);
      _blc.drawImage(CV, 0, 0, W, H);
      _blc.globalCompositeOperation = 'multiply';
      _blc.drawImage(_bl, 0, 0);
      _blc.drawImage(_bl, 0, 0);
      _blc.globalCompositeOperation = 'source-over';
      _bl2c.clearRect(0, 0, W2, H2);
      _bl2c.drawImage(_bl, 0, 0, W2, H2);
    }

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = amount;
    ctx.drawImage(_bl2, 0, 0, CV.width, CV.height);
    ctx.restore();
  } catch (e) { _blNo = true; }
}

/* ───────── لایهٔ ثابت ─────────
   هرچه در صحنه تکان نمی‌خورد را یک‌بار می‌کشیم و بعد فقط کپی می‌کنیم. */
const _layers = {};
function staticLayer(key, w, h, paint) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const L = _layers[key];
  if (L && L.q === q && L.w === w && L.h === h) return L.cv;
  const off = document.createElement('canvas');
  off.width = Math.max(1, Math.round(w * q));
  off.height = Math.max(1, Math.round(h * q));
  const c = off.getContext('2d');
  c.setTransform(q, 0, 0, q, 0, 0);
  const prev = ctx;
  ctx = c;
  try { paint(); } finally { ctx = prev; }
  _layers[key] = { cv: off, q, w, h };
  return off;
}

/* ───────── نورپردازی و بافت ─────────
   کارِ این‌ها این است که هیچ سطحی «تختِ یک‌رنگ» نماند. */

/** شیبِ عمودی: بالا روشن، پایین تیره. */
function vgrad(y0, y1, top, bot) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, top); g.addColorStop(1, bot);
  return g;
}

/** حجمِ کروی: نور از بالا-چپ، سایه در پایین-راست. */
function ball(cx, cy, r, lit, base, dark) {
  const g = ctx.createRadialGradient(cx - r * .38, cy - r * .42, r * .06, cx, cy, r * 1.06);
  g.addColorStop(0, lit); g.addColorStop(.45, base); g.addColorStop(1, dark);
  return g;
}

/** لبهٔ روشنِ بالا-چپِ یک مسیر — همان «rim light». */
function rim(pathFn, col, w = 2.2) {
  ctx.save();
  ctx.beginPath(); pathFn();
  ctx.clip();
  ctx.beginPath(); pathFn();
  ctx.strokeStyle = col; ctx.lineWidth = w * 2; ctx.lineJoin = 'round';
  ctx.translate(-w * .5, -w * .6);
  ctx.stroke();
  ctx.restore();
}

/** سایهٔ چسبیده به زمین — چیزها را روی سطح می‌نشاند. */
function contact(cx, cy, rx, ry, alpha = .26) {
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
  g.addColorStop(0, `rgba(20, 12, 6, ${alpha})`);
  g.addColorStop(1, 'rgba(20, 12, 6, 0)');
  ctx.save();
  ctx.fillStyle = g;
  ctx.translate(cx, cy); ctx.scale(1, ry / Math.max(rx, ry));
  ctx.beginPath(); ctx.arc(0, 0, Math.max(rx, ry), 0, TAU); ctx.fill();
  ctx.restore();
}

const _tex = {};
/** بافتِ تکرارشونده؛ یک‌بار ساخته و بعد از حافظه خوانده می‌شود. */
function texture(key, w, h, paint) {
  if (_tex[key]) return _tex[key];
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const c = off.getContext('2d');
  paint(c, w, h);
  _tex[key] = ctx.createPattern(off, 'repeat');
  return _tex[key];
}

/** رگهٔ چوب. */
function texWood(base, grain) {
  return texture('w' + base + grain, 120, 120, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = grain; c.lineWidth = 1.4;
    for (let i = 0; i < 9; i++) {
      c.globalAlpha = .18 + noise1(i * 3.1) * .3;
      c.beginPath();
      const y0 = i * 14 + noise1(i) * 6;
      c.moveTo(0, y0);
      for (let x = 0; x <= w; x += 10) c.lineTo(x, y0 + Math.sin(x * .09 + i) * 2.6);
      c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** تارِ پارچه. */
function texCloth(base, thread) {
  return texture('c' + base + thread, 16, 16, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = thread; c.lineWidth = 1; c.globalAlpha = .5;
    for (let i = 0; i < w; i += 4) {
      c.beginPath(); c.moveTo(i, 0); c.lineTo(i, h); c.stroke();
      c.beginPath(); c.moveTo(0, i); c.lineTo(w, i); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** دانه‌های سنگ. */
function texStone(base, spec) {
  return texture('s' + base + spec, 90, 90, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) {
      c.globalAlpha = .05 + noise1(i * 1.7) * .16;
      c.fillStyle = spec;
      const r = .6 + noise1(i * 5.3) * 1.9;
      c.beginPath();
      c.arc(noise1(i * 2.1) * w, noise1(i * 3.7 + 1) * h, r, 0, TAU);
      c.fill();
    }
    c.globalAlpha = 1;
  });
}

/** الیافِ کاغذ. */
function texPaper(base) {
  return texture('p' + base, 100, 100, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 130; i++) {
      c.globalAlpha = .04 + noise1(i * 2.3) * .07;
      c.strokeStyle = i % 2 ? '#ffffff' : '#5a4326';
      c.lineWidth = .9;
      const x = noise1(i * 1.3) * w, y = noise1(i * 4.1 + 2) * h;
      const a = noise1(i * 7.7) * TAU, l = 4 + noise1(i * 9.1) * 12;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

function buildGrain() {
  const s = 260;
  const off = document.createElement('canvas');
  off.width = off.height = s;
  const c = off.getContext('2d');
  const img = c.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    const v = 214 + Math.random() * 41;
    img.data[i*4] = v; img.data[i*4+1] = v; img.data[i*4+2] = v; img.data[i*4+3] = 255;
  }
  c.putImageData(img, 0, 0);
  /* همان دانه‌ها به شکلِ سیاهِ کم‌رنگ، تا بشود بدونِ multiply گذاشتشان */
  const d = document.createElement('canvas');
  d.width = d.height = s;
  const dc = d.getContext('2d');
  const dimg = dc.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    dimg.data[i*4] = 0; dimg.data[i*4+1] = 0; dimg.data[i*4+2] = 0;
    dimg.data[i*4+3] = 255 - img.data[i*4];
  }
  dc.putImageData(dimg, 0, 0);
  _grainDark = d;
  _ovl = null; _ovlKey = '';
  return ctx.createPattern(off, 'repeat');
}

function toStage(e) {
  const r = CV.getBoundingClientRect();
  return {
    x: (e.clientX - r.left - view.ox) / view.scale,
    y: (e.clientY - r.top - view.oy) / view.scale,
  };
}

const inRect = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
const inCircle = (p, b, pad = 0) => Math.hypot(p.x - b.x, p.y - b.y) <= b.r + pad;

/* ───────── قلم‌های کاغذبُری ───────── */

/** دایره‌ای که انگار با قیچی بریده شده. */
function wobbleCircle(cx, cy, r, seed = 0, amp = 2.2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const rr = r + Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp * .45;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** بیضیِ ناصاف — برای چیزهایی که گرد نیستند ولی نرم‌اند. */
function wobbleEllipse(cx, cy, rx, ry, rot = 0, seed = 0, amp = 2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const w = 1 + (Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp*.45) / Math.max(rx, ry);
    const px = Math.cos(a) * rx * w, py = Math.sin(a) * ry * w;
    const x = cx + px*Math.cos(rot) - py*Math.sin(rot);
    const y = cy + px*Math.sin(rot) + py*Math.cos(rot);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** مستطیلِ گِرد با گوشه‌های کمی کج. */
function wobbleRect(x, y, w, h, r = 12, seed = 0, amp = 1.6) {
  const j = (k) => (noise1(seed*9.7 + k) - .5) * amp * 2;
  ctx.beginPath();
  ctx.moveTo(x + r + j(1), y + j(2));
  ctx.lineTo(x + w - r + j(3), y + j(4));
  ctx.quadraticCurveTo(x + w + j(5), y + j(6), x + w + j(7), y + r + j(8));
  ctx.lineTo(x + w + j(9), y + h - r + j(10));
  ctx.quadraticCurveTo(x + w + j(11), y + h + j(12), x + w - r + j(13), y + h + j(14));
  ctx.lineTo(x + r + j(15), y + h + j(16));
  ctx.quadraticCurveTo(x + j(17), y + h + j(18), x + j(19), y + h - r + j(20));
  ctx.lineTo(x + j(21), y + r + j(22));
  ctx.quadraticCurveTo(x + j(23), y + j(24), x + r + j(1), y + j(2));
  ctx.closePath();
}

/** سایهٔ نرم؛ نور از بالا-چپ. */
function withShadow(blur, dy, alpha, fn, hue = '78, 46, 24') {
  ctx.save();
  ctx.shadowColor = `rgba(${hue}, ${alpha})`;
  ctx.shadowBlur = blur;
  ctx.shadowOffsetY = dy;
  ctx.shadowOffsetX = dy * .35;
  fn();
  ctx.restore();
}

/** یک برگه‌ی کاغذ با سایه — پایه‌ی همه‌ی کارت‌ها و تابلوها. */
function paper(x, y, w, h, fill, seed = 1, r = 12, shadow = .26) {
  withShadow(16, 7, shadow, () => {
    ctx.fillStyle = fill;
    wobbleRect(x, y, w, h, r, seed, 2);
    ctx.fill();
  });
  /* الیافِ کاغذ و لبهٔ روشن، تا سطح تخت نماند */
  ctx.save();
  ctx.beginPath(); wobbleRect(x, y, w, h, r, seed, 2); ctx.clip();
  ctx.globalAlpha = .5;
  ctx.fillStyle = texPaper(fill);
  ctx.fillRect(x, y, w, h);
  ctx.globalAlpha = 1;
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.4, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(90,60,20,.1)');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
}

function text(str, x, y, o = {}) {
  const size = o.size || 20;
  const fam = o.family || 'Vazirmatn';
  ctx.save();
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.font = `${fam === 'Lalezar' ? '400' : (o.weight || 700)} ${size}px "${fam}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.baseline || 'middle';
  ctx.fillStyle = o.color || '#43291b';
  ctx.direction = 'rtl';
  if (o.stroke) {
    ctx.lineWidth = o.strokeWidth || 5;
    ctx.strokeStyle = o.stroke;
    ctx.lineJoin = 'round';
    ctx.strokeText(str, x, y, o.maxWidth);
  }
  ctx.fillText(str, x, y, o.maxWidth);
  ctx.restore();
}

/** متنِ چندخطی که خودش می‌شکند. ارتفاعِ اشغال‌شده را برمی‌گرداند. */
function textWrap(str, x, y, maxW, o = {}) {
  const size = o.size || 19, lh = o.lineHeight || size * 1.7;
  ctx.font = `${o.weight || 700} ${size}px "${o.family || 'Vazirmatn'}", Tahoma, sans-serif`;
  const lines = [];
  for (const para of str.split('\n')) {
    let line = '';
    for (const wd of para.split(' ')) {
      const t = line ? line + ' ' + wd : wd;
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = wd; }
      else line = t;
    }
    lines.push(line);
  }
  lines.forEach((l, i) => text(l, x, y + i * lh, o));
  return lines.length * lh;
}

/* ───────── ذره‌ها ───────── */

class Bits {
  constructor() { this.list = []; }
  add(x, y, n, kind, colors, opts = {}) {
    for (let i = 0; i < n; i++) {
      const a = opts.dir !== undefined ? opts.dir + (Math.random()-.5) * (opts.spread || 1) : Math.random() * TAU;
      const sp = (opts.speed || 200) * (.4 + Math.random());
      this.list.push({
        kind, x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - (opts.lift || 0),
        r: (opts.size || 4) * (.5 + Math.random()),
        rot: Math.random() * TAU, vr: (Math.random()-.5) * 10,
        col: colors[(Math.random() * colors.length) | 0],
        grav: opts.grav === undefined ? 620 : opts.grav,
        drag: opts.drag || .995,
        life: (opts.life || .9) * (.6 + Math.random() * .8), age: 0,
      });
    }
  }
  confetti(x, y, n, colors) {
    this.add(x, y, n, 'flake', colors, { speed: 420, lift: 190, size: 5, life: 1.6, grav: 780 });
  }
  spark(x, y, n, colors) {
    this.add(x, y, n, 'dot', colors, { speed: 180, lift: 30, size: 3.4, life: .7, grav: 260, drag: .93 });
  }
  step(dt) {
    for (const p of this.list) {
      p.age += dt;
      p.vy += p.grav * dt;
      p.vx *= p.drag; p.vy *= p.drag;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    }
    this.list = this.list.filter((p) => p.age < p.life);
  }
  draw() {
    for (const p of this.list) {
      const k = clamp(1 - p.age / p.life, 0, 1);
      ctx.save();
      ctx.globalAlpha = k;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.col;
      if (p.kind === 'flake') ctx.fillRect(-p.r, -p.r*1.5, p.r*2, p.r*3);
      else if (p.kind === 'leaf') { wobbleEllipse(0, 0, p.r*1.8, p.r*.8, 0, p.r, .6); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(0, 0, p.r * k, 0, TAU); ctx.fill(); }
      ctx.restore();
    }
  }
  clear() { this.list.length = 0; }
}

/* ───────── صدا (بدون فایل صوتی) ───────── */

const sfx = {
  ac: null, on: true,
  _c() {
    if (!this.on) return null;
    if (!this.ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; this.ac = new A(); }
    if (this.ac.state === 'suspended') this.ac.resume();
    return this.ac;
  },
  tone(f, dur = .16, type = 'sine', gain = .13, delay = 0) {
    const c = this._c(); if (!c) return;
    const t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(t0 + dur + .04);
  },
  tap()  { this.tone(430, .07, 'triangle', .09); },
  place(){ this.tone(620, .11, 'sine', .12); },
  pop()  { this.tone(760, .09, 'sine', .11); },
  slide(){ this.tone(240, .22, 'sine', .07); },
  good() { [523, 659, 784].forEach((f,i) => this.tone(f, .22, 'sine', .13, i*.07)); },
  win()  { [523, 659, 784, 1047].forEach((f,i) => this.tone(f, .34, 'triangle', .13, i*.10)); },
  nope() { this.tone(180, .2, 'sawtooth', .07); },
  tick() { this.tone(1100, .04, 'square', .05); },
};

/* ───────── قطعه‌های آماده ───────── */

function star(x, y, r, col, rot = 0) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = col;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI/2 + i * Math.PI/5;
    const rr = i % 2 ? r * .45 : r;
    const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/** دکمهٔ کاغذی. hovered را خودِ بازی می‌دهد؛ اینجا فقط کشیده می‌شود. */
/** رنگ را روشن‌تر (k>0) یا تیره‌تر (k<0) می‌کند. */
function shade(col, k) {
  const c = String(col).trim();
  let r, g2, b2;
  if (c[0] === '#') {
    const h = c.length === 4 ? c[1]+c[1]+c[2]+c[2]+c[3]+c[3] : c.slice(1, 7);
    r = parseInt(h.slice(0,2), 16); g2 = parseInt(h.slice(2,4), 16); b2 = parseInt(h.slice(4,6), 16);
  } else {
    const m = c.match(/[\d.]+/g);
    if (!m || m.length < 3) return col;
    r = +m[0]; g2 = +m[1]; b2 = +m[2];
  }
  const f = (v) => Math.round(clamp(k < 0 ? v * (1 + k) : v + (255 - v) * k, 0, 255));
  return 'rgb(' + f(r) + ',' + f(g2) + ',' + f(b2) + ')';
}

function button(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 3 : 0;
  const fill = o.disabled ? (o.off || '#bcaa92') : (hot ? (o.hotFill || o.fill) : o.fill);
  const r = o.r === undefined ? 14 : o.r;
  /* لبهٔ زیرینِ تیره — دکمه از صفحه بیرون می‌زند */
  ctx.fillStyle = shade(fill, -.36);
  wobbleRect(b.x, b.y + dy + 7, b.w, b.h, r, b.x + b.y, 2);
  ctx.fill();
  withShadow(hot ? 22 : 14, hot ? 5 : 8, .32, () => {
    ctx.fillStyle = fill;
    wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2);
    ctx.fill();
  });
  /* حجم: روشن از بالا، تیره به پایین */
  ctx.save();
  ctx.beginPath(); wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2); ctx.clip();
  const g = ctx.createLinearGradient(0, b.y + dy, 0, b.y + dy + b.h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.45, 'rgba(255,255,255,.04)');
  g.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = g;
  ctx.fillRect(b.x, b.y + dy, b.w, b.h);
  /* برقِ باریکِ لبهٔ بالا */
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.fillRect(b.x + r, b.y + dy + 2, b.w - r * 2, 2);
  ctx.restore();
  text(label, b.x + b.w/2, b.y + b.h/2 + dy - (o.sub ? 9 : 0), {
    size: o.size || 26, color: o.color || '#fdf6e8', family: o.family || 'Lalezar',
  });
  if (o.sub) text(o.sub, b.x + b.w/2, b.y + b.h/2 + dy + 17,
    { size: 14, color: o.subColor || 'rgba(255,255,255,.88)' });
}

/** دکمهٔ گرد کوچک (مثل + و −). */
function roundButton(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 2 : 0;
  withShadow(10, hot ? 3 : 5, .3, () => {
    ctx.fillStyle = o.disabled ? '#cbbba3' : (hot ? (o.hotFill || o.fill) : o.fill);
    wobbleCircle(b.x, b.y + dy, b.r, b.x, 1.4);
    ctx.fill();
  });
  text(label, b.x, b.y + dy - 1,
    { size: o.size || 32, color: o.disabled ? '#a8988a' : (o.color || '#fdf6e8'), family: 'Lalezar' });
}

/** پرده‌ی تمام‌صفحه: برای شروعِ پرده و برای جشنِ پایان. */
function overlay(o) {
  const k = easeOut(clamp(o.t / .5, 0, 1));
  ctx.fillStyle = `rgba(30, 22, 16, ${.66 * k})`;
  ctx.fillRect(0, 0, SW, SH);

  const w = o.w || 700, h = o.h || 290;
  const x = (SW - w) / 2, y = o.y || (SH * .22);
  const s = lerp(.9, 1, easeBack(clamp(o.t / .65, 0, 1)));
  ctx.save();
  ctx.translate(SW/2, y + h/2);
  ctx.scale(s, s);
  ctx.translate(-SW/2, -(y + h/2));

  withShadow(30, 14, .42, () => {
    ctx.fillStyle = o.paper || '#fbf3e2';
    wobbleRect(x, y, w, h, 18, 121, 2.4);
    ctx.fill();
  });
  ctx.fillStyle = o.band || '#c8434f';
  wobbleRect(x, y, w, 12, 6, 123, 1);
  ctx.fill();

  if (o.icon) o.icon(SW/2, y + 56);
  text(o.title, SW/2, y + (o.icon ? 108 : 62),
    { size: o.titleSize || 36, color: o.ink || '#43291b', family: 'Lalezar', alpha: k });
  textWrap(o.body, SW/2, y + (o.icon ? 158 : 116), w - 90,
    { size: 19, color: o.inkSoft || '#8a6a52', alpha: k });
  ctx.restore();

  button(o.btn, o.btnLabel, { hot: o.btnHot, fill: o.btnFill || '#7fa356', hotFill: o.btnHotFill || '#8fb45f', size: 28 });
}

/** پیامِ کوتاهِ بالای صحنه. */
class Toast {
  constructor() { this.msg = null; this.t = 0; this.kind = 'info'; }
  say(msg, kind = 'info') { this.msg = msg; this.kind = kind; this.t = 2.6; }
  step(dt) { if (this.t > 0) { this.t -= dt; if (this.t <= 0) this.msg = null; } }
  draw(y = 24, colors = {}) {
    if (!this.msg) return;
    const k = clamp(this.t, 0, 1) * clamp((2.6 - this.t) * 5, 0, 1);
    ctx.save();
    ctx.globalAlpha = k;
    ctx.font = `700 19px "Vazirmatn", Tahoma, sans-serif`;
    const w = ctx.measureText(this.msg).width + 76;
    const fill = this.kind === 'good' ? (colors.good || '#7fa356')
               : this.kind === 'bad' ? (colors.bad || '#c8434f')
               : (colors.info || '#fbf3e2');
    paper(SW/2 - w/2, y, w, 48, fill, 151, 12, .3);
    text(this.msg, SW/2, y + 25,
      { size: 19, color: this.kind === 'info' ? (colors.ink || '#43291b') : '#fff8ec' });
    ctx.restore();
  }
}

/* ───────── آموزشِ پرده‌ای ─────────
   پرده‌هایی که منتظرِ کارِ بچه نیستند با یک ضربه جلو می‌روند. تایمر فقط
   پشتیبان است؛ بچهٔ کلاس سومی باید فرصتِ خواندن داشته باشد، نه اینکه
   متن قبل از تمام شدنِ خواندنش برود.                                    */

/** اگر پردهٔ فعلی خواندنی است، ضربه را می‌خورد و می‌رود پردهٔ بعد. */
function tutTap(tut, tapSteps, lastStep) {
  if (!tut.on || tapSteps.indexOf(tut.step) < 0) return false;
  if (tut.step >= lastStep) tut.on = false;
  else { tut.step++; tut.t = 0; }
  sfx.tap();
  return true;
}

/** نشانهٔ «برای ادامه بزن» — زیرِ کارتِ آموزش. */
function tutMore(cx, y, t, ink = '#3a2a18', bg = 'rgba(255, 250, 238, .94)') {
  ctx.save();
  ctx.globalAlpha = .62 + .38 * Math.sin(t * 3.2);
  ctx.font = '700 15px "Vazirmatn", Tahoma, sans-serif';
  const label = 'برای ادامه، هرجا را بزن';
  const w = ctx.measureText(label).width + 40, h = 32, x = cx - w / 2, r = 16;
  withShadow(10, 4, .3, () => {
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath(); ctx.fill();
  });
  text(label, cx, y + h / 2, { size: 15, color: ink });
  ctx.restore();
}

/** فونت‌ها را می‌آورد و بعد بازی را شروع می‌کند.
    مهم: هر دو راه (رسیدنِ فونت و مهلتِ پشتیبان) ممکن است برسند، ولی
    شروع فقط باید یک بار انجام شود؛ وگرنه دو حلقهٔ فریم راه می‌افتد و
    بازی دوبرابر سریع می‌شود. */
function whenFontsReady(start) {
  let done = false;
  const go = () => { if (done) return; done = true; start(); };
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('400 40px Lalezar'),
      document.fonts.load('700 20px Vazirmatn'),
      document.fonts.load('900 20px Vazirmatn'),
    ]).then(go, go);
    setTimeout(go, 2600);
  } else go();
}

/** حلقهٔ فریم با dtِ محدودشده. */
/* ───────── کیفیتِ خودکار ─────────
   اگر دستگاه کُند بود، اوّل درخشش و بعد رنگ‌بندی خاموش می‌شود تا بازی
   روان بماند. روی دستگاهِ قوی همه‌چیز روشن است. */
let QUALITY = 2;
let _fAcc = 0, _fN = 0, _qHold = 0;

function _qualityTick(gap) {
  if (gap <= 0 || gap > 200) return;
  _fAcc += gap; _fN++;
  if (_fN < 45) return;
  const avg = _fAcc / _fN;
  _fAcc = 0; _fN = 0;
  if (_qHold > 0) { _qHold--; return; }
  /* فاصلهٔ بالا و پایین باید باز باشد، وگرنه کیفیت بین دو پله بالا و
     پایین می‌پرد و بازی مدام تغییرِ ظاهر می‌دهد. */
  const before = QUALITY;
  if (avg > 21 && QUALITY > 0) { QUALITY--; _qHold = 4; }
  else if (avg < 13.5 && QUALITY < 2) { QUALITY++; _qHold = 10; }
  /* در پایین‌ترین کیفیت، صحنه را با نقطه‌های کمتر می‌کشیم */
  if (before !== QUALITY && (before === 0 || QUALITY === 0) && _refit) _refit();
}

/* یک حلقه، نه بیشتر — دو حلقه یعنی زمانِ بازی دوبرابر می‌گذرد.

   MOTION: تا پیش از این، به‌خاطرِ باگِ دو حلقه، همهٔ بازی‌ها عملاً با
   سرعتِ دو برابر اجرا می‌شدند و زمان‌بندی‌ها هم با همان حس تنظیم شده
   بودند. حالا که باگ رفع شده، سرعتِ درست (یک برابر) کُند به نظر
   می‌رسد. این ضریب جانِ حرکت‌ها را برمی‌گرداند، ولی نه تا آن دو برابرِ
   تصادفی. فقط روی جانِ حرکت اثر دارد، نه روی هیچ قانونِ علمی. */
const MOTION = 1.45;
let _looping = false;
function runLoop(step) {
  if (_looping) return;
  _looping = true;
  let last = performance.now();
  const frame = (now) => {
    const gap = now - last;
    /* بریدنِ بعد از ضرب، تا یک فریمِ کُند پرشِ بزرگ نسازد */
    const dt = Math.min(gap / 1000 * MOTION, 1/15);
    last = now;
    _qualityTick(gap);
    step(dt);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

/* ═════════════════ بازی ═════════════════ */
/* ═══════════════════════════════════════════════════════════════════════
   تصفیه‌خانه — علومِ سوم، درس ۶ «زندگی ما و آب»  (بازی)

   کاوشگریِ کتاب: «چگونه آبِ گل‌آلود را صاف کنیم؟» — با یک بطری و
   خرده‌سنگ و شن و ماسه و پنبه و پارچه. و پرسشِ اصلیِ کتاب همین است:
   «این‌ها را به چه ترتیبی در بطری بریزیم؟»
   و بعد: «چرا این آب هنوز قابل آشامیدن نیست؟»

   بازی همان پرسش است، ولی جوابش را نمی‌گوید — می‌گذارد بچّه خودش
   کشف کند، چون قانون‌ها روشن و دیدنی‌اند:

   ▸ هر لایه فقط ذرّه‌هایی را می‌گیرد که از سوراخ‌هایش بزرگ‌ترند. پس
     لایهٔ درشت ذرّهٔ ریز را نمی‌گیرد و آب کدر می‌ماند.
   ▸ اگر لایهٔ ریز بالا باشد، ذرّه‌های خیلی درشت سوراخ‌هایش را می‌بندند
     و آب اصلاً رد نمی‌شود — لایه گرفته می‌شود. برای همین باید از درشت
     به ریز چید.
   ▸ مادّهٔ ضدعفونی میکروب را می‌کشد، ولی فقط وقتی آبِ رسیده به آن
     صاف باشد؛ در آبِ گل‌آلود میکروب پشتِ ذرّه‌ها پنهان می‌ماند. این هم
     قانونِ واقعیِ تصفیه است و برای همین ضدعفونی همیشه مرحلهٔ آخر است.

   بعد از هر بار ریختن، بچّه می‌بیند کدام لایه گرفت و چه چیزی از صافی
   رد شد — نه اینکه به او بگویند ترتیبِ درست چیست.
   ═══════════════════════════════════════════════════════════════════════ */

const SCENE_W = 1200, SCENE_H = 760;
const HUD_H = 56;

const P = {
  wall:  '#24383d', wallLo: '#1a2a2e', wallHi: '#365055',
  steel: '#8d99a3', steelDk: '#54606a', steelLt: '#c3ced6',
  water: '#4f9fc4', waterDk: '#2c6f92', waterLt: '#9fd8ea',
  mud:   '#8a6a44', mudDk: '#5c4526',
  glass: 'rgba(206, 232, 239, .34)',
  paper: '#fbfaf2', card: '#ffffff',
  ink:   '#20303a', inkSoft: '#7b8990',
  good:  '#4e9f6c', bad: '#c04a34', gold: '#c9962c', accent: '#4fa3b8',
};

/* ───────── مواد و ذرّه‌ها ─────────
   pore = اندازهٔ سوراخ‌های لایه. هر ذرّهٔ بزرگ‌تر یا برابرِ آن گیر
   می‌افتد؛ ذرّهٔ خیلی درشت‌تر (سه برابر) لایه را می‌بندد.          */

const MATS = [
  { id: 'sang',  n: 'خرده‌سنگ',  pore: 8, c: '#8d99a3', d: '#5c6870', grain: 9 },
  { id: 'shen',  n: 'شن',        pore: 4, c: '#b0a184', d: '#7d7053', grain: 6 },
  { id: 'mase',  n: 'ماسه',      pore: 2, c: '#dcc38a', d: '#a8905a', grain: 3.4 },
  { id: 'panbe', n: 'پنبه و پارچه', pore: 1, c: '#f2f2ea', d: '#c8c8bc', grain: 1.8 },
  { id: 'zed',   n: 'موادِ ضدعفونی', pore: 0, kills: true, c: '#7fc4a8', d: '#3f8f74', grain: 2.4 },
];
const matBy = (id) => MATS.find((m) => m.id === id);

const BITS = [
  { id: 'barg',  n: 'برگ و شاخه', size: 10,  c: '#4f7a34' },
  { id: 'shen',  n: 'دانهٔ شن',   size: 5,   c: '#9a8a63' },
  { id: 'gel',   n: 'گِل',        size: 2.5, c: '#8a6a44' },
  { id: 'riz',   n: 'ذرّهٔ ریز',  size: 1.2, c: '#b9a48a' },
  { id: 'mik',   n: 'میکروب',     size: 0,   micro: true, c: '#c05a8a' },
];
const bitBy = (id) => BITS.find((b) => b.id === id);

/* ذرّه‌ای که یک‌ونیم برابرِ سوراخ‌ها یا بزرگ‌تر باشد، لایه را می‌بندد.
   با همین عدد، تنها ترتیبِ کارگر «از درشت به ریز» است. */
const CLOG_X = 1.5;

const LEVELS = [
  { name: 'دو لایه',   slots: 2, shelf: ['sang', 'mase'],
    dirt: ['barg', 'gel'] },
  { name: 'سه لایه',   slots: 3, shelf: ['sang', 'shen', 'mase'],
    dirt: ['barg', 'shen', 'gel'] },
  { name: 'پنبه هم هست', slots: 4, shelf: ['sang', 'shen', 'mase', 'panbe'],
    dirt: ['barg', 'shen', 'gel', 'riz'] },
  { name: 'میکروب‌ها',  slots: 5, shelf: ['sang', 'shen', 'mase', 'panbe', 'zed'],
    dirt: ['barg', 'shen', 'gel', 'riz', 'mik'] },
  { name: 'تصفیه‌خانه', slots: 5, shelf: ['sang', 'shen', 'mase', 'panbe', 'zed'],
    dirt: ['barg', 'shen', 'gel', 'riz', 'mik'], endless: true },
];

/* ───────── وضعیت ───────── */

const S = {
  phase: 'intro', phaseT: 0,
  level: 0, score: 0, best: 0,
  slot: [],              /* شناسهٔ مادّهٔ هر لایه یا null */
  shelf: [],             /* موادِ این دور — در حالتِ بی‌پایان بُر می‌خورد */
  pick: -1,              /* مادّهٔ برداشته‌شده از قفسه */
  run: null,             /* {y, layer, carry:[], caught:[], clogged, done} */
  runT: 0,
  out: null,             /* آبِ بیرون‌آمده: {bits:[], clean, clogged} */
  won: false, winT: 0,
  t: 0, hover: null, tip: '', tipT: 0, shake: 0,
  tut: { on: false, step: 0, t: 0 },
};

const bits = new Bits();
const toast = new Toast();
const cv = document.getElementById('stage');
initStage(cv, SCENE_W, SCENE_H);

const L = () => LEVELS[Math.min(S.level, LEVELS.length - 1)];
function tip(msg) { S.tip = msg; S.tipT = 3.6; }
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

function loadLevel(i) {
  S.level = i;
  const lv = LEVELS[i];
  S.shelf = lv.shelf.slice();
  if (lv.endless) {
    for (let k = S.shelf.length - 1; k > 0; k--) {
      const j = R(0, k); const t2 = S.shelf[k]; S.shelf[k] = S.shelf[j]; S.shelf[j] = t2;
    }
  }
  S.slot = new Array(lv.slots).fill(null);
  S.pick = -1;
  S.run = null; S.out = null; S.won = false; S.winT = 0;
}

function startLevel(i, keep) {
  S.phase = 'play'; S.phaseT = 0;
  if (!keep) S.score = 0;
  S.tut.on = i === 0 && !keep; S.tut.step = 0; S.tut.t = 0;
  loadLevel(i);
}

/* ───────── قانونِ صافی ─────────
   آب از بالا وارد می‌شود و لایه‌به‌لایه پایین می‌رود.               */

/** آبِ گل‌آلودِ این مرحله: فهرستِ ذرّه‌ها. */
function makeDirt() {
  const out = [];
  for (const id of L().dirt) {
    const b = bitBy(id);
    const n = b.micro ? 6 : R(3, 5);
    for (let k = 0; k < n; k++) out.push(id);
  }
  return out;
}

/** یک لایه را حساب می‌کند. برمی‌گرداند: چه چیزی گرفت، چه چیزی رد شد،
    و آیا لایه بسته شد. */
function throughLayer(matId, carry) {
  const m = matBy(matId);
  if (!m) return { pass: carry.slice(), caught: [], clog: false };
  /* ذرّهٔ خیلی درشت‌تر از سوراخ‌ها، لایه را می‌بندد */
  if (m.pore > 0 && carry.some((id) => bitBy(id).size >= m.pore * CLOG_X)) {
    return { pass: [], caught: [], clog: true };
  }
  const pass = [], caught = [];
  for (const id of carry) {
    const b = bitBy(id);
    if (m.kills) {
      /* ضدعفونی فقط در آبِ صاف کار می‌کند؛ در آبِ گل‌آلود میکروب
         پشتِ ذرّه‌ها پنهان می‌ماند. */
      const dirty = carry.some((q) => !bitBy(q).micro);
      if (b.micro && !dirty) { caught.push(id); continue; }
      pass.push(id);
      continue;
    }
    if (!b.micro && b.size >= m.pore) caught.push(id);
    else pass.push(id);
  }
  return { pass, caught, clog: false };
}

/** کلِّ صافی را یک‌جا حساب می‌کند — برای آزمون و برای داوری. */
function filterAll(slots, dirt) {
  let carry = dirt.slice();
  const caught = slots.map(() => []);
  for (let i = 0; i < slots.length; i++) {
    const r = throughLayer(slots[i], carry);
    if (r.clog) return { clogged: i, out: [], caught };
    caught[i] = r.caught;
    carry = r.pass;
  }
  return { clogged: -1, out: carry, caught };
}

function pour() {
  if (S.run) return;
  if (S.slot.some((s) => s === null)) { tip('همهٔ لایه‌ها را پر کن.'); S.shake = .12; sfx.nope(); return; }
  S.out = null;
  S.run = { y: 0, layer: 0, carry: makeDirt(), caught: S.slot.map(() => []), clogged: -1, done: false };
  S.runT = 0;
  sfx.slide();
  if (S.tut.on && S.tut.step === 1) { S.tut.step = 2; S.tut.t = 0; }
}

function runStep() {
  const r = S.run;
  if (!r || r.done) return;
  if (r.layer >= S.slot.length) {
    r.done = true;
    finishRun();
    return;
  }
  const res = throughLayer(S.slot[r.layer], r.carry);
  if (res.clog) {
    r.clogged = r.layer; r.done = true;
    finishRun();
    return;
  }
  r.caught[r.layer] = res.caught;
  r.carry = res.pass;
  r.layer++;
}

function finishRun() {
  const r = S.run;
  const clean = r.clogged < 0 && r.carry.length === 0;
  S.out = { bits: r.carry.slice(), clean, clogged: r.clogged };
  if (clean) {
    if (!S.won) {
      S.won = true; S.winT = .001;
      S.score += 120 + S.level * 30;
      if (S.score > S.best) S.best = S.score;
      sfx.win();
      bits.confetti(GLASS.x + GLASS.w / 2, GLASS.y, 28, [P.waterLt, P.good, P.gold, '#fff']);
    }
  } else {
    sfx.nope();
    S.shake = .14;
  }
}

/* ───────── حلقه ───────── */

function step(dt) {
  S.t += dt;
  if (S.phaseT < 9) S.phaseT += dt;
  if (S.tipT > 0) S.tipT -= dt;
  if (S.shake > 0) S.shake = Math.max(0, S.shake - dt);
  if (S.tut.on) S.tut.t += dt;
  if (S.run && !S.run.done) {
    S.runT += dt;
    while (S.runT >= .55 && S.run && !S.run.done) { S.runT -= .55; runStep(); }
  }
  if (S.winT) {
    S.winT += dt;
    if (S.winT > 2.4) {
      S.winT = 0;
      if (!L().endless && S.level >= LEVELS.length - 1) { S.phase = 'won'; S.phaseT = 0; }
      else if (L().endless) { loadLevel(S.level); toast.say('یک بارِ دیگر', 'good'); }
      else { loadLevel(S.level + 1); toast.say(L().name, 'good'); }
    }
  }
  bits.step(dt);
  toast.step(dt);
  draw();
}

whenFontsReady(() => { loadLevel(0); runLoop(step); });

/* ───────── جای‌ها ───────── */

const COL = { x: 300, y: 130, w: 210, h: 430 };     /* بطریِ صافی */
const GLASS = { x: 336, y: 572, w: 138, h: 112 };   /* لیوانِ آبِ بیرون‌آمده */
const SHELF = { x: 588, y: 96, w: 300, h: 528 };
const LENS = { x: 916, y: 96, w: 260, h: 528 };
const BTN_POUR = { x: 588, y: 646, w: 300, h: 66 };
const BTN_CLEAR = { x: 916, y: 646, w: 260, h: 66 };
const BTN_GO = { x: SCENE_W / 2 - 150, y: 470, w: 300, h: 68 };
const BTN_AGAIN = { x: SCENE_W / 2 - 150, y: 486, w: 300, h: 68 };

function slotRect(i) {
  const n = S.slot.length, h = COL.h / n;
  return { x: COL.x, y: COL.y + i * h, w: COL.w, h: h - 4 };
}
function shelfRect(i) {
  return { x: SHELF.x + 16, y: SHELF.y + 52 + i * 90, w: SHELF.w - 32, h: 78 };
}

/* ───────── ورودی ───────── */

const TUT_TAP = [0, 1, 2], TUT_LAST = 2;

cv.addEventListener('pointermove', (e) => {
  const p = toStage(e);
  S.hover = null;
  if (S.phase === 'intro') { if (inRect(p, BTN_GO)) S.hover = BTN_GO; }
  else if (S.phase === 'won') { if (inRect(p, BTN_AGAIN)) S.hover = BTN_AGAIN; }
  else {
    for (let i = 0; i < S.shelf.length; i++) if (inRect(p, shelfRect(i))) S.hover = { k: 'mat', i };
    for (let i = 0; i < S.slot.length; i++) if (inRect(p, slotRect(i))) S.hover = { k: 'slot', i };
    if (inRect(p, BTN_POUR)) S.hover = { k: 'pour' };
    if (inRect(p, BTN_CLEAR)) S.hover = { k: 'clear' };
  }
  cv.style.cursor = S.hover ? 'pointer' : 'default';
});

cv.addEventListener('pointerdown', (e) => {
  const p = toStage(e);
  if (S.phase === 'intro') { if (inRect(p, BTN_GO)) { startLevel(0); sfx.good(); } return; }
  if (S.phase === 'won') {
    if (inRect(p, BTN_AGAIN)) { S.phase = 'intro'; S.phaseT = 0; S.score = 0; loadLevel(0); sfx.tap(); }
    return;
  }
  if (S.tut.on && tutTap(S.tut, TUT_TAP, TUT_LAST)) return;
  if (S.winT) return;
  if (inRect(p, BTN_POUR)) { pour(); return; }
  if (inRect(p, BTN_CLEAR)) { S.slot.fill(null); S.pick = -1; S.run = null; S.out = null; sfx.tap(); return; }
  for (let i = 0; i < S.shelf.length; i++) {
    if (!inRect(p, shelfRect(i))) continue;
    S.pick = S.pick === i ? -1 : i;
    sfx.tap();
    return;
  }
  for (let i = 0; i < S.slot.length; i++) {
    if (!inRect(p, slotRect(i))) continue;
    if (S.slot[i]) { S.slot[i] = null; S.run = null; S.out = null; sfx.pop(); return; }
    if (S.pick < 0) { tip('اوّل از قفسه یک مادّه بردار.'); return; }
    const id = S.shelf[S.pick];
    if (S.slot.indexOf(id) >= 0) { tip('این مادّه یک بار بیشتر لازم نیست.'); sfx.nope(); return; }
    S.slot[i] = id;
    S.run = null; S.out = null;
    sfx.place();
    if (S.tut.on && S.tut.step === 0) { S.tut.step = 1; S.tut.t = 0; }
    return;
  }
});

/* ───────── ابزارِ نقاشی ───────── */

function rrPath(x, y, w, h, r) {
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function numText(str, x, y, o = {}) {
  ctx.save();
  ctx.direction = 'ltr';
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = o.color || P.ink;
  ctx.font = `${o.weight || 700} ${o.size || 18}px "${o.family || 'Vazirmatn'}", Tahoma, sans-serif`;
  ctx.fillText(str, x, y);
  ctx.restore();
}

function spot(rects, alpha) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, SCENE_W, SCENE_H);
  for (const r of rects) rrPath(r.x - 12, r.y - 12, r.w + 24, r.h + 24, 22);
  ctx.fillStyle = `rgba(10, 20, 22, ${alpha})`;
  ctx.fill('evenodd');
  ctx.restore();
}

function tutCard(x, y, w, lines, title) {
  const h = 26 + (title ? 44 : 0) + lines.length * 30;
  withShadow(24, 10, .5, () => {
    ctx.fillStyle = 'rgba(255, 253, 246, .97)';
    wobbleRect(x, y, w, h + 20, 16, 101, 2.2); ctx.fill();
  }, '10, 20, 22');
  ctx.fillStyle = P.accent;
  wobbleRect(x, y, w, 9, 4, 103, 1); ctx.fill();
  let yy = y + 34;
  if (title) { text(title, x + w / 2, yy + 6, { size: 25, family: 'Lalezar', color: P.ink }); yy += 44; }
  for (const l of lines) { text(l, x + w / 2, yy, { size: 18, color: '#6d7d84' }); yy += 30; }
  return h + 20;
}

/** دانه‌های یک لایه — درشتیِ دانه از خودِ مادّه می‌آید. */
function grains(x, y, w, h, m, seed) {
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.fillStyle = m.d;
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = m.c;
  const g = m.grain;
  let k = seed;
  for (let py = y + g; py < y + h; py += g * 1.7) {
    for (let px = x + g; px < x + w; px += g * 1.7) {
      k = (k * 1103515245 + 12345) & 0x7fffffff;
      const jx = ((k >> 7) % 100) / 100 - .5, jy = ((k >> 13) % 100) / 100 - .5;
      ctx.beginPath();
      ctx.arc(px + jx * g, py + jy * g, g * .62, 0, TAU);
      ctx.fill();
    }
  }
  ctx.restore();
}

function bitDot(x, y, b, r) {
  ctx.fillStyle = b.c;
  if (b.micro) {
    ctx.beginPath(); ctx.ellipse(x, y, r * 1.5, r * .8, .4, 0, TAU); ctx.fill();
    ctx.strokeStyle = b.c; ctx.lineWidth = 1.2;
    for (let i = 0; i < 4; i++) {
      const a = i * TAU / 4 + .5;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r * .7);
      ctx.lineTo(x + Math.cos(a) * r * 2, y + Math.sin(a) * r * 1.5);
      ctx.stroke();
    }
    return;
  }
  if (b.id === 'barg') {
    ctx.beginPath(); ctx.ellipse(x, y, r * 1.6, r * .8, -.5, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#2f5a1c'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x - r * 1.4, y + r * .6); ctx.lineTo(x + r * 1.4, y - r * .6); ctx.stroke();
    return;
  }
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
}

/* ───────── نقاشیِ صحنه ───────── */

function paintBackStatic() {
  const g = ctx.createLinearGradient(0, 0, 0, SCENE_H);
  g.addColorStop(0, P.wallHi); g.addColorStop(1, P.wallLo);
  ctx.fillStyle = g; ctx.fillRect(0, 0, SCENE_W, SCENE_H);
  ctx.fillStyle = texStone(P.wall, P.wallHi);
  ctx.globalAlpha = .45; ctx.fillRect(0, 0, SCENE_W, SCENE_H); ctx.globalAlpha = 1;
  for (const b of [SHELF, LENS]) {
    ctx.fillStyle = 'rgba(255, 253, 246, .95)';
    ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 16); ctx.fill();
    ctx.strokeStyle = 'rgba(12, 28, 32, .22)'; ctx.lineWidth = 2;
    ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 16); ctx.stroke();
  }
  /* میزِ فلزی */
  ctx.fillStyle = P.steelDk;
  ctx.beginPath(); rrPath(240, 726, 340, 16, 6); ctx.fill();
}

function drawColumn() {
  /* آبِ گل‌آلود بالای بطری */
  const r = S.run;
  ctx.fillStyle = P.mudDk;
  ctx.beginPath(); rrPath(COL.x + 34, COL.y - 74, COL.w - 68, 56, 8); ctx.fill();
  ctx.fillStyle = P.mud;
  ctx.beginPath(); rrPath(COL.x + 34, COL.y - 70, COL.w - 68, 48, 8); ctx.fill();
  text('آبِ گل‌آلود', COL.x + COL.w / 2, COL.y - 46, { size: 14, color: '#f0e2cc' });
  if (r && !r.done) {
    ctx.strokeStyle = P.mud; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(COL.x + COL.w / 2, COL.y - 20);
    ctx.lineTo(COL.x + COL.w / 2, COL.y + slotRect(Math.min(r.layer, S.slot.length - 1)).h * .5 + (r.layer) * (COL.h / S.slot.length));
    ctx.stroke();
  }

  /* بطری */
  ctx.fillStyle = P.glass;
  ctx.beginPath(); rrPath(COL.x - 8, COL.y - 8, COL.w + 16, COL.h + 16, 12); ctx.fill();
  for (let i = 0; i < S.slot.length; i++) {
    const b = slotRect(i), id = S.slot[i];
    const hot = S.hover && S.hover.k === 'slot' && S.hover.i === i;
    if (!id) {
      ctx.fillStyle = 'rgba(255,255,255,.06)';
      ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 6); ctx.fill();
      ctx.strokeStyle = hot ? P.accent : 'rgba(255,255,255,.28)';
      ctx.lineWidth = hot ? 3 : 1.6; ctx.setLineDash([7, 6]);
      ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 6); ctx.stroke();
      ctx.setLineDash([]);
      numText(fa(i + 1), b.x + b.w / 2, b.y + b.h / 2, { size: 22, color: 'rgba(255,255,255,.4)' });
      continue;
    }
    const m = matBy(id);
    grains(b.x, b.y, b.w, b.h, m, 7 + i * 131);
    /* ذرّه‌های گیرافتاده در این لایه */
    const caught = (S.run && S.run.caught[i]) || [];
    for (let k = 0; k < caught.length; k++) {
      const bb = bitBy(caught[k]);
      const px = b.x + 16 + ((k * 37) % (b.w - 32));
      const py = b.y + 12 + ((k * 23) % Math.max(10, b.h - 24));
      bitDot(px, py, bb, 3.4);
    }
    ctx.strokeStyle = hot ? P.accent : 'rgba(20,40,44,.4)';
    ctx.lineWidth = hot ? 3 : 1.4;
    ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 6); ctx.stroke();
    /* نامِ لایه روی یک پلاکِ کوچک، تا روی دانه‌ها گم نشود */
    ctx.font = '700 12px "Vazirmatn", Tahoma, sans-serif';
    const lw = ctx.measureText(m.n).width + 16;
    ctx.fillStyle = 'rgba(16, 30, 34, .72)';
    ctx.beginPath(); rrPath(b.x + b.w - lw - 6, b.y + 5, lw, 20, 9); ctx.fill();
    text(m.n, b.x + b.w - 14, b.y + 15, { size: 12, color: '#e8f2f5', align: 'right' });
    /* لایهٔ بسته‌شده */
    if (S.out && S.out.clogged === i) {
      ctx.fillStyle = 'rgba(192,74,52,.3)';
      ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 6); ctx.fill();
      ctx.strokeStyle = P.bad; ctx.lineWidth = 4; ctx.lineCap = 'round';
      const cx = b.x + 26, cy = b.y + b.h / 2;
      ctx.beginPath();
      ctx.moveTo(cx - 9, cy - 9); ctx.lineTo(cx + 9, cy + 9);
      ctx.moveTo(cx + 9, cy - 9); ctx.lineTo(cx - 9, cy + 9);
      ctx.stroke();
      text('گرفت', b.x + b.w / 2 + 24, b.y + b.h / 2, { size: 15, family: 'Lalezar', color: '#fff' });
    }
  }
  ctx.strokeStyle = 'rgba(190, 230, 240, .8)'; ctx.lineWidth = 4;
  ctx.beginPath(); rrPath(COL.x - 8, COL.y - 8, COL.w + 16, COL.h + 16, 12); ctx.stroke();

  /* لیوانِ آبِ بیرون‌آمده */
  const g = GLASS;
  ctx.fillStyle = P.glass;
  ctx.beginPath(); rrPath(g.x, g.y, g.w, g.h, 8); ctx.fill();
  if (S.out && S.out.clogged < 0) {
    const dirtyN = S.out.bits.filter((id) => !bitBy(id).micro).length;
    const col = dirtyN > 0 ? P.mud : P.waterLt;
    ctx.fillStyle = col;
    ctx.fillRect(g.x + 3, g.y + 34, g.w - 6, g.h - 38);
    for (let k = 0; k < S.out.bits.length; k++) {
      const bb = bitBy(S.out.bits[k]);
      bitDot(g.x + 16 + ((k * 29) % (g.w - 32)), g.y + 50 + ((k * 19) % (g.h - 70)), bb, 3.2);
    }
  }
  ctx.strokeStyle = 'rgba(120,160,170,.8)'; ctx.lineWidth = 2.4;
  ctx.beginPath(); rrPath(g.x, g.y, g.w, g.h, 8); ctx.stroke();
  text('آبِ بیرون‌آمده', g.x + g.w / 2, g.y + g.h + 18, { size: 13, color: '#cfe2e8' });
}

function drawShelf() {
  text('قفسهٔ مواد', SHELF.x + SHELF.w - 16, SHELF.y + 28,
    { size: 20, family: 'Lalezar', color: P.ink, align: 'right' });
  for (let i = 0; i < S.shelf.length; i++) {
    const b = shelfRect(i), m = matBy(S.shelf[i]);
    const on = S.pick === i, used = S.slot.indexOf(m.id) >= 0;
    const hot = S.hover && S.hover.k === 'mat' && S.hover.i === i;
    ctx.fillStyle = on ? 'rgba(79,163,184,.2)' : (hot ? 'rgba(32,48,58,.07)' : 'rgba(32,48,58,.035)');
    ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 11); ctx.fill();
    ctx.strokeStyle = on ? P.accent : 'rgba(32,48,58,.14)'; ctx.lineWidth = on ? 3 : 1.3;
    ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 11); ctx.stroke();
    ctx.save();
    ctx.globalAlpha = used ? .3 : 1;
    grains(b.x + 10, b.y + 12, 76, b.h - 24, m, 3 + i * 77);
    ctx.strokeStyle = 'rgba(32,48,58,.25)'; ctx.lineWidth = 1.2;
    ctx.strokeRect(b.x + 10, b.y + 12, 76, b.h - 24);
    ctx.restore();
    text(m.n, b.x + b.w - 12, b.y + 30, { size: 15, family: 'Lalezar', color: P.ink, align: 'right' });
    if (m.kills) text('میکروب‌کُش', b.x + b.w - 12, b.y + 54, { size: 12, color: '#2f8f74', align: 'right' });
    else numText('سوراخ: ' + fa(m.pore), b.x + b.w - 46, b.y + 54, { size: 13, color: P.inkSoft });
    if (used) {
      ctx.fillStyle = P.good;
      ctx.beginPath(); ctx.arc(b.x + b.w - 16, b.y + b.h - 16, 8, 0, TAU); ctx.fill();
    }
  }
}

function drawLens() {
  text('زیرِ ذرّه‌بین', LENS.x + LENS.w - 16, LENS.y + 28,
    { size: 19, family: 'Lalezar', color: P.ink, align: 'right' });
  /* چه چیزهایی در آبِ گل‌آلود هست */
  text('در آبِ گل‌آلود:', LENS.x + LENS.w - 16, LENS.y + 62, { size: 14, color: P.inkSoft, align: 'right' });
  const list = L().dirt;
  for (let i = 0; i < list.length; i++) {
    const b = bitBy(list[i]), y = LENS.y + 90 + i * 40;
    bitDot(LENS.x + LENS.w - 32, y, b, 5);
    text(b.n, LENS.x + LENS.w - 54, y, { size: 14, color: P.ink, align: 'right' });
    numText(b.micro ? 'خیلی ریز' : 'اندازه ' + fa(b.size), LENS.x + 58, y, { size: 12, color: P.inkSoft });
  }
  /* نتیجه */
  const yy = LENS.y + 320;
  if (!S.out) {
    text('صافی را بچین و آب را بریز.', LENS.x + LENS.w / 2, yy + 40,
      { size: 14, color: 'rgba(32,48,58,.4)' });
    return;
  }
  if (S.out.clogged >= 0) {
    ctx.fillStyle = 'rgba(192,74,52,.14)';
    ctx.beginPath(); rrPath(LENS.x + 16, yy, LENS.w - 32, 96, 10); ctx.fill();
    text('لایهٔ ' + fa(S.out.clogged + 1) + ' گرفت.', LENS.x + LENS.w / 2, yy + 30,
      { size: 17, family: 'Lalezar', color: P.bad });
    text('ذرّهٔ درشت سوراخ‌هایش را بست.', LENS.x + LENS.w / 2, yy + 58, { size: 13, color: P.inkSoft });
    text('آب اصلاً رد نشد.', LENS.x + LENS.w / 2, yy + 78, { size: 13, color: P.inkSoft });
    return;
  }
  const left = S.out.bits;
  ctx.fillStyle = left.length ? 'rgba(201,150,44,.14)' : 'rgba(78,159,108,.16)';
  ctx.beginPath(); rrPath(LENS.x + 16, yy, LENS.w - 32, 150, 10); ctx.fill();
  if (!left.length) {
    text('آبِ صاف و سالم', LENS.x + LENS.w / 2, yy + 30, { size: 18, family: 'Lalezar', color: P.good });
    text('هیچ ذرّه‌ای و هیچ میکروبی نماند.', LENS.x + LENS.w / 2, yy + 58, { size: 13, color: P.inkSoft });
  } else {
    text('هنوز در آب مانده:', LENS.x + LENS.w / 2, yy + 26, { size: 15, family: 'Lalezar', color: '#8a6a12' });
    const seen = [];
    for (const id of left) if (seen.indexOf(id) < 0) seen.push(id);
    for (let i = 0; i < seen.length; i++) {
      const id = seen[i], b = bitBy(id);
      const n = left.filter((q) => q === id).length;
      bitDot(LENS.x + LENS.w - 40, yy + 56 + i * 28, b, 5);
      text(b.n + ' × ' + fa(n), LENS.x + LENS.w - 62, yy + 56 + i * 28,
        { size: 13, color: P.ink, align: 'right' });
    }
  }
}
function drawHUD() {
  ctx.fillStyle = 'rgba(16, 30, 34, .94)';
  ctx.fillRect(0, 0, SCENE_W, HUD_H);
  ctx.fillStyle = 'rgba(120, 190, 210, .3)';
  ctx.fillRect(0, HUD_H - 2, SCENE_W, 2);
  text(L().name, SCENE_W - 24, HUD_H / 2, { size: 22, family: 'Lalezar', color: P.paper, align: 'right' });
  numText(fa(S.level + 1) + ' / ' + fa(LEVELS.length), 640, HUD_H / 2, { size: 21, color: P.gold });
  numText(fa(S.score), 300, HUD_H / 2, { size: 20, color: P.paper });
  text('بیشترین ' + fa(S.best), 150, HUD_H / 2, { size: 15, color: 'rgba(251,250,242,.6)' });
  const kk = clamp((S.level + (S.won ? 1 : 0)) / LEVELS.length, 0, 1);
  ctx.fillStyle = 'rgba(255,255,255,.14)';
  ctx.beginPath(); rrPath(24, HUD_H - 9, 240, 5, 3); ctx.fill();
  ctx.fillStyle = P.gold;
  ctx.beginPath(); rrPath(24, HUD_H - 9, 240 * kk, 5, 3); ctx.fill();
}

function drawTutorial() {
  const st = S.tut.step;
  if (st === 0) {
    spot([{ x: SHELF.x, y: SHELF.y, w: SHELF.w, h: SHELF.h }], .72);
    const h = tutCard(60, 250, 480,
      ['از قفسه یک مادّه بردار،', 'بعد روی یکی از لایه‌های بطری بزن.'], 'تصفیه‌خانه');
    tutMore(300, 250 + h + 8, S.t, P.ink);
  } else if (st === 1) {
    spot([{ x: BTN_POUR.x, y: BTN_POUR.y, w: BTN_POUR.w, h: BTN_POUR.h }], .68);
    tutCard(60, 250, 480, ['لایه‌ها که پر شد،', 'آبِ گل‌آلود را بریز و ببین چه می‌شود.']);
  } else {
    spot([{ x: LENS.x, y: LENS.y, w: LENS.w, h: LENS.h }], .7);
    const h = tutCard(60, 230, 520,
      ['هر لایه فقط ذرّهٔ بزرگ‌تر از سوراخش را می‌گیرد.',
       'ذرّهٔ خیلی درشت هم لایهٔ ریز را می‌بندد.'], 'قانونِ صافی');
    tutMore(320, 230 + h + 8, S.t, P.ink);
  }
}

/* ───────── پرده‌ها ───────── */

function filterIcon(x, y) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(206,232,239,.4)';
  ctx.beginPath(); rrPath(-26, -30, 52, 56, 6); ctx.fill();
  const cols = [['#8d99a3', 12], ['#b0a184', 12], ['#dcc38a', 12], ['#f2f2ea', 12]];
  let yy = -28;
  for (const [c, h] of cols) { ctx.fillStyle = c; ctx.fillRect(-24, yy, 48, h); yy += h; }
  ctx.strokeStyle = '#bfe6f2'; ctx.lineWidth = 2.4;
  ctx.beginPath(); rrPath(-26, -30, 52, 56, 6); ctx.stroke();
  ctx.fillStyle = '#4f9fc4';
  ctx.beginPath(); ctx.arc(0, 34, 5, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawIntro() {
  overlay({
    t: S.phaseT, w: 840, h: 300, y: 128,
    paper: P.paper, band: P.accent, ink: P.ink, inkSoft: '#6d7d84',
    icon: filterIcon,
    title: 'تصفیه‌خانه',
    body: 'آبِ گل‌آلود را باید از چند لایه رد کنیم تا صاف شود.\nهر لایه فقط ذرّه‌های بزرگ‌تر از سوراخ‌هایش را می‌گیرد.\nترتیبِ لایه‌ها با توست — ببین کدام ترتیب کار می‌کند.',
    btn: BTN_GO, btnLabel: 'شروع', btnHot: S.hover === BTN_GO,
    btnFill: '#2f7f96', btnHotFill: '#4fa3b8',
  });
}

function drawWon() {
  overlay({
    t: S.phaseT, w: 780, h: 300, y: 140,
    paper: P.paper, band: P.gold, ink: P.ink, inkSoft: '#6d7d84',
    icon: filterIcon,
    title: 'آبِ سالم',
    body: 'از درشت به ریز چیدی، و آخر هم ضدعفونی — همان کاری که\nتصفیه‌خانهٔ شهر می‌کند.\nامتیازت: ' + fa(S.score),
    btn: BTN_AGAIN, btnLabel: 'از نو', btnHot: S.hover === BTN_AGAIN,
    btnFill: '#2f7f96', btnHotFill: '#4fa3b8',
  });
}

function draw() {
  beginScene(P.wallLo);
  ctx.save();
  if (S.shake > 0) {
    const k = S.shake * 10;
    ctx.translate(Math.sin(S.t * 55) * k, Math.cos(S.t * 43) * k * .4);
  }
  const layer = staticLayer('back', SCENE_W, SCENE_H, paintBackStatic);
  ctx.drawImage(layer, 0, 0, SCENE_W, SCENE_H);
  drawColumn();
  drawShelf();
  drawLens();
  bits.draw();
  ctx.restore();
  button(BTN_POUR, S.run && !S.run.done ? 'می‌ریزد…' : 'آب را بریز', {
    hot: S.hover && S.hover.k === 'pour', fill: '#2f7f96', hotFill: '#4fa3b8', size: 22 });
  button(BTN_CLEAR, 'خالی کن', {
    hot: S.hover && S.hover.k === 'clear', fill: '#5c6870', hotFill: '#77848d', size: 20 });
  drawHUD();
  if (!(S.phase === 'play' && S.tut.on)) toast.draw(HUD_H + 8, { good: P.good, bad: P.bad, info: P.card, ink: P.ink });
  if (S.phase === 'play' && S.tut.on) drawTutorial();
  if (S.phase === 'intro') drawIntro();
  if (S.phase === 'won') drawWon();
  if (S.tipT > 0) {
    ctx.save();
    ctx.globalAlpha = clamp(S.tipT, 0, 1);
    const w = 480;
    paper(SCENE_W / 2 - w / 2, SCENE_H - 54, w, 42, P.paper, 51, 12, .3);
    text(S.tip, SCENE_W / 2, SCENE_H - 33, { size: 16, color: P.ink });
    ctx.restore();
  }
  endScene(.09, 'rgba(6, 20, 24, .42)', 0, .1);
}
