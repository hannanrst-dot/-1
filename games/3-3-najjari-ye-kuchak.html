<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2a1d14">
<title>نجّاریِ کوچک — کسر در اندازه‌گیری</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>
  /* صفحه نباید هیچ‌جا اسکرول یا زوم شود؛ بازی باید مثل یک برنامه رفتار کند. */
  html, body {
    margin: 0; padding: 0; background: #2a1d14;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body {
    position: fixed; inset: 0;          /* جلوی کشیده‌شدنِ صفحه در سافاریِ گوشی */
    width: 100%; height: 100vh; height: 100dvh;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none; -webkit-touch-callout: none;
  }

  /* گوشیِ عمودی صحنه را ریز می‌کند؛ بچه باید گوشی را بچرخاند. */
  #rotate { display: none; }
  @media (orientation: portrait) and (max-width: 860px) {
    #stage { display: none; }
    #rotate {
      display: flex; position: fixed; inset: 0;
      z-index: 9;
      flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      background: #2a1d14; color: #f6ead2;
      font: 700 20px "Vazirmatn", Tahoma, sans-serif; text-align: center; padding: 32px;
    }
    #rotate svg { animation: tilt 2.4s ease-in-out infinite; }
    @keyframes tilt { 0%, 45% { transform: rotate(0deg); } 65%, 100% { transform: rotate(-90deg); } }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="rotate">
  <svg width="86" height="126" viewBox="0 0 86 126" fill="none" aria-hidden="true">
    <rect x="3" y="3" width="80" height="120" rx="12" stroke="#e8b448" stroke-width="5"/>
    <rect x="15" y="19" width="56" height="88" rx="5" fill="#e8b448" opacity=".28"/>
    <circle cx="43" cy="115" r="4" fill="#e8b448"/>
  </svg>
  <div>گوشی را بچرخان</div>
  <div style="font-weight:400;opacity:.7;font-size:16px">این بازی خوابیده بازی می‌شود</div>
</div>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   هستهٔ مشترکِ بازی‌ها — سبک «کاغذبُری»
   ───────────────────────────────────────────────────────────────────────
   این فایل جعبه‌ابزار است، نه چارچوب: هر بازی حلقه و وضعیت خودش را دارد
   و فقط از این توابع برای کشیدن استفاده می‌کند. دلیلش این است که هر بازی
   باید حس‌وحال خودش را داشته باشد، نه اینکه همه شبیه هم دربیایند.

   قاعده‌های ثابتِ تصویری:
   • نور همیشه از بالا-چپ می‌تابد، پس سایه‌ها به پایین-راست می‌افتند.
   • هیچ لبه‌ای کاملاً صاف نیست؛ همه کمی موج دارند (انگار با قیچی بریده).
   • هیچ خاکستریِ خالصی نداریم؛ همه‌ی خنثی‌ها به گرمیِ صحنه می‌زنند.
   • یک لایه‌ی دانه‌دانه‌ی کاغذ روی کلِ تصویر ضرب می‌شود.
   ═══════════════════════════════════════════════════════════════════════ */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const FA_D = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
const fa = (n) => String(n).replace(/\d/g, (d) => FA_D[+d]);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeIn = (t) => t * t * t;
const easeInOut = (t) => (t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2);
const easeBack = (t) => 1 + 2.7 * Math.pow(t-1, 3) + 1.7 * Math.pow(t-1, 2);
const easeElastic = (t) => t === 0 || t === 1 ? t : Math.pow(2, -9*t) * Math.sin((t*10 - .75) * 2.094) + 1;

/** تصادفِ تکرارپذیر: با یک بذر همیشه همان عدد. برای اینکه تزئین‌ها هر فریم نپرند. */
function noise1(x) {
  const s = Math.sin(x * 127.1) * 43758.5453;
  return s - Math.floor(s);
}
const pick = (arr, seed) => arr[Math.floor(noise1(seed) * arr.length) % arr.length];

/* ───────── بوم و صحنهٔ ثابت ───────── */

let ctx, SW, SH, CV, _refit = null;
let view = { scale: 1, ox: 0, oy: 0, w: 0, h: 0, dpr: 1 };
let _grain = null;

function initStage(canvas, w, h) {
  CV = canvas; SW = w; SH = h;
  ctx = canvas.getContext('2d');

  /* اندازه را از خودِ بوم می‌گیریم نه از innerHeight؛ چون در سافاریِ گوشی
     نوارِ آدرس باز و بسته می‌شود و innerHeight دروغ می‌گوید. */
  const fit = () => {
    const r = canvas.getBoundingClientRect();
    const vw = Math.round(r.width), vh = Math.round(r.height);
    if (vw < 20 || vh < 20) return;
    const dpr = Math.min(devicePixelRatio || 1, QUALITY > 0 ? 2 : 1);
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    const scale = Math.min(vw / SW, vh / SH);
    view = { scale, ox: (vw - SW*scale)/2, oy: (vh - SH*scale)/2, w: vw, h: vh, dpr };
    _grain = buildGrain();
  };
  _refit = fit;
  addEventListener('resize', fit);
  /* چرخاندنِ گوشی: اندازهٔ درست چند لحظه بعد می‌رسد، پس چندبار اندازه می‌گیریم. */
  addEventListener('orientationchange', () => {
    fit(); setTimeout(fit, 140); setTimeout(fit, 460);
  });
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(canvas);

  /* صدا در گوشی فقط بعد از اوّلین لمس اجازهٔ پخش دارد. */
  const unlock = () => { sfx._c(); removeEventListener('pointerdown', unlock); removeEventListener('touchstart', unlock); };
  addEventListener('pointerdown', unlock, { passive: true });
  addEventListener('touchstart', unlock, { passive: true });
  /* نگه‌داشتنِ انگشت نباید منوی مرورگر را باز کند. */
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  fit();
  return ctx;
}

/** قابِ صحنه را باز می‌کند: بعد از این، مختصات همیشه در فضای SW×SH است. */
function beginScene(bg) {
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, view.w, view.h);
  ctx.save();
  ctx.translate(view.ox, view.oy);
  ctx.scale(view.scale, view.scale);
  ctx.beginPath();
  ctx.rect(0, 0, SW, SH);
  ctx.clip();
}

/** بافتِ کاغذ، تیرگیِ گوشه‌ها، رنگ‌بندی و درخششِ نور را می‌گذارد و قاب را می‌بندد. */
function endScene(grainAlpha = .15, vignette = 'rgba(48,28,14,.30)', bloom = .34, grade = .14) {
  if (QUALITY < 1) { grade = 0; grainAlpha *= .5; }
  if (QUALITY < 2) bloom = 0;
  if (grade > 0) {
    /* رنگ‌بندیِ نرم: بالای صحنه گرم‌تر، پایین سردتر — عمق می‌دهد */
    const g = ctx.createLinearGradient(0, 0, 0, SH);
    g.addColorStop(0, `rgba(255, 214, 150, ${grade})`);
    g.addColorStop(.55, 'rgba(255, 255, 255, 0)');
    g.addColorStop(1, `rgba(40, 60, 110, ${grade * .9})`);
    ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalCompositeOperation = 'source-over';
  }
  if (_grain && grainAlpha > 0) {
    ctx.globalCompositeOperation = 'multiply';
    ctx.globalAlpha = grainAlpha;
    ctx.fillStyle = _grain;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
  if (vignette) {
    const g = ctx.createRadialGradient(SW/2, SH/2, SH*.42, SW/2, SH/2, SH*1.05);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, vignette);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
  }
  ctx.restore();
  bloomPass(bloom);
}

/* ───────── درخششِ نور (bloom) ─────────
   قابِ رسم‌شده را کوچک می‌کنیم، دو بار در خودش ضرب می‌کنیم تا فقط
   روشن‌ها بمانند، محوش می‌کنیم و با حالتِ «lighter» رویش می‌گذاریم.
   نتیجه: چراغ‌ها، شعله‌ها و رنگ‌های روشن نور پخش می‌کنند. */
let _bl, _blc, _bl2, _bl2c, _blNo = false, _blTick = 0;

function bloomPass(amount) {
  if (!amount || _blNo || !CV.width) return;
  /* کوچک‌کردن و بزرگ‌کردنِ دوباره، خودش محو می‌کند — از filter خیلی ارزان‌تر است */
  const W = Math.max(4, Math.round(CV.width * .2)), H = Math.max(4, Math.round(CV.height * .2));
  const W2 = Math.max(2, Math.round(W * .28)), H2 = Math.max(2, Math.round(H * .28));
  try {
    if (!_bl) {
      _bl = document.createElement('canvas'); _blc = _bl.getContext('2d');
      _bl2 = document.createElement('canvas'); _bl2c = _bl2.getContext('2d');
      if (!_blc || !_bl2c) { _blNo = true; return; }
    }
    if (_bl.width !== W || _bl.height !== H) { _bl.width = W; _bl.height = H; }
    if (_bl2.width !== W2 || _bl2.height !== H2) { _bl2.width = W2; _bl2.height = H2; }
    /* ساختنِ نور یک قاب در میان کافی است؛ گذاشتنش هر قاب. */
    _blTick = (_blTick + 1) & 1;
    if (!_blTick) {
      _blc.globalCompositeOperation = 'source-over';
      _blc.clearRect(0, 0, W, H);
      _blc.drawImage(CV, 0, 0, W, H);
      _blc.globalCompositeOperation = 'multiply';
      _blc.drawImage(_bl, 0, 0);
      _blc.drawImage(_bl, 0, 0);
      _blc.globalCompositeOperation = 'source-over';
      _bl2c.clearRect(0, 0, W2, H2);
      _bl2c.drawImage(_bl, 0, 0, W2, H2);
    }

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = amount;
    ctx.drawImage(_bl2, 0, 0, CV.width, CV.height);
    ctx.restore();
  } catch (e) { _blNo = true; }
}

/* ───────── لایهٔ ثابت ─────────
   هرچه در صحنه تکان نمی‌خورد را یک‌بار می‌کشیم و بعد فقط کپی می‌کنیم. */
const _layers = {};
function staticLayer(key, w, h, paint) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const L = _layers[key];
  if (L && L.q === q && L.w === w && L.h === h) return L.cv;
  const off = document.createElement('canvas');
  off.width = Math.max(1, Math.round(w * q));
  off.height = Math.max(1, Math.round(h * q));
  const c = off.getContext('2d');
  c.setTransform(q, 0, 0, q, 0, 0);
  const prev = ctx;
  ctx = c;
  try { paint(); } finally { ctx = prev; }
  _layers[key] = { cv: off, q, w, h };
  return off;
}

/* ───────── نورپردازی و بافت ─────────
   کارِ این‌ها این است که هیچ سطحی «تختِ یک‌رنگ» نماند. */

/** شیبِ عمودی: بالا روشن، پایین تیره. */
function vgrad(y0, y1, top, bot) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, top); g.addColorStop(1, bot);
  return g;
}

/** حجمِ کروی: نور از بالا-چپ، سایه در پایین-راست. */
function ball(cx, cy, r, lit, base, dark) {
  const g = ctx.createRadialGradient(cx - r * .38, cy - r * .42, r * .06, cx, cy, r * 1.06);
  g.addColorStop(0, lit); g.addColorStop(.45, base); g.addColorStop(1, dark);
  return g;
}

/** لبهٔ روشنِ بالا-چپِ یک مسیر — همان «rim light». */
function rim(pathFn, col, w = 2.2) {
  ctx.save();
  ctx.beginPath(); pathFn();
  ctx.clip();
  ctx.beginPath(); pathFn();
  ctx.strokeStyle = col; ctx.lineWidth = w * 2; ctx.lineJoin = 'round';
  ctx.translate(-w * .5, -w * .6);
  ctx.stroke();
  ctx.restore();
}

/** سایهٔ چسبیده به زمین — چیزها را روی سطح می‌نشاند. */
function contact(cx, cy, rx, ry, alpha = .26) {
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
  g.addColorStop(0, `rgba(20, 12, 6, ${alpha})`);
  g.addColorStop(1, 'rgba(20, 12, 6, 0)');
  ctx.save();
  ctx.fillStyle = g;
  ctx.translate(cx, cy); ctx.scale(1, ry / Math.max(rx, ry));
  ctx.beginPath(); ctx.arc(0, 0, Math.max(rx, ry), 0, TAU); ctx.fill();
  ctx.restore();
}

const _tex = {};
/** بافتِ تکرارشونده؛ یک‌بار ساخته و بعد از حافظه خوانده می‌شود. */
function texture(key, w, h, paint) {
  if (_tex[key]) return _tex[key];
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const c = off.getContext('2d');
  paint(c, w, h);
  _tex[key] = ctx.createPattern(off, 'repeat');
  return _tex[key];
}

/** رگهٔ چوب. */
function texWood(base, grain) {
  return texture('w' + base + grain, 120, 120, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = grain; c.lineWidth = 1.4;
    for (let i = 0; i < 9; i++) {
      c.globalAlpha = .18 + noise1(i * 3.1) * .3;
      c.beginPath();
      const y0 = i * 14 + noise1(i) * 6;
      c.moveTo(0, y0);
      for (let x = 0; x <= w; x += 10) c.lineTo(x, y0 + Math.sin(x * .09 + i) * 2.6);
      c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** تارِ پارچه. */
function texCloth(base, thread) {
  return texture('c' + base + thread, 16, 16, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = thread; c.lineWidth = 1; c.globalAlpha = .5;
    for (let i = 0; i < w; i += 4) {
      c.beginPath(); c.moveTo(i, 0); c.lineTo(i, h); c.stroke();
      c.beginPath(); c.moveTo(0, i); c.lineTo(w, i); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** دانه‌های سنگ. */
function texStone(base, spec) {
  return texture('s' + base + spec, 90, 90, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) {
      c.globalAlpha = .05 + noise1(i * 1.7) * .16;
      c.fillStyle = spec;
      const r = .6 + noise1(i * 5.3) * 1.9;
      c.beginPath();
      c.arc(noise1(i * 2.1) * w, noise1(i * 3.7 + 1) * h, r, 0, TAU);
      c.fill();
    }
    c.globalAlpha = 1;
  });
}

/** الیافِ کاغذ. */
function texPaper(base) {
  return texture('p' + base, 100, 100, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 130; i++) {
      c.globalAlpha = .04 + noise1(i * 2.3) * .07;
      c.strokeStyle = i % 2 ? '#ffffff' : '#5a4326';
      c.lineWidth = .9;
      const x = noise1(i * 1.3) * w, y = noise1(i * 4.1 + 2) * h;
      const a = noise1(i * 7.7) * TAU, l = 4 + noise1(i * 9.1) * 12;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

function buildGrain() {
  const s = 260;
  const off = document.createElement('canvas');
  off.width = off.height = s;
  const c = off.getContext('2d');
  const img = c.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    const v = 214 + Math.random() * 41;
    img.data[i*4] = v; img.data[i*4+1] = v; img.data[i*4+2] = v; img.data[i*4+3] = 255;
  }
  c.putImageData(img, 0, 0);
  return ctx.createPattern(off, 'repeat');
}

function toStage(e) {
  const r = CV.getBoundingClientRect();
  return {
    x: (e.clientX - r.left - view.ox) / view.scale,
    y: (e.clientY - r.top - view.oy) / view.scale,
  };
}

const inRect = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
const inCircle = (p, b, pad = 0) => Math.hypot(p.x - b.x, p.y - b.y) <= b.r + pad;

/* ───────── قلم‌های کاغذبُری ───────── */

/** دایره‌ای که انگار با قیچی بریده شده. */
function wobbleCircle(cx, cy, r, seed = 0, amp = 2.2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const rr = r + Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp * .45;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** بیضیِ ناصاف — برای چیزهایی که گرد نیستند ولی نرم‌اند. */
function wobbleEllipse(cx, cy, rx, ry, rot = 0, seed = 0, amp = 2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const w = 1 + (Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp*.45) / Math.max(rx, ry);
    const px = Math.cos(a) * rx * w, py = Math.sin(a) * ry * w;
    const x = cx + px*Math.cos(rot) - py*Math.sin(rot);
    const y = cy + px*Math.sin(rot) + py*Math.cos(rot);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** مستطیلِ گِرد با گوشه‌های کمی کج. */
function wobbleRect(x, y, w, h, r = 12, seed = 0, amp = 1.6) {
  const j = (k) => (noise1(seed*9.7 + k) - .5) * amp * 2;
  ctx.beginPath();
  ctx.moveTo(x + r + j(1), y + j(2));
  ctx.lineTo(x + w - r + j(3), y + j(4));
  ctx.quadraticCurveTo(x + w + j(5), y + j(6), x + w + j(7), y + r + j(8));
  ctx.lineTo(x + w + j(9), y + h - r + j(10));
  ctx.quadraticCurveTo(x + w + j(11), y + h + j(12), x + w - r + j(13), y + h + j(14));
  ctx.lineTo(x + r + j(15), y + h + j(16));
  ctx.quadraticCurveTo(x + j(17), y + h + j(18), x + j(19), y + h - r + j(20));
  ctx.lineTo(x + j(21), y + r + j(22));
  ctx.quadraticCurveTo(x + j(23), y + j(24), x + r + j(1), y + j(2));
  ctx.closePath();
}

/** سایهٔ نرم؛ نور از بالا-چپ. */
function withShadow(blur, dy, alpha, fn, hue = '78, 46, 24') {
  ctx.save();
  ctx.shadowColor = `rgba(${hue}, ${alpha})`;
  ctx.shadowBlur = blur;
  ctx.shadowOffsetY = dy;
  ctx.shadowOffsetX = dy * .35;
  fn();
  ctx.restore();
}

/** یک برگه‌ی کاغذ با سایه — پایه‌ی همه‌ی کارت‌ها و تابلوها. */
function paper(x, y, w, h, fill, seed = 1, r = 12, shadow = .26) {
  withShadow(16, 7, shadow, () => {
    ctx.fillStyle = fill;
    wobbleRect(x, y, w, h, r, seed, 2);
    ctx.fill();
  });
  /* الیافِ کاغذ و لبهٔ روشن، تا سطح تخت نماند */
  ctx.save();
  ctx.beginPath(); wobbleRect(x, y, w, h, r, seed, 2); ctx.clip();
  ctx.globalAlpha = .5;
  ctx.fillStyle = texPaper(fill);
  ctx.fillRect(x, y, w, h);
  ctx.globalAlpha = 1;
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.4, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(90,60,20,.1)');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
}

function text(str, x, y, o = {}) {
  const size = o.size || 20;
  const fam = o.family || 'Vazirmatn';
  ctx.save();
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.font = `${fam === 'Lalezar' ? '400' : (o.weight || 700)} ${size}px "${fam}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.baseline || 'middle';
  ctx.fillStyle = o.color || '#43291b';
  ctx.direction = 'rtl';
  if (o.stroke) {
    ctx.lineWidth = o.strokeWidth || 5;
    ctx.strokeStyle = o.stroke;
    ctx.lineJoin = 'round';
    ctx.strokeText(str, x, y, o.maxWidth);
  }
  ctx.fillText(str, x, y, o.maxWidth);
  ctx.restore();
}

/** متنِ چندخطی که خودش می‌شکند. ارتفاعِ اشغال‌شده را برمی‌گرداند. */
function textWrap(str, x, y, maxW, o = {}) {
  const size = o.size || 19, lh = o.lineHeight || size * 1.7;
  ctx.font = `${o.weight || 700} ${size}px "${o.family || 'Vazirmatn'}", Tahoma, sans-serif`;
  const lines = [];
  for (const para of str.split('\n')) {
    let line = '';
    for (const wd of para.split(' ')) {
      const t = line ? line + ' ' + wd : wd;
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = wd; }
      else line = t;
    }
    lines.push(line);
  }
  lines.forEach((l, i) => text(l, x, y + i * lh, o));
  return lines.length * lh;
}

/* ───────── ذره‌ها ───────── */

class Bits {
  constructor() { this.list = []; }
  add(x, y, n, kind, colors, opts = {}) {
    for (let i = 0; i < n; i++) {
      const a = opts.dir !== undefined ? opts.dir + (Math.random()-.5) * (opts.spread || 1) : Math.random() * TAU;
      const sp = (opts.speed || 200) * (.4 + Math.random());
      this.list.push({
        kind, x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - (opts.lift || 0),
        r: (opts.size || 4) * (.5 + Math.random()),
        rot: Math.random() * TAU, vr: (Math.random()-.5) * 10,
        col: colors[(Math.random() * colors.length) | 0],
        grav: opts.grav === undefined ? 620 : opts.grav,
        drag: opts.drag || .995,
        life: (opts.life || .9) * (.6 + Math.random() * .8), age: 0,
      });
    }
  }
  confetti(x, y, n, colors) {
    this.add(x, y, n, 'flake', colors, { speed: 420, lift: 190, size: 5, life: 1.6, grav: 780 });
  }
  spark(x, y, n, colors) {
    this.add(x, y, n, 'dot', colors, { speed: 180, lift: 30, size: 3.4, life: .7, grav: 260, drag: .93 });
  }
  step(dt) {
    for (const p of this.list) {
      p.age += dt;
      p.vy += p.grav * dt;
      p.vx *= p.drag; p.vy *= p.drag;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    }
    this.list = this.list.filter((p) => p.age < p.life);
  }
  draw() {
    for (const p of this.list) {
      const k = clamp(1 - p.age / p.life, 0, 1);
      ctx.save();
      ctx.globalAlpha = k;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.col;
      if (p.kind === 'flake') ctx.fillRect(-p.r, -p.r*1.5, p.r*2, p.r*3);
      else if (p.kind === 'leaf') { wobbleEllipse(0, 0, p.r*1.8, p.r*.8, 0, p.r, .6); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(0, 0, p.r * k, 0, TAU); ctx.fill(); }
      ctx.restore();
    }
  }
  clear() { this.list.length = 0; }
}

const sfx = {
  ac: null, on: true,
  _c() {
    if (!this.on) return null;
    if (!this.ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; this.ac = new A(); }
    if (this.ac.state === 'suspended') this.ac.resume();
    return this.ac;
  },
  tone(f, dur = .16, type = 'sine', gain = .13, delay = 0) {
    const c = this._c(); if (!c) return;
    const t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(t0 + dur + .04);
  },
  tap()  { this.tone(430, .07, 'triangle', .09); },
  place(){ this.tone(620, .11, 'sine', .12); },
  pop()  { this.tone(760, .09, 'sine', .11); },
  slide(){ this.tone(240, .22, 'sine', .07); },
  good() { [523, 659, 784].forEach((f,i) => this.tone(f, .22, 'sine', .13, i*.07)); },
  win()  { [523, 659, 784, 1047].forEach((f,i) => this.tone(f, .34, 'triangle', .13, i*.10)); },
  nope() { this.tone(180, .2, 'sawtooth', .07); },
  tick() { this.tone(1100, .04, 'square', .05); },
};

function star(x, y, r, col, rot = 0) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = col;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI/2 + i * Math.PI/5;
    const rr = i % 2 ? r * .45 : r;
    const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/** دکمهٔ کاغذی. hovered را خودِ بازی می‌دهد؛ اینجا فقط کشیده می‌شود. */
/** رنگ را روشن‌تر (k>0) یا تیره‌تر (k<0) می‌کند. */
function shade(col, k) {
  const c = String(col).trim();
  let r, g2, b2;
  if (c[0] === '#') {
    const h = c.length === 4 ? c[1]+c[1]+c[2]+c[2]+c[3]+c[3] : c.slice(1, 7);
    r = parseInt(h.slice(0,2), 16); g2 = parseInt(h.slice(2,4), 16); b2 = parseInt(h.slice(4,6), 16);
  } else {
    const m = c.match(/[\d.]+/g);
    if (!m || m.length < 3) return col;
    r = +m[0]; g2 = +m[1]; b2 = +m[2];
  }
  const f = (v) => Math.round(clamp(k < 0 ? v * (1 + k) : v + (255 - v) * k, 0, 255));
  return 'rgb(' + f(r) + ',' + f(g2) + ',' + f(b2) + ')';
}

function button(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 3 : 0;
  const fill = o.disabled ? (o.off || '#bcaa92') : (hot ? (o.hotFill || o.fill) : o.fill);
  const r = o.r === undefined ? 14 : o.r;
  /* لبهٔ زیرینِ تیره — دکمه از صفحه بیرون می‌زند */
  ctx.fillStyle = shade(fill, -.36);
  wobbleRect(b.x, b.y + dy + 7, b.w, b.h, r, b.x + b.y, 2);
  ctx.fill();
  withShadow(hot ? 22 : 14, hot ? 5 : 8, .32, () => {
    ctx.fillStyle = fill;
    wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2);
    ctx.fill();
  });
  /* حجم: روشن از بالا، تیره به پایین */
  ctx.save();
  ctx.beginPath(); wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2); ctx.clip();
  const g = ctx.createLinearGradient(0, b.y + dy, 0, b.y + dy + b.h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.45, 'rgba(255,255,255,.04)');
  g.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = g;
  ctx.fillRect(b.x, b.y + dy, b.w, b.h);
  /* برقِ باریکِ لبهٔ بالا */
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.fillRect(b.x + r, b.y + dy + 2, b.w - r * 2, 2);
  ctx.restore();
  text(label, b.x + b.w/2, b.y + b.h/2 + dy - (o.sub ? 9 : 0), {
    size: o.size || 26, color: o.color || '#fdf6e8', family: o.family || 'Lalezar',
  });
  if (o.sub) text(o.sub, b.x + b.w/2, b.y + b.h/2 + dy + 17,
    { size: 14, color: o.subColor || 'rgba(255,255,255,.88)' });
}

/** دکمهٔ گرد کوچک (مثل + و −). */
function roundButton(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 2 : 0;
  withShadow(10, hot ? 3 : 5, .3, () => {
    ctx.fillStyle = o.disabled ? '#cbbba3' : (hot ? (o.hotFill || o.fill) : o.fill);
    wobbleCircle(b.x, b.y + dy, b.r, b.x, 1.4);
    ctx.fill();
  });
  text(label, b.x, b.y + dy - 1,
    { size: o.size || 32, color: o.disabled ? '#a8988a' : (o.color || '#fdf6e8'), family: 'Lalezar' });
}

/** پرده‌ی تمام‌صفحه: برای شروعِ پرده و برای جشنِ پایان. */
function overlay(o) {
  const k = easeOut(clamp(o.t / .5, 0, 1));
  ctx.fillStyle = `rgba(30, 22, 16, ${.66 * k})`;
  ctx.fillRect(0, 0, SW, SH);

  const w = o.w || 700, h = o.h || 290;
  const x = (SW - w) / 2, y = o.y || (SH * .22);
  const s = lerp(.9, 1, easeBack(clamp(o.t / .65, 0, 1)));
  ctx.save();
  ctx.translate(SW/2, y + h/2);
  ctx.scale(s, s);
  ctx.translate(-SW/2, -(y + h/2));

  withShadow(30, 14, .42, () => {
    ctx.fillStyle = o.paper || '#fbf3e2';
    wobbleRect(x, y, w, h, 18, 121, 2.4);
    ctx.fill();
  });
  ctx.fillStyle = o.band || '#c8434f';
  wobbleRect(x, y, w, 12, 6, 123, 1);
  ctx.fill();

  if (o.icon) o.icon(SW/2, y + 56);
  text(o.title, SW/2, y + (o.icon ? 108 : 62),
    { size: o.titleSize || 36, color: o.ink || '#43291b', family: 'Lalezar', alpha: k });
  textWrap(o.body, SW/2, y + (o.icon ? 158 : 116), w - 90,
    { size: 19, color: o.inkSoft || '#8a6a52', alpha: k });
  ctx.restore();

  button(o.btn, o.btnLabel, { hot: o.btnHot, fill: o.btnFill || '#7fa356', hotFill: o.btnHotFill || '#8fb45f', size: 28 });
}

/** پیامِ کوتاهِ بالای صحنه. */
class Toast {
  constructor() { this.msg = null; this.t = 0; this.kind = 'info'; }
  say(msg, kind = 'info') { this.msg = msg; this.kind = kind; this.t = 2.6; }
  step(dt) { if (this.t > 0) { this.t -= dt; if (this.t <= 0) this.msg = null; } }
  draw(y = 24, colors = {}) {
    if (!this.msg) return;
    const k = clamp(this.t, 0, 1) * clamp((2.6 - this.t) * 5, 0, 1);
    ctx.save();
    ctx.globalAlpha = k;
    ctx.font = `700 19px "Vazirmatn", Tahoma, sans-serif`;
    const w = ctx.measureText(this.msg).width + 76;
    const fill = this.kind === 'good' ? (colors.good || '#7fa356')
               : this.kind === 'bad' ? (colors.bad || '#c8434f')
               : (colors.info || '#fbf3e2');
    paper(SW/2 - w/2, y, w, 48, fill, 151, 12, .3);
    text(this.msg, SW/2, y + 25,
      { size: 19, color: this.kind === 'info' ? (colors.ink || '#43291b') : '#fff8ec' });
    ctx.restore();
  }
}

/* ───────── آموزشِ پرده‌ای ─────────
   پرده‌هایی که منتظرِ کارِ بچه نیستند با یک ضربه جلو می‌روند. تایمر فقط
   پشتیبان است؛ بچهٔ کلاس سومی باید فرصتِ خواندن داشته باشد، نه اینکه
   متن قبل از تمام شدنِ خواندنش برود.                                    */

/** اگر پردهٔ فعلی خواندنی است، ضربه را می‌خورد و می‌رود پردهٔ بعد. */
function tutTap(tut, tapSteps, lastStep) {
  if (!tut.on || tapSteps.indexOf(tut.step) < 0) return false;
  if (tut.step >= lastStep) tut.on = false;
  else { tut.step++; tut.t = 0; }
  sfx.tap();
  return true;
}

/** نشانهٔ «برای ادامه بزن» — زیرِ کارتِ آموزش. */
function tutMore(cx, y, t, ink = '#3a2a18', bg = 'rgba(255, 250, 238, .94)') {
  ctx.save();
  ctx.globalAlpha = .62 + .38 * Math.sin(t * 3.2);
  ctx.font = '700 15px "Vazirmatn", Tahoma, sans-serif';
  const label = 'برای ادامه، هرجا را بزن';
  const w = ctx.measureText(label).width + 40, h = 32, x = cx - w / 2, r = 16;
  withShadow(10, 4, .3, () => {
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath(); ctx.fill();
  });
  text(label, cx, y + h / 2, { size: 15, color: ink });
  ctx.restore();
}

/** فونت‌ها را می‌آورد و بعد بازی را شروع می‌کند. */
function whenFontsReady(start) {
  if (document.fonts && document.fonts.load) {

/** حلقهٔ فریم با dtِ محدودشده. */
/* ───────── کیفیتِ خودکار ─────────
   اگر دستگاه کُند بود، اوّل درخشش و بعد رنگ‌بندی خاموش می‌شود تا بازی
   روان بماند. روی دستگاهِ قوی همه‌چیز روشن است. */
let QUALITY = 2;
let _fAcc = 0, _fN = 0, _qHold = 0;

function _qualityTick(gap) {
  if (gap <= 0 || gap > 200) return;
  _fAcc += gap; _fN++;
  if (_fN < 45) return;
  const avg = _fAcc / _fN;
  _fAcc = 0; _fN = 0;
  if (_qHold > 0) { _qHold--; return; }
  const before = QUALITY;
  if (avg > 25 && QUALITY > 0) { QUALITY--; _qHold = 3; }
  else if (avg < 18.5 && QUALITY < 2) { QUALITY++; _qHold = 6; }
  /* در پایین‌ترین کیفیت، صحنه را با نقطه‌های کمتر می‌کشیم */
  if (before !== QUALITY && (before === 0 || QUALITY === 0) && _refit) _refit();
}

function runLoop(step) {
  let last = performance.now(), started = false;
  const frame = (now) => {
    const gap = now - last;
    const dt = Math.min(gap / 1000, 1/20);
    last = now;
    _qualityTick(gap);
    step(dt);
    requestAnimationFrame(frame);
  };
  if (!started) { started = true; requestAnimationFrame(frame); }
}

    hint: 'نقشه با پنجم نوشته شده ولی خط‌کش ده‌قسمتی است. پیدایش کن.' },
  { name: 'سفارشِ آزاد', den: 10, planks: 3, endless: true,
    obj: 'نردبان',
    hint: 'سفارش‌ها پشتِ سرِ هم می‌آیند. تا وقتی چوب داری بساز.' },
];

/* ───────── وضعیت ───────── */

const S = {
  phase: 'intro',
  level: 0,
  pieces: [],           // { len, seg, done }
  planksLeft: 0,
  woodLeft: 0,          // چوبِ باقی‌ماندهٔ تختهٔ فعلی (واحد)
  plankLen: 22 * U,
  cut: 0,               // جای اره از سرِ تخته (واحد)
  dragging: false,
  sawT: 0,              // انیمیشنِ برش
  fly: null,            // قطعه‌ای که به نقشه می‌رود
  scrap: 0,
  orders: 0,
  score: 0, best: 0,
  t: 0, phaseT: 0,
  hover: null,
  shake: 0,
  chips: [],
  floats: [],
  tut: { on: true, step: 0, t: 0 },
};

const bits = new Bits();
const toast = new Toast();
const L = () => LEVELS[S.level];
const den = () => L().den;
const gridStep = () => U / den();          // اره روی همین شبکه می‌ایستد
const askDen = () => L().ask || L().den;   // نقشه با چه مخرجی نوشته شده

function loadBest() { try { return +localStorage.getItem('najjari-best') || 0; } catch { return 0; } }
function saveBest(v) { try { localStorage.setItem('najjari-best', String(v)); } catch { /* حالت خصوصی */ } }

/* ───────── چیدمان ───────── */

const HUD_H = 52;
const CMPX = 44;                                   // یک سانتی‌متر چند پیکسل
const BOARD = { x: 96, y: 508, h: 62 };            // تختهٔ چوب
const RULER_Y = 470;                               // خط‌کشِ بالای تخته
const LENS = { x: 58, y: 196, w: 486, h: 198 };
const READ = { x: 566, y: 196, w: 238, h: 198 };
const BP = { x: 830, y: 76, w: 344, h: 386 };      // نقشه
const BTN_MINUS = { x: 372, y: 646, w: 68, h: 66 };
const BTN_CUT   = { x: 456, y: 646, w: 220, h: 66 };
const BTN_PLUS  = { x: 692, y: 646, w: 68, h: 66 };
const BTN_NEW   = { x: 800, y: 652, w: 194, h: 54 };
const BTN_GO = { x: 470, y: 566, w: 260, h: 76 };

const xOfU = (u) => BOARD.x + (u / U) * CMPX;
const uOfX = (x) => ((x - BOARD.x) / CMPX) * U;

/* ───────── حلقه ───────── */

const cv = document.getElementById('stage');
initStage(cv, SCENE_W, SCENE_H);
S.best = loadBest();
whenFontsReady(() => runLoop(step));

const segLen = (s) => Math.round(Math.hypot(s[2] - s[0], s[3] - s[1]));

/** سفارشِ تصادفیِ حالتِ آزاد: نردبانی با اندازه‌های گرد شده روی شبکه. */
function randomOrder() {
  const g = gridStep();
  const rail = Math.round((90 + Math.random() * 70) / g) * g;
  const rung = Math.round((45 + Math.random() * 35) / g) * g;
  return [[0, 0, 0, rail], [rung, 0, rung, rail],
          [0, rail * .24, rung, rail * .24],
          [0, rail * .52, rung, rail * .52],
          [0, rail * .8, rung, rail * .8]];
}

function makePieces(segs) {
  return segs.map((seg) => ({ len: segLen(seg), seg, done: false }));
}

function startLevel(i, keep) {
  const lv = LEVELS[i];
  S.level = i;
  S.pieces = makePieces(lv.endless ? randomOrder() : lv.segs);
  S.planksLeft = lv.planks - 1;
  S.woodLeft = S.plankLen;
  S.cut = 2 * U;
  S.sawT = 0; S.fly = null;
  S.scrap = 0;
  if (!keep) { S.orders = 0; }
  S.chips.length = 0;
  S.phase = 'play'; S.phaseT = 0;
  S.tut.on = i === 0 && !keep; S.tut.step = 0; S.tut.t = 0;
  toast.say(lv.hint, 'info');
}

function floatText(x, y, txt, col, size) { S.floats.push({ x, y, txt, col, t: 0, size: size || 24 }); }

function step(dt) {
  S.t += dt; S.phaseT += dt;
  if (S.shake > 0) S.shake -= dt;
  if (S.sawT > 0) S.sawT = Math.max(0, S.sawT - dt * 2.2);
  if (S.fly) { S.fly.t += dt * 1.6; if (S.fly.t >= 1) S.fly = null; }
  for (const c of S.chips) { c.t += dt; c.vy += 900 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.rot += c.vr * dt; }
  S.chips = S.chips.filter((c) => c.t < 1.4);
  for (const f of S.floats) { f.t += dt; f.y -= 42 * dt; }
  S.floats = S.floats.filter((f) => f.t < 1.5);
  if (S.phase === 'play' && S.tut.on) tutStep(dt);
  bits.step(dt);
  toast.step(dt);
  draw();
}

/* ───────── اره ─────────
   اره فقط روی خط‌های خط‌کش می‌ایستد. همین یک قاعده کلِ درس را می‌سازد:
   هرچه واحد را ریزتر بریده باشیم، اندازه‌های بیشتری در دسترس است.     */

function setCut(u) {
  const g = gridStep();
  const v = clamp(Math.round(u / g) * g, g, S.woodLeft);
  if (v !== S.cut) { S.cut = v; sfx.tick(); }
}

function remaining() { return S.pieces.filter((p) => !p.done); }
function smallestNeeded() {
  const r = remaining();
  return r.length ? Math.min(...r.map((p) => p.len)) : 0;
}

function doCut() {
  if (S.phase !== 'play' || S.fly) return;
  const len = S.cut;
  if (len > S.woodLeft) return;
  S.sawT = 1;
  sfx.tone(220, .22, 'sawtooth', .06);
  chipBurst(xOfU(len), BOARD.y + BOARD.h / 2);

  const hit = S.pieces.find((p) => !p.done && p.len === len);
  S.woodLeft -= len;
  if (hit) {
    hit.done = true;
    S.score += 250;
    S.fly = { t: 0, piece: hit, from: { x: xOfU(len / 2), y: BOARD.y + BOARD.h / 2 } };
    floatText(xOfU(len / 2), BOARD.y - 40, `+${fa(250)}`, P.gold);
    sfx.good();
  } else {
    S.scrap += len;
    S.shake = .34;
    sfx.nope();
    toast.say('این اندازه توی نقشه نبود؛ چوبش هدر رفت', 'bad');
  }
  S.cut = Math.min(S.cut, Math.max(gridStep(), S.woodLeft));

  if (!remaining().length) return finishOrder();
  ensureWood();
}

/** تختهٔ کوتاه‌شده اگر به‌دردِ هیچ قطعه‌ای نخورد، خودش کنار می‌رود. */
function ensureWood() {
  if (S.woodLeft >= smallestNeeded()) return;
  takeNewPlank(true);
}

function takeNewPlank(auto) {
  if (S.planksLeft <= 0) {
    S.phase = 'lost'; S.phaseT = 0;
    sfx.nope();
    return;
  }
  S.planksLeft--;
  S.scrap += S.woodLeft;
  S.woodLeft = S.plankLen;
  S.cut = Math.min(2 * U, S.woodLeft);
  sfx.slide();
  toast.say(auto ? 'تهٔ تخته به کاری نمی‌آمد؛ تختهٔ تازه' : 'تختهٔ تازه روی میز', 'info');
}

function finishOrder() {
  const bonus = 600 + Math.round(S.woodLeft / 2) + S.planksLeft * 150;
  S.score += bonus;
  if (S.score > S.best) { S.best = S.score; saveBest(S.best); }
  S.orders++;
  S.phase = 'won'; S.phaseT = 0;
  sfx.win();
  bits.confetti(BP.x + BP.w / 2, BP.y + BP.h / 2, 70, [P.gold, P.plankLit, P.blue, '#fff']);
}

function chipBurst(x, y) {
  for (let i = 0; i < 14; i++) {
    S.chips.push({ x, y, t: 0, rot: Math.random() * TAU, vr: (Math.random() - .5) * 14,
      vx: (Math.random() - .5) * 220, vy: -60 - Math.random() * 220,
      r: 3 + Math.random() * 5 });
  }
}

/* ───────── آموزش ───────── */

const TUT_TAP = [0, 2], TUT_LAST = 2;      // پرده‌های خواندنی

function tutStep(dt) {
  S.tut.t += dt;
  if (S.tut.step === 0 && S.tut.t > 30) { S.tut.step = 1; S.tut.t = 0; }
  if (S.tut.step === 1 && S.cut !== 2 * U) { S.tut.step = 2; S.tut.t = 0; }
  if (S.tut.step === 2 && S.tut.t > 30) S.tut.on = false;
}

/* ───────── ورودی ───────── */

function boardBand() {
  return { x: BOARD.x - 30, y: RULER_Y - 26, w: S.plankLen / U * CMPX + 60, h: BOARD.h + 132 };
}

function hitTest(p) {
  if (S.phase !== 'play') return inRect(p, BTN_GO) ? BTN_GO : null;
  if (inRect(p, BTN_CUT)) return BTN_CUT;
  if (inRect(p, BTN_NEW)) return BTN_NEW;
  if (inRect(p, BTN_MINUS)) return BTN_MINUS;
  if (inRect(p, BTN_PLUS)) return BTN_PLUS;
  if (inRect(p, boardBand())) return { board: true };
  return null;
}

cv.addEventListener('pointermove', (e) => {
  const p = toStage(e);
  if (S.dragging) { setCut(uOfX(p.x)); return; }
  S.hover = hitTest(p);
  cv.style.cursor = S.hover ? (S.hover.board ? 'ew-resize' : 'pointer') : 'default';
});
cv.addEventListener('pointerup', () => { S.dragging = false; });
cv.addEventListener('pointerleave', () => { S.dragging = false; S.hover = null; });
cv.addEventListener('pointerdown', (e) => {
  if (S.phase === 'play' && tutTap(S.tut, TUT_TAP, TUT_LAST)) return;
  const p = toStage(e);
  const h = hitTest(p);
  if (S.phase === 'intro') { if (h) startLevel(0); return; }
  if (S.phase === 'won') {
    if (!h) return;
    if (L().endless) startLevel(S.level, true);
    else if (S.level + 1 < LEVELS.length) startLevel(S.level + 1, true);
    else { S.score = 0; startLevel(0); }
    return;
  }
  if (S.phase === 'lost') { if (h) { S.score = 0; startLevel(S.level); } return; }
  if (!h) return;
  if (h === BTN_CUT) return doCut();
  if (h === BTN_NEW) return takeNewPlank(false);
  if (h === BTN_MINUS) return setCut(S.cut - gridStep());
  if (h === BTN_PLUS) return setCut(S.cut + gridStep());
  if (h.board) { S.dragging = true; setCut(uOfX(p.x)); }
});

/* ───────── ابزارِ نقاشی ───────── */

function rrPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function numText(str, x, y, o = {}) {
  ctx.save();
  ctx.font = `${o.family === 'Vazirmatn' ? (o.weight || 700) : '400'} ${o.size || 20}px "${o.family || 'Lalezar'}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  ctx.direction = 'ltr';
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.fillStyle = o.color || P.ink;
  ctx.fillText(str, x, y);
  ctx.restore();
}

function spot(rects, alpha) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, SCENE_W, SCENE_H);
  for (const r of rects) rrPath(r.x - 12, r.y - 12, r.w + 24, r.h + 24, 22);
  ctx.fillStyle = `rgba(20, 12, 6, ${alpha})`;
  ctx.fill('evenodd');
  ctx.restore();
}

function pointHand(x, y) {
  const bob = Math.sin(S.t * 3.4) * 8;
  ctx.save();
  ctx.translate(x, y + bob);
  withShadow(12, 5, .4, () => {
    ctx.fillStyle = '#f6dfc0';
    ctx.beginPath();
    ctx.moveTo(0, -6);
    ctx.quadraticCurveTo(-9, -2, -10, 16);
    ctx.quadraticCurveTo(-11, 34, 0, 36);
    ctx.quadraticCurveTo(11, 34, 10, 16);
    ctx.quadraticCurveTo(9, -2, 0, -6);
    ctx.closePath(); ctx.fill();
    wobbleCircle(0, -12, 8, 4, 1); ctx.fill();
  }, '30, 18, 6');
  ctx.strokeStyle = '#c9a982'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-7, 18); ctx.lineTo(7, 18); ctx.stroke();
  ctx.restore();
}

/** طول را به «درست و کسر» می‌شکند، با مخرجِ خواسته‌شده. */
function parts(u, d) {
  const whole = Math.floor(u / U);
  const num = Math.round((u - whole * U) * d / U);
  return { whole, num, den: d };
}

/** عددِ مخلوط را مثل کتاب می‌نویسد: عددِ درست، «و»، بعد کسرِ دوطبقه. */
function drawMixed(cx, y, u, d, size, color) {
  const q = parts(u, d);
  const fw = size * .78;
  ctx.save();
  ctx.font = `400 ${size}px "Lalezar", Tahoma, sans-serif`;
  const wholeW = q.whole > 0 ? ctx.measureText(fa(q.whole)).width : 0;
  ctx.font = `700 ${size * .6}px "Vazirmatn", Tahoma, sans-serif`;
  const andW = (q.whole > 0 && q.num > 0) ? ctx.measureText(' و ').width : 0;
  const total = wholeW + andW + (q.num > 0 ? fw : 0);
  let x = cx + total / 2;                         // از راست به چپ چیده می‌شود
  if (q.whole > 0) {
    numText(fa(q.whole), x - wholeW / 2, y, { size, color });
    x -= wholeW;
  }
  if (q.whole > 0 && q.num > 0) {
    text('و', x - andW / 2, y + size * .06, { size: size * .55, color });
    x -= andW;
  }
  if (q.num > 0) {
    const fx = x - fw / 2;
    numText(fa(q.num), fx, y - size * .34, { size: size * .62, color });
    ctx.strokeStyle = color; ctx.lineWidth = Math.max(2, size * .05); ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(fx - fw * .32, y + size * .04);
    ctx.lineTo(fx + fw * .32, y + size * .04);
    ctx.stroke();
    numText(fa(q.den), fx, y + size * .42, { size: size * .62, color });
  }
  ctx.restore();
  return total;
}

/* ───────── صحنه ───────── */

function draw() {
  beginScene('#2a1d14');
  ctx.save();
  if (S.shake > 0) {
    const k = S.shake * 13;
    ctx.translate(Math.sin(S.t * 58) * k, Math.cos(S.t * 45) * k * .5);
  }

  drawShop();
  drawBench();
  drawBoard();
  drawSaw();
  drawChips();
  ctx.restore();

  drawLens();
  drawRead();
  drawBlueprint();
  drawButtons();
  drawFly();
  bits.draw();
  drawFloats();
  drawHUD();
  if (!(S.phase === 'play' && S.tut.on)) {      // یک پیام در یک لحظه بس است
    ctx.save();
    ctx.translate(430 - SCENE_W / 2, 0);
    toast.draw(HUD_H + 8, { good: P.good, bad: P.bad, info: P.paper, ink: P.ink });
    ctx.restore();
  }

  if (S.phase === 'play' && S.tut.on) drawTutorial();
  if (S.phase === 'intro') drawIntro();
  if (S.phase === 'won') drawWon();
  if (S.phase === 'lost') drawLost();

  endScene(.13, 'rgba(28, 14, 4, .45)');
}

function drawShop() {
  const g = ctx.createLinearGradient(160, 60, 900, 760);
  g.addColorStop(0, P.wallHi);
  g.addColorStop(1, P.wallLo);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, SCENE_W, SCENE_H);

  /* تخته‌های دیوار */
  ctx.save();
  ctx.globalAlpha = .16;
  ctx.strokeStyle = '#2a1b0d'; ctx.lineWidth = 4;
  for (let i = 0; i < 11; i++) {
    const x = i * 116;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, SCENE_H); ctx.stroke();
  }
  ctx.restore();

  /* پنجرهٔ نورگیر */
  const w = { x: 58, y: 66, w: 244, h: 124 };
  ctx.fillStyle = '#4a3520';
  wobbleRect(w.x - 8, w.y - 8, w.w + 16, w.h + 16, 6, 3, 1.2); ctx.fill();
  const sg = ctx.createLinearGradient(w.x, w.y, w.x, w.y + w.h);
  sg.addColorStop(0, '#cfe6f2');
  sg.addColorStop(1, '#f6e6c2');
  ctx.fillStyle = sg;
  ctx.fillRect(w.x, w.y, w.w, w.h);
  ctx.strokeStyle = '#4a3520'; ctx.lineWidth = 7;
  ctx.beginPath();
  ctx.moveTo(w.x + w.w / 2, w.y); ctx.lineTo(w.x + w.w / 2, w.y + w.h);
  ctx.moveTo(w.x, w.y + w.h / 2); ctx.lineTo(w.x + w.w, w.y + w.h / 2);
  ctx.stroke();
  const beam = ctx.createLinearGradient(w.x, w.y, w.x + 520, w.y + 520);
  beam.addColorStop(0, P.sun);
  beam.addColorStop(1, 'rgba(255, 224, 160, 0)');
  ctx.fillStyle = beam;
  ctx.beginPath();
  ctx.moveTo(w.x, w.y + w.h);
  ctx.lineTo(w.x + w.w, w.y);
  ctx.lineTo(w.x + w.w + 460, w.y + 460);
  ctx.lineTo(w.x + 300, w.y + w.h + 460);
  ctx.closePath(); ctx.fill();

  /* ابزارهای آویزان */
  const px = 636;
  ctx.fillStyle = '#4a3520';
  wobbleRect(px, 72, 176, 12, 4, 9, 1); ctx.fill();
  /* چکش */
  ctx.strokeStyle = '#8a5a32'; ctx.lineWidth = 8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(px + 32, 92); ctx.lineTo(px + 32, 150); ctx.stroke();
  ctx.fillStyle = P.steelDk;
  wobbleRect(px + 16, 84, 34, 18, 4, 11, .8); ctx.fill();
  /* گونیا */
  ctx.strokeStyle = P.steel; ctx.lineWidth = 9;
  ctx.beginPath(); ctx.moveTo(px + 92, 88); ctx.lineTo(px + 92, 152); ctx.lineTo(px + 140, 152); ctx.stroke();
  /* اره‌ی آویز */
  ctx.fillStyle = P.steel;
  ctx.beginPath();
  ctx.moveTo(px + 150, 88); ctx.lineTo(px + 172, 88); ctx.lineTo(px + 168, 156);
  ctx.lineTo(px + 152, 150); ctx.closePath(); ctx.fill();
}

function drawBench() {
  ctx.fillStyle = P.benchDk;
  wobbleRect(40, 570, SCENE_W - 80, 26, 5, 21, 1.4); ctx.fill();
  ctx.fillStyle = P.bench;
  wobbleRect(40, 560, SCENE_W - 80, 18, 5, 23, 1.2); ctx.fill();
  ctx.fillStyle = P.benchLit;
  wobbleRect(40, 558, SCENE_W - 80, 6, 3, 25, .8); ctx.fill();
  for (const x of [130, SCENE_W - 190]) {
    ctx.fillStyle = P.benchDk;
    wobbleRect(x, 596, 44, 164, 4, x, 1.2); ctx.fill();
    ctx.fillStyle = P.bench;
    wobbleRect(x, 596, 16, 164, 4, x + 2, 1); ctx.fill();
  }
  ctx.fillStyle = 'rgba(24, 12, 4, .35)';
  ctx.fillRect(0, 616, SCENE_W, SCENE_H - 616);
}

/* ───────── تخته و خط‌کش ───────── */

function drawBoard() {
  const wPx = (S.woodLeft / U) * CMPX;
  const cutPx = xOfU(S.cut);

  /* سایه روی میز */
  ctx.save();
  ctx.globalAlpha = .3;
  ctx.fillStyle = '#1d1006';
  wobbleRect(BOARD.x + 6, BOARD.y + BOARD.h - 4, wPx, 16, 4, 31, 1.4); ctx.fill();
  ctx.restore();

  /* بدنهٔ تخته */
  ctx.fillStyle = P.plank;
  wobbleRect(BOARD.x, BOARD.y, wPx, BOARD.h, 4, 33, 1.2); ctx.fill();
  ctx.fillStyle = P.plankLit;
  wobbleRect(BOARD.x, BOARD.y, wPx, 9, 3, 35, .8); ctx.fill();
  ctx.fillStyle = P.plankDk;
  wobbleRect(BOARD.x, BOARD.y + BOARD.h - 10, wPx, 10, 3, 37, .8); ctx.fill();
  /* رگهٔ چوب */
  ctx.save();
  ctx.beginPath(); ctx.rect(BOARD.x, BOARD.y, wPx, BOARD.h); ctx.clip();
  ctx.strokeStyle = P.grain; ctx.lineWidth = 2;
  for (let i = 0; i < 7; i++) {
    const y = BOARD.y + 8 + i * 8;
    ctx.beginPath();
    ctx.moveTo(BOARD.x, y);
    for (let x = 0; x < wPx; x += 30) ctx.lineTo(BOARD.x + x, y + Math.sin(x * .04 + i) * 2.2);
    ctx.stroke();
  }
  ctx.restore();
  /* سرِ بریده‌شدهٔ تخته */
  ctx.fillStyle = P.plankDk;
  wobbleRect(BOARD.x + wPx - 5, BOARD.y, 6, BOARD.h, 2, 39, .8); ctx.fill();

  /* قطعه‌ای که قرار است جدا شود */
  ctx.save();
  ctx.globalAlpha = .34 + .1 * Math.sin(S.t * 3);
  ctx.fillStyle = '#fff3cf';
  wobbleRect(BOARD.x, BOARD.y, cutPx - BOARD.x, BOARD.h, 4, 41, 1); ctx.fill();
  ctx.restore();

  drawRuler(wPx);
}

function drawRuler(wPx) {
  const g = gridStep(), d = den();
  ctx.fillStyle = P.ruler;
  wobbleRect(BOARD.x - 10, RULER_Y, wPx + 20, 34, 4, 43, 1); ctx.fill();
  ctx.fillStyle = P.rulerDk;
  wobbleRect(BOARD.x - 10, RULER_Y + 30, wPx + 20, 6, 3, 45, .8); ctx.fill();

  const cm = Math.floor(S.woodLeft / U);
  ctx.strokeStyle = P.ink; ctx.lineCap = 'butt';
  for (let u = 0; u <= S.woodLeft + .01; u += g) {
    const x = xOfU(u);
    const isCm = Math.abs(u % U) < .001;
    const isHalf = d >= 4 && Math.abs((u % U) - U / 2) < .001;
    const h = isCm ? 22 : (isHalf ? 14 : 9);
    ctx.lineWidth = isCm ? 2.6 : 1.6;
    ctx.beginPath();
    ctx.moveTo(x, RULER_Y + 30); ctx.lineTo(x, RULER_Y + 30 - h); ctx.stroke();
  }
  for (let c = 0; c <= cm; c++) {
    if (cm > 14 && c % 2 === 1) continue;
    numText(fa(c), xOfU(c * U), RULER_Y + 9, { size: 15, color: P.ink });
  }
}

function drawSaw() {
  const x = xOfU(S.cut);
  const shake = S.sawT > 0 ? Math.sin(S.t * 60) * 5 * S.sawT : 0;
  ctx.save();
  ctx.translate(x + shake, 0);
  ctx.strokeStyle = 'rgba(200, 60, 40, .75)'; ctx.lineWidth = 2.4;
  ctx.setLineDash([7, 6]);
  ctx.beginPath(); ctx.moveTo(0, RULER_Y + 36); ctx.lineTo(0, BOARD.y + BOARD.h + 10); ctx.stroke();
  ctx.setLineDash([]);
  /* تیغهٔ اره */
  const by = BOARD.y - 74;
  ctx.fillStyle = P.steel;
  ctx.beginPath();
  ctx.moveTo(-9, by); ctx.lineTo(9, by); ctx.lineTo(6, by + 92); ctx.lineTo(-6, by + 92);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = P.steelDk;
  for (let i = 0; i < 9; i++) {
    ctx.beginPath();
    ctx.moveTo(-6, by + 92 - i * 9);
    ctx.lineTo(-1, by + 88 - i * 9);
    ctx.lineTo(-6, by + 84 - i * 9);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = P.bench;
  wobbleRect(-22, by - 34, 44, 36, 8, 51, 1); ctx.fill();
  ctx.fillStyle = P.benchDk;
  wobbleRect(-14, by - 26, 28, 20, 6, 53, .8); ctx.fill();
  ctx.restore();
}

function drawChips() {
  for (const c of S.chips) {
    const k = clamp(1 - c.t / 1.4, 0, 1);
    ctx.save();
    ctx.globalAlpha = k;
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    ctx.fillStyle = P.plankLit;
    ctx.fillRect(-c.r, -c.r * .4, c.r * 2, c.r * .8);
    ctx.restore();
  }
}

/* ───────── ذرّه‌بین ─────────
   کارِ اصلی‌اش این نیست که کمک کند؛ این است که نشان دهد بینِ دو عددِ درست
   چه خبر است. همان ذرّه‌بینِ مورچه‌ی کتاب.                             */

function drawLens() {
  const b = LENS, g = gridStep(), d = den();
  const R = Math.max(U * 1.1, 4 * g);          // نصفِ پهنای دیدِ ذرّه‌بین
  const px = b.w / (2 * R);                    // پیکسل به ازای هر واحد

  withShadow(20, 9, .38, () => {
    ctx.fillStyle = P.paper;
    wobbleRect(b.x, b.y, b.w, b.h, 14, 61, 2); ctx.fill();
  }, '30, 18, 6');
  ctx.fillStyle = P.brass;
  wobbleRect(b.x, b.y, b.w, 10, 4, 63, .8); ctx.fill();
  text('ذرّه‌بینِ نجّار', b.x + b.w / 2, b.y + 32, { size: 19, family: 'Lalezar', color: P.inkSoft });

  const iy = b.y + 52, ih = b.h - 70;
  ctx.save();
  ctx.beginPath(); rrPath(b.x + 12, iy, b.w - 24, ih, 10); ctx.clip();
  ctx.fillStyle = '#efe2c4';
  ctx.fillRect(b.x + 12, iy, b.w - 24, ih);

  const cx = b.x + b.w / 2;
  const X = (u) => cx + (u - S.cut) * px;
  /* تکّهٔ چوب زیرِ خط‌کش */
  ctx.fillStyle = P.plank;
  ctx.fillRect(b.x + 12, iy + ih - 46, b.w - 24, 40);
  ctx.fillStyle = '#fff3cf';
  ctx.globalAlpha = .5;
  ctx.fillRect(b.x + 12, iy + ih - 46, Math.max(0, X(S.cut) - b.x - 12), 40);
  ctx.globalAlpha = 1;

  /* خط‌های خط‌کش، بزرگ‌شده */
  const lo = Math.floor((S.cut - R) / g) * g, hi = S.cut + R + g;
  ctx.strokeStyle = P.ink; ctx.lineCap = 'butt';
  for (let u = lo; u <= hi; u += g) {
    if (u < 0 || u > S.woodLeft + .01) continue;
    const x = X(u);
    const isCm = Math.abs(u % U) < .001;
    const isHalf = d >= 4 && Math.abs((u % U) - U / 2) < .001;
    const h = isCm ? 42 : (isHalf ? 28 : 18);
    ctx.lineWidth = isCm ? 4 : 2.4;
    ctx.beginPath();
    ctx.moveTo(x, iy + ih - 52); ctx.lineTo(x, iy + ih - 52 - h); ctx.stroke();
    if (isCm) numText(fa(Math.round(u / U)), x, iy + ih - 108, { size: 22, color: P.ink });
  }
  /* شمارهٔ قسمت‌ها بینِ دو عددِ درست */
  ctx.globalAlpha = .8;
  for (let u = lo; u <= hi; u += g) {
    if (u < 0 || u > S.woodLeft + .01) continue;
    const r = Math.round((u % U) * d / U);
    if (r === 0 || r === d) continue;
    numText(fa(r), X(u), iy + ih - 78, { size: 14, color: P.inkSoft });
  }
  ctx.globalAlpha = 1;

  /* تیغهٔ اره وسطِ ذرّه‌بین */
  ctx.strokeStyle = '#c8433a'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(cx, iy + 4); ctx.lineTo(cx, iy + ih - 4); ctx.stroke();
  ctx.fillStyle = '#c8433a';
  ctx.beginPath();
  ctx.moveTo(cx, iy + 14); ctx.lineTo(cx - 8, iy + 2); ctx.lineTo(cx + 8, iy + 2);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  ctx.strokeStyle = P.brassDk; ctx.lineWidth = 4;
  ctx.beginPath(); rrPath(b.x + 12, iy, b.w - 24, ih, 10); ctx.stroke();
}

function drawRead() {
  const b = READ;
  withShadow(20, 9, .38, () => {
    ctx.fillStyle = P.paper;
    wobbleRect(b.x, b.y, b.w, b.h, 14, 71, 2); ctx.fill();
  }, '30, 18, 6');
  ctx.fillStyle = P.brass;
  wobbleRect(b.x, b.y, b.w, 10, 4, 73, .8); ctx.fill();
  text('اندازهٔ اره', b.x + b.w / 2, b.y + 32, { size: 19, family: 'Lalezar', color: P.inkSoft });
  drawMixed(b.x + b.w / 2, b.y + 96, S.cut, den(), 46, P.ink);
  text('سانتی‌متر', b.x + b.w / 2, b.y + 146, { size: 16, color: P.inkSoft });
  if (den() === 10) {
    const q = parts(S.cut, 10);
    text(`${fa(q.whole)} سانتی‌متر و ${fa(q.num)} میلی‌متر`, b.x + b.w / 2, b.y + 172,
      { size: 14, color: 'rgba(125, 107, 78, .85)' });
  }
}

/* ───────── نقشه ───────── */

function drawBlueprint() {
  const b = BP;
  withShadow(22, 10, .4, () => {
    ctx.fillStyle = P.blue;
    wobbleRect(b.x, b.y, b.w, b.h, 12, 81, 2); ctx.fill();
  }, '30, 18, 6');
  ctx.fillStyle = '#4b81b2';
  wobbleRect(b.x + 8, b.y + 8, b.w - 16, b.h - 16, 8, 83, 1.4); ctx.fill();
  ctx.save();
  ctx.globalAlpha = .12;
  ctx.strokeStyle = '#eaf3fa'; ctx.lineWidth = 1;
  for (let x = b.x + 16; x < b.x + b.w - 8; x += 18) {
    ctx.beginPath(); ctx.moveTo(x, b.y + 16); ctx.lineTo(x, b.y + b.h - 16); ctx.stroke();
  }
  for (let y = b.y + 16; y < b.y + b.h - 8; y += 18) {
    ctx.beginPath(); ctx.moveTo(b.x + 16, y); ctx.lineTo(b.x + b.w - 16, y); ctx.stroke();
  }
  ctx.restore();
  text('نقشه', b.x + b.w / 2, b.y + 36, { size: 24, family: 'Lalezar', color: '#eaf3fa' });
  text(L().obj, b.x + b.w / 2, b.y + 62, { size: 15, color: 'rgba(234, 243, 250, .74)' });

  /* شکل، اندازه‌شده تا در قاب جا شود */
  const area = { x: b.x + 26, y: b.y + 80, w: b.w - 52, h: 176 };
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of S.pieces) {
    x0 = Math.min(x0, p.seg[0], p.seg[2]); x1 = Math.max(x1, p.seg[0], p.seg[2]);
    y0 = Math.min(y0, p.seg[1], p.seg[3]); y1 = Math.max(y1, p.seg[1], p.seg[3]);
  }
  const sc = Math.min(area.w / Math.max(1, x1 - x0), area.h / Math.max(1, y1 - y0)) * .9;
  const ox = area.x + area.w / 2 - (x0 + x1) / 2 * sc;
  const oy = area.y + area.h / 2 - (y0 + y1) / 2 * sc;
  const T = (px, py) => [ox + px * sc, oy + py * sc];

  for (const p of S.pieces) {
    const [ax, ay] = T(p.seg[0], p.seg[1]);
    const [bx2, by2] = T(p.seg[2], p.seg[3]);
    if (p.done) {
      ctx.strokeStyle = P.plank; ctx.lineWidth = 9; ctx.lineCap = 'round';
      ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx2, by2); ctx.stroke();
      ctx.strokeStyle = P.plankLit; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx2, by2); ctx.stroke();
    } else {
      ctx.strokeStyle = 'rgba(234, 243, 250, .55)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.setLineDash([9, 8]);
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx2, by2); ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  /* فهرستِ اندازه‌ها، گروه‌شده */
  const groups = [];
  for (const p of S.pieces) {
    let g = groups.find((q) => q.len === p.len);
    if (!g) { g = { len: p.len, total: 0, done: 0 }; groups.push(g); }
    g.total++; if (p.done) g.done++;
  }
  groups.sort((a, b2) => b2.len - a.len);
  const ly = b.y + 276;
  for (let i = 0; i < groups.length; i++) {
    const g = groups[i];
    const y = ly + i * 34;
    if (y > b.y + b.h - 22) break;
    ctx.save();
    ctx.globalAlpha = g.done === g.total ? .5 : 1;
    drawMixed(b.x + b.w - 78, y, g.len, askDen(), 24, '#f4fbff');
    for (let k = 0; k < g.total; k++) {
      const cx2 = b.x + 42 + k * 22;
      ctx.fillStyle = k < g.done ? P.good : 'rgba(234, 243, 250, .22)';
      ctx.beginPath(); rrPath(cx2 - 8, y - 8, 16, 16, 4); ctx.fill();
      if (k < g.done) {
        ctx.strokeStyle = '#eafce2'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(cx2 - 4, y); ctx.lineTo(cx2 - 1, y + 4); ctx.lineTo(cx2 + 4, y - 4);
        ctx.stroke();
      }
    }
    ctx.restore();
  }
}

function drawFly() {
  if (!S.fly) return;
  const k = easeOut(S.fly.t);
  const x = lerp(S.fly.from.x, BP.x + BP.w / 2, k);
  const y = lerp(S.fly.from.y, BP.y + 160, k) - Math.sin(k * Math.PI) * 130;
  const w = lerp((S.fly.piece.len / U) * CMPX, 40, k);
  ctx.save();
  ctx.globalAlpha = 1 - k * .3;
  ctx.translate(x, y);
  ctx.rotate(k * 1.6);
  ctx.fillStyle = P.plank;
  wobbleRect(-w / 2, -9, w, 18, 3, 91, 1); ctx.fill();
  ctx.fillStyle = P.plankLit;
  wobbleRect(-w / 2, -9, w, 5, 2, 93, .7); ctx.fill();
  ctx.restore();
}

function drawFloats() {
  for (const f of S.floats) {
    const k = clamp(1 - f.t / 1.5, 0, 1);
    numText(f.txt, f.x, f.y, { size: f.size, color: f.col, alpha: k });
  }
}

function drawButtons() {
  const dis = S.phase !== 'play';
  roundButton({ x: BTN_MINUS.x + 34, y: BTN_MINUS.y + 33, r: 33 }, '−',
    { hot: S.hover === BTN_MINUS, fill: P.brassDk, hotFill: P.brass, size: 36, disabled: dis });
  roundButton({ x: BTN_PLUS.x + 34, y: BTN_PLUS.y + 33, r: 33 }, '+',
    { hot: S.hover === BTN_PLUS, fill: P.brassDk, hotFill: P.brass, size: 36, disabled: dis });
  button(BTN_CUT, 'ببُر', { hot: S.hover === BTN_CUT, fill: '#8a5a32', hotFill: '#a97442', size: 30 });
  button(BTN_NEW, `تختهٔ تازه (${fa(S.planksLeft)})`, {
    hot: S.hover === BTN_NEW, disabled: S.planksLeft <= 0,
    fill: '#5c6b74', hotFill: '#6d7e88', size: 17, r: 12, family: 'Vazirmatn',
  });
}

function drawHUD() {
  ctx.fillStyle = 'rgba(28, 18, 10, .76)';
  ctx.fillRect(0, 0, SCENE_W, HUD_H);
  ctx.fillStyle = 'rgba(217, 168, 64, .45)';
  ctx.fillRect(0, HUD_H - 3, SCENE_W, 3);
  text(L().name, SCENE_W - 26, HUD_H / 2, { size: 20, family: 'Lalezar', color: '#f4e5c6', align: 'right' });
  numText(fa(S.score), 26, HUD_H / 2 - 1, { size: 26, color: P.gold, align: 'left' });
  text(`رکورد ${fa(S.best)}`, 108, HUD_H / 2, { size: 14, color: 'rgba(244, 229, 198, .58)', align: 'left' });
  if (S.scrap > 0) {
    const q = parts(S.scrap, 10);
    text(`چوبِ هدررفته: ${fa(q.whole)}٫${fa(q.num)} سانتی‌متر`, 220, HUD_H / 2,
      { size: 14, color: '#e8a08c', align: 'left' });
  }
  const doneN = S.pieces.filter((p) => p.done).length;
  text(`${fa(doneN)} از ${fa(S.pieces.length)} قطعه`, SCENE_W / 2, HUD_H / 2,
    { size: 16, color: 'rgba(244, 229, 198, .8)' });
}

/* ───────── آموزش ───────── */

function drawTutorial() {
  const st = S.tut.step;
  let holes = [], msg = '', hand = null;

  if (st === 0) {
    holes = [{ x: BP.x - 6, y: BP.y - 6, w: BP.w + 12, h: BP.h + 12 }];
    msg = 'نقشه می‌گوید چه قطعه‌هایی و با چه اندازه‌هایی لازم است.';
  } else if (st === 1) {
    holes = [{ x: BOARD.x - 40, y: RULER_Y - 110, w: (S.plankLen / U) * CMPX + 80, h: 230 }];
    msg = 'اره را روی تخته بکش. فقط روی خط‌های خط‌کش می‌ایستد.';
    hand = { x: xOfU(6 * U), y: BOARD.y + BOARD.h + 22 };
  } else {
    holes = [{ x: LENS.x - 6, y: LENS.y - 6, w: LENS.w + 12, h: LENS.h + 12 },
             { x: READ.x - 6, y: READ.y - 6, w: READ.w + 12, h: READ.h + 12 }];
    msg = 'ذرّه‌بین نشان می‌دهد بینِ دو عددِ درست کجایی. وقتی جور شد، ببُر.';
  }

  spot(holes, .58);
  const w = 500, h = 92, x = 240, y = 636;
  paper(x, y, w, h, P.paper, 41, 14, .45);
  ctx.fillStyle = P.brass;
  wobbleRect(x, y, 9, h, 4, 43, .8); ctx.fill();
  textWrap(msg, x + w / 2 + 6, y + h / 2 - 12, w - 54, { size: 18, color: P.ink, lineHeight: 27 });
  if (TUT_TAP.indexOf(st) >= 0) tutMore(x + w / 2, y - 46, S.t, P.ink);
  if (hand) pointHand(hand.x, hand.y);
}

/* ───────── پرده‌ها ───────── */

function sawIcon(x, y) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(-.35);
  ctx.fillStyle = P.steel;
  ctx.beginPath();
  ctx.moveTo(-52, -10); ctx.lineTo(34, -12); ctx.lineTo(30, 6); ctx.lineTo(-52, 6);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = P.steelDk;
  for (let i = 0; i < 10; i++) {
    ctx.beginPath();
    ctx.moveTo(-50 + i * 8, 6); ctx.lineTo(-46 + i * 8, 13); ctx.lineTo(-42 + i * 8, 6);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = P.bench;
  wobbleRect(30, -20, 34, 30, 8, 3, 1); ctx.fill();
  ctx.restore();
}

  overlay({

}

}

}
