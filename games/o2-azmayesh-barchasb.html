<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a2630">
<title>آزمایشگاهِ برچسبِ خوراکی — خوراکی‌ها (آزمایش)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>
  /* صفحه نباید هیچ‌جا اسکرول یا زوم شود؛ بازی باید مثل یک برنامه رفتار کند. */
  html, body {
    margin: 0; padding: 0; background: #1a2630;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body {
    position: fixed; inset: 0;          /* جلوی کشیده‌شدنِ صفحه در سافاریِ گوشی */
    width: 100%; height: 100vh; height: 100dvh;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none; -webkit-touch-callout: none;
  }

  /* گوشیِ عمودی صحنه را ریز می‌کند؛ بچه باید گوشی را بچرخاند. */
  #rotate { display: none; }
  @media (orientation: portrait) and (max-width: 860px) {
    #stage { display: none; }
    #rotate {
      display: flex; position: fixed; inset: 0;
      z-index: 9;
      flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      background: #1a2630; color: #f6ead2;
      font: 700 20px "Vazirmatn", Tahoma, sans-serif; text-align: center; padding: 32px;
    }
    #rotate svg { animation: tilt 2.4s ease-in-out infinite; }
    @keyframes tilt { 0%, 45% { transform: rotate(0deg); } 65%, 100% { transform: rotate(-90deg); } }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="rotate">
  <svg width="86" height="126" viewBox="0 0 86 126" fill="none" aria-hidden="true">
    <rect x="3" y="3" width="80" height="120" rx="12" stroke="#e8b448" stroke-width="5"/>
    <rect x="15" y="19" width="56" height="88" rx="5" fill="#e8b448" opacity=".28"/>
    <circle cx="43" cy="115" r="4" fill="#e8b448"/>
  </svg>
  <div>گوشی را بچرخان</div>
  <div style="font-weight:400;opacity:.7;font-size:16px">این بازی خوابیده بازی می‌شود</div>
</div>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   هستهٔ مشترکِ بازی‌ها — سبک «کاغذبُری»
   ───────────────────────────────────────────────────────────────────────
   این فایل جعبه‌ابزار است، نه چارچوب: هر بازی حلقه و وضعیت خودش را دارد
   و فقط از این توابع برای کشیدن استفاده می‌کند. دلیلش این است که هر بازی
   باید حس‌وحال خودش را داشته باشد، نه اینکه همه شبیه هم دربیایند.

   قاعده‌های ثابتِ تصویری:
   • نور همیشه از بالا-چپ می‌تابد، پس سایه‌ها به پایین-راست می‌افتند.
   • هیچ لبه‌ای کاملاً صاف نیست؛ همه کمی موج دارند (انگار با قیچی بریده).
   • هیچ خاکستریِ خالصی نداریم؛ همه‌ی خنثی‌ها به گرمیِ صحنه می‌زنند.
   • یک لایه‌ی دانه‌دانه‌ی کاغذ روی کلِ تصویر ضرب می‌شود.
   ═══════════════════════════════════════════════════════════════════════ */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const FA_D = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
const fa = (n) => String(n).replace(/\d/g, (d) => FA_D[+d]);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeIn = (t) => t * t * t;
const easeInOut = (t) => (t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2);
const easeBack = (t) => 1 + 2.7 * Math.pow(t-1, 3) + 1.7 * Math.pow(t-1, 2);
const easeElastic = (t) => t === 0 || t === 1 ? t : Math.pow(2, -9*t) * Math.sin((t*10 - .75) * 2.094) + 1;

/** تصادفِ تکرارپذیر: با یک بذر همیشه همان عدد. برای اینکه تزئین‌ها هر فریم نپرند. */
function noise1(x) {
  const s = Math.sin(x * 127.1) * 43758.5453;
  return s - Math.floor(s);
}
const pick = (arr, seed) => arr[Math.floor(noise1(seed) * arr.length) % arr.length];

/* ───────── بوم و صحنهٔ ثابت ───────── */

let ctx, SW, SH, CV, _refit = null;
let view = { scale: 1, ox: 0, oy: 0, w: 0, h: 0, dpr: 1 };
let _grain = null, _grainDark = null;

function initStage(canvas, w, h) {
  CV = canvas; SW = w; SH = h;
  ctx = canvas.getContext('2d');

  /* اندازه را از خودِ بوم می‌گیریم نه از innerHeight؛ چون در سافاریِ گوشی
     نوارِ آدرس باز و بسته می‌شود و innerHeight دروغ می‌گوید. */
  const fit = () => {
    const r = canvas.getBoundingClientRect();
    const vw = Math.round(r.width), vh = Math.round(r.height);
    if (vw < 20 || vh < 20) return;
    const dpr = Math.min(devicePixelRatio || 1, QUALITY > 0 ? 2 : 1);
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    const scale = Math.min(vw / SW, vh / SH);
    view = { scale, ox: (vw - SW*scale)/2, oy: (vh - SH*scale)/2, w: vw, h: vh, dpr };
    _grain = buildGrain();
  };
  _refit = fit;
  addEventListener('resize', fit);
  /* چرخاندنِ گوشی: اندازهٔ درست چند لحظه بعد می‌رسد، پس چندبار اندازه می‌گیریم. */
  addEventListener('orientationchange', () => {
    fit(); setTimeout(fit, 140); setTimeout(fit, 460);
  });
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(canvas);

  /* صدا در گوشی فقط بعد از اوّلین لمس اجازهٔ پخش دارد. */
  const unlock = () => { sfx._c(); removeEventListener('pointerdown', unlock); removeEventListener('touchstart', unlock); };
  addEventListener('pointerdown', unlock, { passive: true });
  addEventListener('touchstart', unlock, { passive: true });
  /* نگه‌داشتنِ انگشت نباید منوی مرورگر را باز کند. */
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  fit();
  return ctx;
}

/** قابِ صحنه را باز می‌کند: بعد از این، مختصات همیشه در فضای SW×SH است. */
function beginScene(bg) {
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, view.w, view.h);
  ctx.save();
  ctx.translate(view.ox, view.oy);
  ctx.scale(view.scale, view.scale);
  ctx.beginPath();
  ctx.rect(0, 0, SW, SH);
  ctx.clip();
}

/* ───────── پوششِ پایانِ قاب ─────────
   دانه‌های کاغذ و تیرگیِ گوشه‌ها هر دو ثابت‌اند و تغییر نمی‌کنند، ولی
   قبلاً هر فریم از نو کشیده می‌شدند: یکی با «multiply» روی کلِّ صفحه و
   یکی با یک گرادیانِ شعاعیِ تازه. اندازه‌گیری نشان داد همین دو تا
   ۱۱ تا ۱۶ میلی‌ثانیه از هر فریم را می‌خوردند — بیشتر از کشیدنِ خودِ
   صحنه. حالا یک بار در یک بومِ جدا پخته می‌شوند و هر فریم فقط یک
   drawImage است.                                                       */

let _ovl = null, _ovlKey = '';

function overlayLayer(grainAlpha, vignette) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const w = Math.max(2, Math.round(SW * q)), h = Math.max(2, Math.round(SH * q));
  const key = w + 'x' + h + '|' + grainAlpha + '|' + vignette;
  if (_ovl && _ovlKey === key) return _ovl;
  let c;
  try {
    c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g2 = c.getContext('2d');
    if (!g2) return null;
    if (_grainDark && grainAlpha > 0) {
      /* همان دانه‌ها، ولی به‌جای multiply به شکلِ سیاهِ کم‌رنگ */
      g2.globalAlpha = clamp(grainAlpha * 1.15, 0, 1);
      g2.fillStyle = g2.createPattern(_grainDark, 'repeat');
      g2.fillRect(0, 0, w, h);
      g2.globalAlpha = 1;
    }
    if (vignette) {
      const g = g2.createRadialGradient(w / 2, h / 2, h * .42, w / 2, h / 2, h * 1.05);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, vignette);
      g2.fillStyle = g;
      g2.fillRect(0, 0, w, h);
    }
  } catch (e) { return null; }
  _ovl = c; _ovlKey = key;
  return c;
}

/** بافتِ کاغذ، تیرگیِ گوشه‌ها، رنگ‌بندی و درخششِ نور را می‌گذارد و قاب را می‌بندد. */
function endScene(grainAlpha = .15, vignette = 'rgba(48,28,14,.30)', bloom = .34, grade = .14) {
  /* درخششِ نور خاموش است. اندازه‌گیری نشان داد هر فریم ۲۱ میلی‌ثانیه
     می‌گیرد — بیشتر از تمامِ کارهای دیگرِ یک فریم روی هم — چون برای
     ساختنش باید کلِّ بوم دوباره خوانده شود. از آن بدتر: متنِ فارسی را
     مه‌آلود می‌کرد و خواندنش را سخت‌تر. بی‌آن، صحنه تمیزتر است. */
  bloom = 0;
  if (QUALITY < 1) { grade = 0; grainAlpha *= .5; }
  if (QUALITY < 2) grade = 0;
  if (grade > 0) {
    /* رنگ‌بندیِ نرم: بالای صحنه گرم‌تر، پایین سردتر — عمق می‌دهد */
    const g = ctx.createLinearGradient(0, 0, 0, SH);
    g.addColorStop(0, `rgba(255, 214, 150, ${grade})`);
    g.addColorStop(.55, 'rgba(255, 255, 255, 0)');
    g.addColorStop(1, `rgba(40, 60, 110, ${grade * .9})`);
    ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalCompositeOperation = 'source-over';
  }
  const ov = (grainAlpha > 0 || vignette) ? overlayLayer(grainAlpha, vignette) : null;
  if (ov) ctx.drawImage(ov, 0, 0, SW, SH);
  ctx.restore();
  bloomPass(bloom);
}

/* ───────── درخششِ نور (bloom) ─────────
   قابِ رسم‌شده را کوچک می‌کنیم، دو بار در خودش ضرب می‌کنیم تا فقط
   روشن‌ها بمانند، محوش می‌کنیم و با حالتِ «lighter» رویش می‌گذاریم.
   نتیجه: چراغ‌ها، شعله‌ها و رنگ‌های روشن نور پخش می‌کنند. */
let _bl, _blc, _bl2, _bl2c, _blNo = false, _blTick = 0;

function bloomPass(amount) {
  if (!amount || _blNo || !CV.width) return;
  /* کوچک‌کردن و بزرگ‌کردنِ دوباره، خودش محو می‌کند — از filter خیلی ارزان‌تر است */
  const W = Math.max(4, Math.round(CV.width * .2)), H = Math.max(4, Math.round(CV.height * .2));
  const W2 = Math.max(2, Math.round(W * .28)), H2 = Math.max(2, Math.round(H * .28));
  try {
    if (!_bl) {
      _bl = document.createElement('canvas'); _blc = _bl.getContext('2d');
      _bl2 = document.createElement('canvas'); _bl2c = _bl2.getContext('2d');
      if (!_blc || !_bl2c) { _blNo = true; return; }
    }
    if (_bl.width !== W || _bl.height !== H) { _bl.width = W; _bl.height = H; }
    if (_bl2.width !== W2 || _bl2.height !== H2) { _bl2.width = W2; _bl2.height = H2; }
    /* ساختنِ نور یک قاب در میان کافی است؛ گذاشتنش هر قاب. */
    _blTick = (_blTick + 1) & 1;
    if (!_blTick) {
      _blc.globalCompositeOperation = 'source-over';
      _blc.clearRect(0, 0, W, H);
      _blc.drawImage(CV, 0, 0, W, H);
      _blc.globalCompositeOperation = 'multiply';
      _blc.drawImage(_bl, 0, 0);
      _blc.drawImage(_bl, 0, 0);
      _blc.globalCompositeOperation = 'source-over';
      _bl2c.clearRect(0, 0, W2, H2);
      _bl2c.drawImage(_bl, 0, 0, W2, H2);
    }

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = amount;
    ctx.drawImage(_bl2, 0, 0, CV.width, CV.height);
    ctx.restore();
  } catch (e) { _blNo = true; }
}

/* ───────── لایهٔ ثابت ─────────
   هرچه در صحنه تکان نمی‌خورد را یک‌بار می‌کشیم و بعد فقط کپی می‌کنیم. */
const _layers = {};
function staticLayer(key, w, h, paint) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const L = _layers[key];
  if (L && L.q === q && L.w === w && L.h === h) return L.cv;
  const off = document.createElement('canvas');
  off.width = Math.max(1, Math.round(w * q));
  off.height = Math.max(1, Math.round(h * q));
  const c = off.getContext('2d');
  c.setTransform(q, 0, 0, q, 0, 0);
  const prev = ctx;
  ctx = c;
  try { paint(); } finally { ctx = prev; }
  _layers[key] = { cv: off, q, w, h };
  return off;
}

/* ───────── نورپردازی و بافت ─────────
   کارِ این‌ها این است که هیچ سطحی «تختِ یک‌رنگ» نماند. */

/** شیبِ عمودی: بالا روشن، پایین تیره. */
function vgrad(y0, y1, top, bot) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, top); g.addColorStop(1, bot);
  return g;
}

/** حجمِ کروی: نور از بالا-چپ، سایه در پایین-راست. */
function ball(cx, cy, r, lit, base, dark) {
  const g = ctx.createRadialGradient(cx - r * .38, cy - r * .42, r * .06, cx, cy, r * 1.06);
  g.addColorStop(0, lit); g.addColorStop(.45, base); g.addColorStop(1, dark);
  return g;
}

/** لبهٔ روشنِ بالا-چپِ یک مسیر — همان «rim light». */
function rim(pathFn, col, w = 2.2) {
  ctx.save();
  ctx.beginPath(); pathFn();
  ctx.clip();
  ctx.beginPath(); pathFn();
  ctx.strokeStyle = col; ctx.lineWidth = w * 2; ctx.lineJoin = 'round';
  ctx.translate(-w * .5, -w * .6);
  ctx.stroke();
  ctx.restore();
}

/** سایهٔ چسبیده به زمین — چیزها را روی سطح می‌نشاند. */
function contact(cx, cy, rx, ry, alpha = .26) {
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
  g.addColorStop(0, `rgba(20, 12, 6, ${alpha})`);
  g.addColorStop(1, 'rgba(20, 12, 6, 0)');
  ctx.save();
  ctx.fillStyle = g;
  ctx.translate(cx, cy); ctx.scale(1, ry / Math.max(rx, ry));
  ctx.beginPath(); ctx.arc(0, 0, Math.max(rx, ry), 0, TAU); ctx.fill();
  ctx.restore();
}

const _tex = {};
/** بافتِ تکرارشونده؛ یک‌بار ساخته و بعد از حافظه خوانده می‌شود. */
function texture(key, w, h, paint) {
  if (_tex[key]) return _tex[key];
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const c = off.getContext('2d');
  paint(c, w, h);
  _tex[key] = ctx.createPattern(off, 'repeat');
  return _tex[key];
}

/** رگهٔ چوب. */
function texWood(base, grain) {
  return texture('w' + base + grain, 120, 120, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = grain; c.lineWidth = 1.4;
    for (let i = 0; i < 9; i++) {
      c.globalAlpha = .18 + noise1(i * 3.1) * .3;
      c.beginPath();
      const y0 = i * 14 + noise1(i) * 6;
      c.moveTo(0, y0);
      for (let x = 0; x <= w; x += 10) c.lineTo(x, y0 + Math.sin(x * .09 + i) * 2.6);
      c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** تارِ پارچه. */
function texCloth(base, thread) {
  return texture('c' + base + thread, 16, 16, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = thread; c.lineWidth = 1; c.globalAlpha = .5;
    for (let i = 0; i < w; i += 4) {
      c.beginPath(); c.moveTo(i, 0); c.lineTo(i, h); c.stroke();
      c.beginPath(); c.moveTo(0, i); c.lineTo(w, i); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** دانه‌های سنگ. */
function texStone(base, spec) {
  return texture('s' + base + spec, 90, 90, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) {
      c.globalAlpha = .05 + noise1(i * 1.7) * .16;
      c.fillStyle = spec;
      const r = .6 + noise1(i * 5.3) * 1.9;
      c.beginPath();
      c.arc(noise1(i * 2.1) * w, noise1(i * 3.7 + 1) * h, r, 0, TAU);
      c.fill();
    }
    c.globalAlpha = 1;
  });
}

/** الیافِ کاغذ. */
function texPaper(base) {
  return texture('p' + base, 100, 100, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 130; i++) {
      c.globalAlpha = .04 + noise1(i * 2.3) * .07;
      c.strokeStyle = i % 2 ? '#ffffff' : '#5a4326';
      c.lineWidth = .9;
      const x = noise1(i * 1.3) * w, y = noise1(i * 4.1 + 2) * h;
      const a = noise1(i * 7.7) * TAU, l = 4 + noise1(i * 9.1) * 12;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

function buildGrain() {
  const s = 260;
  const off = document.createElement('canvas');
  off.width = off.height = s;
  const c = off.getContext('2d');
  const img = c.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    const v = 214 + Math.random() * 41;
    img.data[i*4] = v; img.data[i*4+1] = v; img.data[i*4+2] = v; img.data[i*4+3] = 255;
  }
  c.putImageData(img, 0, 0);
  /* همان دانه‌ها به شکلِ سیاهِ کم‌رنگ، تا بشود بدونِ multiply گذاشتشان */
  const d = document.createElement('canvas');
  d.width = d.height = s;
  const dc = d.getContext('2d');
  const dimg = dc.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    dimg.data[i*4] = 0; dimg.data[i*4+1] = 0; dimg.data[i*4+2] = 0;
    dimg.data[i*4+3] = 255 - img.data[i*4];
  }
  dc.putImageData(dimg, 0, 0);
  _grainDark = d;
  _ovl = null; _ovlKey = '';
  return ctx.createPattern(off, 'repeat');
}

function toStage(e) {
  const r = CV.getBoundingClientRect();
  return {
    x: (e.clientX - r.left - view.ox) / view.scale,
    y: (e.clientY - r.top - view.oy) / view.scale,
  };
}

const inRect = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
const inCircle = (p, b, pad = 0) => Math.hypot(p.x - b.x, p.y - b.y) <= b.r + pad;

/* ───────── قلم‌های کاغذبُری ───────── */

/** دایره‌ای که انگار با قیچی بریده شده. */
function wobbleCircle(cx, cy, r, seed = 0, amp = 2.2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const rr = r + Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp * .45;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** بیضیِ ناصاف — برای چیزهایی که گرد نیستند ولی نرم‌اند. */
function wobbleEllipse(cx, cy, rx, ry, rot = 0, seed = 0, amp = 2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const w = 1 + (Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp*.45) / Math.max(rx, ry);
    const px = Math.cos(a) * rx * w, py = Math.sin(a) * ry * w;
    const x = cx + px*Math.cos(rot) - py*Math.sin(rot);
    const y = cy + px*Math.sin(rot) + py*Math.cos(rot);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** مستطیلِ گِرد با گوشه‌های کمی کج. */
function wobbleRect(x, y, w, h, r = 12, seed = 0, amp = 1.6) {
  const j = (k) => (noise1(seed*9.7 + k) - .5) * amp * 2;
  ctx.beginPath();
  ctx.moveTo(x + r + j(1), y + j(2));
  ctx.lineTo(x + w - r + j(3), y + j(4));
  ctx.quadraticCurveTo(x + w + j(5), y + j(6), x + w + j(7), y + r + j(8));
  ctx.lineTo(x + w + j(9), y + h - r + j(10));
  ctx.quadraticCurveTo(x + w + j(11), y + h + j(12), x + w - r + j(13), y + h + j(14));
  ctx.lineTo(x + r + j(15), y + h + j(16));
  ctx.quadraticCurveTo(x + j(17), y + h + j(18), x + j(19), y + h - r + j(20));
  ctx.lineTo(x + j(21), y + r + j(22));
  ctx.quadraticCurveTo(x + j(23), y + j(24), x + r + j(1), y + j(2));
  ctx.closePath();
}

/** سایهٔ نرم؛ نور از بالا-چپ. */
function withShadow(blur, dy, alpha, fn, hue = '78, 46, 24') {
  ctx.save();
  ctx.shadowColor = `rgba(${hue}, ${alpha})`;
  ctx.shadowBlur = blur;
  ctx.shadowOffsetY = dy;
  ctx.shadowOffsetX = dy * .35;
  fn();
  ctx.restore();
}

/** یک برگه‌ی کاغذ با سایه — پایه‌ی همه‌ی کارت‌ها و تابلوها. */
function paper(x, y, w, h, fill, seed = 1, r = 12, shadow = .26) {
  withShadow(16, 7, shadow, () => {
    ctx.fillStyle = fill;
    wobbleRect(x, y, w, h, r, seed, 2);
    ctx.fill();
  });
  /* الیافِ کاغذ و لبهٔ روشن، تا سطح تخت نماند */
  ctx.save();
  ctx.beginPath(); wobbleRect(x, y, w, h, r, seed, 2); ctx.clip();
  ctx.globalAlpha = .5;
  ctx.fillStyle = texPaper(fill);
  ctx.fillRect(x, y, w, h);
  ctx.globalAlpha = 1;
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.4, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(90,60,20,.1)');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
}

function text(str, x, y, o = {}) {
  const size = o.size || 20;
  const fam = o.family || 'Vazirmatn';
  ctx.save();
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.font = `${fam === 'Lalezar' ? '400' : (o.weight || 700)} ${size}px "${fam}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.baseline || 'middle';
  ctx.fillStyle = o.color || '#43291b';
  ctx.direction = 'rtl';
  if (o.stroke) {
    ctx.lineWidth = o.strokeWidth || 5;
    ctx.strokeStyle = o.stroke;
    ctx.lineJoin = 'round';
    ctx.strokeText(str, x, y, o.maxWidth);
  }
  ctx.fillText(str, x, y, o.maxWidth);
  ctx.restore();
}

/** متنِ چندخطی که خودش می‌شکند. ارتفاعِ اشغال‌شده را برمی‌گرداند. */
function textWrap(str, x, y, maxW, o = {}) {
  const size = o.size || 19, lh = o.lineHeight || size * 1.7;
  ctx.font = `${o.weight || 700} ${size}px "${o.family || 'Vazirmatn'}", Tahoma, sans-serif`;
  const lines = [];
  for (const para of str.split('\n')) {
    let line = '';
    for (const wd of para.split(' ')) {
      const t = line ? line + ' ' + wd : wd;
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = wd; }
      else line = t;
    }
    lines.push(line);
  }
  lines.forEach((l, i) => text(l, x, y + i * lh, o));
  return lines.length * lh;
}

/* ───────── ذره‌ها ───────── */

class Bits {
  constructor() { this.list = []; }
  add(x, y, n, kind, colors, opts = {}) {
    for (let i = 0; i < n; i++) {
      const a = opts.dir !== undefined ? opts.dir + (Math.random()-.5) * (opts.spread || 1) : Math.random() * TAU;
      const sp = (opts.speed || 200) * (.4 + Math.random());
      this.list.push({
        kind, x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - (opts.lift || 0),
        r: (opts.size || 4) * (.5 + Math.random()),
        rot: Math.random() * TAU, vr: (Math.random()-.5) * 10,
        col: colors[(Math.random() * colors.length) | 0],
        grav: opts.grav === undefined ? 620 : opts.grav,
        drag: opts.drag || .995,
        life: (opts.life || .9) * (.6 + Math.random() * .8), age: 0,
      });
    }
  }
  confetti(x, y, n, colors) {
    this.add(x, y, n, 'flake', colors, { speed: 420, lift: 190, size: 5, life: 1.6, grav: 780 });
  }
  spark(x, y, n, colors) {
    this.add(x, y, n, 'dot', colors, { speed: 180, lift: 30, size: 3.4, life: .7, grav: 260, drag: .93 });
  }
  step(dt) {
    for (const p of this.list) {
      p.age += dt;
      p.vy += p.grav * dt;
      p.vx *= p.drag; p.vy *= p.drag;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    }
    this.list = this.list.filter((p) => p.age < p.life);
  }
  draw() {
    for (const p of this.list) {
      const k = clamp(1 - p.age / p.life, 0, 1);
      ctx.save();
      ctx.globalAlpha = k;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.col;
      if (p.kind === 'flake') ctx.fillRect(-p.r, -p.r*1.5, p.r*2, p.r*3);
      else if (p.kind === 'leaf') { wobbleEllipse(0, 0, p.r*1.8, p.r*.8, 0, p.r, .6); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(0, 0, p.r * k, 0, TAU); ctx.fill(); }
      ctx.restore();
    }
  }
  clear() { this.list.length = 0; }
}

/* ───────── صدا (بدون فایل صوتی) ───────── */

const sfx = {
  ac: null, on: true,
  _c() {
    if (!this.on) return null;
    if (!this.ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; this.ac = new A(); }
    if (this.ac.state === 'suspended') this.ac.resume();
    return this.ac;
  },
  tone(f, dur = .16, type = 'sine', gain = .13, delay = 0) {
    const c = this._c(); if (!c) return;
    const t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(t0 + dur + .04);
  },
  tap()  { this.tone(430, .07, 'triangle', .09); },
  place(){ this.tone(620, .11, 'sine', .12); },
  pop()  { this.tone(760, .09, 'sine', .11); },
  slide(){ this.tone(240, .22, 'sine', .07); },
  good() { [523, 659, 784].forEach((f,i) => this.tone(f, .22, 'sine', .13, i*.07)); },
  win()  { [523, 659, 784, 1047].forEach((f,i) => this.tone(f, .34, 'triangle', .13, i*.10)); },
  nope() { this.tone(180, .2, 'sawtooth', .07); },
  tick() { this.tone(1100, .04, 'square', .05); },
};

/* ───────── قطعه‌های آماده ───────── */

function star(x, y, r, col, rot = 0) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = col;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI/2 + i * Math.PI/5;
    const rr = i % 2 ? r * .45 : r;
    const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/** دکمهٔ کاغذی. hovered را خودِ بازی می‌دهد؛ اینجا فقط کشیده می‌شود. */
/** رنگ را روشن‌تر (k>0) یا تیره‌تر (k<0) می‌کند. */
function shade(col, k) {
  const c = String(col).trim();
  let r, g2, b2;
  if (c[0] === '#') {
    const h = c.length === 4 ? c[1]+c[1]+c[2]+c[2]+c[3]+c[3] : c.slice(1, 7);
    r = parseInt(h.slice(0,2), 16); g2 = parseInt(h.slice(2,4), 16); b2 = parseInt(h.slice(4,6), 16);
  } else {
    const m = c.match(/[\d.]+/g);
    if (!m || m.length < 3) return col;
    r = +m[0]; g2 = +m[1]; b2 = +m[2];
  }
  const f = (v) => Math.round(clamp(k < 0 ? v * (1 + k) : v + (255 - v) * k, 0, 255));
  return 'rgb(' + f(r) + ',' + f(g2) + ',' + f(b2) + ')';
}

function button(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 3 : 0;
  const fill = o.disabled ? (o.off || '#bcaa92') : (hot ? (o.hotFill || o.fill) : o.fill);
  const r = o.r === undefined ? 14 : o.r;
  /* لبهٔ زیرینِ تیره — دکمه از صفحه بیرون می‌زند */
  ctx.fillStyle = shade(fill, -.36);
  wobbleRect(b.x, b.y + dy + 7, b.w, b.h, r, b.x + b.y, 2);
  ctx.fill();
  withShadow(hot ? 22 : 14, hot ? 5 : 8, .32, () => {
    ctx.fillStyle = fill;
    wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2);
    ctx.fill();
  });
  /* حجم: روشن از بالا، تیره به پایین */
  ctx.save();
  ctx.beginPath(); wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2); ctx.clip();
  const g = ctx.createLinearGradient(0, b.y + dy, 0, b.y + dy + b.h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.45, 'rgba(255,255,255,.04)');
  g.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = g;
  ctx.fillRect(b.x, b.y + dy, b.w, b.h);
  /* برقِ باریکِ لبهٔ بالا */
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.fillRect(b.x + r, b.y + dy + 2, b.w - r * 2, 2);
  ctx.restore();
  text(label, b.x + b.w/2, b.y + b.h/2 + dy - (o.sub ? 9 : 0), {
    size: o.size || 26, color: o.color || '#fdf6e8', family: o.family || 'Lalezar',
  });
  if (o.sub) text(o.sub, b.x + b.w/2, b.y + b.h/2 + dy + 17,
    { size: 14, color: o.subColor || 'rgba(255,255,255,.88)' });
}

/** دکمهٔ گرد کوچک (مثل + و −). */
function roundButton(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 2 : 0;
  withShadow(10, hot ? 3 : 5, .3, () => {
    ctx.fillStyle = o.disabled ? '#cbbba3' : (hot ? (o.hotFill || o.fill) : o.fill);
    wobbleCircle(b.x, b.y + dy, b.r, b.x, 1.4);
    ctx.fill();
  });
  text(label, b.x, b.y + dy - 1,
    { size: o.size || 32, color: o.disabled ? '#a8988a' : (o.color || '#fdf6e8'), family: 'Lalezar' });
}

/** پرده‌ی تمام‌صفحه: برای شروعِ پرده و برای جشنِ پایان. */
function overlay(o) {
  const k = easeOut(clamp(o.t / .5, 0, 1));
  ctx.fillStyle = `rgba(30, 22, 16, ${.66 * k})`;
  ctx.fillRect(0, 0, SW, SH);

  const w = o.w || 700, h = o.h || 290;
  const x = (SW - w) / 2, y = o.y || (SH * .22);
  const s = lerp(.9, 1, easeBack(clamp(o.t / .65, 0, 1)));
  ctx.save();
  ctx.translate(SW/2, y + h/2);
  ctx.scale(s, s);
  ctx.translate(-SW/2, -(y + h/2));

  withShadow(30, 14, .42, () => {
    ctx.fillStyle = o.paper || '#fbf3e2';
    wobbleRect(x, y, w, h, 18, 121, 2.4);
    ctx.fill();
  });
  ctx.fillStyle = o.band || '#c8434f';
  wobbleRect(x, y, w, 12, 6, 123, 1);
  ctx.fill();

  if (o.icon) o.icon(SW/2, y + 56);
  text(o.title, SW/2, y + (o.icon ? 108 : 62),
    { size: o.titleSize || 36, color: o.ink || '#43291b', family: 'Lalezar', alpha: k });
  textWrap(o.body, SW/2, y + (o.icon ? 158 : 116), w - 90,
    { size: 19, color: o.inkSoft || '#8a6a52', alpha: k });
  ctx.restore();

  button(o.btn, o.btnLabel, { hot: o.btnHot, fill: o.btnFill || '#7fa356', hotFill: o.btnHotFill || '#8fb45f', size: 28 });
}

/** پیامِ کوتاهِ بالای صحنه. */
class Toast {
  constructor() { this.msg = null; this.t = 0; this.kind = 'info'; }
  say(msg, kind = 'info') { this.msg = msg; this.kind = kind; this.t = 2.6; }
  step(dt) { if (this.t > 0) { this.t -= dt; if (this.t <= 0) this.msg = null; } }
  draw(y = 24, colors = {}) {
    if (!this.msg) return;
    const k = clamp(this.t, 0, 1) * clamp((2.6 - this.t) * 5, 0, 1);
    ctx.save();
    ctx.globalAlpha = k;
    ctx.font = `700 19px "Vazirmatn", Tahoma, sans-serif`;
    const w = ctx.measureText(this.msg).width + 76;
    const fill = this.kind === 'good' ? (colors.good || '#7fa356')
               : this.kind === 'bad' ? (colors.bad || '#c8434f')
               : (colors.info || '#fbf3e2');
    paper(SW/2 - w/2, y, w, 48, fill, 151, 12, .3);
    text(this.msg, SW/2, y + 25,
      { size: 19, color: this.kind === 'info' ? (colors.ink || '#43291b') : '#fff8ec' });
    ctx.restore();
  }
}

/* ───────── آموزشِ پرده‌ای ─────────
   پرده‌هایی که منتظرِ کارِ بچه نیستند با یک ضربه جلو می‌روند. تایمر فقط
   پشتیبان است؛ بچهٔ کلاس سومی باید فرصتِ خواندن داشته باشد، نه اینکه
   متن قبل از تمام شدنِ خواندنش برود.                                    */

/** اگر پردهٔ فعلی خواندنی است، ضربه را می‌خورد و می‌رود پردهٔ بعد. */
function tutTap(tut, tapSteps, lastStep) {
  if (!tut.on || tapSteps.indexOf(tut.step) < 0) return false;
  if (tut.step >= lastStep) tut.on = false;
  else { tut.step++; tut.t = 0; }
  sfx.tap();
  return true;
}

/** نشانهٔ «برای ادامه بزن» — زیرِ کارتِ آموزش. */
function tutMore(cx, y, t, ink = '#3a2a18', bg = 'rgba(255, 250, 238, .94)') {
  ctx.save();
  ctx.globalAlpha = .62 + .38 * Math.sin(t * 3.2);
  ctx.font = '700 15px "Vazirmatn", Tahoma, sans-serif';
  const label = 'برای ادامه، هرجا را بزن';
  const w = ctx.measureText(label).width + 40, h = 32, x = cx - w / 2, r = 16;
  withShadow(10, 4, .3, () => {
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath(); ctx.fill();
  });
  text(label, cx, y + h / 2, { size: 15, color: ink });
  ctx.restore();
}

/** فونت‌ها را می‌آورد و بعد بازی را شروع می‌کند.
    مهم: هر دو راه (رسیدنِ فونت و مهلتِ پشتیبان) ممکن است برسند، ولی
    شروع فقط باید یک بار انجام شود؛ وگرنه دو حلقهٔ فریم راه می‌افتد و
    بازی دوبرابر سریع می‌شود. */
function whenFontsReady(start) {
  let done = false;
  const go = () => { if (done) return; done = true; start(); };
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('400 40px Lalezar'),
      document.fonts.load('700 20px Vazirmatn'),
      document.fonts.load('900 20px Vazirmatn'),
    ]).then(go, go);
    setTimeout(go, 2600);
  } else go();
}

/** حلقهٔ فریم با dtِ محدودشده. */
/* ───────── کیفیتِ خودکار ─────────
   اگر دستگاه کُند بود، اوّل درخشش و بعد رنگ‌بندی خاموش می‌شود تا بازی
   روان بماند. روی دستگاهِ قوی همه‌چیز روشن است. */
let QUALITY = 2;
let _fAcc = 0, _fN = 0, _qHold = 0;

function _qualityTick(gap) {
  if (gap <= 0 || gap > 200) return;
  _fAcc += gap; _fN++;
  if (_fN < 45) return;
  const avg = _fAcc / _fN;
  _fAcc = 0; _fN = 0;
  if (_qHold > 0) { _qHold--; return; }
  /* فاصلهٔ بالا و پایین باید باز باشد، وگرنه کیفیت بین دو پله بالا و
     پایین می‌پرد و بازی مدام تغییرِ ظاهر می‌دهد. */
  const before = QUALITY;
  if (avg > 21 && QUALITY > 0) { QUALITY--; _qHold = 4; }
  else if (avg < 13.5 && QUALITY < 2) { QUALITY++; _qHold = 10; }
  /* در پایین‌ترین کیفیت، صحنه را با نقطه‌های کمتر می‌کشیم */
  if (before !== QUALITY && (before === 0 || QUALITY === 0) && _refit) _refit();
}

/* یک حلقه، نه بیشتر — دو حلقه یعنی زمانِ بازی دوبرابر می‌گذرد.

   MOTION: تا پیش از این، به‌خاطرِ باگِ دو حلقه، همهٔ بازی‌ها عملاً با
   سرعتِ دو برابر اجرا می‌شدند و زمان‌بندی‌ها هم با همان حس تنظیم شده
   بودند. حالا که باگ رفع شده، سرعتِ درست (یک برابر) کُند به نظر
   می‌رسد. این ضریب جانِ حرکت‌ها را برمی‌گرداند، ولی نه تا آن دو برابرِ
   تصادفی. فقط روی جانِ حرکت اثر دارد، نه روی هیچ قانونِ علمی. */
const MOTION = 1.45;
let _looping = false;
function runLoop(step) {
  if (_looping) return;
  _looping = true;
  let last = performance.now();
  const frame = (now) => {
    const gap = now - last;
    /* بریدنِ بعد از ضرب، تا یک فریمِ کُند پرشِ بزرگ نسازد */
    const dt = Math.min(gap / 1000 * MOTION, 1/15);
    last = now;
    _qualityTick(gap);
    step(dt);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

/* ═════════════════ بازی ═════════════════ */
/* ═══════════════════════════════════════════════════════════════════════
   آزمایشگاهِ برچسبِ خوراکی — علومِ سوم، درس ۲ «خوراکی‌ها»  (آزمایش)

   کتاب می‌گوید: «به برچسبِ سیبِ سلامت که روی بسته‌بندی‌ها قرار دارد
   توجّه کنید… اگر روی برچسبِ سیبِ سلامت، یک سطر قرمز یا دو سطر رنگِ زرد
   باشد، یعنی باید در مصرفِ آن خوراکی احتیاط کرد.»

   این آزمایش همان کار را مرحله‌به‌مرحله و با عددهای واقعی انجام می‌دهد:

   ۱) خوراکی را روی ترازو بگذار تا دقیقاً ۱۰۰ گرم شود. (چرا ۱۰۰ گرم؟
      چون برچسب همیشه «در هر ۱۰۰ گرم» را می‌گوید؛ وگرنه مقایسهٔ دو
      خوراکی با هم بی‌معنی است — ترازو خودش این را یاد می‌دهد.)
   ۲) سه لولهٔ نمک و قند و چربی به اندازهٔ همان ۱۰۰ گرم پر می‌شود.
   ۳) هر لوله را روی خط‌کشِ رنگی بخوان: سبز، زرد یا قرمز.
   ۴) سطرهای برچسب را خودت رنگ کن.
   ۵) قانون: یک قرمز یا دو زرد ⟵ احتیاط.

   عددهای مرزِ رنگ‌ها ساختگی نیستند؛ همان مرزهای چراغِ راهنماییِ
   تغذیه‌اند که سیبِ سلامت هم از آن‌ها استفاده می‌کند (در هر ۱۰۰ گرم):
      چربی : تا ۳ سبز، تا ۱۷٫۵ زرد، بیشتر قرمز
      قند  : تا ۵ سبز، تا ۲۲٫۵ زرد، بیشتر قرمز
      نمک  : تا ۰٫۳ سبز، تا ۱٫۵ زرد، بیشتر قرمز
   برای نوشیدنی‌ها مرزِ چربی و قند نصف می‌شود (در هر ۱۰۰ میلی‌لیتر)،
   ولی مرزِ نمک نصف نمی‌شود — همان‌طور که در قانونِ واقعی است.

   مقدارهای هر خوراکی هم از مقدارهای واقعیِ همان خوراکی گرفته شده‌اند.
   ═══════════════════════════════════════════════════════════════════════ */

/* ───────── قانونِ رنگِ برچسب ─────────
   مرزها «در هر ۱۰۰ گرم»؛ برای نوشیدنی «در هر ۱۰۰ میلی‌لیتر»، و مرزِ
   چربی و قند نصف می‌شود ولی مرزِ نمک نه.                             */

const NUTS = [
  /* half: آیا برای نوشیدنی مرز نصف می‌شود؟ چربی و قند بله، نمک نه. */
  { id: 'charbi', n: 'چربی', unit: 'گرم', g: 3,  a: 17.5, max: 40, half: 1 },
  { id: 'ghand',  n: 'قند',  unit: 'گرم', g: 5,  a: 22.5, max: 60, half: 1 },
  { id: 'namak',  n: 'نمک',  unit: 'گرم', g: .3, a: 1.5,  max: 4,  half: 0 },
];

/** مرزهای سبز و زردِ یک ماده برای این خوراکی. */
function limits(k, drink) {
  const nu = NUTS[k];
  const d = drink && nu.half ? 2 : 1;
  return [nu.g / d, nu.a / d];
}
/** رنگِ یک سطر: ۰ سبز، ۱ زرد، ۲ قرمز. */
function bandOf(k, val, drink) {
  const lm = limits(k, drink);
  if (val <= lm[0]) return 0;
  if (val <= lm[1]) return 1;
  return 2;
}
/** قانونِ کتاب: یک قرمز یا دو زرد ⟵ احتیاط. */
function needCare(bands) {
  const red = bands.filter((b) => b === 2).length;
  const amber = bands.filter((b) => b === 1).length;
  return red >= 1 || amber >= 2;
}

/* ───────── کار با آزمایش ───────── */

function tip(msg) { S.tip = msg; S.tipT = 3.6; }

function chooseItem(i) {
  S.item = i;
  S.pour = 0; S.poured = false; S.pouring = 0; S.tubes = 0;
  S.mark = [-1, -1, -1]; S.markT = [0, 0, 0]; S.wrong = [0, 0, 0];
  S.verdict = null;
  S.stepI = 1;
  sfx.tap();
}

function zero() {
  S.pour = 0; S.poured = false; S.tubes = 0;
  S.mark = [-1, -1, -1]; S.wrong = [0, 0, 0]; S.verdict = null;
  S.stepI = Math.min(S.stepI, 1);
  sfx.tap();
}

/* پنجرهٔ پذیرش و آستانهٔ سرریز — به‌اندازهٔ کافی باز، تا بازی «مسابقهٔ
   انگشت» نشود؛ ولی به‌اندازهٔ کافی تنگ، که «دقیقاً ۱۰۰ گرم» معنی بدهد. */
const OK_LO = 98.5, OK_HI = 101.5, OVER = 103.5, TOP = 115;

/** سرعتِ ریختن — نزدیکِ ۱۰۰ کُند می‌شود، مثلِ ریختنِ با احتیاط. */
function pourRate(g) {
  if (g < 82) return 52;
  return lerp(52, 7, clamp((g - 82) / 16, 0, 1));
}

/** ریختنِ خوراکی روی ترازو — از ۱۰۰ که خیلی رد شود باید صفر کند. */
function pourStep(dt) {
  if (!S.pouring || S.item < 0 || S.poured) return;
  S.pour = Math.min(TOP, S.pour + dt * pourRate(S.pour));
  if (S.pour > OVER) {
    S.pouring = 0; S.flash = 1; sfx.nope();
    tip('از ۱۰۰ گرم گذشت؛ ترازو را صفر کن.');
  }
}

function settle() {
  /* وقتی دست را برداشتی، اگر روی ۱۰۰ ایستاده باشی آزمایش جلو می‌رود */
  if (S.item < 0 || S.poured) return;
  if (S.pour >= OK_LO && S.pour <= OK_HI) {
    S.pour = 100; S.poured = true; S.tubes = 0.0001;
    S.stepI = Math.max(S.stepI, 2);
    sfx.good();
  } else if (S.pour > OK_HI) {
    tip('بیشتر از ۱۰۰ گرم شد؛ صفر کن و دوباره.');
  } else if (S.pour > 0) {
    tip('هنوز به ۱۰۰ گرم نرسیده؛ باز هم بریز.');
  }
}

function markRow(k, c) {
  if (!S.poured) { tip('اوّل ۱۰۰ گرم را بریز.'); S.flash = 1; sfx.nope(); return; }
  if (S.tubes < 1) { tip('صبر کن لوله‌ها پر شوند.'); return; }
  const right = trueBands()[k];
  if (c === right) {
    S.mark[k] = c; S.markT[k] = 0; sfx.place();
    const r = labRow(k);
    bits.spark(r.x + r.w / 2, r.y + r.h / 2, 10, ['#fff', [P.green, P.amber, P.red][c]]);
    if (S.mark.every((m) => m >= 0)) { S.stepI = Math.max(S.stepI, 4); sfx.good(); }
  } else {
    S.wrong[k] = 1; sfx.nope(); S.shake = .14;
    tip('لوله را با خط‌کشِ کنارش بسنج.');
  }
}

function judge(care) {
  if (S.mark.some((m) => m < 0)) { tip('اوّل هر سه سطر را رنگ کن.'); S.flash = 1; sfx.nope(); return; }
  const right = needCare(trueBands());
  const ok = care === right;
  S.verdict = { pick: care, ok };
  if (ok) {
    sfx.win();
    if (S.book.indexOf(S.item) < 0) S.book.push(S.item);
    bits.confetti(LABEL.x + LABEL.w / 2, LABEL.y + 300, 26, [P.green, P.amber, P.gold, '#fff']);
  } else {
    sfx.nope(); S.shake = .16;
    tip('قانون را دوباره بخوان: یک قرمز، یا دو زرد.');
  }
}

/* ───────── حلقه ───────── */

function step(dt) {
  S.t += dt;
  if (S.tipT > 0) S.tipT -= dt;
  if (S.flash > 0) S.flash -= dt;
  if (S.shake > 0) S.shake = Math.max(0, S.shake - dt);
  for (let k = 0; k < 3; k++) {
    if (S.wrong[k] > 0) S.wrong[k] = Math.max(0, S.wrong[k] - dt * 1.6);
    if (S.mark[k] >= 0 && S.markT[k] < 1) S.markT[k] += dt * 3;
  }
  pourStep(dt);
  if (S.tubes > 0 && S.tubes < 1) S.tubes = Math.min(1, S.tubes + dt * .9);
  bits.step(dt);
  draw();
}

whenFontsReady(() => runLoop(step));

/* ───────── ورودی ───────── */

cv.addEventListener('pointermove', (e) => {
  const p = toStage(e);
  S.hover = null;
  for (let i = 0; i < ITEMS.length; i++) if (inRect(p, shelfCard(i))) S.hover = { k: 'item', i };
  if (inRect(p, BTN_POUR)) S.hover = { k: 'pour' };
  if (inRect(p, BTN_ZERO)) S.hover = { k: 'zero' };
  if (inRect(p, BTN_OK)) S.hover = { k: 'ok' };
  if (inRect(p, BTN_CARE)) S.hover = { k: 'care' };
  if (inRect(p, BTN_NEW)) S.hover = { k: 'new' };
  for (let k = 0; k < 3; k++) for (let c = 0; c < 3; c++) if (inRect(p, swatch(k, c))) S.hover = { k: 'sw', r: k, c };
  cv.style.cursor = S.hover ? 'pointer' : 'default';
});

cv.addEventListener('pointerdown', (e) => {
  const p = toStage(e);
  for (let i = 0; i < ITEMS.length; i++) if (inRect(p, shelfCard(i))) { chooseItem(i); return; }
  if (inRect(p, BTN_ZERO)) { zero(); return; }
  if (inRect(p, BTN_POUR)) {
    if (S.item < 0) { tip('اوّل یک خوراکی بردار.'); S.flash = 1; sfx.nope(); return; }
    if (S.poured) { tip('۱۰۰ گرم آماده است.'); return; }
    S.pouring = 1;
    try { cv.setPointerCapture(e.pointerId); } catch { /* بعضی مرورگرها */ }
    return;
  }
  for (let k = 0; k < 3; k++) for (let c = 0; c < 3; c++) if (inRect(p, swatch(k, c))) { markRow(k, c); return; }
  if (inRect(p, BTN_OK)) { judge(false); return; }
  if (inRect(p, BTN_CARE)) { judge(true); return; }
  if (inRect(p, BTN_NEW)) { S.item = -1; S.stepI = 0; zero(); return; }
});

function endPour() { if (S.pouring) { S.pouring = 0; settle(); } }
cv.addEventListener('pointerup', endPour);
cv.addEventListener('pointercancel', () => { S.pouring = 0; });
cv.addEventListener('pointerleave', () => { S.pouring = 0; });
addEventListener('blur', () => { S.pouring = 0; });

/* ───────── ابزارِ نقاشی ───────── */

function rrPath(x, y, w, h, r) {
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function numText(str, x, y, o = {}) {
  ctx.save();
  ctx.direction = 'ltr';
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = o.color || P.ink;
  ctx.font = `${o.weight || 700} ${o.size || 18}px "${o.family || 'Vazirmatn'}", Tahoma, sans-serif`;
  ctx.fillText(str, x, y);
  ctx.restore();
}

/** عددِ اعشاری با ممیزِ فارسی. */
function faNum(v, d) {
  const s = d === 0 ? String(Math.round(v)) : v.toFixed(d).replace(/\.?0+$/, '');
  return fa(s).replace('.', '٫');
}

function itemIcon(id, s) {
  ctx.save();
  ctx.scale(s, s);
  const ell = (x, y, rx, ry, rot, col) => {
    ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, TAU); ctx.fill();
  };
  const bottle = (body, cap) => {
    ctx.fillStyle = body;
    ctx.beginPath(); rrPath(-8, -8, 16, 22, 4); ctx.fill();
    ctx.fillStyle = cap; ctx.fillRect(-4, -16, 8, 9);
  };
  switch (id) {
    case 'shir': bottle('#eef4f8', '#4a86c4'); break;
    case 'ab': bottle('rgba(180,220,235,.85)', '#5aa8c4'); break;
    case 'nushabe': bottle('#4a2b18', '#c0392b'); break;
    case 'abmive': bottle('#e8912c', '#7a4a18'); break;
    case 'doogh': bottle('#f3f6f2', '#7fa356'); break;
    case 'mast': ctx.fillStyle = '#4a86c4';
      ctx.beginPath(); ctx.moveTo(-12, -6); ctx.lineTo(12, -6); ctx.lineTo(9, 12); ctx.lineTo(-9, 12); ctx.closePath(); ctx.fill();
      ell(0, -6, 12, 3.6, 0, '#fbfdff'); break;
    case 'panir': ctx.fillStyle = '#f7f2df';
      ctx.beginPath(); ctx.moveTo(-13, 8); ctx.lineTo(-4, -9); ctx.lineTo(13, -9); ctx.lineTo(13, 8); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#e2d8b8';
      ctx.beginPath(); ctx.moveTo(-13, 8); ctx.lineTo(-4, -9); ctx.lineTo(-4, 3); ctx.closePath(); ctx.fill(); break;
    case 'nan': ell(0, 0, 15, 8, -.2, '#d9a441'); ell(-3, -2, 10, 4.4, -.2, '#eec27a'); break;
    case 'sib': ell(0, 2, 10, 11, 0, '#cf4436'); ell(-3, -2, 4, 4, 0, '#e8837a');
      ctx.strokeStyle = '#6b4a2c'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, -8); ctx.lineTo(1, -14); ctx.stroke(); break;
    case 'khiar': ell(0, 0, 5.5, 13, .35, '#5da24e'); ell(-1.4, -2, 2.6, 8, .35, '#8fc97a'); break;
    case 'morgh': ell(1, 1, 11, 8, -.15, '#c98a5e'); ell(1, 3, 9.4, 4.6, -.15, '#a86a3e'); break;
    case 'adas': for (const [x, y] of [[-6, -4], [1, -6], [6, -3], [-4, 2], [3, 1], [-1, 7]]) ell(x, y, 3.6, 2.8, .3, '#9b7f3f'); break;
    case 'chips': ctx.fillStyle = '#e8b25a';
      for (const [x, y, r] of [[-5, 2, .3], [4, -2, -.4], [0, 6, .1]]) {
        ctx.save(); ctx.translate(x, y); ctx.rotate(r);
        ctx.beginPath(); ctx.ellipse(0, 0, 8, 5, 0, 0, TAU); ctx.fill(); ctx.restore(); } break;
    case 'pofak': ctx.fillStyle = '#e8a13a';
      for (const [x, y] of [[-6, 2], [2, -3], [6, 4]]) {
        ctx.beginPath(); ctx.ellipse(x, y, 7, 3.4, .5, 0, TAU); ctx.fill(); } break;
    case 'shokolat': ctx.fillStyle = '#5b3a22';
      ctx.beginPath(); rrPath(-13, -8, 26, 17, 3); ctx.fill();
      ctx.strokeStyle = '#3d2513'; ctx.lineWidth = 1.6;
      for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(i * 8.6, -8); ctx.lineTo(i * 8.6, 9); ctx.stroke(); }
      ctx.beginPath(); ctx.moveTo(-13, .5); ctx.lineTo(13, .5); ctx.stroke(); break;
    case 'biscuit': ell(0, 0, 12, 12, 0, '#d9a962');
      ctx.fillStyle = '#a87b3c';
      for (const [x, y] of [[-4, -3], [4, -1], [0, 5], [-5, 4]]) { ctx.beginPath(); ctx.arc(x, y, 1.6, 0, TAU); ctx.fill(); } break;
    case 'keik': ctx.fillStyle = '#c98a5e';
      ctx.beginPath(); ctx.moveTo(-12, 10); ctx.lineTo(-9, -4); ctx.lineTo(9, -4); ctx.lineTo(12, 10); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fbf3e6'; ell(0, -5, 11, 5, 0, '#fbf3e6');
      ell(0, -11, 4, 4, 0, '#cf4436'); break;
    case 'sosis': ctx.fillStyle = '#c4645c';
      ctx.beginPath(); rrPath(-14, -5, 28, 11, 5.5); ctx.fill();
      ctx.fillStyle = '#d98d84';
      ctx.beginPath(); rrPath(-11, -3.4, 20, 4, 2); ctx.fill(); break;
    case 'khorma': for (const [x, y] of [[-5, 0], [4, -2], [1, 6]]) ell(x, y, 6.4, 4.4, .4, '#6b3b1e'); break;
    case 'gerdu': ell(0, 0, 11, 10.6, 0, '#b98a56'); ell(0, 0, 8.4, 8.4, 0, '#d9b183');
      ctx.strokeStyle = '#9c6d3c'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(0, -8); ctx.lineTo(0, 8); ctx.stroke();
      for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(0, -5); ctx.quadraticCurveTo(s * 6, -1, 0, 3); ctx.stroke(); } break;
    default: ell(0, 0, 10, 10, 0, '#999');
  }
  ctx.restore();
}

/* ───────── نقاشیِ صحنه ───────── */

function paintBenchStatic() {
  const g = ctx.createLinearGradient(0, 0, 0, SCENE_H);
  g.addColorStop(0, P.benchHi); g.addColorStop(1, P.benchLo);
  ctx.fillStyle = g; ctx.fillRect(0, 0, SCENE_W, SCENE_H);
  /* کاشیِ آزمایشگاه */
  ctx.strokeStyle = 'rgba(255,255,255,.045)'; ctx.lineWidth = 2;
  for (let x = 0; x < SCENE_W; x += 60) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, SCENE_H); ctx.stroke(); }
  for (let y = 0; y < SCENE_H; y += 60) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(SCENE_W, y); ctx.stroke(); }
  for (const b of [SHELF, BENCH, LABEL]) {
    ctx.fillStyle = 'rgba(255, 253, 244, .95)';
    ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 16); ctx.fill();
    ctx.strokeStyle = 'rgba(20, 34, 42, .18)'; ctx.lineWidth = 2;
    ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 16); ctx.stroke();
  }
}

function drawSteps() {
  for (let i = 0; i < STEPS.length; i++) {
    const w = 146, x = SCENE_W - 24 - (i + 1) * (w + 8) + 8, y = 16, h = 44;
    const on = i === S.stepI, done = i < S.stepI;
    ctx.fillStyle = on ? P.accent : (done ? 'rgba(79, 163, 184, .28)' : 'rgba(255,255,255,.1)');
    ctx.beginPath(); rrPath(x, y, w, h, 12); ctx.fill();
    numText(fa(i + 1), x + w - 20, y + h / 2, { size: 15, color: on ? '#fff' : 'rgba(255,255,255,.6)' });
    text(STEPS[i].n, x + w / 2 + 6, y + h / 2,
      { size: 16, family: 'Lalezar', color: on ? '#fff' : 'rgba(255,255,255,.62)' });
  }
  /* راهنمای مرحله سمتِ چپ می‌ماند و به نوارِ مرحله‌ها نمی‌خورد */
  ctx.save();
  ctx.beginPath(); ctx.rect(16, 12, 350, 52); ctx.clip();
  text(STEPS[S.stepI].t, 366, 39, { size: 16, color: 'rgba(255,255,255,.82)', align: 'right' });
  ctx.restore();
}

function drawShelf() {
  text('قفسه', SHELF.x + SHELF.w - 16, SHELF.y + 26, { size: 20, family: 'Lalezar', color: P.ink, align: 'right' });
  for (let i = 0; i < ITEMS.length; i++) {
    const c = shelfCard(i), it = ITEMS[i];
    const on = S.item === i, hot = S.hover && S.hover.k === 'item' && S.hover.i === i;
    const done = S.book.indexOf(i) >= 0;
    ctx.fillStyle = on ? 'rgba(79, 163, 184, .2)' : (hot ? 'rgba(37,48,42,.07)' : 'rgba(37, 48, 42, .035)');
    ctx.beginPath(); rrPath(c.x, c.y, c.w, c.h, 10); ctx.fill();
    ctx.strokeStyle = on ? P.accent : 'rgba(37, 48, 42, .14)'; ctx.lineWidth = on ? 2.6 : 1.2;
    ctx.beginPath(); rrPath(c.x, c.y, c.w, c.h, 10); ctx.stroke();
    ctx.save();
    ctx.translate(c.x + c.w - 26, c.y + c.h / 2);
    itemIcon(it.id, .92);
    ctx.restore();
    text(it.n, c.x + c.w - 48, c.y + c.h / 2, { size: 14, color: P.ink, align: 'right' });
    if (done) {
      ctx.strokeStyle = P.good; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(c.x + 10, c.y + c.h / 2); ctx.lineTo(c.x + 15, c.y + c.h / 2 + 5); ctx.lineTo(c.x + 24, c.y + c.h / 2 - 6);
      ctx.stroke();
    }
    if (it.drink) {
      ctx.fillStyle = 'rgba(79, 163, 184, .22)';
      ctx.beginPath(); rrPath(c.x + 8, c.y + 6, 34, 16, 8); ctx.fill();
      text('نوشیدنی', c.x + 25, c.y + 14, { size: 10, color: '#2c6070' });
    }
  }
}

function drawScale() {
  const b = SCALE;
  /* کفهٔ ترازو */
  ctx.fillStyle = P.steelLt;
  ctx.beginPath(); rrPath(b.x + 40, b.y + 54, b.w - 80, 16, 8); ctx.fill();
  ctx.fillStyle = P.steel;
  ctx.beginPath(); rrPath(b.x + 20, b.y + 70, b.w - 40, b.h - 70, 14); ctx.fill();
  ctx.fillStyle = P.steelDk;
  ctx.beginPath(); rrPath(b.x + 20, b.y + b.h - 18, b.w - 40, 18, 9); ctx.fill();
  /* خوراکیِ روی کفه */
  if (S.item >= 0 && S.pour > 0) {
    const n = Math.min(14, Math.ceil(S.pour / 8.5));
    for (let i = 0; i < n; i++) {
      const a = i * 2.4;
      ctx.save();
      ctx.translate(b.x + b.w / 2 + Math.cos(a) * (10 + i * 2.6), b.y + 46 - Math.sin(a) * 6 - i * .6);
      itemIcon(IT().id, .62);
      ctx.restore();
    }
  }
  /* صفحهٔ عدد */
  const dw = 176, dx = b.x + b.w / 2 - dw / 2, dy = b.y + 84;
  ctx.fillStyle = '#16242b';
  ctx.beginPath(); rrPath(dx, dy, dw, 46, 8); ctx.fill();
  const over = S.pour > OK_HI;
  const exact = S.poured;
  numText(faNum(S.pour, 1) + ' گرم', dx + dw / 2, dy + 24,
    { size: 25, family: 'Lalezar', color: exact ? '#7fe08a' : (over ? '#ff9a86' : '#cfe8ef') });
  /* نوارِ رسیدن به ۱۰۰ — نوارِ سبزِ هدف روی آن دیده می‌شود */
  const fx = (g2) => dx + dw * clamp(g2 / TOP, 0, 1);
  ctx.fillStyle = 'rgba(255,255,255,.14)';
  ctx.beginPath(); rrPath(dx, dy + 52, dw, 10, 5); ctx.fill();
  ctx.fillStyle = 'rgba(63, 154, 78, .55)';
  ctx.fillRect(fx(OK_LO), dy + 52, fx(OK_HI) - fx(OK_LO), 10);
  ctx.fillStyle = 'rgba(200, 64, 44, .4)';
  ctx.fillRect(fx(OVER), dy + 52, dx + dw - fx(OVER), 10);
  ctx.save();
  ctx.beginPath(); rrPath(dx, dy + 52, dw, 10, 5); ctx.clip();
  ctx.fillStyle = exact ? P.green : (over ? P.red : P.accent);
  ctx.fillRect(dx, dy + 52, fx(S.pour) - dx, 10);
  ctx.restore();
  /* نشانهٔ ۱۰۰ گرم */
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(fx(100), dy + 46); ctx.lineTo(fx(100), dy + 66); ctx.stroke();
  numText('۱۰۰', fx(100), dy + 70, { size: 12, color: 'rgba(255,255,255,.7)' });
  if (S.flash > 0) {
    ctx.save(); ctx.globalAlpha = clamp(S.flash, 0, 1);
    ctx.strokeStyle = P.bad; ctx.lineWidth = 3;
    ctx.beginPath(); rrPath(dx - 6, dy - 6, dw + 12, 78, 10); ctx.stroke();
    ctx.restore();
  }
  /* دکمه‌ها */
  button(BTN_POUR, S.pouring ? 'می‌ریزد…' : 'بریز', {
    hot: S.hover && S.hover.k === 'pour', fill: '#3c7f8f', hotFill: '#4fa3b8', size: 22 });
  button(BTN_ZERO, 'صفر کن', {
    hot: S.hover && S.hover.k === 'zero', fill: '#7a7060', hotFill: '#948a78', size: 22 });
}

function drawTubes() {
  for (let k = 0; k < 3; k++) {
    const b = tube(k), nu = NUTS[k];
    const drink = S.item >= 0 && IT().drink;
    const lm = limits(k, drink), g = lm[0], a = lm[1];
    /* خط‌کشِ رنگی پشتِ لوله — همان مرزهای واقعی */
    const H = b.h;
    const yOf = (v) => b.y + H - (clamp(v, 0, nu.max) / nu.max) * H;
    const segs = [[0, g, 0], [g, a, 1], [a, nu.max, 2]];
    for (const [v0, v1, c] of segs) {
      ctx.fillStyle = BAND_C[c];
      ctx.save(); ctx.globalAlpha = .22;
      ctx.beginPath(); rrPath(b.x + b.w + 6, yOf(v1), 16, yOf(v0) - yOf(v1), 3); ctx.fill();
      ctx.restore();
      ctx.strokeStyle = BAND_D[c]; ctx.lineWidth = 1.2;
      ctx.beginPath(); rrPath(b.x + b.w + 6, yOf(v1), 16, yOf(v0) - yOf(v1), 3); ctx.stroke();
    }
    /* عددِ مرزها */
    for (const v of [g, a]) {
      ctx.strokeStyle = 'rgba(37,48,42,.5)'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(b.x + b.w + 2, yOf(v)); ctx.lineTo(b.x + b.w + 26, yOf(v)); ctx.stroke();
      numText(faNum(v, 1), b.x + b.w + 40, yOf(v), { size: 12, color: P.inkSoft });
    }
    /* خودِ لوله */
    ctx.fillStyle = 'rgba(206, 232, 239, .35)';
    ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 10); ctx.fill();
    /* پرشدگی */
    if (S.item >= 0 && S.poured) {
      const v = vals()[k] * clamp(S.tubes, 0, 1);
      const hh = (clamp(v, 0, nu.max) / nu.max) * H;
      const band = bandOf(k, vals()[k], IT().drink);
      ctx.save();
      ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 10); ctx.clip();
      ctx.fillStyle = ['#e8e4d8', '#f0e2c0', '#d8c9a8'][k];
      ctx.fillRect(b.x, b.y + H - hh, b.w, hh + 4);
      ctx.fillStyle = 'rgba(0,0,0,.08)';
      for (let y = b.y + H - hh; y < b.y + H; y += 7) ctx.fillRect(b.x, y, b.w, 2);
      ctx.restore();
      /* سطحِ مایع */
      ctx.strokeStyle = BAND_D[band]; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(b.x - 4, b.y + H - hh); ctx.lineTo(b.x + b.w + 4, b.y + H - hh); ctx.stroke();
      if (S.tubes >= 1) {
        const high = hh > H - 34;      /* اگر تا بالا پر شده، عدد را داخلِ لوله بنویس */
        numText(faNum(vals()[k], 1), b.x + b.w / 2, b.y + H - hh + (high ? 18 : -16),
          { size: 16, family: 'Lalezar', color: high ? '#5a4a2a' : P.ink });
      }
    }
    ctx.strokeStyle = 'rgba(90, 120, 130, .6)'; ctx.lineWidth = 2.4;
    ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 10); ctx.stroke();
    text(nu.n, b.x + b.w / 2, b.y + b.h + 22, { size: 17, family: 'Lalezar', color: P.ink });
  }
  const capY = BENCH.y + 316;
  if (S.item >= 0 && IT().drink) {
    text('در هر ۱۰۰ میلی‌لیتر', BENCH.x + BENCH.w / 2, capY, { size: 13, color: '#2c6070' });
  } else {
    text('در هر ۱۰۰ گرم', BENCH.x + BENCH.w / 2, capY, { size: 13, color: P.inkSoft });
  }
  drawPortion();
}

/* ───────── یک وعدهٔ واقعی ─────────
   برچسب همیشه «در هر ۱۰۰ گرم» را می‌گوید، ولی کسی ۱۰۰ میلی‌لیتر نوشابه
   نمی‌خورد؛ یک قوطیِ کامل می‌خورد. این تکّه همان را نشان می‌دهد و
   حبّه‌های قند را می‌شمارد — یک حبّهٔ قند حدودِ ۴ گرم است.            */

const CUBE_G = 4;

function drawPortion() {
  const b = PORTION;
  ctx.fillStyle = 'rgba(201, 150, 44, .1)';
  ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 10); ctx.fill();
  if (S.item < 0 || !S.poured || S.tubes < 1) {
    text('یک وعدهٔ واقعی، بعد از پر شدنِ لوله‌ها', b.x + b.w / 2, b.y + b.h / 2,
      { size: 13, color: 'rgba(37,48,42,.35)' });
    return;
  }
  const it = IT();
  const sug = it.v[1] * it.por / 100;
  const unit = it.drink ? 'میلی‌لیتر' : 'گرم';
  text('یک ' + it.porN + ' = ' + fa(it.por) + ' ' + unit, b.x + b.w - 14, b.y + 19,
    { size: 14, color: P.ink, align: 'right' });
  numText('قند: ' + faNum(sug, 1) + ' گرم', b.x + b.w - 156, b.y + 19,
    { size: 14, color: sug >= 20 ? P.redD : P.inkSoft, align: 'right' });
  /* حبّه‌های قند */
  const n = Math.min(14, Math.round(sug / CUBE_G));
  for (let i = 0; i < n; i++) {
    const x = b.x + 14 + i * 20, y = b.y + 32;
    ctx.fillStyle = '#fbfaf2';
    ctx.beginPath(); rrPath(x, y, 16, 14, 3); ctx.fill();
    ctx.strokeStyle = '#b8ae94'; ctx.lineWidth = 1.2;
    ctx.beginPath(); rrPath(x, y, 16, 14, 3); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x + 2, y + 4); ctx.lineTo(x + 13, y + 4); ctx.stroke();
  }
  if (n === 0) {
    text('تقریباً بدونِ قند', b.x + 14, b.y + 39, { size: 13, color: P.green, align: 'left' });
  } else {
    numText('≈ ' + fa(n) + ' حبّه قند', b.x + 30 + n * 20, b.y + 39,
      { size: 13, color: P.inkSoft, align: 'left' });
  }
}

function drawLabel() {
  text('برچسبِ سیبِ سلامت', LABEL.x + LABEL.w - 18, LABEL.y + 30,
    { size: 21, family: 'Lalezar', color: P.ink, align: 'right' });
  /* سیب */
  ctx.save();
  ctx.translate(LABEL.x + 44, LABEL.y + 30);
  ctx.fillStyle = '#cf4436';
  ctx.beginPath(); ctx.arc(0, 2, 13, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#6b4a2c'; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(1, -18); ctx.stroke();
  ctx.fillStyle = '#5da24e';
  ctx.beginPath(); ctx.ellipse(8, -15, 7, 3.6, -.5, 0, TAU); ctx.fill();
  ctx.restore();

  if (S.item < 0) {
    text('اوّل یک خوراکی از قفسه بردار.', LABEL.x + LABEL.w / 2, LABEL.y + 200,
      { size: 16, color: 'rgba(37,48,42,.4)' });
    return;
  }
  text(IT().n, LABEL.x + LABEL.w / 2, LABEL.y + 74, { size: 22, family: 'Lalezar', color: P.accent });

  for (let k = 0; k < 3; k++) {
    const r = labRow(k), got = S.mark[k];
    ctx.fillStyle = got >= 0 ? BAND_C[got] : 'rgba(37, 48, 42, .05)';
    ctx.save();
    if (got >= 0) ctx.globalAlpha = .2 + .8 * clamp(S.markT[k], 0, 1) * .35;
    ctx.beginPath(); rrPath(r.x, r.y, r.w, r.h, 12); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = got >= 0 ? BAND_D[got] : 'rgba(37, 48, 42, .16)';
    ctx.lineWidth = got >= 0 ? 3 : 1.4;
    ctx.beginPath(); rrPath(r.x, r.y, r.w, r.h, 12); ctx.stroke();
    text(NUTS[k].n, r.x + r.w - 16, r.y + 26, { size: 19, family: 'Lalezar', color: P.ink, align: 'right' });
    if (S.poured && S.tubes >= 1) {
      numText(faNum(vals()[k], 1) + ' گرم', r.x + r.w - 84, r.y + 26, { size: 15, color: P.inkSoft, align: 'right' });
    }
    /* سه رنگ برای انتخاب */
    for (let c = 0; c < 3; c++) {
      const sb = swatch(k, c);
      const on = got === c;
      const hot = S.hover && S.hover.k === 'sw' && S.hover.r === k && S.hover.c === c;
      ctx.fillStyle = on ? BAND_C[c] : (hot ? BAND_C[c] : 'rgba(255,255,255,.9)');
      ctx.save();
      if (!on && !hot) ctx.globalAlpha = .55;
      ctx.beginPath(); rrPath(sb.x, sb.y, sb.w, sb.h, 8); ctx.fill();
      ctx.restore();
      ctx.strokeStyle = BAND_D[c]; ctx.lineWidth = on ? 3 : 1.6;
      ctx.beginPath(); rrPath(sb.x, sb.y, sb.w, sb.h, 8); ctx.stroke();
      text(BAND_N[c], sb.x + sb.w / 2, sb.y + sb.h / 2, { size: 13, color: on ? '#fff' : BAND_D[c] });
    }
    if (S.wrong[k] > 0) {
      ctx.save(); ctx.globalAlpha = clamp(S.wrong[k], 0, 1);
      ctx.strokeStyle = P.bad; ctx.lineWidth = 3;
      ctx.beginPath(); rrPath(r.x - 4, r.y - 4, r.w + 8, r.h + 8, 14); ctx.stroke();
      ctx.restore();
    }
  }

  /* قانون */
  const ry = LABEL.y + 450;
  ctx.fillStyle = 'rgba(201, 150, 44, .14)';
  ctx.beginPath(); rrPath(LABEL.x + 20, ry - 16, LABEL.w - 40, 32, 8); ctx.fill();
  text('یک قرمز، یا دو زرد ⟵ احتیاط', LABEL.x + LABEL.w / 2, ry, { size: 15, color: '#8a6a12' });

  const ready = S.mark.every((m) => m >= 0);
  const v = S.verdict;
  /* بعد از حکم، فقط دکمهٔ انتخاب‌شده رنگ می‌گیرد */
  const btnFill = (mine) => {
    if (v) return v.pick === mine ? (v.ok ? P.good : P.bad) : '#9aa39c';
    if (!ready) return '#8a9285';
    return mine ? '#b07a2a' : '#4e7f4a';
  };
  button(BTN_OK, 'سالم است', {
    hot: S.hover && S.hover.k === 'ok', fill: btnFill(false), hotFill: '#63a05b', size: 20 });
  button(BTN_CARE, 'احتیاط', {
    hot: S.hover && S.hover.k === 'care', fill: btnFill(true), hotFill: '#cf9438', size: 20 });
  if (v && v.ok) {
    text(v.pick ? 'درست — برچسبش می‌گوید احتیاط.' : 'درست — برچسبش قرمز یا دو زرد ندارد.',
      LABEL.x + LABEL.w / 2, LABEL.y + 548, { size: 15, color: P.good });
  }
  button(BTN_NEW, 'خوراکیِ تازه', {
    hot: S.hover && S.hover.k === 'new', fill: '#5c6870', hotFill: '#77848d', size: 19 });
}

function draw() {
  beginScene(P.benchLo);
  ctx.save();
  if (S.shake > 0) {
    const k = S.shake * 10;
    ctx.translate(Math.sin(S.t * 55) * k, Math.cos(S.t * 43) * k * .4);
  }
  const layer = staticLayer('bench', SCENE_W, SCENE_H, paintBenchStatic);
  ctx.drawImage(layer, 0, 0, SCENE_W, SCENE_H);
  drawSteps();
  drawShelf();
  drawScale();
  drawTubes();
  drawLabel();
  bits.draw();
  ctx.restore();
  if (S.tipT > 0) {
    ctx.save();
    ctx.globalAlpha = clamp(S.tipT, 0, 1);
    const w = 520;
    paper(SCENE_W / 2 - w / 2, SCENE_H - 62, w, 44, P.paper, 51, 12, .3);
    text(S.tip, SCENE_W / 2, SCENE_H - 40, { size: 16, color: P.ink });
    ctx.restore();
  }
  endScene(.09, 'rgba(10, 22, 30, .42)', .3, .12);
}

</script>
