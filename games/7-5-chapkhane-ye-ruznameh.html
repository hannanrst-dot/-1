<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#e7dcc4">
<title>چاپخانهٔ روزنامه — انتخاب نمودار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>
  /* صفحه نباید هیچ‌جا اسکرول یا زوم شود؛ بازی باید مثل یک برنامه رفتار کند. */
  html, body {
    margin: 0; padding: 0; background: #e7dcc4;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body {
    position: fixed; inset: 0;          /* جلوی کشیده‌شدنِ صفحه در سافاریِ گوشی */
    width: 100%; height: 100vh; height: 100dvh;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none; -webkit-touch-callout: none;
  }

  /* گوشیِ عمودی صحنه را ریز می‌کند؛ بچه باید گوشی را بچرخاند. */
  #rotate { display: none; }
  @media (orientation: portrait) and (max-width: 860px) {
    #stage { display: none; }
    #rotate {
      display: flex; position: fixed; inset: 0;
      z-index: 9;
      flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      background: #e7dcc4; color: #f6ead2;
      font: 700 20px "Vazirmatn", Tahoma, sans-serif; text-align: center; padding: 32px;
    }
    #rotate svg { animation: tilt 2.4s ease-in-out infinite; }
    @keyframes tilt { 0%, 45% { transform: rotate(0deg); } 65%, 100% { transform: rotate(-90deg); } }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="rotate">
  <svg width="86" height="126" viewBox="0 0 86 126" fill="none" aria-hidden="true">
    <rect x="3" y="3" width="80" height="120" rx="12" stroke="#e8b448" stroke-width="5"/>
    <rect x="15" y="19" width="56" height="88" rx="5" fill="#e8b448" opacity=".28"/>
    <circle cx="43" cy="115" r="4" fill="#e8b448"/>
  </svg>
  <div>گوشی را بچرخان</div>
  <div style="font-weight:400;opacity:.7;font-size:16px">این بازی خوابیده بازی می‌شود</div>
</div>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   هستهٔ مشترکِ بازی‌ها — سبک «کاغذبُری»
   ───────────────────────────────────────────────────────────────────────
   این فایل جعبه‌ابزار است، نه چارچوب: هر بازی حلقه و وضعیت خودش را دارد
   و فقط از این توابع برای کشیدن استفاده می‌کند. دلیلش این است که هر بازی
   باید حس‌وحال خودش را داشته باشد، نه اینکه همه شبیه هم دربیایند.

   قاعده‌های ثابتِ تصویری:
   • نور همیشه از بالا-چپ می‌تابد، پس سایه‌ها به پایین-راست می‌افتند.
   • هیچ لبه‌ای کاملاً صاف نیست؛ همه کمی موج دارند (انگار با قیچی بریده).
   • هیچ خاکستریِ خالصی نداریم؛ همه‌ی خنثی‌ها به گرمیِ صحنه می‌زنند.
   • یک لایه‌ی دانه‌دانه‌ی کاغذ روی کلِ تصویر ضرب می‌شود.
   ═══════════════════════════════════════════════════════════════════════ */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const FA_D = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
const fa = (n) => String(n).replace(/\d/g, (d) => FA_D[+d]);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeIn = (t) => t * t * t;
const easeInOut = (t) => (t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2);
const easeBack = (t) => 1 + 2.7 * Math.pow(t-1, 3) + 1.7 * Math.pow(t-1, 2);
const easeElastic = (t) => t === 0 || t === 1 ? t : Math.pow(2, -9*t) * Math.sin((t*10 - .75) * 2.094) + 1;

/** تصادفِ تکرارپذیر: با یک بذر همیشه همان عدد. برای اینکه تزئین‌ها هر فریم نپرند. */
function noise1(x) {
  const s = Math.sin(x * 127.1) * 43758.5453;
  return s - Math.floor(s);
}
const pick = (arr, seed) => arr[Math.floor(noise1(seed) * arr.length) % arr.length];

/* ───────── بوم و صحنهٔ ثابت ───────── */

let ctx, SW, SH, CV, _refit = null;
let view = { scale: 1, ox: 0, oy: 0, w: 0, h: 0, dpr: 1 };
let _grain = null;

function initStage(canvas, w, h) {
  CV = canvas; SW = w; SH = h;
  ctx = canvas.getContext('2d');

  /* اندازه را از خودِ بوم می‌گیریم نه از innerHeight؛ چون در سافاریِ گوشی
     نوارِ آدرس باز و بسته می‌شود و innerHeight دروغ می‌گوید. */
  const fit = () => {
    const r = canvas.getBoundingClientRect();
    const vw = Math.round(r.width), vh = Math.round(r.height);
    if (vw < 20 || vh < 20) return;
    const dpr = Math.min(devicePixelRatio || 1, QUALITY > 0 ? 2 : 1);
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    const scale = Math.min(vw / SW, vh / SH);
    view = { scale, ox: (vw - SW*scale)/2, oy: (vh - SH*scale)/2, w: vw, h: vh, dpr };
    _grain = buildGrain();
  };
  _refit = fit;
  addEventListener('resize', fit);
  /* چرخاندنِ گوشی: اندازهٔ درست چند لحظه بعد می‌رسد، پس چندبار اندازه می‌گیریم. */
  addEventListener('orientationchange', () => {
    fit(); setTimeout(fit, 140); setTimeout(fit, 460);
  });
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(canvas);

  /* صدا در گوشی فقط بعد از اوّلین لمس اجازهٔ پخش دارد. */
  const unlock = () => { sfx._c(); removeEventListener('pointerdown', unlock); removeEventListener('touchstart', unlock); };
  addEventListener('pointerdown', unlock, { passive: true });
  addEventListener('touchstart', unlock, { passive: true });
  /* نگه‌داشتنِ انگشت نباید منوی مرورگر را باز کند. */
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  fit();
  return ctx;
}

/** قابِ صحنه را باز می‌کند: بعد از این، مختصات همیشه در فضای SW×SH است. */
function beginScene(bg) {
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, view.w, view.h);
  ctx.save();
  ctx.translate(view.ox, view.oy);
  ctx.scale(view.scale, view.scale);
  ctx.beginPath();
  ctx.rect(0, 0, SW, SH);
  ctx.clip();
}

/** بافتِ کاغذ، تیرگیِ گوشه‌ها، رنگ‌بندی و درخششِ نور را می‌گذارد و قاب را می‌بندد. */
function endScene(grainAlpha = .15, vignette = 'rgba(48,28,14,.30)', bloom = .34, grade = .14) {
  if (QUALITY < 1) { grade = 0; grainAlpha *= .5; }
  if (QUALITY < 2) bloom = 0;
  if (grade > 0) {
    /* رنگ‌بندیِ نرم: بالای صحنه گرم‌تر، پایین سردتر — عمق می‌دهد */
    const g = ctx.createLinearGradient(0, 0, 0, SH);
    g.addColorStop(0, `rgba(255, 214, 150, ${grade})`);
    g.addColorStop(.55, 'rgba(255, 255, 255, 0)');
    g.addColorStop(1, `rgba(40, 60, 110, ${grade * .9})`);
    ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalCompositeOperation = 'source-over';
  }
  if (_grain && grainAlpha > 0) {
    ctx.globalCompositeOperation = 'multiply';
    ctx.globalAlpha = grainAlpha;
    ctx.fillStyle = _grain;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
  if (vignette) {
    const g = ctx.createRadialGradient(SW/2, SH/2, SH*.42, SW/2, SH/2, SH*1.05);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, vignette);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
  }
  ctx.restore();
  bloomPass(bloom);
}

/* ───────── درخششِ نور (bloom) ─────────
   قابِ رسم‌شده را کوچک می‌کنیم، دو بار در خودش ضرب می‌کنیم تا فقط
   روشن‌ها بمانند، محوش می‌کنیم و با حالتِ «lighter» رویش می‌گذاریم.
   نتیجه: چراغ‌ها، شعله‌ها و رنگ‌های روشن نور پخش می‌کنند. */
let _bl, _blc, _bl2, _bl2c, _blNo = false, _blTick = 0;

function bloomPass(amount) {
  if (!amount || _blNo || !CV.width) return;
  /* کوچک‌کردن و بزرگ‌کردنِ دوباره، خودش محو می‌کند — از filter خیلی ارزان‌تر است */
  const W = Math.max(4, Math.round(CV.width * .2)), H = Math.max(4, Math.round(CV.height * .2));
  const W2 = Math.max(2, Math.round(W * .28)), H2 = Math.max(2, Math.round(H * .28));
  try {
    if (!_bl) {
      _bl = document.createElement('canvas'); _blc = _bl.getContext('2d');
      _bl2 = document.createElement('canvas'); _bl2c = _bl2.getContext('2d');
      if (!_blc || !_bl2c) { _blNo = true; return; }
    }
    if (_bl.width !== W || _bl.height !== H) { _bl.width = W; _bl.height = H; }
    if (_bl2.width !== W2 || _bl2.height !== H2) { _bl2.width = W2; _bl2.height = H2; }
    /* ساختنِ نور یک قاب در میان کافی است؛ گذاشتنش هر قاب. */
    _blTick = (_blTick + 1) & 1;
    if (!_blTick) {
      _blc.globalCompositeOperation = 'source-over';
      _blc.clearRect(0, 0, W, H);
      _blc.drawImage(CV, 0, 0, W, H);
      _blc.globalCompositeOperation = 'multiply';
      _blc.drawImage(_bl, 0, 0);
      _blc.drawImage(_bl, 0, 0);
      _blc.globalCompositeOperation = 'source-over';
      _bl2c.clearRect(0, 0, W2, H2);
      _bl2c.drawImage(_bl, 0, 0, W2, H2);
    }

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = amount;
    ctx.drawImage(_bl2, 0, 0, CV.width, CV.height);
    ctx.restore();
  } catch (e) { _blNo = true; }
}

/* ───────── لایهٔ ثابت ─────────
   هرچه در صحنه تکان نمی‌خورد را یک‌بار می‌کشیم و بعد فقط کپی می‌کنیم. */
const _layers = {};
function staticLayer(key, w, h, paint) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const L = _layers[key];
  if (L && L.q === q && L.w === w && L.h === h) return L.cv;
  const off = document.createElement('canvas');
  off.width = Math.max(1, Math.round(w * q));
  off.height = Math.max(1, Math.round(h * q));
  const c = off.getContext('2d');
  c.setTransform(q, 0, 0, q, 0, 0);
  const prev = ctx;
  ctx = c;
  try { paint(); } finally { ctx = prev; }
  _layers[key] = { cv: off, q, w, h };
  return off;
}

/* ───────── نورپردازی و بافت ─────────
   کارِ این‌ها این است که هیچ سطحی «تختِ یک‌رنگ» نماند. */

/** شیبِ عمودی: بالا روشن، پایین تیره. */
function vgrad(y0, y1, top, bot) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, top); g.addColorStop(1, bot);
  return g;
}

/** حجمِ کروی: نور از بالا-چپ، سایه در پایین-راست. */
function ball(cx, cy, r, lit, base, dark) {
  const g = ctx.createRadialGradient(cx - r * .38, cy - r * .42, r * .06, cx, cy, r * 1.06);
  g.addColorStop(0, lit); g.addColorStop(.45, base); g.addColorStop(1, dark);
  return g;
}

/** لبهٔ روشنِ بالا-چپِ یک مسیر — همان «rim light». */
function rim(pathFn, col, w = 2.2) {
  ctx.save();
  ctx.beginPath(); pathFn();
  ctx.clip();
  ctx.beginPath(); pathFn();
  ctx.strokeStyle = col; ctx.lineWidth = w * 2; ctx.lineJoin = 'round';
  ctx.translate(-w * .5, -w * .6);
  ctx.stroke();
  ctx.restore();
}

/** سایهٔ چسبیده به زمین — چیزها را روی سطح می‌نشاند. */
function contact(cx, cy, rx, ry, alpha = .26) {
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
  g.addColorStop(0, `rgba(20, 12, 6, ${alpha})`);
  g.addColorStop(1, 'rgba(20, 12, 6, 0)');
  ctx.save();
  ctx.fillStyle = g;
  ctx.translate(cx, cy); ctx.scale(1, ry / Math.max(rx, ry));
  ctx.beginPath(); ctx.arc(0, 0, Math.max(rx, ry), 0, TAU); ctx.fill();
  ctx.restore();
}

const _tex = {};
/** بافتِ تکرارشونده؛ یک‌بار ساخته و بعد از حافظه خوانده می‌شود. */
function texture(key, w, h, paint) {
  if (_tex[key]) return _tex[key];
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const c = off.getContext('2d');
  paint(c, w, h);
  _tex[key] = ctx.createPattern(off, 'repeat');
  return _tex[key];
}

/** رگهٔ چوب. */
function texWood(base, grain) {
  return texture('w' + base + grain, 120, 120, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = grain; c.lineWidth = 1.4;
    for (let i = 0; i < 9; i++) {
      c.globalAlpha = .18 + noise1(i * 3.1) * .3;
      c.beginPath();
      const y0 = i * 14 + noise1(i) * 6;
      c.moveTo(0, y0);
      for (let x = 0; x <= w; x += 10) c.lineTo(x, y0 + Math.sin(x * .09 + i) * 2.6);
      c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** تارِ پارچه. */
function texCloth(base, thread) {
  return texture('c' + base + thread, 16, 16, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = thread; c.lineWidth = 1; c.globalAlpha = .5;
    for (let i = 0; i < w; i += 4) {
      c.beginPath(); c.moveTo(i, 0); c.lineTo(i, h); c.stroke();
      c.beginPath(); c.moveTo(0, i); c.lineTo(w, i); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** دانه‌های سنگ. */
function texStone(base, spec) {
  return texture('s' + base + spec, 90, 90, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) {
      c.globalAlpha = .05 + noise1(i * 1.7) * .16;
      c.fillStyle = spec;
      const r = .6 + noise1(i * 5.3) * 1.9;
      c.beginPath();
      c.arc(noise1(i * 2.1) * w, noise1(i * 3.7 + 1) * h, r, 0, TAU);
      c.fill();
    }
    c.globalAlpha = 1;
  });
}

/** الیافِ کاغذ. */
function texPaper(base) {
  return texture('p' + base, 100, 100, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 130; i++) {
      c.globalAlpha = .04 + noise1(i * 2.3) * .07;
      c.strokeStyle = i % 2 ? '#ffffff' : '#5a4326';
      c.lineWidth = .9;
      const x = noise1(i * 1.3) * w, y = noise1(i * 4.1 + 2) * h;
      const a = noise1(i * 7.7) * TAU, l = 4 + noise1(i * 9.1) * 12;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

function buildGrain() {
  const s = 260;
  const off = document.createElement('canvas');
  off.width = off.height = s;
  const c = off.getContext('2d');
  const img = c.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    const v = 214 + Math.random() * 41;
    img.data[i*4] = v; img.data[i*4+1] = v; img.data[i*4+2] = v; img.data[i*4+3] = 255;
  }
  c.putImageData(img, 0, 0);
  return ctx.createPattern(off, 'repeat');
}

function toStage(e) {
  const r = CV.getBoundingClientRect();
  return {
    x: (e.clientX - r.left - view.ox) / view.scale,
    y: (e.clientY - r.top - view.oy) / view.scale,
  };
}

const inRect = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
const inCircle = (p, b, pad = 0) => Math.hypot(p.x - b.x, p.y - b.y) <= b.r + pad;

/* ───────── قلم‌های کاغذبُری ───────── */

/** دایره‌ای که انگار با قیچی بریده شده. */
function wobbleCircle(cx, cy, r, seed = 0, amp = 2.2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const rr = r + Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp * .45;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** بیضیِ ناصاف — برای چیزهایی که گرد نیستند ولی نرم‌اند. */
function wobbleEllipse(cx, cy, rx, ry, rot = 0, seed = 0, amp = 2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const w = 1 + (Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp*.45) / Math.max(rx, ry);
    const px = Math.cos(a) * rx * w, py = Math.sin(a) * ry * w;
    const x = cx + px*Math.cos(rot) - py*Math.sin(rot);
    const y = cy + px*Math.sin(rot) + py*Math.cos(rot);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** مستطیلِ گِرد با گوشه‌های کمی کج. */
function wobbleRect(x, y, w, h, r = 12, seed = 0, amp = 1.6) {
  const j = (k) => (noise1(seed*9.7 + k) - .5) * amp * 2;
  ctx.beginPath();
  ctx.moveTo(x + r + j(1), y + j(2));
  ctx.lineTo(x + w - r + j(3), y + j(4));
  ctx.quadraticCurveTo(x + w + j(5), y + j(6), x + w + j(7), y + r + j(8));
  ctx.lineTo(x + w + j(9), y + h - r + j(10));
  ctx.quadraticCurveTo(x + w + j(11), y + h + j(12), x + w - r + j(13), y + h + j(14));
  ctx.lineTo(x + r + j(15), y + h + j(16));
  ctx.quadraticCurveTo(x + j(17), y + h + j(18), x + j(19), y + h - r + j(20));
  ctx.lineTo(x + j(21), y + r + j(22));
  ctx.quadraticCurveTo(x + j(23), y + j(24), x + r + j(1), y + j(2));
  ctx.closePath();
}

/** سایهٔ نرم؛ نور از بالا-چپ. */
function withShadow(blur, dy, alpha, fn, hue = '78, 46, 24') {
  ctx.save();
  ctx.shadowColor = `rgba(${hue}, ${alpha})`;
  ctx.shadowBlur = blur;
  ctx.shadowOffsetY = dy;
  ctx.shadowOffsetX = dy * .35;
  fn();
  ctx.restore();
}

/** یک برگه‌ی کاغذ با سایه — پایه‌ی همه‌ی کارت‌ها و تابلوها. */
function paper(x, y, w, h, fill, seed = 1, r = 12, shadow = .26) {
  withShadow(16, 7, shadow, () => {
    ctx.fillStyle = fill;
    wobbleRect(x, y, w, h, r, seed, 2);
    ctx.fill();
  });
  /* الیافِ کاغذ و لبهٔ روشن، تا سطح تخت نماند */
  ctx.save();
  ctx.beginPath(); wobbleRect(x, y, w, h, r, seed, 2); ctx.clip();
  ctx.globalAlpha = .5;
  ctx.fillStyle = texPaper(fill);
  ctx.fillRect(x, y, w, h);
  ctx.globalAlpha = 1;
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.4, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(90,60,20,.1)');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
}

function text(str, x, y, o = {}) {
  const size = o.size || 20;
  const fam = o.family || 'Vazirmatn';
  ctx.save();
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.font = `${fam === 'Lalezar' ? '400' : (o.weight || 700)} ${size}px "${fam}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.baseline || 'middle';
  ctx.fillStyle = o.color || '#43291b';
  ctx.direction = 'rtl';
  if (o.stroke) {
    ctx.lineWidth = o.strokeWidth || 5;
    ctx.strokeStyle = o.stroke;
    ctx.lineJoin = 'round';
    ctx.strokeText(str, x, y, o.maxWidth);
  }
  ctx.fillText(str, x, y, o.maxWidth);
  ctx.restore();
}

/** متنِ چندخطی که خودش می‌شکند. ارتفاعِ اشغال‌شده را برمی‌گرداند. */
function textWrap(str, x, y, maxW, o = {}) {
  const size = o.size || 19, lh = o.lineHeight || size * 1.7;
  ctx.font = `${o.weight || 700} ${size}px "${o.family || 'Vazirmatn'}", Tahoma, sans-serif`;
  const lines = [];
  for (const para of str.split('\n')) {
    let line = '';
    for (const wd of para.split(' ')) {
      const t = line ? line + ' ' + wd : wd;
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = wd; }
      else line = t;
    }
    lines.push(line);
  }
  lines.forEach((l, i) => text(l, x, y + i * lh, o));
  return lines.length * lh;
}

/* ───────── ذره‌ها ───────── */

class Bits {
  constructor() { this.list = []; }
  add(x, y, n, kind, colors, opts = {}) {
    for (let i = 0; i < n; i++) {
      const a = opts.dir !== undefined ? opts.dir + (Math.random()-.5) * (opts.spread || 1) : Math.random() * TAU;
      const sp = (opts.speed || 200) * (.4 + Math.random());
      this.list.push({
        kind, x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - (opts.lift || 0),
        r: (opts.size || 4) * (.5 + Math.random()),
        rot: Math.random() * TAU, vr: (Math.random()-.5) * 10,
        col: colors[(Math.random() * colors.length) | 0],
        grav: opts.grav === undefined ? 620 : opts.grav,
        drag: opts.drag || .995,
        life: (opts.life || .9) * (.6 + Math.random() * .8), age: 0,
      });
    }
  }
  confetti(x, y, n, colors) {
    this.add(x, y, n, 'flake', colors, { speed: 420, lift: 190, size: 5, life: 1.6, grav: 780 });
  }
  spark(x, y, n, colors) {
    this.add(x, y, n, 'dot', colors, { speed: 180, lift: 30, size: 3.4, life: .7, grav: 260, drag: .93 });
  }
  step(dt) {
    for (const p of this.list) {
      p.age += dt;
      p.vy += p.grav * dt;
      p.vx *= p.drag; p.vy *= p.drag;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    }
    this.list = this.list.filter((p) => p.age < p.life);
  }
  draw() {
    for (const p of this.list) {
      const k = clamp(1 - p.age / p.life, 0, 1);
      ctx.save();
      ctx.globalAlpha = k;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.col;
      if (p.kind === 'flake') ctx.fillRect(-p.r, -p.r*1.5, p.r*2, p.r*3);
      else if (p.kind === 'leaf') { wobbleEllipse(0, 0, p.r*1.8, p.r*.8, 0, p.r, .6); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(0, 0, p.r * k, 0, TAU); ctx.fill(); }
      ctx.restore();
    }
  }
  clear() { this.list.length = 0; }
}

const sfx = {
  ac: null, on: true,
  _c() {
    if (!this.on) return null;
    if (!this.ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; this.ac = new A(); }
    if (this.ac.state === 'suspended') this.ac.resume();
    return this.ac;
  },
  tone(f, dur = .16, type = 'sine', gain = .13, delay = 0) {
    const c = this._c(); if (!c) return;
    const t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(t0 + dur + .04);
  },
  tap()  { this.tone(430, .07, 'triangle', .09); },
  place(){ this.tone(620, .11, 'sine', .12); },
  pop()  { this.tone(760, .09, 'sine', .11); },
  slide(){ this.tone(240, .22, 'sine', .07); },
  good() { [523, 659, 784].forEach((f,i) => this.tone(f, .22, 'sine', .13, i*.07)); },
  win()  { [523, 659, 784, 1047].forEach((f,i) => this.tone(f, .34, 'triangle', .13, i*.10)); },
  nope() { this.tone(180, .2, 'sawtooth', .07); },
  tick() { this.tone(1100, .04, 'square', .05); },
};

/* ───────── قطعه‌های آماده ───────── */

function star(x, y, r, col, rot = 0) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = col;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI/2 + i * Math.PI/5;
    const rr = i % 2 ? r * .45 : r;
    const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/** دکمهٔ کاغذی. hovered را خودِ بازی می‌دهد؛ اینجا فقط کشیده می‌شود. */
/** رنگ را روشن‌تر (k>0) یا تیره‌تر (k<0) می‌کند. */
function shade(col, k) {
  const c = String(col).trim();
  let r, g2, b2;
  if (c[0] === '#') {
    const h = c.length === 4 ? c[1]+c[1]+c[2]+c[2]+c[3]+c[3] : c.slice(1, 7);
    r = parseInt(h.slice(0,2), 16); g2 = parseInt(h.slice(2,4), 16); b2 = parseInt(h.slice(4,6), 16);
  } else {
    const m = c.match(/[\d.]+/g);
    if (!m || m.length < 3) return col;
    r = +m[0]; g2 = +m[1]; b2 = +m[2];
  }
  const f = (v) => Math.round(clamp(k < 0 ? v * (1 + k) : v + (255 - v) * k, 0, 255));
  return 'rgb(' + f(r) + ',' + f(g2) + ',' + f(b2) + ')';
}

function button(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 3 : 0;
  const fill = o.disabled ? (o.off || '#bcaa92') : (hot ? (o.hotFill || o.fill) : o.fill);
  const r = o.r === undefined ? 14 : o.r;
  /* لبهٔ زیرینِ تیره — دکمه از صفحه بیرون می‌زند */
  ctx.fillStyle = shade(fill, -.36);
  wobbleRect(b.x, b.y + dy + 7, b.w, b.h, r, b.x + b.y, 2);
  ctx.fill();
  withShadow(hot ? 22 : 14, hot ? 5 : 8, .32, () => {
    ctx.fillStyle = fill;
    wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2);
    ctx.fill();
  });
  /* حجم: روشن از بالا، تیره به پایین */
  ctx.save();
  ctx.beginPath(); wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2); ctx.clip();
  const g = ctx.createLinearGradient(0, b.y + dy, 0, b.y + dy + b.h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.45, 'rgba(255,255,255,.04)');
  g.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = g;
  ctx.fillRect(b.x, b.y + dy, b.w, b.h);
  /* برقِ باریکِ لبهٔ بالا */
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.fillRect(b.x + r, b.y + dy + 2, b.w - r * 2, 2);
  ctx.restore();
  text(label, b.x + b.w/2, b.y + b.h/2 + dy - (o.sub ? 9 : 0), {
    size: o.size || 26, color: o.color || '#fdf6e8', family: o.family || 'Lalezar',
  });
  if (o.sub) text(o.sub, b.x + b.w/2, b.y + b.h/2 + dy + 17,
    { size: 14, color: o.subColor || 'rgba(255,255,255,.88)' });
}

/** دکمهٔ گرد کوچک (مثل + و −). */
function roundButton(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 2 : 0;
  withShadow(10, hot ? 3 : 5, .3, () => {
    ctx.fillStyle = o.disabled ? '#cbbba3' : (hot ? (o.hotFill || o.fill) : o.fill);
    wobbleCircle(b.x, b.y + dy, b.r, b.x, 1.4);
    ctx.fill();
  });
  text(label, b.x, b.y + dy - 1,
    { size: o.size || 32, color: o.disabled ? '#a8988a' : (o.color || '#fdf6e8'), family: 'Lalezar' });
}

/** پرده‌ی تمام‌صفحه: برای شروعِ پرده و برای جشنِ پایان. */
function overlay(o) {
  const k = easeOut(clamp(o.t / .5, 0, 1));
  ctx.fillStyle = `rgba(30, 22, 16, ${.66 * k})`;
  ctx.fillRect(0, 0, SW, SH);

  const w = o.w || 700, h = o.h || 290;
  const x = (SW - w) / 2, y = o.y || (SH * .22);
  const s = lerp(.9, 1, easeBack(clamp(o.t / .65, 0, 1)));
  ctx.save();
  ctx.translate(SW/2, y + h/2);
  ctx.scale(s, s);
  ctx.translate(-SW/2, -(y + h/2));

  withShadow(30, 14, .42, () => {
    ctx.fillStyle = o.paper || '#fbf3e2';
    wobbleRect(x, y, w, h, 18, 121, 2.4);
    ctx.fill();
  });
  ctx.fillStyle = o.band || '#c8434f';
  wobbleRect(x, y, w, 12, 6, 123, 1);
  ctx.fill();

  if (o.icon) o.icon(SW/2, y + 56);
  text(o.title, SW/2, y + (o.icon ? 108 : 62),
    { size: o.titleSize || 36, color: o.ink || '#43291b', family: 'Lalezar', alpha: k });
  textWrap(o.body, SW/2, y + (o.icon ? 158 : 116), w - 90,
    { size: 19, color: o.inkSoft || '#8a6a52', alpha: k });
  ctx.restore();

  button(o.btn, o.btnLabel, { hot: o.btnHot, fill: o.btnFill || '#7fa356', hotFill: o.btnHotFill || '#8fb45f', size: 28 });
}

/** پیامِ کوتاهِ بالای صحنه. */
class Toast {
  constructor() { this.msg = null; this.t = 0; this.kind = 'info'; }
  say(msg, kind = 'info') { this.msg = msg; this.kind = kind; this.t = 2.6; }
  step(dt) { if (this.t > 0) { this.t -= dt; if (this.t <= 0) this.msg = null; } }
  draw(y = 24, colors = {}) {
    if (!this.msg) return;
    const k = clamp(this.t, 0, 1) * clamp((2.6 - this.t) * 5, 0, 1);
    ctx.save();
    ctx.globalAlpha = k;
    ctx.font = `700 19px "Vazirmatn", Tahoma, sans-serif`;
    const w = ctx.measureText(this.msg).width + 76;
    const fill = this.kind === 'good' ? (colors.good || '#7fa356')
               : this.kind === 'bad' ? (colors.bad || '#c8434f')
               : (colors.info || '#fbf3e2');
    paper(SW/2 - w/2, y, w, 48, fill, 151, 12, .3);
    text(this.msg, SW/2, y + 25,
      { size: 19, color: this.kind === 'info' ? (colors.ink || '#43291b') : '#fff8ec' });
    ctx.restore();
  }
}

/* ───────── آموزشِ پرده‌ای ─────────
   پرده‌هایی که منتظرِ کارِ بچه نیستند با یک ضربه جلو می‌روند. تایمر فقط
   پشتیبان است؛ بچهٔ کلاس سومی باید فرصتِ خواندن داشته باشد، نه اینکه
   متن قبل از تمام شدنِ خواندنش برود.                                    */

/** اگر پردهٔ فعلی خواندنی است، ضربه را می‌خورد و می‌رود پردهٔ بعد. */
function tutTap(tut, tapSteps, lastStep) {
  if (!tut.on || tapSteps.indexOf(tut.step) < 0) return false;
  if (tut.step >= lastStep) tut.on = false;
  else { tut.step++; tut.t = 0; }
  sfx.tap();
  return true;
}

/** نشانهٔ «برای ادامه بزن» — زیرِ کارتِ آموزش. */
function tutMore(cx, y, t, ink = '#3a2a18', bg = 'rgba(255, 250, 238, .94)') {
  ctx.save();
  ctx.globalAlpha = .62 + .38 * Math.sin(t * 3.2);
  ctx.font = '700 15px "Vazirmatn", Tahoma, sans-serif';
  const label = 'برای ادامه، هرجا را بزن';
  const w = ctx.measureText(label).width + 40, h = 32, x = cx - w / 2, r = 16;
  withShadow(10, 4, .3, () => {
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath(); ctx.fill();
  });
  text(label, cx, y + h / 2, { size: 15, color: ink });
  ctx.restore();
}

/** فونت‌ها را می‌آورد و بعد بازی را شروع می‌کند.
    مهم: هر دو راه (رسیدنِ فونت و مهلتِ پشتیبان) ممکن است برسند، ولی
    شروع فقط باید یک بار انجام شود؛ وگرنه دو حلقهٔ فریم راه می‌افتد و
    بازی دوبرابر سریع می‌شود. */
function whenFontsReady(start) {
  let done = false;
  const go = () => { if (done) return; done = true; start(); };
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('400 40px Lalezar'),
      document.fonts.load('700 20px Vazirmatn'),
      document.fonts.load('900 20px Vazirmatn'),
    ]).then(go, go);
    setTimeout(go, 2600);
  } else go();
}

/** حلقهٔ فریم با dtِ محدودشده. */
/* ───────── کیفیتِ خودکار ─────────
   اگر دستگاه کُند بود، اوّل درخشش و بعد رنگ‌بندی خاموش می‌شود تا بازی
   روان بماند. روی دستگاهِ قوی همه‌چیز روشن است. */
let QUALITY = 2;
let _fAcc = 0, _fN = 0, _qHold = 0;

function _qualityTick(gap) {
  if (gap <= 0 || gap > 200) return;
  _fAcc += gap; _fN++;
  if (_fN < 45) return;
  const avg = _fAcc / _fN;
  _fAcc = 0; _fN = 0;
  if (_qHold > 0) { _qHold--; return; }
  const before = QUALITY;
  if (avg > 25 && QUALITY > 0) { QUALITY--; _qHold = 3; }
  else if (avg < 18.5 && QUALITY < 2) { QUALITY++; _qHold = 6; }
  /* در پایین‌ترین کیفیت، صحنه را با نقطه‌های کمتر می‌کشیم */
  if (before !== QUALITY && (before === 0 || QUALITY === 0) && _refit) _refit();
}

/* یک حلقه، نه بیشتر — دو حلقه یعنی زمانِ بازی دوبرابر می‌گذرد. */
let _looping = false;
function runLoop(step) {
  if (_looping) return;
  _looping = true;
  let last = performance.now();
  const frame = (now) => {
    const gap = now - last;
    const dt = Math.min(gap / 1000, 1/20);
    last = now;
    _qualityTick(gap);
    step(dt);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

   ───────────────────────────────────────────────────────────────────────
   کتاب دو کار می‌خواهد: «اطّلاعات جدول را در یک نمودار ستونی قرار دهید»
   و «کدام‌یک از این نمودارهای دایره‌ای به‌طور تقریبی همان اطّلاعات را

    hint: 'تا مرکّب هست، روزنامه چاپ کن.' },
];

const CHART = { x: 336, y: 104, w: 828, base: 498, rows: 8 };
const SHEET = { x: 30, y: 96, w: 282, h: 404 };
const PLATES = { y: 658, r: 62 };
const BTN_GO = { x: 470, y: 566, w: 260, h: 76 };

/* ───────── وضعیت ───────── */

const S = {
  phase: 'intro', stage: 'bars',
  level: 0, rows: 6, scale: 1,
  story: 0, cats: [],          /* { name, ink, qty } */
  bar: [],                     /* بلندیِ ستون‌ها بر حسبِ خانه */
  plates: [], right: 0, picked: -1,
  drag: -1, wrong: 0, roll: 0,
  timeLeft: 0, inks: 3,
  cleared: 0, quota: 0,
  score: 0, best: 0, combo: 0,
  done: 0, doneT: 0,
  t: 0, phaseT: 0, hover: null, shake: 0,
  tut: { on: true, step: 0, t: 0 },
};

const bits = new Bits();
const toast = new Toast();
const L = () => LEVELS[S.level];
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

function loadBest() { try { return +localStorage.getItem('chap-best') || 0; } catch { return 0; } }
function saveBest(v) { try { localStorage.setItem('chap-best', String(v)); } catch { /* حالتِ خصوصی */ } }

const cv = document.getElementById('stage');
initStage(cv, SCENE_W, SCENE_H);
S.best = loadBest();

/* ───────── خبرِ تازه ───────── */

function newStory() {
  const lv = L();
  const k = lv.cats;
  const rows = lv.rows;
  const scale = lv.scale || [1, 2, 5][R(0, 2)];
  let h;
  for (let tries = 0; tries < 200; tries++) {
    h = [];
    for (let i = 0; i < k; i++) h.push(R(1, rows));
    const mx = Math.max(...h), mn = Math.min(...h);
    if (mx === mn) continue;                       /* همه‌برابر، قالبِ دایره‌ای بی‌معنا می‌شود */
    if (h.filter((v) => v === mx).length !== 1) continue;   /* بلندترین ستون باید یکی باشد */
    if (h.filter((v) => v === mn).length !== 1) continue;
    break;
  }
  const st = R(0, STORIES.length - 1);
  const names = STORIES[st].cats.slice(0, k);
  const inks = [0, 1, 2, 3, 4];
  for (let i = inks.length - 1; i > 0; i--) { const j = R(0, i); const t = inks[i]; inks[i] = inks[j]; inks[j] = t; }
  S.story = st;
  S.rows = rows; S.scale = scale;
  S.cats = names.map((n, i) => ({ name: n, ink: inks[i], qty: h[i] * scale }));
  S.bar = new Array(k).fill(0);
  S.stage = 'bars';
  S.plates = []; S.right = 0; S.picked = -1;
  S.wrong = 0; S.roll = 0;
  S.done = 0; S.doneT = 0;
}

/** سه قالبِ دایره‌ای: یکی درست، یکی همه‌برابر، یکی با جای عوض‌شدهٔ بیشترین و کمترین. */
function makePlates() {
  const share = S.cats.map((c) => c.qty);
  const k = share.length;
  const mxI = share.indexOf(Math.max(...share));
  const mnI = share.indexOf(Math.min(...share));
  const swapped = share.slice();
  const tmp = swapped[mxI]; swapped[mxI] = swapped[mnI]; swapped[mnI] = tmp;
  const equal = new Array(k).fill(1);
  const list = [
    { v: share, ok: true },
    { v: swapped, ok: false },
    { v: equal, ok: false },
  ];
  for (let i = list.length - 1; i > 0; i--) { const j = R(0, i); const t = list[i]; list[i] = list[j]; list[j] = t; }
  S.plates = list;
  S.right = list.findIndex((p) => p.ok);
}

function startLevel(i, keep) {
  const lv = LEVELS[i];
  S.level = i;
  S.cleared = 0;
  S.quota = lv.endless ? Infinity : lv.quota;
  S.combo = 0;
  S.timeLeft = lv.time;
  if (!keep) { S.score = 0; S.inks = 3; }
  S.phase = 'play'; S.phaseT = 0;
  S.tut.on = i === 0 && !keep; S.tut.step = 0; S.tut.t = 0;
  newStory();
  toast.say(lv.hint, 'info');
}

/* ───────── حلقه ───────── */

newStory();
whenFontsReady(() => runLoop(step));

const rowH = () => (CHART.base - CHART.y) / S.rows;
function barBox(i) {
  const k = S.cats.length;
  const w = k <= 3 ? 122 : (k === 4 ? 108 : 92);
  const gap = k <= 3 ? 56 : (k === 4 ? 44 : 34);
  const total = k * w + (k - 1) * gap;
  const x = CHART.x + (CHART.w - total) / 2 + i * (w + gap);
  return { x, w, top: CHART.base - S.bar[i] * rowH(), h: S.bar[i] * rowH() };
}
const barOK = (i) => S.bar[i] * S.scale === S.cats[i].qty;
const barsOK = () => S.cats.every((_, i) => barOK(i));
function plateBox(i) {
  const gap = 92;
  const total = 3 * PLATES.r * 2 + 2 * gap;
  return { x: CHART.x + (CHART.w - total) / 2 + i * (PLATES.r * 2 + gap) + PLATES.r, y: PLATES.y, r: PLATES.r };
}

function step(dt) {
  S.t += dt; S.phaseT += dt;
  if (S.shake > 0) S.shake -= dt;
  if (S.wrong > 0) S.wrong -= dt;
  if (S.roll > 0) S.roll -= dt;

  if (S.phase === 'play') {
    const frozen = S.tut.on && S.tut.step < 2;
    if (!frozen && !S.done) {
      S.timeLeft -= dt;
      if (S.timeLeft <= 0) { S.timeLeft = 0; loseInk('وقتِ چاپ تمام شد!'); }
    }
    if (S.done) { S.doneT += dt; if (S.doneT > 2.2) { newStory(); S.timeLeft = L().time; } }
    if (S.tut.on) S.tut.t += dt;
  }
  bits.step(dt);
  toast.step(dt);
  draw();
}

function loseInk(msg) {
  if (S.done) return;
  S.inks--;
  S.combo = 0;
  S.shake = .5;
  sfx.nope();
  toast.say(msg, 'bad');
  if (S.inks <= 0) { S.phase = 'lost'; S.phaseT = 0; return; }
  S.timeLeft = L().time;
  newStory();
}

function setBar(i, h) {
  if (S.phase !== 'play' || S.stage !== 'bars' || S.done) return;
  h = clamp(h, 0, S.rows);
  if (h === S.bar[i]) return;
  const was = barOK(i);
  S.bar[i] = h;
  sfx.tone(300 + h * 34, .05, 'triangle', .05);
  if (!was && barOK(i)) {
    sfx.place();
    const b = barBox(i);
    bits.add(b.x + b.w / 2, b.top, 10, 'dot', [INK[S.cats[i].ink].c, '#fff'],
      { speed: 150, lift: 60, size: 3.4, life: .5, grav: 320 });
  }
  if (S.tut.on && S.tut.step === 1 && barOK(i)) { S.tut.step = 2; S.tut.t = 0; }
  if (barsOK()) {
    if (L().pie) {
      S.stage = 'plates';
      makePlates();
      S.roll = .6;
      sfx.slide();
      toast.say('ستون‌ها جور شد. حالا قالبِ دایره‌ای را انتخاب کن.', 'good');
    } else finish();
  }
}

function choosePlate(i) {
  if (S.stage !== 'plates' || S.done) return;
  S.picked = i;
  if (i === S.right) { sfx.good(); finish(); }
  else {
    S.wrong = .9;
    S.shake = .2;
    sfx.nope();
    S.timeLeft = Math.max(5, S.timeLeft - 6);
    toast.say('این قالب با ستون‌های تو جور نیست.', 'bad');
    S.picked = -1;
  }
}

function finish() {
  S.done = .001; S.doneT = 0;
  S.combo++;
  S.cleared++;
  S.score += 320 + S.cats.length * 60 + Math.round(S.timeLeft * 4) + Math.min(S.combo, 6) * 70;
  if (S.score > S.best) { S.best = S.score; saveBest(S.best); }
  bits.confetti(SCENE_W / 2, 300, 46, [P.red, P.gold, INK[1].c, INK[2].c, '#fff']);
  sfx.win();
  toast.say('روزنامه چاپ شد!', 'good');
  if (S.tut.on) S.tut.on = false;
  if (!L().endless && S.cleared >= S.quota) { S.score += 800; S.phase = 'won'; S.phaseT = 0; }
}

/* ───────── ورودی ───────── */

const TUT_TAP = [0, 2], TUT_LAST = 2;

function colAt(p) {
  if (p.y < CHART.y - 30 || p.y > CHART.base + 40) return -1;
  for (let i = 0; i < S.cats.length; i++) {
    const b = barBox(i);
    if (p.x >= b.x - 8 && p.x <= b.x + b.w + 8) return i;
  }
  return -1;
}
const rowAt = (p) => Math.round((CHART.base - p.y) / rowH());

cv.addEventListener('pointermove', (e) => {
  const p = toStage(e);
  if (S.phase !== 'play') { S.hover = inRect(p, BTN_GO) ? BTN_GO : null; cv.style.cursor = S.hover ? 'pointer' : 'default'; return; }
  if (S.drag >= 0) {
    if (e.buttons === 0 && e.pointerType === 'mouse') { S.drag = -1; return; }
    setBar(S.drag, rowAt(p));
    return;
  }
  S.hover = null;
  if (S.stage === 'bars') { const i = colAt(p); if (i >= 0) S.hover = { k: 'bar', i }; }
  else for (let i = 0; i < 3; i++) if (inCircle(p, plateBox(i), 10)) S.hover = { k: 'plate', i };
  cv.style.cursor = S.hover ? 'pointer' : 'default';
});

cv.addEventListener('pointerdown', (e) => {
  const p = toStage(e);
  if (S.phase === 'intro') { startLevel(0); return; }
  if (S.phase === 'won') {
    if (!inRect(p, BTN_GO)) return;
    if (L().endless) startLevel(S.level, true);
    else if (S.level + 1 < LEVELS.length) startLevel(S.level + 1, true);
    else startLevel(0);
    return;
  }
  if (S.phase === 'lost') { if (inRect(p, BTN_GO)) startLevel(S.level); return; }
  if (tutTap(S.tut, TUT_TAP, TUT_LAST)) return;
  S.drag = -1;
  if (S.stage === 'plates') {
    for (let i = 0; i < 3; i++) if (inCircle(p, plateBox(i), 12)) { choosePlate(i); return; }
    return;
  }
  const i = colAt(p);
  if (i >= 0) {
    S.drag = i;
    setBar(i, rowAt(p));
    try { cv.setPointerCapture(e.pointerId); } catch { /* بعضی مرورگرها */ }
  }
});

cv.addEventListener('pointerup', () => { S.drag = -1; });
cv.addEventListener('pointercancel', () => { S.drag = -1; });
cv.addEventListener('pointerleave', () => { S.drag = -1; });
addEventListener('blur', () => { S.drag = -1; });

/* ───────── ابزارِ نقاشی ───────── */

function rrPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function numText(str, x, y, o = {}) {
  ctx.save();
  ctx.font = `${o.family === 'Vazirmatn' ? (o.weight || 700) : '400'} ${o.size || 20}px "${o.family || 'Lalezar'}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  ctx.direction = 'ltr';
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.fillStyle = o.color || P.ink;
  ctx.fillText(str, x, y);
  ctx.restore();
}

function spot(rects, alpha) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, SCENE_W, SCENE_H);
  for (const r of rects) rrPath(r.x - 12, r.y - 12, r.w + 24, r.h + 24, 22);
  ctx.fillStyle = `rgba(30, 24, 14, ${alpha})`;
  ctx.fill('evenodd');
  ctx.restore();
}

function tutCard(x, y, w, lines, title) {
  const h = 26 + (title ? 44 : 0) + lines.length * 30;
  withShadow(24, 10, .4, () => {
    ctx.fillStyle = 'rgba(255, 253, 246, .98)';
    wobbleRect(x, y, w, h + 20, 16, 101, 2.2); ctx.fill();
  }, '60, 40, 16');
  ctx.fillStyle = P.red;
  wobbleRect(x, y, w, 9, 4, 103, 1); ctx.fill();
  let yy = y + 34;
  if (title) { text(title, x + w / 2, yy + 6, { size: 25, family: 'Lalezar', color: P.ink }); yy += 44; }
  for (const l of lines) { text(l, x + w / 2, yy, { size: 18, color: '#6c675f' }); yy += 30; }
  return h + 20;
}

/** یک قالبِ دایره‌ایِ چاپ. */
function plate(cx, cy, r, vals, o = {}) {
  const tot = vals.reduce((a, b) => a + b, 0) || 1;
  /* بشقابِ فلزی */
  ctx.fillStyle = P.ironDk;
  ctx.beginPath(); ctx.arc(cx, cy + 3, r + 12, 0, TAU); ctx.fill();
  ctx.fillStyle = ball(cx - r * .3, cy - r * .3, r * 2.4, P.ironLt, P.iron, P.ironDk);
  ctx.beginPath(); ctx.arc(cx, cy, r + 9, 0, TAU); ctx.fill();
  ctx.fillStyle = P.card;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill();
  let a = -Math.PI / 2;
  for (let i = 0; i < vals.length; i++) {
    const a1 = a + vals[i] / tot * TAU;
    ctx.beginPath();
    ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, a, a1); ctx.closePath();
    const mid = (a + a1) / 2;
    const g = ctx.createRadialGradient(cx + Math.cos(mid) * r * .3, cy + Math.sin(mid) * r * .3, 2, cx, cy, r);
    g.addColorStop(0, shade(INK[S.cats[i].ink].c, .3));
    g.addColorStop(1, INK[S.cats[i].ink].d);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = 'rgba(43, 42, 46, .45)'; ctx.lineWidth = 2;
    ctx.stroke();
    a = a1;
  }
  ctx.strokeStyle = P.ironDk; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();
  /* پیچ‌های بشقاب */
  for (let i = 0; i < 6; i++) {
    const b = i / 6 * TAU + .3;
    ctx.fillStyle = P.brass;
    ctx.beginPath(); ctx.arc(cx + Math.cos(b) * (r + 5), cy + Math.sin(b) * (r + 5), 3.4, 0, TAU); ctx.fill();
  }
  if (o.ring) {
    ctx.save();
    ctx.globalAlpha = o.ringAlpha === undefined ? 1 : o.ringAlpha;
    ctx.strokeStyle = o.ring; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(cx, cy, r + 18, 0, TAU); ctx.stroke();
    ctx.restore();
  }
}

/* ───────── پس‌زمینهٔ ثابت ───────── */

function paintPressStatic() {
  const g = ctx.createLinearGradient(0, 0, 0, SCENE_H);
  g.addColorStop(0, P.wallHi); g.addColorStop(.55, P.wall); g.addColorStop(1, P.wallLo);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, SCENE_W, SCENE_H);
  ctx.save();
  ctx.globalAlpha = .5;
  ctx.fillStyle = texPaper(P.wall);
  ctx.fillRect(0, 0, SCENE_W, SCENE_H);
  ctx.restore();
  /* پنجرهٔ بزرگِ چاپخانه، نورِ روز */
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const wg = ctx.createRadialGradient(240, 90, 40, 240, 90, 760);
  wg.addColorStop(0, 'rgba(255, 246, 214, .5)');
  wg.addColorStop(1, 'rgba(255, 246, 214, 0)');
  ctx.fillStyle = wg;
  ctx.fillRect(0, 0, SCENE_W, SCENE_H);
  ctx.restore();
  /* تخته‌های دیوار */
  ctx.strokeStyle = 'rgba(109, 75, 37, .16)'; ctx.lineWidth = 2;
  for (let x = 0; x < SCENE_W; x += 96) { ctx.beginPath(); ctx.moveTo(x, HUD_H); ctx.lineTo(x, 620); ctx.stroke(); }
  /* کفِ چوبی */
  ctx.fillStyle = P.woodDk;
  ctx.fillRect(0, 612, SCENE_W, SCENE_H - 612);
  ctx.fillStyle = texWood(P.wood, P.woodDk);
  ctx.fillRect(0, 620, SCENE_W, SCENE_H - 620);
  ctx.fillStyle = 'rgba(255, 246, 214, .28)';
  ctx.fillRect(0, 620, SCENE_W, 3);
  const fg = ctx.createLinearGradient(0, 620, 0, SCENE_H);
  fg.addColorStop(0, 'rgba(255, 246, 214, .16)');
  fg.addColorStop(1, 'rgba(60, 40, 16, .42)');
  ctx.fillStyle = fg;
  ctx.fillRect(0, 620, SCENE_W, SCENE_H - 620);
  /* میزِ حروف‌چینی زیرِ نمودار */
  ctx.fillStyle = 'rgba(109, 75, 37, .22)';
  ctx.beginPath(); rrPath(CHART.x - 26, CHART.y - 30, CHART.w + 52, CHART.base - CHART.y + 90, 16); ctx.fill();
}

/* ───────── صحنه ───────── */

function draw() {
  beginScene(P.wall);
  ctx.save();
  if (S.shake > 0) {
    const k = S.shake * 10;
    ctx.translate(Math.sin(S.t * 55) * k, Math.cos(S.t * 43) * k * .4);
  }
  ctx.drawImage(staticLayer('press', SCENE_W, SCENE_H, paintPressStatic), 0, 0, SCENE_W, SCENE_H);
  drawSheet();
  drawChart();
  if (S.stage === 'plates') drawPlates();
  else drawPressIdle();
  bits.draw();
  ctx.restore();

  drawHUD();
  if (!(S.phase === 'play' && S.tut.on)) toast.draw(HUD_H + 8, { good: P.good, bad: P.bad, info: P.card, ink: P.ink });
  if (S.phase === 'play' && S.tut.on) drawTutorial();
  if (S.phase === 'intro') drawIntro();
  if (S.phase === 'won') drawWon();
  if (S.phase === 'lost') drawLost();
  endScene(.13, 'rgba(70, 46, 16, .3)', .3, .1);
}

/** برگهٔ خبر: جدولِ کتاب. */
function drawSheet() {
  paper(SHEET.x, SHEET.y, SHEET.w, SHEET.h, P.card, 21, 12, .3);
  const st = STORIES[S.story];
  ctx.fillStyle = P.red;
  ctx.beginPath(); rrPath(SHEET.x + 18, SHEET.y + 16, SHEET.w - 36, 6, 3); ctx.fill();
  text(st.t, SHEET.x + SHEET.w / 2, SHEET.y + 48, { size: 22, family: 'Lalezar', color: P.ink });
  text('جدولِ خبر', SHEET.x + SHEET.w / 2, SHEET.y + 76, { size: 14, color: P.inkSoft });
  ctx.strokeStyle = 'rgba(43, 42, 46, .22)'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(SHEET.x + 22, SHEET.y + 92); ctx.lineTo(SHEET.x + SHEET.w - 22, SHEET.y + 92); ctx.stroke();
  for (let i = 0; i < S.cats.length; i++) {
    const c = S.cats[i], y = SHEET.y + 120 + i * 54;
    const ok = barOK(i);
    ctx.fillStyle = ok ? 'rgba(78, 143, 92, .14)' : 'rgba(43, 42, 46, .04)';
    ctx.beginPath(); rrPath(SHEET.x + 18, y - 22, SHEET.w - 36, 46, 9); ctx.fill();
    ctx.fillStyle = INK[c.ink].c;
    ctx.beginPath(); rrPath(SHEET.x + SHEET.w - 46, y - 12, 22, 24, 5); ctx.fill();
    text(c.name, SHEET.x + SHEET.w - 56, y, { size: 17, color: P.ink, align: 'right' });
    numText(fa(c.qty), SHEET.x + 44, y + 1, { size: 23, color: P.ink, align: 'left' });
    if (ok) {
      ctx.strokeStyle = P.good; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(SHEET.x + 84, y); ctx.lineTo(SHEET.x + 92, y + 8); ctx.lineTo(SHEET.x + 106, y - 10);
      ctx.stroke();
    }
  }
  text(st.u, SHEET.x + SHEET.w / 2, SHEET.y + SHEET.h - 26, { size: 14, color: P.inkSoft });
}

function drawChart() {
  const rh = rowH();
  /* خط‌کشِ کنارِ صفحه */
  ctx.strokeStyle = 'rgba(43, 42, 46, .16)'; ctx.lineWidth = 1.6;
  for (let r = 0; r <= S.rows; r++) {
    const y = CHART.base - r * rh;
    ctx.beginPath(); ctx.moveTo(CHART.x, y); ctx.lineTo(CHART.x + CHART.w - 96, y); ctx.stroke();
    numText(fa(r * S.scale), CHART.x + CHART.w - 62, y, { size: 19, color: r ? P.inkSoft : P.ink });
    ctx.strokeStyle = 'rgba(43, 42, 46, .5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(CHART.x + CHART.w - 96, y); ctx.lineTo(CHART.x + CHART.w - 86, y); ctx.stroke();
    ctx.strokeStyle = 'rgba(43, 42, 46, .16)'; ctx.lineWidth = 1.6;
  }
  ctx.strokeStyle = P.ink; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(CHART.x + CHART.w - 96, CHART.y - 10); ctx.lineTo(CHART.x + CHART.w - 96, CHART.base);
  ctx.lineTo(CHART.x, CHART.base);
  ctx.stroke();
  text(STORIES[S.story].u, CHART.x + CHART.w - 34, CHART.y - 22, { size: 15, color: P.inkSoft });

  for (let i = 0; i < S.cats.length; i++) {
    const b = barBox(i), c = S.cats[i];
    const ok = barOK(i);
    const hot = S.hover && S.hover.k === 'bar' && S.hover.i === i;
    /* جای خالیِ ستون */
    if (S.stage === 'bars') {
      ctx.strokeStyle = hot ? 'rgba(43, 42, 46, .3)' : 'rgba(43, 42, 46, .12)';
      ctx.lineWidth = 1.6; ctx.setLineDash([6, 7]);
      ctx.beginPath(); rrPath(b.x, CHART.y, b.w, CHART.base - CHART.y, 6); ctx.stroke();
      ctx.setLineDash([]);
    }
    if (S.bar[i] > 0) {
      withShadow(12, 5, .28, () => {
        ctx.fillStyle = INK[c.ink].d;
        ctx.beginPath(); rrPath(b.x, b.top, b.w, b.h, 5); ctx.fill();
      }, '60, 40, 16');
      const g = ctx.createLinearGradient(b.x, 0, b.x + b.w, 0);
      g.addColorStop(0, shade(INK[c.ink].c, .28));
      g.addColorStop(.55, INK[c.ink].c);
      g.addColorStop(1, INK[c.ink].d);
      ctx.fillStyle = g;
      ctx.beginPath(); rrPath(b.x, b.top, b.w - 3, b.h, 5); ctx.fill();
      /* خط‌های خانه‌ها روی ستون تا شمردنی باشد */
      ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 1.4;
      for (let r = 1; r < S.bar[i]; r++) {
        const y = CHART.base - r * rh;
        ctx.beginPath(); ctx.moveTo(b.x + 6, y); ctx.lineTo(b.x + b.w - 9, y); ctx.stroke();
      }
      /* سرِ ستون */
      ctx.fillStyle = ok ? P.good : shade(INK[c.ink].c, .45);
      ctx.beginPath(); rrPath(b.x - 3, b.top - 7, b.w + 3, 10, 4); ctx.fill();
      if (ok) {
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(b.x + b.w / 2 - 10, b.top - 22); ctx.lineTo(b.x + b.w / 2 - 3, b.top - 15);
        ctx.lineTo(b.x + b.w / 2 + 11, b.top - 30);
        ctx.stroke();
      }
    }
    /* نامِ ستون زیرِ محور */
    ctx.fillStyle = INK[c.ink].c;
    ctx.beginPath(); rrPath(b.x + b.w / 2 - 11, CHART.base + 10, 22, 10, 4); ctx.fill();
    text(c.name, b.x + b.w / 2, CHART.base + 38, { size: 16, family: 'Lalezar', color: P.ink });
    if (S.stage === 'bars' && hot) {
      ctx.strokeStyle = P.red; ctx.lineWidth = 2.4;
      ctx.beginPath(); rrPath(b.x - 4, CHART.y - 4, b.w + 8, CHART.base - CHART.y + 8, 7); ctx.stroke();
    }
  }
}

/** سه قالبِ دستگاه: یکی با ستون‌ها جور است. */
function drawPlates() {
  const k = clamp(1 - S.roll / .6, 0, 1);
  ctx.save();
  ctx.globalAlpha = k;
  ctx.fillStyle = 'rgba(43, 42, 46, .1)';
  ctx.beginPath(); rrPath(CHART.x - 20, PLATES.y - PLATES.r - 44, CHART.w + 40, PLATES.r * 2 + 74, 16); ctx.fill();
  text('کدام قالب با ستون‌های تو جور است؟', SCENE_W / 2, PLATES.y - PLATES.r - 22,
    { size: 19, family: 'Lalezar', color: P.ink });
  for (let i = 0; i < 3; i++) {
    const b = plateBox(i);
    const hot = S.hover && S.hover.k === 'plate' && S.hover.i === i;
    const bad = S.wrong > 0 && S.picked === -1 && hot;
    ctx.save();
    ctx.translate(b.x, b.y + (1 - k) * 60);
    ctx.translate(-b.x, -b.y);
    plate(b.x, b.y, b.r, S.plates[i].v,
      { ring: hot ? P.red : null, ringAlpha: .6 + .3 * Math.sin(S.t * 6) });
    ctx.restore();
    if (bad) {
      ctx.save();
      ctx.globalAlpha = clamp(S.wrong, 0, 1);
      ctx.strokeStyle = P.bad; ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(b.x - 26, b.y - 26); ctx.lineTo(b.x + 26, b.y + 26);
      ctx.moveTo(b.x + 26, b.y - 26); ctx.lineTo(b.x - 26, b.y + 26);
      ctx.stroke();
      ctx.restore();
    }
  }
  ctx.restore();
}

function drawPressIdle() {
  ctx.fillStyle = 'rgba(43, 42, 46, .08)';
  ctx.beginPath(); rrPath(CHART.x - 20, PLATES.y - PLATES.r - 44, CHART.w + 40, PLATES.r * 2 + 74, 16); ctx.fill();
  /* غلتکِ دستگاه، آمادهٔ چاپ */
  const cx = SCENE_W / 2;
  ctx.fillStyle = P.ironDk;
  ctx.beginPath(); rrPath(cx - 190, PLATES.y - 26, 380, 52, 26); ctx.fill();
  ctx.fillStyle = ball(cx - 60, PLATES.y - 16, 300, P.ironLt, P.iron, P.ironDk);
  ctx.beginPath(); rrPath(cx - 184, PLATES.y - 22, 368, 42, 21); ctx.fill();
  for (let i = -3; i <= 3; i++) {
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.beginPath(); rrPath(cx + i * 52 - 3, PLATES.y - 22, 6, 42, 3); ctx.fill();
  }
  text('اوّل ستون‌ها را جور کن', cx, PLATES.y + 52, { size: 16, color: P.inkSoft });
}

function drawHUD() {
  ctx.fillStyle = 'rgba(43, 42, 46, .94)';
  ctx.fillRect(0, 0, SCENE_W, HUD_H);
  ctx.fillStyle = P.red;
  ctx.fillRect(0, HUD_H - 3, SCENE_W, 3);
  text(L().name, SCENE_W - 24, HUD_H / 2, { size: 23, family: 'Lalezar', color: P.card, align: 'right' });
  for (let i = 0; i < 3; i++) {
    const x = SCENE_W - 226 - i * 32;
    ctx.save();
    ctx.globalAlpha = i < S.inks ? 1 : .22;
    ctx.fillStyle = i < S.inks ? INK[i].c : '#8a867e';
    ctx.beginPath(); rrPath(x - 9, HUD_H / 2 - 10, 18, 22, 4); ctx.fill();
    ctx.fillStyle = i < S.inks ? '#f3ecd8' : '#a9a49a';
    ctx.beginPath(); rrPath(x - 6, HUD_H / 2 - 14, 12, 6, 2); ctx.fill();
    ctx.restore();
  }
  if (!L().endless) {
    numText(fa(Math.min(S.cleared, L().quota)) + ' / ' + fa(L().quota), SCENE_W / 2, HUD_H / 2, { size: 22, color: P.gold });
  } else {
    text('بی‌پایان', SCENE_W / 2, HUD_H / 2, { size: 22, family: 'Lalezar', color: P.gold });
  }
  numText(fa(S.score), 24, HUD_H / 2, { size: 25, color: P.gold, align: 'left' });
  numText('بیشترین ' + fa(S.best), 140, HUD_H / 2 + 1,
    { size: 14, color: 'rgba(251, 246, 232, .5)', align: 'left', family: 'Vazirmatn', weight: 700 });
  if (S.combo > 1) numText('×' + fa(S.combo), 248, HUD_H / 2, { size: 22, color: P.gold, align: 'left' });
  const k = clamp(S.timeLeft / L().time, 0, 1);
  ctx.fillStyle = 'rgba(0,0,0,.4)';
  ctx.beginPath(); rrPath(SCENE_W / 2 - 150, HUD_H - 10, 300, 5, 3); ctx.fill();
  ctx.fillStyle = k > .3 ? P.gold : P.red;
  ctx.beginPath(); rrPath(SCENE_W / 2 - 150, HUD_H - 10, 300 * k, 5, 3); ctx.fill();
}

function drawTutorial() {
  const st = S.tut.step;
  if (st === 0) {
    spot([{ x: SHEET.x, y: SHEET.y, w: SHEET.w, h: SHEET.h }], .74);
    const h = tutCard(360, 200, 560,
      ['خبر با یک جدول می‌رسد: هر چیز چند تا.'], 'چاپخانهٔ روزنامه');
    tutMore(640, 200 + h + 8, S.t, P.ink);
  } else if (st === 1) {
    spot([{ x: CHART.x - 20, y: CHART.y - 24, w: CHART.w + 40, h: CHART.base - CHART.y + 80 }], .7);
    tutCard(300, 566, 600, ['ستون را بالا بکِش تا سرش به عددِ خط‌کش برسد.',
      'خط‌کش کنارِ صفحه است — عددهایش را بخوان.']);
  } else {
    spot([{ x: CHART.x + CHART.w - 130, y: CHART.y - 20, w: 130, h: CHART.base - CHART.y + 40 }], .72);
    const h = tutCard(120, 150, 540,
      ['خط‌کش گاهی یکی‌یکی است و گاهی پنج‌تا پنج‌تا.',
       'ستون‌ها که جور شد، دستگاه سه قالبِ دایره‌ای می‌آورد؛',
       'همانی را بردار که با ستون‌هایت جور است.'], 'خط‌کش را بخوان');
    tutMore(390, 150 + h + 8, S.t, P.ink);
  }
}

/* ───────── پرده‌ها ───────── */

function pressIcon(x, y) {
  const hs = [26, 40, 16, 32];
  for (let i = 0; i < 4; i++) {
    ctx.fillStyle = INK[i].c;
    ctx.beginPath(); rrPath(x - 56 + i * 30, y + 24 - hs[i], 22, hs[i], 4); ctx.fill();
  }
  ctx.strokeStyle = P.ink; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x - 62, y - 22); ctx.lineTo(x - 62, y + 26); ctx.lineTo(x + 56, y + 26); ctx.stroke();
}

function drawIntro() {
  overlay({
    t: S.phaseT, w: 800, h: 300, y: 128,
    paper: P.card, band: P.red, ink: P.ink, inkSoft: '#6c675f',
    icon: pressIcon,
    title: 'چاپخانهٔ روزنامه',
    body: 'خبر با یک جدول می‌رسد. ستون‌های صفحه را بالا بکِش تا هر ستون\nبه عددِ خودش برسد — بلندی را از خط‌کشِ کنارِ صفحه می‌خوانی.\nبعد دستگاه سه قالبِ دایره‌ای می‌آورد؛ همانی را بردار که جور است.',
    btn: BTN_GO, btnLabel: 'دستگاه را روشن کن', btnHot: S.hover === BTN_GO,
    btnFill: '#c33f36', btnHotFill: '#d8564c',
  });
}

function drawWon() {
  const last = S.level + 1 >= LEVELS.length;
  overlay({
    t: S.phaseT, w: 720, h: 250, y: 160,
    paper: P.card, band: P.gold, ink: P.ink, inkSoft: '#6c675f',
    icon: pressIcon,
    title: L().endless ? 'مرکّب تمام شد' : 'روزنامه رفت زیرِ چاپ!',
    body: 'امتیاز: ' + fa(S.score) + (last ? '\nهمهٔ شماره‌ها را چاپ کردی. از اوّل؟' : ''),
    btn: BTN_GO, btnLabel: last ? 'دوباره' : 'خبرِ بعد', btnHot: S.hover === BTN_GO,
    btnFill: '#c33f36', btnHotFill: '#d8564c',
  });
}

function drawLost() {
  overlay({
    t: S.phaseT, w: 720, h: 250, y: 160,
    paper: P.card, band: P.bad, ink: P.ink, inkSoft: '#6c675f',
    icon: (x, y) => {
      ctx.fillStyle = '#8a867e';
      ctx.beginPath(); rrPath(x - 16, y - 16, 32, 40, 6); ctx.fill();
      ctx.fillStyle = '#c8c3b8';
      ctx.beginPath(); rrPath(x - 10, y - 24, 20, 10, 3); ctx.fill();
      pressIcon(x + 70, y);
    },
    title: 'مرکّب‌ها تمام شد',
    body: 'امتیاز: ' + fa(S.score) + '\nخط‌کش را بخوان: هر خانه چندتاست؟',
    btn: BTN_GO, btnLabel: 'دوباره', btnHot: S.hover === BTN_GO,
    btnFill: '#c33f36', btnHotFill: '#d8564c',
  });
}
