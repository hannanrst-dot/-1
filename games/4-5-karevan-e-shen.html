<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#7d4258">
<title>کاروانِ شن — تقسیم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>
  /* صفحه نباید هیچ‌جا اسکرول یا زوم شود؛ بازی باید مثل یک برنامه رفتار کند. */
  html, body {
    margin: 0; padding: 0; background: #7d4258;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body {
    position: fixed; inset: 0;          /* جلوی کشیده‌شدنِ صفحه در سافاریِ گوشی */
    width: 100%; height: 100vh; height: 100dvh;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none; -webkit-touch-callout: none;
  }

  /* گوشیِ عمودی صحنه را ریز می‌کند؛ بچه باید گوشی را بچرخاند. */
  #rotate { display: none; }
  @media (orientation: portrait) and (max-width: 860px) {
    #stage { display: none; }
    #rotate {
      display: flex; position: fixed; inset: 0;
      z-index: 9;
      flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      background: #7d4258; color: #f6ead2;
      font: 700 20px "Vazirmatn", Tahoma, sans-serif; text-align: center; padding: 32px;
    }
    #rotate svg { animation: tilt 2.4s ease-in-out infinite; }
    @keyframes tilt { 0%, 45% { transform: rotate(0deg); } 65%, 100% { transform: rotate(-90deg); } }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="rotate">
  <svg width="86" height="126" viewBox="0 0 86 126" fill="none" aria-hidden="true">
    <rect x="3" y="3" width="80" height="120" rx="12" stroke="#e8b448" stroke-width="5"/>
    <rect x="15" y="19" width="56" height="88" rx="5" fill="#e8b448" opacity=".28"/>
    <circle cx="43" cy="115" r="4" fill="#e8b448"/>
  </svg>
  <div>گوشی را بچرخان</div>
  <div style="font-weight:400;opacity:.7;font-size:16px">این بازی خوابیده بازی می‌شود</div>
</div>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   هستهٔ مشترکِ بازی‌ها — سبک «کاغذبُری»
   ───────────────────────────────────────────────────────────────────────
   این فایل جعبه‌ابزار است، نه چارچوب: هر بازی حلقه و وضعیت خودش را دارد
   و فقط از این توابع برای کشیدن استفاده می‌کند. دلیلش این است که هر بازی
   باید حس‌وحال خودش را داشته باشد، نه اینکه همه شبیه هم دربیایند.

   قاعده‌های ثابتِ تصویری:
   • نور همیشه از بالا-چپ می‌تابد، پس سایه‌ها به پایین-راست می‌افتند.
   • هیچ لبه‌ای کاملاً صاف نیست؛ همه کمی موج دارند (انگار با قیچی بریده).
   • هیچ خاکستریِ خالصی نداریم؛ همه‌ی خنثی‌ها به گرمیِ صحنه می‌زنند.
   • یک لایه‌ی دانه‌دانه‌ی کاغذ روی کلِ تصویر ضرب می‌شود.
   ═══════════════════════════════════════════════════════════════════════ */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const FA_D = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
const fa = (n) => String(n).replace(/\d/g, (d) => FA_D[+d]);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeIn = (t) => t * t * t;
const easeInOut = (t) => (t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2);
const easeBack = (t) => 1 + 2.7 * Math.pow(t-1, 3) + 1.7 * Math.pow(t-1, 2);
const easeElastic = (t) => t === 0 || t === 1 ? t : Math.pow(2, -9*t) * Math.sin((t*10 - .75) * 2.094) + 1;

/** تصادفِ تکرارپذیر: با یک بذر همیشه همان عدد. برای اینکه تزئین‌ها هر فریم نپرند. */
function noise1(x) {
  const s = Math.sin(x * 127.1) * 43758.5453;
  return s - Math.floor(s);
}
const pick = (arr, seed) => arr[Math.floor(noise1(seed) * arr.length) % arr.length];

/* ───────── بوم و صحنهٔ ثابت ───────── */

let ctx, SW, SH, CV, _refit = null;
let view = { scale: 1, ox: 0, oy: 0, w: 0, h: 0, dpr: 1 };
let _grain = null;

function initStage(canvas, w, h) {
  CV = canvas; SW = w; SH = h;
  ctx = canvas.getContext('2d');

  /* اندازه را از خودِ بوم می‌گیریم نه از innerHeight؛ چون در سافاریِ گوشی
     نوارِ آدرس باز و بسته می‌شود و innerHeight دروغ می‌گوید. */
  const fit = () => {
    const r = canvas.getBoundingClientRect();
    const vw = Math.round(r.width), vh = Math.round(r.height);
    if (vw < 20 || vh < 20) return;
    const dpr = Math.min(devicePixelRatio || 1, QUALITY > 0 ? 2 : 1);
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    const scale = Math.min(vw / SW, vh / SH);
    view = { scale, ox: (vw - SW*scale)/2, oy: (vh - SH*scale)/2, w: vw, h: vh, dpr };
    _grain = buildGrain();
  };
  _refit = fit;
  addEventListener('resize', fit);
  /* چرخاندنِ گوشی: اندازهٔ درست چند لحظه بعد می‌رسد، پس چندبار اندازه می‌گیریم. */
  addEventListener('orientationchange', () => {
    fit(); setTimeout(fit, 140); setTimeout(fit, 460);
  });
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(canvas);

  /* صدا در گوشی فقط بعد از اوّلین لمس اجازهٔ پخش دارد. */
  const unlock = () => { sfx._c(); removeEventListener('pointerdown', unlock); removeEventListener('touchstart', unlock); };
  addEventListener('pointerdown', unlock, { passive: true });
  addEventListener('touchstart', unlock, { passive: true });
  /* نگه‌داشتنِ انگشت نباید منوی مرورگر را باز کند. */
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  fit();
  return ctx;
}

/** قابِ صحنه را باز می‌کند: بعد از این، مختصات همیشه در فضای SW×SH است. */
function beginScene(bg) {
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, view.w, view.h);
  ctx.save();
  ctx.translate(view.ox, view.oy);
  ctx.scale(view.scale, view.scale);
  ctx.beginPath();
  ctx.rect(0, 0, SW, SH);
  ctx.clip();
}

/** بافتِ کاغذ، تیرگیِ گوشه‌ها، رنگ‌بندی و درخششِ نور را می‌گذارد و قاب را می‌بندد. */
function endScene(grainAlpha = .15, vignette = 'rgba(48,28,14,.30)', bloom = .34, grade = .14) {
  if (QUALITY < 1) { grade = 0; grainAlpha *= .5; }
  if (QUALITY < 2) bloom = 0;
  if (grade > 0) {
    /* رنگ‌بندیِ نرم: بالای صحنه گرم‌تر، پایین سردتر — عمق می‌دهد */
    const g = ctx.createLinearGradient(0, 0, 0, SH);
    g.addColorStop(0, `rgba(255, 214, 150, ${grade})`);
    g.addColorStop(.55, 'rgba(255, 255, 255, 0)');
    g.addColorStop(1, `rgba(40, 60, 110, ${grade * .9})`);
    ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalCompositeOperation = 'source-over';
  }
  if (_grain && grainAlpha > 0) {
    ctx.globalCompositeOperation = 'multiply';
    ctx.globalAlpha = grainAlpha;
    ctx.fillStyle = _grain;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
  if (vignette) {
    const g = ctx.createRadialGradient(SW/2, SH/2, SH*.42, SW/2, SH/2, SH*1.05);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, vignette);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
  }
  ctx.restore();
  bloomPass(bloom);
}

/* ───────── درخششِ نور (bloom) ─────────
   قابِ رسم‌شده را کوچک می‌کنیم، دو بار در خودش ضرب می‌کنیم تا فقط
   روشن‌ها بمانند، محوش می‌کنیم و با حالتِ «lighter» رویش می‌گذاریم.
   نتیجه: چراغ‌ها، شعله‌ها و رنگ‌های روشن نور پخش می‌کنند. */
let _bl, _blc, _bl2, _bl2c, _blNo = false, _blTick = 0;

function bloomPass(amount) {
  if (!amount || _blNo || !CV.width) return;
  /* کوچک‌کردن و بزرگ‌کردنِ دوباره، خودش محو می‌کند — از filter خیلی ارزان‌تر است */
  const W = Math.max(4, Math.round(CV.width * .2)), H = Math.max(4, Math.round(CV.height * .2));
  const W2 = Math.max(2, Math.round(W * .28)), H2 = Math.max(2, Math.round(H * .28));
  try {
    if (!_bl) {
      _bl = document.createElement('canvas'); _blc = _bl.getContext('2d');
      _bl2 = document.createElement('canvas'); _bl2c = _bl2.getContext('2d');
      if (!_blc || !_bl2c) { _blNo = true; return; }
    }
    if (_bl.width !== W || _bl.height !== H) { _bl.width = W; _bl.height = H; }
    if (_bl2.width !== W2 || _bl2.height !== H2) { _bl2.width = W2; _bl2.height = H2; }
    /* ساختنِ نور یک قاب در میان کافی است؛ گذاشتنش هر قاب. */
    _blTick = (_blTick + 1) & 1;
    if (!_blTick) {
      _blc.globalCompositeOperation = 'source-over';
      _blc.clearRect(0, 0, W, H);
      _blc.drawImage(CV, 0, 0, W, H);
      _blc.globalCompositeOperation = 'multiply';
      _blc.drawImage(_bl, 0, 0);
      _blc.drawImage(_bl, 0, 0);
      _blc.globalCompositeOperation = 'source-over';
      _bl2c.clearRect(0, 0, W2, H2);
      _bl2c.drawImage(_bl, 0, 0, W2, H2);
    }

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = amount;
    ctx.drawImage(_bl2, 0, 0, CV.width, CV.height);
    ctx.restore();
  } catch (e) { _blNo = true; }
}

/* ───────── لایهٔ ثابت ─────────
   هرچه در صحنه تکان نمی‌خورد را یک‌بار می‌کشیم و بعد فقط کپی می‌کنیم. */
const _layers = {};
function staticLayer(key, w, h, paint) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const L = _layers[key];
  if (L && L.q === q && L.w === w && L.h === h) return L.cv;
  const off = document.createElement('canvas');
  off.width = Math.max(1, Math.round(w * q));
  off.height = Math.max(1, Math.round(h * q));
  const c = off.getContext('2d');
  c.setTransform(q, 0, 0, q, 0, 0);
  const prev = ctx;
  ctx = c;
  try { paint(); } finally { ctx = prev; }
  _layers[key] = { cv: off, q, w, h };
  return off;
}

/* ───────── نورپردازی و بافت ─────────
   کارِ این‌ها این است که هیچ سطحی «تختِ یک‌رنگ» نماند. */

/** شیبِ عمودی: بالا روشن، پایین تیره. */
function vgrad(y0, y1, top, bot) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, top); g.addColorStop(1, bot);
  return g;
}

/** حجمِ کروی: نور از بالا-چپ، سایه در پایین-راست. */
function ball(cx, cy, r, lit, base, dark) {
  const g = ctx.createRadialGradient(cx - r * .38, cy - r * .42, r * .06, cx, cy, r * 1.06);
  g.addColorStop(0, lit); g.addColorStop(.45, base); g.addColorStop(1, dark);
  return g;
}

/** لبهٔ روشنِ بالا-چپِ یک مسیر — همان «rim light». */
function rim(pathFn, col, w = 2.2) {
  ctx.save();
  ctx.beginPath(); pathFn();
  ctx.clip();
  ctx.beginPath(); pathFn();
  ctx.strokeStyle = col; ctx.lineWidth = w * 2; ctx.lineJoin = 'round';
  ctx.translate(-w * .5, -w * .6);
  ctx.stroke();
  ctx.restore();
}

/** سایهٔ چسبیده به زمین — چیزها را روی سطح می‌نشاند. */
function contact(cx, cy, rx, ry, alpha = .26) {
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
  g.addColorStop(0, `rgba(20, 12, 6, ${alpha})`);
  g.addColorStop(1, 'rgba(20, 12, 6, 0)');
  ctx.save();
  ctx.fillStyle = g;
  ctx.translate(cx, cy); ctx.scale(1, ry / Math.max(rx, ry));
  ctx.beginPath(); ctx.arc(0, 0, Math.max(rx, ry), 0, TAU); ctx.fill();
  ctx.restore();
}

const _tex = {};
/** بافتِ تکرارشونده؛ یک‌بار ساخته و بعد از حافظه خوانده می‌شود. */
function texture(key, w, h, paint) {
  if (_tex[key]) return _tex[key];
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const c = off.getContext('2d');
  paint(c, w, h);
  _tex[key] = ctx.createPattern(off, 'repeat');
  return _tex[key];
}

/** رگهٔ چوب. */
function texWood(base, grain) {
  return texture('w' + base + grain, 120, 120, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = grain; c.lineWidth = 1.4;
    for (let i = 0; i < 9; i++) {
      c.globalAlpha = .18 + noise1(i * 3.1) * .3;
      c.beginPath();
      const y0 = i * 14 + noise1(i) * 6;
      c.moveTo(0, y0);
      for (let x = 0; x <= w; x += 10) c.lineTo(x, y0 + Math.sin(x * .09 + i) * 2.6);
      c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** تارِ پارچه. */
function texCloth(base, thread) {
  return texture('c' + base + thread, 16, 16, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = thread; c.lineWidth = 1; c.globalAlpha = .5;
    for (let i = 0; i < w; i += 4) {
      c.beginPath(); c.moveTo(i, 0); c.lineTo(i, h); c.stroke();
      c.beginPath(); c.moveTo(0, i); c.lineTo(w, i); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** دانه‌های سنگ. */
function texStone(base, spec) {
  return texture('s' + base + spec, 90, 90, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) {
      c.globalAlpha = .05 + noise1(i * 1.7) * .16;
      c.fillStyle = spec;
      const r = .6 + noise1(i * 5.3) * 1.9;
      c.beginPath();
      c.arc(noise1(i * 2.1) * w, noise1(i * 3.7 + 1) * h, r, 0, TAU);
      c.fill();
    }
    c.globalAlpha = 1;
  });
}

/** الیافِ کاغذ. */
function texPaper(base) {
  return texture('p' + base, 100, 100, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 130; i++) {
      c.globalAlpha = .04 + noise1(i * 2.3) * .07;
      c.strokeStyle = i % 2 ? '#ffffff' : '#5a4326';
      c.lineWidth = .9;
      const x = noise1(i * 1.3) * w, y = noise1(i * 4.1 + 2) * h;
      const a = noise1(i * 7.7) * TAU, l = 4 + noise1(i * 9.1) * 12;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

function buildGrain() {
  const s = 260;
  const off = document.createElement('canvas');
  off.width = off.height = s;
  const c = off.getContext('2d');
  const img = c.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    const v = 214 + Math.random() * 41;
    img.data[i*4] = v; img.data[i*4+1] = v; img.data[i*4+2] = v; img.data[i*4+3] = 255;
  }
  c.putImageData(img, 0, 0);
  return ctx.createPattern(off, 'repeat');
}

function toStage(e) {
  const r = CV.getBoundingClientRect();
  return {
    x: (e.clientX - r.left - view.ox) / view.scale,
    y: (e.clientY - r.top - view.oy) / view.scale,
  };
}

const inRect = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
const inCircle = (p, b, pad = 0) => Math.hypot(p.x - b.x, p.y - b.y) <= b.r + pad;

/* ───────── قلم‌های کاغذبُری ───────── */

/** دایره‌ای که انگار با قیچی بریده شده. */
function wobbleCircle(cx, cy, r, seed = 0, amp = 2.2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const rr = r + Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp * .45;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** بیضیِ ناصاف — برای چیزهایی که گرد نیستند ولی نرم‌اند. */
function wobbleEllipse(cx, cy, rx, ry, rot = 0, seed = 0, amp = 2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const w = 1 + (Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp*.45) / Math.max(rx, ry);
    const px = Math.cos(a) * rx * w, py = Math.sin(a) * ry * w;
    const x = cx + px*Math.cos(rot) - py*Math.sin(rot);
    const y = cy + px*Math.sin(rot) + py*Math.cos(rot);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** مستطیلِ گِرد با گوشه‌های کمی کج. */
function wobbleRect(x, y, w, h, r = 12, seed = 0, amp = 1.6) {
  const j = (k) => (noise1(seed*9.7 + k) - .5) * amp * 2;
  ctx.beginPath();
  ctx.moveTo(x + r + j(1), y + j(2));
  ctx.lineTo(x + w - r + j(3), y + j(4));
  ctx.quadraticCurveTo(x + w + j(5), y + j(6), x + w + j(7), y + r + j(8));
  ctx.lineTo(x + w + j(9), y + h - r + j(10));
  ctx.quadraticCurveTo(x + w + j(11), y + h + j(12), x + w - r + j(13), y + h + j(14));
  ctx.lineTo(x + r + j(15), y + h + j(16));
  ctx.quadraticCurveTo(x + j(17), y + h + j(18), x + j(19), y + h - r + j(20));
  ctx.lineTo(x + j(21), y + r + j(22));
  ctx.quadraticCurveTo(x + j(23), y + j(24), x + r + j(1), y + j(2));
  ctx.closePath();
}

/** سایهٔ نرم؛ نور از بالا-چپ. */
function withShadow(blur, dy, alpha, fn, hue = '78, 46, 24') {
  ctx.save();
  ctx.shadowColor = `rgba(${hue}, ${alpha})`;
  ctx.shadowBlur = blur;
  ctx.shadowOffsetY = dy;
  ctx.shadowOffsetX = dy * .35;
  fn();
  ctx.restore();
}

/** یک برگه‌ی کاغذ با سایه — پایه‌ی همه‌ی کارت‌ها و تابلوها. */
function paper(x, y, w, h, fill, seed = 1, r = 12, shadow = .26) {
  withShadow(16, 7, shadow, () => {
    ctx.fillStyle = fill;
    wobbleRect(x, y, w, h, r, seed, 2);
    ctx.fill();
  });
  /* الیافِ کاغذ و لبهٔ روشن، تا سطح تخت نماند */
  ctx.save();
  ctx.beginPath(); wobbleRect(x, y, w, h, r, seed, 2); ctx.clip();
  ctx.globalAlpha = .5;
  ctx.fillStyle = texPaper(fill);
  ctx.fillRect(x, y, w, h);
  ctx.globalAlpha = 1;
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.4, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(90,60,20,.1)');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
}

function text(str, x, y, o = {}) {
  const size = o.size || 20;
  const fam = o.family || 'Vazirmatn';
  ctx.save();
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.font = `${fam === 'Lalezar' ? '400' : (o.weight || 700)} ${size}px "${fam}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.baseline || 'middle';
  ctx.fillStyle = o.color || '#43291b';
  ctx.direction = 'rtl';
  if (o.stroke) {
    ctx.lineWidth = o.strokeWidth || 5;
    ctx.strokeStyle = o.stroke;
    ctx.lineJoin = 'round';
    ctx.strokeText(str, x, y, o.maxWidth);
  }
  ctx.fillText(str, x, y, o.maxWidth);
  ctx.restore();
}

/** متنِ چندخطی که خودش می‌شکند. ارتفاعِ اشغال‌شده را برمی‌گرداند. */
function textWrap(str, x, y, maxW, o = {}) {
  const size = o.size || 19, lh = o.lineHeight || size * 1.7;
  ctx.font = `${o.weight || 700} ${size}px "${o.family || 'Vazirmatn'}", Tahoma, sans-serif`;
  const lines = [];
  for (const para of str.split('\n')) {
    let line = '';
    for (const wd of para.split(' ')) {
      const t = line ? line + ' ' + wd : wd;
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = wd; }
      else line = t;
    }
    lines.push(line);
  }
  lines.forEach((l, i) => text(l, x, y + i * lh, o));
  return lines.length * lh;
}

/* ───────── ذره‌ها ───────── */

class Bits {
  constructor() { this.list = []; }
  add(x, y, n, kind, colors, opts = {}) {
    for (let i = 0; i < n; i++) {
      const a = opts.dir !== undefined ? opts.dir + (Math.random()-.5) * (opts.spread || 1) : Math.random() * TAU;
      const sp = (opts.speed || 200) * (.4 + Math.random());
      this.list.push({
        kind, x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - (opts.lift || 0),
        r: (opts.size || 4) * (.5 + Math.random()),
        rot: Math.random() * TAU, vr: (Math.random()-.5) * 10,
        col: colors[(Math.random() * colors.length) | 0],
        grav: opts.grav === undefined ? 620 : opts.grav,
        drag: opts.drag || .995,
        life: (opts.life || .9) * (.6 + Math.random() * .8), age: 0,
      });
    }
  }
  confetti(x, y, n, colors) {
    this.add(x, y, n, 'flake', colors, { speed: 420, lift: 190, size: 5, life: 1.6, grav: 780 });
  }
  spark(x, y, n, colors) {
    this.add(x, y, n, 'dot', colors, { speed: 180, lift: 30, size: 3.4, life: .7, grav: 260, drag: .93 });
  }
  step(dt) {
    for (const p of this.list) {
      p.age += dt;
      p.vy += p.grav * dt;
      p.vx *= p.drag; p.vy *= p.drag;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    }
    this.list = this.list.filter((p) => p.age < p.life);
  }
  draw() {
    for (const p of this.list) {
      const k = clamp(1 - p.age / p.life, 0, 1);
      ctx.save();
      ctx.globalAlpha = k;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.col;
      if (p.kind === 'flake') ctx.fillRect(-p.r, -p.r*1.5, p.r*2, p.r*3);
      else if (p.kind === 'leaf') { wobbleEllipse(0, 0, p.r*1.8, p.r*.8, 0, p.r, .6); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(0, 0, p.r * k, 0, TAU); ctx.fill(); }
      ctx.restore();
    }
  }
  clear() { this.list.length = 0; }
}

const sfx = {
  ac: null, on: true,
  _c() {
    if (!this.on) return null;
    if (!this.ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; this.ac = new A(); }
    if (this.ac.state === 'suspended') this.ac.resume();
    return this.ac;
  },
  tone(f, dur = .16, type = 'sine', gain = .13, delay = 0) {
    const c = this._c(); if (!c) return;
    const t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(t0 + dur + .04);
  },
  tap()  { this.tone(430, .07, 'triangle', .09); },
  place(){ this.tone(620, .11, 'sine', .12); },
  pop()  { this.tone(760, .09, 'sine', .11); },
  slide(){ this.tone(240, .22, 'sine', .07); },
  good() { [523, 659, 784].forEach((f,i) => this.tone(f, .22, 'sine', .13, i*.07)); },
  win()  { [523, 659, 784, 1047].forEach((f,i) => this.tone(f, .34, 'triangle', .13, i*.10)); },
  nope() { this.tone(180, .2, 'sawtooth', .07); },
  tick() { this.tone(1100, .04, 'square', .05); },
};

/* ───────── قطعه‌های آماده ───────── */

function star(x, y, r, col, rot = 0) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = col;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI/2 + i * Math.PI/5;
    const rr = i % 2 ? r * .45 : r;
    const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/** دکمهٔ کاغذی. hovered را خودِ بازی می‌دهد؛ اینجا فقط کشیده می‌شود. */
/** رنگ را روشن‌تر (k>0) یا تیره‌تر (k<0) می‌کند. */
function shade(col, k) {
  const c = String(col).trim();
  let r, g2, b2;
  if (c[0] === '#') {
    const h = c.length === 4 ? c[1]+c[1]+c[2]+c[2]+c[3]+c[3] : c.slice(1, 7);
    r = parseInt(h.slice(0,2), 16); g2 = parseInt(h.slice(2,4), 16); b2 = parseInt(h.slice(4,6), 16);
  } else {
    const m = c.match(/[\d.]+/g);
    if (!m || m.length < 3) return col;
    r = +m[0]; g2 = +m[1]; b2 = +m[2];
  }
  const f = (v) => Math.round(clamp(k < 0 ? v * (1 + k) : v + (255 - v) * k, 0, 255));
  return 'rgb(' + f(r) + ',' + f(g2) + ',' + f(b2) + ')';
}

function button(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 3 : 0;
  const fill = o.disabled ? (o.off || '#bcaa92') : (hot ? (o.hotFill || o.fill) : o.fill);
  const r = o.r === undefined ? 14 : o.r;
  /* لبهٔ زیرینِ تیره — دکمه از صفحه بیرون می‌زند */
  ctx.fillStyle = shade(fill, -.36);
  wobbleRect(b.x, b.y + dy + 7, b.w, b.h, r, b.x + b.y, 2);
  ctx.fill();
  withShadow(hot ? 22 : 14, hot ? 5 : 8, .32, () => {
    ctx.fillStyle = fill;
    wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2);
    ctx.fill();
  });
  /* حجم: روشن از بالا، تیره به پایین */
  ctx.save();
  ctx.beginPath(); wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2); ctx.clip();
  const g = ctx.createLinearGradient(0, b.y + dy, 0, b.y + dy + b.h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.45, 'rgba(255,255,255,.04)');
  g.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = g;
  ctx.fillRect(b.x, b.y + dy, b.w, b.h);
  /* برقِ باریکِ لبهٔ بالا */
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.fillRect(b.x + r, b.y + dy + 2, b.w - r * 2, 2);
  ctx.restore();
  text(label, b.x + b.w/2, b.y + b.h/2 + dy - (o.sub ? 9 : 0), {
    size: o.size || 26, color: o.color || '#fdf6e8', family: o.family || 'Lalezar',
  });
  if (o.sub) text(o.sub, b.x + b.w/2, b.y + b.h/2 + dy + 17,
    { size: 14, color: o.subColor || 'rgba(255,255,255,.88)' });
}

/** دکمهٔ گرد کوچک (مثل + و −). */
function roundButton(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 2 : 0;
  withShadow(10, hot ? 3 : 5, .3, () => {
    ctx.fillStyle = o.disabled ? '#cbbba3' : (hot ? (o.hotFill || o.fill) : o.fill);
    wobbleCircle(b.x, b.y + dy, b.r, b.x, 1.4);
    ctx.fill();
  });
  text(label, b.x, b.y + dy - 1,
    { size: o.size || 32, color: o.disabled ? '#a8988a' : (o.color || '#fdf6e8'), family: 'Lalezar' });
}

/** پرده‌ی تمام‌صفحه: برای شروعِ پرده و برای جشنِ پایان. */
function overlay(o) {
  const k = easeOut(clamp(o.t / .5, 0, 1));
  ctx.fillStyle = `rgba(30, 22, 16, ${.66 * k})`;
  ctx.fillRect(0, 0, SW, SH);

  const w = o.w || 700, h = o.h || 290;
  const x = (SW - w) / 2, y = o.y || (SH * .22);
  const s = lerp(.9, 1, easeBack(clamp(o.t / .65, 0, 1)));
  ctx.save();
  ctx.translate(SW/2, y + h/2);
  ctx.scale(s, s);
  ctx.translate(-SW/2, -(y + h/2));

  withShadow(30, 14, .42, () => {
    ctx.fillStyle = o.paper || '#fbf3e2';
    wobbleRect(x, y, w, h, 18, 121, 2.4);
    ctx.fill();
  });
  ctx.fillStyle = o.band || '#c8434f';
  wobbleRect(x, y, w, 12, 6, 123, 1);
  ctx.fill();

  if (o.icon) o.icon(SW/2, y + 56);
  text(o.title, SW/2, y + (o.icon ? 108 : 62),
    { size: o.titleSize || 36, color: o.ink || '#43291b', family: 'Lalezar', alpha: k });
  textWrap(o.body, SW/2, y + (o.icon ? 158 : 116), w - 90,
    { size: 19, color: o.inkSoft || '#8a6a52', alpha: k });
  ctx.restore();

  button(o.btn, o.btnLabel, { hot: o.btnHot, fill: o.btnFill || '#7fa356', hotFill: o.btnHotFill || '#8fb45f', size: 28 });
}

/** پیامِ کوتاهِ بالای صحنه. */
class Toast {
  constructor() { this.msg = null; this.t = 0; this.kind = 'info'; }
  say(msg, kind = 'info') { this.msg = msg; this.kind = kind; this.t = 2.6; }
  step(dt) { if (this.t > 0) { this.t -= dt; if (this.t <= 0) this.msg = null; } }
  draw(y = 24, colors = {}) {
    if (!this.msg) return;
    const k = clamp(this.t, 0, 1) * clamp((2.6 - this.t) * 5, 0, 1);
    ctx.save();
    ctx.globalAlpha = k;
    ctx.font = `700 19px "Vazirmatn", Tahoma, sans-serif`;
    const w = ctx.measureText(this.msg).width + 76;
    const fill = this.kind === 'good' ? (colors.good || '#7fa356')
               : this.kind === 'bad' ? (colors.bad || '#c8434f')
               : (colors.info || '#fbf3e2');
    paper(SW/2 - w/2, y, w, 48, fill, 151, 12, .3);
    text(this.msg, SW/2, y + 25,
      { size: 19, color: this.kind === 'info' ? (colors.ink || '#43291b') : '#fff8ec' });
    ctx.restore();
  }
}

/* ───────── آموزشِ پرده‌ای ─────────
   پرده‌هایی که منتظرِ کارِ بچه نیستند با یک ضربه جلو می‌روند. تایمر فقط
   پشتیبان است؛ بچهٔ کلاس سومی باید فرصتِ خواندن داشته باشد، نه اینکه
   متن قبل از تمام شدنِ خواندنش برود.                                    */

/** اگر پردهٔ فعلی خواندنی است، ضربه را می‌خورد و می‌رود پردهٔ بعد. */
function tutTap(tut, tapSteps, lastStep) {
  if (!tut.on || tapSteps.indexOf(tut.step) < 0) return false;
  if (tut.step >= lastStep) tut.on = false;
  else { tut.step++; tut.t = 0; }
  sfx.tap();
  return true;
}

/** نشانهٔ «برای ادامه بزن» — زیرِ کارتِ آموزش. */
function tutMore(cx, y, t, ink = '#3a2a18', bg = 'rgba(255, 250, 238, .94)') {
  ctx.save();
  ctx.globalAlpha = .62 + .38 * Math.sin(t * 3.2);
  ctx.font = '700 15px "Vazirmatn", Tahoma, sans-serif';
  const label = 'برای ادامه، هرجا را بزن';
  const w = ctx.measureText(label).width + 40, h = 32, x = cx - w / 2, r = 16;
  withShadow(10, 4, .3, () => {
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath(); ctx.fill();
  });
  text(label, cx, y + h / 2, { size: 15, color: ink });
  ctx.restore();
}

/** فونت‌ها را می‌آورد و بعد بازی را شروع می‌کند.
    مهم: هر دو راه (رسیدنِ فونت و مهلتِ پشتیبان) ممکن است برسند، ولی
    شروع فقط باید یک بار انجام شود؛ وگرنه دو حلقهٔ فریم راه می‌افتد و
    بازی دوبرابر سریع می‌شود. */
function whenFontsReady(start) {
  let done = false;
  const go = () => { if (done) return; done = true; start(); };
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('400 40px Lalezar'),
      document.fonts.load('700 20px Vazirmatn'),
      document.fonts.load('900 20px Vazirmatn'),
    ]).then(go, go);
    setTimeout(go, 2600);
  } else go();
}

/** حلقهٔ فریم با dtِ محدودشده. */
/* ───────── کیفیتِ خودکار ─────────
   اگر دستگاه کُند بود، اوّل درخشش و بعد رنگ‌بندی خاموش می‌شود تا بازی
   روان بماند. روی دستگاهِ قوی همه‌چیز روشن است. */
let QUALITY = 2;
let _fAcc = 0, _fN = 0, _qHold = 0;

function _qualityTick(gap) {
  if (gap <= 0 || gap > 200) return;
  _fAcc += gap; _fN++;
  if (_fN < 45) return;
  const avg = _fAcc / _fN;
  _fAcc = 0; _fN = 0;
  if (_qHold > 0) { _qHold--; return; }
  const before = QUALITY;
  if (avg > 25 && QUALITY > 0) { QUALITY--; _qHold = 3; }
  else if (avg < 18.5 && QUALITY < 2) { QUALITY++; _qHold = 6; }
  /* در پایین‌ترین کیفیت، صحنه را با نقطه‌های کمتر می‌کشیم */
  if (before !== QUALITY && (before === 0 || QUALITY === 0) && _refit) _refit();
}

/* یک حلقه، نه بیشتر — دو حلقه یعنی زمانِ بازی دوبرابر می‌گذرد. */
let _looping = false;
function runLoop(step) {
  if (_looping) return;
  _looping = true;
  let last = performance.now();
  const frame = (now) => {
    const gap = now - last;
    const dt = Math.min(gap / 1000, 1/20);
    last = now;
    _qualityTick(gap);
    step(dt);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

  cleared: 0, quota: 0,
  banner: null, log: [],
  sw: null,           // کشیدنِ انگشت
  t: 0, phaseT: 0, hover: null, shake: 0, blow: 0,
  grains: [], depart: 0,
  tut: { on: true, step: 0, t: 0 },
};

const bits = new Bits();
const toast = new Toast();
const L = () => LEVELS[S.level];
const maxCamels = () => Math.min(8, L().maxK);
const KINDS = ['A', 'B', 'C'];
const roundKind = () => (L().kind === 'M' ? pick(KINDS, Math.random() * 999) : L().kind);

function loadBest() { try { return +localStorage.getItem('karevan-best') || 0; } catch { return 0; } }
function saveBest(v) { try { localStorage.setItem('karevan-best', String(v)); } catch { /* حالتِ خصوصی */ } }

/* جای هر شتر روی خط، وقتی n شتر داریم. */
function slotX(i, n) { return 749 - (n - 1) * PITCH / 2 + i * PITCH; }
function reflow() { S.camels.forEach((c, i) => { c.tx = slotX(i, S.camels.length); }); }
function newCamel(x) { return { load: 0, x, tx: x, bob: Math.random() * TAU, kick: 0, gone: 0 }; }

/* ───────── حلقه ───────── */

const cv = document.getElementById('stage');
initStage(cv, SCENE_W, SCENE_H);
S.best = loadBest();
for (let i = 0; i < 70; i++) {
  S.grains.push({ x: Math.random() * SCENE_W, y: HORIZON + Math.random() * (SCENE_H - HORIZON),
                  sp: 40 + Math.random() * 120, r: .8 + Math.random() * 1.8, a: .1 + Math.random() * .25 });
}
whenFontsReady(() => runLoop(step));

function newRound() {
  const lv = L();
  S.kind = roundKind();
  S.storm = 0;
  S.fly = [];
  S.depart = 0;
  const k = 2 + Math.floor(Math.random() * (Math.min(lv.maxK, 8) - 1));
  const CAP = 42;                       // بیش از این، شمردنش برای بچّه خسته‌کننده است
  if (S.kind === 'B') {
    const m = clamp(2 + Math.floor(Math.random() * 4), 2, Math.max(2, Math.floor(CAP / k)));
    S.need = m;
    S.total = S.pile = m * k;
    S.camels = [newCamel(slotX(0, 1))];                             // بقیه را خودش می‌آورد
  } else {
    const q = clamp(2 + Math.floor(Math.random() * (lv.maxQ - 1)), 2, Math.max(2, Math.floor(CAP / k)));
    S.need = 0;
    S.total = k * q;
    S.camels = [];
    for (let i = 0; i < k; i++) S.camels.push(newCamel(slotX(i, k)));
    if (S.kind === 'C') {
      /* بارِ نابرابرِ از پیش‌بسته: مجموعش هرچه باشد، با پس‌گرفتن حل می‌شود. */
      let left = S.total;
      for (let tries = 0; tries < 30; tries++) {
        const pre = S.camels.map(() => Math.floor(Math.random() * (q + 2)));
        const sum = pre.reduce((a, v) => a + v, 0);
        const same = pre.every((v) => v === pre[0]);
        if (sum > S.total - 1 || same || sum < 2) continue;
        S.camels.forEach((c, i) => { c.load = pre[i]; });
        left = S.total - sum;
        break;
      }
      S.pile = left;
    } else {
      S.pile = S.total;
    }
  }
  reflow();
}

function startLevel(i, keep) {
  const lv = LEVELS[i];
  S.level = i;
  S.cleared = 0;
  S.quota = lv.endless ? Infinity : lv.quota;
  S.combo = 0;
  S.banner = null;
  S.log = [];
  if (!keep) { S.water = 3; S.score = 0; }
  S.phase = 'play'; S.phaseT = 0;
  S.tut.on = i === 0 && !keep; S.tut.step = 0; S.tut.t = 0;
  newRound();
  if (S.tut.on) { S.kind = 'A'; S.total = S.pile = 6; S.camels = [newCamel(0), newCamel(0), newCamel(0)]; reflow();
    S.camels.forEach((c) => { c.x = c.tx; }); }
  toast.say(lv.hint, 'info');
}

function step(dt) {
  S.t += dt; S.phaseT += dt;
  if (S.shake > 0) S.shake -= dt;
  if (S.blow > 0) S.blow -= dt;
  if (S.banner) { S.banner.t += dt; if (S.banner.t > 2.6) S.banner = null; }

  if (S.phase === 'play') {
    const frozen = S.tut.on && S.tut.step < 2;
    if (!frozen && !S.depart && L().time) {
      S.storm += dt / L().time;
      if (S.storm >= 1) stormHit();
    }
    if (S.depart > 0) {
      S.depart += dt;
      for (const c of S.camels) c.x += (240 + c.gone * 40) * dt;
      if (S.depart > 1.9) { S.depart = 0; newRound(); }
    }
  }

  for (const c of S.camels) {
    c.bob += dt * 2.2;
    if (c.kick > 0) c.kick -= dt;
    if (!S.depart) c.x += (c.tx - c.x) * Math.min(1, dt * 8);
  }
  for (const f of S.fly) f.t += dt;
  S.fly = S.fly.filter((f) => f.t < f.dur);
  for (const g of S.grains) {
    g.x -= (g.sp + S.storm * 200) * dt;
    if (g.x < -6) { g.x = SCENE_W + 6; g.y = HORIZON + Math.random() * (SCENE_H - HORIZON); }
  }
  if (S.tut.on && S.phase === 'play') tutStep(dt);
  bits.step(dt);
  toast.step(dt);
  draw();
}

/* ───────── پخشِ بار ───────── */

const capacity = () => (S.kind === 'B' ? S.need : 99);
const loads = () => S.camels.map((c) => c.load);
const allEqual = () => S.camels.length > 0 && loads().every((v) => v === S.camels[0].load && v > 0);

function pileSpot(i) {
  const col = i % 6, row = Math.floor(i / 6);
  return { x: PILE.x + 32 + col * 40, y: PILE.y + PILE.h - 46 - row * 40 };
}

function flySack(x0, y0, x1, y1, back) {
  S.fly.push({ x0, y0, x1, y1, t: 0, dur: .3, back, seed: Math.random() * 99 });
}

function give(i) {
  const c = S.camels[i];
  if (S.pile <= 0) return false;
  if (c.load >= capacity()) { c.kick = .25; sfx.nope(); return false; }
  const s = pileSpot(S.pile - 1);
  S.pile--; c.load++;
  flySack(s.x, s.y, c.x, GROUND - 79 - (c.load - 1) * 15, false);
  sfx.tone(300 + c.load * 26, .07, 'triangle', .05);
  c.kick = .18;
  return true;
}

function take(i) {
  const c = S.camels[i];
  if (c.load <= 0) return false;
  const s = pileSpot(S.pile);
  flySack(c.x, GROUND - 79 - (c.load - 1) * 15, s.x, s.y, true);
  c.load--; S.pile++;
  sfx.tone(240 - c.load * 8, .06, 'sine', .05);
  c.kick = .14;
  return true;
}

/** کاروان خودش راه می‌افتد؛ نه دکمه‌ای، نه تأییدی. */
function checkDepart() {
  if (S.depart || S.pile !== 0 || !allEqual()) return;
  if (S.kind === 'B' && S.camels[0].load !== S.need) return;
  const n = S.camels.length, q = S.camels[0].load;
  S.depart = .001;
  S.combo++;
  S.cleared++;
  const speedBonus = Math.round((1 - S.storm) * 400);
  const pts = 200 + S.total * 8 + speedBonus + Math.min(S.combo, 6) * 60;
  S.score += pts;
  if (S.score > S.best) { S.best = S.score; saveBest(S.best); }
  S.banner = { t: 0, head: `${fa(S.total)} ÷ ${fa(n)}`, q, n };
  S.log.unshift({ txt: `${fa(S.total)} ÷ ${fa(n)}`, q });
  if (S.log.length > 4) S.log.pop();
  bits.confetti(749, 470, 46, [P.gold, P.sackLt, '#fff', P.camelLt]);
  sfx.win();
  S.camels.forEach((c, i) => { c.gone = i; });
  if (S.tut.on) S.tut.on = false;
  if (!L().endless && S.cleared >= S.quota) { S.score += 600; S.phase = 'won'; S.phaseT = 0; }
}

function stormHit() {
  S.water--;
  S.combo = 0;
  S.shake = .55; S.blow = 1.1;
  sfx.nope();
  bits.add(1000, 520, 34, 'dot', [P.storm, '#e2c79c', '#a8845a'],
    { speed: 420, lift: 60, size: 5, life: .9, grav: 120 });
  toast.say('طوفان رسید! بار پراکنده شد.', 'bad');
  if (S.water <= 0) { S.phase = 'lost'; S.phaseT = 0; return; }
  newRound();
}

/* ───────── آموزش ───────── */

const TUT_TAP = [0, 2], TUT_LAST = 2;

function tutStep(dt) {
  S.tut.t += dt;
  if (S.tut.step === 2 && S.tut.t > 40) S.tut.on = false;
}

/* ───────── ورودی ───────── */

/** کدام شتر زیرِ این نقطه است؟ */
function camelAt(p) {
  if (p.y < BAND.y || p.y > BAND.y + BAND.h) return -1;
  for (let i = 0; i < S.camels.length; i++) {
    if (Math.abs(p.x - S.camels[i].x) < PITCH / 2 - 4) return i;
  }
  return -1;
}

cv.addEventListener('pointermove', (e) => {
  const p = toStage(e);
  if (S.phase !== 'play') { S.hover = inRect(p, BTN_GO) ? BTN_GO : null; cv.style.cursor = S.hover ? 'pointer' : 'default'; return; }
  cv.style.cursor = camelAt(p) >= 0 ? 'grab' : 'default';
  if (!S.sw) return;
  const w = S.sw;
  w.moved += Math.abs(p.x - w.lx) + Math.abs(p.y - w.ly);
  if (!w.dir && Math.abs(p.x - w.x0) > 16) w.dir = p.x > w.x0 ? 1 : -1;
  w.lx = p.x; w.ly = p.y;
  if (!w.dir || S.depart) return;
  const i = camelAt(p);
  if (i >= 0 && w.seen.indexOf(i) < 0) {
    w.seen.push(i);
    if (w.dir > 0) give(i); else take(i);
    checkDepart();
    if (S.tut.on && S.tut.step === 1 && w.seen.length >= 2) { S.tut.step = 2; S.tut.t = 0; }
  }
});

cv.addEventListener('pointerdown', (e) => {
  const p = toStage(e);
  if (S.phase === 'intro') { startLevel(0); return; }
  if (S.phase === 'won') {
    if (!inRect(p, BTN_GO)) return;
    if (L().endless) startLevel(S.level, true);
    else if (S.level + 1 < LEVELS.length) startLevel(S.level + 1, true);
    else startLevel(0);
    return;
  }
  if (S.phase === 'lost') { if (inRect(p, BTN_GO)) startLevel(S.level); return; }
  if (tutTap(S.tut, TUT_TAP, TUT_LAST)) return;
  S.sw = { x0: p.x, y0: p.y, lx: p.x, ly: p.y, dir: 0, moved: 0, seen: [] };
  try { cv.setPointerCapture(e.pointerId); } catch { /* بعضی مرورگرها */ }
});

function endSweep(p) {
  const w = S.sw;
  S.sw = null;
  if (!w || S.depart || S.phase !== 'play') return;
  if (w.moved > 14 || w.seen.length) return;          // کشیدن بود، نه ضربه
  /* ضربه: شتر آوردن یا فرستادن — فقط در «بارِ اندازه» */
  if (S.kind !== 'B') { S.shake = .1; return; }
  const i = camelAt(p);
  if (i >= 0) {
    if (S.camels[i].load > 0) { S.camels[i].kick = .3; sfx.nope(); return; }
    if (S.camels.length <= 1) { S.camels[i].kick = .3; sfx.nope(); return; }
    S.camels.splice(i, 1); reflow(); sfx.tone(220, .12, 'sine', .06);
  } else if (p.y >= BAND.y && p.y <= BAND.y + BAND.h) {
    if (S.camels.length >= maxCamels()) { S.shake = .12; sfx.nope(); return; }
    const n = S.camels.length + 1;
    S.camels.push(newCamel(SCENE_W + 90));
    reflow();
    sfx.tone(420, .12, 'triangle', .06);
  }
  checkDepart();
}

cv.addEventListener('pointerup', (e) => endSweep(toStage(e)));
cv.addEventListener('pointercancel', () => { S.sw = null; });
cv.addEventListener('pointerleave', () => { S.sw = null; S.hover = null; });

/* ───────── ابزارِ نقاشی ───────── */

function rrPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function numText(str, x, y, o = {}) {
  ctx.save();
  ctx.font = `${o.family === 'Vazirmatn' ? (o.weight || 700) : '400'} ${o.size || 20}px "${o.family || 'Lalezar'}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  ctx.direction = 'ltr';
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  if (o.stroke) { ctx.lineWidth = o.strokeWidth || 5; ctx.lineJoin = 'round';
    ctx.strokeStyle = o.stroke; ctx.strokeText(str, x, y); }
  ctx.fillStyle = o.color || P.ink;
  ctx.fillText(str, x, y);
  ctx.restore();
}

function spot(rects, alpha) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, SCENE_W, SCENE_H);
  for (const r of rects) rrPath(r.x - 12, r.y - 12, r.w + 24, r.h + 24, 22);
  ctx.fillStyle = `rgba(60, 30, 20, ${alpha})`;
  ctx.fill('evenodd');
  ctx.restore();
}

/** یک بارِ کوچک (کیسه). */
function sack(x, y, s, alt, seed) {
  const c = alt ? P.sackB : P.sack, d = alt ? P.sackBDk : P.sackDk;
  const w = s * .46, hb = s * .46, ht = s * .5;
  const body = (o) => {
    ctx.beginPath();
    ctx.moveTo(x - w - o, y + hb);
    ctx.quadraticCurveTo(x - w * 1.12 - o, y - s * .1, x - w * .42, y - ht + o);
    ctx.lineTo(x + w * .42, y - ht + o);
    ctx.quadraticCurveTo(x + w * 1.12 + o, y - s * .1, x + w + o, y + hb);
    ctx.quadraticCurveTo(x, y + hb + s * .16, x - w - o, y + hb);
    ctx.closePath();
  };
  ctx.fillStyle = d; body(1.4); ctx.fill();
  ctx.fillStyle = c; body(0); ctx.fill();
  /* نورِ گوشهٔ چپِ بالا */
  ctx.save(); body(0); ctx.clip();
  ctx.fillStyle = 'rgba(255, 240, 210, .22)';
  ctx.beginPath(); ctx.moveTo(x - w, y + hb); ctx.lineTo(x - w * .4, y - ht); ctx.lineTo(x - w * .05, y - ht);
  ctx.lineTo(x - w * .5, y + hb); ctx.closePath(); ctx.fill();
  ctx.restore();
  /* بندِ دورِ دهانه */
  ctx.strokeStyle = P.rope; ctx.lineWidth = Math.max(1.4, s * .09);
  ctx.beginPath(); ctx.moveTo(x - w * .5, y - ht + s * .1); ctx.lineTo(x + w * .5, y - ht + s * .1); ctx.stroke();
  /* گرهٔ دهانه */
  ctx.fillStyle = P.rope;
  ctx.beginPath(); ctx.ellipse(x, y - ht - s * .04, w * .34, s * .1, 0, 0, TAU); ctx.fill();
}

/** تیرک‌ها و ریسمانِ «تا اینجا جا دارد». */
function loadLine(x, padY, cap, load) {
  const top = padY - 9 - (cap - 1) * 15 - 12;
  const full = load >= cap;
  ctx.strokeStyle = P.wood; ctx.lineWidth = 5; ctx.lineCap = 'round';
  for (const dx of [-25, 25]) {
    ctx.beginPath(); ctx.moveTo(x + dx, padY + 4); ctx.lineTo(x + dx, top); ctx.stroke();
  }
  ctx.strokeStyle = full ? P.gold : 'rgba(74, 53, 32, .75)';
  ctx.lineWidth = full ? 6 : 4;
  ctx.beginPath(); ctx.moveTo(x - 30, top); ctx.lineTo(x + 30, top); ctx.stroke();
  /* پرچمکِ سرِ ریسمان */
  ctx.fillStyle = full ? P.gold : '#c07a3e';
  ctx.beginPath();
  ctx.moveTo(x + 30, top); ctx.lineTo(x + 47, top + 6); ctx.lineTo(x + 30, top + 12);
  ctx.closePath(); ctx.fill();
}

/** شتر — پیکرهٔ ساده و گرم، با زنبیلِ بار روی کوهان. */
function drawCamel(c, i) {
  const bob = Math.sin(c.bob) * 2.4 + (c.kick > 0 ? Math.sin(S.t * 50) * 3 : 0);
  const x = c.x, y = GROUND + bob;
  ctx.save();
  /* سایه روی شن */
  ctx.fillStyle = 'rgba(120, 78, 44, .22)';
  wobbleEllipse(x + 8, GROUND + 16, 54, 11, 0, i * 3, 1.4); ctx.fill();

  ctx.save();
  ctx.translate(x, y); ctx.scale(.86, .86); ctx.translate(-x, -y);
  /* پاها */
  ctx.strokeStyle = P.camelDk; ctx.lineWidth = 7; ctx.lineCap = 'round';
  for (let k = 0; k < 4; k++) {
    const lx = x - 26 + k * 18, sw = Math.sin(c.bob + k * 1.6) * 3;
    ctx.beginPath(); ctx.moveTo(lx, y - 34); ctx.lineTo(lx + sw, y + 12); ctx.stroke();
  }
  /* تنه */
  ctx.fillStyle = P.camel;
  wobbleEllipse(x, y - 52, 44, 25, 0, i * 5 + 1, 1.8); ctx.fill();
  /* کوهان */
  ctx.beginPath();
  ctx.moveTo(x - 22, y - 62);
  ctx.quadraticCurveTo(x - 4, y - 96, x + 16, y - 62);
  ctx.closePath(); ctx.fill();
  /* گردن و سر */
  ctx.strokeStyle = P.camel; ctx.lineWidth = 15; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x + 34, y - 58);
  ctx.quadraticCurveTo(x + 58, y - 76, x + 56, y - 100);
  ctx.stroke();
  ctx.fillStyle = P.camel;
  wobbleEllipse(x + 60, y - 106, 15, 10, -.3, i * 7 + 2, 1.2); ctx.fill();
  ctx.fillStyle = P.camelLt;
  wobbleEllipse(x + 70, y - 108, 7, 5, -.3, i * 7 + 5, .8); ctx.fill();
  /* گوش و چشم */
  ctx.fillStyle = P.camelDk;
  wobbleEllipse(x + 50, y - 116, 4, 6, .3, i + 9, .6); ctx.fill();
  ctx.fillStyle = '#3a2416';
  ctx.beginPath(); ctx.arc(x + 62, y - 109, 2.2, 0, TAU); ctx.fill();
  /* دُم */
  ctx.strokeStyle = P.camelDk; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(x - 42, y - 58);
  ctx.quadraticCurveTo(x - 56, y - 46, x - 52 + Math.sin(c.bob * 1.3) * 4, y - 30); ctx.stroke();

  ctx.restore();

  /* پالان و بار — بیرون از مقیاسِ بدن تا با کیسه‌های مِهار هم‌اندازه بماند */
  const padY = y - 70;
  ctx.fillStyle = '#8d5f33';
  wobbleRect(x - 30, padY, 60, 13, 5, i * 13 + 4, 1); ctx.fill();
  ctx.fillStyle = '#b0824c';
  wobbleRect(x - 30, padY, 60, 5, 3, i * 13 + 6, .8); ctx.fill();
  if (S.kind === 'B') loadLine(x, padY, S.need, c.load);
  for (let k = 0; k < c.load; k++) {
    sack(x + (k % 2 ? 4 : -4), padY - 9 - k * 15, 27, S.kind === 'B', i * 11 + k);
  }
  ctx.restore();
}

/* ───────── صحنه ───────── */

function draw() {
  beginScene(P.sky3);
  ctx.save();
  if (S.shake > 0) {
    const k = S.shake * 10;
    ctx.translate(Math.sin(S.t * 55) * k, Math.cos(S.t * 41) * k * .4);
  }
  drawSky();
  drawDunes();
  drawPile();
  const order = S.camels.map((c, i) => ({ c, i })).sort((a, b) => a.c.x - b.c.x);
  for (const o of order) drawCamel(o.c, o.i);
  drawFly();
  bits.draw();
  drawStorm();
  ctx.restore();

  drawJournal();
  drawBanner();
  drawHUD();
  if (!(S.phase === 'play' && S.tut.on)) {
    ctx.save();
    ctx.translate(BAND.x + BAND.w / 2 - SCENE_W / 2, 0);
    toast.draw(HUD_H + 10, { good: P.good, bad: P.bad, info: P.paper, ink: P.ink });
    ctx.restore();
  }
  if (S.phase === 'play' && S.tut.on) drawTutorial();
  if (S.phase === 'intro') drawIntro();
  if (S.phase === 'won') drawWon();
  if (S.phase === 'lost') drawLost();
  endScene(.13, 'rgba(90, 44, 30, .34)');
}

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, HORIZON + 40);
  g.addColorStop(0, P.sky3);
  g.addColorStop(.45, P.sky2);
  g.addColorStop(1, P.sky1);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, SCENE_W, HORIZON + 40);

  /* خورشیدِ پایین‌رفته */
  const sx = 528, sy = HORIZON - 44;
  ctx.save();
  ctx.globalAlpha = .3;
  ctx.fillStyle = P.sun;
  wobbleCircle(sx, sy, 96, 3, 3); ctx.fill();
  ctx.restore();
  ctx.fillStyle = P.sun;
  wobbleCircle(sx, sy, 46, 5, 1.6); ctx.fill();

  /* پرنده‌های دور */
  ctx.strokeStyle = 'rgba(80, 44, 50, .38)'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
  for (let i = 0; i < 5; i++) {
    const bx = 640 + i * 62 + Math.sin(S.t * .4 + i) * 14, by = 150 + (i % 3) * 34;
    const f = Math.sin(S.t * 3 + i * 1.4) * 5;
    ctx.beginPath();
    ctx.moveTo(bx - 11, by + f); ctx.quadraticCurveTo(bx, by - 5, bx + 11, by + f);
    ctx.stroke();
  }
}

function drawDunes() {
  const bands = [
    { y: HORIZON, amp: 26, col: P.dune1, ph: 0, f: .0052 },
    { y: HORIZON + 54, amp: 34, col: P.dune2, ph: 2.1, f: .0041 },
    { y: HORIZON + 128, amp: 30, col: P.dune3, ph: 4.2, f: .0034 },
  ];
  for (const b of bands) {
    ctx.fillStyle = b.col;
    ctx.beginPath();
    ctx.moveTo(0, SCENE_H);
    ctx.lineTo(0, b.y);
    for (let x = 0; x <= SCENE_W; x += 12) {
      ctx.lineTo(x, b.y + Math.sin(x * b.f + b.ph) * b.amp + Math.sin(x * b.f * 2.6 + b.ph) * b.amp * .3);
    }
    ctx.lineTo(SCENE_W, SCENE_H);
    ctx.closePath(); ctx.fill();
  }
  /* شنِ جلو */
  ctx.fillStyle = P.sand;
  ctx.beginPath();
  ctx.moveTo(0, SCENE_H); ctx.lineTo(0, GROUND + 6);
  for (let x = 0; x <= SCENE_W; x += 14) ctx.lineTo(x, GROUND + 6 + Math.sin(x * .009 + 1.4) * 9);
  ctx.lineTo(SCENE_W, SCENE_H); ctx.closePath(); ctx.fill();

  /* نخل‌های واحه، سمتِ چپ */
  drawPalm(350, HORIZON + 46, .92);
  drawPalm(398, HORIZON + 32, .72);

  /* دانه‌های شن در باد */
  ctx.save();
  for (const g of S.grains) {
    ctx.globalAlpha = g.a * (.5 + S.storm * .8);
    ctx.fillStyle = '#fff3d8';
    ctx.beginPath(); ctx.ellipse(g.x, g.y, g.r * 3, g.r, 0, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawPalm(x, base, s) {
  ctx.save();
  ctx.translate(x, base);
  ctx.scale(s, s);
  ctx.strokeStyle = '#6b4a2c'; ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-10, -60, -4, -112); ctx.stroke();
  ctx.fillStyle = '#5c7a3a';
  for (let i = 0; i < 6; i++) {
    const a = -Math.PI / 2 + (i - 2.5) * .52;
    ctx.save();
    ctx.translate(-4, -112);
    ctx.rotate(a + Math.sin(S.t * .8 + i) * .04);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(38, -14, 66, 6);
    ctx.quadraticCurveTo(36, 4, 0, 8);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

/** مِهارِ بار — کیسه‌های پخش‌نشده روی حصیر. */
function drawPile() {
  withShadow(18, 8, .3, () => {
    ctx.fillStyle = '#c9a771';
    wobbleRect(PILE.x, PILE.y, PILE.w, PILE.h, 16, 21, 2.4); ctx.fill();
  }, '110, 70, 40');
  ctx.fillStyle = 'rgba(255, 244, 220, .3)';
  for (let i = 0; i < 8; i++) {
    ctx.fillRect(PILE.x + 10, PILE.y + 16 + i * 44, PILE.w - 20, 3);
  }
  ctx.strokeStyle = P.rope; ctx.lineWidth = 5;
  wobbleRect(PILE.x + 6, PILE.y + 6, PILE.w - 12, PILE.h - 12, 12, 23, 2); ctx.stroke();

  text('بارِ کاروان', PILE.x + PILE.w / 2, PILE.y + 26,
    { size: 22, family: 'Lalezar', color: '#5c3f22' });

  for (let i = 0; i < S.pile; i++) {
    const s = pileSpot(i);
    sack(s.x, s.y, 32, S.kind === 'B', i * 3 + 1);
  }
  if (S.pile === 0) {
    text('خالی شد', PILE.x + PILE.w / 2, PILE.y + PILE.h - 40,
      { size: 19, color: 'rgba(92, 63, 34, .55)' });
  }
}

function drawFly() {
  for (const f of S.fly) {
    const k = clamp(f.t / f.dur, 0, 1);
    const x = lerp(f.x0, f.x1, k);
    const y = lerp(f.y0, f.y1, k) - Math.sin(k * Math.PI) * 78;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate((f.back ? -1 : 1) * k * 3.4);
    sack(0, 0, 28, S.kind === 'B', f.seed);
    ctx.restore();
  }
}

/** دیوارِ طوفان از سمتِ راست. */
function drawStorm() {
  const k = clamp(S.storm, 0, 1);
  const x = lerp(SCENE_W + 130, 900, k);
  ctx.save();
  const g = ctx.createLinearGradient(x - 150, 0, SCENE_W, 0);
  g.addColorStop(0, 'rgba(201, 160, 106, 0)');
  g.addColorStop(.45, `rgba(206, 166, 112, ${.34 + k * .34})`);
  g.addColorStop(1, `rgba(168, 124, 74, ${.55 + k * .42})`);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x - 150, HUD_H);
  for (let y = HUD_H; y <= SCENE_H; y += 16) {
    ctx.lineTo(x - 150 + Math.sin(y * .03 + S.t * 3) * 22, y);
  }
  ctx.lineTo(SCENE_W, SCENE_H); ctx.lineTo(SCENE_W, HUD_H);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  if (k > .72) {
    ctx.save();
    ctx.globalAlpha = (k - .72) / .28 * (.5 + .5 * Math.sin(S.t * 8));
    text('طوفان!', SCENE_W - 96, 132, { size: 34, family: 'Lalezar', color: '#8b3a2c' });
    ctx.restore();
  }
}

/** دفترِ کاروان — سفرهای رفته. جواب با کیسه کشیده می‌شود، نه با عدد. */
function drawJournal() {
  const b = JOURNAL;
  withShadow(18, 8, .34, () => {
    ctx.fillStyle = P.paper;
    wobbleRect(b.x, b.y, b.w, b.h, 14, 41, 2.2); ctx.fill();
  }, '110, 70, 40');
  ctx.fillStyle = P.wood;
  wobbleRect(b.x, b.y, b.w, 10, 5, 43, 1); ctx.fill();
  text('دفترِ کاروان', b.x + b.w / 2, b.y + 34, { size: 22, family: 'Lalezar', color: P.ink });

  if (!S.log.length) {
    textWrap('هر کاروانی که راه بیفتد\nاینجا ثبت می‌شود.', b.x + b.w / 2, b.y + 76, b.w - 34,
      { size: 14, color: P.inkSoft, lineHeight: 22 });
    return;
  }
  for (let i = 0; i < S.log.length; i++) {
    const e = S.log[i], y = b.y + 68 + i * 30;
    ctx.save();
    ctx.globalAlpha = 1 - i * .18;
    numText(e.txt, b.x + b.w - 18, y, { size: 19, color: P.ink, align: 'right' });
    /* بارِ هر شتر، به شکلِ کیسه */
    const n = Math.min(e.q, 8);
    for (let k = 0; k < n; k++) sack(b.x + 26 + k * 17, y, 16, false, k * 5 + i);
    if (e.q > 8) numText('…', b.x + 26 + 8 * 17, y, { size: 15, color: P.inkSoft });
    ctx.restore();
  }
}

/** لحظهٔ راه‌افتادن: «۲۴ ÷ ۴» و بارِ یک شتر — بی هیچ عددِ جواب. */
function drawBanner() {
  if (!S.banner) return;
  const t = S.banner.t;
  const k = clamp(t / .22, 0, 1) * clamp((2.6 - t) / .5, 0, 1);
  const cx = BAND.x + BAND.w / 2, cy = 210;
  ctx.save();
  ctx.globalAlpha = k;
  ctx.translate(0, (1 - easeOut(clamp(t / .4, 0, 1))) * 20);
  withShadow(24, 10, .4, () => {
    ctx.fillStyle = 'rgba(74, 53, 32, .92)';
    wobbleRect(cx - 240, cy - 54, 480, 108, 18, 61, 2.4); ctx.fill();
  }, '40, 20, 10');
  ctx.strokeStyle = 'rgba(238, 184, 64, .6)'; ctx.lineWidth = 3;
  wobbleRect(cx - 240, cy - 54, 480, 108, 18, 61, 2.4); ctx.stroke();
  numText(S.banner.head, cx, cy - 22, { size: 34, color: P.gold });
  const n = Math.min(S.banner.q, 10);
  const w = (n - 1) * 26;
  for (let i = 0; i < n; i++) sack(cx - w / 2 + i * 26, cy + 22, 24, false, i * 4 + 2);
  if (S.banner.q > 10) numText('…', cx + w / 2 + 22, cy + 22, { size: 20, color: P.paper });
  ctx.restore();
}

function drawHUD() {
  ctx.fillStyle = 'rgba(74, 40, 46, .8)';
  ctx.fillRect(0, 0, SCENE_W, HUD_H);
  ctx.fillStyle = 'rgba(238, 184, 64, .3)';
  ctx.fillRect(0, HUD_H - 2, SCENE_W, 2);

  text(L().name, SCENE_W - 24, HUD_H / 2, { size: 23, family: 'Lalezar', color: P.paper, align: 'right' });

  /* مشک‌های آب = جان */
  for (let i = 0; i < 3; i++) {
    const x = SCENE_W - 206 - i * 34;
    ctx.save();
    ctx.globalAlpha = i < S.water ? 1 : .22;
    ctx.fillStyle = i < S.water ? '#5fa8c4' : '#8f8a86';
    ctx.beginPath();
    ctx.moveTo(x, HUD_H / 2 - 13);
    ctx.quadraticCurveTo(x + 12, HUD_H / 2 - 4, x + 8, HUD_H / 2 + 8);
    ctx.quadraticCurveTo(x, HUD_H / 2 + 16, x - 8, HUD_H / 2 + 8);
    ctx.quadraticCurveTo(x - 12, HUD_H / 2 - 4, x, HUD_H / 2 - 13);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  if (!L().endless) {
    numText(fa(Math.min(S.cleared, L().quota)) + ' / ' + fa(L().quota), SCENE_W / 2, HUD_H / 2,
      { size: 22, color: P.gold });
  } else {
    text('بی‌پایان', SCENE_W / 2, HUD_H / 2, { size: 22, family: 'Lalezar', color: P.gold });
  }

  numText(fa(S.score), 24, HUD_H / 2, { size: 25, color: P.gold, align: 'left' });
  numText('بیشترین ' + fa(S.best), 140, HUD_H / 2 + 1,
    { size: 14, color: 'rgba(251, 241, 220, .55)', align: 'left', family: 'Vazirmatn', weight: 700 });
  if (S.combo > 1) numText('×' + fa(S.combo), 248, HUD_H / 2, { size: 22, color: P.gold, align: 'left' });
}

/* ───────── آموزش ───────── */

function tutCard(x, y, w, lines, title) {
  const h = 26 + (title ? 44 : 0) + lines.length * 30;
  withShadow(24, 10, .45, () => {
    ctx.fillStyle = 'rgba(253, 245, 226, .97)';
    wobbleRect(x, y, w, h + 20, 16, 101, 2.2); ctx.fill();
  }, '60, 30, 16');
  ctx.fillStyle = P.wood;
  wobbleRect(x, y, w, 9, 4, 103, 1); ctx.fill();
  let yy = y + 34;
  if (title) { text(title, x + w / 2, yy + 6, { size: 25, family: 'Lalezar', color: P.ink }); yy += 44; }
  for (const l of lines) { text(l, x + w / 2, yy, { size: 18, color: '#6b5236' }); yy += 30; }
  return h + 20;
}

/** دستی که روی شترها می‌کشد. */
function drawSwipeHand() {
  const n = S.camels.length;
  if (!n) return;
  const k = (S.t * .55) % 1;
  const x = lerp(S.camels[0].x - 40, S.camels[n - 1].x + 40, easeInOut(k));
  const y = GROUND - 44;
  ctx.save();
  ctx.globalAlpha = .35;
  ctx.strokeStyle = '#fff3d8'; ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(S.camels[0].x - 40, y); ctx.lineTo(S.camels[n - 1].x + 40, y); ctx.stroke();
  ctx.restore();
  ctx.save();
  ctx.translate(x, y);
  withShadow(12, 5, .4, () => {
    ctx.fillStyle = '#f6dfc0';
    ctx.beginPath();
    ctx.moveTo(0, -6);
    ctx.quadraticCurveTo(-9, -2, -10, 16);
    ctx.quadraticCurveTo(-11, 34, 0, 36);
    ctx.quadraticCurveTo(11, 34, 10, 16);
    ctx.quadraticCurveTo(9, -2, 0, -6);
    ctx.closePath(); ctx.fill();
    wobbleCircle(0, -12, 8, 4, 1); ctx.fill();
  }, '60, 30, 16');
  ctx.restore();
}

function drawTutorial() {
  const st = S.tut.step;
  if (st === 0) {
    spot([PILE], .72);
    const h = tutCard(360, 250, 500,
      ['این بارها باید روی شترها برود.', 'ولی شترها با هم قهر می‌کنند:',
       'تا بارِ همه یکی نشود، کاروان راه نمی‌افتد.'], 'کاروانِ شن');
    tutMore(610, 250 + h + 16, S.t, P.ink);
  } else if (st === 1) {
    spot([{ x: S.camels[0].x - 70, y: GROUND - 150, w: (S.camels.length - 1) * PITCH + 140, h: 200 }], .68);
    drawSwipeHand();
    tutCard(360, 180, 500, ['انگشتت را روی شترها بکِش.',
      'به هر شتری که رد شوی، یک بار می‌رسد.'], 'یک دور پخش کن');
  } else {
    spot([{ x: S.camels[0].x - 70, y: GROUND - 190, w: (S.camels.length - 1) * PITCH + 140, h: 240 },
          PILE], .68);
    const h = tutCard(360, 150, 500,
      ['برعکس بکِش تا بار را پس بگیری.',
       'وقتی مِهار خالی شد و بارِ همه یکی بود،',
       'کاروان خودش راه می‌افتد.'], 'برعکس هم می‌شود');
    tutMore(610, 150 + h + 16, S.t, P.ink);
  }
}

/* ───────── پرده‌ها ───────── */

function camelIcon(x, y) {
  ctx.save();
  ctx.translate(x - 8, y + 10); ctx.scale(.46, .46);
  ctx.fillStyle = P.camel;
  wobbleEllipse(0, -52, 44, 25, 0, 1, 1.8); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-22, -62); ctx.quadraticCurveTo(-4, -96, 16, -62); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = P.camel; ctx.lineWidth = 15; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(34, -58); ctx.quadraticCurveTo(58, -76, 56, -100); ctx.stroke();
  ctx.fillStyle = P.camel;
  wobbleEllipse(60, -106, 15, 10, -.3, 2, 1.2); ctx.fill();
  ctx.strokeStyle = P.camelDk; ctx.lineWidth = 7;
  for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.moveTo(-26 + k * 18, -34); ctx.lineTo(-26 + k * 18, 12); ctx.stroke(); }
  ctx.restore();
}

function drawIntro() {
  overlay({
    t: S.phaseT, w: 730, h: 268, y: 146,
    paper: P.paper, band: '#c07a3e', ink: P.ink, inkSoft: '#8a6a45',
    icon: camelIcon,
    title: 'کاروانِ شن',
    body: 'بار باید عادلانه روی شترها پخش شود.\nانگشتت را روی شترها بکِش — به هر کدام که رد شوی یک بار می‌رسد.\nتا طوفان نرسیده، کاروان را راه بینداز.',
    btn: BTN_GO, btnLabel: 'راه بیفت', btnHot: S.hover === BTN_GO,
    btnFill: '#a8643a', btnHotFill: '#bd7343',
  });
}

function drawWon() {
  const last = S.level + 1 >= LEVELS.length;
  overlay({
    t: S.phaseT, w: 720, h: 250, y: 160,
    paper: P.paper, band: '#eeb840', ink: P.ink, inkSoft: '#8a6a45',
    icon: camelIcon,
    title: L().endless ? 'کاروان رسید' : 'به منزل رسیدی!',
    body: 'کیسه‌های امتیاز: ' + fa(S.score) + (last ? '\nهمهٔ راه‌ها را رفتی. از اوّل؟' : ''),
    btn: BTN_GO, btnLabel: last ? 'دوباره' : 'راهِ بعد', btnHot: S.hover === BTN_GO,
    btnFill: '#a8643a', btnHotFill: '#bd7343',
  });
}

function drawLost() {
  overlay({
    t: S.phaseT, w: 720, h: 250, y: 160,
    paper: P.paper, band: '#c9503f', ink: P.ink, inkSoft: '#8a6a45',
    icon: (x, y) => { ctx.fillStyle = P.storm; wobbleCircle(x, y, 24, 151, 3); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.4)'; wobbleCircle(x - 8, y - 6, 10, 153, 2); ctx.fill(); },
    title: 'طوفان کاروان را برد',
    body: 'کیسه‌های امتیاز: ' + fa(S.score) + '\nبارِ همهٔ شترها باید یکی باشد.',
    btn: BTN_GO, btnLabel: 'دوباره', btnHot: S.hover === BTN_GO,
    btnFill: '#a8643a', btnHotFill: '#bd7343',
  });
}
