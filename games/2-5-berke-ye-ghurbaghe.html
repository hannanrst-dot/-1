<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#10202a">
<title>برکهٔ قورباغه — تقریب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>
  /* صفحه نباید هیچ‌جا اسکرول یا زوم شود؛ بازی باید مثل یک برنامه رفتار کند. */
  html, body {
    margin: 0; padding: 0; background: #10202a;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body {
    position: fixed; inset: 0;          /* جلوی کشیده‌شدنِ صفحه در سافاریِ گوشی */
    width: 100%; height: 100vh; height: 100dvh;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none; -webkit-touch-callout: none;
  }

  /* گوشیِ عمودی صحنه را ریز می‌کند؛ بچه باید گوشی را بچرخاند. */
  #rotate { display: none; }
  @media (orientation: portrait) and (max-width: 860px) {
    #stage { display: none; }
    #rotate {
      display: flex; position: fixed; inset: 0;
      z-index: 9;
      flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      background: #10202a; color: #f6ead2;
      font: 700 20px "Vazirmatn", Tahoma, sans-serif; text-align: center; padding: 32px;
    }
    #rotate svg { animation: tilt 2.4s ease-in-out infinite; }
    @keyframes tilt { 0%, 45% { transform: rotate(0deg); } 65%, 100% { transform: rotate(-90deg); } }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="rotate">
  <svg width="86" height="126" viewBox="0 0 86 126" fill="none" aria-hidden="true">
    <rect x="3" y="3" width="80" height="120" rx="12" stroke="#e8b448" stroke-width="5"/>
    <rect x="15" y="19" width="56" height="88" rx="5" fill="#e8b448" opacity=".28"/>
    <circle cx="43" cy="115" r="4" fill="#e8b448"/>
  </svg>
  <div>گوشی را بچرخان</div>
  <div style="font-weight:400;opacity:.7;font-size:16px">این بازی خوابیده بازی می‌شود</div>
</div>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   هستهٔ مشترکِ بازی‌ها — سبک «کاغذبُری»
   ───────────────────────────────────────────────────────────────────────
   این فایل جعبه‌ابزار است، نه چارچوب: هر بازی حلقه و وضعیت خودش را دارد
   و فقط از این توابع برای کشیدن استفاده می‌کند. دلیلش این است که هر بازی
   باید حس‌وحال خودش را داشته باشد، نه اینکه همه شبیه هم دربیایند.

   قاعده‌های ثابتِ تصویری:
   • نور همیشه از بالا-چپ می‌تابد، پس سایه‌ها به پایین-راست می‌افتند.
   • هیچ لبه‌ای کاملاً صاف نیست؛ همه کمی موج دارند (انگار با قیچی بریده).
   • هیچ خاکستریِ خالصی نداریم؛ همه‌ی خنثی‌ها به گرمیِ صحنه می‌زنند.
   • یک لایه‌ی دانه‌دانه‌ی کاغذ روی کلِ تصویر ضرب می‌شود.
   ═══════════════════════════════════════════════════════════════════════ */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const FA_D = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
const fa = (n) => String(n).replace(/\d/g, (d) => FA_D[+d]);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeIn = (t) => t * t * t;
const easeInOut = (t) => (t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2);
const easeBack = (t) => 1 + 2.7 * Math.pow(t-1, 3) + 1.7 * Math.pow(t-1, 2);
const easeElastic = (t) => t === 0 || t === 1 ? t : Math.pow(2, -9*t) * Math.sin((t*10 - .75) * 2.094) + 1;

/** تصادفِ تکرارپذیر: با یک بذر همیشه همان عدد. برای اینکه تزئین‌ها هر فریم نپرند. */
function noise1(x) {
  const s = Math.sin(x * 127.1) * 43758.5453;
  return s - Math.floor(s);
}
const pick = (arr, seed) => arr[Math.floor(noise1(seed) * arr.length) % arr.length];

/* ───────── بوم و صحنهٔ ثابت ───────── */

let ctx, SW, SH, CV, _refit = null;
let view = { scale: 1, ox: 0, oy: 0, w: 0, h: 0, dpr: 1 };
let _grain = null;

function initStage(canvas, w, h) {
  CV = canvas; SW = w; SH = h;
  ctx = canvas.getContext('2d');

  /* اندازه را از خودِ بوم می‌گیریم نه از innerHeight؛ چون در سافاریِ گوشی
     نوارِ آدرس باز و بسته می‌شود و innerHeight دروغ می‌گوید. */
  const fit = () => {
    const r = canvas.getBoundingClientRect();
    const vw = Math.round(r.width), vh = Math.round(r.height);
    if (vw < 20 || vh < 20) return;
    const dpr = Math.min(devicePixelRatio || 1, QUALITY > 0 ? 2 : 1);
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    const scale = Math.min(vw / SW, vh / SH);
    view = { scale, ox: (vw - SW*scale)/2, oy: (vh - SH*scale)/2, w: vw, h: vh, dpr };
    _grain = buildGrain();
  };
  _refit = fit;
  addEventListener('resize', fit);
  /* چرخاندنِ گوشی: اندازهٔ درست چند لحظه بعد می‌رسد، پس چندبار اندازه می‌گیریم. */
  addEventListener('orientationchange', () => {
    fit(); setTimeout(fit, 140); setTimeout(fit, 460);
  });
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(canvas);

  /* صدا در گوشی فقط بعد از اوّلین لمس اجازهٔ پخش دارد. */
  const unlock = () => { sfx._c(); removeEventListener('pointerdown', unlock); removeEventListener('touchstart', unlock); };
  addEventListener('pointerdown', unlock, { passive: true });
  addEventListener('touchstart', unlock, { passive: true });
  /* نگه‌داشتنِ انگشت نباید منوی مرورگر را باز کند. */
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  fit();
  return ctx;
}

/** قابِ صحنه را باز می‌کند: بعد از این، مختصات همیشه در فضای SW×SH است. */
function beginScene(bg) {
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, view.w, view.h);
  ctx.save();
  ctx.translate(view.ox, view.oy);
  ctx.scale(view.scale, view.scale);
  ctx.beginPath();
  ctx.rect(0, 0, SW, SH);
  ctx.clip();
}

/** بافتِ کاغذ، تیرگیِ گوشه‌ها، رنگ‌بندی و درخششِ نور را می‌گذارد و قاب را می‌بندد. */
function endScene(grainAlpha = .15, vignette = 'rgba(48,28,14,.30)', bloom = .34, grade = .14) {
  if (QUALITY < 1) { grade = 0; grainAlpha *= .5; }
  if (QUALITY < 2) bloom = 0;
  if (grade > 0) {
    /* رنگ‌بندیِ نرم: بالای صحنه گرم‌تر، پایین سردتر — عمق می‌دهد */
    const g = ctx.createLinearGradient(0, 0, 0, SH);
    g.addColorStop(0, `rgba(255, 214, 150, ${grade})`);
    g.addColorStop(.55, 'rgba(255, 255, 255, 0)');
    g.addColorStop(1, `rgba(40, 60, 110, ${grade * .9})`);
    ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalCompositeOperation = 'source-over';
  }
  if (_grain && grainAlpha > 0) {
    ctx.globalCompositeOperation = 'multiply';
    ctx.globalAlpha = grainAlpha;
    ctx.fillStyle = _grain;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
  if (vignette) {
    const g = ctx.createRadialGradient(SW/2, SH/2, SH*.42, SW/2, SH/2, SH*1.05);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, vignette);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
  }
  ctx.restore();
  bloomPass(bloom);
}

/* ───────── درخششِ نور (bloom) ─────────
   قابِ رسم‌شده را کوچک می‌کنیم، دو بار در خودش ضرب می‌کنیم تا فقط
   روشن‌ها بمانند، محوش می‌کنیم و با حالتِ «lighter» رویش می‌گذاریم.
   نتیجه: چراغ‌ها، شعله‌ها و رنگ‌های روشن نور پخش می‌کنند. */
let _bl, _blc, _bl2, _bl2c, _blNo = false, _blTick = 0;

function bloomPass(amount) {
  if (!amount || _blNo || !CV.width) return;
  /* کوچک‌کردن و بزرگ‌کردنِ دوباره، خودش محو می‌کند — از filter خیلی ارزان‌تر است */
  const W = Math.max(4, Math.round(CV.width * .2)), H = Math.max(4, Math.round(CV.height * .2));
  const W2 = Math.max(2, Math.round(W * .28)), H2 = Math.max(2, Math.round(H * .28));
  try {
    if (!_bl) {
      _bl = document.createElement('canvas'); _blc = _bl.getContext('2d');
      _bl2 = document.createElement('canvas'); _bl2c = _bl2.getContext('2d');
      if (!_blc || !_bl2c) { _blNo = true; return; }
    }
    if (_bl.width !== W || _bl.height !== H) { _bl.width = W; _bl.height = H; }
    if (_bl2.width !== W2 || _bl2.height !== H2) { _bl2.width = W2; _bl2.height = H2; }
    /* ساختنِ نور یک قاب در میان کافی است؛ گذاشتنش هر قاب. */
    _blTick = (_blTick + 1) & 1;
    if (!_blTick) {
      _blc.globalCompositeOperation = 'source-over';
      _blc.clearRect(0, 0, W, H);
      _blc.drawImage(CV, 0, 0, W, H);
      _blc.globalCompositeOperation = 'multiply';
      _blc.drawImage(_bl, 0, 0);
      _blc.drawImage(_bl, 0, 0);
      _blc.globalCompositeOperation = 'source-over';
      _bl2c.clearRect(0, 0, W2, H2);
      _bl2c.drawImage(_bl, 0, 0, W2, H2);
    }

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = amount;
    ctx.drawImage(_bl2, 0, 0, CV.width, CV.height);
    ctx.restore();
  } catch (e) { _blNo = true; }
}

/* ───────── لایهٔ ثابت ─────────
   هرچه در صحنه تکان نمی‌خورد را یک‌بار می‌کشیم و بعد فقط کپی می‌کنیم. */
const _layers = {};
function staticLayer(key, w, h, paint) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const L = _layers[key];
  if (L && L.q === q && L.w === w && L.h === h) return L.cv;
  const off = document.createElement('canvas');
  off.width = Math.max(1, Math.round(w * q));
  off.height = Math.max(1, Math.round(h * q));
  const c = off.getContext('2d');
  c.setTransform(q, 0, 0, q, 0, 0);
  const prev = ctx;
  ctx = c;
  try { paint(); } finally { ctx = prev; }
  _layers[key] = { cv: off, q, w, h };
  return off;
}

/* ───────── نورپردازی و بافت ─────────
   کارِ این‌ها این است که هیچ سطحی «تختِ یک‌رنگ» نماند. */

/** شیبِ عمودی: بالا روشن، پایین تیره. */
function vgrad(y0, y1, top, bot) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, top); g.addColorStop(1, bot);
  return g;
}

/** حجمِ کروی: نور از بالا-چپ، سایه در پایین-راست. */
function ball(cx, cy, r, lit, base, dark) {
  const g = ctx.createRadialGradient(cx - r * .38, cy - r * .42, r * .06, cx, cy, r * 1.06);
  g.addColorStop(0, lit); g.addColorStop(.45, base); g.addColorStop(1, dark);
  return g;
}

/** لبهٔ روشنِ بالا-چپِ یک مسیر — همان «rim light». */
function rim(pathFn, col, w = 2.2) {
  ctx.save();
  ctx.beginPath(); pathFn();
  ctx.clip();
  ctx.beginPath(); pathFn();
  ctx.strokeStyle = col; ctx.lineWidth = w * 2; ctx.lineJoin = 'round';
  ctx.translate(-w * .5, -w * .6);
  ctx.stroke();
  ctx.restore();
}

/** سایهٔ چسبیده به زمین — چیزها را روی سطح می‌نشاند. */
function contact(cx, cy, rx, ry, alpha = .26) {
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
  g.addColorStop(0, `rgba(20, 12, 6, ${alpha})`);
  g.addColorStop(1, 'rgba(20, 12, 6, 0)');
  ctx.save();
  ctx.fillStyle = g;
  ctx.translate(cx, cy); ctx.scale(1, ry / Math.max(rx, ry));
  ctx.beginPath(); ctx.arc(0, 0, Math.max(rx, ry), 0, TAU); ctx.fill();
  ctx.restore();
}

const _tex = {};
/** بافتِ تکرارشونده؛ یک‌بار ساخته و بعد از حافظه خوانده می‌شود. */
function texture(key, w, h, paint) {
  if (_tex[key]) return _tex[key];
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const c = off.getContext('2d');
  paint(c, w, h);
  _tex[key] = ctx.createPattern(off, 'repeat');
  return _tex[key];
}

/** رگهٔ چوب. */
function texWood(base, grain) {
  return texture('w' + base + grain, 120, 120, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = grain; c.lineWidth = 1.4;
    for (let i = 0; i < 9; i++) {
      c.globalAlpha = .18 + noise1(i * 3.1) * .3;
      c.beginPath();
      const y0 = i * 14 + noise1(i) * 6;
      c.moveTo(0, y0);
      for (let x = 0; x <= w; x += 10) c.lineTo(x, y0 + Math.sin(x * .09 + i) * 2.6);
      c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** تارِ پارچه. */
function texCloth(base, thread) {
  return texture('c' + base + thread, 16, 16, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = thread; c.lineWidth = 1; c.globalAlpha = .5;
    for (let i = 0; i < w; i += 4) {
      c.beginPath(); c.moveTo(i, 0); c.lineTo(i, h); c.stroke();
      c.beginPath(); c.moveTo(0, i); c.lineTo(w, i); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** دانه‌های سنگ. */
function texStone(base, spec) {
  return texture('s' + base + spec, 90, 90, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) {
      c.globalAlpha = .05 + noise1(i * 1.7) * .16;
      c.fillStyle = spec;
      const r = .6 + noise1(i * 5.3) * 1.9;
      c.beginPath();
      c.arc(noise1(i * 2.1) * w, noise1(i * 3.7 + 1) * h, r, 0, TAU);
      c.fill();
    }
    c.globalAlpha = 1;
  });
}

/** الیافِ کاغذ. */
function texPaper(base) {
  return texture('p' + base, 100, 100, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 130; i++) {
      c.globalAlpha = .04 + noise1(i * 2.3) * .07;
      c.strokeStyle = i % 2 ? '#ffffff' : '#5a4326';
      c.lineWidth = .9;
      const x = noise1(i * 1.3) * w, y = noise1(i * 4.1 + 2) * h;
      const a = noise1(i * 7.7) * TAU, l = 4 + noise1(i * 9.1) * 12;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

function buildGrain() {
  const s = 260;
  const off = document.createElement('canvas');
  off.width = off.height = s;
  const c = off.getContext('2d');
  const img = c.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    const v = 214 + Math.random() * 41;
    img.data[i*4] = v; img.data[i*4+1] = v; img.data[i*4+2] = v; img.data[i*4+3] = 255;
  }
  c.putImageData(img, 0, 0);
  return ctx.createPattern(off, 'repeat');
}

function toStage(e) {
  const r = CV.getBoundingClientRect();
  return {
    x: (e.clientX - r.left - view.ox) / view.scale,
    y: (e.clientY - r.top - view.oy) / view.scale,
  };
}

const inRect = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
const inCircle = (p, b, pad = 0) => Math.hypot(p.x - b.x, p.y - b.y) <= b.r + pad;

/* ───────── قلم‌های کاغذبُری ───────── */

/** دایره‌ای که انگار با قیچی بریده شده. */
function wobbleCircle(cx, cy, r, seed = 0, amp = 2.2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const rr = r + Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp * .45;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** بیضیِ ناصاف — برای چیزهایی که گرد نیستند ولی نرم‌اند. */
function wobbleEllipse(cx, cy, rx, ry, rot = 0, seed = 0, amp = 2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const w = 1 + (Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp*.45) / Math.max(rx, ry);
    const px = Math.cos(a) * rx * w, py = Math.sin(a) * ry * w;
    const x = cx + px*Math.cos(rot) - py*Math.sin(rot);
    const y = cy + px*Math.sin(rot) + py*Math.cos(rot);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** مستطیلِ گِرد با گوشه‌های کمی کج. */
function wobbleRect(x, y, w, h, r = 12, seed = 0, amp = 1.6) {
  const j = (k) => (noise1(seed*9.7 + k) - .5) * amp * 2;
  ctx.beginPath();
  ctx.moveTo(x + r + j(1), y + j(2));
  ctx.lineTo(x + w - r + j(3), y + j(4));
  ctx.quadraticCurveTo(x + w + j(5), y + j(6), x + w + j(7), y + r + j(8));
  ctx.lineTo(x + w + j(9), y + h - r + j(10));
  ctx.quadraticCurveTo(x + w + j(11), y + h + j(12), x + w - r + j(13), y + h + j(14));
  ctx.lineTo(x + r + j(15), y + h + j(16));
  ctx.quadraticCurveTo(x + j(17), y + h + j(18), x + j(19), y + h - r + j(20));
  ctx.lineTo(x + j(21), y + r + j(22));
  ctx.quadraticCurveTo(x + j(23), y + j(24), x + r + j(1), y + j(2));
  ctx.closePath();
}

/** سایهٔ نرم؛ نور از بالا-چپ. */
function withShadow(blur, dy, alpha, fn, hue = '78, 46, 24') {
  ctx.save();
  ctx.shadowColor = `rgba(${hue}, ${alpha})`;
  ctx.shadowBlur = blur;
  ctx.shadowOffsetY = dy;
  ctx.shadowOffsetX = dy * .35;
  fn();
  ctx.restore();
}

/** یک برگه‌ی کاغذ با سایه — پایه‌ی همه‌ی کارت‌ها و تابلوها. */
function paper(x, y, w, h, fill, seed = 1, r = 12, shadow = .26) {
  withShadow(16, 7, shadow, () => {
    ctx.fillStyle = fill;
    wobbleRect(x, y, w, h, r, seed, 2);
    ctx.fill();
  });
  /* الیافِ کاغذ و لبهٔ روشن، تا سطح تخت نماند */
  ctx.save();
  ctx.beginPath(); wobbleRect(x, y, w, h, r, seed, 2); ctx.clip();
  ctx.globalAlpha = .5;
  ctx.fillStyle = texPaper(fill);
  ctx.fillRect(x, y, w, h);
  ctx.globalAlpha = 1;
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.4, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(90,60,20,.1)');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
}

function text(str, x, y, o = {}) {
  const size = o.size || 20;
  const fam = o.family || 'Vazirmatn';
  ctx.save();
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.font = `${fam === 'Lalezar' ? '400' : (o.weight || 700)} ${size}px "${fam}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.baseline || 'middle';
  ctx.fillStyle = o.color || '#43291b';
  ctx.direction = 'rtl';
  if (o.stroke) {
    ctx.lineWidth = o.strokeWidth || 5;
    ctx.strokeStyle = o.stroke;
    ctx.lineJoin = 'round';
    ctx.strokeText(str, x, y, o.maxWidth);
  }
  ctx.fillText(str, x, y, o.maxWidth);
  ctx.restore();
}

/** متنِ چندخطی که خودش می‌شکند. ارتفاعِ اشغال‌شده را برمی‌گرداند. */
function textWrap(str, x, y, maxW, o = {}) {
  const size = o.size || 19, lh = o.lineHeight || size * 1.7;
  ctx.font = `${o.weight || 700} ${size}px "${o.family || 'Vazirmatn'}", Tahoma, sans-serif`;
  const lines = [];
  for (const para of str.split('\n')) {
    let line = '';
    for (const wd of para.split(' ')) {
      const t = line ? line + ' ' + wd : wd;
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = wd; }
      else line = t;
    }
    lines.push(line);
  }
  lines.forEach((l, i) => text(l, x, y + i * lh, o));
  return lines.length * lh;
}

/* ───────── ذره‌ها ───────── */

class Bits {
  constructor() { this.list = []; }
  add(x, y, n, kind, colors, opts = {}) {
    for (let i = 0; i < n; i++) {
      const a = opts.dir !== undefined ? opts.dir + (Math.random()-.5) * (opts.spread || 1) : Math.random() * TAU;
      const sp = (opts.speed || 200) * (.4 + Math.random());
      this.list.push({
        kind, x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - (opts.lift || 0),
        r: (opts.size || 4) * (.5 + Math.random()),
        rot: Math.random() * TAU, vr: (Math.random()-.5) * 10,
        col: colors[(Math.random() * colors.length) | 0],
        grav: opts.grav === undefined ? 620 : opts.grav,
        drag: opts.drag || .995,
        life: (opts.life || .9) * (.6 + Math.random() * .8), age: 0,
      });
    }
  }
  confetti(x, y, n, colors) {
    this.add(x, y, n, 'flake', colors, { speed: 420, lift: 190, size: 5, life: 1.6, grav: 780 });
  }
  spark(x, y, n, colors) {
    this.add(x, y, n, 'dot', colors, { speed: 180, lift: 30, size: 3.4, life: .7, grav: 260, drag: .93 });
  }
  step(dt) {
    for (const p of this.list) {
      p.age += dt;
      p.vy += p.grav * dt;
      p.vx *= p.drag; p.vy *= p.drag;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    }
    this.list = this.list.filter((p) => p.age < p.life);
  }
  draw() {
    for (const p of this.list) {
      const k = clamp(1 - p.age / p.life, 0, 1);
      ctx.save();
      ctx.globalAlpha = k;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.col;
      if (p.kind === 'flake') ctx.fillRect(-p.r, -p.r*1.5, p.r*2, p.r*3);
      else if (p.kind === 'leaf') { wobbleEllipse(0, 0, p.r*1.8, p.r*.8, 0, p.r, .6); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(0, 0, p.r * k, 0, TAU); ctx.fill(); }
      ctx.restore();
    }
  }
  clear() { this.list.length = 0; }
}

/* ───────── صدا (بدون فایل صوتی) ───────── */

const sfx = {
  ac: null, on: true,
  _c() {
    if (!this.on) return null;
    if (!this.ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; this.ac = new A(); }
    if (this.ac.state === 'suspended') this.ac.resume();
    return this.ac;
  },
  tone(f, dur = .16, type = 'sine', gain = .13, delay = 0) {
    const c = this._c(); if (!c) return;
    const t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(t0 + dur + .04);
  },
  tap()  { this.tone(430, .07, 'triangle', .09); },
  place(){ this.tone(620, .11, 'sine', .12); },
  pop()  { this.tone(760, .09, 'sine', .11); },
  slide(){ this.tone(240, .22, 'sine', .07); },
  good() { [523, 659, 784].forEach((f,i) => this.tone(f, .22, 'sine', .13, i*.07)); },
  win()  { [523, 659, 784, 1047].forEach((f,i) => this.tone(f, .34, 'triangle', .13, i*.10)); },
  nope() { this.tone(180, .2, 'sawtooth', .07); },
  tick() { this.tone(1100, .04, 'square', .05); },
};

/* ───────── قطعه‌های آماده ───────── */

function star(x, y, r, col, rot = 0) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = col;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI/2 + i * Math.PI/5;
    const rr = i % 2 ? r * .45 : r;
    const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/** دکمهٔ کاغذی. hovered را خودِ بازی می‌دهد؛ اینجا فقط کشیده می‌شود. */
/** رنگ را روشن‌تر (k>0) یا تیره‌تر (k<0) می‌کند. */
function shade(col, k) {
  const c = String(col).trim();
  let r, g2, b2;
  if (c[0] === '#') {
    const h = c.length === 4 ? c[1]+c[1]+c[2]+c[2]+c[3]+c[3] : c.slice(1, 7);
    r = parseInt(h.slice(0,2), 16); g2 = parseInt(h.slice(2,4), 16); b2 = parseInt(h.slice(4,6), 16);
  } else {
    const m = c.match(/[\d.]+/g);
    if (!m || m.length < 3) return col;
    r = +m[0]; g2 = +m[1]; b2 = +m[2];
  }
  const f = (v) => Math.round(clamp(k < 0 ? v * (1 + k) : v + (255 - v) * k, 0, 255));
  return 'rgb(' + f(r) + ',' + f(g2) + ',' + f(b2) + ')';
}

function button(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 3 : 0;
  const fill = o.disabled ? (o.off || '#bcaa92') : (hot ? (o.hotFill || o.fill) : o.fill);
  const r = o.r === undefined ? 14 : o.r;
  /* لبهٔ زیرینِ تیره — دکمه از صفحه بیرون می‌زند */
  ctx.fillStyle = shade(fill, -.36);
  wobbleRect(b.x, b.y + dy + 7, b.w, b.h, r, b.x + b.y, 2);
  ctx.fill();
  withShadow(hot ? 22 : 14, hot ? 5 : 8, .32, () => {
    ctx.fillStyle = fill;
    wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2);
    ctx.fill();
  });
  /* حجم: روشن از بالا، تیره به پایین */
  ctx.save();
  ctx.beginPath(); wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2); ctx.clip();
  const g = ctx.createLinearGradient(0, b.y + dy, 0, b.y + dy + b.h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.45, 'rgba(255,255,255,.04)');
  g.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = g;
  ctx.fillRect(b.x, b.y + dy, b.w, b.h);
  /* برقِ باریکِ لبهٔ بالا */
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.fillRect(b.x + r, b.y + dy + 2, b.w - r * 2, 2);
  ctx.restore();
  text(label, b.x + b.w/2, b.y + b.h/2 + dy - (o.sub ? 9 : 0), {
    size: o.size || 26, color: o.color || '#fdf6e8', family: o.family || 'Lalezar',
  });
  if (o.sub) text(o.sub, b.x + b.w/2, b.y + b.h/2 + dy + 17,
    { size: 14, color: o.subColor || 'rgba(255,255,255,.88)' });
}

/** دکمهٔ گرد کوچک (مثل + و −). */
function roundButton(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 2 : 0;
  withShadow(10, hot ? 3 : 5, .3, () => {
    ctx.fillStyle = o.disabled ? '#cbbba3' : (hot ? (o.hotFill || o.fill) : o.fill);
    wobbleCircle(b.x, b.y + dy, b.r, b.x, 1.4);
    ctx.fill();
  });
  text(label, b.x, b.y + dy - 1,
    { size: o.size || 32, color: o.disabled ? '#a8988a' : (o.color || '#fdf6e8'), family: 'Lalezar' });
}

/** پرده‌ی تمام‌صفحه: برای شروعِ پرده و برای جشنِ پایان. */
function overlay(o) {
  const k = easeOut(clamp(o.t / .5, 0, 1));
  ctx.fillStyle = `rgba(30, 22, 16, ${.66 * k})`;
  ctx.fillRect(0, 0, SW, SH);

  const w = o.w || 700, h = o.h || 290;
  const x = (SW - w) / 2, y = o.y || (SH * .22);
  const s = lerp(.9, 1, easeBack(clamp(o.t / .65, 0, 1)));
  ctx.save();
  ctx.translate(SW/2, y + h/2);
  ctx.scale(s, s);
  ctx.translate(-SW/2, -(y + h/2));

  withShadow(30, 14, .42, () => {
    ctx.fillStyle = o.paper || '#fbf3e2';
    wobbleRect(x, y, w, h, 18, 121, 2.4);
    ctx.fill();
  });
  ctx.fillStyle = o.band || '#c8434f';
  wobbleRect(x, y, w, 12, 6, 123, 1);
  ctx.fill();

  if (o.icon) o.icon(SW/2, y + 56);
  text(o.title, SW/2, y + (o.icon ? 108 : 62),
    { size: o.titleSize || 36, color: o.ink || '#43291b', family: 'Lalezar', alpha: k });
  textWrap(o.body, SW/2, y + (o.icon ? 158 : 116), w - 90,
    { size: 19, color: o.inkSoft || '#8a6a52', alpha: k });
  ctx.restore();

  button(o.btn, o.btnLabel, { hot: o.btnHot, fill: o.btnFill || '#7fa356', hotFill: o.btnHotFill || '#8fb45f', size: 28 });
}

/** پیامِ کوتاهِ بالای صحنه. */
class Toast {
  constructor() { this.msg = null; this.t = 0; this.kind = 'info'; }
  say(msg, kind = 'info') { this.msg = msg; this.kind = kind; this.t = 2.6; }
  step(dt) { if (this.t > 0) { this.t -= dt; if (this.t <= 0) this.msg = null; } }
  draw(y = 24, colors = {}) {
    if (!this.msg) return;
    const k = clamp(this.t, 0, 1) * clamp((2.6 - this.t) * 5, 0, 1);
    ctx.save();
    ctx.globalAlpha = k;
    ctx.font = `700 19px "Vazirmatn", Tahoma, sans-serif`;
    const w = ctx.measureText(this.msg).width + 76;
    const fill = this.kind === 'good' ? (colors.good || '#7fa356')
               : this.kind === 'bad' ? (colors.bad || '#c8434f')
               : (colors.info || '#fbf3e2');
    paper(SW/2 - w/2, y, w, 48, fill, 151, 12, .3);
    text(this.msg, SW/2, y + 25,
      { size: 19, color: this.kind === 'info' ? (colors.ink || '#43291b') : '#fff8ec' });
    ctx.restore();
  }
}

/* ───────── آموزشِ پرده‌ای ─────────
   پرده‌هایی که منتظرِ کارِ بچه نیستند با یک ضربه جلو می‌روند. تایمر فقط
   پشتیبان است؛ بچهٔ کلاس سومی باید فرصتِ خواندن داشته باشد، نه اینکه
   متن قبل از تمام شدنِ خواندنش برود.                                    */

/** اگر پردهٔ فعلی خواندنی است، ضربه را می‌خورد و می‌رود پردهٔ بعد. */
function tutTap(tut, tapSteps, lastStep) {
  if (!tut.on || tapSteps.indexOf(tut.step) < 0) return false;
  if (tut.step >= lastStep) tut.on = false;
  else { tut.step++; tut.t = 0; }
  sfx.tap();
  return true;
}

/** نشانهٔ «برای ادامه بزن» — زیرِ کارتِ آموزش. */
function tutMore(cx, y, t, ink = '#3a2a18', bg = 'rgba(255, 250, 238, .94)') {
  ctx.save();
  ctx.globalAlpha = .62 + .38 * Math.sin(t * 3.2);
  ctx.font = '700 15px "Vazirmatn", Tahoma, sans-serif';
  const label = 'برای ادامه، هرجا را بزن';
  const w = ctx.measureText(label).width + 40, h = 32, x = cx - w / 2, r = 16;
  withShadow(10, 4, .3, () => {
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath(); ctx.fill();
  });
  text(label, cx, y + h / 2, { size: 15, color: ink });
  ctx.restore();
}

/** فونت‌ها را می‌آورد و بعد بازی را شروع می‌کند.
    مهم: هر دو راه (رسیدنِ فونت و مهلتِ پشتیبان) ممکن است برسند، ولی
    شروع فقط باید یک بار انجام شود؛ وگرنه دو حلقهٔ فریم راه می‌افتد و
    بازی دوبرابر سریع می‌شود. */
function whenFontsReady(start) {
  let done = false;
  const go = () => { if (done) return; done = true; start(); };
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('400 40px Lalezar'),
      document.fonts.load('700 20px Vazirmatn'),
      document.fonts.load('900 20px Vazirmatn'),
    ]).then(go, go);
    setTimeout(go, 2600);
  } else go();
}

/** حلقهٔ فریم با dtِ محدودشده. */
/* ───────── کیفیتِ خودکار ─────────
   اگر دستگاه کُند بود، اوّل درخشش و بعد رنگ‌بندی خاموش می‌شود تا بازی
   روان بماند. روی دستگاهِ قوی همه‌چیز روشن است. */
let QUALITY = 2;
let _fAcc = 0, _fN = 0, _qHold = 0;

function _qualityTick(gap) {
  if (gap <= 0 || gap > 200) return;
  _fAcc += gap; _fN++;
  if (_fN < 45) return;
  const avg = _fAcc / _fN;
  _fAcc = 0; _fN = 0;
  if (_qHold > 0) { _qHold--; return; }
  const before = QUALITY;
  if (avg > 25 && QUALITY > 0) { QUALITY--; _qHold = 3; }
  else if (avg < 18.5 && QUALITY < 2) { QUALITY++; _qHold = 6; }
  /* در پایین‌ترین کیفیت، صحنه را با نقطه‌های کمتر می‌کشیم */
  if (before !== QUALITY && (before === 0 || QUALITY === 0) && _refit) _refit();
}

/* یک حلقه، نه بیشتر — دو حلقه یعنی زمانِ بازی دوبرابر می‌گذرد. */
let _looping = false;
function runLoop(step) {
  if (_looping) return;
  _looping = true;
  let last = performance.now();
  const frame = (now) => {
    const gap = now - last;
    const dt = Math.min(gap / 1000, 1/20);
    last = now;
    _qualityTick(gap);
    step(dt);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

/* ═════════════════ بازی ═════════════════ */
/* ═══════════════════════════════════════════════════════════════════════
   برکهٔ قورباغه — ریاضی سوم، فصل ۲، درس ۵ (تقریب اعداد)
   ───────────────────────────────────────────────────────────────────────
   کتاب می‌پرسد «این عدد به کدام نزدیک‌تر است؟». اینجا «نزدیک‌تر» حرف نیست،
   قانونِ فیزیکیِ بازی است:

     قورباغه فقط تا نصفِ فاصلهٔ دو نیلوفر می‌پرد.

   یعنی از هر جای محور، تنها نیلوفری که به آن نزدیک‌تر است در دسترسِ اوست.
   اگر بچه نیلوفرِ دورتر را بزند، قورباغه وسطِ راه توی آب می‌افتد و خودش
   می‌بیند چرا. هیچ‌کس جواب را به او نگفته؛ برکه نشانش داده.

   محورها همان سه محورِ کتاب‌اند: ۰ تا ۱۰۰۰ (گام صد)، ۰ تا ۱۰۰۰۰ (گام
   هزار)، و ۱۰۰۰ تا ۲۰۰۰ (گام صد). هرچه نیلوفرها دورتر باشند، عددِ روی
   تیرکِ فرود صفرهای بیشتری دارد — همان «حذف رقم و گذاشتن صفر»، ولی دیده
   می‌شود نه اینکه گفته شود.

   سختی پلّه‌پله زیاد می‌شود:
     ۱) برگ لنگر دارد و وقت هم آزاد است.
     ۲) برگ آرام فرو می‌رود؛ باید تصمیم بگیری.
     ۳) برگ روی آب راه می‌افتد و عددش عوض می‌شود — پس نیلوفرِ درست هم
        عوض می‌شود. اینجا بچه می‌فهمد «جای روی محور» و «عدد» یک چیزند.
     ۴) شب می‌شود و محورها قاتی می‌شوند.
     برکهٔ آزاد: بی‌پایان، برای رکورد.

   عددِ ۱۰۵۰ و ۳۵۰۰ عمداً درست وسط‌اند: آنجا هر دو نیلوفر یک‌اندازه
   نزدیک‌اند و هر دو قبول است.
   ═══════════════════════════════════════════════════════════════════════ */

const LEVELS = [
  { name: 'برکهٔ صبح', axis: AX.sad, nums: [247, 439, 807, 105, 27],
    sink: 0, drift: 0,
    hint: 'قورباغه زورش به نیلوفرِ دور نمی‌رسد؛ فقط تا نصفِ راه می‌پرد.' },
  { name: 'برکهٔ بزرگ', axis: AX.hezar, nums: [920, 2250, 4781, 6099, 3500],
    sink: 26, drift: 0,
    hint: 'اینجا نیلوفرها هزار تا هزار تا فاصله دارند. برگ کم‌کم آب می‌خورد.' },
  { name: 'میانِ دو هزار', axis: AX.bein, nums: [1170, 1430, 1685, 1902, 1050],
    sink: 23, drift: 6,
    hint: 'جریانِ آب برگ را می‌برد و عددش عوض می‌شود. حواست باشد.' },
  { name: 'شبِ برکه', mixed: true, rounds: 6,
    sink: 19, drift: 10,
    hint: 'شب شد و محورها عوض می‌شوند. اوّل تیرک‌ها را بخوان.' },
  { name: 'برکهٔ آزاد', mixed: true, endless: true,
    sink: 17, drift: 11,
    hint: 'تا وقتی دل داری بپر. رکوردت را بشکن.' },
];

/* ───────── وضعیت ───────── */

const S = {
  phase: 'intro',       // intro | play | won | lost
  level: 0,
  round: 0,
  axis: AX.sad,
  val: 0,               // جای دقیقِ برگ روی محور
  sink: 0,              // ۰ تا ۱ — چقدر برگ آب خورده
  hop: null,            // پرشِ در جریان
  splash: 0,
  fell: null,           // افتاده توی آب و دارد برمی‌گردد
  hearts: 3,
  score: 0, combo: 0, best: 0,
  t: 0, phaseT: 0,
  hover: null,
  shake: 0,
  flies: [],
  fireflies: [],
  ripples: [],
  floats: [],
  landed: null,         // {v, t} نیلوفری که تازه شکفته
  sign: null,           // تابلوی عددی که پرواز می‌کند
  streak: 0,
  tut: { on: true, step: 0, t: 0 },
};

const bits = new Bits();
const toast = new Toast();
const L = () => LEVELS[S.level];
const A = () => S.axis;

function loadBest() { try { return +localStorage.getItem('berke-best') || 0; } catch { return 0; } }
function saveBest(v) { try { localStorage.setItem('berke-best', String(v)); } catch { /* حالت خصوصی */ } }

/* ───────── چیدمان ───────── */

const HUD_H = 52;
const HORIZON = 250;
const AXIS = { x: 112, y: 516, w: 976 };
const PAD_RX = 34, PAD_RY = 14;
const ROPE_Y = AXIS.y + 46;      // طنابِ محور، پایین‌ترِ نیلوفرها تا دیده شود
const PLAQUE_Y = 416;            // تیرکِ عددهای گِرد
const BTN_GO = { x: 470, y: 566, w: 260, h: 76 };

/** جایِ یک عدد روی محور. */
function xOf(v) {
  const a = A();
  return AXIS.x + ((v - a.from) / (a.to - a.from)) * AXIS.w;
}
function stations() {
  const a = A(), out = [];
  for (let v = a.from; v <= a.to + .5; v += a.step) out.push(v);
  return out;
}
function nearestStation(v) {
  const a = A();
  return clamp(Math.round((v - a.from) / a.step) * a.step + a.from, a.from, a.to);
}
/** درست وسطِ دو نیلوفر؟ آن‌وقت هر دو قبول است. */
function isMiddle(v) {
  const a = A();
  const r = ((v - a.from) % a.step + a.step) % a.step;
  return Math.abs(r - a.step / 2) < .5;
}
/** قانونِ بازی: بُردِ پرش دقیقاً نصفِ فاصلهٔ دو نیلوفر است. */
function reach() { return A().step / 2; }

/* ───────── ساختِ دور ───────── */

function randNum(a) {
  /* عدد نباید دقیقاً روی نیلوفر بیفتد، وگرنه پرشی در کار نیست. */
  const k = Math.floor(Math.random() * ((a.to - a.from) / a.step));
  const r = a.step * (.08 + Math.random() * .84);
  return Math.round(a.from + k * a.step + r);
}

function newRound() {
  const lv = L();
  if (lv.mixed) {
    const opts = [AX.sad, AX.hezar, AX.bein];
    S.axis = opts[Math.floor(Math.random() * opts.length)];
    S.val = randNum(S.axis);
  } else {
    S.axis = lv.axis;
    S.val = lv.nums[S.round];
  }
  S.sink = 0;
  S.hop = null;
  S.fell = null;
  S.landed = null;
  S.sign = null;
  S.swim = null;
  S.flies = [];
  const n = 2 + Math.floor(Math.random() * 3);
  for (let i = 0; i < n; i++) S.flies.push(makeFly());
  ripple(xOf(S.val), AXIS.y, 1);
}

function makeFly() {
  return {
    x: 160 + Math.random() * 880,
    y: 300 + Math.random() * 150,
    ph: Math.random() * TAU,
    sp: .5 + Math.random() * .7,
    r: 26 + Math.random() * 30,
    gone: false,
  };
}

function startLevel(i) {
  S.level = i;
  S.round = 0;
  S.hearts = 3;
  S.combo = 0;
  S.splash = 0;
  S.phase = 'play'; S.phaseT = 0;
  S.tut.on = i === 0; S.tut.step = 0; S.tut.t = 0;
  S.fireflies = [];
  if (i >= 3) for (let k = 0; k < 26; k++) {
    S.fireflies.push({ x: Math.random() * SCENE_W, y: 280 + Math.random() * 380,
                       ph: Math.random() * TAU, sp: .3 + Math.random() * .5 });
  }
  newRound();
  toast.say(LEVELS[i].hint, 'info');
}

function ripple(x, y, k) { S.ripples.push({ x, y, t: 0, k: k || 1 }); }
function floatText(x, y, txt, col, size) { S.floats.push({ x, y, txt, col, t: 0, size: size || 26 }); }

/* ───────── حلقه ───────── */

const cv = document.getElementById('stage');
initStage(cv, SCENE_W, SCENE_H);
S.best = loadBest();
whenFontsReady(() => runLoop(step));

function step(dt) {
  S.t += dt; S.phaseT += dt;
  if (S.shake > 0) S.shake -= dt;
  if (S.splash > 0) S.splash -= dt;

  if (S.phase === 'play') {
    const lv = L();
    const frozen = S.tut.on && S.tut.step < 1;      // در آموزش وقت نمی‌گذرد
    if (!S.hop && !S.swim && !S.fell && !frozen) {
      if (lv.sink > 0) {
        S.sink += dt / lv.sink;
        if (S.sink >= 1) drown();
      }
      if (lv.drift > 0) {
        const a = A();
        S.val = clamp(S.val + lv.drift * dt, a.from + 1, a.to - 1);
      }
    }
    stepHop(dt);
    stepFell(dt);
    stepSwim(dt);
    if (S.tut.on) tutStep(dt);
  }

  for (const f of S.flies) {
    f.ph += dt * f.sp * 2.4;
    f.x += Math.cos(f.ph * .7) * dt * 26;
    f.y += Math.sin(f.ph) * dt * 18;
  }
  for (const f of S.fireflies) { f.ph += dt * f.sp; f.x += Math.cos(f.ph) * dt * 9; }

  for (const r of S.ripples) r.t += dt;
  S.ripples = S.ripples.filter((r) => r.t < 1.7);
  for (const f of S.floats) { f.t += dt; f.y -= 40 * dt; }
  S.floats = S.floats.filter((f) => f.t < 1.5);
  if (S.landed) S.landed.t += dt;
  if (S.sign) { S.sign.t += dt * 1.6; if (S.sign.t > 1) S.sign.t = 1; }

  bits.step(dt);
  toast.step(dt);
  draw();
}

/* ───────── پرش ─────────
   بُردِ پرش = نصفِ فاصلهٔ دو نیلوفر. همین یک خط، کلِ درس است.      */

function jumpTo(v) {
  if (S.hop || S.swim || S.phase !== 'play') return;
  const d = Math.abs(v - S.val);
  const ok = d <= reach() + 1e-6;
  const dir = Math.sign(v - S.val) || 1;
  const endV = ok ? v : S.val + dir * reach();
  S.hop = {
    t: 0, ok, target: v,
    x0: xOf(S.val), x1: xOf(endV),
    lift: 120 + Math.min(220, Math.abs(xOf(endV) - xOf(S.val)) * .5),
    ate: false,
  };
  sfx.tone(360, .12, 'triangle', .1);
  if (S.tut.on && S.tut.step === 1) { S.tut.step = 2; S.tut.t = 0; }
}

function stepHop(dt) {
  const h = S.hop;
  if (!h) return;
  h.t += dt * 1.55;

  /* مگسِ سرِ راه: مهارت است، نه راهنما — هیچ ربطی به جوابِ درست ندارد. */
  if (!h.ate && h.t > .2 && h.t < .85) {
    const k = clamp(h.t, 0, 1);
    const fx = lerp(h.x0, h.x1, k);
    const fy = AXIS.y - Math.sin(k * Math.PI) * h.lift - 26;
    for (const f of S.flies) {
      if (!f.gone && Math.hypot(f.x - fx, f.y - fy) < 34) {
        f.gone = true; h.ate = true;
        S.score += 150;
        S.sink = Math.max(0, S.sink - .18);
        floatText(fx, fy - 20, `+${fa(150)}`, P.gold, 24);
        bits.spark(fx, fy, 10, [P.gold, '#fff3d0']);
        sfx.pop();
      }
    }
  }
  if (h.t < 1) return;

  S.hop = null;
  if (h.ok) land(h.target); else splash(h.x1);
}

function land(v) {
  S.combo++;
  S.streak++;
  const pts = 100 * Math.min(S.combo, 5);
  S.score += pts;
  if (S.score > S.best) { S.best = S.score; saveBest(S.best); }
  S.landed = { v, t: 0 };
  S.sign = { from: xOf(S.val), to: xOf(v), t: 0, val: S.val };
  ripple(xOf(v), AXIS.y, 1.3);
  bits.confetti(xOf(v), AXIS.y - 30, 18, [P.petal, P.pollen, P.padLit, '#fff']);
  floatText(xOf(v), AXIS.y - 96, `+${fa(pts)}`, P.gold);
  sfx.good();
  if (isMiddle(S.val)) toast.say('درست وسط بود؛ هر دو یک‌اندازه نزدیک بودند', 'good');
  S.swim = { t: 0, at: v };
}

function stepFell(dt) {
  if (!S.fell) return;
  S.fell.t += dt;
  if (S.fell.t > 1.25) S.fell = null;
}

function splash(x) {
  S.fell = { x, t: 0 };
  S.combo = 0;
  S.shake = .38;
  S.splash = .7;
  S.sink = Math.min(.97, S.sink + .22);
  ripple(x, AXIS.y + 6, 1.6);
  bits.add(x, AXIS.y, 22, 'dot', ['#bfe6e2', '#8fc9c6', '#e6f6f2'],
    { speed: 260, lift: 210, size: 4.5, life: .9, grav: 700 });
  sfx.tone(150, .3, 'sine', .09);
  toast.say('نرسید! زورش تا آنجا نمی‌رسد', 'bad');
}

function stepSwim(dt) {
  if (!S.swim) return;
  S.swim.t += dt;
  if (S.swim.t < 1.15) return;
  S.swim = null;
  const lv = L();
  S.round++;
  const total = lv.mixed ? (lv.rounds || Infinity) : lv.nums.length;
  if (S.round >= total) {
    S.phase = 'won'; S.phaseT = 0;
    sfx.win();
    bits.confetti(SCENE_W / 2, 300, 70, [P.petal, P.pollen, P.padLit, '#fff']);
    return;
  }
  newRound();
}

function drown() {
  S.hearts--;
  S.combo = 0;
  S.sink = 0;
  S.shake = .4;
  ripple(xOf(S.val), AXIS.y, 1.5);
  bits.add(xOf(S.val), AXIS.y, 18, 'dot', ['#bfe6e2', '#8fc9c6'],
    { speed: 220, lift: 180, size: 4, life: .8 });
  sfx.nope();
  if (S.hearts <= 0) { S.phase = 'lost'; S.phaseT = 0; return; }
  toast.say('برگ آب خورد! برگِ تازه', 'bad');
  const lv = L();
  S.round++;
  const total = lv.mixed ? (lv.rounds || Infinity) : lv.nums.length;
  if (S.round >= total) { S.phase = 'won'; S.phaseT = 0; sfx.win(); return; }
  newRound();
}

/* ───────── آموزش ───────── */

const TUT_TAP = [0, 2], TUT_LAST = 2;      // پرده‌های خواندنی

function tutStep(dt) {
  S.tut.t += dt;
  if (S.tut.step === 0 && S.tut.t > 30) { S.tut.step = 1; S.tut.t = 0; }
  if (S.tut.step === 2 && S.tut.t > 30) S.tut.on = false;
}

/* ───────── ورودی ───────── */

function hitTest(p) {
  if (S.phase !== 'play') return inRect(p, BTN_GO) ? BTN_GO : null;
  for (const v of stations()) {
    const x = xOf(v);
    /* هدفِ لمس بزرگ‌تر از خودِ نیلوفر است؛ انگشتِ بچهٔ هشت‌ساله دقیق نیست. */
    if (Math.abs(p.x - x) < 50 && p.y > AXIS.y - 66 && p.y < AXIS.y + 62) return { pad: v };
  }
  return null;
}

cv.addEventListener('pointermove', (e) => {
  S.hover = hitTest(toStage(e));
  cv.style.cursor = S.hover ? 'pointer' : 'default';
});
cv.addEventListener('pointerleave', () => { S.hover = null; });
cv.addEventListener('pointerdown', (e) => {
  if (S.phase === 'play' && tutTap(S.tut, TUT_TAP, TUT_LAST)) return;
  const h = hitTest(toStage(e));
  if (S.phase === 'intro') { if (h) startLevel(0); return; }
  if (S.phase === 'won') {
    if (!h) return;
    if (S.level + 1 < LEVELS.length) startLevel(S.level + 1);
    else { S.score = 0; startLevel(0); }
    return;
  }
  if (S.phase === 'lost') { if (h) { S.score = 0; startLevel(S.level); } return; }
  if (h && h.pad !== undefined) jumpTo(h.pad);
});

/* ───────── ابزارِ نقاشی ───────── */

function rrPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/** عددها را چپ‌به‌راست می‌نویسد تا رقم‌ها جابه‌جا نشوند. */
function numText(str, x, y, o = {}) {
  ctx.save();
  ctx.font = `${o.family === 'Vazirmatn' ? (o.weight || 700) : '400'} ${o.size || 20}px "${o.family || 'Lalezar'}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  ctx.direction = 'ltr';
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  if (o.stroke) {
    ctx.lineWidth = o.strokeWidth || 6; ctx.lineJoin = 'round';
    ctx.strokeStyle = o.stroke; ctx.strokeText(str, x, y);
  }
  ctx.fillStyle = o.color || P.ink;
  ctx.fillText(str, x, y);
  ctx.restore();
}

function spot(rects, alpha) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, SCENE_W, SCENE_H);
  for (const r of rects) rrPath(r.x - 12, r.y - 12, r.w + 24, r.h + 24, 24);
  ctx.fillStyle = `rgba(8, 18, 28, ${alpha})`;
  ctx.fill('evenodd');
  ctx.restore();
}

function pointHand(x, y) {
  const bob = Math.sin(S.t * 3.4) * 8;
  ctx.save();
  ctx.translate(x, y + bob);
  withShadow(12, 5, .4, () => {
    ctx.fillStyle = '#f6dfc0';
    ctx.beginPath();
    ctx.moveTo(0, -6);
    ctx.quadraticCurveTo(-9, -2, -10, 16);
    ctx.quadraticCurveTo(-11, 34, 0, 36);
    ctx.quadraticCurveTo(11, 34, 10, 16);
    ctx.quadraticCurveTo(9, -2, 0, -6);
    ctx.closePath(); ctx.fill();
    wobbleCircle(0, -12, 8, 4, 1); ctx.fill();
  }, '6, 16, 24');
  ctx.strokeStyle = '#c9a982'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-7, 18); ctx.lineTo(7, 18); ctx.stroke();
  ctx.restore();
}

const isNight = () => S.level >= 3;

/* ───────── صحنه ───────── */

function draw() {
  beginScene('#10202a');
  ctx.save();
  if (S.shake > 0) {
    const k = S.shake * 14;
    ctx.translate(Math.sin(S.t * 58) * k, Math.cos(S.t * 47) * k * .5);
  }

  drawSky();
  drawHills();
  drawWater();
  drawRipples();
  drawAxis();
  drawPosts();
  drawPads();
  drawLeaf();
  drawFlies();
  drawFrogNow();
  drawExactSign();
  drawSignFlight();
  drawForeReeds();
  bits.draw();
  drawFloats();
  if (isNight()) drawNight();
  ctx.restore();

  drawHUD();
  if (!(S.phase === 'play' && S.tut.on)) {      // یک پیام در یک لحظه بس است
    toast.draw(HUD_H + 12, { good: P.good, bad: P.bad, info: P.plaque, ink: P.ink });
  }

  if (S.phase === 'play' && S.tut.on) drawTutorial();
  if (S.phase === 'intro') drawIntro();
  if (S.phase === 'won') drawWon();
  if (S.phase === 'lost') drawLost();

  endScene(.12, 'rgba(6, 20, 30, .40)');
}

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, HORIZON);
  if (isNight()) { g.addColorStop(0, '#141d3a'); g.addColorStop(1, '#3c3b5e'); }
  else { g.addColorStop(0, P.skyHi); g.addColorStop(.5, '#6e7a78'); g.addColorStop(.82, '#c98f63'); g.addColorStop(1, P.skyLo); }
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, SCENE_W, HORIZON + 2);

  /* خورشیدِ غروب یا ماه */
  const sx = 940, sy = isNight() ? 118 : 196;
  const hal = ctx.createRadialGradient(sx, sy, 8, sx, sy, 190);
  hal.addColorStop(0, isNight() ? 'rgba(214, 226, 255, .32)' : 'rgba(255, 214, 150, .40)');
  hal.addColorStop(1, 'rgba(255, 214, 150, 0)');
  ctx.fillStyle = hal;
  ctx.fillRect(sx - 190, sy - 190, 380, 380);
  ctx.fillStyle = isNight() ? '#e8eeff' : P.sunCol;
  wobbleCircle(sx, sy, isNight() ? 30 : 44, 7, 1.6); ctx.fill();
  if (isNight()) {
    ctx.fillStyle = '#141d3a';
    wobbleCircle(sx - 15, sy - 8, 27, 9, 1.4); ctx.fill();
    for (let i = 0; i < 40; i++) {
      const x = noise1(i * 3.1) * SCENE_W, y = noise1(i * 7.7) * (HORIZON - 40) + 12;
      ctx.globalAlpha = .3 + .6 * noise1(i * 1.3) * (.5 + .5 * Math.sin(S.t * 2 + i));
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(x, y, 1.4 + noise1(i) * 1.2, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  } else {
    /* ابرهای کشیده و پرنده‌های دور */
    ctx.globalAlpha = .3;
    ctx.fillStyle = '#ffe9cd';
    for (let i = 0; i < 5; i++) {
      const y = 80 + i * 30, w = 160 + noise1(i) * 220;
      const x = ((i * 300 + S.t * (5 + i * 2)) % (SCENE_W + 400)) - 200;
      wobbleEllipse(x, y, w, 9 + i, 0, i * 3, 1.6); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(40, 60, 66, .45)'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      const x = 180 + i * 62 + Math.sin(S.t * .3 + i) * 20, y = 96 + Math.sin(S.t * .5 + i * 2) * 8;
      const f = Math.sin(S.t * 3 + i) * 4;
      ctx.beginPath();
      ctx.moveTo(x - 11, y + f); ctx.quadraticCurveTo(x, y - 5, x + 11, y + f);
      ctx.stroke();
    }
  }
}

function drawHills() {
  const bands = [
    { y: HORIZON - 76, col: P.hillFar, amp: 30, seed: 3 },
    { y: HORIZON - 42, col: P.hillMid, amp: 22, seed: 9 },
    { y: HORIZON - 14, col: P.hillNear, amp: 14, seed: 17 },
  ];
  for (const b of bands) {
    ctx.fillStyle = b.col;
    ctx.beginPath();
    ctx.moveTo(-10, HORIZON + 4);
    for (let x = -10; x <= SCENE_W + 10; x += 40) {
      ctx.lineTo(x, b.y - Math.sin(x * .006 + b.seed) * b.amp - noise1(x * .01 + b.seed) * b.amp * .5);
    }
    ctx.lineTo(SCENE_W + 10, HORIZON + 4);
    ctx.closePath(); ctx.fill();
  }
  /* نی‌های ساحلِ دور — سایه‌نما */
  ctx.strokeStyle = P.reedDk; ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (let i = 0; i < 70; i++) {
    const x = noise1(i * 5.3) * SCENE_W;
    const h = 22 + noise1(i * 2.1) * 40;
    const sw = Math.sin(S.t * .7 + i) * 4;
    ctx.beginPath();
    ctx.moveTo(x, HORIZON + 2);
    ctx.quadraticCurveTo(x + sw * .5, HORIZON - h * .6, x + sw, HORIZON - h);
    ctx.stroke();
    if (i % 5 === 0) {
      ctx.fillStyle = '#2a4b45';
      wobbleEllipse(x + sw, HORIZON - h - 5, 3.6, 8, 0, i, .6); ctx.fill();
    }
  }
}

function drawWater() {
  const g = ctx.createLinearGradient(0, HORIZON, 0, SCENE_H);
  g.addColorStop(0, P.waterHi);
  g.addColorStop(.16, '#2d6a72');
  g.addColorStop(.5, '#1a4854');
  g.addColorStop(1, P.waterLo);
  ctx.fillStyle = g;
  ctx.fillRect(0, HORIZON, SCENE_W, SCENE_H - HORIZON);

  /* ستونِ نورِ خورشید روی آب */
  if (!isNight()) {
    ctx.save();
    for (let i = 0; i < 34; i++) {
      const p2 = i / 34;
      const y = HORIZON + 4 + Math.pow(p2, 1.8) * (SCENE_H - HORIZON);
      const w = 16 + p2 * 190;
      ctx.globalAlpha = .16 * (1 - p2 * .75);
      ctx.fillStyle = '#ffd9a0';
      const off = Math.sin(S.t * 1.4 + i * .8) * (4 + p2 * 26);
      wobbleEllipse(940 + off, y, w * (.5 + noise1(i * 2.3) * .7), 2.6 + p2 * 3, 0, i, 1.2);
      ctx.fill();
    }
    ctx.restore();
  }

  /* بازتابِ نور روی آب: هرچه نزدیک‌تر، موج‌ها پهن‌تر */
  ctx.save();
  for (let i = 0; i < 26; i++) {
    const p = i / 26;
    const y = HORIZON + 6 + Math.pow(p, 1.7) * (SCENE_H - HORIZON);
    const amp = 8 + p * 44;
    ctx.globalAlpha = .05 + .07 * (1 - p);
    ctx.strokeStyle = '#d6f4f0';
    ctx.lineWidth = 1.5 + p * 3.5;
    ctx.beginPath();
    for (let x = -20; x <= SCENE_W + 20; x += 24) {
      const yy = y + Math.sin(x * .012 + S.t * (.5 + p) + i) * (1.5 + p * 3);
      x === -20 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy);
    }
    ctx.stroke();
    if (i % 4 === 0) {
      ctx.globalAlpha = .05;
      ctx.fillStyle = '#eafffb';
      wobbleEllipse(200 + noise1(i * 3) * 800, y, amp, 2.4, 0, i, 1); ctx.fill();
    }
  }
  ctx.restore();
}

function drawRipples() {
  for (const r of S.ripples) {
    const k = clamp(r.t / 1.7, 0, 1);
    ctx.save();
    ctx.globalAlpha = (1 - k) * .55;
    ctx.strokeStyle = '#d6f4f0';
    ctx.lineWidth = 3 * (1 - k) + .6;
    for (const m of [1, .62]) {
      ctx.beginPath();
      ctx.ellipse(r.x, r.y, 20 + k * 110 * r.k * m, (20 + k * 110 * r.k * m) * .34, 0, 0, TAU);
      ctx.stroke();
    }
    ctx.restore();
  }
}

/* ───────── محور ─────────
   محور را مثل یک طنابِ کشیده روی آب می‌کشیم با گره‌های ریز؛ خطِ خشکِ
   ریاضی نباشد ولی همان محورِ کتاب باشد.                              */

function drawAxis() {
  ctx.save();
  ctx.globalAlpha = .5;
  ctx.strokeStyle = '#0d2730'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(AXIS.x - 46, ROPE_Y + 4); ctx.lineTo(AXIS.x + AXIS.w + 46, ROPE_Y + 4);
  ctx.stroke();
  ctx.restore();

  ctx.strokeStyle = '#c9dfd7'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.globalAlpha = .72;
  ctx.beginPath();
  ctx.moveTo(AXIS.x - 46, ROPE_Y);
  for (let x = AXIS.x - 46; x <= AXIS.x + AXIS.w + 46; x += 20) {
    ctx.lineTo(x, ROPE_Y + Math.sin(x * .02 + S.t) * 1.6);
  }
  ctx.stroke();
  /* پیکانِ دو سر: محور ادامه دارد */
  for (const s of [-1, 1]) {
    const x = s < 0 ? AXIS.x - 46 : AXIS.x + AXIS.w + 46;
    ctx.beginPath();
    ctx.moveTo(x - s * 14, ROPE_Y - 8); ctx.lineTo(x, ROPE_Y); ctx.lineTo(x - s * 14, ROPE_Y + 8);
    ctx.stroke();
  }
  /* گره‌های ریزِ بین نیلوفرها — ده‌بخشیِ فاصله، مثل خط‌کش */
  const st = stations();
  ctx.globalAlpha = .34;
  ctx.lineWidth = 2.4;
  for (let i = 0; i < st.length - 1; i++) {
    for (let k = 1; k < 10; k++) {
      const x = lerp(xOf(st[i]), xOf(st[i + 1]), k / 10);
      const h = k === 5 ? 11 : 6;
      ctx.beginPath(); ctx.moveTo(x, ROPE_Y - h); ctx.lineTo(x, ROPE_Y + h); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

/** تیرکِ چوبیِ پشتِ هر نیلوفر با عددِ گِردِ آن. */
function drawPosts() {
  for (const v of stations()) {
    const x = xOf(v);
    const lit = S.landed && S.landed.v === v;
    const pulse = lit ? 1 + Math.sin(S.landed.t * 9) * .06 * Math.max(0, 1 - S.landed.t) : 1;
    ctx.save();
    ctx.translate(x, 0);
    ctx.scale(pulse, pulse);
    ctx.translate(-x, 0);
    ctx.fillStyle = P.woodDk;
    wobbleRect(x - 3.5, PLAQUE_Y + 32, 7, 74, 2, x, .8); ctx.fill();
    withShadow(10, 5, .34, () => {
      ctx.fillStyle = lit ? '#fff8e2' : P.plaque;
      wobbleRect(x - 31, PLAQUE_Y, 62, 30, 6, x + 3, 1.2); ctx.fill();
    }, '6, 16, 24');
    ctx.fillStyle = lit ? P.gold : P.wood;
    wobbleRect(x - 31, PLAQUE_Y, 62, 5, 2, x + 5, .8); ctx.fill();
    numText(fa(v), x, PLAQUE_Y + 16, { size: 17, color: lit ? P.ink : '#4a4433' });
    ctx.restore();
  }
}

/** نیلوفرِ آبی: بیضیِ کمی ناصاف با یک بریدگیِ گوه‌ای. */
function lilyPad(cx, cy, rx, ry, seed, col, colDk, notch) {
  ctx.save();
  ctx.globalAlpha = .28;
  ctx.fillStyle = '#07202a';
  wobbleEllipse(cx + 4, cy + 7, rx, ry, 0, seed + 2, 1.6); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = colDk;
  wobbleEllipse(cx, cy + 3, rx, ry, 0, seed, 1.8); ctx.fill();
  ctx.fillStyle = col;
  wobbleEllipse(cx, cy, rx, ry, 0, seed + 1, 1.8); ctx.fill();
  /* بریدگی */
  ctx.fillStyle = 'rgba(18, 50, 61, .85)';
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx + Math.cos(notch - .22) * rx, cy + Math.sin(notch - .22) * ry);
  ctx.lineTo(cx + Math.cos(notch + .22) * rx, cy + Math.sin(notch + .22) * ry);
  ctx.closePath(); ctx.fill();
  /* رگبرگ‌ها */
  ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = 1.6;
  for (let i = 0; i < 7; i++) {
    const a = notch + .55 + i * (TAU - 1.1) / 6;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a) * rx * .88, cy + Math.sin(a) * ry * .88);
    ctx.stroke();
  }
  ctx.restore();
}

/** گلِ نیلوفر — روی نیلوفری که تازه فرود آمده باز می‌شود. */
function lotus(cx, cy, k) {
  if (k <= 0) return;
  const s = easeBack(clamp(k, 0, 1));
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(s, s);
  for (let ring = 0; ring < 2; ring++) {
    const n = ring ? 6 : 5, r = ring ? 15 : 24, col = ring ? P.petal : P.petalMid;
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + i * TAU / n + ring * .5;
      ctx.fillStyle = col;
      ctx.save();
      ctx.rotate(a + Math.PI / 2);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(-9, -r * .7, 0, -r);
      ctx.quadraticCurveTo(9, -r * .7, 0, 0);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }
  ctx.fillStyle = P.pollen;
  wobbleCircle(0, 0, 7, 3, .8); ctx.fill();
  ctx.restore();
}

function padGeom(v) {
  const x = xOf(v), n = noise1(v * .017 + 3);
  return {
    x,
    y: AXIS.y + (n - .5) * 7 + Math.sin(S.t * 1.3 + x * .01) * 2.2,
    rx: PAD_RX * (.86 + n * .3),
    ry: PAD_RY * (.88 + noise1(v * .031) * .28),
    notch: 1.1 + noise1(v * .043) * 2.4,
  };
}

function drawPads() {
  /* اوّل بازتابِ لرزانِ نیلوفرها روی آب — آبِ خالیِ پایین را زنده می‌کند. */
  ctx.save();
  ctx.globalAlpha = .11;
  for (const v of stations()) {
    const g = padGeom(v);
    ctx.fillStyle = '#8fd07a';
    for (let i = 0; i < 3; i++) {
      const yy = g.y + 19 + i * 9;
      const w = g.rx * (.9 - i * .22);
      const off = Math.sin(S.t * 1.7 + i * .9 + g.x * .02) * (3 + i * 3);
      ctx.beginPath();
      ctx.ellipse(g.x + off, yy, w, 2.6, 0, 0, TAU);
      ctx.fill();
    }
  }
  ctx.restore();

  for (const v of stations()) {
    const g = padGeom(v);
    const hot = S.hover && S.hover.pad === v && !S.hop && !S.swim;
    const lit = S.landed && S.landed.v === v;
    if (hot) {
      ctx.save();
      ctx.globalAlpha = .34;
      ctx.fillStyle = '#eafffb';
      wobbleEllipse(g.x, g.y, g.rx + 11, g.ry + 7, 0, g.x, 2); ctx.fill();
      ctx.restore();
    }
    lilyPad(g.x, g.y, g.rx, g.ry, g.x, lit ? P.padLit : P.padBig, P.padBigDk, g.notch);
    if (lit) lotus(g.x, g.y - 5, clamp(S.landed.t * 2.6, 0, 1) * .78);
  }
}

/* ───────── برگِ قورباغه ───────── */

function drawLeaf() {
  if (S.swim) return;
  const x = xOf(S.val);
  const sink = S.sink;
  const y = AXIS.y + sink * 15;
  const tilt = Math.sin(S.t * 1.6) * .05 + sink * .14;

  /* حلقهٔ آبِ دورِ برگ: نشان می‌دهد این‌یکی روی آبِ باز شناور است. */
  ctx.save();
  ctx.globalAlpha = .3;
  ctx.strokeStyle = '#d6f4f0'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(x, y + 6, 44 + Math.sin(S.t * 2) * 3, 15, 0, 0, TAU);
  ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(tilt);
  ctx.globalAlpha = .32;
  ctx.fillStyle = '#07202a';
  wobbleEllipse(3, 8, 32, 12, 0, 5, 1.3); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = P.leafDk;
  wobbleEllipse(0, 3, 31, 12, 0, 11, 1.4); ctx.fill();
  ctx.fillStyle = P.leaf;
  wobbleEllipse(0, 0, 31, 12, 0, 12, 1.4); ctx.fill();
  /* لبهٔ تاخورده — برگ است، نه نیلوفر */
  ctx.fillStyle = P.leafLit;
  ctx.beginPath();
  ctx.moveTo(-31, 0);
  ctx.quadraticCurveTo(-20, -12, -6, -9);
  ctx.quadraticCurveTo(-18, -3, -31, 0);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(-28, 1); ctx.lineTo(28, -2); ctx.stroke();
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath(); ctx.moveTo(i * 11, -1); ctx.lineTo(i * 11 + 3, 7); ctx.stroke();
  }
  if (sink > .02) {
    ctx.save();
    ctx.beginPath(); ctx.ellipse(0, 0, 31, 12, 0, 0, TAU); ctx.clip();
    ctx.fillStyle = 'rgba(24, 66, 78, .85)';
    ctx.fillRect(-34, 12 - sink * 26, 68, 32);
    ctx.restore();
  }
  ctx.restore();

  /* لنگرِ نی وقتی جریان نیست */
  if (L().drift === 0 && !L().mixed) {
    ctx.strokeStyle = P.reed; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x + 22, y + 2);
    ctx.quadraticCurveTo(x + 44, y - 26, x + 38, y - 62);
    ctx.stroke();
    ctx.fillStyle = P.woodDk;
    wobbleEllipse(x + 38, y - 70, 5, 12, 0, 21, .7); ctx.fill();
  }
}

/* ───────── قورباغه ───────── */

function drawFrog(x, y, sc, o = {}) {
  const jump = o.jump || 0;              // ۰ نشسته، ۱ در اوجِ پرش
  const bob = jump ? 0 : Math.sin(S.t * 2.2) * 2;
  const blink = noise1(Math.floor(S.t * 1.4)) > .88 ? 1 : 0;
  const puff = o.croak ? Math.abs(Math.sin(S.t * 8)) : 0;
  ctx.save();
  ctx.translate(x, y + bob);
  ctx.rotate((o.rot || 0));
  ctx.scale(sc * (o.flip ? -1 : 1), sc);

  /* پاهای عقب */
  ctx.fillStyle = P.frogDk;
  for (const s of [-1, 1]) {
    ctx.save();
    ctx.scale(s, 1);
    ctx.beginPath();
    if (jump > .1) {
      ctx.moveTo(12, -6);
      ctx.quadraticCurveTo(34, 2 + jump * 8, 46 + jump * 16, 10 + jump * 4);
      ctx.quadraticCurveTo(36, 14 + jump * 6, 10, 4);
    } else {
      ctx.moveTo(10, -10);
      ctx.quadraticCurveTo(30, -12, 30, 2);
      ctx.quadraticCurveTo(30, 12, 8, 8);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  /* بدن */
  withShadow(14, 6, .32, () => {
    ctx.fillStyle = P.frog;
    wobbleEllipse(0, -12, 27, 22, 0, 33, 1.6); ctx.fill();
  }, '6, 16, 24');
  ctx.fillStyle = P.frogBelly;
  wobbleEllipse(0, -4, 19, 12, 0, 35, 1.2); ctx.fill();
  /* لکه‌ها */
  ctx.fillStyle = P.frogSpot;
  ctx.globalAlpha = .55;
  wobbleCircle(-15, -22, 5, 41, .8); ctx.fill();
  wobbleCircle(13, -26, 4, 43, .8); ctx.fill();
  wobbleCircle(18, -14, 3.4, 45, .8); ctx.fill();
  ctx.globalAlpha = 1;
  /* دست‌های جلو */
  ctx.fillStyle = P.frogDk;
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.ellipse(s * 17, 4 + (jump > .1 ? -6 : 0), 6, 9, s * .35, 0, TAU);
    ctx.fill();
  }
  /* گلو که باد می‌کند */
  if (puff > .02) {
    ctx.fillStyle = P.frogBelly;
    wobbleEllipse(0, 3, 12 + puff * 8, 8 + puff * 7, 0, 47, 1); ctx.fill();
  }
  /* چشم‌ها روی سر */
  for (const s of [-1, 1]) {
    ctx.fillStyle = P.frog;
    wobbleCircle(s * 13, -34, 11, 51 + s, 1); ctx.fill();
    if (blink) {
      ctx.strokeStyle = P.ink; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(s * 13 - 6, -34); ctx.lineTo(s * 13 + 6, -34); ctx.stroke();
    } else {
      ctx.fillStyle = '#fdf6e8';
      wobbleCircle(s * 13, -35, 7.4, 53 + s, .8); ctx.fill();
      ctx.fillStyle = P.ink;
      const lx = clamp((o.look || 0) * .5, -3, 3);
      ctx.beginPath(); ctx.arc(s * 13 + lx, -35, 4, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(s * 13 + lx - 1.6, -37, 1.5, 0, TAU); ctx.fill();
    }
  }
  /* دهان */
  ctx.strokeStyle = P.frogDk; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(0, -14, 12, .12 * Math.PI, .88 * Math.PI);
  ctx.stroke();
  ctx.restore();
}

function drawFrogNow() {
  if (S.swim) {
    /* شیرجه زد و دارد به برگِ بعدی شنا می‌کند */
    const k = clamp(S.swim.t / 1.15, 0, 1);
    ctx.save();
    ctx.globalAlpha = .35;
    ctx.strokeStyle = '#d6f4f0'; ctx.lineWidth = 2.5;
    const x = lerp(xOf(S.swim.at), xOf(S.val), easeInOut(k));
    ctx.beginPath();
    ctx.ellipse(x, AXIS.y + 12, 16 + Math.sin(S.t * 9) * 3, 6, 0, 0, TAU);
    ctx.stroke();
    ctx.restore();
    return;
  }
  const h = S.hop;
  if (h) {
    const k = clamp(h.t, 0, 1);
    const x = lerp(h.x0, h.x1, k);
    const y = AXIS.y - 9 - Math.sin(k * Math.PI) * h.lift + (h.ok ? 0 : easeIn(k) * 26);
    const dir = Math.sign(h.x1 - h.x0) || 1;
    const rot = Math.cos(k * Math.PI) * -.5 * dir;
    drawFrog(x, y, .8, { jump: Math.sin(k * Math.PI), rot, flip: dir < 0, look: dir * 6 });
    return;
  }
  if (S.fell) {
    /* نصفِ بدن زیر آب، بعد شناکنان برمی‌گردد روی برگ. */
    const k = clamp(S.fell.t / 1.25, 0, 1);
    const back = easeInOut(clamp((k - .42) / .58, 0, 1));
    const fx = lerp(S.fell.x, xOf(S.val), back);
    const fy = AXIS.y + 12 - back * 20;
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, SCENE_W, AXIS.y + 10 + back * 8);
    ctx.clip();
    drawFrog(fx, fy, .8, { look: Math.sign(xOf(S.val) - S.fell.x) * 5, wet: 1 });
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = .4;
    ctx.strokeStyle = '#d6f4f0'; ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.ellipse(fx, AXIS.y + 10, 26 + Math.sin(S.t * 8) * 4, 9, 0, 0, TAU);
    ctx.stroke();
    ctx.restore();
    return;
  }

  const x = xOf(S.val);
  const y = AXIS.y - 9 + S.sink * 15;
  let look = 0;
  if (S.hover && S.hover.pad !== undefined) look = Math.sign(xOf(S.hover.pad) - x) * 6;
  drawFrog(x, y, .8, { look, croak: noise1(Math.floor(S.t * .7)) > .8 });
}

/* ───────── تابلوی عددِ دقیق ───────── */

function drawExactSign() {
  if (S.swim) return;
  const x = xOf(S.val), y = 322 + S.sink * 10;
  ctx.save();
  ctx.strokeStyle = P.reed; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x, AXIS.y - 30);
  ctx.quadraticCurveTo(x - 6, y + 90, x, y + 30);
  ctx.stroke();
  withShadow(18, 8, .4, () => {
    ctx.fillStyle = '#fffaee';
    wobbleRect(x - 66, y - 30, 132, 60, 12, x + 7, 1.8); ctx.fill();
  }, '6, 16, 24');
  ctx.fillStyle = P.gold;
  wobbleRect(x - 66, y - 30, 132, 8, 4, x + 9, 1); ctx.fill();
  numText(fa(Math.round(S.val)), x, y + 4, { size: 40, color: P.ink });
  ctx.restore();
}

/** تابلو بعد از فرود روی تیرکِ نیلوفر می‌نشیند: «این عدد اینجاست». */
function drawSignFlight() {
  if (!S.sign) return;
  const k = easeOut(S.sign.t);
  const x = lerp(S.sign.from, S.sign.to, k);
  const y = lerp(322, PLAQUE_Y + 14, k);
  const s = lerp(1, .5, k);
  ctx.save();
  ctx.globalAlpha = 1 - k * .85;
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.fillStyle = '#fffaee';
  wobbleRect(-66, -30, 132, 60, 12, 71, 1.8); ctx.fill();
  numText(fa(Math.round(S.sign.val)), 0, 4, { size: 40, color: P.ink });
  ctx.restore();
}

/* ───────── مگس‌ها، نی‌های جلو، شب ───────── */

function drawFlies() {
  for (const f of S.flies) {
    if (f.gone) continue;
    const x = f.x + Math.cos(f.ph) * f.r;
    const y = f.y + Math.sin(f.ph * 1.7) * f.r * .4;
    ctx.save();
    ctx.globalAlpha = .34;
    ctx.strokeStyle = '#d6f4f0'; ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (let i = 0; i < 14; i++) {
      const p = f.ph - i * .12;
      const px = f.x + Math.cos(p) * f.r, py = f.y + Math.sin(p * 1.7) * f.r * .4;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = P.fly;
    ctx.beginPath(); ctx.ellipse(x, y, 5, 3.4, Math.sin(f.ph) * .4, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(230, 245, 255, .6)';
    const w = 4 + Math.abs(Math.sin(S.t * 24)) * 3;
    ctx.beginPath(); ctx.ellipse(x - 1, y - 4, w, 2.2, -.5, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + 3, y - 4, w, 2.2, .5, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

function drawForeReeds() {
  ctx.save();
  /* نیلوفرهای نزدیک و تیره — عمقِ صحنه را می‌سازند. */
  ctx.globalAlpha = .82;
  for (const f of [{ x: 120, y: 704, r: 118 }, { x: 330, y: 748, r: 96 },
                   { x: 980, y: 716, r: 130 }, { x: 1160, y: 758, r: 100 }]) {
    lilyPad(f.x, f.y, f.r, f.r * .34, f.x, '#1c4a44', '#123933', 4.2 + noise1(f.x) * 1.5);
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#0f2a31';
  wobbleEllipse(SCENE_W / 2, SCENE_H + 30, 720, 70, 0, 61, 3); ctx.fill();
  ctx.strokeStyle = '#14343c'; ctx.lineWidth = 9; ctx.lineCap = 'round';
  for (let i = 0; i < 12; i++) {
    const x = i < 6 ? -26 + i * 17 : SCENE_W + 26 - (i - 6) * 17;
    const h = 150 + noise1(i * 4.7) * 220;
    const sw = Math.sin(S.t * .6 + i) * 14;
    ctx.beginPath();
    ctx.moveTo(x, SCENE_H + 10);
    ctx.quadraticCurveTo(x + sw * .4, SCENE_H - h * .55, x + sw, SCENE_H - h);
    ctx.stroke();
    ctx.fillStyle = '#123037';
    wobbleEllipse(x + sw, SCENE_H - h - 12, 7, 22, 0, i * 3, 1); ctx.fill();
  }
  ctx.restore();
}

function drawNight() {
  ctx.fillStyle = P.night;
  ctx.fillRect(0, 0, SCENE_W, SCENE_H);
  for (const f of S.fireflies) {
    const a = .25 + .6 * Math.abs(Math.sin(f.ph * 1.3));
    ctx.save();
    ctx.globalAlpha = a;
    const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, 16);
    g.addColorStop(0, 'rgba(255, 236, 150, .9)');
    g.addColorStop(1, 'rgba(255, 236, 150, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(f.x - 16, f.y - 16, 32, 32);
    ctx.fillStyle = '#fff6c8';
    ctx.beginPath(); ctx.arc(f.x, f.y, 2, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

function drawFloats() {
  for (const f of S.floats) {
    const k = clamp(1 - f.t / 1.5, 0, 1);
    numText(f.txt, f.x, f.y, { size: f.size, color: f.col, alpha: k,
      stroke: 'rgba(10, 30, 38, .55)', strokeWidth: 5 });
  }
}

/* ───────── نوارِ بالا ───────── */

function drawHUD() {
  ctx.fillStyle = 'rgba(9, 26, 34, .74)';
  ctx.fillRect(0, 0, SCENE_W, HUD_H);
  ctx.fillStyle = 'rgba(140, 193, 82, .45)';
  ctx.fillRect(0, HUD_H - 3, SCENE_W, 3);

  for (let i = 0; i < 3; i++) {
    const x = SCENE_W - 32 - i * 33;
    ctx.save();
    ctx.globalAlpha = i < S.hearts ? 1 : .22;
    ctx.fillStyle = i < S.hearts ? '#d4574a' : '#4b5f66';
    ctx.translate(x, HUD_H / 2);
    const s = i < S.hearts ? 1 + Math.sin(S.t * 3 + i) * .05 : 1;
    ctx.scale(s, s);
    ctx.beginPath();
    ctx.moveTo(0, 9);
    ctx.bezierCurveTo(-14, -2, -9, -13, 0, -6);
    ctx.bezierCurveTo(9, -13, 14, -2, 0, 9);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  text(L().name, SCENE_W - 146, HUD_H / 2, { size: 17, color: '#dcefe4', align: 'right', family: 'Lalezar' });
  numText(fa(S.score), 26, HUD_H / 2 - 1, { size: 26, color: P.gold, align: 'left' });
  text(`رکورد ${fa(S.best)}`, 108, HUD_H / 2, { size: 14, color: 'rgba(220, 239, 228, .6)', align: 'left' });
  if (S.combo > 1) text(`× ${fa(S.combo)}`, 200, HUD_H / 2, { size: 17, color: P.good, align: 'left' });

  /* شمارِ پرش‌های این مرحله */
  const lv = L();
  const total = lv.mixed ? (lv.rounds || 0) : lv.nums.length;
  if (total) {
    const w = 15, gap = 9, x0 = SCENE_W / 2 - (total * w + (total - 1) * gap) / 2;
    for (let i = 0; i < total; i++) {
      ctx.fillStyle = i < S.round ? P.padLit : 'rgba(255,255,255,.16)';
      ctx.beginPath();
      ctx.ellipse(x0 + i * (w + gap) + w / 2, HUD_H / 2, w / 2, w / 2 * .78, 0, 0, TAU);
      ctx.fill();
    }
  } else {
    text('بی‌پایان', SCENE_W / 2, HUD_H / 2, { size: 15, color: 'rgba(220, 239, 228, .55)' });
  }
}

/* ───────── آموزش ───────── */

function drawTutorial() {
  const st = S.tut.step;
  let holes = [], msg = '', hand = null;
  const lx = xOf(S.val);

  if (st === 0) {
    holes = [{ x: AXIS.x - 60, y: 442, w: AXIS.w + 120, h: 116 }];
    msg = 'تیرک‌ها عددهای گِرد را نشان می‌دهند و برگِ تو جایی بینِ آن‌هاست.';
  } else if (st === 1) {
    holes = [{ x: lx - 150, y: AXIS.y - 60, w: 300, h: 130 }];
    msg = 'روی نیلوفری بزن که فکر می‌کنی قورباغه به آن می‌رسد.';
    hand = { x: lx + 120, y: AXIS.y - 118 };
  } else {
    holes = [{ x: lx - 220, y: AXIS.y - 60, w: 440, h: 130 }];
    msg = 'قورباغه فقط تا نصفِ فاصلهٔ دو نیلوفر می‌پرد؛ پس فقط به نزدیک‌ترین می‌رسد.';
  }

  spot(holes, .5);
  const w = 486, h = 90, x = SCENE_W / 2 - w / 2, y = 118;
  paper(x, y, w, h, P.plaque, 41, 14, .42);
  ctx.fillStyle = P.reed;
  wobbleRect(x, y, 9, h, 4, 43, .8); ctx.fill();
  textWrap(msg, x + w / 2 + 6, y + h / 2 - 11, w - 54, { size: 18, color: P.ink, lineHeight: 27 });
  if (TUT_TAP.indexOf(st) >= 0) tutMore(x + w / 2, y + h + 12, S.t, P.ink);
  if (hand) pointHand(hand.x, hand.y);
}

/* ───────── پرده‌ها ───────── */

}

               : `امتیازت ${fa(S.score)} شد. برکهٔ بعدی سخت‌تر است.`,
    btn: BTN_GO, btnHot: S.hover === BTN_GO,
    btnLabel: last ? 'از اوّل' : 'برکهٔ بعدی',
    paper: P.plaque, band: P.good, ink: P.ink, inkSoft: P.inkSoft,
    btnFill: '#4e8f52', btnHotFill: '#5da058',
    icon: (x, y) => star(x, y + 10, 26, P.gold, Math.sin(S.t * 2) * .2),
  });
}

function drawLost() {
  overlay({
    t: S.phaseT,
    w: 700, h: 300, y: 200,

    btnFill: '#cf5f4a', btnHotFill: '#dd6f59',
    icon: frogIcon,
  });
}
