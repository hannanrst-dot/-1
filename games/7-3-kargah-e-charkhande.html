<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1226">
<title>کارگاهِ چرخنده — احتمال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>
  /* صفحه نباید هیچ‌جا اسکرول یا زوم شود؛ بازی باید مثل یک برنامه رفتار کند. */
  html, body {
    margin: 0; padding: 0; background: #1a1226;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body {
    position: fixed; inset: 0;          /* جلوی کشیده‌شدنِ صفحه در سافاریِ گوشی */
    width: 100%; height: 100vh; height: 100dvh;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none; -webkit-touch-callout: none;
  }

  /* گوشیِ عمودی صحنه را ریز می‌کند؛ بچه باید گوشی را بچرخاند. */
  #rotate { display: none; }
  @media (orientation: portrait) and (max-width: 860px) {
    #stage { display: none; }
    #rotate {
      display: flex; position: fixed; inset: 0;
      z-index: 9;
      flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      background: #1a1226; color: #f6ead2;
      font: 700 20px "Vazirmatn", Tahoma, sans-serif; text-align: center; padding: 32px;
    }
    #rotate svg { animation: tilt 2.4s ease-in-out infinite; }
    @keyframes tilt { 0%, 45% { transform: rotate(0deg); } 65%, 100% { transform: rotate(-90deg); } }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="rotate">
  <svg width="86" height="126" viewBox="0 0 86 126" fill="none" aria-hidden="true">
    <rect x="3" y="3" width="80" height="120" rx="12" stroke="#e8b448" stroke-width="5"/>
    <rect x="15" y="19" width="56" height="88" rx="5" fill="#e8b448" opacity=".28"/>
    <circle cx="43" cy="115" r="4" fill="#e8b448"/>
  </svg>
  <div>گوشی را بچرخان</div>
  <div style="font-weight:400;opacity:.7;font-size:16px">این بازی خوابیده بازی می‌شود</div>
</div>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   هستهٔ مشترکِ بازی‌ها — سبک «کاغذبُری»
   ───────────────────────────────────────────────────────────────────────
   این فایل جعبه‌ابزار است، نه چارچوب: هر بازی حلقه و وضعیت خودش را دارد
   و فقط از این توابع برای کشیدن استفاده می‌کند. دلیلش این است که هر بازی
   باید حس‌وحال خودش را داشته باشد، نه اینکه همه شبیه هم دربیایند.

   قاعده‌های ثابتِ تصویری:
   • نور همیشه از بالا-چپ می‌تابد، پس سایه‌ها به پایین-راست می‌افتند.
   • هیچ لبه‌ای کاملاً صاف نیست؛ همه کمی موج دارند (انگار با قیچی بریده).
   • هیچ خاکستریِ خالصی نداریم؛ همه‌ی خنثی‌ها به گرمیِ صحنه می‌زنند.
   • یک لایه‌ی دانه‌دانه‌ی کاغذ روی کلِ تصویر ضرب می‌شود.
   ═══════════════════════════════════════════════════════════════════════ */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const FA_D = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
const fa = (n) => String(n).replace(/\d/g, (d) => FA_D[+d]);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeIn = (t) => t * t * t;
const easeInOut = (t) => (t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2);
const easeBack = (t) => 1 + 2.7 * Math.pow(t-1, 3) + 1.7 * Math.pow(t-1, 2);
const easeElastic = (t) => t === 0 || t === 1 ? t : Math.pow(2, -9*t) * Math.sin((t*10 - .75) * 2.094) + 1;

/** تصادفِ تکرارپذیر: با یک بذر همیشه همان عدد. برای اینکه تزئین‌ها هر فریم نپرند. */
function noise1(x) {
  const s = Math.sin(x * 127.1) * 43758.5453;
  return s - Math.floor(s);
}
const pick = (arr, seed) => arr[Math.floor(noise1(seed) * arr.length) % arr.length];

/* ───────── بوم و صحنهٔ ثابت ───────── */

let ctx, SW, SH, CV, _refit = null;
let view = { scale: 1, ox: 0, oy: 0, w: 0, h: 0, dpr: 1 };
let _grain = null;

function initStage(canvas, w, h) {
  CV = canvas; SW = w; SH = h;
  ctx = canvas.getContext('2d');

  /* اندازه را از خودِ بوم می‌گیریم نه از innerHeight؛ چون در سافاریِ گوشی
     نوارِ آدرس باز و بسته می‌شود و innerHeight دروغ می‌گوید. */
  const fit = () => {
    const r = canvas.getBoundingClientRect();
    const vw = Math.round(r.width), vh = Math.round(r.height);
    if (vw < 20 || vh < 20) return;
    const dpr = Math.min(devicePixelRatio || 1, QUALITY > 0 ? 2 : 1);
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    const scale = Math.min(vw / SW, vh / SH);
    view = { scale, ox: (vw - SW*scale)/2, oy: (vh - SH*scale)/2, w: vw, h: vh, dpr };
    _grain = buildGrain();
  };
  _refit = fit;
  addEventListener('resize', fit);
  /* چرخاندنِ گوشی: اندازهٔ درست چند لحظه بعد می‌رسد، پس چندبار اندازه می‌گیریم. */
  addEventListener('orientationchange', () => {
    fit(); setTimeout(fit, 140); setTimeout(fit, 460);
  });
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(canvas);

  /* صدا در گوشی فقط بعد از اوّلین لمس اجازهٔ پخش دارد. */
  const unlock = () => { sfx._c(); removeEventListener('pointerdown', unlock); removeEventListener('touchstart', unlock); };
  addEventListener('pointerdown', unlock, { passive: true });
  addEventListener('touchstart', unlock, { passive: true });
  /* نگه‌داشتنِ انگشت نباید منوی مرورگر را باز کند. */
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  fit();
  return ctx;
}

/** قابِ صحنه را باز می‌کند: بعد از این، مختصات همیشه در فضای SW×SH است. */
function beginScene(bg) {
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, view.w, view.h);
  ctx.save();
  ctx.translate(view.ox, view.oy);
  ctx.scale(view.scale, view.scale);
  ctx.beginPath();
  ctx.rect(0, 0, SW, SH);
  ctx.clip();
}

/** بافتِ کاغذ، تیرگیِ گوشه‌ها، رنگ‌بندی و درخششِ نور را می‌گذارد و قاب را می‌بندد. */
function endScene(grainAlpha = .15, vignette = 'rgba(48,28,14,.30)', bloom = .34, grade = .14) {
  if (QUALITY < 1) { grade = 0; grainAlpha *= .5; }
  if (QUALITY < 2) bloom = 0;
  if (grade > 0) {
    /* رنگ‌بندیِ نرم: بالای صحنه گرم‌تر، پایین سردتر — عمق می‌دهد */
    const g = ctx.createLinearGradient(0, 0, 0, SH);
    g.addColorStop(0, `rgba(255, 214, 150, ${grade})`);
    g.addColorStop(.55, 'rgba(255, 255, 255, 0)');
    g.addColorStop(1, `rgba(40, 60, 110, ${grade * .9})`);
    ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalCompositeOperation = 'source-over';
  }
  if (_grain && grainAlpha > 0) {
    ctx.globalCompositeOperation = 'multiply';
    ctx.globalAlpha = grainAlpha;
    ctx.fillStyle = _grain;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
  if (vignette) {
    const g = ctx.createRadialGradient(SW/2, SH/2, SH*.42, SW/2, SH/2, SH*1.05);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, vignette);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
  }
  ctx.restore();
  bloomPass(bloom);
}

/* ───────── درخششِ نور (bloom) ─────────
   قابِ رسم‌شده را کوچک می‌کنیم، دو بار در خودش ضرب می‌کنیم تا فقط
   روشن‌ها بمانند، محوش می‌کنیم و با حالتِ «lighter» رویش می‌گذاریم.
   نتیجه: چراغ‌ها، شعله‌ها و رنگ‌های روشن نور پخش می‌کنند. */
let _bl, _blc, _bl2, _bl2c, _blNo = false, _blTick = 0;

function bloomPass(amount) {
  if (!amount || _blNo || !CV.width) return;
  /* کوچک‌کردن و بزرگ‌کردنِ دوباره، خودش محو می‌کند — از filter خیلی ارزان‌تر است */
  const W = Math.max(4, Math.round(CV.width * .2)), H = Math.max(4, Math.round(CV.height * .2));
  const W2 = Math.max(2, Math.round(W * .28)), H2 = Math.max(2, Math.round(H * .28));
  try {
    if (!_bl) {
      _bl = document.createElement('canvas'); _blc = _bl.getContext('2d');
      _bl2 = document.createElement('canvas'); _bl2c = _bl2.getContext('2d');
      if (!_blc || !_bl2c) { _blNo = true; return; }
    }
    if (_bl.width !== W || _bl.height !== H) { _bl.width = W; _bl.height = H; }
    if (_bl2.width !== W2 || _bl2.height !== H2) { _bl2.width = W2; _bl2.height = H2; }
    /* ساختنِ نور یک قاب در میان کافی است؛ گذاشتنش هر قاب. */
    _blTick = (_blTick + 1) & 1;
    if (!_blTick) {
      _blc.globalCompositeOperation = 'source-over';
      _blc.clearRect(0, 0, W, H);
      _blc.drawImage(CV, 0, 0, W, H);
      _blc.globalCompositeOperation = 'multiply';
      _blc.drawImage(_bl, 0, 0);
      _blc.drawImage(_bl, 0, 0);
      _blc.globalCompositeOperation = 'source-over';
      _bl2c.clearRect(0, 0, W2, H2);
      _bl2c.drawImage(_bl, 0, 0, W2, H2);
    }

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = amount;
    ctx.drawImage(_bl2, 0, 0, CV.width, CV.height);
    ctx.restore();
  } catch (e) { _blNo = true; }
}

/* ───────── لایهٔ ثابت ─────────
   هرچه در صحنه تکان نمی‌خورد را یک‌بار می‌کشیم و بعد فقط کپی می‌کنیم. */
const _layers = {};
function staticLayer(key, w, h, paint) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const L = _layers[key];
  if (L && L.q === q && L.w === w && L.h === h) return L.cv;
  const off = document.createElement('canvas');
  off.width = Math.max(1, Math.round(w * q));
  off.height = Math.max(1, Math.round(h * q));
  const c = off.getContext('2d');
  c.setTransform(q, 0, 0, q, 0, 0);
  const prev = ctx;
  ctx = c;
  try { paint(); } finally { ctx = prev; }
  _layers[key] = { cv: off, q, w, h };
  return off;
}

/* ───────── نورپردازی و بافت ─────────
   کارِ این‌ها این است که هیچ سطحی «تختِ یک‌رنگ» نماند. */

/** شیبِ عمودی: بالا روشن، پایین تیره. */
function vgrad(y0, y1, top, bot) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, top); g.addColorStop(1, bot);
  return g;
}

/** حجمِ کروی: نور از بالا-چپ، سایه در پایین-راست. */
function ball(cx, cy, r, lit, base, dark) {
  const g = ctx.createRadialGradient(cx - r * .38, cy - r * .42, r * .06, cx, cy, r * 1.06);
  g.addColorStop(0, lit); g.addColorStop(.45, base); g.addColorStop(1, dark);
  return g;
}

/** لبهٔ روشنِ بالا-چپِ یک مسیر — همان «rim light». */
function rim(pathFn, col, w = 2.2) {
  ctx.save();
  ctx.beginPath(); pathFn();
  ctx.clip();
  ctx.beginPath(); pathFn();
  ctx.strokeStyle = col; ctx.lineWidth = w * 2; ctx.lineJoin = 'round';
  ctx.translate(-w * .5, -w * .6);
  ctx.stroke();
  ctx.restore();
}

/** سایهٔ چسبیده به زمین — چیزها را روی سطح می‌نشاند. */
function contact(cx, cy, rx, ry, alpha = .26) {
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
  g.addColorStop(0, `rgba(20, 12, 6, ${alpha})`);
  g.addColorStop(1, 'rgba(20, 12, 6, 0)');
  ctx.save();
  ctx.fillStyle = g;
  ctx.translate(cx, cy); ctx.scale(1, ry / Math.max(rx, ry));
  ctx.beginPath(); ctx.arc(0, 0, Math.max(rx, ry), 0, TAU); ctx.fill();
  ctx.restore();
}

const _tex = {};
/** بافتِ تکرارشونده؛ یک‌بار ساخته و بعد از حافظه خوانده می‌شود. */
function texture(key, w, h, paint) {
  if (_tex[key]) return _tex[key];
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const c = off.getContext('2d');
  paint(c, w, h);
  _tex[key] = ctx.createPattern(off, 'repeat');
  return _tex[key];
}

/** رگهٔ چوب. */
function texWood(base, grain) {
  return texture('w' + base + grain, 120, 120, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = grain; c.lineWidth = 1.4;
    for (let i = 0; i < 9; i++) {
      c.globalAlpha = .18 + noise1(i * 3.1) * .3;
      c.beginPath();
      const y0 = i * 14 + noise1(i) * 6;
      c.moveTo(0, y0);
      for (let x = 0; x <= w; x += 10) c.lineTo(x, y0 + Math.sin(x * .09 + i) * 2.6);
      c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** تارِ پارچه. */
function texCloth(base, thread) {
  return texture('c' + base + thread, 16, 16, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = thread; c.lineWidth = 1; c.globalAlpha = .5;
    for (let i = 0; i < w; i += 4) {
      c.beginPath(); c.moveTo(i, 0); c.lineTo(i, h); c.stroke();
      c.beginPath(); c.moveTo(0, i); c.lineTo(w, i); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** دانه‌های سنگ. */
function texStone(base, spec) {
  return texture('s' + base + spec, 90, 90, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) {
      c.globalAlpha = .05 + noise1(i * 1.7) * .16;
      c.fillStyle = spec;
      const r = .6 + noise1(i * 5.3) * 1.9;
      c.beginPath();
      c.arc(noise1(i * 2.1) * w, noise1(i * 3.7 + 1) * h, r, 0, TAU);
      c.fill();
    }
    c.globalAlpha = 1;
  });
}

/** الیافِ کاغذ. */
function texPaper(base) {
  return texture('p' + base, 100, 100, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 130; i++) {
      c.globalAlpha = .04 + noise1(i * 2.3) * .07;
      c.strokeStyle = i % 2 ? '#ffffff' : '#5a4326';
      c.lineWidth = .9;
      const x = noise1(i * 1.3) * w, y = noise1(i * 4.1 + 2) * h;
      const a = noise1(i * 7.7) * TAU, l = 4 + noise1(i * 9.1) * 12;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

function buildGrain() {
  const s = 260;
  const off = document.createElement('canvas');
  off.width = off.height = s;
  const c = off.getContext('2d');
  const img = c.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    const v = 214 + Math.random() * 41;
    img.data[i*4] = v; img.data[i*4+1] = v; img.data[i*4+2] = v; img.data[i*4+3] = 255;
  }
  c.putImageData(img, 0, 0);
  return ctx.createPattern(off, 'repeat');
}

function toStage(e) {
  const r = CV.getBoundingClientRect();
  return {
    x: (e.clientX - r.left - view.ox) / view.scale,
    y: (e.clientY - r.top - view.oy) / view.scale,
  };
}

const inRect = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
const inCircle = (p, b, pad = 0) => Math.hypot(p.x - b.x, p.y - b.y) <= b.r + pad;

/* ───────── قلم‌های کاغذبُری ───────── */

/** دایره‌ای که انگار با قیچی بریده شده. */
function wobbleCircle(cx, cy, r, seed = 0, amp = 2.2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const rr = r + Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp * .45;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** بیضیِ ناصاف — برای چیزهایی که گرد نیستند ولی نرم‌اند. */
function wobbleEllipse(cx, cy, rx, ry, rot = 0, seed = 0, amp = 2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const w = 1 + (Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp*.45) / Math.max(rx, ry);
    const px = Math.cos(a) * rx * w, py = Math.sin(a) * ry * w;
    const x = cx + px*Math.cos(rot) - py*Math.sin(rot);
    const y = cy + px*Math.sin(rot) + py*Math.cos(rot);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** مستطیلِ گِرد با گوشه‌های کمی کج. */
function wobbleRect(x, y, w, h, r = 12, seed = 0, amp = 1.6) {
  const j = (k) => (noise1(seed*9.7 + k) - .5) * amp * 2;
  ctx.beginPath();
  ctx.moveTo(x + r + j(1), y + j(2));
  ctx.lineTo(x + w - r + j(3), y + j(4));
  ctx.quadraticCurveTo(x + w + j(5), y + j(6), x + w + j(7), y + r + j(8));
  ctx.lineTo(x + w + j(9), y + h - r + j(10));
  ctx.quadraticCurveTo(x + w + j(11), y + h + j(12), x + w - r + j(13), y + h + j(14));
  ctx.lineTo(x + r + j(15), y + h + j(16));
  ctx.quadraticCurveTo(x + j(17), y + h + j(18), x + j(19), y + h - r + j(20));
  ctx.lineTo(x + j(21), y + r + j(22));
  ctx.quadraticCurveTo(x + j(23), y + j(24), x + r + j(1), y + j(2));
  ctx.closePath();
}

/** سایهٔ نرم؛ نور از بالا-چپ. */
function withShadow(blur, dy, alpha, fn, hue = '78, 46, 24') {
  ctx.save();
  ctx.shadowColor = `rgba(${hue}, ${alpha})`;
  ctx.shadowBlur = blur;
  ctx.shadowOffsetY = dy;
  ctx.shadowOffsetX = dy * .35;
  fn();
  ctx.restore();
}

/** یک برگه‌ی کاغذ با سایه — پایه‌ی همه‌ی کارت‌ها و تابلوها. */
function paper(x, y, w, h, fill, seed = 1, r = 12, shadow = .26) {
  withShadow(16, 7, shadow, () => {
    ctx.fillStyle = fill;
    wobbleRect(x, y, w, h, r, seed, 2);
    ctx.fill();
  });
  /* الیافِ کاغذ و لبهٔ روشن، تا سطح تخت نماند */
  ctx.save();
  ctx.beginPath(); wobbleRect(x, y, w, h, r, seed, 2); ctx.clip();
  ctx.globalAlpha = .5;
  ctx.fillStyle = texPaper(fill);
  ctx.fillRect(x, y, w, h);
  ctx.globalAlpha = 1;
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.4, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(90,60,20,.1)');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
}

function text(str, x, y, o = {}) {
  const size = o.size || 20;
  const fam = o.family || 'Vazirmatn';
  ctx.save();
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.font = `${fam === 'Lalezar' ? '400' : (o.weight || 700)} ${size}px "${fam}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.baseline || 'middle';
  ctx.fillStyle = o.color || '#43291b';
  ctx.direction = 'rtl';
  if (o.stroke) {
    ctx.lineWidth = o.strokeWidth || 5;
    ctx.strokeStyle = o.stroke;
    ctx.lineJoin = 'round';
    ctx.strokeText(str, x, y, o.maxWidth);
  }
  ctx.fillText(str, x, y, o.maxWidth);
  ctx.restore();
}

/** متنِ چندخطی که خودش می‌شکند. ارتفاعِ اشغال‌شده را برمی‌گرداند. */
function textWrap(str, x, y, maxW, o = {}) {
  const size = o.size || 19, lh = o.lineHeight || size * 1.7;
  ctx.font = `${o.weight || 700} ${size}px "${o.family || 'Vazirmatn'}", Tahoma, sans-serif`;
  const lines = [];
  for (const para of str.split('\n')) {
    let line = '';
    for (const wd of para.split(' ')) {
      const t = line ? line + ' ' + wd : wd;
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = wd; }
      else line = t;
    }
    lines.push(line);
  }
  lines.forEach((l, i) => text(l, x, y + i * lh, o));
  return lines.length * lh;
}

/* ───────── ذره‌ها ───────── */

class Bits {
  constructor() { this.list = []; }
  add(x, y, n, kind, colors, opts = {}) {
    for (let i = 0; i < n; i++) {
      const a = opts.dir !== undefined ? opts.dir + (Math.random()-.5) * (opts.spread || 1) : Math.random() * TAU;
      const sp = (opts.speed || 200) * (.4 + Math.random());
      this.list.push({
        kind, x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - (opts.lift || 0),
        r: (opts.size || 4) * (.5 + Math.random()),
        rot: Math.random() * TAU, vr: (Math.random()-.5) * 10,
        col: colors[(Math.random() * colors.length) | 0],
        grav: opts.grav === undefined ? 620 : opts.grav,
        drag: opts.drag || .995,
        life: (opts.life || .9) * (.6 + Math.random() * .8), age: 0,
      });
    }
  }
  confetti(x, y, n, colors) {
    this.add(x, y, n, 'flake', colors, { speed: 420, lift: 190, size: 5, life: 1.6, grav: 780 });
  }
  spark(x, y, n, colors) {
    this.add(x, y, n, 'dot', colors, { speed: 180, lift: 30, size: 3.4, life: .7, grav: 260, drag: .93 });
  }
  step(dt) {
    for (const p of this.list) {
      p.age += dt;
      p.vy += p.grav * dt;
      p.vx *= p.drag; p.vy *= p.drag;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    }
    this.list = this.list.filter((p) => p.age < p.life);
  }
  draw() {
    for (const p of this.list) {
      const k = clamp(1 - p.age / p.life, 0, 1);
      ctx.save();
      ctx.globalAlpha = k;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.col;
      if (p.kind === 'flake') ctx.fillRect(-p.r, -p.r*1.5, p.r*2, p.r*3);
      else if (p.kind === 'leaf') { wobbleEllipse(0, 0, p.r*1.8, p.r*.8, 0, p.r, .6); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(0, 0, p.r * k, 0, TAU); ctx.fill(); }
      ctx.restore();
    }
  }
  clear() { this.list.length = 0; }
}

/* ───────── صدا (بدون فایل صوتی) ───────── */

const sfx = {
  ac: null, on: true,
  _c() {
    if (!this.on) return null;
    if (!this.ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; this.ac = new A(); }
    if (this.ac.state === 'suspended') this.ac.resume();
    return this.ac;
  },
  tone(f, dur = .16, type = 'sine', gain = .13, delay = 0) {
    const c = this._c(); if (!c) return;
    const t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(t0 + dur + .04);
  },
  tap()  { this.tone(430, .07, 'triangle', .09); },
  place(){ this.tone(620, .11, 'sine', .12); },
  pop()  { this.tone(760, .09, 'sine', .11); },
  slide(){ this.tone(240, .22, 'sine', .07); },
  good() { [523, 659, 784].forEach((f,i) => this.tone(f, .22, 'sine', .13, i*.07)); },
  win()  { [523, 659, 784, 1047].forEach((f,i) => this.tone(f, .34, 'triangle', .13, i*.10)); },
  nope() { this.tone(180, .2, 'sawtooth', .07); },
  tick() { this.tone(1100, .04, 'square', .05); },
};

/* ───────── قطعه‌های آماده ───────── */

function star(x, y, r, col, rot = 0) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = col;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI/2 + i * Math.PI/5;
    const rr = i % 2 ? r * .45 : r;
    const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/** دکمهٔ کاغذی. hovered را خودِ بازی می‌دهد؛ اینجا فقط کشیده می‌شود. */
/** رنگ را روشن‌تر (k>0) یا تیره‌تر (k<0) می‌کند. */
function shade(col, k) {
  const c = String(col).trim();
  let r, g2, b2;
  if (c[0] === '#') {
    const h = c.length === 4 ? c[1]+c[1]+c[2]+c[2]+c[3]+c[3] : c.slice(1, 7);
    r = parseInt(h.slice(0,2), 16); g2 = parseInt(h.slice(2,4), 16); b2 = parseInt(h.slice(4,6), 16);
  } else {
    const m = c.match(/[\d.]+/g);
    if (!m || m.length < 3) return col;
    r = +m[0]; g2 = +m[1]; b2 = +m[2];
  }
  const f = (v) => Math.round(clamp(k < 0 ? v * (1 + k) : v + (255 - v) * k, 0, 255));
  return 'rgb(' + f(r) + ',' + f(g2) + ',' + f(b2) + ')';
}

function button(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 3 : 0;
  const fill = o.disabled ? (o.off || '#bcaa92') : (hot ? (o.hotFill || o.fill) : o.fill);
  const r = o.r === undefined ? 14 : o.r;
  /* لبهٔ زیرینِ تیره — دکمه از صفحه بیرون می‌زند */
  ctx.fillStyle = shade(fill, -.36);
  wobbleRect(b.x, b.y + dy + 7, b.w, b.h, r, b.x + b.y, 2);
  ctx.fill();
  withShadow(hot ? 22 : 14, hot ? 5 : 8, .32, () => {
    ctx.fillStyle = fill;
    wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2);
    ctx.fill();
  });
  /* حجم: روشن از بالا، تیره به پایین */
  ctx.save();
  ctx.beginPath(); wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2); ctx.clip();
  const g = ctx.createLinearGradient(0, b.y + dy, 0, b.y + dy + b.h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.45, 'rgba(255,255,255,.04)');
  g.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = g;
  ctx.fillRect(b.x, b.y + dy, b.w, b.h);
  /* برقِ باریکِ لبهٔ بالا */
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.fillRect(b.x + r, b.y + dy + 2, b.w - r * 2, 2);
  ctx.restore();
  text(label, b.x + b.w/2, b.y + b.h/2 + dy - (o.sub ? 9 : 0), {
    size: o.size || 26, color: o.color || '#fdf6e8', family: o.family || 'Lalezar',
  });
  if (o.sub) text(o.sub, b.x + b.w/2, b.y + b.h/2 + dy + 17,
    { size: 14, color: o.subColor || 'rgba(255,255,255,.88)' });
}

/** دکمهٔ گرد کوچک (مثل + و −). */
function roundButton(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 2 : 0;
  withShadow(10, hot ? 3 : 5, .3, () => {
    ctx.fillStyle = o.disabled ? '#cbbba3' : (hot ? (o.hotFill || o.fill) : o.fill);
    wobbleCircle(b.x, b.y + dy, b.r, b.x, 1.4);
    ctx.fill();
  });
  text(label, b.x, b.y + dy - 1,
    { size: o.size || 32, color: o.disabled ? '#a8988a' : (o.color || '#fdf6e8'), family: 'Lalezar' });
}

/** پرده‌ی تمام‌صفحه: برای شروعِ پرده و برای جشنِ پایان. */
function overlay(o) {
  const k = easeOut(clamp(o.t / .5, 0, 1));
  ctx.fillStyle = `rgba(30, 22, 16, ${.66 * k})`;
  ctx.fillRect(0, 0, SW, SH);

  const w = o.w || 700, h = o.h || 290;
  const x = (SW - w) / 2, y = o.y || (SH * .22);
  const s = lerp(.9, 1, easeBack(clamp(o.t / .65, 0, 1)));
  ctx.save();
  ctx.translate(SW/2, y + h/2);
  ctx.scale(s, s);
  ctx.translate(-SW/2, -(y + h/2));

  withShadow(30, 14, .42, () => {
    ctx.fillStyle = o.paper || '#fbf3e2';
    wobbleRect(x, y, w, h, 18, 121, 2.4);
    ctx.fill();
  });
  ctx.fillStyle = o.band || '#c8434f';
  wobbleRect(x, y, w, 12, 6, 123, 1);
  ctx.fill();

  if (o.icon) o.icon(SW/2, y + 56);
  text(o.title, SW/2, y + (o.icon ? 108 : 62),
    { size: o.titleSize || 36, color: o.ink || '#43291b', family: 'Lalezar', alpha: k });
  textWrap(o.body, SW/2, y + (o.icon ? 158 : 116), w - 90,
    { size: 19, color: o.inkSoft || '#8a6a52', alpha: k });
  ctx.restore();

  button(o.btn, o.btnLabel, { hot: o.btnHot, fill: o.btnFill || '#7fa356', hotFill: o.btnHotFill || '#8fb45f', size: 28 });
}

/** پیامِ کوتاهِ بالای صحنه. */
class Toast {
  constructor() { this.msg = null; this.t = 0; this.kind = 'info'; }
  say(msg, kind = 'info') { this.msg = msg; this.kind = kind; this.t = 2.6; }
  step(dt) { if (this.t > 0) { this.t -= dt; if (this.t <= 0) this.msg = null; } }
  draw(y = 24, colors = {}) {
    if (!this.msg) return;
    const k = clamp(this.t, 0, 1) * clamp((2.6 - this.t) * 5, 0, 1);
    ctx.save();
    ctx.globalAlpha = k;
    ctx.font = `700 19px "Vazirmatn", Tahoma, sans-serif`;
    const w = ctx.measureText(this.msg).width + 76;
    const fill = this.kind === 'good' ? (colors.good || '#7fa356')
               : this.kind === 'bad' ? (colors.bad || '#c8434f')
               : (colors.info || '#fbf3e2');
    paper(SW/2 - w/2, y, w, 48, fill, 151, 12, .3);
    text(this.msg, SW/2, y + 25,
      { size: 19, color: this.kind === 'info' ? (colors.ink || '#43291b') : '#fff8ec' });
    ctx.restore();
  }
}

/* ───────── آموزشِ پرده‌ای ─────────
   پرده‌هایی که منتظرِ کارِ بچه نیستند با یک ضربه جلو می‌روند. تایمر فقط
   پشتیبان است؛ بچهٔ کلاس سومی باید فرصتِ خواندن داشته باشد، نه اینکه
   متن قبل از تمام شدنِ خواندنش برود.                                    */

/** اگر پردهٔ فعلی خواندنی است، ضربه را می‌خورد و می‌رود پردهٔ بعد. */
function tutTap(tut, tapSteps, lastStep) {
  if (!tut.on || tapSteps.indexOf(tut.step) < 0) return false;
  if (tut.step >= lastStep) tut.on = false;
  else { tut.step++; tut.t = 0; }
  sfx.tap();
  return true;
}

/** نشانهٔ «برای ادامه بزن» — زیرِ کارتِ آموزش. */
function tutMore(cx, y, t, ink = '#3a2a18', bg = 'rgba(255, 250, 238, .94)') {
  ctx.save();
  ctx.globalAlpha = .62 + .38 * Math.sin(t * 3.2);
  ctx.font = '700 15px "Vazirmatn", Tahoma, sans-serif';
  const label = 'برای ادامه، هرجا را بزن';
  const w = ctx.measureText(label).width + 40, h = 32, x = cx - w / 2, r = 16;
  withShadow(10, 4, .3, () => {
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath(); ctx.fill();
  });
  text(label, cx, y + h / 2, { size: 15, color: ink });
  ctx.restore();
}

/** فونت‌ها را می‌آورد و بعد بازی را شروع می‌کند.
    مهم: هر دو راه (رسیدنِ فونت و مهلتِ پشتیبان) ممکن است برسند، ولی
    شروع فقط باید یک بار انجام شود؛ وگرنه دو حلقهٔ فریم راه می‌افتد و
    بازی دوبرابر سریع می‌شود. */
function whenFontsReady(start) {
  let done = false;
  const go = () => { if (done) return; done = true; start(); };
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('400 40px Lalezar'),
      document.fonts.load('700 20px Vazirmatn'),
      document.fonts.load('900 20px Vazirmatn'),
    ]).then(go, go);
    setTimeout(go, 2600);
  } else go();
}

/** حلقهٔ فریم با dtِ محدودشده. */
/* ───────── کیفیتِ خودکار ─────────
   اگر دستگاه کُند بود، اوّل درخشش و بعد رنگ‌بندی خاموش می‌شود تا بازی
   روان بماند. روی دستگاهِ قوی همه‌چیز روشن است. */
let QUALITY = 2;
let _fAcc = 0, _fN = 0, _qHold = 0;

function _qualityTick(gap) {
  if (gap <= 0 || gap > 200) return;
  _fAcc += gap; _fN++;
  if (_fN < 45) return;
  const avg = _fAcc / _fN;
  _fAcc = 0; _fN = 0;
  if (_qHold > 0) { _qHold--; return; }
  const before = QUALITY;
  if (avg > 25 && QUALITY > 0) { QUALITY--; _qHold = 3; }
  else if (avg < 18.5 && QUALITY < 2) { QUALITY++; _qHold = 6; }
  /* در پایین‌ترین کیفیت، صحنه را با نقطه‌های کمتر می‌کشیم */
  if (before !== QUALITY && (before === 0 || QUALITY === 0) && _refit) _refit();
}

/* یک حلقه، نه بیشتر — دو حلقه یعنی زمانِ بازی دوبرابر می‌گذرد. */
let _looping = false;
function runLoop(step) {
  if (_looping) return;
  _looping = true;
  let last = performance.now();
  const frame = (now) => {
    const gap = now - last;
    const dt = Math.min(gap / 1000, 1/20);
    last = now;
    _qualityTick(gap);
    step(dt);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

   کارگاهِ چرخنده — ریاضی سوم، فصل ۷، درس ۳ (احتمال)
   ───────────────────────────────────────────────────────────────────────
   کتاب می‌پرسد: «چند حالت ممکن است اتّفاق بیفتد؟ شانسِ کدام رنگ بیشتر
   است؟ چرا؟ چه کسری از چرخنده سبز است؟» و بعد می‌گوید هر جمله را در یکی
   از سه دسته بگذارید: به‌طور حتم، احتمال دارد، به‌طور حتم نه.

   اینجا بچّه جوابِ این سؤال‌ها را نمی‌دهد — خودش چرخنده را می‌سازد.
   مشتریِ بازارِ شب سفارش می‌دهد: «قرمز هرگز نیاید»، «سبز از آبی بیشتر

   سفارش جور دربیاید.

   شانس اینجا یک عددِ نوشته‌شده نیست؛ اندازهٔ یک تکّه از چرخ است. هر وقت
   بخواهی می‌توانی اهرم را بکِشی و ۱۰ بار بچرخانی تا جدولِ آزمایش پُر
   شود — همان کارِ کتاب. جدول جوابِ سفارش را نمی‌گوید، فقط نشان می‌دهد

   ═══════════════════════════════════════════════════════════════════════ */

  na: -Math.PI / 2, spin: null,   /* عقربه می‌چرخد، نه خودِ چرخ */
  tally: [0, 0, 0, 0], spins: 0,
  ok: false, sold: 0,
  timeLeft: 0, lanterns: 3,
  cleared: 0, quota: 0,
  score: 0, best: 0, combo: 0,
  sparks: [],
  t: 0, phaseT: 0, hover: null, shake: 0, nope: 0,
  tut: { on: true, step: 0, t: 0 },
};

const bits = new Bits();
const toast = new Toast();
const L = () => LEVELS[S.level];
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const countOf = (k) => S.sec.reduce((a, v) => a + (v === k ? 1 : 0), 0);

function loadBest() { try { return +localStorage.getItem('charkhande-best') || 0; } catch { return 0; } }
function saveBest(v) { try { localStorage.setItem('charkhande-best', String(v)); } catch { /* حالتِ خصوصی */ } }

const cv = document.getElementById('stage');
initStage(cv, SCENE_W, SCENE_H);
S.best = loadBest();

/* ───────── شرط‌ها ───────── */

/** هر شرط را روی یک چیدمانِ دلخواه می‌سنجیم. */
function condOK(q, sec) {
  const cnt = (k) => sec.reduce((a, v) => a + (v === k ? 1 : 0), 0);
  const n = sec.length;
  switch (q.k) {
    case 'always': return cnt(q.a) === n;
    case 'never':  return cnt(q.a) === 0;
    case 'more':   return cnt(q.a) > cnt(q.b) && cnt(q.b) > 0;
    case 'equal':  return cnt(q.a) === cnt(q.b) && cnt(q.a) > 0;
    case 'half':   return cnt(q.a) * 2 === n;
    case 'third':  return cnt(q.a) * 3 === n;
    case 'most':   return [0, 1, 2, 3].every((k) => k === q.a || cnt(k) < cnt(q.a)) && cnt(q.a) > 0;
    default: return false;
  }
}
const allOK = (sec) => S.conds.every((q) => condOK(q, sec));

/** سفارش را از یک چیدمانِ واقعی می‌سازیم، پس همیشه ساختنی است. */
function newOrder() {
  const lv = L();
  const n = lv.n, pal = lv.pal;
  for (let tries = 0; tries < 600; tries++) {
    /* یک چیدمانِ نمونه. گاهی عمداً یک‌رنگ یا بی‌یک‌رنگ می‌سازیمش تا
       «به‌طور حتم» و «هرگز» — که کتاب رویشان تأکید دارد — کم پیش نیاید. */
    const sec = [];
    const mood = Math.random();
    if (mood < .14) {
      const k = R(0, pal - 1);
      for (let i = 0; i < n; i++) sec.push(k);
    } else if (mood < .44) {
      const skip = R(0, pal - 1);
      for (let i = 0; i < n; i++) { let k = R(0, pal - 1); if (k === skip) k = (k + 1) % pal; sec.push(k); }
    } else {
      for (let i = 0; i < n; i++) sec.push(R(0, pal - 1));
    }
    const cnt = (k) => sec.reduce((a, v) => a + (v === k ? 1 : 0), 0);

    const pool = [];
    for (let a = 0; a < pal; a++) {
      if (cnt(a) === n) pool.push({ k: 'always', a });
      if (cnt(a) === 0) pool.push({ k: 'never', a });
      if (cnt(a) * 2 === n) pool.push({ k: 'half', a });
      if (cnt(a) * 3 === n) pool.push({ k: 'third', a });
      if (cnt(a) > 0 && [0, 1, 2, 3].every((k) => k === a || cnt(k) < cnt(a))) pool.push({ k: 'most', a });
      for (let b = 0; b < pal; b++) {
        if (a === b) continue;
        if (cnt(a) > cnt(b) && cnt(b) > 0) pool.push({ k: 'more', a, b });
        if (cnt(a) === cnt(b) && cnt(a) > 0) pool.push({ k: 'equal', a, b });
      }
    }
    if (pool.length < lv.conds) continue;
    /* چند شرط که با هم تکراری یا هم‌معنی نباشند */
    const picked = [];
    const seen = new Set();
    for (let g = 0; g < 60 && picked.length < lv.conds; g++) {
      const q = pool[R(0, pool.length - 1)];
      const key = q.k + ':' + q.a + ':' + (q.b === undefined ? '' : q.b);
      if (seen.has(key)) continue;
      if (picked.some((o) => o.k === q.k && o.a === q.a)) continue;
      seen.add(key);
      picked.push(q);
    }
    if (picked.length < lv.conds) continue;
    /* چرخِ خالیِ آغاز نباید از همان اوّل سفارش را برآورده کند */
    const start = [];
    let base = -1;
    for (let k = 0; k < pal; k++) {
      const t = new Array(n).fill(k);
      if (!picked.every((q) => condOK(q, t))) { base = k; break; }
    }
    if (base < 0) continue;
    for (let i = 0; i < n; i++) start.push(base);
    S.n = n; S.pal = pal;
    S.sec = start;
    S.conds = picked;
    S.tally = [0, 0, 0, 0];
    S.spins = 0;
    S.ok = false;
    S.brush = (base + 1) % pal;
    S.spin = null;
    return;
  }
  S.n = 6; S.pal = 2; S.sec = new Array(6).fill(0);
  S.conds = [{ k: 'equal', a: 0, b: 1 }];
  S.tally = [0, 0, 0, 0]; S.spins = 0; S.ok = false; S.brush = 1; S.spin = null;
}

function startLevel(i, keep) {
  const lv = LEVELS[i];
  S.level = i;
  S.cleared = 0;
  S.quota = lv.endless ? Infinity : lv.quota;
  S.combo = 0;
  S.timeLeft = lv.time;
  if (!keep) { S.score = 0; S.lanterns = 3; }
  S.phase = 'play'; S.phaseT = 0;
  S.tut.on = i === 0 && !keep; S.tut.step = 0; S.tut.t = 0;
  newOrder();
  toast.say(lv.hint, 'info');
}

/* ───────── حلقه ───────── */

newOrder();
whenFontsReady(() => runLoop(step));

function step(dt) {
  S.t += dt; S.phaseT += dt;
  if (S.shake > 0) S.shake -= dt;
  if (S.nope > 0) S.nope -= dt;
  for (const s of S.sparks) { s.t += dt; s.y -= 30 * dt; }
  S.sparks = S.sparks.filter((s) => s.t < s.life);

  if (S.spin) {
    const sp = S.spin;
    sp.t += dt;
    const k = easeOut(clamp(sp.t / sp.dur, 0, 1));
    S.na = lerp(sp.from, sp.to, k);
    if (sp.t >= sp.dur) {
      S.tally[S.sec[sp.seq[sp.i]]]++;
      S.spins++;
      sfx.tone(520 + S.sec[sp.seq[sp.i]] * 90, .08, 'sine', .07);
      sp.i++;
      if (sp.i >= sp.seq.length) { S.spin = null; finishSpin(); }
      else nextSpin(sp);
    }
  }

  if (S.phase === 'play') {
    const frozen = S.tut.on && S.tut.step < 2;
    if (!frozen && !S.sold) {
      S.timeLeft -= dt;
      if (S.timeLeft <= 0) { S.timeLeft = 0; loseLantern('بازار بسته شد!'); }
    }
    if (S.sold) { S.sold += dt; if (S.sold > 2.1) { newOrder(); S.timeLeft = L().time; } }
    if (S.tut.on) S.tut.t += dt;
  }
  bits.step(dt);
  toast.step(dt);
  draw();
}

function loseLantern(msg) {
  if (S.sold) return;
  S.lanterns--;
  S.combo = 0;
  S.shake = .5;
  S.spin = null;
  sfx.nope();
  toast.say(msg, 'bad');
  if (S.lanterns <= 0) { S.phase = 'lost'; S.phaseT = 0; return; }
  S.timeLeft = L().time;
  newOrder();
}

/** رنگ زدنِ یک قسمت. */
function paintSector(i) {
  if (S.phase !== 'play' || S.sold || S.spin) return;
  if (i < 0 || i >= S.n) return;
  if (S.sec[i] === S.brush) return;
  S.sec[i] = S.brush;
  S.tally = [0, 0, 0, 0]; S.spins = 0;      /* چرخ عوض شد، آزمایشِ قبلی بی‌اعتبار است */
  S.ok = allOK(S.sec);
  sfx.tone(360 + i * 14, .05, 'triangle', .05);
  const a = -Math.PI / 2 + (i + .5) / S.n * TAU;
  S.sparks.push({ x: WHEEL.x + Math.cos(a) * WHEEL.r * .7, y: WHEEL.y + Math.sin(a) * WHEEL.r * .7,
                  t: 0, life: .5, c: WC[S.brush].c });
  if (S.tut.on && S.tut.step === 1 && S.ok) { S.tut.step = 2; S.tut.t = 0; }
}

/** اهرم: ۱۰ بار می‌چرخانَد و جدولِ آزمایش را پُر می‌کند. */
function pullLever() {
  if (S.phase !== 'play' || S.sold || S.spin) return;
  const seq = [];
  for (let i = 0; i < 10; i++) seq.push(R(0, S.n - 1));
  S.tally = [0, 0, 0, 0]; S.spins = 0;
  S.spin = { seq, i: 0, t: 0, dur: .42, from: S.na, to: S.na };
  nextSpin(S.spin);
  sfx.slide();
}

function nextSpin(sp) {
  const i = sp.seq[sp.i];
  const step2 = TAU / S.n;
  /* خودِ چرخ سرِ جایش می‌ماند — کاری که بچّه ساخته نباید جابه‌جا شود.
     عقربه می‌چرخد تا روی قسمتِ i بایستد، درست مثلِ چرخندهٔ کتاب. */
  let target = -Math.PI / 2 + (i + .5) * step2 + (Math.random() - .5) * step2 * .5;
  while (target < sp.to + TAU * 2) target += TAU;
  sp.from = S.na;
  sp.to = target;
  sp.t = 0;
  sp.dur = .42;
}

function finishSpin() {
  S.drawing = false;
  if (S.ok) sell();
  else {
    S.nope = .8;
    sfx.nope();
    toast.say('مشتری هنوز راضی نیست — شرط‌ها را ببین.', 'bad');
  }
}

function sell() {
  S.sold = .001;
  S.combo++;
  S.cleared++;
  S.score += 320 + S.conds.length * 140 + Math.round(S.timeLeft * 4) + Math.min(S.combo, 6) * 70;
  if (S.score > S.best) { S.best = S.score; saveBest(S.best); }
  bits.confetti(WHEEL.x, WHEEL.y, 46, [P.gold, P.brassLt, WC[0].c, WC[2].c, '#fff']);
  sfx.win();
  toast.say('مشتری چرخنده را برد!', 'good');
  if (S.tut.on) S.tut.on = false;
  if (!L().endless && S.cleared >= S.quota) { S.score += 800; S.phase = 'won'; S.phaseT = 0; }
}

/* ───────── ورودی ───────── */

const TUT_TAP = [0, 2], TUT_LAST = 2;

function potBox(i) {
  const h = 48, gap = 8;
  return { x: PAL.x + 24, y: PAL.y + 58 + i * (h + gap), w: PAL.w - 48, h };
}
const leverKnob = () => ({ x: LEVER.x + LEVER.w / 2, y: LEVER.y + 172, r: 34 });

/** کدام قسمتِ چرخ زیرِ انگشت است؟ */
function sectorAt(p) {
  const dx = p.x - WHEEL.x, dy = p.y - WHEEL.y;
  const d = Math.hypot(dx, dy);
  if (d > WHEEL.r || d < 34) return -1;
  let a = Math.atan2(dy, dx) + Math.PI / 2;
  a = ((a % TAU) + TAU) % TAU;
  return Math.floor(a / (TAU / S.n)) % S.n;
}

cv.addEventListener('pointermove', (e) => {
  const p = toStage(e);
  if (S.phase !== 'play') { S.hover = inRect(p, BTN_GO) ? BTN_GO : null; cv.style.cursor = S.hover ? 'pointer' : 'default'; return; }
  if (S.drawing) {
    if (e.buttons === 0 && e.pointerType === 'mouse') { S.drawing = false; return; }
    paintSector(sectorAt(p));
    return;
  }
  S.hover = null;
  const s = sectorAt(p);
  if (s >= 0) S.hover = { k: 'sec', i: s };
  for (let i = 0; i < S.pal; i++) if (inRect(p, potBox(i))) S.hover = { k: 'pot', i };
  if (inCircle(p, leverKnob(), 10)) S.hover = { k: 'lever' };
  cv.style.cursor = S.hover ? 'pointer' : 'default';
});

cv.addEventListener('pointerdown', (e) => {
  const p = toStage(e);
  if (S.phase === 'intro') { startLevel(0); return; }
  if (S.phase === 'won') {
    if (!inRect(p, BTN_GO)) return;
    if (L().endless) startLevel(S.level, true);
    else if (S.level + 1 < LEVELS.length) startLevel(S.level + 1, true);
    else startLevel(0);
    return;
  }
  if (S.phase === 'lost') { if (inRect(p, BTN_GO)) startLevel(S.level); return; }
  if (tutTap(S.tut, TUT_TAP, TUT_LAST)) return;
  S.drawing = false;
  for (let i = 0; i < S.pal; i++) if (inRect(p, potBox(i))) { S.brush = i; sfx.tap(); return; }
  if (inCircle(p, leverKnob(), 12)) { pullLever(); return; }
  const s = sectorAt(p);
  if (s >= 0) {
    S.drawing = true;
    paintSector(s);
    try { cv.setPointerCapture(e.pointerId); } catch { /* بعضی مرورگرها */ }
  }
});

cv.addEventListener('pointerup', () => { S.drawing = false; });
cv.addEventListener('pointercancel', () => { S.drawing = false; });
cv.addEventListener('pointerleave', () => { S.drawing = false; });
addEventListener('blur', () => { S.drawing = false; });

/* ───────── ابزارِ نقاشی ───────── */

function rrPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function numText(str, x, y, o = {}) {
  ctx.save();
  ctx.font = `${o.family === 'Vazirmatn' ? (o.weight || 700) : '400'} ${o.size || 20}px "${o.family || 'Lalezar'}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  ctx.direction = 'ltr';
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.fillStyle = o.color || P.ink;
  ctx.fillText(str, x, y);
  ctx.restore();
}

function spot(rects, alpha) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, SCENE_W, SCENE_H);
  for (const r of rects) rrPath(r.x - 12, r.y - 12, r.w + 24, r.h + 24, 22);
  ctx.fillStyle = `rgba(8, 5, 16, ${alpha})`;
  ctx.fill('evenodd');
  ctx.restore();
}

function tutCard(x, y, w, lines, title) {
  const h = 26 + (title ? 44 : 0) + lines.length * 30;
  withShadow(24, 10, .5, () => {
    ctx.fillStyle = 'rgba(246, 237, 218, .97)';
    wobbleRect(x, y, w, h + 20, 16, 101, 2.2); ctx.fill();
  }, '8, 5, 16');
  ctx.fillStyle = P.tent;
  wobbleRect(x, y, w, 9, 4, 103, 1); ctx.fill();
  let yy = y + 34;
  if (title) { text(title, x + w / 2, yy + 6, { size: 25, family: 'Lalezar', color: P.ink }); yy += 44; }
  for (const l of lines) { text(l, x + w / 2, yy, { size: 18, color: '#6b6280' }); yy += 30; }
  return h + 20;
}

function disc(x, y, r, k) {
  ctx.fillStyle = WC[k].d;
  ctx.beginPath(); ctx.arc(x, y + 2, r, 0, TAU); ctx.fill();
  ctx.fillStyle = ball(x - r * .3, y - r * .3, r * 2, shade(WC[k].c, .4), WC[k].c, WC[k].d);
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.42)';
  ctx.beginPath(); ctx.ellipse(x - r * .32, y - r * .34, r * .3, r * .18, -.6, 0, TAU); ctx.fill();
}

/* ───────── پس‌زمینهٔ ثابت ───────── */

function paintFairStatic() {
  const g = ctx.createLinearGradient(0, 0, 0, SCENE_H);
  g.addColorStop(0, P.nightLo); g.addColorStop(.45, P.night); g.addColorStop(1, '#0e0918');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, SCENE_W, SCENE_H);
  /* ستاره‌ها */
  for (let i = 0; i < 130; i++) {
    const x = noise1(i * 1.7) * SCENE_W, y = HUD_H + noise1(i * 3.1 + 7) * 260;
    ctx.fillStyle = `rgba(255, 246, 220, ${.15 + noise1(i * .9) * .5})`;
    ctx.beginPath(); ctx.arc(x, y, .6 + noise1(i * 2.3) * 1.5, 0, TAU); ctx.fill();
  }
  /* سایبانِ راه‌راهِ بازار */
  ctx.fillStyle = P.tentDk;
  ctx.beginPath();
  ctx.moveTo(0, HUD_H); ctx.lineTo(SCENE_W, HUD_H);
  ctx.lineTo(SCENE_W, 108);
  for (let x = SCENE_W; x >= 0; x -= 60) ctx.quadraticCurveTo(x - 30, 140, x - 60, 108);
  ctx.closePath(); ctx.fill();
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(0, HUD_H); ctx.lineTo(SCENE_W, HUD_H); ctx.lineTo(SCENE_W, 104);
  for (let x = SCENE_W; x >= 0; x -= 60) ctx.quadraticCurveTo(x - 30, 136, x - 60, 104);
  ctx.closePath(); ctx.clip();
  for (let x = 0; x < SCENE_W; x += 60) {
    ctx.fillStyle = (x / 60) % 2 ? P.tent : P.tentLt;
    ctx.fillRect(x, HUD_H, 60, 100);
  }
  const tg = ctx.createLinearGradient(0, HUD_H, 0, 140);
  tg.addColorStop(0, 'rgba(0,0,0,.42)'); tg.addColorStop(1, 'rgba(255, 208, 138, .18)');
  ctx.fillStyle = tg; ctx.fillRect(0, HUD_H, SCENE_W, 100);
  ctx.restore();

  /* زمینِ کارگاه */
  ctx.fillStyle = '#2a1c2e';
  ctx.fillRect(0, 640, SCENE_W, SCENE_H - 640);
  ctx.fillStyle = texWood('#4a3220', '#241408');
  ctx.fillRect(0, 648, SCENE_W, SCENE_H - 648);
  ctx.fillStyle = 'rgba(255, 208, 138, .12)';
  ctx.fillRect(0, 648, SCENE_W, 3);

  /* ریسهٔ چراغ */
  ctx.strokeStyle = 'rgba(20, 12, 30, .8)'; ctx.lineWidth = 3;
  ctx.beginPath();
  for (let x = 0; x <= SCENE_W; x += 20) ctx.lineTo(x, 150 + Math.sin(x * .012) * 16);
  ctx.stroke();
  for (let x = 30; x < SCENE_W; x += 96) {
    const y = 150 + Math.sin(x * .012) * 16;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const lg = ctx.createRadialGradient(x, y + 14, 2, x, y + 14, 60);
    lg.addColorStop(0, 'rgba(255, 208, 138, .34)');
    lg.addColorStop(1, 'rgba(255, 208, 138, 0)');
    ctx.fillStyle = lg;
    ctx.beginPath(); ctx.arc(x, y + 14, 60, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.fillStyle = P.brassDk;
    ctx.beginPath(); rrPath(x - 4, y, 8, 8, 3); ctx.fill();
    ctx.fillStyle = P.lamp;
    ctx.beginPath(); ctx.ellipse(x, y + 15, 8, 10, 0, 0, TAU); ctx.fill();
  }

  /* سه‌پایهٔ چوبیِ چرخنده */
  ctx.strokeStyle = P.woodDk; ctx.lineWidth = 22; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(WHEEL.x - 96, 704); ctx.lineTo(WHEEL.x, WHEEL.y + 40);
  ctx.lineTo(WHEEL.x + 96, 704);
  ctx.stroke();
  ctx.strokeStyle = P.wood; ctx.lineWidth = 14;
  ctx.beginPath();
  ctx.moveTo(WHEEL.x - 96, 704); ctx.lineTo(WHEEL.x, WHEEL.y + 40);
  ctx.lineTo(WHEEL.x + 96, 704);
  ctx.stroke();
}

/* ───────── صحنه ───────── */

function draw() {
  beginScene(P.night);
  ctx.save();
  if (S.shake > 0) {
    const k = S.shake * 10;
    ctx.translate(Math.sin(S.t * 55) * k, Math.cos(S.t * 43) * k * .4);
  }
  ctx.drawImage(staticLayer('fair', SCENE_W, SCENE_H, paintFairStatic), 0, 0, SCENE_W, SCENE_H);
  drawWheel();
  drawFractions();
  drawOrder();
  drawTally();
  drawPalette();
  drawLever();
  for (const s of S.sparks) {
    ctx.save();
    ctx.globalAlpha = clamp(1 - s.t / s.life, 0, 1);
    ctx.fillStyle = s.c;
    ctx.beginPath(); ctx.arc(s.x, s.y, 7 * (1 - s.t / s.life) + 2, 0, TAU); ctx.fill();
    ctx.restore();
  }
  bits.draw();
  ctx.restore();

  drawHUD();
  if (!(S.phase === 'play' && S.tut.on)) toast.draw(HUD_H + 8, { good: P.good, bad: P.bad, info: P.paper, ink: P.ink });
  if (S.phase === 'play' && S.tut.on) drawTutorial();
  if (S.phase === 'intro') drawIntro();
  if (S.phase === 'won') drawWon();
  if (S.phase === 'lost') drawLost();
  endScene(.1, 'rgba(6, 3, 12, .5)', .42, .16);
}

function drawWheel() {
  const { x, y, r } = WHEEL;
  contact(x, y + r + 16, r * .7, 14, .5);
  /* قابِ چوبی */
  ctx.fillStyle = P.woodDk;
  ctx.beginPath(); ctx.arc(x, y, r + 22, 0, TAU); ctx.fill();
  ctx.fillStyle = ball(x - r * .3, y - r * .3, r * 2.4, P.woodLt, P.wood, P.woodDk);
  ctx.beginPath(); ctx.arc(x, y, r + 16, 0, TAU); ctx.fill();

  const stepA = TAU / S.n;
  for (let i = 0; i < S.n; i++) {
    const a0 = -Math.PI / 2 + i * stepA, a1 = a0 + stepA;
    const k = S.sec[i];
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.arc(x, y, r, a0, a1);
    ctx.closePath();
    const mid = (a0 + a1) / 2;
    const gx = x + Math.cos(mid) * r * .5, gy = y + Math.sin(mid) * r * .5;
    const g = ctx.createRadialGradient(gx - 20, gy - 20, 4, x, y, r);
    g.addColorStop(0, shade(WC[k].c, .3));
    g.addColorStop(.7, WC[k].c);
    g.addColorStop(1, WC[k].d);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = 'rgba(28, 16, 40, .5)'; ctx.lineWidth = 2.4;
    ctx.stroke();
    if (S.hover && S.hover.k === 'sec' && S.hover.i === i && !S.spin) {
      ctx.fillStyle = 'rgba(255,255,255,.16)';
      ctx.fill();
    }
  }
  /* برقِ لاکِ چرخ */
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.clip();
  const sg = ctx.createLinearGradient(x - r, y - r, x + r * .4, y + r);
  sg.addColorStop(0, 'rgba(255,255,255,.22)');
  sg.addColorStop(.45, 'rgba(255,255,255,0)');
  ctx.fillStyle = sg;
  ctx.fillRect(x - r, y - r, r * 2, r * 2);
  ctx.restore();
  /* پیچ‌های قاب */
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * TAU;
    ctx.fillStyle = P.brassDk;
    ctx.beginPath(); ctx.arc(x + Math.cos(a) * (r + 9), y + Math.sin(a) * (r + 9), 4, 0, TAU); ctx.fill();
  }
  /* توپیِ میانه */
  ctx.fillStyle = P.brassDk;
  ctx.beginPath(); ctx.arc(x, y + 2, 30, 0, TAU); ctx.fill();
  ctx.fillStyle = ball(x - 8, y - 8, 52, P.brassLt, P.brass, P.brassDk);
  ctx.beginPath(); ctx.arc(x, y, 28, 0, TAU); ctx.fill();
  /* عقربهٔ چرخان روی چرخِ ثابت */
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(S.na);
  withShadow(16, 6, .45, () => {
    ctx.fillStyle = '#22182e';
    ctx.beginPath();
    ctx.moveTo(-16, -13); ctx.lineTo(r - 16, -6);
    ctx.lineTo(r - 2, 0); ctx.lineTo(r - 16, 6); ctx.lineTo(-16, 13);
    ctx.closePath(); ctx.fill();
  }, '10, 6, 20');
  const ng = ctx.createLinearGradient(0, -13, 0, 13);
  ng.addColorStop(0, P.brassLt); ng.addColorStop(.5, P.brass); ng.addColorStop(1, P.brassDk);
  ctx.fillStyle = ng;
  ctx.beginPath();
  ctx.moveTo(-13, -10); ctx.lineTo(r - 18, -4.5);
  ctx.lineTo(r - 6, 0); ctx.lineTo(r - 18, 4.5); ctx.lineTo(-13, 10);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.beginPath(); ctx.moveTo(-10, -7); ctx.lineTo(r - 20, -2.6); ctx.lineTo(r - 20, -.6); ctx.lineTo(-10, -3);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  /* پیچِ میانِ عقربه */
  ctx.fillStyle = P.brassDk;
  ctx.beginPath(); ctx.arc(x, y, 9, 0, TAU); ctx.fill();
  ctx.fillStyle = P.brassLt;
  ctx.beginPath(); ctx.arc(x - 1.5, y - 1.5, 4.5, 0, TAU); ctx.fill();
}

/** «چه کسری از چرخنده سبز است؟» — کارِ خودِ بچّه، زیرِ چرخ. */

function condText(q) {
  switch (q.k) {
    case 'always': return 'همیشه ' + WC[q.a].n;
    case 'never':  return 'هرگز ' + WC[q.a].n;
    case 'more':   return WC[q.a].n + ' بیشتر از ' + WC[q.b].n;
    case 'equal':  return WC[q.a].n + ' و ' + WC[q.b].n + ' برابر';
    case 'half':   return 'نصفِ چرخ ' + WC[q.a].n;
    case 'third':  return 'یک‌سومِ چرخ ' + WC[q.a].n;
    case 'most':   return 'بیشترین شانس: ' + WC[q.a].n;
    default: return '';
  }
}

function condArt(cx, y, q) {
  const sym = (s, x2) => text(s, x2, y + 1, { size: 26, family: 'Lalezar', color: P.ink });
  if (q.k === 'always' || q.k === 'never') {
    disc(cx + 26, y, 17, q.a);
    ctx.strokeStyle = q.k === 'always' ? P.good : P.bad; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath();
    if (q.k === 'always') { ctx.moveTo(cx - 30, y); ctx.lineTo(cx - 18, y + 12); ctx.lineTo(cx + 2, y - 12); }
    else { ctx.moveTo(cx - 28, y - 12); ctx.lineTo(cx - 4, y + 12); ctx.moveTo(cx - 4, y - 12); ctx.lineTo(cx - 28, y + 12); }
    ctx.stroke();
  } else if (q.k === 'more') {
    disc(cx + 36, y, 22, q.a);
    disc(cx - 34, y, 11, q.b);
    ctx.fillStyle = 'rgba(43, 35, 56, .5)';
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.arc(cx - 6 + i * 7, y, 2.2 + i * .8, 0, TAU); ctx.fill();
    }
  } else if (q.k === 'equal') {
    disc(cx + 36, y, 17, q.a);
    disc(cx - 36, y, 17, q.b);
    sym('=', cx);
  } else if (q.k === 'half' || q.k === 'third') {
    /* نیم‌دایره یا یک‌سومِ دایره، به رنگِ خواسته */
    const rr = 19;
    ctx.fillStyle = 'rgba(43, 35, 56, .18)';
    ctx.beginPath(); ctx.arc(cx + 30, y, rr, 0, TAU); ctx.fill();
    ctx.fillStyle = WC[q.a].c;
    ctx.beginPath(); ctx.moveTo(cx + 30, y);
    ctx.arc(cx + 30, y, rr, -Math.PI / 2, -Math.PI / 2 + (q.k === 'half' ? Math.PI : TAU / 3));
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(43, 35, 56, .5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx + 30, y, rr, 0, TAU); ctx.stroke();
    text(q.k === 'half' ? '۱ از ۲' : '۱ از ۳', cx - 24, y + 1, { size: 18, color: P.ink });
  } else {
    disc(cx + 26, y, 17, q.a);
    ctx.strokeStyle = P.gold; ctx.lineWidth = 4; ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      const h = 8 + i * 7;
      ctx.beginPath(); ctx.moveTo(cx - 30 + i * 12, y + 12); ctx.lineTo(cx - 30 + i * 12, y + 12 - h); ctx.stroke();
    }
  }
}

/** جدولِ آزمایش — همان کارِ کتاب: ۱۰ بار بچرخان و بنویس. */

      { size: 16, color: 'rgba(246, 237, 218, .4)' });

function drawLever() {
  ctx.fillStyle = 'rgba(12, 7, 22, .8)';
  ctx.beginPath(); rrPath(LEVER.x, LEVER.y, LEVER.w, LEVER.h, 14); ctx.fill();
  ctx.strokeStyle = 'rgba(207, 167, 78, .34)'; ctx.lineWidth = 2;
  ctx.beginPath(); rrPath(LEVER.x, LEVER.y, LEVER.w, LEVER.h, 14); ctx.stroke();
  text('بچرخان', LEVER.x + LEVER.w / 2, LEVER.y + 32, { size: 21, family: 'Lalezar', color: P.brassLt });
  const k = leverKnob();
  const hot = S.hover && S.hover.k === 'lever';
  const busy = !!S.spin;
  /* شیار و میله */
  ctx.fillStyle = 'rgba(0,0,0,.5)';
  ctx.beginPath(); rrPath(k.x - 16, LEVER.y + 62, 32, 120, 16); ctx.fill();
  ctx.strokeStyle = P.brassDk; ctx.lineWidth = 8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(k.x, LEVER.y + 76); ctx.lineTo(k.x, k.y - (busy ? -14 : 0)); ctx.stroke();
  if (S.ok && !busy) {
    ctx.save();
    ctx.globalAlpha = .3 + .25 * Math.sin(S.t * 5);
    ctx.fillStyle = P.gold;
    ctx.beginPath(); ctx.arc(k.x, k.y, k.r + 16, 0, TAU); ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = P.brassDk;
  ctx.beginPath(); ctx.arc(k.x, k.y + 4 + (busy ? 14 : 0), k.r, 0, TAU); ctx.fill();
  ctx.fillStyle = ball(k.x - 10, k.y - 10, k.r * 2, P.brassLt, P.brass, P.brassDk);
  ctx.beginPath(); ctx.arc(k.x, k.y + (busy ? 14 : 0), k.r - 2, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.beginPath(); ctx.ellipse(k.x - 10, k.y - 11 + (busy ? 14 : 0), 9, 5, -.6, 0, TAU); ctx.fill();
  if (hot && !busy) {
    ctx.save();
    ctx.globalAlpha = .5 + .3 * Math.sin(S.t * 6);
    ctx.strokeStyle = P.brassLt; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(k.x, k.y, k.r + 10, 0, TAU); ctx.stroke();
    ctx.restore();
  }
  text(S.ok ? 'سفارش جور است' : 'هر وقت خواستی بیازما',
    LEVER.x + LEVER.w / 2, LEVER.y + LEVER.h - 32,
    { size: 15, color: S.ok ? P.good : 'rgba(246, 237, 218, .45)' });
  if (S.nope > 0) {
    ctx.save();
    ctx.globalAlpha = clamp(S.nope, 0, 1);
    ctx.strokeStyle = P.bad; ctx.lineWidth = 4;
    ctx.beginPath(); rrPath(LEVER.x, LEVER.y, LEVER.w, LEVER.h, 14); ctx.stroke();
    ctx.restore();
  }
}

function wheelIcon(x, y) {
  const r = 30;
  for (let i = 0; i < 6; i++) {
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.arc(x, y, r, i / 6 * TAU, (i + 1) / 6 * TAU);
    ctx.closePath();
    ctx.fillStyle = WC[i % 3].c;
    ctx.fill();
  }
  ctx.strokeStyle = P.ink; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
  ctx.fillStyle = P.ink;
  ctx.beginPath(); ctx.moveTo(x - 8, y - r - 12); ctx.lineTo(x + 8, y - r - 12); ctx.lineTo(x, y - r + 8); ctx.closePath(); ctx.fill();
}

  });
}

function drawWon() {
  const last = S.level + 1 >= LEVELS.length;
  overlay({
    t: S.phaseT, w: 720, h: 250, y: 160,
    paper: P.paper, band: P.gold, ink: P.ink, inkSoft: '#6b6280',
    icon: wheelIcon,
    title: L().endless ? 'بازار خوابید' : 'همهٔ سفارش‌ها رفت!',
    body: 'امتیاز: ' + fa(S.score) + (last ? '\nهمهٔ کارگاه‌ها را گرداندی. از اوّل؟' : ''),
    btn: BTN_GO, btnLabel: last ? 'دوباره' : 'مشتریِ بعد', btnHot: S.hover === BTN_GO,
    btnFill: '#6d2f4a', btnHotFill: '#8f4363',
  });
}

function drawLost() {
  overlay({
    t: S.phaseT, w: 720, h: 250, y: 160,
    paper: P.paper, band: P.bad, ink: P.ink, inkSoft: '#6b6280',
    icon: (x, y) => {
      ctx.fillStyle = '#8f7327';
      ctx.beginPath(); rrPath(x - 13, y - 14, 26, 34, 6); ctx.fill();
      ctx.fillStyle = '#6d6578';
      ctx.beginPath(); ctx.ellipse(x, y + 2, 7, 9, 0, 0, TAU); ctx.fill();
      wheelIcon(x + 60, y + 2);
    },
    title: 'چراغ‌ها خاموش شد',
    body: 'امتیاز: ' + fa(S.score) + '\nاوّل شرط‌ها را جور کن، بعد بچرخان.',
    btn: BTN_GO, btnLabel: 'دوباره', btnHot: S.hover === BTN_GO,
    btnFill: '#6d2f4a', btnHotFill: '#8f4363',
  });
}

</script>
</body>
