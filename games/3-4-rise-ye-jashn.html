<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#221626">
<title>ریسهٔ جشن — تساوی کسرها</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>
  /* صفحه نباید هیچ‌جا اسکرول یا زوم شود؛ بازی باید مثل یک برنامه رفتار کند. */
  html, body {
    margin: 0; padding: 0; background: #221626;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body {
    position: fixed; inset: 0;          /* جلوی کشیده‌شدنِ صفحه در سافاریِ گوشی */
    width: 100%; height: 100vh; height: 100dvh;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none; -webkit-touch-callout: none;
  }

  /* گوشیِ عمودی صحنه را ریز می‌کند؛ بچه باید گوشی را بچرخاند. */
  #rotate { display: none; }
  @media (orientation: portrait) and (max-width: 860px) {
    #stage { display: none; }
    #rotate {
      display: flex; position: fixed; inset: 0;
      z-index: 9;
      flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      background: #221626; color: #f6ead2;
      font: 700 20px "Vazirmatn", Tahoma, sans-serif; text-align: center; padding: 32px;
    }
    #rotate svg { animation: tilt 2.4s ease-in-out infinite; }
    @keyframes tilt { 0%, 45% { transform: rotate(0deg); } 65%, 100% { transform: rotate(-90deg); } }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="rotate">
  <svg width="86" height="126" viewBox="0 0 86 126" fill="none" aria-hidden="true">
    <rect x="3" y="3" width="80" height="120" rx="12" stroke="#e8b448" stroke-width="5"/>
    <rect x="15" y="19" width="56" height="88" rx="5" fill="#e8b448" opacity=".28"/>
    <circle cx="43" cy="115" r="4" fill="#e8b448"/>
  </svg>
  <div>گوشی را بچرخان</div>
  <div style="font-weight:400;opacity:.7;font-size:16px">این بازی خوابیده بازی می‌شود</div>
</div>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   هستهٔ مشترکِ بازی‌ها — سبک «کاغذبُری»
   ───────────────────────────────────────────────────────────────────────
   این فایل جعبه‌ابزار است، نه چارچوب: هر بازی حلقه و وضعیت خودش را دارد
   و فقط از این توابع برای کشیدن استفاده می‌کند. دلیلش این است که هر بازی
   باید حس‌وحال خودش را داشته باشد، نه اینکه همه شبیه هم دربیایند.

   قاعده‌های ثابتِ تصویری:
   • نور همیشه از بالا-چپ می‌تابد، پس سایه‌ها به پایین-راست می‌افتند.
   • هیچ لبه‌ای کاملاً صاف نیست؛ همه کمی موج دارند (انگار با قیچی بریده).
   • هیچ خاکستریِ خالصی نداریم؛ همه‌ی خنثی‌ها به گرمیِ صحنه می‌زنند.
   • یک لایه‌ی دانه‌دانه‌ی کاغذ روی کلِ تصویر ضرب می‌شود.
   ═══════════════════════════════════════════════════════════════════════ */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const FA_D = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
const fa = (n) => String(n).replace(/\d/g, (d) => FA_D[+d]);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeIn = (t) => t * t * t;
const easeInOut = (t) => (t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2);
const easeBack = (t) => 1 + 2.7 * Math.pow(t-1, 3) + 1.7 * Math.pow(t-1, 2);
const easeElastic = (t) => t === 0 || t === 1 ? t : Math.pow(2, -9*t) * Math.sin((t*10 - .75) * 2.094) + 1;

/** تصادفِ تکرارپذیر: با یک بذر همیشه همان عدد. برای اینکه تزئین‌ها هر فریم نپرند. */
function noise1(x) {
  const s = Math.sin(x * 127.1) * 43758.5453;
  return s - Math.floor(s);
}
const pick = (arr, seed) => arr[Math.floor(noise1(seed) * arr.length) % arr.length];

/* ───────── بوم و صحنهٔ ثابت ───────── */

let ctx, SW, SH, CV, _refit = null;
let view = { scale: 1, ox: 0, oy: 0, w: 0, h: 0, dpr: 1 };
let _grain = null, _grainDark = null;

function initStage(canvas, w, h) {
  CV = canvas; SW = w; SH = h;
  ctx = canvas.getContext('2d');

  /* اندازه را از خودِ بوم می‌گیریم نه از innerHeight؛ چون در سافاریِ گوشی
     نوارِ آدرس باز و بسته می‌شود و innerHeight دروغ می‌گوید. */
  const fit = () => {
    const r = canvas.getBoundingClientRect();
    const vw = Math.round(r.width), vh = Math.round(r.height);
    if (vw < 20 || vh < 20) return;
    const dpr = Math.min(devicePixelRatio || 1, QUALITY > 0 ? 2 : 1);
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    const scale = Math.min(vw / SW, vh / SH);
    view = { scale, ox: (vw - SW*scale)/2, oy: (vh - SH*scale)/2, w: vw, h: vh, dpr };
    _grain = buildGrain();
  };
  _refit = fit;
  addEventListener('resize', fit);
  /* چرخاندنِ گوشی: اندازهٔ درست چند لحظه بعد می‌رسد، پس چندبار اندازه می‌گیریم. */
  addEventListener('orientationchange', () => {
    fit(); setTimeout(fit, 140); setTimeout(fit, 460);
  });
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(canvas);

  /* صدا در گوشی فقط بعد از اوّلین لمس اجازهٔ پخش دارد. */
  const unlock = () => { sfx._c(); removeEventListener('pointerdown', unlock); removeEventListener('touchstart', unlock); };
  addEventListener('pointerdown', unlock, { passive: true });
  addEventListener('touchstart', unlock, { passive: true });
  /* نگه‌داشتنِ انگشت نباید منوی مرورگر را باز کند. */
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  fit();
  return ctx;
}

/** قابِ صحنه را باز می‌کند: بعد از این، مختصات همیشه در فضای SW×SH است. */
function beginScene(bg) {
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, view.w, view.h);
  ctx.save();
  ctx.translate(view.ox, view.oy);
  ctx.scale(view.scale, view.scale);
  ctx.beginPath();
  ctx.rect(0, 0, SW, SH);
  ctx.clip();
}

/* ───────── پوششِ پایانِ قاب ─────────
   دانه‌های کاغذ و تیرگیِ گوشه‌ها هر دو ثابت‌اند و تغییر نمی‌کنند، ولی
   قبلاً هر فریم از نو کشیده می‌شدند: یکی با «multiply» روی کلِّ صفحه و
   یکی با یک گرادیانِ شعاعیِ تازه. اندازه‌گیری نشان داد همین دو تا
   ۱۱ تا ۱۶ میلی‌ثانیه از هر فریم را می‌خوردند — بیشتر از کشیدنِ خودِ
   صحنه. حالا یک بار در یک بومِ جدا پخته می‌شوند و هر فریم فقط یک
   drawImage است.                                                       */

let _ovl = null, _ovlKey = '';

function overlayLayer(grainAlpha, vignette) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const w = Math.max(2, Math.round(SW * q)), h = Math.max(2, Math.round(SH * q));
  const key = w + 'x' + h + '|' + grainAlpha + '|' + vignette;
  if (_ovl && _ovlKey === key) return _ovl;
  let c;
  try {
    c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g2 = c.getContext('2d');
    if (!g2) return null;
    if (_grainDark && grainAlpha > 0) {
      /* همان دانه‌ها، ولی به‌جای multiply به شکلِ سیاهِ کم‌رنگ */
      g2.globalAlpha = clamp(grainAlpha * 1.15, 0, 1);
      g2.fillStyle = g2.createPattern(_grainDark, 'repeat');
      g2.fillRect(0, 0, w, h);
      g2.globalAlpha = 1;
    }
    if (vignette) {
      const g = g2.createRadialGradient(w / 2, h / 2, h * .42, w / 2, h / 2, h * 1.05);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, vignette);
      g2.fillStyle = g;
      g2.fillRect(0, 0, w, h);
    }
  } catch (e) { return null; }
  _ovl = c; _ovlKey = key;
  return c;
}

/** بافتِ کاغذ، تیرگیِ گوشه‌ها، رنگ‌بندی و درخششِ نور را می‌گذارد و قاب را می‌بندد. */
function endScene(grainAlpha = .15, vignette = 'rgba(48,28,14,.30)', bloom = .34, grade = .14) {
  /* درخششِ نور خاموش است. اندازه‌گیری نشان داد هر فریم ۲۱ میلی‌ثانیه
     می‌گیرد — بیشتر از تمامِ کارهای دیگرِ یک فریم روی هم — چون برای
     ساختنش باید کلِّ بوم دوباره خوانده شود. از آن بدتر: متنِ فارسی را
     مه‌آلود می‌کرد و خواندنش را سخت‌تر. بی‌آن، صحنه تمیزتر است. */
  bloom = 0;
  if (QUALITY < 1) { grade = 0; grainAlpha *= .5; }
  if (QUALITY < 2) grade = 0;
  if (grade > 0) {
    /* رنگ‌بندیِ نرم: بالای صحنه گرم‌تر، پایین سردتر — عمق می‌دهد */
    const g = ctx.createLinearGradient(0, 0, 0, SH);
    g.addColorStop(0, `rgba(255, 214, 150, ${grade})`);
    g.addColorStop(.55, 'rgba(255, 255, 255, 0)');
    g.addColorStop(1, `rgba(40, 60, 110, ${grade * .9})`);
    ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalCompositeOperation = 'source-over';
  }
  const ov = (grainAlpha > 0 || vignette) ? overlayLayer(grainAlpha, vignette) : null;
  if (ov) ctx.drawImage(ov, 0, 0, SW, SH);
  ctx.restore();
  bloomPass(bloom);
}

/* ───────── درخششِ نور (bloom) ─────────
   قابِ رسم‌شده را کوچک می‌کنیم، دو بار در خودش ضرب می‌کنیم تا فقط
   روشن‌ها بمانند، محوش می‌کنیم و با حالتِ «lighter» رویش می‌گذاریم.
   نتیجه: چراغ‌ها، شعله‌ها و رنگ‌های روشن نور پخش می‌کنند. */
let _bl, _blc, _bl2, _bl2c, _blNo = false, _blTick = 0;

function bloomPass(amount) {
  if (!amount || _blNo || !CV.width) return;
  /* کوچک‌کردن و بزرگ‌کردنِ دوباره، خودش محو می‌کند — از filter خیلی ارزان‌تر است */
  const W = Math.max(4, Math.round(CV.width * .2)), H = Math.max(4, Math.round(CV.height * .2));
  const W2 = Math.max(2, Math.round(W * .28)), H2 = Math.max(2, Math.round(H * .28));
  try {
    if (!_bl) {
      _bl = document.createElement('canvas'); _blc = _bl.getContext('2d');
      _bl2 = document.createElement('canvas'); _bl2c = _bl2.getContext('2d');
      if (!_blc || !_bl2c) { _blNo = true; return; }
    }
    if (_bl.width !== W || _bl.height !== H) { _bl.width = W; _bl.height = H; }
    if (_bl2.width !== W2 || _bl2.height !== H2) { _bl2.width = W2; _bl2.height = H2; }
    /* ساختنِ نور یک قاب در میان کافی است؛ گذاشتنش هر قاب. */
    _blTick = (_blTick + 1) & 1;
    if (!_blTick) {
      _blc.globalCompositeOperation = 'source-over';
      _blc.clearRect(0, 0, W, H);
      _blc.drawImage(CV, 0, 0, W, H);
      _blc.globalCompositeOperation = 'multiply';
      _blc.drawImage(_bl, 0, 0);
      _blc.drawImage(_bl, 0, 0);
      _blc.globalCompositeOperation = 'source-over';
      _bl2c.clearRect(0, 0, W2, H2);
      _bl2c.drawImage(_bl, 0, 0, W2, H2);
    }

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = amount;
    ctx.drawImage(_bl2, 0, 0, CV.width, CV.height);
    ctx.restore();
  } catch (e) { _blNo = true; }
}

/* ───────── لایهٔ ثابت ─────────
   هرچه در صحنه تکان نمی‌خورد را یک‌بار می‌کشیم و بعد فقط کپی می‌کنیم. */
const _layers = {};
function staticLayer(key, w, h, paint) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const L = _layers[key];
  if (L && L.q === q && L.w === w && L.h === h) return L.cv;
  const off = document.createElement('canvas');
  off.width = Math.max(1, Math.round(w * q));
  off.height = Math.max(1, Math.round(h * q));
  const c = off.getContext('2d');
  c.setTransform(q, 0, 0, q, 0, 0);
  const prev = ctx;
  ctx = c;
  try { paint(); } finally { ctx = prev; }
  _layers[key] = { cv: off, q, w, h };
  return off;
}

/* ───────── نورپردازی و بافت ─────────
   کارِ این‌ها این است که هیچ سطحی «تختِ یک‌رنگ» نماند. */

/** شیبِ عمودی: بالا روشن، پایین تیره. */
function vgrad(y0, y1, top, bot) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, top); g.addColorStop(1, bot);
  return g;
}

/** حجمِ کروی: نور از بالا-چپ، سایه در پایین-راست. */
function ball(cx, cy, r, lit, base, dark) {
  const g = ctx.createRadialGradient(cx - r * .38, cy - r * .42, r * .06, cx, cy, r * 1.06);
  g.addColorStop(0, lit); g.addColorStop(.45, base); g.addColorStop(1, dark);
  return g;
}

/** لبهٔ روشنِ بالا-چپِ یک مسیر — همان «rim light». */
function rim(pathFn, col, w = 2.2) {
  ctx.save();
  ctx.beginPath(); pathFn();
  ctx.clip();
  ctx.beginPath(); pathFn();
  ctx.strokeStyle = col; ctx.lineWidth = w * 2; ctx.lineJoin = 'round';
  ctx.translate(-w * .5, -w * .6);
  ctx.stroke();
  ctx.restore();
}

/** سایهٔ چسبیده به زمین — چیزها را روی سطح می‌نشاند. */
function contact(cx, cy, rx, ry, alpha = .26) {
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
  g.addColorStop(0, `rgba(20, 12, 6, ${alpha})`);
  g.addColorStop(1, 'rgba(20, 12, 6, 0)');
  ctx.save();
  ctx.fillStyle = g;
  ctx.translate(cx, cy); ctx.scale(1, ry / Math.max(rx, ry));
  ctx.beginPath(); ctx.arc(0, 0, Math.max(rx, ry), 0, TAU); ctx.fill();
  ctx.restore();
}

const _tex = {};
/** بافتِ تکرارشونده؛ یک‌بار ساخته و بعد از حافظه خوانده می‌شود. */
function texture(key, w, h, paint) {
  if (_tex[key]) return _tex[key];
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const c = off.getContext('2d');
  paint(c, w, h);
  _tex[key] = ctx.createPattern(off, 'repeat');
  return _tex[key];
}

/** رگهٔ چوب. */
function texWood(base, grain) {
  return texture('w' + base + grain, 120, 120, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = grain; c.lineWidth = 1.4;
    for (let i = 0; i < 9; i++) {
      c.globalAlpha = .18 + noise1(i * 3.1) * .3;
      c.beginPath();
      const y0 = i * 14 + noise1(i) * 6;
      c.moveTo(0, y0);
      for (let x = 0; x <= w; x += 10) c.lineTo(x, y0 + Math.sin(x * .09 + i) * 2.6);
      c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** تارِ پارچه. */
function texCloth(base, thread) {
  return texture('c' + base + thread, 16, 16, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = thread; c.lineWidth = 1; c.globalAlpha = .5;
    for (let i = 0; i < w; i += 4) {
      c.beginPath(); c.moveTo(i, 0); c.lineTo(i, h); c.stroke();
      c.beginPath(); c.moveTo(0, i); c.lineTo(w, i); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** دانه‌های سنگ. */
function texStone(base, spec) {
  return texture('s' + base + spec, 90, 90, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) {
      c.globalAlpha = .05 + noise1(i * 1.7) * .16;
      c.fillStyle = spec;
      const r = .6 + noise1(i * 5.3) * 1.9;
      c.beginPath();
      c.arc(noise1(i * 2.1) * w, noise1(i * 3.7 + 1) * h, r, 0, TAU);
      c.fill();
    }
    c.globalAlpha = 1;
  });
}

/** الیافِ کاغذ. */
function texPaper(base) {
  return texture('p' + base, 100, 100, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 130; i++) {
      c.globalAlpha = .04 + noise1(i * 2.3) * .07;
      c.strokeStyle = i % 2 ? '#ffffff' : '#5a4326';
      c.lineWidth = .9;
      const x = noise1(i * 1.3) * w, y = noise1(i * 4.1 + 2) * h;
      const a = noise1(i * 7.7) * TAU, l = 4 + noise1(i * 9.1) * 12;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

function buildGrain() {
  const s = 260;
  const off = document.createElement('canvas');
  off.width = off.height = s;
  const c = off.getContext('2d');
  const img = c.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    const v = 214 + Math.random() * 41;
    img.data[i*4] = v; img.data[i*4+1] = v; img.data[i*4+2] = v; img.data[i*4+3] = 255;
  }
  c.putImageData(img, 0, 0);
  /* همان دانه‌ها به شکلِ سیاهِ کم‌رنگ، تا بشود بدونِ multiply گذاشتشان */
  const d = document.createElement('canvas');
  d.width = d.height = s;
  const dc = d.getContext('2d');
  const dimg = dc.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    dimg.data[i*4] = 0; dimg.data[i*4+1] = 0; dimg.data[i*4+2] = 0;
    dimg.data[i*4+3] = 255 - img.data[i*4];
  }
  dc.putImageData(dimg, 0, 0);
  _grainDark = d;
  _ovl = null; _ovlKey = '';
  return ctx.createPattern(off, 'repeat');
}

function toStage(e) {
  const r = CV.getBoundingClientRect();
  return {
    x: (e.clientX - r.left - view.ox) / view.scale,
    y: (e.clientY - r.top - view.oy) / view.scale,
  };
}

const inRect = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
const inCircle = (p, b, pad = 0) => Math.hypot(p.x - b.x, p.y - b.y) <= b.r + pad;

/* ───────── قلم‌های کاغذبُری ───────── */

/** دایره‌ای که انگار با قیچی بریده شده. */
function wobbleCircle(cx, cy, r, seed = 0, amp = 2.2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const rr = r + Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp * .45;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** بیضیِ ناصاف — برای چیزهایی که گرد نیستند ولی نرم‌اند. */
function wobbleEllipse(cx, cy, rx, ry, rot = 0, seed = 0, amp = 2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const w = 1 + (Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp*.45) / Math.max(rx, ry);
    const px = Math.cos(a) * rx * w, py = Math.sin(a) * ry * w;
    const x = cx + px*Math.cos(rot) - py*Math.sin(rot);
    const y = cy + px*Math.sin(rot) + py*Math.cos(rot);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** مستطیلِ گِرد با گوشه‌های کمی کج. */
function wobbleRect(x, y, w, h, r = 12, seed = 0, amp = 1.6) {
  const j = (k) => (noise1(seed*9.7 + k) - .5) * amp * 2;
  ctx.beginPath();
  ctx.moveTo(x + r + j(1), y + j(2));
  ctx.lineTo(x + w - r + j(3), y + j(4));
  ctx.quadraticCurveTo(x + w + j(5), y + j(6), x + w + j(7), y + r + j(8));
  ctx.lineTo(x + w + j(9), y + h - r + j(10));
  ctx.quadraticCurveTo(x + w + j(11), y + h + j(12), x + w - r + j(13), y + h + j(14));
  ctx.lineTo(x + r + j(15), y + h + j(16));
  ctx.quadraticCurveTo(x + j(17), y + h + j(18), x + j(19), y + h - r + j(20));
  ctx.lineTo(x + j(21), y + r + j(22));
  ctx.quadraticCurveTo(x + j(23), y + j(24), x + r + j(1), y + j(2));
  ctx.closePath();
}

/** سایهٔ نرم؛ نور از بالا-چپ. */
function withShadow(blur, dy, alpha, fn, hue = '78, 46, 24') {
  ctx.save();
  ctx.shadowColor = `rgba(${hue}, ${alpha})`;
  ctx.shadowBlur = blur;
  ctx.shadowOffsetY = dy;
  ctx.shadowOffsetX = dy * .35;
  fn();
  ctx.restore();
}

/** یک برگه‌ی کاغذ با سایه — پایه‌ی همه‌ی کارت‌ها و تابلوها. */
function paper(x, y, w, h, fill, seed = 1, r = 12, shadow = .26) {
  withShadow(16, 7, shadow, () => {
    ctx.fillStyle = fill;
    wobbleRect(x, y, w, h, r, seed, 2);
    ctx.fill();
  });
  /* الیافِ کاغذ و لبهٔ روشن، تا سطح تخت نماند */
  ctx.save();
  ctx.beginPath(); wobbleRect(x, y, w, h, r, seed, 2); ctx.clip();
  ctx.globalAlpha = .5;
  ctx.fillStyle = texPaper(fill);
  ctx.fillRect(x, y, w, h);
  ctx.globalAlpha = 1;
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.4, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(90,60,20,.1)');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
}

function text(str, x, y, o = {}) {
  const size = o.size || 20;
  const fam = o.family || 'Vazirmatn';
  ctx.save();
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.font = `${fam === 'Lalezar' ? '400' : (o.weight || 700)} ${size}px "${fam}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.baseline || 'middle';
  ctx.fillStyle = o.color || '#43291b';
  ctx.direction = 'rtl';
  if (o.stroke) {
    ctx.lineWidth = o.strokeWidth || 5;
    ctx.strokeStyle = o.stroke;
    ctx.lineJoin = 'round';
    ctx.strokeText(str, x, y, o.maxWidth);
  }
  ctx.fillText(str, x, y, o.maxWidth);
  ctx.restore();
}

/** متنِ چندخطی که خودش می‌شکند. ارتفاعِ اشغال‌شده را برمی‌گرداند. */
function textWrap(str, x, y, maxW, o = {}) {
  const size = o.size || 19, lh = o.lineHeight || size * 1.7;
  ctx.font = `${o.weight || 700} ${size}px "${o.family || 'Vazirmatn'}", Tahoma, sans-serif`;
  const lines = [];
  for (const para of str.split('\n')) {
    let line = '';
    for (const wd of para.split(' ')) {
      const t = line ? line + ' ' + wd : wd;
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = wd; }
      else line = t;
    }
    lines.push(line);
  }
  lines.forEach((l, i) => text(l, x, y + i * lh, o));
  return lines.length * lh;
}

/* ───────── ذره‌ها ───────── */

class Bits {
  constructor() { this.list = []; }
  add(x, y, n, kind, colors, opts = {}) {
    for (let i = 0; i < n; i++) {
      const a = opts.dir !== undefined ? opts.dir + (Math.random()-.5) * (opts.spread || 1) : Math.random() * TAU;
      const sp = (opts.speed || 200) * (.4 + Math.random());
      this.list.push({
        kind, x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - (opts.lift || 0),
        r: (opts.size || 4) * (.5 + Math.random()),
        rot: Math.random() * TAU, vr: (Math.random()-.5) * 10,
        col: colors[(Math.random() * colors.length) | 0],
        grav: opts.grav === undefined ? 620 : opts.grav,
        drag: opts.drag || .995,
        life: (opts.life || .9) * (.6 + Math.random() * .8), age: 0,
      });
    }
  }
  confetti(x, y, n, colors) {
    this.add(x, y, n, 'flake', colors, { speed: 420, lift: 190, size: 5, life: 1.6, grav: 780 });
  }
  spark(x, y, n, colors) {
    this.add(x, y, n, 'dot', colors, { speed: 180, lift: 30, size: 3.4, life: .7, grav: 260, drag: .93 });
  }
  step(dt) {
    for (const p of this.list) {
      p.age += dt;
      p.vy += p.grav * dt;
      p.vx *= p.drag; p.vy *= p.drag;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    }
    this.list = this.list.filter((p) => p.age < p.life);
  }
  draw() {
    for (const p of this.list) {
      const k = clamp(1 - p.age / p.life, 0, 1);
      ctx.save();
      ctx.globalAlpha = k;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.col;
      if (p.kind === 'flake') ctx.fillRect(-p.r, -p.r*1.5, p.r*2, p.r*3);
      else if (p.kind === 'leaf') { wobbleEllipse(0, 0, p.r*1.8, p.r*.8, 0, p.r, .6); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(0, 0, p.r * k, 0, TAU); ctx.fill(); }
      ctx.restore();
    }
  }
  clear() { this.list.length = 0; }
}

/* ───────── صدا (بدون فایل صوتی) ───────── */

const sfx = {
  ac: null, on: true,
  _c() {
    if (!this.on) return null;
    if (!this.ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; this.ac = new A(); }
    if (this.ac.state === 'suspended') this.ac.resume();
    return this.ac;
  },
  tone(f, dur = .16, type = 'sine', gain = .13, delay = 0) {
    const c = this._c(); if (!c) return;
    const t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(t0 + dur + .04);
  },
  tap()  { this.tone(430, .07, 'triangle', .09); },
  place(){ this.tone(620, .11, 'sine', .12); },
  pop()  { this.tone(760, .09, 'sine', .11); },
  slide(){ this.tone(240, .22, 'sine', .07); },
  good() { [523, 659, 784].forEach((f,i) => this.tone(f, .22, 'sine', .13, i*.07)); },
  win()  { [523, 659, 784, 1047].forEach((f,i) => this.tone(f, .34, 'triangle', .13, i*.10)); },
  nope() { this.tone(180, .2, 'sawtooth', .07); },
  tick() { this.tone(1100, .04, 'square', .05); },
};

/* ───────── قطعه‌های آماده ───────── */

function star(x, y, r, col, rot = 0) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = col;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI/2 + i * Math.PI/5;
    const rr = i % 2 ? r * .45 : r;
    const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/** دکمهٔ کاغذی. hovered را خودِ بازی می‌دهد؛ اینجا فقط کشیده می‌شود. */
/** رنگ را روشن‌تر (k>0) یا تیره‌تر (k<0) می‌کند. */
function shade(col, k) {
  const c = String(col).trim();
  let r, g2, b2;
  if (c[0] === '#') {
    const h = c.length === 4 ? c[1]+c[1]+c[2]+c[2]+c[3]+c[3] : c.slice(1, 7);
    r = parseInt(h.slice(0,2), 16); g2 = parseInt(h.slice(2,4), 16); b2 = parseInt(h.slice(4,6), 16);
  } else {
    const m = c.match(/[\d.]+/g);
    if (!m || m.length < 3) return col;
    r = +m[0]; g2 = +m[1]; b2 = +m[2];
  }
  const f = (v) => Math.round(clamp(k < 0 ? v * (1 + k) : v + (255 - v) * k, 0, 255));
  return 'rgb(' + f(r) + ',' + f(g2) + ',' + f(b2) + ')';
}

function button(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 3 : 0;
  const fill = o.disabled ? (o.off || '#bcaa92') : (hot ? (o.hotFill || o.fill) : o.fill);
  const r = o.r === undefined ? 14 : o.r;
  /* لبهٔ زیرینِ تیره — دکمه از صفحه بیرون می‌زند */
  ctx.fillStyle = shade(fill, -.36);
  wobbleRect(b.x, b.y + dy + 7, b.w, b.h, r, b.x + b.y, 2);
  ctx.fill();
  withShadow(hot ? 22 : 14, hot ? 5 : 8, .32, () => {
    ctx.fillStyle = fill;
    wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2);
    ctx.fill();
  });
  /* حجم: روشن از بالا، تیره به پایین */
  ctx.save();
  ctx.beginPath(); wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2); ctx.clip();
  const g = ctx.createLinearGradient(0, b.y + dy, 0, b.y + dy + b.h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.45, 'rgba(255,255,255,.04)');
  g.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = g;
  ctx.fillRect(b.x, b.y + dy, b.w, b.h);
  /* برقِ باریکِ لبهٔ بالا */
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.fillRect(b.x + r, b.y + dy + 2, b.w - r * 2, 2);
  ctx.restore();
  text(label, b.x + b.w/2, b.y + b.h/2 + dy - (o.sub ? 9 : 0), {
    size: o.size || 26, color: o.color || '#fdf6e8', family: o.family || 'Lalezar',
  });
  if (o.sub) text(o.sub, b.x + b.w/2, b.y + b.h/2 + dy + 17,
    { size: 14, color: o.subColor || 'rgba(255,255,255,.88)' });
}

/** دکمهٔ گرد کوچک (مثل + و −). */
function roundButton(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 2 : 0;
  withShadow(10, hot ? 3 : 5, .3, () => {
    ctx.fillStyle = o.disabled ? '#cbbba3' : (hot ? (o.hotFill || o.fill) : o.fill);
    wobbleCircle(b.x, b.y + dy, b.r, b.x, 1.4);
    ctx.fill();
  });
  text(label, b.x, b.y + dy - 1,
    { size: o.size || 32, color: o.disabled ? '#a8988a' : (o.color || '#fdf6e8'), family: 'Lalezar' });
}

/** پرده‌ی تمام‌صفحه: برای شروعِ پرده و برای جشنِ پایان. */
function overlay(o) {
  const k = easeOut(clamp(o.t / .5, 0, 1));
  ctx.fillStyle = `rgba(30, 22, 16, ${.66 * k})`;
  ctx.fillRect(0, 0, SW, SH);

  const w = o.w || 700, h = o.h || 290;
  const x = (SW - w) / 2, y = o.y || (SH * .22);
  const s = lerp(.9, 1, easeBack(clamp(o.t / .65, 0, 1)));
  ctx.save();
  ctx.translate(SW/2, y + h/2);
  ctx.scale(s, s);
  ctx.translate(-SW/2, -(y + h/2));

  withShadow(30, 14, .42, () => {
    ctx.fillStyle = o.paper || '#fbf3e2';
    wobbleRect(x, y, w, h, 18, 121, 2.4);
    ctx.fill();
  });
  ctx.fillStyle = o.band || '#c8434f';
  wobbleRect(x, y, w, 12, 6, 123, 1);
  ctx.fill();

  if (o.icon) o.icon(SW/2, y + 56);
  text(o.title, SW/2, y + (o.icon ? 108 : 62),
    { size: o.titleSize || 36, color: o.ink || '#43291b', family: 'Lalezar', alpha: k });
  textWrap(o.body, SW/2, y + (o.icon ? 158 : 116), w - 90,
    { size: 19, color: o.inkSoft || '#8a6a52', alpha: k });
  ctx.restore();

  button(o.btn, o.btnLabel, { hot: o.btnHot, fill: o.btnFill || '#7fa356', hotFill: o.btnHotFill || '#8fb45f', size: 28 });
}

/** پیامِ کوتاهِ بالای صحنه. */
class Toast {
  constructor() { this.msg = null; this.t = 0; this.kind = 'info'; }
  say(msg, kind = 'info') { this.msg = msg; this.kind = kind; this.t = 2.6; }
  step(dt) { if (this.t > 0) { this.t -= dt; if (this.t <= 0) this.msg = null; } }
  draw(y = 24, colors = {}) {
    if (!this.msg) return;
    const k = clamp(this.t, 0, 1) * clamp((2.6 - this.t) * 5, 0, 1);
    ctx.save();
    ctx.globalAlpha = k;
    ctx.font = `700 19px "Vazirmatn", Tahoma, sans-serif`;
    const w = ctx.measureText(this.msg).width + 76;
    const fill = this.kind === 'good' ? (colors.good || '#7fa356')
               : this.kind === 'bad' ? (colors.bad || '#c8434f')
               : (colors.info || '#fbf3e2');
    paper(SW/2 - w/2, y, w, 48, fill, 151, 12, .3);
    text(this.msg, SW/2, y + 25,
      { size: 19, color: this.kind === 'info' ? (colors.ink || '#43291b') : '#fff8ec' });
    ctx.restore();
  }
}

/* ───────── آموزشِ پرده‌ای ─────────
   پرده‌هایی که منتظرِ کارِ بچه نیستند با یک ضربه جلو می‌روند. تایمر فقط
   پشتیبان است؛ بچهٔ کلاس سومی باید فرصتِ خواندن داشته باشد، نه اینکه
   متن قبل از تمام شدنِ خواندنش برود.                                    */

/** اگر پردهٔ فعلی خواندنی است، ضربه را می‌خورد و می‌رود پردهٔ بعد. */
function tutTap(tut, tapSteps, lastStep) {
  if (!tut.on || tapSteps.indexOf(tut.step) < 0) return false;
  if (tut.step >= lastStep) tut.on = false;
  else { tut.step++; tut.t = 0; }
  sfx.tap();
  return true;
}

/** نشانهٔ «برای ادامه بزن» — زیرِ کارتِ آموزش. */
function tutMore(cx, y, t, ink = '#3a2a18', bg = 'rgba(255, 250, 238, .94)') {
  ctx.save();
  ctx.globalAlpha = .62 + .38 * Math.sin(t * 3.2);
  ctx.font = '700 15px "Vazirmatn", Tahoma, sans-serif';
  const label = 'برای ادامه، هرجا را بزن';
  const w = ctx.measureText(label).width + 40, h = 32, x = cx - w / 2, r = 16;
  withShadow(10, 4, .3, () => {
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath(); ctx.fill();
  });
  text(label, cx, y + h / 2, { size: 15, color: ink });
  ctx.restore();
}

/** فونت‌ها را می‌آورد و بعد بازی را شروع می‌کند.
    مهم: هر دو راه (رسیدنِ فونت و مهلتِ پشتیبان) ممکن است برسند، ولی
    شروع فقط باید یک بار انجام شود؛ وگرنه دو حلقهٔ فریم راه می‌افتد و
    بازی دوبرابر سریع می‌شود. */
function whenFontsReady(start) {
  let done = false;
  const go = () => { if (done) return; done = true; start(); };
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('400 40px Lalezar'),
      document.fonts.load('700 20px Vazirmatn'),
      document.fonts.load('900 20px Vazirmatn'),
    ]).then(go, go);
    setTimeout(go, 2600);
  } else go();
}

/** حلقهٔ فریم با dtِ محدودشده. */
/* ───────── کیفیتِ خودکار ─────────
   اگر دستگاه کُند بود، اوّل درخشش و بعد رنگ‌بندی خاموش می‌شود تا بازی
   روان بماند. روی دستگاهِ قوی همه‌چیز روشن است. */
let QUALITY = 2;
let _fAcc = 0, _fN = 0, _qHold = 0;

function _qualityTick(gap) {
  if (gap <= 0 || gap > 200) return;
  _fAcc += gap; _fN++;
  if (_fN < 45) return;
  const avg = _fAcc / _fN;
  _fAcc = 0; _fN = 0;
  if (_qHold > 0) { _qHold--; return; }
  /* فاصلهٔ بالا و پایین باید باز باشد، وگرنه کیفیت بین دو پله بالا و
     پایین می‌پرد و بازی مدام تغییرِ ظاهر می‌دهد. */
  const before = QUALITY;
  if (avg > 21 && QUALITY > 0) { QUALITY--; _qHold = 4; }
  else if (avg < 13.5 && QUALITY < 2) { QUALITY++; _qHold = 10; }
  /* در پایین‌ترین کیفیت، صحنه را با نقطه‌های کمتر می‌کشیم */
  if (before !== QUALITY && (before === 0 || QUALITY === 0) && _refit) _refit();
}

/* یک حلقه، نه بیشتر — دو حلقه یعنی زمانِ بازی دوبرابر می‌گذرد.

   MOTION: تا پیش از این، به‌خاطرِ باگِ دو حلقه، همهٔ بازی‌ها عملاً با
   سرعتِ دو برابر اجرا می‌شدند و زمان‌بندی‌ها هم با همان حس تنظیم شده
   بودند. حالا که باگ رفع شده، سرعتِ درست (یک برابر) کُند به نظر
   می‌رسد. این ضریب جانِ حرکت‌ها را برمی‌گرداند، ولی نه تا آن دو برابرِ
   تصادفی. فقط روی جانِ حرکت اثر دارد، نه روی هیچ قانونِ علمی. */
const MOTION = 1.45;
let _looping = false;
function runLoop(step) {
  if (_looping) return;
  _looping = true;
  let last = performance.now();
  const frame = (now) => {
    const gap = now - last;
    /* بریدنِ بعد از ضرب، تا یک فریمِ کُند پرشِ بزرگ نسازد */
    const dt = Math.min(gap / 1000 * MOTION, 1/15);
    last = now;
    _qualityTick(gap);
    step(dt);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

/* ═════════════════ بازی ═════════════════ */
/* ═══════════════════════════════════════════════════════════════════════
   ریسهٔ جشن — ریاضی سوم، فصل ۳، درس ۴ (تساوی کسرها)
   ───────────────────────────────────────────────────────────────────────
   فعّالیتِ خودِ کتاب این است: یک مربّع را تا می‌زنی و یک قسمتش را رنگ
   می‌کنی؛ دوباره تا می‌زنی و می‌بینی همان رنگ حالا اسمِ تازه‌ای دارد.
   ۱/۴ می‌شود ۲/۸ می‌شود ۴/۱۶، بی‌آنکه ذرّه‌ای رنگ اضافه شده باشد.

   قانونِ فیزیکیِ بازی همین است:

     تا زدن مجّانی است، رنگ زدن نیست.

   قلم‌مو شمرده است. سفارشِ «۶ از ۸» را اگر بخواهی خانه‌به‌خانه رنگ کنی،
   شش بار قلم می‌خواهد و قلم‌هایت کم می‌آید. ولی اگر کاغذ را چهار قسمت
   کنی و سه‌تا را رنگ بزنی و بعد یک بار تا بزنی، با سه قلم همان می‌شود.
   بچه مجبور است کشف کند که ۳/۴ و ۶/۸ یک چیزند — چون راهِ دیگری ندارد.

   تای دوتایی و تای سه‌تایی هر دو هست، پس مخرج‌های ۲ و ۳ و ۴ و ۶ و ۸ و ۹
   و ۱۲ و ۱۶ و ۱۸ همه در دسترس‌اند. «باز کن» هم هست، ولی فقط وقتی رنگ‌ها
   دقیقاً سرِ جای تاها باشند — چون کاغذِ نصفه‌رنگ باز نمی‌شود.
   ═══════════════════════════════════════════════════════════════════════ */

const SCENE_W = 1200, SCENE_H = 760;
const MAXD = 24;                       // ریزتر از این، کاغذ پاره می‌شود

const P = {
  wallHi:   '#3b2740',
  wallLo:   '#1b1220',
  glow:     'rgba(255, 196, 120, .18)',
  table:    '#7c5136',
  tableLit: '#9b6742',
  tableDk:  '#553520',
  paper:    '#fbf3e0',
  paperDk:  '#e3d6bc',
  paperEdge:'#cbbb9a',
  fold:     '#c9b795',
  ink:      '#2e2434',
  inkSoft:  '#7d7089',
  dye:      '#d8455f',
  dyeDk:    '#a92c45',
  dyeLit:   '#ea6a80',
  pot:      '#3f7fa0',
  potDk:    '#2b5c78',
  brass:    '#d9a840',
  brassDk:  '#a2761f',
  string:   '#8a7358',
  flag:     ['#e05b6a', '#e8a33e', '#5aa36e', '#4f8fc0', '#a86bbe'],
  good:     '#6fa85c',
  bad:      '#cf5f4a',
  gold:     '#f0c552',
  lamp:     '#ffd98a',
};

/* ───────── سفارش‌ها ─────────
   هر سفارش با قلم‌موی کم عمداً «بدونِ تا زدن» نشدنی است.            */

const LEVELS = [
  { n: 2, d: 4, brush: 2,
    hint: 'اوّل کاغذ را تا بزن تا به قسمت‌های مساوی تقسیم شود، بعد رنگ بزن.' },
  { n: 6, d: 8, brush: 4,
    hint: 'شش خانه با چهار قلم‌مو؟ راهِ کوتاه‌تری هست.' },
  { n: 4, d: 16, brush: 2,
    hint: 'دو قلم‌مو بیشتر نداری.' },
  { n: 9, d: 12, brush: 4,
    hint: 'تای سه‌تایی هم داری؛ یادت نرود.' },
  { n: 8, d: 18, brush: 5,
    hint: 'هجده قسمت! ولی لازم نیست از اوّل هجده‌تا کنی.' },
  { endless: true, brush: 0,
    hint: 'سفارش‌ها پشتِ سرِ هم می‌آیند. هر چه ریسه بلندتر، امتیاز بیشتر.' },
];

/* ───────── وضعیت ───────── */

const S = {
  phase: 'intro',
  level: 0,
  d: 1,
  paint: [false],
  used: 0,               // قلم‌موهای خرج‌شده
  brush: 0,              // سقفِ قلم‌مو
  target: { n: 1, d: 1 },
  hearts: 3,
  score: 0, best: 0,
  done: [],              // پرچم‌های آویزان‌شده
  anim: null,            // انیمیشنِ تا/باز
  winT: 0,
  t: 0, phaseT: 0,
  hover: null,
  shake: 0,
  motes: [],
  floats: [],
  tut: { on: true, step: 0, t: 0 },
};

const bits = new Bits();
const toast = new Toast();
const L = () => LEVELS[S.level];
const painted = () => S.paint.reduce((a, b) => a + (b ? 1 : 0), 0);
const brushLeft = () => S.brush - S.used;

function loadBest() { try { return +localStorage.getItem('rise-best') || 0; } catch { return 0; } }
function saveBest(v) { try { localStorage.setItem('rise-best', String(v)); } catch { /* حالت خصوصی */ } }

/* ───────── چیدمان ───────── */

const HUD_H = 52;
const LINE_Y = 128;                                  // ریسهٔ پرچم‌ها
const CARD = { x: 34, y: 214, w: 244, h: 210 };      // سفارش
const STRIP = { x: 316, y: 306, w: 836, h: 156 };    // کاغذ
const BTN_F2 = { x: 316, y: 566, w: 196, h: 68 };
const BTN_F3 = { x: 528, y: 566, w: 196, h: 68 };
const BTN_UN = { x: 740, y: 566, w: 196, h: 68 };
const BTN_RESET = { x: 956, y: 572, w: 196, h: 56 };
const POT = { x: 34, y: 470, w: 244, h: 172 };       // قلم‌موها
const BTN_GO = { x: 470, y: 566, w: 260, h: 76 };

function cellBox(i) {
  const w = STRIP.w / S.d;
  return { x: STRIP.x + i * w, y: STRIP.y, w, h: STRIP.h };
}

/* ───────── حلقه ───────── */

const cv = document.getElementById('stage');
initStage(cv, SCENE_W, SCENE_H);
S.best = loadBest();
for (let i = 0; i < 22; i++) {
  S.motes.push({ x: Math.random() * SCENE_W, y: Math.random() * SCENE_H,
                 ph: Math.random() * TAU, sp: .2 + Math.random() * .5, r: .9 + Math.random() * 1.8 });
}
whenFontsReady(() => runLoop(step));

/** سفارشِ تصادفیِ حالتِ آزاد: یک کسرِ ساده، ضرب‌شده در ۲ یا ۳ یا ۴. */
function randomTarget() {
  const bases = [[1, 2], [1, 3], [2, 3], [1, 4], [3, 4], [1, 6], [5, 6]];
  for (let tries = 0; tries < 40; tries++) {
    const [a, b] = bases[Math.floor(Math.random() * bases.length)];
    const m = [2, 3, 4][Math.floor(Math.random() * 3)];
    if (b * m <= MAXD) return { n: a * m, d: b * m, brush: a + 1 };
  }
  return { n: 2, d: 4, brush: 2 };
}

function startLevel(i, keep) {
  const lv = LEVELS[i];
  S.level = i;
  const t = lv.endless ? randomTarget() : { n: lv.n, d: lv.d, brush: lv.brush };
  S.target = { n: t.n, d: t.d };
  S.brush = t.brush;
  resetPaper();
  if (!keep) { S.hearts = 3; S.done = []; }
  S.phase = 'play'; S.phaseT = 0; S.winT = 0;
  S.tut.on = i === 0 && !keep; S.tut.step = 0; S.tut.t = 0;
  toast.say(lv.hint, 'info');
}

function resetPaper() {
  S.d = 1;
  S.paint = [false];
  S.used = 0;
  S.anim = null;
}

function floatText(x, y, txt, col, size) { S.floats.push({ x, y, txt, col, t: 0, size: size || 24 }); }

function step(dt) {
  S.t += dt; S.phaseT += dt;
  if (S.shake > 0) S.shake -= dt;
  if (S.anim) { S.anim.t += dt * 2.6; if (S.anim.t >= 1) S.anim = null; }
  if (S.winT > 0) {
    S.winT -= dt;
    if (S.winT <= 0) finishOrder();
  }
  for (const m of S.motes) {
    m.ph += dt * m.sp; m.y -= dt * (6 + m.sp * 12); m.x += Math.sin(m.ph) * dt * 10;
    if (m.y < -10) { m.y = SCENE_H + 10; m.x = Math.random() * SCENE_W; }
  }
  for (const f of S.floats) { f.t += dt; f.y -= 42 * dt; }
  S.floats = S.floats.filter((f) => f.t < 1.5);
  if (S.phase === 'play' && S.tut.on) tutStep(dt);
  bits.step(dt);
  toast.step(dt);
  draw();
}

/* ───────── تا زدن و رنگ زدن ─────────
   تا مجّانی است و رنگ نیست؛ همین یک نابرابری، کلِ درس را می‌سازد.     */

function fold(k) {
  if (S.phase !== 'play' || S.winT > 0) return;
  if (S.d * k > MAXD) {
    S.shake = .2; sfx.nope();
    toast.say('ریزتر از این، کاغذ پاره می‌شود', 'bad');
    return;
  }
  const next = [];
  for (const on of S.paint) for (let j = 0; j < k; j++) next.push(on);
  S.paint = next;
  S.d *= k;
  S.anim = { t: 0, k, dir: 1 };
  sfx.slide();
  checkWin();
}

/** باز کردن فقط وقتی می‌شود که رنگ‌ها سرِ جای تاها باشند. */
function canUnfold(k) {
  if (S.d % k !== 0) return false;
  for (let i = 0; i < S.d; i += k) {
    for (let j = 1; j < k; j++) if (S.paint[i + j] !== S.paint[i]) return false;
  }
  return true;
}

function unfold() {
  if (S.phase !== 'play' || S.winT > 0) return;
  const k = [2, 3].find((q) => canUnfold(q));
  if (!k) {
    S.shake = .2; sfx.nope();
    toast.say('رنگ‌ها سرِ جای تا نیستند؛ باز نمی‌شود', 'bad');
    return;
  }
  const next = [];
  for (let i = 0; i < S.d; i += k) next.push(S.paint[i]);
  S.paint = next;
  S.d /= k;
  S.anim = { t: 0, k, dir: -1 };
  sfx.slide();
  checkWin();
}

function toggle(i) {
  if (S.phase !== 'play' || S.winT > 0) return;
  if (i < 0 || i >= S.d) return;
  if (S.paint[i]) {                    // پاک کردن مجّانی است، ولی قلمِ خرج‌شده برنمی‌گردد
    S.paint[i] = false;
    sfx.tap();
    return;
  }
  if (brushLeft() <= 0) {
    S.shake = .24; sfx.nope();
    toast.say('قلم‌مو تمام شد. با «از نو» دوباره شروع کن', 'bad');
    return;
  }
  S.paint[i] = true;
  S.used++;
  const c = cellBox(i);
  bits.add(c.x + c.w / 2, c.y + c.h / 2, 10, 'dot', [P.dyeLit, P.dye, '#fff'],
    { speed: 130, lift: 40, size: 3.4, life: .6 });
  sfx.place();
  checkWin();
}

function checkWin() {
  if (S.d === S.target.d && painted() === S.target.n) {
    S.winT = .55;
    sfx.good();
  }
}

function finishOrder() {
  const left = brushLeft();
  const pts = 300 + left * 120;
  S.score += pts;
  if (S.score > S.best) { S.best = S.score; saveBest(S.best); }
  S.done.push({ n: S.target.n, d: S.target.d, col: P.flag[S.done.length % P.flag.length] });
  floatText(STRIP.x + STRIP.w / 2, STRIP.y - 30, `+${fa(pts)}`, P.gold);
  bits.confetti(STRIP.x + STRIP.w / 2, STRIP.y + 40, 60, [P.gold, P.dyeLit, ...P.flag]);
  sfx.win();
  S.phase = 'won'; S.phaseT = 0;
}

function giveUp() {
  if (S.phase !== 'play') return;
  S.hearts--;
  S.shake = .3;
  sfx.nope();
  if (S.hearts <= 0) { S.phase = 'lost'; S.phaseT = 0; return; }
  resetPaper();
  toast.say('کاغذِ تازه — یک دل کم شد', 'bad');
}

/* ───────── آموزش ───────── */

const TUT_TAP = [0, 2], TUT_LAST = 2;      // پرده‌های خواندنی

function tutStep(dt) {
  S.tut.t += dt;
  if (S.tut.step === 0 && S.tut.t > 30) { S.tut.step = 1; S.tut.t = 0; }
  if (S.tut.step === 1 && S.d > 1) { S.tut.step = 2; S.tut.t = 0; }
  if (S.tut.step === 2 && S.tut.t > 30) S.tut.on = false;
}

/* ───────── ورودی ───────── */

function hitTest(p) {
  if (S.phase !== 'play') return inRect(p, BTN_GO) ? BTN_GO : null;
  if (inRect(p, BTN_F2)) return BTN_F2;
  if (inRect(p, BTN_F3)) return BTN_F3;
  if (inRect(p, BTN_UN)) return BTN_UN;
  if (inRect(p, BTN_RESET)) return BTN_RESET;
  for (let i = 0; i < S.d; i++) if (inRect(p, cellBox(i))) return { cell: i };
  return null;
}

cv.addEventListener('pointermove', (e) => {
  S.hover = hitTest(toStage(e));
  cv.style.cursor = S.hover ? 'pointer' : 'default';
});
cv.addEventListener('pointerleave', () => { S.hover = null; });
cv.addEventListener('pointerdown', (e) => {
  if (S.phase === 'play' && tutTap(S.tut, TUT_TAP, TUT_LAST)) return;
  const h = hitTest(toStage(e));
  if (S.phase === 'intro') { if (h) startLevel(0); return; }
  if (S.phase === 'won') {
    if (!h) return;
    if (L().endless) startLevel(S.level, true);
    else if (S.level + 1 < LEVELS.length) startLevel(S.level + 1, true);
    else { S.score = 0; startLevel(0); }
    return;
  }
  if (S.phase === 'lost') { if (h) { S.score = 0; startLevel(S.level); } return; }
  if (!h) return;
  if (h === BTN_F2) return fold(2);
  if (h === BTN_F3) return fold(3);
  if (h === BTN_UN) return unfold();
  if (h === BTN_RESET) return giveUp();
  if (h.cell !== undefined) return toggle(h.cell);
});

/* ───────── ابزارِ نقاشی ───────── */

function rrPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function numText(str, x, y, o = {}) {
  ctx.save();
  ctx.font = `${o.family === 'Vazirmatn' ? (o.weight || 700) : '400'} ${o.size || 20}px "${o.family || 'Lalezar'}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  ctx.direction = 'ltr';
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.fillStyle = o.color || P.ink;
  ctx.fillText(str, x, y);
  ctx.restore();
}

/** کسرِ دوطبقه، همان‌طور که در کتاب نوشته می‌شود. */
function frac(cx, cy, n, d, size, color) {
  numText(fa(n), cx, cy - size * .42, { size, color });
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = Math.max(2.4, size * .07);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - size * .42, cy);
  ctx.lineTo(cx + size * .42, cy);
  ctx.stroke();
  ctx.restore();
  numText(fa(d), cx, cy + size * .5, { size, color });
}

function spot(rects, alpha) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, SCENE_W, SCENE_H);
  for (const r of rects) rrPath(r.x - 12, r.y - 12, r.w + 24, r.h + 24, 22);
  ctx.fillStyle = `rgba(14, 8, 18, ${alpha})`;
  ctx.fill('evenodd');
  ctx.restore();
}

function pointHand(x, y) {
  const bob = Math.sin(S.t * 3.4) * 8;
  ctx.save();
  ctx.translate(x, y + bob);
  withShadow(12, 5, .4, () => {
    ctx.fillStyle = '#f6dfc0';
    ctx.beginPath();
    ctx.moveTo(0, -6);
    ctx.quadraticCurveTo(-9, -2, -10, 16);
    ctx.quadraticCurveTo(-11, 34, 0, 36);
    ctx.quadraticCurveTo(11, 34, 10, 16);
    ctx.quadraticCurveTo(9, -2, 0, -6);
    ctx.closePath(); ctx.fill();
    wobbleCircle(0, -12, 8, 4, 1); ctx.fill();
  }, '20, 10, 26');
  ctx.strokeStyle = '#c9a982'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-7, 18); ctx.lineTo(7, 18); ctx.stroke();
  ctx.restore();
}

/* ───────── صحنه ───────── */

function draw() {
  beginScene('#221626');
  ctx.save();
  if (S.shake > 0) {
    const k = S.shake * 13;
    ctx.translate(Math.sin(S.t * 58) * k, Math.cos(S.t * 45) * k * .5);
  }

  drawRoom();
  drawGarland();
  drawTable();
  drawStrip();
  drawNow();
  ctx.restore();

  drawCard();
  drawPot();
  drawButtons();
  bits.draw();
  drawFloats();
  drawHUD();
  if (!(S.phase === 'play' && S.tut.on)) {
    toast.draw(HUD_H + 8, { good: P.good, bad: P.bad, info: P.paper, ink: P.ink });
  }

  if (S.phase === 'play' && S.tut.on) drawTutorial();
  if (S.phase === 'intro') drawIntro();
  if (S.phase === 'won') drawWon();
  if (S.phase === 'lost') drawLost();

  endScene(.12, 'rgba(14, 6, 20, .48)');
}

function drawRoom() {
  const g = ctx.createLinearGradient(200, 80, 1000, 760);
  g.addColorStop(0, P.wallHi);
  g.addColorStop(1, P.wallLo);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, SCENE_W, SCENE_H);

  /* کاغذدیواریِ گل‌دار، خیلی کم‌رنگ */
  ctx.save();
  ctx.globalAlpha = .05;
  ctx.fillStyle = '#ffe6c8';
  for (let r = 0; r < 9; r++) for (let c = 0; c < 12; c++) {
    const x = c * 104 + (r % 2 ? 52 : 0), y = 40 + r * 92;
    for (let k = 0; k < 5; k++) {
      const a = k / 5 * TAU;
      wobbleCircle(x + Math.cos(a) * 12, y + Math.sin(a) * 12, 7, r * 3 + k, .8);
      ctx.fill();
    }
  }
  ctx.restore();

  /* چراغ‌های ریسه‌ای — حالِ جشن */
  const gl = ctx.createRadialGradient(600, 150, 30, 600, 150, 620);
  gl.addColorStop(0, P.glow);
  gl.addColorStop(1, 'rgba(255, 196, 120, 0)');
  ctx.fillStyle = gl;
  ctx.fillRect(0, 0, SCENE_W, SCENE_H);

  ctx.save();
  for (const m of S.motes) {
    ctx.globalAlpha = .06 + .1 * (.5 + .5 * Math.sin(m.ph * 2));
    ctx.fillStyle = '#ffe9c4';
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

/** ریسه: هر جای خالی یک فانوس است و با هر سفارش، یک فانوس جایش را به
    پرچمِ تازه می‌دهد. پس بچه پیشرفتش را روی دیوار می‌بیند.            */
function drawGarland() {
  const SLOTS = 9, sag = 26;
  ctx.strokeStyle = P.string; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-10, LINE_Y - 16);
  ctx.quadraticCurveTo(SCENE_W / 2, LINE_Y + sag, SCENE_W + 10, LINE_Y - 16);
  ctx.stroke();

  const flags = S.done.slice(-SLOTS);
  for (let i = 0; i < SLOTS; i++) {
    const t = (i + .5) / SLOTS;
    const x = lerp(52, SCENE_W - 52, t);
    const y = LINE_Y - 16 + 2 * sag * t * (1 - t) * 2;
    const sw = Math.sin(S.t * 1.2 + i * 1.3) * .055;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(sw);
    if (i < flags.length) {
      const f = flags[i];
      withShadow(10, 5, .3, () => {
        ctx.fillStyle = f.col;
        ctx.beginPath();
        ctx.moveTo(-27, 0); ctx.lineTo(27, 0); ctx.lineTo(0, 62);
        ctx.closePath(); ctx.fill();
      }, '20, 10, 26');
      ctx.fillStyle = 'rgba(255,255,255,.2)';
      ctx.beginPath();
      ctx.moveTo(-27, 0); ctx.lineTo(0, 0); ctx.lineTo(0, 62);
      ctx.closePath(); ctx.fill();
      frac(0, 24, f.n, f.d, 17, '#fff6e6');
    } else {
      const col = P.flag[(i + 2) % P.flag.length];
      ctx.strokeStyle = P.string; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 16); ctx.stroke();
      const gl2 = ctx.createRadialGradient(0, 42, 4, 0, 42, 58);
      gl2.addColorStop(0, 'rgba(255, 217, 138, .28)');
      gl2.addColorStop(1, 'rgba(255, 217, 138, 0)');
      ctx.fillStyle = gl2;
      ctx.fillRect(-58, -16, 116, 116);
      ctx.fillStyle = col;
      wobbleEllipse(0, 42, 21, 25, 0, i * 3 + 1, 1.5); ctx.fill();
      ctx.fillStyle = 'rgba(255, 240, 200, .32)';
      wobbleEllipse(-6, 36, 7, 11, 0, i * 3 + 2, 1); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.13)'; ctx.lineWidth = 1.5;
      for (const k of [0, 1]) {
        ctx.beginPath();
        ctx.ellipse(0, 42, 21 * (1 - k * .55), 25, 0, 0, TAU);
        ctx.stroke();
      }
      ctx.fillStyle = col;
      wobbleRect(-8, 16, 16, 7, 3, i * 3 + 3, .7); ctx.fill();
    }
    ctx.restore();
  }
}

function drawTable() {
  ctx.fillStyle = P.tableDk;
  wobbleRect(0, 660, SCENE_W, 100, 0, 21, 1.6); ctx.fill();
  ctx.fillStyle = P.table;
  wobbleRect(0, 648, SCENE_W, 22, 0, 23, 1.4); ctx.fill();
  ctx.fillStyle = P.tableLit;
  wobbleRect(0, 646, SCENE_W, 7, 0, 25, .8); ctx.fill();
  ctx.save();
  ctx.globalAlpha = .18;
  ctx.strokeStyle = P.tableDk; ctx.lineWidth = 2;
  for (let i = 0; i < 8; i++) {
    const y = 676 + i * 11;
    ctx.beginPath();
    ctx.moveTo(0, y);
    for (let x = 0; x <= SCENE_W; x += 40) ctx.lineTo(x, y + Math.sin(x * .02 + i) * 2);
    ctx.stroke();
  }
  ctx.restore();

  /* قیچی و تکّه‌کاغذها روی میز */
  ctx.save();
  ctx.translate(1052, 700);
  ctx.rotate(-.2);
  ctx.strokeStyle = '#8f98a2'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-40, -8); ctx.lineTo(28, 8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-40, 8); ctx.lineTo(28, -8); ctx.stroke();
  ctx.strokeStyle = '#c0563f'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.arc(38, 14, 11, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.arc(38, -14, 11, 0, TAU); ctx.stroke();
  ctx.restore();
  for (const sc of [{ x: 120, y: 706, r: -.4 }, { x: 176, y: 722, r: .3 }, { x: 250, y: 700, r: .1 }]) {
    ctx.save();
    ctx.translate(sc.x, sc.y);
    ctx.rotate(sc.r);
    ctx.fillStyle = P.flag[(sc.x | 0) % P.flag.length];
    wobbleRect(-18, -8, 36, 16, 2, sc.x, 1.2); ctx.fill();
    ctx.restore();
  }
}

/* ───────── کاغذ ───────── */

function drawStrip() {
  const sc = S.anim ? lerp(1 / S.anim.k, 1, easeOut(S.anim.t)) : 1;
  const cx = STRIP.x + STRIP.w / 2;
  const win = S.winT > 0 ? 1 : 0;

  ctx.save();
  ctx.translate(cx, 0);
  ctx.scale(sc, 1);
  ctx.translate(-cx, 0);

  /* سایه روی میز */
  ctx.save();
  ctx.globalAlpha = .34;
  ctx.fillStyle = '#100a14';
  wobbleRect(STRIP.x + 8, STRIP.y + 12, STRIP.w, STRIP.h, 6, 31, 2); ctx.fill();
  ctx.restore();

  /* کاغذ */
  ctx.fillStyle = P.paper;
  wobbleRect(STRIP.x, STRIP.y, STRIP.w, STRIP.h, 6, 33, 2); ctx.fill();

  /* خانه‌های رنگ‌شده */
  const w = STRIP.w / S.d;
  for (let i = 0; i < S.d; i++) {
    if (!S.paint[i]) continue;
    const x = STRIP.x + i * w;
    ctx.fillStyle = P.dye;
    wobbleRect(x + 1.5, STRIP.y + 2, w - 3, STRIP.h - 4, 3, x + i, 1.6); ctx.fill();
    ctx.fillStyle = P.dyeLit;
    wobbleRect(x + 1.5, STRIP.y + 2, w - 3, 10, 2, x + i + 1, 1); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.12)';
    wobbleRect(x + 1.5, STRIP.y + STRIP.h - 14, w - 3, 12, 2, x + i + 2, 1); ctx.fill();
  }

  /* خطِ تاها — دو خط با یک روشنیِ نازک، مثل کاغذِ تاخورده */
  for (let i = 1; i < S.d; i++) {
    const x = STRIP.x + i * w;
    ctx.strokeStyle = 'rgba(90, 70, 40, .32)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, STRIP.y + 3); ctx.lineTo(x, STRIP.y + STRIP.h - 3); ctx.stroke();
    ctx.strokeStyle = 'rgba(255, 250, 230, .5)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(x + 2, STRIP.y + 3); ctx.lineTo(x + 2, STRIP.y + STRIP.h - 3); ctx.stroke();
  }

  /* لبهٔ کاغذ */
  ctx.strokeStyle = P.paperEdge; ctx.lineWidth = 3;
  ctx.beginPath(); rrPath(STRIP.x, STRIP.y, STRIP.w, STRIP.h, 6); ctx.stroke();

  /* خانه‌ای که انگشت رویش است */
  if (S.hover && S.hover.cell !== undefined && S.hover.cell < S.d && S.phase === 'play') {
    const c = cellBox(S.hover.cell);
    ctx.save();
    ctx.globalAlpha = .3;
    ctx.fillStyle = S.paint[S.hover.cell] ? '#fff' : P.dyeLit;
    wobbleRect(c.x + 2, c.y + 2, c.w - 4, c.h - 4, 3, c.x, 1.4); ctx.fill();
    ctx.restore();
  }

  if (win) {
    ctx.save();
    ctx.globalAlpha = .5 + .3 * Math.sin(S.t * 12);
    ctx.strokeStyle = P.gold; ctx.lineWidth = 6;
    ctx.beginPath(); rrPath(STRIP.x - 6, STRIP.y - 6, STRIP.w + 12, STRIP.h + 12, 10); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

/** کسرِ فعلیِ کاغذ، درست زیرِ خودش. */
function drawNow() {
  const cx = STRIP.x + STRIP.w / 2;
  text('الان کاغذِ تو', cx + 78, STRIP.y + STRIP.h + 44, { size: 17, color: 'rgba(251, 243, 224, .68)' });
  frac(cx - 22, STRIP.y + STRIP.h + 46, painted(), S.d, 34, '#fbf3e0');
}

/* ───────── کارتِ سفارش و قلم‌موها ───────── */

function drawCard() {
  const b = CARD;
  withShadow(20, 9, .4, () => {
    ctx.fillStyle = P.paper;
    wobbleRect(b.x, b.y, b.w, b.h, 14, 41, 2); ctx.fill();
  }, '20, 10, 26');
  ctx.fillStyle = P.dye;
  wobbleRect(b.x, b.y, b.w, 11, 5, 43, .8); ctx.fill();
  text('سفارش', b.x + b.w / 2, b.y + 38, { size: 23, family: 'Lalezar', color: P.inkSoft });
  frac(b.x + b.w / 2, b.y + 106, S.target.n, S.target.d, 56, P.ink);
  text(`${fa(S.target.n)} خانه از ${fa(S.target.d)} خانه رنگی`, b.x + b.w / 2, b.y + 172,
    { size: 15, color: P.inkSoft });
}

function drawPot() {
  const b = POT;
  withShadow(18, 8, .38, () => {
    ctx.fillStyle = P.paper;
    wobbleRect(b.x, b.y, b.w, b.h, 14, 51, 2); ctx.fill();
  }, '20, 10, 26');
  ctx.fillStyle = P.pot;
  wobbleRect(b.x, b.y, b.w, 11, 5, 53, .8); ctx.fill();
  text('قلم‌موها', b.x + b.w / 2, b.y + 36, { size: 20, family: 'Lalezar', color: P.inkSoft });

  const n = S.brush, left = brushLeft();
  const jx = b.x + b.w / 2, jy = b.y + 152;
  /* لیوانِ قلم‌مو */
  ctx.fillStyle = P.potDk;
  wobbleRect(jx - 44, jy - 40, 88, 46, 8, 55, 1.2); ctx.fill();
  const step = Math.min(26, 150 / Math.max(1, n));
  for (let i = 0; i < n; i++) {
    const alive = i < left;
    const x = jx - (n - 1) * step / 2 + i * step;
    const tilt = (i - (n - 1) / 2) * .06;
    ctx.save();
    ctx.translate(x, jy - 30);
    ctx.rotate(tilt);
    ctx.globalAlpha = alive ? 1 : .22;
    ctx.strokeStyle = '#b08050'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 4); ctx.lineTo(0, -52); ctx.stroke();
    ctx.fillStyle = alive ? P.dye : '#9a8f80';
    ctx.beginPath();
    ctx.moveTo(-5, -52); ctx.lineTo(5, -52); ctx.lineTo(0, -70);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = P.pot;
  wobbleRect(jx - 44, jy - 22, 88, 28, 6, 57, 1); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.2)';
  wobbleRect(jx - 38, jy - 18, 18, 20, 4, 59, .8); ctx.fill();
  text(`${fa(left)} از ${fa(n)} مانده`, b.x + b.w / 2, b.y + 62,
    { size: 15, color: left > 0 ? P.inkSoft : P.bad });
}

function drawButtons() {
  const dis = S.phase !== 'play';
  button(BTN_F2, 'تای دوتایی', {
    hot: S.hover === BTN_F2, disabled: dis || S.d * 2 > MAXD,
    fill: '#3f7fa0', hotFill: '#4c92b5', size: 24,
  });
  button(BTN_F3, 'تای سه‌تایی', {
    hot: S.hover === BTN_F3, disabled: dis || S.d * 3 > MAXD,
    fill: '#3f7fa0', hotFill: '#4c92b5', size: 24,
  });
  button(BTN_UN, 'باز کن', {
    hot: S.hover === BTN_UN, disabled: dis || S.d === 1,
    fill: '#6a5b74', hotFill: '#7d6d88', size: 24,
  });
  button(BTN_RESET, 'کاغذِ تازه', {
    hot: S.hover === BTN_RESET, disabled: S.phase !== 'play',
    fill: '#8a4a52', hotFill: '#9d5a62', size: 18, r: 12, family: 'Vazirmatn',
  });
}

function drawFloats() {
  for (const f of S.floats) {
    const k = clamp(1 - f.t / 1.5, 0, 1);
    numText(f.txt, f.x, f.y, { size: f.size, color: f.col, alpha: k });
  }
}

function drawHUD() {
  ctx.fillStyle = 'rgba(24, 14, 28, .78)';
  ctx.fillRect(0, 0, SCENE_W, HUD_H);
  ctx.fillStyle = 'rgba(217, 168, 64, .45)';
  ctx.fillRect(0, HUD_H - 3, SCENE_W, 3);

  for (let i = 0; i < 3; i++) {
    const x = SCENE_W - 32 - i * 33;
    ctx.save();
    ctx.globalAlpha = i < S.hearts ? 1 : .22;
    ctx.fillStyle = i < S.hearts ? '#d4574a' : '#5b4f63';
    ctx.translate(x, HUD_H / 2);
    const s = i < S.hearts ? 1 + Math.sin(S.t * 3 + i) * .05 : 1;
    ctx.scale(s, s);
    ctx.beginPath();
    ctx.moveTo(0, 9);
    ctx.bezierCurveTo(-14, -2, -9, -13, 0, -6);
    ctx.bezierCurveTo(9, -13, 14, -2, 0, 9);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  const nm = L().endless ? 'ریسهٔ آزاد' : `سفارشِ ${fa(S.level + 1)} از ${fa(LEVELS.length - 1)}`;
  text(nm, SCENE_W - 146, HUD_H / 2, { size: 18, family: 'Lalezar', color: '#f4e5f0', align: 'right' });
  numText(fa(S.score), 26, HUD_H / 2 - 1, { size: 26, color: P.gold, align: 'left' });
  text(`رکورد ${fa(S.best)}`, 108, HUD_H / 2, { size: 14, color: 'rgba(244, 229, 240, .58)', align: 'left' });
  if (S.done.length) {
    text(`${fa(S.done.length)} پرچم`, 216, HUD_H / 2, { size: 15, color: P.good, align: 'left' });
  }
}

/* ───────── آموزش ───────── */

function drawTutorial() {
  const st = S.tut.step;
  let holes = [], msg = '', hand = null;

  if (st === 0) {
    holes = [{ x: CARD.x - 6, y: CARD.y - 6, w: CARD.w + 12, h: CARD.h + 12 },
             { x: POT.x - 6, y: POT.y - 6, w: POT.w + 12, h: POT.h + 12 }];
    msg = 'سفارش می‌گوید چند خانه از چند خانه باید رنگی باشد. قلم‌موها شمرده‌اند.';
  } else if (st === 1) {
    holes = [{ x: BTN_F2.x - 8, y: BTN_F2.y - 8, w: BTN_F3.x + BTN_F3.w - BTN_F2.x + 16, h: BTN_F2.h + 16 }];
    msg = 'اوّل کاغذ را تا بزن تا به قسمت‌های مساوی تقسیم شود. تا زدن مجّانی است.';
    hand = { x: BTN_F2.x + BTN_F2.w / 2, y: BTN_F2.y - 62 };
  } else {
    holes = [{ x: STRIP.x - 10, y: STRIP.y - 10, w: STRIP.w + 20, h: STRIP.h + 20 }];
    msg = 'حالا روی خانه‌ها بزن تا رنگ شوند. هر رنگ یک قلم‌مو خرج می‌کند، ولی تای دوباره خرجی ندارد.';
  }

  spot(holes, .58);
  const w = 520, h = 96, x = SCENE_W / 2 - w / 2, y = 648;
  paper(x, y, w, h, P.paper, 61, 14, .45);
  ctx.fillStyle = P.dye;
  wobbleRect(x, y, 9, h, 4, 63, .8); ctx.fill();
  textWrap(msg, x + w / 2 + 6, y + h / 2 - 12, w - 54, { size: 17, color: P.ink, lineHeight: 26 });
  if (TUT_TAP.indexOf(st) >= 0) tutMore(x + w / 2, y - 46, S.t, P.ink);
  if (hand) pointHand(hand.x, hand.y);
}

/* ───────── پرده‌ها ───────── */

function flagIcon(x, y) {
  ctx.save();
  ctx.translate(x, y - 16);
  ctx.strokeStyle = P.string; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-60, 0); ctx.quadraticCurveTo(0, 14, 60, 0); ctx.stroke();
  for (let i = 0; i < 3; i++) {
    const px = -40 + i * 40, py = 4 + (i === 1 ? 8 : 3);
    ctx.fillStyle = P.flag[i];
    ctx.beginPath();
    ctx.moveTo(px - 17, py); ctx.lineTo(px + 17, py); ctx.lineTo(px, py + 38);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawIntro() {
  overlay({
    t: S.phaseT,
    w: 740, h: 344, y: 170,
    title: 'ریسهٔ جشن',
    body: 'برای هر سفارش یک پرچمِ کاغذی بساز. کاغذ را تا بزن تا خانه‌دار شود\nو خانه‌ها را رنگ کن. تا زدن مجّانی است، رنگ زدن نه.',
    btn: BTN_GO, btnHot: S.hover === BTN_GO, btnLabel: 'شروع',
    paper: P.paper, band: P.dye, ink: P.ink, inkSoft: P.inkSoft,
    btnFill: '#3f7fa0', btnHotFill: '#4c92b5',
    icon: flagIcon,
  });
}

function drawWon() {
  const last = !L().endless && S.level + 1 >= LEVELS.length;
  overlay({
    t: S.phaseT,
    w: 720, h: 320, y: 190,
    title: 'پرچم آماده شد!',
    body: brushLeft() > 0
      ? `${fa(brushLeft())} قلم‌مو هم دست‌نخورده ماند. امتیازت ${fa(S.score)} شد.`
      : `همهٔ قلم‌موها را خرج کردی. امتیازت ${fa(S.score)} شد.`,
    btn: BTN_GO, btnHot: S.hover === BTN_GO,
    btnLabel: L().endless ? 'سفارشِ بعدی' : (last ? 'از اوّل' : 'سفارشِ بعدی'),
    paper: P.paper, band: P.good, ink: P.ink, inkSoft: P.inkSoft,
    btnFill: '#3f7fa0', btnHotFill: '#4c92b5',
    icon: (x, y) => star(x, y + 6, 26, P.gold, Math.sin(S.t * 2) * .2),
  });
}

function drawLost() {
  overlay({
    t: S.phaseT,
    w: 720, h: 300, y: 196,
    title: 'کاغذها تمام شد',
    body: 'قلم‌مو کم است، پس اوّل فکر کن بعد رنگ بزن. تا زدن که خرجی ندارد.',
    btn: BTN_GO, btnHot: S.hover === BTN_GO, btnLabel: 'دوباره',
    paper: P.paper, band: P.bad, ink: P.ink, inkSoft: P.inkSoft,
    btnFill: '#cf5f4a', btnHotFill: '#dd6f59',
    icon: flagIcon,
  });
}
