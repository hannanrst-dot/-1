<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#17110c">
<title>صندوقچهٔ گنج — الگوسازی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>
  /* صفحه نباید هیچ‌جا اسکرول یا زوم شود؛ بازی باید مثل یک برنامه رفتار کند. */
  html, body {
    margin: 0; padding: 0; background: #17110c;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body {
    position: fixed; inset: 0;          /* جلوی کشیده‌شدنِ صفحه در سافاریِ گوشی */
    width: 100%; height: 100vh; height: 100dvh;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none; -webkit-touch-callout: none;
  }

  /* گوشیِ عمودی صحنه را ریز می‌کند؛ بچه باید گوشی را بچرخاند. */
  #rotate { display: none; }
  @media (orientation: portrait) and (max-width: 860px) {
    #stage { display: none; }
    #rotate {
      display: flex; position: fixed; inset: 0;
      z-index: 9;
      flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      background: #17110c; color: #f6ead2;
      font: 700 20px "Vazirmatn", Tahoma, sans-serif; text-align: center; padding: 32px;
    }
    #rotate svg { animation: tilt 2.4s ease-in-out infinite; }
    @keyframes tilt { 0%, 45% { transform: rotate(0deg); } 65%, 100% { transform: rotate(-90deg); } }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="rotate">
  <svg width="86" height="126" viewBox="0 0 86 126" fill="none" aria-hidden="true">
    <rect x="3" y="3" width="80" height="120" rx="12" stroke="#e8b448" stroke-width="5"/>
    <rect x="15" y="19" width="56" height="88" rx="5" fill="#e8b448" opacity=".28"/>
    <circle cx="43" cy="115" r="4" fill="#e8b448"/>
  </svg>
  <div>گوشی را بچرخان</div>
  <div style="font-weight:400;opacity:.7;font-size:16px">این بازی خوابیده بازی می‌شود</div>
</div>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   هستهٔ مشترکِ بازی‌ها — سبک «کاغذبُری»
   ───────────────────────────────────────────────────────────────────────
   این فایل جعبه‌ابزار است، نه چارچوب: هر بازی حلقه و وضعیت خودش را دارد
   و فقط از این توابع برای کشیدن استفاده می‌کند. دلیلش این است که هر بازی
   باید حس‌وحال خودش را داشته باشد، نه اینکه همه شبیه هم دربیایند.

   قاعده‌های ثابتِ تصویری:
   • نور همیشه از بالا-چپ می‌تابد، پس سایه‌ها به پایین-راست می‌افتند.
   • هیچ لبه‌ای کاملاً صاف نیست؛ همه کمی موج دارند (انگار با قیچی بریده).
   • هیچ خاکستریِ خالصی نداریم؛ همه‌ی خنثی‌ها به گرمیِ صحنه می‌زنند.
   • یک لایه‌ی دانه‌دانه‌ی کاغذ روی کلِ تصویر ضرب می‌شود.
   ═══════════════════════════════════════════════════════════════════════ */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const FA_D = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
const fa = (n) => String(n).replace(/\d/g, (d) => FA_D[+d]);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeIn = (t) => t * t * t;
const easeInOut = (t) => (t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2);
const easeBack = (t) => 1 + 2.7 * Math.pow(t-1, 3) + 1.7 * Math.pow(t-1, 2);
const easeElastic = (t) => t === 0 || t === 1 ? t : Math.pow(2, -9*t) * Math.sin((t*10 - .75) * 2.094) + 1;

/** تصادفِ تکرارپذیر: با یک بذر همیشه همان عدد. برای اینکه تزئین‌ها هر فریم نپرند. */
function noise1(x) {
  const s = Math.sin(x * 127.1) * 43758.5453;
  return s - Math.floor(s);
}
const pick = (arr, seed) => arr[Math.floor(noise1(seed) * arr.length) % arr.length];

/* ───────── بوم و صحنهٔ ثابت ───────── */

let ctx, SW, SH, CV, _refit = null;
let view = { scale: 1, ox: 0, oy: 0, w: 0, h: 0, dpr: 1 };
let _grain = null;

function initStage(canvas, w, h) {
  CV = canvas; SW = w; SH = h;
  ctx = canvas.getContext('2d');

  /* اندازه را از خودِ بوم می‌گیریم نه از innerHeight؛ چون در سافاریِ گوشی
     نوارِ آدرس باز و بسته می‌شود و innerHeight دروغ می‌گوید. */
  const fit = () => {
    const r = canvas.getBoundingClientRect();
    const vw = Math.round(r.width), vh = Math.round(r.height);
    if (vw < 20 || vh < 20) return;
    const dpr = Math.min(devicePixelRatio || 1, QUALITY > 0 ? 2 : 1);
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    const scale = Math.min(vw / SW, vh / SH);
    view = { scale, ox: (vw - SW*scale)/2, oy: (vh - SH*scale)/2, w: vw, h: vh, dpr };
    _grain = buildGrain();
  };
  _refit = fit;
  addEventListener('resize', fit);
  /* چرخاندنِ گوشی: اندازهٔ درست چند لحظه بعد می‌رسد، پس چندبار اندازه می‌گیریم. */
  addEventListener('orientationchange', () => {
    fit(); setTimeout(fit, 140); setTimeout(fit, 460);
  });
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(canvas);

  /* صدا در گوشی فقط بعد از اوّلین لمس اجازهٔ پخش دارد. */
  const unlock = () => { sfx._c(); removeEventListener('pointerdown', unlock); removeEventListener('touchstart', unlock); };
  addEventListener('pointerdown', unlock, { passive: true });
  addEventListener('touchstart', unlock, { passive: true });
  /* نگه‌داشتنِ انگشت نباید منوی مرورگر را باز کند. */
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  fit();
  return ctx;
}

/** قابِ صحنه را باز می‌کند: بعد از این، مختصات همیشه در فضای SW×SH است. */
function beginScene(bg) {
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, view.w, view.h);
  ctx.save();
  ctx.translate(view.ox, view.oy);
  ctx.scale(view.scale, view.scale);
  ctx.beginPath();
  ctx.rect(0, 0, SW, SH);
  ctx.clip();
}

/** بافتِ کاغذ، تیرگیِ گوشه‌ها، رنگ‌بندی و درخششِ نور را می‌گذارد و قاب را می‌بندد. */
function endScene(grainAlpha = .15, vignette = 'rgba(48,28,14,.30)', bloom = .34, grade = .14) {
  if (QUALITY < 1) { grade = 0; grainAlpha *= .5; }
  if (QUALITY < 2) bloom = 0;
  if (grade > 0) {
    /* رنگ‌بندیِ نرم: بالای صحنه گرم‌تر، پایین سردتر — عمق می‌دهد */
    const g = ctx.createLinearGradient(0, 0, 0, SH);
    g.addColorStop(0, `rgba(255, 214, 150, ${grade})`);
    g.addColorStop(.55, 'rgba(255, 255, 255, 0)');
    g.addColorStop(1, `rgba(40, 60, 110, ${grade * .9})`);
    ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalCompositeOperation = 'source-over';
  }
  if (_grain && grainAlpha > 0) {
    ctx.globalCompositeOperation = 'multiply';
    ctx.globalAlpha = grainAlpha;
    ctx.fillStyle = _grain;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
  if (vignette) {
    const g = ctx.createRadialGradient(SW/2, SH/2, SH*.42, SW/2, SH/2, SH*1.05);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, vignette);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
  }
  ctx.restore();
  bloomPass(bloom);
}

/* ───────── درخششِ نور (bloom) ─────────
   قابِ رسم‌شده را کوچک می‌کنیم، دو بار در خودش ضرب می‌کنیم تا فقط
   روشن‌ها بمانند، محوش می‌کنیم و با حالتِ «lighter» رویش می‌گذاریم.
   نتیجه: چراغ‌ها، شعله‌ها و رنگ‌های روشن نور پخش می‌کنند. */
let _bl, _blc, _bl2, _bl2c, _blNo = false, _blTick = 0;

function bloomPass(amount) {
  if (!amount || _blNo || !CV.width) return;
  /* کوچک‌کردن و بزرگ‌کردنِ دوباره، خودش محو می‌کند — از filter خیلی ارزان‌تر است */
  const W = Math.max(4, Math.round(CV.width * .2)), H = Math.max(4, Math.round(CV.height * .2));
  const W2 = Math.max(2, Math.round(W * .28)), H2 = Math.max(2, Math.round(H * .28));
  try {
    if (!_bl) {
      _bl = document.createElement('canvas'); _blc = _bl.getContext('2d');
      _bl2 = document.createElement('canvas'); _bl2c = _bl2.getContext('2d');
      if (!_blc || !_bl2c) { _blNo = true; return; }
    }
    if (_bl.width !== W || _bl.height !== H) { _bl.width = W; _bl.height = H; }
    if (_bl2.width !== W2 || _bl2.height !== H2) { _bl2.width = W2; _bl2.height = H2; }
    /* ساختنِ نور یک قاب در میان کافی است؛ گذاشتنش هر قاب. */
    _blTick = (_blTick + 1) & 1;
    if (!_blTick) {
      _blc.globalCompositeOperation = 'source-over';
      _blc.clearRect(0, 0, W, H);
      _blc.drawImage(CV, 0, 0, W, H);
      _blc.globalCompositeOperation = 'multiply';
      _blc.drawImage(_bl, 0, 0);
      _blc.drawImage(_bl, 0, 0);
      _blc.globalCompositeOperation = 'source-over';
      _bl2c.clearRect(0, 0, W2, H2);
      _bl2c.drawImage(_bl, 0, 0, W2, H2);
    }

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = amount;
    ctx.drawImage(_bl2, 0, 0, CV.width, CV.height);
    ctx.restore();
  } catch (e) { _blNo = true; }
}

/* ───────── لایهٔ ثابت ─────────
   هرچه در صحنه تکان نمی‌خورد را یک‌بار می‌کشیم و بعد فقط کپی می‌کنیم. */
const _layers = {};
function staticLayer(key, w, h, paint) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const L = _layers[key];
  if (L && L.q === q && L.w === w && L.h === h) return L.cv;
  const off = document.createElement('canvas');
  off.width = Math.max(1, Math.round(w * q));
  off.height = Math.max(1, Math.round(h * q));
  const c = off.getContext('2d');
  c.setTransform(q, 0, 0, q, 0, 0);
  const prev = ctx;
  ctx = c;
  try { paint(); } finally { ctx = prev; }
  _layers[key] = { cv: off, q, w, h };
  return off;
}

/* ───────── نورپردازی و بافت ─────────
   کارِ این‌ها این است که هیچ سطحی «تختِ یک‌رنگ» نماند. */

/** شیبِ عمودی: بالا روشن، پایین تیره. */
function vgrad(y0, y1, top, bot) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, top); g.addColorStop(1, bot);
  return g;
}

/** حجمِ کروی: نور از بالا-چپ، سایه در پایین-راست. */
function ball(cx, cy, r, lit, base, dark) {
  const g = ctx.createRadialGradient(cx - r * .38, cy - r * .42, r * .06, cx, cy, r * 1.06);
  g.addColorStop(0, lit); g.addColorStop(.45, base); g.addColorStop(1, dark);
  return g;
}

/** لبهٔ روشنِ بالا-چپِ یک مسیر — همان «rim light». */
function rim(pathFn, col, w = 2.2) {
  ctx.save();
  ctx.beginPath(); pathFn();
  ctx.clip();
  ctx.beginPath(); pathFn();
  ctx.strokeStyle = col; ctx.lineWidth = w * 2; ctx.lineJoin = 'round';
  ctx.translate(-w * .5, -w * .6);
  ctx.stroke();
  ctx.restore();
}

/** سایهٔ چسبیده به زمین — چیزها را روی سطح می‌نشاند. */
function contact(cx, cy, rx, ry, alpha = .26) {
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
  g.addColorStop(0, `rgba(20, 12, 6, ${alpha})`);
  g.addColorStop(1, 'rgba(20, 12, 6, 0)');
  ctx.save();
  ctx.fillStyle = g;
  ctx.translate(cx, cy); ctx.scale(1, ry / Math.max(rx, ry));
  ctx.beginPath(); ctx.arc(0, 0, Math.max(rx, ry), 0, TAU); ctx.fill();
  ctx.restore();
}

const _tex = {};
/** بافتِ تکرارشونده؛ یک‌بار ساخته و بعد از حافظه خوانده می‌شود. */
function texture(key, w, h, paint) {
  if (_tex[key]) return _tex[key];
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const c = off.getContext('2d');
  paint(c, w, h);
  _tex[key] = ctx.createPattern(off, 'repeat');
  return _tex[key];
}

/** رگهٔ چوب. */
function texWood(base, grain) {
  return texture('w' + base + grain, 120, 120, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = grain; c.lineWidth = 1.4;
    for (let i = 0; i < 9; i++) {
      c.globalAlpha = .18 + noise1(i * 3.1) * .3;
      c.beginPath();
      const y0 = i * 14 + noise1(i) * 6;
      c.moveTo(0, y0);
      for (let x = 0; x <= w; x += 10) c.lineTo(x, y0 + Math.sin(x * .09 + i) * 2.6);
      c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** تارِ پارچه. */
function texCloth(base, thread) {
  return texture('c' + base + thread, 16, 16, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = thread; c.lineWidth = 1; c.globalAlpha = .5;
    for (let i = 0; i < w; i += 4) {
      c.beginPath(); c.moveTo(i, 0); c.lineTo(i, h); c.stroke();
      c.beginPath(); c.moveTo(0, i); c.lineTo(w, i); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** دانه‌های سنگ. */
function texStone(base, spec) {
  return texture('s' + base + spec, 90, 90, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) {
      c.globalAlpha = .05 + noise1(i * 1.7) * .16;
      c.fillStyle = spec;
      const r = .6 + noise1(i * 5.3) * 1.9;
      c.beginPath();
      c.arc(noise1(i * 2.1) * w, noise1(i * 3.7 + 1) * h, r, 0, TAU);
      c.fill();
    }
    c.globalAlpha = 1;
  });
}

/** الیافِ کاغذ. */
function texPaper(base) {
  return texture('p' + base, 100, 100, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 130; i++) {
      c.globalAlpha = .04 + noise1(i * 2.3) * .07;
      c.strokeStyle = i % 2 ? '#ffffff' : '#5a4326';
      c.lineWidth = .9;
      const x = noise1(i * 1.3) * w, y = noise1(i * 4.1 + 2) * h;
      const a = noise1(i * 7.7) * TAU, l = 4 + noise1(i * 9.1) * 12;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

function buildGrain() {
  const s = 260;
  const off = document.createElement('canvas');
  off.width = off.height = s;
  const c = off.getContext('2d');
  const img = c.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    const v = 214 + Math.random() * 41;
    img.data[i*4] = v; img.data[i*4+1] = v; img.data[i*4+2] = v; img.data[i*4+3] = 255;
  }
  c.putImageData(img, 0, 0);
  return ctx.createPattern(off, 'repeat');
}

function toStage(e) {
  const r = CV.getBoundingClientRect();
  return {
    x: (e.clientX - r.left - view.ox) / view.scale,
    y: (e.clientY - r.top - view.oy) / view.scale,
  };
}

const inRect = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
const inCircle = (p, b, pad = 0) => Math.hypot(p.x - b.x, p.y - b.y) <= b.r + pad;

/* ───────── قلم‌های کاغذبُری ───────── */

/** دایره‌ای که انگار با قیچی بریده شده. */
function wobbleCircle(cx, cy, r, seed = 0, amp = 2.2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const rr = r + Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp * .45;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** بیضیِ ناصاف — برای چیزهایی که گرد نیستند ولی نرم‌اند. */
function wobbleEllipse(cx, cy, rx, ry, rot = 0, seed = 0, amp = 2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const w = 1 + (Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp*.45) / Math.max(rx, ry);
    const px = Math.cos(a) * rx * w, py = Math.sin(a) * ry * w;
    const x = cx + px*Math.cos(rot) - py*Math.sin(rot);
    const y = cy + px*Math.sin(rot) + py*Math.cos(rot);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** مستطیلِ گِرد با گوشه‌های کمی کج. */
function wobbleRect(x, y, w, h, r = 12, seed = 0, amp = 1.6) {
  const j = (k) => (noise1(seed*9.7 + k) - .5) * amp * 2;
  ctx.beginPath();
  ctx.moveTo(x + r + j(1), y + j(2));
  ctx.lineTo(x + w - r + j(3), y + j(4));
  ctx.quadraticCurveTo(x + w + j(5), y + j(6), x + w + j(7), y + r + j(8));
  ctx.lineTo(x + w + j(9), y + h - r + j(10));
  ctx.quadraticCurveTo(x + w + j(11), y + h + j(12), x + w - r + j(13), y + h + j(14));
  ctx.lineTo(x + r + j(15), y + h + j(16));
  ctx.quadraticCurveTo(x + j(17), y + h + j(18), x + j(19), y + h - r + j(20));
  ctx.lineTo(x + j(21), y + r + j(22));
  ctx.quadraticCurveTo(x + j(23), y + j(24), x + r + j(1), y + j(2));
  ctx.closePath();
}

/** سایهٔ نرم؛ نور از بالا-چپ. */
function withShadow(blur, dy, alpha, fn, hue = '78, 46, 24') {
  ctx.save();
  ctx.shadowColor = `rgba(${hue}, ${alpha})`;
  ctx.shadowBlur = blur;
  ctx.shadowOffsetY = dy;
  ctx.shadowOffsetX = dy * .35;
  fn();
  ctx.restore();
}

/** یک برگه‌ی کاغذ با سایه — پایه‌ی همه‌ی کارت‌ها و تابلوها. */
function paper(x, y, w, h, fill, seed = 1, r = 12, shadow = .26) {
  withShadow(16, 7, shadow, () => {
    ctx.fillStyle = fill;
    wobbleRect(x, y, w, h, r, seed, 2);
    ctx.fill();
  });
  /* الیافِ کاغذ و لبهٔ روشن، تا سطح تخت نماند */
  ctx.save();
  ctx.beginPath(); wobbleRect(x, y, w, h, r, seed, 2); ctx.clip();
  ctx.globalAlpha = .5;
  ctx.fillStyle = texPaper(fill);
  ctx.fillRect(x, y, w, h);
  ctx.globalAlpha = 1;
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.4, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(90,60,20,.1)');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
}

function text(str, x, y, o = {}) {
  const size = o.size || 20;
  const fam = o.family || 'Vazirmatn';
  ctx.save();
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.font = `${fam === 'Lalezar' ? '400' : (o.weight || 700)} ${size}px "${fam}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.baseline || 'middle';
  ctx.fillStyle = o.color || '#43291b';
  ctx.direction = 'rtl';
  if (o.stroke) {
    ctx.lineWidth = o.strokeWidth || 5;
    ctx.strokeStyle = o.stroke;
    ctx.lineJoin = 'round';
    ctx.strokeText(str, x, y, o.maxWidth);
  }
  ctx.fillText(str, x, y, o.maxWidth);
  ctx.restore();
}

/** متنِ چندخطی که خودش می‌شکند. ارتفاعِ اشغال‌شده را برمی‌گرداند. */
function textWrap(str, x, y, maxW, o = {}) {
  const size = o.size || 19, lh = o.lineHeight || size * 1.7;
  ctx.font = `${o.weight || 700} ${size}px "${o.family || 'Vazirmatn'}", Tahoma, sans-serif`;
  const lines = [];
  for (const para of str.split('\n')) {
    let line = '';
    for (const wd of para.split(' ')) {
      const t = line ? line + ' ' + wd : wd;
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = wd; }
      else line = t;
    }
    lines.push(line);
  }
  lines.forEach((l, i) => text(l, x, y + i * lh, o));
  return lines.length * lh;
}

/* ───────── ذره‌ها ───────── */

class Bits {
  constructor() { this.list = []; }
  add(x, y, n, kind, colors, opts = {}) {
    for (let i = 0; i < n; i++) {
      const a = opts.dir !== undefined ? opts.dir + (Math.random()-.5) * (opts.spread || 1) : Math.random() * TAU;
      const sp = (opts.speed || 200) * (.4 + Math.random());
      this.list.push({
        kind, x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - (opts.lift || 0),
        r: (opts.size || 4) * (.5 + Math.random()),
        rot: Math.random() * TAU, vr: (Math.random()-.5) * 10,
        col: colors[(Math.random() * colors.length) | 0],
        grav: opts.grav === undefined ? 620 : opts.grav,
        drag: opts.drag || .995,
        life: (opts.life || .9) * (.6 + Math.random() * .8), age: 0,
      });
    }
  }
  confetti(x, y, n, colors) {
    this.add(x, y, n, 'flake', colors, { speed: 420, lift: 190, size: 5, life: 1.6, grav: 780 });
  }
  spark(x, y, n, colors) {
    this.add(x, y, n, 'dot', colors, { speed: 180, lift: 30, size: 3.4, life: .7, grav: 260, drag: .93 });
  }
  step(dt) {
    for (const p of this.list) {
      p.age += dt;
      p.vy += p.grav * dt;
      p.vx *= p.drag; p.vy *= p.drag;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    }
    this.list = this.list.filter((p) => p.age < p.life);
  }
  draw() {
    for (const p of this.list) {
      const k = clamp(1 - p.age / p.life, 0, 1);
      ctx.save();
      ctx.globalAlpha = k;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.col;
      if (p.kind === 'flake') ctx.fillRect(-p.r, -p.r*1.5, p.r*2, p.r*3);
      else if (p.kind === 'leaf') { wobbleEllipse(0, 0, p.r*1.8, p.r*.8, 0, p.r, .6); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(0, 0, p.r * k, 0, TAU); ctx.fill(); }
      ctx.restore();
    }
  }
  clear() { this.list.length = 0; }
}

/* ───────── صدا (بدون فایل صوتی) ───────── */

const sfx = {
  ac: null, on: true,
  _c() {
    if (!this.on) return null;
    if (!this.ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; this.ac = new A(); }
    if (this.ac.state === 'suspended') this.ac.resume();
    return this.ac;
  },
  tone(f, dur = .16, type = 'sine', gain = .13, delay = 0) {
    const c = this._c(); if (!c) return;
    const t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(t0 + dur + .04);
  },
  tap()  { this.tone(430, .07, 'triangle', .09); },
  place(){ this.tone(620, .11, 'sine', .12); },
  pop()  { this.tone(760, .09, 'sine', .11); },
  slide(){ this.tone(240, .22, 'sine', .07); },
  good() { [523, 659, 784].forEach((f,i) => this.tone(f, .22, 'sine', .13, i*.07)); },
  win()  { [523, 659, 784, 1047].forEach((f,i) => this.tone(f, .34, 'triangle', .13, i*.10)); },
  nope() { this.tone(180, .2, 'sawtooth', .07); },
  tick() { this.tone(1100, .04, 'square', .05); },
};

/* ───────── قطعه‌های آماده ───────── */

function star(x, y, r, col, rot = 0) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = col;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI/2 + i * Math.PI/5;
    const rr = i % 2 ? r * .45 : r;
    const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/** دکمهٔ کاغذی. hovered را خودِ بازی می‌دهد؛ اینجا فقط کشیده می‌شود. */
/** رنگ را روشن‌تر (k>0) یا تیره‌تر (k<0) می‌کند. */
function shade(col, k) {
  const c = String(col).trim();
  let r, g2, b2;
  if (c[0] === '#') {
    const h = c.length === 4 ? c[1]+c[1]+c[2]+c[2]+c[3]+c[3] : c.slice(1, 7);
    r = parseInt(h.slice(0,2), 16); g2 = parseInt(h.slice(2,4), 16); b2 = parseInt(h.slice(4,6), 16);
  } else {
    const m = c.match(/[\d.]+/g);
    if (!m || m.length < 3) return col;
    r = +m[0]; g2 = +m[1]; b2 = +m[2];
  }
  const f = (v) => Math.round(clamp(k < 0 ? v * (1 + k) : v + (255 - v) * k, 0, 255));
  return 'rgb(' + f(r) + ',' + f(g2) + ',' + f(b2) + ')';
}

function button(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 3 : 0;
  const fill = o.disabled ? (o.off || '#bcaa92') : (hot ? (o.hotFill || o.fill) : o.fill);
  const r = o.r === undefined ? 14 : o.r;
  /* لبهٔ زیرینِ تیره — دکمه از صفحه بیرون می‌زند */
  ctx.fillStyle = shade(fill, -.36);
  wobbleRect(b.x, b.y + dy + 7, b.w, b.h, r, b.x + b.y, 2);
  ctx.fill();
  withShadow(hot ? 22 : 14, hot ? 5 : 8, .32, () => {
    ctx.fillStyle = fill;
    wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2);
    ctx.fill();
  });
  /* حجم: روشن از بالا، تیره به پایین */
  ctx.save();
  ctx.beginPath(); wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2); ctx.clip();
  const g = ctx.createLinearGradient(0, b.y + dy, 0, b.y + dy + b.h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.45, 'rgba(255,255,255,.04)');
  g.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = g;
  ctx.fillRect(b.x, b.y + dy, b.w, b.h);
  /* برقِ باریکِ لبهٔ بالا */
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.fillRect(b.x + r, b.y + dy + 2, b.w - r * 2, 2);
  ctx.restore();
  text(label, b.x + b.w/2, b.y + b.h/2 + dy - (o.sub ? 9 : 0), {
    size: o.size || 26, color: o.color || '#fdf6e8', family: o.family || 'Lalezar',
  });
  if (o.sub) text(o.sub, b.x + b.w/2, b.y + b.h/2 + dy + 17,
    { size: 14, color: o.subColor || 'rgba(255,255,255,.88)' });
}

/** دکمهٔ گرد کوچک (مثل + و −). */
function roundButton(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 2 : 0;
  withShadow(10, hot ? 3 : 5, .3, () => {
    ctx.fillStyle = o.disabled ? '#cbbba3' : (hot ? (o.hotFill || o.fill) : o.fill);
    wobbleCircle(b.x, b.y + dy, b.r, b.x, 1.4);
    ctx.fill();
  });
  text(label, b.x, b.y + dy - 1,
    { size: o.size || 32, color: o.disabled ? '#a8988a' : (o.color || '#fdf6e8'), family: 'Lalezar' });
}

/** پرده‌ی تمام‌صفحه: برای شروعِ پرده و برای جشنِ پایان. */
function overlay(o) {
  const k = easeOut(clamp(o.t / .5, 0, 1));
  ctx.fillStyle = `rgba(30, 22, 16, ${.66 * k})`;
  ctx.fillRect(0, 0, SW, SH);

  const w = o.w || 700, h = o.h || 290;
  const x = (SW - w) / 2, y = o.y || (SH * .22);
  const s = lerp(.9, 1, easeBack(clamp(o.t / .65, 0, 1)));
  ctx.save();
  ctx.translate(SW/2, y + h/2);
  ctx.scale(s, s);
  ctx.translate(-SW/2, -(y + h/2));

  withShadow(30, 14, .42, () => {
    ctx.fillStyle = o.paper || '#fbf3e2';
    wobbleRect(x, y, w, h, 18, 121, 2.4);
    ctx.fill();
  });
  ctx.fillStyle = o.band || '#c8434f';
  wobbleRect(x, y, w, 12, 6, 123, 1);
  ctx.fill();

  if (o.icon) o.icon(SW/2, y + 56);
  text(o.title, SW/2, y + (o.icon ? 108 : 62),
    { size: o.titleSize || 36, color: o.ink || '#43291b', family: 'Lalezar', alpha: k });
  textWrap(o.body, SW/2, y + (o.icon ? 158 : 116), w - 90,
    { size: 19, color: o.inkSoft || '#8a6a52', alpha: k });
  ctx.restore();

  button(o.btn, o.btnLabel, { hot: o.btnHot, fill: o.btnFill || '#7fa356', hotFill: o.btnHotFill || '#8fb45f', size: 28 });
}

/** پیامِ کوتاهِ بالای صحنه. */
class Toast {
  constructor() { this.msg = null; this.t = 0; this.kind = 'info'; }
  say(msg, kind = 'info') { this.msg = msg; this.kind = kind; this.t = 2.6; }
  step(dt) { if (this.t > 0) { this.t -= dt; if (this.t <= 0) this.msg = null; } }
  draw(y = 24, colors = {}) {
    if (!this.msg) return;
    const k = clamp(this.t, 0, 1) * clamp((2.6 - this.t) * 5, 0, 1);
    ctx.save();
    ctx.globalAlpha = k;
    ctx.font = `700 19px "Vazirmatn", Tahoma, sans-serif`;
    const w = ctx.measureText(this.msg).width + 76;
    const fill = this.kind === 'good' ? (colors.good || '#7fa356')
               : this.kind === 'bad' ? (colors.bad || '#c8434f')
               : (colors.info || '#fbf3e2');
    paper(SW/2 - w/2, y, w, 48, fill, 151, 12, .3);
    text(this.msg, SW/2, y + 25,
      { size: 19, color: this.kind === 'info' ? (colors.ink || '#43291b') : '#fff8ec' });
    ctx.restore();
  }
}

/* ───────── آموزشِ پرده‌ای ─────────
   پرده‌هایی که منتظرِ کارِ بچه نیستند با یک ضربه جلو می‌روند. تایمر فقط
   پشتیبان است؛ بچهٔ کلاس سومی باید فرصتِ خواندن داشته باشد، نه اینکه
   متن قبل از تمام شدنِ خواندنش برود.                                    */

/** اگر پردهٔ فعلی خواندنی است، ضربه را می‌خورد و می‌رود پردهٔ بعد. */
function tutTap(tut, tapSteps, lastStep) {
  if (!tut.on || tapSteps.indexOf(tut.step) < 0) return false;
  if (tut.step >= lastStep) tut.on = false;
  else { tut.step++; tut.t = 0; }
  sfx.tap();
  return true;
}

/** نشانهٔ «برای ادامه بزن» — زیرِ کارتِ آموزش. */
function tutMore(cx, y, t, ink = '#3a2a18', bg = 'rgba(255, 250, 238, .94)') {
  ctx.save();
  ctx.globalAlpha = .62 + .38 * Math.sin(t * 3.2);
  ctx.font = '700 15px "Vazirmatn", Tahoma, sans-serif';
  const label = 'برای ادامه، هرجا را بزن';
  const w = ctx.measureText(label).width + 40, h = 32, x = cx - w / 2, r = 16;
  withShadow(10, 4, .3, () => {
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath(); ctx.fill();
  });
  text(label, cx, y + h / 2, { size: 15, color: ink });
  ctx.restore();
}

/** فونت‌ها را می‌آورد و بعد بازی را شروع می‌کند. */
function whenFontsReady(start) {
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('400 40px Lalezar'),
      document.fonts.load('700 20px Vazirmatn'),
      document.fonts.load('900 20px Vazirmatn'),
    ]).then(start, start);
    setTimeout(start, 2600);
  } else start();
}

/** حلقهٔ فریم با dtِ محدودشده. */
/* ───────── کیفیتِ خودکار ─────────
   اگر دستگاه کُند بود، اوّل درخشش و بعد رنگ‌بندی خاموش می‌شود تا بازی
   روان بماند. روی دستگاهِ قوی همه‌چیز روشن است. */
let QUALITY = 2;
let _fAcc = 0, _fN = 0, _qHold = 0;

function _qualityTick(gap) {
  if (gap <= 0 || gap > 200) return;
  _fAcc += gap; _fN++;
  if (_fN < 45) return;
  const avg = _fAcc / _fN;
  _fAcc = 0; _fN = 0;
  if (_qHold > 0) { _qHold--; return; }
  const before = QUALITY;
  if (avg > 25 && QUALITY > 0) { QUALITY--; _qHold = 3; }
  else if (avg < 18.5 && QUALITY < 2) { QUALITY++; _qHold = 6; }
  /* در پایین‌ترین کیفیت، صحنه را با نقطه‌های کمتر می‌کشیم */
  if (before !== QUALITY && (before === 0 || QUALITY === 0) && _refit) _refit();
}

function runLoop(step) {
  let last = performance.now(), started = false;
  const frame = (now) => {
    const gap = now - last;
    const dt = Math.min(gap / 1000, 1/20);
    last = now;
    _qualityTick(gap);
    step(dt);
    requestAnimationFrame(frame);
  };
  if (!started) { started = true; requestAnimationFrame(frame); }
}

/* ═══════════════════════════════════════════════════════════════════════
   صندوقچهٔ گنج — ریاضی سوم، فصل ۲، درس ۱ (حلّ مسئله: الگوسازی)
   ───────────────────────────────────────────────────────────────────────
   درسِ کتاب این است: وقتی مسئله «همهٔ حالت‌ها» را می‌خواهد، باید با نظم
   جلو بروی وگرنه بعضی را جا می‌اندازی و بعضی را دوبار می‌نویسی.

   اینجا این حرف زده نمی‌شود؛ خرجش را می‌دهی:

     صندوقچه چند قفل دارد، به تعدادِ همهٔ حالت‌های ممکن. هر ترکیبِ تازه
     یک قفل را باز می‌کند. ولی شمع‌ها شمرده‌اند و هر امتحان یک شمع
     می‌سوزاند — چه تازه باشد چه تکراری.

   پس بچه‌ای که الکی می‌چرخاند، شمع‌هایش تمام می‌شود و صندوق بسته می‌ماند.
   بچه‌ای که با نظم می‌رود، می‌رسد. کسی این را به او نگفته.

   دو کمکِ اختیاری هم هست که خودش باید کشفشان کند:
     • دفترِ گنج هرچه پیدا کرده نشان می‌دهد.
     • اهرمِ «مرتّب کن» دفتر را مرتّب می‌کند و آن‌وقت جای خالی‌ها به چشم
       می‌آید — همان جدولِ مرتّبِ کتاب.
     • سه ترکیبِ تازهٔ پشتِ‌سرِهم یک شمعِ اضافه می‌آورد؛ نظم پاداش دارد.

   قفل‌های مرحلهٔ ۲ و ۳ دقیقاً همان دو تمرینِ صفحهٔ ۲۶ کتاب‌اند.
   ═══════════════════════════════════════════════════════════════════════ */

  triesMax: 0,
  wasted: 0,
  streak: 0,
  sorted: false,
  hearts: 0,
  score: 0, best: 0,
  t: 0, phaseT: 0,
  hover: null,
  shake: 0,
  puff: 0,
  fly: null,             // جواهری که به سمتِ دفتر می‌رود
  lidT: 0,
  motes: [],
  floats: [],
  tut: { on: true, step: 0, t: 0 },
};

const bits = new Bits();
const toast = new Toast();
const L = () => LEVELS[S.level];
const dials = () => L().digits;
const nDials = () => L().digits.length;
const totalCombos = () => L().digits.reduce((a, d) => a * d.length, 1);
const current = () => dials().map((d, k) => d[S.sel[k]]).join('');

function loadBest() { try { return +localStorage.getItem('ganj-best') || 0; } catch { return 0; } }
function saveBest(v) { try { localStorage.setItem('ganj-best', String(v)); } catch { /* حالت خصوصی */ } }

/* ───────── چیدمان ───────── */

const HUD_H = 52;
const RACK = { x: 34, y: 296, w: 276 };                // شمعدان
const CH = { x: 322, y: 250, w: 452, h: 316 };          // صندوقچه
const LOCKROW_Y = 206;
const LEDGER = { x: 812, y: 76, w: 356, h: 552 };
const BTN_TRY = { x: CH.x + CH.w / 2 - 124, y: 600, w: 248, h: 64 };
const BTN_SORT = { x: LEDGER.x + LEDGER.w - 170, y: LEDGER.y + 50, w: 148, h: 42 };
const BTN_GO = { x: 470, y: 566, w: 260, h: 76 };

function dialBox(k) {
  const n = nDials(), w = 118, gap = 20;
  const total = n * w + (n - 1) * gap;
  const x0 = CH.x + CH.w / 2 - total / 2;
  return { x: x0 + k * (w + gap), y: CH.y + 62, w, h: 152 };
}

function lockPos(i) {
  const n = totalCombos(), perRow = Math.min(n, 9);
  const rows = Math.ceil(n / perRow);
  const r = Math.floor(i / perRow), c = i % perRow;
  const inRow = Math.min(perRow, n - r * perRow);
  const gap = 30;
  const x0 = CH.x + CH.w / 2 - ((inRow - 1) * gap) / 2;
  return { x: x0 + c * gap, y: LOCKROW_Y - (rows - 1 - r) * 30 };
}

function tileBox(i) {
  const w = 100, h = 58, gx = 12, gy = 10, cols = 3;
  const x0 = LEDGER.x + (LEDGER.w - (cols * w + (cols - 1) * gx)) / 2;
  return { x: x0 + (i % cols) * (w + gx), y: LEDGER.y + 112 + Math.floor(i / cols) * (h + gy), w, h };
}

/* ───────── حلقه ───────── */

const cv = document.getElementById('stage');
initStage(cv, SCENE_W, SCENE_H);
S.best = loadBest();
for (let i = 0; i < 34; i++) {
  S.motes.push({ x: Math.random() * SCENE_W, y: Math.random() * SCENE_H,
                 ph: Math.random() * TAU, sp: .15 + Math.random() * .4, r: .8 + Math.random() * 1.8 });
}
whenFontsReady(() => runLoop(step));

function startLevel(i) {
  S.level = i;
  S.sel = [0, 0, 0];
  S.spin = [0, 0, 0];
  S.found = [];
  S.tries = totalCombos() + LEVELS[i].extra;
  S.triesMax = S.tries;
  S.wasted = 0;
  S.streak = 0;
  S.sorted = false;
  S.fly = null;
  S.lidT = 0;
  S.phase = 'play'; S.phaseT = 0;
  S.tut.on = i === 0; S.tut.step = 0; S.tut.t = 0;
  toast.say(LEVELS[i].hint, 'info');
}

function floatText(x, y, txt, col, size) { S.floats.push({ x, y, txt, col, t: 0, size: size || 24 }); }

function step(dt) {
  S.t += dt; S.phaseT += dt;
  if (S.shake > 0) S.shake -= dt;
  if (S.puff > 0) S.puff -= dt;
  for (let k = 0; k < 3; k++) if (S.spin[k] !== 0) {
    S.spin[k] -= Math.sign(S.spin[k]) * dt * 5.2;
    if (Math.abs(S.spin[k]) < .04) S.spin[k] = 0;
  }
  if (S.fly) { S.fly.t += dt * 1.7; if (S.fly.t >= 1) S.fly = null; }
  if (S.phase === 'won') S.lidT = Math.min(1, S.lidT + dt * .9);
  for (const m of S.motes) {
    m.ph += dt * m.sp;
    m.y -= dt * (5 + m.sp * 14);
    m.x += Math.sin(m.ph) * dt * 9;
    if (m.y < -10) { m.y = SCENE_H + 10; m.x = Math.random() * SCENE_W; }
  }
  for (const f of S.floats) { f.t += dt; f.y -= 42 * dt; }
  S.floats = S.floats.filter((f) => f.t < 1.5);
  if (S.phase === 'play' && S.tut.on) tutStep(dt);
  bits.step(dt);
  toast.step(dt);
  draw();
}

/* ───────── چرخاندن و امتحان ───────── */

function spinDial(k, dir) {
  if (S.phase !== 'play') return;
  const d = dials()[k];
  if (!d || d.length < 2) { S.shake = .16; sfx.tone(150, .1, 'sine', .05); return; }
  S.sel[k] = (S.sel[k] + dir + d.length) % d.length;
  S.spin[k] = dir;
  sfx.tick();
}

function tryCombo() {
  if (S.phase !== 'play') return;
  const v = current();
  const box = dialBox(nDials() - 1);
  S.tries--;

  if (S.found.includes(v)) {
    S.wasted++;
    S.streak = 0;
    S.puff = .6;
    S.shake = .34;
    sfx.nope();
    toast.say('این را قبلاً باز کرده بودی', 'bad');
    bits.add(CH.x + CH.w / 2, CH.y + CH.h - 40, 18, 'dot',
      ['#6b5a44', '#8a755a', '#4a3d2c'], { speed: 130, lift: 70, size: 5, life: 1.1, grav: 90 });
  } else {
    S.found.push(v);
    S.streak++;
    S.score += 100;
    const i = S.found.length - 1;
    S.fly = { t: 0, from: { x: box.x + box.w / 2, y: box.y + box.h / 2 }, to: tileBox(i), val: v,
              col: P.gem[i % P.gem.length] };
    sfx.good();
    bits.confetti(CH.x + CH.w / 2, CH.y + 120, 14, [P.gold, P.brassLit, '#fff']);
    if (S.streak > 0 && S.streak % 3 === 0) {
      S.tries++;
      S.triesMax = Math.max(S.triesMax, S.tries);
      toast.say('سه تای تازه پشتِ هم — یک شمعِ اضافه', 'good');
      floatText(RACK.x + RACK.w / 2, RACK.y + 40, '+۱ شمع', P.flame, 22);
    }
  }

  if (S.found.length >= totalCombos()) {
    const bonus = 300 + S.tries * 60;
    S.score += bonus;
    if (S.score > S.best) { S.best = S.score; saveBest(S.best); }
    S.phase = 'won'; S.phaseT = 0; S.lidT = 0;
    sfx.win();
    bits.confetti(CH.x + CH.w / 2, CH.y + 60, 70, [P.gold, ...P.gem, '#fff']);
  } else if (S.tries <= 0) {
    S.phase = 'lost'; S.phaseT = 0;
    sfx.nope();
  }
}

function toggleSort() { S.sorted = !S.sorted; sfx.slide(); }

/** فهرستِ دفتر: یا به ترتیبِ پیدا شدن، یا مرتّب‌شده. */
function ledgerList() {
  return S.sorted ? S.found.slice().sort((a, b) => +a - +b) : S.found;
}

/* ───────── آموزش ───────── */

const TUT_TAP = [0, 2], TUT_LAST = 2;      // پرده‌های خواندنی

function tutStep(dt) {
  S.tut.t += dt;
  if (S.tut.step === 0 && S.tut.t > 30) { S.tut.step = 1; S.tut.t = 0; }
  if (S.tut.step === 1 && S.found.length + S.wasted > 0) { S.tut.step = 2; S.tut.t = 0; }
  if (S.tut.step === 2 && S.tut.t > 30) S.tut.on = false;
}

/* ───────── ورودی ───────── */

function hitTest(p) {
  if (S.phase !== 'play') return inRect(p, BTN_GO) ? BTN_GO : null;
  if (inRect(p, BTN_TRY)) return BTN_TRY;
  if (S.level >= 1 && inRect(p, BTN_SORT)) return BTN_SORT;
  for (let k = 0; k < nDials(); k++) {
    const b = dialBox(k);
    /* نیمهٔ بالا یک رقم عقب، نیمهٔ پایین یک رقم جلو — ساده‌ترین کاری که
       انگشتِ بچه می‌تواند بکند. */
    if (inRect(p, { x: b.x - 8, y: b.y - 26, w: b.w + 16, h: b.h / 2 + 26 })) return { dial: k, dir: -1 };
    if (inRect(p, { x: b.x - 8, y: b.y + b.h / 2, w: b.w + 16, h: b.h / 2 + 26 })) return { dial: k, dir: 1 };
  }
  return null;
}

cv.addEventListener('pointermove', (e) => {
  S.hover = hitTest(toStage(e));
  cv.style.cursor = S.hover ? 'pointer' : 'default';
});
cv.addEventListener('pointerleave', () => { S.hover = null; });
cv.addEventListener('pointerdown', (e) => {
  if (S.phase === 'play' && tutTap(S.tut, TUT_TAP, TUT_LAST)) return;
  const h = hitTest(toStage(e));
  if (S.phase === 'intro') { if (h) startLevel(0); return; }
  if (S.phase === 'won') {
    if (!h) return;
    if (S.level + 1 < LEVELS.length) startLevel(S.level + 1);
    else { S.score = 0; startLevel(0); }
    return;
  }
  if (S.phase === 'lost') { if (h) startLevel(S.level); return; }
  if (!h) return;
  if (h === BTN_TRY) return tryCombo();
  if (h === BTN_SORT) return toggleSort();
  if (h.dial !== undefined) return spinDial(h.dial, h.dir);
});

/* ───────── ابزارِ نقاشی ───────── */

function rrPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function numText(str, x, y, o = {}) {
  ctx.save();
  ctx.font = `${o.family === 'Vazirmatn' ? (o.weight || 700) : '400'} ${o.size || 20}px "${o.family || 'Lalezar'}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  ctx.direction = 'ltr';
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  if (o.stroke) {
    ctx.lineWidth = o.strokeWidth || 6; ctx.lineJoin = 'round';
    ctx.strokeStyle = o.stroke; ctx.strokeText(str, x, y);
  }
  ctx.fillStyle = o.color || P.ink;
  ctx.fillText(str, x, y);
  ctx.restore();
}

function spot(rects, alpha) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, SCENE_W, SCENE_H);
  for (const r of rects) rrPath(r.x - 12, r.y - 12, r.w + 24, r.h + 24, 22);
  ctx.fillStyle = `rgba(10, 6, 3, ${alpha})`;
  ctx.fill('evenodd');
  ctx.restore();
}

function pointHand(x, y) {
  const bob = Math.sin(S.t * 3.4) * 8;
  ctx.save();
  ctx.translate(x, y + bob);
  withShadow(12, 5, .45, () => {
    ctx.fillStyle = '#f6dfc0';
    ctx.beginPath();
    ctx.moveTo(0, -6);
    ctx.quadraticCurveTo(-9, -2, -10, 16);
    ctx.quadraticCurveTo(-11, 34, 0, 36);
    ctx.quadraticCurveTo(11, 34, 10, 16);
    ctx.quadraticCurveTo(9, -2, 0, -6);
    ctx.closePath(); ctx.fill();
    wobbleCircle(0, -12, 8, 4, 1); ctx.fill();
  });
  ctx.strokeStyle = '#c9a982'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-7, 18); ctx.lineTo(7, 18); ctx.stroke();
  ctx.restore();
}

/** شعلهٔ شمع — می‌لرزد، پس صحنه زنده است. */
function flame(x, y, s, seed) {
  const w = Math.sin(S.t * 7 + seed) * 1.4;
  const hh = 1 + Math.sin(S.t * 11 + seed * 2) * .12;
  const g = ctx.createRadialGradient(x, y - 6 * s, 1, x, y - 6 * s, 44 * s);
  g.addColorStop(0, 'rgba(255, 206, 120, .45)');
  g.addColorStop(1, 'rgba(255, 206, 120, 0)');
  ctx.fillStyle = g;
  ctx.fillRect(x - 44 * s, y - 50 * s, 88 * s, 88 * s);
  ctx.fillStyle = P.flame;
  ctx.beginPath();
  ctx.moveTo(x + w, y - 20 * s * hh);
  ctx.quadraticCurveTo(x + 6 * s, y - 6 * s, x, y);
  ctx.quadraticCurveTo(x - 6 * s, y - 6 * s, x + w, y - 20 * s * hh);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = P.flameHot;
  ctx.beginPath();
  ctx.moveTo(x + w * .5, y - 12 * s * hh);
  ctx.quadraticCurveTo(x + 3 * s, y - 4 * s, x, y - 1 * s);
  ctx.quadraticCurveTo(x - 3 * s, y - 4 * s, x + w * .5, y - 12 * s * hh);
  ctx.closePath(); ctx.fill();
}

function gem(x, y, r, col, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot || 0);
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(0, -r);
  ctx.lineTo(r * .82, -r * .2);
  ctx.lineTo(r * .5, r * .85);
  ctx.lineTo(-r * .5, r * .85);
  ctx.lineTo(-r * .82, -r * .2);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.34)';
  ctx.beginPath();
  ctx.moveTo(0, -r); ctx.lineTo(r * .82, -r * .2); ctx.lineTo(0, 0);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(r * .5, r * .85); ctx.lineTo(-r * .5, r * .85);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* ───────── صحنه ───────── */

function draw() {
  beginScene('#17110c');
  ctx.save();
  if (S.shake > 0) {
    const k = S.shake * 15;
    ctx.translate(Math.sin(S.t * 62) * k, Math.cos(S.t * 49) * k * .6);
  }

  drawCellar();
  drawRack();
  drawLedger();
  drawLockRow();
  drawChest();
  if (S.phase === 'play' || S.phase === 'lost') { drawDials(); drawTryButton(); }
  drawFly();
  drawMotes();
  bits.draw();
  drawFloats();
  ctx.restore();

  drawHUD();
  if (!(S.phase === 'play' && S.tut.on)) {
    ctx.save();
    ctx.translate(CH.x + CH.w / 2 - SCENE_W / 2, 0); // پیام بالای صندوق، نه روی دفتر
    toast.draw(HUD_H + 10, { good: P.good, bad: P.bad, info: P.parch, ink: P.ink });
    ctx.restore();
  }

  if (S.phase === 'play' && S.tut.on) drawTutorial();
  if (S.phase === 'intro') drawIntro();
  if (S.phase === 'won') drawWon();
  if (S.phase === 'lost') drawLost();

  endScene(.14, 'rgba(6, 2, 0, .66)');
}

function drawCellar() {
  const g = ctx.createLinearGradient(150, 220, 980, 780);
  g.addColorStop(0, P.wallHi);
  g.addColorStop(.5, P.wallMid);
  g.addColorStop(1, P.wallLo);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, SCENE_W, SCENE_H);

  /* سنگ‌های دیوار */
  ctx.save();
  ctx.strokeStyle = P.mortar; ctx.lineWidth = 4;
  for (let r = 0; r < 11; r++) {
    const y = 40 + r * 66;
    ctx.globalAlpha = .5;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(SCENE_W, y); ctx.stroke();
    for (let c = 0; c < 9; c++) {
      const x = (r % 2 ? 74 : 0) + c * 148;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 66); ctx.stroke();
    }
    /* نورِ لبهٔ بالاییِ سنگ‌ها — از بالا-چپ می‌تابد */
    ctx.globalAlpha = .07;
    ctx.strokeStyle = '#ffe0ac';
    ctx.beginPath(); ctx.moveTo(0, y + 3); ctx.lineTo(SCENE_W, y + 3); ctx.stroke();
    ctx.strokeStyle = P.mortar;
  }
  ctx.restore();

  /* طاقِ آجریِ پشتِ صندوق */
  ctx.save();
  ctx.globalAlpha = .55;
  ctx.fillStyle = P.wallLo;
  ctx.beginPath();
  ctx.moveTo(CH.x - 66, SCENE_H);
  ctx.lineTo(CH.x - 66, 250);
  ctx.quadraticCurveTo(CH.x + CH.w / 2, 66, CH.x + CH.w + 66, 250);
  ctx.lineTo(CH.x + CH.w + 66, SCENE_H);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  /* تارِ عنکبوت گوشهٔ بالا-راست */
  ctx.save();
  ctx.strokeStyle = 'rgba(238, 226, 200, .12)'; ctx.lineWidth = 1.4;
  for (let i = 1; i <= 5; i++) {
    ctx.beginPath();
    ctx.arc(SCENE_W, HUD_H, i * 34, Math.PI * .5, Math.PI);
    ctx.stroke();
  }
  for (let i = 0; i <= 5; i++) {
    const a = Math.PI * .5 + (Math.PI * .5) * (i / 5);
    ctx.beginPath();
    ctx.moveTo(SCENE_W, HUD_H);
    ctx.lineTo(SCENE_W + Math.cos(a) * 174, HUD_H + Math.sin(a) * 174);
    ctx.stroke();
  }
  ctx.restore();

  /* هالهٔ نورِ گرم از بالا-چپ */
  const gl = ctx.createRadialGradient(180, 330, 24, 180, 330, 540);
  gl.addColorStop(0, 'rgba(255, 186, 92, .34)');
  gl.addColorStop(.38, 'rgba(255, 186, 92, .10)');
  gl.addColorStop(1, 'rgba(255, 186, 92, 0)');
  ctx.fillStyle = gl;
  ctx.fillRect(0, 0, SCENE_W, SCENE_H);

  const g2 = ctx.createRadialGradient(CH.x + CH.w / 2, CH.y + 150, 40, CH.x + CH.w / 2, CH.y + 150, 430);
  g2.addColorStop(0, 'rgba(255, 198, 110, .17)');
  g2.addColorStop(1, 'rgba(255, 198, 110, 0)');
  ctx.fillStyle = g2;
  ctx.fillRect(0, 0, SCENE_W, SCENE_H);

  /* کف */
  ctx.fillStyle = P.floor;
  ctx.fillRect(0, 668, SCENE_W, SCENE_H - 668);
  ctx.strokeStyle = '#1a1209'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, 668); ctx.lineTo(SCENE_W, 668); ctx.stroke();
  for (let i = 0; i < 9; i++) {
    ctx.beginPath();
    ctx.moveTo(i * 150 - 40, 668); ctx.lineTo(i * 150 - 110, SCENE_H); ctx.stroke();
  }

  /* خمره‌های گوشه — سالن نباید خالی باشد */
  for (const u of [{ x: 78, y: 690, r: 46 }, { x: 168, y: 706, r: 34 }]) {
    withShadow(16, 8, .4, () => {
      ctx.fillStyle = P.woodDk;
      wobbleEllipse(u.x, u.y, u.r, u.r * .95, 0, u.x, 1.6); ctx.fill();
    }, '10, 5, 0');
    ctx.fillStyle = P.wood;
    wobbleEllipse(u.x - 5, u.y - 6, u.r * .82, u.r * .78, 0, u.x + 2, 1.4); ctx.fill();
    ctx.fillStyle = P.woodDk;
    wobbleEllipse(u.x, u.y - u.r * .78, u.r * .5, u.r * .18, 0, u.x + 4, 1); ctx.fill();
  }
}

/* ───────── شمعدان = تعدادِ امتحان‌های باقی‌مانده ───────── */

function drawRack() {
  const n = S.triesMax || 1;
  const rows = n > 11 ? 2 : 1;
  const perRow = Math.ceil(n / rows);
  const gap = Math.min(25, (RACK.w - 26) / Math.max(1, perRow - 1));

  /* میلهٔ چوبیِ شمعدان */
  for (let r = 0; r < rows; r++) {
    const inRow = Math.min(perRow, n - r * perRow);
    const wRow = (inRow - 1) * gap + 26;
    const x0 = RACK.x + RACK.w / 2 - wRow / 2;
    const y = RACK.y + r * 96;
    ctx.fillStyle = P.brassDk;
    wobbleRect(x0 - 6, y + 44, wRow + 12, 11, 4, r * 3 + 1, 1); ctx.fill();
    ctx.fillStyle = P.brass;
    wobbleRect(x0 - 6, y + 42, wRow + 12, 6, 3, r * 3 + 2, .8); ctx.fill();
  }

  for (let i = 0; i < n; i++) {
    const r = Math.floor(i / perRow), c = i % perRow;
    const inRow = Math.min(perRow, n - r * perRow);
    const wRow = (inRow - 1) * gap + 26;
    const x = RACK.x + RACK.w / 2 - wRow / 2 + 13 + c * gap;
    const y = RACK.y + r * 96 + 44;
    const alive = i < S.tries;
    const h = alive ? 34 : 9;
    ctx.fillStyle = alive ? P.wax : P.waxDk;
    wobbleRect(x - 5, y - h, 10, h, 2, i * 2 + 5, .7); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    wobbleRect(x + 1, y - h, 4, h, 2, i * 2 + 6, .6); ctx.fill();
    if (alive) flame(x, y - h - 2, .9, i * 1.7);
    else {
      ctx.save();
      ctx.globalAlpha = .22;
      ctx.strokeStyle = '#cbbba3'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x, y - h - 2);
      ctx.quadraticCurveTo(x + Math.sin(S.t * 1.4 + i) * 8, y - h - 20, x + 4, y - h - 36);
      ctx.stroke();
      ctx.restore();
    }
  }
  text(`شمع‌های باقی‌مانده: ${fa(S.tries)}`, RACK.x + RACK.w / 2, RACK.y - 22,
    { size: 17, color: '#e8d5ae' });
}

/* ───────── ردیفِ قفل‌ها = تعدادِ همهٔ حالت‌ها ───────── */

function drawLockRow() {
  const n = totalCombos();
  for (let i = 0; i < n; i++) {
    const p = lockPos(i);
    const open = i < S.found.length;
    const pop = open && S.found.length - 1 === i && S.fly ? 1 + (1 - S.fly.t) * .4 : 1;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(pop, pop);
    ctx.fillStyle = open ? P.brassLit : P.iron;
    wobbleRect(-9, -4, 18, 15, 3, i * 3 + 1, .7); ctx.fill();
    ctx.strokeStyle = open ? P.brassLit : P.ironLit;
    ctx.lineWidth = 3.2; ctx.lineCap = 'round';
    ctx.beginPath();
    if (open) { ctx.arc(3, -6, 6, Math.PI * .9, Math.PI * 2.1); }
    else { ctx.arc(0, -5, 6, Math.PI, TAU); }
    ctx.stroke();
    if (open) { ctx.fillStyle = P.brassDk; ctx.beginPath(); ctx.arc(0, 4, 2.2, 0, TAU); ctx.fill(); }
    ctx.restore();
  }
}

/* ───────── صندوقچه ───────── */

function drawChest() {
  const lid = easeOut(S.lidT);
  /* درونِ صندوق وقتی در باز می‌شود */
  if (lid > .02) {
    ctx.fillStyle = '#120c06';
    wobbleRect(CH.x + 14, CH.y - 6, CH.w - 28, 90, 8, 3, 1.4); ctx.fill();
    for (let i = 0; i < 16; i++) {
      const a = noise1(i * 3.3);
      gem(CH.x + 40 + a * (CH.w - 80), CH.y + 34 + noise1(i * 7.1) * 44,
        9 + noise1(i * 5) * 7, P.gem[i % P.gem.length], noise1(i) * TAU);
    }
    const gl = ctx.createRadialGradient(CH.x + CH.w / 2, CH.y + 40, 8, CH.x + CH.w / 2, CH.y + 40, 260);
    gl.addColorStop(0, `rgba(255, 214, 120, ${.34 * lid})`);
    gl.addColorStop(1, 'rgba(255, 214, 120, 0)');
    ctx.fillStyle = gl;
    ctx.fillRect(CH.x - 150, CH.y - 150, CH.w + 300, 400);
  }

  /* درِ صندوق */
  ctx.save();
  ctx.translate(CH.x + CH.w / 2, CH.y + 8);
  ctx.rotate(-lid * 1.05);
  ctx.translate(-(CH.x + CH.w / 2), -(CH.y + 8));
  withShadow(22, 10, .5, () => {
    ctx.fillStyle = P.wood;
    ctx.beginPath();
    ctx.moveTo(CH.x + 6, CH.y + 12);
    ctx.quadraticCurveTo(CH.x + CH.w / 2, CH.y - 54, CH.x + CH.w - 6, CH.y + 12);
    ctx.lineTo(CH.x + CH.w - 6, CH.y + 20);
    ctx.lineTo(CH.x + 6, CH.y + 20);
    ctx.closePath(); ctx.fill();
  }, '10, 5, 0');
  ctx.fillStyle = P.woodLit;
  ctx.beginPath();
  ctx.moveTo(CH.x + 6, CH.y + 12);
  ctx.quadraticCurveTo(CH.x + CH.w / 2, CH.y - 54, CH.x + CH.w - 6, CH.y + 12);
  ctx.quadraticCurveTo(CH.x + CH.w / 2, CH.y - 44, CH.x + 6, CH.y + 12);
  ctx.closePath(); ctx.fill();
  for (const dx of [70, CH.w / 2, CH.w - 70]) {
    ctx.fillStyle = P.iron;
    ctx.beginPath();
    ctx.moveTo(CH.x + dx - 8, CH.y + 20);
    ctx.quadraticCurveTo(CH.x + dx, CH.y - 44, CH.x + dx + 8, CH.y + 20);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  /* بدنه */
  withShadow(26, 12, .5, () => {
    ctx.fillStyle = P.wood;
    wobbleRect(CH.x, CH.y + 18, CH.w, CH.h - 18, 12, 7, 2); ctx.fill();
  }, '10, 5, 0');
  ctx.fillStyle = P.woodLit;
  wobbleRect(CH.x, CH.y + 18, 9, CH.h - 18, 5, 71, 1); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  wobbleRect(CH.x + CH.w - 16, CH.y + 18, 16, CH.h - 18, 5, 73, 1); ctx.fill();

  /* تخته‌های چوب */
  ctx.save();
  ctx.globalAlpha = .3;
  ctx.strokeStyle = P.woodDk; ctx.lineWidth = 3;
  for (let i = 1; i < 5; i++) {
    const y = CH.y + 18 + i * (CH.h - 18) / 5;
    ctx.beginPath(); ctx.moveTo(CH.x + 6, y); ctx.lineTo(CH.x + CH.w - 6, y); ctx.stroke();
  }
  ctx.restore();
  /* بندهای آهنی */
  for (const dx of [46, CH.w - 46]) {
    ctx.fillStyle = P.iron;
    wobbleRect(CH.x + dx - 13, CH.y + 18, 26, CH.h - 18, 3, dx, 1); ctx.fill();
    ctx.fillStyle = P.ironLit;
    wobbleRect(CH.x + dx - 13, CH.y + 18, 8, CH.h - 18, 3, dx + 1, 1); ctx.fill();
    for (let i = 0; i < 5; i++) {
      ctx.fillStyle = P.ironLit;
      ctx.beginPath(); ctx.arc(CH.x + dx, CH.y + 40 + i * 58, 3.4, 0, TAU); ctx.fill();
    }
  }
  /* صفحهٔ برنجیِ قفل که چرخ‌ها رویش‌اند */
  const fx = CH.x + 76, fw = CH.w - 152;
  withShadow(14, 6, .4, () => {
    ctx.fillStyle = P.brassDk;
    wobbleRect(fx - 8, CH.y + 44, fw + 16, 196, 10, 21, 1.4); ctx.fill();
  }, '10, 5, 0');
  ctx.fillStyle = P.brass;
  wobbleRect(fx - 4, CH.y + 48, fw + 8, 188, 8, 23, 1.2); ctx.fill();
  ctx.fillStyle = P.brassLit;
  wobbleRect(fx - 4, CH.y + 48, fw + 8, 7, 3, 25, .8); ctx.fill();
  for (const cx of [fx - 4, fx + fw + 4]) for (const cy of [CH.y + 56, CH.y + 228]) {
    ctx.fillStyle = P.brassDk;
    ctx.beginPath(); ctx.arc(cx + (cx < CH.x + CH.w / 2 ? 8 : -8), cy, 4, 0, TAU); ctx.fill();
  }

  /* گردِ بی‌فایده وقتی تکراری زده‌ای */
  if (S.puff > 0) {
    ctx.save();
    ctx.globalAlpha = S.puff * .8;
    ctx.fillStyle = 'rgba(120, 100, 74, .6)';
    for (let i = 0; i < 7; i++) {
      const k = 1 - S.puff;
      wobbleCircle(CH.x + CH.w / 2 + (i - 3) * 26, CH.y + CH.h - 30 - k * 60,
        14 + k * 22, i * 3, 1.4);
      ctx.fill();
    }
    ctx.restore();
  }
}

/* ───────── چرخ‌های رقم ───────── */

function drawDials() {
  const n = nDials();
  for (let k = 0; k < n; k++) {
    const b = dialBox(k), d = dials()[k];
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    const hotUp = S.hover && S.hover.dial === k && S.hover.dir === -1;
    const hotDn = S.hover && S.hover.dial === k && S.hover.dir === 1;
    const locked = d.length < 2;

    /* بدنهٔ چرخ */
    ctx.fillStyle = '#1a130c';
    wobbleRect(b.x, b.y, b.w, b.h, 10, b.x, 1.2); ctx.fill();
    ctx.save();
    ctx.beginPath(); rrPath(b.x + 4, b.y + 4, b.w - 8, b.h - 8, 8); ctx.clip();
    const gg = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
    gg.addColorStop(0, '#0e0a06');
    gg.addColorStop(.5, locked ? '#4a3f33' : '#5d4c36');
    gg.addColorStop(1, '#0e0a06');
    ctx.fillStyle = gg;
    ctx.fillRect(b.x + 4, b.y + 4, b.w - 8, b.h - 8);

    /* رقم‌ها: قبلی بالا، فعلی وسط، بعدی پایین */
    const off = S.spin[k] * 56;
    for (const s of [-1, 0, 1]) {
      const idx = (S.sel[k] + s + d.length * 4) % d.length;
      const y = cy + s * 56 + off;
      ctx.globalAlpha = s === 0 ? 1 : .3;
      numText(fa(d[idx]), cx, y, { size: s === 0 ? 58 : 40, color: '#f6e5c2' });
    }
    ctx.globalAlpha = 1;
    /* خط‌های شیشه */
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    for (let i = 0; i < 9; i++) ctx.fillRect(b.x + 4, b.y + 8 + i * 17, b.w - 8, 2);
    ctx.restore();

    /* قابِ برنجی و دندانه‌های کناری */
    ctx.strokeStyle = locked ? P.brassDk : P.brass;
    ctx.lineWidth = 5;
    ctx.beginPath(); rrPath(b.x + 3, b.y + 3, b.w - 6, b.h - 6, 9); ctx.stroke();
    ctx.fillStyle = locked ? P.brassDk : P.brassLit;
    for (let i = 0; i < 7; i++) {
      const y = b.y + 16 + i * 20;
      wobbleRect(b.x - 7, y, 8, 11, 2, i + b.x, .6); ctx.fill();
      wobbleRect(b.x + b.w - 1, y, 8, 11, 2, i + b.x + 1, .6); ctx.fill();
    }

    /* پیکان‌های بالا و پایین */
    if (!locked) {
      for (const [dir, hot] of [[-1, hotUp], [1, hotDn]]) {
        const y = dir < 0 ? b.y - 19 : b.y + b.h + 19;
        ctx.fillStyle = hot ? P.brassLit : P.brassDk;
        ctx.beginPath();
        ctx.moveTo(cx, y + dir * 12);
        ctx.lineTo(cx - 17, y - dir * 8);
        ctx.lineTo(cx + 17, y - dir * 8);
        ctx.closePath(); ctx.fill();
      }
    } else {
      text('ثابت', cx, b.y + b.h + 16, { size: 13, color: 'rgba(240, 220, 180, .5)' });
    }

    text(placeName(n, k), cx, b.y + b.h + 42, { size: 15, color: '#e8d5ae' });
  }
}

function drawTryButton() {
  button(BTN_TRY, 'امتحان کن', {
    hot: S.hover === BTN_TRY, fill: '#8d6624', hotFill: '#a87c2f', size: 28,
  });
}

/* ───────── دفترِ گنج ───────── */

function drawLedger() {
  const b = LEDGER;
  ctx.save();
  ctx.rotate(-.006);
  withShadow(22, 10, .45, () => {
    ctx.fillStyle = P.parch;
    wobbleRect(b.x, b.y, b.w, b.h, 8, 61, 3); ctx.fill();
  }, '10, 5, 0');
  /* لکه‌های کهنگی */
  ctx.globalAlpha = .12;
  ctx.fillStyle = '#9a7c4a';
  for (let i = 0; i < 7; i++) {
    wobbleCircle(b.x + 30 + noise1(i * 4.1) * (b.w - 60), b.y + 30 + noise1(i * 8.3) * (b.h - 60),
      18 + noise1(i * 2) * 34, i * 3, 2.4);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  /* میخِ بالا */
  ctx.fillStyle = P.iron;
  ctx.beginPath(); ctx.arc(b.x + b.w / 2, b.y + 12, 7, 0, TAU); ctx.fill();
  ctx.fillStyle = P.ironLit;
  ctx.beginPath(); ctx.arc(b.x + b.w / 2 - 2, b.y + 10, 3, 0, TAU); ctx.fill();

  text('دفترِ گنج', b.x + 84, b.y + 40, { size: 24, family: 'Lalezar', color: P.ink });
  text(`${fa(S.found.length)} از ${fa(totalCombos())}`, b.x + 84, b.y + 68,
    { size: 16, color: P.inkSoft });

  /* اهرمِ مرتّب‌سازی */
  if (S.level >= 1) {
    button(BTN_SORT, S.sorted ? 'مرتّب ✓' : 'مرتّب کن', {
      hot: S.hover === BTN_SORT, fill: S.sorted ? '#7f6a33' : '#8d6624',
      hotFill: '#a87c2f', size: 18, r: 10, family: 'Vazirmatn',
    });
  }

  /* خانه‌های خالی و پُر */
  const list = ledgerList();
  for (let i = 0; i < totalCombos(); i++) {
    const t = tileBox(i);
    ctx.save();
    if (i < list.length) {
      ctx.fillStyle = '#e2cf9f';
      wobbleRect(t.x, t.y, t.w, t.h, 7, i * 3 + 1, 1); ctx.fill();
      ctx.strokeStyle = P.parchDk; ctx.lineWidth = 2;
      ctx.beginPath(); rrPath(t.x, t.y, t.w, t.h, 7); ctx.stroke();
      gem(t.x + 17, t.y + t.h / 2, 9, P.gem[i % P.gem.length], .2);
      numText(fa(list[i]), t.x + t.w / 2 + 10, t.y + t.h / 2, { size: 27, color: P.ink });
    } else {
      ctx.globalAlpha = .35;
      ctx.strokeStyle = P.parchDk; ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]);
      ctx.beginPath(); rrPath(t.x, t.y, t.w, t.h, 7); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.restore();
  }
  ctx.restore();
}

function drawFly() {
  if (!S.fly) return;
  const k = easeOut(S.fly.t);
  const x = lerp(S.fly.from.x, S.fly.to.x + S.fly.to.w / 2, k);
  const y = lerp(S.fly.from.y, S.fly.to.y + S.fly.to.h / 2, k) - Math.sin(k * Math.PI) * 90;
  gem(x, y, lerp(20, 9, k), S.fly.col, S.fly.t * 6);
}

function drawMotes() {
  ctx.save();
  for (const m of S.motes) {
    ctx.globalAlpha = .06 + .12 * (.5 + .5 * Math.sin(m.ph * 2));
    ctx.fillStyle = P.dust;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawFloats() {
  for (const f of S.floats) {
    const k = clamp(1 - f.t / 1.5, 0, 1);
    text(f.txt, f.x, f.y, { size: f.size, color: f.col, alpha: k, family: 'Lalezar',
      stroke: 'rgba(20, 10, 0, .55)', strokeWidth: 5 });
  }
}

/* ───────── نوارِ بالا ───────── */

function drawHUD() {
  ctx.fillStyle = 'rgba(20, 13, 7, .78)';
  ctx.fillRect(0, 0, SCENE_W, HUD_H);
  ctx.fillStyle = 'rgba(201, 151, 63, .5)';
  ctx.fillRect(0, HUD_H - 3, SCENE_W, 3);

  text(L().name, SCENE_W - 26, HUD_H / 2, { size: 20, family: 'Lalezar', color: '#f0dcb4', align: 'right' });
  text(`صندوقِ ${fa(S.level + 1)} از ${fa(LEVELS.length)}`, SCENE_W - 168, HUD_H / 2,
    { size: 15, color: 'rgba(240, 220, 180, .6)', align: 'right' });

  numText(fa(S.score), 26, HUD_H / 2 - 1, { size: 26, color: P.gold, align: 'left' });
  text(`رکورد ${fa(S.best)}`, 108, HUD_H / 2, { size: 14, color: 'rgba(240, 220, 180, .55)', align: 'left' });
  if (S.wasted > 0) {
    text(`دوباره‌کاری: ${fa(S.wasted)}`, 214, HUD_H / 2,
      { size: 15, color: '#dd8a72', align: 'left' });
  }
  if (S.streak >= 2) {
    text(`${fa(S.streak)} تای پشتِ هم`, SCENE_W / 2, HUD_H / 2, { size: 16, color: P.good });
  }
}

/* ───────── آموزش ───────── */

function drawTutorial() {
  const st = S.tut.step;
  let holes = [], msg = '', hand = null;
  const b0 = dialBox(0), bn = dialBox(nDials() - 1);

  if (st === 0) {
    const n = totalCombos(), perRow = Math.min(n, 9);
    holes = [{ x: CH.x + CH.w / 2 - perRow * 15 - 10, y: LOCKROW_Y - Math.ceil(n / perRow) * 30 - 4,
               w: perRow * 30 + 20, h: Math.ceil(n / perRow) * 30 + 34 }];
    msg = 'این صندوق به تعدادِ همهٔ عددهایی که می‌شود ساخت قفل دارد. باید همه را باز کنی.';
  } else if (st === 1) {
    holes = [{ x: b0.x - 24, y: b0.y - 34, w: bn.x + bn.w - b0.x + 48, h: b0.h + 68 },
             { x: BTN_TRY.x - 8, y: BTN_TRY.y - 8, w: BTN_TRY.w + 16, h: BTN_TRY.h + 16 }];
    msg = 'روی بالا یا پایینِ هر چرخ بزن تا رقمش عوض شود، بعد امتحان کن.';
    hand = { x: bn.x + bn.w / 2, y: bn.y + bn.h + 44 };
  } else {
    holes = [{ x: RACK.x - 10, y: RACK.y - 40, w: RACK.w + 20, h: 120 },
             { x: LEDGER.x - 6, y: LEDGER.y - 6, w: LEDGER.w + 12, h: 210 }];
    msg = 'هر امتحان یک شمع می‌سوزاند، حتی اگر تکراری باشد. دفتر یادت می‌آورد چه باز کرده‌ای.';
  }

  spot(holes, .58);
  const w = 500, h = 92, x = CH.x + CH.w / 2 - w / 2, y = HUD_H + 14;
  paper(x, y, w, h, P.parch, 41, 12, .45);
  ctx.fillStyle = P.brass;
  wobbleRect(x, y, 9, h, 4, 43, .8); ctx.fill();
  textWrap(msg, x + w / 2 + 6, y + h / 2 - 12, w - 54, { size: 18, color: P.ink, lineHeight: 27 });
  if (TUT_TAP.indexOf(st) >= 0) tutMore(x + w / 2, y + h + 14, S.t, P.ink);
  if (hand) pointHand(hand.x, hand.y);
}

/* ───────── پرده‌ها ───────── */

function chestIcon(x, y) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = P.wood;
  wobbleRect(-34, -8, 68, 34, 6, 3, 1.2); ctx.fill();
  ctx.fillStyle = P.woodLit;
  ctx.beginPath();
  ctx.moveTo(-34, -8); ctx.quadraticCurveTo(0, -40, 34, -8);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = P.brass;
  wobbleRect(-8, -2, 16, 18, 3, 5, .8); ctx.fill();
  ctx.fillStyle = P.brassDk;
  ctx.beginPath(); ctx.arc(0, 6, 3.4, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawIntro() {
  overlay({
    t: S.phaseT,
    w: 740, h: 350, y: 168,
    title: 'صندوقچهٔ گنج',
    body: 'هر چرخ فقط چند رقمِ مشخّص دارد. همهٔ عددهایی را که می‌شود ساخت پیدا کن\nتا همهٔ قفل‌ها باز شوند. امّا شمع‌ها شمرده‌اند.',
    btn: BTN_GO, btnHot: S.hover === BTN_GO, btnLabel: 'برویم پایین',
    paper: P.parch, band: P.brass, ink: P.ink, inkSoft: P.inkSoft,
    btnFill: '#8d6624', btnHotFill: '#a87c2f',
    icon: chestIcon,
  });
}

function drawWon() {
  const last = S.level + 1 >= LEVELS.length;
  const stars = S.wasted === 0 ? 3 : (S.wasted <= 2 ? 2 : 1);
  overlay({
    t: S.phaseT,
    w: 720, h: 320, y: 190,
    title: last ? 'همهٔ صندوق‌ها باز شد!' : 'صندوق باز شد!',
    body: S.wasted === 0
      ? `بدون حتّی یک دوباره‌کاری. امتیازت ${fa(S.score)} شد.`
      : `${fa(S.wasted)} بار تکراری زدی. امتیازت ${fa(S.score)} شد.`,
    btn: BTN_GO, btnHot: S.hover === BTN_GO,
    btnLabel: last ? 'از اوّل' : 'صندوقِ بعدی',
    paper: P.parch, band: P.good, ink: P.ink, inkSoft: P.inkSoft,
    btnFill: '#8d6624', btnHotFill: '#a87c2f',
    icon: (x, y) => {
      for (let i = 0; i < 3; i++) {
        star(x + (i - 1) * 46, y + 6, i < stars ? 22 : 15,
          i < stars ? P.gold : 'rgba(120, 100, 70, .4)', Math.sin(S.t * 2 + i) * .15);
      }
    },
  });
}

function drawLost() {
  overlay({
    t: S.phaseT,
    w: 720, h: 320, y: 200,
    title: 'شمع‌ها تمام شد',
    body: `${fa(S.found.length)} قفل از ${fa(totalCombos())} باز شد. این بار با نظم برو تا تکراری نزنی.`,
    btn: BTN_GO, btnHot: S.hover === BTN_GO, btnLabel: 'دوباره',
    paper: P.parch, band: P.bad, ink: P.ink, inkSoft: P.inkSoft,
    btnFill: '#c2503f', btnHotFill: '#d05f4d',
    icon: (x, y) => {
      ctx.fillStyle = P.waxDk;
      wobbleRect(x - 6, y - 4, 12, 22, 3, 9, .8); ctx.fill();
      ctx.save();
      ctx.globalAlpha = .35;
      ctx.strokeStyle = '#cbbba3'; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x, y - 6);
      ctx.quadraticCurveTo(x + Math.sin(S.t * 1.6) * 12, y - 26, x + 6, y - 44);
      ctx.stroke();
      ctx.restore();
    },
  });
}
