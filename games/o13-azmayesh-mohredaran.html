<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2f2116">
<title>پنج گروهِ مهره‌داران — هر کدام جای خود ۲ (آزمایش)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>
  /* صفحه نباید هیچ‌جا اسکرول یا زوم شود؛ بازی باید مثل یک برنامه رفتار کند. */
  html, body {
    margin: 0; padding: 0; background: #2f2116;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body {
    position: fixed; inset: 0;          /* جلوی کشیده‌شدنِ صفحه در سافاریِ گوشی */
    width: 100%; height: 100vh; height: 100dvh;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none; -webkit-touch-callout: none;
  }

  /* گوشیِ عمودی صحنه را ریز می‌کند؛ بچه باید گوشی را بچرخاند. */
  #rotate { display: none; }
  @media (orientation: portrait) and (max-width: 860px) {
    #stage { display: none; }
    #rotate {
      display: flex; position: fixed; inset: 0;
      z-index: 9;
      flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      background: #2f2116; color: #f6ead2;
      font: 700 20px "Vazirmatn", Tahoma, sans-serif; text-align: center; padding: 32px;
    }
    #rotate svg { animation: tilt 2.4s ease-in-out infinite; }
    @keyframes tilt { 0%, 45% { transform: rotate(0deg); } 65%, 100% { transform: rotate(-90deg); } }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="rotate">
  <svg width="86" height="126" viewBox="0 0 86 126" fill="none" aria-hidden="true">
    <rect x="3" y="3" width="80" height="120" rx="12" stroke="#e8b448" stroke-width="5"/>
    <rect x="15" y="19" width="56" height="88" rx="5" fill="#e8b448" opacity=".28"/>
    <circle cx="43" cy="115" r="4" fill="#e8b448"/>
  </svg>
  <div>گوشی را بچرخان</div>
  <div style="font-weight:400;opacity:.7;font-size:16px">این بازی خوابیده بازی می‌شود</div>
</div>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   هستهٔ مشترکِ بازی‌ها — سبک «کاغذبُری»
   ───────────────────────────────────────────────────────────────────────
   این فایل جعبه‌ابزار است، نه چارچوب: هر بازی حلقه و وضعیت خودش را دارد
   و فقط از این توابع برای کشیدن استفاده می‌کند. دلیلش این است که هر بازی
   باید حس‌وحال خودش را داشته باشد، نه اینکه همه شبیه هم دربیایند.

   قاعده‌های ثابتِ تصویری:
   • نور همیشه از بالا-چپ می‌تابد، پس سایه‌ها به پایین-راست می‌افتند.
   • هیچ لبه‌ای کاملاً صاف نیست؛ همه کمی موج دارند (انگار با قیچی بریده).
   • هیچ خاکستریِ خالصی نداریم؛ همه‌ی خنثی‌ها به گرمیِ صحنه می‌زنند.
   • یک لایه‌ی دانه‌دانه‌ی کاغذ روی کلِ تصویر ضرب می‌شود.
   ═══════════════════════════════════════════════════════════════════════ */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const FA_D = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
const fa = (n) => String(n).replace(/\d/g, (d) => FA_D[+d]);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeIn = (t) => t * t * t;
const easeInOut = (t) => (t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2);
const easeBack = (t) => 1 + 2.7 * Math.pow(t-1, 3) + 1.7 * Math.pow(t-1, 2);
const easeElastic = (t) => t === 0 || t === 1 ? t : Math.pow(2, -9*t) * Math.sin((t*10 - .75) * 2.094) + 1;

/** تصادفِ تکرارپذیر: با یک بذر همیشه همان عدد. برای اینکه تزئین‌ها هر فریم نپرند. */
function noise1(x) {
  const s = Math.sin(x * 127.1) * 43758.5453;
  return s - Math.floor(s);
}
const pick = (arr, seed) => arr[Math.floor(noise1(seed) * arr.length) % arr.length];

/* ───────── بوم و صحنهٔ ثابت ───────── */

let ctx, SW, SH, CV, _refit = null;
let view = { scale: 1, ox: 0, oy: 0, w: 0, h: 0, dpr: 1 };
let _grain = null, _grainDark = null;

function initStage(canvas, w, h) {
  CV = canvas; SW = w; SH = h;
  ctx = canvas.getContext('2d');

  /* اندازه را از خودِ بوم می‌گیریم نه از innerHeight؛ چون در سافاریِ گوشی
     نوارِ آدرس باز و بسته می‌شود و innerHeight دروغ می‌گوید. */
  const fit = () => {
    const r = canvas.getBoundingClientRect();
    const vw = Math.round(r.width), vh = Math.round(r.height);
    if (vw < 20 || vh < 20) return;
    const dpr = Math.min(devicePixelRatio || 1, QUALITY > 0 ? 2 : 1);
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    const scale = Math.min(vw / SW, vh / SH);
    view = { scale, ox: (vw - SW*scale)/2, oy: (vh - SH*scale)/2, w: vw, h: vh, dpr };
    _grain = buildGrain();
  };
  _refit = fit;
  addEventListener('resize', fit);
  /* چرخاندنِ گوشی: اندازهٔ درست چند لحظه بعد می‌رسد، پس چندبار اندازه می‌گیریم. */
  addEventListener('orientationchange', () => {
    fit(); setTimeout(fit, 140); setTimeout(fit, 460);
  });
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(canvas);

  /* صدا در گوشی فقط بعد از اوّلین لمس اجازهٔ پخش دارد. */
  const unlock = () => { sfx._c(); removeEventListener('pointerdown', unlock); removeEventListener('touchstart', unlock); };
  addEventListener('pointerdown', unlock, { passive: true });
  addEventListener('touchstart', unlock, { passive: true });
  /* نگه‌داشتنِ انگشت نباید منوی مرورگر را باز کند. */
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  fit();
  return ctx;
}

/** قابِ صحنه را باز می‌کند: بعد از این، مختصات همیشه در فضای SW×SH است. */
function beginScene(bg) {
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, view.w, view.h);
  ctx.save();
  ctx.translate(view.ox, view.oy);
  ctx.scale(view.scale, view.scale);
  ctx.beginPath();
  ctx.rect(0, 0, SW, SH);
  ctx.clip();
}

/* ───────── پوششِ پایانِ قاب ─────────
   دانه‌های کاغذ و تیرگیِ گوشه‌ها هر دو ثابت‌اند و تغییر نمی‌کنند، ولی
   قبلاً هر فریم از نو کشیده می‌شدند: یکی با «multiply» روی کلِّ صفحه و
   یکی با یک گرادیانِ شعاعیِ تازه. اندازه‌گیری نشان داد همین دو تا
   ۱۱ تا ۱۶ میلی‌ثانیه از هر فریم را می‌خوردند — بیشتر از کشیدنِ خودِ
   صحنه. حالا یک بار در یک بومِ جدا پخته می‌شوند و هر فریم فقط یک
   drawImage است.                                                       */

let _ovl = null, _ovlKey = '';

function overlayLayer(grainAlpha, vignette) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const w = Math.max(2, Math.round(SW * q)), h = Math.max(2, Math.round(SH * q));
  const key = w + 'x' + h + '|' + grainAlpha + '|' + vignette;
  if (_ovl && _ovlKey === key) return _ovl;
  let c;
  try {
    c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g2 = c.getContext('2d');
    if (!g2) return null;
    if (_grainDark && grainAlpha > 0) {
      /* همان دانه‌ها، ولی به‌جای multiply به شکلِ سیاهِ کم‌رنگ */
      g2.globalAlpha = clamp(grainAlpha * 1.15, 0, 1);
      g2.fillStyle = g2.createPattern(_grainDark, 'repeat');
      g2.fillRect(0, 0, w, h);
      g2.globalAlpha = 1;
    }
    if (vignette) {
      const g = g2.createRadialGradient(w / 2, h / 2, h * .42, w / 2, h / 2, h * 1.05);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, vignette);
      g2.fillStyle = g;
      g2.fillRect(0, 0, w, h);
    }
  } catch (e) { return null; }
  _ovl = c; _ovlKey = key;
  return c;
}

/** بافتِ کاغذ، تیرگیِ گوشه‌ها، رنگ‌بندی و درخششِ نور را می‌گذارد و قاب را می‌بندد. */
function endScene(grainAlpha = .15, vignette = 'rgba(48,28,14,.30)', bloom = .34, grade = .14) {
  /* درخششِ نور خاموش است. اندازه‌گیری نشان داد هر فریم ۲۱ میلی‌ثانیه
     می‌گیرد — بیشتر از تمامِ کارهای دیگرِ یک فریم روی هم — چون برای
     ساختنش باید کلِّ بوم دوباره خوانده شود. از آن بدتر: متنِ فارسی را
     مه‌آلود می‌کرد و خواندنش را سخت‌تر. بی‌آن، صحنه تمیزتر است. */
  bloom = 0;
  if (QUALITY < 1) { grade = 0; grainAlpha *= .5; }
  if (QUALITY < 2) grade = 0;
  if (grade > 0) {
    /* رنگ‌بندیِ نرم: بالای صحنه گرم‌تر، پایین سردتر — عمق می‌دهد */
    const g = ctx.createLinearGradient(0, 0, 0, SH);
    g.addColorStop(0, `rgba(255, 214, 150, ${grade})`);
    g.addColorStop(.55, 'rgba(255, 255, 255, 0)');
    g.addColorStop(1, `rgba(40, 60, 110, ${grade * .9})`);
    ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalCompositeOperation = 'source-over';
  }
  const ov = (grainAlpha > 0 || vignette) ? overlayLayer(grainAlpha, vignette) : null;
  if (ov) ctx.drawImage(ov, 0, 0, SW, SH);
  ctx.restore();
  bloomPass(bloom);
}

/* ───────── درخششِ نور (bloom) ─────────
   قابِ رسم‌شده را کوچک می‌کنیم، دو بار در خودش ضرب می‌کنیم تا فقط
   روشن‌ها بمانند، محوش می‌کنیم و با حالتِ «lighter» رویش می‌گذاریم.
   نتیجه: چراغ‌ها، شعله‌ها و رنگ‌های روشن نور پخش می‌کنند. */
let _bl, _blc, _bl2, _bl2c, _blNo = false, _blTick = 0;

function bloomPass(amount) {
  if (!amount || _blNo || !CV.width) return;
  /* کوچک‌کردن و بزرگ‌کردنِ دوباره، خودش محو می‌کند — از filter خیلی ارزان‌تر است */
  const W = Math.max(4, Math.round(CV.width * .2)), H = Math.max(4, Math.round(CV.height * .2));
  const W2 = Math.max(2, Math.round(W * .28)), H2 = Math.max(2, Math.round(H * .28));
  try {
    if (!_bl) {
      _bl = document.createElement('canvas'); _blc = _bl.getContext('2d');
      _bl2 = document.createElement('canvas'); _bl2c = _bl2.getContext('2d');
      if (!_blc || !_bl2c) { _blNo = true; return; }
    }
    if (_bl.width !== W || _bl.height !== H) { _bl.width = W; _bl.height = H; }
    if (_bl2.width !== W2 || _bl2.height !== H2) { _bl2.width = W2; _bl2.height = H2; }
    /* ساختنِ نور یک قاب در میان کافی است؛ گذاشتنش هر قاب. */
    _blTick = (_blTick + 1) & 1;
    if (!_blTick) {
      _blc.globalCompositeOperation = 'source-over';
      _blc.clearRect(0, 0, W, H);
      _blc.drawImage(CV, 0, 0, W, H);
      _blc.globalCompositeOperation = 'multiply';
      _blc.drawImage(_bl, 0, 0);
      _blc.drawImage(_bl, 0, 0);
      _blc.globalCompositeOperation = 'source-over';
      _bl2c.clearRect(0, 0, W2, H2);
      _bl2c.drawImage(_bl, 0, 0, W2, H2);
    }

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = amount;
    ctx.drawImage(_bl2, 0, 0, CV.width, CV.height);
    ctx.restore();
  } catch (e) { _blNo = true; }
}

/* ───────── لایهٔ ثابت ─────────
   هرچه در صحنه تکان نمی‌خورد را یک‌بار می‌کشیم و بعد فقط کپی می‌کنیم. */
const _layers = {};
function staticLayer(key, w, h, paint) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const L = _layers[key];
  if (L && L.q === q && L.w === w && L.h === h) return L.cv;
  const off = document.createElement('canvas');
  off.width = Math.max(1, Math.round(w * q));
  off.height = Math.max(1, Math.round(h * q));
  const c = off.getContext('2d');
  c.setTransform(q, 0, 0, q, 0, 0);
  const prev = ctx;
  ctx = c;
  try { paint(); } finally { ctx = prev; }
  _layers[key] = { cv: off, q, w, h };
  return off;
}

/* ───────── نورپردازی و بافت ─────────
   کارِ این‌ها این است که هیچ سطحی «تختِ یک‌رنگ» نماند. */

/** شیبِ عمودی: بالا روشن، پایین تیره. */
function vgrad(y0, y1, top, bot) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, top); g.addColorStop(1, bot);
  return g;
}

/** حجمِ کروی: نور از بالا-چپ، سایه در پایین-راست. */
function ball(cx, cy, r, lit, base, dark) {
  const g = ctx.createRadialGradient(cx - r * .38, cy - r * .42, r * .06, cx, cy, r * 1.06);
  g.addColorStop(0, lit); g.addColorStop(.45, base); g.addColorStop(1, dark);
  return g;
}

/** لبهٔ روشنِ بالا-چپِ یک مسیر — همان «rim light». */
function rim(pathFn, col, w = 2.2) {
  ctx.save();
  ctx.beginPath(); pathFn();
  ctx.clip();
  ctx.beginPath(); pathFn();
  ctx.strokeStyle = col; ctx.lineWidth = w * 2; ctx.lineJoin = 'round';
  ctx.translate(-w * .5, -w * .6);
  ctx.stroke();
  ctx.restore();
}

/** سایهٔ چسبیده به زمین — چیزها را روی سطح می‌نشاند. */
function contact(cx, cy, rx, ry, alpha = .26) {
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
  g.addColorStop(0, `rgba(20, 12, 6, ${alpha})`);
  g.addColorStop(1, 'rgba(20, 12, 6, 0)');
  ctx.save();
  ctx.fillStyle = g;
  ctx.translate(cx, cy); ctx.scale(1, ry / Math.max(rx, ry));
  ctx.beginPath(); ctx.arc(0, 0, Math.max(rx, ry), 0, TAU); ctx.fill();
  ctx.restore();
}

const _tex = {};
/** بافتِ تکرارشونده؛ یک‌بار ساخته و بعد از حافظه خوانده می‌شود. */
function texture(key, w, h, paint) {
  if (_tex[key]) return _tex[key];
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const c = off.getContext('2d');
  paint(c, w, h);
  _tex[key] = ctx.createPattern(off, 'repeat');
  return _tex[key];
}

/** رگهٔ چوب. */
function texWood(base, grain) {
  return texture('w' + base + grain, 120, 120, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = grain; c.lineWidth = 1.4;
    for (let i = 0; i < 9; i++) {
      c.globalAlpha = .18 + noise1(i * 3.1) * .3;
      c.beginPath();
      const y0 = i * 14 + noise1(i) * 6;
      c.moveTo(0, y0);
      for (let x = 0; x <= w; x += 10) c.lineTo(x, y0 + Math.sin(x * .09 + i) * 2.6);
      c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** تارِ پارچه. */
function texCloth(base, thread) {
  return texture('c' + base + thread, 16, 16, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = thread; c.lineWidth = 1; c.globalAlpha = .5;
    for (let i = 0; i < w; i += 4) {
      c.beginPath(); c.moveTo(i, 0); c.lineTo(i, h); c.stroke();
      c.beginPath(); c.moveTo(0, i); c.lineTo(w, i); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** دانه‌های سنگ. */
function texStone(base, spec) {
  return texture('s' + base + spec, 90, 90, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) {
      c.globalAlpha = .05 + noise1(i * 1.7) * .16;
      c.fillStyle = spec;
      const r = .6 + noise1(i * 5.3) * 1.9;
      c.beginPath();
      c.arc(noise1(i * 2.1) * w, noise1(i * 3.7 + 1) * h, r, 0, TAU);
      c.fill();
    }
    c.globalAlpha = 1;
  });
}

/** الیافِ کاغذ. */
function texPaper(base) {
  return texture('p' + base, 100, 100, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 130; i++) {
      c.globalAlpha = .04 + noise1(i * 2.3) * .07;
      c.strokeStyle = i % 2 ? '#ffffff' : '#5a4326';
      c.lineWidth = .9;
      const x = noise1(i * 1.3) * w, y = noise1(i * 4.1 + 2) * h;
      const a = noise1(i * 7.7) * TAU, l = 4 + noise1(i * 9.1) * 12;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

function buildGrain() {
  const s = 260;
  const off = document.createElement('canvas');
  off.width = off.height = s;
  const c = off.getContext('2d');
  const img = c.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    const v = 214 + Math.random() * 41;
    img.data[i*4] = v; img.data[i*4+1] = v; img.data[i*4+2] = v; img.data[i*4+3] = 255;
  }
  c.putImageData(img, 0, 0);
  /* همان دانه‌ها به شکلِ سیاهِ کم‌رنگ، تا بشود بدونِ multiply گذاشتشان */
  const d = document.createElement('canvas');
  d.width = d.height = s;
  const dc = d.getContext('2d');
  const dimg = dc.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    dimg.data[i*4] = 0; dimg.data[i*4+1] = 0; dimg.data[i*4+2] = 0;
    dimg.data[i*4+3] = 255 - img.data[i*4];
  }
  dc.putImageData(dimg, 0, 0);
  _grainDark = d;
  _ovl = null; _ovlKey = '';
  return ctx.createPattern(off, 'repeat');
}

function toStage(e) {
  const r = CV.getBoundingClientRect();
  return {
    x: (e.clientX - r.left - view.ox) / view.scale,
    y: (e.clientY - r.top - view.oy) / view.scale,
  };
}

const inRect = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
const inCircle = (p, b, pad = 0) => Math.hypot(p.x - b.x, p.y - b.y) <= b.r + pad;

/* ───────── قلم‌های کاغذبُری ───────── */

/** دایره‌ای که انگار با قیچی بریده شده. */
function wobbleCircle(cx, cy, r, seed = 0, amp = 2.2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const rr = r + Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp * .45;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** بیضیِ ناصاف — برای چیزهایی که گرد نیستند ولی نرم‌اند. */
function wobbleEllipse(cx, cy, rx, ry, rot = 0, seed = 0, amp = 2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const w = 1 + (Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp*.45) / Math.max(rx, ry);
    const px = Math.cos(a) * rx * w, py = Math.sin(a) * ry * w;
    const x = cx + px*Math.cos(rot) - py*Math.sin(rot);
    const y = cy + px*Math.sin(rot) + py*Math.cos(rot);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** مستطیلِ گِرد با گوشه‌های کمی کج. */
function wobbleRect(x, y, w, h, r = 12, seed = 0, amp = 1.6) {
  const j = (k) => (noise1(seed*9.7 + k) - .5) * amp * 2;
  ctx.beginPath();
  ctx.moveTo(x + r + j(1), y + j(2));
  ctx.lineTo(x + w - r + j(3), y + j(4));
  ctx.quadraticCurveTo(x + w + j(5), y + j(6), x + w + j(7), y + r + j(8));
  ctx.lineTo(x + w + j(9), y + h - r + j(10));
  ctx.quadraticCurveTo(x + w + j(11), y + h + j(12), x + w - r + j(13), y + h + j(14));
  ctx.lineTo(x + r + j(15), y + h + j(16));
  ctx.quadraticCurveTo(x + j(17), y + h + j(18), x + j(19), y + h - r + j(20));
  ctx.lineTo(x + j(21), y + r + j(22));
  ctx.quadraticCurveTo(x + j(23), y + j(24), x + r + j(1), y + j(2));
  ctx.closePath();
}

/** سایهٔ نرم؛ نور از بالا-چپ. */
function withShadow(blur, dy, alpha, fn, hue = '78, 46, 24') {
  ctx.save();
  ctx.shadowColor = `rgba(${hue}, ${alpha})`;
  ctx.shadowBlur = blur;
  ctx.shadowOffsetY = dy;
  ctx.shadowOffsetX = dy * .35;
  fn();
  ctx.restore();
}

/** یک برگه‌ی کاغذ با سایه — پایه‌ی همه‌ی کارت‌ها و تابلوها. */
function paper(x, y, w, h, fill, seed = 1, r = 12, shadow = .26) {
  withShadow(16, 7, shadow, () => {
    ctx.fillStyle = fill;
    wobbleRect(x, y, w, h, r, seed, 2);
    ctx.fill();
  });
  /* الیافِ کاغذ و لبهٔ روشن، تا سطح تخت نماند */
  ctx.save();
  ctx.beginPath(); wobbleRect(x, y, w, h, r, seed, 2); ctx.clip();
  ctx.globalAlpha = .5;
  ctx.fillStyle = texPaper(fill);
  ctx.fillRect(x, y, w, h);
  ctx.globalAlpha = 1;
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.4, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(90,60,20,.1)');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
}

function text(str, x, y, o = {}) {
  const size = o.size || 20;
  const fam = o.family || 'Vazirmatn';
  ctx.save();
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.font = `${fam === 'Lalezar' ? '400' : (o.weight || 700)} ${size}px "${fam}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.baseline || 'middle';
  ctx.fillStyle = o.color || '#43291b';
  ctx.direction = 'rtl';
  if (o.stroke) {
    ctx.lineWidth = o.strokeWidth || 5;
    ctx.strokeStyle = o.stroke;
    ctx.lineJoin = 'round';
    ctx.strokeText(str, x, y, o.maxWidth);
  }
  ctx.fillText(str, x, y, o.maxWidth);
  ctx.restore();
}

/** متنِ چندخطی که خودش می‌شکند. ارتفاعِ اشغال‌شده را برمی‌گرداند. */
function textWrap(str, x, y, maxW, o = {}) {
  const size = o.size || 19, lh = o.lineHeight || size * 1.7;
  ctx.font = `${o.weight || 700} ${size}px "${o.family || 'Vazirmatn'}", Tahoma, sans-serif`;
  const lines = [];
  for (const para of str.split('\n')) {
    let line = '';
    for (const wd of para.split(' ')) {
      const t = line ? line + ' ' + wd : wd;
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = wd; }
      else line = t;
    }
    lines.push(line);
  }
  lines.forEach((l, i) => text(l, x, y + i * lh, o));
  return lines.length * lh;
}

/* ───────── ذره‌ها ───────── */

class Bits {
  constructor() { this.list = []; }
  add(x, y, n, kind, colors, opts = {}) {
    for (let i = 0; i < n; i++) {
      const a = opts.dir !== undefined ? opts.dir + (Math.random()-.5) * (opts.spread || 1) : Math.random() * TAU;
      const sp = (opts.speed || 200) * (.4 + Math.random());
      this.list.push({
        kind, x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - (opts.lift || 0),
        r: (opts.size || 4) * (.5 + Math.random()),
        rot: Math.random() * TAU, vr: (Math.random()-.5) * 10,
        col: colors[(Math.random() * colors.length) | 0],
        grav: opts.grav === undefined ? 620 : opts.grav,
        drag: opts.drag || .995,
        life: (opts.life || .9) * (.6 + Math.random() * .8), age: 0,
      });
    }
  }
  confetti(x, y, n, colors) {
    this.add(x, y, n, 'flake', colors, { speed: 420, lift: 190, size: 5, life: 1.6, grav: 780 });
  }
  spark(x, y, n, colors) {
    this.add(x, y, n, 'dot', colors, { speed: 180, lift: 30, size: 3.4, life: .7, grav: 260, drag: .93 });
  }
  step(dt) {
    for (const p of this.list) {
      p.age += dt;
      p.vy += p.grav * dt;
      p.vx *= p.drag; p.vy *= p.drag;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    }
    this.list = this.list.filter((p) => p.age < p.life);
  }
  draw() {
    for (const p of this.list) {
      const k = clamp(1 - p.age / p.life, 0, 1);
      ctx.save();
      ctx.globalAlpha = k;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.col;
      if (p.kind === 'flake') ctx.fillRect(-p.r, -p.r*1.5, p.r*2, p.r*3);
      else if (p.kind === 'leaf') { wobbleEllipse(0, 0, p.r*1.8, p.r*.8, 0, p.r, .6); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(0, 0, p.r * k, 0, TAU); ctx.fill(); }
      ctx.restore();
    }
  }
  clear() { this.list.length = 0; }
}

/* ───────── صدا (بدون فایل صوتی) ───────── */

const sfx = {
  ac: null, on: true,
  _c() {
    if (!this.on) return null;
    if (!this.ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; this.ac = new A(); }
    if (this.ac.state === 'suspended') this.ac.resume();
    return this.ac;
  },
  tone(f, dur = .16, type = 'sine', gain = .13, delay = 0) {
    const c = this._c(); if (!c) return;
    const t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(t0 + dur + .04);
  },
  tap()  { this.tone(430, .07, 'triangle', .09); },
  place(){ this.tone(620, .11, 'sine', .12); },
  pop()  { this.tone(760, .09, 'sine', .11); },
  slide(){ this.tone(240, .22, 'sine', .07); },
  good() { [523, 659, 784].forEach((f,i) => this.tone(f, .22, 'sine', .13, i*.07)); },
  win()  { [523, 659, 784, 1047].forEach((f,i) => this.tone(f, .34, 'triangle', .13, i*.10)); },
  nope() { this.tone(180, .2, 'sawtooth', .07); },
  tick() { this.tone(1100, .04, 'square', .05); },
};

/* ───────── قطعه‌های آماده ───────── */

function star(x, y, r, col, rot = 0) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = col;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI/2 + i * Math.PI/5;
    const rr = i % 2 ? r * .45 : r;
    const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/** دکمهٔ کاغذی. hovered را خودِ بازی می‌دهد؛ اینجا فقط کشیده می‌شود. */
/** رنگ را روشن‌تر (k>0) یا تیره‌تر (k<0) می‌کند. */
function shade(col, k) {
  const c = String(col).trim();
  let r, g2, b2;
  if (c[0] === '#') {
    const h = c.length === 4 ? c[1]+c[1]+c[2]+c[2]+c[3]+c[3] : c.slice(1, 7);
    r = parseInt(h.slice(0,2), 16); g2 = parseInt(h.slice(2,4), 16); b2 = parseInt(h.slice(4,6), 16);
  } else {
    const m = c.match(/[\d.]+/g);
    if (!m || m.length < 3) return col;
    r = +m[0]; g2 = +m[1]; b2 = +m[2];
  }
  const f = (v) => Math.round(clamp(k < 0 ? v * (1 + k) : v + (255 - v) * k, 0, 255));
  return 'rgb(' + f(r) + ',' + f(g2) + ',' + f(b2) + ')';
}

function button(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 3 : 0;
  const fill = o.disabled ? (o.off || '#bcaa92') : (hot ? (o.hotFill || o.fill) : o.fill);
  const r = o.r === undefined ? 14 : o.r;
  /* لبهٔ زیرینِ تیره — دکمه از صفحه بیرون می‌زند */
  ctx.fillStyle = shade(fill, -.36);
  wobbleRect(b.x, b.y + dy + 7, b.w, b.h, r, b.x + b.y, 2);
  ctx.fill();
  withShadow(hot ? 22 : 14, hot ? 5 : 8, .32, () => {
    ctx.fillStyle = fill;
    wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2);
    ctx.fill();
  });
  /* حجم: روشن از بالا، تیره به پایین */
  ctx.save();
  ctx.beginPath(); wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2); ctx.clip();
  const g = ctx.createLinearGradient(0, b.y + dy, 0, b.y + dy + b.h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.45, 'rgba(255,255,255,.04)');
  g.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = g;
  ctx.fillRect(b.x, b.y + dy, b.w, b.h);
  /* برقِ باریکِ لبهٔ بالا */
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.fillRect(b.x + r, b.y + dy + 2, b.w - r * 2, 2);
  ctx.restore();
  text(label, b.x + b.w/2, b.y + b.h/2 + dy - (o.sub ? 9 : 0), {
    size: o.size || 26, color: o.color || '#fdf6e8', family: o.family || 'Lalezar',
  });
  if (o.sub) text(o.sub, b.x + b.w/2, b.y + b.h/2 + dy + 17,
    { size: 14, color: o.subColor || 'rgba(255,255,255,.88)' });
}

/** دکمهٔ گرد کوچک (مثل + و −). */
function roundButton(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 2 : 0;
  withShadow(10, hot ? 3 : 5, .3, () => {
    ctx.fillStyle = o.disabled ? '#cbbba3' : (hot ? (o.hotFill || o.fill) : o.fill);
    wobbleCircle(b.x, b.y + dy, b.r, b.x, 1.4);
    ctx.fill();
  });
  text(label, b.x, b.y + dy - 1,
    { size: o.size || 32, color: o.disabled ? '#a8988a' : (o.color || '#fdf6e8'), family: 'Lalezar' });
}

/** پرده‌ی تمام‌صفحه: برای شروعِ پرده و برای جشنِ پایان. */
function overlay(o) {
  const k = easeOut(clamp(o.t / .5, 0, 1));
  ctx.fillStyle = `rgba(30, 22, 16, ${.66 * k})`;
  ctx.fillRect(0, 0, SW, SH);

  const w = o.w || 700, h = o.h || 290;
  const x = (SW - w) / 2, y = o.y || (SH * .22);
  const s = lerp(.9, 1, easeBack(clamp(o.t / .65, 0, 1)));
  ctx.save();
  ctx.translate(SW/2, y + h/2);
  ctx.scale(s, s);
  ctx.translate(-SW/2, -(y + h/2));

  withShadow(30, 14, .42, () => {
    ctx.fillStyle = o.paper || '#fbf3e2';
    wobbleRect(x, y, w, h, 18, 121, 2.4);
    ctx.fill();
  });
  ctx.fillStyle = o.band || '#c8434f';
  wobbleRect(x, y, w, 12, 6, 123, 1);
  ctx.fill();

  if (o.icon) o.icon(SW/2, y + 56);
  text(o.title, SW/2, y + (o.icon ? 108 : 62),
    { size: o.titleSize || 36, color: o.ink || '#43291b', family: 'Lalezar', alpha: k });
  textWrap(o.body, SW/2, y + (o.icon ? 158 : 116), w - 90,
    { size: 19, color: o.inkSoft || '#8a6a52', alpha: k });
  ctx.restore();

  button(o.btn, o.btnLabel, { hot: o.btnHot, fill: o.btnFill || '#7fa356', hotFill: o.btnHotFill || '#8fb45f', size: 28 });
}

/** پیامِ کوتاهِ بالای صحنه. */
class Toast {
  constructor() { this.msg = null; this.t = 0; this.kind = 'info'; }
  say(msg, kind = 'info') { this.msg = msg; this.kind = kind; this.t = 2.6; }
  step(dt) { if (this.t > 0) { this.t -= dt; if (this.t <= 0) this.msg = null; } }
  draw(y = 24, colors = {}) {
    if (!this.msg) return;
    const k = clamp(this.t, 0, 1) * clamp((2.6 - this.t) * 5, 0, 1);
    ctx.save();
    ctx.globalAlpha = k;
    ctx.font = `700 19px "Vazirmatn", Tahoma, sans-serif`;
    const w = ctx.measureText(this.msg).width + 76;
    const fill = this.kind === 'good' ? (colors.good || '#7fa356')
               : this.kind === 'bad' ? (colors.bad || '#c8434f')
               : (colors.info || '#fbf3e2');
    paper(SW/2 - w/2, y, w, 48, fill, 151, 12, .3);
    text(this.msg, SW/2, y + 25,
      { size: 19, color: this.kind === 'info' ? (colors.ink || '#43291b') : '#fff8ec' });
    ctx.restore();
  }
}

/* ───────── آموزشِ پرده‌ای ─────────
   پرده‌هایی که منتظرِ کارِ بچه نیستند با یک ضربه جلو می‌روند. تایمر فقط
   پشتیبان است؛ بچهٔ کلاس سومی باید فرصتِ خواندن داشته باشد، نه اینکه
   متن قبل از تمام شدنِ خواندنش برود.                                    */

/** اگر پردهٔ فعلی خواندنی است، ضربه را می‌خورد و می‌رود پردهٔ بعد. */
function tutTap(tut, tapSteps, lastStep) {
  if (!tut.on || tapSteps.indexOf(tut.step) < 0) return false;
  if (tut.step >= lastStep) tut.on = false;
  else { tut.step++; tut.t = 0; }
  sfx.tap();
  return true;
}

/** نشانهٔ «برای ادامه بزن» — زیرِ کارتِ آموزش. */
function tutMore(cx, y, t, ink = '#3a2a18', bg = 'rgba(255, 250, 238, .94)') {
  ctx.save();
  ctx.globalAlpha = .62 + .38 * Math.sin(t * 3.2);
  ctx.font = '700 15px "Vazirmatn", Tahoma, sans-serif';
  const label = 'برای ادامه، هرجا را بزن';
  const w = ctx.measureText(label).width + 40, h = 32, x = cx - w / 2, r = 16;
  withShadow(10, 4, .3, () => {
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath(); ctx.fill();
  });
  text(label, cx, y + h / 2, { size: 15, color: ink });
  ctx.restore();
}

/** فونت‌ها را می‌آورد و بعد بازی را شروع می‌کند.
    مهم: هر دو راه (رسیدنِ فونت و مهلتِ پشتیبان) ممکن است برسند، ولی
    شروع فقط باید یک بار انجام شود؛ وگرنه دو حلقهٔ فریم راه می‌افتد و
    بازی دوبرابر سریع می‌شود. */
function whenFontsReady(start) {
  let done = false;
  const go = () => { if (done) return; done = true; start(); };
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('400 40px Lalezar'),
      document.fonts.load('700 20px Vazirmatn'),
      document.fonts.load('900 20px Vazirmatn'),
    ]).then(go, go);
    setTimeout(go, 2600);
  } else go();
}

/** حلقهٔ فریم با dtِ محدودشده. */
/* ───────── کیفیتِ خودکار ─────────
   اگر دستگاه کُند بود، اوّل درخشش و بعد رنگ‌بندی خاموش می‌شود تا بازی
   روان بماند. روی دستگاهِ قوی همه‌چیز روشن است. */
let QUALITY = 2;
let _fAcc = 0, _fN = 0, _qHold = 0;

function _qualityTick(gap) {
  if (gap <= 0 || gap > 200) return;
  _fAcc += gap; _fN++;
  if (_fN < 45) return;
  const avg = _fAcc / _fN;
  _fAcc = 0; _fN = 0;
  if (_qHold > 0) { _qHold--; return; }
  /* فاصلهٔ بالا و پایین باید باز باشد، وگرنه کیفیت بین دو پله بالا و
     پایین می‌پرد و بازی مدام تغییرِ ظاهر می‌دهد. */
  const before = QUALITY;
  if (avg > 21 && QUALITY > 0) { QUALITY--; _qHold = 4; }
  else if (avg < 13.5 && QUALITY < 2) { QUALITY++; _qHold = 10; }
  /* در پایین‌ترین کیفیت، صحنه را با نقطه‌های کمتر می‌کشیم */
  if (before !== QUALITY && (before === 0 || QUALITY === 0) && _refit) _refit();
}

/* یک حلقه، نه بیشتر — دو حلقه یعنی زمانِ بازی دوبرابر می‌گذرد.

   MOTION: تا پیش از این، به‌خاطرِ باگِ دو حلقه، همهٔ بازی‌ها عملاً با
   سرعتِ دو برابر اجرا می‌شدند و زمان‌بندی‌ها هم با همان حس تنظیم شده
   بودند. حالا که باگ رفع شده، سرعتِ درست (یک برابر) کُند به نظر
   می‌رسد. این ضریب جانِ حرکت‌ها را برمی‌گرداند، ولی نه تا آن دو برابرِ
   تصادفی. فقط روی جانِ حرکت اثر دارد، نه روی هیچ قانونِ علمی. */
const MOTION = 1.45;
let _looping = false;
function runLoop(step) {
  if (_looping) return;
  _looping = true;
  let last = performance.now();
  const frame = (now) => {
    const gap = now - last;
    /* بریدنِ بعد از ضرب، تا یک فریمِ کُند پرشِ بزرگ نسازد */
    const dt = Math.min(gap / 1000 * MOTION, 1/15);
    last = now;
    _qualityTick(gap);
    step(dt);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

/* ═════════════════ بازی ═════════════════ */
/* ═══════════════════════════════════════════════════════════════════════
   پنج گروهِ مهره‌داران — علومِ سوم، درس ۱۳

   جدولِ کتاب (ص ۱۱۲): «دانشمندان مهره‌داران را بر اساسِ پوششِ بدن،
   نوعِ تنفّس و تخم‌گذار یا بچّه‌زا بودن در ۵ گروهِ اصلی طبقه‌بندی
   کرده‌اند: ماهی‌ها، دوزیستان، خزندگان، پرندگان، پستانداران.»

   اینجا همان جدول را بچّه خودش پر می‌کند. سه ابزار روی میز هست و
   هیچ‌کدام جواب نمی‌گویند؛ فقط نشان می‌دهند:

     ذره‌بین  → پوششِ بدن را از نزدیک نشان می‌دهد (پولک، پوستِ لغزنده،
                پولکِ سختِ خشک، پَر، مو).
     تماشای نفس → هوا از کجا می‌آید و می‌رود (آبشش یا شش).
     زادگاه   → تخم در آب، تخم با پوستهٔ سخت، یا بچّهٔ زنده و شیر.

   ── درستیِ زیست‌شناسی ────────────────────────────────────────────
   ماهی‌ها:     پولک   | آبشش            | تخم در آب
   دوزیستان:   پوستِ لغزنده | اوّل آبشش بعد شش | تخم در آب
   خزندگان:    پولکِ سخت | شش            | تخم با پوستهٔ سخت
   پرندگان:    پَر     | شش             | تخم با پوستهٔ سخت
   پستانداران: مو      | شش             | بچّه‌زا و شیرده

   سه جانورِ فریب‌دهنده هم روی قفسه هست: پنگوئن (که پَر دارد، پس
   پرنده است)، وال (که با شش نفس می‌کشد و شیر می‌دهد، پس پستاندار
   است) و خفاش (که پرواز می‌کند ولی مو دارد و بچّه‌زاست). فقط سه
   نشانه راست می‌گویند، نه شکلِ ظاهر.
   ═══════════════════════════════════════════════════════════════════════ */

const cardOf = (i) => ({ x: SHELF.x + 8, y: 82 + i * 58.6, w: 176, h: 54 });
const drawerOf = (g) => ({ x: RACK.x + 8, y: 82 + g * 132, w: 176, h: 124 });
const toolOf = (i) => ({ x: 232 + i * 250, y: 456, w: 236, h: 60 });
const evOf = (i) => ({ x: 232 + i * 250, y: 532, w: 236, h: 174 });
const BTN_NOTE = { x: 24, y: 11, w: 158, h: 34 };
const BTN_GO = { x: SCENE_W / 2 - 150, y: 486, w: 300, h: 68 };
const BTN_AGAIN = { x: SCENE_W / 2 - 150, y: 492, w: 300, h: 68 };
const BTN_CHECK = { x: SCENE_W / 2 - 160, y: 610, w: 320, h: 58 };
function qOpt(qi, i) {
  const w = 226, gap = 14;
  return { x: SCENE_W / 2 + (1 - i) * (w + gap) - w / 2, y: 306 + qi * 156, w, h: 58 };
}

/* ───────── حالت ───────── */

const KEYS = ['skin', 'br', 'bi'];
const S = {
  phase: 'intro', phaseT: 0,
  tut: { on: false, step: 0, t: 0 },
  cur: null,                 /* جانورِ روی میز */
  found: {},                 /* id → {skin,br,bi} */
  placed: {},                /* id → شمارهٔ گروه */
  note: [null, null, null, null, null],   /* سطرهای دفترچه */
  noteOpen: false,
  tool: null,                /* 'lens' */
  lens: { x: CX, y: AY }, scan: 0,
  play: null,                /* {k:'br'|'bi', t} */
  ans: [-1, -1], mark: null, markT: 0,
  enter: 0, wrong: 0, wrongG: -1, fly: null,
  t: 0, hover: null, tip: '', tipT: 0, shake: 0, mistakes: 0,
};

const bits = new Bits();
const toast = new Toast();
const cv = document.getElementById('stage');
initStage(cv, SCENE_W, SCENE_H);

function tip(msg) { S.tip = msg; S.tipT = 4; }
const curA = () => (S.cur ? byId(S.cur) : null);
const fnd = (id) => S.found[id] || {};
const allFound = (id) => KEYS.every((k) => fnd(id)[k]);
const placedN = () => Object.keys(S.placed).length;
const inGroup = (g) => ANIMALS.filter((a) => S.placed[a.id] === g);

function reset(keep) {
  S.phase = 'lab'; S.phaseT = 0;
  S.cur = null; S.found = {}; S.placed = {};
  S.note = [null, null, null, null, null];
  S.noteOpen = false; S.tool = null; S.scan = 0; S.play = null;
  S.ans = [-1, -1]; S.mark = null; S.mistakes = 0; S.fly = null;
  S.tut.on = !keep; S.tut.step = 0; S.tut.t = 0;
}

/* ───────── ورودی ───────── */

const TUT_TAP = [0, 1, 2], TUT_LAST = 2;

cv.addEventListener('pointermove', (e) => {
  const p = toStage(e);
  S.hover = null;
  if (S.phase === 'intro') { if (inRect(p, BTN_GO)) S.hover = BTN_GO; }
  else if (S.phase === 'won') { if (inRect(p, BTN_AGAIN)) S.hover = BTN_AGAIN; }
  else if (S.phase === 'quiz') {
    if (inRect(p, BTN_NOTE)) S.hover = { k: 'note' };
    if (inRect(p, BTN_CHECK)) S.hover = { k: 'check' };
    for (let q = 0; q < QS.length; q++) for (let i = 0; i < QS[q].opts.length; i++)
      if (inRect(p, qOpt(q, i))) S.hover = { k: 'opt', q, i };
  } else if (S.noteOpen) {
    S.hover = { k: 'note' };
  } else {
    if (S.tool === 'lens') S.lens = { x: p.x, y: p.y };
    if (inRect(p, BTN_NOTE)) S.hover = { k: 'note' };
    for (let i = 0; i < ANIMALS.length; i++) if (inRect(p, cardOf(i))) S.hover = { k: 'card', i };
    for (let i = 0; i < 3; i++) if (inRect(p, toolOf(i))) S.hover = { k: 'tool', i };
    for (let g = 0; g < 5; g++) if (inRect(p, drawerOf(g))) S.hover = { k: 'drawer', g };
  }
  cv.style.cursor = S.hover ? 'pointer' : (S.tool === 'lens' ? 'none' : 'default');
});

cv.addEventListener('pointerdown', (e) => {
  const p = toStage(e);
  if (S.phase === 'intro') { if (inRect(p, BTN_GO)) { reset(false); sfx.good(); } return; }
  if (S.phase === 'won') { if (inRect(p, BTN_AGAIN)) { S.phase = 'intro'; S.phaseT = 0; sfx.tap(); } return; }
  if (S.phase === 'quiz') {
    if (S.noteOpen) { S.noteOpen = false; sfx.tap(); return; }
    if (inRect(p, BTN_NOTE)) { S.noteOpen = true; sfx.slide(); return; }
    if (inRect(p, BTN_CHECK)) { checkQuiz(); return; }
    for (let q = 0; q < QS.length; q++) for (let i = 0; i < QS[q].opts.length; i++) {
      if (!inRect(p, qOpt(q, i))) continue;
      S.ans[q] = i; S.mark = null; sfx.tap(); return;
    }
    return;
  }
  if (S.tut.on && tutTap(S.tut, TUT_TAP, TUT_LAST)) return;
  if (S.noteOpen) { S.noteOpen = false; sfx.tap(); return; }
  if (inRect(p, BTN_NOTE)) { S.noteOpen = true; sfx.slide(); return; }

  for (let i = 0; i < ANIMALS.length; i++) {
    if (!inRect(p, cardOf(i))) continue;
    const a = ANIMALS[i];
    if (S.cur === a.id) return;
    S.cur = a.id; S.tool = null; S.scan = 0; S.play = null; S.enter = 0;
    sfx.pop();
    return;
  }
  if (!S.cur) {
    if (inRect(p, { x: BENCH.x, y: BENCH.y, w: BENCH.w, h: 400 })) {
      tip('یکی از جانورهای قفسه را بزن تا روی میز بیاید.');
    }
    return;
  }
  const a = curA();
  for (let i = 0; i < 3; i++) {
    if (!inRect(p, toolOf(i))) continue;
    useTool(i, a);
    return;
  }
  if (S.tool === 'lens') { S.lens = { x: p.x, y: p.y }; return; }
  for (let g = 0; g < 5; g++) {
    if (!inRect(p, drawerOf(g))) continue;
    fileTo(g, a);
    return;
  }
});

function useTool(i, a) {
  const k = KEYS[i];
  if (i === 0) {
    S.tool = S.tool === 'lens' ? null : 'lens';
    S.scan = 0;
    if (S.tool === 'lens') { S.lens = { x: CX, y: AY }; sfx.slide(); }
    else sfx.tap();
    return;
  }
  S.tool = null;
  S.play = { k, t: 0 };
  sfx.slide();
}

/** جانور را در گروهِ g بایگانی می‌کند. */
function fileTo(g, a) {
  if (S.placed[a.id] !== undefined) { tip('این یکی بایگانی شده است.'); return; }
  if (!allFound(a.id)) {
    tip('اوّل هر سه ابزار را روی این جانور امتحان کن.');
    S.shake = .12; sfx.nope(); return;
  }
  if (g !== a.g) {
    S.wrong = .9; S.wrongG = g; S.mistakes++;
    tip('این خانه به نشانه‌های این جانور نمی‌خورد. دوباره به سه کارت نگاه کن.');
    sfx.nope();
    return;
  }
  S.placed[a.id] = g;
  const d = drawerOf(g);
  S.fly = { id: a.id, t: 0, x0: CX, y0: AY, x1: d.x + d.w / 2, y1: d.y + 62 };
  if (S.note[g] === null) {
    S.note[g] = { skin: a.skin, br: a.br, bi: a.bi, id: a.id };
    toast.say('سطرِ ' + GROUPS[g] + ' در دفترچه پر شد', 'good');
  } else toast.say(GROUPS[g], 'good');
  bits.confetti(d.x + d.w / 2, d.y + 40, 18, [P.good, P.brassLt, P.card]);
  sfx.good();
  S.cur = null; S.tool = null; S.play = null; S.scan = 0;
  if (placedN() === ANIMALS.length) { S.phase = 'quiz'; S.phaseT = 0; sfx.win(); }
}

function checkQuiz() {
  if (S.ans.some((x) => x < 0)) { tip('هر دو را جواب بده.'); S.shake = .1; sfx.nope(); return; }
  S.mark = QS.map((q, i) => S.ans[i] === q.a);
  S.markT = 2.6;
  if (S.mark.every(Boolean)) { sfx.win(); S.phase = 'won'; S.phaseT = 0; }
  else { sfx.nope(); S.shake = .14; }
}

/* ───────── حلقه ───────── */

const PLAY_T = 5.2;

function step(dt) {
  S.t += dt;
  if (S.phaseT < 9) S.phaseT += dt;
  if (S.tut.on) S.tut.t += dt;
  if (S.tipT > 0) S.tipT -= dt;
  if (S.markT > 0) S.markT -= dt;
  if (S.shake > 0) S.shake = Math.max(0, S.shake - dt);
  if (S.wrong > 0) { S.wrong = Math.max(0, S.wrong - dt); if (S.wrong === 0) S.wrongG = -1; }
  if (S.enter < 2) S.enter += dt;

  const a = curA();
  if (S.tool === 'lens' && a && !S.tut.on) {
    const d = Math.hypot((S.lens.x - CX) / (a.box[0] * BS), (S.lens.y - AY) / (a.box[1] * BS));
    if (d < 1) S.scan = Math.min(1, S.scan + dt / 1.35);
    else S.scan = Math.max(0, S.scan - dt * .5);
    if (S.scan >= 1 && !fnd(a.id).skin) {
      S.found[a.id] = Object.assign({}, fnd(a.id), { skin: true });
      sfx.good();
      bits.confetti(evOf(0).x + 118, evOf(0).y + 40, 12, [P.brassLt, P.card, P.accentLt]);
      S.tool = null; S.scan = 0;
      toast.say('پوششِ بدن ثبت شد', 'good');
    }
  }
  if (S.play && a) {
    S.play.t += dt;
    if (S.play.t >= PLAY_T) {
      const k = S.play.k;
      if (!fnd(a.id)[k]) {
        S.found[a.id] = Object.assign({}, fnd(a.id), { [k]: true });
        const i = KEYS.indexOf(k);
        bits.confetti(evOf(i).x + 118, evOf(i).y + 40, 12, [P.brassLt, P.card, P.accentLt]);
        sfx.good();
        toast.say(k === 'br' ? 'نوعِ تنفّس ثبت شد' : 'زادگاه ثبت شد', 'good');
      }
      S.play = null;
    }
  }
  if (S.fly) { S.fly.t += dt; if (S.fly.t > .75) S.fly = null; }

  bits.step(dt);
  toast.step(dt);
  draw();
}

whenFontsReady(() => runLoop(step));

/* ───────── ابزارِ نقاشی ───────── */

function rrPath(x, y, w, h, r) {
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function numText(str, x, y, o = {}) {
  ctx.save();
  ctx.direction = 'ltr';
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = o.color || P.ink;
  ctx.font = `${o.weight || 700} ${o.size || 18}px "${o.family || 'Vazirmatn'}", Tahoma, sans-serif`;
  ctx.fillText(str, x, y);
  ctx.restore();
}

function spot(shapes, alpha) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, SCENE_W, SCENE_H);
  for (const s of shapes) { ctx.moveTo(s.x + s.r, s.y); ctx.arc(s.x, s.y, s.r, 0, TAU, true); }
  ctx.fillStyle = `rgba(24, 16, 10, ${alpha})`;
  ctx.fill('evenodd');
  ctx.restore();
}

function tutCard(x, y, w, lines, title) {
  const h = 26 + (title ? 44 : 0) + lines.length * 30;
  withShadow(24, 10, .5, () => {
    ctx.fillStyle = 'rgba(255, 251, 242, .97)';
    wobbleRect(x, y, w, h + 20, 16, 101, 2.2); ctx.fill();
  }, '40, 26, 14');
  ctx.fillStyle = P.brass;
  wobbleRect(x, y, w, 9, 4, 103, 1); ctx.fill();
  let yy = y + 34;
  if (title) { text(title, x + w / 2, yy + 6, { size: 25, family: 'Lalezar', color: P.ink }); yy += 44; }
  for (const l of lines) { text(l, x + w / 2, yy, { size: 18, color: P.inkSoft }); yy += 30; }
  return h + 20;
}

function eyeAt(x, y, r, c) {
  ctx.fillStyle = '#fdf8ec';
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.fillStyle = c || '#1d1710';
  ctx.beginPath(); ctx.arc(x - r * .2, y, r * .55, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.beginPath(); ctx.arc(x - r * .5, y - r * .45, r * .25, 0, TAU); ctx.fill();
}

/** بدنِ جانور در مختصاتِ خودش؛ سر رو به چپ. */
function animalArt(id, t) {
  const a = byId(id), c = a.c;
  const br = Math.sin(t * 2.1) * .5 + .5;      /* نفسِ آرام */
  if (id === 'mahi' || id === 'bali') {

    ctx.beginPath();
    ctx.moveTo(pts[0].x - 26, pts[0].y + 2);
    ctx.lineTo(pts[0].x - 26 - tg, pts[0].y + 2);
    ctx.moveTo(pts[0].x - 26 - tg, pts[0].y + 2);

  if (id === 'lakposht') {

    ctx.strokeStyle = c.d; ctx.lineWidth = 11; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-46, 12); ctx.lineTo(-28, 12); ctx.stroke();
    ctx.fillStyle = c.b;
    ctx.beginPath(); ctx.ellipse(4, 0, 76, 48, 0, Math.PI, TAU); ctx.fill();

    ctx.beginPath(); ctx.ellipse(4, 0, 76, 48, 0, Math.PI, TAU); ctx.clip();
    ctx.strokeStyle = c.d; ctx.lineWidth = 3;
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath(); ctx.moveTo(4 + i * 26, -50); ctx.lineTo(4 + i * 30, 4); ctx.stroke();
    }
    ctx.beginPath(); ctx.ellipse(4, 0, 46, 30, 0, Math.PI, TAU); ctx.stroke();

    return;

  if (id === 'oghab') {
    ctx.fillStyle = c.b;
    ctx.beginPath(); ctx.ellipse(6, 6, 58, 42, -.16, 0, TAU); ctx.fill();

    ctx.moveTo(48, -14); ctx.quadraticCurveTo(84, 0, 92, 34);

    ctx.beginPath(); ctx.ellipse(-16, 6, 26, 24, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = c.e;
    ctx.beginPath();
    ctx.moveTo(-64, -26); ctx.quadraticCurveTo(-86, -22, -78, -4);
    ctx.quadraticCurveTo(-70, -12, -58, -12); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = c.e; ctx.lineWidth = 6; ctx.lineCap = 'round';
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(-6 + s * 11, 36); ctx.lineTo(-6 + s * 11, 48);

  if (id === 'pengoen') {
    ctx.fillStyle = c.e;
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.ellipse(-4 + s * 16, 72, 18, 8, s * .2, 0, TAU); ctx.fill();

    ctx.fillStyle = c.b;
    ctx.beginPath(); ctx.ellipse(6, -62, 26, 20, .2, 0, TAU); ctx.fill();
    ctx.fillStyle = c.d;

  if (id === 'gorbe') {
    ctx.fillStyle = c.d;
    ctx.save(); ctx.translate(52, 20);
    ctx.rotate(Math.sin(t * 1.7) * .3);

    ctx.fillStyle = c.b;

    ctx.fillStyle = c.d;

      ctx.beginPath(); ctx.ellipse(x, 48, 15, 10, 0, 0, TAU); ctx.fill();

    ctx.moveTo(-92, 8); ctx.quadraticCurveTo(-40, 34, 20, 30);

    ctx.quadraticCurveTo(30, 22, -92, 8);
    ctx.fill();
    ctx.strokeStyle = c.d; ctx.lineWidth = 2;
    for (let i = 0; i < 7; i++) {

    ctx.fillStyle = c.d;
    ctx.save(); ctx.translate(-18, 26); ctx.rotate(.5 + Math.sin(t * 2) * .12);

      ctx.beginPath();
      ctx.moveTo(0, -6);
      ctx.quadraticCurveTo(56, -46, 104, -30);

      ctx.strokeStyle = c.d; ctx.lineWidth = 3; ctx.lineCap = 'round';
      for (const e of [[100, -28], [88, 4], [58, 12], [30, 18]]) {
        ctx.beginPath(); ctx.moveTo(2, -4); ctx.lineTo(e[0], e[1]); ctx.stroke();

    ctx.fillStyle = c.b;
    wobbleEllipse(0, 8, 22, 32, 0, 3, 1.6); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, -26, 22, 19, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = c.d;

      ctx.beginPath();
      ctx.moveTo(s * 6, -40); ctx.quadraticCurveTo(s * 26, -66, s * 24, -34);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = c.l;
    ctx.beginPath(); ctx.ellipse(0, -18, 12, 10, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#f7f2e6';
    ctx.beginPath(); ctx.moveTo(-4, -12); ctx.lineTo(-1, -6); ctx.lineTo(-7, -8); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(4, -12); ctx.lineTo(7, -8); ctx.lineTo(1, -6); ctx.closePath(); ctx.fill();
    eyeAt(-8, -28, 5, c.e);
    eyeAt(8, -28, 5, c.e);
    return;
  }
}

/* ───────── بافتِ پوشش، زیرِ ذره‌بین ───────── */

function skinPatch(a, cx, cy, r, t) {
  const c = a.c, k = a.skin;
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.clip();
  ctx.fillStyle = c.b;
  ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
  if (k === 'scale') {
    const st = r * .42;
    for (let row = -4; row < 5; row++) for (let col = -4; col < 5; col++) {
      const x = cx + col * st + (row % 2 ? st / 2 : 0), y = cy + row * st * .68;
      const g = ctx.createLinearGradient(x, y - st * .6, x, y + st * .6);
      g.addColorStop(0, c.l); g.addColorStop(1, c.d);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, st * .58, Math.PI, TAU * .5); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(x, y, st * .58, .25, Math.PI - .25); ctx.stroke();
    }
    const g2 = ctx.createLinearGradient(cx - r, cy - r, cx + r, cy + r);
    g2.addColorStop(0, 'rgba(255,255,255,0)');
    g2.addColorStop(.5 + .18 * Math.sin(t * 1.4), 'rgba(255,255,255,.3)');
    g2.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g2; ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
  } else if (k === 'moist') {
    const g = ctx.createRadialGradient(cx - r * .3, cy - r * .3, r * .1, cx, cy, r);
    g.addColorStop(0, c.l); g.addColorStop(1, c.d);
    ctx.fillStyle = g; ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
    ctx.fillStyle = c.d;
    ctx.globalAlpha = .5;
    for (let i = 0; i < 40; i++) {
      const x = cx - r + noise1(i * 2.1) * r * 2, y = cy - r + noise1(i * 5.3) * r * 2;
      ctx.beginPath(); ctx.ellipse(x, y, r * .09, r * .06, .3, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    for (let i = 0; i < 7; i++) {
      const ph = t * .5 + i;
      const x = cx + Math.cos(ph) * r * .5, y = cy + Math.sin(ph * 1.3) * r * .5;
      ctx.beginPath(); ctx.ellipse(x, y, r * .17, r * .1, -.5, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.ellipse(cx - r * .35, cy - r * .4, r * .22, r * .11, -.6, 0, TAU); ctx.fill();
  } else if (k === 'scute') {
    const st = r * .46;
    for (let row = -4; row < 5; row++) for (let col = -4; col < 5; col++) {
      const x = cx + col * st * 1.5, y = cy + row * st * .87 + (col % 2 ? st * .44 : 0);
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const A = i * TAU / 6;
        const px = x + Math.cos(A) * st * .52, py = y + Math.sin(A) * st * .52;
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.closePath();
      ctx.fillStyle = i2(c, (row * 3 + col) % 3);
      ctx.fill();
      ctx.strokeStyle = 'rgba(30,20,10,.55)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x - st * .3, y); ctx.lineTo(x + st * .3, y); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(60,44,24,.16)';
    for (let i = 0; i < 90; i++) {
      const x = cx - r + noise1(i * 1.7) * r * 2, y = cy - r + noise1(i * 4.1) * r * 2;
      ctx.fillRect(x, y, 2, 2);
    }
  } else if (k === 'feather') {
    ctx.fillStyle = shade(c.d, .28); ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
    for (let f = 0; f < 3; f++) {
      const x0 = cx - r * .72 + f * r * .72, y0 = cy + r * .95, x1 = x0 + r * .2, y1 = cy - r * 1.05;
      ctx.fillStyle = f % 2 ? c.b : c.l;
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.quadraticCurveTo(x0 - r * .46, cy, x1, y1);
      ctx.quadraticCurveTo(x0 + r * .46, cy, x0, y0);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.30)'; ctx.lineWidth = 1.1;
      for (let i = 1; i < 16; i++) {
        const u = i / 16;
        const sx = lerp(x0, x1, u), sy = lerp(y0, y1, u);
        const wd = Math.sin(u * Math.PI) * r * .42;
        ctx.beginPath();
        ctx.moveTo(sx - wd, sy + wd * .5); ctx.lineTo(sx, sy);
        ctx.lineTo(sx + wd, sy + wd * .5); ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(40,28,16,.7)'; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    }
  } else {
    const g = ctx.createRadialGradient(cx - r * .3, cy - r * .4, r * .1, cx, cy, r);
    g.addColorStop(0, a.sparse ? c.l : c.b);
    g.addColorStop(1, c.d);
    ctx.fillStyle = g; ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
    const n = a.sparse ? 16 : 150;
    ctx.lineCap = 'round';
    for (let i = 0; i < n; i++) {
      const x = cx - r + noise1(i * 1.9) * r * 2, y = cy - r + noise1(i * 3.7 + 1) * r * 2;
      const len = r * (a.sparse ? .42 : .55) * (.6 + noise1(i * 7.3) * .6);
      const ang = -1.15 + noise1(i * 2.7) * .5;
      ctx.strokeStyle = i % 3 === 0 ? c.l : (i % 3 === 1 ? c.b : c.d);
      ctx.lineWidth = a.sparse ? 2.4 : 2;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(x + Math.cos(ang) * len * .6 + 6, y + Math.sin(ang) * len * .6,
                           x + Math.cos(ang) * len, y + Math.sin(ang) * len);
      ctx.stroke();
    }
    if (a.sparse) {
      ctx.fillStyle = 'rgba(255,255,255,.5)';
      ctx.beginPath(); ctx.ellipse(cx - r * .3, cy - r * .45, r * .3, r * .12, -.5, 0, TAU); ctx.fill();
    }
  }
  ctx.restore();
  ctx.strokeStyle = 'rgba(40,26,14,.45)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();
}
const i2 = (c, k) => (k === 0 ? c.b : k === 1 ? c.d : c.l);

/* ───────── اندام‌ها ───────── */

function lungsShape(x, y, s, infl) {
  ctx.fillStyle = P.flesh;
  for (const sg of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(x, y - 14 * s);
    ctx.quadraticCurveTo(x + sg * (17 + 7 * infl) * s, y - 8 * s, x + sg * (14 + 6 * infl) * s, y + 15 * s);
    ctx.quadraticCurveTo(x + sg * 7 * s, y + 23 * s, x + sg * 2 * s, y + 5 * s);
    ctx.closePath(); ctx.fill();
  }
  ctx.strokeStyle = P.fleshDk; ctx.lineWidth = 3.4 * s; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, y - 30 * s); ctx.lineTo(x, y - 8 * s); ctx.stroke();
  for (const sg of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(x, y - 12 * s); ctx.lineTo(x + sg * 9 * s, y + 4 * s); ctx.stroke();
  }
}

function gillsShape(x, y, s, ph) {
  ctx.lineCap = 'round';
  for (let i = 0; i < 4; i++) {
    ctx.strokeStyle = i % 2 ? '#c8404a' : '#e0616a';
    ctx.lineWidth = 4 * s;
    ctx.beginPath();
    ctx.arc(x + i * 5 * s, y, (16 - i * 3) * s * (1 + .07 * Math.sin(ph - i * .5)), -1.25, 1.25);
    ctx.stroke();
  }
}

/** نوزادِ دوزیستان: بچّه‌قورباغه با آبششِ بیرونی. */
function larvaArt(a, t) {
  const c = a.c;
  ctx.fillStyle = c.d;
  ctx.beginPath();
  ctx.moveTo(6, 0);
  ctx.quadraticCurveTo(44, -26, 74, -22);
  ctx.quadraticCurveTo(58, 0, 74, 22);
  ctx.quadraticCurveTo(44, 26, 6, 0);
  ctx.fill();
  ctx.fillStyle = c.b;
  wobbleEllipse(-16, 0, 44, 30, 0, 3, 1.8); ctx.fill();
  ctx.fillStyle = c.l;
  wobbleEllipse(-20, 10, 30, 14, 0, 5, 1.4); ctx.fill();
  /* آبششِ بیرونیِ پَرمانند، دو دسته پشتِ سر */
  ctx.lineCap = 'round';
  for (const sg of [-1, 1]) {
    const bx = -8, by = sg * 24;
    for (let i = 0; i < 5; i++) {
      const A = sg * (.9 + i * .26), L = 32 - i * 3;
      const ex = bx + Math.cos(A) * L, ey = by + Math.sin(A) * L + Math.sin(t * 5 + i) * 2.4;
      ctx.strokeStyle = '#d4636c'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.quadraticCurveTo(bx + Math.cos(A) * L * .5, by + Math.sin(A) * L * .4, ex, ey); ctx.stroke();
      ctx.strokeStyle = 'rgba(238, 152, 160, .95)'; ctx.lineWidth = 2;
      for (let j = 1; j <= 3; j++) {
        const u = j / 4;
        const px = lerp(bx, ex, u), py = lerp(by, ey, u);
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + sg * 8, py + sg * 4); ctx.stroke();
      }
    }
    ctx.strokeStyle = '#c8535e'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(-8, sg * 18); ctx.lineTo(bx, by); ctx.stroke();
  }
  eyeAt(-38, -8, 6, c.e);
}

/* ───────── پنجرهٔ مشاهده ───────── */

const W = { x: 264, y: 92, w: 672, h: 340 };
const BS = 1.7;                       /* بزرگ‌نماییِ جانور روی میز */

function winBack(kind, t) {
  ctx.save();
  ctx.beginPath(); rrPath(W.x, W.y, W.w, W.h, 18); ctx.clip();
  if (kind === 'water') {
    const g = ctx.createLinearGradient(0, W.y, 0, W.y + W.h);
    g.addColorStop(0, P.waterLt); g.addColorStop(1, P.waterDk);
    ctx.fillStyle = g; ctx.fillRect(W.x, W.y, W.w, W.h);
    ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 3;
    for (let i = 0; i < 5; i++) {
      ctx.beginPath();
      for (let x = W.x; x <= W.x + W.w; x += 16) {
        const y = W.y + 30 + i * 66 + Math.sin(x * .015 + t * .9 + i) * 7;
        x === W.x ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  } else if (kind === 'sand') {
    const g = ctx.createLinearGradient(0, W.y, 0, W.y + W.h);
    g.addColorStop(0, '#b9dcea'); g.addColorStop(.55, '#f0e3c4'); g.addColorStop(1, '#c9a86a');
    ctx.fillStyle = g; ctx.fillRect(W.x, W.y, W.w, W.h);
    ctx.fillStyle = 'rgba(255, 226, 150, .85)';
    ctx.beginPath(); ctx.arc(W.x + 96, W.y + 58, 32, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255, 238, 190, .3)';
    ctx.beginPath(); ctx.arc(W.x + 96, W.y + 58, 54, 0, TAU); ctx.fill();
  } else {
    const g = ctx.createLinearGradient(0, W.y, 0, W.y + W.h);
    g.addColorStop(0, '#dcecf2'); g.addColorStop(1, '#f3ead6');
    ctx.fillStyle = g; ctx.fillRect(W.x, W.y, W.w, W.h);
    ctx.fillStyle = 'rgba(255, 232, 170, .8)';
    ctx.beginPath(); ctx.arc(W.x + 92, W.y + 62, 34, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255, 240, 200, .35)';
    ctx.beginPath(); ctx.arc(W.x + 92, W.y + 62, 56, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    for (let i = 0; i < 3; i++) {
      const x = W.x + 90 + i * 210 + Math.sin(t * .2 + i) * 20;
      ctx.beginPath(); ctx.ellipse(x, W.y + 60 + i * 18, 62, 22, 0, 0, TAU); ctx.fill();
    }
  }
  ctx.restore();
  ctx.strokeStyle = 'rgba(60, 42, 24, .35)'; ctx.lineWidth = 4;
  ctx.beginPath(); rrPath(W.x, W.y, W.w, W.h, 18); ctx.stroke();
}

function bubbleUp(x, y, seed, t, n, spread) {
  ctx.fillStyle = 'rgba(255,255,255,.7)';
  for (let i = 0; i < n; i++) {
    const ph = (t * .42 + noise1(seed + i * 3.1)) % 1;
    const r = 3 + noise1(seed + i * 5.7) * 4;
    ctx.globalAlpha = .75 * (1 - ph);
    ctx.beginPath();
    ctx.arc(x - ph * 40 + Math.sin(ph * 9 + i) * 8,
            y - ph * (W.h * .42) - 10, r, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/** تماشای نفس. */
function breathView(a, u) {
  const t = S.t, o = a.org;
  const both = a.br === 'both';
  const larva = both && u < .44;
  const wet = a.br === 'gill' || larva || a.id === 'val' || a.id === 'ghurbaghe' || a.id === 'samandar';
  winBack(wet ? 'water' : 'air', t);
  const infl = .5 + .5 * Math.sin(t * 1.9);
  ctx.save();
  ctx.translate(CX, AY);
  ctx.scale(BS * (larva ? 1.35 : 1), BS * (larva ? 1.35 : 1));
  ctx.globalAlpha = larva ? .9 : .62;
  if (larva) larvaArt(a, t); else animalArt(a.id, t);
  ctx.globalAlpha = 1;
  ctx.save();
  ctx.shadowColor = 'rgba(220, 90, 100, .8)'; ctx.shadowBlur = 16;
  if (larva) { /* آبششش بیرون است و خودش پیداست */ }
  else if (a.br === 'gill') gillsShape(o.gx, o.gy, 1, t * 3.4);
  else lungsShape(o.lx, o.ly, 1, infl);
  ctx.restore();
  /* راهِ هوا */
  ctx.fillStyle = larva || a.br === 'gill' ? 'rgba(70, 200, 255, .95)' : 'rgba(255, 255, 255, .98)';
  const from = larva ? { x: -56, y: 4 } : { x: o.nx, y: o.ny };
  const to = larva ? { x: -8, y: 22 } : (a.br === 'gill' ? { x: o.gx, y: o.gy } : { x: o.lx, y: o.ly });
  for (let i = 0; i < 7; i++) {
    const ph = ((t * .6 + i / 7) % 1);
    const x = lerp(from.x, to.x, ph);
    const y = lerp(from.y, to.y, ph);
    ctx.globalAlpha = Math.sin(ph * Math.PI) * .95;
    ctx.beginPath(); ctx.arc(x, y, 5, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(30, 60, 80, .3)'; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.arc(x, y, 5, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  if (larva) {
    bubbleUp(CX + 30, AY - 20, 3, t, 10);
  } else if (a.br === 'gill') {
    bubbleUp(CX + o.gx * BS + 26, AY + o.gy * BS, 3, t, 10);
  } else if (wet) {
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(W.x + 20, W.y + 46); ctx.lineTo(W.x + W.w - 20, W.y + 46); ctx.stroke();
    bubbleUp(CX + o.nx * BS, AY + o.ny * BS, 9, t, 5);
  }
  if (!both) {
    text(a.br === 'gill' ? 'زیرِ آب می‌ماند و بالا نمی‌آید' : 'باید هوای بیرون را بگیرد',
      CX, W.y + 30, { size: 20, family: 'Lalezar', color: wet ? '#e8f6fb' : '#33454f' });
  }
  if (both) {
    const lbl = u < .44 ? 'نوزاد، در آب' : 'بزرگ‌سال، بیرونِ آب';
    text(lbl, CX, W.y + 30, { size: 20, family: 'Lalezar', color: '#26404c' });
    if (u > .38 && u < .52) {
      ctx.save();
      ctx.globalAlpha = 1 - Math.abs(u - .45) / .07;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(W.x, W.y, W.w, W.h);
      ctx.restore();
    }
  }
}

/** زادگاه. */
function birthView(a, u) {
  const t = S.t, c = a.c;
  if (a.bi === 'eggW') {
    winBack('water', t);
    const cx = CX, cy = AY + 10;
    ctx.fillStyle = P.jelly;
    ctx.beginPath(); ctx.ellipse(cx, cy, 130, 74, 0, 0, TAU); ctx.fill();
    for (let i = 0; i < 22; i++) {
      const A = i * 2.4, rr = 20 + (i % 5) * 22;
      const x = cx + Math.cos(A) * rr * 1.5, y = cy + Math.sin(A) * rr * .8;
      ctx.fillStyle = 'rgba(240, 250, 252, .85)';
      ctx.beginPath(); ctx.arc(x, y, 15, 0, TAU); ctx.fill();
      ctx.fillStyle = c.d;
      const wig = u > .5 ? Math.sin(t * 8 + i) * 2 : 0;
      ctx.beginPath(); ctx.arc(x + wig, y, 6.5, 0, TAU); ctx.fill();
    }
    if (u > .62) {
      const k = (u - .62) / .38;
      for (let i = 0; i < 5; i++) {
        ctx.save();
        ctx.translate(cx - 40 - k * (90 + i * 30), cy - 40 + i * 22 + Math.sin(t * 4 + i) * 8);
        ctx.scale(.34, .34);
        ctx.globalAlpha = clamp(k * 3, 0, 1);
        larvaArt(a, t + i);
        ctx.restore();
      }
    }
    text('تخم‌های نرم، بی‌پوسته، در آب', CX, W.y + 30, { size: 20, family: 'Lalezar', color: '#1f3d4d' });
    return;
  }
  if (a.bi === 'eggL') {
    winBack('sand', t);
    const gy = AY + 74, cx = CX;
    /* زمین */
    ctx.save();
    ctx.beginPath(); rrPath(W.x, W.y, W.w, W.h, 18); ctx.clip();
    ctx.fillStyle = a.g === 3 ? '#a8bb72' : '#d8bc80';
    ctx.beginPath();
    ctx.moveTo(W.x, gy + 4);
    ctx.quadraticCurveTo(cx, gy - 24, W.x + W.w, gy + 4);
    ctx.lineTo(W.x + W.w, W.y + W.h); ctx.lineTo(W.x, W.y + W.h);
    ctx.fill();
    if (a.g === 3) {
      /* لانهٔ بافته */
      ctx.fillStyle = '#b8863c';
      ctx.beginPath(); ctx.ellipse(cx, gy + 26, 210, 62, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#8f6526';
      ctx.beginPath(); ctx.ellipse(cx, gy + 8, 168, 40, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#c9a45c'; ctx.lineWidth = 6; ctx.lineCap = 'round';
      for (let i = 0; i < 34; i++) {
        const A = noise1(i * 3.3) * TAU, r0 = 130 + noise1(i * 1.7) * 88;
        const x0 = cx + Math.cos(A) * r0, y0 = gy + 24 + Math.sin(A) * r0 * .3;
        ctx.beginPath(); ctx.moveTo(x0, y0);
        ctx.lineTo(x0 + Math.cos(A + 1.4) * 52, y0 + Math.sin(A + 1.4) * 14); ctx.stroke();
      }
    } else {
      /* گودالِ شنی */
      ctx.fillStyle = '#c2a068';
      ctx.beginPath(); ctx.ellipse(cx, gy + 20, 200, 52, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#b08d55';
      ctx.beginPath(); ctx.ellipse(cx, gy + 12, 150, 34, 0, 0, TAU); ctx.fill();
    }
    ctx.restore();
    for (let i = 0; i < 3; i++) {
      const x = cx - 104 + i * 104, cracked = i === 1 && u > .55;
      withShadow(12, 6, .32, () => {
        ctx.fillStyle = '#f6eedb';
        ctx.beginPath(); ctx.ellipse(x, gy - 10, 36, 48, i * .18 - .18, 0, TAU); ctx.fill();
      });
      const eg = ctx.createLinearGradient(x - 36, gy - 58, x + 36, gy + 38);
      eg.addColorStop(0, 'rgba(255,255,255,.6)');
      eg.addColorStop(1, 'rgba(140,116,80,.35)');
      ctx.fillStyle = eg;
      ctx.beginPath(); ctx.ellipse(x, gy - 10, 36, 48, i * .18 - .18, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(150,128,96,.75)'; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.ellipse(x, gy - 10, 36, 48, i * .18 - .18, 0, TAU); ctx.stroke();
      if (cracked) {
        const k = clamp((u - .55) / .45, 0, 1);
        ctx.strokeStyle = '#8a7550'; ctx.lineWidth = 3.4;
        ctx.beginPath();
        ctx.moveTo(x - 32, gy - 24);
        for (let j = 1; j <= 7; j++) ctx.lineTo(x - 32 + j * 9.4, gy - 24 + (j % 2 ? 11 : -7));
        ctx.stroke();
        ctx.save();
        ctx.translate(x, gy - 46 - k * 30); ctx.scale(.36, .36);
        ctx.globalAlpha = k;
        animalArt(a.id, t);
        ctx.restore();
      }
    }
    text('تخم با پوستهٔ سخت، بیرونِ آب', CX, W.y + 30, { size: 20, family: 'Lalezar', color: '#4a3a1c' });
    return;
  }
  winBack(a.id === 'val' ? 'water' : 'air', t);
  const gy = AY + 40;
  ctx.save();
  ctx.translate(CX + 90, gy - 30); ctx.scale(1.05, 1.05);
  animalArt(a.id, t);
  ctx.restore();
  const k = clamp((u - .25) / .5, 0, 1);
  ctx.save();
  ctx.translate(CX - 140 + k * 100, gy + 30 + Math.sin(t * 3) * 4);
  ctx.scale(.44, .44);
  animalArt(a.id, t * 1.3);
  ctx.restore();
  if (u > .62) {
    ctx.save();
    ctx.globalAlpha = clamp((u - .62) * 4, 0, 1);
    ctx.fillStyle = P.milk;
    for (let i = 0; i < 5; i++) {
      const ph = (t * .8 + i / 5) % 1;
      ctx.globalAlpha = (1 - ph) * .9;
      ctx.beginPath();
      ctx.arc(CX + 10 - ph * 40, gy + 6 + ph * 22, 6, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
  text('بچّهٔ زنده، و شیر خوردن', CX, W.y + 30, { size: 20, family: 'Lalezar', color: '#33454f' });
}

/* ───────── نشانه‌های کوچک ───────── */

function brIcon(a, x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  if (a.br === 'gill') { gillsShape(-4, 0, 1, S.t * 3); dropletHint(24, -6); }
  else if (a.br === 'lung') lungsShape(0, 0, 1, .5 + .5 * Math.sin(S.t * 2));
  else {
    ctx.save(); ctx.translate(-30, 0); ctx.scale(.8, .8); gillsShape(0, 0, 1, S.t * 3); ctx.restore();
    ctx.save(); ctx.translate(30, 0); ctx.scale(.8, .8); lungsShape(0, 0, 1, .5 + .5 * Math.sin(S.t * 2)); ctx.restore();
    ctx.strokeStyle = P.inkSoft; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(6, 0); ctx.lineTo(0, -6); ctx.moveTo(6, 0); ctx.lineTo(0, 6); ctx.stroke();
  }
  ctx.restore();
}
function dropletHint(x, y) {
  ctx.fillStyle = 'rgba(90, 170, 210, .8)';
  for (let i = 0; i < 3; i++) {
    ctx.beginPath(); ctx.arc(x + i * 9, y - i * 8, 4 - i * .6, 0, TAU); ctx.fill();
  }
}

function biIcon(a, x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  if (a.bi === 'eggW') {
    ctx.fillStyle = 'rgba(150, 205, 220, .55)';
    ctx.beginPath(); ctx.ellipse(0, 0, 44, 24, 0, 0, TAU); ctx.fill();
    for (let i = 0; i < 5; i++) {
      const x2 = -28 + i * 14, y2 = (i % 2 ? -6 : 6);
      ctx.fillStyle = '#f2fbfd';
      ctx.beginPath(); ctx.arc(x2, y2, 10, 0, TAU); ctx.fill();
      ctx.fillStyle = a.c.d;
      ctx.beginPath(); ctx.arc(x2, y2, 4.4, 0, TAU); ctx.fill();
    }

function drawLens(a) {
  const R = 78, x = clamp(S.lens.x, W.x + 8, W.x + W.w - 8), y = clamp(S.lens.y, W.y + 8, W.y + W.h - 8);
  ctx.save();
  ctx.beginPath(); rrPath(W.x, W.y, W.w, W.h, 18); ctx.clip();
  ctx.fillStyle = 'rgba(20, 14, 6, .34)';
  ctx.beginPath();
  ctx.rect(W.x, W.y, W.w, W.h);
  ctx.arc(x, y, R, 0, TAU, true);
  ctx.fill();
  const over = Math.hypot((x - CX) / (a.box[0] * BS), (y - AY) / (a.box[1] * BS)) < 1;
  if (over) skinPatch(a, x, y, R, S.t);
  else {
    ctx.save();
    ctx.beginPath(); ctx.arc(x, y, R, 0, TAU); ctx.clip();
    ctx.translate(x, y); ctx.scale(2.2, 2.2); ctx.translate(-CX, -AY);
    ctx.translate(CX, AY); ctx.scale(BS, BS);
    animalArt(a.id, S.t);
    ctx.restore();
  }
  /* شیشه و قاب */
  const gl = ctx.createLinearGradient(x - R, y - R, x + R, y + R);
  gl.addColorStop(0, 'rgba(255,255,255,.28)');
  gl.addColorStop(.5, 'rgba(255,255,255,.03)');
  gl.addColorStop(1, 'rgba(255,255,255,.16)');
  ctx.fillStyle = gl;
  ctx.beginPath(); ctx.arc(x, y, R, 0, TAU); ctx.fill();
  ctx.strokeStyle = P.brass; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.arc(x, y, R, 0, TAU); ctx.stroke();
  ctx.strokeStyle = P.brassLt; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(x, y, R - 5, 0, TAU); ctx.stroke();
  ctx.strokeStyle = P.brass; ctx.lineWidth = 14; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x + R * .74, y + R * .74); ctx.lineTo(x + R * 1.5, y + R * 1.5); ctx.stroke();
  if (S.scan > 0) {
    ctx.strokeStyle = P.good; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(x, y, R + 10, -Math.PI / 2, -Math.PI / 2 + TAU * S.scan); ctx.stroke();
  }
  ctx.restore();
  if (!over) text('ذره‌بین را روی بدنش نگه دار', CX, W.y + 28, { size: 19, family: 'Lalezar', color: '#5d4a30' });
}

function draw() {
  beginScene(P.woodDk);
  ctx.fillStyle = texWood('#33251a', '#43301f');
  ctx.fillRect(0, 0, SCENE_W, SCENE_H);
  const vg = ctx.createRadialGradient(SCENE_W / 2, SCENE_H / 2, 120, SCENE_W / 2, SCENE_H / 2, 760);
  vg.addColorStop(0, 'rgba(255, 230, 180, .12)');
  vg.addColorStop(1, 'rgba(0, 0, 0, .34)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, SCENE_W, SCENE_H);

  ctx.save();
  if (S.shake > 0) ctx.translate(Math.sin(S.t * 55) * S.shake * 10, 0);
  drawShelf();
  drawBench();
  drawRack();
  if (S.fly) {
    const k = easeOut(clamp(S.fly.t / .75, 0, 1));
    ctx.save();
    ctx.globalAlpha = 1 - k * .3;
    miniAnimal(S.fly.id, lerp(S.fly.x0, S.fly.x1, k), lerp(S.fly.y0, S.fly.y1, k) - Math.sin(k * Math.PI) * 60,
      lerp(BS, .2, k));
    ctx.restore();
  }
  bits.draw();
  ctx.restore();

  if (S.phase === 'quiz') drawQuiz();
  drawHUD();
  if (S.noteOpen) drawNotebook();
  toast.draw(HUD_H + 8, { good: P.good, bad: P.bad, info: P.card, ink: P.ink });
  if (S.phase === 'lab' && S.tut.on) drawTutorial();
  if (S.phase === 'intro') drawIntro();
  if (S.phase === 'won') drawWon();
  if (S.tipT > 0 && !S.noteOpen) {
    ctx.save();
    ctx.globalAlpha = clamp(S.tipT, 0, 1);
    const w = 620;
    paper(CX - w / 2, SCENE_H - 42, w, 36, P.card, 91, 12, .3);
    text(S.tip, CX, SCENE_H - 24, { size: 16, color: P.ink });
    ctx.restore();
  }
  endScene(.12, 'rgba(20, 10, 4, .40)', .2, .12);
}

</script>
