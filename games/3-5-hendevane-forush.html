<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#10231c">
<title>هندوانه‌فروشِ تابستان — مقایسهٔ کسرها</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>
  /* صفحه نباید هیچ‌جا اسکرول یا زوم شود؛ بازی باید مثل یک برنامه رفتار کند. */
  html, body {
    margin: 0; padding: 0; background: #10231c;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body {
    position: fixed; inset: 0;          /* جلوی کشیده‌شدنِ صفحه در سافاریِ گوشی */
    width: 100%; height: 100vh; height: 100dvh;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none; -webkit-touch-callout: none;
  }

  /* گوشیِ عمودی صحنه را ریز می‌کند؛ بچه باید گوشی را بچرخاند. */
  #rotate { display: none; }
  @media (orientation: portrait) and (max-width: 860px) {
    #stage { display: none; }
    #rotate {
      display: flex; position: fixed; inset: 0;
      z-index: 9;
      flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      background: #10231c; color: #f6ead2;
      font: 700 20px "Vazirmatn", Tahoma, sans-serif; text-align: center; padding: 32px;
    }
    #rotate svg { animation: tilt 2.4s ease-in-out infinite; }
    @keyframes tilt { 0%, 45% { transform: rotate(0deg); } 65%, 100% { transform: rotate(-90deg); } }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="rotate">
  <svg width="86" height="126" viewBox="0 0 86 126" fill="none" aria-hidden="true">
    <rect x="3" y="3" width="80" height="120" rx="12" stroke="#e8b448" stroke-width="5"/>
    <rect x="15" y="19" width="56" height="88" rx="5" fill="#e8b448" opacity=".28"/>
    <circle cx="43" cy="115" r="4" fill="#e8b448"/>
  </svg>
  <div>گوشی را بچرخان</div>
  <div style="font-weight:400;opacity:.7;font-size:16px">این بازی خوابیده بازی می‌شود</div>
</div>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   هستهٔ مشترکِ بازی‌ها — سبک «کاغذبُری»
   ───────────────────────────────────────────────────────────────────────
   این فایل جعبه‌ابزار است، نه چارچوب: هر بازی حلقه و وضعیت خودش را دارد
   و فقط از این توابع برای کشیدن استفاده می‌کند. دلیلش این است که هر بازی
   باید حس‌وحال خودش را داشته باشد، نه اینکه همه شبیه هم دربیایند.

   قاعده‌های ثابتِ تصویری:
   • نور همیشه از بالا-چپ می‌تابد، پس سایه‌ها به پایین-راست می‌افتند.
   • هیچ لبه‌ای کاملاً صاف نیست؛ همه کمی موج دارند (انگار با قیچی بریده).
   • هیچ خاکستریِ خالصی نداریم؛ همه‌ی خنثی‌ها به گرمیِ صحنه می‌زنند.
   • یک لایه‌ی دانه‌دانه‌ی کاغذ روی کلِ تصویر ضرب می‌شود.
   ═══════════════════════════════════════════════════════════════════════ */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const FA_D = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
const fa = (n) => String(n).replace(/\d/g, (d) => FA_D[+d]);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeIn = (t) => t * t * t;
const easeInOut = (t) => (t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2);
const easeBack = (t) => 1 + 2.7 * Math.pow(t-1, 3) + 1.7 * Math.pow(t-1, 2);
const easeElastic = (t) => t === 0 || t === 1 ? t : Math.pow(2, -9*t) * Math.sin((t*10 - .75) * 2.094) + 1;

/** تصادفِ تکرارپذیر: با یک بذر همیشه همان عدد. برای اینکه تزئین‌ها هر فریم نپرند. */
function noise1(x) {
  const s = Math.sin(x * 127.1) * 43758.5453;
  return s - Math.floor(s);
}
const pick = (arr, seed) => arr[Math.floor(noise1(seed) * arr.length) % arr.length];

/* ───────── بوم و صحنهٔ ثابت ───────── */

let ctx, SW, SH, CV, _refit = null;
let view = { scale: 1, ox: 0, oy: 0, w: 0, h: 0, dpr: 1 };
let _grain = null;

function initStage(canvas, w, h) {
  CV = canvas; SW = w; SH = h;
  ctx = canvas.getContext('2d');

  /* اندازه را از خودِ بوم می‌گیریم نه از innerHeight؛ چون در سافاریِ گوشی
     نوارِ آدرس باز و بسته می‌شود و innerHeight دروغ می‌گوید. */
  const fit = () => {
    const r = canvas.getBoundingClientRect();
    const vw = Math.round(r.width), vh = Math.round(r.height);
    if (vw < 20 || vh < 20) return;
    const dpr = Math.min(devicePixelRatio || 1, QUALITY > 0 ? 2 : 1);
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    const scale = Math.min(vw / SW, vh / SH);
    view = { scale, ox: (vw - SW*scale)/2, oy: (vh - SH*scale)/2, w: vw, h: vh, dpr };
    _grain = buildGrain();
  };
  _refit = fit;
  addEventListener('resize', fit);
  /* چرخاندنِ گوشی: اندازهٔ درست چند لحظه بعد می‌رسد، پس چندبار اندازه می‌گیریم. */
  addEventListener('orientationchange', () => {
    fit(); setTimeout(fit, 140); setTimeout(fit, 460);
  });
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(canvas);

  /* صدا در گوشی فقط بعد از اوّلین لمس اجازهٔ پخش دارد. */
  const unlock = () => { sfx._c(); removeEventListener('pointerdown', unlock); removeEventListener('touchstart', unlock); };
  addEventListener('pointerdown', unlock, { passive: true });
  addEventListener('touchstart', unlock, { passive: true });
  /* نگه‌داشتنِ انگشت نباید منوی مرورگر را باز کند. */
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  fit();
  return ctx;
}

/** قابِ صحنه را باز می‌کند: بعد از این، مختصات همیشه در فضای SW×SH است. */
function beginScene(bg) {
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, view.w, view.h);
  ctx.save();
  ctx.translate(view.ox, view.oy);
  ctx.scale(view.scale, view.scale);
  ctx.beginPath();
  ctx.rect(0, 0, SW, SH);
  ctx.clip();
}

/** بافتِ کاغذ، تیرگیِ گوشه‌ها، رنگ‌بندی و درخششِ نور را می‌گذارد و قاب را می‌بندد. */
function endScene(grainAlpha = .15, vignette = 'rgba(48,28,14,.30)', bloom = .34, grade = .14) {
  if (QUALITY < 1) { grade = 0; grainAlpha *= .5; }
  if (QUALITY < 2) bloom = 0;
  if (grade > 0) {
    /* رنگ‌بندیِ نرم: بالای صحنه گرم‌تر، پایین سردتر — عمق می‌دهد */
    const g = ctx.createLinearGradient(0, 0, 0, SH);
    g.addColorStop(0, `rgba(255, 214, 150, ${grade})`);
    g.addColorStop(.55, 'rgba(255, 255, 255, 0)');
    g.addColorStop(1, `rgba(40, 60, 110, ${grade * .9})`);
    ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalCompositeOperation = 'source-over';
  }
  if (_grain && grainAlpha > 0) {
    ctx.globalCompositeOperation = 'multiply';
    ctx.globalAlpha = grainAlpha;
    ctx.fillStyle = _grain;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
  if (vignette) {
    const g = ctx.createRadialGradient(SW/2, SH/2, SH*.42, SW/2, SH/2, SH*1.05);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, vignette);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
  }
  ctx.restore();
  bloomPass(bloom);
}

/* ───────── درخششِ نور (bloom) ─────────
   قابِ رسم‌شده را کوچک می‌کنیم، دو بار در خودش ضرب می‌کنیم تا فقط
   روشن‌ها بمانند، محوش می‌کنیم و با حالتِ «lighter» رویش می‌گذاریم.
   نتیجه: چراغ‌ها، شعله‌ها و رنگ‌های روشن نور پخش می‌کنند. */
let _bl, _blc, _bl2, _bl2c, _blNo = false, _blTick = 0;

function bloomPass(amount) {
  if (!amount || _blNo || !CV.width) return;
  /* کوچک‌کردن و بزرگ‌کردنِ دوباره، خودش محو می‌کند — از filter خیلی ارزان‌تر است */
  const W = Math.max(4, Math.round(CV.width * .2)), H = Math.max(4, Math.round(CV.height * .2));
  const W2 = Math.max(2, Math.round(W * .28)), H2 = Math.max(2, Math.round(H * .28));
  try {
    if (!_bl) {
      _bl = document.createElement('canvas'); _blc = _bl.getContext('2d');
      _bl2 = document.createElement('canvas'); _bl2c = _bl2.getContext('2d');
      if (!_blc || !_bl2c) { _blNo = true; return; }
    }
    if (_bl.width !== W || _bl.height !== H) { _bl.width = W; _bl.height = H; }
    if (_bl2.width !== W2 || _bl2.height !== H2) { _bl2.width = W2; _bl2.height = H2; }
    /* ساختنِ نور یک قاب در میان کافی است؛ گذاشتنش هر قاب. */
    _blTick = (_blTick + 1) & 1;
    if (!_blTick) {
      _blc.globalCompositeOperation = 'source-over';
      _blc.clearRect(0, 0, W, H);
      _blc.drawImage(CV, 0, 0, W, H);
      _blc.globalCompositeOperation = 'multiply';
      _blc.drawImage(_bl, 0, 0);
      _blc.drawImage(_bl, 0, 0);
      _blc.globalCompositeOperation = 'source-over';
      _bl2c.clearRect(0, 0, W2, H2);
      _bl2c.drawImage(_bl, 0, 0, W2, H2);
    }

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = amount;
    ctx.drawImage(_bl2, 0, 0, CV.width, CV.height);
    ctx.restore();
  } catch (e) { _blNo = true; }
}

/* ───────── لایهٔ ثابت ─────────
   هرچه در صحنه تکان نمی‌خورد را یک‌بار می‌کشیم و بعد فقط کپی می‌کنیم. */
const _layers = {};
function staticLayer(key, w, h, paint) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const L = _layers[key];
  if (L && L.q === q && L.w === w && L.h === h) return L.cv;
  const off = document.createElement('canvas');
  off.width = Math.max(1, Math.round(w * q));
  off.height = Math.max(1, Math.round(h * q));
  const c = off.getContext('2d');
  c.setTransform(q, 0, 0, q, 0, 0);
  const prev = ctx;
  ctx = c;
  try { paint(); } finally { ctx = prev; }
  _layers[key] = { cv: off, q, w, h };
  return off;
}

/* ───────── نورپردازی و بافت ─────────
   کارِ این‌ها این است که هیچ سطحی «تختِ یک‌رنگ» نماند. */

/** شیبِ عمودی: بالا روشن، پایین تیره. */
function vgrad(y0, y1, top, bot) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, top); g.addColorStop(1, bot);
  return g;
}

/** حجمِ کروی: نور از بالا-چپ، سایه در پایین-راست. */
function ball(cx, cy, r, lit, base, dark) {
  const g = ctx.createRadialGradient(cx - r * .38, cy - r * .42, r * .06, cx, cy, r * 1.06);
  g.addColorStop(0, lit); g.addColorStop(.45, base); g.addColorStop(1, dark);
  return g;
}

/** لبهٔ روشنِ بالا-چپِ یک مسیر — همان «rim light». */
function rim(pathFn, col, w = 2.2) {
  ctx.save();
  ctx.beginPath(); pathFn();
  ctx.clip();
  ctx.beginPath(); pathFn();
  ctx.strokeStyle = col; ctx.lineWidth = w * 2; ctx.lineJoin = 'round';
  ctx.translate(-w * .5, -w * .6);
  ctx.stroke();
  ctx.restore();
}

/** سایهٔ چسبیده به زمین — چیزها را روی سطح می‌نشاند. */
function contact(cx, cy, rx, ry, alpha = .26) {
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
  g.addColorStop(0, `rgba(20, 12, 6, ${alpha})`);
  g.addColorStop(1, 'rgba(20, 12, 6, 0)');
  ctx.save();
  ctx.fillStyle = g;
  ctx.translate(cx, cy); ctx.scale(1, ry / Math.max(rx, ry));
  ctx.beginPath(); ctx.arc(0, 0, Math.max(rx, ry), 0, TAU); ctx.fill();
  ctx.restore();
}

const _tex = {};
/** بافتِ تکرارشونده؛ یک‌بار ساخته و بعد از حافظه خوانده می‌شود. */
function texture(key, w, h, paint) {
  if (_tex[key]) return _tex[key];
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const c = off.getContext('2d');
  paint(c, w, h);
  _tex[key] = ctx.createPattern(off, 'repeat');
  return _tex[key];
}

/** رگهٔ چوب. */
function texWood(base, grain) {
  return texture('w' + base + grain, 120, 120, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = grain; c.lineWidth = 1.4;
    for (let i = 0; i < 9; i++) {
      c.globalAlpha = .18 + noise1(i * 3.1) * .3;
      c.beginPath();
      const y0 = i * 14 + noise1(i) * 6;
      c.moveTo(0, y0);
      for (let x = 0; x <= w; x += 10) c.lineTo(x, y0 + Math.sin(x * .09 + i) * 2.6);
      c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** تارِ پارچه. */
function texCloth(base, thread) {
  return texture('c' + base + thread, 16, 16, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = thread; c.lineWidth = 1; c.globalAlpha = .5;
    for (let i = 0; i < w; i += 4) {
      c.beginPath(); c.moveTo(i, 0); c.lineTo(i, h); c.stroke();
      c.beginPath(); c.moveTo(0, i); c.lineTo(w, i); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** دانه‌های سنگ. */
function texStone(base, spec) {
  return texture('s' + base + spec, 90, 90, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) {
      c.globalAlpha = .05 + noise1(i * 1.7) * .16;
      c.fillStyle = spec;
      const r = .6 + noise1(i * 5.3) * 1.9;
      c.beginPath();
      c.arc(noise1(i * 2.1) * w, noise1(i * 3.7 + 1) * h, r, 0, TAU);
      c.fill();
    }
    c.globalAlpha = 1;
  });
}

/** الیافِ کاغذ. */
function texPaper(base) {
  return texture('p' + base, 100, 100, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 130; i++) {
      c.globalAlpha = .04 + noise1(i * 2.3) * .07;
      c.strokeStyle = i % 2 ? '#ffffff' : '#5a4326';
      c.lineWidth = .9;
      const x = noise1(i * 1.3) * w, y = noise1(i * 4.1 + 2) * h;
      const a = noise1(i * 7.7) * TAU, l = 4 + noise1(i * 9.1) * 12;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

function buildGrain() {
  const s = 260;
  const off = document.createElement('canvas');
  off.width = off.height = s;
  const c = off.getContext('2d');
  const img = c.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    const v = 214 + Math.random() * 41;
    img.data[i*4] = v; img.data[i*4+1] = v; img.data[i*4+2] = v; img.data[i*4+3] = 255;
  }
  c.putImageData(img, 0, 0);
  return ctx.createPattern(off, 'repeat');
}

function toStage(e) {
  const r = CV.getBoundingClientRect();
  return {
    x: (e.clientX - r.left - view.ox) / view.scale,
    y: (e.clientY - r.top - view.oy) / view.scale,
  };
}

const inRect = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
const inCircle = (p, b, pad = 0) => Math.hypot(p.x - b.x, p.y - b.y) <= b.r + pad;

/* ───────── قلم‌های کاغذبُری ───────── */

/** دایره‌ای که انگار با قیچی بریده شده. */
function wobbleCircle(cx, cy, r, seed = 0, amp = 2.2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const rr = r + Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp * .45;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** بیضیِ ناصاف — برای چیزهایی که گرد نیستند ولی نرم‌اند. */
function wobbleEllipse(cx, cy, rx, ry, rot = 0, seed = 0, amp = 2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const w = 1 + (Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp*.45) / Math.max(rx, ry);
    const px = Math.cos(a) * rx * w, py = Math.sin(a) * ry * w;
    const x = cx + px*Math.cos(rot) - py*Math.sin(rot);
    const y = cy + px*Math.sin(rot) + py*Math.cos(rot);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** مستطیلِ گِرد با گوشه‌های کمی کج. */
function wobbleRect(x, y, w, h, r = 12, seed = 0, amp = 1.6) {
  const j = (k) => (noise1(seed*9.7 + k) - .5) * amp * 2;
  ctx.beginPath();
  ctx.moveTo(x + r + j(1), y + j(2));
  ctx.lineTo(x + w - r + j(3), y + j(4));
  ctx.quadraticCurveTo(x + w + j(5), y + j(6), x + w + j(7), y + r + j(8));
  ctx.lineTo(x + w + j(9), y + h - r + j(10));
  ctx.quadraticCurveTo(x + w + j(11), y + h + j(12), x + w - r + j(13), y + h + j(14));
  ctx.lineTo(x + r + j(15), y + h + j(16));
  ctx.quadraticCurveTo(x + j(17), y + h + j(18), x + j(19), y + h - r + j(20));
  ctx.lineTo(x + j(21), y + r + j(22));
  ctx.quadraticCurveTo(x + j(23), y + j(24), x + r + j(1), y + j(2));
  ctx.closePath();
}

/** سایهٔ نرم؛ نور از بالا-چپ. */
function withShadow(blur, dy, alpha, fn, hue = '78, 46, 24') {
  ctx.save();
  ctx.shadowColor = `rgba(${hue}, ${alpha})`;
  ctx.shadowBlur = blur;
  ctx.shadowOffsetY = dy;
  ctx.shadowOffsetX = dy * .35;
  fn();
  ctx.restore();
}

/** یک برگه‌ی کاغذ با سایه — پایه‌ی همه‌ی کارت‌ها و تابلوها. */
function paper(x, y, w, h, fill, seed = 1, r = 12, shadow = .26) {
  withShadow(16, 7, shadow, () => {
    ctx.fillStyle = fill;
    wobbleRect(x, y, w, h, r, seed, 2);
    ctx.fill();
  });
  /* الیافِ کاغذ و لبهٔ روشن، تا سطح تخت نماند */
  ctx.save();
  ctx.beginPath(); wobbleRect(x, y, w, h, r, seed, 2); ctx.clip();
  ctx.globalAlpha = .5;
  ctx.fillStyle = texPaper(fill);
  ctx.fillRect(x, y, w, h);
  ctx.globalAlpha = 1;
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.4, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(90,60,20,.1)');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
}

function text(str, x, y, o = {}) {
  const size = o.size || 20;
  const fam = o.family || 'Vazirmatn';
  ctx.save();
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.font = `${fam === 'Lalezar' ? '400' : (o.weight || 700)} ${size}px "${fam}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.baseline || 'middle';
  ctx.fillStyle = o.color || '#43291b';
  ctx.direction = 'rtl';
  if (o.stroke) {
    ctx.lineWidth = o.strokeWidth || 5;
    ctx.strokeStyle = o.stroke;
    ctx.lineJoin = 'round';
    ctx.strokeText(str, x, y, o.maxWidth);
  }
  ctx.fillText(str, x, y, o.maxWidth);
  ctx.restore();
}

/** متنِ چندخطی که خودش می‌شکند. ارتفاعِ اشغال‌شده را برمی‌گرداند. */
function textWrap(str, x, y, maxW, o = {}) {
  const size = o.size || 19, lh = o.lineHeight || size * 1.7;
  ctx.font = `${o.weight || 700} ${size}px "${o.family || 'Vazirmatn'}", Tahoma, sans-serif`;
  const lines = [];
  for (const para of str.split('\n')) {
    let line = '';
    for (const wd of para.split(' ')) {
      const t = line ? line + ' ' + wd : wd;
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = wd; }
      else line = t;
    }
    lines.push(line);
  }
  lines.forEach((l, i) => text(l, x, y + i * lh, o));
  return lines.length * lh;
}

/* ───────── ذره‌ها ───────── */

class Bits {
  constructor() { this.list = []; }
  add(x, y, n, kind, colors, opts = {}) {
    for (let i = 0; i < n; i++) {
      const a = opts.dir !== undefined ? opts.dir + (Math.random()-.5) * (opts.spread || 1) : Math.random() * TAU;
      const sp = (opts.speed || 200) * (.4 + Math.random());
      this.list.push({
        kind, x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - (opts.lift || 0),
        r: (opts.size || 4) * (.5 + Math.random()),
        rot: Math.random() * TAU, vr: (Math.random()-.5) * 10,
        col: colors[(Math.random() * colors.length) | 0],
        grav: opts.grav === undefined ? 620 : opts.grav,
        drag: opts.drag || .995,
        life: (opts.life || .9) * (.6 + Math.random() * .8), age: 0,
      });
    }
  }
  confetti(x, y, n, colors) {
    this.add(x, y, n, 'flake', colors, { speed: 420, lift: 190, size: 5, life: 1.6, grav: 780 });
  }
  spark(x, y, n, colors) {
    this.add(x, y, n, 'dot', colors, { speed: 180, lift: 30, size: 3.4, life: .7, grav: 260, drag: .93 });
  }
  step(dt) {
    for (const p of this.list) {
      p.age += dt;
      p.vy += p.grav * dt;
      p.vx *= p.drag; p.vy *= p.drag;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    }
    this.list = this.list.filter((p) => p.age < p.life);
  }
  draw() {
    for (const p of this.list) {
      const k = clamp(1 - p.age / p.life, 0, 1);
      ctx.save();
      ctx.globalAlpha = k;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.col;
      if (p.kind === 'flake') ctx.fillRect(-p.r, -p.r*1.5, p.r*2, p.r*3);
      else if (p.kind === 'leaf') { wobbleEllipse(0, 0, p.r*1.8, p.r*.8, 0, p.r, .6); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(0, 0, p.r * k, 0, TAU); ctx.fill(); }
      ctx.restore();
    }
  }
  clear() { this.list.length = 0; }
}

/* ───────── صدا (بدون فایل صوتی) ───────── */

const sfx = {
  ac: null, on: true,
  _c() {
    if (!this.on) return null;
    if (!this.ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; this.ac = new A(); }
    if (this.ac.state === 'suspended') this.ac.resume();
    return this.ac;
  },
  tone(f, dur = .16, type = 'sine', gain = .13, delay = 0) {
    const c = this._c(); if (!c) return;
    const t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(t0 + dur + .04);
  },
  tap()  { this.tone(430, .07, 'triangle', .09); },
  place(){ this.tone(620, .11, 'sine', .12); },
  pop()  { this.tone(760, .09, 'sine', .11); },
  slide(){ this.tone(240, .22, 'sine', .07); },
  good() { [523, 659, 784].forEach((f,i) => this.tone(f, .22, 'sine', .13, i*.07)); },
  win()  { [523, 659, 784, 1047].forEach((f,i) => this.tone(f, .34, 'triangle', .13, i*.10)); },
  nope() { this.tone(180, .2, 'sawtooth', .07); },
  tick() { this.tone(1100, .04, 'square', .05); },
};

/* ───────── قطعه‌های آماده ───────── */

function star(x, y, r, col, rot = 0) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = col;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI/2 + i * Math.PI/5;
    const rr = i % 2 ? r * .45 : r;
    const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/** دکمهٔ کاغذی. hovered را خودِ بازی می‌دهد؛ اینجا فقط کشیده می‌شود. */
/** رنگ را روشن‌تر (k>0) یا تیره‌تر (k<0) می‌کند. */
function shade(col, k) {
  const c = String(col).trim();
  let r, g2, b2;
  if (c[0] === '#') {
    const h = c.length === 4 ? c[1]+c[1]+c[2]+c[2]+c[3]+c[3] : c.slice(1, 7);
    r = parseInt(h.slice(0,2), 16); g2 = parseInt(h.slice(2,4), 16); b2 = parseInt(h.slice(4,6), 16);
  } else {
    const m = c.match(/[\d.]+/g);
    if (!m || m.length < 3) return col;
    r = +m[0]; g2 = +m[1]; b2 = +m[2];
  }
  const f = (v) => Math.round(clamp(k < 0 ? v * (1 + k) : v + (255 - v) * k, 0, 255));
  return 'rgb(' + f(r) + ',' + f(g2) + ',' + f(b2) + ')';
}

function button(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 3 : 0;
  const fill = o.disabled ? (o.off || '#bcaa92') : (hot ? (o.hotFill || o.fill) : o.fill);
  const r = o.r === undefined ? 14 : o.r;
  /* لبهٔ زیرینِ تیره — دکمه از صفحه بیرون می‌زند */
  ctx.fillStyle = shade(fill, -.36);
  wobbleRect(b.x, b.y + dy + 7, b.w, b.h, r, b.x + b.y, 2);
  ctx.fill();
  withShadow(hot ? 22 : 14, hot ? 5 : 8, .32, () => {
    ctx.fillStyle = fill;
    wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2);
    ctx.fill();
  });
  /* حجم: روشن از بالا، تیره به پایین */
  ctx.save();
  ctx.beginPath(); wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2); ctx.clip();
  const g = ctx.createLinearGradient(0, b.y + dy, 0, b.y + dy + b.h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.45, 'rgba(255,255,255,.04)');
  g.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = g;
  ctx.fillRect(b.x, b.y + dy, b.w, b.h);
  /* برقِ باریکِ لبهٔ بالا */
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.fillRect(b.x + r, b.y + dy + 2, b.w - r * 2, 2);
  ctx.restore();
  text(label, b.x + b.w/2, b.y + b.h/2 + dy - (o.sub ? 9 : 0), {
    size: o.size || 26, color: o.color || '#fdf6e8', family: o.family || 'Lalezar',
  });
  if (o.sub) text(o.sub, b.x + b.w/2, b.y + b.h/2 + dy + 17,
    { size: 14, color: o.subColor || 'rgba(255,255,255,.88)' });
}

/** دکمهٔ گرد کوچک (مثل + و −). */
function roundButton(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 2 : 0;
  withShadow(10, hot ? 3 : 5, .3, () => {
    ctx.fillStyle = o.disabled ? '#cbbba3' : (hot ? (o.hotFill || o.fill) : o.fill);
    wobbleCircle(b.x, b.y + dy, b.r, b.x, 1.4);
    ctx.fill();
  });
  text(label, b.x, b.y + dy - 1,
    { size: o.size || 32, color: o.disabled ? '#a8988a' : (o.color || '#fdf6e8'), family: 'Lalezar' });
}

/** پرده‌ی تمام‌صفحه: برای شروعِ پرده و برای جشنِ پایان. */
function overlay(o) {
  const k = easeOut(clamp(o.t / .5, 0, 1));
  ctx.fillStyle = `rgba(30, 22, 16, ${.66 * k})`;
  ctx.fillRect(0, 0, SW, SH);

  const w = o.w || 700, h = o.h || 290;
  const x = (SW - w) / 2, y = o.y || (SH * .22);
  const s = lerp(.9, 1, easeBack(clamp(o.t / .65, 0, 1)));
  ctx.save();
  ctx.translate(SW/2, y + h/2);
  ctx.scale(s, s);
  ctx.translate(-SW/2, -(y + h/2));

  withShadow(30, 14, .42, () => {
    ctx.fillStyle = o.paper || '#fbf3e2';
    wobbleRect(x, y, w, h, 18, 121, 2.4);
    ctx.fill();
  });
  ctx.fillStyle = o.band || '#c8434f';
  wobbleRect(x, y, w, 12, 6, 123, 1);
  ctx.fill();

  if (o.icon) o.icon(SW/2, y + 56);
  text(o.title, SW/2, y + (o.icon ? 108 : 62),
    { size: o.titleSize || 36, color: o.ink || '#43291b', family: 'Lalezar', alpha: k });
  textWrap(o.body, SW/2, y + (o.icon ? 158 : 116), w - 90,
    { size: 19, color: o.inkSoft || '#8a6a52', alpha: k });
  ctx.restore();

  button(o.btn, o.btnLabel, { hot: o.btnHot, fill: o.btnFill || '#7fa356', hotFill: o.btnHotFill || '#8fb45f', size: 28 });
}

/** پیامِ کوتاهِ بالای صحنه. */
class Toast {
  constructor() { this.msg = null; this.t = 0; this.kind = 'info'; }
  say(msg, kind = 'info') { this.msg = msg; this.kind = kind; this.t = 2.6; }
  step(dt) { if (this.t > 0) { this.t -= dt; if (this.t <= 0) this.msg = null; } }
  draw(y = 24, colors = {}) {
    if (!this.msg) return;
    const k = clamp(this.t, 0, 1) * clamp((2.6 - this.t) * 5, 0, 1);
    ctx.save();
    ctx.globalAlpha = k;
    ctx.font = `700 19px "Vazirmatn", Tahoma, sans-serif`;
    const w = ctx.measureText(this.msg).width + 76;
    const fill = this.kind === 'good' ? (colors.good || '#7fa356')
               : this.kind === 'bad' ? (colors.bad || '#c8434f')
               : (colors.info || '#fbf3e2');
    paper(SW/2 - w/2, y, w, 48, fill, 151, 12, .3);
    text(this.msg, SW/2, y + 25,
      { size: 19, color: this.kind === 'info' ? (colors.ink || '#43291b') : '#fff8ec' });
    ctx.restore();
  }
}

/* ───────── آموزشِ پرده‌ای ─────────
   پرده‌هایی که منتظرِ کارِ بچه نیستند با یک ضربه جلو می‌روند. تایمر فقط
   پشتیبان است؛ بچهٔ کلاس سومی باید فرصتِ خواندن داشته باشد، نه اینکه
   متن قبل از تمام شدنِ خواندنش برود.                                    */

/** اگر پردهٔ فعلی خواندنی است، ضربه را می‌خورد و می‌رود پردهٔ بعد. */
function tutTap(tut, tapSteps, lastStep) {
  if (!tut.on || tapSteps.indexOf(tut.step) < 0) return false;
  if (tut.step >= lastStep) tut.on = false;
  else { tut.step++; tut.t = 0; }
  sfx.tap();
  return true;
}

/** نشانهٔ «برای ادامه بزن» — زیرِ کارتِ آموزش. */
function tutMore(cx, y, t, ink = '#3a2a18', bg = 'rgba(255, 250, 238, .94)') {
  ctx.save();
  ctx.globalAlpha = .62 + .38 * Math.sin(t * 3.2);
  ctx.font = '700 15px "Vazirmatn", Tahoma, sans-serif';
  const label = 'برای ادامه، هرجا را بزن';
  const w = ctx.measureText(label).width + 40, h = 32, x = cx - w / 2, r = 16;
  withShadow(10, 4, .3, () => {
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath(); ctx.fill();
  });
  text(label, cx, y + h / 2, { size: 15, color: ink });
  ctx.restore();
}

/** فونت‌ها را می‌آورد و بعد بازی را شروع می‌کند.
    مهم: هر دو راه (رسیدنِ فونت و مهلتِ پشتیبان) ممکن است برسند، ولی
    شروع فقط باید یک بار انجام شود؛ وگرنه دو حلقهٔ فریم راه می‌افتد و
    بازی دوبرابر سریع می‌شود. */
function whenFontsReady(start) {
  let done = false;
  const go = () => { if (done) return; done = true; start(); };
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('400 40px Lalezar'),
      document.fonts.load('700 20px Vazirmatn'),
      document.fonts.load('900 20px Vazirmatn'),
    ]).then(go, go);
    setTimeout(go, 2600);
  } else go();
}

/** حلقهٔ فریم با dtِ محدودشده. */
/* ───────── کیفیتِ خودکار ─────────
   اگر دستگاه کُند بود، اوّل درخشش و بعد رنگ‌بندی خاموش می‌شود تا بازی
   روان بماند. روی دستگاهِ قوی همه‌چیز روشن است. */
let QUALITY = 2;
let _fAcc = 0, _fN = 0, _qHold = 0;

function _qualityTick(gap) {
  if (gap <= 0 || gap > 200) return;
  _fAcc += gap; _fN++;
  if (_fN < 45) return;
  const avg = _fAcc / _fN;
  _fAcc = 0; _fN = 0;
  if (_qHold > 0) { _qHold--; return; }
  const before = QUALITY;
  if (avg > 25 && QUALITY > 0) { QUALITY--; _qHold = 3; }
  else if (avg < 18.5 && QUALITY < 2) { QUALITY++; _qHold = 6; }
  /* در پایین‌ترین کیفیت، صحنه را با نقطه‌های کمتر می‌کشیم */
  if (before !== QUALITY && (before === 0 || QUALITY === 0) && _refit) _refit();
}

/* یک حلقه، نه بیشتر — دو حلقه یعنی زمانِ بازی دوبرابر می‌گذرد. */
let _looping = false;
function runLoop(step) {
  if (_looping) return;
  _looping = true;
  let last = performance.now();
  const frame = (now) => {
    const gap = now - last;
    const dt = Math.min(gap / 1000, 1/20);
    last = now;
    _qualityTick(gap);
    step(dt);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

/* ═══════════════════════════════════════════════════════════════════════
   هندوانه‌فروشِ تابستان — ریاضی سوم، فصل ۳، درس ۵ (مقایسهٔ کسرها)
   ───────────────────────────────────────────────────────────────────────
   کتاب دو نتیجه می‌گیرد:
     • اگر مخرج‌ها برابر باشند، هر کدام صورتش بزرگ‌تر است بزرگ‌تر است.
     • اگر صورت‌ها برابر باشند، هر کدام مخرجش بزرگ‌تر است کوچک‌تر است.

   دوّمی همان چیزی است که بچه‌ها معمولاً برعکس می‌فهمند. اینجا حرفش زده
   نمی‌شود؛ دیده می‌شود:

     چاقو را که می‌چرخانی، هندوانه به قاچ‌های بیشتری بریده می‌شود و هر
     قاچ جلوی چشمِ بچه نازک‌تر می‌شود.

   سفارشِ مشتری همیشه یک «بازه» است: بیشتر از این، کمتر از آن. پس بچه
   مجبور است کسرها را کنارِ هم بچیند، نه فقط بزرگ و کوچک بگوید. و چون
   هندوانه‌ها شمرده‌اند، قاچِ بیخودی زیاد دادن خرج دارد.

   بعد از «بفرمایید»، ترازوی برنجی نشان می‌دهد قاچِ تو کجای بازه نشست —
   جواب قبلش هیچ‌جا گفته نمی‌شود.

      { lo: F(3, 4), hi: F(5, 6) },
      { eq: F(2, 6) },
    ],
    hint: 'بازه‌ها تنگ شده‌اند. آخری هم دقیقاً هم‌اندازه می‌خواهد.' },
  { name: 'بازارِ آزاد', melons: 6, pics: false, endless: true,
    hint: 'مشتری‌ها یکی‌یکی می‌آیند. هندوانه‌ها را حرام نکن.' },
];

/* ───────── وضعیت ───────── */

const S = {
  phase: 'intro',        // intro | play | judge | won | lost
  level: 0,
  oi: 0,                 // شمارهٔ سفارش
  order: null,
  d: 4,                  // چند قاچ
  taken: [],             // قاچ‌های برداشته‌شده (اندیس)
  melons: 0,
  served: 0,
  hearts: 3,
  score: 0, best: 0,
  judge: null,           // { ok, mine, t }
  cutT: 0,               // انیمیشنِ بریدن
  t: 0, phaseT: 0,
  hover: null,
  shake: 0,
  bubbles: [],
  floats: [],
  tut: { on: true, step: 0, t: 0 },
};

const bits = new Bits();
const toast = new Toast();
const L = () => LEVELS[S.level];
const mine = () => S.taken.length / S.d;

function loadBest() { try { return +localStorage.getItem('hend-best') || 0; } catch { return 0; } }
function saveBest(v) { try { localStorage.setItem('hend-best', String(v)); } catch { /* حالت خصوصی */ } }

/* ───────── چیدمان ───────── */

const HUD_H = 52;
const CARD = { x: 28, y: 96, w: 258, h: 226 };
const STOCK = { x: 28, y: 342, w: 258, h: 128 };
const MELON = { x: 578, y: 388, r: 168 };
const PLATE = { x: 966, y: 372, r: 122 };
const DIAL = { x: 430, y: 618, w: 296, h: 74 };
const BTN_MINUS = { x: 430, y: 618, w: 74, h: 74 };
const BTN_PLUS = { x: 652, y: 618, w: 74, h: 74 };
const BTN_GIVE = { x: 850, y: 618, w: 232, h: 74 };
const BTN_GO = { x: 470, y: 566, w: 260, h: 76 };

/** زاویهٔ قاچِ i اُم؛ از بالا شروع می‌شود. */
function wedgeAngles(i, d) {
  const a0 = -Math.PI / 2 + i * TAU / d;
  return [a0, a0 + TAU / d];
}

/* ───────── حلقه ───────── */

const cv = document.getElementById('stage');
initStage(cv, SCENE_W, SCENE_H);
S.best = loadBest();
whenFontsReady(() => runLoop(step));

/** بازهٔ تصادفی که با مخرجِ ۲ تا ۱۲ حتماً جواب دارد. */
function randomOrder() {
  const cands = [];
  for (let d1 = 2; d1 <= 8; d1++) for (let n1 = 1; n1 < d1; n1++)
    for (let d2 = 2; d2 <= 8; d2++) for (let n2 = 1; n2 < d2; n2++) {
      const a = n1 / d1, b = n2 / d2;
      if (b - a < .1 || b - a > .35) continue;
      let ok = false;
      for (let d = MIND; d <= MAXD && !ok; d++)
        for (let n = 1; n < d; n++) if (n / d > a + 1e-9 && n / d < b - 1e-9) { ok = true; break; }
      if (ok) cands.push({ lo: F(n1, d1), hi: F(n2, d2) });
    }
  if (Math.random() < .2) {
    const d = 2 + Math.floor(Math.random() * 5);
    const n = 1 + Math.floor(Math.random() * (d - 1));
    return { eq: F(n * 2, d * 2) };
  }
  return cands[Math.floor(Math.random() * cands.length)];
}

function nextOrder() {
  const lv = L();
  S.order = lv.endless ? randomOrder() : lv.orders[S.oi];
  S.d = 4;
  S.taken = [];
  S.judge = null;
  S.phase = 'play'; S.phaseT = 0;
}

function startLevel(i, keep) {
  const lv = LEVELS[i];
  S.level = i;
  S.oi = 0;
  S.melons = lv.melons;
  S.served = 0;
  if (!keep) S.hearts = 3;
  S.bubbles = [];
  nextOrder();
  S.tut.on = i === 0 && !keep; S.tut.step = 0; S.tut.t = 0;
  toast.say(lv.hint, 'info');
}

function floatText(x, y, txt, col, size) { S.floats.push({ x, y, txt, col, t: 0, size: size || 26 }); }

function step(dt) {
  S.t += dt; S.phaseT += dt;
  if (S.shake > 0) S.shake -= dt;
  if (S.cutT > 0) S.cutT = Math.max(0, S.cutT - dt * 3);
  if (S.judge) {
    S.judge.t += dt;
    if (S.judge.t > 2.6) afterJudge();
  }
  for (const b of S.bubbles) { b.y -= b.sp * dt; b.ph += dt * 2; }
  S.bubbles = S.bubbles.filter((b) => b.y > -30);
  for (const f of S.floats) { f.t += dt; f.y -= 42 * dt; }
  S.floats = S.floats.filter((f) => f.t < 1.5);
  if (S.phase === 'play' && S.tut.on) tutStep(dt);
  bits.step(dt);
  toast.step(dt);
  draw();
}

/* ───────── بریدن و برداشتن ─────────
   عوض کردنِ تعدادِ قاچ‌ها یعنی هندوانه را از نو بریدن، پس بشقاب خالی
   می‌شود. همین باعث می‌شود بچه اوّل فکر کند بعد ببُرد.                */

function setD(v) {
  if (S.phase !== 'play') return;
  const nv = clamp(v, MIND, MAXD);
  if (nv === S.d) { S.shake = .12; return; }
  S.d = nv;
  S.taken = [];
  S.cutT = 1;
  sfx.tone(300 + nv * 14, .1, 'triangle', .07);
}

function takeWedge(i) {
  if (S.phase !== 'play') return;
  const k = S.taken.indexOf(i);
  if (k >= 0) { S.taken.splice(k, 1); sfx.tap(); return; }
  if (S.taken.length >= S.d - 0) return;
  S.taken.push(i);
  sfx.place();
  const a = wedgeAngles(i, S.d);
  const mid = (a[0] + a[1]) / 2;
  bits.add(MELON.x + Math.cos(mid) * MELON.r * .6, MELON.y + Math.sin(mid) * MELON.r * .6,
    6, 'dot', [P.fleshLit, P.flesh, '#fff'], { speed: 100, lift: 40, size: 3, life: .5 });
}

/* ───────── داوریِ ترازو ───────── */

function give() {
  if (S.phase !== 'play' || !S.taken.length) return;
  const o = S.order, m = mine();
  const ok = o.eq
    ? Math.abs(m - val(o.eq)) < 1e-9
    : (m > val(o.lo) + 1e-9 && m < val(o.hi) - 1e-9);
  S.melons--;
  S.judge = { ok, mine: m, t: 0, d: S.d, n: S.taken.length };
  S.phase = 'judge';
  if (ok) {
    /* هرچه به مرزِ پایین نزدیک‌تر، هندوانهٔ کمتری حرام شده */
    const waste = o.eq ? 0 : (m - val(o.lo)) / Math.max(.001, val(o.hi) - val(o.lo));
    const pts = 250 + Math.round((1 - waste) * 150);
    S.score += pts;
    if (S.score > S.best) { S.best = S.score; saveBest(S.best); }
    S.served++;
    floatText(PLATE.x, PLATE.y - 130, `+${fa(pts)}`, P.gold);
    bits.confetti(PLATE.x, PLATE.y - 40, 40, [P.gold, P.fleshLit, P.skinLit, '#fff']);
    sfx.win();
  } else {
    S.hearts--;
    S.shake = .4;
    sfx.nope();
  }
}

function afterJudge() {
  const lv = L();
  S.judge = null;
  if (S.hearts <= 0) { S.phase = 'lost'; S.phaseT = 0; return; }
  if (S.melons <= 0) {
    /* در بازارِ آزاد، تمام‌شدنِ هندوانه یعنی روز تمام شد، نه باخت. */
    S.phase = lv.endless ? 'won' : 'lost';
    S.phaseT = 0;
    if (lv.endless) sfx.win();
    return;
  }
  S.oi++;
  if (!lv.endless && S.oi >= lv.orders.length) {
    S.phase = 'won'; S.phaseT = 0;
    S.score += S.melons * 120;
    if (S.score > S.best) { S.best = S.score; saveBest(S.best); }
    sfx.win();
    return;
  }
  nextOrder();
  for (let i = 0; i < 6; i++) {
    S.bubbles.push({ x: 200 + Math.random() * 800, y: SCENE_H + 20,
                     r: 3 + Math.random() * 5, sp: 30 + Math.random() * 40, ph: Math.random() * TAU });
  }
}

/* ───────── آموزش ───────── */

const TUT_TAP = [0, 2], TUT_LAST = 2;

function tutStep(dt) {
  S.tut.t += dt;
  if (S.tut.step === 0 && S.tut.t > 30) { S.tut.step = 1; S.tut.t = 0; }
  if (S.tut.step === 1 && S.taken.length > 0) { S.tut.step = 2; S.tut.t = 0; }
  if (S.tut.step === 2 && S.tut.t > 30) S.tut.on = false;
}

/* ───────── ورودی ───────── */

function hitTest(p) {
  if (S.phase !== 'play') return inRect(p, BTN_GO) ? BTN_GO : null;
  if (inRect(p, BTN_MINUS)) return BTN_MINUS;
  if (inRect(p, BTN_PLUS)) return BTN_PLUS;
  if (inRect(p, BTN_GIVE)) return BTN_GIVE;
  const dx = p.x - MELON.x, dy = p.y - MELON.y;
  const r = Math.hypot(dx, dy);
  if (r < MELON.r + 18) {
    let a = Math.atan2(dy, dx) + Math.PI / 2;
    a = ((a % TAU) + TAU) % TAU;
    return { wedge: Math.floor(a / (TAU / S.d)) % S.d };
  }
  return null;
}

cv.addEventListener('pointermove', (e) => {
  S.hover = hitTest(toStage(e));
  cv.style.cursor = S.hover ? 'pointer' : 'default';
});
cv.addEventListener('pointerleave', () => { S.hover = null; });
cv.addEventListener('pointerdown', (e) => {
  if (S.phase === 'play' && tutTap(S.tut, TUT_TAP, TUT_LAST)) return;
  const h = hitTest(toStage(e));
  if (S.phase === 'intro') { if (h) startLevel(0); return; }
  if (S.phase === 'judge') return;
  if (S.phase === 'won') {
    if (!h) return;
    if (L().endless) startLevel(S.level, true);
    else if (S.level + 1 < LEVELS.length) startLevel(S.level + 1, true);
    else { S.score = 0; startLevel(0); }
    return;
  }
  if (S.phase === 'lost') { if (h) { S.score = 0; startLevel(S.level); } return; }
  if (!h) return;
  if (h === BTN_MINUS) return setD(S.d - 1);
  if (h === BTN_PLUS) return setD(S.d + 1);
  if (h === BTN_GIVE) return give();
  if (h.wedge !== undefined) return takeWedge(h.wedge);
});

/* ───────── ابزارِ نقاشی ───────── */

function rrPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function numText(str, x, y, o = {}) {
  ctx.save();
  ctx.font = `${o.family === 'Vazirmatn' ? (o.weight || 700) : '400'} ${o.size || 20}px "${o.family || 'Lalezar'}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  ctx.direction = 'ltr';
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.fillStyle = o.color || P.ink;
  ctx.fillText(str, x, y);
  ctx.restore();
}

function frac(cx, cy, n, d, size, color) {
  numText(fa(n), cx, cy - size * .42, { size, color });
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = Math.max(2.2, size * .07);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - size * .42, cy); ctx.lineTo(cx + size * .42, cy);
  ctx.stroke();
  ctx.restore();
  numText(fa(d), cx, cy + size * .5, { size, color });
}

function spot(rects, alpha) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, SCENE_W, SCENE_H);
  for (const r of rects) rrPath(r.x - 12, r.y - 12, r.w + 24, r.h + 24, 22);
  ctx.fillStyle = `rgba(8, 22, 18, ${alpha})`;
  ctx.fill('evenodd');
  ctx.restore();
}

function pointHand(x, y) {
  const bob = Math.sin(S.t * 3.4) * 8;
  ctx.save();
  ctx.translate(x, y + bob);
  withShadow(12, 5, .4, () => {
    ctx.fillStyle = '#f6dfc0';
    ctx.beginPath();
    ctx.moveTo(0, -6);
    ctx.quadraticCurveTo(-9, -2, -10, 16);
    ctx.quadraticCurveTo(-11, 34, 0, 36);
    ctx.quadraticCurveTo(11, 34, 10, 16);
    ctx.quadraticCurveTo(9, -2, 0, -6);
    ctx.closePath(); ctx.fill();
    wobbleCircle(0, -12, 8, 4, 1); ctx.fill();
  }, '10, 30, 24');
  ctx.strokeStyle = '#c9a982'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-7, 18); ctx.lineTo(7, 18); ctx.stroke();
  ctx.restore();
}

/** یک قاچِ هندوانه: گوشتِ سرخ، سفیدیِ زیرِ پوست، پوستِ سبز، و تخمه‌ها. */
function wedge(cx, cy, r, a0, a1, o = {}) {
  const pull = o.pull || 0;
  const mid = (a0 + a1) / 2;
  ctx.save();
  ctx.translate(Math.cos(mid) * pull, Math.sin(mid) * pull);
  if (o.shadow) {
    ctx.save();
    ctx.globalAlpha = .3;
    ctx.fillStyle = '#0b1d17';
    ctx.beginPath();
    ctx.moveTo(cx + 4, cy + 8);
    ctx.arc(cx + 4, cy + 8, r, a0, a1);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  /* گوشت */
  ctx.fillStyle = o.dim ? '#8a6a58' : P.flesh;
  ctx.beginPath();
  ctx.moveTo(cx, cy); ctx.arc(cx, cy, r * .84, a0, a1); ctx.closePath(); ctx.fill();
  if (!o.dim) {
    ctx.fillStyle = P.fleshLit;
    ctx.beginPath();
    ctx.moveTo(cx, cy); ctx.arc(cx, cy, r * .84, a0, a0 + (a1 - a0) * .32); ctx.closePath();
    ctx.globalAlpha = .5; ctx.fill(); ctx.globalAlpha = 1;
    /* تخمه‌ها */
    ctx.fillStyle = P.seed;
    for (let k = 0; k < 3; k++) {
      const t = .38 + k * .2;
      const a = a0 + (a1 - a0) * (.3 + noise1(a0 * 7 + k) * .45);
      ctx.save();
      ctx.translate(cx + Math.cos(a) * r * t, cy + Math.sin(a) * r * t);
      ctx.rotate(a);
      ctx.beginPath(); ctx.ellipse(0, 0, 4.4, 2.6, 0, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }
  /* سفیدیِ زیرِ پوست */
  ctx.fillStyle = o.dim ? '#c9c4b4' : P.rind;
  ctx.beginPath();
  ctx.arc(cx, cy, r * .92, a0, a1);
  ctx.arc(cx, cy, r * .84, a1, a0, true);
  ctx.closePath(); ctx.fill();
  /* پوست */
  ctx.fillStyle = o.dim ? '#6b7a63' : P.skin;
  ctx.beginPath();
  ctx.arc(cx, cy, r, a0, a1);
  ctx.arc(cx, cy, r * .92, a1, a0, true);
  ctx.closePath(); ctx.fill();
  if (!o.dim) {
    ctx.strokeStyle = P.skinDk; ctx.lineWidth = 3;
    for (let k = 0; k < 2; k++) {
      const a = a0 + (a1 - a0) * (.3 + k * .4);
      ctx.beginPath(); ctx.arc(cx, cy, r * .96, a - .05, a + .05); ctx.stroke();
    }
  }
  ctx.restore();
}

/** هندوانهٔ بریده‌شده. taken = قاچ‌هایی که برداشته شده‌اند. */
function cutDisc(cx, cy, r, d, taken, o = {}) {
  /* تخته زیرش */
  if (o.board) {
    ctx.fillStyle = P.boardDk;
    wobbleCircle(cx + 4, cy + 10, r + 22, 11, 2); ctx.fill();
    ctx.fillStyle = P.board;
    wobbleCircle(cx, cy + 4, r + 22, 13, 2); ctx.fill();
  }
  for (let i = 0; i < d; i++) {
    if (taken && taken.indexOf(i) >= 0) continue;
    const [a0, a1] = wedgeAngles(i, d);
    const hot = o.hover === i;
    wedge(cx, cy, r, a0 + .006, a1 - .006, { shadow: true, pull: hot ? 8 : 0 });
  }
  /* خط‌های چاقو */
  if (o.cutFlash) {
    ctx.save();
    ctx.globalAlpha = o.cutFlash * .9;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    for (let i = 0; i < d; i++) {
      const a = -Math.PI / 2 + i * TAU / d;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(a) * (r + 16), cy + Math.sin(a) * (r + 16));
      ctx.stroke();
    }
    ctx.restore();
  }
}

/** آیکنِ کوچکِ کسر: دایره‌ای که n قسمت از d قسمتش پُر است. */
function pieIcon(cx, cy, r, n, d, col) {
  ctx.fillStyle = 'rgba(255,255,255,.75)';
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill();
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + TAU * (n / d));
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(40, 50, 44, .5)'; ctx.lineWidth = 1.4;
  for (let i = 0; i < d; i++) {
    const a = -Math.PI / 2 + i * TAU / d;
    ctx.beginPath();
    ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
    ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(40, 50, 44, .7)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();
}

/* ───────── صحنه ───────── */

function draw() {
  beginScene('#10231c');
  ctx.save();
  if (S.shake > 0) {
    const k = S.shake * 13;
    ctx.translate(Math.sin(S.t * 58) * k, Math.cos(S.t * 45) * k * .5);
  }

  drawStreet();
  drawCart();
  drawMelon();
  drawPlate();
  bits.draw();
  ctx.restore();

  drawCard();
  drawStock();
  drawDial();
  drawGive();
  drawFloats();
  drawHUD();
  if (!(S.phase === 'play' && S.tut.on)) {
    toast.draw(HUD_H + 8, { good: P.good, bad: P.bad, info: P.paper, ink: P.ink });
  }

  if (S.phase === 'judge') drawJudge();
  if (S.phase === 'play' && S.tut.on) drawTutorial();
  if (S.phase === 'intro') drawIntro();
  if (S.phase === 'won') drawWon();
  if (S.phase === 'lost') drawLost();

  endScene(.12, 'rgba(10, 30, 20, .40)');
}

function drawStreet() {
  const g = ctx.createLinearGradient(0, 0, 0, 520);
  g.addColorStop(0, P.skyHi);
  g.addColorStop(.6, '#7fa08a');
  g.addColorStop(1, P.skyLo);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, SCENE_W, SCENE_H);

  /* خانه‌های آن‌طرفِ خیابان */
  ctx.fillStyle = 'rgba(40, 66, 60, .5)';
  for (let i = 0; i < 7; i++) {
    const x = i * 186 - 40, h = 150 + noise1(i * 3) * 120;
    wobbleRect(x, 300 - h, 168, h, 4, i * 5, 1.6); ctx.fill();
  }
  ctx.fillStyle = 'rgba(255, 232, 190, .18)';
  for (let i = 0; i < 22; i++) {
    const x = 20 + noise1(i * 7.3) * 1160, y = 180 + noise1(i * 3.1) * 100;
    wobbleRect(x, y, 22, 30, 3, i, 1); ctx.fill();
  }

  /* نورِ داغِ تابستان */
  const gl = ctx.createRadialGradient(980, 60, 30, 980, 60, 700);
  gl.addColorStop(0, P.sun);
  gl.addColorStop(1, 'rgba(255, 222, 150, 0)');
  ctx.fillStyle = gl;
  ctx.fillRect(0, 0, SCENE_W, SCENE_H);

  /* سایبانِ راه‌راه */
  ctx.save();
  const aw = 168;
  for (let i = 0; i < 14; i++) {
    ctx.fillStyle = i % 2 ? P.awning1 : P.awning2;
    ctx.beginPath();
    ctx.moveTo(i * 92 - 20, 52);
    ctx.lineTo(i * 92 + 72, 52);
    ctx.lineTo(i * 92 + 62, aw - 10 + Math.sin(i) * 4);
    ctx.quadraticCurveTo(i * 92 + 26, aw + 16, i * 92 - 10, aw - 10 + Math.sin(i) * 4);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = 'rgba(0,0,0,.16)';
  ctx.fillRect(0, 52, SCENE_W, 16);
  ctx.restore();

  /* حباب‌های خنکی */
  ctx.save();
  for (const b of S.bubbles) {
    ctx.globalAlpha = .3;
    ctx.fillStyle = P.ice;
    ctx.beginPath(); ctx.arc(b.x + Math.sin(b.ph) * 8, b.y, b.r, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawCart() {
  /* پیشخوانِ چوبی */
  ctx.fillStyle = P.woodDk;
  wobbleRect(0, 556, SCENE_W, 30, 0, 21, 1.6); ctx.fill();
  ctx.fillStyle = P.wood;
  wobbleRect(0, 544, SCENE_W, 20, 0, 23, 1.4); ctx.fill();
  ctx.fillStyle = P.woodLit;
  wobbleRect(0, 542, SCENE_W, 7, 0, 25, .8); ctx.fill();
  ctx.fillStyle = '#4a2f16';
  ctx.fillRect(0, 586, SCENE_W, SCENE_H - 586);
  ctx.save();
  ctx.globalAlpha = .2;
  ctx.strokeStyle = '#2c1b0c'; ctx.lineWidth = 3;
  for (let i = 0; i < 10; i++) {
    ctx.beginPath(); ctx.moveTo(i * 132, 586); ctx.lineTo(i * 132 - 60, SCENE_H); ctx.stroke();
  }
  ctx.restore();

  /* هندوانه‌های سالم، گوشهٔ پیشخوان */
  for (let i = 0; i < Math.min(4, S.melons); i++) {
    const x = 92 + i * 46 + (i % 2) * 8, y = 524 - (i % 2) * 12;
    ctx.save();
    ctx.globalAlpha = .35;
    ctx.fillStyle = '#0b1d17';
    wobbleEllipse(x + 4, y + 26, 34, 10, 0, i, 1.4); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = P.skin;
    wobbleCircle(x, y, 33, i * 3 + 1, 1.8); ctx.fill();
    ctx.fillStyle = P.skinDk;
    for (let k = -2; k <= 2; k++) {
      ctx.save();
      ctx.beginPath(); ctx.arc(x, y, 33, 0, TAU); ctx.clip();
      ctx.beginPath();
      ctx.ellipse(x + k * 13, y, 5, 34, 0, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = 'rgba(255,255,255,.22)';
    wobbleEllipse(x - 11, y - 13, 9, 6, -.6, i * 2, 1); ctx.fill();
    ctx.restore();
  }
}

function drawMelon() {
  const hov = S.hover && S.hover.wedge !== undefined ? S.hover.wedge : -1;
  cutDisc(MELON.x, MELON.y, MELON.r, S.d, S.taken,
    { board: true, hover: S.phase === 'play' ? hov : -1, cutFlash: S.cutT });
  /* چاقو، تکیه‌داده به تخته */
  ctx.save();
  ctx.translate(MELON.x - MELON.r - 34, 566);
  ctx.rotate(-.38);
  ctx.fillStyle = '#c6ced4';
  ctx.beginPath();
  ctx.moveTo(-8, 0); ctx.lineTo(8, -4); ctx.lineTo(6, -108); ctx.lineTo(-6, -104);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e6edf1';
  ctx.beginPath();
  ctx.moveTo(6, -108); ctx.lineTo(-6, -104); ctx.lineTo(-3, -100); ctx.lineTo(5, -102);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = P.woodDk;
  wobbleRect(-10, -2, 20, 46, 5, 3, 1); ctx.fill();
  ctx.restore();
}

function drawPlate() {
  /* بشقابِ برنجی */
  ctx.save();
  ctx.globalAlpha = .3;
  ctx.fillStyle = '#0b1d17';
  wobbleEllipse(PLATE.x + 6, PLATE.y + 132, PLATE.r + 18, 16, 0, 31, 1.6); ctx.fill();
  ctx.restore();
  ctx.fillStyle = P.brassDk;
  wobbleCircle(PLATE.x, PLATE.y + 8, PLATE.r + 20, 33, 2); ctx.fill();
  ctx.fillStyle = P.brass;
  wobbleCircle(PLATE.x, PLATE.y, PLATE.r + 20, 35, 2); ctx.fill();
  ctx.fillStyle = '#e8c073';
  wobbleCircle(PLATE.x, PLATE.y, PLATE.r + 8, 37, 1.6); ctx.fill();

  if (!S.taken.length) {
    text('قاچ‌ها را بگذار اینجا', PLATE.x, PLATE.y, { size: 17, color: 'rgba(60, 46, 20, .55)' });
  } else {
    /* قاچ‌های برداشته‌شده، کنارِ هم چیده تا کسر خوانده شود */
    for (let k = 0; k < S.taken.length; k++) {
      const [a0, a1] = wedgeAngles(k, S.d);
      wedge(PLATE.x, PLATE.y, PLATE.r, a0 + .006, a1 - .006, { shadow: true });
    }
    ctx.strokeStyle = 'rgba(90, 60, 20, .35)'; ctx.lineWidth = 2;
    ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.arc(PLATE.x, PLATE.y, PLATE.r, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
  }
  /* کسرِ روی بشقاب */
  text('روی بشقاب', PLATE.x + 74, PLATE.y - PLATE.r - 44, { size: 16, color: 'rgba(251, 243, 224, .78)' });
  frac(PLATE.x - 22, PLATE.y - PLATE.r - 42, S.taken.length, S.d, 32, '#fbf3e0');
}

/* ───────── کارتِ سفارش ───────── */

function drawCard() {
  const b = CARD, o = S.order;
  if (!o) return;
  withShadow(20, 9, .4, () => {
    ctx.fillStyle = P.paper;
    wobbleRect(b.x, b.y, b.w, b.h, 14, 41, 2); ctx.fill();
  }, '10, 30, 24');
  ctx.fillStyle = P.awning1;
  wobbleRect(b.x, b.y, b.w, 11, 5, 43, .8); ctx.fill();
  text('مشتری می‌خواهد', b.x + b.w / 2, b.y + 38, { size: 19, family: 'Lalezar', color: P.inkSoft });

  const pics = L().pics;
  if (o.eq) {
    text('دقیقاً هم‌اندازهٔ', b.x + b.w / 2, b.y + 74, { size: 17, color: P.ink });
    frac(b.x + b.w / 2 + (pics ? 44 : 0), b.y + 132, o.eq.n, o.eq.d, 44, P.ink);
    if (pics) pieIcon(b.x + b.w / 2 - 56, b.y + 132, 34, o.eq.n, o.eq.d, P.flesh);
    text('از یک هندوانه', b.x + b.w / 2, b.y + 190, { size: 15, color: P.inkSoft });
  } else {
    const row = (label, f, y) => {
      text(label, b.x + b.w - 26, y, { size: 16, color: P.inkSoft, align: 'right' });
      frac(b.x + b.w - 106, y, f.n, f.d, 32, P.ink);
      if (pics) pieIcon(b.x + 46, y, 26, f.n, f.d, P.flesh);
    };
    row('بیشتر از', o.lo, b.y + 92);
    ctx.strokeStyle = 'rgba(111, 130, 122, .4)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(b.x + 26, b.y + 132); ctx.lineTo(b.x + b.w - 26, b.y + 132); ctx.stroke();
    row('کمتر از', o.hi, b.y + 172);
  }
}

function drawStock() {
  const b = STOCK;
  withShadow(16, 8, .35, () => {
    ctx.fillStyle = P.paper;
    wobbleRect(b.x, b.y, b.w, b.h, 12, 51, 2); ctx.fill();
  }, '10, 30, 24');
  ctx.fillStyle = P.skin;
  wobbleRect(b.x, b.y, b.w, 10, 4, 53, .8); ctx.fill();
  text('هندوانه‌ها', b.x + b.w / 2, b.y + 34, { size: 18, family: 'Lalezar', color: P.inkSoft });
  const n = L().melons;
  const step = Math.min(40, (b.w - 40) / Math.max(1, n));
  for (let i = 0; i < n; i++) {
    const x = b.x + b.w / 2 - (n - 1) * step / 2 + i * step;
    const alive = i < S.melons;
    ctx.save();
    ctx.globalAlpha = alive ? 1 : .2;
    ctx.fillStyle = alive ? P.skin : '#8f968a';
    wobbleCircle(x, b.y + 82, 16, i * 3 + 1, 1.2); ctx.fill();
    if (alive) {
      ctx.fillStyle = P.skinDk;
      ctx.save();
      ctx.beginPath(); ctx.arc(x, b.y + 82, 16, 0, TAU); ctx.clip();
      for (const k of [-1, 0, 1]) { ctx.beginPath(); ctx.ellipse(x + k * 7, b.y + 82, 2.6, 17, 0, 0, TAU); ctx.fill(); }
      ctx.restore();
    }
    ctx.restore();
  }
  text(`${fa(S.melons)} مانده`, b.x + b.w / 2, b.y + b.h - 16, { size: 15, color: P.inkSoft });
}

function drawDial() {
  const b = DIAL;
  withShadow(14, 6, .34, () => {
    ctx.fillStyle = P.paper;
    wobbleRect(b.x + 82, b.y + 6, b.w - 164, b.h - 12, 12, 61, 1.4); ctx.fill();
  }, '10, 30, 24');
  text('چند قاچ', b.x + b.w / 2, b.y + 22, { size: 14, color: P.inkSoft });
  numText(fa(S.d), b.x + b.w / 2, b.y + 50, { size: 34, color: P.ink });
  roundButton({ x: BTN_MINUS.x + 37, y: BTN_MINUS.y + 37, r: 34 }, '−', {
    hot: S.hover === BTN_MINUS, disabled: S.phase !== 'play' || S.d <= MIND,
    fill: P.brassDk, hotFill: P.brass, size: 36,
  });
  roundButton({ x: BTN_PLUS.x + 37, y: BTN_PLUS.y + 37, r: 34 }, '+', {
    hot: S.hover === BTN_PLUS, disabled: S.phase !== 'play' || S.d >= MAXD,
    fill: P.brassDk, hotFill: P.brass, size: 36,
  });
}

function drawGive() {
  button(BTN_GIVE, 'بفرمایید', {
    hot: S.hover === BTN_GIVE, disabled: S.phase !== 'play' || !S.taken.length,
    fill: '#3f8a5c', hotFill: '#4d9d6c', size: 28,
  });
}

function drawFloats() {
  for (const f of S.floats) {
    const k = clamp(1 - f.t / 1.5, 0, 1);
    numText(f.txt, f.x, f.y, { size: f.size, color: f.col, alpha: k });
  }
}

/* ───────── ترازوی داوری ─────────
   بعد از تصمیمِ بچه، جای قاچش را روی خطِ صفر تا یک نشان می‌دهد.       */

function drawJudge() {
  const j = S.judge, o = S.order;
  const k = easeOut(clamp(j.t / .4, 0, 1));
  ctx.fillStyle = `rgba(10, 26, 20, ${.62 * k})`;
  ctx.fillRect(0, 0, SCENE_W, SCENE_H);

  const w = 720, h = 380, x = SCENE_W / 2 - w / 2, y = 176;
  ctx.save();
  const s = lerp(.92, 1, easeBack(clamp(j.t / .6, 0, 1)));
  ctx.translate(SCENE_W / 2, y + h / 2);
  ctx.scale(s, s);
  ctx.translate(-SCENE_W / 2, -(y + h / 2));
  withShadow(28, 12, .45, () => {
    ctx.fillStyle = P.paper;
    wobbleRect(x, y, w, h, 18, 71, 2.4); ctx.fill();
  }, '10, 30, 24');
  ctx.fillStyle = j.ok ? P.good : P.bad;
  wobbleRect(x, y, w, 13, 6, 73, 1); ctx.fill();

  text(j.ok ? 'دستت درد نکند!' : 'این اندازه نشد', SCENE_W / 2, y + 52,
    { size: 32, family: 'Lalezar', color: j.ok ? P.good : P.bad });

  /* بشقابِ بچه: فقط قاچ‌هایی که داد، با خط‌چینِ یک هندوانهٔ کامل */
  const px = x + 118, py = y + 172;
  for (let k = 0; k < j.n; k++) {
    const [a0, a1] = wedgeAngles(k, j.d);
    wedge(px, py, 62, a0 + .008, a1 - .008, { shadow: true });
  }
  ctx.strokeStyle = 'rgba(90, 100, 92, .45)'; ctx.lineWidth = 2;
  ctx.setLineDash([6, 6]);
  ctx.beginPath(); ctx.arc(px, py, 62, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
  frac(px, py + 104, j.n, j.d, 30, P.ink);

  /* خطِ صفر تا یک با بازهٔ سفارش */
  const bx = x + 244, bw = w - 312, by = y + 186;
  ctx.fillStyle = 'rgba(111, 130, 122, .2)';
  ctx.beginPath(); rrPath(bx, by - 15, bw, 30, 15); ctx.fill();

  const tick = (t, f, side) => {
    const tx = bx + bw * t;
    ctx.strokeStyle = 'rgba(60, 74, 68, .55)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(tx, by - 15); ctx.lineTo(tx, by - 40); ctx.stroke();
    frac(tx + side * 26, by - 62, f.n, f.d, 22, P.inkSoft);
  };

  if (o.eq) {
    const t = val(o.eq);
    ctx.fillStyle = 'rgba(217, 168, 64, .8)';
    ctx.beginPath(); rrPath(bx + bw * t - 5, by - 15, 10, 30, 5); ctx.fill();
    tick(t, o.eq, 0);
  } else {
    const t0 = val(o.lo), t1 = val(o.hi);
    ctx.fillStyle = 'rgba(111, 168, 92, .6)';
    ctx.beginPath(); rrPath(bx + bw * t0, by - 15, bw * (t1 - t0), 30, 15); ctx.fill();
    tick(t0, o.lo, -1);
    tick(t1, o.hi, 1);
  }
  ctx.strokeStyle = 'rgba(60, 74, 68, .5)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(bx, by - 22); ctx.lineTo(bx, by + 22); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx + bw, by - 22); ctx.lineTo(bx + bw, by + 22); ctx.stroke();
  numText(fa(0), bx, by + 42, { size: 18, color: P.inkSoft });
  numText(fa(1), bx + bw, by + 42, { size: 18, color: P.inkSoft });

  /* نشانگرِ قاچِ بچه */
  const mx = bx + bw * j.mine;
  ctx.strokeStyle = j.ok ? P.good : P.bad; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(mx, by - 20); ctx.lineTo(mx, by + 42); ctx.stroke();
  ctx.fillStyle = j.ok ? P.good : P.bad;
  ctx.beginPath();
  ctx.moveTo(mx, by + 50); ctx.lineTo(mx - 13, by + 72); ctx.lineTo(mx + 13, by + 72);
  ctx.closePath(); ctx.fill();
  frac(mx, by + 96, j.n, j.d, 20, j.ok ? P.good : P.bad);

  text(j.ok ? 'قاچِ تو درست توی بازه نشست.' : 'قاچِ تو بیرونِ بازه افتاد.',
    SCENE_W / 2, y + h - 46, { size: 19, color: P.ink });
  ctx.restore();
}

/* ───────── نوارِ بالا ───────── */

function drawHUD() {
  ctx.fillStyle = 'rgba(12, 30, 24, .78)';
  ctx.fillRect(0, 0, SCENE_W, HUD_H);
  ctx.fillStyle = 'rgba(217, 168, 64, .45)';
  ctx.fillRect(0, HUD_H - 3, SCENE_W, 3);

  for (let i = 0; i < 3; i++) {
    const x = SCENE_W - 32 - i * 33;
    ctx.save();
    ctx.globalAlpha = i < S.hearts ? 1 : .22;
    ctx.fillStyle = i < S.hearts ? '#d4574a' : '#4b5f56';
    ctx.translate(x, HUD_H / 2);
    const s = i < S.hearts ? 1 + Math.sin(S.t * 3 + i) * .05 : 1;
    ctx.scale(s, s);
    ctx.beginPath();
    ctx.moveTo(0, 9);
    ctx.bezierCurveTo(-14, -2, -9, -13, 0, -6);
    ctx.bezierCurveTo(9, -13, 14, -2, 0, 9);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  text(L().name, SCENE_W - 146, HUD_H / 2, { size: 18, family: 'Lalezar', color: '#e8f4ea', align: 'right' });
  numText(fa(S.score), 26, HUD_H / 2 - 1, { size: 26, color: P.gold, align: 'left' });
  text(`رکورد ${fa(S.best)}`, 108, HUD_H / 2, { size: 14, color: 'rgba(232, 244, 234, .58)', align: 'left' });

  const lv = L();
  if (!lv.endless) {
    const n = lv.orders.length;
    const w = 15, gap = 9, x0 = SCENE_W / 2 - (n * w + (n - 1) * gap) / 2;
    for (let i = 0; i < n; i++) {
      ctx.fillStyle = i < S.served ? P.good : 'rgba(255,255,255,.18)';
      ctx.beginPath();
      ctx.ellipse(x0 + i * (w + gap) + w / 2, HUD_H / 2, w / 2, w / 2 * .8, 0, 0, TAU);
      ctx.fill();
    }
  } else {
    text(`${fa(S.served)} مشتری`, SCENE_W / 2, HUD_H / 2, { size: 16, color: P.good });
  }
}

/* ───────── آموزش ───────── */

function drawTutorial() {
  const st = S.tut.step;
  let holes = [], msg = '', hand = null;

  if (st === 0) {
    holes = [{ x: CARD.x - 6, y: CARD.y - 6, w: CARD.w + 12, h: CARD.h + 12 }];
    msg = 'مشتری یک بازه می‌خواهد: بیشتر از این و کمتر از آن.';
  } else if (st === 1) {
    holes = [{ x: DIAL.x - 10, y: DIAL.y - 10, w: DIAL.w + 20, h: DIAL.h + 20 },
             { x: MELON.x - MELON.r - 30, y: MELON.y - MELON.r - 30, w: MELON.r * 2 + 60, h: MELON.r * 2 + 60 }];
    msg = 'با − و + هندوانه را به قاچ‌های بیشتری ببُر، بعد روی قاچ‌ها بزن تا برداری.';
    hand = { x: DIAL.x + DIAL.w / 2, y: DIAL.y - 66 };
  } else {
    holes = [{ x: PLATE.x - PLATE.r - 40, y: PLATE.y - PLATE.r - 40, w: PLATE.r * 2 + 80, h: PLATE.r * 2 + 230 }];
    msg = 'هرچه بیشتر ببُری قاچ‌ها نازک‌ترند. کسرِ بشقاب زیرش نوشته شده.';
  }

  spot(holes, .56);
  const w = 520, h = 92, x = SCENE_W / 2 - w / 2, y = 470;
  paper(x, y, w, h, P.paper, 61, 14, .45);
  ctx.fillStyle = P.awning1;
  wobbleRect(x, y, 9, h, 4, 63, .8); ctx.fill();
  textWrap(msg, x + w / 2 + 6, y + h / 2 - 12, w - 54, { size: 17, color: P.ink, lineHeight: 26 });
  if (TUT_TAP.indexOf(st) >= 0) tutMore(x + w / 2, y + h + 12, S.t, P.ink);
  if (hand) pointHand(hand.x, hand.y);
}

/* ───────── پرده‌ها ───────── */

function melonIcon(x, y) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(.42, .42);
  cutDisc(0, 0, 74, 6, [0, 1], {});
  ctx.restore();
}

function drawIntro() {
  overlay({
    t: S.phaseT,
    w: 750, h: 348, y: 168,
    title: 'هندوانه‌فروشِ تابستان',
    body: 'مشتری می‌گوید قاچش باید از یکی بیشتر و از یکی کمتر باشد.\nهندوانه را هرجور خواستی ببُر و قاچ بردار.',
    btn: BTN_GO, btnHot: S.hover === BTN_GO, btnLabel: 'باز کن دکّه را',
    paper: P.paper, band: P.awning1, ink: P.ink, inkSoft: P.inkSoft,
    btnFill: '#3f8a5c', btnHotFill: '#4d9d6c',
    icon: melonIcon,
  });
}

function drawWon() {
  const last = !L().endless && S.level + 1 >= LEVELS.length;
  overlay({
    t: S.phaseT,
    w: 720, h: 320, y: 190,
    title: L().endless ? 'دکّه بسته شد' : 'همهٔ مشتری‌ها راضی!',
    body: L().endless
      ? `${fa(S.served)} مشتری را راضی کردی. امتیازت ${fa(S.score)} شد.`
      : `${fa(S.melons)} هندوانه هم برایت ماند. امتیازت ${fa(S.score)} شد.`,
    btn: BTN_GO, btnHot: S.hover === BTN_GO,
    btnLabel: L().endless ? 'روزِ بعد' : (last ? 'از اوّل' : 'بازارِ بعدی'),
    paper: P.paper, band: P.good, ink: P.ink, inkSoft: P.inkSoft,
    btnFill: '#3f8a5c', btnHotFill: '#4d9d6c',
    icon: (x, y) => star(x, y + 6, 26, P.gold, Math.sin(S.t * 2) * .2),
  });
}

function drawLost() {
  overlay({
    t: S.phaseT,
    w: 720, h: 306, y: 196,
    title: S.hearts <= 0 ? 'مشتری‌ها رفتند' : 'هندوانه تمام شد',
    body: 'قبل از بریدن، دو کسرِ سفارش را با هم بسنج. بعد چاقو را بردار.',
    btn: BTN_GO, btnHot: S.hover === BTN_GO, btnLabel: 'دوباره',
    paper: P.paper, band: P.bad, ink: P.ink, inkSoft: P.inkSoft,
    btnFill: '#cf5f4a', btnHotFill: '#dd6f59',
    icon: melonIcon,
  });
}
