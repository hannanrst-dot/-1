<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#17202b">
<title>درمانگاهِ جانوران — هر کدام جای خود (بازی)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>
  /* صفحه نباید هیچ‌جا اسکرول یا زوم شود؛ بازی باید مثل یک برنامه رفتار کند. */
  html, body {
    margin: 0; padding: 0; background: #17202b;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body {
    position: fixed; inset: 0;          /* جلوی کشیده‌شدنِ صفحه در سافاریِ گوشی */
    width: 100%; height: 100vh; height: 100dvh;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none; -webkit-touch-callout: none;
  }

  /* گوشیِ عمودی صحنه را ریز می‌کند؛ بچه باید گوشی را بچرخاند. */
  #rotate { display: none; }
  @media (orientation: portrait) and (max-width: 860px) {
    #stage { display: none; }
    #rotate {
      display: flex; position: fixed; inset: 0;
      z-index: 9;
      flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      background: #17202b; color: #f6ead2;
      font: 700 20px "Vazirmatn", Tahoma, sans-serif; text-align: center; padding: 32px;
    }
    #rotate svg { animation: tilt 2.4s ease-in-out infinite; }
    @keyframes tilt { 0%, 45% { transform: rotate(0deg); } 65%, 100% { transform: rotate(-90deg); } }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="rotate">
  <svg width="86" height="126" viewBox="0 0 86 126" fill="none" aria-hidden="true">
    <rect x="3" y="3" width="80" height="120" rx="12" stroke="#e8b448" stroke-width="5"/>
    <rect x="15" y="19" width="56" height="88" rx="5" fill="#e8b448" opacity=".28"/>
    <circle cx="43" cy="115" r="4" fill="#e8b448"/>
  </svg>
  <div>گوشی را بچرخان</div>
  <div style="font-weight:400;opacity:.7;font-size:16px">این بازی خوابیده بازی می‌شود</div>
</div>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   هستهٔ مشترکِ بازی‌ها — سبک «کاغذبُری»
   ───────────────────────────────────────────────────────────────────────
   این فایل جعبه‌ابزار است، نه چارچوب: هر بازی حلقه و وضعیت خودش را دارد
   و فقط از این توابع برای کشیدن استفاده می‌کند. دلیلش این است که هر بازی
   باید حس‌وحال خودش را داشته باشد، نه اینکه همه شبیه هم دربیایند.

   قاعده‌های ثابتِ تصویری:
   • نور همیشه از بالا-چپ می‌تابد، پس سایه‌ها به پایین-راست می‌افتند.
   • هیچ لبه‌ای کاملاً صاف نیست؛ همه کمی موج دارند (انگار با قیچی بریده).
   • هیچ خاکستریِ خالصی نداریم؛ همه‌ی خنثی‌ها به گرمیِ صحنه می‌زنند.
   • یک لایه‌ی دانه‌دانه‌ی کاغذ روی کلِ تصویر ضرب می‌شود.
   ═══════════════════════════════════════════════════════════════════════ */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const FA_D = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
const fa = (n) => String(n).replace(/\d/g, (d) => FA_D[+d]);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeIn = (t) => t * t * t;
const easeInOut = (t) => (t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2);
const easeBack = (t) => 1 + 2.7 * Math.pow(t-1, 3) + 1.7 * Math.pow(t-1, 2);
const easeElastic = (t) => t === 0 || t === 1 ? t : Math.pow(2, -9*t) * Math.sin((t*10 - .75) * 2.094) + 1;

/** تصادفِ تکرارپذیر: با یک بذر همیشه همان عدد. برای اینکه تزئین‌ها هر فریم نپرند. */
function noise1(x) {
  const s = Math.sin(x * 127.1) * 43758.5453;
  return s - Math.floor(s);
}
const pick = (arr, seed) => arr[Math.floor(noise1(seed) * arr.length) % arr.length];

/* ───────── بوم و صحنهٔ ثابت ───────── */

let ctx, SW, SH, CV, _refit = null;
let view = { scale: 1, ox: 0, oy: 0, w: 0, h: 0, dpr: 1 };
let _grain = null, _grainDark = null;

function initStage(canvas, w, h) {
  CV = canvas; SW = w; SH = h;
  ctx = canvas.getContext('2d');

  /* اندازه را از خودِ بوم می‌گیریم نه از innerHeight؛ چون در سافاریِ گوشی
     نوارِ آدرس باز و بسته می‌شود و innerHeight دروغ می‌گوید. */
  const fit = () => {
    const r = canvas.getBoundingClientRect();
    const vw = Math.round(r.width), vh = Math.round(r.height);
    if (vw < 20 || vh < 20) return;
    const dpr = Math.min(devicePixelRatio || 1, QUALITY > 0 ? 2 : 1);
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    const scale = Math.min(vw / SW, vh / SH);
    view = { scale, ox: (vw - SW*scale)/2, oy: (vh - SH*scale)/2, w: vw, h: vh, dpr };
    _grain = buildGrain();
  };
  _refit = fit;
  addEventListener('resize', fit);
  /* چرخاندنِ گوشی: اندازهٔ درست چند لحظه بعد می‌رسد، پس چندبار اندازه می‌گیریم. */
  addEventListener('orientationchange', () => {
    fit(); setTimeout(fit, 140); setTimeout(fit, 460);
  });
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(canvas);

  /* صدا در گوشی فقط بعد از اوّلین لمس اجازهٔ پخش دارد. */
  const unlock = () => { sfx._c(); removeEventListener('pointerdown', unlock); removeEventListener('touchstart', unlock); };
  addEventListener('pointerdown', unlock, { passive: true });
  addEventListener('touchstart', unlock, { passive: true });
  /* نگه‌داشتنِ انگشت نباید منوی مرورگر را باز کند. */
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  fit();
  return ctx;
}

/** قابِ صحنه را باز می‌کند: بعد از این، مختصات همیشه در فضای SW×SH است. */
function beginScene(bg) {
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, view.w, view.h);
  ctx.save();
  ctx.translate(view.ox, view.oy);
  ctx.scale(view.scale, view.scale);
  ctx.beginPath();
  ctx.rect(0, 0, SW, SH);
  ctx.clip();
}

/* ───────── پوششِ پایانِ قاب ─────────
   دانه‌های کاغذ و تیرگیِ گوشه‌ها هر دو ثابت‌اند و تغییر نمی‌کنند، ولی
   قبلاً هر فریم از نو کشیده می‌شدند: یکی با «multiply» روی کلِّ صفحه و
   یکی با یک گرادیانِ شعاعیِ تازه. اندازه‌گیری نشان داد همین دو تا
   ۱۱ تا ۱۶ میلی‌ثانیه از هر فریم را می‌خوردند — بیشتر از کشیدنِ خودِ
   صحنه. حالا یک بار در یک بومِ جدا پخته می‌شوند و هر فریم فقط یک
   drawImage است.                                                       */

let _ovl = null, _ovlKey = '';

function overlayLayer(grainAlpha, vignette) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const w = Math.max(2, Math.round(SW * q)), h = Math.max(2, Math.round(SH * q));
  const key = w + 'x' + h + '|' + grainAlpha + '|' + vignette;
  if (_ovl && _ovlKey === key) return _ovl;
  let c;
  try {
    c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g2 = c.getContext('2d');
    if (!g2) return null;
    if (_grainDark && grainAlpha > 0) {
      /* همان دانه‌ها، ولی به‌جای multiply به شکلِ سیاهِ کم‌رنگ */
      g2.globalAlpha = clamp(grainAlpha * 1.15, 0, 1);
      g2.fillStyle = g2.createPattern(_grainDark, 'repeat');
      g2.fillRect(0, 0, w, h);
      g2.globalAlpha = 1;
    }
    if (vignette) {
      const g = g2.createRadialGradient(w / 2, h / 2, h * .42, w / 2, h / 2, h * 1.05);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, vignette);
      g2.fillStyle = g;
      g2.fillRect(0, 0, w, h);
    }
  } catch (e) { return null; }
  _ovl = c; _ovlKey = key;
  return c;
}

/** بافتِ کاغذ، تیرگیِ گوشه‌ها، رنگ‌بندی و درخششِ نور را می‌گذارد و قاب را می‌بندد. */
function endScene(grainAlpha = .15, vignette = 'rgba(48,28,14,.30)', bloom = .34, grade = .14) {
  /* درخششِ نور خاموش است. اندازه‌گیری نشان داد هر فریم ۲۱ میلی‌ثانیه
     می‌گیرد — بیشتر از تمامِ کارهای دیگرِ یک فریم روی هم — چون برای
     ساختنش باید کلِّ بوم دوباره خوانده شود. از آن بدتر: متنِ فارسی را
     مه‌آلود می‌کرد و خواندنش را سخت‌تر. بی‌آن، صحنه تمیزتر است. */
  bloom = 0;
  if (QUALITY < 1) { grade = 0; grainAlpha *= .5; }
  if (QUALITY < 2) grade = 0;
  if (grade > 0) {
    /* رنگ‌بندیِ نرم: بالای صحنه گرم‌تر، پایین سردتر — عمق می‌دهد */
    const g = ctx.createLinearGradient(0, 0, 0, SH);
    g.addColorStop(0, `rgba(255, 214, 150, ${grade})`);
    g.addColorStop(.55, 'rgba(255, 255, 255, 0)');
    g.addColorStop(1, `rgba(40, 60, 110, ${grade * .9})`);
    ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalCompositeOperation = 'source-over';
  }
  const ov = (grainAlpha > 0 || vignette) ? overlayLayer(grainAlpha, vignette) : null;
  if (ov) ctx.drawImage(ov, 0, 0, SW, SH);
  ctx.restore();
  bloomPass(bloom);
}

/* ───────── درخششِ نور (bloom) ─────────
   قابِ رسم‌شده را کوچک می‌کنیم، دو بار در خودش ضرب می‌کنیم تا فقط
   روشن‌ها بمانند، محوش می‌کنیم و با حالتِ «lighter» رویش می‌گذاریم.
   نتیجه: چراغ‌ها، شعله‌ها و رنگ‌های روشن نور پخش می‌کنند. */
let _bl, _blc, _bl2, _bl2c, _blNo = false, _blTick = 0;

function bloomPass(amount) {
  if (!amount || _blNo || !CV.width) return;
  /* کوچک‌کردن و بزرگ‌کردنِ دوباره، خودش محو می‌کند — از filter خیلی ارزان‌تر است */
  const W = Math.max(4, Math.round(CV.width * .2)), H = Math.max(4, Math.round(CV.height * .2));
  const W2 = Math.max(2, Math.round(W * .28)), H2 = Math.max(2, Math.round(H * .28));
  try {
    if (!_bl) {
      _bl = document.createElement('canvas'); _blc = _bl.getContext('2d');
      _bl2 = document.createElement('canvas'); _bl2c = _bl2.getContext('2d');
      if (!_blc || !_bl2c) { _blNo = true; return; }
    }
    if (_bl.width !== W || _bl.height !== H) { _bl.width = W; _bl.height = H; }
    if (_bl2.width !== W2 || _bl2.height !== H2) { _bl2.width = W2; _bl2.height = H2; }
    /* ساختنِ نور یک قاب در میان کافی است؛ گذاشتنش هر قاب. */
    _blTick = (_blTick + 1) & 1;
    if (!_blTick) {
      _blc.globalCompositeOperation = 'source-over';
      _blc.clearRect(0, 0, W, H);
      _blc.drawImage(CV, 0, 0, W, H);
      _blc.globalCompositeOperation = 'multiply';
      _blc.drawImage(_bl, 0, 0);
      _blc.drawImage(_bl, 0, 0);
      _blc.globalCompositeOperation = 'source-over';
      _bl2c.clearRect(0, 0, W2, H2);
      _bl2c.drawImage(_bl, 0, 0, W2, H2);
    }

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = amount;
    ctx.drawImage(_bl2, 0, 0, CV.width, CV.height);
    ctx.restore();
  } catch (e) { _blNo = true; }
}

/* ───────── لایهٔ ثابت ─────────
   هرچه در صحنه تکان نمی‌خورد را یک‌بار می‌کشیم و بعد فقط کپی می‌کنیم. */
const _layers = {};
function staticLayer(key, w, h, paint) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const L = _layers[key];
  if (L && L.q === q && L.w === w && L.h === h) return L.cv;
  const off = document.createElement('canvas');
  off.width = Math.max(1, Math.round(w * q));
  off.height = Math.max(1, Math.round(h * q));
  const c = off.getContext('2d');
  c.setTransform(q, 0, 0, q, 0, 0);
  const prev = ctx;
  ctx = c;
  try { paint(); } finally { ctx = prev; }
  _layers[key] = { cv: off, q, w, h };
  return off;
}

/* ───────── نورپردازی و بافت ─────────
   کارِ این‌ها این است که هیچ سطحی «تختِ یک‌رنگ» نماند. */

/** شیبِ عمودی: بالا روشن، پایین تیره. */
function vgrad(y0, y1, top, bot) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, top); g.addColorStop(1, bot);
  return g;
}

/** حجمِ کروی: نور از بالا-چپ، سایه در پایین-راست. */
function ball(cx, cy, r, lit, base, dark) {
  const g = ctx.createRadialGradient(cx - r * .38, cy - r * .42, r * .06, cx, cy, r * 1.06);
  g.addColorStop(0, lit); g.addColorStop(.45, base); g.addColorStop(1, dark);
  return g;
}

/** لبهٔ روشنِ بالا-چپِ یک مسیر — همان «rim light». */
function rim(pathFn, col, w = 2.2) {
  ctx.save();
  ctx.beginPath(); pathFn();
  ctx.clip();
  ctx.beginPath(); pathFn();
  ctx.strokeStyle = col; ctx.lineWidth = w * 2; ctx.lineJoin = 'round';
  ctx.translate(-w * .5, -w * .6);
  ctx.stroke();
  ctx.restore();
}

/** سایهٔ چسبیده به زمین — چیزها را روی سطح می‌نشاند. */
function contact(cx, cy, rx, ry, alpha = .26) {
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
  g.addColorStop(0, `rgba(20, 12, 6, ${alpha})`);
  g.addColorStop(1, 'rgba(20, 12, 6, 0)');
  ctx.save();
  ctx.fillStyle = g;
  ctx.translate(cx, cy); ctx.scale(1, ry / Math.max(rx, ry));
  ctx.beginPath(); ctx.arc(0, 0, Math.max(rx, ry), 0, TAU); ctx.fill();
  ctx.restore();
}

const _tex = {};
/** بافتِ تکرارشونده؛ یک‌بار ساخته و بعد از حافظه خوانده می‌شود. */
function texture(key, w, h, paint) {
  if (_tex[key]) return _tex[key];
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const c = off.getContext('2d');
  paint(c, w, h);
  _tex[key] = ctx.createPattern(off, 'repeat');
  return _tex[key];
}

/** رگهٔ چوب. */
function texWood(base, grain) {
  return texture('w' + base + grain, 120, 120, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = grain; c.lineWidth = 1.4;
    for (let i = 0; i < 9; i++) {
      c.globalAlpha = .18 + noise1(i * 3.1) * .3;
      c.beginPath();
      const y0 = i * 14 + noise1(i) * 6;
      c.moveTo(0, y0);
      for (let x = 0; x <= w; x += 10) c.lineTo(x, y0 + Math.sin(x * .09 + i) * 2.6);
      c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** تارِ پارچه. */
function texCloth(base, thread) {
  return texture('c' + base + thread, 16, 16, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = thread; c.lineWidth = 1; c.globalAlpha = .5;
    for (let i = 0; i < w; i += 4) {
      c.beginPath(); c.moveTo(i, 0); c.lineTo(i, h); c.stroke();
      c.beginPath(); c.moveTo(0, i); c.lineTo(w, i); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** دانه‌های سنگ. */
function texStone(base, spec) {
  return texture('s' + base + spec, 90, 90, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) {
      c.globalAlpha = .05 + noise1(i * 1.7) * .16;
      c.fillStyle = spec;
      const r = .6 + noise1(i * 5.3) * 1.9;
      c.beginPath();
      c.arc(noise1(i * 2.1) * w, noise1(i * 3.7 + 1) * h, r, 0, TAU);
      c.fill();
    }
    c.globalAlpha = 1;
  });
}

/** الیافِ کاغذ. */
function texPaper(base) {
  return texture('p' + base, 100, 100, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 130; i++) {
      c.globalAlpha = .04 + noise1(i * 2.3) * .07;
      c.strokeStyle = i % 2 ? '#ffffff' : '#5a4326';
      c.lineWidth = .9;
      const x = noise1(i * 1.3) * w, y = noise1(i * 4.1 + 2) * h;
      const a = noise1(i * 7.7) * TAU, l = 4 + noise1(i * 9.1) * 12;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

function buildGrain() {
  const s = 260;
  const off = document.createElement('canvas');
  off.width = off.height = s;
  const c = off.getContext('2d');
  const img = c.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    const v = 214 + Math.random() * 41;
    img.data[i*4] = v; img.data[i*4+1] = v; img.data[i*4+2] = v; img.data[i*4+3] = 255;
  }
  c.putImageData(img, 0, 0);
  /* همان دانه‌ها به شکلِ سیاهِ کم‌رنگ، تا بشود بدونِ multiply گذاشتشان */
  const d = document.createElement('canvas');
  d.width = d.height = s;
  const dc = d.getContext('2d');
  const dimg = dc.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    dimg.data[i*4] = 0; dimg.data[i*4+1] = 0; dimg.data[i*4+2] = 0;
    dimg.data[i*4+3] = 255 - img.data[i*4];
  }
  dc.putImageData(dimg, 0, 0);
  _grainDark = d;
  _ovl = null; _ovlKey = '';
  return ctx.createPattern(off, 'repeat');
}

function toStage(e) {
  const r = CV.getBoundingClientRect();
  return {
    x: (e.clientX - r.left - view.ox) / view.scale,
    y: (e.clientY - r.top - view.oy) / view.scale,
  };
}

const inRect = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
const inCircle = (p, b, pad = 0) => Math.hypot(p.x - b.x, p.y - b.y) <= b.r + pad;

/* ───────── قلم‌های کاغذبُری ───────── */

/** دایره‌ای که انگار با قیچی بریده شده. */
function wobbleCircle(cx, cy, r, seed = 0, amp = 2.2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const rr = r + Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp * .45;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** بیضیِ ناصاف — برای چیزهایی که گرد نیستند ولی نرم‌اند. */
function wobbleEllipse(cx, cy, rx, ry, rot = 0, seed = 0, amp = 2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const w = 1 + (Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp*.45) / Math.max(rx, ry);
    const px = Math.cos(a) * rx * w, py = Math.sin(a) * ry * w;
    const x = cx + px*Math.cos(rot) - py*Math.sin(rot);
    const y = cy + px*Math.sin(rot) + py*Math.cos(rot);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** مستطیلِ گِرد با گوشه‌های کمی کج. */
function wobbleRect(x, y, w, h, r = 12, seed = 0, amp = 1.6) {
  const j = (k) => (noise1(seed*9.7 + k) - .5) * amp * 2;
  ctx.beginPath();
  ctx.moveTo(x + r + j(1), y + j(2));
  ctx.lineTo(x + w - r + j(3), y + j(4));
  ctx.quadraticCurveTo(x + w + j(5), y + j(6), x + w + j(7), y + r + j(8));
  ctx.lineTo(x + w + j(9), y + h - r + j(10));
  ctx.quadraticCurveTo(x + w + j(11), y + h + j(12), x + w - r + j(13), y + h + j(14));
  ctx.lineTo(x + r + j(15), y + h + j(16));
  ctx.quadraticCurveTo(x + j(17), y + h + j(18), x + j(19), y + h - r + j(20));
  ctx.lineTo(x + j(21), y + r + j(22));
  ctx.quadraticCurveTo(x + j(23), y + j(24), x + r + j(1), y + j(2));
  ctx.closePath();
}

/** سایهٔ نرم؛ نور از بالا-چپ. */
function withShadow(blur, dy, alpha, fn, hue = '78, 46, 24') {
  ctx.save();
  ctx.shadowColor = `rgba(${hue}, ${alpha})`;
  ctx.shadowBlur = blur;
  ctx.shadowOffsetY = dy;
  ctx.shadowOffsetX = dy * .35;
  fn();
  ctx.restore();
}

/** یک برگه‌ی کاغذ با سایه — پایه‌ی همه‌ی کارت‌ها و تابلوها. */
function paper(x, y, w, h, fill, seed = 1, r = 12, shadow = .26) {
  withShadow(16, 7, shadow, () => {
    ctx.fillStyle = fill;
    wobbleRect(x, y, w, h, r, seed, 2);
    ctx.fill();
  });
  /* الیافِ کاغذ و لبهٔ روشن، تا سطح تخت نماند */
  ctx.save();
  ctx.beginPath(); wobbleRect(x, y, w, h, r, seed, 2); ctx.clip();
  ctx.globalAlpha = .5;
  ctx.fillStyle = texPaper(fill);
  ctx.fillRect(x, y, w, h);
  ctx.globalAlpha = 1;
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.4, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(90,60,20,.1)');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
}

function text(str, x, y, o = {}) {
  const size = o.size || 20;
  const fam = o.family || 'Vazirmatn';
  ctx.save();
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.font = `${fam === 'Lalezar' ? '400' : (o.weight || 700)} ${size}px "${fam}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.baseline || 'middle';
  ctx.fillStyle = o.color || '#43291b';
  ctx.direction = 'rtl';
  if (o.stroke) {
    ctx.lineWidth = o.strokeWidth || 5;
    ctx.strokeStyle = o.stroke;
    ctx.lineJoin = 'round';
    ctx.strokeText(str, x, y, o.maxWidth);
  }
  ctx.fillText(str, x, y, o.maxWidth);
  ctx.restore();
}

/** متنِ چندخطی که خودش می‌شکند. ارتفاعِ اشغال‌شده را برمی‌گرداند. */
function textWrap(str, x, y, maxW, o = {}) {
  const size = o.size || 19, lh = o.lineHeight || size * 1.7;
  ctx.font = `${o.weight || 700} ${size}px "${o.family || 'Vazirmatn'}", Tahoma, sans-serif`;
  const lines = [];
  for (const para of str.split('\n')) {
    let line = '';
    for (const wd of para.split(' ')) {
      const t = line ? line + ' ' + wd : wd;
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = wd; }
      else line = t;
    }
    lines.push(line);
  }
  lines.forEach((l, i) => text(l, x, y + i * lh, o));
  return lines.length * lh;
}

/* ───────── ذره‌ها ───────── */

class Bits {
  constructor() { this.list = []; }
  add(x, y, n, kind, colors, opts = {}) {
    for (let i = 0; i < n; i++) {
      const a = opts.dir !== undefined ? opts.dir + (Math.random()-.5) * (opts.spread || 1) : Math.random() * TAU;
      const sp = (opts.speed || 200) * (.4 + Math.random());
      this.list.push({
        kind, x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - (opts.lift || 0),
        r: (opts.size || 4) * (.5 + Math.random()),
        rot: Math.random() * TAU, vr: (Math.random()-.5) * 10,
        col: colors[(Math.random() * colors.length) | 0],
        grav: opts.grav === undefined ? 620 : opts.grav,
        drag: opts.drag || .995,
        life: (opts.life || .9) * (.6 + Math.random() * .8), age: 0,
      });
    }
  }
  confetti(x, y, n, colors) {
    this.add(x, y, n, 'flake', colors, { speed: 420, lift: 190, size: 5, life: 1.6, grav: 780 });
  }
  spark(x, y, n, colors) {
    this.add(x, y, n, 'dot', colors, { speed: 180, lift: 30, size: 3.4, life: .7, grav: 260, drag: .93 });
  }
  step(dt) {
    for (const p of this.list) {
      p.age += dt;
      p.vy += p.grav * dt;
      p.vx *= p.drag; p.vy *= p.drag;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    }
    this.list = this.list.filter((p) => p.age < p.life);
  }
  draw() {
    for (const p of this.list) {
      const k = clamp(1 - p.age / p.life, 0, 1);
      ctx.save();
      ctx.globalAlpha = k;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.col;
      if (p.kind === 'flake') ctx.fillRect(-p.r, -p.r*1.5, p.r*2, p.r*3);
      else if (p.kind === 'leaf') { wobbleEllipse(0, 0, p.r*1.8, p.r*.8, 0, p.r, .6); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(0, 0, p.r * k, 0, TAU); ctx.fill(); }
      ctx.restore();
    }
  }
  clear() { this.list.length = 0; }
}

/* ───────── صدا (بدون فایل صوتی) ───────── */

const sfx = {
  ac: null, on: true,
  _c() {
    if (!this.on) return null;
    if (!this.ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; this.ac = new A(); }
    if (this.ac.state === 'suspended') this.ac.resume();
    return this.ac;
  },
  tone(f, dur = .16, type = 'sine', gain = .13, delay = 0) {
    const c = this._c(); if (!c) return;
    const t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(t0 + dur + .04);
  },
  tap()  { this.tone(430, .07, 'triangle', .09); },
  place(){ this.tone(620, .11, 'sine', .12); },
  pop()  { this.tone(760, .09, 'sine', .11); },
  slide(){ this.tone(240, .22, 'sine', .07); },
  good() { [523, 659, 784].forEach((f,i) => this.tone(f, .22, 'sine', .13, i*.07)); },
  win()  { [523, 659, 784, 1047].forEach((f,i) => this.tone(f, .34, 'triangle', .13, i*.10)); },
  nope() { this.tone(180, .2, 'sawtooth', .07); },
  tick() { this.tone(1100, .04, 'square', .05); },
};

/* ───────── قطعه‌های آماده ───────── */

function star(x, y, r, col, rot = 0) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = col;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI/2 + i * Math.PI/5;
    const rr = i % 2 ? r * .45 : r;
    const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/** دکمهٔ کاغذی. hovered را خودِ بازی می‌دهد؛ اینجا فقط کشیده می‌شود. */
/** رنگ را روشن‌تر (k>0) یا تیره‌تر (k<0) می‌کند. */
function shade(col, k) {
  const c = String(col).trim();
  let r, g2, b2;
  if (c[0] === '#') {
    const h = c.length === 4 ? c[1]+c[1]+c[2]+c[2]+c[3]+c[3] : c.slice(1, 7);
    r = parseInt(h.slice(0,2), 16); g2 = parseInt(h.slice(2,4), 16); b2 = parseInt(h.slice(4,6), 16);
  } else {
    const m = c.match(/[\d.]+/g);
    if (!m || m.length < 3) return col;
    r = +m[0]; g2 = +m[1]; b2 = +m[2];
  }
  const f = (v) => Math.round(clamp(k < 0 ? v * (1 + k) : v + (255 - v) * k, 0, 255));
  return 'rgb(' + f(r) + ',' + f(g2) + ',' + f(b2) + ')';
}

function button(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 3 : 0;
  const fill = o.disabled ? (o.off || '#bcaa92') : (hot ? (o.hotFill || o.fill) : o.fill);
  const r = o.r === undefined ? 14 : o.r;
  /* لبهٔ زیرینِ تیره — دکمه از صفحه بیرون می‌زند */
  ctx.fillStyle = shade(fill, -.36);
  wobbleRect(b.x, b.y + dy + 7, b.w, b.h, r, b.x + b.y, 2);
  ctx.fill();
  withShadow(hot ? 22 : 14, hot ? 5 : 8, .32, () => {
    ctx.fillStyle = fill;
    wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2);
    ctx.fill();
  });
  /* حجم: روشن از بالا، تیره به پایین */
  ctx.save();
  ctx.beginPath(); wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2); ctx.clip();
  const g = ctx.createLinearGradient(0, b.y + dy, 0, b.y + dy + b.h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.45, 'rgba(255,255,255,.04)');
  g.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = g;
  ctx.fillRect(b.x, b.y + dy, b.w, b.h);
  /* برقِ باریکِ لبهٔ بالا */
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.fillRect(b.x + r, b.y + dy + 2, b.w - r * 2, 2);
  ctx.restore();
  text(label, b.x + b.w/2, b.y + b.h/2 + dy - (o.sub ? 9 : 0), {
    size: o.size || 26, color: o.color || '#fdf6e8', family: o.family || 'Lalezar',
  });
  if (o.sub) text(o.sub, b.x + b.w/2, b.y + b.h/2 + dy + 17,
    { size: 14, color: o.subColor || 'rgba(255,255,255,.88)' });
}

/** دکمهٔ گرد کوچک (مثل + و −). */
function roundButton(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 2 : 0;
  withShadow(10, hot ? 3 : 5, .3, () => {
    ctx.fillStyle = o.disabled ? '#cbbba3' : (hot ? (o.hotFill || o.fill) : o.fill);
    wobbleCircle(b.x, b.y + dy, b.r, b.x, 1.4);
    ctx.fill();
  });
  text(label, b.x, b.y + dy - 1,
    { size: o.size || 32, color: o.disabled ? '#a8988a' : (o.color || '#fdf6e8'), family: 'Lalezar' });
}

/** پرده‌ی تمام‌صفحه: برای شروعِ پرده و برای جشنِ پایان. */
function overlay(o) {
  const k = easeOut(clamp(o.t / .5, 0, 1));
  ctx.fillStyle = `rgba(30, 22, 16, ${.66 * k})`;
  ctx.fillRect(0, 0, SW, SH);

  const w = o.w || 700, h = o.h || 290;
  const x = (SW - w) / 2, y = o.y || (SH * .22);
  const s = lerp(.9, 1, easeBack(clamp(o.t / .65, 0, 1)));
  ctx.save();
  ctx.translate(SW/2, y + h/2);
  ctx.scale(s, s);
  ctx.translate(-SW/2, -(y + h/2));

  withShadow(30, 14, .42, () => {
    ctx.fillStyle = o.paper || '#fbf3e2';
    wobbleRect(x, y, w, h, 18, 121, 2.4);
    ctx.fill();
  });
  ctx.fillStyle = o.band || '#c8434f';
  wobbleRect(x, y, w, 12, 6, 123, 1);
  ctx.fill();

  if (o.icon) o.icon(SW/2, y + 56);
  text(o.title, SW/2, y + (o.icon ? 108 : 62),
    { size: o.titleSize || 36, color: o.ink || '#43291b', family: 'Lalezar', alpha: k });
  textWrap(o.body, SW/2, y + (o.icon ? 158 : 116), w - 90,
    { size: 19, color: o.inkSoft || '#8a6a52', alpha: k });
  ctx.restore();

  button(o.btn, o.btnLabel, { hot: o.btnHot, fill: o.btnFill || '#7fa356', hotFill: o.btnHotFill || '#8fb45f', size: 28 });
}

/** پیامِ کوتاهِ بالای صحنه. */
class Toast {
  constructor() { this.msg = null; this.t = 0; this.kind = 'info'; }
  say(msg, kind = 'info') { this.msg = msg; this.kind = kind; this.t = 2.6; }
  step(dt) { if (this.t > 0) { this.t -= dt; if (this.t <= 0) this.msg = null; } }
  draw(y = 24, colors = {}) {
    if (!this.msg) return;
    const k = clamp(this.t, 0, 1) * clamp((2.6 - this.t) * 5, 0, 1);
    ctx.save();
    ctx.globalAlpha = k;
    ctx.font = `700 19px "Vazirmatn", Tahoma, sans-serif`;
    const w = ctx.measureText(this.msg).width + 76;
    const fill = this.kind === 'good' ? (colors.good || '#7fa356')
               : this.kind === 'bad' ? (colors.bad || '#c8434f')
               : (colors.info || '#fbf3e2');
    paper(SW/2 - w/2, y, w, 48, fill, 151, 12, .3);
    text(this.msg, SW/2, y + 25,
      { size: 19, color: this.kind === 'info' ? (colors.ink || '#43291b') : '#fff8ec' });
    ctx.restore();
  }
}

/* ───────── آموزشِ پرده‌ای ─────────
   پرده‌هایی که منتظرِ کارِ بچه نیستند با یک ضربه جلو می‌روند. تایمر فقط
   پشتیبان است؛ بچهٔ کلاس سومی باید فرصتِ خواندن داشته باشد، نه اینکه
   متن قبل از تمام شدنِ خواندنش برود.                                    */

/** اگر پردهٔ فعلی خواندنی است، ضربه را می‌خورد و می‌رود پردهٔ بعد. */
function tutTap(tut, tapSteps, lastStep) {
  if (!tut.on || tapSteps.indexOf(tut.step) < 0) return false;
  if (tut.step >= lastStep) tut.on = false;
  else { tut.step++; tut.t = 0; }
  sfx.tap();
  return true;
}

/** نشانهٔ «برای ادامه بزن» — زیرِ کارتِ آموزش. */
function tutMore(cx, y, t, ink = '#3a2a18', bg = 'rgba(255, 250, 238, .94)') {
  ctx.save();
  ctx.globalAlpha = .62 + .38 * Math.sin(t * 3.2);
  ctx.font = '700 15px "Vazirmatn", Tahoma, sans-serif';
  const label = 'برای ادامه، هرجا را بزن';
  const w = ctx.measureText(label).width + 40, h = 32, x = cx - w / 2, r = 16;
  withShadow(10, 4, .3, () => {
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath(); ctx.fill();
  });
  text(label, cx, y + h / 2, { size: 15, color: ink });
  ctx.restore();
}

/** فونت‌ها را می‌آورد و بعد بازی را شروع می‌کند.
    مهم: هر دو راه (رسیدنِ فونت و مهلتِ پشتیبان) ممکن است برسند، ولی
    شروع فقط باید یک بار انجام شود؛ وگرنه دو حلقهٔ فریم راه می‌افتد و
    بازی دوبرابر سریع می‌شود. */
function whenFontsReady(start) {
  let done = false;
  const go = () => { if (done) return; done = true; start(); };
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('400 40px Lalezar'),
      document.fonts.load('700 20px Vazirmatn'),
      document.fonts.load('900 20px Vazirmatn'),
    ]).then(go, go);
    setTimeout(go, 2600);
  } else go();
}

/** حلقهٔ فریم با dtِ محدودشده. */
/* ───────── کیفیتِ خودکار ─────────
   اگر دستگاه کُند بود، اوّل درخشش و بعد رنگ‌بندی خاموش می‌شود تا بازی
   روان بماند. روی دستگاهِ قوی همه‌چیز روشن است. */
let QUALITY = 2;
let _fAcc = 0, _fN = 0, _qHold = 0;

function _qualityTick(gap) {
  if (gap <= 0 || gap > 200) return;
  _fAcc += gap; _fN++;
  if (_fN < 45) return;
  const avg = _fAcc / _fN;
  _fAcc = 0; _fN = 0;
  if (_qHold > 0) { _qHold--; return; }
  /* فاصلهٔ بالا و پایین باید باز باشد، وگرنه کیفیت بین دو پله بالا و
     پایین می‌پرد و بازی مدام تغییرِ ظاهر می‌دهد. */
  const before = QUALITY;
  if (avg > 21 && QUALITY > 0) { QUALITY--; _qHold = 4; }
  else if (avg < 13.5 && QUALITY < 2) { QUALITY++; _qHold = 10; }
  /* در پایین‌ترین کیفیت، صحنه را با نقطه‌های کمتر می‌کشیم */
  if (before !== QUALITY && (before === 0 || QUALITY === 0) && _refit) _refit();
}

/* یک حلقه، نه بیشتر — دو حلقه یعنی زمانِ بازی دوبرابر می‌گذرد.

   MOTION: تا پیش از این، به‌خاطرِ باگِ دو حلقه، همهٔ بازی‌ها عملاً با
   سرعتِ دو برابر اجرا می‌شدند و زمان‌بندی‌ها هم با همان حس تنظیم شده
   بودند. حالا که باگ رفع شده، سرعتِ درست (یک برابر) کُند به نظر
   می‌رسد. این ضریب جانِ حرکت‌ها را برمی‌گرداند، ولی نه تا آن دو برابرِ
   تصادفی. فقط روی جانِ حرکت اثر دارد، نه روی هیچ قانونِ علمی. */
const MOTION = 1.45;
let _looping = false;
function runLoop(step) {
  if (_looping) return;
  _looping = true;
  let last = performance.now();
  const frame = (now) => {
    const gap = now - last;
    /* بریدنِ بعد از ضرب، تا یک فریمِ کُند پرشِ بزرگ نسازد */
    const dt = Math.min(gap / 1000 * MOTION, 1/15);
    last = now;
    _qualityTick(gap);
    step(dt);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

/* ═════════════════ بازی ═════════════════ */
/* ═══════════════════════════════════════════════════════════════════════
   درمانگاهِ جانوران — علومِ سوم، درس ۱۲ «هر کدام جای خود (۱)»  (بازی)

   فعّالیتِ کتاب: «یک دام‌پزشک تصویرهای زیر را از داخلِ بدنِ چند جانور
   جمع‌آوری کرده است. به دقّت نگاه کنید. کدام جانوران ستونِ مهره
   دارند؟» و بعد: «جانوران در جایی زندگی می‌کنند که بتوانند نیازهایشان
   را برطرف کنند.»

   اینجا بچّه خودش دام‌پزشک است: با دستگاهِ عکس، داخلِ بدنِ هر جانور را
   می‌بیند — ستونِ مهره هست یا نیست — و بعد جانور را به اتاقِ درستش
   می‌برد. بازی هیچ‌وقت نمی‌گوید کدام کدام است؛ فقط می‌گذارد نگاه کند.

   ── درستیِ زیستی ───────────────────────────────────────────────
   ستونِ مهرهٔ هر جانور همان‌جایی کشیده می‌شود که واقعاً هست: در ماهی
   از سر تا دُم، در مار در تمامِ درازای بدن، در پرنده و پستان‌دار از
   گردن تا انتهای دُم. و جانورانِ بی‌مهره ستونِ مهره ندارند؛ به‌جایش
   بدنِ بندبند یا صدف یا بدنِ نرم دارند — مورچه و ملخ و پروانه و کرم
   و خرچنگ و عروسِ دریایی، همان‌هایی که کتاب نام می‌برد.

   محلِّ زندگی هم واقعی است: ماهی و دلفین و خرچنگ و عروسِ دریایی در
   آب، و عقاب و مرغ و خرس و اسب و مار و مورچه و ملخ و پروانه و کرم
   در خشکی.
   ═══════════════════════════════════════════════════════════════════════ */

const SCENE_W = 1200, SCENE_H = 760;
const HUD_H = 56;

const P = {
  wall: '#25344a', wallLo: '#17202b', wallHi: '#33465f',
  tile: '#2e4058', floor: '#3a4f6b',
  steel: '#9fb0c4', steelDk: '#5f7089', steelLt: '#dbe6f2',
  xray: '#0b1a16', bone: '#eef4f0', boneDk: '#b9c8c0',
  glass: 'rgba(160, 220, 240, .18)',
  water: '#3f8fc4', waterLt: '#7fc4e8', land: '#8a6a3f', landLt: '#b98f57',
  paper: '#fbf7ec', card: '#ffffff',
  ink: '#1b2733', inkSoft: '#78889a',
  good: '#4e9f6c', bad: '#c04a34', gold: '#e0a63f', accent: '#4c9ec4',
  fur: '#a8703f', skin: '#e8b98e',
};

/* ───────── جانوران ───────── */

const ANIMALS = {
  mahi:      { n: 'ماهیِ قرمز',    v: 1, w: 1 },
  qezel:     { n: 'قزل‌آلا',       v: 1, w: 1 },
  delfin:    { n: 'دلفین',         v: 1, w: 1 },
  oghab:     { n: 'عقاب',          v: 1, w: 0 },
  morgh:     { n: 'مرغ',           v: 1, w: 0 },
  khers:     { n: 'خرس',           v: 1, w: 0 },
  asb:       { n: 'اسب',           v: 1, w: 0 },
  mar:       { n: 'مار',           v: 1, w: 0 },
  morche:    { n: 'مورچه',         v: 0, w: 0 },
  malakh:    { n: 'ملخ',           v: 0, w: 0 },
  parvane:   { n: 'پروانه',        v: 0, w: 0 },
  kerm:      { n: 'کرمِ خاکی',     v: 0, w: 0 },
  kharchang: { n: 'خرچنگ',         v: 0, w: 1 },
  arus:      { n: 'عروسِ دریایی',  v: 0, w: 1 },
};

const LEVELS = [
  { name: 'ستونِ مهره', rooms: 2,
    q: ['asb', 'morche', 'mahi', 'malakh'] },
  { name: 'آب یا خشکی', rooms: 4,
    q: ['mahi', 'oghab', 'kharchang', 'morche', 'delfin', 'kerm'] },
  { name: 'شش تا مهمان', rooms: 4,
    q: ['mar', 'arus', 'morgh', 'parvane', 'qezel', 'khers', 'malakh', 'kharchang'] },
  { name: 'درمانگاهِ شلوغ', rooms: 4,
    q: ['khers', 'arus', 'parvane', 'delfin', 'kerm', 'asb', 'kharchang', 'qezel', 'morche', 'oghab'] },
];

/* اتاق‌ها: دو حالته یا چهارحالته */
const ROOMS2 = [
  { n: 'مهره‌دار', v: 1 },
  { n: 'بی‌مهره', v: 0 },
];
const ROOMS4 = [
  { n: 'مهره‌دارِ آبی', v: 1, w: 1 },
  { n: 'مهره‌دارِ خشکی', v: 1, w: 0 },
  { n: 'بی‌مهرهٔ آبی', v: 0, w: 1 },
  { n: 'بی‌مهرهٔ خشکی', v: 0, w: 0 },
];
const rooms = () => (L().rooms === 2 ? ROOMS2 : ROOMS4);

/* ───────── وضعیت ───────── */

const S = {
  phase: 'intro', phaseT: 0,
  level: 0, score: 0, best: 0,
  queue: [], cur: null, done: 0,
  lens: { x: 600, y: 300, on: false },
  lensTo: null,              /* دستگاه بعد از عکس خودش کنار می‌رود */
  scanned: false, scanT: 0,
  drag: null,
  fly: null,                 /* جانورِ در حالِ رفتن به اتاق */
  badRoom: -1, badT: 0,
  won: false, winT: 0,
  t: 0, hover: null, tip: '', tipT: 0, shake: 0,
  tut: { on: false, step: 0, t: 0 },
};

const bits = new Bits();
const toast = new Toast();
const cv = document.getElementById('stage');
initStage(cv, SCENE_W, SCENE_H);

const L = () => LEVELS[Math.min(S.level, LEVELS.length - 1)];
function tip(msg) { S.tip = msg; S.tipT = 3.2; }

function loadLevel(i) {
  S.level = i;
  S.queue = LEVELS[i].q.slice();
  S.cur = S.queue.shift();
  S.done = 0;
  S.scanned = false; S.scanT = 0;
  S.lens = { x: 300, y: 250, on: false };
  S.lensTo = null;
  S.drag = null; S.fly = null; S.badRoom = -1;
  S.won = false; S.winT = 0;
}

function startLevel(i, keep) {
  S.phase = 'play'; S.phaseT = 0;
  if (!keep) S.score = 0;
  S.tut.on = i === 0 && !keep; S.tut.step = 0; S.tut.t = 0;
  loadLevel(i);
}

/* ───────── جای‌ها ───────── */

const TABLE = { x: 420, y: 268, w: 360, h: 200 };
const TABLE_CX = TABLE.x + TABLE.w / 2, TABLE_CY = TABLE.y + 70;
const LENS_R = 96;
const QUEUE_Y = 660;
const BTN_GO = { x: SCENE_W / 2 - 150, y: 486, w: 300, h: 68 };
const BTN_AGAIN = { x: SCENE_W / 2 - 150, y: 492, w: 300, h: 68 };

function roomRect(i) {
  const n = rooms().length;
  const w = n === 2 ? 340 : 268;
  const gap = (SCENE_W - 80 - w * n) / Math.max(1, n - 1);
  return { x: 40 + i * (w + gap), y: HUD_H + 18, w, h: 150 };
}
function queueSlot(i) { return { x: 90 + i * 104, y: QUEUE_Y, w: 92, h: 82 }; }

/* ───────── ورودی ───────── */

const TUT_TAP = [0, 1, 2], TUT_LAST = 2;

cv.addEventListener('pointermove', (e) => {
  const p = toStage(e);
  if (S.lens.on) { S.lens.x = p.x; S.lens.y = p.y; checkScan(); return; }
  if (S.drag) { S.drag.x = p.x; S.drag.y = p.y; return; }
  S.hover = null;
  if (S.phase === 'intro') { if (inRect(p, BTN_GO)) S.hover = BTN_GO; }
  else if (S.phase === 'won') { if (inRect(p, BTN_AGAIN)) S.hover = BTN_AGAIN; }
  else {
    if (S.cur && S.scanned && Math.hypot(p.x - TABLE_CX, p.y - TABLE_CY) < 96) S.hover = { k: 'animal' };
    else if (Math.hypot(p.x - S.lens.x, p.y - S.lens.y) < LENS_R) S.hover = { k: 'lens' };
    for (let i = 0; i < rooms().length; i++) if (inRect(p, roomRect(i))) S.hover = { k: 'room', i };
  }
  cv.style.cursor = S.hover ? 'pointer' : 'default';
});

cv.addEventListener('pointerdown', (e) => {
  const p = toStage(e);
  const cap = () => { try { cv.setPointerCapture(e.pointerId); } catch { /* ok */ } };
  if (S.phase === 'intro') { if (inRect(p, BTN_GO)) { startLevel(0); sfx.good(); } return; }
  if (S.phase === 'won') {
    if (inRect(p, BTN_AGAIN)) { S.phase = 'intro'; S.phaseT = 0; S.score = 0; loadLevel(0); sfx.tap(); }
    return;
  }
  if (S.tut.on && tutTap(S.tut, TUT_TAP, TUT_LAST)) return;
  if (S.winT || S.fly) return;
  /* بعد از عکس گرفتن، خودِ جانور اولویت دارد — وگرنه دستگاه رویش می‌ماند */
  if (S.cur && S.scanned && Math.hypot(p.x - TABLE_CX, p.y - TABLE_CY) < 96) {
    S.drag = { id: S.cur, x: p.x, y: p.y };
    cap(); sfx.tap();
    return;
  }
  if (Math.hypot(p.x - S.lens.x, p.y - S.lens.y) < LENS_R) {
    S.lens.on = true; S.lens.x = p.x; S.lens.y = p.y;
    cap(); sfx.slide();
    checkScan();
    return;
  }
  if (S.cur && Math.hypot(p.x - TABLE_CX, p.y - TABLE_CY) < 96) {
    if (!S.scanned) { tip('اوّل با دستگاهِ عکس داخلش را ببین.'); S.shake = .1; sfx.nope(); return; }
    S.drag = { id: S.cur, x: p.x, y: p.y };
    cap(); sfx.tap();
  }
});

function checkScan() {
  if (!S.cur || S.scanned) return;
  if (Math.hypot(S.lens.x - TABLE_CX, S.lens.y - TABLE_CY) < 48) {
    S.scanned = true; S.scanT = .001;
    S.lensTo = { x: 232, y: 386 };
    sfx.place();
    if (S.tut.on && S.tut.step === 1) { S.tut.step = 2; S.tut.t = 0; }
  }
}

function release() {
  S.lens.on = false;
  const d = S.drag;
  if (!d) return;
  S.drag = null;
  const p = { x: d.x, y: d.y };
  for (let i = 0; i < rooms().length; i++) {
    if (!inRect(p, roomRect(i))) continue;
    const a = ANIMALS[d.id], r = rooms()[i];
    const ok = a.v === r.v && (r.w === undefined || a.w === r.w);
    if (ok) {
      const rr = roomRect(i);
      S.fly = { id: d.id, x: p.x, y: p.y, tx: rr.x + rr.w / 2, ty: rr.y + rr.h / 2, t: 0 };
      sfx.good();
      bits.confetti(rr.x + rr.w / 2, rr.y + rr.h, 14, [P.good, P.gold, '#fff']);
    } else {
      S.badRoom = i; S.badT = .7;
      S.shake = .14; sfx.nope();
      tip('اینجا نه — دوباره نگاهش کن.');
    }
    return;
  }
  sfx.pop();
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
addEventListener('blur', release);

function nextAnimal() {
  S.done++;
  S.score += 40;
  if (S.score > S.best) S.best = S.score;
  if (!S.queue.length) {
    S.cur = null;
    S.won = true; S.winT = .001;
    S.score += 60 + S.level * 20;
    if (S.score > S.best) S.best = S.score;
    sfx.win();
    return;
  }
  S.cur = S.queue.shift();
  S.scanned = false; S.scanT = 0;
}

/* ───────── حلقه ───────── */

function step(dt) {
  S.t += dt;
  if (S.phaseT < 9) S.phaseT += dt;
  if (S.tipT > 0) S.tipT -= dt;
  if (S.badT > 0) { S.badT -= dt; if (S.badT <= 0) S.badRoom = -1; }
  if (S.shake > 0) S.shake = Math.max(0, S.shake - dt);
  if (S.scanT) S.scanT = Math.min(1, S.scanT + dt * 2.4);
  if (S.lensTo && !S.lens.on) {
    const k = clamp(dt * 7, 0, 1);
    S.lens.x = lerp(S.lens.x, S.lensTo.x, k);
    S.lens.y = lerp(S.lens.y, S.lensTo.y, k);
    if (Math.hypot(S.lens.x - S.lensTo.x, S.lens.y - S.lensTo.y) < 2) S.lensTo = null;
  }
  if (S.tut.on) S.tut.t += dt;
  if (S.fly) {
    S.fly.t += dt * 2.4;
    if (S.fly.t >= 1) { S.fly = null; nextAnimal(); }
  }
  if (S.winT) {
    S.winT += dt;
    if (S.winT > 2.2) {
      S.winT = 0;
      if (S.level >= LEVELS.length - 1) { S.phase = 'won'; S.phaseT = 0; }
      else { loadLevel(S.level + 1); toast.say(L().name, 'good'); }
    }
  }
  bits.step(dt);
  toast.step(dt);
  draw();
}

whenFontsReady(() => { loadLevel(0); runLoop(step); });

/* ───────── ابزارِ نقاشی ───────── */

function rrPath(x, y, w, h, r) {
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function numText(str, x, y, o = {}) {
  ctx.save();
  ctx.direction = 'ltr';
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = o.color || P.ink;
  ctx.font = `${o.weight || 700} ${o.size || 18}px "${o.family || 'Vazirmatn'}", Tahoma, sans-serif`;
  ctx.fillText(str, x, y);
  ctx.restore();
}

function spot(shapes, alpha) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, SCENE_W, SCENE_H);
  for (const s of shapes) {
    if (s.r) { ctx.moveTo(s.x + s.r, s.y); ctx.arc(s.x, s.y, s.r, 0, TAU, true); }
    else rrPath(s.x - 10, s.y - 10, s.w + 20, s.h + 20, 18);
  }
  ctx.fillStyle = `rgba(6, 14, 22, ${alpha})`;
  ctx.fill('evenodd');
  ctx.restore();
}

function tutCard(x, y, w, lines, title) {
  const h = 26 + (title ? 44 : 0) + lines.length * 30;
  withShadow(24, 10, .5, () => {
    ctx.fillStyle = 'rgba(255, 253, 248, .97)';
    wobbleRect(x, y, w, h + 20, 16, 101, 2.2); ctx.fill();
  }, '6, 14, 22');
  ctx.fillStyle = P.accent;
  wobbleRect(x, y, w, 9, 4, 103, 1); ctx.fill();
  let yy = y + 34;
  if (title) { text(title, x + w / 2, yy + 6, { size: 25, family: 'Lalezar', color: P.ink }); yy += 44; }
  for (const l of lines) { text(l, x + w / 2, yy, { size: 18, color: '#68788a' }); yy += 30; }
  return h + 20;
}

/* ───────── بدنِ جانوران ───────── */

function body(id, x, y, k) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(k, k);
  const E = (cx, cy, rx, ry, rot, col, seed) => {
    ctx.fillStyle = col; wobbleEllipse(cx, cy, rx, ry, rot || 0, seed || 3, 1.4); ctx.fill();
  };
  if (id === 'mahi' || id === 'qezel') {
    const c1 = id === 'mahi' ? '#e8703f' : '#7f9fb8', c2 = id === 'mahi' ? '#ffa06a' : '#b8cfdc';
    E(0, 0, 52, 30, 0, c1, 3);
    ctx.fillStyle = c1;
    ctx.beginPath(); ctx.moveTo(44, 0); ctx.lineTo(76, -24); ctx.lineTo(76, 24); ctx.closePath(); ctx.fill();
    E(-6, -22, 20, 10, -.3, c2, 5);
    E(4, 20, 16, 8, .3, c2, 7);
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-32, -6, 7, 0, TAU); ctx.fill();
    ctx.fillStyle = '#1b2733';
    ctx.beginPath(); ctx.arc(-33, -6, 3.4, 0, TAU); ctx.fill();
    ctx.strokeStyle = c2; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(-14, 0, 20, -1.1, 1.1); ctx.stroke();
  } else if (id === 'delfin') {
    E(0, 0, 62, 26, -.08, '#6f93b8', 3);
    ctx.fillStyle = '#6f93b8';
    ctx.beginPath(); ctx.moveTo(52, -4); ctx.lineTo(84, -22); ctx.lineTo(80, 10); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-2, -24); ctx.lineTo(14, -48); ctx.lineTo(22, -22); ctx.closePath(); ctx.fill();
    E(-46, 6, 24, 13, .25, '#6f93b8', 9);
    E(0, 10, 54, 16, -.05, '#cfe0ec', 11);
    ctx.fillStyle = '#1b2733';
    ctx.beginPath(); ctx.arc(-44, -4, 3.6, 0, TAU); ctx.fill();
  } else if (id === 'oghab') {
    E(0, 4, 34, 30, 0, '#6b4a2c', 3);
    E(-26, -22, 20, 17, 0, '#e8ddc8', 5);
    ctx.fillStyle = '#e0a63f';
    ctx.beginPath(); ctx.moveTo(-42, -22); ctx.lineTo(-58, -14); ctx.lineTo(-40, -10); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#5a3d22';
    ctx.beginPath(); ctx.moveTo(6, -14); ctx.quadraticCurveTo(56, -34, 62, 6);
    ctx.quadraticCurveTo(36, 6, 6, 14); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#e0a63f'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-4, 30); ctx.lineTo(-6, 44); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(12, 30); ctx.lineTo(14, 44); ctx.stroke();
    ctx.fillStyle = '#1b2733';
    ctx.beginPath(); ctx.arc(-30, -24, 3.4, 0, TAU); ctx.fill();
  } else if (id === 'morgh') {
    E(4, 4, 32, 27, 0, '#f0ede2', 3);
    E(-24, -20, 16, 14, 0, '#f0ede2', 5);
    ctx.fillStyle = '#d94f3d';
    ctx.beginPath(); ctx.moveTo(-30, -34); ctx.quadraticCurveTo(-24, -44, -18, -34);
    ctx.quadraticCurveTo(-12, -44, -8, -32); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e0a63f';
    ctx.beginPath(); ctx.moveTo(-38, -18); ctx.lineTo(-50, -14); ctx.lineTo(-38, -10); ctx.closePath(); ctx.fill();
    E(14, 2, 18, 15, .3, '#dcd6c4', 9);
    ctx.strokeStyle = '#e0a63f'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 28); ctx.lineTo(-2, 44); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(16, 28); ctx.lineTo(18, 44); ctx.stroke();
    ctx.fillStyle = '#1b2733';
    ctx.beginPath(); ctx.arc(-28, -22, 3.2, 0, TAU); ctx.fill();
  } else if (id === 'khers') {
    E(6, 4, 42, 34, 0, P.fur, 3);
    E(-34, -12, 24, 22, 0, P.fur, 5);
    E(-46, -30, 9, 9, 0, P.fur, 7);
    E(-24, -32, 9, 9, 0, P.fur, 9);
    E(-44, -6, 12, 9, 0, '#d9b08a', 11);
    ctx.fillStyle = '#1b2733';
    ctx.beginPath(); ctx.arc(-48, -8, 3.6, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(-34, -16, 3, 0, TAU); ctx.fill();
    ctx.fillStyle = P.fur;
    for (const dx of [-8, 26]) { wobbleEllipse(dx, 36, 12, 10, 0, dx, 1); ctx.fill(); }
  } else if (id === 'asb') {
    E(6, 0, 46, 28, 0, '#a8703f', 3);
    ctx.fillStyle = '#a8703f';
    ctx.beginPath(); ctx.moveTo(-34, -8); ctx.lineTo(-52, -44); ctx.lineTo(-34, -46);
    ctx.lineTo(-18, -12); ctx.closePath(); ctx.fill();
    E(-46, -46, 13, 10, -.4, '#a8703f', 5);
    ctx.fillStyle = '#4a3320';
    ctx.beginPath(); ctx.moveTo(-30, -44); ctx.quadraticCurveTo(-14, -30, -8, -8);
    ctx.lineTo(-20, -6); ctx.quadraticCurveTo(-24, -28, -38, -40); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(48, -18); ctx.quadraticCurveTo(72, 0, 56, 30);
    ctx.lineTo(46, 22); ctx.quadraticCurveTo(58, 2, 42, -14); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#a8703f'; ctx.lineWidth = 9; ctx.lineCap = 'round';
    for (const dx of [-14, 4, 22, 36]) {
      ctx.beginPath(); ctx.moveTo(dx, 22); ctx.lineTo(dx + 2, 50); ctx.stroke();
    }
    ctx.fillStyle = '#1b2733';
    ctx.beginPath(); ctx.arc(-42, -42, 3.2, 0, TAU); ctx.fill();
  } else if (id === 'mar') {
    ctx.strokeStyle = '#5f9f4a'; ctx.lineWidth = 20; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-64, 22);
    ctx.bezierCurveTo(-20, 40, -30, -14, 8, -6);
    ctx.bezierCurveTo(44, 2, 40, -34, 66, -30);
    ctx.stroke();
    ctx.strokeStyle = '#8fc46a'; ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(-64, 22);
    ctx.bezierCurveTo(-20, 40, -30, -14, 8, -6);
    ctx.bezierCurveTo(44, 2, 40, -34, 66, -30);
    ctx.stroke();
    E(68, -32, 16, 12, -.2, '#5f9f4a', 5);
    ctx.fillStyle = '#1b2733';

    ctx.strokeStyle = '#d94f3d'; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(82, -30); ctx.lineTo(96, -28); ctx.stroke();
  } else if (id === 'morche') {
    for (const [cx, rx, ry] of [[-30, 14, 12], [0, 11, 10], [30, 20, 16]]) E(cx, 0, rx, ry, 0, '#5a3d22', cx + 5);
    ctx.strokeStyle = '#5a3d22'; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
    for (const s of [-1, 1]) for (let i = 0; i < 3; i++) {

    ctx.beginPath(); ctx.moveTo(-38, -6); ctx.quadraticCurveTo(-52, -22, -60, -18); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-36, -10); ctx.quadraticCurveTo(-46, -28, -40, -34); ctx.stroke();
    ctx.fillStyle = '#f0ede2';
    ctx.beginPath(); ctx.arc(-34, -4, 3, 0, TAU); ctx.fill();
  } else if (id === 'malakh') {
    E(6, 0, 40, 16, -.08, '#6ba83f', 3);
    E(-32, -4, 16, 12, -.1, '#5a9432', 5);
    ctx.fillStyle = '#8fc46a';
    wobbleEllipse(10, -10, 34, 11, -.12, 7, 1.2); ctx.fill();
    ctx.strokeStyle = '#5a9432'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(16, 8); ctx.lineTo(38, -14); ctx.lineTo(52, 22); ctx.stroke();
    ctx.lineWidth = 3.4;
    ctx.beginPath(); ctx.moveTo(-6, 10); ctx.lineTo(-14, 28); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(6, 10); ctx.lineTo(2, 28); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-40, -10); ctx.quadraticCurveTo(-56, -26, -64, -20); ctx.stroke();
    ctx.fillStyle = '#f0ede2';
    ctx.beginPath(); ctx.arc(-36, -6, 3.4, 0, TAU); ctx.fill();
  } else if (id === 'parvane') {
    ctx.fillStyle = '#e07fb0';
    wobbleEllipse(-24, -18, 26, 22, -.4, 3, 1.6); ctx.fill();
    wobbleEllipse(24, -18, 26, 22, .4, 5, 1.6); ctx.fill();
    ctx.fillStyle = '#f2a8cf';
    wobbleEllipse(-22, 16, 20, 17, .3, 7, 1.4); ctx.fill();
    wobbleEllipse(22, 16, 20, 17, -.3, 9, 1.4); ctx.fill();
    ctx.fillStyle = '#e8c44a';
    for (const [cx, cy] of [[-28, -20], [28, -20], [-24, 16], [24, 16]]) {
      ctx.beginPath(); ctx.arc(cx, cy, 5, 0, TAU); ctx.fill();
    }
    E(0, 0, 7, 26, 0, '#4a3320', 11);
    ctx.strokeStyle = '#4a3320'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-3, -24); ctx.quadraticCurveTo(-14, -40, -20, -38); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(3, -24); ctx.quadraticCurveTo(14, -40, 20, -38); ctx.stroke();
  } else if (id === 'kerm') {
    ctx.strokeStyle = '#d98fa0'; ctx.lineWidth = 22; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-62, 10);
    ctx.bezierCurveTo(-24, 30, -10, -20, 22, -2);
    ctx.bezierCurveTo(46, 10, 52, -14, 64, -12);
    ctx.stroke();
    ctx.strokeStyle = '#c47487'; ctx.lineWidth = 2;
    for (let i = 0; i < 9; i++) {
      const u = i / 9;

    for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(s * 14, -18, 3.4, 0, TAU); ctx.fill(); }

    /* عروسِ دریایی */
    ctx.fillStyle = 'rgba(214, 160, 224, .75)';

    ctx.moveTo(-46, 4);

    ctx.quadraticCurveTo(46, -46, 46, 4);

    ctx.quadraticCurveTo(-24, 14, -46, 4);

    wobbleEllipse(-14, -22, 16, 10, -.3, 5, 1.4); ctx.fill();
    ctx.strokeStyle = 'rgba(214, 160, 224, .8)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    for (let i = 0; i < 6; i++) {
      const x = -34 + i * 14;
      ctx.beginPath();
      ctx.moveTo(x, 6);
      ctx.quadraticCurveTo(x + Math.sin(i + S.t * 2) * 12, 26, x + Math.sin(i * 2 + S.t * 2) * 10, 48);

  ctx.restore();
}

/* ───────── اسکلت ─────────
   ستونِ مهره دقیقاً همان‌جایی است که در بدنِ واقعی هست.            */

function spineOf(id) {
  switch (id) {
    case 'mahi': case 'qezel':
      return [[-46, -2], [-24, -2], [0, 0], [24, 2], [44, 2], [62, 0]];
    case 'delfin':
      return [[-46, -4], [-20, -6], [6, -2], [32, 0], [56, -2], [76, -10]];
    case 'oghab':
      return [[-26, -20], [-14, -8], [0, 2], [16, 10], [30, 14]];
    case 'morgh':
      return [[-24, -18], [-12, -6], [2, 4], [16, 10], [28, 12]];
    case 'khers':
      return [[-32, -12], [-14, -6], [6, 0], [26, 4], [44, 8]];
    case 'asb':
      return [[-40, -38], [-26, -20], [-8, -8], [14, -6], [36, -8], [50, -14]];
    case 'mar':
      return [[-62, 22], [-40, 30], [-18, 12], [4, -6], [26, 0], [48, -20], [66, -30]];
    default: return null;
  }
}

function skeleton(id, x, y, k) {
  const a = ANIMALS[id];
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(k, k);
  const sp = spineOf(id);
  if (a.v && sp) {
    /* ستونِ مهره: زنجیرهٔ مهره‌ها */
    ctx.strokeStyle = P.boneDk; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(sp[0][0], sp[0][1]);
    for (let i = 1; i < sp.length; i++) ctx.lineTo(sp[i][0], sp[i][1]);
    ctx.stroke();
    for (let i = 0; i < sp.length - 1; i++) {
      const steps = 5;
      for (let j = 0; j <= steps; j++) {
        const u = j / steps;
        const px = sp[i][0] + (sp[i + 1][0] - sp[i][0]) * u;
        const py = sp[i][1] + (sp[i + 1][1] - sp[i][1]) * u;
        ctx.fillStyle = P.bone;
        ctx.beginPath(); ctx.arc(px, py, 4.6, 0, TAU); ctx.fill();
      }
    }
    /* جمجمه */
    ctx.fillStyle = P.bone;
    const h = sp[0];
    ctx.beginPath(); ctx.ellipse(h[0] - 6, h[1] - 4, 13, 10, -.2, 0, TAU); ctx.fill();
    /* دنده‌ها یا اندام‌ها */
    ctx.strokeStyle = P.bone; ctx.lineWidth = 3;
    if (id === 'mahi' || id === 'qezel') {
      for (let i = 1; i < 5; i++) {
        const t = i / 5, px = -46 + t * 92, py = -2 + t * 4;
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px - 4, py + 20); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px - 4, py - 20); ctx.stroke();
      }
    } else if (id === 'mar') {
      for (let i = 0; i < 12; i++) {
        const u = i / 11;
        const seg = Math.min(sp.length - 2, Math.floor(u * (sp.length - 1)));
        const f = u * (sp.length - 1) - seg;
        const px = sp[seg][0] + (sp[seg + 1][0] - sp[seg][0]) * f;
        const py = sp[seg][1] + (sp[seg + 1][1] - sp[seg][1]) * f;
        ctx.beginPath(); ctx.arc(px, py + 2, 9, .2, Math.PI - .2); ctx.stroke();
      }
    } else {
      for (let i = 1; i < 4; i++) {
        const t = i / 4;
        const seg = Math.min(sp.length - 2, Math.floor(t * (sp.length - 1)));
        const f = t * (sp.length - 1) - seg;
        const px = sp[seg][0] + (sp[seg + 1][0] - sp[seg][0]) * f;
        const py = sp[seg][1] + (sp[seg + 1][1] - sp[seg][1]) * f;
        ctx.beginPath(); ctx.arc(px, py + 10, 14, -1.1, 1.1); ctx.stroke();
      }
      /* استخوانِ پاها */
      if (id === 'khers' || id === 'asb' || id === 'morgh' || id === 'oghab') {
        const legs = id === 'asb' ? [-14, 4, 22, 36] : id === 'khers' ? [-8, 26] : [0, 16];
        for (const dx of legs) {
          ctx.beginPath(); ctx.moveTo(dx, 6); ctx.lineTo(dx + 2, 34); ctx.stroke();
        }
      }
      if (id === 'delfin') {
        ctx.beginPath(); ctx.moveTo(-40, 4); ctx.lineTo(-52, 12); ctx.stroke();
      }
    }
  } else {
    /* بی‌مهره: هیچ ستونِ مهره‌ای نیست */
    ctx.strokeStyle = 'rgba(238,244,240,.5)'; ctx.lineWidth = 2.4;
    ctx.setLineDash([5, 6]);
    if (id === 'kharchang') {
      ctx.beginPath(); ctx.ellipse(0, 0, 44, 30, 0, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
      ctx.strokeStyle = 'rgba(238,244,240,.75)'; ctx.lineWidth = 3;
      for (const s of [-1, 1]) for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(s * 26, 6 + i * 6);
        ctx.quadraticCurveTo(s * 50, 16 + i * 10, s * 60, 34 + i * 6);
        ctx.stroke();
      }
    } else if (id === 'arus') {
      ctx.beginPath();
      ctx.moveTo(-46, 4);
      ctx.quadraticCurveTo(0, -52, 46, 4);
      ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0, -16, 22, 14, 0, 0, TAU); ctx.stroke();
    } else if (id === 'kerm') {
      ctx.beginPath();
      ctx.moveTo(-62, 10);
      ctx.bezierCurveTo(-24, 30, -10, -20, 22, -2);
      ctx.bezierCurveTo(46, 10, 52, -14, 64, -12);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.strokeStyle = 'rgba(238,244,240,.7)'; ctx.lineWidth = 2;
      for (let i = 0; i < 9; i++) {
        const u = i / 9, x = -62 + u * 126, y = 10 + Math.sin(u * 6) * 14;
        ctx.beginPath(); ctx.moveTo(x, y - 11); ctx.lineTo(x, y + 11); ctx.stroke();
      }
    } else {
      /* بندبندهای حشره */
      ctx.setLineDash([]);
      ctx.strokeStyle = 'rgba(238,244,240,.7)'; ctx.lineWidth = 3;
      const segs = id === 'parvane' ? [[0, -20], [0, 0], [0, 20]]
        : id === 'malakh' ? [[-32, -4], [-6, 0], [26, 2]]
        : [[-30, 0], [0, 0], [30, 0]];
      for (const [cx, cy] of segs) {
        ctx.beginPath(); ctx.ellipse(cx, cy, 13, 11, 0, 0, TAU); ctx.stroke();
      }
      ctx.beginPath();
      ctx.moveTo(segs[0][0], segs[0][1]);
      for (const s of segs) ctx.lineTo(s[0], s[1]);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    /* نشانهٔ «ستونِ مهره ندارد» */
    ctx.strokeStyle = 'rgba(201,90,70,.9)'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-70, -46); ctx.lineTo(-52, -28);
    ctx.moveTo(-52, -46); ctx.lineTo(-70, -28);
    ctx.stroke();
  }
  ctx.restore();
}

/* ───────── صحنه ───────── */

function paintRoomStatic() {
  const g = ctx.createLinearGradient(0, HUD_H, 0, SCENE_H);
  g.addColorStop(0, P.wallHi); g.addColorStop(1, P.wallLo);
  ctx.fillStyle = g;
  ctx.fillRect(0, HUD_H, SCENE_W, SCENE_H - HUD_H);
  /* کاشی‌های دیوار */
  ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.lineWidth = 2;
  for (let x = 0; x < SCENE_W; x += 60) {
    ctx.beginPath(); ctx.moveTo(x, HUD_H); ctx.lineTo(x, 560); ctx.stroke();
  }
  for (let y = HUD_H; y < 560; y += 60) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(SCENE_W, y); ctx.stroke();
  }
  /* کف */
  ctx.fillStyle = P.floor;
  ctx.fillRect(0, 560, SCENE_W, SCENE_H - 560);
  ctx.fillStyle = 'rgba(255,255,255,.05)';
  ctx.fillRect(0, 560, SCENE_W, 4);

  /* قفسهٔ داروها */
  const cx0 = 56, cy0 = 306, cw = 214, ch = 254;
  ctx.fillStyle = '#22303f';
  ctx.beginPath(); rrPath(cx0, cy0, cw, ch, 10); ctx.fill();
  ctx.strokeStyle = 'rgba(159,176,196,.35)'; ctx.lineWidth = 3;
  ctx.beginPath(); rrPath(cx0, cy0, cw, ch, 10); ctx.stroke();
  for (let r = 0; r < 3; r++) {
    const sy = cy0 + 74 + r * 68;
    ctx.fillStyle = 'rgba(159,176,196,.3)';
    ctx.fillRect(cx0 + 8, sy, cw - 16, 5);
    for (let j = 0; j < 4; j++) {
      const jx = cx0 + 30 + j * 44;
      ctx.fillStyle = ['#7fc4a8', '#e8c46a', '#d98fa0', '#8fb0e0'][(r + j) % 4];
      ctx.beginPath(); rrPath(jx - 12, sy - 34, 24, 34, 5); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.3)';
      ctx.beginPath(); rrPath(jx - 8, sy - 30, 5, 24, 2); ctx.fill();
      ctx.fillStyle = '#5f7089';
      ctx.beginPath(); rrPath(jx - 8, sy - 40, 16, 8, 3); ctx.fill();
    }
  }
  /* پوسترِ ستونِ مهره روی دیوار */
  const px0 = 934, py0 = 300, pw = 220, ph = 210;
  ctx.fillStyle = '#f4f0e2';
  ctx.beginPath(); rrPath(px0, py0, pw, ph, 8); ctx.fill();
  ctx.strokeStyle = '#5f7089'; ctx.lineWidth = 3;
  ctx.beginPath(); rrPath(px0, py0, pw, ph, 8); ctx.stroke();
  ctx.save();
  ctx.translate(px0 + pw / 2, py0 + 106);
  ctx.strokeStyle = '#3a4f6b'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(0, -62); ctx.lineTo(0, 62); ctx.stroke();
  ctx.fillStyle = '#3a4f6b';
  for (let y = -62; y <= 62; y += 13) {
    ctx.beginPath(); ctx.ellipse(0, y, 13, 5.4, 0, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = '#e8ddc8';
  ctx.beginPath(); ctx.ellipse(0, -78, 20, 16, 0, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawRooms() {
  const rs = rooms();
  for (let i = 0; i < rs.length; i++) {
    const r = roomRect(i), room = rs[i];
    const hot = S.hover && S.hover.k === 'room' && S.hover.i === i;
    const bad = S.badRoom === i;
    ctx.fillStyle = bad ? 'rgba(192,74,52,.35)' : (hot ? 'rgba(255,255,255,.14)' : 'rgba(255,255,255,.07)');
    ctx.beginPath(); rrPath(r.x, r.y, r.w, r.h, 14); ctx.fill();
    ctx.strokeStyle = bad ? P.bad : (room.w === 1 ? P.water : room.w === 0 ? P.land : P.steel);
    ctx.lineWidth = 3;
    ctx.beginPath(); rrPath(r.x, r.y, r.w, r.h, 14); ctx.stroke();
    /* نشانهٔ اتاق */
    const cx = r.x + r.w / 2;
    if (room.w === 1) {
      ctx.fillStyle = 'rgba(63,143,196,.4)';
      ctx.beginPath(); rrPath(r.x + 8, r.y + r.h - 46, r.w - 16, 38, 8); ctx.fill();
      ctx.strokeStyle = P.waterLt; ctx.lineWidth = 2.6;
      for (let k = 0; k < 3; k++) {
        ctx.beginPath();
        for (let x = r.x + 14; x < r.x + r.w - 14; x += 14) {
          ctx.lineTo(x, r.y + r.h - 34 + k * 11 + Math.sin((x + S.t * 40 + k * 20) * .05) * 3);
        }
        ctx.stroke();
      }
    } else if (room.w === 0) {
      ctx.fillStyle = 'rgba(138,106,63,.5)';
      ctx.beginPath(); rrPath(r.x + 8, r.y + r.h - 46, r.w - 16, 38, 8); ctx.fill();
      ctx.fillStyle = '#5f9f4a';
      for (let x = r.x + 16; x < r.x + r.w - 16; x += 12) {
        ctx.beginPath();
        ctx.moveTo(x, r.y + r.h - 8); ctx.lineTo(x + 4, r.y + r.h - 26); ctx.lineTo(x + 8, r.y + r.h - 8);
        ctx.closePath(); ctx.fill();
      }
    }
    /* نشانهٔ ستونِ مهره */
    ctx.save();
    ctx.translate(cx, r.y + 46);
    ctx.scale(.9, .9);
    if (room.v) {
      ctx.strokeStyle = P.bone; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(-40, 0); ctx.lineTo(40, 0); ctx.stroke();
      ctx.fillStyle = P.bone;
      for (let x = -40; x <= 40; x += 10) { ctx.beginPath(); ctx.arc(x, 0, 4.4, 0, TAU); ctx.fill(); }
    } else {
      ctx.strokeStyle = 'rgba(238,244,240,.5)'; ctx.lineWidth = 4;
      ctx.setLineDash([6, 7]);
      ctx.beginPath(); ctx.moveTo(-40, 0); ctx.lineTo(40, 0); ctx.stroke();
      ctx.setLineDash([]);
      ctx.strokeStyle = P.bad; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-10, -12); ctx.lineTo(10, 8);
      ctx.moveTo(10, -12); ctx.lineTo(-10, 8);
      ctx.stroke();
    }
    ctx.restore();
    text(room.n, cx, r.y + 92, { size: 17, color: P.paper });
  }
}

function drawTable() {
  /* میزِ معاینه */
  ctx.fillStyle = P.steelDk;
  ctx.beginPath(); rrPath(TABLE.x, TABLE.y + 100, TABLE.w, 22, 8); ctx.fill();
  ctx.fillStyle = P.steel;
  ctx.beginPath(); rrPath(TABLE.x, TABLE.y + 96, TABLE.w, 18, 8); ctx.fill();
  ctx.fillStyle = P.steelDk;
  ctx.beginPath(); rrPath(TABLE.x + 40, TABLE.y + 118, 22, 90, 6); ctx.fill();
  ctx.beginPath(); rrPath(TABLE.x + TABLE.w - 62, TABLE.y + 118, 22, 90, 6); ctx.fill();
  if (!S.cur) return;
  contact(TABLE_CX, TABLE.y + 100, 90, 14, .4);
  if (!(S.drag && S.drag.id === S.cur)) body(S.cur, TABLE_CX, TABLE_CY, 1);
  text(ANIMALS[S.cur].n, TABLE_CX, TABLE.y + 150,
    { size: 20, family: 'Lalezar', color: P.paper });
}

function drawLens() {
  const l = S.lens;
  /* پرتوِ دستگاه */
  ctx.save();
  ctx.beginPath(); ctx.arc(l.x, l.y, LENS_R, 0, TAU); ctx.clip();
  ctx.fillStyle = P.xray;
  ctx.fillRect(l.x - LENS_R, l.y - LENS_R, LENS_R * 2, LENS_R * 2);
  /* خطوطِ اسکن */
  ctx.strokeStyle = 'rgba(120, 220, 190, .12)'; ctx.lineWidth = 1.6;
  for (let y = l.y - LENS_R; y < l.y + LENS_R; y += 7) {
    ctx.beginPath(); ctx.moveTo(l.x - LENS_R, y); ctx.lineTo(l.x + LENS_R, y); ctx.stroke();
  }
  if (S.cur) {
    ctx.save();
    ctx.globalAlpha = .35;
    body(S.cur, TABLE_CX, TABLE_CY, 1);
    ctx.restore();
    skeleton(S.cur, TABLE_CX, TABLE_CY, 1);
    /* بعد از عکس، عکسِ گرفته‌شده داخلِ خودِ دستگاه می‌ماند */
    if (S.scanned && Math.hypot(l.x - TABLE_CX, l.y - TABLE_CY) > 40) {
      ctx.save();
      ctx.globalAlpha = .3;
      body(S.cur, l.x, l.y, .78);
      ctx.restore();
      skeleton(S.cur, l.x, l.y, .78);
    }
  }
  ctx.restore();
  /* قابِ دستگاه */
  ctx.strokeStyle = P.steelLt; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.arc(l.x, l.y, LENS_R, 0, TAU); ctx.stroke();
  ctx.strokeStyle = P.steelDk; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(l.x, l.y, LENS_R + 5, 0, TAU); ctx.stroke();
  /* دسته */
  ctx.save();
  ctx.translate(l.x, l.y);
  ctx.rotate(-.7);
  ctx.fillStyle = P.steelDk;
  ctx.beginPath(); rrPath(LENS_R + 2, -13, 76, 26, 10); ctx.fill();
  ctx.fillStyle = P.steel;
  ctx.beginPath(); rrPath(LENS_R + 6, -9, 66, 18, 8); ctx.fill();
  ctx.restore();
  if (!S.scanned && S.cur) {
    ctx.save();
    ctx.globalAlpha = .5 + .3 * Math.sin(S.t * 3);
    ctx.strokeStyle = P.gold; ctx.lineWidth = 3;
    ctx.setLineDash([10, 9]);
    ctx.lineDashOffset = -S.t * 26;
    ctx.beginPath(); ctx.arc(TABLE_CX, TABLE_CY, 62, 0, TAU); ctx.stroke();
    ctx.restore();
  }
}

function drawQueue() {
  text('در نوبت', 40, QUEUE_Y + 40, { size: 17, color: 'rgba(251,247,236,.6)', align: 'right' });
  for (let i = 0; i < S.queue.length; i++) {
    const b = queueSlot(i);
    if (b.x > SCENE_W - 120) break;
    ctx.fillStyle = 'rgba(255,255,255,.06)';
    ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 12); ctx.fill();
    ctx.save();
    ctx.globalAlpha = .85;
    body(S.queue[i], b.x + b.w / 2, b.y + b.h / 2 + 4, .42);
    ctx.restore();
  }
}

/* ───────── نوار و پرده‌ها ───────── */

function drawHUD() {
  ctx.fillStyle = '#0e161f';
  ctx.fillRect(0, 0, SCENE_W, HUD_H);
  ctx.fillStyle = 'rgba(224,166,63,.22)';
  ctx.fillRect(0, HUD_H - 2, SCENE_W, 2);
  text(L().name, SCENE_W - 150, HUD_H / 2, { size: 24, family: 'Lalezar', color: P.paper });
  numText(fa(S.level + 1) + ' / ' + fa(LEVELS.length), 640, HUD_H / 2, { size: 21, color: P.gold });
  numText(fa(S.score), 300, HUD_H / 2, { size: 20, color: P.paper });
  text('بیشترین ' + fa(S.best), 150, HUD_H / 2, { size: 15, color: 'rgba(251,247,236,.6)' });
  const tot = L().q.length;
  ctx.fillStyle = 'rgba(255,255,255,.14)';
  ctx.beginPath(); rrPath(24, HUD_H - 9, 240, 5, 3); ctx.fill();
  ctx.fillStyle = P.gold;
  ctx.beginPath(); rrPath(24, HUD_H - 9, 240 * (S.done / tot), 5, 3); ctx.fill();
}

function drawTutorial() {
  const st = S.tut.step;
  if (st === 0) {
    spot([{ x: TABLE_CX, y: TABLE_CY, r: 110 }], .72);
    const h = tutCard(360, 480, 500, ['یک مهمان روی میزِ معاینه.'], 'درمانگاهِ جانوران');
    tutMore(610, 480 + h + 8, S.t, P.ink);
  } else if (st === 1) {
    spot([{ x: S.lens.x, y: S.lens.y, r: LENS_R + 20 }], .7);
    const h = tutCard(360, 480, 520,
      ['دستگاهِ عکس را بکش روی جانور', 'تا داخلِ بدنش را ببینی.']);
    tutMore(620, 480 + h + 8, S.t, P.ink);
  } else {
    const r = roomRect(0);
    spot([{ x: r.x, y: r.y, w: r.w, h: r.h }], .7);
    const h = tutCard(360, 480, 520, ['بعد جانور را بکش به اتاقِ درستش.']);
    tutMore(620, 480 + h + 8, S.t, P.ink);
  }
}

function xIcon(x, y) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = P.xray;
  ctx.beginPath(); ctx.arc(0, 0, 34, 0, TAU); ctx.fill();
  ctx.strokeStyle = P.bone; ctx.lineWidth = 3.4;
  ctx.beginPath(); ctx.moveTo(-20, 0); ctx.lineTo(20, 0); ctx.stroke();
  ctx.fillStyle = P.bone;
  for (let k = -20; k <= 20; k += 8) { ctx.beginPath(); ctx.arc(k, 0, 3.6, 0, TAU); ctx.fill(); }
  ctx.strokeStyle = P.steelLt; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(0, 0, 34, 0, TAU); ctx.stroke();
  ctx.restore();
}

function drawIntro() {
  overlay({
    t: S.phaseT, w: 880, h: 306, y: 128,
    paper: P.paper, band: P.accent, ink: P.ink, inkSoft: '#68788a',
    icon: xIcon,
    title: 'درمانگاهِ جانوران',
    body: 'امروز تو دام‌پزشکی. دستگاهِ عکس را روی هر مهمان بکش\nو ببین داخلِ بدنش ستونِ مهره هست یا نه،\nبعد ببرش به اتاقی که به آن می‌خورد.',
    btn: BTN_GO, btnLabel: 'شروع', btnHot: S.hover === BTN_GO,
    btnFill: '#2f7f96', btnHotFill: '#4fa3b8',
  });
}

function drawWon() {
  overlay({
    t: S.phaseT, w: 840, h: 300, y: 140,
    paper: P.paper, band: P.gold, ink: P.ink, inkSoft: '#68788a',
    icon: xIcon,
    title: 'همه را جا دادی',
    body: 'بعضی جانوران داخلِ بدنشان ستونِ مهره دارند و بعضی ندارند،\nو هرکدام جایی زندگی می‌کنند که نیازشان آنجا برطرف شود.\nامتیازت: ' + fa(S.score),
    btn: BTN_AGAIN, btnLabel: 'از نو', btnHot: S.hover === BTN_AGAIN,
    btnFill: '#2f7f96', btnHotFill: '#4fa3b8',
  });
}

function draw() {
  beginScene(P.wallLo);
  ctx.save();
  if (S.shake > 0) {
    const k = S.shake * 10;
    ctx.translate(Math.sin(S.t * 55) * k, 0);
  }
  const layer = staticLayer('room', SCENE_W, SCENE_H, paintRoomStatic);
  ctx.drawImage(layer, 0, 0, SCENE_W, SCENE_H);
  drawRooms();
  drawTable();
  drawQueue();
  if (S.cur) drawLens();
  if (S.fly) {
    const u = easeOut(S.fly.t);
    body(S.fly.id, lerp(S.fly.x, S.fly.tx, u), lerp(S.fly.y, S.fly.ty, u), lerp(1, .5, u));
  }
  if (S.drag) body(S.drag.id, S.drag.x, S.drag.y, 1);
  bits.draw();
  ctx.restore();
  drawHUD();
  if (!(S.phase === 'play' && S.tut.on)) toast.draw(HUD_H + 178, { good: P.good, bad: P.bad, info: P.card, ink: P.ink });
  if (S.phase === 'play' && S.tut.on) drawTutorial();
  if (S.phase === 'intro') drawIntro();
  if (S.phase === 'won') drawWon();
  if (S.tipT > 0) {
    ctx.save();
    ctx.globalAlpha = clamp(S.tipT, 0, 1);
    const w = 470;
    paper(SCENE_W / 2 - w / 2, 556, w, 42, P.paper, 51, 12, .3);
    text(S.tip, SCENE_W / 2, 577, { size: 16, color: P.ink });
    ctx.restore();
  }
  endScene(.08, 'rgba(4, 12, 20, .42)', 0, .1);
}
