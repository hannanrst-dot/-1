<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1d3320">
<title>دفترِ مزرعه — زنگ علوم (بازی)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>
  /* صفحه نباید هیچ‌جا اسکرول یا زوم شود؛ بازی باید مثل یک برنامه رفتار کند. */
  html, body {
    margin: 0; padding: 0; background: #1d3320;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body {
    position: fixed; inset: 0;          /* جلوی کشیده‌شدنِ صفحه در سافاریِ گوشی */
    width: 100%; height: 100vh; height: 100dvh;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none; -webkit-touch-callout: none;
  }

  /* گوشیِ عمودی صحنه را ریز می‌کند؛ بچه باید گوشی را بچرخاند. */
  #rotate { display: none; }
  @media (orientation: portrait) and (max-width: 860px) {
    #stage { display: none; }
    #rotate {
      display: flex; position: fixed; inset: 0;
      z-index: 9;
      flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      background: #1d3320; color: #f6ead2;
      font: 700 20px "Vazirmatn", Tahoma, sans-serif; text-align: center; padding: 32px;
    }
    #rotate svg { animation: tilt 2.4s ease-in-out infinite; }
    @keyframes tilt { 0%, 45% { transform: rotate(0deg); } 65%, 100% { transform: rotate(-90deg); } }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="rotate">
  <svg width="86" height="126" viewBox="0 0 86 126" fill="none" aria-hidden="true">
    <rect x="3" y="3" width="80" height="120" rx="12" stroke="#e8b448" stroke-width="5"/>
    <rect x="15" y="19" width="56" height="88" rx="5" fill="#e8b448" opacity=".28"/>
    <circle cx="43" cy="115" r="4" fill="#e8b448"/>
  </svg>
  <div>گوشی را بچرخان</div>
  <div style="font-weight:400;opacity:.7;font-size:16px">این بازی خوابیده بازی می‌شود</div>
</div>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   هستهٔ مشترکِ بازی‌ها — سبک «کاغذبُری»
   ───────────────────────────────────────────────────────────────────────
   این فایل جعبه‌ابزار است، نه چارچوب: هر بازی حلقه و وضعیت خودش را دارد
   و فقط از این توابع برای کشیدن استفاده می‌کند. دلیلش این است که هر بازی
   باید حس‌وحال خودش را داشته باشد، نه اینکه همه شبیه هم دربیایند.

   قاعده‌های ثابتِ تصویری:
   • نور همیشه از بالا-چپ می‌تابد، پس سایه‌ها به پایین-راست می‌افتند.
   • هیچ لبه‌ای کاملاً صاف نیست؛ همه کمی موج دارند (انگار با قیچی بریده).
   • هیچ خاکستریِ خالصی نداریم؛ همه‌ی خنثی‌ها به گرمیِ صحنه می‌زنند.
   • یک لایه‌ی دانه‌دانه‌ی کاغذ روی کلِ تصویر ضرب می‌شود.
   ═══════════════════════════════════════════════════════════════════════ */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const FA_D = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
const fa = (n) => String(n).replace(/\d/g, (d) => FA_D[+d]);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeIn = (t) => t * t * t;
const easeInOut = (t) => (t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2);
const easeBack = (t) => 1 + 2.7 * Math.pow(t-1, 3) + 1.7 * Math.pow(t-1, 2);
const easeElastic = (t) => t === 0 || t === 1 ? t : Math.pow(2, -9*t) * Math.sin((t*10 - .75) * 2.094) + 1;

/** تصادفِ تکرارپذیر: با یک بذر همیشه همان عدد. برای اینکه تزئین‌ها هر فریم نپرند. */
function noise1(x) {
  const s = Math.sin(x * 127.1) * 43758.5453;
  return s - Math.floor(s);
}
const pick = (arr, seed) => arr[Math.floor(noise1(seed) * arr.length) % arr.length];

/* ───────── بوم و صحنهٔ ثابت ───────── */

let ctx, SW, SH, CV, _refit = null;
let view = { scale: 1, ox: 0, oy: 0, w: 0, h: 0, dpr: 1 };
let _grain = null;

function initStage(canvas, w, h) {
  CV = canvas; SW = w; SH = h;
  ctx = canvas.getContext('2d');

  /* اندازه را از خودِ بوم می‌گیریم نه از innerHeight؛ چون در سافاریِ گوشی
     نوارِ آدرس باز و بسته می‌شود و innerHeight دروغ می‌گوید. */
  const fit = () => {
    const r = canvas.getBoundingClientRect();
    const vw = Math.round(r.width), vh = Math.round(r.height);
    if (vw < 20 || vh < 20) return;
    const dpr = Math.min(devicePixelRatio || 1, QUALITY > 0 ? 2 : 1);
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    const scale = Math.min(vw / SW, vh / SH);
    view = { scale, ox: (vw - SW*scale)/2, oy: (vh - SH*scale)/2, w: vw, h: vh, dpr };
    _grain = buildGrain();
  };
  _refit = fit;
  addEventListener('resize', fit);
  /* چرخاندنِ گوشی: اندازهٔ درست چند لحظه بعد می‌رسد، پس چندبار اندازه می‌گیریم. */
  addEventListener('orientationchange', () => {
    fit(); setTimeout(fit, 140); setTimeout(fit, 460);
  });
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(canvas);

  /* صدا در گوشی فقط بعد از اوّلین لمس اجازهٔ پخش دارد. */
  const unlock = () => { sfx._c(); removeEventListener('pointerdown', unlock); removeEventListener('touchstart', unlock); };
  addEventListener('pointerdown', unlock, { passive: true });
  addEventListener('touchstart', unlock, { passive: true });
  /* نگه‌داشتنِ انگشت نباید منوی مرورگر را باز کند. */
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  fit();
  return ctx;
}

/** قابِ صحنه را باز می‌کند: بعد از این، مختصات همیشه در فضای SW×SH است. */
function beginScene(bg) {
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, view.w, view.h);
  ctx.save();
  ctx.translate(view.ox, view.oy);
  ctx.scale(view.scale, view.scale);
  ctx.beginPath();
  ctx.rect(0, 0, SW, SH);
  ctx.clip();
}

/** بافتِ کاغذ، تیرگیِ گوشه‌ها، رنگ‌بندی و درخششِ نور را می‌گذارد و قاب را می‌بندد. */
function endScene(grainAlpha = .15, vignette = 'rgba(48,28,14,.30)', bloom = .34, grade = .14) {
  if (QUALITY < 1) { grade = 0; grainAlpha *= .5; }
  if (QUALITY < 2) bloom = 0;
  if (grade > 0) {
    /* رنگ‌بندیِ نرم: بالای صحنه گرم‌تر، پایین سردتر — عمق می‌دهد */
    const g = ctx.createLinearGradient(0, 0, 0, SH);
    g.addColorStop(0, `rgba(255, 214, 150, ${grade})`);
    g.addColorStop(.55, 'rgba(255, 255, 255, 0)');
    g.addColorStop(1, `rgba(40, 60, 110, ${grade * .9})`);
    ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalCompositeOperation = 'source-over';
  }
  if (_grain && grainAlpha > 0) {
    ctx.globalCompositeOperation = 'multiply';
    ctx.globalAlpha = grainAlpha;
    ctx.fillStyle = _grain;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
  if (vignette) {
    const g = ctx.createRadialGradient(SW/2, SH/2, SH*.42, SW/2, SH/2, SH*1.05);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, vignette);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
  }
  ctx.restore();
  bloomPass(bloom);
}

/* ───────── درخششِ نور (bloom) ─────────
   قابِ رسم‌شده را کوچک می‌کنیم، دو بار در خودش ضرب می‌کنیم تا فقط
   روشن‌ها بمانند، محوش می‌کنیم و با حالتِ «lighter» رویش می‌گذاریم.
   نتیجه: چراغ‌ها، شعله‌ها و رنگ‌های روشن نور پخش می‌کنند. */
let _bl, _blc, _bl2, _bl2c, _blNo = false, _blTick = 0;

function bloomPass(amount) {
  if (!amount || _blNo || !CV.width) return;
  /* کوچک‌کردن و بزرگ‌کردنِ دوباره، خودش محو می‌کند — از filter خیلی ارزان‌تر است */
  const W = Math.max(4, Math.round(CV.width * .2)), H = Math.max(4, Math.round(CV.height * .2));
  const W2 = Math.max(2, Math.round(W * .28)), H2 = Math.max(2, Math.round(H * .28));
  try {
    if (!_bl) {
      _bl = document.createElement('canvas'); _blc = _bl.getContext('2d');
      _bl2 = document.createElement('canvas'); _bl2c = _bl2.getContext('2d');
      if (!_blc || !_bl2c) { _blNo = true; return; }
    }
    if (_bl.width !== W || _bl.height !== H) { _bl.width = W; _bl.height = H; }
    if (_bl2.width !== W2 || _bl2.height !== H2) { _bl2.width = W2; _bl2.height = H2; }
    /* ساختنِ نور یک قاب در میان کافی است؛ گذاشتنش هر قاب. */
    _blTick = (_blTick + 1) & 1;
    if (!_blTick) {
      _blc.globalCompositeOperation = 'source-over';
      _blc.clearRect(0, 0, W, H);
      _blc.drawImage(CV, 0, 0, W, H);
      _blc.globalCompositeOperation = 'multiply';
      _blc.drawImage(_bl, 0, 0);
      _blc.drawImage(_bl, 0, 0);
      _blc.globalCompositeOperation = 'source-over';
      _bl2c.clearRect(0, 0, W2, H2);
      _bl2c.drawImage(_bl, 0, 0, W2, H2);
    }

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = amount;
    ctx.drawImage(_bl2, 0, 0, CV.width, CV.height);
    ctx.restore();
  } catch (e) { _blNo = true; }
}

/* ───────── لایهٔ ثابت ─────────
   هرچه در صحنه تکان نمی‌خورد را یک‌بار می‌کشیم و بعد فقط کپی می‌کنیم. */
const _layers = {};
function staticLayer(key, w, h, paint) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const L = _layers[key];
  if (L && L.q === q && L.w === w && L.h === h) return L.cv;
  const off = document.createElement('canvas');
  off.width = Math.max(1, Math.round(w * q));
  off.height = Math.max(1, Math.round(h * q));
  const c = off.getContext('2d');
  c.setTransform(q, 0, 0, q, 0, 0);
  const prev = ctx;
  ctx = c;
  try { paint(); } finally { ctx = prev; }
  _layers[key] = { cv: off, q, w, h };
  return off;
}

/* ───────── نورپردازی و بافت ─────────
   کارِ این‌ها این است که هیچ سطحی «تختِ یک‌رنگ» نماند. */

/** شیبِ عمودی: بالا روشن، پایین تیره. */
function vgrad(y0, y1, top, bot) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, top); g.addColorStop(1, bot);
  return g;
}

/** حجمِ کروی: نور از بالا-چپ، سایه در پایین-راست. */
function ball(cx, cy, r, lit, base, dark) {
  const g = ctx.createRadialGradient(cx - r * .38, cy - r * .42, r * .06, cx, cy, r * 1.06);
  g.addColorStop(0, lit); g.addColorStop(.45, base); g.addColorStop(1, dark);
  return g;
}

/** لبهٔ روشنِ بالا-چپِ یک مسیر — همان «rim light». */
function rim(pathFn, col, w = 2.2) {
  ctx.save();
  ctx.beginPath(); pathFn();
  ctx.clip();
  ctx.beginPath(); pathFn();
  ctx.strokeStyle = col; ctx.lineWidth = w * 2; ctx.lineJoin = 'round';
  ctx.translate(-w * .5, -w * .6);
  ctx.stroke();
  ctx.restore();
}

/** سایهٔ چسبیده به زمین — چیزها را روی سطح می‌نشاند. */
function contact(cx, cy, rx, ry, alpha = .26) {
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
  g.addColorStop(0, `rgba(20, 12, 6, ${alpha})`);
  g.addColorStop(1, 'rgba(20, 12, 6, 0)');
  ctx.save();
  ctx.fillStyle = g;
  ctx.translate(cx, cy); ctx.scale(1, ry / Math.max(rx, ry));
  ctx.beginPath(); ctx.arc(0, 0, Math.max(rx, ry), 0, TAU); ctx.fill();
  ctx.restore();
}

const _tex = {};
/** بافتِ تکرارشونده؛ یک‌بار ساخته و بعد از حافظه خوانده می‌شود. */
function texture(key, w, h, paint) {
  if (_tex[key]) return _tex[key];
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const c = off.getContext('2d');
  paint(c, w, h);
  _tex[key] = ctx.createPattern(off, 'repeat');
  return _tex[key];
}

/** رگهٔ چوب. */
function texWood(base, grain) {
  return texture('w' + base + grain, 120, 120, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = grain; c.lineWidth = 1.4;
    for (let i = 0; i < 9; i++) {
      c.globalAlpha = .18 + noise1(i * 3.1) * .3;
      c.beginPath();
      const y0 = i * 14 + noise1(i) * 6;
      c.moveTo(0, y0);
      for (let x = 0; x <= w; x += 10) c.lineTo(x, y0 + Math.sin(x * .09 + i) * 2.6);
      c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** تارِ پارچه. */
function texCloth(base, thread) {
  return texture('c' + base + thread, 16, 16, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = thread; c.lineWidth = 1; c.globalAlpha = .5;
    for (let i = 0; i < w; i += 4) {
      c.beginPath(); c.moveTo(i, 0); c.lineTo(i, h); c.stroke();
      c.beginPath(); c.moveTo(0, i); c.lineTo(w, i); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** دانه‌های سنگ. */
function texStone(base, spec) {
  return texture('s' + base + spec, 90, 90, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) {
      c.globalAlpha = .05 + noise1(i * 1.7) * .16;
      c.fillStyle = spec;
      const r = .6 + noise1(i * 5.3) * 1.9;
      c.beginPath();
      c.arc(noise1(i * 2.1) * w, noise1(i * 3.7 + 1) * h, r, 0, TAU);
      c.fill();
    }
    c.globalAlpha = 1;
  });
}

/** الیافِ کاغذ. */
function texPaper(base) {
  return texture('p' + base, 100, 100, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 130; i++) {
      c.globalAlpha = .04 + noise1(i * 2.3) * .07;
      c.strokeStyle = i % 2 ? '#ffffff' : '#5a4326';
      c.lineWidth = .9;
      const x = noise1(i * 1.3) * w, y = noise1(i * 4.1 + 2) * h;
      const a = noise1(i * 7.7) * TAU, l = 4 + noise1(i * 9.1) * 12;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

function buildGrain() {
  const s = 260;
  const off = document.createElement('canvas');
  off.width = off.height = s;
  const c = off.getContext('2d');
  const img = c.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    const v = 214 + Math.random() * 41;
    img.data[i*4] = v; img.data[i*4+1] = v; img.data[i*4+2] = v; img.data[i*4+3] = 255;
  }
  c.putImageData(img, 0, 0);
  return ctx.createPattern(off, 'repeat');
}

function toStage(e) {
  const r = CV.getBoundingClientRect();
  return {
    x: (e.clientX - r.left - view.ox) / view.scale,
    y: (e.clientY - r.top - view.oy) / view.scale,
  };
}

const inRect = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
const inCircle = (p, b, pad = 0) => Math.hypot(p.x - b.x, p.y - b.y) <= b.r + pad;

/* ───────── قلم‌های کاغذبُری ───────── */

/** دایره‌ای که انگار با قیچی بریده شده. */
function wobbleCircle(cx, cy, r, seed = 0, amp = 2.2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const rr = r + Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp * .45;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** بیضیِ ناصاف — برای چیزهایی که گرد نیستند ولی نرم‌اند. */
function wobbleEllipse(cx, cy, rx, ry, rot = 0, seed = 0, amp = 2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const w = 1 + (Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp*.45) / Math.max(rx, ry);
    const px = Math.cos(a) * rx * w, py = Math.sin(a) * ry * w;
    const x = cx + px*Math.cos(rot) - py*Math.sin(rot);
    const y = cy + px*Math.sin(rot) + py*Math.cos(rot);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** مستطیلِ گِرد با گوشه‌های کمی کج. */
function wobbleRect(x, y, w, h, r = 12, seed = 0, amp = 1.6) {
  const j = (k) => (noise1(seed*9.7 + k) - .5) * amp * 2;
  ctx.beginPath();
  ctx.moveTo(x + r + j(1), y + j(2));
  ctx.lineTo(x + w - r + j(3), y + j(4));
  ctx.quadraticCurveTo(x + w + j(5), y + j(6), x + w + j(7), y + r + j(8));
  ctx.lineTo(x + w + j(9), y + h - r + j(10));
  ctx.quadraticCurveTo(x + w + j(11), y + h + j(12), x + w - r + j(13), y + h + j(14));
  ctx.lineTo(x + r + j(15), y + h + j(16));
  ctx.quadraticCurveTo(x + j(17), y + h + j(18), x + j(19), y + h - r + j(20));
  ctx.lineTo(x + j(21), y + r + j(22));
  ctx.quadraticCurveTo(x + j(23), y + j(24), x + r + j(1), y + j(2));
  ctx.closePath();
}

/** سایهٔ نرم؛ نور از بالا-چپ. */
function withShadow(blur, dy, alpha, fn, hue = '78, 46, 24') {
  ctx.save();
  ctx.shadowColor = `rgba(${hue}, ${alpha})`;
  ctx.shadowBlur = blur;
  ctx.shadowOffsetY = dy;
  ctx.shadowOffsetX = dy * .35;
  fn();
  ctx.restore();
}

/** یک برگه‌ی کاغذ با سایه — پایه‌ی همه‌ی کارت‌ها و تابلوها. */
function paper(x, y, w, h, fill, seed = 1, r = 12, shadow = .26) {
  withShadow(16, 7, shadow, () => {
    ctx.fillStyle = fill;
    wobbleRect(x, y, w, h, r, seed, 2);
    ctx.fill();
  });
  /* الیافِ کاغذ و لبهٔ روشن، تا سطح تخت نماند */
  ctx.save();
  ctx.beginPath(); wobbleRect(x, y, w, h, r, seed, 2); ctx.clip();
  ctx.globalAlpha = .5;
  ctx.fillStyle = texPaper(fill);
  ctx.fillRect(x, y, w, h);
  ctx.globalAlpha = 1;
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.4, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(90,60,20,.1)');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
}

function text(str, x, y, o = {}) {
  const size = o.size || 20;
  const fam = o.family || 'Vazirmatn';
  ctx.save();
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.font = `${fam === 'Lalezar' ? '400' : (o.weight || 700)} ${size}px "${fam}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.baseline || 'middle';
  ctx.fillStyle = o.color || '#43291b';
  ctx.direction = 'rtl';
  if (o.stroke) {
    ctx.lineWidth = o.strokeWidth || 5;
    ctx.strokeStyle = o.stroke;
    ctx.lineJoin = 'round';
    ctx.strokeText(str, x, y, o.maxWidth);
  }
  ctx.fillText(str, x, y, o.maxWidth);
  ctx.restore();
}

/** متنِ چندخطی که خودش می‌شکند. ارتفاعِ اشغال‌شده را برمی‌گرداند. */
function textWrap(str, x, y, maxW, o = {}) {
  const size = o.size || 19, lh = o.lineHeight || size * 1.7;
  ctx.font = `${o.weight || 700} ${size}px "${o.family || 'Vazirmatn'}", Tahoma, sans-serif`;
  const lines = [];
  for (const para of str.split('\n')) {
    let line = '';
    for (const wd of para.split(' ')) {
      const t = line ? line + ' ' + wd : wd;
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = wd; }
      else line = t;
    }
    lines.push(line);
  }
  lines.forEach((l, i) => text(l, x, y + i * lh, o));
  return lines.length * lh;
}

/* ───────── ذره‌ها ───────── */

class Bits {
  constructor() { this.list = []; }
  add(x, y, n, kind, colors, opts = {}) {
    for (let i = 0; i < n; i++) {
      const a = opts.dir !== undefined ? opts.dir + (Math.random()-.5) * (opts.spread || 1) : Math.random() * TAU;
      const sp = (opts.speed || 200) * (.4 + Math.random());
      this.list.push({
        kind, x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - (opts.lift || 0),
        r: (opts.size || 4) * (.5 + Math.random()),
        rot: Math.random() * TAU, vr: (Math.random()-.5) * 10,
        col: colors[(Math.random() * colors.length) | 0],
        grav: opts.grav === undefined ? 620 : opts.grav,
        drag: opts.drag || .995,
        life: (opts.life || .9) * (.6 + Math.random() * .8), age: 0,
      });
    }
  }
  confetti(x, y, n, colors) {
    this.add(x, y, n, 'flake', colors, { speed: 420, lift: 190, size: 5, life: 1.6, grav: 780 });
  }
  spark(x, y, n, colors) {
    this.add(x, y, n, 'dot', colors, { speed: 180, lift: 30, size: 3.4, life: .7, grav: 260, drag: .93 });
  }
  step(dt) {
    for (const p of this.list) {
      p.age += dt;
      p.vy += p.grav * dt;
      p.vx *= p.drag; p.vy *= p.drag;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    }
    this.list = this.list.filter((p) => p.age < p.life);
  }
  draw() {
    for (const p of this.list) {
      const k = clamp(1 - p.age / p.life, 0, 1);
      ctx.save();
      ctx.globalAlpha = k;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.col;
      if (p.kind === 'flake') ctx.fillRect(-p.r, -p.r*1.5, p.r*2, p.r*3);
      else if (p.kind === 'leaf') { wobbleEllipse(0, 0, p.r*1.8, p.r*.8, 0, p.r, .6); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(0, 0, p.r * k, 0, TAU); ctx.fill(); }
      ctx.restore();
    }
  }
  clear() { this.list.length = 0; }
}

const sfx = {
  ac: null, on: true,
  _c() {
    if (!this.on) return null;
    if (!this.ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; this.ac = new A(); }
    if (this.ac.state === 'suspended') this.ac.resume();
    return this.ac;
  },
  tone(f, dur = .16, type = 'sine', gain = .13, delay = 0) {
    const c = this._c(); if (!c) return;
    const t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(t0 + dur + .04);
  },
  tap()  { this.tone(430, .07, 'triangle', .09); },
  place(){ this.tone(620, .11, 'sine', .12); },
  pop()  { this.tone(760, .09, 'sine', .11); },
  slide(){ this.tone(240, .22, 'sine', .07); },
  good() { [523, 659, 784].forEach((f,i) => this.tone(f, .22, 'sine', .13, i*.07)); },
  win()  { [523, 659, 784, 1047].forEach((f,i) => this.tone(f, .34, 'triangle', .13, i*.10)); },
  nope() { this.tone(180, .2, 'sawtooth', .07); },
  tick() { this.tone(1100, .04, 'square', .05); },
};

/* ───────── قطعه‌های آماده ───────── */

function star(x, y, r, col, rot = 0) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = col;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI/2 + i * Math.PI/5;
    const rr = i % 2 ? r * .45 : r;
    const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/** دکمهٔ کاغذی. hovered را خودِ بازی می‌دهد؛ اینجا فقط کشیده می‌شود. */
/** رنگ را روشن‌تر (k>0) یا تیره‌تر (k<0) می‌کند. */
function shade(col, k) {
  const c = String(col).trim();
  let r, g2, b2;
  if (c[0] === '#') {
    const h = c.length === 4 ? c[1]+c[1]+c[2]+c[2]+c[3]+c[3] : c.slice(1, 7);
    r = parseInt(h.slice(0,2), 16); g2 = parseInt(h.slice(2,4), 16); b2 = parseInt(h.slice(4,6), 16);
  } else {
    const m = c.match(/[\d.]+/g);
    if (!m || m.length < 3) return col;
    r = +m[0]; g2 = +m[1]; b2 = +m[2];
  }
  const f = (v) => Math.round(clamp(k < 0 ? v * (1 + k) : v + (255 - v) * k, 0, 255));
  return 'rgb(' + f(r) + ',' + f(g2) + ',' + f(b2) + ')';
}

function button(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 3 : 0;
  const fill = o.disabled ? (o.off || '#bcaa92') : (hot ? (o.hotFill || o.fill) : o.fill);
  const r = o.r === undefined ? 14 : o.r;
  /* لبهٔ زیرینِ تیره — دکمه از صفحه بیرون می‌زند */
  ctx.fillStyle = shade(fill, -.36);
  wobbleRect(b.x, b.y + dy + 7, b.w, b.h, r, b.x + b.y, 2);
  ctx.fill();
  withShadow(hot ? 22 : 14, hot ? 5 : 8, .32, () => {
    ctx.fillStyle = fill;
    wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2);
    ctx.fill();
  });
  /* حجم: روشن از بالا، تیره به پایین */
  ctx.save();
  ctx.beginPath(); wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2); ctx.clip();
  const g = ctx.createLinearGradient(0, b.y + dy, 0, b.y + dy + b.h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.45, 'rgba(255,255,255,.04)');
  g.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = g;
  ctx.fillRect(b.x, b.y + dy, b.w, b.h);
  /* برقِ باریکِ لبهٔ بالا */
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.fillRect(b.x + r, b.y + dy + 2, b.w - r * 2, 2);
  ctx.restore();
  text(label, b.x + b.w/2, b.y + b.h/2 + dy - (o.sub ? 9 : 0), {
    size: o.size || 26, color: o.color || '#fdf6e8', family: o.family || 'Lalezar',
  });
  if (o.sub) text(o.sub, b.x + b.w/2, b.y + b.h/2 + dy + 17,
    { size: 14, color: o.subColor || 'rgba(255,255,255,.88)' });
}

/** دکمهٔ گرد کوچک (مثل + و −). */
function roundButton(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 2 : 0;
  withShadow(10, hot ? 3 : 5, .3, () => {
    ctx.fillStyle = o.disabled ? '#cbbba3' : (hot ? (o.hotFill || o.fill) : o.fill);
    wobbleCircle(b.x, b.y + dy, b.r, b.x, 1.4);
    ctx.fill();
  });
  text(label, b.x, b.y + dy - 1,
    { size: o.size || 32, color: o.disabled ? '#a8988a' : (o.color || '#fdf6e8'), family: 'Lalezar' });
}

/** پرده‌ی تمام‌صفحه: برای شروعِ پرده و برای جشنِ پایان. */
function overlay(o) {
  const k = easeOut(clamp(o.t / .5, 0, 1));
  ctx.fillStyle = `rgba(30, 22, 16, ${.66 * k})`;
  ctx.fillRect(0, 0, SW, SH);

  const w = o.w || 700, h = o.h || 290;
  const x = (SW - w) / 2, y = o.y || (SH * .22);
  const s = lerp(.9, 1, easeBack(clamp(o.t / .65, 0, 1)));
  ctx.save();
  ctx.translate(SW/2, y + h/2);
  ctx.scale(s, s);
  ctx.translate(-SW/2, -(y + h/2));

  withShadow(30, 14, .42, () => {
    ctx.fillStyle = o.paper || '#fbf3e2';
    wobbleRect(x, y, w, h, 18, 121, 2.4);
    ctx.fill();
  });
  ctx.fillStyle = o.band || '#c8434f';
  wobbleRect(x, y, w, 12, 6, 123, 1);
  ctx.fill();

  if (o.icon) o.icon(SW/2, y + 56);
  text(o.title, SW/2, y + (o.icon ? 108 : 62),
    { size: o.titleSize || 36, color: o.ink || '#43291b', family: 'Lalezar', alpha: k });
  textWrap(o.body, SW/2, y + (o.icon ? 158 : 116), w - 90,
    { size: 19, color: o.inkSoft || '#8a6a52', alpha: k });
  ctx.restore();

  button(o.btn, o.btnLabel, { hot: o.btnHot, fill: o.btnFill || '#7fa356', hotFill: o.btnHotFill || '#8fb45f', size: 28 });
}

/** پیامِ کوتاهِ بالای صحنه. */
class Toast {
  constructor() { this.msg = null; this.t = 0; this.kind = 'info'; }
  say(msg, kind = 'info') { this.msg = msg; this.kind = kind; this.t = 2.6; }
  step(dt) { if (this.t > 0) { this.t -= dt; if (this.t <= 0) this.msg = null; } }
  draw(y = 24, colors = {}) {
    if (!this.msg) return;
    const k = clamp(this.t, 0, 1) * clamp((2.6 - this.t) * 5, 0, 1);
    ctx.save();
    ctx.globalAlpha = k;
    ctx.font = `700 19px "Vazirmatn", Tahoma, sans-serif`;
    const w = ctx.measureText(this.msg).width + 76;
    const fill = this.kind === 'good' ? (colors.good || '#7fa356')
               : this.kind === 'bad' ? (colors.bad || '#c8434f')
               : (colors.info || '#fbf3e2');
    paper(SW/2 - w/2, y, w, 48, fill, 151, 12, .3);
    text(this.msg, SW/2, y + 25,
      { size: 19, color: this.kind === 'info' ? (colors.ink || '#43291b') : '#fff8ec' });
    ctx.restore();
  }
}

/* ───────── آموزشِ پرده‌ای ─────────
   پرده‌هایی که منتظرِ کارِ بچه نیستند با یک ضربه جلو می‌روند. تایمر فقط
   پشتیبان است؛ بچهٔ کلاس سومی باید فرصتِ خواندن داشته باشد، نه اینکه
   متن قبل از تمام شدنِ خواندنش برود.                                    */

/** اگر پردهٔ فعلی خواندنی است، ضربه را می‌خورد و می‌رود پردهٔ بعد. */
function tutTap(tut, tapSteps, lastStep) {
  if (!tut.on || tapSteps.indexOf(tut.step) < 0) return false;
  if (tut.step >= lastStep) tut.on = false;
  else { tut.step++; tut.t = 0; }
  sfx.tap();
  return true;
}

/** نشانهٔ «برای ادامه بزن» — زیرِ کارتِ آموزش. */
function tutMore(cx, y, t, ink = '#3a2a18', bg = 'rgba(255, 250, 238, .94)') {
  ctx.save();
  ctx.globalAlpha = .62 + .38 * Math.sin(t * 3.2);
  ctx.font = '700 15px "Vazirmatn", Tahoma, sans-serif';
  const label = 'برای ادامه، هرجا را بزن';
  const w = ctx.measureText(label).width + 40, h = 32, x = cx - w / 2, r = 16;
  withShadow(10, 4, .3, () => {
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath(); ctx.fill();
  });
  text(label, cx, y + h / 2, { size: 15, color: ink });
  ctx.restore();
}

/** فونت‌ها را می‌آورد و بعد بازی را شروع می‌کند. */
function whenFontsReady(start) {
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('400 40px Lalezar'),
      document.fonts.load('700 20px Vazirmatn'),
      document.fonts.load('900 20px Vazirmatn'),
    ]).then(start, start);
    setTimeout(start, 2600);
  } else start();
}

/** حلقهٔ فریم با dtِ محدودشده. */
/* ───────── کیفیتِ خودکار ─────────
   اگر دستگاه کُند بود، اوّل درخشش و بعد رنگ‌بندی خاموش می‌شود تا بازی
   روان بماند. روی دستگاهِ قوی همه‌چیز روشن است. */
let QUALITY = 2;
let _fAcc = 0, _fN = 0, _qHold = 0;

function _qualityTick(gap) {
  if (gap <= 0 || gap > 200) return;
  _fAcc += gap; _fN++;
  if (_fN < 45) return;
  const avg = _fAcc / _fN;
  _fAcc = 0; _fN = 0;
  if (_qHold > 0) { _qHold--; return; }
  const before = QUALITY;
  if (avg > 25 && QUALITY > 0) { QUALITY--; _qHold = 3; }
  else if (avg < 18.5 && QUALITY < 2) { QUALITY++; _qHold = 6; }
  /* در پایین‌ترین کیفیت، صحنه را با نقطه‌های کمتر می‌کشیم */
  if (before !== QUALITY && (before === 0 || QUALITY === 0) && _refit) _refit();
}

function runLoop(step) {
  let last = performance.now(), started = false;
  const frame = (now) => {
    const gap = now - last;
    const dt = Math.min(gap / 1000, 1/20);
    last = now;
    _qualityTick(gap);
    step(dt);
    requestAnimationFrame(frame);
  };
  if (!started) { started = true; requestAnimationFrame(frame); }
}

  score: 0, best: 0, combo: 0,
  done: 0, doneT: 0, seed: 1,
  t: 0, phaseT: 0, hover: null, shake: 0,
  tut: { on: true, step: 0, t: 0 },
};

const bits = new Bits();
const toast = new Toast();
const L = () => LEVELS[S.level];
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

function loadBest() { try { return +localStorage.getItem('mazrae-best') || 0; } catch { return 0; } }
function saveBest(v) { try { localStorage.setItem('mazrae-best', String(v)); } catch { /* حالتِ خصوصی */ } }

const cv = document.getElementById('stage');
initStage(cv, SCENE_W, SCENE_H);
S.best = loadBest();

/* ───────── دورِ تازه ───────── */

function newRound() {
  const lv = L();
  const kinds = [0, 1, 2, 3, 4];
  for (let i = kinds.length - 1; i > 0; i--) { const j = R(0, i); const t = kinds[i]; kinds[i] = kinds[j]; kinds[j] = t; }
  const use = kinds.slice(0, lv.bugs);
  S.bugs = [];
  for (const k of use) {
    let x, y, ok = false, guard = 0;
    while (!ok && guard++ < 200) {
      x = R(90, FIELD.w - 90);
      y = R(FIELD.y + 90, SCENE_H - 90);
      ok = S.bugs.every((b) => Math.hypot(b.x - x, b.y - y) > 190);
    }
    S.bugs.push({ k, x, y, a: Math.random() * TAU, seen: false, rec: null,
                  wob: Math.random() * 6, sp: .12 + Math.random() * .2 });
  }
  S.stage = 'look';
  S.card = -1; S.draft = [0, 0, 0]; S.wrong = 0;
  S.riddle = null; S.rIdx = 0; S.rTotal = lv.riddles;
  S.flash = 0; S.flashRow = -1;
  S.done = 0; S.doneT = 0;
  S.seed = R(1, 9999);
}

function startLevel(i, keep) {
  const lv = LEVELS[i];
  S.level = i;
  S.cleared = 0;
  S.quota = lv.endless ? Infinity : lv.quota;
  S.combo = 0;
  S.timeLeft = lv.time;
  if (!keep) { S.score = 0; S.lamps = 3; }
  S.phase = 'play'; S.phaseT = 0;
  S.tut.on = i === 0 && !keep; S.tut.step = 0; S.tut.t = 0;
  newRound();
  toast.say(lv.hint, 'info');
}

/* ───────── حلقه ───────── */

newRound();
whenFontsReady(() => runLoop(step));

const recorded = () => S.bugs.filter((b) => b.rec).length;

function step(dt) {
  S.t += dt; S.phaseT += dt;
  if (S.shake > 0) S.shake -= dt;
  if (S.wrong > 0) S.wrong -= dt;
  if (S.flash > 0) { S.flash -= dt; if (S.flash <= 0) S.flashRow = -1; }
  for (const b of S.bugs) {
    if (S.card >= 0) continue;
    b.wob += dt * b.sp * 3;
    b.a += Math.sin(b.wob) * dt * .5;
    const nx = b.x + Math.cos(b.a) * b.sp * 26 * dt;
    const ny = b.y + Math.sin(b.a) * b.sp * 26 * dt;
    if (nx > 60 && nx < FIELD.w - 60) b.x = nx; else b.a = Math.PI - b.a;
    if (ny > FIELD.y + 60 && ny < SCENE_H - 60) b.y = ny; else b.a = -b.a;
  }

  if (S.phase === 'play') {
    const frozen = S.tut.on && S.tut.step < 2;
    if (!frozen && !S.done) {
      S.timeLeft -= dt;
      if (S.timeLeft <= 0) { S.timeLeft = 0; loseLamp('آفتاب غروب کرد!'); }
    }
    if (S.done) { S.doneT += dt; if (S.doneT > 2.4) { newRound(); S.timeLeft = L().time; } }
    if (S.tut.on) S.tut.t += dt;
  }
  bits.step(dt);
  toast.step(dt);
  draw();
}

function loseLamp(msg) {
  if (S.done) return;
  S.lamps--;
  S.combo = 0;
  S.shake = .5;
  S.card = -1;
  sfx.nope();
  toast.say(msg, 'bad');
  if (S.lamps <= 0) { S.phase = 'lost'; S.phaseT = 0; return; }
  S.timeLeft = L().time;
  newRound();
}

/** ثبتِ شمارش در دفتر. */
function record() {
  const b = S.bugs[S.card];
  if (!b) return;
  const k = BUG[b.k];
  if (S.draft[0] !== k.legs || S.draft[1] !== k.wings || S.draft[2] !== k.ant) {
    S.wrong = 1; S.shake = .12;
    sfx.nope();
    toast.say('دوباره خوب بشمار.', 'bad');
    return;
  }
  b.rec = S.draft.slice();
  S.card = -1;
  sfx.place();
  bits.add(b.x, b.y, 12, 'dot', [P.brassLt, P.card], { speed: 140, lift: 50, size: 3, life: .5, grav: 280 });
  S.score += 90;
  if (S.tut.on && S.tut.step === 1) { S.tut.step = 2; S.tut.t = 0; }
  if (recorded() === S.bugs.length) {
    S.stage = 'riddle';
    askRiddle();
    sfx.good();
    toast.say('دفتر پُر شد. حالا کارتِ معمّا.', 'good');
  }
}

function askRiddle() {
  const pool = S.bugs.map((b, i) => i);
  const prev = S.riddle ? S.riddle.i : -1;
  let i = pool[R(0, pool.length - 1)];
  let g = 0;
  while (i === prev && pool.length > 1 && g++ < 8) i = pool[R(0, pool.length - 1)];
  S.riddle = { i };
}

function answer(row) {
  if (S.stage !== 'riddle' || !S.riddle || S.done) return;
  if (row === S.riddle.i) {
    S.flash = 1; S.flashRow = row;
    sfx.good();
    S.score += 180;
    S.rIdx++;
    if (S.rIdx >= S.rTotal) finish();
    else { askRiddle(); toast.say('درست بود! معمّای بعد.', 'good'); }
  } else {
    S.flash = 1; S.flashRow = row;
    S.shake = .16;
    sfx.nope();
    S.timeLeft = Math.max(5, S.timeLeft - 5);
    toast.say('نشانه‌ها را با جدول جور کن.', 'bad');
  }
}

function finish() {
  S.done = .001; S.doneT = 0;
  S.combo++;
  S.cleared++;
  S.score += 300 + Math.round(S.timeLeft * 3) + Math.min(S.combo, 6) * 70;
  if (S.score > S.best) { S.best = S.score; saveBest(S.best); }
  bits.confetti(FIELD.w / 2, 340, 46, [P.gold, P.brassLt, P.grassLt, '#fff']);
  sfx.win();
  toast.say('دفترِ مزرعه کامل شد!', 'good');
  if (S.tut.on) S.tut.on = false;
  if (!L().endless && S.cleared >= S.quota) { S.score += 700; S.phase = 'won'; S.phaseT = 0; }
}

/* ───────── ورودی ───────── */

const TUT_TAP = [0, 2], TUT_LAST = 2;

const CARD = { x: 232, y: 140, w: 420, h: 508 };
function stepBtn(i, plus) {
  return { x: CARD.x + (plus ? CARD.w - 96 : 40), y: CARD.y + 138 + i * 88, w: 56, h: 56 };
}
const CARD_OK = { x: CARD.x + 96, y: CARD.y + 404, w: 228, h: 60 };
function noteRow(i) {
  return { x: NOTE.x + 14, y: NOTE.y + 96 + i * 96, w: NOTE.w - 28, h: 86 };
}
const bugAt = (p) => S.bugs.findIndex((b) => Math.hypot(b.x - p.x, b.y - p.y) < 26);
const underLens = (b) => Math.hypot(b.x - S.lens.x, b.y - S.lens.y) < LENS_R - 16;

cv.addEventListener('pointermove', (e) => {
  const p = toStage(e);
  if (S.phase !== 'play') { S.hover = inRect(p, BTN_GO) ? BTN_GO : null; cv.style.cursor = S.hover ? 'pointer' : 'default'; return; }
  if (p.x < FIELD.w && p.y > FIELD.y) { S.lens.x = p.x; S.lens.y = p.y; S.lensOn = true; }
  else S.lensOn = false;
  S.hover = null;
  if (S.card >= 0) {
    for (let i = 0; i < 3; i++) {
      if (inRect(p, stepBtn(i, false))) S.hover = { k: 'minus', i };
      if (inRect(p, stepBtn(i, true))) S.hover = { k: 'plus', i };
    }
    if (inRect(p, CARD_OK)) S.hover = { k: 'ok' };
  } else if (S.stage === 'riddle') {
    for (let i = 0; i < S.bugs.length; i++) if (inRect(p, noteRow(i))) S.hover = { k: 'row', i };
  }
  cv.style.cursor = S.hover ? 'pointer' : 'default';
});

cv.addEventListener('pointerdown', (e) => {
  const p = toStage(e);
  if (S.phase === 'intro') { startLevel(0); return; }
  if (S.phase === 'won') {
    if (!inRect(p, BTN_GO)) return;
    if (L().endless) startLevel(S.level, true);
    else if (S.level + 1 < LEVELS.length) startLevel(S.level + 1, true);
    else startLevel(0);
    return;
  }
  if (S.phase === 'lost') { if (inRect(p, BTN_GO)) startLevel(S.level); return; }
  if (tutTap(S.tut, TUT_TAP, TUT_LAST)) return;
  if (S.done) return;

  if (S.card >= 0) {
    for (let i = 0; i < 3; i++) {
      if (inRect(p, stepBtn(i, false))) { S.draft[i] = Math.max(0, S.draft[i] - 1); sfx.tap(); return; }
      if (inRect(p, stepBtn(i, true))) { S.draft[i] = Math.min(12, S.draft[i] + 1); sfx.tap(); return; }
    }
    if (inRect(p, CARD_OK)) { record(); return; }
    if (!inRect(p, CARD)) { S.card = -1; sfx.tap(); }
    return;
  }
  if (S.stage === 'riddle') {
    for (let i = 0; i < S.bugs.length; i++) if (inRect(p, noteRow(i))) { answer(i); return; }
  }
  /* برداشتنِ جانور برای ثبت — فقط زیرِ ذرّه‌بین */
  const i = bugAt(p);
  if (i >= 0 && underLens(S.bugs[i]) && !S.bugs[i].rec) {
    S.card = i; S.draft = [0, 0, 0]; S.wrong = 0;
    sfx.pop();
    return;
  }
  if (i >= 0 && !underLens(S.bugs[i])) toast.say('ذرّه‌بین را رویش بگیر.', 'info');
});

/* ───────── ابزارِ نقاشی ───────── */

function rrPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function numText(str, x, y, o = {}) {
  ctx.save();
  ctx.font = `${o.family === 'Vazirmatn' ? (o.weight || 700) : '400'} ${o.size || 20}px "${o.family || 'Lalezar'}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  ctx.direction = 'ltr';
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.fillStyle = o.color || P.ink;
  ctx.fillText(str, x, y);
  ctx.restore();
}

function spot(rects, alpha) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, SCENE_W, SCENE_H);
  for (const r of rects) rrPath(r.x - 12, r.y - 12, r.w + 24, r.h + 24, 22);
  ctx.fillStyle = `rgba(6, 14, 8, ${alpha})`;
  ctx.fill('evenodd');
  ctx.restore();
}

function tutCard(x, y, w, lines, title) {
  const h = 26 + (title ? 44 : 0) + lines.length * 30;
  withShadow(24, 10, .5, () => {
    ctx.fillStyle = 'rgba(255, 252, 240, .97)';
    wobbleRect(x, y, w, h + 20, 16, 101, 2.2); ctx.fill();
  }, '6, 14, 8');
  ctx.fillStyle = P.grassLt;
  wobbleRect(x, y, w, 9, 4, 103, 1); ctx.fill();
  let yy = y + 34;
  if (title) { text(title, x + w / 2, yy + 6, { size: 25, family: 'Lalezar', color: P.ink }); yy += 44; }
  for (const l of lines) { text(l, x + w / 2, yy, { size: 18, color: '#6c7a68' }); yy += 30; }
  return h + 20;
}

/* ───────── جانورها ─────────
   شمارِ پا و بال و شاخک دقیقاً همان چیزی است که کشیده می‌شود؛
   بچّه از روی همین شکل می‌شمارد، پس باید درست باشد.            */

function legPair(x, y, len, ang, col, w) {
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + s * len * .6, y + Math.sin(ang) * len * .5,
                         x + s * len, y + len * .75);
    ctx.stroke();
  }
}

function drawBug(k, sc, t) {
  const b = BUG[k];
  ctx.save();
  ctx.scale(sc, sc);
  if (b.id === 'worm') {
    ctx.strokeStyle = b.d; ctx.lineWidth = 11; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-18, 0);
    for (let i = 0; i <= 8; i++) ctx.lineTo(-18 + i * 4.5, Math.sin(i * .9 + t * 2) * 3.4);
    ctx.stroke();
    ctx.strokeStyle = b.c; ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(-18, 0);
    for (let i = 0; i <= 8; i++) ctx.lineTo(-18 + i * 4.5, Math.sin(i * .9 + t * 2) * 3.4);
    ctx.stroke();
    ctx.strokeStyle = b.d; ctx.lineWidth = 1.6;
    for (let i = 1; i < 8; i++) {
      const x = -18 + i * 4.5, y = Math.sin(i * .9 + t * 2) * 3.4;
      ctx.beginPath(); ctx.moveTo(x, y - 4); ctx.lineTo(x, y + 4); ctx.stroke();
    }
    ctx.restore();
    return;
  }
  const sw = Math.sin(t * 6) * .12;
  /* پاها */
  if (b.legs > 0) {
    const pairs = b.legs / 2;
    for (let i = 0; i < pairs; i++) {
      const px = -8 + i * (16 / Math.max(1, pairs - 1)) * (pairs > 1 ? 1 : 0);
      legPair(px, 2, b.id === 'spider' ? 15 : 11, sw + i, b.d, b.id === 'spider' ? 2 : 1.8);
    }
  }
  /* بال‌ها */
  if (b.wings === 4) {
    for (const s of [-1, 1]) {
      ctx.fillStyle = 'rgba(255, 236, 200, .92)';
      ctx.beginPath(); ctx.ellipse(s * 12, -8, 13, 10, s * (.5 + sw), 0, TAU); ctx.fill();
      ctx.fillStyle = b.c;
      ctx.beginPath(); ctx.ellipse(s * 12, -8, 13, 10, s * (.5 + sw), 0, TAU);
      ctx.globalAlpha = .8; ctx.fill(); ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(255, 240, 210, .95)';
      ctx.beginPath(); ctx.ellipse(s * 10, 7, 9, 7, s * (-.4 + sw), 0, TAU); ctx.fill();
      ctx.fillStyle = b.d;
      ctx.globalAlpha = .55;
      ctx.beginPath(); ctx.ellipse(s * 10, 7, 9, 7, s * (-.4 + sw), 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }
  } else if (b.wings === 2) {
    for (const s of [-1, 1]) {
      ctx.fillStyle = 'rgba(226, 240, 246, .62)';
      ctx.beginPath(); ctx.ellipse(s * 10, -3, 12, 5.5, s * (.35 + sw), 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(120, 150, 165, .7)'; ctx.lineWidth = .9;
      ctx.beginPath(); ctx.ellipse(s * 10, -3, 12, 5.5, s * (.35 + sw), 0, TAU); ctx.stroke();
    }
  }
  /* بدن */
  if (b.id === 'spider') {
    ctx.fillStyle = b.d;
    ctx.beginPath(); ctx.ellipse(3, 0, 11, 9, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = b.c;
    ctx.beginPath(); ctx.ellipse(-8, 0, 6, 5, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#e8e2d0';
    ctx.beginPath(); ctx.arc(-10, -2, 1.6, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(-10, 2, 1.6, 0, TAU); ctx.fill();
  } else if (b.id === 'ant') {
    ctx.fillStyle = b.c;
    ctx.beginPath(); ctx.ellipse(10, 0, 7, 5.5, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 0, 4, 3.6, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-9, 0, 5, 4.4, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = b.d;
    ctx.beginPath(); ctx.ellipse(10, 1.4, 7, 4, 0, 0, TAU); ctx.fill();
  } else {
    ctx.fillStyle = b.d;
    ctx.beginPath(); ctx.ellipse(4, 0, 10, 6, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = b.c;
    ctx.beginPath(); ctx.ellipse(-8, 0, 5.4, 4.8, 0, 0, TAU); ctx.fill();
    if (b.id === 'fly') {
      ctx.fillStyle = '#b03a2a';
      ctx.beginPath(); ctx.ellipse(-10, -1.6, 2.6, 2.2, 0, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(-10, 2, 2.6, 2.2, 0, 0, TAU); ctx.fill();
    }
  }
  /* شاخک‌ها */
  if (b.ant > 0) {
    ctx.strokeStyle = b.d; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(-11, s * 2);
      ctx.quadraticCurveTo(-20, s * 6 + sw * 6, -25, s * 11);
      ctx.stroke();
      if (b.id === 'butter') { ctx.fillStyle = b.d; ctx.beginPath(); ctx.arc(-25, s * 11, 2.2, 0, TAU); ctx.fill(); }
    }
  }
  ctx.restore();
}

/* ───────── پس‌زمینهٔ ثابت ───────── */

function paintFieldStatic() {
  const g = ctx.createLinearGradient(0, HUD_H, 0, SCENE_H);
  g.addColorStop(0, P.sky); g.addColorStop(.3, P.grass); g.addColorStop(1, P.grassDk);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, SCENE_W, SCENE_H);
  /* خاکِ زیرِ علف */
  ctx.save();
  ctx.globalAlpha = .35;
  ctx.fillStyle = texStone(P.soil, '#6b4d2c');
  ctx.fillRect(0, HUD_H, FIELD.w, SCENE_H - HUD_H);
  ctx.restore();
  /* تیغه‌های علف — سه لایه، از دور به نزدیک */
  for (let layer = 0; layer < 3; layer++) {
    const n = 260, hMin = 26 + layer * 16, hMax = 60 + layer * 30;
    for (let i = 0; i < n; i++) {
      const s = layer * 1000 + i;
      const x = noise1(s * 1.7) * FIELD.w;
      const y = HUD_H + 40 + noise1(s * 3.1 + 5) * (SCENE_H - HUD_H - 40);
      const h = hMin + noise1(s * .9) * (hMax - hMin);
      const lean = (noise1(s * 2.3) - .5) * 26;
      ctx.strokeStyle = layer === 0 ? 'rgba(20, 46, 24, .8)'
                      : (layer === 1 ? 'rgba(44, 82, 48, .85)' : 'rgba(78, 127, 74, .75)');
      ctx.lineWidth = 2 + layer * .8; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(x + lean * .4, y - h * .6, x + lean, y - h);
      ctx.stroke();
    }
  }
  /* چند گلِ ریز */
  for (let i = 0; i < 26; i++) {
    const x = noise1(i * 5.3 + 2) * FIELD.w, y = HUD_H + 70 + noise1(i * 7.1) * (SCENE_H - HUD_H - 90);
    const c = ['#f0d36a', '#e8a0c0', '#f6f2e4'][i % 3];
    ctx.strokeStyle = 'rgba(60, 100, 60, .8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 2, y - 22); ctx.stroke();
    for (let k = 0; k < 5; k++) {
      const a = k / 5 * TAU;
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.ellipse(x + 2 + Math.cos(a) * 4, y - 22 + Math.sin(a) * 4, 3.4, 2.8, a, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = '#d9a026';
    ctx.beginPath(); ctx.arc(x + 2, y - 22, 2, 0, TAU); ctx.fill();
  }
  /* کندهٔ چوب گوشهٔ مزرعه */
  ctx.fillStyle = P.woodDk;
  ctx.beginPath(); ctx.ellipse(120, 690, 96, 34, -.12, 0, TAU); ctx.fill();
  ctx.fillStyle = texWood(P.wood, P.woodDk);
  ctx.beginPath(); ctx.ellipse(120, 682, 92, 30, -.12, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(60, 38, 14, .5)'; ctx.lineWidth = 2;
  for (let r = 12; r < 88; r += 16) {
    ctx.beginPath(); ctx.ellipse(120, 682, r, r * .33, -.12, 0, TAU); ctx.stroke();
  }
  /* نوارِ کنارِ دفتر */
  ctx.fillStyle = P.woodDk;
  ctx.fillRect(FIELD.w, HUD_H, SCENE_W - FIELD.w, SCENE_H - HUD_H);
  ctx.fillStyle = texWood(P.wood, P.woodDk);
  ctx.fillRect(FIELD.w + 6, HUD_H, SCENE_W - FIELD.w - 6, SCENE_H - HUD_H);
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.fillRect(FIELD.w, HUD_H, 8, SCENE_H - HUD_H);
}

/* ───────── صحنه ───────── */

function draw() {
  beginScene(P.grass);
  ctx.save();
  if (S.shake > 0) {
    const k = S.shake * 10;
    ctx.translate(Math.sin(S.t * 55) * k, Math.cos(S.t * 43) * k * .4);
  }
  const layer = staticLayer('field', SCENE_W, SCENE_H, paintFieldStatic);
  ctx.drawImage(layer, 0, 0, SCENE_W, SCENE_H);
  drawSpecks();
  if (S.lensOn && S.card < 0) drawLens(layer);
  drawNote();
  bits.draw();
  ctx.restore();

  if (S.card >= 0) drawCard();
  drawHUD();
  if (!(S.phase === 'play' && S.tut.on)) toast.draw(HUD_H + 8, { good: P.good, bad: P.bad, info: P.card, ink: P.ink });
  if (S.phase === 'play' && S.tut.on) drawTutorial();
  if (S.phase === 'intro') drawIntro();
  if (S.phase === 'won') drawWon();
  if (S.phase === 'lost') drawLost();
  endScene(.1, 'rgba(6, 16, 8, .44)', .34, .12);
}

/** بیرونِ ذرّه‌بین، جانور فقط یک نقطهٔ ریز است. */
function drawSpecks() {
  for (const b of S.bugs) {
    if (b.rec) continue;
    const near = S.lensOn ? Math.hypot(b.x - S.lens.x, b.y - S.lens.y) : 9999;
    ctx.save();
    /* نزدیکِ ذرّه‌بین، علفِ بالای سرش تکان می‌خورد — سرنخ هست، ولی جانور پیدا نیست */
    if (near < 230) {
      const k = clamp(1 - (near - LENS_R) / 130, 0, 1);
      ctx.globalAlpha = k * .5;
      ctx.strokeStyle = '#cfe6b8'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      for (let i = 0; i < 3; i++) {
        const a = b.a + (i - 1) * .7 + Math.sin(S.t * 7 + i + b.wob) * .22;
        ctx.beginPath();
        ctx.moveTo(b.x, b.y);
        ctx.lineTo(b.x + Math.cos(a) * 16, b.y + Math.sin(a) * 16 - 12);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    ctx.globalAlpha = .85;
    ctx.fillStyle = 'rgba(22, 40, 22, .92)';
    ctx.beginPath(); ctx.ellipse(b.x, b.y, 5, 3.6, b.a, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

function drawLens(layer) {
  const { x, y } = S.lens;
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, LENS_R, 0, TAU); ctx.clip();
  /* صحنه، بزرگ‌شده حولِ مرکزِ ذرّه‌بین */
  ctx.translate(x, y);
  ctx.scale(LENS_K, LENS_K);
  ctx.translate(-x, -y);
  ctx.drawImage(layer, 0, 0, SCENE_W, SCENE_H);
  for (const b of S.bugs) {
    if (b.rec) continue;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.a);
    drawBug(b.k, 1, S.t + b.wob);
    ctx.restore();
  }
  ctx.restore();
  /* برقِ شیشه */
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, LENS_R, 0, TAU); ctx.clip();
  const g = ctx.createLinearGradient(x - LENS_R, y - LENS_R, x + LENS_R * .4, y + LENS_R);
  g.addColorStop(0, 'rgba(255,255,255,.22)');
  g.addColorStop(.45, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(x - LENS_R, y - LENS_R, LENS_R * 2, LENS_R * 2);
  ctx.restore();
  /* قابِ برنجی و دسته */
  ctx.strokeStyle = P.brassDk; ctx.lineWidth = 16;
  ctx.beginPath(); ctx.arc(x, y, LENS_R + 6, 0, TAU); ctx.stroke();
  ctx.strokeStyle = P.brass; ctx.lineWidth = 10;
  ctx.beginPath(); ctx.arc(x, y, LENS_R + 6, 0, TAU); ctx.stroke();
  ctx.strokeStyle = P.brassLt; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(x, y, LENS_R + 2, -2.4, -.9); ctx.stroke();
  ctx.save();
  ctx.translate(x, y); ctx.rotate(.9);
  ctx.strokeStyle = P.woodDk; ctx.lineWidth = 20; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(LENS_R + 10, 0); ctx.lineTo(LENS_R + 76, 0); ctx.stroke();
  ctx.strokeStyle = P.wood; ctx.lineWidth = 13;
  ctx.beginPath(); ctx.moveTo(LENS_R + 10, 0); ctx.lineTo(LENS_R + 76, 0); ctx.stroke();
  ctx.restore();
}

/* ───────── دفتر ───────── */

const COL = [
  { n: 'پا', icon: 'leg' },
  { n: 'بال', icon: 'wing' },
  { n: 'شاخک', icon: 'ant' },
];

function featIcon(x, y, kind, col, sc = 1) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(sc, sc);
  ctx.strokeStyle = col; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
  if (kind === 'leg') {
    ctx.beginPath(); ctx.moveTo(-6, -8); ctx.quadraticCurveTo(2, -2, -2, 9); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(4, -8); ctx.quadraticCurveTo(10, -1, 7, 9); ctx.stroke();
  } else if (kind === 'wing') {
    ctx.fillStyle = col;
    ctx.globalAlpha = .35;
    ctx.beginPath(); ctx.ellipse(0, -1, 11, 6, -.35, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.ellipse(0, -1, 11, 6, -.35, 0, TAU); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(-6, 9); ctx.quadraticCurveTo(-8, -4, -1, -9); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(6, 9); ctx.quadraticCurveTo(8, -4, 1, -9); ctx.stroke();
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(-1, -9, 2.4, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(1, -9, 2.4, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawNote() {
  paper(NOTE.x, NOTE.y, NOTE.w, NOTE.h, P.card, 21, 12, .34);
  ctx.strokeStyle = 'rgba(38, 48, 31, .2)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(NOTE.x + 22, NOTE.y + 14); ctx.lineTo(NOTE.x + 22, NOTE.y + NOTE.h - 14); ctx.stroke();
  text('دفترِ مشاهده', NOTE.x + NOTE.w - 24, NOTE.y + 32, { size: 21, family: 'Lalezar', color: P.ink, align: 'right' });
  /* سرستون‌ها */
  for (let c = 0; c < 3; c++) {
    const x = NOTE.x + NOTE.w - 84 - c * 68;
    featIcon(x, NOTE.y + 62, COL[c].icon, P.inkSoft, .9);
    text(COL[c].n, x, NOTE.y + 82, { size: 12, color: P.inkSoft });
  }
  ctx.strokeStyle = 'rgba(38, 48, 31, .22)'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(NOTE.x + 34, NOTE.y + 92); ctx.lineTo(NOTE.x + NOTE.w - 22, NOTE.y + 92); ctx.stroke();

  for (let i = 0; i < S.bugs.length; i++) {
    const b = S.bugs[i], r = noteRow(i);
    const hot = S.hover && S.hover.k === 'row' && S.hover.i === i;
    const lit = S.flashRow === i && S.flash > 0;
    ctx.fillStyle = lit ? (i === (S.riddle ? S.riddle.i : -1) ? 'rgba(93, 162, 111, .25)' : 'rgba(205, 91, 69, .2)')
                        : (b.rec ? 'rgba(38, 48, 31, .05)' : 'rgba(38, 48, 31, .02)');
    ctx.beginPath(); rrPath(r.x, r.y, r.w, r.h, 10); ctx.fill();
    if (b.rec && S.stage === 'riddle') {
      ctx.strokeStyle = hot ? P.gold : 'rgba(38, 48, 31, .18)'; ctx.lineWidth = hot ? 3 : 1.6;
      ctx.beginPath(); rrPath(r.x, r.y, r.w, r.h, 10); ctx.stroke();
    }
    if (!b.rec) {
      ctx.strokeStyle = 'rgba(38, 48, 31, .16)'; ctx.lineWidth = 1.6; ctx.setLineDash([6, 6]);
      ctx.beginPath(); rrPath(r.x, r.y, r.w, r.h, 10); ctx.stroke();
      ctx.setLineDash([]);
      text('هنوز ثبت نشده', r.x + r.w / 2, r.y + r.h / 2, { size: 14, color: 'rgba(38, 48, 31, .3)' });
      continue;
    }
    /* شکلِ جانور و شمارها */
    ctx.save();
    ctx.translate(r.x + 44, r.y + r.h / 2);
    drawBug(b.k, .82, S.t + b.wob);
    ctx.restore();
    for (let c = 0; c < 3; c++) {
      const x = r.x + r.w - 40 - c * 68;
      numText(fa(b.rec[c]), x, r.y + r.h / 2, { size: 26, color: b.rec[c] ? P.ink : 'rgba(38,48,31,.3)' });
    }
  }
  /* پیشرفت */
  const y = NOTE.y + NOTE.h - 34;
  text(S.stage === 'look' ? 'ثبت‌شده' : 'معمّا', NOTE.x + NOTE.w - 30, y, { size: 15, color: P.inkSoft, align: 'right' });
  numText(S.stage === 'look' ? fa(recorded()) + ' / ' + fa(S.bugs.length)
                             : fa(S.rIdx) + ' / ' + fa(S.rTotal),
    NOTE.x + 76, y, { size: 20, color: P.ink });
}

/* ───────── کارتِ ثبت ───────── */

function drawCard() {
  ctx.fillStyle = 'rgba(6, 14, 8, .62)';
  ctx.fillRect(0, 0, SCENE_W, SCENE_H);
  const b = S.bugs[S.card];
  paper(CARD.x, CARD.y, CARD.w, CARD.h, P.card, 51, 16, .5);
  text('چند تا می‌بینی؟', CARD.x + CARD.w / 2, CARD.y + 34, { size: 22, family: 'Lalezar', color: P.ink });
  /* جانور، بزرگ */
  ctx.save();
  ctx.translate(CARD.x + CARD.w / 2, CARD.y + 98);
  drawBug(b.k, 3, S.t + b.wob);
  ctx.restore();
  ctx.strokeStyle = 'rgba(38, 48, 31, .18)'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(CARD.x + 30, CARD.y + 132); ctx.lineTo(CARD.x + CARD.w - 30, CARD.y + 132); ctx.stroke();

  for (let i = 0; i < 3; i++) {
    const y = CARD.y + 138 + i * 88;
    featIcon(CARD.x + CARD.w / 2 - 78, y + 28, COL[i].icon, P.ink, 1.15);
    text(COL[i].n, CARD.x + CARD.w / 2 - 78, y + 52, { size: 13, color: P.inkSoft });
    numText(fa(S.draft[i]), CARD.x + CARD.w / 2 + 26, y + 30, { size: 40, color: P.ink });
    for (const plus of [false, true]) {
      const bb = stepBtn(i, plus);
      const hot = S.hover && S.hover.k === (plus ? 'plus' : 'minus') && S.hover.i === i;
      ctx.fillStyle = hot ? '#4e7f4a' : '#6b8f63';
      ctx.beginPath(); ctx.arc(bb.x + bb.w / 2, bb.y + bb.h / 2 + 2, bb.w / 2, 0, TAU); ctx.fill();
      ctx.fillStyle = hot ? '#63a05b' : '#7fa876';
      ctx.beginPath(); ctx.arc(bb.x + bb.w / 2, bb.y + bb.h / 2, bb.w / 2 - 2, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(bb.x + 16, bb.y + bb.h / 2); ctx.lineTo(bb.x + bb.w - 16, bb.y + bb.h / 2);
      if (plus) { ctx.moveTo(bb.x + bb.w / 2, bb.y + 16); ctx.lineTo(bb.x + bb.w / 2, bb.y + bb.h - 16); }
      ctx.stroke();
    }
  }
  button(CARD_OK, 'ثبت در دفتر', { hot: S.hover && S.hover.k === 'ok', fill: '#4e7f4a', hotFill: '#63a05b', size: 24 });
  if (S.wrong > 0) {
    ctx.save();
    ctx.globalAlpha = clamp(S.wrong, 0, 1);
    ctx.strokeStyle = P.bad; ctx.lineWidth = 4;
    ctx.beginPath(); rrPath(CARD.x - 4, CARD.y - 4, CARD.w + 8, CARD.h + 8, 18); ctx.stroke();
    ctx.restore();
  }
  text('برای بستن، بیرونِ کارت بزن', CARD.x + CARD.w / 2, CARD.y + CARD.h - 20,
    { size: 13, color: 'rgba(38, 48, 31, .4)' });
}

/* ───────── کارتِ معمّا و نوار ───────── */

function drawHUD() {
  ctx.fillStyle = 'rgba(14, 28, 16, .93)';
  ctx.fillRect(0, 0, SCENE_W, HUD_H);
  ctx.fillStyle = 'rgba(207, 167, 78, .3)';
  ctx.fillRect(0, HUD_H - 2, SCENE_W, 2);
  text(L().name, SCENE_W - 24, HUD_H / 2, { size: 22, family: 'Lalezar', color: P.paper, align: 'right' });
  for (let i = 0; i < 3; i++) {
    const x = SCENE_W - 236 - i * 30;
    ctx.save();
    ctx.globalAlpha = i < S.lamps ? 1 : .22;
    ctx.fillStyle = i < S.lamps ? P.brass : '#5f6a5c';
    ctx.beginPath(); ctx.arc(x, HUD_H / 2, 10, 0, TAU); ctx.fill();
    ctx.strokeStyle = i < S.lamps ? P.brassLt : '#828d7f'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x + 7, HUD_H / 2 + 7); ctx.lineTo(x + 14, HUD_H / 2 + 14); ctx.stroke();
    ctx.restore();
  }
  if (!L().endless) {
    numText(fa(Math.min(S.cleared, L().quota)) + ' / ' + fa(L().quota), 640, HUD_H / 2, { size: 21, color: P.gold });
  } else {
    text('بی‌پایان', 640, HUD_H / 2, { size: 21, family: 'Lalezar', color: P.gold });
  }
  numText(fa(S.score), 24, HUD_H / 2, { size: 24, color: P.gold, align: 'left' });
  numText('بیشترین ' + fa(S.best), 132, HUD_H / 2 + 1,
    { size: 14, color: 'rgba(246, 240, 220, .5)', align: 'left', family: 'Vazirmatn', weight: 700 });
  /* کارتِ معمّا، وسطِ نوار */
  if (S.stage === 'riddle' && S.riddle && !S.done) {
    const k = BUG[S.bugs[S.riddle.i].k];
    const w = 300, x = 300;
    ctx.fillStyle = 'rgba(207, 167, 78, .18)';
    ctx.beginPath(); rrPath(x, 6, w, HUD_H - 12, 10); ctx.fill();
    ctx.strokeStyle = P.brassLt; ctx.lineWidth = 2;
    ctx.beginPath(); rrPath(x, 6, w, HUD_H - 12, 10); ctx.stroke();
    text('کدام است؟', x + w - 16, HUD_H / 2, { size: 16, family: 'Lalezar', color: P.brassLt, align: 'right' });
    for (let c = 0; c < 3; c++) {
      const cx = x + 178 - c * 58;
      featIcon(cx - 14, HUD_H / 2, COL[c].icon, P.brassLt, .78);
      numText(fa([k.legs, k.wings, k.ant][c]), cx + 12, HUD_H / 2, { size: 22, color: P.paper });
    }
  }
  const kk = clamp(S.timeLeft / L().time, 0, 1);
  ctx.fillStyle = 'rgba(0,0,0,.4)';
  ctx.beginPath(); rrPath(24, HUD_H - 9, 240, 5, 3); ctx.fill();
  ctx.fillStyle = kk > .3 ? P.brass : P.bad;
  ctx.beginPath(); rrPath(24, HUD_H - 9, 240 * kk, 5, 3); ctx.fill();
}

function drawTutorial() {
  const st = S.tut.step;
  if (st === 0) {
    spot([{ x: 60, y: 140, w: 700, h: 520 }], .72);
    const h = tutCard(150, 200, 520,
      ['جانورهای مزرعه لای علف پنهان‌اند.', 'از دور فقط یک نقطه‌اند؛ ذرّه‌بین را رویشان بگردان.'], 'دفترِ مزرعه');
    tutMore(410, 200 + h + 8, S.t, P.ink);
  } else if (st === 1) {
    spot([{ x: NOTE.x, y: NOTE.y, w: NOTE.w, h: NOTE.h }], .7);
    tutCard(80, 220, 620, ['زیرِ ذرّه‌بین روی جانور بزن تا کارتِ ثبت باز شود.',
      'پا و بال و شاخکش را خودت بشمار و بنویس.']);
  } else {
    spot([{ x: 280, y: 4, w: 340, h: HUD_H - 8 }, { x: NOTE.x, y: NOTE.y, w: NOTE.w, h: NOTE.h }], .72);
    const h = tutCard(150, 300, 540,
      ['دفتر که پُر شد، کارتِ معمّا بالای صحنه می‌آید:',
       'نشانه‌ها را می‌گوید و تو باید سطرِ درست را در دفترِ خودت بزنی.'], 'از روی دفترِ خودت');
    tutMore(420, 300 + h + 8, S.t, P.ink);
  }
}

/* ───────── پرده‌ها ───────── */

function lensIcon(x, y) {
  ctx.strokeStyle = P.brassDk; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.arc(x - 8, y - 6, 24, 0, TAU); ctx.stroke();
  ctx.fillStyle = 'rgba(191, 230, 238, .5)';
  ctx.beginPath(); ctx.arc(x - 8, y - 6, 22, 0, TAU); ctx.fill();
  ctx.strokeStyle = P.woodDk; ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x + 10, y + 12); ctx.lineTo(x + 30, y + 30); ctx.stroke();
  ctx.save();
  ctx.translate(x - 8, y - 6);
  drawBug(0, 1.1, 0);
  ctx.restore();
}

function drawIntro() {
  overlay({
    t: S.phaseT, w: 800, h: 300, y: 128,
    paper: P.paper, band: P.grassLt, ink: P.ink, inkSoft: '#6c7a68',
    icon: lensIcon,
    title: 'دفترِ مزرعه',
    body: 'مثلِ مریم و سارا: با ذرّه‌بین جانورهای کوچکِ مزرعه را پیدا کن،\nپا و بال و شاخکشان را خودت بشمار و در دفتر بنویس.\nآخر، کارتِ معمّا نشانه‌ها را می‌گوید و تو از روی دفترت جوابش را می‌دهی.',
    btn: BTN_GO, btnLabel: 'برو به مزرعه', btnHot: S.hover === BTN_GO,
    btnFill: '#4e7f4a', btnHotFill: '#63a05b',
  });
}

function drawWon() {
  const last = S.level + 1 >= LEVELS.length;
  overlay({
    t: S.phaseT, w: 720, h: 250, y: 160,
    paper: P.paper, band: P.gold, ink: P.ink, inkSoft: '#6c7a68',
    icon: lensIcon,
    title: L().endless ? 'آفتاب رفت' : 'همهٔ دفترها پُر شد!',
    body: 'امتیاز: ' + fa(S.score) + (last ? '\nهمهٔ مزرعه را گشتی. از اوّل؟' : ''),
    btn: BTN_GO, btnLabel: last ? 'دوباره' : 'گوشهٔ بعد', btnHot: S.hover === BTN_GO,
    btnFill: '#4e7f4a', btnHotFill: '#63a05b',
  });
}

function drawLost() {
  overlay({
    t: S.phaseT, w: 720, h: 250, y: 160,
    paper: P.paper, band: P.bad, ink: P.ink, inkSoft: '#6c7a68',
    icon: (x, y) => { lensIcon(x + 30, y); ctx.fillStyle = '#7d8a78';
      ctx.beginPath(); ctx.arc(x - 40, y, 11, 0, TAU); ctx.fill(); },
    title: 'روز تمام شد',
    body: 'امتیاز: ' + fa(S.score) + '\nذرّه‌بین را آرام بگردان؛ نقطه‌ها جانورند.',
    btn: BTN_GO, btnLabel: 'دوباره', btnHot: S.hover === BTN_GO,
    btnFill: '#4e7f4a', btnHotFill: '#63a05b',
  });
}
