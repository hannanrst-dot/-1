<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#141a2c">
<title>قلّه‌ها در مه — مقایسه و تقریب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>
  /* صفحه نباید هیچ‌جا اسکرول یا زوم شود؛ بازی باید مثل یک برنامه رفتار کند. */
  html, body {
    margin: 0; padding: 0; background: #141a2c;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body {
    position: fixed; inset: 0;          /* جلوی کشیده‌شدنِ صفحه در سافاریِ گوشی */
    width: 100%; height: 100vh; height: 100dvh;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none; -webkit-touch-callout: none;
  }

  /* گوشیِ عمودی صحنه را ریز می‌کند؛ بچه باید گوشی را بچرخاند. */
  #rotate { display: none; }
  @media (orientation: portrait) and (max-width: 860px) {
    #stage { display: none; }
    #rotate {
      display: flex; position: fixed; inset: 0;
      z-index: 9;
      flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      background: #141a2c; color: #f6ead2;
      font: 700 20px "Vazirmatn", Tahoma, sans-serif; text-align: center; padding: 32px;
    }
    #rotate svg { animation: tilt 2.4s ease-in-out infinite; }
    @keyframes tilt { 0%, 45% { transform: rotate(0deg); } 65%, 100% { transform: rotate(-90deg); } }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="rotate">
  <svg width="86" height="126" viewBox="0 0 86 126" fill="none" aria-hidden="true">
    <rect x="3" y="3" width="80" height="120" rx="12" stroke="#e8b448" stroke-width="5"/>
    <rect x="15" y="19" width="56" height="88" rx="5" fill="#e8b448" opacity=".28"/>
    <circle cx="43" cy="115" r="4" fill="#e8b448"/>
  </svg>
  <div>گوشی را بچرخان</div>
  <div style="font-weight:400;opacity:.7;font-size:16px">این بازی خوابیده بازی می‌شود</div>
</div>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   هستهٔ مشترکِ بازی‌ها — سبک «کاغذبُری»
   ───────────────────────────────────────────────────────────────────────
   این فایل جعبه‌ابزار است، نه چارچوب: هر بازی حلقه و وضعیت خودش را دارد
   و فقط از این توابع برای کشیدن استفاده می‌کند. دلیلش این است که هر بازی
   باید حس‌وحال خودش را داشته باشد، نه اینکه همه شبیه هم دربیایند.

   قاعده‌های ثابتِ تصویری:
   • نور همیشه از بالا-چپ می‌تابد، پس سایه‌ها به پایین-راست می‌افتند.
   • هیچ لبه‌ای کاملاً صاف نیست؛ همه کمی موج دارند (انگار با قیچی بریده).
   • هیچ خاکستریِ خالصی نداریم؛ همه‌ی خنثی‌ها به گرمیِ صحنه می‌زنند.
   • یک لایه‌ی دانه‌دانه‌ی کاغذ روی کلِ تصویر ضرب می‌شود.
   ═══════════════════════════════════════════════════════════════════════ */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const FA_D = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
const fa = (n) => String(n).replace(/\d/g, (d) => FA_D[+d]);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeIn = (t) => t * t * t;
const easeInOut = (t) => (t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2);
const easeBack = (t) => 1 + 2.7 * Math.pow(t-1, 3) + 1.7 * Math.pow(t-1, 2);
const easeElastic = (t) => t === 0 || t === 1 ? t : Math.pow(2, -9*t) * Math.sin((t*10 - .75) * 2.094) + 1;

/** تصادفِ تکرارپذیر: با یک بذر همیشه همان عدد. برای اینکه تزئین‌ها هر فریم نپرند. */
function noise1(x) {
  const s = Math.sin(x * 127.1) * 43758.5453;
  return s - Math.floor(s);
}
const pick = (arr, seed) => arr[Math.floor(noise1(seed) * arr.length) % arr.length];

/* ───────── بوم و صحنهٔ ثابت ───────── */

let ctx, SW, SH, CV, _refit = null;
let view = { scale: 1, ox: 0, oy: 0, w: 0, h: 0, dpr: 1 };
let _grain = null, _grainDark = null;

function initStage(canvas, w, h) {
  CV = canvas; SW = w; SH = h;
  ctx = canvas.getContext('2d');

  /* اندازه را از خودِ بوم می‌گیریم نه از innerHeight؛ چون در سافاریِ گوشی
     نوارِ آدرس باز و بسته می‌شود و innerHeight دروغ می‌گوید. */
  const fit = () => {
    const r = canvas.getBoundingClientRect();
    const vw = Math.round(r.width), vh = Math.round(r.height);
    if (vw < 20 || vh < 20) return;
    const dpr = Math.min(devicePixelRatio || 1, QUALITY > 0 ? 2 : 1);
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    const scale = Math.min(vw / SW, vh / SH);
    view = { scale, ox: (vw - SW*scale)/2, oy: (vh - SH*scale)/2, w: vw, h: vh, dpr };
    _grain = buildGrain();
  };
  _refit = fit;
  addEventListener('resize', fit);
  /* چرخاندنِ گوشی: اندازهٔ درست چند لحظه بعد می‌رسد، پس چندبار اندازه می‌گیریم. */
  addEventListener('orientationchange', () => {
    fit(); setTimeout(fit, 140); setTimeout(fit, 460);
  });
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(canvas);

  /* صدا در گوشی فقط بعد از اوّلین لمس اجازهٔ پخش دارد. */
  const unlock = () => { sfx._c(); removeEventListener('pointerdown', unlock); removeEventListener('touchstart', unlock); };
  addEventListener('pointerdown', unlock, { passive: true });
  addEventListener('touchstart', unlock, { passive: true });
  /* نگه‌داشتنِ انگشت نباید منوی مرورگر را باز کند. */
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  fit();
  return ctx;
}

/** قابِ صحنه را باز می‌کند: بعد از این، مختصات همیشه در فضای SW×SH است. */
function beginScene(bg) {
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, view.w, view.h);
  ctx.save();
  ctx.translate(view.ox, view.oy);
  ctx.scale(view.scale, view.scale);
  ctx.beginPath();
  ctx.rect(0, 0, SW, SH);
  ctx.clip();
}

/* ───────── پوششِ پایانِ قاب ─────────
   دانه‌های کاغذ و تیرگیِ گوشه‌ها هر دو ثابت‌اند و تغییر نمی‌کنند، ولی
   قبلاً هر فریم از نو کشیده می‌شدند: یکی با «multiply» روی کلِّ صفحه و
   یکی با یک گرادیانِ شعاعیِ تازه. اندازه‌گیری نشان داد همین دو تا
   ۱۱ تا ۱۶ میلی‌ثانیه از هر فریم را می‌خوردند — بیشتر از کشیدنِ خودِ
   صحنه. حالا یک بار در یک بومِ جدا پخته می‌شوند و هر فریم فقط یک
   drawImage است.                                                       */

let _ovl = null, _ovlKey = '';

function overlayLayer(grainAlpha, vignette) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const w = Math.max(2, Math.round(SW * q)), h = Math.max(2, Math.round(SH * q));
  const key = w + 'x' + h + '|' + grainAlpha + '|' + vignette;
  if (_ovl && _ovlKey === key) return _ovl;
  let c;
  try {
    c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g2 = c.getContext('2d');
    if (!g2) return null;
    if (_grainDark && grainAlpha > 0) {
      /* همان دانه‌ها، ولی به‌جای multiply به شکلِ سیاهِ کم‌رنگ */
      g2.globalAlpha = clamp(grainAlpha * 1.15, 0, 1);
      g2.fillStyle = g2.createPattern(_grainDark, 'repeat');
      g2.fillRect(0, 0, w, h);
      g2.globalAlpha = 1;
    }
    if (vignette) {
      const g = g2.createRadialGradient(w / 2, h / 2, h * .42, w / 2, h / 2, h * 1.05);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, vignette);
      g2.fillStyle = g;
      g2.fillRect(0, 0, w, h);
    }
  } catch (e) { return null; }
  _ovl = c; _ovlKey = key;
  return c;
}

/** بافتِ کاغذ، تیرگیِ گوشه‌ها، رنگ‌بندی و درخششِ نور را می‌گذارد و قاب را می‌بندد. */
function endScene(grainAlpha = .15, vignette = 'rgba(48,28,14,.30)', bloom = .34, grade = .14) {
  /* درخششِ نور خاموش است. اندازه‌گیری نشان داد هر فریم ۲۱ میلی‌ثانیه
     می‌گیرد — بیشتر از تمامِ کارهای دیگرِ یک فریم روی هم — چون برای
     ساختنش باید کلِّ بوم دوباره خوانده شود. از آن بدتر: متنِ فارسی را
     مه‌آلود می‌کرد و خواندنش را سخت‌تر. بی‌آن، صحنه تمیزتر است. */
  bloom = 0;
  if (QUALITY < 1) { grade = 0; grainAlpha *= .5; }
  if (QUALITY < 2) grade = 0;
  if (grade > 0) {
    /* رنگ‌بندیِ نرم: بالای صحنه گرم‌تر، پایین سردتر — عمق می‌دهد */
    const g = ctx.createLinearGradient(0, 0, 0, SH);
    g.addColorStop(0, `rgba(255, 214, 150, ${grade})`);
    g.addColorStop(.55, 'rgba(255, 255, 255, 0)');
    g.addColorStop(1, `rgba(40, 60, 110, ${grade * .9})`);
    ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalCompositeOperation = 'source-over';
  }
  const ov = (grainAlpha > 0 || vignette) ? overlayLayer(grainAlpha, vignette) : null;
  if (ov) ctx.drawImage(ov, 0, 0, SW, SH);
  ctx.restore();
  bloomPass(bloom);
}

/* ───────── درخششِ نور (bloom) ─────────
   قابِ رسم‌شده را کوچک می‌کنیم، دو بار در خودش ضرب می‌کنیم تا فقط
   روشن‌ها بمانند، محوش می‌کنیم و با حالتِ «lighter» رویش می‌گذاریم.
   نتیجه: چراغ‌ها، شعله‌ها و رنگ‌های روشن نور پخش می‌کنند. */
let _bl, _blc, _bl2, _bl2c, _blNo = false, _blTick = 0;

function bloomPass(amount) {
  if (!amount || _blNo || !CV.width) return;
  /* کوچک‌کردن و بزرگ‌کردنِ دوباره، خودش محو می‌کند — از filter خیلی ارزان‌تر است */
  const W = Math.max(4, Math.round(CV.width * .2)), H = Math.max(4, Math.round(CV.height * .2));
  const W2 = Math.max(2, Math.round(W * .28)), H2 = Math.max(2, Math.round(H * .28));
  try {
    if (!_bl) {
      _bl = document.createElement('canvas'); _blc = _bl.getContext('2d');
      _bl2 = document.createElement('canvas'); _bl2c = _bl2.getContext('2d');
      if (!_blc || !_bl2c) { _blNo = true; return; }
    }
    if (_bl.width !== W || _bl.height !== H) { _bl.width = W; _bl.height = H; }
    if (_bl2.width !== W2 || _bl2.height !== H2) { _bl2.width = W2; _bl2.height = H2; }
    /* ساختنِ نور یک قاب در میان کافی است؛ گذاشتنش هر قاب. */
    _blTick = (_blTick + 1) & 1;
    if (!_blTick) {
      _blc.globalCompositeOperation = 'source-over';
      _blc.clearRect(0, 0, W, H);
      _blc.drawImage(CV, 0, 0, W, H);
      _blc.globalCompositeOperation = 'multiply';
      _blc.drawImage(_bl, 0, 0);
      _blc.drawImage(_bl, 0, 0);
      _blc.globalCompositeOperation = 'source-over';
      _bl2c.clearRect(0, 0, W2, H2);
      _bl2c.drawImage(_bl, 0, 0, W2, H2);
    }

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = amount;
    ctx.drawImage(_bl2, 0, 0, CV.width, CV.height);
    ctx.restore();
  } catch (e) { _blNo = true; }
}

/* ───────── لایهٔ ثابت ─────────
   هرچه در صحنه تکان نمی‌خورد را یک‌بار می‌کشیم و بعد فقط کپی می‌کنیم. */
const _layers = {};
function staticLayer(key, w, h, paint) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const L = _layers[key];
  if (L && L.q === q && L.w === w && L.h === h) return L.cv;
  const off = document.createElement('canvas');
  off.width = Math.max(1, Math.round(w * q));
  off.height = Math.max(1, Math.round(h * q));
  const c = off.getContext('2d');
  c.setTransform(q, 0, 0, q, 0, 0);
  const prev = ctx;
  ctx = c;
  try { paint(); } finally { ctx = prev; }
  _layers[key] = { cv: off, q, w, h };
  return off;
}

/* ───────── نورپردازی و بافت ─────────
   کارِ این‌ها این است که هیچ سطحی «تختِ یک‌رنگ» نماند. */

/** شیبِ عمودی: بالا روشن، پایین تیره. */
function vgrad(y0, y1, top, bot) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, top); g.addColorStop(1, bot);
  return g;
}

/** حجمِ کروی: نور از بالا-چپ، سایه در پایین-راست. */
function ball(cx, cy, r, lit, base, dark) {
  const g = ctx.createRadialGradient(cx - r * .38, cy - r * .42, r * .06, cx, cy, r * 1.06);
  g.addColorStop(0, lit); g.addColorStop(.45, base); g.addColorStop(1, dark);
  return g;
}

/** لبهٔ روشنِ بالا-چپِ یک مسیر — همان «rim light». */
function rim(pathFn, col, w = 2.2) {
  ctx.save();
  ctx.beginPath(); pathFn();
  ctx.clip();
  ctx.beginPath(); pathFn();
  ctx.strokeStyle = col; ctx.lineWidth = w * 2; ctx.lineJoin = 'round';
  ctx.translate(-w * .5, -w * .6);
  ctx.stroke();
  ctx.restore();
}

/** سایهٔ چسبیده به زمین — چیزها را روی سطح می‌نشاند. */
function contact(cx, cy, rx, ry, alpha = .26) {
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
  g.addColorStop(0, `rgba(20, 12, 6, ${alpha})`);
  g.addColorStop(1, 'rgba(20, 12, 6, 0)');
  ctx.save();
  ctx.fillStyle = g;
  ctx.translate(cx, cy); ctx.scale(1, ry / Math.max(rx, ry));
  ctx.beginPath(); ctx.arc(0, 0, Math.max(rx, ry), 0, TAU); ctx.fill();
  ctx.restore();
}

const _tex = {};
/** بافتِ تکرارشونده؛ یک‌بار ساخته و بعد از حافظه خوانده می‌شود. */
function texture(key, w, h, paint) {
  if (_tex[key]) return _tex[key];
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const c = off.getContext('2d');
  paint(c, w, h);
  _tex[key] = ctx.createPattern(off, 'repeat');
  return _tex[key];
}

/** رگهٔ چوب. */
function texWood(base, grain) {
  return texture('w' + base + grain, 120, 120, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = grain; c.lineWidth = 1.4;
    for (let i = 0; i < 9; i++) {
      c.globalAlpha = .18 + noise1(i * 3.1) * .3;
      c.beginPath();
      const y0 = i * 14 + noise1(i) * 6;
      c.moveTo(0, y0);
      for (let x = 0; x <= w; x += 10) c.lineTo(x, y0 + Math.sin(x * .09 + i) * 2.6);
      c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** تارِ پارچه. */
function texCloth(base, thread) {
  return texture('c' + base + thread, 16, 16, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = thread; c.lineWidth = 1; c.globalAlpha = .5;
    for (let i = 0; i < w; i += 4) {
      c.beginPath(); c.moveTo(i, 0); c.lineTo(i, h); c.stroke();
      c.beginPath(); c.moveTo(0, i); c.lineTo(w, i); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** دانه‌های سنگ. */
function texStone(base, spec) {
  return texture('s' + base + spec, 90, 90, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) {
      c.globalAlpha = .05 + noise1(i * 1.7) * .16;
      c.fillStyle = spec;
      const r = .6 + noise1(i * 5.3) * 1.9;
      c.beginPath();
      c.arc(noise1(i * 2.1) * w, noise1(i * 3.7 + 1) * h, r, 0, TAU);
      c.fill();
    }
    c.globalAlpha = 1;
  });
}

/** الیافِ کاغذ. */
function texPaper(base) {
  return texture('p' + base, 100, 100, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 130; i++) {
      c.globalAlpha = .04 + noise1(i * 2.3) * .07;
      c.strokeStyle = i % 2 ? '#ffffff' : '#5a4326';
      c.lineWidth = .9;
      const x = noise1(i * 1.3) * w, y = noise1(i * 4.1 + 2) * h;
      const a = noise1(i * 7.7) * TAU, l = 4 + noise1(i * 9.1) * 12;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

function buildGrain() {
  const s = 260;
  const off = document.createElement('canvas');
  off.width = off.height = s;
  const c = off.getContext('2d');
  const img = c.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    const v = 214 + Math.random() * 41;
    img.data[i*4] = v; img.data[i*4+1] = v; img.data[i*4+2] = v; img.data[i*4+3] = 255;
  }
  c.putImageData(img, 0, 0);
  /* همان دانه‌ها به شکلِ سیاهِ کم‌رنگ، تا بشود بدونِ multiply گذاشتشان */
  const d = document.createElement('canvas');
  d.width = d.height = s;
  const dc = d.getContext('2d');
  const dimg = dc.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    dimg.data[i*4] = 0; dimg.data[i*4+1] = 0; dimg.data[i*4+2] = 0;
    dimg.data[i*4+3] = 255 - img.data[i*4];
  }
  dc.putImageData(dimg, 0, 0);
  _grainDark = d;
  _ovl = null; _ovlKey = '';
  return ctx.createPattern(off, 'repeat');
}

function toStage(e) {
  const r = CV.getBoundingClientRect();
  return {
    x: (e.clientX - r.left - view.ox) / view.scale,
    y: (e.clientY - r.top - view.oy) / view.scale,
  };
}

const inRect = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
const inCircle = (p, b, pad = 0) => Math.hypot(p.x - b.x, p.y - b.y) <= b.r + pad;

/* ───────── قلم‌های کاغذبُری ───────── */

/** دایره‌ای که انگار با قیچی بریده شده. */
function wobbleCircle(cx, cy, r, seed = 0, amp = 2.2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const rr = r + Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp * .45;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** بیضیِ ناصاف — برای چیزهایی که گرد نیستند ولی نرم‌اند. */
function wobbleEllipse(cx, cy, rx, ry, rot = 0, seed = 0, amp = 2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const w = 1 + (Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp*.45) / Math.max(rx, ry);
    const px = Math.cos(a) * rx * w, py = Math.sin(a) * ry * w;
    const x = cx + px*Math.cos(rot) - py*Math.sin(rot);
    const y = cy + px*Math.sin(rot) + py*Math.cos(rot);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** مستطیلِ گِرد با گوشه‌های کمی کج. */
function wobbleRect(x, y, w, h, r = 12, seed = 0, amp = 1.6) {
  const j = (k) => (noise1(seed*9.7 + k) - .5) * amp * 2;
  ctx.beginPath();
  ctx.moveTo(x + r + j(1), y + j(2));
  ctx.lineTo(x + w - r + j(3), y + j(4));
  ctx.quadraticCurveTo(x + w + j(5), y + j(6), x + w + j(7), y + r + j(8));
  ctx.lineTo(x + w + j(9), y + h - r + j(10));
  ctx.quadraticCurveTo(x + w + j(11), y + h + j(12), x + w - r + j(13), y + h + j(14));
  ctx.lineTo(x + r + j(15), y + h + j(16));
  ctx.quadraticCurveTo(x + j(17), y + h + j(18), x + j(19), y + h - r + j(20));
  ctx.lineTo(x + j(21), y + r + j(22));
  ctx.quadraticCurveTo(x + j(23), y + j(24), x + r + j(1), y + j(2));
  ctx.closePath();
}

/** سایهٔ نرم؛ نور از بالا-چپ. */
function withShadow(blur, dy, alpha, fn, hue = '78, 46, 24') {
  ctx.save();
  ctx.shadowColor = `rgba(${hue}, ${alpha})`;
  ctx.shadowBlur = blur;
  ctx.shadowOffsetY = dy;
  ctx.shadowOffsetX = dy * .35;
  fn();
  ctx.restore();
}

/** یک برگه‌ی کاغذ با سایه — پایه‌ی همه‌ی کارت‌ها و تابلوها. */
function paper(x, y, w, h, fill, seed = 1, r = 12, shadow = .26) {
  withShadow(16, 7, shadow, () => {
    ctx.fillStyle = fill;
    wobbleRect(x, y, w, h, r, seed, 2);
    ctx.fill();
  });
  /* الیافِ کاغذ و لبهٔ روشن، تا سطح تخت نماند */
  ctx.save();
  ctx.beginPath(); wobbleRect(x, y, w, h, r, seed, 2); ctx.clip();
  ctx.globalAlpha = .5;
  ctx.fillStyle = texPaper(fill);
  ctx.fillRect(x, y, w, h);
  ctx.globalAlpha = 1;
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.4, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(90,60,20,.1)');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
}

function text(str, x, y, o = {}) {
  const size = o.size || 20;
  const fam = o.family || 'Vazirmatn';
  ctx.save();
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.font = `${fam === 'Lalezar' ? '400' : (o.weight || 700)} ${size}px "${fam}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.baseline || 'middle';
  ctx.fillStyle = o.color || '#43291b';
  ctx.direction = 'rtl';
  if (o.stroke) {
    ctx.lineWidth = o.strokeWidth || 5;
    ctx.strokeStyle = o.stroke;
    ctx.lineJoin = 'round';
    ctx.strokeText(str, x, y, o.maxWidth);
  }
  ctx.fillText(str, x, y, o.maxWidth);
  ctx.restore();
}

/** متنِ چندخطی که خودش می‌شکند. ارتفاعِ اشغال‌شده را برمی‌گرداند. */
function textWrap(str, x, y, maxW, o = {}) {
  const size = o.size || 19, lh = o.lineHeight || size * 1.7;
  ctx.font = `${o.weight || 700} ${size}px "${o.family || 'Vazirmatn'}", Tahoma, sans-serif`;
  const lines = [];
  for (const para of str.split('\n')) {
    let line = '';
    for (const wd of para.split(' ')) {
      const t = line ? line + ' ' + wd : wd;
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = wd; }
      else line = t;
    }
    lines.push(line);
  }
  lines.forEach((l, i) => text(l, x, y + i * lh, o));
  return lines.length * lh;
}

/* ───────── ذره‌ها ───────── */

class Bits {
  constructor() { this.list = []; }
  add(x, y, n, kind, colors, opts = {}) {
    for (let i = 0; i < n; i++) {
      const a = opts.dir !== undefined ? opts.dir + (Math.random()-.5) * (opts.spread || 1) : Math.random() * TAU;
      const sp = (opts.speed || 200) * (.4 + Math.random());
      this.list.push({
        kind, x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - (opts.lift || 0),
        r: (opts.size || 4) * (.5 + Math.random()),
        rot: Math.random() * TAU, vr: (Math.random()-.5) * 10,
        col: colors[(Math.random() * colors.length) | 0],
        grav: opts.grav === undefined ? 620 : opts.grav,
        drag: opts.drag || .995,
        life: (opts.life || .9) * (.6 + Math.random() * .8), age: 0,
      });
    }
  }
  confetti(x, y, n, colors) {
    this.add(x, y, n, 'flake', colors, { speed: 420, lift: 190, size: 5, life: 1.6, grav: 780 });
  }
  spark(x, y, n, colors) {
    this.add(x, y, n, 'dot', colors, { speed: 180, lift: 30, size: 3.4, life: .7, grav: 260, drag: .93 });
  }
  step(dt) {
    for (const p of this.list) {
      p.age += dt;
      p.vy += p.grav * dt;
      p.vx *= p.drag; p.vy *= p.drag;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    }
    this.list = this.list.filter((p) => p.age < p.life);
  }
  draw() {
    for (const p of this.list) {
      const k = clamp(1 - p.age / p.life, 0, 1);
      ctx.save();
      ctx.globalAlpha = k;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.col;
      if (p.kind === 'flake') ctx.fillRect(-p.r, -p.r*1.5, p.r*2, p.r*3);
      else if (p.kind === 'leaf') { wobbleEllipse(0, 0, p.r*1.8, p.r*.8, 0, p.r, .6); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(0, 0, p.r * k, 0, TAU); ctx.fill(); }
      ctx.restore();
    }
  }
  clear() { this.list.length = 0; }
}

/* ───────── صدا (بدون فایل صوتی) ───────── */

const sfx = {
  ac: null, on: true,
  _c() {
    if (!this.on) return null;
    if (!this.ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; this.ac = new A(); }
    if (this.ac.state === 'suspended') this.ac.resume();
    return this.ac;
  },
  tone(f, dur = .16, type = 'sine', gain = .13, delay = 0) {
    const c = this._c(); if (!c) return;
    const t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(t0 + dur + .04);
  },
  tap()  { this.tone(430, .07, 'triangle', .09); },
  place(){ this.tone(620, .11, 'sine', .12); },
  pop()  { this.tone(760, .09, 'sine', .11); },
  slide(){ this.tone(240, .22, 'sine', .07); },
  good() { [523, 659, 784].forEach((f,i) => this.tone(f, .22, 'sine', .13, i*.07)); },
  win()  { [523, 659, 784, 1047].forEach((f,i) => this.tone(f, .34, 'triangle', .13, i*.10)); },
  nope() { this.tone(180, .2, 'sawtooth', .07); },
  tick() { this.tone(1100, .04, 'square', .05); },
};

/* ───────── قطعه‌های آماده ───────── */

function star(x, y, r, col, rot = 0) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = col;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI/2 + i * Math.PI/5;
    const rr = i % 2 ? r * .45 : r;
    const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/** دکمهٔ کاغذی. hovered را خودِ بازی می‌دهد؛ اینجا فقط کشیده می‌شود. */
/** رنگ را روشن‌تر (k>0) یا تیره‌تر (k<0) می‌کند. */
function shade(col, k) {
  const c = String(col).trim();
  let r, g2, b2;
  if (c[0] === '#') {
    const h = c.length === 4 ? c[1]+c[1]+c[2]+c[2]+c[3]+c[3] : c.slice(1, 7);
    r = parseInt(h.slice(0,2), 16); g2 = parseInt(h.slice(2,4), 16); b2 = parseInt(h.slice(4,6), 16);
  } else {
    const m = c.match(/[\d.]+/g);
    if (!m || m.length < 3) return col;
    r = +m[0]; g2 = +m[1]; b2 = +m[2];
  }
  const f = (v) => Math.round(clamp(k < 0 ? v * (1 + k) : v + (255 - v) * k, 0, 255));
  return 'rgb(' + f(r) + ',' + f(g2) + ',' + f(b2) + ')';
}

function button(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 3 : 0;
  const fill = o.disabled ? (o.off || '#bcaa92') : (hot ? (o.hotFill || o.fill) : o.fill);
  const r = o.r === undefined ? 14 : o.r;
  /* لبهٔ زیرینِ تیره — دکمه از صفحه بیرون می‌زند */
  ctx.fillStyle = shade(fill, -.36);
  wobbleRect(b.x, b.y + dy + 7, b.w, b.h, r, b.x + b.y, 2);
  ctx.fill();
  withShadow(hot ? 22 : 14, hot ? 5 : 8, .32, () => {
    ctx.fillStyle = fill;
    wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2);
    ctx.fill();
  });
  /* حجم: روشن از بالا، تیره به پایین */
  ctx.save();
  ctx.beginPath(); wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2); ctx.clip();
  const g = ctx.createLinearGradient(0, b.y + dy, 0, b.y + dy + b.h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.45, 'rgba(255,255,255,.04)');
  g.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = g;
  ctx.fillRect(b.x, b.y + dy, b.w, b.h);
  /* برقِ باریکِ لبهٔ بالا */
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.fillRect(b.x + r, b.y + dy + 2, b.w - r * 2, 2);
  ctx.restore();
  text(label, b.x + b.w/2, b.y + b.h/2 + dy - (o.sub ? 9 : 0), {
    size: o.size || 26, color: o.color || '#fdf6e8', family: o.family || 'Lalezar',
  });
  if (o.sub) text(o.sub, b.x + b.w/2, b.y + b.h/2 + dy + 17,
    { size: 14, color: o.subColor || 'rgba(255,255,255,.88)' });
}

/** دکمهٔ گرد کوچک (مثل + و −). */
function roundButton(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 2 : 0;
  withShadow(10, hot ? 3 : 5, .3, () => {
    ctx.fillStyle = o.disabled ? '#cbbba3' : (hot ? (o.hotFill || o.fill) : o.fill);
    wobbleCircle(b.x, b.y + dy, b.r, b.x, 1.4);
    ctx.fill();
  });
  text(label, b.x, b.y + dy - 1,
    { size: o.size || 32, color: o.disabled ? '#a8988a' : (o.color || '#fdf6e8'), family: 'Lalezar' });
}

/** پرده‌ی تمام‌صفحه: برای شروعِ پرده و برای جشنِ پایان. */
function overlay(o) {
  const k = easeOut(clamp(o.t / .5, 0, 1));
  ctx.fillStyle = `rgba(30, 22, 16, ${.66 * k})`;
  ctx.fillRect(0, 0, SW, SH);

  const w = o.w || 700, h = o.h || 290;
  const x = (SW - w) / 2, y = o.y || (SH * .22);
  const s = lerp(.9, 1, easeBack(clamp(o.t / .65, 0, 1)));
  ctx.save();
  ctx.translate(SW/2, y + h/2);
  ctx.scale(s, s);
  ctx.translate(-SW/2, -(y + h/2));

  withShadow(30, 14, .42, () => {
    ctx.fillStyle = o.paper || '#fbf3e2';
    wobbleRect(x, y, w, h, 18, 121, 2.4);
    ctx.fill();
  });
  ctx.fillStyle = o.band || '#c8434f';
  wobbleRect(x, y, w, 12, 6, 123, 1);
  ctx.fill();

  if (o.icon) o.icon(SW/2, y + 56);
  text(o.title, SW/2, y + (o.icon ? 108 : 62),
    { size: o.titleSize || 36, color: o.ink || '#43291b', family: 'Lalezar', alpha: k });
  textWrap(o.body, SW/2, y + (o.icon ? 158 : 116), w - 90,
    { size: 19, color: o.inkSoft || '#8a6a52', alpha: k });
  ctx.restore();

  button(o.btn, o.btnLabel, { hot: o.btnHot, fill: o.btnFill || '#7fa356', hotFill: o.btnHotFill || '#8fb45f', size: 28 });
}

/** پیامِ کوتاهِ بالای صحنه. */
class Toast {
  constructor() { this.msg = null; this.t = 0; this.kind = 'info'; }
  say(msg, kind = 'info') { this.msg = msg; this.kind = kind; this.t = 2.6; }
  step(dt) { if (this.t > 0) { this.t -= dt; if (this.t <= 0) this.msg = null; } }
  draw(y = 24, colors = {}) {
    if (!this.msg) return;
    const k = clamp(this.t, 0, 1) * clamp((2.6 - this.t) * 5, 0, 1);
    ctx.save();
    ctx.globalAlpha = k;
    ctx.font = `700 19px "Vazirmatn", Tahoma, sans-serif`;
    const w = ctx.measureText(this.msg).width + 76;
    const fill = this.kind === 'good' ? (colors.good || '#7fa356')
               : this.kind === 'bad' ? (colors.bad || '#c8434f')
               : (colors.info || '#fbf3e2');
    paper(SW/2 - w/2, y, w, 48, fill, 151, 12, .3);
    text(this.msg, SW/2, y + 25,
      { size: 19, color: this.kind === 'info' ? (colors.ink || '#43291b') : '#fff8ec' });
    ctx.restore();
  }
}

/* ───────── آموزشِ پرده‌ای ─────────
   پرده‌هایی که منتظرِ کارِ بچه نیستند با یک ضربه جلو می‌روند. تایمر فقط
   پشتیبان است؛ بچهٔ کلاس سومی باید فرصتِ خواندن داشته باشد، نه اینکه
   متن قبل از تمام شدنِ خواندنش برود.                                    */

/** اگر پردهٔ فعلی خواندنی است، ضربه را می‌خورد و می‌رود پردهٔ بعد. */
function tutTap(tut, tapSteps, lastStep) {
  if (!tut.on || tapSteps.indexOf(tut.step) < 0) return false;
  if (tut.step >= lastStep) tut.on = false;
  else { tut.step++; tut.t = 0; }
  sfx.tap();
  return true;
}

/** نشانهٔ «برای ادامه بزن» — زیرِ کارتِ آموزش. */
function tutMore(cx, y, t, ink = '#3a2a18', bg = 'rgba(255, 250, 238, .94)') {
  ctx.save();
  ctx.globalAlpha = .62 + .38 * Math.sin(t * 3.2);
  ctx.font = '700 15px "Vazirmatn", Tahoma, sans-serif';
  const label = 'برای ادامه، هرجا را بزن';
  const w = ctx.measureText(label).width + 40, h = 32, x = cx - w / 2, r = 16;
  withShadow(10, 4, .3, () => {
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath(); ctx.fill();
  });
  text(label, cx, y + h / 2, { size: 15, color: ink });
  ctx.restore();
}

/** فونت‌ها را می‌آورد و بعد بازی را شروع می‌کند.
    مهم: هر دو راه (رسیدنِ فونت و مهلتِ پشتیبان) ممکن است برسند، ولی
    شروع فقط باید یک بار انجام شود؛ وگرنه دو حلقهٔ فریم راه می‌افتد و
    بازی دوبرابر سریع می‌شود. */
function whenFontsReady(start) {
  let done = false;
  const go = () => { if (done) return; done = true; start(); };
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('400 40px Lalezar'),
      document.fonts.load('700 20px Vazirmatn'),
      document.fonts.load('900 20px Vazirmatn'),
    ]).then(go, go);
    setTimeout(go, 2600);
  } else go();
}

/** حلقهٔ فریم با dtِ محدودشده. */
/* ───────── کیفیتِ خودکار ─────────
   اگر دستگاه کُند بود، اوّل درخشش و بعد رنگ‌بندی خاموش می‌شود تا بازی
   روان بماند. روی دستگاهِ قوی همه‌چیز روشن است. */
let QUALITY = 2;
let _fAcc = 0, _fN = 0, _qHold = 0;

function _qualityTick(gap) {
  if (gap <= 0 || gap > 200) return;
  _fAcc += gap; _fN++;
  if (_fN < 45) return;
  const avg = _fAcc / _fN;
  _fAcc = 0; _fN = 0;
  if (_qHold > 0) { _qHold--; return; }
  /* فاصلهٔ بالا و پایین باید باز باشد، وگرنه کیفیت بین دو پله بالا و
     پایین می‌پرد و بازی مدام تغییرِ ظاهر می‌دهد. */
  const before = QUALITY;
  if (avg > 21 && QUALITY > 0) { QUALITY--; _qHold = 4; }
  else if (avg < 13.5 && QUALITY < 2) { QUALITY++; _qHold = 10; }
  /* در پایین‌ترین کیفیت، صحنه را با نقطه‌های کمتر می‌کشیم */
  if (before !== QUALITY && (before === 0 || QUALITY === 0) && _refit) _refit();
}

/* یک حلقه، نه بیشتر — دو حلقه یعنی زمانِ بازی دوبرابر می‌گذرد.

   MOTION: تا پیش از این، به‌خاطرِ باگِ دو حلقه، همهٔ بازی‌ها عملاً با
   سرعتِ دو برابر اجرا می‌شدند و زمان‌بندی‌ها هم با همان حس تنظیم شده
   بودند. حالا که باگ رفع شده، سرعتِ درست (یک برابر) کُند به نظر
   می‌رسد. این ضریب جانِ حرکت‌ها را برمی‌گرداند، ولی نه تا آن دو برابرِ
   تصادفی. فقط روی جانِ حرکت اثر دارد، نه روی هیچ قانونِ علمی. */
const MOTION = 1.45;
let _looping = false;
function runLoop(step) {
  if (_looping) return;
  _looping = true;
  let last = performance.now();
  const frame = (now) => {
    const gap = now - last;
    /* بریدنِ بعد از ضرب، تا یک فریمِ کُند پرشِ بزرگ نسازد */
    const dt = Math.min(gap / 1000 * MOTION, 1/15);
    last = now;
    _qualityTick(gap);
    step(dt);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

/* ═════════════════ بازی ═════════════════ */
/* ═══════════════════════════════════════════════════════════════════════
   قلّه‌ها در مه — ریاضی سوم، فصل ۶، درس ۳ (مقایسهٔ عددها و تقریب)
   ───────────────────────────────────────────────────────────────────────
   کتاب می‌گوید برای مقایسهٔ دو عدد، اوّل رقم‌های یکان و دهگان و صدگان را
   حذف کن و به جایشان صفر بگذار، بعد مقایسه کن — و می‌پرسد «آیا با همین
   اوّلین تقریب می‌توانی مقایسه کنی؟».

   این دقیقاً یعنی «از دور نگاه کردن». پس بازی این شد:

   دیده‌بانِ کوهستانی. قلّه‌ها توی مه‌اند و روی تابلوی هر قلّه فقط همان‌قدر
   عدد پیداست که مه اجازه می‌دهد — از دورترین حالت فقط هزارگان: ۳۰۰۰.
   حلقهٔ تنظیمِ دوربین را که یک درجه جلو ببری، مه یک لایه کنار می‌رود و
   صدگان هم پیدا می‌شود: ۳۴۰۰. بعد ۳۴۲۰. بعد ۳۴۲۵.

   تا وقتی عددها یکی دیده می‌شوند، اجازهٔ اشاره کردن نداری — «از این
   فاصله فرقشان معلوم نیست». پس باید همان‌قدر جلو بروی که لازم است، نه
   بیشتر: امتیاز به کسی می‌رسد که با کمترین وضوح تصمیم بگیرد.
   ═══════════════════════════════════════════════════════════════════════ */

const SCENE_W = 1200, SCENE_H = 760;

const P = {
  sky0: '#161d33', sky1: '#3a3358', sky2: '#8a5570', sky3: '#e2925f', sky4: '#f6c98a',
  far:  '#4a4f77', mid: '#3a3f63', near: '#2a2e4c', ridge: '#1b1e33',
  snow: '#e8ecfb', snowDk: '#b9c2e0',
  fog:  '#dfe6f5',
  wood: '#7a5530', woodDk: '#4e341a', woodLt: '#a6784a',
  brass:'#cba64f', brassDk: '#8f6f28', brassLt: '#f0dc9c',
  iron: '#4a5160', ironLt: '#7d8698',
  paper:'#f7eeda', ink: '#2c2436', inkSoft: '#7d7392',
  good: '#6fa85c', bad: '#cd5b45', gold: '#eab53f',
};

const STOPS = [
  { n: 'هزارتا', d: 1000 },
  { n: 'صدتا',  d: 100 },
  { n: 'ده‌تا',  d: 10 },
  { n: 'یکی',   d: 1 },
];

const LEVELS = [
  { name: 'هوای صاف', k: 3, place: [0, 1], time: 60, quota: 4,
    hint: 'حلقهٔ دوربین را جلو ببر تا عددها از هم جدا شوند.' },
  { name: 'مهِ سبک', k: 3, place: [1, 2], time: 58, quota: 4,
    hint: 'هرچه با وضوحِ کمتری تصمیم بگیری، امتیازت بیشتر است.' },
  { name: 'مهِ غلیظ', k: 3, place: [1, 3], time: 56, quota: 5,
    hint: 'گاهی باید تا آخر جلو بروی.' },
  { name: 'سه قلّه', k: 3, place: [1, 3], three: .6, time: 54, quota: 5,
    hint: 'سه قلّه: از کوتاه‌ترین شروع کن.' },
  { name: 'تا شب', k: 3, place: [0, 3], three: .5, time: 52, endless: true,
    hint: 'تا هوا تاریک نشده، قلّه‌ها را بشناس.' },
];

const HUD_H = 52;
const RING = { x: 300, y: 664, w: 600, h: 64 };
const BTN_GO = { x: 470, y: 566, w: 260, h: 76 };

/* ───────── وضعیت ───────── */

const S = {
  phase: 'intro',
  level: 0,
  peaks: [],          // { v, x, base, h, seed, picked, wrong }
  order: [],          // ترتیبی که زده شده
  need: 0,            // کمترین وضوحِ لازم
  focus: 0,           // ۰ تا ۳
  focusA: 0,          // انیمیشنِ حلقه
  dragRing: false,
  three: false,
  solved: 0,
  timeLeft: 0,
  lamps: 3,
  cleared: 0, quota: 0,
  score: 0, best: 0, combo: 0,
  birds: [], motes: [],
  t: 0, phaseT: 0, hover: null, shake: 0, nope: 0,
  tut: { on: true, step: 0, t: 0 },
};

const bits = new Bits();
const toast = new Toast();
const L = () => LEVELS[S.level];
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

/** عدد از پشتِ مه: رقم‌های پایین‌تر حذف و صفر می‌شوند — همان کارِ کتاب. */
const seen = (v, f) => Math.floor(v / STOPS[f].d) * STOPS[f].d;

function loadBest() { try { return +localStorage.getItem('ghol-best') || 0; } catch { return 0; } }
function saveBest(v) { try { localStorage.setItem('ghol-best', String(v)); } catch { /* حالتِ خصوصی */ } }

const cv = document.getElementById('stage');
initStage(cv, SCENE_W, SCENE_H);
S.best = loadBest();
for (let i = 0; i < 6; i++) S.birds.push({ x: Math.random() * SCENE_W, y: 120 + Math.random() * 90,
  sp: 14 + Math.random() * 20, ph: Math.random() * TAU });
for (let i = 0; i < 40; i++) S.motes.push({ x: Math.random() * SCENE_W, y: 200 + Math.random() * 420,
  r: .8 + Math.random() * 1.8, sp: 5 + Math.random() * 14, ph: Math.random() * TAU });
whenFontsReady(() => runLoop(step));

/* ───────── ساختِ قلّه‌ها ───────── */

const digitsOf = (v) => [Math.floor(v / 1000) % 10, Math.floor(v / 100) % 10, Math.floor(v / 10) % 10, v % 10];
const numOf = (d) => d[0] * 1000 + d[1] * 100 + d[2] * 10 + d[3];

/** دو عدد که تا جایگاهِ d یکی‌اند و در d فرق دارند. */
function pairAt(d) {
  const a = [R(1, 9), R(0, 9), R(0, 9), R(0, 9)];
  const b = a.slice();
  let nd;
  do { nd = R(d === 0 ? 1 : 0, 9); } while (nd === a[d]);
  b[d] = nd;
  for (let i = d + 1; i < 4; i++) { a[i] = R(0, 9); b[i] = R(0, 9); }
  return [numOf(a), numOf(b)];
}

/** کمترین وضوحی که همهٔ عددها از هم جدا دیده شوند. */
function needFocus(vals) {
  for (let f = 0; f < 4; f++) {
    let ok = true;
    for (let i = 0; i < vals.length && ok; i++)
      for (let j = i + 1; j < vals.length; j++)
        if (seen(vals[i], f) === seen(vals[j], f)) { ok = false; break; }
    if (ok) return f;
  }
  return 3;
}

function newRound() {
  const lv = L();
  S.three = !!lv.three && Math.random() < lv.three;
  const d = R(lv.place[0], lv.place[1]);
  let vals;
  for (let tries = 0; tries < 60; tries++) {
    const [a, b] = pairAt(d);
    vals = [a, b];
    if (S.three) {
      /* سومی هم باید از هر دو جدا شود، ولی سختی از همان d بیشتر نشود */
      for (let t2 = 0; t2 < 60; t2++) {
        const c = numOf([R(1, 9), R(0, 9), R(0, 9), R(0, 9)]);
        if (needFocus([a, b, c]) === needFocus([a, b]) && c !== a && c !== b) { vals = [a, b, c]; break; }
      }
    }
    if (needFocus(vals) === d && new Set(vals).size === vals.length) break;
  }
  S.need = needFocus(vals);
  const n = vals.length;
  const xs = n === 2 ? [382, 818] : [278, 600, 922];
  S.peaks = vals.map((v, i) => ({
    v, x: xs[i], base: 556, h: 190 + (i * 37 % 74), seed: Math.random() * 99,
    picked: false, wrong: 0,
  }));
  /* بلندیِ تصویری نباید جوابِ عدد را لو بدهد */
  shuffleH(S.peaks);
  S.order = [];
  S.focus = 0; S.focusA = 0;
  S.solved = 0;
}

function shuffleH(ps) {
  const hs = ps.map((p) => p.h);
  for (let i = hs.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = hs[i]; hs[i] = hs[j]; hs[j] = t; }
  ps.forEach((p, i) => { p.h = hs[i]; });
}

function startLevel(i, keep) {
  const lv = LEVELS[i];
  S.level = i;
  S.cleared = 0;
  S.quota = lv.endless ? Infinity : lv.quota;
  S.combo = 0;
  S.timeLeft = lv.time;
  if (!keep) { S.score = 0; S.lamps = 3; }
  S.phase = 'play'; S.phaseT = 0;
  S.tut.on = i === 0 && !keep; S.tut.step = 0; S.tut.t = 0;
  newRound();
  toast.say(lv.hint, 'info');
}

/* ───────── حلقه ───────── */

function step(dt) {
  S.t += dt; S.phaseT += dt;
  if (S.shake > 0) S.shake -= dt;
  if (S.nope > 0) S.nope -= dt;
  S.focusA += (S.focus - S.focusA) * Math.min(1, dt * 9);
  for (const p of S.peaks) if (p.wrong > 0) p.wrong -= dt;
  for (const b of S.birds) { b.x += b.sp * dt; if (b.x > SCENE_W + 30) { b.x = -30; b.y = 110 + Math.random() * 90; } }
  for (const m of S.motes) { m.x += m.sp * dt; m.y += Math.sin(S.t + m.ph) * 6 * dt;
    if (m.x > SCENE_W + 6) m.x = -6; }

  if (S.phase === 'play') {
    const frozen = S.tut.on && S.tut.step < 2;
    if (!frozen && !S.solved) {
      S.timeLeft -= dt;
      if (S.timeLeft <= 0) { S.timeLeft = 0; loseLamp('هوا تاریک شد!'); }
    }
    if (S.solved) { S.solved += dt; if (S.solved > 1.5) newRound(); }
    if (S.tut.on) S.tut.t += dt;
  }
  bits.step(dt);
  toast.step(dt);
  draw();
}

function loseLamp(msg) {
  if (S.solved) return;
  S.lamps--;
  S.combo = 0;
  S.shake = .4;
  sfx.nope();
  toast.say(msg, 'bad');
  if (S.lamps <= 0) { S.phase = 'lost'; S.phaseT = 0; return; }
  S.timeLeft = L().time;
  newRound();
}

/** آیا از این وضوح، همهٔ قلّه‌ها از هم جدا دیده می‌شوند؟ */
const clear = () => S.focus >= S.need;

function choose(i) {
  if (S.solved) return;
  if (!clear()) {
    S.nope = .8;
    S.shake = .12;
    sfx.nope();
    toast.say('از این فاصله فرقشان معلوم نیست. حلقه را جلوتر ببر.', 'bad');
    return;
  }
  const p = S.peaks[i];
  if (p.picked) return;
  /* باید از کوتاه‌ترین به بلندترین زده شود */
  const remaining = S.peaks.filter((q) => !q.picked);
  const smallest = remaining.reduce((a, b) => (b.v < a.v ? b : a));
  if (p !== smallest) {
    p.wrong = .7;
    S.combo = 0;
    sfx.nope();
    S.lamps--;
    S.shake = .35;
    toast.say(S.three ? 'کوتاه‌ترین نبود.' : 'آن یکی بلندتر بود.', 'bad');
    if (S.lamps <= 0) { S.phase = 'lost'; S.phaseT = 0; return; }
    return;
  }
  p.picked = true;
  S.order.push(i);
  sfx.tone(420 + S.order.length * 90, .1, 'triangle', .05);
  if (S.peaks.filter((q) => !q.picked).length <= 1) {
    S.peaks.forEach((q) => { q.picked = true; });
    finish();
  }
}

function finish() {
  S.solved = .001;
  S.combo++;
  S.cleared++;
  const saved = 3 - S.focus;
  const pts = 260 + saved * 150 + Math.round(S.timeLeft * 5) + Math.min(S.combo, 6) * 70;
  S.score += pts;
  if (S.score > S.best) { S.best = S.score; saveBest(S.best); }
  bits.confetti(SCENE_W / 2, 380, 40, [P.snow, P.gold, '#fff', P.brassLt]);
  sfx.win();
  toast.say(S.focus === S.need
    ? 'با کمترین وضوح تصمیم گرفتی — آفرین!'
    : 'درست بود. با وضوحِ کمتر هم می‌شد.', S.focus === S.need ? 'good' : 'info');
  if (S.tut.on) S.tut.on = false;
  if (!L().endless && S.cleared >= S.quota) { S.score += 800; S.phase = 'won'; S.phaseT = 0; }
}

/* ───────── ورودی ───────── */

function ringKnobX() { return RING.x + 34 + (S.focusA / 3) * (RING.w - 68); }
function ringValue(px) {
  const k = clamp((px - RING.x - 34) / (RING.w - 68), 0, 1);
  return Math.round(k * 3);
}
function peakAt(p) {
  for (let i = 0; i < S.peaks.length; i++) {
    const q = S.peaks[i];
    if (Math.abs(p.x - q.x) < 118 && p.y > q.base - q.h - 96 && p.y < q.base + 20) return i;
  }
  return -1;
}

cv.addEventListener('pointermove', (e) => {
  const p = toStage(e);
  if (S.phase !== 'play') { S.hover = inRect(p, BTN_GO) ? BTN_GO : null; cv.style.cursor = S.hover ? 'pointer' : 'default'; return; }
  if (S.dragRing) {
    const v = ringValue(p.x);
    if (v !== S.focus) { S.focus = v; sfx.tone(300 + v * 70, .06, 'square', .03); }
    return;
  }
  S.hover = null;
  if (inRect(p, RING)) S.hover = 'ring';
  else if (peakAt(p) >= 0) S.hover = 'peak';
  cv.style.cursor = S.hover ? 'pointer' : 'default';
});

cv.addEventListener('pointerdown', (e) => {
  const p = toStage(e);
  if (S.phase === 'intro') { startLevel(0); return; }
  if (S.phase === 'won') {
    if (!inRect(p, BTN_GO)) return;
    if (L().endless) startLevel(S.level, true);
    else if (S.level + 1 < LEVELS.length) startLevel(S.level + 1, true);
    else startLevel(0);
    return;
  }
  if (S.phase === 'lost') { if (inRect(p, BTN_GO)) startLevel(S.level); return; }
  if (tutTap(S.tut, TUT_TAP, TUT_LAST)) return;
  if (inRect(p, RING)) {
    S.dragRing = true;
    const v = ringValue(p.x);
    if (v !== S.focus) { S.focus = v; sfx.tone(300 + v * 70, .06, 'square', .03); }
    try { cv.setPointerCapture(e.pointerId); } catch { /* بعضی مرورگرها */ }
    if (S.tut.on && S.tut.step === 1 && S.focus > 0) { S.tut.step = 2; S.tut.t = 0; }
    return;
  }
  const i = peakAt(p);
  if (i >= 0) choose(i);
});

cv.addEventListener('pointerup', () => { S.dragRing = false; });
cv.addEventListener('pointercancel', () => { S.dragRing = false; });

const TUT_TAP = [0, 2], TUT_LAST = 2;

/* ───────── ابزارِ نقاشی ───────── */

function rrPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function numText(str, x, y, o = {}) {
  ctx.save();
  ctx.font = `${o.family === 'Vazirmatn' ? (o.weight || 700) : '400'} ${o.size || 20}px "${o.family || 'Lalezar'}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  ctx.direction = 'ltr';
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  if (o.stroke) { ctx.lineWidth = o.strokeWidth || 5; ctx.lineJoin = 'round';
    ctx.strokeStyle = o.stroke; ctx.strokeText(str, x, y); }
  ctx.fillStyle = o.color || P.ink;
  ctx.fillText(str, x, y);
  ctx.restore();
}

function spot(rects, alpha) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, SCENE_W, SCENE_H);
  for (const r of rects) rrPath(r.x - 12, r.y - 12, r.w + 24, r.h + 24, 22);
  ctx.fillStyle = `rgba(10, 12, 24, ${alpha})`;
  ctx.fill('evenodd');
  ctx.restore();
}

function tutCard(x, y, w, lines, title) {
  const h = 26 + (title ? 44 : 0) + lines.length * 30;
  withShadow(24, 10, .5, () => {
    ctx.fillStyle = 'rgba(247, 238, 218, .97)';
    wobbleRect(x, y, w, h + 20, 16, 101, 2.2); ctx.fill();
  }, '6, 8, 18');
  ctx.fillStyle = P.brassDk;
  wobbleRect(x, y, w, 9, 4, 103, 1); ctx.fill();
  let yy = y + 34;
  if (title) { text(title, x + w / 2, yy + 6, { size: 25, family: 'Lalezar', color: P.ink }); yy += 44; }
  for (const l of lines) { text(l, x + w / 2, yy, { size: 18, color: '#6a6080' }); yy += 30; }
  return h + 20;
}

/** خطّ کوهستان با ارتفاعِ تصادفیِ ثابت. */
function ridge(y, amp, col, seed, step2) {
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(0, SCENE_H);
  ctx.lineTo(0, y);
  for (let x = 0; x <= SCENE_W; x += step2) {
    ctx.lineTo(x, y - Math.abs(Math.sin(x * .004 + seed)) * amp
      - Math.abs(Math.sin(x * .011 + seed * 2)) * amp * .5);
  }
  ctx.lineTo(SCENE_W, SCENE_H);
  ctx.closePath(); ctx.fill();
}

function paintSkyStatic() {
  const g = ctx.createLinearGradient(0, 0, 0, 600);
  g.addColorStop(0, P.sky0);
  g.addColorStop(.32, P.sky1);
  g.addColorStop(.6, P.sky2);
  g.addColorStop(.82, P.sky3);
  g.addColorStop(1, P.sky4);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, SCENE_W, 620);
  /* خورشیدِ پشتِ کوه */
  const sg = ctx.createRadialGradient(600, 560, 20, 600, 560, 300);
  sg.addColorStop(0, 'rgba(255, 220, 150, .5)');
  sg.addColorStop(1, 'rgba(255, 220, 150, 0)');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(600, 560, 300, 0, TAU); ctx.fill();
  ridge(470, 92, P.far, 1.3, 14);
  ridge(534, 74, P.mid, 3.1, 14);
}

/* ───────── صحنه ───────── */

function draw() {
  beginScene(P.sky0);
  ctx.save();
  if (S.shake > 0) {
    const k = S.shake * 10;
    ctx.translate(Math.sin(S.t * 55) * k, Math.cos(S.t * 43) * k * .4);
  }
  ctx.drawImage(staticLayer('sky', SCENE_W, SCENE_H, paintSkyStatic), 0, 0, SCENE_W, SCENE_H);
  drawBirds();
  drawPeaks();
  drawFog();
  drawPlates();
  drawLedge();
  drawRing();
  bits.draw();
  ctx.restore();

  drawHUD();
  if (!(S.phase === 'play' && S.tut.on)) toast.draw(HUD_H + 10, { good: P.good, bad: P.bad, info: P.paper, ink: P.ink });
  if (S.phase === 'play' && S.tut.on) drawTutorial();
  if (S.phase === 'intro') drawIntro();
  if (S.phase === 'won') drawWon();
  if (S.phase === 'lost') drawLost();
  endScene(.1, 'rgba(6, 8, 18, .5)', .4, .16);
}

function drawBirds() {
  ctx.strokeStyle = 'rgba(30, 30, 50, .35)'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
  for (const b of S.birds) {
    const f = Math.sin(S.t * 4 + b.ph) * 5;
    ctx.beginPath();
    ctx.moveTo(b.x - 9, b.y + f); ctx.quadraticCurveTo(b.x, b.y - 5, b.x + 9, b.y + f);
    ctx.stroke();
  }
}

function drawPeaks() {
  for (const p of S.peaks) {
    const top = p.base - p.h;
    ctx.save();
    /* بدنهٔ قلّه */
    const g = ctx.createLinearGradient(p.x - 130, top, p.x + 130, p.base);
    g.addColorStop(0, shade(P.near, .22));
    g.addColorStop(.45, P.near);
    g.addColorStop(1, shade(P.near, -.3));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(p.x - 152, p.base + 30);
    ctx.lineTo(p.x - 44, top + 34);
    ctx.lineTo(p.x, top);
    ctx.lineTo(p.x + 48, top + 40);
    ctx.lineTo(p.x + 156, p.base + 30);
    ctx.closePath(); ctx.fill();
    /* برفِ نوک */
    ctx.fillStyle = P.snow;
    ctx.beginPath();
    ctx.moveTo(p.x - 44, top + 34);
    ctx.lineTo(p.x, top);
    ctx.lineTo(p.x + 48, top + 40);
    ctx.lineTo(p.x + 26, top + 40);
    ctx.lineTo(p.x + 10, top + 26);
    ctx.lineTo(p.x - 12, top + 44);
    ctx.lineTo(p.x - 26, top + 32);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = P.snowDk;
    ctx.beginPath();
    ctx.moveTo(p.x, top); ctx.lineTo(p.x + 48, top + 40); ctx.lineTo(p.x + 26, top + 40);
    ctx.lineTo(p.x + 10, top + 26);
    ctx.closePath(); ctx.fill();
    /* شکافِ سنگ */
    ctx.strokeStyle = 'rgba(10, 12, 24, .3)'; ctx.lineWidth = 3;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      const sx = p.x - 60 + i * 60;
      ctx.moveTo(sx, top + 60 + i * 12);
      ctx.lineTo(sx + (noise1(p.seed + i) - .5) * 50, p.base + 10);
      ctx.stroke();
    }
    if (p.picked) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(234, 181, 63, .2)';
      ctx.beginPath();
      ctx.moveTo(p.x - 152, p.base + 30); ctx.lineTo(p.x, top); ctx.lineTo(p.x + 156, p.base + 30);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    if (p.wrong > 0) {
      ctx.save();
      ctx.globalAlpha = clamp(p.wrong, 0, 1) * .5;
      ctx.fillStyle = P.bad;
      ctx.beginPath();
      ctx.moveTo(p.x - 152, p.base + 30); ctx.lineTo(p.x, top); ctx.lineTo(p.x + 156, p.base + 30);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }
}

/** لایه‌های مه: هر درجه از حلقه، یک لایه کنار می‌رود. */
function drawFog() {
  for (let i = 0; i < 3; i++) {
    const off = clamp(S.focusA - i, 0, 1);
    const a = (1 - off) * .5;
    if (a < .01) continue;
    ctx.save();
    ctx.globalAlpha = a;
    const y = 320 + i * 78;
    const g = ctx.createLinearGradient(0, y - 60, 0, y + 92);
    g.addColorStop(0, 'rgba(223, 230, 245, 0)');
    g.addColorStop(.45, P.fog);
    g.addColorStop(1, 'rgba(223, 230, 245, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, y + 92);
    for (let x = 0; x <= SCENE_W; x += 24) {
      ctx.lineTo(x, y + Math.sin(x * .006 + S.t * .22 + i * 2) * 22 + Math.sin(x * .017 + i) * 9);
    }
    ctx.lineTo(SCENE_W, y + 92);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.save();
  ctx.fillStyle = 'rgba(240, 246, 255, .5)';
  for (const m of S.motes) {
    ctx.globalAlpha = .12 + .2 * Math.abs(Math.sin(S.t * .8 + m.ph));
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

/** تابلوی چوبیِ هر قلّه با عددی که از این فاصله پیداست. */
function drawPlates() {
  for (const p of S.peaks) {
    const top = p.base - p.h;
    const y = top - 62;
    const w = 176, h = 62, x = p.x - w / 2;
    /* پایهٔ تابلو */
    ctx.strokeStyle = P.woodDk; ctx.lineWidth = 8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(p.x, y + h); ctx.lineTo(p.x, top + 16); ctx.stroke();
    withShadow(16, 7, .4, () => {
      ctx.fillStyle = P.woodDk;
      wobbleRect(x - 5, y - 5, w + 10, h + 10, 9, p.seed, 1.6); ctx.fill();
    }, '6, 8, 18');
    ctx.fillStyle = texWood(P.wood, P.woodDk);
    wobbleRect(x, y, w, h, 7, p.seed + 3, 1.4); ctx.fill();
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, 'rgba(255,255,255,.22)');
    g.addColorStop(1, 'rgba(0,0,0,.28)');
    ctx.fillStyle = g;
    wobbleRect(x, y, w, h, 7, p.seed + 3, 1.4); ctx.fill();
    /* عدد */
    const v = seen(p.v, S.focus);
    const hidden = 3 - S.focus;
    numText(fa(v), p.x, y + h / 2 + 1,
      { size: 34, color: p.picked ? P.gold : P.paper, stroke: 'rgba(20, 16, 30, .6)', strokeWidth: 5 });
    if (hidden > 0) {
      text('؟'.repeat(hidden), p.x + 76, y + h - 12, { size: 15, color: 'rgba(247, 238, 218, .5)' });
    }
    /* پیچ‌های تابلو */
    ctx.fillStyle = P.brassDk;
    for (const sx of [x + 12, x + w - 12]) {
      ctx.beginPath(); ctx.arc(sx, y + 12, 4, 0, TAU); ctx.arc(sx, y + h - 12, 4, 0, TAU); ctx.fill();
    }
    if (p.picked) {
      ctx.save();
      ctx.globalAlpha = .7 + .3 * Math.sin(S.t * 4);
      ctx.strokeStyle = P.gold; ctx.lineWidth = 4;
      wobbleRect(x - 5, y - 5, w + 10, h + 10, 9, p.seed, 1.6); ctx.stroke();
      ctx.restore();
      numText(fa(S.order.indexOf(S.peaks.indexOf(p)) + 1), x - 22, y + h / 2,
        { size: 26, color: P.gold, stroke: 'rgba(20,16,30,.6)', strokeWidth: 5 });
    }
  }
}

/** صخرهٔ جلو و دوربینِ دیده‌بانی. */
function drawLedge() {
  ctx.fillStyle = P.ridge;
  ctx.beginPath();
  ctx.moveTo(0, SCENE_H);
  ctx.lineTo(0, 596);
  for (let x = 0; x <= SCENE_W; x += 18) {
    ctx.lineTo(x, 596 + Math.sin(x * .009 + 2) * 14 + Math.sin(x * .026) * 6);
  }
  ctx.lineTo(SCENE_W, SCENE_H);
  ctx.closePath(); ctx.fill();
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(0, SCENE_H); ctx.lineTo(0, 596);
  for (let x = 0; x <= SCENE_W; x += 18) ctx.lineTo(x, 596 + Math.sin(x * .009 + 2) * 14 + Math.sin(x * .026) * 6);
  ctx.lineTo(SCENE_W, SCENE_H); ctx.closePath(); ctx.clip();
  ctx.globalAlpha = .5;
  ctx.fillStyle = texStone('#1b1e33', '#0a0c18');
  ctx.fillRect(0, 590, SCENE_W, SCENE_H - 590);
  ctx.restore();

  /* سه‌پایه و دوربین */
  const tx = 152, ty = 592;
  ctx.strokeStyle = P.woodDk; ctx.lineWidth = 9; ctx.lineCap = 'round';
  for (const dx of [-34, 0, 34]) {
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(tx + dx, ty + 96); ctx.stroke();
  }
  ctx.save();
  ctx.translate(tx, ty - 8);
  ctx.rotate(-.22 + S.focusA * .05);
  ctx.fillStyle = shade(P.brassDk, -.4);
  ctx.beginPath(); rrPath(-16, -20, 132, 40, 20); ctx.fill();
  const bg = ctx.createLinearGradient(0, -20, 0, 20);
  bg.addColorStop(0, P.brassLt); bg.addColorStop(.4, P.brass); bg.addColorStop(1, P.brassDk);
  ctx.fillStyle = bg;
  ctx.beginPath(); rrPath(-14, -17, 128, 34, 17); ctx.fill();
  ctx.fillStyle = shade(P.brassDk, -.2);
  ctx.beginPath(); rrPath(96, -22, 30, 44, 12); ctx.fill();
  ctx.fillStyle = '#0d1424';
  ctx.beginPath(); ctx.ellipse(120, 0, 7, 19, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(160, 220, 255, .35)';
  ctx.beginPath(); ctx.ellipse(120, 0, 5, 15, 0, 0, TAU); ctx.fill();
  /* حلقهٔ تنظیم روی بدنه */
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = i < S.focusA ? P.brassLt : shade(P.brassDk, -.15);
    ctx.beginPath(); rrPath(10 + i * 26, -19, 8, 38, 4); ctx.fill();
  }
  ctx.restore();
}

/** حلقهٔ وضوح: چهار درجه، از «هزارتا» تا «یکی». */
function drawRing() {
  const b = RING;
  ctx.fillStyle = 'rgba(12, 14, 28, .72)';
  ctx.beginPath(); rrPath(b.x - 16, b.y - 34, b.w + 32, b.h + 62, 20); ctx.fill();
  ctx.strokeStyle = 'rgba(203, 166, 79, .3)'; ctx.lineWidth = 2;
  ctx.beginPath(); rrPath(b.x - 16, b.y - 34, b.w + 32, b.h + 62, 20); ctx.stroke();
  text('وضوحِ دوربین', b.x + b.w / 2, b.y - 14, { size: 16, color: 'rgba(247, 238, 218, .75)' });

  /* ریل */
  const y = b.y + b.h / 2;
  ctx.fillStyle = shade(P.brassDk, -.5);
  ctx.beginPath(); rrPath(b.x + 24, y - 9, b.w - 48, 18, 9); ctx.fill();
  const rg = ctx.createLinearGradient(0, y - 9, 0, y + 9);
  rg.addColorStop(0, shade(P.brassDk, -.15)); rg.addColorStop(1, P.brassDk);
  ctx.fillStyle = rg;
  ctx.beginPath(); rrPath(b.x + 25, y - 8, b.w - 50, 16, 8); ctx.fill();
  /* درجه‌ها */
  for (let i = 0; i < 4; i++) {
    const x = b.x + 34 + (i / 3) * (b.w - 68);
    const on = i <= S.focus;
    ctx.fillStyle = on ? P.brassLt : 'rgba(203, 166, 79, .3)';
    ctx.beginPath(); ctx.arc(x, y, 5.5, 0, TAU); ctx.fill();
    text(STOPS[i].n, x, y + 30, { size: 15, family: 'Lalezar',
      color: i === S.focus ? P.gold : 'rgba(247, 238, 218, .5)' });
    if (i === S.need && S.focus < S.need) {
      ctx.save();
      ctx.globalAlpha = .35 + .3 * Math.sin(S.t * 4);
      ctx.strokeStyle = P.snow; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, 12, 0, TAU); ctx.stroke();
      ctx.restore();
    }
  }
  /* دستگیره */
  const kx = ringKnobX();
  const gg = ctx.createRadialGradient(kx - 6, y - 8, 2, kx, y, 26);
  gg.addColorStop(0, P.brassLt); gg.addColorStop(1, P.brassDk);
  ctx.fillStyle = 'rgba(0,0,0,.4)';
  ctx.beginPath(); ctx.arc(kx, y + 4, 21, 0, TAU); ctx.fill();
  ctx.fillStyle = gg;
  ctx.beginPath(); ctx.arc(kx, y, 20, 0, TAU); ctx.fill();
  ctx.strokeStyle = shade(P.brassDk, -.3); ctx.lineWidth = 2;
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath(); ctx.moveTo(kx + i * 5, y - 10); ctx.lineTo(kx + i * 5, y + 10); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.beginPath(); ctx.ellipse(kx - 6, y - 8, 6, 3.4, -.6, 0, TAU); ctx.fill();

  /* پیامِ «فرقشان معلوم نیست» */
  if (S.nope > 0) {
    ctx.save();
    ctx.globalAlpha = clamp(S.nope, 0, 1);
    ctx.fillStyle = 'rgba(140, 40, 28, .85)';
    ctx.beginPath(); rrPath(SCENE_W / 2 - 210, 300, 420, 52, 14); ctx.fill();
    text('از این فاصله فرقشان معلوم نیست', SCENE_W / 2, 326,
      { size: 21, family: 'Lalezar', color: '#ffe0d6' });
    ctx.restore();
  }
}

function drawHUD() {
  ctx.fillStyle = 'rgba(16, 18, 34, .9)';
  ctx.fillRect(0, 0, SCENE_W, HUD_H);
  ctx.fillStyle = 'rgba(203, 166, 79, .3)';
  ctx.fillRect(0, HUD_H - 2, SCENE_W, 2);
  text(L().name, SCENE_W - 24, HUD_H / 2, { size: 23, family: 'Lalezar', color: P.paper, align: 'right' });
  for (let i = 0; i < 3; i++) {
    const x = SCENE_W - 206 - i * 32;
    ctx.save();
    ctx.globalAlpha = i < S.lamps ? 1 : .22;
    if (i < S.lamps) {
      const gg = ctx.createRadialGradient(x, HUD_H / 2, 1, x, HUD_H / 2, 16);
      gg.addColorStop(0, 'rgba(234, 181, 63, .6)');
      gg.addColorStop(1, 'rgba(234, 181, 63, 0)');
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(x, HUD_H / 2, 16, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = i < S.lamps ? P.gold : '#7d7684';
    ctx.beginPath(); rrPath(x - 8, HUD_H / 2 - 11, 16, 22, 6); ctx.fill();
    ctx.restore();
  }
  if (!L().endless) {
    numText(fa(Math.min(S.cleared, L().quota)) + ' / ' + fa(L().quota), SCENE_W / 2, HUD_H / 2, { size: 22, color: P.gold });
  } else {
    text('بی‌پایان', SCENE_W / 2, HUD_H / 2, { size: 22, family: 'Lalezar', color: P.gold });
  }
  numText(fa(S.score), 24, HUD_H / 2, { size: 25, color: P.gold, align: 'left' });
  numText('بیشترین ' + fa(S.best), 140, HUD_H / 2 + 1,
    { size: 14, color: 'rgba(247, 238, 218, .5)', align: 'left', family: 'Vazirmatn', weight: 700 });
  if (S.combo > 1) numText('×' + fa(S.combo), 248, HUD_H / 2, { size: 22, color: P.gold, align: 'left' });
  /* یادآوریِ کار */
  text(S.three ? 'از کوتاه‌ترین به بلندترین بزن' : 'روی بلندترین قلّه بزن',
    SCENE_W / 2 + 210, HUD_H / 2, { size: 15, color: 'rgba(247, 238, 218, .55)' });
}

function drawTutorial() {
  const st = S.tut.step;
  if (st === 0) {
    spot([{ x: 180, y: 150, w: 840, h: 330 }], .72);
    const h = tutCard(300, 500, 600,
      ['قلّه‌ها توی مه‌اند و از تابلوشان', 'فقط رقم‌های بالا پیداست.'], 'قلّه‌ها در مه');
    tutMore(600, 500 + h + 10, S.t, P.ink);
  } else if (st === 1) {
    spot([{ x: RING.x - 16, y: RING.y - 34, w: RING.w + 32, h: RING.h + 62 }], .7);
    tutCard(300, 250, 600, ['حلقهٔ دوربین را جلو ببر؛', 'هر درجه یک لایه مه کنار می‌رود.']);
  } else {
    spot([{ x: 180, y: 150, w: 840, h: 330 }], .68);
    const h = tutCard(280, 470, 640,
      ['تا عددها یکی دیده می‌شوند، اجازهٔ اشاره نداری.', 'ولی هرچه با وضوحِ کمتری تصمیم بگیری،',
       'امتیازت بیشتر است — پس زیادی جلو نرو.'], 'کمترین وضوح');
    tutMore(600, 470 + h + 10, S.t, P.ink);
  }
}

/* ───────── پرده‌ها ───────── */

function scopeIcon(x, y) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(-.25);
  ctx.fillStyle = P.brassDk;
  ctx.beginPath(); rrPath(-30, -13, 62, 26, 13); ctx.fill();
  ctx.fillStyle = P.brass;
  ctx.beginPath(); rrPath(-28, -11, 58, 22, 11); ctx.fill();
  ctx.fillStyle = P.brassDk;
  ctx.beginPath(); rrPath(26, -16, 20, 32, 9); ctx.fill();
  ctx.fillStyle = '#0d1424';
  ctx.beginPath(); ctx.ellipse(44, 0, 5, 14, 0, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawIntro() {
  overlay({
    t: S.phaseT, w: 760, h: 286, y: 138,
    paper: P.paper, band: P.brassDk, ink: P.ink, inkSoft: '#7d7392',
    icon: scopeIcon,
    title: 'قلّه‌ها در مه',
    body: 'از دور، تابلوی قلّه‌ها فقط رقم‌های بالا را نشان می‌دهد.\nحلقهٔ دوربین را جلو ببر تا مه کنار برود و رقم‌های بعدی پیدا شوند.\nهرچه با وضوحِ کمتری تصمیم بگیری، امتیازت بیشتر است.',
    btn: BTN_GO, btnLabel: 'دوربین را بردار', btnHot: S.hover === BTN_GO,
    btnFill: '#8f6f28', btnHotFill: '#ab8834',
  });
}

function drawWon() {
  const last = S.level + 1 >= LEVELS.length;
  overlay({
    t: S.phaseT, w: 720, h: 250, y: 160,
    paper: P.paper, band: P.gold, ink: P.ink, inkSoft: '#7d7392',
    icon: scopeIcon,
    title: L().endless ? 'شب شد' : 'همهٔ قلّه‌ها شناخته شد!',
    body: 'امتیاز: ' + fa(S.score) + (last ? '\nهمهٔ هواها را دیدی. از اوّل؟' : ''),
    btn: BTN_GO, btnLabel: last ? 'دوباره' : 'هوای بعد', btnHot: S.hover === BTN_GO,
    btnFill: '#8f6f28', btnHotFill: '#ab8834',
  });
}

function drawLost() {
  overlay({
    t: S.phaseT, w: 720, h: 250, y: 160,
    paper: P.paper, band: P.bad, ink: P.ink, inkSoft: '#7d7392',
    icon: (x, y) => { ctx.fillStyle = '#9aa2b8';
      for (let i = 0; i < 3; i++) { ctx.globalAlpha = .45 - i * .1;
        ctx.beginPath(); ctx.ellipse(x - 10 + i * 12, y - i * 9, 26 - i * 4, 10, 0, 0, TAU); ctx.fill(); }
      ctx.globalAlpha = 1; },
    title: 'مه همه‌جا را گرفت',
    body: 'امتیاز: ' + fa(S.score) + '\nاوّل رقم‌های بالا را ببین؛ اگر یکی بودند، یک درجه جلوتر برو.',
    btn: BTN_GO, btnLabel: 'دوباره', btnHot: S.hover === BTN_GO,
    btnFill: '#8f6f28', btnHotFill: '#ab8834',
  });
}
