<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#e6d5b4">
<title>ایستگاهِ بسته‌ها — تشخیصِ عمل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>
  /* صفحه نباید هیچ‌جا اسکرول یا زوم شود؛ بازی باید مثل یک برنامه رفتار کند. */
  html, body {
    margin: 0; padding: 0; background: #e6d5b4;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body {
    position: fixed; inset: 0;          /* جلوی کشیده‌شدنِ صفحه در سافاریِ گوشی */
    width: 100%; height: 100vh; height: 100dvh;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none; -webkit-touch-callout: none;
  }

  /* گوشیِ عمودی صحنه را ریز می‌کند؛ بچه باید گوشی را بچرخاند. */
  #rotate { display: none; }
  @media (orientation: portrait) and (max-width: 860px) {
    #stage { display: none; }
    #rotate {
      display: flex; position: fixed; inset: 0;
      z-index: 9;
      flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      background: #e6d5b4; color: #f6ead2;
      font: 700 20px "Vazirmatn", Tahoma, sans-serif; text-align: center; padding: 32px;
    }
    #rotate svg { animation: tilt 2.4s ease-in-out infinite; }
    @keyframes tilt { 0%, 45% { transform: rotate(0deg); } 65%, 100% { transform: rotate(-90deg); } }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="rotate">
  <svg width="86" height="126" viewBox="0 0 86 126" fill="none" aria-hidden="true">
    <rect x="3" y="3" width="80" height="120" rx="12" stroke="#e8b448" stroke-width="5"/>
    <rect x="15" y="19" width="56" height="88" rx="5" fill="#e8b448" opacity=".28"/>
    <circle cx="43" cy="115" r="4" fill="#e8b448"/>
  </svg>
  <div>گوشی را بچرخان</div>
  <div style="font-weight:400;opacity:.7;font-size:16px">این بازی خوابیده بازی می‌شود</div>
</div>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   هستهٔ مشترکِ بازی‌ها — سبک «کاغذبُری»
   ───────────────────────────────────────────────────────────────────────
   این فایل جعبه‌ابزار است، نه چارچوب: هر بازی حلقه و وضعیت خودش را دارد
   و فقط از این توابع برای کشیدن استفاده می‌کند. دلیلش این است که هر بازی
   باید حس‌وحال خودش را داشته باشد، نه اینکه همه شبیه هم دربیایند.

   قاعده‌های ثابتِ تصویری:
   • نور همیشه از بالا-چپ می‌تابد، پس سایه‌ها به پایین-راست می‌افتند.
   • هیچ لبه‌ای کاملاً صاف نیست؛ همه کمی موج دارند (انگار با قیچی بریده).
   • هیچ خاکستریِ خالصی نداریم؛ همه‌ی خنثی‌ها به گرمیِ صحنه می‌زنند.
   • یک لایه‌ی دانه‌دانه‌ی کاغذ روی کلِ تصویر ضرب می‌شود.
   ═══════════════════════════════════════════════════════════════════════ */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const FA_D = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
const fa = (n) => String(n).replace(/\d/g, (d) => FA_D[+d]);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeIn = (t) => t * t * t;
const easeInOut = (t) => (t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2);
const easeBack = (t) => 1 + 2.7 * Math.pow(t-1, 3) + 1.7 * Math.pow(t-1, 2);
const easeElastic = (t) => t === 0 || t === 1 ? t : Math.pow(2, -9*t) * Math.sin((t*10 - .75) * 2.094) + 1;

/** تصادفِ تکرارپذیر: با یک بذر همیشه همان عدد. برای اینکه تزئین‌ها هر فریم نپرند. */
function noise1(x) {
  const s = Math.sin(x * 127.1) * 43758.5453;
  return s - Math.floor(s);
}
const pick = (arr, seed) => arr[Math.floor(noise1(seed) * arr.length) % arr.length];

/* ───────── بوم و صحنهٔ ثابت ───────── */

let ctx, SW, SH, CV, _refit = null;
let view = { scale: 1, ox: 0, oy: 0, w: 0, h: 0, dpr: 1 };
let _grain = null, _grainDark = null;

function initStage(canvas, w, h) {
  CV = canvas; SW = w; SH = h;
  ctx = canvas.getContext('2d');

  /* اندازه را از خودِ بوم می‌گیریم نه از innerHeight؛ چون در سافاریِ گوشی
     نوارِ آدرس باز و بسته می‌شود و innerHeight دروغ می‌گوید. */
  const fit = () => {
    const r = canvas.getBoundingClientRect();
    const vw = Math.round(r.width), vh = Math.round(r.height);
    if (vw < 20 || vh < 20) return;
    const dpr = Math.min(devicePixelRatio || 1, QUALITY > 0 ? 2 : 1);
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    const scale = Math.min(vw / SW, vh / SH);
    view = { scale, ox: (vw - SW*scale)/2, oy: (vh - SH*scale)/2, w: vw, h: vh, dpr };
    _grain = buildGrain();
  };
  _refit = fit;
  addEventListener('resize', fit);
  /* چرخاندنِ گوشی: اندازهٔ درست چند لحظه بعد می‌رسد، پس چندبار اندازه می‌گیریم. */
  addEventListener('orientationchange', () => {
    fit(); setTimeout(fit, 140); setTimeout(fit, 460);
  });
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(canvas);

  /* صدا در گوشی فقط بعد از اوّلین لمس اجازهٔ پخش دارد. */
  const unlock = () => { sfx._c(); removeEventListener('pointerdown', unlock); removeEventListener('touchstart', unlock); };
  addEventListener('pointerdown', unlock, { passive: true });
  addEventListener('touchstart', unlock, { passive: true });
  /* نگه‌داشتنِ انگشت نباید منوی مرورگر را باز کند. */
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  fit();
  return ctx;
}

/** قابِ صحنه را باز می‌کند: بعد از این، مختصات همیشه در فضای SW×SH است. */
function beginScene(bg) {
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, view.w, view.h);
  ctx.save();
  ctx.translate(view.ox, view.oy);
  ctx.scale(view.scale, view.scale);
  ctx.beginPath();
  ctx.rect(0, 0, SW, SH);
  ctx.clip();
}

/* ───────── پوششِ پایانِ قاب ─────────
   دانه‌های کاغذ و تیرگیِ گوشه‌ها هر دو ثابت‌اند و تغییر نمی‌کنند، ولی
   قبلاً هر فریم از نو کشیده می‌شدند: یکی با «multiply» روی کلِّ صفحه و
   یکی با یک گرادیانِ شعاعیِ تازه. اندازه‌گیری نشان داد همین دو تا
   ۱۱ تا ۱۶ میلی‌ثانیه از هر فریم را می‌خوردند — بیشتر از کشیدنِ خودِ
   صحنه. حالا یک بار در یک بومِ جدا پخته می‌شوند و هر فریم فقط یک
   drawImage است.                                                       */

let _ovl = null, _ovlKey = '';

function overlayLayer(grainAlpha, vignette) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const w = Math.max(2, Math.round(SW * q)), h = Math.max(2, Math.round(SH * q));
  const key = w + 'x' + h + '|' + grainAlpha + '|' + vignette;
  if (_ovl && _ovlKey === key) return _ovl;
  let c;
  try {
    c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g2 = c.getContext('2d');
    if (!g2) return null;
    if (_grainDark && grainAlpha > 0) {
      /* همان دانه‌ها، ولی به‌جای multiply به شکلِ سیاهِ کم‌رنگ */
      g2.globalAlpha = clamp(grainAlpha * 1.15, 0, 1);
      g2.fillStyle = g2.createPattern(_grainDark, 'repeat');
      g2.fillRect(0, 0, w, h);
      g2.globalAlpha = 1;
    }
    if (vignette) {
      const g = g2.createRadialGradient(w / 2, h / 2, h * .42, w / 2, h / 2, h * 1.05);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, vignette);
      g2.fillStyle = g;
      g2.fillRect(0, 0, w, h);
    }
  } catch (e) { return null; }
  _ovl = c; _ovlKey = key;
  return c;
}

/** بافتِ کاغذ، تیرگیِ گوشه‌ها، رنگ‌بندی و درخششِ نور را می‌گذارد و قاب را می‌بندد. */
function endScene(grainAlpha = .15, vignette = 'rgba(48,28,14,.30)', bloom = .34, grade = .14) {
  /* درخششِ نور خاموش است. اندازه‌گیری نشان داد هر فریم ۲۱ میلی‌ثانیه
     می‌گیرد — بیشتر از تمامِ کارهای دیگرِ یک فریم روی هم — چون برای
     ساختنش باید کلِّ بوم دوباره خوانده شود. از آن بدتر: متنِ فارسی را
     مه‌آلود می‌کرد و خواندنش را سخت‌تر. بی‌آن، صحنه تمیزتر است. */
  bloom = 0;
  if (QUALITY < 1) { grade = 0; grainAlpha *= .5; }
  if (QUALITY < 2) grade = 0;
  if (grade > 0) {
    /* رنگ‌بندیِ نرم: بالای صحنه گرم‌تر، پایین سردتر — عمق می‌دهد */
    const g = ctx.createLinearGradient(0, 0, 0, SH);
    g.addColorStop(0, `rgba(255, 214, 150, ${grade})`);
    g.addColorStop(.55, 'rgba(255, 255, 255, 0)');
    g.addColorStop(1, `rgba(40, 60, 110, ${grade * .9})`);
    ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalCompositeOperation = 'source-over';
  }
  const ov = (grainAlpha > 0 || vignette) ? overlayLayer(grainAlpha, vignette) : null;
  if (ov) ctx.drawImage(ov, 0, 0, SW, SH);
  ctx.restore();
  bloomPass(bloom);
}

/* ───────── درخششِ نور (bloom) ─────────
   قابِ رسم‌شده را کوچک می‌کنیم، دو بار در خودش ضرب می‌کنیم تا فقط
   روشن‌ها بمانند، محوش می‌کنیم و با حالتِ «lighter» رویش می‌گذاریم.
   نتیجه: چراغ‌ها، شعله‌ها و رنگ‌های روشن نور پخش می‌کنند. */
let _bl, _blc, _bl2, _bl2c, _blNo = false, _blTick = 0;

function bloomPass(amount) {
  if (!amount || _blNo || !CV.width) return;
  /* کوچک‌کردن و بزرگ‌کردنِ دوباره، خودش محو می‌کند — از filter خیلی ارزان‌تر است */
  const W = Math.max(4, Math.round(CV.width * .2)), H = Math.max(4, Math.round(CV.height * .2));
  const W2 = Math.max(2, Math.round(W * .28)), H2 = Math.max(2, Math.round(H * .28));
  try {
    if (!_bl) {
      _bl = document.createElement('canvas'); _blc = _bl.getContext('2d');
      _bl2 = document.createElement('canvas'); _bl2c = _bl2.getContext('2d');
      if (!_blc || !_bl2c) { _blNo = true; return; }
    }
    if (_bl.width !== W || _bl.height !== H) { _bl.width = W; _bl.height = H; }
    if (_bl2.width !== W2 || _bl2.height !== H2) { _bl2.width = W2; _bl2.height = H2; }
    /* ساختنِ نور یک قاب در میان کافی است؛ گذاشتنش هر قاب. */
    _blTick = (_blTick + 1) & 1;
    if (!_blTick) {
      _blc.globalCompositeOperation = 'source-over';
      _blc.clearRect(0, 0, W, H);
      _blc.drawImage(CV, 0, 0, W, H);
      _blc.globalCompositeOperation = 'multiply';
      _blc.drawImage(_bl, 0, 0);
      _blc.drawImage(_bl, 0, 0);
      _blc.globalCompositeOperation = 'source-over';
      _bl2c.clearRect(0, 0, W2, H2);
      _bl2c.drawImage(_bl, 0, 0, W2, H2);
    }

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = amount;
    ctx.drawImage(_bl2, 0, 0, CV.width, CV.height);
    ctx.restore();
  } catch (e) { _blNo = true; }
}

/* ───────── لایهٔ ثابت ─────────
   هرچه در صحنه تکان نمی‌خورد را یک‌بار می‌کشیم و بعد فقط کپی می‌کنیم. */
const _layers = {};
function staticLayer(key, w, h, paint) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const L = _layers[key];
  if (L && L.q === q && L.w === w && L.h === h) return L.cv;
  const off = document.createElement('canvas');
  off.width = Math.max(1, Math.round(w * q));
  off.height = Math.max(1, Math.round(h * q));
  const c = off.getContext('2d');
  c.setTransform(q, 0, 0, q, 0, 0);
  const prev = ctx;
  ctx = c;
  try { paint(); } finally { ctx = prev; }
  _layers[key] = { cv: off, q, w, h };
  return off;
}

/* ───────── نورپردازی و بافت ─────────
   کارِ این‌ها این است که هیچ سطحی «تختِ یک‌رنگ» نماند. */

/** شیبِ عمودی: بالا روشن، پایین تیره. */
function vgrad(y0, y1, top, bot) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, top); g.addColorStop(1, bot);
  return g;
}

/** حجمِ کروی: نور از بالا-چپ، سایه در پایین-راست. */
function ball(cx, cy, r, lit, base, dark) {
  const g = ctx.createRadialGradient(cx - r * .38, cy - r * .42, r * .06, cx, cy, r * 1.06);
  g.addColorStop(0, lit); g.addColorStop(.45, base); g.addColorStop(1, dark);
  return g;
}

/** لبهٔ روشنِ بالا-چپِ یک مسیر — همان «rim light». */
function rim(pathFn, col, w = 2.2) {
  ctx.save();
  ctx.beginPath(); pathFn();
  ctx.clip();
  ctx.beginPath(); pathFn();
  ctx.strokeStyle = col; ctx.lineWidth = w * 2; ctx.lineJoin = 'round';
  ctx.translate(-w * .5, -w * .6);
  ctx.stroke();
  ctx.restore();
}

/** سایهٔ چسبیده به زمین — چیزها را روی سطح می‌نشاند. */
function contact(cx, cy, rx, ry, alpha = .26) {
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
  g.addColorStop(0, `rgba(20, 12, 6, ${alpha})`);
  g.addColorStop(1, 'rgba(20, 12, 6, 0)');
  ctx.save();
  ctx.fillStyle = g;
  ctx.translate(cx, cy); ctx.scale(1, ry / Math.max(rx, ry));
  ctx.beginPath(); ctx.arc(0, 0, Math.max(rx, ry), 0, TAU); ctx.fill();
  ctx.restore();
}

const _tex = {};
/** بافتِ تکرارشونده؛ یک‌بار ساخته و بعد از حافظه خوانده می‌شود. */
function texture(key, w, h, paint) {
  if (_tex[key]) return _tex[key];
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const c = off.getContext('2d');
  paint(c, w, h);
  _tex[key] = ctx.createPattern(off, 'repeat');
  return _tex[key];
}

/** رگهٔ چوب. */
function texWood(base, grain) {
  return texture('w' + base + grain, 120, 120, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = grain; c.lineWidth = 1.4;
    for (let i = 0; i < 9; i++) {
      c.globalAlpha = .18 + noise1(i * 3.1) * .3;
      c.beginPath();
      const y0 = i * 14 + noise1(i) * 6;
      c.moveTo(0, y0);
      for (let x = 0; x <= w; x += 10) c.lineTo(x, y0 + Math.sin(x * .09 + i) * 2.6);
      c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** تارِ پارچه. */
function texCloth(base, thread) {
  return texture('c' + base + thread, 16, 16, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = thread; c.lineWidth = 1; c.globalAlpha = .5;
    for (let i = 0; i < w; i += 4) {
      c.beginPath(); c.moveTo(i, 0); c.lineTo(i, h); c.stroke();
      c.beginPath(); c.moveTo(0, i); c.lineTo(w, i); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** دانه‌های سنگ. */
function texStone(base, spec) {
  return texture('s' + base + spec, 90, 90, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) {
      c.globalAlpha = .05 + noise1(i * 1.7) * .16;
      c.fillStyle = spec;
      const r = .6 + noise1(i * 5.3) * 1.9;
      c.beginPath();
      c.arc(noise1(i * 2.1) * w, noise1(i * 3.7 + 1) * h, r, 0, TAU);
      c.fill();
    }
    c.globalAlpha = 1;
  });
}

/** الیافِ کاغذ. */
function texPaper(base) {
  return texture('p' + base, 100, 100, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 130; i++) {
      c.globalAlpha = .04 + noise1(i * 2.3) * .07;
      c.strokeStyle = i % 2 ? '#ffffff' : '#5a4326';
      c.lineWidth = .9;
      const x = noise1(i * 1.3) * w, y = noise1(i * 4.1 + 2) * h;
      const a = noise1(i * 7.7) * TAU, l = 4 + noise1(i * 9.1) * 12;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

function buildGrain() {
  const s = 260;
  const off = document.createElement('canvas');
  off.width = off.height = s;
  const c = off.getContext('2d');
  const img = c.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    const v = 214 + Math.random() * 41;
    img.data[i*4] = v; img.data[i*4+1] = v; img.data[i*4+2] = v; img.data[i*4+3] = 255;
  }
  c.putImageData(img, 0, 0);
  /* همان دانه‌ها به شکلِ سیاهِ کم‌رنگ، تا بشود بدونِ multiply گذاشتشان */
  const d = document.createElement('canvas');
  d.width = d.height = s;
  const dc = d.getContext('2d');
  const dimg = dc.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    dimg.data[i*4] = 0; dimg.data[i*4+1] = 0; dimg.data[i*4+2] = 0;
    dimg.data[i*4+3] = 255 - img.data[i*4];
  }
  dc.putImageData(dimg, 0, 0);
  _grainDark = d;
  _ovl = null; _ovlKey = '';
  return ctx.createPattern(off, 'repeat');
}

function toStage(e) {
  const r = CV.getBoundingClientRect();
  return {
    x: (e.clientX - r.left - view.ox) / view.scale,
    y: (e.clientY - r.top - view.oy) / view.scale,
  };
}

const inRect = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
const inCircle = (p, b, pad = 0) => Math.hypot(p.x - b.x, p.y - b.y) <= b.r + pad;

/* ───────── قلم‌های کاغذبُری ───────── */

/** دایره‌ای که انگار با قیچی بریده شده. */
function wobbleCircle(cx, cy, r, seed = 0, amp = 2.2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const rr = r + Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp * .45;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** بیضیِ ناصاف — برای چیزهایی که گرد نیستند ولی نرم‌اند. */
function wobbleEllipse(cx, cy, rx, ry, rot = 0, seed = 0, amp = 2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const w = 1 + (Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp*.45) / Math.max(rx, ry);
    const px = Math.cos(a) * rx * w, py = Math.sin(a) * ry * w;
    const x = cx + px*Math.cos(rot) - py*Math.sin(rot);
    const y = cy + px*Math.sin(rot) + py*Math.cos(rot);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** مستطیلِ گِرد با گوشه‌های کمی کج. */
function wobbleRect(x, y, w, h, r = 12, seed = 0, amp = 1.6) {
  const j = (k) => (noise1(seed*9.7 + k) - .5) * amp * 2;
  ctx.beginPath();
  ctx.moveTo(x + r + j(1), y + j(2));
  ctx.lineTo(x + w - r + j(3), y + j(4));
  ctx.quadraticCurveTo(x + w + j(5), y + j(6), x + w + j(7), y + r + j(8));
  ctx.lineTo(x + w + j(9), y + h - r + j(10));
  ctx.quadraticCurveTo(x + w + j(11), y + h + j(12), x + w - r + j(13), y + h + j(14));
  ctx.lineTo(x + r + j(15), y + h + j(16));
  ctx.quadraticCurveTo(x + j(17), y + h + j(18), x + j(19), y + h - r + j(20));
  ctx.lineTo(x + j(21), y + r + j(22));
  ctx.quadraticCurveTo(x + j(23), y + j(24), x + r + j(1), y + j(2));
  ctx.closePath();
}

/** سایهٔ نرم؛ نور از بالا-چپ. */
function withShadow(blur, dy, alpha, fn, hue = '78, 46, 24') {
  ctx.save();
  ctx.shadowColor = `rgba(${hue}, ${alpha})`;
  ctx.shadowBlur = blur;
  ctx.shadowOffsetY = dy;
  ctx.shadowOffsetX = dy * .35;
  fn();
  ctx.restore();
}

/** یک برگه‌ی کاغذ با سایه — پایه‌ی همه‌ی کارت‌ها و تابلوها. */
function paper(x, y, w, h, fill, seed = 1, r = 12, shadow = .26) {
  withShadow(16, 7, shadow, () => {
    ctx.fillStyle = fill;
    wobbleRect(x, y, w, h, r, seed, 2);
    ctx.fill();
  });
  /* الیافِ کاغذ و لبهٔ روشن، تا سطح تخت نماند */
  ctx.save();
  ctx.beginPath(); wobbleRect(x, y, w, h, r, seed, 2); ctx.clip();
  ctx.globalAlpha = .5;
  ctx.fillStyle = texPaper(fill);
  ctx.fillRect(x, y, w, h);
  ctx.globalAlpha = 1;
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.4, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(90,60,20,.1)');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
}

function text(str, x, y, o = {}) {
  const size = o.size || 20;
  const fam = o.family || 'Vazirmatn';
  ctx.save();
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.font = `${fam === 'Lalezar' ? '400' : (o.weight || 700)} ${size}px "${fam}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.baseline || 'middle';
  ctx.fillStyle = o.color || '#43291b';
  ctx.direction = 'rtl';
  if (o.stroke) {
    ctx.lineWidth = o.strokeWidth || 5;
    ctx.strokeStyle = o.stroke;
    ctx.lineJoin = 'round';
    ctx.strokeText(str, x, y, o.maxWidth);
  }
  ctx.fillText(str, x, y, o.maxWidth);
  ctx.restore();
}

/** متنِ چندخطی که خودش می‌شکند. ارتفاعِ اشغال‌شده را برمی‌گرداند. */
function textWrap(str, x, y, maxW, o = {}) {
  const size = o.size || 19, lh = o.lineHeight || size * 1.7;
  ctx.font = `${o.weight || 700} ${size}px "${o.family || 'Vazirmatn'}", Tahoma, sans-serif`;
  const lines = [];
  for (const para of str.split('\n')) {
    let line = '';
    for (const wd of para.split(' ')) {
      const t = line ? line + ' ' + wd : wd;
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = wd; }
      else line = t;
    }
    lines.push(line);
  }
  lines.forEach((l, i) => text(l, x, y + i * lh, o));
  return lines.length * lh;
}

/* ───────── ذره‌ها ───────── */

class Bits {
  constructor() { this.list = []; }
  add(x, y, n, kind, colors, opts = {}) {
    for (let i = 0; i < n; i++) {
      const a = opts.dir !== undefined ? opts.dir + (Math.random()-.5) * (opts.spread || 1) : Math.random() * TAU;
      const sp = (opts.speed || 200) * (.4 + Math.random());
      this.list.push({
        kind, x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - (opts.lift || 0),
        r: (opts.size || 4) * (.5 + Math.random()),
        rot: Math.random() * TAU, vr: (Math.random()-.5) * 10,
        col: colors[(Math.random() * colors.length) | 0],
        grav: opts.grav === undefined ? 620 : opts.grav,
        drag: opts.drag || .995,
        life: (opts.life || .9) * (.6 + Math.random() * .8), age: 0,
      });
    }
  }
  confetti(x, y, n, colors) {
    this.add(x, y, n, 'flake', colors, { speed: 420, lift: 190, size: 5, life: 1.6, grav: 780 });
  }
  spark(x, y, n, colors) {
    this.add(x, y, n, 'dot', colors, { speed: 180, lift: 30, size: 3.4, life: .7, grav: 260, drag: .93 });
  }
  step(dt) {
    for (const p of this.list) {
      p.age += dt;
      p.vy += p.grav * dt;
      p.vx *= p.drag; p.vy *= p.drag;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    }
    this.list = this.list.filter((p) => p.age < p.life);
  }
  draw() {
    for (const p of this.list) {
      const k = clamp(1 - p.age / p.life, 0, 1);
      ctx.save();
      ctx.globalAlpha = k;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.col;
      if (p.kind === 'flake') ctx.fillRect(-p.r, -p.r*1.5, p.r*2, p.r*3);
      else if (p.kind === 'leaf') { wobbleEllipse(0, 0, p.r*1.8, p.r*.8, 0, p.r, .6); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(0, 0, p.r * k, 0, TAU); ctx.fill(); }
      ctx.restore();
    }
  }
  clear() { this.list.length = 0; }
}

/* ───────── صدا (بدون فایل صوتی) ───────── */

const sfx = {
  ac: null, on: true,
  _c() {
    if (!this.on) return null;
    if (!this.ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; this.ac = new A(); }
    if (this.ac.state === 'suspended') this.ac.resume();
    return this.ac;
  },
  tone(f, dur = .16, type = 'sine', gain = .13, delay = 0) {
    const c = this._c(); if (!c) return;
    const t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(t0 + dur + .04);
  },
  tap()  { this.tone(430, .07, 'triangle', .09); },
  place(){ this.tone(620, .11, 'sine', .12); },
  pop()  { this.tone(760, .09, 'sine', .11); },
  slide(){ this.tone(240, .22, 'sine', .07); },
  good() { [523, 659, 784].forEach((f,i) => this.tone(f, .22, 'sine', .13, i*.07)); },
  win()  { [523, 659, 784, 1047].forEach((f,i) => this.tone(f, .34, 'triangle', .13, i*.10)); },
  nope() { this.tone(180, .2, 'sawtooth', .07); },
  tick() { this.tone(1100, .04, 'square', .05); },
};

/* ───────── قطعه‌های آماده ───────── */

function star(x, y, r, col, rot = 0) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = col;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI/2 + i * Math.PI/5;
    const rr = i % 2 ? r * .45 : r;
    const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/** دکمهٔ کاغذی. hovered را خودِ بازی می‌دهد؛ اینجا فقط کشیده می‌شود. */
/** رنگ را روشن‌تر (k>0) یا تیره‌تر (k<0) می‌کند. */
function shade(col, k) {
  const c = String(col).trim();
  let r, g2, b2;
  if (c[0] === '#') {
    const h = c.length === 4 ? c[1]+c[1]+c[2]+c[2]+c[3]+c[3] : c.slice(1, 7);
    r = parseInt(h.slice(0,2), 16); g2 = parseInt(h.slice(2,4), 16); b2 = parseInt(h.slice(4,6), 16);
  } else {
    const m = c.match(/[\d.]+/g);
    if (!m || m.length < 3) return col;
    r = +m[0]; g2 = +m[1]; b2 = +m[2];
  }
  const f = (v) => Math.round(clamp(k < 0 ? v * (1 + k) : v + (255 - v) * k, 0, 255));
  return 'rgb(' + f(r) + ',' + f(g2) + ',' + f(b2) + ')';
}

function button(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 3 : 0;
  const fill = o.disabled ? (o.off || '#bcaa92') : (hot ? (o.hotFill || o.fill) : o.fill);
  const r = o.r === undefined ? 14 : o.r;
  /* لبهٔ زیرینِ تیره — دکمه از صفحه بیرون می‌زند */
  ctx.fillStyle = shade(fill, -.36);
  wobbleRect(b.x, b.y + dy + 7, b.w, b.h, r, b.x + b.y, 2);
  ctx.fill();
  withShadow(hot ? 22 : 14, hot ? 5 : 8, .32, () => {
    ctx.fillStyle = fill;
    wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2);
    ctx.fill();
  });
  /* حجم: روشن از بالا، تیره به پایین */
  ctx.save();
  ctx.beginPath(); wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2); ctx.clip();
  const g = ctx.createLinearGradient(0, b.y + dy, 0, b.y + dy + b.h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.45, 'rgba(255,255,255,.04)');
  g.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = g;
  ctx.fillRect(b.x, b.y + dy, b.w, b.h);
  /* برقِ باریکِ لبهٔ بالا */
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.fillRect(b.x + r, b.y + dy + 2, b.w - r * 2, 2);
  ctx.restore();
  text(label, b.x + b.w/2, b.y + b.h/2 + dy - (o.sub ? 9 : 0), {
    size: o.size || 26, color: o.color || '#fdf6e8', family: o.family || 'Lalezar',
  });
  if (o.sub) text(o.sub, b.x + b.w/2, b.y + b.h/2 + dy + 17,
    { size: 14, color: o.subColor || 'rgba(255,255,255,.88)' });
}

/** دکمهٔ گرد کوچک (مثل + و −). */
function roundButton(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 2 : 0;
  withShadow(10, hot ? 3 : 5, .3, () => {
    ctx.fillStyle = o.disabled ? '#cbbba3' : (hot ? (o.hotFill || o.fill) : o.fill);
    wobbleCircle(b.x, b.y + dy, b.r, b.x, 1.4);
    ctx.fill();
  });
  text(label, b.x, b.y + dy - 1,
    { size: o.size || 32, color: o.disabled ? '#a8988a' : (o.color || '#fdf6e8'), family: 'Lalezar' });
}

/** پرده‌ی تمام‌صفحه: برای شروعِ پرده و برای جشنِ پایان. */
function overlay(o) {
  const k = easeOut(clamp(o.t / .5, 0, 1));
  ctx.fillStyle = `rgba(30, 22, 16, ${.66 * k})`;
  ctx.fillRect(0, 0, SW, SH);

  const w = o.w || 700, h = o.h || 290;
  const x = (SW - w) / 2, y = o.y || (SH * .22);
  const s = lerp(.9, 1, easeBack(clamp(o.t / .65, 0, 1)));
  ctx.save();
  ctx.translate(SW/2, y + h/2);
  ctx.scale(s, s);
  ctx.translate(-SW/2, -(y + h/2));

  withShadow(30, 14, .42, () => {
    ctx.fillStyle = o.paper || '#fbf3e2';
    wobbleRect(x, y, w, h, 18, 121, 2.4);
    ctx.fill();
  });
  ctx.fillStyle = o.band || '#c8434f';
  wobbleRect(x, y, w, 12, 6, 123, 1);
  ctx.fill();

  if (o.icon) o.icon(SW/2, y + 56);
  text(o.title, SW/2, y + (o.icon ? 108 : 62),
    { size: o.titleSize || 36, color: o.ink || '#43291b', family: 'Lalezar', alpha: k });
  textWrap(o.body, SW/2, y + (o.icon ? 158 : 116), w - 90,
    { size: 19, color: o.inkSoft || '#8a6a52', alpha: k });
  ctx.restore();

  button(o.btn, o.btnLabel, { hot: o.btnHot, fill: o.btnFill || '#7fa356', hotFill: o.btnHotFill || '#8fb45f', size: 28 });
}

/** پیامِ کوتاهِ بالای صحنه. */
class Toast {
  constructor() { this.msg = null; this.t = 0; this.kind = 'info'; }
  say(msg, kind = 'info') { this.msg = msg; this.kind = kind; this.t = 2.6; }
  step(dt) { if (this.t > 0) { this.t -= dt; if (this.t <= 0) this.msg = null; } }
  draw(y = 24, colors = {}) {
    if (!this.msg) return;
    const k = clamp(this.t, 0, 1) * clamp((2.6 - this.t) * 5, 0, 1);
    ctx.save();
    ctx.globalAlpha = k;
    ctx.font = `700 19px "Vazirmatn", Tahoma, sans-serif`;
    const w = ctx.measureText(this.msg).width + 76;
    const fill = this.kind === 'good' ? (colors.good || '#7fa356')
               : this.kind === 'bad' ? (colors.bad || '#c8434f')
               : (colors.info || '#fbf3e2');
    paper(SW/2 - w/2, y, w, 48, fill, 151, 12, .3);
    text(this.msg, SW/2, y + 25,
      { size: 19, color: this.kind === 'info' ? (colors.ink || '#43291b') : '#fff8ec' });
    ctx.restore();
  }
}

/* ───────── آموزشِ پرده‌ای ─────────
   پرده‌هایی که منتظرِ کارِ بچه نیستند با یک ضربه جلو می‌روند. تایمر فقط
   پشتیبان است؛ بچهٔ کلاس سومی باید فرصتِ خواندن داشته باشد، نه اینکه
   متن قبل از تمام شدنِ خواندنش برود.                                    */

/** اگر پردهٔ فعلی خواندنی است، ضربه را می‌خورد و می‌رود پردهٔ بعد. */
function tutTap(tut, tapSteps, lastStep) {
  if (!tut.on || tapSteps.indexOf(tut.step) < 0) return false;
  if (tut.step >= lastStep) tut.on = false;
  else { tut.step++; tut.t = 0; }
  sfx.tap();
  return true;
}

/** نشانهٔ «برای ادامه بزن» — زیرِ کارتِ آموزش. */
function tutMore(cx, y, t, ink = '#3a2a18', bg = 'rgba(255, 250, 238, .94)') {
  ctx.save();
  ctx.globalAlpha = .62 + .38 * Math.sin(t * 3.2);
  ctx.font = '700 15px "Vazirmatn", Tahoma, sans-serif';
  const label = 'برای ادامه، هرجا را بزن';
  const w = ctx.measureText(label).width + 40, h = 32, x = cx - w / 2, r = 16;
  withShadow(10, 4, .3, () => {
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath(); ctx.fill();
  });
  text(label, cx, y + h / 2, { size: 15, color: ink });
  ctx.restore();
}

/** فونت‌ها را می‌آورد و بعد بازی را شروع می‌کند.
    مهم: هر دو راه (رسیدنِ فونت و مهلتِ پشتیبان) ممکن است برسند، ولی
    شروع فقط باید یک بار انجام شود؛ وگرنه دو حلقهٔ فریم راه می‌افتد و
    بازی دوبرابر سریع می‌شود. */
function whenFontsReady(start) {
  let done = false;
  const go = () => { if (done) return; done = true; start(); };
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('400 40px Lalezar'),
      document.fonts.load('700 20px Vazirmatn'),
      document.fonts.load('900 20px Vazirmatn'),
    ]).then(go, go);
    setTimeout(go, 2600);
  } else go();
}

/** حلقهٔ فریم با dtِ محدودشده. */
/* ───────── کیفیتِ خودکار ─────────
   اگر دستگاه کُند بود، اوّل درخشش و بعد رنگ‌بندی خاموش می‌شود تا بازی
   روان بماند. روی دستگاهِ قوی همه‌چیز روشن است. */
let QUALITY = 2;
let _fAcc = 0, _fN = 0, _qHold = 0;

function _qualityTick(gap) {
  if (gap <= 0 || gap > 200) return;
  _fAcc += gap; _fN++;
  if (_fN < 45) return;
  const avg = _fAcc / _fN;
  _fAcc = 0; _fN = 0;
  if (_qHold > 0) { _qHold--; return; }
  /* فاصلهٔ بالا و پایین باید باز باشد، وگرنه کیفیت بین دو پله بالا و
     پایین می‌پرد و بازی مدام تغییرِ ظاهر می‌دهد. */
  const before = QUALITY;
  if (avg > 21 && QUALITY > 0) { QUALITY--; _qHold = 4; }
  else if (avg < 13.5 && QUALITY < 2) { QUALITY++; _qHold = 10; }
  /* در پایین‌ترین کیفیت، صحنه را با نقطه‌های کمتر می‌کشیم */
  if (before !== QUALITY && (before === 0 || QUALITY === 0) && _refit) _refit();
}

/* یک حلقه، نه بیشتر — دو حلقه یعنی زمانِ بازی دوبرابر می‌گذرد.

   MOTION: تا پیش از این، به‌خاطرِ باگِ دو حلقه، همهٔ بازی‌ها عملاً با
   سرعتِ دو برابر اجرا می‌شدند و زمان‌بندی‌ها هم با همان حس تنظیم شده
   بودند. حالا که باگ رفع شده، سرعتِ درست (یک برابر) کُند به نظر
   می‌رسد. این ضریب جانِ حرکت‌ها را برمی‌گرداند، ولی نه تا آن دو برابرِ
   تصادفی. فقط روی جانِ حرکت اثر دارد، نه روی هیچ قانونِ علمی. */
const MOTION = 1.45;
let _looping = false;
function runLoop(step) {
  if (_looping) return;
  _looping = true;
  let last = performance.now();
  const frame = (now) => {
    const gap = now - last;
    /* بریدنِ بعد از ضرب، تا یک فریمِ کُند پرشِ بزرگ نسازد */
    const dt = Math.min(gap / 1000 * MOTION, 1/15);
    last = now;
    _qualityTick(gap);
    step(dt);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

/* ═════════════════ بازی ═════════════════ */
/* ═══════════════════════════════════════════════════════════════════════
   ایستگاهِ بسته‌ها — ریاضی سوم، فصل ۶، درس ۱ (حلّ مسئله)
   ───────────────────────────────────────────────────────────────────────
   کتاب صریح می‌گوید: «در مسئله‌های زیر فقط نوعِ عمل را تشخیص دهید؛ به
   دست آوردن جواب لازم نیست.» و بعد راهش را هم می‌گوید: «گاهی تغییرِ
   عددها کمک می‌کند راهِ حل را تشخیص دهی.»

   پس بازی این شد: در ایستگاهِ پستی کار می‌کنی. بسته‌ها روی نوار می‌آیند
   و روی هرکدام یک مسئله نوشته شده. باید هر بسته را توی سُرسرهٔ درست
   بیندازی: جمع، تفریق، ضرب، تقسیم. هیچ‌وقت چیزی حساب نمی‌کنی.

   و یک ابزار داری: «ذرّه‌بینِ ساده‌ساز». هر وقت رویش بزنی، عددهای گندهٔ
   بسته کوچک می‌شوند — ۳۶۵ می‌شود ۳ و ۲۴ می‌شود ۲ — و آن‌وقت شکلِ مسئله
   پیدا می‌شود. همان کاری که کتاب می‌خواهد یاد بدهد، ولی به دستِ خودت.

   نوار می‌آید و می‌آید. اگر بسته‌ها تلنبار شوند، ایستگاه قفل می‌کند.
   ═══════════════════════════════════════════════════════════════════════ */

const LEVELS = [
  { name: 'نوبتِ صبح', ops: [0, 1], gap: 7.5, cap: 4, quota: 8,
    hint: 'بسته را توی سُرسرهٔ درست بینداز. اگر گیج شدی، ذرّه‌بین را بزن.' },
  { name: 'بارِ ظهر', ops: [0, 1, 2], gap: 6.6, cap: 4, quota: 10,
    hint: 'ضرب هم آمد. «هر ... چند تا» را ببین.' },
  { name: 'شلوغیِ عصر', ops: [0, 1, 2, 3], gap: 6, cap: 5, quota: 12,
    hint: 'هر چهار سُرسره باز است.' },
  { name: 'قطارِ شب', ops: [0, 1, 2, 3], gap: 5, cap: 5, quota: 14,
    hint: 'بسته‌ها تندتر می‌آیند.' },
  { name: 'تا صبح', ops: [0, 1, 2, 3], gap: 4.6, cap: 6, endless: true,
    hint: 'تا وقتی نوار قفل نکرده، بسته‌ها را بفرست.' },

const HUD_H = 52;
const BELT = { x: 0, y: 110, w: SCENE_W, h: 112 };
const CARD = { x: 292, y: 246, w: 616, h: 176 };
const LENS = { x: 940, y: 260, w: 172, h: 148 };
const CHUTE_Y = 452, CHUTE_H = 250;
const BTN_GO = { x: 470, y: 566, w: 260, h: 76 };

/* ───────── وضعیت ───────── */

const S = {
  phase: 'intro',
  level: 0,
  queue: [],           // { st, a, b, x, small, id }
  spawnT: 0,
  small: false,
  fly: null,           // بستهٔ در حالِ افتادن توی سُرسره
  chuteT: [0, 0, 0, 0],
  wrong: 0,
  jam: 0,
  lives: 3,
  cleared: 0, quota: 0,
  score: 0, best: 0, combo: 0,
  lensT: 0,
  t: 0, phaseT: 0, hover: null, shake: 0,
  tut: { on: true, step: 0, t: 0 },
};

const bits = new Bits();
const toast = new Toast();
const L = () => LEVELS[S.level];
let nextId = 1;

function loadBest() { try { return +localStorage.getItem('baste-best') || 0; } catch { return 0; } }
function saveBest(v) { try { localStorage.setItem('baste-best', String(v)); } catch { /* حالتِ خصوصی */ } }

const cv = document.getElementById('stage');
initStage(cv, SCENE_W, SCENE_H);
S.best = loadBest();
whenFontsReady(() => runLoop(step));

const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

function makeParcel() {
  const ops = L().ops;
  const op = ops[Math.floor(Math.random() * ops.length)];
  const pool = STORIES.filter((q) => q.op === op);
  const st = pool[Math.floor(Math.random() * pool.length)];
  let a, b;
  if (st.mul) { b = R(st.B[0], st.B[1]); a = b * R(st.mul[0], st.mul[1]); }
  else { a = R(st.A[0], st.A[1]); b = R(st.B[0], st.B[1]); }
  if (st.op === 1 && b >= a) b = Math.max(1, Math.floor(a / 2));
  return { st, a, b, id: nextId++, x: SCENE_W + 160, t: 0 };
}

function startLevel(i, keep) {
  const lv = LEVELS[i];
  S.level = i;
  S.queue = [];
  S.spawnT = .6;
  S.small = false;
  S.fly = null;
  S.wrong = 0; S.jam = 0;
  S.cleared = 0;
  S.quota = lv.endless ? Infinity : lv.quota;
  S.combo = 0;
  if (!keep) { S.score = 0; S.lives = 3; }
  S.phase = 'play'; S.phaseT = 0;
  S.tut.on = i === 0 && !keep; S.tut.step = 0; S.tut.t = 0;
  /* اوّلین بسته را همین حالا می‌گذاریم؛ وگرنه در آموزش نوار خالی می‌ماند
     و پردهٔ «روی سُرسره بزن» هیچ‌وقت رد نمی‌شود. */
  S.queue.push(makeParcel());
  S.queue[0].x = 0;
  toast.say(lv.hint, 'info');
}

/* ───────── حلقه ───────── */

const front = () => S.queue[0] || null;

function step(dt) {
  S.t += dt; S.phaseT += dt;
  if (S.shake > 0) S.shake -= dt;
  if (S.wrong > 0) S.wrong -= dt;
  if (S.jam > 0) S.jam -= dt;
  if (S.lensT > 0) S.lensT -= dt;
  for (let i = 0; i < 4; i++) if (S.chuteT[i] > 0) S.chuteT[i] -= dt;

  if (S.phase === 'play') {
    const frozen = S.tut.on && S.tut.step < 2;
    if (!S.queue.length) { S.queue.push(makeParcel()); S.spawnT = L().gap; }
    else if (!frozen) {
      S.spawnT -= dt;
      if (S.spawnT <= 0) {
        S.queue.push(makeParcel());
        S.spawnT = L().gap;
        if (S.queue.length > L().cap) jam();
      }
    }
    /* بسته‌ها روی نوار سُر می‌خورند تا جای خودشان */
    for (let i = 0; i < S.queue.length; i++) {
      const q = S.queue[i];
      const tx = i === 0 ? -400 : SCENE_W - 130 - (i - 1) * 150;
      if (i === 0) q.x += (0 - q.x) * Math.min(1, dt * 6);
      else q.x += (tx - q.x) * Math.min(1, dt * 5);
      q.t += dt;
    }
    if (S.tut.on) S.tut.t += dt;
  }
  if (S.fly) {
    S.fly.t += dt;
    if (S.fly.t > .55) S.fly = null;
  }
  bits.step(dt);
  toast.step(dt);
  draw();
}

function jam() {
  S.lives--;
  S.combo = 0;
  S.jam = 1;
  S.shake = .5;
  sfx.nope();
  toast.say('نوار قفل کرد! بسته‌ها تلنبار شدند.', 'bad');
  S.queue = S.queue.slice(0, 2);
  S.small = false;
  if (S.lives <= 0) { S.phase = 'lost'; S.phaseT = 0; }
}

function chuteBox(i) {
  const w = 262, gap = 20;
  const total = 4 * w + 3 * gap;
  return { x: (SCENE_W - total) / 2 + i * (w + gap), y: CHUTE_Y, w, h: CHUTE_H };
}

function send(i) {
  const q = front();
  if (!q || S.fly) return;
  const box = chuteBox(i);
  if (q.st.op === i) {
    S.queue.shift();
    S.small = false;
    S.fly = { q, t: 0, to: i, ok: true };
    S.chuteT[i] = .7;
    S.combo++;
    S.cleared++;
    const pts = 160 + Math.min(S.combo, 8) * 45;
    S.score += pts;
    if (S.score > S.best) { S.best = S.score; saveBest(S.best); }
    bits.confetti(box.x + box.w / 2, box.y + 60, 26, [OPS[i].c, P.gold, '#fff', P.crateLt]);
    sfx.good();
    if (S.tut.on && S.tut.step === 1) { S.tut.step = 2; S.tut.t = 0; }
    if (!L().endless && S.cleared >= S.quota) { S.score += 700; S.phase = 'won'; S.phaseT = 0; }
  } else {
    S.combo = 0;
    S.wrong = .8;
    S.shake = .2;
    S.chuteT[i] = .5;
    sfx.nope();
    /* بسته برمی‌گردد تهِ نوار — فرصتِ دوباره، ولی وقت می‌رود */
    S.queue.shift();
    q.x = SCENE_W + 120;
    S.queue.push(q);
    S.small = false;
    if (S.queue.length > L().cap) jam();
  }
}

/* ───────── ورودی ───────── */

cv.addEventListener('pointermove', (e) => {
  const p = toStage(e);
  if (S.phase !== 'play') { S.hover = inRect(p, BTN_GO) ? BTN_GO : null; cv.style.cursor = S.hover ? 'pointer' : 'default'; return; }
  S.hover = null;
  for (let i = 0; i < 4; i++) if (inRect(p, chuteBox(i))) S.hover = i;
  if (inRect(p, LENS)) S.hover = 'lens';
  cv.style.cursor = S.hover !== null ? 'pointer' : 'default';
});

cv.addEventListener('pointerdown', (e) => {
  const p = toStage(e);
  if (S.phase === 'intro') { startLevel(0); return; }
  if (S.phase === 'won') {
    if (!inRect(p, BTN_GO)) return;
    if (L().endless) startLevel(S.level, true);
    else if (S.level + 1 < LEVELS.length) startLevel(S.level + 1, true);
    else startLevel(0);
    return;
  }
  if (S.phase === 'lost') { if (inRect(p, BTN_GO)) startLevel(S.level); return; }
  if (tutTap(S.tut, TUT_TAP, TUT_LAST)) return;
  if (inRect(p, LENS)) {
    if (!front()) return;
    S.small = !S.small;
    S.lensT = .5;
    sfx.tone(S.small ? 620 : 380, .12, 'triangle', .05);
    return;
  }
  for (let i = 0; i < 4; i++) if (inRect(p, chuteBox(i))) { send(i); return; }
});

const TUT_TAP = [0, 2], TUT_LAST = 2;

/* ───────── ابزارِ نقاشی ───────── */

function rrPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function numText(str, x, y, o = {}) {
  ctx.save();
  ctx.font = `${o.family === 'Vazirmatn' ? (o.weight || 700) : '400'} ${o.size || 20}px "${o.family || 'Lalezar'}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  ctx.direction = 'ltr';
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  if (o.stroke) { ctx.lineWidth = o.strokeWidth || 5; ctx.lineJoin = 'round';
    ctx.strokeStyle = o.stroke; ctx.strokeText(str, x, y); }
  ctx.fillStyle = o.color || P.ink;
  ctx.fillText(str, x, y);
  ctx.restore();
}

function spot(rects, alpha) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, SCENE_W, SCENE_H);
  for (const r of rects) rrPath(r.x - 12, r.y - 12, r.w + 24, r.h + 24, 22);
  ctx.fillStyle = `rgba(40, 28, 12, ${alpha})`;
  ctx.fill('evenodd');
  ctx.restore();
}

function tutCard(x, y, w, lines, title) {
  const h = 26 + (title ? 44 : 0) + lines.length * 30;
  withShadow(24, 10, .4, () => {
    ctx.fillStyle = 'rgba(253, 247, 234, .97)';
    wobbleRect(x, y, w, h + 20, 16, 101, 2.2); ctx.fill();
  }, '60, 40, 10');
  ctx.fillStyle = P.brassDk;
  wobbleRect(x, y, w, 9, 4, 103, 1); ctx.fill();
  let yy = y + 34;
  if (title) { text(title, x + w / 2, yy + 6, { size: 25, family: 'Lalezar', color: P.ink }); yy += 44; }
  for (const l of lines) { text(l, x + w / 2, yy, { size: 18, color: '#6d5c3c' }); yy += 30; }
  return h + 20;
}

/** متنِ مسئله با عددهای بزرگ یا کوچک. */
function storyText(q, small) {
  const a = small ? q.st.s[0] : q.a, b = small ? q.st.s[1] : q.b;
  return q.st.t.replace('{a}', fa(a)).replace('{b}', fa(b));
}

/* ───────── صحنه ───────── */

function draw() {
  beginScene(P.wall);
  ctx.save();
  if (S.shake > 0) {
    const k = S.shake * 10;
    ctx.translate(Math.sin(S.t * 55) * k, Math.cos(S.t * 43) * k * .4);
  }
  drawRoom();
  drawBelt();
  drawChutes();
  drawCard();
  drawLens();
  drawFly();
  bits.draw();
  ctx.restore();

  drawHUD();
  if (!(S.phase === 'play' && S.tut.on)) toast.draw(HUD_H + 10, { good: P.good, bad: P.bad, info: P.paper, ink: P.ink });
  if (S.phase === 'play' && S.tut.on) drawTutorial();
  if (S.phase === 'intro') drawIntro();
  if (S.phase === 'won') drawWon();
  if (S.phase === 'lost') drawLost();
  endScene(.1, 'rgba(6, 10, 14, .5)', .4, .16);
}

/** هرچه در اتاق تکان نمی‌خورد، یک‌بار کشیده و بعد فقط کپی می‌شود. */
function paintRoomStatic() {
  const g = ctx.createLinearGradient(0, HUD_H, 0, 470);
  g.addColorStop(0, P.wallLo);
  g.addColorStop(.5, P.wall);
  g.addColorStop(1, P.wallHi);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, SCENE_W, 470);
  ctx.save();
  ctx.globalAlpha = .5;
  ctx.fillStyle = texStone(P.wall, '#0e1418');
  ctx.fillRect(0, HUD_H, SCENE_W, 470 - HUD_H);
  ctx.restore();
  /* ورقهٔ کرکره‌ای */
  ctx.save();
  ctx.globalAlpha = .3;
  const lg = ctx.createLinearGradient(0, 0, 34, 0);
  lg.addColorStop(0, 'rgba(0,0,0,.42)');
  lg.addColorStop(.5, 'rgba(255,255,255,.13)');
  lg.addColorStop(1, 'rgba(0,0,0,.42)');
  for (let x = 0; x < SCENE_W; x += 34) {
    ctx.save();
    ctx.translate(x, 0);
    ctx.fillStyle = lg;
    ctx.fillRect(0, HUD_H, 34, 470 - HUD_H);
    ctx.restore();
  }
  ctx.restore();
  /* لوله‌های سقف */
  for (const py of [86, 104]) {
    ctx.fillStyle = P.pipeDk; ctx.fillRect(0, py, SCENE_W, 13);
    ctx.fillStyle = P.pipe; ctx.fillRect(0, py, SCENE_W, 9);
    ctx.fillStyle = P.pipeLt; ctx.fillRect(0, py + 1, SCENE_W, 2);
    for (let x = 40; x < SCENE_W; x += 190) {
      ctx.fillStyle = P.frameDk; ctx.fillRect(x, py - 3, 14, 19);
      ctx.fillStyle = P.frame; ctx.fillRect(x + 2, py - 3, 10, 17);
    }
  }
  /* میزِ چوبی */
  ctx.fillStyle = P.tableDk;
  ctx.fillRect(0, 462, SCENE_W, SCENE_H - 462);
  ctx.fillStyle = texWood(P.table, P.tableDk);
  ctx.fillRect(0, 470, SCENE_W, SCENE_H - 470);
  const tg = ctx.createLinearGradient(0, 470, 0, SCENE_H);
  tg.addColorStop(0, 'rgba(255, 220, 160, .22)');
  tg.addColorStop(.4, 'rgba(0,0,0,0)');
  tg.addColorStop(1, 'rgba(0,0,0,.34)');
  ctx.fillStyle = tg;
  ctx.fillRect(0, 470, SCENE_W, SCENE_H - 470);
  ctx.fillStyle = P.tableLt;
  ctx.fillRect(0, 470, SCENE_W, 3);
  /* بدنهٔ چراغ‌ها و مخروطِ نور */
  for (const lx of [330, 870]) {
    ctx.strokeStyle = P.pipeDk; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(lx, 110); ctx.lineTo(lx, 150); ctx.stroke();
    ctx.fillStyle = P.frameDk;
    ctx.beginPath();
    ctx.moveTo(lx - 34, 182); ctx.lineTo(lx - 12, 150); ctx.lineTo(lx + 12, 150); ctx.lineTo(lx + 34, 182);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = P.frame;
    ctx.beginPath();
    ctx.moveTo(lx - 30, 178); ctx.lineTo(lx - 10, 152); ctx.lineTo(lx + 10, 152); ctx.lineTo(lx + 30, 178);
    ctx.closePath(); ctx.fill();
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const cg = ctx.createLinearGradient(0, 184, 0, SCENE_H);
    cg.addColorStop(0, 'rgba(150, 118, 62, .5)');
    cg.addColorStop(.55, 'rgba(96, 74, 38, .22)');
    cg.addColorStop(1, 'rgba(60, 46, 22, 0)');
    ctx.fillStyle = cg;
    for (const k of [1, .72, .44]) {
      ctx.globalAlpha = k * .42;
      ctx.beginPath();
      ctx.moveTo(lx - 26 * k, 184); ctx.lineTo(lx + 26 * k, 184);
      ctx.lineTo(lx + (360 - 90 * (1 - k)), SCENE_H); ctx.lineTo(lx - (360 - 90 * (1 - k)), SCENE_H);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
}

function drawRoom() {
  ctx.drawImage(staticLayer('room', SCENE_W, SCENE_H, paintRoomStatic), 0, 0, SCENE_W, SCENE_H);
  /* حبابِ چراغ‌ها که سوسو می‌زند */
  for (const lx of [330, 870]) {
    const fl = .94 + Math.sin(S.t * 7 + lx) * .06;
    ctx.fillStyle = P.lamp;
    ctx.beginPath(); ctx.ellipse(lx, 181, 26 * fl, 8, 0, 0, TAU); ctx.fill();
  }
  /* گردوغبارِ توی نور */
  ctx.fillStyle = 'rgba(255, 232, 190, .5)';
  for (let i = 0; i < 40; i++) {
    const x = (noise1(i * 3.1) * SCENE_W + S.t * (6 + noise1(i) * 10)) % SCENE_W;
    const y = 190 + ((noise1(i * 7.7 + 2) * 560) + S.t * (4 + noise1(i * 2) * 8)) % 560;
    ctx.globalAlpha = .1 + .3 * Math.abs(Math.sin(S.t * .7 + i));
    ctx.beginPath(); ctx.arc(x, y, .8 + noise1(i * 1.9) * 1.4, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawBelt() {
  const b = BELT;
  /* قابِ فولادیِ نوار */
  ctx.fillStyle = P.frameDk;
  ctx.fillRect(b.x, b.y - 10, b.w, b.h + 22);
  ctx.fillStyle = P.frame;
  ctx.fillRect(b.x, b.y - 10, b.w, 8);
  ctx.fillRect(b.x, b.y + b.h + 4, b.w, 8);
  ctx.fillStyle = shade(P.frame, .25);
  ctx.fillRect(b.x, b.y - 10, b.w, 2);
  /* پیچ‌ها */
  for (let x = 22; x < b.w; x += 68) {
    for (const yy of [b.y - 6, b.y + b.h + 8]) {
      ctx.fillStyle = P.frameDk;
      ctx.beginPath(); ctx.arc(x, yy, 3.4, 0, TAU); ctx.fill();
      ctx.fillStyle = shade(P.frame, .3);
      ctx.beginPath(); ctx.arc(x - .8, yy - .8, 2, 0, TAU); ctx.fill();
    }
  }
  /* لاستیکِ نوار */
  const bg = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
  bg.addColorStop(0, P.beltDk);
  bg.addColorStop(.4, P.belt);
  bg.addColorStop(1, P.beltDk);
  ctx.fillStyle = bg;
  ctx.fillRect(b.x, b.y, b.w, b.h);
  /* هفت‌هشتِ متحرک */
  ctx.save();
  ctx.beginPath(); ctx.rect(b.x, b.y, b.w, b.h); ctx.clip();
  const off = (S.t * 78) % 52;
  ctx.strokeStyle = 'rgba(180, 200, 214, .16)'; ctx.lineWidth = 7;
  for (let x = -60; x < b.w + 60; x += 52) {
    ctx.beginPath();
    ctx.moveTo(b.x + x - off, b.y + 4);
    ctx.lineTo(b.x + x - off + 22, b.y + b.h / 2);
    ctx.lineTo(b.x + x - off, b.y + b.h - 4);
    ctx.stroke();
  }
  /* برقِ نور روی نوار */
  const sg = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
  sg.addColorStop(0, 'rgba(255, 232, 190, .1)');
  sg.addColorStop(.35, 'rgba(255, 232, 190, 0)');
  ctx.fillStyle = sg;
  ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.restore();

  for (let i = S.queue.length - 1; i >= 1; i--) {
    const q = S.queue[i];
    drawCrate(q.x, b.y + b.h / 2, 132, 86, i, true);
  }
  /* چراغ‌های صف */
  const cap = L().cap;
  for (let i = 0; i < cap; i++) {
    const x = 26 + i * 24, on = i < S.queue.length - 1;
    const col = on ? (i >= cap - 2 ? P.bad : P.brass) : 'rgba(140,160,175,.2)';
    if (on) {
      const gg = ctx.createRadialGradient(x + 8, b.y + b.h + 22, 1, x + 8, b.y + b.h + 22, 16);
      gg.addColorStop(0, col); gg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = .5; ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(x + 8, b.y + b.h + 22, 16, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = col;
    ctx.beginPath(); rrPath(x, b.y + b.h + 16, 17, 11, 4); ctx.fill();
  }
  if (S.jam > 0) {
    ctx.save();
    ctx.globalAlpha = clamp(S.jam, 0, 1) * .5;
    ctx.fillStyle = P.bad;
    ctx.fillRect(b.x, b.y - 10, b.w, b.h + 22);
    ctx.restore();
  }
}

/** جعبهٔ مقوّایی: بافت، چسب، برچسب و ریسمان. */
function drawCrate(cx, cy, w, h, seed, onBelt) {
  ctx.save();
  ctx.translate(cx, cy);
  if (onBelt) contact(0, h / 2 + 4, w * .48, 9, .5);
  withShadow(14, 6, .4, () => {
    ctx.fillStyle = P.crateDk;
    wobbleRect(-w / 2, -h / 2, w, h, 7, seed, 1.4); ctx.fill();
  }, '10, 6, 2');
  ctx.save();
  ctx.beginPath(); wobbleRect(-w / 2 + 2, -h / 2 + 2, w - 4, h - 4, 6, seed + 3, 1.2); ctx.clip();
  ctx.fillStyle = texPaper(P.crate);
  ctx.fillRect(-w / 2, -h / 2, w, h);
  const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
  g.addColorStop(0, 'rgba(255,255,255,.28)');
  g.addColorStop(.45, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(60,30,0,.3)');
  ctx.fillStyle = g;
  ctx.fillRect(-w / 2, -h / 2, w, h);
  /* درزِ وسط و نوارِ چسب */
  ctx.fillStyle = 'rgba(90, 55, 20, .35)';
  ctx.fillRect(-w / 2, -3, w, 3);
  ctx.fillStyle = P.tape;
  ctx.globalAlpha = .8;
  ctx.fillRect(-w / 2, -9, w, 15);
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(255,255,255,.16)';
  ctx.fillRect(-w / 2, -9, w, 3);
  ctx.restore();
  /* برچسبِ کاغذی */
  ctx.fillStyle = 'rgba(20,12,4,.2)';
  wobbleRect(-w / 2 + 15, -h / 2 + 11, w - 30, 24, 3, seed + 7, 1); ctx.fill();
  ctx.fillStyle = P.paper;
  wobbleRect(-w / 2 + 16, -h / 2 + 10, w - 32, 23, 3, seed + 7, 1); ctx.fill();
  ctx.strokeStyle = 'rgba(120, 100, 70, .55)'; ctx.lineWidth = 1.4;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(-w / 2 + 22, -h / 2 + 16 + i * 5); ctx.lineTo(w / 2 - 22, -h / 2 + 16 + i * 5); ctx.stroke();
  }
  /* مُهرِ گِرد */
  ctx.strokeStyle = 'rgba(180, 70, 50, .5)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(w / 2 - 22, h / 2 - 20, 11, 0, TAU); ctx.stroke();
  ctx.restore();
}

/** بستهٔ جلوی صف روی گیرهٔ چوبی. */
function drawCard() {
  const q = front();
  const b = CARD;
  const tilt = -.012;
  ctx.save();
  ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
  ctx.rotate(tilt);
  ctx.translate(-(b.x + b.w / 2), -(b.y + b.h / 2));
  contact(b.x + b.w / 2, b.y + b.h + 16, b.w * .48, 16, .42);
  /* تختهٔ چوبیِ گیره */
  withShadow(26, 12, .45, () => {
    ctx.fillStyle = P.tableDk;
    wobbleRect(b.x - 16, b.y - 26, b.w + 32, b.h + 52, 10, 11, 1.6); ctx.fill();
  }, '10, 6, 2');
  ctx.save();
  ctx.beginPath(); wobbleRect(b.x - 16, b.y - 26, b.w + 32, b.h + 52, 10, 11, 1.6); ctx.clip();
  ctx.fillStyle = texWood('#8a6134', '#5a3c1c');
  ctx.fillRect(b.x - 16, b.y - 26, b.w + 32, b.h + 52);
  ctx.restore();
  /* کاغذ */
  ctx.fillStyle = 'rgba(20,12,4,.28)';
  wobbleRect(b.x + 2, b.y + 4, b.w, b.h, 6, 13, 1.4); ctx.fill();
  paper(b.x, b.y, b.w, b.h, P.paper, 13, 6, .3);
  if (S.wrong > 0) {
    ctx.save();
    ctx.globalAlpha = clamp(S.wrong, 0, 1) * .4;
    ctx.fillStyle = P.bad;
    ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 6); ctx.fill();
    ctx.restore();
  }
  /* گیرهٔ فلزی */
  const cx0 = b.x + b.w / 2;
  ctx.fillStyle = P.frameDk;
  ctx.beginPath(); rrPath(cx0 - 62, b.y - 22, 124, 30, 7); ctx.fill();
  const cg = ctx.createLinearGradient(0, b.y - 22, 0, b.y + 8);
  cg.addColorStop(0, shade(P.frame, .5));
  cg.addColorStop(.5, P.frame);
  cg.addColorStop(1, P.frameDk);
  ctx.fillStyle = cg;
  ctx.beginPath(); rrPath(cx0 - 58, b.y - 20, 116, 24, 6); ctx.fill();
  ctx.fillStyle = 'rgba(30,40,46,.55)';
  ctx.beginPath(); ctx.arc(cx0, b.y - 8, 5, 0, TAU); ctx.fill();

  if (!q) {
    text('نوار خالی است…', cx0, b.y + b.h / 2, { size: 22, color: P.inkSoft });
    ctx.restore();
    return;
  }
  ctx.save();
  if (S.lensT > 0) {
    const k = 1 + Math.sin(clamp(S.lensT / .5, 0, 1) * Math.PI) * .045;
    ctx.translate(cx0, b.y + b.h / 2); ctx.scale(k, k); ctx.translate(-cx0, -(b.y + b.h / 2));
  }
  textWrap(storyText(q, S.small), cx0, b.y + 56, b.w - 64,
    { size: S.small ? 26 : 23, color: P.ink, lineHeight: S.small ? 42 : 38 });
  if (S.small) {
    text('عددها کوچک شدند؛ شکلِ مسئله همان است.', cx0, b.y + b.h - 26,
      { size: 15, color: '#9a7a2c' });
  }
  ctx.restore();
  ctx.restore();
}

/** ذرّه‌بینِ ساده‌ساز، روی پایهٔ برنجی. */
function drawLens() {
  const b = LENS, hot = S.hover === 'lens';
  const dy = hot ? 3 : 0;
  contact(b.x + b.w / 2, b.y + b.h + 10, b.w * .42, 12, .4);
  ctx.fillStyle = shade(S.small ? P.brassDk : '#6b5b3e', -.4);
  wobbleRect(b.x, b.y + dy + 6, b.w, b.h, 14, 21, 1.8); ctx.fill();
  withShadow(hot ? 20 : 12, hot ? 5 : 6, .4, () => {
    ctx.fillStyle = S.small ? P.brass : '#8a7550';
    wobbleRect(b.x, b.y + dy, b.w, b.h, 14, 21, 1.8); ctx.fill();
  }, '10, 6, 2');
  ctx.save();
  ctx.beginPath(); wobbleRect(b.x, b.y + dy, b.w, b.h, 14, 21, 1.8); ctx.clip();
  const g = ctx.createLinearGradient(0, b.y + dy, 0, b.y + dy + b.h);
  g.addColorStop(0, 'rgba(255,255,255,.34)');
  g.addColorStop(.5, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(0,0,0,.3)');
  ctx.fillStyle = g;
  ctx.fillRect(b.x, b.y + dy, b.w, b.h);
  ctx.restore();
  const cx = b.x + b.w / 2, cy = b.y + 54 + dy;
  if (S.small) {
    const gg = ctx.createRadialGradient(cx, cy, 2, cx, cy, 58);
    gg.addColorStop(0, 'rgba(255, 235, 170, .5)');
    gg.addColorStop(1, 'rgba(255, 235, 170, 0)');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(cx, cy, 58, 0, TAU); ctx.fill();
  }
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(-.5 + Math.sin(S.t * 1.6) * .04);
  ctx.strokeStyle = shade(P.brassDk, -.3); ctx.lineWidth = 10; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 22); ctx.lineTo(0, 46); ctx.stroke();
  ctx.strokeStyle = P.brass; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(0, 22); ctx.lineTo(0, 44); ctx.stroke();
  ctx.strokeStyle = shade(P.brassDk, -.2); ctx.lineWidth = 8;
  ctx.beginPath(); ctx.arc(0, 0, 22, 0, TAU); ctx.stroke();
  ctx.strokeStyle = P.brassLt; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, 22, -2.4, -.4); ctx.stroke();
  ctx.fillStyle = 'rgba(190, 226, 244, .5)';
  ctx.beginPath(); ctx.arc(0, 0, 19, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.6)';
  ctx.beginPath(); ctx.ellipse(-7, -7, 8, 4.4, -.7, 0, TAU); ctx.fill();
  ctx.restore();
  text('ذرّه‌بین', cx, b.y + 106 + dy, { size: 20, family: 'Lalezar', color: '#241a08' });
  text(S.small ? 'عددهای اصلی' : 'عددها را کوچک کن', cx, b.y + 130 + dy,
    { size: 13, color: 'rgba(36, 26, 8, .7)' });
}

/** چهار قیفِ فلزیِ رنگ‌شده. */
function drawChutes() {
  for (let i = 0; i < 4; i++) {
    const b = chuteBox(i), o = OPS[i], hot = S.hover === i;
    const pulse = S.chuteT[i] > 0 ? clamp(S.chuteT[i] * 2, 0, 1) : 0;
    const dy = hot ? 3 : 0;
    const x = b.x, y = b.y + dy, w = b.w, h = b.h;
    contact(x + w / 2, y + h + 8, w * .46, 14, .45);
    /* بدنهٔ قیف: بالا پهن‌تر */
    const body = () => {
      ctx.beginPath();
      ctx.moveTo(x + 4, y + 10);
      ctx.lineTo(x + w - 4, y + 10);
      ctx.lineTo(x + w - 20, y + h);
      ctx.lineTo(x + 20, y + h);
      ctx.closePath();
    };
    ctx.fillStyle = shade(o.d, -.4);
    ctx.beginPath();
    ctx.moveTo(x + 4, y + 16); ctx.lineTo(x + w - 4, y + 16);
    ctx.lineTo(x + w - 20, y + h + 8); ctx.lineTo(x + 20, y + h + 8);
    ctx.closePath(); ctx.fill();
    withShadow(hot ? 22 : 14, hot ? 5 : 8, .42, () => {
      ctx.fillStyle = o.c; body(); ctx.fill();
    }, '10, 6, 2');
    /* حجمِ فلز */
    ctx.save();
    body(); ctx.clip();
    const mg = ctx.createLinearGradient(x, 0, x + w, 0);
    mg.addColorStop(0, 'rgba(0,0,0,.32)');
    mg.addColorStop(.22, 'rgba(255,255,255,.3)');
    mg.addColorStop(.55, 'rgba(255,255,255,.04)');
    mg.addColorStop(1, 'rgba(0,0,0,.34)');
    ctx.fillStyle = mg;
    ctx.fillRect(x, y, w, h);
    const vg2 = ctx.createLinearGradient(0, y, 0, y + h);
    vg2.addColorStop(0, 'rgba(255,255,255,.2)');
    vg2.addColorStop(.6, 'rgba(0,0,0,0)');
    vg2.addColorStop(1, 'rgba(0,0,0,.3)');
    ctx.fillStyle = vg2;
    ctx.fillRect(x, y, w, h);
    if (pulse) {
      ctx.globalAlpha = pulse * .55;
      ctx.fillStyle = '#fff';
      ctx.fillRect(x, y, w, h);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    /* لبهٔ فلزیِ دهانه */
    ctx.fillStyle = shade(o.d, -.3);
    ctx.beginPath(); rrPath(x, y, w, 22, 8); ctx.fill();
    const lg2 = ctx.createLinearGradient(0, y, 0, y + 22);
    lg2.addColorStop(0, 'rgba(255,255,255,.4)');
    lg2.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = lg2;
    ctx.beginPath(); rrPath(x, y, w, 22, 8); ctx.fill();
    /* دهانهٔ تاریک */
    ctx.fillStyle = '#0d1114';
    ctx.beginPath(); rrPath(x + 26, y + 6, w - 52, 26, 11); ctx.fill();
    const dg = ctx.createLinearGradient(0, y + 6, 0, y + 32);
    dg.addColorStop(0, 'rgba(0,0,0,.85)');
    dg.addColorStop(1, 'rgba(90,90,90,.25)');
    ctx.fillStyle = dg;
    ctx.beginPath(); rrPath(x + 26, y + 6, w - 52, 26, 11); ctx.fill();
    /* پیچ‌ها */
    for (const px2 of [x + 16, x + w - 16]) {
      ctx.fillStyle = shade(o.d, -.45);
      ctx.beginPath(); ctx.arc(px2, y + 42, 5, 0, TAU); ctx.fill();
      ctx.fillStyle = shade(o.c, .35);
      ctx.beginPath(); ctx.arc(px2 - 1, y + 41, 3, 0, TAU); ctx.fill();
    }
    /* پلاکِ لعابیِ نشانه */
    const px = x + w / 2, py2 = y + 116;
    ctx.fillStyle = 'rgba(0,0,0,.28)';
    ctx.beginPath(); rrPath(px - 62, py2 - 54, 124, 108, 14); ctx.fill();
    ctx.fillStyle = shade(o.d, -.12);
    ctx.beginPath(); rrPath(px - 58, py2 - 52, 116, 104, 12); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2;
    ctx.beginPath(); rrPath(px - 52, py2 - 46, 104, 92, 9); ctx.stroke();
    numText(o.s, px, py2 - 12, { size: 66, color: '#fff', stroke: 'rgba(0,0,0,.3)', strokeWidth: 6 });
    text(o.n, px, py2 + 32, { size: 27, family: 'Lalezar', color: 'rgba(255,255,255,.96)' });
    /* چراغِ نشانگر */
    const on = pulse > .05;
    if (on) {
      const gg = ctx.createRadialGradient(px, y + h - 14, 2, px, y + h - 14, 34);
      gg.addColorStop(0, 'rgba(255, 240, 190, .85)');
      gg.addColorStop(1, 'rgba(255, 240, 190, 0)');
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(px, y + h - 14, 34, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = on ? '#fff3cf' : 'rgba(0,0,0,.4)';
    ctx.beginPath(); ctx.arc(px, y + h - 14, 7, 0, TAU); ctx.fill();
  }
}

function drawFly() {
  if (!S.fly) return;
  const k = clamp(S.fly.t / .55, 0, 1);
  const box = chuteBox(S.fly.to);
  const x = lerp(CARD.x + CARD.w / 2, box.x + box.w / 2, k);
  const y = lerp(CARD.y + CARD.h / 2, box.y + 26, easeIn(k));
  const s = lerp(1, .3, k);
  ctx.save();
  ctx.globalAlpha = 1 - k * .35;
  ctx.translate(x, y);
  ctx.rotate(k * .7);
  ctx.scale(s, s);
  drawCrate(0, 0, 220, 132, 5, false);
  ctx.restore();
}

function drawHUD() {
  ctx.fillStyle = 'rgba(60, 44, 22, .88)';
  ctx.fillRect(0, 0, SCENE_W, HUD_H);
  ctx.fillStyle = 'rgba(232, 178, 63, .3)';
  ctx.fillRect(0, HUD_H - 2, SCENE_W, 2);
  text(L().name, SCENE_W - 24, HUD_H / 2, { size: 23, family: 'Lalezar', color: P.paper, align: 'right' });
  for (let i = 0; i < 3; i++) {
    const x = SCENE_W - 206 - i * 32;
    ctx.save();
    ctx.globalAlpha = i < S.lives ? 1 : .22;
    ctx.fillStyle = i < S.lives ? P.crate : '#8d8577';
    ctx.beginPath(); rrPath(x - 11, HUD_H / 2 - 9, 22, 18, 4); ctx.fill();
    ctx.strokeStyle = i < S.lives ? P.crateDk : '#6f6a60'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x - 11, HUD_H / 2 - 1); ctx.lineTo(x + 11, HUD_H / 2 - 1); ctx.stroke();
    ctx.restore();
  }
  if (!L().endless) {
    numText(fa(Math.min(S.cleared, L().quota)) + ' / ' + fa(L().quota), SCENE_W / 2, HUD_H / 2, { size: 22, color: P.gold });
  } else {
    text('بی‌پایان', SCENE_W / 2, HUD_H / 2, { size: 22, family: 'Lalezar', color: P.gold });
  }
  numText(fa(S.score), 24, HUD_H / 2, { size: 25, color: P.gold, align: 'left' });
  numText('بیشترین ' + fa(S.best), 140, HUD_H / 2 + 1,
    { size: 14, color: 'rgba(253, 247, 234, .55)', align: 'left', family: 'Vazirmatn', weight: 700 });
  if (S.combo > 1) numText('×' + fa(S.combo), 248, HUD_H / 2, { size: 22, color: P.gold, align: 'left' });
}

function drawTutorial() {
  const st = S.tut.step;
  if (st === 0) {
    spot([CARD], .74);
    const h = tutCard(300, 452, 600,
      ['روی هر بسته یک مسئله نوشته شده.', 'لازم نیست حسابش کنی — فقط بگو کدام عمل است.'], 'ایستگاهِ بسته‌ها');
    tutMore(600, 452 + h + 10, S.t, P.ink);
  } else if (st === 1) {
    spot([{ x: chuteBox(0).x, y: CHUTE_Y, w: chuteBox(3).x + chuteBox(3).w - chuteBox(0).x, h: CHUTE_H }], .7);
    tutCard(300, 246, 600, ['روی سُرسرهٔ درست بزن تا بسته برود تویش.']);
  } else {
    spot([LENS], .7);
    const h = tutCard(240, 452, 600,
      ['اگر عددها گیجت کردند، ذرّه‌بین را بزن.', 'عددها کوچک می‌شوند ولی شکلِ مسئله همان است —',
       'آن‌وقت راحت‌تر می‌بینی کدام عمل است.'], 'ذرّه‌بینِ ساده‌ساز');
    tutMore(540, 452 + h + 10, S.t, P.ink);
  }
}

/* ───────── پرده‌ها ───────── */

function stampIcon(x, y) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = P.crateDk;
  wobbleRect(-26, -6, 52, 22, 5, 3, 1.2); ctx.fill();
  ctx.fillStyle = P.crate;
  wobbleRect(-14, -28, 28, 24, 5, 5, 1); ctx.fill();
  ctx.fillStyle = P.brass;
  wobbleRect(-22, 14, 44, 8, 3, 7, .8); ctx.fill();
  ctx.restore();
}

function drawIntro() {
  overlay({
    t: S.phaseT, w: 760, h: 286, y: 138,
    paper: P.paper, band: P.brassDk, ink: P.ink, inkSoft: '#7f6c48',
    icon: stampIcon,
    title: 'ایستگاهِ بسته‌ها',
    body: 'روی هر بسته یک مسئله نوشته شده. لازم نیست حسابش کنی —\nفقط بسته را توی سُرسرهٔ درست بینداز: جمع، تفریق، ضرب یا تقسیم.\nگیج شدی؟ ذرّه‌بین را بزن تا عددها کوچک شوند.',
    btn: BTN_GO, btnLabel: 'شروعِ نوبت', btnHot: S.hover === BTN_GO,
    btnFill: '#96762f', btnHotFill: '#b18f3d',
  });
}

function drawWon() {
  const last = S.level + 1 >= LEVELS.length;
  overlay({
    t: S.phaseT, w: 720, h: 250, y: 160,
    paper: P.paper, band: P.gold, ink: P.ink, inkSoft: '#7f6c48',
    icon: stampIcon,
    title: L().endless ? 'نوبت تمام شد' : 'همهٔ بسته‌ها رفتند!',
    body: 'امتیاز: ' + fa(S.score) + (last ? '\nهمهٔ نوبت‌ها را کار کردی. از اوّل؟' : ''),
    btn: BTN_GO, btnLabel: last ? 'دوباره' : 'نوبتِ بعد', btnHot: S.hover === BTN_GO,
    btnFill: '#96762f', btnHotFill: '#b18f3d',
  });
}

function drawLost() {
  overlay({
    t: S.phaseT, w: 720, h: 250, y: 160,
    paper: P.paper, band: P.bad, ink: P.ink, inkSoft: '#7f6c48',
    icon: (x, y) => { ctx.fillStyle = '#b7a58a';
      for (let i = 0; i < 3; i++) { wobbleRect(x - 26 + i * 6, y - 18 + i * 14, 52, 14, 4, i, 1); ctx.fill(); } },
    title: 'ایستگاه قفل کرد',
    body: 'امتیاز: ' + fa(S.score) + '\nذرّه‌بین را زودتر بزن؛ با عددهای کوچک زودتر معلوم می‌شود.',
    btn: BTN_GO, btnLabel: 'دوباره', btnHot: S.hover === BTN_GO,
    btnFill: '#96762f', btnHotFill: '#b18f3d',
  });
}
