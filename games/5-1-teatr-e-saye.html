<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1e1626">
<title>تئاترِ سایه — زیرمسئله</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>
  /* صفحه نباید هیچ‌جا اسکرول یا زوم شود؛ بازی باید مثل یک برنامه رفتار کند. */
  html, body {
    margin: 0; padding: 0; background: #1e1626;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body {
    position: fixed; inset: 0;          /* جلوی کشیده‌شدنِ صفحه در سافاریِ گوشی */
    width: 100%; height: 100vh; height: 100dvh;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none; -webkit-touch-callout: none;
  }

  /* گوشیِ عمودی صحنه را ریز می‌کند؛ بچه باید گوشی را بچرخاند. */
  #rotate { display: none; }
  @media (orientation: portrait) and (max-width: 860px) {
    #stage { display: none; }
    #rotate {
      display: flex; position: fixed; inset: 0;
      z-index: 9;
      flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      background: #1e1626; color: #f6ead2;
      font: 700 20px "Vazirmatn", Tahoma, sans-serif; text-align: center; padding: 32px;
    }
    #rotate svg { animation: tilt 2.4s ease-in-out infinite; }
    @keyframes tilt { 0%, 45% { transform: rotate(0deg); } 65%, 100% { transform: rotate(-90deg); } }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="rotate">
  <svg width="86" height="126" viewBox="0 0 86 126" fill="none" aria-hidden="true">
    <rect x="3" y="3" width="80" height="120" rx="12" stroke="#e8b448" stroke-width="5"/>
    <rect x="15" y="19" width="56" height="88" rx="5" fill="#e8b448" opacity=".28"/>
    <circle cx="43" cy="115" r="4" fill="#e8b448"/>
  </svg>
  <div>گوشی را بچرخان</div>
  <div style="font-weight:400;opacity:.7;font-size:16px">این بازی خوابیده بازی می‌شود</div>
</div>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   هستهٔ مشترکِ بازی‌ها — سبک «کاغذبُری»
   ───────────────────────────────────────────────────────────────────────
   این فایل جعبه‌ابزار است، نه چارچوب: هر بازی حلقه و وضعیت خودش را دارد
   و فقط از این توابع برای کشیدن استفاده می‌کند. دلیلش این است که هر بازی
   باید حس‌وحال خودش را داشته باشد، نه اینکه همه شبیه هم دربیایند.

   قاعده‌های ثابتِ تصویری:
   • نور همیشه از بالا-چپ می‌تابد، پس سایه‌ها به پایین-راست می‌افتند.
   • هیچ لبه‌ای کاملاً صاف نیست؛ همه کمی موج دارند (انگار با قیچی بریده).
   • هیچ خاکستریِ خالصی نداریم؛ همه‌ی خنثی‌ها به گرمیِ صحنه می‌زنند.
   • یک لایه‌ی دانه‌دانه‌ی کاغذ روی کلِ تصویر ضرب می‌شود.
   ═══════════════════════════════════════════════════════════════════════ */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const FA_D = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
const fa = (n) => String(n).replace(/\d/g, (d) => FA_D[+d]);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeIn = (t) => t * t * t;
const easeInOut = (t) => (t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2);
const easeBack = (t) => 1 + 2.7 * Math.pow(t-1, 3) + 1.7 * Math.pow(t-1, 2);
const easeElastic = (t) => t === 0 || t === 1 ? t : Math.pow(2, -9*t) * Math.sin((t*10 - .75) * 2.094) + 1;

/** تصادفِ تکرارپذیر: با یک بذر همیشه همان عدد. برای اینکه تزئین‌ها هر فریم نپرند. */
function noise1(x) {
  const s = Math.sin(x * 127.1) * 43758.5453;
  return s - Math.floor(s);
}
const pick = (arr, seed) => arr[Math.floor(noise1(seed) * arr.length) % arr.length];

/* ───────── بوم و صحنهٔ ثابت ───────── */

let ctx, SW, SH, CV, _refit = null;
let view = { scale: 1, ox: 0, oy: 0, w: 0, h: 0, dpr: 1 };
let _grain = null, _grainDark = null;

function initStage(canvas, w, h) {
  CV = canvas; SW = w; SH = h;
  ctx = canvas.getContext('2d');

  /* اندازه را از خودِ بوم می‌گیریم نه از innerHeight؛ چون در سافاریِ گوشی
     نوارِ آدرس باز و بسته می‌شود و innerHeight دروغ می‌گوید. */
  const fit = () => {
    const r = canvas.getBoundingClientRect();
    const vw = Math.round(r.width), vh = Math.round(r.height);
    if (vw < 20 || vh < 20) return;
    const dpr = Math.min(devicePixelRatio || 1, QUALITY > 0 ? 2 : 1);
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    const scale = Math.min(vw / SW, vh / SH);
    view = { scale, ox: (vw - SW*scale)/2, oy: (vh - SH*scale)/2, w: vw, h: vh, dpr };
    _grain = buildGrain();
  };
  _refit = fit;
  addEventListener('resize', fit);
  /* چرخاندنِ گوشی: اندازهٔ درست چند لحظه بعد می‌رسد، پس چندبار اندازه می‌گیریم. */
  addEventListener('orientationchange', () => {
    fit(); setTimeout(fit, 140); setTimeout(fit, 460);
  });
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(canvas);

  /* صدا در گوشی فقط بعد از اوّلین لمس اجازهٔ پخش دارد. */
  const unlock = () => { sfx._c(); removeEventListener('pointerdown', unlock); removeEventListener('touchstart', unlock); };
  addEventListener('pointerdown', unlock, { passive: true });
  addEventListener('touchstart', unlock, { passive: true });
  /* نگه‌داشتنِ انگشت نباید منوی مرورگر را باز کند. */
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  fit();
  return ctx;
}

/** قابِ صحنه را باز می‌کند: بعد از این، مختصات همیشه در فضای SW×SH است. */
function beginScene(bg) {
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, view.w, view.h);
  ctx.save();
  ctx.translate(view.ox, view.oy);
  ctx.scale(view.scale, view.scale);
  ctx.beginPath();
  ctx.rect(0, 0, SW, SH);
  ctx.clip();
}

/* ───────── پوششِ پایانِ قاب ─────────
   دانه‌های کاغذ و تیرگیِ گوشه‌ها هر دو ثابت‌اند و تغییر نمی‌کنند، ولی
   قبلاً هر فریم از نو کشیده می‌شدند: یکی با «multiply» روی کلِّ صفحه و
   یکی با یک گرادیانِ شعاعیِ تازه. اندازه‌گیری نشان داد همین دو تا
   ۱۱ تا ۱۶ میلی‌ثانیه از هر فریم را می‌خوردند — بیشتر از کشیدنِ خودِ
   صحنه. حالا یک بار در یک بومِ جدا پخته می‌شوند و هر فریم فقط یک
   drawImage است.                                                       */

let _ovl = null, _ovlKey = '';

function overlayLayer(grainAlpha, vignette) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const w = Math.max(2, Math.round(SW * q)), h = Math.max(2, Math.round(SH * q));
  const key = w + 'x' + h + '|' + grainAlpha + '|' + vignette;
  if (_ovl && _ovlKey === key) return _ovl;
  let c;
  try {
    c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g2 = c.getContext('2d');
    if (!g2) return null;
    if (_grainDark && grainAlpha > 0) {
      /* همان دانه‌ها، ولی به‌جای multiply به شکلِ سیاهِ کم‌رنگ */
      g2.globalAlpha = clamp(grainAlpha * 1.15, 0, 1);
      g2.fillStyle = g2.createPattern(_grainDark, 'repeat');
      g2.fillRect(0, 0, w, h);
      g2.globalAlpha = 1;
    }
    if (vignette) {
      const g = g2.createRadialGradient(w / 2, h / 2, h * .42, w / 2, h / 2, h * 1.05);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, vignette);
      g2.fillStyle = g;
      g2.fillRect(0, 0, w, h);
    }
  } catch (e) { return null; }
  _ovl = c; _ovlKey = key;
  return c;
}

/** بافتِ کاغذ، تیرگیِ گوشه‌ها، رنگ‌بندی و درخششِ نور را می‌گذارد و قاب را می‌بندد. */
function endScene(grainAlpha = .15, vignette = 'rgba(48,28,14,.30)', bloom = .34, grade = .14) {
  /* درخششِ نور خاموش است. اندازه‌گیری نشان داد هر فریم ۲۱ میلی‌ثانیه
     می‌گیرد — بیشتر از تمامِ کارهای دیگرِ یک فریم روی هم — چون برای
     ساختنش باید کلِّ بوم دوباره خوانده شود. از آن بدتر: متنِ فارسی را
     مه‌آلود می‌کرد و خواندنش را سخت‌تر. بی‌آن، صحنه تمیزتر است. */
  bloom = 0;
  if (QUALITY < 1) { grade = 0; grainAlpha *= .5; }
  if (QUALITY < 2) grade = 0;
  if (grade > 0) {
    /* رنگ‌بندیِ نرم: بالای صحنه گرم‌تر، پایین سردتر — عمق می‌دهد */
    const g = ctx.createLinearGradient(0, 0, 0, SH);
    g.addColorStop(0, `rgba(255, 214, 150, ${grade})`);
    g.addColorStop(.55, 'rgba(255, 255, 255, 0)');
    g.addColorStop(1, `rgba(40, 60, 110, ${grade * .9})`);
    ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalCompositeOperation = 'source-over';
  }
  const ov = (grainAlpha > 0 || vignette) ? overlayLayer(grainAlpha, vignette) : null;
  if (ov) ctx.drawImage(ov, 0, 0, SW, SH);
  ctx.restore();
  bloomPass(bloom);
}

/* ───────── درخششِ نور (bloom) ─────────
   قابِ رسم‌شده را کوچک می‌کنیم، دو بار در خودش ضرب می‌کنیم تا فقط
   روشن‌ها بمانند، محوش می‌کنیم و با حالتِ «lighter» رویش می‌گذاریم.
   نتیجه: چراغ‌ها، شعله‌ها و رنگ‌های روشن نور پخش می‌کنند. */
let _bl, _blc, _bl2, _bl2c, _blNo = false, _blTick = 0;

function bloomPass(amount) {
  if (!amount || _blNo || !CV.width) return;
  /* کوچک‌کردن و بزرگ‌کردنِ دوباره، خودش محو می‌کند — از filter خیلی ارزان‌تر است */
  const W = Math.max(4, Math.round(CV.width * .2)), H = Math.max(4, Math.round(CV.height * .2));
  const W2 = Math.max(2, Math.round(W * .28)), H2 = Math.max(2, Math.round(H * .28));
  try {
    if (!_bl) {
      _bl = document.createElement('canvas'); _blc = _bl.getContext('2d');
      _bl2 = document.createElement('canvas'); _bl2c = _bl2.getContext('2d');
      if (!_blc || !_bl2c) { _blNo = true; return; }
    }
    if (_bl.width !== W || _bl.height !== H) { _bl.width = W; _bl.height = H; }
    if (_bl2.width !== W2 || _bl2.height !== H2) { _bl2.width = W2; _bl2.height = H2; }
    /* ساختنِ نور یک قاب در میان کافی است؛ گذاشتنش هر قاب. */
    _blTick = (_blTick + 1) & 1;
    if (!_blTick) {
      _blc.globalCompositeOperation = 'source-over';
      _blc.clearRect(0, 0, W, H);
      _blc.drawImage(CV, 0, 0, W, H);
      _blc.globalCompositeOperation = 'multiply';
      _blc.drawImage(_bl, 0, 0);
      _blc.drawImage(_bl, 0, 0);
      _blc.globalCompositeOperation = 'source-over';
      _bl2c.clearRect(0, 0, W2, H2);
      _bl2c.drawImage(_bl, 0, 0, W2, H2);
    }

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = amount;
    ctx.drawImage(_bl2, 0, 0, CV.width, CV.height);
    ctx.restore();
  } catch (e) { _blNo = true; }
}

/* ───────── لایهٔ ثابت ─────────
   هرچه در صحنه تکان نمی‌خورد را یک‌بار می‌کشیم و بعد فقط کپی می‌کنیم. */
const _layers = {};
function staticLayer(key, w, h, paint) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const L = _layers[key];
  if (L && L.q === q && L.w === w && L.h === h) return L.cv;
  const off = document.createElement('canvas');
  off.width = Math.max(1, Math.round(w * q));
  off.height = Math.max(1, Math.round(h * q));
  const c = off.getContext('2d');
  c.setTransform(q, 0, 0, q, 0, 0);
  const prev = ctx;
  ctx = c;
  try { paint(); } finally { ctx = prev; }
  _layers[key] = { cv: off, q, w, h };
  return off;
}

/* ───────── نورپردازی و بافت ─────────
   کارِ این‌ها این است که هیچ سطحی «تختِ یک‌رنگ» نماند. */

/** شیبِ عمودی: بالا روشن، پایین تیره. */
function vgrad(y0, y1, top, bot) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, top); g.addColorStop(1, bot);
  return g;
}

/** حجمِ کروی: نور از بالا-چپ، سایه در پایین-راست. */
function ball(cx, cy, r, lit, base, dark) {
  const g = ctx.createRadialGradient(cx - r * .38, cy - r * .42, r * .06, cx, cy, r * 1.06);
  g.addColorStop(0, lit); g.addColorStop(.45, base); g.addColorStop(1, dark);
  return g;
}

/** لبهٔ روشنِ بالا-چپِ یک مسیر — همان «rim light». */
function rim(pathFn, col, w = 2.2) {
  ctx.save();
  ctx.beginPath(); pathFn();
  ctx.clip();
  ctx.beginPath(); pathFn();
  ctx.strokeStyle = col; ctx.lineWidth = w * 2; ctx.lineJoin = 'round';
  ctx.translate(-w * .5, -w * .6);
  ctx.stroke();
  ctx.restore();
}

/** سایهٔ چسبیده به زمین — چیزها را روی سطح می‌نشاند. */
function contact(cx, cy, rx, ry, alpha = .26) {
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
  g.addColorStop(0, `rgba(20, 12, 6, ${alpha})`);
  g.addColorStop(1, 'rgba(20, 12, 6, 0)');
  ctx.save();
  ctx.fillStyle = g;
  ctx.translate(cx, cy); ctx.scale(1, ry / Math.max(rx, ry));
  ctx.beginPath(); ctx.arc(0, 0, Math.max(rx, ry), 0, TAU); ctx.fill();
  ctx.restore();
}

const _tex = {};
/** بافتِ تکرارشونده؛ یک‌بار ساخته و بعد از حافظه خوانده می‌شود. */
function texture(key, w, h, paint) {
  if (_tex[key]) return _tex[key];
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const c = off.getContext('2d');
  paint(c, w, h);
  _tex[key] = ctx.createPattern(off, 'repeat');
  return _tex[key];
}

/** رگهٔ چوب. */
function texWood(base, grain) {
  return texture('w' + base + grain, 120, 120, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = grain; c.lineWidth = 1.4;
    for (let i = 0; i < 9; i++) {
      c.globalAlpha = .18 + noise1(i * 3.1) * .3;
      c.beginPath();
      const y0 = i * 14 + noise1(i) * 6;
      c.moveTo(0, y0);
      for (let x = 0; x <= w; x += 10) c.lineTo(x, y0 + Math.sin(x * .09 + i) * 2.6);
      c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** تارِ پارچه. */
function texCloth(base, thread) {
  return texture('c' + base + thread, 16, 16, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = thread; c.lineWidth = 1; c.globalAlpha = .5;
    for (let i = 0; i < w; i += 4) {
      c.beginPath(); c.moveTo(i, 0); c.lineTo(i, h); c.stroke();
      c.beginPath(); c.moveTo(0, i); c.lineTo(w, i); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** دانه‌های سنگ. */
function texStone(base, spec) {
  return texture('s' + base + spec, 90, 90, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) {
      c.globalAlpha = .05 + noise1(i * 1.7) * .16;
      c.fillStyle = spec;
      const r = .6 + noise1(i * 5.3) * 1.9;
      c.beginPath();
      c.arc(noise1(i * 2.1) * w, noise1(i * 3.7 + 1) * h, r, 0, TAU);
      c.fill();
    }
    c.globalAlpha = 1;
  });
}

/** الیافِ کاغذ. */
function texPaper(base) {
  return texture('p' + base, 100, 100, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 130; i++) {
      c.globalAlpha = .04 + noise1(i * 2.3) * .07;
      c.strokeStyle = i % 2 ? '#ffffff' : '#5a4326';
      c.lineWidth = .9;
      const x = noise1(i * 1.3) * w, y = noise1(i * 4.1 + 2) * h;
      const a = noise1(i * 7.7) * TAU, l = 4 + noise1(i * 9.1) * 12;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

function buildGrain() {
  const s = 260;
  const off = document.createElement('canvas');
  off.width = off.height = s;
  const c = off.getContext('2d');
  const img = c.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    const v = 214 + Math.random() * 41;
    img.data[i*4] = v; img.data[i*4+1] = v; img.data[i*4+2] = v; img.data[i*4+3] = 255;
  }
  c.putImageData(img, 0, 0);
  /* همان دانه‌ها به شکلِ سیاهِ کم‌رنگ، تا بشود بدونِ multiply گذاشتشان */
  const d = document.createElement('canvas');
  d.width = d.height = s;
  const dc = d.getContext('2d');
  const dimg = dc.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    dimg.data[i*4] = 0; dimg.data[i*4+1] = 0; dimg.data[i*4+2] = 0;
    dimg.data[i*4+3] = 255 - img.data[i*4];
  }
  dc.putImageData(dimg, 0, 0);
  _grainDark = d;
  _ovl = null; _ovlKey = '';
  return ctx.createPattern(off, 'repeat');
}

function toStage(e) {
  const r = CV.getBoundingClientRect();
  return {
    x: (e.clientX - r.left - view.ox) / view.scale,
    y: (e.clientY - r.top - view.oy) / view.scale,
  };
}

const inRect = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
const inCircle = (p, b, pad = 0) => Math.hypot(p.x - b.x, p.y - b.y) <= b.r + pad;

/* ───────── قلم‌های کاغذبُری ───────── */

/** دایره‌ای که انگار با قیچی بریده شده. */
function wobbleCircle(cx, cy, r, seed = 0, amp = 2.2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const rr = r + Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp * .45;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** بیضیِ ناصاف — برای چیزهایی که گرد نیستند ولی نرم‌اند. */
function wobbleEllipse(cx, cy, rx, ry, rot = 0, seed = 0, amp = 2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const w = 1 + (Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp*.45) / Math.max(rx, ry);
    const px = Math.cos(a) * rx * w, py = Math.sin(a) * ry * w;
    const x = cx + px*Math.cos(rot) - py*Math.sin(rot);
    const y = cy + px*Math.sin(rot) + py*Math.cos(rot);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** مستطیلِ گِرد با گوشه‌های کمی کج. */
function wobbleRect(x, y, w, h, r = 12, seed = 0, amp = 1.6) {
  const j = (k) => (noise1(seed*9.7 + k) - .5) * amp * 2;
  ctx.beginPath();
  ctx.moveTo(x + r + j(1), y + j(2));
  ctx.lineTo(x + w - r + j(3), y + j(4));
  ctx.quadraticCurveTo(x + w + j(5), y + j(6), x + w + j(7), y + r + j(8));
  ctx.lineTo(x + w + j(9), y + h - r + j(10));
  ctx.quadraticCurveTo(x + w + j(11), y + h + j(12), x + w - r + j(13), y + h + j(14));
  ctx.lineTo(x + r + j(15), y + h + j(16));
  ctx.quadraticCurveTo(x + j(17), y + h + j(18), x + j(19), y + h - r + j(20));
  ctx.lineTo(x + j(21), y + r + j(22));
  ctx.quadraticCurveTo(x + j(23), y + j(24), x + r + j(1), y + j(2));
  ctx.closePath();
}

/** سایهٔ نرم؛ نور از بالا-چپ. */
function withShadow(blur, dy, alpha, fn, hue = '78, 46, 24') {
  ctx.save();
  ctx.shadowColor = `rgba(${hue}, ${alpha})`;
  ctx.shadowBlur = blur;
  ctx.shadowOffsetY = dy;
  ctx.shadowOffsetX = dy * .35;
  fn();
  ctx.restore();
}

/** یک برگه‌ی کاغذ با سایه — پایه‌ی همه‌ی کارت‌ها و تابلوها. */
function paper(x, y, w, h, fill, seed = 1, r = 12, shadow = .26) {
  withShadow(16, 7, shadow, () => {
    ctx.fillStyle = fill;
    wobbleRect(x, y, w, h, r, seed, 2);
    ctx.fill();
  });
  /* الیافِ کاغذ و لبهٔ روشن، تا سطح تخت نماند */
  ctx.save();
  ctx.beginPath(); wobbleRect(x, y, w, h, r, seed, 2); ctx.clip();
  ctx.globalAlpha = .5;
  ctx.fillStyle = texPaper(fill);
  ctx.fillRect(x, y, w, h);
  ctx.globalAlpha = 1;
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.4, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(90,60,20,.1)');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
}

function text(str, x, y, o = {}) {
  const size = o.size || 20;
  const fam = o.family || 'Vazirmatn';
  ctx.save();
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.font = `${fam === 'Lalezar' ? '400' : (o.weight || 700)} ${size}px "${fam}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.baseline || 'middle';
  ctx.fillStyle = o.color || '#43291b';
  ctx.direction = 'rtl';
  if (o.stroke) {
    ctx.lineWidth = o.strokeWidth || 5;
    ctx.strokeStyle = o.stroke;
    ctx.lineJoin = 'round';
    ctx.strokeText(str, x, y, o.maxWidth);
  }
  ctx.fillText(str, x, y, o.maxWidth);
  ctx.restore();
}

/** متنِ چندخطی که خودش می‌شکند. ارتفاعِ اشغال‌شده را برمی‌گرداند. */
function textWrap(str, x, y, maxW, o = {}) {
  const size = o.size || 19, lh = o.lineHeight || size * 1.7;
  ctx.font = `${o.weight || 700} ${size}px "${o.family || 'Vazirmatn'}", Tahoma, sans-serif`;
  const lines = [];
  for (const para of str.split('\n')) {
    let line = '';
    for (const wd of para.split(' ')) {
      const t = line ? line + ' ' + wd : wd;
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = wd; }
      else line = t;
    }
    lines.push(line);
  }
  lines.forEach((l, i) => text(l, x, y + i * lh, o));
  return lines.length * lh;
}

/* ───────── ذره‌ها ───────── */

class Bits {
  constructor() { this.list = []; }
  add(x, y, n, kind, colors, opts = {}) {
    for (let i = 0; i < n; i++) {
      const a = opts.dir !== undefined ? opts.dir + (Math.random()-.5) * (opts.spread || 1) : Math.random() * TAU;
      const sp = (opts.speed || 200) * (.4 + Math.random());
      this.list.push({
        kind, x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - (opts.lift || 0),
        r: (opts.size || 4) * (.5 + Math.random()),
        rot: Math.random() * TAU, vr: (Math.random()-.5) * 10,
        col: colors[(Math.random() * colors.length) | 0],
        grav: opts.grav === undefined ? 620 : opts.grav,
        drag: opts.drag || .995,
        life: (opts.life || .9) * (.6 + Math.random() * .8), age: 0,
      });
    }
  }
  confetti(x, y, n, colors) {
    this.add(x, y, n, 'flake', colors, { speed: 420, lift: 190, size: 5, life: 1.6, grav: 780 });
  }
  spark(x, y, n, colors) {
    this.add(x, y, n, 'dot', colors, { speed: 180, lift: 30, size: 3.4, life: .7, grav: 260, drag: .93 });
  }
  step(dt) {
    for (const p of this.list) {
      p.age += dt;
      p.vy += p.grav * dt;
      p.vx *= p.drag; p.vy *= p.drag;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    }
    this.list = this.list.filter((p) => p.age < p.life);
  }
  draw() {
    for (const p of this.list) {
      const k = clamp(1 - p.age / p.life, 0, 1);
      ctx.save();
      ctx.globalAlpha = k;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.col;
      if (p.kind === 'flake') ctx.fillRect(-p.r, -p.r*1.5, p.r*2, p.r*3);
      else if (p.kind === 'leaf') { wobbleEllipse(0, 0, p.r*1.8, p.r*.8, 0, p.r, .6); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(0, 0, p.r * k, 0, TAU); ctx.fill(); }
      ctx.restore();
    }
  }
  clear() { this.list.length = 0; }
}

/* ───────── صدا (بدون فایل صوتی) ───────── */

const sfx = {
  ac: null, on: true,
  _c() {
    if (!this.on) return null;
    if (!this.ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; this.ac = new A(); }
    if (this.ac.state === 'suspended') this.ac.resume();
    return this.ac;
  },
  tone(f, dur = .16, type = 'sine', gain = .13, delay = 0) {
    const c = this._c(); if (!c) return;
    const t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(t0 + dur + .04);
  },
  tap()  { this.tone(430, .07, 'triangle', .09); },
  place(){ this.tone(620, .11, 'sine', .12); },
  pop()  { this.tone(760, .09, 'sine', .11); },
  slide(){ this.tone(240, .22, 'sine', .07); },
  good() { [523, 659, 784].forEach((f,i) => this.tone(f, .22, 'sine', .13, i*.07)); },
  win()  { [523, 659, 784, 1047].forEach((f,i) => this.tone(f, .34, 'triangle', .13, i*.10)); },
  nope() { this.tone(180, .2, 'sawtooth', .07); },
  tick() { this.tone(1100, .04, 'square', .05); },
};

/* ───────── قطعه‌های آماده ───────── */

function star(x, y, r, col, rot = 0) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = col;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI/2 + i * Math.PI/5;
    const rr = i % 2 ? r * .45 : r;
    const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/** دکمهٔ کاغذی. hovered را خودِ بازی می‌دهد؛ اینجا فقط کشیده می‌شود. */
/** رنگ را روشن‌تر (k>0) یا تیره‌تر (k<0) می‌کند. */
function shade(col, k) {
  const c = String(col).trim();
  let r, g2, b2;
  if (c[0] === '#') {
    const h = c.length === 4 ? c[1]+c[1]+c[2]+c[2]+c[3]+c[3] : c.slice(1, 7);
    r = parseInt(h.slice(0,2), 16); g2 = parseInt(h.slice(2,4), 16); b2 = parseInt(h.slice(4,6), 16);
  } else {
    const m = c.match(/[\d.]+/g);
    if (!m || m.length < 3) return col;
    r = +m[0]; g2 = +m[1]; b2 = +m[2];
  }
  const f = (v) => Math.round(clamp(k < 0 ? v * (1 + k) : v + (255 - v) * k, 0, 255));
  return 'rgb(' + f(r) + ',' + f(g2) + ',' + f(b2) + ')';
}

function button(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 3 : 0;
  const fill = o.disabled ? (o.off || '#bcaa92') : (hot ? (o.hotFill || o.fill) : o.fill);
  const r = o.r === undefined ? 14 : o.r;
  /* لبهٔ زیرینِ تیره — دکمه از صفحه بیرون می‌زند */
  ctx.fillStyle = shade(fill, -.36);
  wobbleRect(b.x, b.y + dy + 7, b.w, b.h, r, b.x + b.y, 2);
  ctx.fill();
  withShadow(hot ? 22 : 14, hot ? 5 : 8, .32, () => {
    ctx.fillStyle = fill;
    wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2);
    ctx.fill();
  });
  /* حجم: روشن از بالا، تیره به پایین */
  ctx.save();
  ctx.beginPath(); wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2); ctx.clip();
  const g = ctx.createLinearGradient(0, b.y + dy, 0, b.y + dy + b.h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.45, 'rgba(255,255,255,.04)');
  g.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = g;
  ctx.fillRect(b.x, b.y + dy, b.w, b.h);
  /* برقِ باریکِ لبهٔ بالا */
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.fillRect(b.x + r, b.y + dy + 2, b.w - r * 2, 2);
  ctx.restore();
  text(label, b.x + b.w/2, b.y + b.h/2 + dy - (o.sub ? 9 : 0), {
    size: o.size || 26, color: o.color || '#fdf6e8', family: o.family || 'Lalezar',
  });
  if (o.sub) text(o.sub, b.x + b.w/2, b.y + b.h/2 + dy + 17,
    { size: 14, color: o.subColor || 'rgba(255,255,255,.88)' });
}

/** دکمهٔ گرد کوچک (مثل + و −). */
function roundButton(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 2 : 0;
  withShadow(10, hot ? 3 : 5, .3, () => {
    ctx.fillStyle = o.disabled ? '#cbbba3' : (hot ? (o.hotFill || o.fill) : o.fill);
    wobbleCircle(b.x, b.y + dy, b.r, b.x, 1.4);
    ctx.fill();
  });
  text(label, b.x, b.y + dy - 1,
    { size: o.size || 32, color: o.disabled ? '#a8988a' : (o.color || '#fdf6e8'), family: 'Lalezar' });
}

/** پرده‌ی تمام‌صفحه: برای شروعِ پرده و برای جشنِ پایان. */
function overlay(o) {
  const k = easeOut(clamp(o.t / .5, 0, 1));
  ctx.fillStyle = `rgba(30, 22, 16, ${.66 * k})`;
  ctx.fillRect(0, 0, SW, SH);

  const w = o.w || 700, h = o.h || 290;
  const x = (SW - w) / 2, y = o.y || (SH * .22);
  const s = lerp(.9, 1, easeBack(clamp(o.t / .65, 0, 1)));
  ctx.save();
  ctx.translate(SW/2, y + h/2);
  ctx.scale(s, s);
  ctx.translate(-SW/2, -(y + h/2));

  withShadow(30, 14, .42, () => {
    ctx.fillStyle = o.paper || '#fbf3e2';
    wobbleRect(x, y, w, h, 18, 121, 2.4);
    ctx.fill();
  });
  ctx.fillStyle = o.band || '#c8434f';
  wobbleRect(x, y, w, 12, 6, 123, 1);
  ctx.fill();

  if (o.icon) o.icon(SW/2, y + 56);
  text(o.title, SW/2, y + (o.icon ? 108 : 62),
    { size: o.titleSize || 36, color: o.ink || '#43291b', family: 'Lalezar', alpha: k });
  textWrap(o.body, SW/2, y + (o.icon ? 158 : 116), w - 90,
    { size: 19, color: o.inkSoft || '#8a6a52', alpha: k });
  ctx.restore();

  button(o.btn, o.btnLabel, { hot: o.btnHot, fill: o.btnFill || '#7fa356', hotFill: o.btnHotFill || '#8fb45f', size: 28 });
}

/** پیامِ کوتاهِ بالای صحنه. */
class Toast {
  constructor() { this.msg = null; this.t = 0; this.kind = 'info'; }
  say(msg, kind = 'info') { this.msg = msg; this.kind = kind; this.t = 2.6; }
  step(dt) { if (this.t > 0) { this.t -= dt; if (this.t <= 0) this.msg = null; } }
  draw(y = 24, colors = {}) {
    if (!this.msg) return;
    const k = clamp(this.t, 0, 1) * clamp((2.6 - this.t) * 5, 0, 1);
    ctx.save();
    ctx.globalAlpha = k;
    ctx.font = `700 19px "Vazirmatn", Tahoma, sans-serif`;
    const w = ctx.measureText(this.msg).width + 76;
    const fill = this.kind === 'good' ? (colors.good || '#7fa356')
               : this.kind === 'bad' ? (colors.bad || '#c8434f')
               : (colors.info || '#fbf3e2');
    paper(SW/2 - w/2, y, w, 48, fill, 151, 12, .3);
    text(this.msg, SW/2, y + 25,
      { size: 19, color: this.kind === 'info' ? (colors.ink || '#43291b') : '#fff8ec' });
    ctx.restore();
  }
}

/* ───────── آموزشِ پرده‌ای ─────────
   پرده‌هایی که منتظرِ کارِ بچه نیستند با یک ضربه جلو می‌روند. تایمر فقط
   پشتیبان است؛ بچهٔ کلاس سومی باید فرصتِ خواندن داشته باشد، نه اینکه
   متن قبل از تمام شدنِ خواندنش برود.                                    */

/** اگر پردهٔ فعلی خواندنی است، ضربه را می‌خورد و می‌رود پردهٔ بعد. */
function tutTap(tut, tapSteps, lastStep) {
  if (!tut.on || tapSteps.indexOf(tut.step) < 0) return false;
  if (tut.step >= lastStep) tut.on = false;
  else { tut.step++; tut.t = 0; }
  sfx.tap();
  return true;
}

/** نشانهٔ «برای ادامه بزن» — زیرِ کارتِ آموزش. */
function tutMore(cx, y, t, ink = '#3a2a18', bg = 'rgba(255, 250, 238, .94)') {
  ctx.save();
  ctx.globalAlpha = .62 + .38 * Math.sin(t * 3.2);
  ctx.font = '700 15px "Vazirmatn", Tahoma, sans-serif';
  const label = 'برای ادامه، هرجا را بزن';
  const w = ctx.measureText(label).width + 40, h = 32, x = cx - w / 2, r = 16;
  withShadow(10, 4, .3, () => {
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath(); ctx.fill();
  });
  text(label, cx, y + h / 2, { size: 15, color: ink });
  ctx.restore();
}

/** فونت‌ها را می‌آورد و بعد بازی را شروع می‌کند.
    مهم: هر دو راه (رسیدنِ فونت و مهلتِ پشتیبان) ممکن است برسند، ولی
    شروع فقط باید یک بار انجام شود؛ وگرنه دو حلقهٔ فریم راه می‌افتد و
    بازی دوبرابر سریع می‌شود. */
function whenFontsReady(start) {
  let done = false;
  const go = () => { if (done) return; done = true; start(); };
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('400 40px Lalezar'),
      document.fonts.load('700 20px Vazirmatn'),
      document.fonts.load('900 20px Vazirmatn'),
    ]).then(go, go);
    setTimeout(go, 2600);
  } else go();
}

/** حلقهٔ فریم با dtِ محدودشده. */
/* ───────── کیفیتِ خودکار ─────────
   اگر دستگاه کُند بود، اوّل درخشش و بعد رنگ‌بندی خاموش می‌شود تا بازی
   روان بماند. روی دستگاهِ قوی همه‌چیز روشن است. */
let QUALITY = 2;
let _fAcc = 0, _fN = 0, _qHold = 0;

function _qualityTick(gap) {
  if (gap <= 0 || gap > 200) return;
  _fAcc += gap; _fN++;
  if (_fN < 45) return;
  const avg = _fAcc / _fN;
  _fAcc = 0; _fN = 0;
  if (_qHold > 0) { _qHold--; return; }
  /* فاصلهٔ بالا و پایین باید باز باشد، وگرنه کیفیت بین دو پله بالا و
     پایین می‌پرد و بازی مدام تغییرِ ظاهر می‌دهد. */
  const before = QUALITY;
  if (avg > 21 && QUALITY > 0) { QUALITY--; _qHold = 4; }
  else if (avg < 13.5 && QUALITY < 2) { QUALITY++; _qHold = 10; }
  /* در پایین‌ترین کیفیت، صحنه را با نقطه‌های کمتر می‌کشیم */
  if (before !== QUALITY && (before === 0 || QUALITY === 0) && _refit) _refit();
}

/* یک حلقه، نه بیشتر — دو حلقه یعنی زمانِ بازی دوبرابر می‌گذرد.

   MOTION: تا پیش از این، به‌خاطرِ باگِ دو حلقه، همهٔ بازی‌ها عملاً با
   سرعتِ دو برابر اجرا می‌شدند و زمان‌بندی‌ها هم با همان حس تنظیم شده
   بودند. حالا که باگ رفع شده، سرعتِ درست (یک برابر) کُند به نظر
   می‌رسد. این ضریب جانِ حرکت‌ها را برمی‌گرداند، ولی نه تا آن دو برابرِ
   تصادفی. فقط روی جانِ حرکت اثر دارد، نه روی هیچ قانونِ علمی. */
const MOTION = 1.45;
let _looping = false;
function runLoop(step) {
  if (_looping) return;
  _looping = true;
  let last = performance.now();
  const frame = (now) => {
    const gap = now - last;
    /* بریدنِ بعد از ضرب، تا یک فریمِ کُند پرشِ بزرگ نسازد */
    const dt = Math.min(gap / 1000 * MOTION, 1/15);
    last = now;
    _qualityTick(gap);
    step(dt);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

/* ═════════════════ بازی ═════════════════ */
/* ═══════════════════════════════════════════════════════════════════════
   تئاترِ سایه — ریاضی سوم، فصل ۵، درس ۱ (حلّ مسئله: زیرمسئله)
   ───────────────────────────────────────────────────────────────────────
   درسِ کتاب می‌گوید: مسئلهٔ بزرگ را به چند مسئلهٔ کوچک بشکن. صفحهٔ ۸۱ هم
   همین را با شکل می‌گوید: «این شکل‌ها از قطعه‌های مختلفی درست شده‌اند،
   این قطعه‌ها را جدا کنید.»

   اینجا برعکسش را بازی می‌کنیم، چون بازی‌تر است: سایهٔ یک چیز روی پرده
   افتاده و تو باید با تکّه‌های مقوّاییِ سادهٔ پشتِ صحنه، دقیقاً همان سایه
   را بسازی. هیچ تکّه‌ای به‌تنهایی جوابِ سایه نیست؛ باید ببینی سایه از چه
   قطعه‌هایی ساخته شده.

   شمع می‌سوزد. هر سایه‌ای که کامل شود، شمع را بلندتر می‌کند و عروسک
   جان می‌گیرد.

   هیچ‌جا نوشته نمی‌شود کدام تکّه کجاست؛ فقط تکّه‌ها و سایه.
   ═══════════════════════════════════════════════════════════════════════ */

/* ───────── سایه‌ها: هر کدام چند قطعهٔ ساده ───────── */

  { name: 'سایه‌های بزرگ', pool: ['cat', 'bird', 'boat'], decoy: 1, wax: 46, quota: 4,

  { name: 'نمایشِ بزرگ', pool: ['camel', 'rocket', 'cat', 'bird'], decoy: 2, wax: 44, quota: 5,

const HUD_H = 52;
const SCREEN = { x: 246, y: 88, w: 620, h: 452 };
const RACK   = { x: 56, y: 566, w: 1088, h: 164 };
const CANDLE = { x: 1000, y: 130, w: 130, h: 400 };

/* ───────── وضعیت ───────── */

const S = {
  phase: 'intro',
  level: 0,
  shape: null,
  gx: 0, gy: 0,          // گوشهٔ شبکه روی صحنه
  need: [],              // خانه‌های سایه
  fill: [],              // خانه‌های پوشیده‌شده
  rack: [],              // { w, h, id, used, x, y }
  placed: [],            // { w, h, c, r, id, t }
  drag: null,
  wax: 1, waxMax: 46,
  cleared: 0, quota: 0,
  score: 0, best: 0, combo: 0,
  alive: 0,              // انیمیشنِ جان‌گرفتنِ عروسک
  moths: [],
  t: 0, phaseT: 0, hover: null, shake: 0, glow: 0,
  tut: { on: true, step: 0, t: 0 },
};

const bits = new Bits();
const toast = new Toast();
const L = () => LEVELS[S.level];

function loadBest() { try { return +localStorage.getItem('saye-best') || 0; } catch { return 0; } }
function saveBest(v) { try { localStorage.setItem('saye-best', String(v)); } catch { /* حالتِ خصوصی */ } }

const cv = document.getElementById('stage');
initStage(cv, SCENE_W, SCENE_H);
S.best = loadBest();
for (let i = 0; i < 7; i++) {
  S.moths.push({ x: 900 + Math.random() * 260, y: 160 + Math.random() * 320,
                 ph: Math.random() * TAU, sp: .5 + Math.random() * .9, r: 3 + Math.random() * 3 });
}
whenFontsReady(() => runLoop(step));

/* ───────── ساختِ پرده ───────── */

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}

function newShow() {
  const lv = L();
  const pool = lv.pool || SHAPES.map((s) => s.id);
  const id = pool[Math.floor(Math.random() * pool.length)];
  const sh = SHAPES.find((s) => s.id === id);
  S.shape = sh;
  S.gx = Math.round((SCREEN.x + SCREEN.w / 2 - sh.w * CELL / 2) / 1);
  S.gy = Math.round((SCREEN.y + SCREEN.h / 2 - sh.h * CELL / 2) / 1);
  S.need = [];
  S.fill = [];
  for (let r = 0; r < sh.h; r++) { S.need.push(new Array(sh.w).fill(0)); S.fill.push(new Array(sh.w).fill(-1)); }
  for (const q of sh.rects) for (let r = q.y; r < q.y + q.h; r++) for (let c = q.x; c < q.x + q.w; c++) S.need[r][c] = 1;

  /* تکّه‌ها: دقیقاً همان قطعه‌های سایه، به‌هم‌ریخته و گاهی چرخیده */
  const items = sh.rects.map((q, i) => {
    const rot = Math.random() < .5 && q.w !== q.h;
    return { w: rot ? q.h : q.w, h: rot ? q.w : q.h, id: i, used: false };
  });
  /* تکّهٔ اضافه: مستطیلی که هیچ‌جای سایه جا نمی‌شود، ولی اندازه‌اش باورکردنی است. */
  const big = Math.max.apply(null, sh.rects.map((q) => q.w * q.h));
  for (let d = 0; d < lv.decoy; d++) {
    for (let tries = 0; tries < 80; tries++) {
      const w = 1 + Math.floor(Math.random() * sh.w), h = 1 + Math.floor(Math.random() * sh.h);
      if (w * h < 2 || w * h > big + 4) continue;
      if (items.some((z) => (z.w === w && z.h === h) || (z.w === h && z.h === w))) continue;
      if (fitsAnywhere(w, h) || fitsAnywhere(h, w)) continue;
      items.push({ w, h, id: 100 + d, used: false, decoy: true });
      break;
    }
  }
  S.rack = shuffle(items);
  layoutRack();
  S.placed = [];
  S.drag = null;
  S.alive = 0;
}

/** آیا مستطیلِ w×h اصلاً جایی توی سایه جا می‌شود؟ (برای ساختنِ تکّهٔ اضافه) */
function fitsAnywhere(w, h) {
  const sh = S.shape;
  for (let r = 0; r + h <= sh.h; r++) for (let c = 0; c + w <= sh.w; c++) {
    let ok = true;
    for (let rr = r; rr < r + h && ok; rr++) for (let cc = c; cc < c + w; cc++) if (!S.need[rr][cc]) { ok = false; break; }
    if (ok) return true;
  }
  return false;
}

function layoutRack() {
  const n = S.rack.length;
  const slot = Math.min(150, (RACK.w - 40) / Math.max(1, n));
  const total = slot * n;
  S.rack.forEach((p, i) => {
    p.x = RACK.x + (RACK.w - total) / 2 + slot * i + slot / 2;
    p.s = Math.min(.8, (slot - 26) / (p.w * CELL), 98 / (p.h * CELL));
    p.y = RACK.y + 58 + p.h * CELL * p.s / 2;
    p.slot = slot;
  });
}

function startLevel(i, keep) {
  const lv = LEVELS[i];
  S.level = i;
  S.cleared = 0;
  S.quota = lv.endless ? Infinity : lv.quota;
  S.combo = 0;
  S.waxMax = lv.wax; S.wax = 1;
  if (!keep) { S.score = 0; }
  S.phase = 'play'; S.phaseT = 0;
  S.tut.on = i === 0 && !keep; S.tut.step = 0; S.tut.t = 0;
  newShow();
  if (S.tut.on) {
    S.shape = SHAPES[1]; // درخت: سه تکّه، ساده
    newShowFrom(SHAPES[1]);
  }
  toast.say(lv.hint, 'info');
}

function newShowFrom(sh) {
  S.shape = sh;
  S.gx = SCREEN.x + SCREEN.w / 2 - sh.w * CELL / 2;
  S.gy = SCREEN.y + SCREEN.h / 2 - sh.h * CELL / 2;
  S.need = []; S.fill = [];
  for (let r = 0; r < sh.h; r++) { S.need.push(new Array(sh.w).fill(0)); S.fill.push(new Array(sh.w).fill(-1)); }
  for (const q of sh.rects) for (let r = q.y; r < q.y + q.h; r++) for (let c = q.x; c < q.x + q.w; c++) S.need[r][c] = 1;
  S.rack = shuffle(sh.rects.map((q, i) => ({ w: q.w, h: q.h, id: i, used: false })));
  layoutRack();
  S.placed = []; S.drag = null; S.alive = 0;
}

/* ───────── حلقه ───────── */

function step(dt) {
  S.t += dt; S.phaseT += dt;
  if (S.shake > 0) S.shake -= dt;
  if (S.glow > 0) S.glow -= dt;
  if (S.alive > 0) {
    S.alive += dt;
    if (S.alive > 2.2) { S.alive = 0; newShow(); }
  }
  if (S.phase === 'play' && !S.alive) {
    const frozen = S.tut.on && S.tut.step < 2;
    if (!frozen) {
      S.wax -= dt / S.waxMax;
      if (S.wax <= 0) { S.wax = 0; S.phase = 'lost'; S.phaseT = 0; sfx.nope(); }
    }
    if (S.tut.on) S.tut.t += dt;
  }
  for (const m of S.moths) {
    m.ph += dt * m.sp;
    m.x += Math.cos(m.ph * 1.7) * 26 * dt;
    m.y += Math.sin(m.ph * 2.3) * 22 * dt;
  }
  bits.step(dt);
  toast.step(dt);
  draw();
}

/* ───────── چیدنِ تکّه ───────── */

const gridOf = (p) => ({ c: Math.floor((p.x - S.gx) / CELL), r: Math.floor((p.y - S.gy) / CELL) });

/** آیا این تکّه با این گوشه، درست روی سایهٔ خالی می‌نشیند؟ */
function canPlace(w, h, c, r) {
  const sh = S.shape;
  if (c < 0 || r < 0 || c + w > sh.w || r + h > sh.h) return false;
  for (let rr = r; rr < r + h; rr++) for (let cc = c; cc < c + w; cc++) {
    if (!S.need[rr][cc] || S.fill[rr][cc] >= 0) return false;
  }
  return true;
}

function stamp(pc, v) {
  for (let rr = pc.r; rr < pc.r + pc.h; rr++) for (let cc = pc.c; cc < pc.c + pc.w; cc++) S.fill[rr][cc] = v;
}

function isDone() {
  const sh = S.shape;
  for (let r = 0; r < sh.h; r++) for (let c = 0; c < sh.w; c++) if (S.need[r][c] && S.fill[r][c] < 0) return false;
  return true;
}

function finishShow() {
  S.alive = .001;
  S.combo++;
  S.cleared++;
  S.wax = Math.min(1, S.wax + .34);
  const pts = 240 + S.placed.length * 70 + Math.min(S.combo, 6) * 60 + Math.round(S.wax * 200);
  S.score += pts;
  if (S.score > S.best) { S.best = S.score; saveBest(S.best); }
  S.glow = 1.1;
  bits.confetti(SCREEN.x + SCREEN.w / 2, SCREEN.y + SCREEN.h / 2, 46,
    [P.gold, P.flame, '#fff', P.screen]);
  sfx.win();
  if (S.tut.on) S.tut.on = false;
  if (!L().endless && S.cleared >= S.quota) { S.score += 600; S.phase = 'won'; S.phaseT = 0; }
}

/* ───────── ورودی ───────── */

function rackAt(p) {
  for (let i = 0; i < S.rack.length; i++) {
    const q = S.rack[i];
    if (q.used) continue;
    const w = q.w * CELL * q.s, h = q.h * CELL * q.s;
    if (Math.abs(p.x - q.x) < Math.max(w, q.slot * .5) / 2 + 4 && Math.abs(p.y - q.y) < h / 2 + 24) return i;
  }
  return -1;
}

function placedAt(p) {
  for (let i = S.placed.length - 1; i >= 0; i--) {
    const q = S.placed[i];
    const x = S.gx + q.c * CELL, y = S.gy + q.r * CELL;
    if (p.x >= x && p.x <= x + q.w * CELL && p.y >= y && p.y <= y + q.h * CELL) return i;
  }
  return -1;
}

cv.addEventListener('pointermove', (e) => {
  const p = toStage(e);
  if (S.phase !== 'play') { S.hover = inRect(p, BTN_GO) ? BTN_GO : null; cv.style.cursor = S.hover ? 'pointer' : 'default'; return; }
  if (S.drag) { S.drag.x = p.x; S.drag.y = p.y; S.drag.moved += 1; return; }
  cv.style.cursor = (rackAt(p) >= 0 || placedAt(p) >= 0) ? 'grab' : 'default';
});

cv.addEventListener('pointerdown', (e) => {
  const p = toStage(e);
  if (S.phase === 'intro') { startLevel(0); return; }
  if (S.phase === 'won') {
    if (!inRect(p, BTN_GO)) return;
    if (L().endless) startLevel(S.level, true);
    else if (S.level + 1 < LEVELS.length) startLevel(S.level + 1, true);
    else startLevel(0);
    return;
  }
  if (S.phase === 'lost') { if (inRect(p, BTN_GO)) startLevel(S.level); return; }
  if (S.alive) return;
  if (tutTap(S.tut, TUT_TAP, TUT_LAST)) return;

  const ri = rackAt(p);
  if (ri >= 0) {
    const q = S.rack[ri];
    S.drag = { from: 'rack', i: ri, w: q.w, h: q.h, x: p.x, y: p.y, moved: 0, dx: 0, dy: 0 };
    sfx.tap();
    try { cv.setPointerCapture(e.pointerId); } catch { /* بعضی مرورگرها */ }
    return;
  }
  const pi = placedAt(p);
  if (pi >= 0) {
    const q = S.placed[pi];
    stamp(q, -1);
    S.placed.splice(pi, 1);
    const rq = S.rack.find((z) => z.id === q.id);
    if (rq) { rq.used = false; rq.w = q.w; rq.h = q.h; }
    S.drag = { from: 'board', i: -1, id: q.id, w: q.w, h: q.h, x: p.x, y: p.y, moved: 0,
               dx: p.x - (S.gx + q.c * CELL) - q.w * CELL / 2, dy: p.y - (S.gy + q.r * CELL) - q.h * CELL / 2 };
    sfx.tap();
    try { cv.setPointerCapture(e.pointerId); } catch { /* بعضی مرورگرها */ }
  }
});

cv.addEventListener('pointerup', (e) => {
  const p = toStage(e);
  const d = S.drag;
  S.drag = null;
  if (!d || S.phase !== 'play') return;

  /* ضربهٔ بی‌حرکت روی تکّهٔ رَف = چرخاندن */
  if (d.from === 'rack' && d.moved < 4) {
    const q = S.rack[d.i];
    if (q && q.w !== q.h) { const t = q.w; q.w = q.h; q.h = t; sfx.tone(520, .08, 'triangle', .05); layoutRack(); }
    return;
  }
  const cx = p.x - (d.dx || 0), cy = p.y - (d.dy || 0);
  const g = gridOf({ x: cx - d.w * CELL / 2 + CELL / 2, y: cy - d.h * CELL / 2 + CELL / 2 });
  if (canPlace(d.w, d.h, g.c, g.r)) {
    const id = d.from === 'rack' ? S.rack[d.i].id : d.id;
    const pc = { w: d.w, h: d.h, c: g.c, r: g.r, id, t: 0 };
    S.placed.push(pc);
    stamp(pc, S.placed.length - 1);
    if (d.from === 'rack') S.rack[d.i].used = true;
    else { const rq = S.rack.find((z) => z.id === id); if (rq) rq.used = true; }
    sfx.tone(300 + S.placed.length * 40, .1, 'sine', .06);
    if (S.tut.on && S.tut.step === 1) { S.tut.step = 2; S.tut.t = 0; }
    if (isDone()) finishShow();
  } else {
    if (d.from === 'board') { const rq = S.rack.find((z) => z.id === d.id); if (rq) rq.used = false; }
    S.shake = .12;
    sfx.nope();
  }
});

cv.addEventListener('pointercancel', () => { if (S.drag && S.drag.from === 'board') {
  const rq = S.rack.find((z) => z.id === S.drag.id); if (rq) rq.used = false; } S.drag = null; });

/* ───────── آموزش ───────── */

const TUT_TAP = [0, 2], TUT_LAST = 2;

function tutCard(x, y, w, lines, title) {
  const h = 26 + (title ? 44 : 0) + lines.length * 30;
  withShadow(24, 10, .5, () => {
    ctx.fillStyle = 'rgba(246, 233, 210, .97)';
    wobbleRect(x, y, w, h + 20, 16, 101, 2.2); ctx.fill();
  }, '10, 4, 16');
  ctx.fillStyle = P.curtain;
  wobbleRect(x, y, w, 9, 4, 103, 1); ctx.fill();
  let yy = y + 34;
  if (title) { text(title, x + w / 2, yy + 6, { size: 25, family: 'Lalezar', color: P.ink }); yy += 44; }
  for (const l of lines) { text(l, x + w / 2, yy, { size: 18, color: '#6a5060' }); yy += 30; }
  return h + 20;
}

function rrPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function numText(str, x, y, o = {}) {
  ctx.save();
  ctx.font = `${o.family === 'Vazirmatn' ? (o.weight || 700) : '400'} ${o.size || 20}px "${o.family || 'Lalezar'}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  ctx.direction = 'ltr';
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.fillStyle = o.color || P.ink;
  ctx.fillText(str, x, y);
  ctx.restore();
}

function spot(rects, alpha) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, SCENE_W, SCENE_H);
  for (const r of rects) rrPath(r.x - 12, r.y - 12, r.w + 24, r.h + 24, 22);
  ctx.fillStyle = `rgba(10, 4, 16, ${alpha})`;
  ctx.fill('evenodd');
  ctx.restore();
}

/* ───────── سایه‌های نرم (پاداشِ پایانِ پرده) ───────── */

function silhouette(id, x, y, w, h, t) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = P.shade;
  ctx.strokeStyle = P.shade;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const S1 = w, H1 = h;
  const wig = Math.sin(t * 4);
  if (id === 'house') {
    ctx.beginPath(); ctx.moveTo(0, H1 * .34); ctx.lineTo(S1 / 2, 0); ctx.lineTo(S1, H1 * .34); ctx.closePath(); ctx.fill();
    ctx.beginPath(); rrPath(S1 * .1, H1 * .32, S1 * .8, H1 * .68, 8); ctx.fill();
    ctx.fillRect(S1 * .72, H1 * .04, S1 * .1, H1 * .2);
    ctx.save(); ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath(); rrPath(S1 * .42, H1 * .58, S1 * .18, H1 * .42, 6); ctx.fill();
    ctx.beginPath(); ctx.arc(S1 * .26, H1 * .56, S1 * .07, 0, TAU); ctx.fill();
    ctx.restore();
  } else if (id === 'tree') {
    ctx.lineWidth = S1 * .16;
    ctx.beginPath(); ctx.moveTo(S1 / 2, H1); ctx.quadraticCurveTo(S1 * .46, H1 * .7, S1 / 2, H1 * .5); ctx.stroke();
    for (const b of [[.5, .2, .34], [.28, .36, .26], [.72, .36, .26], [.5, .42, .3]]) {
      ctx.beginPath(); ctx.arc(S1 * b[0], H1 * b[1] + wig * 1.6, S1 * b[2], 0, TAU); ctx.fill();
    }
  } else if (id === 'fish') {
    ctx.save(); ctx.translate(S1 * .38, H1 * .5); ctx.rotate(wig * .07);
    ctx.beginPath(); ctx.ellipse(0, 0, S1 * .36, H1 * .34, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-S1 * .1, -H1 * .3); ctx.lineTo(S1 * .08, -H1 * .52); ctx.lineTo(S1 * .2, -H1 * .28); ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.save(); ctx.translate(S1 * .74, H1 * .5); ctx.rotate(wig * .3);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(S1 * .26, -H1 * .42); ctx.lineTo(S1 * .26, H1 * .42); ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.save(); ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath(); ctx.arc(S1 * .18, H1 * .42, S1 * .034, 0, TAU); ctx.fill(); ctx.restore();
  } else if (id === 'boat') {
    ctx.save(); ctx.translate(S1 / 2, H1 * .5); ctx.rotate(wig * .05); ctx.translate(-S1 / 2, -H1 * .5);
    ctx.beginPath();
    ctx.moveTo(S1 * .02, H1 * .72); ctx.lineTo(S1 * .98, H1 * .72);
    ctx.quadraticCurveTo(S1 * .78, H1, S1 * .5, H1); ctx.quadraticCurveTo(S1 * .22, H1, S1 * .02, H1 * .72);
    ctx.closePath(); ctx.fill();
    ctx.lineWidth = S1 * .045;
    ctx.beginPath(); ctx.moveTo(S1 * .5, H1 * .72); ctx.lineTo(S1 * .5, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(S1 * .5, H1 * .06); ctx.lineTo(S1 * .5, H1 * .66);
    ctx.quadraticCurveTo(S1 * .16, H1 * .6, S1 * .5, H1 * .06); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(S1 * .52, H1 * .02); ctx.lineTo(S1 * .78, H1 * .09); ctx.lineTo(S1 * .52, H1 * .17); ctx.closePath(); ctx.fill();
    ctx.restore();
  } else if (id === 'cat') {
    ctx.beginPath(); ctx.ellipse(S1 * .52, H1 * .66, S1 * .42, H1 * .27, 0, 0, TAU); ctx.fill();
    ctx.fillRect(S1 * .2, H1 * .82, S1 * .1, H1 * .18);
    ctx.fillRect(S1 * .62, H1 * .82, S1 * .1, H1 * .18);
    ctx.beginPath(); ctx.arc(S1 * .26, H1 * .3, S1 * .22, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(S1 * .08, H1 * .2); ctx.lineTo(S1 * .05, H1 * .01); ctx.lineTo(S1 * .24, H1 * .12); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(S1 * .3, H1 * .1); ctx.lineTo(S1 * .46, H1 * .0); ctx.lineTo(S1 * .45, H1 * .22); ctx.closePath(); ctx.fill();
    ctx.lineWidth = S1 * .07;
    ctx.beginPath(); ctx.moveTo(S1 * .9, H1 * .66);
    ctx.quadraticCurveTo(S1 * (1.1 + wig * .05), H1 * .4, S1 * .86, H1 * (.2 + wig * .04)); ctx.stroke();
  } else if (id === 'bird') {
    ctx.beginPath(); ctx.ellipse(S1 * .5, H1 * .56, S1 * .27, H1 * .22, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(S1 * .24, H1 * .44, S1 * .11, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(S1 * .16, H1 * .42); ctx.lineTo(S1 * .02, H1 * .5); ctx.lineTo(S1 * .16, H1 * .56); ctx.closePath(); ctx.fill();
    for (const s of [-1, 1]) {
      ctx.save(); ctx.translate(S1 * .5, H1 * .48); ctx.rotate(s * (.5 + wig * .5));
      ctx.beginPath(); ctx.ellipse(0, -H1 * .3, S1 * .12, H1 * .32, 0, 0, TAU); ctx.fill(); ctx.restore();
    }
    ctx.beginPath(); ctx.moveTo(S1 * .74, H1 * .56); ctx.lineTo(S1 * .99, H1 * .78); ctx.lineTo(S1 * .74, H1 * .74); ctx.closePath(); ctx.fill();
  } else if (id === 'rocket') {
    ctx.beginPath();
    ctx.moveTo(S1 * .5, 0); ctx.quadraticCurveTo(S1 * .84, H1 * .3, S1 * .8, H1 * .76);
    ctx.lineTo(S1 * .2, H1 * .76); ctx.quadraticCurveTo(S1 * .16, H1 * .3, S1 * .5, 0);
    ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(S1 * .2, H1 * .5); ctx.lineTo(S1 * .0, H1 * .84); ctx.lineTo(S1 * .2, H1 * .78); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(S1 * .8, H1 * .5); ctx.lineTo(S1, H1 * .84); ctx.lineTo(S1 * .8, H1 * .78); ctx.closePath(); ctx.fill();
    ctx.save(); ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath(); ctx.arc(S1 * .5, H1 * .34, S1 * .15, 0, TAU); ctx.fill(); ctx.restore();
    ctx.fillStyle = P.flame;
    const fl = .16 + Math.abs(wig) * .12;
    ctx.beginPath(); ctx.moveTo(S1 * .34, H1 * .78); ctx.quadraticCurveTo(S1 * .5, H1 * (.78 + fl * 2.4), S1 * .66, H1 * .78);
    ctx.closePath(); ctx.fill();
  } else {
    /* شتر */
    ctx.beginPath(); ctx.ellipse(S1 * .42, H1 * .56, S1 * .34, H1 * .2, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(S1 * .18, H1 * .44); ctx.quadraticCurveTo(S1 * .32, H1 * .12, S1 * .46, H1 * .44); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(S1 * .46, H1 * .46); ctx.quadraticCurveTo(S1 * .58, H1 * .18, S1 * .7, H1 * .46); ctx.closePath(); ctx.fill();
    ctx.lineWidth = S1 * .1;
    ctx.beginPath(); ctx.moveTo(S1 * .7, H1 * .5); ctx.quadraticCurveTo(S1 * .88, H1 * .3, S1 * .86, H1 * .1); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(S1 * .92, H1 * .07, S1 * .09, H1 * .06, -.3, 0, TAU); ctx.fill();
    ctx.lineWidth = S1 * .055;
    for (let k = 0; k < 4; k++) {
      const lx = S1 * (.24 + k * .13), sw = Math.sin(t * 3 + k * 1.5) * S1 * .015;
      ctx.beginPath(); ctx.moveTo(lx, H1 * .7); ctx.lineTo(lx + sw, H1 * .98); ctx.stroke();
    }
  }
  ctx.restore();
}

/* ───────── صحنه ───────── */

function draw() {
  beginScene(P.night);
  ctx.save();
  if (S.shake > 0) {
    const k = S.shake * 9;
    ctx.translate(Math.sin(S.t * 55) * k, Math.cos(S.t * 43) * k * .4);
  }
  drawHall();
  drawScreen();
  drawCandle();
  drawRack();
  drawDrag();
  bits.draw();
  ctx.restore();

  drawHUD();
  if (!(S.phase === 'play' && S.tut.on)) {
    ctx.save();
    ctx.translate(SCREEN.x + SCREEN.w / 2 - SCENE_W / 2, 0);
    toast.draw(HUD_H + 10, { good: P.good, bad: P.bad, info: P.paper, ink: P.ink });
    ctx.restore();
  }
  if (S.phase === 'play' && S.tut.on) drawTutorial();
  if (S.phase === 'intro') drawIntro();
  if (S.phase === 'won') drawWon();
  if (S.phase === 'lost') drawLost();
  endScene(.14, 'rgba(6, 2, 10, .5)');
}

function drawHall() {
  const g = ctx.createRadialGradient(SCENE_W / 2, 300, 60, SCENE_W / 2, 320, 780);
  g.addColorStop(0, '#2e2136');
  g.addColorStop(1, P.nightLo);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, SCENE_W, SCENE_H);

  /* پرده‌های مخملی دو طرف */
  for (const side of [0, 1]) {
    ctx.save();
    if (side) { ctx.translate(SCENE_W, 0); ctx.scale(-1, 1); }
    ctx.fillStyle = P.curtainDk;
    ctx.beginPath();
    ctx.moveTo(0, HUD_H); ctx.lineTo(238, HUD_H);
    for (let y = HUD_H; y <= SCENE_H; y += 18) ctx.lineTo(214 + Math.sin(y * .014) * 26, y);
    ctx.lineTo(0, SCENE_H); ctx.closePath(); ctx.fill();
    for (let i = 0; i < 5; i++) {
      ctx.fillStyle = i % 2 ? P.curtain : P.curtainLt;
      ctx.globalAlpha = .5;
      ctx.beginPath();
      const bx = 16 + i * 42;
      ctx.moveTo(bx, HUD_H);
      for (let y = HUD_H; y <= SCENE_H; y += 18) ctx.lineTo(bx + Math.sin(y * .015 + i) * 11, y);
      ctx.lineTo(bx + 15, SCENE_H);
      for (let y = SCENE_H; y >= HUD_H; y -= 18) ctx.lineTo(bx + 15 + Math.sin(y * .015 + i) * 11, y);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }
  /* چوبِ بالای صحنه */
  ctx.fillStyle = P.woodDk;
  ctx.fillRect(0, HUD_H, SCENE_W, 16);
  ctx.fillStyle = P.wood;
  ctx.fillRect(0, HUD_H, SCENE_W, 8);

  /* پروانه‌های شب گردِ نور */
  ctx.fillStyle = 'rgba(255, 232, 180, .5)';
  for (const m of S.moths) {
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(Math.sin(m.ph * 3) * .5);
    ctx.beginPath(); ctx.ellipse(-m.r, 0, m.r, m.r * .5, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(m.r, 0, m.r, m.r * .5, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

/** پردهٔ روشن با سایهٔ خالی و تکّه‌های چیده‌شده. */
function drawScreen() {
  withShadow(30, 12, .5, () => {
    ctx.fillStyle = P.woodDk;
    wobbleRect(SCREEN.x - 16, SCREEN.y - 16, SCREEN.w + 32, SCREEN.h + 32, 12, 11, 2); ctx.fill();
  }, '4, 0, 8');
  const g = ctx.createRadialGradient(SCREEN.x + SCREEN.w / 2, SCREEN.y + SCREEN.h * .42, 40,
                                     SCREEN.x + SCREEN.w / 2, SCREEN.y + SCREEN.h * .5, SCREEN.w * .78);
  g.addColorStop(0, P.screen);
  g.addColorStop(1, P.screen2);
  ctx.save();
  ctx.beginPath(); rrPath(SCREEN.x, SCREEN.y, SCREEN.w, SCREEN.h, 8); ctx.clip();
  ctx.fillStyle = g;
  ctx.fillRect(SCREEN.x, SCREEN.y, SCREEN.w, SCREEN.h);
  /* بافتِ پارچه */
  ctx.strokeStyle = 'rgba(180, 140, 80, .1)'; ctx.lineWidth = 1;
  for (let y = SCREEN.y; y < SCREEN.y + SCREEN.h; y += 7) {
    ctx.beginPath(); ctx.moveTo(SCREEN.x, y); ctx.lineTo(SCREEN.x + SCREEN.w, y); ctx.stroke();
  }
  if (!S.shape) { ctx.restore(); return; }
  const sh = S.shape;

  if (S.alive) {
    /* عروسک جان می‌گیرد */
    const k = clamp(S.alive / .45, 0, 1);
    ctx.globalAlpha = 1 - k;
    drawCells();
    ctx.globalAlpha = k;
    silhouette(sh.id, S.gx, S.gy, sh.w * CELL, sh.h * CELL, S.alive * 3);
    ctx.globalAlpha = 1;
  } else {
    /* جای خالیِ سایه */
    for (let r = 0; r < sh.h; r++) for (let c = 0; c < sh.w; c++) {
      if (!S.need[r][c] || S.fill[r][c] >= 0) continue;
      ctx.fillStyle = P.hole;
      ctx.fillRect(S.gx + c * CELL, S.gy + r * CELL, CELL, CELL);
    }
    /* خطّ دورِ سایه، تا مرزِ مسئله روشن باشد */
    ctx.strokeStyle = 'rgba(44, 29, 39, .7)'; ctx.lineWidth = 3.5;
    edgePath(); ctx.stroke();
    drawCells();
  }
  ctx.restore();

  if (S.glow > 0) {
    ctx.save();
    ctx.globalAlpha = S.glow * .5;
    ctx.fillStyle = P.flameHot;
    ctx.beginPath(); rrPath(SCREEN.x, SCREEN.y, SCREEN.w, SCREEN.h, 8); ctx.fill();
    ctx.restore();
  }
}

/** مرزِ بیرونیِ سایه (فقط ضلع‌هایی که همسایه ندارند). */
function edgePath() {
  const sh = S.shape;
  ctx.beginPath();
  const on = (r, c) => r >= 0 && c >= 0 && r < sh.h && c < sh.w && S.need[r][c];
  for (let r = 0; r < sh.h; r++) for (let c = 0; c < sh.w; c++) {
    if (!S.need[r][c]) continue;
    const x = S.gx + c * CELL, y = S.gy + r * CELL;
    if (!on(r - 1, c)) { ctx.moveTo(x, y); ctx.lineTo(x + CELL, y); }
    if (!on(r + 1, c)) { ctx.moveTo(x, y + CELL); ctx.lineTo(x + CELL, y + CELL); }
    if (!on(r, c - 1)) { ctx.moveTo(x, y); ctx.lineTo(x, y + CELL); }
    if (!on(r, c + 1)) { ctx.moveTo(x + CELL, y); ctx.lineTo(x + CELL, y + CELL); }
  }
}

function drawCells() {
  for (const q of S.placed) {
    const x = S.gx + q.c * CELL, y = S.gy + q.r * CELL, w = q.w * CELL, h = q.h * CELL;
    ctx.fillStyle = P.piece;
    ctx.beginPath(); rrPath(x + 1.5, y + 1.5, w - 3, h - 3, 5); ctx.fill();
    ctx.fillStyle = 'rgba(255, 235, 190, .07)';
    ctx.beginPath(); rrPath(x + 4, y + 4, w - 8, 5, 3); ctx.fill();
    ctx.strokeStyle = P.pieceEdge; ctx.lineWidth = 1.6;
    ctx.beginPath(); rrPath(x + 1.5, y + 1.5, w - 3, h - 3, 5); ctx.stroke();
  }
}

/** تکّه‌ای که روی چوبِ عروسک‌گردانی است. */
function paperPiece(x, y, w, h, s, hot) {
  const W = w * CELL * s, H = h * CELL * s;
  withShadow(hot ? 16 : 8, hot ? 6 : 3, .4, () => {
    ctx.fillStyle = hot ? P.pieceLt : P.piece;
    wobbleRect(x - W / 2, y - H / 2, W, H, 6, x + y, 1.4); ctx.fill();
  }, '4, 0, 8');
  ctx.strokeStyle = P.pieceEdge; ctx.lineWidth = 2;
  wobbleRect(x - W / 2, y - H / 2, W, H, 6, x + y, 1.4); ctx.stroke();
  /* شبکهٔ داخلی تا اندازه‌اش شمردنی باشد */
  ctx.strokeStyle = 'rgba(255, 235, 190, .13)'; ctx.lineWidth = 1;
  for (let i = 1; i < w; i++) {
    ctx.beginPath(); ctx.moveTo(x - W / 2 + i * CELL * s, y - H / 2 + 3); ctx.lineTo(x - W / 2 + i * CELL * s, y + H / 2 - 3); ctx.stroke();
  }
  for (let i = 1; i < h; i++) {
    ctx.beginPath(); ctx.moveTo(x - W / 2 + 3, y - H / 2 + i * CELL * s); ctx.lineTo(x + W / 2 - 3, y - H / 2 + i * CELL * s); ctx.stroke();
  }
}

function drawRack() {
  ctx.fillStyle = 'rgba(12, 6, 18, .55)';
  ctx.beginPath(); rrPath(RACK.x, RACK.y, RACK.w, RACK.h, 16); ctx.fill();
  ctx.fillStyle = P.woodDk;
  ctx.fillRect(RACK.x, RACK.y + RACK.h - 16, RACK.w, 16);
  ctx.fillStyle = P.wood;
  ctx.fillRect(RACK.x, RACK.y + RACK.h - 16, RACK.w, 6);
  text('تکّه‌های پشتِ صحنه', RACK.x + RACK.w / 2, RACK.y + 22,
    { size: 17, color: 'rgba(246, 233, 210, .5)' });

  for (const q of S.rack) {
    if (q.used) continue;
    if (S.drag && S.drag.from === 'rack' && S.rack[S.drag.i] === q) continue;
    /* چوبِ عروسک‌گردانی */
    ctx.strokeStyle = P.wood; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(q.x, q.y + q.h * CELL * q.s / 2 - 3); ctx.lineTo(q.x, RACK.y + RACK.h - 12); ctx.stroke();
    paperPiece(q.x, q.y, q.w, q.h, q.s, false);
  }
}

function drawDrag() {
  const d = S.drag;
  if (!d) return;
  const cx = d.x - (d.dx || 0), cy = d.y - (d.dy || 0);
  const g = gridOf({ x: cx - d.w * CELL / 2 + CELL / 2, y: cy - d.h * CELL / 2 + CELL / 2 });
  const ok = canPlace(d.w, d.h, g.c, g.r);
  if (ok) {
    ctx.save();
    ctx.globalAlpha = .35;
    ctx.fillStyle = P.piece;
    ctx.fillRect(S.gx + g.c * CELL, S.gy + g.r * CELL, d.w * CELL, d.h * CELL);
    ctx.restore();
  }
  paperPiece(cx, cy, d.w, d.h, 1, true);
}

/** شمعِ کنارِ صحنه — همان وقتِ بازی. */
function drawCandle() {
  const b = CANDLE;
  const hMax = b.h - 90;
  const h = hMax * clamp(S.wax, 0, 1);
  const baseY = b.y + b.h - 30;
  /* پایه */
  ctx.fillStyle = '#8d6a3a';
  wobbleEllipse(b.x + b.w / 2, baseY + 14, 54, 13, 0, 71, 1.6); ctx.fill();
  ctx.fillStyle = '#a9814a';
  wobbleRect(b.x + b.w / 2 - 16, baseY - 6, 32, 20, 5, 73, 1); ctx.fill();
  /* بدنهٔ شمع */
  ctx.fillStyle = '#f0e3c4';
  wobbleRect(b.x + b.w / 2 - 21, baseY - h, 42, h + 4, 8, 75, 1.4); ctx.fill();
  ctx.fillStyle = 'rgba(180, 150, 100, .3)';
  wobbleRect(b.x + b.w / 2 + 7, baseY - h, 14, h + 4, 6, 77, 1.2); ctx.fill();
  /* شعله */
  const fy = baseY - h - 6;
  const fl = 1 + Math.sin(S.t * 9) * .12;
  ctx.save();
  const gg = ctx.createRadialGradient(b.x + b.w / 2, fy - 14, 4, b.x + b.w / 2, fy - 14, 96 * fl);
  gg.addColorStop(0, 'rgba(255, 214, 130, .34)');
  gg.addColorStop(1, 'rgba(255, 190, 100, 0)');
  ctx.globalAlpha = 1;
  ctx.fillStyle = gg;
  ctx.beginPath(); ctx.arc(b.x + b.w / 2, fy - 14, 96 * fl, 0, TAU); ctx.fill();
  ctx.restore();
  ctx.fillStyle = P.flame;
  ctx.beginPath();
  ctx.moveTo(b.x + b.w / 2, fy - 40 * fl);
  ctx.quadraticCurveTo(b.x + b.w / 2 + 15, fy - 12, b.x + b.w / 2, fy);
  ctx.quadraticCurveTo(b.x + b.w / 2 - 15, fy - 12, b.x + b.w / 2, fy - 40 * fl);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = P.flameHot;
  ctx.beginPath(); ctx.ellipse(b.x + b.w / 2, fy - 13, 5, 11 * fl, 0, 0, TAU); ctx.fill();
  if (S.wax < .28) {
    ctx.save();
    ctx.globalAlpha = .5 + .5 * Math.sin(S.t * 7);
    text('شمع دارد تمام می‌شود', b.x + b.w / 2, b.y - 18, { size: 16, color: '#e6b06a' });
    ctx.restore();
  }
}

function drawHUD() {
  ctx.fillStyle = 'rgba(24, 14, 30, .86)';
  ctx.fillRect(0, 0, SCENE_W, HUD_H);
  ctx.fillStyle = 'rgba(233, 183, 74, .3)';
  ctx.fillRect(0, HUD_H - 2, SCENE_W, 2);
  text(L().name, SCENE_W - 24, HUD_H / 2, { size: 23, family: 'Lalezar', color: P.paper, align: 'right' });
  if (!L().endless) {
    numText(fa(Math.min(S.cleared, L().quota)) + ' / ' + fa(L().quota), SCENE_W / 2, HUD_H / 2,
      { size: 22, color: P.gold });
  } else {
    text('بی‌پایان', SCENE_W / 2, HUD_H / 2, { size: 22, family: 'Lalezar', color: P.gold });
  }
  numText(fa(S.score), 24, HUD_H / 2, { size: 25, color: P.gold, align: 'left' });
  numText('بیشترین ' + fa(S.best), 140, HUD_H / 2 + 1,
    { size: 14, color: 'rgba(246, 233, 210, .5)', align: 'left', family: 'Vazirmatn', weight: 700 });
  if (S.combo > 1) numText('×' + fa(S.combo), 248, HUD_H / 2, { size: 22, color: P.gold, align: 'left' });
}

function drawTutorial() {
  const st = S.tut.step;
  if (st === 0) {
    spot([SCREEN], .74);
    const h = tutCard(350, 592, 500,
      ['سایهٔ یک چیز روی پرده افتاده.', 'هیچ تکّه‌ای به‌تنهایی اندازهٔ آن نیست.'], 'تئاترِ سایه');
    tutMore(600, 592 + h + 12, S.t, P.ink);
  } else if (st === 1) {
    spot([RACK], .7);
    tutCard(350, 150, 500, ['یک تکّه را بردار و بکِش روی سایه.',
      'خودش سرِ جایش می‌نشیند.'], 'یک تکّه را بکِش');
  } else {
    spot([SCREEN, RACK], .66);
    const h = tutCard(350, 300, 500,
      ['روی تکّهٔ رَف بزن تا بچرخد.', 'روی تکّهٔ چیده‌شده بزن تا برش داری.',
       'وقتی سایه پُر شد، عروسک جان می‌گیرد.'], 'باقی‌اش با تو');
    tutMore(600, 300 + h + 12, S.t, P.ink);
  }
}

/* ───────── پرده‌ها ───────── */

function maskIcon(x, y) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = P.shade;
  ctx.beginPath(); ctx.ellipse(0, 2, 22, 26, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-20, -14); ctx.lineTo(-24, -34); ctx.lineTo(-4, -22); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(20, -14); ctx.lineTo(24, -34); ctx.lineTo(4, -22); ctx.closePath(); ctx.fill();
  ctx.fillStyle = P.flame;
  ctx.beginPath(); ctx.arc(-8, 0, 4, 0, TAU); ctx.arc(8, 0, 4, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawIntro() {
  overlay({
    t: S.phaseT, w: 730, h: 268, y: 146,
    paper: P.paper, band: P.curtain, ink: P.ink, inkSoft: '#7a6070',
    icon: maskIcon,
    title: 'تئاترِ سایه',
    body: 'سایه‌ای روی پرده افتاده که از چند تکّهٔ ساده ساخته شده.\nتکّه‌های پشتِ صحنه را بکِش روی آن تا کاملش کنی.\nتا شمع نسوخته، عروسک را زنده کن.',
    btn: BTN_GO, btnLabel: 'پرده را بالا بکش', btnHot: S.hover === BTN_GO,
    btnFill: '#7c3149', btnHotFill: '#93405b',
  });
}

function drawWon() {
  const last = S.level + 1 >= LEVELS.length;
  overlay({
    t: S.phaseT, w: 720, h: 250, y: 160,
    paper: P.paper, band: P.gold, ink: P.ink, inkSoft: '#7a6070',
    icon: maskIcon,
    title: L().endless ? 'شبِ خوبی بود' : 'تشویقِ تماشاچی‌ها!',
    body: 'امتیاز: ' + fa(S.score) + (last ? '\nهمهٔ پرده‌ها را بازی کردی. از اوّل؟' : ''),
    btn: BTN_GO, btnLabel: last ? 'دوباره' : 'پردهٔ بعد', btnHot: S.hover === BTN_GO,
    btnFill: '#7c3149', btnHotFill: '#93405b',
  });
}

function drawLost() {
  overlay({
    t: S.phaseT, w: 720, h: 250, y: 160,
    paper: P.paper, band: P.bad, ink: P.ink, inkSoft: '#7a6070',
    icon: (x, y) => { ctx.fillStyle = '#7a6a58';
      wobbleRect(x - 12, y - 20, 24, 44, 6, 161, 1.4); ctx.fill();
      ctx.strokeStyle = '#5a4a3a'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x, y - 20); ctx.lineTo(x + 6, y - 32); ctx.stroke(); },
    title: 'شمع تمام شد',
    body: 'امتیاز: ' + fa(S.score) + '\nسایهٔ بزرگ را به تکّه‌های کوچک بشکن.',
    btn: BTN_GO, btnLabel: 'دوباره', btnHot: S.hover === BTN_GO,
    btnFill: '#7c3149', btnHotFill: '#93405b',
  });
}
