<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#16211a">
<title>باغِ درست — بکارید و ببینید (بازی)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>
  /* صفحه نباید هیچ‌جا اسکرول یا زوم شود؛ بازی باید مثل یک برنامه رفتار کند. */
  html, body {
    margin: 0; padding: 0; background: #16211a;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body {
    position: fixed; inset: 0;          /* جلوی کشیده‌شدنِ صفحه در سافاریِ گوشی */
    width: 100%; height: 100vh; height: 100dvh;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none; -webkit-touch-callout: none;
  }

  /* گوشیِ عمودی صحنه را ریز می‌کند؛ بچه باید گوشی را بچرخاند. */
  #rotate { display: none; }
  @media (orientation: portrait) and (max-width: 860px) {
    #stage { display: none; }
    #rotate {
      display: flex; position: fixed; inset: 0;
      z-index: 9;
      flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      background: #16211a; color: #f6ead2;
      font: 700 20px "Vazirmatn", Tahoma, sans-serif; text-align: center; padding: 32px;
    }
    #rotate svg { animation: tilt 2.4s ease-in-out infinite; }
    @keyframes tilt { 0%, 45% { transform: rotate(0deg); } 65%, 100% { transform: rotate(-90deg); } }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="rotate">
  <svg width="86" height="126" viewBox="0 0 86 126" fill="none" aria-hidden="true">
    <rect x="3" y="3" width="80" height="120" rx="12" stroke="#e8b448" stroke-width="5"/>
    <rect x="15" y="19" width="56" height="88" rx="5" fill="#e8b448" opacity=".28"/>
    <circle cx="43" cy="115" r="4" fill="#e8b448"/>
  </svg>
  <div>گوشی را بچرخان</div>
  <div style="font-weight:400;opacity:.7;font-size:16px">این بازی خوابیده بازی می‌شود</div>
</div>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   هستهٔ مشترکِ بازی‌ها — سبک «کاغذبُری»
   ───────────────────────────────────────────────────────────────────────
   این فایل جعبه‌ابزار است، نه چارچوب: هر بازی حلقه و وضعیت خودش را دارد
   و فقط از این توابع برای کشیدن استفاده می‌کند. دلیلش این است که هر بازی
   باید حس‌وحال خودش را داشته باشد، نه اینکه همه شبیه هم دربیایند.

   قاعده‌های ثابتِ تصویری:
   • نور همیشه از بالا-چپ می‌تابد، پس سایه‌ها به پایین-راست می‌افتند.
   • هیچ لبه‌ای کاملاً صاف نیست؛ همه کمی موج دارند (انگار با قیچی بریده).
   • هیچ خاکستریِ خالصی نداریم؛ همه‌ی خنثی‌ها به گرمیِ صحنه می‌زنند.
   • یک لایه‌ی دانه‌دانه‌ی کاغذ روی کلِ تصویر ضرب می‌شود.
   ═══════════════════════════════════════════════════════════════════════ */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const FA_D = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
const fa = (n) => String(n).replace(/\d/g, (d) => FA_D[+d]);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeIn = (t) => t * t * t;
const easeInOut = (t) => (t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2);
const easeBack = (t) => 1 + 2.7 * Math.pow(t-1, 3) + 1.7 * Math.pow(t-1, 2);
const easeElastic = (t) => t === 0 || t === 1 ? t : Math.pow(2, -9*t) * Math.sin((t*10 - .75) * 2.094) + 1;

/** تصادفِ تکرارپذیر: با یک بذر همیشه همان عدد. برای اینکه تزئین‌ها هر فریم نپرند. */
function noise1(x) {
  const s = Math.sin(x * 127.1) * 43758.5453;
  return s - Math.floor(s);
}
const pick = (arr, seed) => arr[Math.floor(noise1(seed) * arr.length) % arr.length];

/* ───────── بوم و صحنهٔ ثابت ───────── */

let ctx, SW, SH, CV, _refit = null;
let view = { scale: 1, ox: 0, oy: 0, w: 0, h: 0, dpr: 1 };
let _grain = null, _grainDark = null;

function initStage(canvas, w, h) {
  CV = canvas; SW = w; SH = h;
  ctx = canvas.getContext('2d');

  /* اندازه را از خودِ بوم می‌گیریم نه از innerHeight؛ چون در سافاریِ گوشی
     نوارِ آدرس باز و بسته می‌شود و innerHeight دروغ می‌گوید. */
  const fit = () => {
    const r = canvas.getBoundingClientRect();
    const vw = Math.round(r.width), vh = Math.round(r.height);
    if (vw < 20 || vh < 20) return;
    const dpr = Math.min(devicePixelRatio || 1, QUALITY > 0 ? 2 : 1);
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    const scale = Math.min(vw / SW, vh / SH);
    view = { scale, ox: (vw - SW*scale)/2, oy: (vh - SH*scale)/2, w: vw, h: vh, dpr };
    _grain = buildGrain();
  };
  _refit = fit;
  addEventListener('resize', fit);
  /* چرخاندنِ گوشی: اندازهٔ درست چند لحظه بعد می‌رسد، پس چندبار اندازه می‌گیریم. */
  addEventListener('orientationchange', () => {
    fit(); setTimeout(fit, 140); setTimeout(fit, 460);
  });
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(canvas);

  /* صدا در گوشی فقط بعد از اوّلین لمس اجازهٔ پخش دارد. */
  const unlock = () => { sfx._c(); removeEventListener('pointerdown', unlock); removeEventListener('touchstart', unlock); };
  addEventListener('pointerdown', unlock, { passive: true });
  addEventListener('touchstart', unlock, { passive: true });
  /* نگه‌داشتنِ انگشت نباید منوی مرورگر را باز کند. */
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  fit();
  return ctx;
}

/** قابِ صحنه را باز می‌کند: بعد از این، مختصات همیشه در فضای SW×SH است. */
function beginScene(bg) {
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, view.w, view.h);
  ctx.save();
  ctx.translate(view.ox, view.oy);
  ctx.scale(view.scale, view.scale);
  ctx.beginPath();
  ctx.rect(0, 0, SW, SH);
  ctx.clip();
}

/* ───────── پوششِ پایانِ قاب ─────────
   دانه‌های کاغذ و تیرگیِ گوشه‌ها هر دو ثابت‌اند و تغییر نمی‌کنند، ولی
   قبلاً هر فریم از نو کشیده می‌شدند: یکی با «multiply» روی کلِّ صفحه و
   یکی با یک گرادیانِ شعاعیِ تازه. اندازه‌گیری نشان داد همین دو تا
   ۱۱ تا ۱۶ میلی‌ثانیه از هر فریم را می‌خوردند — بیشتر از کشیدنِ خودِ
   صحنه. حالا یک بار در یک بومِ جدا پخته می‌شوند و هر فریم فقط یک
   drawImage است.                                                       */

let _ovl = null, _ovlKey = '';

function overlayLayer(grainAlpha, vignette) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const w = Math.max(2, Math.round(SW * q)), h = Math.max(2, Math.round(SH * q));
  const key = w + 'x' + h + '|' + grainAlpha + '|' + vignette;
  if (_ovl && _ovlKey === key) return _ovl;
  let c;
  try {
    c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g2 = c.getContext('2d');
    if (!g2) return null;
    if (_grainDark && grainAlpha > 0) {
      /* همان دانه‌ها، ولی به‌جای multiply به شکلِ سیاهِ کم‌رنگ */
      g2.globalAlpha = clamp(grainAlpha * 1.15, 0, 1);
      g2.fillStyle = g2.createPattern(_grainDark, 'repeat');
      g2.fillRect(0, 0, w, h);
      g2.globalAlpha = 1;
    }
    if (vignette) {
      const g = g2.createRadialGradient(w / 2, h / 2, h * .42, w / 2, h / 2, h * 1.05);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, vignette);
      g2.fillStyle = g;
      g2.fillRect(0, 0, w, h);
    }
  } catch (e) { return null; }
  _ovl = c; _ovlKey = key;
  return c;
}

/** بافتِ کاغذ، تیرگیِ گوشه‌ها، رنگ‌بندی و درخششِ نور را می‌گذارد و قاب را می‌بندد. */
function endScene(grainAlpha = .15, vignette = 'rgba(48,28,14,.30)', bloom = .34, grade = .14) {
  /* درخششِ نور خاموش است. اندازه‌گیری نشان داد هر فریم ۲۱ میلی‌ثانیه
     می‌گیرد — بیشتر از تمامِ کارهای دیگرِ یک فریم روی هم — چون برای
     ساختنش باید کلِّ بوم دوباره خوانده شود. از آن بدتر: متنِ فارسی را
     مه‌آلود می‌کرد و خواندنش را سخت‌تر. بی‌آن، صحنه تمیزتر است. */
  bloom = 0;
  if (QUALITY < 1) { grade = 0; grainAlpha *= .5; }
  if (QUALITY < 2) grade = 0;
  if (grade > 0) {
    /* رنگ‌بندیِ نرم: بالای صحنه گرم‌تر، پایین سردتر — عمق می‌دهد */
    const g = ctx.createLinearGradient(0, 0, 0, SH);
    g.addColorStop(0, `rgba(255, 214, 150, ${grade})`);
    g.addColorStop(.55, 'rgba(255, 255, 255, 0)');
    g.addColorStop(1, `rgba(40, 60, 110, ${grade * .9})`);
    ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalCompositeOperation = 'source-over';
  }
  const ov = (grainAlpha > 0 || vignette) ? overlayLayer(grainAlpha, vignette) : null;
  if (ov) ctx.drawImage(ov, 0, 0, SW, SH);
  ctx.restore();
  bloomPass(bloom);
}

/* ───────── درخششِ نور (bloom) ─────────
   قابِ رسم‌شده را کوچک می‌کنیم، دو بار در خودش ضرب می‌کنیم تا فقط
   روشن‌ها بمانند، محوش می‌کنیم و با حالتِ «lighter» رویش می‌گذاریم.
   نتیجه: چراغ‌ها، شعله‌ها و رنگ‌های روشن نور پخش می‌کنند. */
let _bl, _blc, _bl2, _bl2c, _blNo = false, _blTick = 0;

function bloomPass(amount) {
  if (!amount || _blNo || !CV.width) return;
  /* کوچک‌کردن و بزرگ‌کردنِ دوباره، خودش محو می‌کند — از filter خیلی ارزان‌تر است */
  const W = Math.max(4, Math.round(CV.width * .2)), H = Math.max(4, Math.round(CV.height * .2));
  const W2 = Math.max(2, Math.round(W * .28)), H2 = Math.max(2, Math.round(H * .28));
  try {
    if (!_bl) {
      _bl = document.createElement('canvas'); _blc = _bl.getContext('2d');
      _bl2 = document.createElement('canvas'); _bl2c = _bl2.getContext('2d');
      if (!_blc || !_bl2c) { _blNo = true; return; }
    }
    if (_bl.width !== W || _bl.height !== H) { _bl.width = W; _bl.height = H; }
    if (_bl2.width !== W2 || _bl2.height !== H2) { _bl2.width = W2; _bl2.height = H2; }
    /* ساختنِ نور یک قاب در میان کافی است؛ گذاشتنش هر قاب. */
    _blTick = (_blTick + 1) & 1;
    if (!_blTick) {
      _blc.globalCompositeOperation = 'source-over';
      _blc.clearRect(0, 0, W, H);
      _blc.drawImage(CV, 0, 0, W, H);
      _blc.globalCompositeOperation = 'multiply';
      _blc.drawImage(_bl, 0, 0);
      _blc.drawImage(_bl, 0, 0);
      _blc.globalCompositeOperation = 'source-over';
      _bl2c.clearRect(0, 0, W2, H2);
      _bl2c.drawImage(_bl, 0, 0, W2, H2);
    }

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = amount;
    ctx.drawImage(_bl2, 0, 0, CV.width, CV.height);
    ctx.restore();
  } catch (e) { _blNo = true; }
}

/* ───────── لایهٔ ثابت ─────────
   هرچه در صحنه تکان نمی‌خورد را یک‌بار می‌کشیم و بعد فقط کپی می‌کنیم. */
const _layers = {};
function staticLayer(key, w, h, paint) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const L = _layers[key];
  if (L && L.q === q && L.w === w && L.h === h) return L.cv;
  const off = document.createElement('canvas');
  off.width = Math.max(1, Math.round(w * q));
  off.height = Math.max(1, Math.round(h * q));
  const c = off.getContext('2d');
  c.setTransform(q, 0, 0, q, 0, 0);
  const prev = ctx;
  ctx = c;
  try { paint(); } finally { ctx = prev; }
  _layers[key] = { cv: off, q, w, h };
  return off;
}

/* ───────── نورپردازی و بافت ─────────
   کارِ این‌ها این است که هیچ سطحی «تختِ یک‌رنگ» نماند. */

/** شیبِ عمودی: بالا روشن، پایین تیره. */
function vgrad(y0, y1, top, bot) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, top); g.addColorStop(1, bot);
  return g;
}

/** حجمِ کروی: نور از بالا-چپ، سایه در پایین-راست. */
function ball(cx, cy, r, lit, base, dark) {
  const g = ctx.createRadialGradient(cx - r * .38, cy - r * .42, r * .06, cx, cy, r * 1.06);
  g.addColorStop(0, lit); g.addColorStop(.45, base); g.addColorStop(1, dark);
  return g;
}

/** لبهٔ روشنِ بالا-چپِ یک مسیر — همان «rim light». */
function rim(pathFn, col, w = 2.2) {
  ctx.save();
  ctx.beginPath(); pathFn();
  ctx.clip();
  ctx.beginPath(); pathFn();
  ctx.strokeStyle = col; ctx.lineWidth = w * 2; ctx.lineJoin = 'round';
  ctx.translate(-w * .5, -w * .6);
  ctx.stroke();
  ctx.restore();
}

/** سایهٔ چسبیده به زمین — چیزها را روی سطح می‌نشاند. */
function contact(cx, cy, rx, ry, alpha = .26) {
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
  g.addColorStop(0, `rgba(20, 12, 6, ${alpha})`);
  g.addColorStop(1, 'rgba(20, 12, 6, 0)');
  ctx.save();
  ctx.fillStyle = g;
  ctx.translate(cx, cy); ctx.scale(1, ry / Math.max(rx, ry));
  ctx.beginPath(); ctx.arc(0, 0, Math.max(rx, ry), 0, TAU); ctx.fill();
  ctx.restore();
}

const _tex = {};
/** بافتِ تکرارشونده؛ یک‌بار ساخته و بعد از حافظه خوانده می‌شود. */
function texture(key, w, h, paint) {
  if (_tex[key]) return _tex[key];
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const c = off.getContext('2d');
  paint(c, w, h);
  _tex[key] = ctx.createPattern(off, 'repeat');
  return _tex[key];
}

/** رگهٔ چوب. */
function texWood(base, grain) {
  return texture('w' + base + grain, 120, 120, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = grain; c.lineWidth = 1.4;
    for (let i = 0; i < 9; i++) {
      c.globalAlpha = .18 + noise1(i * 3.1) * .3;
      c.beginPath();
      const y0 = i * 14 + noise1(i) * 6;
      c.moveTo(0, y0);
      for (let x = 0; x <= w; x += 10) c.lineTo(x, y0 + Math.sin(x * .09 + i) * 2.6);
      c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** تارِ پارچه. */
function texCloth(base, thread) {
  return texture('c' + base + thread, 16, 16, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = thread; c.lineWidth = 1; c.globalAlpha = .5;
    for (let i = 0; i < w; i += 4) {
      c.beginPath(); c.moveTo(i, 0); c.lineTo(i, h); c.stroke();
      c.beginPath(); c.moveTo(0, i); c.lineTo(w, i); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** دانه‌های سنگ. */
function texStone(base, spec) {
  return texture('s' + base + spec, 90, 90, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) {
      c.globalAlpha = .05 + noise1(i * 1.7) * .16;
      c.fillStyle = spec;
      const r = .6 + noise1(i * 5.3) * 1.9;
      c.beginPath();
      c.arc(noise1(i * 2.1) * w, noise1(i * 3.7 + 1) * h, r, 0, TAU);
      c.fill();
    }
    c.globalAlpha = 1;
  });
}

/** الیافِ کاغذ. */
function texPaper(base) {
  return texture('p' + base, 100, 100, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 130; i++) {
      c.globalAlpha = .04 + noise1(i * 2.3) * .07;
      c.strokeStyle = i % 2 ? '#ffffff' : '#5a4326';
      c.lineWidth = .9;
      const x = noise1(i * 1.3) * w, y = noise1(i * 4.1 + 2) * h;
      const a = noise1(i * 7.7) * TAU, l = 4 + noise1(i * 9.1) * 12;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

function buildGrain() {
  const s = 260;
  const off = document.createElement('canvas');
  off.width = off.height = s;
  const c = off.getContext('2d');
  const img = c.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    const v = 214 + Math.random() * 41;
    img.data[i*4] = v; img.data[i*4+1] = v; img.data[i*4+2] = v; img.data[i*4+3] = 255;
  }
  c.putImageData(img, 0, 0);
  /* همان دانه‌ها به شکلِ سیاهِ کم‌رنگ، تا بشود بدونِ multiply گذاشتشان */
  const d = document.createElement('canvas');
  d.width = d.height = s;
  const dc = d.getContext('2d');
  const dimg = dc.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    dimg.data[i*4] = 0; dimg.data[i*4+1] = 0; dimg.data[i*4+2] = 0;
    dimg.data[i*4+3] = 255 - img.data[i*4];
  }
  dc.putImageData(dimg, 0, 0);
  _grainDark = d;
  _ovl = null; _ovlKey = '';
  return ctx.createPattern(off, 'repeat');
}

function toStage(e) {
  const r = CV.getBoundingClientRect();
  return {
    x: (e.clientX - r.left - view.ox) / view.scale,
    y: (e.clientY - r.top - view.oy) / view.scale,
  };
}

const inRect = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
const inCircle = (p, b, pad = 0) => Math.hypot(p.x - b.x, p.y - b.y) <= b.r + pad;

/* ───────── قلم‌های کاغذبُری ───────── */

/** دایره‌ای که انگار با قیچی بریده شده. */
function wobbleCircle(cx, cy, r, seed = 0, amp = 2.2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const rr = r + Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp * .45;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** بیضیِ ناصاف — برای چیزهایی که گرد نیستند ولی نرم‌اند. */
function wobbleEllipse(cx, cy, rx, ry, rot = 0, seed = 0, amp = 2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const w = 1 + (Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp*.45) / Math.max(rx, ry);
    const px = Math.cos(a) * rx * w, py = Math.sin(a) * ry * w;
    const x = cx + px*Math.cos(rot) - py*Math.sin(rot);
    const y = cy + px*Math.sin(rot) + py*Math.cos(rot);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** مستطیلِ گِرد با گوشه‌های کمی کج. */
function wobbleRect(x, y, w, h, r = 12, seed = 0, amp = 1.6) {
  const j = (k) => (noise1(seed*9.7 + k) - .5) * amp * 2;
  ctx.beginPath();
  ctx.moveTo(x + r + j(1), y + j(2));
  ctx.lineTo(x + w - r + j(3), y + j(4));
  ctx.quadraticCurveTo(x + w + j(5), y + j(6), x + w + j(7), y + r + j(8));
  ctx.lineTo(x + w + j(9), y + h - r + j(10));
  ctx.quadraticCurveTo(x + w + j(11), y + h + j(12), x + w - r + j(13), y + h + j(14));
  ctx.lineTo(x + r + j(15), y + h + j(16));
  ctx.quadraticCurveTo(x + j(17), y + h + j(18), x + j(19), y + h - r + j(20));
  ctx.lineTo(x + j(21), y + r + j(22));
  ctx.quadraticCurveTo(x + j(23), y + j(24), x + r + j(1), y + j(2));
  ctx.closePath();
}

/** سایهٔ نرم؛ نور از بالا-چپ. */
function withShadow(blur, dy, alpha, fn, hue = '78, 46, 24') {
  ctx.save();
  ctx.shadowColor = `rgba(${hue}, ${alpha})`;
  ctx.shadowBlur = blur;
  ctx.shadowOffsetY = dy;
  ctx.shadowOffsetX = dy * .35;
  fn();
  ctx.restore();
}

/** یک برگه‌ی کاغذ با سایه — پایه‌ی همه‌ی کارت‌ها و تابلوها. */
function paper(x, y, w, h, fill, seed = 1, r = 12, shadow = .26) {
  withShadow(16, 7, shadow, () => {
    ctx.fillStyle = fill;
    wobbleRect(x, y, w, h, r, seed, 2);
    ctx.fill();
  });
  /* الیافِ کاغذ و لبهٔ روشن، تا سطح تخت نماند */
  ctx.save();
  ctx.beginPath(); wobbleRect(x, y, w, h, r, seed, 2); ctx.clip();
  ctx.globalAlpha = .5;
  ctx.fillStyle = texPaper(fill);
  ctx.fillRect(x, y, w, h);
  ctx.globalAlpha = 1;
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.4, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(90,60,20,.1)');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
}

function text(str, x, y, o = {}) {
  const size = o.size || 20;
  const fam = o.family || 'Vazirmatn';
  ctx.save();
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.font = `${fam === 'Lalezar' ? '400' : (o.weight || 700)} ${size}px "${fam}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.baseline || 'middle';
  ctx.fillStyle = o.color || '#43291b';
  ctx.direction = 'rtl';
  if (o.stroke) {
    ctx.lineWidth = o.strokeWidth || 5;
    ctx.strokeStyle = o.stroke;
    ctx.lineJoin = 'round';
    ctx.strokeText(str, x, y, o.maxWidth);
  }
  ctx.fillText(str, x, y, o.maxWidth);
  ctx.restore();
}

/** متنِ چندخطی که خودش می‌شکند. ارتفاعِ اشغال‌شده را برمی‌گرداند. */
function textWrap(str, x, y, maxW, o = {}) {
  const size = o.size || 19, lh = o.lineHeight || size * 1.7;
  ctx.font = `${o.weight || 700} ${size}px "${o.family || 'Vazirmatn'}", Tahoma, sans-serif`;
  const lines = [];
  for (const para of str.split('\n')) {
    let line = '';
    for (const wd of para.split(' ')) {
      const t = line ? line + ' ' + wd : wd;
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = wd; }
      else line = t;
    }
    lines.push(line);
  }
  lines.forEach((l, i) => text(l, x, y + i * lh, o));
  return lines.length * lh;
}

/* ───────── ذره‌ها ───────── */

class Bits {
  constructor() { this.list = []; }
  add(x, y, n, kind, colors, opts = {}) {
    for (let i = 0; i < n; i++) {
      const a = opts.dir !== undefined ? opts.dir + (Math.random()-.5) * (opts.spread || 1) : Math.random() * TAU;
      const sp = (opts.speed || 200) * (.4 + Math.random());
      this.list.push({
        kind, x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - (opts.lift || 0),
        r: (opts.size || 4) * (.5 + Math.random()),
        rot: Math.random() * TAU, vr: (Math.random()-.5) * 10,
        col: colors[(Math.random() * colors.length) | 0],
        grav: opts.grav === undefined ? 620 : opts.grav,
        drag: opts.drag || .995,
        life: (opts.life || .9) * (.6 + Math.random() * .8), age: 0,
      });
    }
  }
  confetti(x, y, n, colors) {
    this.add(x, y, n, 'flake', colors, { speed: 420, lift: 190, size: 5, life: 1.6, grav: 780 });
  }
  spark(x, y, n, colors) {
    this.add(x, y, n, 'dot', colors, { speed: 180, lift: 30, size: 3.4, life: .7, grav: 260, drag: .93 });
  }
  step(dt) {
    for (const p of this.list) {
      p.age += dt;
      p.vy += p.grav * dt;
      p.vx *= p.drag; p.vy *= p.drag;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    }
    this.list = this.list.filter((p) => p.age < p.life);
  }
  draw() {
    for (const p of this.list) {
      const k = clamp(1 - p.age / p.life, 0, 1);
      ctx.save();
      ctx.globalAlpha = k;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.col;
      if (p.kind === 'flake') ctx.fillRect(-p.r, -p.r*1.5, p.r*2, p.r*3);
      else if (p.kind === 'leaf') { wobbleEllipse(0, 0, p.r*1.8, p.r*.8, 0, p.r, .6); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(0, 0, p.r * k, 0, TAU); ctx.fill(); }
      ctx.restore();
    }
  }
  clear() { this.list.length = 0; }
}

/* ───────── صدا (بدون فایل صوتی) ───────── */

const sfx = {
  ac: null, on: true,
  _c() {
    if (!this.on) return null;
    if (!this.ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; this.ac = new A(); }
    if (this.ac.state === 'suspended') this.ac.resume();
    return this.ac;
  },
  tone(f, dur = .16, type = 'sine', gain = .13, delay = 0) {
    const c = this._c(); if (!c) return;
    const t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(t0 + dur + .04);
  },
  tap()  { this.tone(430, .07, 'triangle', .09); },
  place(){ this.tone(620, .11, 'sine', .12); },
  pop()  { this.tone(760, .09, 'sine', .11); },
  slide(){ this.tone(240, .22, 'sine', .07); },
  good() { [523, 659, 784].forEach((f,i) => this.tone(f, .22, 'sine', .13, i*.07)); },
  win()  { [523, 659, 784, 1047].forEach((f,i) => this.tone(f, .34, 'triangle', .13, i*.10)); },
  nope() { this.tone(180, .2, 'sawtooth', .07); },
  tick() { this.tone(1100, .04, 'square', .05); },
};

/* ───────── قطعه‌های آماده ───────── */

function star(x, y, r, col, rot = 0) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = col;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI/2 + i * Math.PI/5;
    const rr = i % 2 ? r * .45 : r;
    const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/** دکمهٔ کاغذی. hovered را خودِ بازی می‌دهد؛ اینجا فقط کشیده می‌شود. */
/** رنگ را روشن‌تر (k>0) یا تیره‌تر (k<0) می‌کند. */
function shade(col, k) {
  const c = String(col).trim();
  let r, g2, b2;
  if (c[0] === '#') {
    const h = c.length === 4 ? c[1]+c[1]+c[2]+c[2]+c[3]+c[3] : c.slice(1, 7);
    r = parseInt(h.slice(0,2), 16); g2 = parseInt(h.slice(2,4), 16); b2 = parseInt(h.slice(4,6), 16);
  } else {
    const m = c.match(/[\d.]+/g);
    if (!m || m.length < 3) return col;
    r = +m[0]; g2 = +m[1]; b2 = +m[2];
  }
  const f = (v) => Math.round(clamp(k < 0 ? v * (1 + k) : v + (255 - v) * k, 0, 255));
  return 'rgb(' + f(r) + ',' + f(g2) + ',' + f(b2) + ')';
}

function button(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 3 : 0;
  const fill = o.disabled ? (o.off || '#bcaa92') : (hot ? (o.hotFill || o.fill) : o.fill);
  const r = o.r === undefined ? 14 : o.r;
  /* لبهٔ زیرینِ تیره — دکمه از صفحه بیرون می‌زند */
  ctx.fillStyle = shade(fill, -.36);
  wobbleRect(b.x, b.y + dy + 7, b.w, b.h, r, b.x + b.y, 2);
  ctx.fill();
  withShadow(hot ? 22 : 14, hot ? 5 : 8, .32, () => {
    ctx.fillStyle = fill;
    wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2);
    ctx.fill();
  });
  /* حجم: روشن از بالا، تیره به پایین */
  ctx.save();
  ctx.beginPath(); wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2); ctx.clip();
  const g = ctx.createLinearGradient(0, b.y + dy, 0, b.y + dy + b.h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.45, 'rgba(255,255,255,.04)');
  g.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = g;
  ctx.fillRect(b.x, b.y + dy, b.w, b.h);
  /* برقِ باریکِ لبهٔ بالا */
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.fillRect(b.x + r, b.y + dy + 2, b.w - r * 2, 2);
  ctx.restore();
  text(label, b.x + b.w/2, b.y + b.h/2 + dy - (o.sub ? 9 : 0), {
    size: o.size || 26, color: o.color || '#fdf6e8', family: o.family || 'Lalezar',
  });
  if (o.sub) text(o.sub, b.x + b.w/2, b.y + b.h/2 + dy + 17,
    { size: 14, color: o.subColor || 'rgba(255,255,255,.88)' });
}

/** دکمهٔ گرد کوچک (مثل + و −). */
function roundButton(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 2 : 0;
  withShadow(10, hot ? 3 : 5, .3, () => {
    ctx.fillStyle = o.disabled ? '#cbbba3' : (hot ? (o.hotFill || o.fill) : o.fill);
    wobbleCircle(b.x, b.y + dy, b.r, b.x, 1.4);
    ctx.fill();
  });
  text(label, b.x, b.y + dy - 1,
    { size: o.size || 32, color: o.disabled ? '#a8988a' : (o.color || '#fdf6e8'), family: 'Lalezar' });
}

/** پرده‌ی تمام‌صفحه: برای شروعِ پرده و برای جشنِ پایان. */
function overlay(o) {
  const k = easeOut(clamp(o.t / .5, 0, 1));
  ctx.fillStyle = `rgba(30, 22, 16, ${.66 * k})`;
  ctx.fillRect(0, 0, SW, SH);

  const w = o.w || 700, h = o.h || 290;
  const x = (SW - w) / 2, y = o.y || (SH * .22);
  const s = lerp(.9, 1, easeBack(clamp(o.t / .65, 0, 1)));
  ctx.save();
  ctx.translate(SW/2, y + h/2);
  ctx.scale(s, s);
  ctx.translate(-SW/2, -(y + h/2));

  withShadow(30, 14, .42, () => {
    ctx.fillStyle = o.paper || '#fbf3e2';
    wobbleRect(x, y, w, h, 18, 121, 2.4);
    ctx.fill();
  });
  ctx.fillStyle = o.band || '#c8434f';
  wobbleRect(x, y, w, 12, 6, 123, 1);
  ctx.fill();

  if (o.icon) o.icon(SW/2, y + 56);
  text(o.title, SW/2, y + (o.icon ? 108 : 62),
    { size: o.titleSize || 36, color: o.ink || '#43291b', family: 'Lalezar', alpha: k });
  textWrap(o.body, SW/2, y + (o.icon ? 158 : 116), w - 90,
    { size: 19, color: o.inkSoft || '#8a6a52', alpha: k });
  ctx.restore();

  button(o.btn, o.btnLabel, { hot: o.btnHot, fill: o.btnFill || '#7fa356', hotFill: o.btnHotFill || '#8fb45f', size: 28 });
}

/** پیامِ کوتاهِ بالای صحنه. */
class Toast {
  constructor() { this.msg = null; this.t = 0; this.kind = 'info'; }
  say(msg, kind = 'info') { this.msg = msg; this.kind = kind; this.t = 2.6; }
  step(dt) { if (this.t > 0) { this.t -= dt; if (this.t <= 0) this.msg = null; } }
  draw(y = 24, colors = {}) {
    if (!this.msg) return;
    const k = clamp(this.t, 0, 1) * clamp((2.6 - this.t) * 5, 0, 1);
    ctx.save();
    ctx.globalAlpha = k;
    ctx.font = `700 19px "Vazirmatn", Tahoma, sans-serif`;
    const w = ctx.measureText(this.msg).width + 76;
    const fill = this.kind === 'good' ? (colors.good || '#7fa356')
               : this.kind === 'bad' ? (colors.bad || '#c8434f')
               : (colors.info || '#fbf3e2');
    paper(SW/2 - w/2, y, w, 48, fill, 151, 12, .3);
    text(this.msg, SW/2, y + 25,
      { size: 19, color: this.kind === 'info' ? (colors.ink || '#43291b') : '#fff8ec' });
    ctx.restore();
  }
}

/* ───────── آموزشِ پرده‌ای ─────────
   پرده‌هایی که منتظرِ کارِ بچه نیستند با یک ضربه جلو می‌روند. تایمر فقط
   پشتیبان است؛ بچهٔ کلاس سومی باید فرصتِ خواندن داشته باشد، نه اینکه
   متن قبل از تمام شدنِ خواندنش برود.                                    */

/** اگر پردهٔ فعلی خواندنی است، ضربه را می‌خورد و می‌رود پردهٔ بعد. */
function tutTap(tut, tapSteps, lastStep) {
  if (!tut.on || tapSteps.indexOf(tut.step) < 0) return false;
  if (tut.step >= lastStep) tut.on = false;
  else { tut.step++; tut.t = 0; }
  sfx.tap();
  return true;
}

/** نشانهٔ «برای ادامه بزن» — زیرِ کارتِ آموزش. */
function tutMore(cx, y, t, ink = '#3a2a18', bg = 'rgba(255, 250, 238, .94)') {
  ctx.save();
  ctx.globalAlpha = .62 + .38 * Math.sin(t * 3.2);
  ctx.font = '700 15px "Vazirmatn", Tahoma, sans-serif';
  const label = 'برای ادامه، هرجا را بزن';
  const w = ctx.measureText(label).width + 40, h = 32, x = cx - w / 2, r = 16;
  withShadow(10, 4, .3, () => {
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath(); ctx.fill();
  });
  text(label, cx, y + h / 2, { size: 15, color: ink });
  ctx.restore();
}

/** فونت‌ها را می‌آورد و بعد بازی را شروع می‌کند.
    مهم: هر دو راه (رسیدنِ فونت و مهلتِ پشتیبان) ممکن است برسند، ولی
    شروع فقط باید یک بار انجام شود؛ وگرنه دو حلقهٔ فریم راه می‌افتد و
    بازی دوبرابر سریع می‌شود. */
function whenFontsReady(start) {
  let done = false;
  const go = () => { if (done) return; done = true; start(); };
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('400 40px Lalezar'),
      document.fonts.load('700 20px Vazirmatn'),
      document.fonts.load('900 20px Vazirmatn'),
    ]).then(go, go);
    setTimeout(go, 2600);
  } else go();
}

/** حلقهٔ فریم با dtِ محدودشده. */
/* ───────── کیفیتِ خودکار ─────────
   اگر دستگاه کُند بود، اوّل درخشش و بعد رنگ‌بندی خاموش می‌شود تا بازی
   روان بماند. روی دستگاهِ قوی همه‌چیز روشن است. */
let QUALITY = 2;
let _fAcc = 0, _fN = 0, _qHold = 0;

function _qualityTick(gap) {
  if (gap <= 0 || gap > 200) return;
  _fAcc += gap; _fN++;
  if (_fN < 45) return;
  const avg = _fAcc / _fN;
  _fAcc = 0; _fN = 0;
  if (_qHold > 0) { _qHold--; return; }
  /* فاصلهٔ بالا و پایین باید باز باشد، وگرنه کیفیت بین دو پله بالا و
     پایین می‌پرد و بازی مدام تغییرِ ظاهر می‌دهد. */
  const before = QUALITY;
  if (avg > 21 && QUALITY > 0) { QUALITY--; _qHold = 4; }
  else if (avg < 13.5 && QUALITY < 2) { QUALITY++; _qHold = 10; }
  /* در پایین‌ترین کیفیت، صحنه را با نقطه‌های کمتر می‌کشیم */
  if (before !== QUALITY && (before === 0 || QUALITY === 0) && _refit) _refit();
}

/* یک حلقه، نه بیشتر — دو حلقه یعنی زمانِ بازی دوبرابر می‌گذرد.

   MOTION: تا پیش از این، به‌خاطرِ باگِ دو حلقه، همهٔ بازی‌ها عملاً با
   سرعتِ دو برابر اجرا می‌شدند و زمان‌بندی‌ها هم با همان حس تنظیم شده
   بودند. حالا که باگ رفع شده، سرعتِ درست (یک برابر) کُند به نظر
   می‌رسد. این ضریب جانِ حرکت‌ها را برمی‌گرداند، ولی نه تا آن دو برابرِ
   تصادفی. فقط روی جانِ حرکت اثر دارد، نه روی هیچ قانونِ علمی. */
const MOTION = 1.45;
let _looping = false;
function runLoop(step) {
  if (_looping) return;
  _looping = true;
  let last = performance.now();
  const frame = (now) => {
    const gap = now - last;
    /* بریدنِ بعد از ضرب، تا یک فریمِ کُند پرشِ بزرگ نسازد */
    const dt = Math.min(gap / 1000 * MOTION, 1/15);
    last = now;
    _qualityTick(gap);
    step(dt);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

/* ═════════════════ بازی ═════════════════ */
/* ═══════════════════════════════════════════════════════════════════════
   باغِ درست — علومِ سوم، درس ۱۱ «بکارید و ببینید»  (بازی)

   کتاب می‌گوید لوبیا و گندم را بکارید و ریشه و برگ و دانه‌شان را با هم
   مقایسه کنید، و بعد الگو را کشف کنید: «با دیدنِ برگِ یک گیاه می‌توانیم
   نوعِ ریشه و دانه‌اش را پیش‌بینی کنیم.»

   اینجا آن الگو، قانونِ زنده ماندن است. هر گودال شرطِ خودش را دارد —
   آب کجاست، آفتاب چقدر است — و بچّه باید دانهٔ درست را در آن بکارد.
   بازی نمی‌گوید کدام دانه کجا؛ فقط می‌گذارد ریشه‌ها جلوی چشمش رشد
   کنند و ببیند کدام به آب می‌رسد و کدام نمی‌رسد.

   ── درستیِ زیستی ───────────────────────────────────────────────
   هر دو گروهِ گیاه همان چیزی‌اند که در کتاب است، و برتری‌شان هم
   واقعی است، نه قراردادی:

   ▸ دانهٔ دولپه (لوبیا، نخود، آفتاب‌گردان) → ریشهٔ راست + برگِ پهن
     ریشهٔ راست تا ژرفای زیاد پایین می‌رود، پس به آبِ عمیق می‌رسد؛
     برگِ پهن نورِ بیشتری می‌گیرد، پس در سایه هم زنده می‌ماند؛ ولی
     همان برگِ پهن آبِ بیشتری هم از دست می‌دهد.
   ▸ دانهٔ تک‌لپه (گندم، ذرّت، برنج) → ریشهٔ افشان + برگِ دراز و باریک
     ریشهٔ افشان کم‌عمق و پهن است، پس بارانِ سطحی را خوب جمع می‌کند
     ولی به آبِ عمیق نمی‌رسد؛ برگِ باریک آبِ کمی از دست می‌دهد ولی
     در سایه نورِ کافی نمی‌گیرد.

   سرنوشتِ هر گیاه از دو ترازِ ساده درمی‌آید و هیچ‌جا از پیش نوشته
   نشده:
        آبِ گرفته‌شده  در برابرِ  آبِ از دست‌رفته
        نورِ گرفته‌شده در برابرِ  نورِ لازم برای رشد
   ═══════════════════════════════════════════════════════════════════════ */

const SCENE_W = 1200, SCENE_H = 760;
const HUD_H = 56;

const P = {
  sky:   '#5b86a8', skyLo: '#39607d', skyHi: '#7fb0cc',
  soil:  '#6b4c33', soilDk: '#40301f', soilLt: '#8a6644',
  water: '#3f8fc4', waterLt: '#7fc4e8',
  grass: '#4f9f4a', grassDk: '#2f6b2e',
  leaf:  '#4f9f5e', leafDk: '#2f6b3a', leafLt: '#7fc47a',
  stem:  '#4a8f42', root: '#d9c9a3', rootDk: '#a89574',
  seedA: '#e8d9a8', seedADk: '#b8a06a',   /* گندمی */
  seedB: '#d9a06a', seedBDk: '#a06a3a',   /* لوبیایی */
  flowerA: '#e8c44a', flowerB: '#e87fa8',
  sun:   '#ffd27a', shade: '#2b4a3a',
  paper: '#fbf7e8', card: '#ffffff',
  ink:   '#22301f', inkSoft: '#7d8b78',
  good:  '#5fb06a', bad: '#c9603f', gold: '#e0a63f', accent: '#5aa8c4',
};

/* ───────── دو گروهِ گیاه ───────── */

const KINDS = {
  /* تک‌لپه: ریشهٔ افشان، برگِ باریک */
  mono: {
    n: 'تک‌لپه', root: 'افشان', leafN: 'دراز و باریک',
    surface: 1.0,     /* چقدر از آبِ سطحی را جمع می‌کند */
    depth: 22,        /* ژرفای ریشه، سانتی‌متر */
    leaf: .7,         /* پهنای برگ‌ها */
    capture: .9,      /* توانِ گرفتنِ نور در هر واحدِ برگ */
  },
  /* دولپه: ریشهٔ راست، برگِ پهن */
  di: {
    n: 'دولپه', root: 'راست', leafN: 'پهن',
    surface: .35, depth: 60, leaf: 1.0, capture: 1.4,
  },
};

const SEEDS = [
  { id: 'gandom', n: 'گندم',       k: 'mono' },
  { id: 'zorrat', n: 'ذرّت',        k: 'mono' },
  { id: 'berenj', n: 'برنج',        k: 'mono' },
  { id: 'lubia',  n: 'لوبیا',       k: 'di' },
  { id: 'nokhod', n: 'نخود',        k: 'di' },
  { id: 'aftab',  n: 'آفتاب‌گردان', k: 'di' },
];
const seedBy = (id) => SEEDS.find((s) => s.id === id);

const LIGHT_NEED = .5;

/* ───────── گودال‌ها ─────────
   هر گودال: آبِ زیرزمینی در چه ژرفایی، چقدر بارانِ سطحی، و آفتاب.  */

const SPOTS = {
  deep:  { n: 'آبِ عمیق',      table: 45, supply: 1.2, rain: .20, sun: 1.0, light: 1.0 },
  rainy: { n: 'بارانِ خوب',    table: 90, supply: 1.2, rain: .85, sun: 1.0, light: 1.0 },
  shade: { n: 'سایه',          table: 15, supply: 1.0, rain: .30, sun: .45, light: .40 },
  hot:   { n: 'آفتابِ تند',    table: 90, supply: 1.2, rain: 1.1, sun: 1.4, light: 1.0 },
};

/** آیا این گیاه در این گودال زنده می‌ماند؟ دو ترازِ ساده. */
function judge(spotKey, kindKey) {
  const s = SPOTS[spotKey], k = KINDS[kindKey];
  const win = k.surface * s.rain + (s.table <= k.depth ? s.supply : 0);
  const lose = k.leaf * s.sun;
  const light = k.leaf * s.light * k.capture;
  return {
    water: win - lose, lightGap: light - LIGHT_NEED,
    ok: win >= lose && light >= LIGHT_NEED,
    reach: s.table <= k.depth,
    win, lose, light,
  };
}

const LEVELS = [
  { name: 'دو گودال', spots: ['deep', 'rainy'], bag: ['lubia', 'gandom'] },
  { name: 'زیرِ سایه', spots: ['rainy', 'shade', 'deep'], bag: ['gandom', 'nokhod', 'lubia'] },
  { name: 'آفتابِ تند', spots: ['hot', 'deep', 'shade', 'rainy'],
    bag: ['zorrat', 'aftab', 'lubia', 'berenj'] },
  { name: 'باغِ بزرگ', spots: ['deep', 'rainy', 'hot', 'shade', 'deep'],
    bag: ['nokhod', 'gandom', 'berenj', 'aftab', 'lubia'] },
  { name: 'همه‌جور خاک', spots: ['shade', 'hot', 'deep', 'rainy', 'shade', 'rainy'],
    bag: ['lubia', 'zorrat', 'aftab', 'gandom', 'nokhod', 'berenj'] },
];

/* ───────── وضعیت ───────── */

const S = {
  phase: 'intro', phaseT: 0,
  level: 0, score: 0, best: 0,
  put: [],               /* شناسهٔ دانهٔ هر گودال یا null */
  bag: [],               /* دانه‌های باقی‌مانده */
  grow: 0,               /* ۰..۱ پیشرفتِ رشد */
  growing: false,
  lens: -1,              /* دانه‌ای که زیرِ ذرّه‌بین است */
  drag: null,
  won: false, winT: 0,
  t: 0, hover: null, tip: '', tipT: 0, shake: 0,
  tut: { on: false, step: 0, t: 0 },
};

const bits = new Bits();
const toast = new Toast();
const cv = document.getElementById('stage');
initStage(cv, SCENE_W, SCENE_H);

const L = () => LEVELS[Math.min(S.level, LEVELS.length - 1)];
function tip(msg) { S.tip = msg; S.tipT = 3.4; }

function loadLevel(i) {
  S.level = i;
  const lv = LEVELS[i];
  S.put = lv.spots.map(() => null);
  S.bag = lv.bag.slice();
  S.grow = 0; S.growing = false; S.lens = -1; S.drag = null;
  S.won = false; S.winT = 0;
}

function startLevel(i, keep) {
  S.phase = 'play'; S.phaseT = 0;
  if (!keep) S.score = 0;
  S.tut.on = i === 0 && !keep; S.tut.step = 0; S.tut.t = 0;
  loadLevel(i);
}

const allPlanted = () => S.put.every((p) => p);
function spotOK(i) {
  const id = S.put[i];
  if (!id) return false;
  return judge(L().spots[i], seedBy(id).k).ok;
}
const allOK = () => S.put.every((p, i) => spotOK(i));

/* ───────── جای‌ها ───────── */

const GY = 336;                 /* سطحِ خاک */
const PXCM = 4.2;               /* پیکسل بر سانتی‌متر زیرِ خاک */
const FIELD = { x: 24, y: 88, w: 1152, h: 512 };
const TRAY = { x: 24, y: 612, w: 1152, h: 136 };
const BTN_GROW = { x: SCENE_W - 250, y: 626, w: 216, h: 62 };
const BTN_CLEAR = { x: SCENE_W - 250, y: 694, w: 216, h: 44 };
const BTN_GO = { x: SCENE_W / 2 - 150, y: 486, w: 300, h: 68 };
const BTN_AGAIN = { x: SCENE_W / 2 - 150, y: 492, w: 300, h: 68 };

const SPOT_GAP = 12;
function spotRect(i) {
  const n = L().spots.length;
  const w = (FIELD.w - SPOT_GAP * (n - 1)) / n;
  return { x: FIELD.x + i * (w + SPOT_GAP), y: FIELD.y, w, h: FIELD.h };
}
function bagRect(i) {
  return { x: TRAY.x + 22 + i * 132, y: TRAY.y + 22, w: 118, h: 92 };
}

/* ───────── ورودی ───────── */

const TUT_TAP = [0, 1, 2], TUT_LAST = 2;

cv.addEventListener('pointermove', (e) => {
  const p = toStage(e);
  if (S.drag) { S.drag.x = p.x; S.drag.y = p.y; return; }
  S.hover = null;
  if (S.phase === 'intro') { if (inRect(p, BTN_GO)) S.hover = BTN_GO; }
  else if (S.phase === 'won') { if (inRect(p, BTN_AGAIN)) S.hover = BTN_AGAIN; }
  else {
    if (inRect(p, BTN_GROW)) S.hover = { k: 'grow' };
    if (inRect(p, BTN_CLEAR)) S.hover = { k: 'clear' };
    for (let i = 0; i < S.bag.length; i++) if (inRect(p, bagRect(i))) S.hover = { k: 'bag', i };
    for (let i = 0; i < S.put.length; i++) {
      const r = spotRect(i);
      if (p.x > r.x && p.x < r.x + r.w && p.y > FIELD.y && p.y < GY + 60) S.hover = { k: 'spot', i };
    }
  }
  cv.style.cursor = S.hover ? 'pointer' : 'default';
});

cv.addEventListener('pointerdown', (e) => {
  const p = toStage(e);
  const cap = () => { try { cv.setPointerCapture(e.pointerId); } catch { /* ok */ } };
  if (S.phase === 'intro') { if (inRect(p, BTN_GO)) { startLevel(0); sfx.good(); } return; }
  if (S.phase === 'won') {
    if (inRect(p, BTN_AGAIN)) { S.phase = 'intro'; S.phaseT = 0; S.score = 0; loadLevel(0); sfx.tap(); }
    return;
  }
  if (S.lens >= 0) { S.lens = -1; sfx.tap(); return; }
  if (S.tut.on && tutTap(S.tut, TUT_TAP, TUT_LAST)) return;
  if (S.winT) return;
  if (inRect(p, BTN_GROW)) { startGrow(); return; }
  if (inRect(p, BTN_CLEAR)) { pullAll(); return; }
  /* برداشتنِ دانه از کیسه — نگه‌داشتن برای کشیدن، ضربهٔ کوتاه برای ذرّه‌بین */
  for (let i = 0; i < S.bag.length; i++) {
    if (!inRect(p, bagRect(i))) continue;
    if (S.growing) return;
    S.drag = { from: 'bag', i, id: S.bag[i], x: p.x, y: p.y, t0: S.t };
    cap(); sfx.tap();
    return;
  }
  /* بیرون کشیدنِ دانهٔ کاشته‌شده */
  for (let i = 0; i < S.put.length; i++) {
    if (!S.put[i]) continue;
    const r = spotRect(i);
    if (p.x > r.x && p.x < r.x + r.w && p.y > FIELD.y && p.y < GY + 60) {
      if (S.growing) { tip('صبر کن رشدشان تمام شود.'); return; }
      S.bag.push(S.put[i]); S.put[i] = null; S.grow = 0;
      sfx.pop();
      return;
    }
  }
});

function release() {
  const d = S.drag;
  if (!d) return;
  S.drag = null;
  /* ضربهٔ کوتاه = ذرّه‌بین */
  if (S.t - d.t0 < .22 && d.from === 'bag') {
    S.lens = S.bag.indexOf(d.id);
    sfx.place();
    return;
  }
  const p = { x: d.x, y: d.y };
  for (let i = 0; i < S.put.length; i++) {
    const r = spotRect(i);
    if (p.x < r.x || p.x > r.x + r.w || p.y < FIELD.y || p.y > GY + 90) continue;
    if (S.put[i]) { tip('این گودال پر است.'); sfx.nope(); return; }
    const k = S.bag.indexOf(d.id);
    if (k >= 0) S.bag.splice(k, 1);
    S.put[i] = d.id;
    S.grow = 0;
    sfx.place();
    if (S.tut.on && S.tut.step === 1) { S.tut.step = 2; S.tut.t = 0; }
    return;
  }
  sfx.pop();
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
addEventListener('blur', release);

function startGrow() {
  if (!allPlanted()) { tip('همهٔ گودال‌ها را بکار.'); S.shake = .1; sfx.nope(); return; }
  if (S.growing) return;
  S.growing = true; S.grow = 0;
  sfx.slide();
}

function pullAll() {
  if (S.growing) return;
  for (let i = 0; i < S.put.length; i++) if (S.put[i]) { S.bag.push(S.put[i]); S.put[i] = null; }
  S.grow = 0;
  sfx.tap();
}

function finishGrow() {
  S.growing = false;
  if (allOK()) {
    S.won = true; S.winT = .001;
    S.score += 120 + S.level * 30;
    if (S.score > S.best) S.best = S.score;
    sfx.win();
    for (let i = 0; i < S.put.length; i++) {
      const r = spotRect(i);
      bits.confetti(r.x + r.w / 2, GY - 120, 16, [P.flowerA, P.flowerB, P.leafLt, '#fff']);
    }
  } else {
    sfx.nope();
    toast.say('بعضی‌شان جا نگرفتند', 'bad');
  }
}

/* ───────── حلقه ───────── */

function step(dt) {
  S.t += dt;
  if (S.phaseT < 9) S.phaseT += dt;
  if (S.tipT > 0) S.tipT -= dt;
  if (S.shake > 0) S.shake = Math.max(0, S.shake - dt);
  if (S.tut.on) S.tut.t += dt;
  if (S.growing) {
    S.grow += dt / 3.2;
    if (S.grow >= 1) { S.grow = 1; finishGrow(); }
  }
  if (S.winT) {
    S.winT += dt;
    if (S.winT > 2.4) {
      S.winT = 0;
      if (S.level >= LEVELS.length - 1) { S.phase = 'won'; S.phaseT = 0; }
      else { loadLevel(S.level + 1); toast.say(L().name, 'good'); }
    }
  }
  bits.step(dt);
  toast.step(dt);
  draw();
}

whenFontsReady(() => { loadLevel(0); runLoop(step); });

/* ───────── ابزارِ نقاشی ───────── */

function rrPath(x, y, w, h, r) {
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function numText(str, x, y, o = {}) {
  ctx.save();
  ctx.direction = 'ltr';
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = o.color || P.ink;
  ctx.font = `${o.weight || 700} ${o.size || 18}px "${o.family || 'Vazirmatn'}", Tahoma, sans-serif`;
  ctx.fillText(str, x, y);
  ctx.restore();
}

function spot(rects, alpha) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, SCENE_W, SCENE_H);
  for (const r of rects) rrPath(r.x - 12, r.y - 12, r.w + 24, r.h + 24, 22);
  ctx.fillStyle = `rgba(8, 20, 12, ${alpha})`;
  ctx.fill('evenodd');
  ctx.restore();
}

function tutCard(x, y, w, lines, title) {
  const h = 26 + (title ? 44 : 0) + lines.length * 30;
  withShadow(24, 10, .5, () => {
    ctx.fillStyle = 'rgba(255, 253, 244, .97)';
    wobbleRect(x, y, w, h + 20, 16, 101, 2.2); ctx.fill();
  }, '8, 24, 14');
  ctx.fillStyle = P.grass;
  wobbleRect(x, y, w, 9, 4, 103, 1); ctx.fill();
  let yy = y + 34;
  if (title) { text(title, x + w / 2, yy + 6, { size: 25, family: 'Lalezar', color: P.ink }); yy += 44; }
  for (const l of lines) { text(l, x + w / 2, yy, { size: 18, color: '#6b7a68' }); yy += 30; }
  return h + 20;
}

/* ───────── دانه ───────── */

function drawSeed(id, x, y, k, split) {
  const sd = seedBy(id);
  const mono = sd.k === 'mono';
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(k, k);
  if (mono) {
    /* دانهٔ تک‌لپه: یک‌تکّه، با شیارِ باریک */
    ctx.fillStyle = P.seedADk;
    wobbleEllipse(0, 1, 20, 13, -.2, 3, 1.2); ctx.fill();
    ctx.fillStyle = P.seedA;
    wobbleEllipse(0, 0, 19, 12, -.2, 5, 1.2); ctx.fill();
    ctx.strokeStyle = P.seedADk; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-12, 3); ctx.lineTo(12, -3); ctx.stroke();
    if (id === 'zorrat') {
      ctx.fillStyle = '#f0d060';
      wobbleEllipse(0, 0, 16, 11, -.2, 9, 1); ctx.fill();
    }
    if (split) {
      ctx.strokeStyle = '#7a6a3a'; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.ellipse(-6, 2, 5, 7, -.2, 0, TAU); ctx.stroke();
    }
  } else {
    /* دانهٔ دولپه: دو نیمه */
    const gap = split ? 9 : 0;
    for (const s of [-1, 1]) {
      ctx.save();
      ctx.translate(s * gap, 0);
      ctx.fillStyle = P.seedBDk;
      ctx.beginPath();
      ctx.ellipse(s * 5, 1, 12, 15, s * .18, 0, TAU); ctx.fill();
      ctx.fillStyle = P.seedB;
      ctx.beginPath();
      ctx.ellipse(s * 5, 0, 11, 14, s * .18, 0, TAU); ctx.fill();
      ctx.restore();
    }
    if (!split) {
      ctx.strokeStyle = P.seedBDk; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(0, -13); ctx.lineTo(0, 13); ctx.stroke();
    } else {
      ctx.fillStyle = '#8fbf6a';
      ctx.beginPath(); ctx.ellipse(0, 2, 4, 8, 0, 0, TAU); ctx.fill();
    }
  }
  ctx.restore();
}

/* ───────── گیاه ─────────
   ریشه و برگ همان‌شکلی‌اند که کتاب می‌گوید.                        */

function drawPlant(id, cx, g, ok) {
  const sd = seedBy(id), k = KINDS[sd.k];
  const mono = sd.k === 'mono';
  const up = g * (mono ? 120 : 108);
  const down = g * (mono ? 22 : 58) * PXCM;
  const droop = ok ? 0 : Math.max(0, g - .55) / .45;

  /* ریشه */
  ctx.save();
  ctx.strokeStyle = P.root; ctx.lineCap = 'round';
  if (mono) {
    /* افشان: چند ریشهٔ هم‌کلفت که پهن و کم‌عمق پخش می‌شوند */
    for (let i = 0; i < 9; i++) {
      const a = (i / 8 - .5) * 2.1;
      ctx.lineWidth = 3.4;
      ctx.beginPath();
      ctx.moveTo(cx, GY);
      const ex = cx + Math.sin(a) * down * 1.5, ey = GY + Math.cos(a * .6) * down;
      ctx.quadraticCurveTo(cx + Math.sin(a) * down * .7, GY + down * .5, ex, ey);
      ctx.stroke();
      ctx.lineWidth = 1.8;
      for (let j = 1; j <= 2; j++) {
        const t = j / 3;
        const bx = cx + Math.sin(a) * down * 1.5 * t, by = GY + Math.cos(a * .6) * down * t;
        ctx.beginPath();
        ctx.moveTo(bx, by);
        ctx.lineTo(bx + Math.sin(a + .8) * 16, by + 14);
        ctx.stroke();
      }
    }
  } else {
    /* راست: یک ریشهٔ کلفت که مستقیم پایین می‌رود، با ریشه‌های نازکِ کناری */
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(cx, GY);
    ctx.quadraticCurveTo(cx + 6, GY + down * .55, cx + 2, GY + down);
    ctx.stroke();
    ctx.lineWidth = 2.2;
    for (let j = 1; j <= 6; j++) {
      const t = j / 7;
      const by = GY + down * t;
      const s = j % 2 ? 1 : -1;
      ctx.beginPath();
      ctx.moveTo(cx + 3, by);
      ctx.quadraticCurveTo(cx + s * 18, by + 6, cx + s * 30, by + 16);
      ctx.stroke();
    }
  }
  ctx.restore();

  if (g < .12) return;

  /* ساقه */
  const stemTop = GY - up;
  ctx.strokeStyle = droop > .3 ? '#8a8f4a' : P.stem;
  ctx.lineWidth = mono ? 5 : 6; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx, GY);
  ctx.quadraticCurveTo(cx + droop * 16, GY - up * .6, cx + droop * 34, stemTop + droop * 24);
  ctx.stroke();
  const tipX = cx + droop * 34, tipY = stemTop + droop * 24;

  /* برگ‌ها */
  const col = droop > .3 ? '#a8a25a' : P.leaf;
  const colDk = droop > .3 ? '#7d7a3a' : P.leafDk;
  if (mono) {
    /* برگِ دراز و باریک با رگبرگ‌های موازی */
    for (let i = 0; i < 3; i++) {
      const s = i % 2 ? 1 : -1;
      const base = GY - up * (.25 + i * .26);
      const len = up * (.62 - i * .1);
      ctx.save();
      ctx.strokeStyle = col; ctx.lineWidth = 9; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(cx, base);
      ctx.quadraticCurveTo(cx + s * len * .6, base - len * .5,
        cx + s * len * .95, base - len * .18 + droop * 40);
      ctx.stroke();
      ctx.strokeStyle = colDk; ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(cx, base);
      ctx.quadraticCurveTo(cx + s * len * .6, base - len * .5,
        cx + s * len * .95, base - len * .18 + droop * 40);
      ctx.stroke();
      ctx.restore();
    }
  } else {
    /* برگِ پهن با رگبرگ‌های شبکه‌ای */
    for (let i = 0; i < 2; i++) {
      const s = i ? 1 : -1;
      const base = GY - up * .72;
      ctx.save();
      ctx.translate(cx + droop * 24, base + droop * 18);
      ctx.rotate(s * .5 + droop * .5);
      const w = up * .34, h = up * .26;
      ctx.fillStyle = colDk;
      wobbleEllipse(s * w * .8, 2, w, h, 0, 3 + i, 1.6); ctx.fill();
      ctx.fillStyle = col;
      wobbleEllipse(s * w * .8, 0, w * .96, h * .94, 0, 5 + i, 1.6); ctx.fill();
      ctx.strokeStyle = colDk; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(s * w * 1.7, 0); ctx.stroke();
      for (let v = 1; v <= 3; v++) {
        const t = v / 4;
        ctx.beginPath();
        ctx.moveTo(s * w * 1.7 * t, 0);
        ctx.lineTo(s * w * 1.7 * t + s * 10, -h * .6);
        ctx.moveTo(s * w * 1.7 * t, 0);
        ctx.lineTo(s * w * 1.7 * t + s * 10, h * .6);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  /* گل، وقتی جا گرفته باشد */
  if (ok && g > .82) {
    const fg = (g - .82) / .18;
    if (mono) {
      ctx.fillStyle = P.flowerA;
      for (let i = 0; i < 7; i++) {
        const y = tipY - 6 + i * 7;
        wobbleEllipse(tipX + (i % 2 ? 5 : -5), y, 7 * fg, 4.4 * fg, 0, i, .8); ctx.fill();
      }
    } else {
      for (let i = 0; i < 5; i++) {
        const a = i * TAU / 5 - Math.PI / 2;
        ctx.fillStyle = P.flowerB;
        wobbleEllipse(tipX + Math.cos(a) * 13 * fg, tipY + Math.sin(a) * 13 * fg,
          10 * fg, 8 * fg, a, i * 3, 1); ctx.fill();
      }
      ctx.fillStyle = P.flowerA;
      wobbleCircle(tipX, tipY, 7 * fg, 3, 1); ctx.fill();
    }
  }
  /* نشانهٔ سرنوشت */
  if (g > .95) {
    const y = GY - up - 46;
    ctx.fillStyle = ok ? P.good : P.bad;
    ctx.beginPath(); ctx.arc(cx, y, 15, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
    ctx.beginPath();
    if (ok) { ctx.moveTo(cx - 6, y); ctx.lineTo(cx - 1, y + 6); ctx.lineTo(cx + 7, y - 6); }
    else { ctx.moveTo(cx - 6, y - 6); ctx.lineTo(cx + 6, y + 6); ctx.moveTo(cx + 6, y - 6); ctx.lineTo(cx - 6, y + 6); }
    ctx.stroke();
  }
}

/* ───────── باغ ───────── */

function drawSpot(i) {
  const r = spotRect(i);
  const sp = SPOTS[L().spots[i]];
  const cx = r.x + r.w / 2;

  /* آسمانِ این ستون */
  ctx.save();
  ctx.beginPath(); ctx.rect(r.x, FIELD.y, r.w, FIELD.h); ctx.clip();
  const g = ctx.createLinearGradient(0, FIELD.y, 0, GY);
  g.addColorStop(0, P.skyHi); g.addColorStop(1, P.sky);
  ctx.fillStyle = g;
  ctx.fillRect(r.x, FIELD.y, r.w, GY - FIELD.y);

  /* خاک */
  ctx.fillStyle = texStone(P.soil, P.soilDk);
  ctx.fillRect(r.x, GY, r.w, FIELD.y + FIELD.h - GY);
  ctx.fillStyle = vgrad(GY, FIELD.y + FIELD.h, 'rgba(255,255,255,.12)', 'rgba(0,0,0,.42)');
  ctx.fillRect(r.x, GY, r.w, FIELD.y + FIELD.h - GY);

  /* آبِ زیرزمینی */
  const wy = GY + sp.table * PXCM;
  if (wy < FIELD.y + FIELD.h) {
    ctx.fillStyle = 'rgba(63,143,196,.55)';
    ctx.fillRect(r.x, wy, r.w, FIELD.y + FIELD.h - wy);
    ctx.fillStyle = P.waterLt;
    ctx.fillRect(r.x, wy, r.w, 3);
    for (let k = 0; k < 5; k++) {
      ctx.globalAlpha = .3;
      ctx.beginPath();
      ctx.arc(r.x + 18 + ((k * 53) % (r.w - 30)), wy + 20 + ((k * 31) % 60), 4, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
  /* رطوبتِ سطحی از باران */
  ctx.fillStyle = `rgba(63,143,196,${.10 + sp.rain * .30})`;
  ctx.fillRect(r.x, GY, r.w, 10 * PXCM);

  /* سایه یا آفتاب */
  if (sp.light < .6) {
    ctx.fillStyle = 'rgba(14,32,22,.45)';
    ctx.fillRect(r.x, FIELD.y, r.w, GY - FIELD.y);
  } else if (sp.sun > 1.2) {
    ctx.fillStyle = 'rgba(255,210,122,.16)';
    ctx.fillRect(r.x, FIELD.y, r.w, GY - FIELD.y);
  }
  ctx.restore();

  /* چمنِ سطح */
  ctx.fillStyle = P.grassDk;
  ctx.fillRect(r.x, GY - 4, r.w, 8);
  ctx.fillStyle = P.grass;
  for (let x = r.x; x < r.x + r.w; x += 8) {
    const h = 6 + ((x * 29) % 8);
    ctx.beginPath();
    ctx.moveTo(x, GY + 2); ctx.lineTo(x + 3, GY - h); ctx.lineTo(x + 6, GY + 2);
    ctx.closePath(); ctx.fill();
  }

  /* نشانه‌های شرطِ گودال */
  const iy = FIELD.y + 30;
  if (sp.light < .6) {
    /* ابرِ سایه */
    ctx.fillStyle = 'rgba(40,66,54,.85)';
    for (const [dx, dy, rr] of [[-26, 0, 22], [2, -8, 27], [30, 2, 20]]) {
      wobbleCircle(cx + dx, iy + dy, rr, dx, 2); ctx.fill();
    }
  } else {
    ctx.fillStyle = sp.sun > 1.2 ? '#ffb347' : P.sun;
    wobbleCircle(cx, iy, sp.sun > 1.2 ? 22 : 18, 3, 1.4); ctx.fill();
    ctx.strokeStyle = sp.sun > 1.2 ? '#ffb347' : P.sun;
    ctx.lineWidth = 3.4; ctx.lineCap = 'round';
    for (let k = 0; k < 8; k++) {
      const a = k * TAU / 8 + S.t * .1;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * 27, iy + Math.sin(a) * 27);
      ctx.lineTo(cx + Math.cos(a) * (sp.sun > 1.2 ? 40 : 35), iy + Math.sin(a) * (sp.sun > 1.2 ? 40 : 35));
      ctx.stroke();
    }
  }
  /* بارانِ ستون */
  if (sp.rain > .5) {
    ctx.strokeStyle = 'rgba(127,196,232,.75)'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
    for (let k = 0; k < 7; k++) {
      const x = r.x + 20 + ((k * 37) % (r.w - 40));
      const y = FIELD.y + 76 + ((S.t * 90 + k * 40) % (GY - FIELD.y - 90));
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 3, y + 14); ctx.stroke();
    }
  }

  /* گیاه یا گودالِ خالی — همه‌چیز داخلِ ستونِ خودش */
  ctx.save();
  ctx.beginPath(); rrPath(r.x, FIELD.y, r.w, FIELD.h, 12); ctx.clip();
  const id = S.put[i];
  if (id) {
    const g = S.growing || S.grow > 0 ? S.grow : .001;
    if (g < .05) drawSeed(id, cx, GY + 16, .9, false);
    else drawPlant(id, cx, g, spotOK(i));
  } else {
    ctx.save();
    ctx.globalAlpha = .5 + .25 * Math.sin(S.t * 2.6 + i);
    ctx.strokeStyle = P.paper; ctx.lineWidth = 3;
    ctx.setLineDash([9, 8]);
    ctx.beginPath(); ctx.ellipse(cx, GY + 10, 32, 15, 0, 0, TAU); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = P.soilDk;
    ctx.beginPath(); ctx.ellipse(cx, GY + 12, 26, 11, 0, 0, TAU); ctx.fill();
  }
  ctx.restore();

  /* نامِ شرط */
  ctx.fillStyle = 'rgba(20,32,24,.6)';
  ctx.beginPath(); rrPath(cx - 62, FIELD.y + FIELD.h - 40, 124, 30, 9); ctx.fill();
  text(sp.n, cx, FIELD.y + FIELD.h - 25, { size: 14, color: P.paper });
  /* مرزِ ستون */
  ctx.strokeStyle = 'rgba(12,24,16,.55)'; ctx.lineWidth = 3;
  ctx.beginPath(); rrPath(r.x, FIELD.y, r.w, FIELD.h, 12); ctx.stroke();
}

function drawTray() {
  ctx.fillStyle = '#1d2a20';
  ctx.beginPath(); rrPath(TRAY.x, TRAY.y, TRAY.w, TRAY.h, 14); ctx.fill();
  ctx.strokeStyle = 'rgba(90,168,196,.2)'; ctx.lineWidth = 2;
  ctx.beginPath(); rrPath(TRAY.x, TRAY.y, TRAY.w, TRAY.h, 14); ctx.stroke();
  S.bag.forEach((id, i) => {
    const b = bagRect(i);
    if (S.drag && S.drag.id === id && S.bag.indexOf(id) === i) return;
    const hot = S.hover && S.hover.k === 'bag' && S.hover.i === i;
    ctx.fillStyle = hot ? 'rgba(255,255,255,.14)' : 'rgba(255,255,255,.07)';
    ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 12); ctx.fill();
    ctx.strokeStyle = 'rgba(224,236,224,.24)'; ctx.lineWidth = 2;
    ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 12); ctx.stroke();
    drawSeed(id, b.x + b.w / 2, b.y + 36, .95, false);
    text(seedBy(id).n, b.x + b.w / 2, b.y + b.h - 18,
      { size: seedBy(id).n.length > 8 ? 12 : 14, color: '#dff0e0' });
  });
  text('دانه را بکش توی گودال — یک ضربه هم بزنی، زیرِ ذرّه‌بین می‌بینی‌اش',
    TRAY.x + TRAY.w / 2 - 120, TRAY.y + TRAY.h - 10,
    { size: 13, color: 'rgba(223,240,224,.45)' });
  button(BTN_GROW, S.growing ? 'دارند رشد می‌کنند…' : 'بکار و ببین', {
    hot: S.hover && S.hover.k === 'grow', fill: '#3f8f4a', hotFill: '#55a860',
    size: 22, disabled: S.growing });
  button(BTN_CLEAR, 'همه را دربیاور', {
    hot: S.hover && S.hover.k === 'clear', fill: '#4a5c4a', hotFill: '#5f7460', size: 17 });
}

function drawLens() {
  if (S.lens < 0 || S.lens >= S.bag.length) return;
  const id = S.bag[S.lens];
  const sd = seedBy(id), k = KINDS[sd.k];
  ctx.fillStyle = 'rgba(10, 20, 14, .82)';
  ctx.fillRect(0, 0, SCENE_W, SCENE_H);
  const w = 560, h = 380, x = (SCENE_W - w) / 2, y = 180;
  paper(x, y, w, h, P.paper, 41, 18, .5);
  ctx.fillStyle = P.grass;
  ctx.beginPath(); rrPath(x, y, w, 10, 5); ctx.fill();
  text(sd.n, x + w / 2, y + 46, { size: 28, family: 'Lalezar', color: P.ink });
  text('دانه را خیس کردیم و پوستش را برداشتیم', x + w / 2, y + 80,
    { size: 15, color: P.inkSoft });
  ctx.save();
  ctx.translate(0, 30);
  drawSeed(id, x + w / 2, y + 190, 3.4, true);
  ctx.restore();
  text(sd.k === 'mono' ? 'یک قسمتی' : 'دو قسمتی', x + w / 2, y + 314,
    { size: 24, family: 'Lalezar', color: P.grassDk });
  text('برای بستن، هرجا را بزن', x + w / 2, y + 352, { size: 14, color: P.inkSoft });
}

/* ───────── نوار و پرده‌ها ───────── */

function drawHUD() {
  ctx.fillStyle = '#101a12';
  ctx.fillRect(0, 0, SCENE_W, HUD_H);
  ctx.fillStyle = 'rgba(224,166,63,.22)';
  ctx.fillRect(0, HUD_H - 2, SCENE_W, 2);
  text(L().name, SCENE_W - 150, HUD_H / 2, { size: 24, family: 'Lalezar', color: P.paper });
  numText(fa(S.level + 1) + ' / ' + fa(LEVELS.length), 640, HUD_H / 2, { size: 21, color: P.gold });
  numText(fa(S.score), 300, HUD_H / 2, { size: 20, color: P.paper });
  text('بیشترین ' + fa(S.best), 150, HUD_H / 2, { size: 15, color: 'rgba(251,247,232,.6)' });
  ctx.fillStyle = 'rgba(255,255,255,.14)';
  ctx.beginPath(); rrPath(24, HUD_H - 9, 240, 5, 3); ctx.fill();
  ctx.fillStyle = P.gold;
  ctx.beginPath(); rrPath(24, HUD_H - 9, 240 * clamp((S.level + (S.won ? 1 : 0)) / LEVELS.length, 0, 1), 5, 3); ctx.fill();
}

function drawTutorial() {
  const st = S.tut.step;
  if (st === 0) {
    const r = spotRect(0);
    spot([{ x: r.x, y: FIELD.y, w: r.w, h: FIELD.h }], .72);
    const h = tutCard(380, 250, 520,
      ['هر گودال شرطِ خودش را دارد:', 'آب کجاست و آفتاب چقدر است.'], 'باغِ درست');
    tutMore(640, 250 + h + 8, S.t, P.ink);
  } else if (st === 1) {
    spot([{ x: TRAY.x, y: TRAY.y, w: 300, h: TRAY.h }], .7);
    const h = tutCard(380, 250, 520,
      ['دانه را بکش توی گودال.', 'یک ضربه بزنی، توی ذرّه‌بین می‌بینی‌اش.']);
    tutMore(640, 250 + h + 8, S.t, P.ink);
  } else {
    spot([{ x: BTN_GROW.x, y: BTN_GROW.y, w: BTN_GROW.w, h: BTN_GROW.h }], .7);
    const h = tutCard(320, 230, 560,
      ['بعد «بکار و ببین» را بزن', 'و ریشه‌ها را زیرِ خاک تماشا کن.']);
    tutMore(600, 230 + h + 8, S.t, P.ink);
  }
}

function seedIcon(x, y) {
  ctx.save();
  ctx.translate(x, y);
  drawSeed('gandom', -26, 0, 1.1, false);
  drawSeed('lubia', 26, 0, 1.1, false);
  ctx.restore();
}

function drawIntro() {
  overlay({
    t: S.phaseT, w: 880, h: 306, y: 128,
    paper: P.paper, band: P.grass, ink: P.ink, inkSoft: '#6b7a68',
    icon: seedIcon,
    title: 'باغِ درست',
    body: 'هر گودالِ باغ شرطِ خودش را دارد: آبش عمیق است یا سطحی،\nآفتابش تند است یا سایه.\nدانهٔ درست را در گودالِ درست بکار تا همه گل بدهند.',
    btn: BTN_GO, btnLabel: 'شروع', btnHot: S.hover === BTN_GO,
    btnFill: '#3f8f4a', btnHotFill: '#55a860',
  });
}

function drawWon() {
  overlay({
    t: S.phaseT, w: 840, h: 300, y: 140,
    paper: P.paper, band: P.gold, ink: P.ink, inkSoft: '#6b7a68',
    icon: seedIcon,
    title: 'باغت گل داد',
    body: 'دانهٔ دو قسمتی ریشهٔ راست و برگِ پهن دارد،\nدانهٔ یک قسمتی ریشهٔ افشان و برگِ باریک —\nو همین بود که هرکدام را جای خودش زنده نگه داشت. امتیازت: ' + fa(S.score),
    btn: BTN_AGAIN, btnLabel: 'از نو', btnHot: S.hover === BTN_AGAIN,
    btnFill: '#3f8f4a', btnHotFill: '#55a860',
  });
}

function draw() {
  beginScene(P.skyLo);
  ctx.save();
  if (S.shake > 0) {
    const k = S.shake * 10;
    ctx.translate(Math.sin(S.t * 55) * k, 0);
  }
  ctx.fillStyle = P.skyLo;
  ctx.fillRect(0, HUD_H, SCENE_W, SCENE_H - HUD_H);
  for (let i = 0; i < L().spots.length; i++) drawSpot(i);
  drawTray();
  if (S.drag) drawSeed(S.drag.id, S.drag.x, S.drag.y, 1.1, false);
  bits.draw();
  ctx.restore();
  drawHUD();
  if (!(S.phase === 'play' && S.tut.on)) toast.draw(HUD_H + 8, { good: P.good, bad: P.bad, info: P.card, ink: P.ink });
  if (S.phase === 'play' && S.tut.on && S.lens < 0) drawTutorial();
  if (S.lens >= 0) drawLens();
  if (S.phase === 'intro') drawIntro();
  if (S.phase === 'won') drawWon();
  if (S.tipT > 0) {
    ctx.save();
    ctx.globalAlpha = clamp(S.tipT, 0, 1);
    const w = 470;
    paper(SCENE_W / 2 - w / 2, GY - 60, w, 42, P.paper, 51, 12, .3);
    text(S.tip, SCENE_W / 2, GY - 39, { size: 16, color: P.ink });
    ctx.restore();
  }
  endScene(.08, 'rgba(8, 20, 12, .4)', 0, .1);
}
