<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#24313a">
<title>مزرعهٔ علی‌آقا — کسر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>
  /* صفحه نباید هیچ‌جا اسکرول یا زوم شود؛ بازی باید مثل یک برنامه رفتار کند. */
  html, body {
    margin: 0; padding: 0; background: #24313a;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body {
    position: fixed; inset: 0;          /* جلوی کشیده‌شدنِ صفحه در سافاریِ گوشی */
    width: 100%; height: 100vh; height: 100dvh;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none; -webkit-touch-callout: none;
  }

  /* گوشیِ عمودی صحنه را ریز می‌کند؛ بچه باید گوشی را بچرخاند. */
  #rotate { display: none; }
  @media (orientation: portrait) and (max-width: 860px) {
    #stage { display: none; }
    #rotate {
      display: flex; position: fixed; inset: 0;
      z-index: 9;
      flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      background: #24313a; color: #f6ead2;
      font: 700 20px "Vazirmatn", Tahoma, sans-serif; text-align: center; padding: 32px;
    }
    #rotate svg { animation: tilt 2.4s ease-in-out infinite; }
    @keyframes tilt { 0%, 45% { transform: rotate(0deg); } 65%, 100% { transform: rotate(-90deg); } }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="rotate">
  <svg width="86" height="126" viewBox="0 0 86 126" fill="none" aria-hidden="true">
    <rect x="3" y="3" width="80" height="120" rx="12" stroke="#e8b448" stroke-width="5"/>
    <rect x="15" y="19" width="56" height="88" rx="5" fill="#e8b448" opacity=".28"/>
    <circle cx="43" cy="115" r="4" fill="#e8b448"/>
  </svg>
  <div>گوشی را بچرخان</div>
  <div style="font-weight:400;opacity:.7;font-size:16px">این بازی خوابیده بازی می‌شود</div>
</div>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   هستهٔ مشترکِ بازی‌ها — سبک «کاغذبُری»
   ───────────────────────────────────────────────────────────────────────
   این فایل جعبه‌ابزار است، نه چارچوب: هر بازی حلقه و وضعیت خودش را دارد
   و فقط از این توابع برای کشیدن استفاده می‌کند. دلیلش این است که هر بازی
   باید حس‌وحال خودش را داشته باشد، نه اینکه همه شبیه هم دربیایند.

   قاعده‌های ثابتِ تصویری:
   • نور همیشه از بالا-چپ می‌تابد، پس سایه‌ها به پایین-راست می‌افتند.
   • هیچ لبه‌ای کاملاً صاف نیست؛ همه کمی موج دارند (انگار با قیچی بریده).
   • هیچ خاکستریِ خالصی نداریم؛ همه‌ی خنثی‌ها به گرمیِ صحنه می‌زنند.
   • یک لایه‌ی دانه‌دانه‌ی کاغذ روی کلِ تصویر ضرب می‌شود.
   ═══════════════════════════════════════════════════════════════════════ */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const FA_D = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
const fa = (n) => String(n).replace(/\d/g, (d) => FA_D[+d]);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeIn = (t) => t * t * t;
const easeInOut = (t) => (t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2);
const easeBack = (t) => 1 + 2.7 * Math.pow(t-1, 3) + 1.7 * Math.pow(t-1, 2);
const easeElastic = (t) => t === 0 || t === 1 ? t : Math.pow(2, -9*t) * Math.sin((t*10 - .75) * 2.094) + 1;

/** تصادفِ تکرارپذیر: با یک بذر همیشه همان عدد. برای اینکه تزئین‌ها هر فریم نپرند. */
function noise1(x) {
  const s = Math.sin(x * 127.1) * 43758.5453;
  return s - Math.floor(s);
}
const pick = (arr, seed) => arr[Math.floor(noise1(seed) * arr.length) % arr.length];

/* ───────── بوم و صحنهٔ ثابت ───────── */

let ctx, SW, SH, CV, _refit = null;
let view = { scale: 1, ox: 0, oy: 0, w: 0, h: 0, dpr: 1 };
let _grain = null, _grainDark = null;

function initStage(canvas, w, h) {
  CV = canvas; SW = w; SH = h;
  ctx = canvas.getContext('2d');

  /* اندازه را از خودِ بوم می‌گیریم نه از innerHeight؛ چون در سافاریِ گوشی
     نوارِ آدرس باز و بسته می‌شود و innerHeight دروغ می‌گوید. */
  const fit = () => {
    const r = canvas.getBoundingClientRect();
    const vw = Math.round(r.width), vh = Math.round(r.height);
    if (vw < 20 || vh < 20) return;
    const dpr = Math.min(devicePixelRatio || 1, QUALITY > 0 ? 2 : 1);
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    const scale = Math.min(vw / SW, vh / SH);
    view = { scale, ox: (vw - SW*scale)/2, oy: (vh - SH*scale)/2, w: vw, h: vh, dpr };
    _grain = buildGrain();
  };
  _refit = fit;
  addEventListener('resize', fit);
  /* چرخاندنِ گوشی: اندازهٔ درست چند لحظه بعد می‌رسد، پس چندبار اندازه می‌گیریم. */
  addEventListener('orientationchange', () => {
    fit(); setTimeout(fit, 140); setTimeout(fit, 460);
  });
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(canvas);

  /* صدا در گوشی فقط بعد از اوّلین لمس اجازهٔ پخش دارد. */
  const unlock = () => { sfx._c(); removeEventListener('pointerdown', unlock); removeEventListener('touchstart', unlock); };
  addEventListener('pointerdown', unlock, { passive: true });
  addEventListener('touchstart', unlock, { passive: true });
  /* نگه‌داشتنِ انگشت نباید منوی مرورگر را باز کند. */
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  fit();
  return ctx;
}

/** قابِ صحنه را باز می‌کند: بعد از این، مختصات همیشه در فضای SW×SH است. */
function beginScene(bg) {
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, view.w, view.h);
  ctx.save();
  ctx.translate(view.ox, view.oy);
  ctx.scale(view.scale, view.scale);
  ctx.beginPath();
  ctx.rect(0, 0, SW, SH);
  ctx.clip();
}

/* ───────── پوششِ پایانِ قاب ─────────
   دانه‌های کاغذ و تیرگیِ گوشه‌ها هر دو ثابت‌اند و تغییر نمی‌کنند، ولی
   قبلاً هر فریم از نو کشیده می‌شدند: یکی با «multiply» روی کلِّ صفحه و
   یکی با یک گرادیانِ شعاعیِ تازه. اندازه‌گیری نشان داد همین دو تا
   ۱۱ تا ۱۶ میلی‌ثانیه از هر فریم را می‌خوردند — بیشتر از کشیدنِ خودِ
   صحنه. حالا یک بار در یک بومِ جدا پخته می‌شوند و هر فریم فقط یک
   drawImage است.                                                       */

let _ovl = null, _ovlKey = '';

function overlayLayer(grainAlpha, vignette) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const w = Math.max(2, Math.round(SW * q)), h = Math.max(2, Math.round(SH * q));
  const key = w + 'x' + h + '|' + grainAlpha + '|' + vignette;
  if (_ovl && _ovlKey === key) return _ovl;
  let c;
  try {
    c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g2 = c.getContext('2d');
    if (!g2) return null;
    if (_grainDark && grainAlpha > 0) {
      /* همان دانه‌ها، ولی به‌جای multiply به شکلِ سیاهِ کم‌رنگ */
      g2.globalAlpha = clamp(grainAlpha * 1.15, 0, 1);
      g2.fillStyle = g2.createPattern(_grainDark, 'repeat');
      g2.fillRect(0, 0, w, h);
      g2.globalAlpha = 1;
    }
    if (vignette) {
      const g = g2.createRadialGradient(w / 2, h / 2, h * .42, w / 2, h / 2, h * 1.05);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, vignette);
      g2.fillStyle = g;
      g2.fillRect(0, 0, w, h);
    }
  } catch (e) { return null; }
  _ovl = c; _ovlKey = key;
  return c;
}

/** بافتِ کاغذ، تیرگیِ گوشه‌ها، رنگ‌بندی و درخششِ نور را می‌گذارد و قاب را می‌بندد. */
function endScene(grainAlpha = .15, vignette = 'rgba(48,28,14,.30)', bloom = .34, grade = .14) {
  /* درخششِ نور خاموش است. اندازه‌گیری نشان داد هر فریم ۲۱ میلی‌ثانیه
     می‌گیرد — بیشتر از تمامِ کارهای دیگرِ یک فریم روی هم — چون برای
     ساختنش باید کلِّ بوم دوباره خوانده شود. از آن بدتر: متنِ فارسی را
     مه‌آلود می‌کرد و خواندنش را سخت‌تر. بی‌آن، صحنه تمیزتر است. */
  bloom = 0;
  if (QUALITY < 1) { grade = 0; grainAlpha *= .5; }
  if (QUALITY < 2) grade = 0;
  if (grade > 0) {
    /* رنگ‌بندیِ نرم: بالای صحنه گرم‌تر، پایین سردتر — عمق می‌دهد */
    const g = ctx.createLinearGradient(0, 0, 0, SH);
    g.addColorStop(0, `rgba(255, 214, 150, ${grade})`);
    g.addColorStop(.55, 'rgba(255, 255, 255, 0)');
    g.addColorStop(1, `rgba(40, 60, 110, ${grade * .9})`);
    ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalCompositeOperation = 'source-over';
  }
  const ov = (grainAlpha > 0 || vignette) ? overlayLayer(grainAlpha, vignette) : null;
  if (ov) ctx.drawImage(ov, 0, 0, SW, SH);
  ctx.restore();
  bloomPass(bloom);
}

/* ───────── درخششِ نور (bloom) ─────────
   قابِ رسم‌شده را کوچک می‌کنیم، دو بار در خودش ضرب می‌کنیم تا فقط
   روشن‌ها بمانند، محوش می‌کنیم و با حالتِ «lighter» رویش می‌گذاریم.
   نتیجه: چراغ‌ها، شعله‌ها و رنگ‌های روشن نور پخش می‌کنند. */
let _bl, _blc, _bl2, _bl2c, _blNo = false, _blTick = 0;

function bloomPass(amount) {
  if (!amount || _blNo || !CV.width) return;
  /* کوچک‌کردن و بزرگ‌کردنِ دوباره، خودش محو می‌کند — از filter خیلی ارزان‌تر است */
  const W = Math.max(4, Math.round(CV.width * .2)), H = Math.max(4, Math.round(CV.height * .2));
  const W2 = Math.max(2, Math.round(W * .28)), H2 = Math.max(2, Math.round(H * .28));
  try {
    if (!_bl) {
      _bl = document.createElement('canvas'); _blc = _bl.getContext('2d');
      _bl2 = document.createElement('canvas'); _bl2c = _bl2.getContext('2d');
      if (!_blc || !_bl2c) { _blNo = true; return; }
    }
    if (_bl.width !== W || _bl.height !== H) { _bl.width = W; _bl.height = H; }
    if (_bl2.width !== W2 || _bl2.height !== H2) { _bl2.width = W2; _bl2.height = H2; }
    /* ساختنِ نور یک قاب در میان کافی است؛ گذاشتنش هر قاب. */
    _blTick = (_blTick + 1) & 1;
    if (!_blTick) {
      _blc.globalCompositeOperation = 'source-over';
      _blc.clearRect(0, 0, W, H);
      _blc.drawImage(CV, 0, 0, W, H);
      _blc.globalCompositeOperation = 'multiply';
      _blc.drawImage(_bl, 0, 0);
      _blc.drawImage(_bl, 0, 0);
      _blc.globalCompositeOperation = 'source-over';
      _bl2c.clearRect(0, 0, W2, H2);
      _bl2c.drawImage(_bl, 0, 0, W2, H2);
    }

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = amount;
    ctx.drawImage(_bl2, 0, 0, CV.width, CV.height);
    ctx.restore();
  } catch (e) { _blNo = true; }
}

/* ───────── لایهٔ ثابت ─────────
   هرچه در صحنه تکان نمی‌خورد را یک‌بار می‌کشیم و بعد فقط کپی می‌کنیم. */
const _layers = {};
function staticLayer(key, w, h, paint) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const L = _layers[key];
  if (L && L.q === q && L.w === w && L.h === h) return L.cv;
  const off = document.createElement('canvas');
  off.width = Math.max(1, Math.round(w * q));
  off.height = Math.max(1, Math.round(h * q));
  const c = off.getContext('2d');
  c.setTransform(q, 0, 0, q, 0, 0);
  const prev = ctx;
  ctx = c;
  try { paint(); } finally { ctx = prev; }
  _layers[key] = { cv: off, q, w, h };
  return off;
}

/* ───────── نورپردازی و بافت ─────────
   کارِ این‌ها این است که هیچ سطحی «تختِ یک‌رنگ» نماند. */

/** شیبِ عمودی: بالا روشن، پایین تیره. */
function vgrad(y0, y1, top, bot) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, top); g.addColorStop(1, bot);
  return g;
}

/** حجمِ کروی: نور از بالا-چپ، سایه در پایین-راست. */
function ball(cx, cy, r, lit, base, dark) {
  const g = ctx.createRadialGradient(cx - r * .38, cy - r * .42, r * .06, cx, cy, r * 1.06);
  g.addColorStop(0, lit); g.addColorStop(.45, base); g.addColorStop(1, dark);
  return g;
}

/** لبهٔ روشنِ بالا-چپِ یک مسیر — همان «rim light». */
function rim(pathFn, col, w = 2.2) {
  ctx.save();
  ctx.beginPath(); pathFn();
  ctx.clip();
  ctx.beginPath(); pathFn();
  ctx.strokeStyle = col; ctx.lineWidth = w * 2; ctx.lineJoin = 'round';
  ctx.translate(-w * .5, -w * .6);
  ctx.stroke();
  ctx.restore();
}

/** سایهٔ چسبیده به زمین — چیزها را روی سطح می‌نشاند. */
function contact(cx, cy, rx, ry, alpha = .26) {
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
  g.addColorStop(0, `rgba(20, 12, 6, ${alpha})`);
  g.addColorStop(1, 'rgba(20, 12, 6, 0)');
  ctx.save();
  ctx.fillStyle = g;
  ctx.translate(cx, cy); ctx.scale(1, ry / Math.max(rx, ry));
  ctx.beginPath(); ctx.arc(0, 0, Math.max(rx, ry), 0, TAU); ctx.fill();
  ctx.restore();
}

const _tex = {};
/** بافتِ تکرارشونده؛ یک‌بار ساخته و بعد از حافظه خوانده می‌شود. */
function texture(key, w, h, paint) {
  if (_tex[key]) return _tex[key];
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const c = off.getContext('2d');
  paint(c, w, h);
  _tex[key] = ctx.createPattern(off, 'repeat');
  return _tex[key];
}

/** رگهٔ چوب. */
function texWood(base, grain) {
  return texture('w' + base + grain, 120, 120, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = grain; c.lineWidth = 1.4;
    for (let i = 0; i < 9; i++) {
      c.globalAlpha = .18 + noise1(i * 3.1) * .3;
      c.beginPath();
      const y0 = i * 14 + noise1(i) * 6;
      c.moveTo(0, y0);
      for (let x = 0; x <= w; x += 10) c.lineTo(x, y0 + Math.sin(x * .09 + i) * 2.6);
      c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** تارِ پارچه. */
function texCloth(base, thread) {
  return texture('c' + base + thread, 16, 16, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = thread; c.lineWidth = 1; c.globalAlpha = .5;
    for (let i = 0; i < w; i += 4) {
      c.beginPath(); c.moveTo(i, 0); c.lineTo(i, h); c.stroke();
      c.beginPath(); c.moveTo(0, i); c.lineTo(w, i); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** دانه‌های سنگ. */
function texStone(base, spec) {
  return texture('s' + base + spec, 90, 90, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) {
      c.globalAlpha = .05 + noise1(i * 1.7) * .16;
      c.fillStyle = spec;
      const r = .6 + noise1(i * 5.3) * 1.9;
      c.beginPath();
      c.arc(noise1(i * 2.1) * w, noise1(i * 3.7 + 1) * h, r, 0, TAU);
      c.fill();
    }
    c.globalAlpha = 1;
  });
}

/** الیافِ کاغذ. */
function texPaper(base) {
  return texture('p' + base, 100, 100, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 130; i++) {
      c.globalAlpha = .04 + noise1(i * 2.3) * .07;
      c.strokeStyle = i % 2 ? '#ffffff' : '#5a4326';
      c.lineWidth = .9;
      const x = noise1(i * 1.3) * w, y = noise1(i * 4.1 + 2) * h;
      const a = noise1(i * 7.7) * TAU, l = 4 + noise1(i * 9.1) * 12;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

function buildGrain() {
  const s = 260;
  const off = document.createElement('canvas');
  off.width = off.height = s;
  const c = off.getContext('2d');
  const img = c.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    const v = 214 + Math.random() * 41;
    img.data[i*4] = v; img.data[i*4+1] = v; img.data[i*4+2] = v; img.data[i*4+3] = 255;
  }
  c.putImageData(img, 0, 0);
  /* همان دانه‌ها به شکلِ سیاهِ کم‌رنگ، تا بشود بدونِ multiply گذاشتشان */
  const d = document.createElement('canvas');
  d.width = d.height = s;
  const dc = d.getContext('2d');
  const dimg = dc.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    dimg.data[i*4] = 0; dimg.data[i*4+1] = 0; dimg.data[i*4+2] = 0;
    dimg.data[i*4+3] = 255 - img.data[i*4];
  }
  dc.putImageData(dimg, 0, 0);
  _grainDark = d;
  _ovl = null; _ovlKey = '';
  return ctx.createPattern(off, 'repeat');
}

function toStage(e) {
  const r = CV.getBoundingClientRect();
  return {
    x: (e.clientX - r.left - view.ox) / view.scale,
    y: (e.clientY - r.top - view.oy) / view.scale,
  };
}

const inRect = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
const inCircle = (p, b, pad = 0) => Math.hypot(p.x - b.x, p.y - b.y) <= b.r + pad;

/* ───────── قلم‌های کاغذبُری ───────── */

/** دایره‌ای که انگار با قیچی بریده شده. */
function wobbleCircle(cx, cy, r, seed = 0, amp = 2.2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const rr = r + Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp * .45;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** بیضیِ ناصاف — برای چیزهایی که گرد نیستند ولی نرم‌اند. */
function wobbleEllipse(cx, cy, rx, ry, rot = 0, seed = 0, amp = 2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const w = 1 + (Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp*.45) / Math.max(rx, ry);
    const px = Math.cos(a) * rx * w, py = Math.sin(a) * ry * w;
    const x = cx + px*Math.cos(rot) - py*Math.sin(rot);
    const y = cy + px*Math.sin(rot) + py*Math.cos(rot);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** مستطیلِ گِرد با گوشه‌های کمی کج. */
function wobbleRect(x, y, w, h, r = 12, seed = 0, amp = 1.6) {
  const j = (k) => (noise1(seed*9.7 + k) - .5) * amp * 2;
  ctx.beginPath();
  ctx.moveTo(x + r + j(1), y + j(2));
  ctx.lineTo(x + w - r + j(3), y + j(4));
  ctx.quadraticCurveTo(x + w + j(5), y + j(6), x + w + j(7), y + r + j(8));
  ctx.lineTo(x + w + j(9), y + h - r + j(10));
  ctx.quadraticCurveTo(x + w + j(11), y + h + j(12), x + w - r + j(13), y + h + j(14));
  ctx.lineTo(x + r + j(15), y + h + j(16));
  ctx.quadraticCurveTo(x + j(17), y + h + j(18), x + j(19), y + h - r + j(20));
  ctx.lineTo(x + j(21), y + r + j(22));
  ctx.quadraticCurveTo(x + j(23), y + j(24), x + r + j(1), y + j(2));
  ctx.closePath();
}

/** سایهٔ نرم؛ نور از بالا-چپ. */
function withShadow(blur, dy, alpha, fn, hue = '78, 46, 24') {
  ctx.save();
  ctx.shadowColor = `rgba(${hue}, ${alpha})`;
  ctx.shadowBlur = blur;
  ctx.shadowOffsetY = dy;
  ctx.shadowOffsetX = dy * .35;
  fn();
  ctx.restore();
}

/** یک برگه‌ی کاغذ با سایه — پایه‌ی همه‌ی کارت‌ها و تابلوها. */
function paper(x, y, w, h, fill, seed = 1, r = 12, shadow = .26) {
  withShadow(16, 7, shadow, () => {
    ctx.fillStyle = fill;
    wobbleRect(x, y, w, h, r, seed, 2);
    ctx.fill();
  });
  /* الیافِ کاغذ و لبهٔ روشن، تا سطح تخت نماند */
  ctx.save();
  ctx.beginPath(); wobbleRect(x, y, w, h, r, seed, 2); ctx.clip();
  ctx.globalAlpha = .5;
  ctx.fillStyle = texPaper(fill);
  ctx.fillRect(x, y, w, h);
  ctx.globalAlpha = 1;
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.4, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(90,60,20,.1)');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
}

function text(str, x, y, o = {}) {
  const size = o.size || 20;
  const fam = o.family || 'Vazirmatn';
  ctx.save();
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.font = `${fam === 'Lalezar' ? '400' : (o.weight || 700)} ${size}px "${fam}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.baseline || 'middle';
  ctx.fillStyle = o.color || '#43291b';
  ctx.direction = 'rtl';
  if (o.stroke) {
    ctx.lineWidth = o.strokeWidth || 5;
    ctx.strokeStyle = o.stroke;
    ctx.lineJoin = 'round';
    ctx.strokeText(str, x, y, o.maxWidth);
  }
  ctx.fillText(str, x, y, o.maxWidth);
  ctx.restore();
}

/** متنِ چندخطی که خودش می‌شکند. ارتفاعِ اشغال‌شده را برمی‌گرداند. */
function textWrap(str, x, y, maxW, o = {}) {
  const size = o.size || 19, lh = o.lineHeight || size * 1.7;
  ctx.font = `${o.weight || 700} ${size}px "${o.family || 'Vazirmatn'}", Tahoma, sans-serif`;
  const lines = [];
  for (const para of str.split('\n')) {
    let line = '';
    for (const wd of para.split(' ')) {
      const t = line ? line + ' ' + wd : wd;
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = wd; }
      else line = t;
    }
    lines.push(line);
  }
  lines.forEach((l, i) => text(l, x, y + i * lh, o));
  return lines.length * lh;
}

/* ───────── ذره‌ها ───────── */

class Bits {
  constructor() { this.list = []; }
  add(x, y, n, kind, colors, opts = {}) {
    for (let i = 0; i < n; i++) {
      const a = opts.dir !== undefined ? opts.dir + (Math.random()-.5) * (opts.spread || 1) : Math.random() * TAU;
      const sp = (opts.speed || 200) * (.4 + Math.random());
      this.list.push({
        kind, x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - (opts.lift || 0),
        r: (opts.size || 4) * (.5 + Math.random()),
        rot: Math.random() * TAU, vr: (Math.random()-.5) * 10,
        col: colors[(Math.random() * colors.length) | 0],
        grav: opts.grav === undefined ? 620 : opts.grav,
        drag: opts.drag || .995,
        life: (opts.life || .9) * (.6 + Math.random() * .8), age: 0,
      });
    }
  }
  confetti(x, y, n, colors) {
    this.add(x, y, n, 'flake', colors, { speed: 420, lift: 190, size: 5, life: 1.6, grav: 780 });
  }
  spark(x, y, n, colors) {
    this.add(x, y, n, 'dot', colors, { speed: 180, lift: 30, size: 3.4, life: .7, grav: 260, drag: .93 });
  }
  step(dt) {
    for (const p of this.list) {
      p.age += dt;
      p.vy += p.grav * dt;
      p.vx *= p.drag; p.vy *= p.drag;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    }
    this.list = this.list.filter((p) => p.age < p.life);
  }
  draw() {
    for (const p of this.list) {
      const k = clamp(1 - p.age / p.life, 0, 1);
      ctx.save();
      ctx.globalAlpha = k;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.col;
      if (p.kind === 'flake') ctx.fillRect(-p.r, -p.r*1.5, p.r*2, p.r*3);
      else if (p.kind === 'leaf') { wobbleEllipse(0, 0, p.r*1.8, p.r*.8, 0, p.r, .6); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(0, 0, p.r * k, 0, TAU); ctx.fill(); }
      ctx.restore();
    }
  }
  clear() { this.list.length = 0; }
}

/* ───────── صدا (بدون فایل صوتی) ───────── */

const sfx = {
  ac: null, on: true,
  _c() {
    if (!this.on) return null;
    if (!this.ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; this.ac = new A(); }
    if (this.ac.state === 'suspended') this.ac.resume();
    return this.ac;
  },
  tone(f, dur = .16, type = 'sine', gain = .13, delay = 0) {
    const c = this._c(); if (!c) return;
    const t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(t0 + dur + .04);
  },
  tap()  { this.tone(430, .07, 'triangle', .09); },
  place(){ this.tone(620, .11, 'sine', .12); },
  pop()  { this.tone(760, .09, 'sine', .11); },
  slide(){ this.tone(240, .22, 'sine', .07); },
  good() { [523, 659, 784].forEach((f,i) => this.tone(f, .22, 'sine', .13, i*.07)); },
  win()  { [523, 659, 784, 1047].forEach((f,i) => this.tone(f, .34, 'triangle', .13, i*.10)); },
  nope() { this.tone(180, .2, 'sawtooth', .07); },
  tick() { this.tone(1100, .04, 'square', .05); },
};

/* ───────── قطعه‌های آماده ───────── */

function star(x, y, r, col, rot = 0) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = col;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI/2 + i * Math.PI/5;
    const rr = i % 2 ? r * .45 : r;
    const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/** دکمهٔ کاغذی. hovered را خودِ بازی می‌دهد؛ اینجا فقط کشیده می‌شود. */
/** رنگ را روشن‌تر (k>0) یا تیره‌تر (k<0) می‌کند. */
function shade(col, k) {
  const c = String(col).trim();
  let r, g2, b2;
  if (c[0] === '#') {
    const h = c.length === 4 ? c[1]+c[1]+c[2]+c[2]+c[3]+c[3] : c.slice(1, 7);
    r = parseInt(h.slice(0,2), 16); g2 = parseInt(h.slice(2,4), 16); b2 = parseInt(h.slice(4,6), 16);
  } else {
    const m = c.match(/[\d.]+/g);
    if (!m || m.length < 3) return col;
    r = +m[0]; g2 = +m[1]; b2 = +m[2];
  }
  const f = (v) => Math.round(clamp(k < 0 ? v * (1 + k) : v + (255 - v) * k, 0, 255));
  return 'rgb(' + f(r) + ',' + f(g2) + ',' + f(b2) + ')';
}

function button(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 3 : 0;
  const fill = o.disabled ? (o.off || '#bcaa92') : (hot ? (o.hotFill || o.fill) : o.fill);
  const r = o.r === undefined ? 14 : o.r;
  /* لبهٔ زیرینِ تیره — دکمه از صفحه بیرون می‌زند */
  ctx.fillStyle = shade(fill, -.36);
  wobbleRect(b.x, b.y + dy + 7, b.w, b.h, r, b.x + b.y, 2);
  ctx.fill();
  withShadow(hot ? 22 : 14, hot ? 5 : 8, .32, () => {
    ctx.fillStyle = fill;
    wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2);
    ctx.fill();
  });
  /* حجم: روشن از بالا، تیره به پایین */
  ctx.save();
  ctx.beginPath(); wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2); ctx.clip();
  const g = ctx.createLinearGradient(0, b.y + dy, 0, b.y + dy + b.h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.45, 'rgba(255,255,255,.04)');
  g.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = g;
  ctx.fillRect(b.x, b.y + dy, b.w, b.h);
  /* برقِ باریکِ لبهٔ بالا */
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.fillRect(b.x + r, b.y + dy + 2, b.w - r * 2, 2);
  ctx.restore();
  text(label, b.x + b.w/2, b.y + b.h/2 + dy - (o.sub ? 9 : 0), {
    size: o.size || 26, color: o.color || '#fdf6e8', family: o.family || 'Lalezar',
  });
  if (o.sub) text(o.sub, b.x + b.w/2, b.y + b.h/2 + dy + 17,
    { size: 14, color: o.subColor || 'rgba(255,255,255,.88)' });
}

/** دکمهٔ گرد کوچک (مثل + و −). */
function roundButton(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 2 : 0;
  withShadow(10, hot ? 3 : 5, .3, () => {
    ctx.fillStyle = o.disabled ? '#cbbba3' : (hot ? (o.hotFill || o.fill) : o.fill);
    wobbleCircle(b.x, b.y + dy, b.r, b.x, 1.4);
    ctx.fill();
  });
  text(label, b.x, b.y + dy - 1,
    { size: o.size || 32, color: o.disabled ? '#a8988a' : (o.color || '#fdf6e8'), family: 'Lalezar' });
}

/** پرده‌ی تمام‌صفحه: برای شروعِ پرده و برای جشنِ پایان. */
function overlay(o) {
  const k = easeOut(clamp(o.t / .5, 0, 1));
  ctx.fillStyle = `rgba(30, 22, 16, ${.66 * k})`;
  ctx.fillRect(0, 0, SW, SH);

  const w = o.w || 700, h = o.h || 290;
  const x = (SW - w) / 2, y = o.y || (SH * .22);
  const s = lerp(.9, 1, easeBack(clamp(o.t / .65, 0, 1)));
  ctx.save();
  ctx.translate(SW/2, y + h/2);
  ctx.scale(s, s);
  ctx.translate(-SW/2, -(y + h/2));

  withShadow(30, 14, .42, () => {
    ctx.fillStyle = o.paper || '#fbf3e2';
    wobbleRect(x, y, w, h, 18, 121, 2.4);
    ctx.fill();
  });
  ctx.fillStyle = o.band || '#c8434f';
  wobbleRect(x, y, w, 12, 6, 123, 1);
  ctx.fill();

  if (o.icon) o.icon(SW/2, y + 56);
  text(o.title, SW/2, y + (o.icon ? 108 : 62),
    { size: o.titleSize || 36, color: o.ink || '#43291b', family: 'Lalezar', alpha: k });
  textWrap(o.body, SW/2, y + (o.icon ? 158 : 116), w - 90,
    { size: 19, color: o.inkSoft || '#8a6a52', alpha: k });
  ctx.restore();

  button(o.btn, o.btnLabel, { hot: o.btnHot, fill: o.btnFill || '#7fa356', hotFill: o.btnHotFill || '#8fb45f', size: 28 });
}

/** پیامِ کوتاهِ بالای صحنه. */
class Toast {
  constructor() { this.msg = null; this.t = 0; this.kind = 'info'; }
  say(msg, kind = 'info') { this.msg = msg; this.kind = kind; this.t = 2.6; }
  step(dt) { if (this.t > 0) { this.t -= dt; if (this.t <= 0) this.msg = null; } }
  draw(y = 24, colors = {}) {
    if (!this.msg) return;
    const k = clamp(this.t, 0, 1) * clamp((2.6 - this.t) * 5, 0, 1);
    ctx.save();
    ctx.globalAlpha = k;
    ctx.font = `700 19px "Vazirmatn", Tahoma, sans-serif`;
    const w = ctx.measureText(this.msg).width + 76;
    const fill = this.kind === 'good' ? (colors.good || '#7fa356')
               : this.kind === 'bad' ? (colors.bad || '#c8434f')
               : (colors.info || '#fbf3e2');
    paper(SW/2 - w/2, y, w, 48, fill, 151, 12, .3);
    text(this.msg, SW/2, y + 25,
      { size: 19, color: this.kind === 'info' ? (colors.ink || '#43291b') : '#fff8ec' });
    ctx.restore();
  }
}

/* ───────── آموزشِ پرده‌ای ─────────
   پرده‌هایی که منتظرِ کارِ بچه نیستند با یک ضربه جلو می‌روند. تایمر فقط
   پشتیبان است؛ بچهٔ کلاس سومی باید فرصتِ خواندن داشته باشد، نه اینکه
   متن قبل از تمام شدنِ خواندنش برود.                                    */

/** اگر پردهٔ فعلی خواندنی است، ضربه را می‌خورد و می‌رود پردهٔ بعد. */
function tutTap(tut, tapSteps, lastStep) {
  if (!tut.on || tapSteps.indexOf(tut.step) < 0) return false;
  if (tut.step >= lastStep) tut.on = false;
  else { tut.step++; tut.t = 0; }
  sfx.tap();
  return true;
}

/** نشانهٔ «برای ادامه بزن» — زیرِ کارتِ آموزش. */
function tutMore(cx, y, t, ink = '#3a2a18', bg = 'rgba(255, 250, 238, .94)') {
  ctx.save();
  ctx.globalAlpha = .62 + .38 * Math.sin(t * 3.2);
  ctx.font = '700 15px "Vazirmatn", Tahoma, sans-serif';
  const label = 'برای ادامه، هرجا را بزن';
  const w = ctx.measureText(label).width + 40, h = 32, x = cx - w / 2, r = 16;
  withShadow(10, 4, .3, () => {
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath(); ctx.fill();
  });
  text(label, cx, y + h / 2, { size: 15, color: ink });
  ctx.restore();
}

/** فونت‌ها را می‌آورد و بعد بازی را شروع می‌کند.
    مهم: هر دو راه (رسیدنِ فونت و مهلتِ پشتیبان) ممکن است برسند، ولی
    شروع فقط باید یک بار انجام شود؛ وگرنه دو حلقهٔ فریم راه می‌افتد و
    بازی دوبرابر سریع می‌شود. */
function whenFontsReady(start) {
  let done = false;
  const go = () => { if (done) return; done = true; start(); };
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('400 40px Lalezar'),
      document.fonts.load('700 20px Vazirmatn'),
      document.fonts.load('900 20px Vazirmatn'),
    ]).then(go, go);
    setTimeout(go, 2600);
  } else go();
}

/** حلقهٔ فریم با dtِ محدودشده. */
/* ───────── کیفیتِ خودکار ─────────
   اگر دستگاه کُند بود، اوّل درخشش و بعد رنگ‌بندی خاموش می‌شود تا بازی
   روان بماند. روی دستگاهِ قوی همه‌چیز روشن است. */
let QUALITY = 2;
let _fAcc = 0, _fN = 0, _qHold = 0;

function _qualityTick(gap) {
  if (gap <= 0 || gap > 200) return;
  _fAcc += gap; _fN++;
  if (_fN < 45) return;
  const avg = _fAcc / _fN;
  _fAcc = 0; _fN = 0;
  if (_qHold > 0) { _qHold--; return; }
  /* فاصلهٔ بالا و پایین باید باز باشد، وگرنه کیفیت بین دو پله بالا و
     پایین می‌پرد و بازی مدام تغییرِ ظاهر می‌دهد. */
  const before = QUALITY;
  if (avg > 21 && QUALITY > 0) { QUALITY--; _qHold = 4; }
  else if (avg < 13.5 && QUALITY < 2) { QUALITY++; _qHold = 10; }
  /* در پایین‌ترین کیفیت، صحنه را با نقطه‌های کمتر می‌کشیم */
  if (before !== QUALITY && (before === 0 || QUALITY === 0) && _refit) _refit();
}

/* یک حلقه، نه بیشتر — دو حلقه یعنی زمانِ بازی دوبرابر می‌گذرد.

   MOTION: تا پیش از این، به‌خاطرِ باگِ دو حلقه، همهٔ بازی‌ها عملاً با
   سرعتِ دو برابر اجرا می‌شدند و زمان‌بندی‌ها هم با همان حس تنظیم شده
   بودند. حالا که باگ رفع شده، سرعتِ درست (یک برابر) کُند به نظر
   می‌رسد. این ضریب جانِ حرکت‌ها را برمی‌گرداند، ولی نه تا آن دو برابرِ
   تصادفی. فقط روی جانِ حرکت اثر دارد، نه روی هیچ قانونِ علمی. */
const MOTION = 1.45;
let _looping = false;
function runLoop(step) {
  if (_looping) return;
  _looping = true;
  let last = performance.now();
  const frame = (now) => {
    const gap = now - last;
    /* بریدنِ بعد از ضرب، تا یک فریمِ کُند پرشِ بزرگ نسازد */
    const dt = Math.min(gap / 1000 * MOTION, 1/15);
    last = now;
    _qualityTick(gap);
    step(dt);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

/* ═════════════════ بازی ═════════════════ */
/* ═══════════════════════════════════════════════════════════════════════
   مزرعهٔ علی‌آقا — ریاضی سوم، فصل ۳، درس ۲ (کسر)
   ───────────────────────────────────────────────────────────────────────
   فعّالیتِ خودِ کتاب (ص ۴۶): «علی آقا کشاورز است و یک قطعه زمین دارد.
   او نیمی از زمینش را گندم کاشته است. نیمِ دیگر را دو قسمت کرده و در
   یک قسمت یونجه و در قسمتِ دیگر جو کاشته است.»

   و همان‌جا کتاب می‌گوید: «۲ قسمت از ۳ قسمتِ مساوی را با ۲/۳ نشان
   می‌دهیم و آن را دو سوم می‌خوانیم» — با نام‌های صورت، خطّ کسری، مخرج.

   ── قانونِ بازی ─────────────────────────────────────────────────
   دو کار بیشتر نیست و هر دو در خودِ زمین دیده می‌شود:

     مخرج = زمین به چند قسمتِ مساوی بریده شده
     صورت = چند قسمت از آن‌ها کاشته شده

   بازی جواب را نمی‌نویسد؛ همین‌که بچّه تعدادِ قسمت‌ها را عوض می‌کند،
   عددِ پایینِ کسر جلوی چشمش عوض می‌شود، و هر قسمتی که می‌کارد عددِ
   بالا را یکی زیاد می‌کند. سفارشِ علی‌آقا هم به حرف گفته می‌شود
   («دو سومِ زمین»)، نه با عدد.

   دو مرحلهٔ آخر همان فعّالیتِ دومِ کتاب است: نوارِ کاغذیِ فاطمه. نوار
   را باید طوری تا کرد که سرِ گیره یا پاک‌کن درست روی یک خط بیفتد —
   وگرنه هیچ کسری جواب نمی‌دهد.
   ═══════════════════════════════════════════════════════════════════════ */

const HUD_H = 56;

  sky: '#8fc2d8', skyLo: '#5f9cbc', hill: '#7fae62', hillLo: '#5f8f4a',
  soil: '#8a6038', soilLo: '#5f4224', soilDk: '#3f2c17', ridge: '#a87a4a',
  wheat: '#e0b23c', wheatDk: '#a87a1c', wheatLt: '#f2d472',
  barley: '#c98a4a', barleyDk: '#94602a', barleyLt: '#e8b478',
  clover: '#5fa84a', cloverDk: '#3a7030', cloverLt: '#8fd06a', flower: '#a86ad0',
  tape: '#f6eed8', tapeDk: '#d8ccae', tapeLine: '#8a7c58',
  wood: '#7a5636', woodDk: '#523a22',
  paper: '#fbf7ec', card: '#ffffff', line: '#c9b795',
  ink: '#26333c', inkSoft: '#6f8492',
  good: '#5e9f5e', bad: '#c0503a', gold: '#e0a63f', accent: '#4c9ec4',
  skin: '#e0b088', shirt: '#4c7fa8', hat: '#d8c088',
};

/* ───────── محصول‌ها ───────── */

const CROPS = {
  w: { n: 'گندم', c: P.wheat, d: P.wheatDk, l: P.wheatLt },
  b: { n: 'جو', c: P.barley, d: P.barleyDk, l: P.barleyLt },
  c: { n: 'یونجه', c: P.clover, d: P.cloverDk, l: P.cloverLt },
};
const CKEYS = ['w', 'b', 'c'];

const ONES = ['', 'یک', 'دو', 'سه', 'چهار', 'پنج', 'شش', 'هفت', 'هشت', 'نه', 'ده'];
const ORD = ['', '', 'دوم', 'سوم', 'چهارم', 'پنجم', 'ششم', 'هفتم', 'هشتم', 'نهم', 'دهم'];
const fracWord = (m, n) => (m === 1 && n === 2) ? 'نصف' : ONES[m] + ' ' + ORD[n];

/* ───────── مرحله‌ها ───────── */

const LV = [
  { kind: 'farm', ask: 'نصفِ زمینم را گندم بکار.', need: [['w', 1, 2]] },
  { kind: 'farm', ask: 'یک‌چهارمِ زمین را جو بکار.', need: [['b', 1, 4]] },
  { kind: 'farm', ask: 'دو سومِ زمین را یونجه بکار.', need: [['c', 2, 3]] },
  { kind: 'farm', ask: 'سه چهارمِ زمین را گندم بکار.', need: [['w', 3, 4]] },
  { kind: 'farm', ask: 'نصفِ زمین گندم، یک‌چهارمش جو، یک‌چهارمش یونجه.',
    need: [['w', 1, 2], ['b', 1, 4], ['c', 1, 4]] },
  { kind: 'farm', ask: 'پنج ششمِ زمین را یونجه بکار.', need: [['c', 5, 6]] },
  { kind: 'tape', obj: 'clip', objN: 'گیرهٔ کاغذ', m: 2, n: 3,
    ask: 'نوار را به قسمت‌های مساوی تا کن تا سرِ گیره روی یک خط بیفتد، بعد همان‌قدر را رنگ کن.' },
  { kind: 'tape', obj: 'eraser', objN: 'پاک‌کن', m: 3, n: 4,
    ask: 'حالا همین کار را برای پاک‌کن بکن.' },
];

/* ───────── جای‌ها ───────── */

const ASK = { x: 24, y: 70, w: 296, h: 156 };
const FRAC = { x: 24, y: 240, w: 296, h: 242 };
const PAL = { x: 24, y: 496, w: 296, h: 158 };
const BTN_CHECK = { x: 24, y: 668, w: 296, h: 64 };
const FIELD = { x: 344, y: 172, w: 824, h: 296 };
const TAPE = { x: 344, y: 300, w: 824, h: 116 };
const DIAL_Y = 528;
const BTN_MINUS = { x: 470, y: DIAL_Y, w: 84, h: 76 };
const BTN_PLUS = { x: 958, y: DIAL_Y, w: 84, h: 76 };
const BTN_GO = { x: SCENE_W / 2 - 150, y: 506, w: 300, h: 68 };
const BTN_AGAIN = { x: SCENE_W / 2 - 150, y: 510, w: 300, h: 68 };
const palBtn = (i) => ({ x: PAL.x + 14, y: PAL.y + 40 + i * 40, w: PAL.w - 28, h: 34 });

/* ───────── حالت ───────── */

const S = {
  phase: 'intro', phaseT: 0,
  lv: 0, parts: 2, sel: 'w', cells: [],
  score: 0, best: 0,
  ok: 0, wrong: 0,
  t: 0, hover: null, tip: '', tipT: 0, shake: 0,
  tut: { on: false, step: 0, t: 0 },
};

const bits = new Bits();
const toast = new Toast();
const cv = document.getElementById('stage');
initStage(cv, SCENE_W, SCENE_H);

function loadBest() { try { return +localStorage.getItem('kasr-best') || 0; } catch { return 0; } }
function saveBest(v) { try { localStorage.setItem('kasr-best', String(v)); } catch { /* خصوصی */ } }
S.best = loadBest();

function tip(msg) { S.tip = msg; S.tipT = 4.2; }
const L = () => LV[Math.min(S.lv, LV.length - 1)];
const isTape = () => L().kind === 'tape';
const box = () => (isTape() ? TAPE : FIELD);
const cw = () => box().w / S.parts;
const countOf = (k) => S.cells.filter((c) => c === k).length;

function setParts(n) {
  const v = clamp(n, 2, 10);
  if (v === S.parts) return;
  S.parts = v;
  S.cells = new Array(v).fill(null);
  sfx.slide();
}

function startLevel(i, keep) {
  S.lv = i;
  S.parts = 2;
  S.cells = new Array(2).fill(null);
  S.sel = isTape() ? 'w' : (L().need[0][0]);
  if (!keep) { /* امتیاز می‌ماند */ }
}

function startGame() {
  S.phase = 'play'; S.phaseT = 0;
  S.score = 0; S.ok = 0; S.wrong = 0;
  S.tut.on = true; S.tut.step = 0; S.tut.t = 0;
  startLevel(0, false);
}

/* ───────── داوری ───────── */

/** آیا کاشتِ روی زمین با سفارش می‌خواند؟ */
function judge() {
  const lv = L();
  if (lv.kind === 'tape') {
    const painted = S.cells.filter((c) => c !== null).length;
    if (painted === 0) return { ok: false, why: 'هنوز چیزی رنگ نکرده‌ای.' };
    for (let i = 0; i < S.parts; i++) {
      const should = i < painted;
      if ((S.cells[i] !== null) !== should) {
        return { ok: false, why: 'رنگ‌ها باید از سرِ نوار پشتِ سرِ هم باشند.' };
      }
    }
    if (Math.abs(painted / S.parts - lv.m / lv.n) > 1e-9) {
      return { ok: false, why: 'اندازه‌ای که رنگ کرده‌ای با طولِ ' + lv.objN + ' یکی نیست.' };
    }
    return { ok: true };
  }
  const used = {};
  for (const c of S.cells) if (c) used[c] = (used[c] || 0) + 1;
  for (const [k, m, n] of lv.need) {
    const got = used[k] || 0;
    if (Math.abs(got / S.parts - m / n) > 1e-9) {
      return { ok: false, why: 'قسمتِ ' + CROPS[k].n + ' هنوز درست نیست.' };
    }
    delete used[k];
  }
  if (Object.keys(used).length) {
    return { ok: false, why: 'چیزی کاشته‌ای که علی‌آقا نخواسته بود.' };
  }
  return { ok: true };
}

function check() {
  const r = judge();
  if (!r.ok) {
    S.wrong++;
    tip(r.why);
    S.shake = .14;
    sfx.nope();
    return;
  }
  S.ok++;
  S.score += 100;
  if (S.score > S.best) { S.best = S.score; saveBest(S.best); }
  sfx.win();
  const b = box();
  bits.confetti(b.x + b.w / 2, b.y + b.h / 2, 26, [P.gold, P.card, P.cloverLt, P.wheatLt]);
  if (S.lv >= LV.length - 1) {
    S.phase = 'won'; S.phaseT = 0;
    return;
  }
  toast.say('آفرین', 'good');
  startLevel(S.lv + 1, true);
}

/* ───────── ورودی ───────── */

const TUT_TAP = [0, 1, 2], TUT_LAST = 2;

cv.addEventListener('pointermove', (e) => {
  const p = toStage(e);
  S.hover = null;
  if (S.phase === 'intro') { if (inRect(p, BTN_GO)) S.hover = BTN_GO; }
  else if (S.phase === 'won') { if (inRect(p, BTN_AGAIN)) S.hover = BTN_AGAIN; }
  else {
    if (inRect(p, BTN_CHECK)) S.hover = { k: 'check' };
    if (inRect(p, BTN_MINUS)) S.hover = { k: 'minus' };
    if (inRect(p, BTN_PLUS)) S.hover = { k: 'plus' };
    if (!isTape()) for (let i = 0; i < 3; i++) if (inRect(p, palBtn(i))) S.hover = { k: 'pal', i };
    const b = box();
    if (inRect(p, b)) S.hover = { k: 'cell', i: clamp(Math.floor((p.x - b.x) / cw()), 0, S.parts - 1) };
  }
  cv.style.cursor = S.hover ? 'pointer' : 'default';
});

cv.addEventListener('pointerdown', (e) => {
  const p = toStage(e);
  if (S.phase === 'intro') { if (inRect(p, BTN_GO)) { startGame(); sfx.good(); } return; }
  if (S.phase === 'won') {
    if (inRect(p, BTN_AGAIN)) { S.phase = 'intro'; S.phaseT = 0; sfx.tap(); }
    return;
  }
  if (S.tut.on && tutTap(S.tut, TUT_TAP, TUT_LAST)) return;
  if (inRect(p, BTN_MINUS)) { setParts(S.parts - 1); return; }
  if (inRect(p, BTN_PLUS)) { setParts(S.parts + 1); return; }
  if (inRect(p, BTN_CHECK)) { check(); return; }
  if (!isTape()) {
    for (let i = 0; i < 3; i++) {
      if (!inRect(p, palBtn(i))) continue;
      S.sel = CKEYS[i]; sfx.tick(); return;
    }
  }
  const b = box();
  if (inRect(p, b)) {
    const i = clamp(Math.floor((p.x - b.x) / cw()), 0, S.parts - 1);
    const want = isTape() ? 'w' : S.sel;
    S.cells[i] = S.cells[i] === want ? null : want;
    sfx.tap();
    bits.spark(b.x + (i + .5) * cw(), b.y + b.h / 2, 5, [CROPS[want].l, P.card]);
  }
});

/* ───────── حلقه ───────── */

function step(dt) {
  S.t += dt;
  if (S.phaseT < 9) S.phaseT += dt;
  if (S.tipT > 0) S.tipT -= dt;
  if (S.shake > 0) S.shake = Math.max(0, S.shake - dt);
  if (S.tut.on) S.tut.t += dt;
  bits.step(dt);
  toast.step(dt);
  draw();
}

whenFontsReady(() => { startLevel(0, false); runLoop(step); });

/* ───────── ابزارِ نقاشی ───────── */

function rrPath(x, y, w, h, r) {
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function numText(str, x, y, o = {}) {
  ctx.save();
  ctx.direction = 'ltr';
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = o.color || P.ink;
  ctx.font = `${o.weight || 700} ${o.size || 18}px "${o.family || 'Vazirmatn'}", Tahoma, sans-serif`;
  ctx.fillText(str, x, y);
  ctx.restore();
}

function spot(shapes, alpha) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, SCENE_W, SCENE_H);
  for (const s of shapes) {
    if (s.r) { ctx.moveTo(s.x + s.r, s.y); ctx.arc(s.x, s.y, s.r, 0, TAU, true); }
    else { ctx.moveTo(s.x, s.y); ctx.lineTo(s.x, s.y + s.h); ctx.lineTo(s.x + s.w, s.y + s.h); ctx.lineTo(s.x + s.w, s.y); ctx.closePath(); }
  }
  ctx.fillStyle = `rgba(10, 22, 30, ${alpha})`;
  ctx.fill('evenodd');
  ctx.restore();
}

function tutCard(x, y, w, lines, title) {
  const h = 26 + (title ? 44 : 0) + lines.length * 30;
  withShadow(24, 10, .5, () => {
    ctx.fillStyle = 'rgba(255, 253, 246, .97)';
    wobbleRect(x, y, w, h + 20, 16, 101, 2.2); ctx.fill();
  }, '6, 24, 32');
  ctx.fillStyle = P.gold;
  wobbleRect(x, y, w, 9, 4, 103, 1); ctx.fill();
  let yy = y + 34;
  if (title) { text(title, x + w / 2, yy + 6, { size: 25, family: 'Lalezar', color: P.ink }); yy += 44; }
  for (const l of lines) { text(l, x + w / 2, yy, { size: 18, color: P.inkSoft }); yy += 30; }
  return h + 20;
}

/* ───────── منظره ───────── */

function paintScene() {
  const g = ctx.createLinearGradient(0, HUD_H, 0, 470);
  g.addColorStop(0, P.skyLo); g.addColorStop(1, P.sky);
  ctx.fillStyle = g;
  ctx.fillRect(0, HUD_H, SCENE_W, 470 - HUD_H);
  ctx.fillStyle = 'rgba(255, 244, 200, .85)';
  ctx.beginPath(); ctx.arc(1110, 116, 34, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255, 250, 220, .28)';
  ctx.beginPath(); ctx.arc(1110, 116, 62, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.6)';
  for (const c of [[430, 122, 56], [520, 104, 38], [820, 136, 46]]) {
    ctx.beginPath(); ctx.ellipse(c[0], c[1], c[2], c[2] * .5, 0, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = P.hillLo;
  ctx.beginPath();
  ctx.moveTo(0, 470);
  for (let x = 0; x <= SCENE_W; x += 20) ctx.lineTo(x, 396 + Math.sin(x * .006) * 26);
  ctx.lineTo(SCENE_W, 470); ctx.fill();
  ctx.fillStyle = P.hill;
  ctx.beginPath();
  ctx.moveTo(0, 470);
  for (let x = 0; x <= SCENE_W; x += 20) ctx.lineTo(x, 432 + Math.sin(x * .009 + 2) * 16);
  ctx.lineTo(SCENE_W, 470); ctx.fill();
  const sg = ctx.createLinearGradient(0, 470, 0, SCENE_H);
  sg.addColorStop(0, P.hill); sg.addColorStop(1, '#4f7f3f');
  ctx.fillStyle = sg;
  ctx.fillRect(0, 470, SCENE_W, SCENE_H - 470);
  ctx.strokeStyle = '#3f6f34'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (let i = 0; i < 60; i++) {
    const x = noise1(i * 3.7) * SCENE_W, y = 500 + noise1(i * 5.1) * 240;
    ctx.beginPath(); ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + 5, y - 12, x + (i % 2 ? 11 : -11), y - 22);
    ctx.stroke();
  }
}

function drawFarmer(x, y) {
  ctx.save();
  ctx.translate(x, y);
  const bob = Math.sin(S.t * 1.6) * 2;
  ctx.fillStyle = 'rgba(20, 40, 16, .25)';
  ctx.beginPath(); ctx.ellipse(0, 4, 34, 8, 0, 0, TAU); ctx.fill();
  /* پاها */
  ctx.strokeStyle = '#4a5a68'; ctx.lineWidth = 11; ctx.lineCap = 'round';
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(s * 9, -34); ctx.lineTo(s * 12, -2); ctx.stroke();
  }
  /* تن */
  ctx.fillStyle = P.shirt;
  ctx.beginPath();
  ctx.moveTo(-20, -36 + bob);
  ctx.quadraticCurveTo(-24, -84 + bob, 0, -88 + bob);
  ctx.quadraticCurveTo(24, -84 + bob, 20, -36 + bob);
  ctx.closePath(); ctx.fill();
  /* دست‌ها */
  ctx.strokeStyle = P.shirt; ctx.lineWidth = 10;
  ctx.beginPath(); ctx.moveTo(-16, -76 + bob); ctx.lineTo(-34, -48 + bob); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(16, -76 + bob); ctx.lineTo(36, -60 + bob); ctx.stroke();
  ctx.fillStyle = P.skin;
  ctx.beginPath(); ctx.arc(-34, -46 + bob, 6, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(36, -58 + bob, 6, 0, TAU); ctx.fill();
  /* بیل */
  ctx.strokeStyle = P.wood; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(38, -70 + bob); ctx.lineTo(48, 4); ctx.stroke();
  ctx.fillStyle = '#9aa7ae';
  ctx.beginPath();
  ctx.moveTo(40, 0); ctx.lineTo(58, 0); ctx.lineTo(54, 22); ctx.lineTo(44, 22);
  ctx.closePath(); ctx.fill();
  /* سر */
  ctx.fillStyle = P.skin;
  ctx.beginPath(); ctx.arc(0, -104 + bob, 19, 0, TAU); ctx.fill();
  ctx.fillStyle = '#3a2a1c';
  ctx.beginPath(); ctx.arc(-7, -108 + bob, 2.6, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(7, -108 + bob, 2.6, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#3a2a1c'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, -100 + bob, 7, .3, 2.8); ctx.stroke();
  /* کلاه */
  ctx.fillStyle = P.hat;
  ctx.beginPath(); ctx.ellipse(0, -118 + bob, 34, 9, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, -128 + bob, 17, 14, 0, Math.PI, TAU); ctx.fill();
  ctx.restore();
}

/* ───────── زمین ───────── */

function cropArt(k, x, y, w, h, seed) {
  const C = CROPS[k];
  if (k === 'c') {
    for (let i = 0; i < Math.max(10, w / 9); i++) {
      const px = x + 8 + noise1(seed + i * 2.3) * (w - 16);
      const py = y + 22 + noise1(seed + i * 5.1) * (h - 44);
      ctx.strokeStyle = C.d; ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.moveTo(px, py + 16); ctx.lineTo(px, py); ctx.stroke();
      ctx.fillStyle = i % 3 ? C.c : C.l;
      for (let f = 0; f < 3; f++) {
        const a = -Math.PI / 2 + (f - 1) * .9;
        ctx.beginPath();
        ctx.ellipse(px + Math.cos(a) * 7, py + Math.sin(a) * 6, 6, 4.4, a, 0, TAU);
        ctx.fill();
      }
      if (i % 4 === 0) {
        ctx.fillStyle = P.flower;
        ctx.beginPath(); ctx.arc(px, py - 8, 3.4, 0, TAU); ctx.fill();
      }
    }
    return;
  }
  const awn = k === 'b';
  const rows = Math.max(1, Math.round(h / 78));
  const N = Math.max(6, Math.floor(w / 15));
  for (let i = 0; i < N * rows; i++) {
    const r = Math.floor(i / N);
    const px = x + 7 + noise1(seed + i * 2.7) * (w - 14);
    const base = y + h - 12 - r * (h - 34) / rows;
    const hh = 34 + noise1(seed + i * 4.1) * 20;
    const sw = Math.sin(S.t * 1.4 + i + seed) * 4;
    ctx.strokeStyle = C.d; ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.moveTo(px, base);
    ctx.quadraticCurveTo(px + sw * .4, base - hh * .6, px + sw, base - hh);
    ctx.stroke();
    /* خوشه */
    ctx.fillStyle = C.c;
    for (let g = 0; g < 5; g++) {
      const t = g / 5;
      ctx.beginPath();
      ctx.ellipse(px + sw * (1 - t * .3), base - hh + 4 + g * 5, 4.4, 3.2, .2, 0, TAU);
      ctx.fill();
    }
    ctx.fillStyle = C.l;
    ctx.beginPath(); ctx.ellipse(px + sw, base - hh + 2, 3.4, 2.6, 0, 0, TAU); ctx.fill();
    if (awn) {
      ctx.strokeStyle = C.l; ctx.lineWidth = 1.4;
      for (let a2 = -1; a2 <= 1; a2++) {
        ctx.beginPath();
        ctx.moveTo(px + sw, base - hh + 2);
        ctx.lineTo(px + sw + a2 * 7, base - hh - 14);
        ctx.stroke();
      }
    }
  }
}

function drawField() {
  const b = FIELD;
  withShadow(18, 9, .32, () => {
    ctx.fillStyle = P.soilLo;
    ctx.beginPath(); rrPath(b.x - 10, b.y - 10, b.w + 20, b.h + 20, 14); ctx.fill();
  }, '10, 30, 40');
  const g = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
  g.addColorStop(0, P.soil); g.addColorStop(1, P.soilDk);
  ctx.fillStyle = g;
  ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 10); ctx.fill();
  ctx.save();
  ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 10); ctx.clip();
  /* شیار خاک */
  ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.lineWidth = 3;
  for (let i = 0; i < 18; i++) {
    ctx.beginPath();
    ctx.moveTo(b.x, b.y + 12 + i * 17); ctx.lineTo(b.x + b.w, b.y + 12 + i * 17); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(60, 40, 18, .3)';
  for (let i = 0; i < 90; i++) {
    ctx.beginPath();
    ctx.ellipse(b.x + noise1(i * 2.1) * b.w, b.y + noise1(i * 5.3) * b.h, 5, 3, 0, 0, TAU);
    ctx.fill();
  }
  /* هر قسمت */
  const w = cw();
  for (let i = 0; i < S.parts; i++) {
    const x = b.x + i * w;
    const k = S.cells[i];
    if (k) {
      ctx.fillStyle = shade(CROPS[k].d, -.45);
      ctx.fillRect(x, b.y, w, b.h);
      cropArt(k, x, b.y, w, b.h, i * 7 + 3);
    }
    const hot = S.hover && S.hover.k === 'cell' && S.hover.i === i;
    if (hot && !S.tut.on) {
      ctx.fillStyle = 'rgba(255, 244, 200, .14)';
      ctx.fillRect(x, b.y, w, b.h);
    }
  }
  ctx.restore();
  /* مرزِ قسمت‌ها */
  ctx.strokeStyle = P.ridge; ctx.lineWidth = 5;
  for (let i = 1; i < S.parts; i++) {
    const x = b.x + i * cw();
    ctx.beginPath(); ctx.moveTo(x, b.y); ctx.lineTo(x, b.y + b.h); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 2;
  for (let i = 1; i < S.parts; i++) {
    const x = b.x + i * cw();
    ctx.beginPath(); ctx.moveTo(x - 2, b.y); ctx.lineTo(x - 2, b.y + b.h); ctx.stroke();
  }
  ctx.strokeStyle = P.woodDk; ctx.lineWidth = 5;
  ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 10); ctx.stroke();
  /* شمارهٔ هر قسمت */
  for (let i = 0; i < S.parts; i++) {
    const x = b.x + (i + .5) * cw();
    ctx.fillStyle = 'rgba(20, 30, 36, .5)';
    ctx.beginPath(); ctx.arc(x, b.y + b.h + 22, 15, 0, TAU); ctx.fill();
    numText(fa(i + 1), x, b.y + b.h + 22, { size: 15, color: P.card });
  }
}

function drawTapeScene() {
  const b = TAPE;
  const lv = L();
  /* میزِ چوبی */
  ctx.fillStyle = P.woodDk;
  ctx.beginPath(); rrPath(b.x - 40, b.y - 130, b.w + 80, 330, 16); ctx.fill();
  ctx.fillStyle = P.wood;
  ctx.beginPath(); rrPath(b.x - 34, b.y - 124, b.w + 68, 318, 12); ctx.fill();
  ctx.strokeStyle = 'rgba(60, 40, 20, .3)'; ctx.lineWidth = 3;
  for (let i = 0; i < 8; i++) {
    ctx.beginPath();
    ctx.moveTo(b.x - 30, b.y - 110 + i * 38); ctx.lineTo(b.x + b.w + 30, b.y - 110 + i * 38);
    ctx.stroke();
  }
  /* شیء بالای نوار */
  const objW = b.w * lv.m / lv.n;
  const oy = b.y - 56;
  if (lv.obj === 'clip') {
    ctx.strokeStyle = '#b9c2c8'; ctx.lineWidth = 9; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(b.x + 14, oy + 22);
    ctx.lineTo(b.x + objW - 26, oy + 22);
    ctx.quadraticCurveTo(b.x + objW - 2, oy + 22, b.x + objW - 2, oy + 6);
    ctx.quadraticCurveTo(b.x + objW - 2, oy - 10, b.x + objW - 30, oy - 10);
    ctx.lineTo(b.x + 30, oy - 10);
    ctx.quadraticCurveTo(b.x + 8, oy - 10, b.x + 8, oy + 4);
    ctx.stroke();
    ctx.strokeStyle = '#e2e8ec'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(b.x + 18, oy + 19); ctx.lineTo(b.x + objW - 30, oy + 19);
    ctx.stroke();
  } else {
    ctx.fillStyle = '#e88fa4';
    withShadow(10, 5, .3, () => {
      ctx.beginPath(); rrPath(b.x + 4, oy - 16, objW - 8, 44, 8); ctx.fill();
    }, '20, 10, 10');
    ctx.fillStyle = '#f7b8c6';
    ctx.beginPath(); rrPath(b.x + 4, oy - 16, objW - 8, 16, 8); ctx.fill();
    ctx.fillStyle = '#5f7fa8';
    ctx.beginPath(); rrPath(b.x + 4, oy + 14, objW - 8, 14, 6); ctx.fill();
  }
  /* خطّ‌چینِ سرِ شیء */
  ctx.save();
  ctx.setLineDash([8, 7]);
  ctx.strokeStyle = 'rgba(255, 250, 220, .8)'; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(b.x + objW, oy - 20); ctx.lineTo(b.x + objW, b.y + b.h + 18);
  ctx.stroke();
  ctx.restore();
  text(lv.objN, b.x + objW / 2, oy - 34, { size: 18, family: 'Lalezar', color: '#f4e8c8' });
  /* نوارِ کاغذی */
  withShadow(14, 7, .3, () => {
    ctx.fillStyle = P.tape;
    ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 8); ctx.fill();
  }, '20, 12, 4');
  ctx.save();
  ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 8); ctx.clip();
  ctx.globalAlpha = .5;
  ctx.fillStyle = texPaper(P.tape);
  ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.globalAlpha = 1;
  const w = cw();
  for (let i = 0; i < S.parts; i++) {
    if (!S.cells[i]) continue;
    ctx.fillStyle = 'rgba(224, 178, 60, .55)';
    ctx.fillRect(b.x + i * w, b.y, w, b.h);
  }
  const hot = S.hover && S.hover.k === 'cell';
  if (hot && !S.tut.on) {
    ctx.fillStyle = 'rgba(76, 158, 196, .18)';
    ctx.fillRect(b.x + S.hover.i * w, b.y, w, b.h);
  }
  ctx.restore();
  /* خطِ تاها */
  ctx.strokeStyle = P.tapeLine; ctx.lineWidth = 3;
  for (let i = 1; i < S.parts; i++) {
    const x = b.x + i * w;
    ctx.beginPath(); ctx.moveTo(x, b.y); ctx.lineTo(x, b.y + b.h); ctx.stroke();
  }
  ctx.strokeStyle = P.tapeDk; ctx.lineWidth = 3;
  ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 8); ctx.stroke();
  for (let i = 0; i < S.parts; i++) {
    numText(fa(i + 1), b.x + (i + .5) * w, b.y + b.h + 20, { size: 15, color: '#f4e8c8' });
  }
}

/* ───────── کارتِ کسر ───────── */

function drawFracCard() {
  paper(FRAC.x, FRAC.y, FRAC.w, FRAC.h, P.paper, 41, 14, .34);
  const cxx = FRAC.x + FRAC.w / 2;
  const k = isTape() ? 'w' : S.sel;
  const m = countOf(k), n = S.parts;
  text('کسرِ ' + (isTape() ? 'رنگ‌شده' : CROPS[k].n), cxx, FRAC.y + 30,
    { size: 19, family: 'Lalezar', color: P.ink });
  /* صورت */
  numText(fa(m), cxx, FRAC.y + 82, { size: 52, family: 'Lalezar', color: P.ink });
  /* خطّ کسری */
  ctx.strokeStyle = P.ink; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cxx - 46, FRAC.y + 118); ctx.lineTo(cxx + 46, FRAC.y + 118);
  ctx.stroke();
  /* مخرج */
  numText(fa(n), cxx, FRAC.y + 154, { size: 52, family: 'Lalezar', color: P.ink });
  /* نام‌ها */
  ctx.strokeStyle = P.inkSoft; ctx.lineWidth = 1.8;
  ctx.setLineDash([5, 4]);
  ctx.beginPath(); ctx.moveTo(cxx + 34, FRAC.y + 82); ctx.lineTo(cxx + 74, FRAC.y + 74); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cxx + 50, FRAC.y + 118); ctx.lineTo(cxx + 74, FRAC.y + 114); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cxx + 34, FRAC.y + 154); ctx.lineTo(cxx + 74, FRAC.y + 158); ctx.stroke();
  ctx.setLineDash([]);
  text('صورت', cxx + 108, FRAC.y + 72, { size: 14, color: P.inkSoft });
  text('خطّ کسری', cxx + 118, FRAC.y + 113, { size: 14, color: P.inkSoft });
  text('مخرج', cxx + 106, FRAC.y + 158, { size: 14, color: P.inkSoft });
  /* خواندن */
  ctx.fillStyle = 'rgba(76, 158, 196, .16)';
  ctx.beginPath(); rrPath(FRAC.x + 18, FRAC.y + FRAC.h - 54, FRAC.w - 36, 40, 10); ctx.fill();
  text(m > 0 && m <= 10 && n <= 10 ? fracWord(m, n) + (isTape() ? 'ِ نوار' : 'ِ زمین') : '—',
    cxx, FRAC.y + FRAC.h - 34, { size: 20, family: 'Lalezar', color: P.ink });
}

function drawAsk() {
  paper(ASK.x, ASK.y, ASK.w, ASK.h, P.card, 51, 14, .34);
  ctx.fillStyle = 'rgba(224, 166, 63, .22)';
  ctx.beginPath(); rrPath(ASK.x, ASK.y, ASK.w, 30, 8); ctx.fill();
  text(isTape() ? 'نوارِ کاغذیِ فاطمه' : 'سفارشِ علی‌آقا', ASK.x + ASK.w / 2, ASK.y + 16,
    { size: 17, family: 'Lalezar', color: P.ink });
  textWrap(L().ask, ASK.x + ASK.w / 2, ASK.y + 62, ASK.w - 34,
    { size: 17, color: P.ink, lineHeight: 27 });
}

function drawPalette() {
  if (isTape()) {
    paper(PAL.x, PAL.y, PAL.w, PAL.h, P.card, 61, 14, .34);
    text('رنگِ مداد', PAL.x + PAL.w / 2, PAL.y + 30, { size: 18, family: 'Lalezar', color: P.ink });
    textWrap('روی هر قسمت بزن تا رنگ شود.', PAL.x + PAL.w / 2, PAL.y + 68, PAL.w - 40,
      { size: 15, color: P.inkSoft, lineHeight: 24 });
    ctx.fillStyle = 'rgba(224, 178, 60, .55)';
    ctx.beginPath(); rrPath(PAL.x + 40, PAL.y + 100, PAL.w - 80, 34, 8); ctx.fill();
    ctx.strokeStyle = P.tapeLine; ctx.lineWidth = 2;
    ctx.beginPath(); rrPath(PAL.x + 40, PAL.y + 100, PAL.w - 80, 34, 8); ctx.stroke();
    return;
  }
  paper(PAL.x, PAL.y, PAL.w, PAL.h, P.card, 61, 14, .34);
  text('چه بکارم؟', PAL.x + PAL.w / 2, PAL.y + 24, { size: 18, family: 'Lalezar', color: P.ink });
  for (let i = 0; i < 3; i++) {
    const k = CKEYS[i], b = palBtn(i), on = S.sel === k;
    const hot = S.hover && S.hover.k === 'pal' && S.hover.i === i;
    ctx.fillStyle = on ? CROPS[k].c : (hot ? 'rgba(0,0,0,.08)' : 'rgba(0,0,0,.04)');
    ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 9); ctx.fill();
    ctx.strokeStyle = on ? CROPS[k].d : 'rgba(110, 132, 146, .4)';
    ctx.lineWidth = on ? 3 : 2;
    ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 9); ctx.stroke();
    ctx.save();
    ctx.beginPath(); rrPath(b.x + 6, b.y + 4, 46, b.h - 8, 6); ctx.clip();
    ctx.fillStyle = shade(CROPS[k].d, -.3);
    ctx.fillRect(b.x + 6, b.y + 4, 46, b.h - 8);
    cropArt(k, b.x + 6, b.y - 16, 46, b.h + 12, i * 3 + 1);
    ctx.restore();
    text(CROPS[k].n, b.x + b.w - 16, b.y + b.h / 2,
      { size: 17, color: on ? '#3a2a10' : P.ink, align: 'right' });
    const cnt = countOf(k);
    if (cnt) numText(fa(cnt), b.x + 74, b.y + b.h / 2, { size: 16, color: on ? '#3a2a10' : P.inkSoft });
  }
}

function drawDial() {
  const cxx = (BTN_MINUS.x + BTN_PLUS.x + BTN_PLUS.w) / 2;
  text(isTape() ? 'نوار را به چند قسمتِ مساوی تا کنیم؟' : 'زمین را به چند قسمتِ مساوی تقسیم کنیم؟',
    cxx, DIAL_Y - 22, { size: 19, family: 'Lalezar', color: '#eaf4f8' });
  button(BTN_MINUS, '−', {
    hot: S.hover && S.hover.k === 'minus', disabled: S.parts <= 2,
    fill: '#4a6a7a', hotFill: '#5d8496', size: 40, family: 'Lalezar',
  });
  button(BTN_PLUS, '+', {
    hot: S.hover && S.hover.k === 'plus', disabled: S.parts >= 10,
    fill: '#4a6a7a', hotFill: '#5d8496', size: 40, family: 'Lalezar',
  });
  ctx.fillStyle = 'rgba(255,255,255,.12)';
  ctx.beginPath(); rrPath(BTN_MINUS.x + 104, DIAL_Y, 380, 76, 14); ctx.fill();
  numText(fa(S.parts), cxx, DIAL_Y + 38, { size: 44, family: 'Lalezar', color: P.gold });
  text('قسمت', cxx + 86, DIAL_Y + 40, { size: 20, color: '#dceaf0' });
}

/* ───────── سردر و پرده‌ها ───────── */

function drawHUD() {
  ctx.fillStyle = 'rgba(14, 26, 34, .86)';
  ctx.fillRect(0, 0, SCENE_W, HUD_H);
  ctx.fillStyle = 'rgba(224, 166, 63, .28)';
  ctx.fillRect(0, HUD_H - 2, SCENE_W, 2);
  text('مزرعهٔ علی‌آقا', SCENE_W - 116, HUD_H / 2, { size: 25, family: 'Lalezar', color: P.paper });
  for (let k = 0; k < LV.length; k++) {
    const x = 470 + k * 34;
    ctx.fillStyle = k < S.lv ? P.good : k === S.lv ? P.gold : 'rgba(255,255,255,.18)';
    ctx.beginPath(); ctx.arc(x, HUD_H / 2, k === S.lv ? 9 : 6, 0, TAU); ctx.fill();
  }
  numText(fa(S.score), 120, HUD_H / 2, { size: 22, color: P.gold });
  text('امتیاز', 190, HUD_H / 2, { size: 16, color: 'rgba(255,255,255,.7)' });
  numText(fa(S.best), 268, HUD_H / 2, { size: 18, color: 'rgba(255,255,255,.6)' });
  text('بهترین', 340, HUD_H / 2, { size: 14, color: 'rgba(255,255,255,.45)' });
}

function drawTutorial() {
  const b = box();
  if (S.tut.step === 0) {
    spot([{ x: ASK.x - 6, y: ASK.y - 6, w: ASK.w + 12, h: ASK.h + 12 }], .7);
    const h = tutCard(420, 250, 560,
      ['علی‌آقا هر بار یک سفارش می‌دهد،', 'با حرف — نه با عدد.'], 'مزرعهٔ علی‌آقا');
    tutMore(700, 250 + h + 8, S.t, P.ink);
  } else if (S.tut.step === 1) {
    spot([{ x: BTN_MINUS.x - 10, y: DIAL_Y - 44, w: BTN_PLUS.x + BTN_PLUS.w - BTN_MINUS.x + 20, h: 130 }], .68);
    const h = tutCard(360, 180, 600,
      ['با − و + زمین را به قسمت‌های مساوی تقسیم کن.', 'همین عدد، مخرجِ کسر است.']);
    tutMore(660, 180 + h + 8, S.t, P.ink);
  } else {
    spot([{ x: b.x - 8, y: b.y - 8, w: b.w + 16, h: b.h + 16 },
      { x: FRAC.x - 6, y: FRAC.y - 6, w: FRAC.w + 12, h: FRAC.h + 12 }], .66);
    const h = tutCard(360, 596, 600,
      ['روی هر قسمت بزن تا کاشته شود؛ صورتِ کسر یکی زیاد می‌شود.', 'آخرش دکمهٔ «به علی‌آقا نشان بده» را بزن.']);
    tutMore(660, 596 - 78, S.t, P.ink);
  }
}

function fracIcon(x, y) {
  ctx.save();
  ctx.translate(x, y);
  numText('۲', 0, -18, { size: 30, family: 'Lalezar', color: P.ink });
  ctx.strokeStyle = P.ink; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-18, 2); ctx.lineTo(18, 2); ctx.stroke();
  numText('۳', 0, 22, { size: 30, family: 'Lalezar', color: P.ink });
  ctx.restore();
}

function drawIntro() {
  overlay({
    t: S.phaseT, w: 900, h: 342, y: 130,
    paper: P.paper, band: P.gold, ink: P.ink, inkSoft: P.inkSoft,
    icon: fracIcon,
    title: 'مزرعهٔ علی‌آقا',
    body: 'علی‌آقا زمینش را به قسمت‌های مساوی تقسیم می‌کند و در بعضی از آن‌ها\nمی‌کارد. تو باید همان‌قدری را بکاری که او می‌خواهد.\nپایینِ کسر یعنی زمین چند قسمت شده، بالایش یعنی چند قسمت کاشته‌ای.',
    btn: BTN_GO, btnLabel: 'شروع', btnHot: S.hover === BTN_GO,
    btnFill: '#a5763a', btnHotFill: '#c08d47',
  });
}

function drawWon() {
  overlay({
    t: S.phaseT, w: 920, h: 340, y: 134,
    paper: P.paper, band: P.good, ink: P.ink, inkSoft: P.inkSoft,
    icon: fracIcon,
    title: 'همهٔ سفارش‌ها انجام شد',
    body: 'دیدی که یک کسر دو خبر می‌دهد: مخرج می‌گوید به چند قسمتِ مساوی\nتقسیم شده و صورت می‌گوید چندتای آن‌ها را برداشته‌ای —\nچه زمینِ علی‌آقا باشد، چه نوارِ کاغذیِ فاطمه.',
    btn: BTN_AGAIN, btnLabel: 'از نو', btnHot: S.hover === BTN_AGAIN,
    btnFill: '#a5763a', btnHotFill: '#c08d47',
  });
}

/* ───────── قاب ───────── */

function draw() {
  beginScene(P.sky);
  ctx.save();
  if (S.shake > 0) ctx.translate(Math.sin(S.t * 55) * S.shake * 10, 0);
  paintScene();
  if (isTape()) drawTapeScene(); else { drawField(); drawFarmer(1108, 700); }
  drawDial();
  drawAsk();
  drawFracCard();
  drawPalette();
  button(BTN_CHECK, 'به علی‌آقا نشان بده', {
    hot: S.hover && S.hover.k === 'check', fill: '#4f8f4a', hotFill: '#63a55c', size: 21,
  });
  bits.draw();
  ctx.restore();
  drawHUD();
  if (!(S.phase === 'play' && S.tut.on)) toast.draw(HUD_H + 10, { good: P.good, bad: P.bad, info: P.card, ink: P.ink });
  if (S.phase === 'play' && S.tut.on) drawTutorial();
  if (S.phase === 'intro') drawIntro();
  if (S.phase === 'won') drawWon();
  if (S.tipT > 0) {
    ctx.save();
    ctx.globalAlpha = clamp(S.tipT, 0, 1);
    const w = 640;
    paper(FIELD.x + FIELD.w / 2 - w / 2, SCENE_H - 48, w, 40, P.card, 91, 12, .3);
    text(S.tip, FIELD.x + FIELD.w / 2, SCENE_H - 28, { size: 17, color: P.ink });
    ctx.restore();
  }
  endScene(.1, 'rgba(10, 30, 40, .34)', .22, .12);
}
