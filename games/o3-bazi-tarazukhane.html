<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2a2018">
<title>ترازوخانهٔ بازار — اندازه‌گیری مواد (بازی)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>
  /* صفحه نباید هیچ‌جا اسکرول یا زوم شود؛ بازی باید مثل یک برنامه رفتار کند. */
  html, body {
    margin: 0; padding: 0; background: #2a2018;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body {
    position: fixed; inset: 0;          /* جلوی کشیده‌شدنِ صفحه در سافاریِ گوشی */
    width: 100%; height: 100vh; height: 100dvh;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none; -webkit-touch-callout: none;
  }

  /* گوشیِ عمودی صحنه را ریز می‌کند؛ بچه باید گوشی را بچرخاند. */
  #rotate { display: none; }
  @media (orientation: portrait) and (max-width: 860px) {
    #stage { display: none; }
    #rotate {
      display: flex; position: fixed; inset: 0;
      z-index: 9;
      flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      background: #2a2018; color: #f6ead2;
      font: 700 20px "Vazirmatn", Tahoma, sans-serif; text-align: center; padding: 32px;
    }
    #rotate svg { animation: tilt 2.4s ease-in-out infinite; }
    @keyframes tilt { 0%, 45% { transform: rotate(0deg); } 65%, 100% { transform: rotate(-90deg); } }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="rotate">
  <svg width="86" height="126" viewBox="0 0 86 126" fill="none" aria-hidden="true">
    <rect x="3" y="3" width="80" height="120" rx="12" stroke="#e8b448" stroke-width="5"/>
    <rect x="15" y="19" width="56" height="88" rx="5" fill="#e8b448" opacity=".28"/>
    <circle cx="43" cy="115" r="4" fill="#e8b448"/>
  </svg>
  <div>گوشی را بچرخان</div>
  <div style="font-weight:400;opacity:.7;font-size:16px">این بازی خوابیده بازی می‌شود</div>
</div>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   هستهٔ مشترکِ بازی‌ها — سبک «کاغذبُری»
   ───────────────────────────────────────────────────────────────────────
   این فایل جعبه‌ابزار است، نه چارچوب: هر بازی حلقه و وضعیت خودش را دارد
   و فقط از این توابع برای کشیدن استفاده می‌کند. دلیلش این است که هر بازی
   باید حس‌وحال خودش را داشته باشد، نه اینکه همه شبیه هم دربیایند.

   قاعده‌های ثابتِ تصویری:
   • نور همیشه از بالا-چپ می‌تابد، پس سایه‌ها به پایین-راست می‌افتند.
   • هیچ لبه‌ای کاملاً صاف نیست؛ همه کمی موج دارند (انگار با قیچی بریده).
   • هیچ خاکستریِ خالصی نداریم؛ همه‌ی خنثی‌ها به گرمیِ صحنه می‌زنند.
   • یک لایه‌ی دانه‌دانه‌ی کاغذ روی کلِ تصویر ضرب می‌شود.
   ═══════════════════════════════════════════════════════════════════════ */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const FA_D = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
const fa = (n) => String(n).replace(/\d/g, (d) => FA_D[+d]);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeIn = (t) => t * t * t;
const easeInOut = (t) => (t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2);
const easeBack = (t) => 1 + 2.7 * Math.pow(t-1, 3) + 1.7 * Math.pow(t-1, 2);
const easeElastic = (t) => t === 0 || t === 1 ? t : Math.pow(2, -9*t) * Math.sin((t*10 - .75) * 2.094) + 1;

/** تصادفِ تکرارپذیر: با یک بذر همیشه همان عدد. برای اینکه تزئین‌ها هر فریم نپرند. */
function noise1(x) {
  const s = Math.sin(x * 127.1) * 43758.5453;
  return s - Math.floor(s);
}
const pick = (arr, seed) => arr[Math.floor(noise1(seed) * arr.length) % arr.length];

/* ───────── بوم و صحنهٔ ثابت ───────── */

let ctx, SW, SH, CV, _refit = null;
let view = { scale: 1, ox: 0, oy: 0, w: 0, h: 0, dpr: 1 };
let _grain = null, _grainDark = null;

function initStage(canvas, w, h) {
  CV = canvas; SW = w; SH = h;
  ctx = canvas.getContext('2d');

  /* اندازه را از خودِ بوم می‌گیریم نه از innerHeight؛ چون در سافاریِ گوشی
     نوارِ آدرس باز و بسته می‌شود و innerHeight دروغ می‌گوید. */
  const fit = () => {
    const r = canvas.getBoundingClientRect();
    const vw = Math.round(r.width), vh = Math.round(r.height);
    if (vw < 20 || vh < 20) return;
    const dpr = Math.min(devicePixelRatio || 1, QUALITY > 0 ? 2 : 1);
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    const scale = Math.min(vw / SW, vh / SH);
    view = { scale, ox: (vw - SW*scale)/2, oy: (vh - SH*scale)/2, w: vw, h: vh, dpr };
    _grain = buildGrain();
  };
  _refit = fit;
  addEventListener('resize', fit);
  /* چرخاندنِ گوشی: اندازهٔ درست چند لحظه بعد می‌رسد، پس چندبار اندازه می‌گیریم. */
  addEventListener('orientationchange', () => {
    fit(); setTimeout(fit, 140); setTimeout(fit, 460);
  });
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(canvas);

  /* صدا در گوشی فقط بعد از اوّلین لمس اجازهٔ پخش دارد. */
  const unlock = () => { sfx._c(); removeEventListener('pointerdown', unlock); removeEventListener('touchstart', unlock); };
  addEventListener('pointerdown', unlock, { passive: true });
  addEventListener('touchstart', unlock, { passive: true });
  /* نگه‌داشتنِ انگشت نباید منوی مرورگر را باز کند. */
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  fit();
  return ctx;
}

/** قابِ صحنه را باز می‌کند: بعد از این، مختصات همیشه در فضای SW×SH است. */
function beginScene(bg) {
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, view.w, view.h);
  ctx.save();
  ctx.translate(view.ox, view.oy);
  ctx.scale(view.scale, view.scale);
  ctx.beginPath();
  ctx.rect(0, 0, SW, SH);
  ctx.clip();
}

/* ───────── پوششِ پایانِ قاب ─────────
   دانه‌های کاغذ و تیرگیِ گوشه‌ها هر دو ثابت‌اند و تغییر نمی‌کنند، ولی
   قبلاً هر فریم از نو کشیده می‌شدند: یکی با «multiply» روی کلِّ صفحه و
   یکی با یک گرادیانِ شعاعیِ تازه. اندازه‌گیری نشان داد همین دو تا
   ۱۱ تا ۱۶ میلی‌ثانیه از هر فریم را می‌خوردند — بیشتر از کشیدنِ خودِ
   صحنه. حالا یک بار در یک بومِ جدا پخته می‌شوند و هر فریم فقط یک
   drawImage است.                                                       */

let _ovl = null, _ovlKey = '';

function overlayLayer(grainAlpha, vignette) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const w = Math.max(2, Math.round(SW * q)), h = Math.max(2, Math.round(SH * q));
  const key = w + 'x' + h + '|' + grainAlpha + '|' + vignette;
  if (_ovl && _ovlKey === key) return _ovl;
  let c;
  try {
    c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g2 = c.getContext('2d');
    if (!g2) return null;
    if (_grainDark && grainAlpha > 0) {
      /* همان دانه‌ها، ولی به‌جای multiply به شکلِ سیاهِ کم‌رنگ */
      g2.globalAlpha = clamp(grainAlpha * 1.15, 0, 1);
      g2.fillStyle = g2.createPattern(_grainDark, 'repeat');
      g2.fillRect(0, 0, w, h);
      g2.globalAlpha = 1;
    }
    if (vignette) {
      const g = g2.createRadialGradient(w / 2, h / 2, h * .42, w / 2, h / 2, h * 1.05);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, vignette);
      g2.fillStyle = g;
      g2.fillRect(0, 0, w, h);
    }
  } catch (e) { return null; }
  _ovl = c; _ovlKey = key;
  return c;
}

/** بافتِ کاغذ، تیرگیِ گوشه‌ها، رنگ‌بندی و درخششِ نور را می‌گذارد و قاب را می‌بندد. */
function endScene(grainAlpha = .15, vignette = 'rgba(48,28,14,.30)', bloom = .34, grade = .14) {
  /* درخششِ نور خاموش است. اندازه‌گیری نشان داد هر فریم ۲۱ میلی‌ثانیه
     می‌گیرد — بیشتر از تمامِ کارهای دیگرِ یک فریم روی هم — چون برای
     ساختنش باید کلِّ بوم دوباره خوانده شود. از آن بدتر: متنِ فارسی را
     مه‌آلود می‌کرد و خواندنش را سخت‌تر. بی‌آن، صحنه تمیزتر است. */
  bloom = 0;
  if (QUALITY < 1) { grade = 0; grainAlpha *= .5; }
  if (QUALITY < 2) grade = 0;
  if (grade > 0) {
    /* رنگ‌بندیِ نرم: بالای صحنه گرم‌تر، پایین سردتر — عمق می‌دهد */
    const g = ctx.createLinearGradient(0, 0, 0, SH);
    g.addColorStop(0, `rgba(255, 214, 150, ${grade})`);
    g.addColorStop(.55, 'rgba(255, 255, 255, 0)');
    g.addColorStop(1, `rgba(40, 60, 110, ${grade * .9})`);
    ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalCompositeOperation = 'source-over';
  }
  const ov = (grainAlpha > 0 || vignette) ? overlayLayer(grainAlpha, vignette) : null;
  if (ov) ctx.drawImage(ov, 0, 0, SW, SH);
  ctx.restore();
  bloomPass(bloom);
}

/* ───────── درخششِ نور (bloom) ─────────
   قابِ رسم‌شده را کوچک می‌کنیم، دو بار در خودش ضرب می‌کنیم تا فقط
   روشن‌ها بمانند، محوش می‌کنیم و با حالتِ «lighter» رویش می‌گذاریم.
   نتیجه: چراغ‌ها، شعله‌ها و رنگ‌های روشن نور پخش می‌کنند. */
let _bl, _blc, _bl2, _bl2c, _blNo = false, _blTick = 0;

function bloomPass(amount) {
  if (!amount || _blNo || !CV.width) return;
  /* کوچک‌کردن و بزرگ‌کردنِ دوباره، خودش محو می‌کند — از filter خیلی ارزان‌تر است */
  const W = Math.max(4, Math.round(CV.width * .2)), H = Math.max(4, Math.round(CV.height * .2));
  const W2 = Math.max(2, Math.round(W * .28)), H2 = Math.max(2, Math.round(H * .28));
  try {
    if (!_bl) {
      _bl = document.createElement('canvas'); _blc = _bl.getContext('2d');
      _bl2 = document.createElement('canvas'); _bl2c = _bl2.getContext('2d');
      if (!_blc || !_bl2c) { _blNo = true; return; }
    }
    if (_bl.width !== W || _bl.height !== H) { _bl.width = W; _bl.height = H; }
    if (_bl2.width !== W2 || _bl2.height !== H2) { _bl2.width = W2; _bl2.height = H2; }
    /* ساختنِ نور یک قاب در میان کافی است؛ گذاشتنش هر قاب. */
    _blTick = (_blTick + 1) & 1;
    if (!_blTick) {
      _blc.globalCompositeOperation = 'source-over';
      _blc.clearRect(0, 0, W, H);
      _blc.drawImage(CV, 0, 0, W, H);
      _blc.globalCompositeOperation = 'multiply';
      _blc.drawImage(_bl, 0, 0);
      _blc.drawImage(_bl, 0, 0);
      _blc.globalCompositeOperation = 'source-over';
      _bl2c.clearRect(0, 0, W2, H2);
      _bl2c.drawImage(_bl, 0, 0, W2, H2);
    }

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = amount;
    ctx.drawImage(_bl2, 0, 0, CV.width, CV.height);
    ctx.restore();
  } catch (e) { _blNo = true; }
}

/* ───────── لایهٔ ثابت ─────────
   هرچه در صحنه تکان نمی‌خورد را یک‌بار می‌کشیم و بعد فقط کپی می‌کنیم. */
const _layers = {};
function staticLayer(key, w, h, paint) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const L = _layers[key];
  if (L && L.q === q && L.w === w && L.h === h) return L.cv;
  const off = document.createElement('canvas');
  off.width = Math.max(1, Math.round(w * q));
  off.height = Math.max(1, Math.round(h * q));
  const c = off.getContext('2d');
  c.setTransform(q, 0, 0, q, 0, 0);
  const prev = ctx;
  ctx = c;
  try { paint(); } finally { ctx = prev; }
  _layers[key] = { cv: off, q, w, h };
  return off;
}

/* ───────── نورپردازی و بافت ─────────
   کارِ این‌ها این است که هیچ سطحی «تختِ یک‌رنگ» نماند. */

/** شیبِ عمودی: بالا روشن، پایین تیره. */
function vgrad(y0, y1, top, bot) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, top); g.addColorStop(1, bot);
  return g;
}

/** حجمِ کروی: نور از بالا-چپ، سایه در پایین-راست. */
function ball(cx, cy, r, lit, base, dark) {
  const g = ctx.createRadialGradient(cx - r * .38, cy - r * .42, r * .06, cx, cy, r * 1.06);
  g.addColorStop(0, lit); g.addColorStop(.45, base); g.addColorStop(1, dark);
  return g;
}

/** لبهٔ روشنِ بالا-چپِ یک مسیر — همان «rim light». */
function rim(pathFn, col, w = 2.2) {
  ctx.save();
  ctx.beginPath(); pathFn();
  ctx.clip();
  ctx.beginPath(); pathFn();
  ctx.strokeStyle = col; ctx.lineWidth = w * 2; ctx.lineJoin = 'round';
  ctx.translate(-w * .5, -w * .6);
  ctx.stroke();
  ctx.restore();
}

/** سایهٔ چسبیده به زمین — چیزها را روی سطح می‌نشاند. */
function contact(cx, cy, rx, ry, alpha = .26) {
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
  g.addColorStop(0, `rgba(20, 12, 6, ${alpha})`);
  g.addColorStop(1, 'rgba(20, 12, 6, 0)');
  ctx.save();
  ctx.fillStyle = g;
  ctx.translate(cx, cy); ctx.scale(1, ry / Math.max(rx, ry));
  ctx.beginPath(); ctx.arc(0, 0, Math.max(rx, ry), 0, TAU); ctx.fill();
  ctx.restore();
}

const _tex = {};
/** بافتِ تکرارشونده؛ یک‌بار ساخته و بعد از حافظه خوانده می‌شود. */
function texture(key, w, h, paint) {
  if (_tex[key]) return _tex[key];
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const c = off.getContext('2d');
  paint(c, w, h);
  _tex[key] = ctx.createPattern(off, 'repeat');
  return _tex[key];
}

/** رگهٔ چوب. */
function texWood(base, grain) {
  return texture('w' + base + grain, 120, 120, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = grain; c.lineWidth = 1.4;
    for (let i = 0; i < 9; i++) {
      c.globalAlpha = .18 + noise1(i * 3.1) * .3;
      c.beginPath();
      const y0 = i * 14 + noise1(i) * 6;
      c.moveTo(0, y0);
      for (let x = 0; x <= w; x += 10) c.lineTo(x, y0 + Math.sin(x * .09 + i) * 2.6);
      c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** تارِ پارچه. */
function texCloth(base, thread) {
  return texture('c' + base + thread, 16, 16, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = thread; c.lineWidth = 1; c.globalAlpha = .5;
    for (let i = 0; i < w; i += 4) {
      c.beginPath(); c.moveTo(i, 0); c.lineTo(i, h); c.stroke();
      c.beginPath(); c.moveTo(0, i); c.lineTo(w, i); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** دانه‌های سنگ. */
function texStone(base, spec) {
  return texture('s' + base + spec, 90, 90, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) {
      c.globalAlpha = .05 + noise1(i * 1.7) * .16;
      c.fillStyle = spec;
      const r = .6 + noise1(i * 5.3) * 1.9;
      c.beginPath();
      c.arc(noise1(i * 2.1) * w, noise1(i * 3.7 + 1) * h, r, 0, TAU);
      c.fill();
    }
    c.globalAlpha = 1;
  });
}

/** الیافِ کاغذ. */
function texPaper(base) {
  return texture('p' + base, 100, 100, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 130; i++) {
      c.globalAlpha = .04 + noise1(i * 2.3) * .07;
      c.strokeStyle = i % 2 ? '#ffffff' : '#5a4326';
      c.lineWidth = .9;
      const x = noise1(i * 1.3) * w, y = noise1(i * 4.1 + 2) * h;
      const a = noise1(i * 7.7) * TAU, l = 4 + noise1(i * 9.1) * 12;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

function buildGrain() {
  const s = 260;
  const off = document.createElement('canvas');
  off.width = off.height = s;
  const c = off.getContext('2d');
  const img = c.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    const v = 214 + Math.random() * 41;
    img.data[i*4] = v; img.data[i*4+1] = v; img.data[i*4+2] = v; img.data[i*4+3] = 255;
  }
  c.putImageData(img, 0, 0);
  /* همان دانه‌ها به شکلِ سیاهِ کم‌رنگ، تا بشود بدونِ multiply گذاشتشان */
  const d = document.createElement('canvas');
  d.width = d.height = s;
  const dc = d.getContext('2d');
  const dimg = dc.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    dimg.data[i*4] = 0; dimg.data[i*4+1] = 0; dimg.data[i*4+2] = 0;
    dimg.data[i*4+3] = 255 - img.data[i*4];
  }
  dc.putImageData(dimg, 0, 0);
  _grainDark = d;
  _ovl = null; _ovlKey = '';
  return ctx.createPattern(off, 'repeat');
}

function toStage(e) {
  const r = CV.getBoundingClientRect();
  return {
    x: (e.clientX - r.left - view.ox) / view.scale,
    y: (e.clientY - r.top - view.oy) / view.scale,
  };
}

const inRect = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
const inCircle = (p, b, pad = 0) => Math.hypot(p.x - b.x, p.y - b.y) <= b.r + pad;

/* ───────── قلم‌های کاغذبُری ───────── */

/** دایره‌ای که انگار با قیچی بریده شده. */
function wobbleCircle(cx, cy, r, seed = 0, amp = 2.2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const rr = r + Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp * .45;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** بیضیِ ناصاف — برای چیزهایی که گرد نیستند ولی نرم‌اند. */
function wobbleEllipse(cx, cy, rx, ry, rot = 0, seed = 0, amp = 2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const w = 1 + (Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp*.45) / Math.max(rx, ry);
    const px = Math.cos(a) * rx * w, py = Math.sin(a) * ry * w;
    const x = cx + px*Math.cos(rot) - py*Math.sin(rot);
    const y = cy + px*Math.sin(rot) + py*Math.cos(rot);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** مستطیلِ گِرد با گوشه‌های کمی کج. */
function wobbleRect(x, y, w, h, r = 12, seed = 0, amp = 1.6) {
  const j = (k) => (noise1(seed*9.7 + k) - .5) * amp * 2;
  ctx.beginPath();
  ctx.moveTo(x + r + j(1), y + j(2));
  ctx.lineTo(x + w - r + j(3), y + j(4));
  ctx.quadraticCurveTo(x + w + j(5), y + j(6), x + w + j(7), y + r + j(8));
  ctx.lineTo(x + w + j(9), y + h - r + j(10));
  ctx.quadraticCurveTo(x + w + j(11), y + h + j(12), x + w - r + j(13), y + h + j(14));
  ctx.lineTo(x + r + j(15), y + h + j(16));
  ctx.quadraticCurveTo(x + j(17), y + h + j(18), x + j(19), y + h - r + j(20));
  ctx.lineTo(x + j(21), y + r + j(22));
  ctx.quadraticCurveTo(x + j(23), y + j(24), x + r + j(1), y + j(2));
  ctx.closePath();
}

/** سایهٔ نرم؛ نور از بالا-چپ. */
function withShadow(blur, dy, alpha, fn, hue = '78, 46, 24') {
  ctx.save();
  ctx.shadowColor = `rgba(${hue}, ${alpha})`;
  ctx.shadowBlur = blur;
  ctx.shadowOffsetY = dy;
  ctx.shadowOffsetX = dy * .35;
  fn();
  ctx.restore();
}

/** یک برگه‌ی کاغذ با سایه — پایه‌ی همه‌ی کارت‌ها و تابلوها. */
function paper(x, y, w, h, fill, seed = 1, r = 12, shadow = .26) {
  withShadow(16, 7, shadow, () => {
    ctx.fillStyle = fill;
    wobbleRect(x, y, w, h, r, seed, 2);
    ctx.fill();
  });
  /* الیافِ کاغذ و لبهٔ روشن، تا سطح تخت نماند */
  ctx.save();
  ctx.beginPath(); wobbleRect(x, y, w, h, r, seed, 2); ctx.clip();
  ctx.globalAlpha = .5;
  ctx.fillStyle = texPaper(fill);
  ctx.fillRect(x, y, w, h);
  ctx.globalAlpha = 1;
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.4, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(90,60,20,.1)');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
}

function text(str, x, y, o = {}) {
  const size = o.size || 20;
  const fam = o.family || 'Vazirmatn';
  ctx.save();
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.font = `${fam === 'Lalezar' ? '400' : (o.weight || 700)} ${size}px "${fam}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.baseline || 'middle';
  ctx.fillStyle = o.color || '#43291b';
  ctx.direction = 'rtl';
  if (o.stroke) {
    ctx.lineWidth = o.strokeWidth || 5;
    ctx.strokeStyle = o.stroke;
    ctx.lineJoin = 'round';
    ctx.strokeText(str, x, y, o.maxWidth);
  }
  ctx.fillText(str, x, y, o.maxWidth);
  ctx.restore();
}

/** متنِ چندخطی که خودش می‌شکند. ارتفاعِ اشغال‌شده را برمی‌گرداند. */
function textWrap(str, x, y, maxW, o = {}) {
  const size = o.size || 19, lh = o.lineHeight || size * 1.7;
  ctx.font = `${o.weight || 700} ${size}px "${o.family || 'Vazirmatn'}", Tahoma, sans-serif`;
  const lines = [];
  for (const para of str.split('\n')) {
    let line = '';
    for (const wd of para.split(' ')) {
      const t = line ? line + ' ' + wd : wd;
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = wd; }
      else line = t;
    }
    lines.push(line);
  }
  lines.forEach((l, i) => text(l, x, y + i * lh, o));
  return lines.length * lh;
}

/* ───────── ذره‌ها ───────── */

class Bits {
  constructor() { this.list = []; }
  add(x, y, n, kind, colors, opts = {}) {
    for (let i = 0; i < n; i++) {
      const a = opts.dir !== undefined ? opts.dir + (Math.random()-.5) * (opts.spread || 1) : Math.random() * TAU;
      const sp = (opts.speed || 200) * (.4 + Math.random());
      this.list.push({
        kind, x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - (opts.lift || 0),
        r: (opts.size || 4) * (.5 + Math.random()),
        rot: Math.random() * TAU, vr: (Math.random()-.5) * 10,
        col: colors[(Math.random() * colors.length) | 0],
        grav: opts.grav === undefined ? 620 : opts.grav,
        drag: opts.drag || .995,
        life: (opts.life || .9) * (.6 + Math.random() * .8), age: 0,
      });
    }
  }
  confetti(x, y, n, colors) {
    this.add(x, y, n, 'flake', colors, { speed: 420, lift: 190, size: 5, life: 1.6, grav: 780 });
  }
  spark(x, y, n, colors) {
    this.add(x, y, n, 'dot', colors, { speed: 180, lift: 30, size: 3.4, life: .7, grav: 260, drag: .93 });
  }
  step(dt) {
    for (const p of this.list) {
      p.age += dt;
      p.vy += p.grav * dt;
      p.vx *= p.drag; p.vy *= p.drag;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    }
    this.list = this.list.filter((p) => p.age < p.life);
  }
  draw() {
    for (const p of this.list) {
      const k = clamp(1 - p.age / p.life, 0, 1);
      ctx.save();
      ctx.globalAlpha = k;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.col;
      if (p.kind === 'flake') ctx.fillRect(-p.r, -p.r*1.5, p.r*2, p.r*3);
      else if (p.kind === 'leaf') { wobbleEllipse(0, 0, p.r*1.8, p.r*.8, 0, p.r, .6); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(0, 0, p.r * k, 0, TAU); ctx.fill(); }
      ctx.restore();
    }
  }
  clear() { this.list.length = 0; }
}

/* ───────── صدا (بدون فایل صوتی) ───────── */

const sfx = {
  ac: null, on: true,
  _c() {
    if (!this.on) return null;
    if (!this.ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; this.ac = new A(); }
    if (this.ac.state === 'suspended') this.ac.resume();
    return this.ac;
  },
  tone(f, dur = .16, type = 'sine', gain = .13, delay = 0) {
    const c = this._c(); if (!c) return;
    const t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(t0 + dur + .04);
  },
  tap()  { this.tone(430, .07, 'triangle', .09); },
  place(){ this.tone(620, .11, 'sine', .12); },
  pop()  { this.tone(760, .09, 'sine', .11); },
  slide(){ this.tone(240, .22, 'sine', .07); },
  good() { [523, 659, 784].forEach((f,i) => this.tone(f, .22, 'sine', .13, i*.07)); },
  win()  { [523, 659, 784, 1047].forEach((f,i) => this.tone(f, .34, 'triangle', .13, i*.10)); },
  nope() { this.tone(180, .2, 'sawtooth', .07); },
  tick() { this.tone(1100, .04, 'square', .05); },
};

/* ───────── قطعه‌های آماده ───────── */

function star(x, y, r, col, rot = 0) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = col;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI/2 + i * Math.PI/5;
    const rr = i % 2 ? r * .45 : r;
    const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/** دکمهٔ کاغذی. hovered را خودِ بازی می‌دهد؛ اینجا فقط کشیده می‌شود. */
/** رنگ را روشن‌تر (k>0) یا تیره‌تر (k<0) می‌کند. */
function shade(col, k) {
  const c = String(col).trim();
  let r, g2, b2;
  if (c[0] === '#') {
    const h = c.length === 4 ? c[1]+c[1]+c[2]+c[2]+c[3]+c[3] : c.slice(1, 7);
    r = parseInt(h.slice(0,2), 16); g2 = parseInt(h.slice(2,4), 16); b2 = parseInt(h.slice(4,6), 16);
  } else {
    const m = c.match(/[\d.]+/g);
    if (!m || m.length < 3) return col;
    r = +m[0]; g2 = +m[1]; b2 = +m[2];
  }
  const f = (v) => Math.round(clamp(k < 0 ? v * (1 + k) : v + (255 - v) * k, 0, 255));
  return 'rgb(' + f(r) + ',' + f(g2) + ',' + f(b2) + ')';
}

function button(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 3 : 0;
  const fill = o.disabled ? (o.off || '#bcaa92') : (hot ? (o.hotFill || o.fill) : o.fill);
  const r = o.r === undefined ? 14 : o.r;
  /* لبهٔ زیرینِ تیره — دکمه از صفحه بیرون می‌زند */
  ctx.fillStyle = shade(fill, -.36);
  wobbleRect(b.x, b.y + dy + 7, b.w, b.h, r, b.x + b.y, 2);
  ctx.fill();
  withShadow(hot ? 22 : 14, hot ? 5 : 8, .32, () => {
    ctx.fillStyle = fill;
    wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2);
    ctx.fill();
  });
  /* حجم: روشن از بالا، تیره به پایین */
  ctx.save();
  ctx.beginPath(); wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2); ctx.clip();
  const g = ctx.createLinearGradient(0, b.y + dy, 0, b.y + dy + b.h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.45, 'rgba(255,255,255,.04)');
  g.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = g;
  ctx.fillRect(b.x, b.y + dy, b.w, b.h);
  /* برقِ باریکِ لبهٔ بالا */
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.fillRect(b.x + r, b.y + dy + 2, b.w - r * 2, 2);
  ctx.restore();
  text(label, b.x + b.w/2, b.y + b.h/2 + dy - (o.sub ? 9 : 0), {
    size: o.size || 26, color: o.color || '#fdf6e8', family: o.family || 'Lalezar',
  });
  if (o.sub) text(o.sub, b.x + b.w/2, b.y + b.h/2 + dy + 17,
    { size: 14, color: o.subColor || 'rgba(255,255,255,.88)' });
}

/** دکمهٔ گرد کوچک (مثل + و −). */
function roundButton(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 2 : 0;
  withShadow(10, hot ? 3 : 5, .3, () => {
    ctx.fillStyle = o.disabled ? '#cbbba3' : (hot ? (o.hotFill || o.fill) : o.fill);
    wobbleCircle(b.x, b.y + dy, b.r, b.x, 1.4);
    ctx.fill();
  });
  text(label, b.x, b.y + dy - 1,
    { size: o.size || 32, color: o.disabled ? '#a8988a' : (o.color || '#fdf6e8'), family: 'Lalezar' });
}

/** پرده‌ی تمام‌صفحه: برای شروعِ پرده و برای جشنِ پایان. */
function overlay(o) {
  const k = easeOut(clamp(o.t / .5, 0, 1));
  ctx.fillStyle = `rgba(30, 22, 16, ${.66 * k})`;
  ctx.fillRect(0, 0, SW, SH);

  const w = o.w || 700, h = o.h || 290;
  const x = (SW - w) / 2, y = o.y || (SH * .22);
  const s = lerp(.9, 1, easeBack(clamp(o.t / .65, 0, 1)));
  ctx.save();
  ctx.translate(SW/2, y + h/2);
  ctx.scale(s, s);
  ctx.translate(-SW/2, -(y + h/2));

  withShadow(30, 14, .42, () => {
    ctx.fillStyle = o.paper || '#fbf3e2';
    wobbleRect(x, y, w, h, 18, 121, 2.4);
    ctx.fill();
  });
  ctx.fillStyle = o.band || '#c8434f';
  wobbleRect(x, y, w, 12, 6, 123, 1);
  ctx.fill();

  if (o.icon) o.icon(SW/2, y + 56);
  text(o.title, SW/2, y + (o.icon ? 108 : 62),
    { size: o.titleSize || 36, color: o.ink || '#43291b', family: 'Lalezar', alpha: k });
  textWrap(o.body, SW/2, y + (o.icon ? 158 : 116), w - 90,
    { size: 19, color: o.inkSoft || '#8a6a52', alpha: k });
  ctx.restore();

  button(o.btn, o.btnLabel, { hot: o.btnHot, fill: o.btnFill || '#7fa356', hotFill: o.btnHotFill || '#8fb45f', size: 28 });
}

/** پیامِ کوتاهِ بالای صحنه. */
class Toast {
  constructor() { this.msg = null; this.t = 0; this.kind = 'info'; }
  say(msg, kind = 'info') { this.msg = msg; this.kind = kind; this.t = 2.6; }
  step(dt) { if (this.t > 0) { this.t -= dt; if (this.t <= 0) this.msg = null; } }
  draw(y = 24, colors = {}) {
    if (!this.msg) return;
    const k = clamp(this.t, 0, 1) * clamp((2.6 - this.t) * 5, 0, 1);
    ctx.save();
    ctx.globalAlpha = k;
    ctx.font = `700 19px "Vazirmatn", Tahoma, sans-serif`;
    const w = ctx.measureText(this.msg).width + 76;
    const fill = this.kind === 'good' ? (colors.good || '#7fa356')
               : this.kind === 'bad' ? (colors.bad || '#c8434f')
               : (colors.info || '#fbf3e2');
    paper(SW/2 - w/2, y, w, 48, fill, 151, 12, .3);
    text(this.msg, SW/2, y + 25,
      { size: 19, color: this.kind === 'info' ? (colors.ink || '#43291b') : '#fff8ec' });
    ctx.restore();
  }
}

/* ───────── آموزشِ پرده‌ای ─────────
   پرده‌هایی که منتظرِ کارِ بچه نیستند با یک ضربه جلو می‌روند. تایمر فقط
   پشتیبان است؛ بچهٔ کلاس سومی باید فرصتِ خواندن داشته باشد، نه اینکه
   متن قبل از تمام شدنِ خواندنش برود.                                    */

/** اگر پردهٔ فعلی خواندنی است، ضربه را می‌خورد و می‌رود پردهٔ بعد. */
function tutTap(tut, tapSteps, lastStep) {
  if (!tut.on || tapSteps.indexOf(tut.step) < 0) return false;
  if (tut.step >= lastStep) tut.on = false;
  else { tut.step++; tut.t = 0; }
  sfx.tap();
  return true;
}

/** نشانهٔ «برای ادامه بزن» — زیرِ کارتِ آموزش. */
function tutMore(cx, y, t, ink = '#3a2a18', bg = 'rgba(255, 250, 238, .94)') {
  ctx.save();
  ctx.globalAlpha = .62 + .38 * Math.sin(t * 3.2);
  ctx.font = '700 15px "Vazirmatn", Tahoma, sans-serif';
  const label = 'برای ادامه، هرجا را بزن';
  const w = ctx.measureText(label).width + 40, h = 32, x = cx - w / 2, r = 16;
  withShadow(10, 4, .3, () => {
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath(); ctx.fill();
  });
  text(label, cx, y + h / 2, { size: 15, color: ink });
  ctx.restore();
}

/** فونت‌ها را می‌آورد و بعد بازی را شروع می‌کند.
    مهم: هر دو راه (رسیدنِ فونت و مهلتِ پشتیبان) ممکن است برسند، ولی
    شروع فقط باید یک بار انجام شود؛ وگرنه دو حلقهٔ فریم راه می‌افتد و
    بازی دوبرابر سریع می‌شود. */
function whenFontsReady(start) {
  let done = false;
  const go = () => { if (done) return; done = true; start(); };
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('400 40px Lalezar'),
      document.fonts.load('700 20px Vazirmatn'),
      document.fonts.load('900 20px Vazirmatn'),
    ]).then(go, go);
    setTimeout(go, 2600);
  } else go();
}

/** حلقهٔ فریم با dtِ محدودشده. */
/* ───────── کیفیتِ خودکار ─────────
   اگر دستگاه کُند بود، اوّل درخشش و بعد رنگ‌بندی خاموش می‌شود تا بازی
   روان بماند. روی دستگاهِ قوی همه‌چیز روشن است. */
let QUALITY = 2;
let _fAcc = 0, _fN = 0, _qHold = 0;

function _qualityTick(gap) {
  if (gap <= 0 || gap > 200) return;
  _fAcc += gap; _fN++;
  if (_fN < 45) return;
  const avg = _fAcc / _fN;
  _fAcc = 0; _fN = 0;
  if (_qHold > 0) { _qHold--; return; }
  /* فاصلهٔ بالا و پایین باید باز باشد، وگرنه کیفیت بین دو پله بالا و
     پایین می‌پرد و بازی مدام تغییرِ ظاهر می‌دهد. */
  const before = QUALITY;
  if (avg > 21 && QUALITY > 0) { QUALITY--; _qHold = 4; }
  else if (avg < 13.5 && QUALITY < 2) { QUALITY++; _qHold = 10; }
  /* در پایین‌ترین کیفیت، صحنه را با نقطه‌های کمتر می‌کشیم */
  if (before !== QUALITY && (before === 0 || QUALITY === 0) && _refit) _refit();
}

/* یک حلقه، نه بیشتر — دو حلقه یعنی زمانِ بازی دوبرابر می‌گذرد.

   MOTION: تا پیش از این، به‌خاطرِ باگِ دو حلقه، همهٔ بازی‌ها عملاً با
   سرعتِ دو برابر اجرا می‌شدند و زمان‌بندی‌ها هم با همان حس تنظیم شده
   بودند. حالا که باگ رفع شده، سرعتِ درست (یک برابر) کُند به نظر
   می‌رسد. این ضریب جانِ حرکت‌ها را برمی‌گرداند، ولی نه تا آن دو برابرِ
   تصادفی. فقط روی جانِ حرکت اثر دارد، نه روی هیچ قانونِ علمی. */
const MOTION = 1.45;
let _looping = false;
function runLoop(step) {
  if (_looping) return;
  _looping = true;
  let last = performance.now();
  const frame = (now) => {
    const gap = now - last;
    /* بریدنِ بعد از ضرب، تا یک فریمِ کُند پرشِ بزرگ نسازد */
    const dt = Math.min(gap / 1000 * MOTION, 1/15);
    last = now;
    _qualityTick(gap);
    step(dt);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

/* ═════════════════ بازی ═════════════════ */
/* ═══════════════════════════════════════════════════════════════════════
   ترازوخانهٔ بازار — علومِ سوم، درس ۳ «اندازه‌گیری مواد»  (بازی)

   درسِ کتاب: با چشم و دست نمی‌شود فهمید کدام سنگین‌تر است؛ ترازو لازم
   است. بعد: جرمِ پاک‌کن برابرِ چند گیرهٔ کاغذ است؟ و مهم‌ترین پرسشِ
   کتاب: «اگر از گیره‌های دیگری استفاده کنیم، نتیجه تغییر می‌کند؟»
   و سرانجام: یکای مشترک — گرم و کیلوگرم.

   بازی همان است، ولی هیچ پرسشی پرسیده نمی‌شود:
   ▸ ترازوی دوکفّه‌ای واقعی است: زاویهٔ شاهین با اختلافِ جرم کم و زیاد
     می‌شود و در برابری صاف می‌ایستد. پس بچّه با چشمِ خودش می‌بیند کدام
     طرف سنگین‌تر است، نه اینکه به او بگویند.
   ▸ روی هر دو کفّه می‌شود وزنه گذاشت — همان‌طور که با ترازوی واقعی
     می‌شود. آزادیِ کامل، و هیچ حرکتی برگشت‌ناپذیر نیست.
   ▸ مرحلهٔ دوم دو جورِ مهره دارد: مهرهٔ بزرگ و مهرهٔ کوچک. یک جسمِ
     ثابت با مهرهٔ بزرگ می‌شود ۴ تا و با مهرهٔ کوچک ۱۰ تا؛ هر دو در
     دفتر کنارِ هم می‌نشینند. بچّه خودش می‌بیند که عددِ بی‌یکا بی‌معنی
     است — بی‌آنکه جمله‌ای نوشته شود.
   ▸ از مرحلهٔ سوم وزنه‌های گرمی می‌آیند و کارِ اصلی پیدا کردنِ ترکیبِ
     درستِ وزنه‌هاست؛ چالشِ واقعی همین است، نه پاسخ دادن به سؤال.

   جرمِ هر جسم طوری انتخاب می‌شود که با وزنه‌های همان قفسه دقیقاً
   ساختنی باشد (با جست‌وجوی زیرمجموعه بررسی می‌شود)، پس هیچ دوری
   بن‌بست نیست — ولی ترکیبِ درست هیچ‌جا نشان داده نمی‌شود.
   ═══════════════════════════════════════════════════════════════════════ */

const L = () => LEVELS[Math.min(S.level, LEVELS.length - 1)];
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

/* ───────── ساختِ دور ─────────
   جرمِ جسم باید با وزنه‌های همین قفسه دقیقاً ساختنی باشد.            */

/** آیا با این وزنه‌ها می‌شود دقیقاً g گرم ساخت؟ */
function reachable(defs, g) {
  const cap = defs.reduce((a, d) => a + d.g * d.count, 0);
  if (g > cap || g <= 0) return false;
  const ok = new Uint8Array(cap + 1);
  ok[0] = 1;
  for (const d of defs) {
    for (let c = 0; c < d.count; c++) {
      for (let v = cap; v >= d.g; v--) if (ok[v - d.g]) ok[v] = 1;
    }
  }
  return !!ok[g];
}

function shelfDefs(lv) {
  const defs = SHELVES[lv.shelf];
  if (!lv.twin) return defs;
  /* در مرحلهٔ دو فقط یک جور مهره در دسترس است — همان که این دور می‌خواهیم */
  return [defs[S.useBead]];
}

function newRound() {
  const lv = L();
  if (lv.twin) {
    /* یک دور با مهرهٔ بزرگ، دورِ بعد با کوچک، روی همان جسم */
    if (S.note.length && S.note[S.note.length - 1].pending) {
      S.useBead = 1;
      S.thing = S.note[S.note.length - 1].thing;
      S.mass = S.note[S.note.length - 1].mass;
    } else {
      S.useBead = 0;
      S.thing = R(0, THINGS.length - 1);
      const k = R(1, 4);
      S.mass = k * 40;      /* هم بر ۲۰ بخش‌پذیر است هم بر ۸ */
    }
  } else {
    S.thing = R(0, THINGS.length - 1);
    const defs = SHELVES[lv.shelf];
    for (let i = 0; i < 500; i++) {
      const steps = Math.floor((lv.hi - lv.lo) / lv.step);
      const g = lv.lo + R(0, steps) * lv.step;
      if (reachable(defs, g)) { S.mass = g; break; }
      if (i === 499) S.mass = lv.lo;
    }
  }
  S.shelf = shelfDefs(lv).map((def) => ({ def, left: def.count }));
  S.pan = [[], []];
  S.onLeft = true;
  S.ang = 0; S.angV = 0;
  S.winT = 0;
  S.carry = null;
}

function startLevel(i, keep) {
  S.level = i;
  S.phase = 'play'; S.phaseT = 0;
  S.cleared = 0;
  if (!keep) { S.score = 0; S.note = []; }
  S.useBead = 0;
  S.tut.on = i === 0 && !keep; S.tut.step = 0; S.tut.t = 0;
  newRound();
}

/* ───────── فیزیکِ ترازو ─────────
   شاهین حولِ تکیه‌گاه می‌چرخد. هرچه اختلافِ جرم بیشتر، شیب بیشتر —
   ولی بی‌نهایت نمی‌شود؛ شاهین به ته می‌خورد. برابری یعنی صاف.       */

const MAX_ANG = .26;
function panMass(i) {
  let m = 0;
  for (const w of S.pan[i]) m += w.def.g;
  if ((i === 0) === S.onLeft) m += S.mass;
  return m;
}
const diffMass = () => panMass(0) - panMass(1);
/** پاسخِ شاهین: یکنواخت، اشباع‌شونده، و در صفر دقیقاً صاف.
    منفی است چون کفّهٔ سنگین‌تر باید پایین برود، نه بالا. */
function targetAng() {
  const d = diffMass();
  const scale = Math.max(24, S.mass * .28);
  return -MAX_ANG * Math.tanh(d / scale);
}
const isLevelNow = () => diffMass() === 0 && (S.pan[0].length + S.pan[1].length) > 0;

/* ───────── گذاشتن و برداشتن ───────── */

function placeOn(si, side) {
  const sh = S.shelf[si];
  if (!sh || sh.left <= 0) return;
  sh.left--;
  S.pan[side].push({ def: sh.def, si, t: 0 });
  sfx.place();
  if (S.tut.on && S.tut.step === 1) { S.tut.step = 2; S.tut.t = 0; }
  checkWin();
}

function removeFrom(side, i) {
  const w = S.pan[side][i];
  if (!w) return;
  S.pan[side].splice(i, 1);
  const sh = S.shelf[w.si];
  if (sh) sh.left++;
  sfx.pop();
}

function checkWin() {
  if (S.winT > 0 || !isLevelNow()) return;
  const lv = L();
  /* عددی که ترازو می‌گوید. اگر بچّه روی کفّهٔ خودِ جسم هم وزنه گذاشته
     باشد — که آزاد است و با ترازوی واقعی هم می‌شود — آن‌ها باید کم
     شوند، وگرنه عددِ ثبت‌شده جرمِ جسم نیست. */
  const other = S.onLeft ? 1 : 0, own = 1 - other;
  const list = S.pan[other], mine = S.pan[own];
  const bead = lv.shelf === 'bead' || lv.twin;
  const val = bead ? (list.length - mine.length)
                   : (list.reduce((a, w) => a + w.def.g, 0) - mine.reduce((a, w) => a + w.def.g, 0));
  const unitName = bead ? shelfDefs(lv)[0].n : 'گرم';
  if (lv.twin && S.useBead === 0) {
    S.note.push({ thing: S.thing, mass: S.mass, val, unitName, pending: true });
  } else if (lv.twin) {
    const prev = S.note[S.note.length - 1];
    if (prev && prev.pending) { prev.pending = false; prev.val2 = val; prev.unit2 = unitName; }
  } else {
    S.note.push({ thing: S.thing, mass: S.mass, val, unitName });
  }
  if (S.note.length > 5) S.note.shift();
  S.winT = .001;
  S.cleared++;
  S.score += 50 + S.level * 25;
  if (S.score > S.best) S.best = S.score;
  sfx.win();
  bits.confetti(BEAM.x, BEAM.y + 40, 26, [P.brass, P.brassLt, '#fff', P.good]);
}

/* ───────── حلقه ───────── */

function step(dt) {
  S.t += dt;
  if (S.phaseT < 9) S.phaseT += dt;
  if (S.tipT > 0) S.tipT -= dt;
  if (S.shake > 0) S.shake = Math.max(0, S.shake - dt);
  if (S.tut.on) S.tut.t += dt;
  for (const side of S.pan) for (const w of side) if (w.t < 9) w.t += dt;
  /* فنرِ شاهین */
  const tg = targetAng();
  S.angV += (tg - S.ang) * 42 * dt;
  S.angV *= Math.pow(.0021, dt);
  S.ang += S.angV * dt;
  if (S.winT > 0) {
    S.winT += dt;
    if (S.winT > 1.7) {
      S.winT = 0;
      if (!L().endless && S.cleared >= L().quota) {
        if (S.level >= LEVELS.length - 1) { S.phase = 'won'; S.phaseT = 0; }
        else { S.level++; S.cleared = 0; S.useBead = 0; S.phaseT = 0; newRound(); toast.say(L().name, 'good'); }
      } else newRound();
    }
  }
  bits.step(dt);
  toast.step(dt);
  draw();
}

whenFontsReady(() => { newRound(); runLoop(step); });

/* ───────── جای‌ها ───────── */

const BEAM = { x: 470, y: 210, len: 300 };   /* تکیه‌گاه */
const PAN_DROP = 210;                        /* بلندیِ ریسمان */
const SHELF_BOX = { x: 852, y: 84, w: 324, h: 420 };
const NOTE = { x: 852, y: 524, w: 324, h: 214 };
const BTN_GO = { x: SCENE_W / 2 - 150, y: 470, w: 300, h: 68 };
const BTN_AGAIN = { x: SCENE_W / 2 - 150, y: 486, w: 300, h: 68 };

/** نقطهٔ آویزِ کفّهٔ side روی شاهین. */
function panPos(side) {
  const s = side === 0 ? -1 : 1;
  const a = S.ang;
  return { x: BEAM.x + s * BEAM.len * Math.cos(a), y: BEAM.y + s * BEAM.len * Math.sin(a) + PAN_DROP };
}
const PAN_W = 190, PAN_H = 26;
function panRect(side) {
  const p = panPos(side);
  return { x: p.x - PAN_W / 2, y: p.y - PAN_H, w: PAN_W, h: PAN_H + 66 };
}
function shelfSlot(i) {
  const col = i % 2, row = Math.floor(i / 2);
  return { x: SHELF_BOX.x + 16 + col * 150, y: SHELF_BOX.y + 54 + row * 92, w: 140, h: 82 };
}
/** جای هر وزنه روی کفّه — چیده‌شده در ردیف. */
function slotOnPan(side, i) {
  const p = panPos(side);
  const perRow = 5;
  const col = i % perRow, row = Math.floor(i / perRow);
  return { x: p.x - 68 + col * 34, y: p.y - 16 - row * 26 };
}

/* ───────── ورودی ───────── */

const TUT_TAP = [0, 2], TUT_LAST = 2;

cv.addEventListener('pointermove', (e) => {
  const p = toStage(e);
  if (S.carry) { S.carry.x = p.x; S.carry.y = p.y;
    if (Math.hypot(p.x - S.carry.px, p.y - S.carry.py) > 8) S.carry.moved = true; return; }
  S.hover = null;
  if (S.phase === 'intro') { if (inRect(p, BTN_GO)) S.hover = BTN_GO; }
  else if (S.phase === 'won') { if (inRect(p, BTN_AGAIN)) S.hover = BTN_AGAIN; }
  else {
    for (let i = 0; i < S.shelf.length; i++) if (S.shelf[i].left > 0 && inRect(p, shelfSlot(i))) S.hover = { k: 'shelf', i };
    for (let side = 0; side < 2; side++) {
      for (let i = S.pan[side].length - 1; i >= 0; i--) {
        const s = slotOnPan(side, i);
        if (Math.hypot(p.x - s.x, p.y - s.y) < 17) { S.hover = { k: 'onpan', side, i }; break; }
      }
    }
  }
  cv.style.cursor = S.hover ? 'pointer' : 'default';
});

cv.addEventListener('pointerdown', (e) => {
  const p = toStage(e);
  if (S.phase === 'intro') { if (inRect(p, BTN_GO)) { startLevel(0); sfx.good(); } return; }
  if (S.phase === 'won') {
    if (inRect(p, BTN_AGAIN)) { S.phase = 'intro'; S.phaseT = 0; S.level = 0; S.score = 0; S.note = []; newRound(); sfx.tap(); }
    return;
  }
  if (S.winT > 0) return;
  if (S.tut.on && tutTap(S.tut, TUT_TAP, TUT_LAST)) return;
  /* برداشتنِ وزنه از کفّه */
  for (let side = 0; side < 2; side++) {
    for (let i = S.pan[side].length - 1; i >= 0; i--) {
      const s = slotOnPan(side, i);
      if (Math.hypot(p.x - s.x, p.y - s.y) < 17) { removeFrom(side, i); return; }
    }
  }
  /* برداشتنِ وزنه از قفسه */
  for (let i = 0; i < S.shelf.length; i++) {
    if (S.shelf[i].left <= 0) continue;
    if (!inRect(p, shelfSlot(i))) continue;
    S.carry = { i, x: p.x, y: p.y, px: p.x, py: p.y, moved: false };
    try { cv.setPointerCapture(e.pointerId); } catch { /* بعضی مرورگرها */ }
    sfx.tap();
    return;
  }
});

function dropCarry(p) {
  if (!S.carry) return;
  const c = S.carry;
  S.carry = null;
  if (p) {
    for (let side = 0; side < 2; side++) {
      if (inRect(p, panRect(side))) { placeOn(c.i, side); return; }
    }
  }
  /* ضربهٔ کوتاه: خودش روی کفّهٔ خالی می‌نشیند */
  if (!c.moved) { placeOn(c.i, S.onLeft ? 1 : 0); return; }
  sfx.tap();
}

cv.addEventListener('pointerup', (e) => dropCarry(toStage(e)));
cv.addEventListener('pointercancel', () => { S.carry = null; });
cv.addEventListener('pointerleave', () => { S.carry = null; });
addEventListener('blur', () => { S.carry = null; });

/* ───────── ابزارِ نقاشی ───────── */

function rrPath(x, y, w, h, r) {
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function numText(str, x, y, o = {}) {
  ctx.save();
  ctx.direction = 'ltr';
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = o.color || P.ink;
  ctx.font = `${o.weight || 700} ${o.size || 18}px "${o.family || 'Vazirmatn'}", Tahoma, sans-serif`;
  ctx.fillText(str, x, y);
  ctx.restore();
}

function spot(rects, alpha) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, SCENE_W, SCENE_H);
  for (const r of rects) rrPath(r.x - 12, r.y - 12, r.w + 24, r.h + 24, 22);
  ctx.fillStyle = `rgba(18, 12, 6, ${alpha})`;
  ctx.fill('evenodd');
  ctx.restore();
}

function tutCard(x, y, w, lines, title) {
  const h = 26 + (title ? 44 : 0) + lines.length * 30;
  withShadow(24, 10, .5, () => {
    ctx.fillStyle = 'rgba(255, 252, 240, .97)';
    wobbleRect(x, y, w, h + 20, 16, 101, 2.2); ctx.fill();
  }, '18, 12, 6');
  ctx.fillStyle = P.brass;
  wobbleRect(x, y, w, 9, 4, 103, 1); ctx.fill();
  let yy = y + 34;
  if (title) { text(title, x + w / 2, yy + 6, { size: 25, family: 'Lalezar', color: P.ink }); yy += 44; }
  for (const l of lines) { text(l, x + w / 2, yy, { size: 18, color: '#7b6c56' }); yy += 30; }
  return h + 20;
}

/* ───────── شکلِ جسم‌ها ───────── */

function thingIcon(id, s) {
  ctx.save();
  ctx.scale(s, s);
  const ell = (x, y, rx, ry, rot, col) => {
    ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, TAU); ctx.fill();
  };
  switch (id) {
    case 'sib':
      ell(0, 2, 17, 18, 0, '#cf4436'); ell(-6, -4, 7, 6, 0, '#e8837a');
      ctx.strokeStyle = '#6b4a2c'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(2, -24); ctx.stroke();
      ell(10, -22, 8, 4, -.5, '#5da24e'); break;
    case 'porteqal':
      ell(0, 0, 19, 18, 0, '#e08a2e'); ell(-6, -6, 7, 5, 0, '#f3b364');
      ctx.strokeStyle = '#8a5210'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, 12, .4, 1.4); ctx.stroke(); break;
    case 'sibz':
      ell(0, 0, 21, 15, .2, '#b98a56'); ell(-6, -4, 8, 5, .2, '#d9b183');
      ctx.fillStyle = '#7a5a2e';
      for (const [x, y] of [[-9, 4], [6, -5], [11, 6]]) { ctx.beginPath(); ctx.arc(x, y, 2, 0, TAU); ctx.fill(); } break;
    case 'sang':
      ctx.fillStyle = '#8d99a3';
      ctx.beginPath(); ctx.moveTo(-19, 8); ctx.lineTo(-12, -11); ctx.lineTo(8, -14); ctx.lineTo(20, 2); ctx.lineTo(12, 12); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#c3ced6';
      ctx.beginPath(); ctx.moveTo(-12, -11); ctx.lineTo(8, -14); ctx.lineTo(2, -2); ctx.closePath(); ctx.fill(); break;
    case 'ketab':
      ctx.fillStyle = '#7a4a9c';
      ctx.beginPath(); rrPath(-20, -14, 40, 28, 3); ctx.fill();
      ctx.fillStyle = '#f3ead2'; ctx.fillRect(-16, -11, 32, 22);
      ctx.fillStyle = '#5a3078'; ctx.fillRect(-20, -14, 7, 28); break;
    case 'ajor':
      ctx.fillStyle = '#a5563f';
      ctx.beginPath(); rrPath(-22, -12, 44, 24, 3); ctx.fill();
      ctx.strokeStyle = '#7d3b28'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(-22, 0); ctx.lineTo(22, 0);
      ctx.moveTo(-6, -12); ctx.lineTo(-6, 0); ctx.moveTo(8, 0); ctx.lineTo(8, 12); ctx.stroke(); break;
    case 'ghuri':
      ctx.fillStyle = '#4f8aa0';
      ctx.beginPath(); ctx.ellipse(0, 2, 17, 14, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#7cb0c4'; ctx.beginPath(); ctx.ellipse(-5, -2, 8, 6, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#4f8aa0'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(15, -2); ctx.lineTo(25, -8); ctx.stroke();
      ctx.beginPath(); ctx.arc(-16, -2, 7, -1.2, 1.2); ctx.stroke();
      ctx.fillStyle = '#39697a'; ctx.beginPath(); rrPath(-5, -16, 10, 6, 2); ctx.fill(); break;
    case 'kafsh':
      ctx.fillStyle = '#5b3a22';
      ctx.beginPath(); ctx.moveTo(-20, 10); ctx.lineTo(-16, -6); ctx.quadraticCurveTo(-4, -10, 6, -2);
      ctx.lineTo(20, 4); ctx.lineTo(20, 10); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#33200f'; ctx.fillRect(-20, 8, 40, 5); break;
    case 'toop':
      ell(0, 0, 18, 18, 0, '#d9b73f');
      ctx.strokeStyle = '#8a6410'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, 18, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(18, 0); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0, 0, 8, 18, 0, 0, TAU); ctx.stroke(); break;
    case 'hendevane':
      ell(0, 0, 22, 19, 0, '#3f7d2c');
      ctx.strokeStyle = '#2a5a1c'; ctx.lineWidth = 3;
      for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.ellipse(0, 0, 8 + i * 7, 19, 0, 0, TAU); ctx.stroke(); } break;
    case 'medad':
      ctx.fillStyle = '#e0a422';
      ctx.beginPath(); rrPath(-22, -5, 36, 10, 2); ctx.fill();
      ctx.fillStyle = '#e8cfa8';
      ctx.beginPath(); ctx.moveTo(14, -5); ctx.lineTo(24, 0); ctx.lineTo(14, 5); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#3a2f22';
      ctx.beginPath(); ctx.moveTo(21, -1.6); ctx.lineTo(24, 0); ctx.lineTo(21, 1.6); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#cf6f8a'; ctx.beginPath(); rrPath(-24, -5, 8, 10, 2); ctx.fill(); break;
    case 'pakkon':
      ctx.fillStyle = '#e8837a';
      ctx.beginPath(); rrPath(-16, -9, 32, 18, 3); ctx.fill();
      ctx.fillStyle = '#f3f2ea'; ctx.beginPath(); rrPath(-16, -9, 32, 7, 3); ctx.fill(); break;
    default: ell(0, 0, 16, 16, 0, '#999');
  }
  ctx.restore();
}

/** وزنهٔ برنجی یا مهرهٔ رنگی. */
function weightIcon(def, s, hot) {
  ctx.save();
  ctx.scale(s, s);
  if (def.kind === 'bead') {
    const r = def.r;
    ctx.fillStyle = shade(def.c, -.35);
    ctx.beginPath(); ctx.arc(0, 2, r, 0, TAU); ctx.fill();
    ctx.fillStyle = def.c;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
    ctx.fillStyle = shade(def.c, .45);
    ctx.beginPath(); ctx.arc(-r * .3, -r * .34, r * .34, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(30,20,10,.5)';
    ctx.beginPath(); ctx.arc(0, 0, r * .22, 0, TAU); ctx.fill();
  } else {
    const w = 30, h = 22;
    ctx.fillStyle = P.brassDk;
    ctx.beginPath(); rrPath(-w / 2, -h / 2 + 3, w, h, 4); ctx.fill();
    ctx.fillStyle = hot ? P.brassLt : P.brass;
    ctx.beginPath(); rrPath(-w / 2, -h / 2, w, h, 4); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); rrPath(-w / 2 + 3, -h / 2 + 2, w - 6, 5, 2); ctx.fill();
    /* دستهٔ کوچکِ بالای وزنه */
    ctx.strokeStyle = P.brassDk; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, -h / 2 - 1, 5, Math.PI, TAU); ctx.stroke();
    numText(def.n, 0, 1, { size: 12, color: '#4a3406', family: 'Lalezar' });
  }
  ctx.restore();
}

/* ───────── نقاشیِ صحنه ───────── */

function paintWallStatic() {
  const g = ctx.createLinearGradient(0, HUD_H, 0, SCENE_H);
  g.addColorStop(0, P.wallHi); g.addColorStop(1, P.wallLo);
  ctx.fillStyle = g; ctx.fillRect(0, 0, SCENE_W, SCENE_H);
  ctx.fillStyle = texStone(P.wall, P.wallHi);
  ctx.globalAlpha = .5; ctx.fillRect(0, 0, SCENE_W, SCENE_H); ctx.globalAlpha = 1;
  /* طاقِ آجریِ بازار */
  ctx.strokeStyle = 'rgba(255, 225, 180, .07)'; ctx.lineWidth = 3;
  for (let i = 0; i < 5; i++) {
    ctx.beginPath(); ctx.arc(160 + i * 200, 90, 120, Math.PI, TAU); ctx.stroke();
  }
  /* میزِ چوبی */
  ctx.fillStyle = texWood(P.wood, P.woodDk);
  ctx.beginPath(); rrPath(40, 640, 780, 30, 8); ctx.fill();
  ctx.fillStyle = 'rgba(60,40,18,.5)';
  ctx.fillRect(80, 670, 26, 78); ctx.fillRect(740, 670, 26, 78);
  /* قفسه و دفتر */
  for (const b of [SHELF_BOX, NOTE]) {
    ctx.fillStyle = 'rgba(255, 250, 236, .94)';
    ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 14); ctx.fill();
    ctx.strokeStyle = 'rgba(60, 44, 24, .25)'; ctx.lineWidth = 2;
    ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 14); ctx.stroke();
  }
}

function drawBalance() {
  /* ستون */
  ctx.fillStyle = P.steelDk;
  ctx.beginPath(); rrPath(BEAM.x - 13, BEAM.y, 26, 440, 6); ctx.fill();
  ctx.fillStyle = P.steel;
  ctx.beginPath(); rrPath(BEAM.x - 9, BEAM.y, 18, 440, 5); ctx.fill();
  ctx.fillStyle = P.woodDk;
  ctx.beginPath(); ctx.ellipse(BEAM.x, 646, 92, 16, 0, 0, TAU); ctx.fill();

  /* نشانهٔ صاف بودن — دو خطِ ثابت که شاهین باید میانشان بایستد */
  ctx.strokeStyle = 'rgba(255, 240, 200, .28)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(BEAM.x - 46, BEAM.y - 26); ctx.lineTo(BEAM.x + 46, BEAM.y - 26); ctx.stroke();

  const a = S.ang;
  const bal = Math.abs(diffMass()) === 0 && (S.pan[0].length + S.pan[1].length) > 0;

  /* عقربهٔ وسط */
  ctx.save();
  ctx.translate(BEAM.x, BEAM.y);
  ctx.rotate(a);
  ctx.strokeStyle = bal ? P.good : P.brassLt; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -54); ctx.stroke();
  /* شاهین */
  ctx.strokeStyle = P.brassDk; ctx.lineWidth = 13; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-BEAM.len, 0); ctx.lineTo(BEAM.len, 0); ctx.stroke();
  ctx.strokeStyle = P.brass; ctx.lineWidth = 9;
  ctx.beginPath(); ctx.moveTo(-BEAM.len, 0); ctx.lineTo(BEAM.len, 0); ctx.stroke();
  ctx.fillStyle = P.brassLt;
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(s * BEAM.len, 0, 8, 0, TAU); ctx.fill(); }
  ctx.restore();

  /* پیچِ میانی */
  ctx.fillStyle = P.brassDk;
  ctx.beginPath(); ctx.arc(BEAM.x, BEAM.y, 15, 0, TAU); ctx.fill();
  ctx.fillStyle = P.brass;
  ctx.beginPath(); ctx.arc(BEAM.x, BEAM.y, 11, 0, TAU); ctx.fill();

  /* ریسمان‌ها و کفّه‌ها */
  for (let side = 0; side < 2; side++) {
    const s = side === 0 ? -1 : 1;
    const hx = BEAM.x + s * BEAM.len * Math.cos(a), hy = BEAM.y + s * BEAM.len * Math.sin(a);
    const p = panPos(side);
    ctx.strokeStyle = 'rgba(240, 226, 190, .8)'; ctx.lineWidth = 2;
    for (const dx of [-PAN_W / 2 + 14, PAN_W / 2 - 14]) {
      ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(p.x + dx, p.y - PAN_H + 2); ctx.stroke();
    }
    /* کفّه */
    const hot = S.carry && inRect({ x: S.carry.x, y: S.carry.y }, panRect(side));
    ctx.fillStyle = hot ? P.brassLt : P.brassDk;
    ctx.beginPath(); ctx.ellipse(p.x, p.y, PAN_W / 2, 16, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = hot ? '#f6e2a8' : P.brass;
    ctx.beginPath(); ctx.ellipse(p.x, p.y - 5, PAN_W / 2 - 4, 13, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = P.brassDk; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(p.x, p.y - 5, PAN_W / 2 - 4, 13, 0, 0, TAU); ctx.stroke();
  }

  /* جسم روی کفّهٔ خودش */
  const objSide = S.onLeft ? 0 : 1;
  const op = panPos(objSide);
  ctx.save();
  ctx.translate(op.x, op.y - 26);
  thingIcon(THINGS[S.thing].id, 1.25);
  ctx.restore();
  ctx.fillStyle = 'rgba(28, 20, 10, .55)';
  const nm = THINGS[S.thing].n;
  ctx.font = '700 14px "Vazirmatn", Tahoma, sans-serif';
  const nw = ctx.measureText(nm).width + 20;
  ctx.beginPath(); rrPath(op.x - nw / 2, op.y + 16, nw, 22, 11); ctx.fill();
  text(nm, op.x, op.y + 27, { size: 14, color: '#ffeecb' });

  /* وزنه‌های روی کفّه‌ها */
  for (let side = 0; side < 2; side++) {
    for (let i = 0; i < S.pan[side].length; i++) {
      const w = S.pan[side][i], s = slotOnPan(side, i);
      const hot = S.hover && S.hover.k === 'onpan' && S.hover.side === side && S.hover.i === i;
      const k = clamp(w.t / .22, 0, 1);
      ctx.save();
      ctx.translate(s.x, s.y - (1 - k) * 40);
      ctx.globalAlpha = k;
      weightIcon(w.def, hot ? .96 : .86, hot);
      ctx.restore();
    }
  }
}

function drawShelf() {
  text('قفسهٔ وزنه', SHELF_BOX.x + SHELF_BOX.w - 16, SHELF_BOX.y + 28,
    { size: 20, family: 'Lalezar', color: P.ink, align: 'right' });
  for (let i = 0; i < S.shelf.length; i++) {
    const sh = S.shelf[i], b = shelfSlot(i);
    const hot = S.hover && S.hover.k === 'shelf' && S.hover.i === i;
    const out = sh.left <= 0;
    ctx.fillStyle = out ? 'rgba(60,44,24,.05)' : (hot ? 'rgba(201,150,44,.16)' : 'rgba(60,44,24,.05)');
    ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 10); ctx.fill();
    ctx.strokeStyle = hot ? P.brass : 'rgba(60,44,24,.14)'; ctx.lineWidth = hot ? 2.4 : 1.2;
    ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 10); ctx.stroke();
    ctx.save();
    ctx.globalAlpha = out ? .25 : 1;
    ctx.translate(b.x + 44, b.y + 40);
    weightIcon(sh.def, 1.05, hot);
    ctx.restore();
    text(sh.def.n, b.x + b.w - 12, b.y + 28, { size: 14, color: P.ink, align: 'right' });
    numText('×' + fa(sh.left), b.x + b.w - 22, b.y + 58, { size: 17, color: out ? P.bad : P.inkSoft });
  }
  /* در مرحلهٔ دو، فقط یک جور مهره داریم و همان‌جا گفته می‌شود */
  if (L().twin) {
    const y = SHELF_BOX.y + SHELF_BOX.h - 34;
    ctx.fillStyle = 'rgba(79, 138, 160, .14)';
    ctx.beginPath(); rrPath(SHELF_BOX.x + 16, y - 17, SHELF_BOX.w - 32, 34, 8); ctx.fill();
    text('این بار فقط با ' + shelfDefs(L())[0].n, SHELF_BOX.x + SHELF_BOX.w / 2, y,
      { size: 15, color: '#2f6274' });
  }
}

function drawNote() {
  text('دفترِ اندازه‌گیری', NOTE.x + NOTE.w - 16, NOTE.y + 26,
    { size: 19, family: 'Lalezar', color: P.ink, align: 'right' });
  if (!S.note.length) {
    text('هنوز چیزی سنجیده نشده', NOTE.x + NOTE.w / 2, NOTE.y + 110,
      { size: 14, color: 'rgba(58,47,34,.35)' });
    return;
  }
  const rows = S.note.slice(-3);
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i], twin = r.val2 !== undefined;
    const y = NOTE.y + 48 + i * 52;
    ctx.save();
    ctx.translate(NOTE.x + NOTE.w - 30, y + 14);
    thingIcon(THINGS[r.thing].id, .5);
    ctx.restore();
    text(THINGS[r.thing].n, NOTE.x + NOTE.w - 58, y + 14, { size: 13, color: P.ink, align: 'right' });

      /* همان جسم، دو عدد — چون یکا فرق دارد. زیرِ هم تا مقایسه آسان باشد. */
      numText(fa(r.val) + ' ' + r.unitName, NOTE.x + 96, y + 4, { size: 14, color: '#a8552c' });
      numText(fa(r.val2) + ' ' + r.unit2, NOTE.x + 96, y + 26, { size: 14, color: '#3f7d94' });
      ctx.strokeStyle = 'rgba(58,47,34,.18)'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(NOTE.x + 18, y + 15); ctx.lineTo(NOTE.x + 172, y + 15); ctx.stroke();
    } else {
      numText(fa(r.val) + ' ' + r.unitName, NOTE.x + 84, y + 14,
        { size: 16, color: r.pending ? P.inkSoft : P.ink, family: 'Lalezar' });
    }
    ctx.strokeStyle = 'rgba(58,47,34,.1)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(NOTE.x + 16, y + 40); ctx.lineTo(NOTE.x + NOTE.w - 16, y + 40); ctx.stroke();
  }
}

function drawHUD() {

function draw() {
  beginScene(P.wallLo);
  ctx.save();
  if (S.shake > 0) {
    const k = S.shake * 10;
    ctx.translate(Math.sin(S.t * 55) * k, Math.cos(S.t * 43) * k * .4);
  }
  const layer = staticLayer('wall', SCENE_W, SCENE_H, paintWallStatic);
  ctx.drawImage(layer, 0, 0, SCENE_W, SCENE_H);
  drawBalance();
  drawShelf();
  drawNote();
  bits.draw();
  ctx.restore();

  if (S.carry) {
    const sh = S.shelf[S.carry.i];
    if (sh) {
      ctx.save();
      ctx.translate(S.carry.x, S.carry.y - 10);
      ctx.globalAlpha = .95;
      weightIcon(sh.def, 1.1, true);
      ctx.restore();
    }
  }

  drawHUD();
  if (!(S.phase === 'play' && S.tut.on)) toast.draw(HUD_H + 8, { good: P.good, bad: P.bad, info: P.card, ink: P.ink });
  if (S.phase === 'play' && S.tut.on) drawTutorial();
  if (S.phase === 'intro') drawIntro();
  if (S.phase === 'won') drawWon();
  endScene(.1, 'rgba(30, 18, 6, .44)', 0, .12);
}

</script>
