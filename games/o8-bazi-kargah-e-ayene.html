<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1d1a26">
<title>کارگاهِ آینه — جست‌وجو کنیم و بسازیم (بازی)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>
  /* صفحه نباید هیچ‌جا اسکرول یا زوم شود؛ بازی باید مثل یک برنامه رفتار کند. */
  html, body {
    margin: 0; padding: 0; background: #1d1a26;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body {
    position: fixed; inset: 0;          /* جلوی کشیده‌شدنِ صفحه در سافاریِ گوشی */
    width: 100%; height: 100vh; height: 100dvh;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none; -webkit-touch-callout: none;
  }

  /* گوشیِ عمودی صحنه را ریز می‌کند؛ بچه باید گوشی را بچرخاند. */
  #rotate { display: none; }
  @media (orientation: portrait) and (max-width: 860px) {
    #stage { display: none; }
    #rotate {
      display: flex; position: fixed; inset: 0;
      z-index: 9;
      flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      background: #1d1a26; color: #f6ead2;
      font: 700 20px "Vazirmatn", Tahoma, sans-serif; text-align: center; padding: 32px;
    }
    #rotate svg { animation: tilt 2.4s ease-in-out infinite; }
    @keyframes tilt { 0%, 45% { transform: rotate(0deg); } 65%, 100% { transform: rotate(-90deg); } }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="rotate">
  <svg width="86" height="126" viewBox="0 0 86 126" fill="none" aria-hidden="true">
    <rect x="3" y="3" width="80" height="120" rx="12" stroke="#e8b448" stroke-width="5"/>
    <rect x="15" y="19" width="56" height="88" rx="5" fill="#e8b448" opacity=".28"/>
    <circle cx="43" cy="115" r="4" fill="#e8b448"/>
  </svg>
  <div>گوشی را بچرخان</div>
  <div style="font-weight:400;opacity:.7;font-size:16px">این بازی خوابیده بازی می‌شود</div>
</div>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   هستهٔ مشترکِ بازی‌ها — سبک «کاغذبُری»
   ───────────────────────────────────────────────────────────────────────
   این فایل جعبه‌ابزار است، نه چارچوب: هر بازی حلقه و وضعیت خودش را دارد
   و فقط از این توابع برای کشیدن استفاده می‌کند. دلیلش این است که هر بازی
   باید حس‌وحال خودش را داشته باشد، نه اینکه همه شبیه هم دربیایند.

   قاعده‌های ثابتِ تصویری:
   • نور همیشه از بالا-چپ می‌تابد، پس سایه‌ها به پایین-راست می‌افتند.
   • هیچ لبه‌ای کاملاً صاف نیست؛ همه کمی موج دارند (انگار با قیچی بریده).
   • هیچ خاکستریِ خالصی نداریم؛ همه‌ی خنثی‌ها به گرمیِ صحنه می‌زنند.
   • یک لایه‌ی دانه‌دانه‌ی کاغذ روی کلِ تصویر ضرب می‌شود.
   ═══════════════════════════════════════════════════════════════════════ */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const FA_D = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
const fa = (n) => String(n).replace(/\d/g, (d) => FA_D[+d]);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeIn = (t) => t * t * t;
const easeInOut = (t) => (t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2);
const easeBack = (t) => 1 + 2.7 * Math.pow(t-1, 3) + 1.7 * Math.pow(t-1, 2);
const easeElastic = (t) => t === 0 || t === 1 ? t : Math.pow(2, -9*t) * Math.sin((t*10 - .75) * 2.094) + 1;

/** تصادفِ تکرارپذیر: با یک بذر همیشه همان عدد. برای اینکه تزئین‌ها هر فریم نپرند. */
function noise1(x) {
  const s = Math.sin(x * 127.1) * 43758.5453;
  return s - Math.floor(s);
}
const pick = (arr, seed) => arr[Math.floor(noise1(seed) * arr.length) % arr.length];

/* ───────── بوم و صحنهٔ ثابت ───────── */

let ctx, SW, SH, CV, _refit = null;
let view = { scale: 1, ox: 0, oy: 0, w: 0, h: 0, dpr: 1 };
let _grain = null, _grainDark = null;

function initStage(canvas, w, h) {
  CV = canvas; SW = w; SH = h;
  ctx = canvas.getContext('2d');

  /* اندازه را از خودِ بوم می‌گیریم نه از innerHeight؛ چون در سافاریِ گوشی
     نوارِ آدرس باز و بسته می‌شود و innerHeight دروغ می‌گوید. */
  const fit = () => {
    const r = canvas.getBoundingClientRect();
    const vw = Math.round(r.width), vh = Math.round(r.height);
    if (vw < 20 || vh < 20) return;
    const dpr = Math.min(devicePixelRatio || 1, QUALITY > 0 ? 2 : 1);
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    const scale = Math.min(vw / SW, vh / SH);
    view = { scale, ox: (vw - SW*scale)/2, oy: (vh - SH*scale)/2, w: vw, h: vh, dpr };
    _grain = buildGrain();
  };
  _refit = fit;
  addEventListener('resize', fit);
  /* چرخاندنِ گوشی: اندازهٔ درست چند لحظه بعد می‌رسد، پس چندبار اندازه می‌گیریم. */
  addEventListener('orientationchange', () => {
    fit(); setTimeout(fit, 140); setTimeout(fit, 460);
  });
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(canvas);

  /* صدا در گوشی فقط بعد از اوّلین لمس اجازهٔ پخش دارد. */
  const unlock = () => { sfx._c(); removeEventListener('pointerdown', unlock); removeEventListener('touchstart', unlock); };
  addEventListener('pointerdown', unlock, { passive: true });
  addEventListener('touchstart', unlock, { passive: true });
  /* نگه‌داشتنِ انگشت نباید منوی مرورگر را باز کند. */
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  fit();
  return ctx;
}

/** قابِ صحنه را باز می‌کند: بعد از این، مختصات همیشه در فضای SW×SH است. */
function beginScene(bg) {
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, view.w, view.h);
  ctx.save();
  ctx.translate(view.ox, view.oy);
  ctx.scale(view.scale, view.scale);
  ctx.beginPath();
  ctx.rect(0, 0, SW, SH);
  ctx.clip();
}

/* ───────── پوششِ پایانِ قاب ─────────
   دانه‌های کاغذ و تیرگیِ گوشه‌ها هر دو ثابت‌اند و تغییر نمی‌کنند، ولی
   قبلاً هر فریم از نو کشیده می‌شدند: یکی با «multiply» روی کلِّ صفحه و
   یکی با یک گرادیانِ شعاعیِ تازه. اندازه‌گیری نشان داد همین دو تا
   ۱۱ تا ۱۶ میلی‌ثانیه از هر فریم را می‌خوردند — بیشتر از کشیدنِ خودِ
   صحنه. حالا یک بار در یک بومِ جدا پخته می‌شوند و هر فریم فقط یک
   drawImage است.                                                       */

let _ovl = null, _ovlKey = '';

function overlayLayer(grainAlpha, vignette) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const w = Math.max(2, Math.round(SW * q)), h = Math.max(2, Math.round(SH * q));
  const key = w + 'x' + h + '|' + grainAlpha + '|' + vignette;
  if (_ovl && _ovlKey === key) return _ovl;
  let c;
  try {
    c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g2 = c.getContext('2d');
    if (!g2) return null;
    if (_grainDark && grainAlpha > 0) {
      /* همان دانه‌ها، ولی به‌جای multiply به شکلِ سیاهِ کم‌رنگ */
      g2.globalAlpha = clamp(grainAlpha * 1.15, 0, 1);
      g2.fillStyle = g2.createPattern(_grainDark, 'repeat');
      g2.fillRect(0, 0, w, h);
      g2.globalAlpha = 1;
    }
    if (vignette) {
      const g = g2.createRadialGradient(w / 2, h / 2, h * .42, w / 2, h / 2, h * 1.05);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, vignette);
      g2.fillStyle = g;
      g2.fillRect(0, 0, w, h);
    }
  } catch (e) { return null; }
  _ovl = c; _ovlKey = key;
  return c;
}

/** بافتِ کاغذ، تیرگیِ گوشه‌ها، رنگ‌بندی و درخششِ نور را می‌گذارد و قاب را می‌بندد. */
function endScene(grainAlpha = .15, vignette = 'rgba(48,28,14,.30)', bloom = .34, grade = .14) {
  /* درخششِ نور خاموش است. اندازه‌گیری نشان داد هر فریم ۲۱ میلی‌ثانیه
     می‌گیرد — بیشتر از تمامِ کارهای دیگرِ یک فریم روی هم — چون برای
     ساختنش باید کلِّ بوم دوباره خوانده شود. از آن بدتر: متنِ فارسی را
     مه‌آلود می‌کرد و خواندنش را سخت‌تر. بی‌آن، صحنه تمیزتر است. */
  bloom = 0;
  if (QUALITY < 1) { grade = 0; grainAlpha *= .5; }
  if (QUALITY < 2) grade = 0;
  if (grade > 0) {
    /* رنگ‌بندیِ نرم: بالای صحنه گرم‌تر، پایین سردتر — عمق می‌دهد */
    const g = ctx.createLinearGradient(0, 0, 0, SH);
    g.addColorStop(0, `rgba(255, 214, 150, ${grade})`);
    g.addColorStop(.55, 'rgba(255, 255, 255, 0)');
    g.addColorStop(1, `rgba(40, 60, 110, ${grade * .9})`);
    ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalCompositeOperation = 'source-over';
  }
  const ov = (grainAlpha > 0 || vignette) ? overlayLayer(grainAlpha, vignette) : null;
  if (ov) ctx.drawImage(ov, 0, 0, SW, SH);
  ctx.restore();
  bloomPass(bloom);
}

/* ───────── درخششِ نور (bloom) ─────────
   قابِ رسم‌شده را کوچک می‌کنیم، دو بار در خودش ضرب می‌کنیم تا فقط
   روشن‌ها بمانند، محوش می‌کنیم و با حالتِ «lighter» رویش می‌گذاریم.
   نتیجه: چراغ‌ها، شعله‌ها و رنگ‌های روشن نور پخش می‌کنند. */
let _bl, _blc, _bl2, _bl2c, _blNo = false, _blTick = 0;

function bloomPass(amount) {
  if (!amount || _blNo || !CV.width) return;
  /* کوچک‌کردن و بزرگ‌کردنِ دوباره، خودش محو می‌کند — از filter خیلی ارزان‌تر است */
  const W = Math.max(4, Math.round(CV.width * .2)), H = Math.max(4, Math.round(CV.height * .2));
  const W2 = Math.max(2, Math.round(W * .28)), H2 = Math.max(2, Math.round(H * .28));
  try {
    if (!_bl) {
      _bl = document.createElement('canvas'); _blc = _bl.getContext('2d');
      _bl2 = document.createElement('canvas'); _bl2c = _bl2.getContext('2d');
      if (!_blc || !_bl2c) { _blNo = true; return; }
    }
    if (_bl.width !== W || _bl.height !== H) { _bl.width = W; _bl.height = H; }
    if (_bl2.width !== W2 || _bl2.height !== H2) { _bl2.width = W2; _bl2.height = H2; }
    /* ساختنِ نور یک قاب در میان کافی است؛ گذاشتنش هر قاب. */
    _blTick = (_blTick + 1) & 1;
    if (!_blTick) {
      _blc.globalCompositeOperation = 'source-over';
      _blc.clearRect(0, 0, W, H);
      _blc.drawImage(CV, 0, 0, W, H);
      _blc.globalCompositeOperation = 'multiply';
      _blc.drawImage(_bl, 0, 0);
      _blc.drawImage(_bl, 0, 0);
      _blc.globalCompositeOperation = 'source-over';
      _bl2c.clearRect(0, 0, W2, H2);
      _bl2c.drawImage(_bl, 0, 0, W2, H2);
    }

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = amount;
    ctx.drawImage(_bl2, 0, 0, CV.width, CV.height);
    ctx.restore();
  } catch (e) { _blNo = true; }
}

/* ───────── لایهٔ ثابت ─────────
   هرچه در صحنه تکان نمی‌خورد را یک‌بار می‌کشیم و بعد فقط کپی می‌کنیم. */
const _layers = {};
function staticLayer(key, w, h, paint) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const L = _layers[key];
  if (L && L.q === q && L.w === w && L.h === h) return L.cv;
  const off = document.createElement('canvas');
  off.width = Math.max(1, Math.round(w * q));
  off.height = Math.max(1, Math.round(h * q));
  const c = off.getContext('2d');
  c.setTransform(q, 0, 0, q, 0, 0);
  const prev = ctx;
  ctx = c;
  try { paint(); } finally { ctx = prev; }
  _layers[key] = { cv: off, q, w, h };
  return off;
}

/* ───────── نورپردازی و بافت ─────────
   کارِ این‌ها این است که هیچ سطحی «تختِ یک‌رنگ» نماند. */

/** شیبِ عمودی: بالا روشن، پایین تیره. */
function vgrad(y0, y1, top, bot) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, top); g.addColorStop(1, bot);
  return g;
}

/** حجمِ کروی: نور از بالا-چپ، سایه در پایین-راست. */
function ball(cx, cy, r, lit, base, dark) {
  const g = ctx.createRadialGradient(cx - r * .38, cy - r * .42, r * .06, cx, cy, r * 1.06);
  g.addColorStop(0, lit); g.addColorStop(.45, base); g.addColorStop(1, dark);
  return g;
}

/** لبهٔ روشنِ بالا-چپِ یک مسیر — همان «rim light». */
function rim(pathFn, col, w = 2.2) {
  ctx.save();
  ctx.beginPath(); pathFn();
  ctx.clip();
  ctx.beginPath(); pathFn();
  ctx.strokeStyle = col; ctx.lineWidth = w * 2; ctx.lineJoin = 'round';
  ctx.translate(-w * .5, -w * .6);
  ctx.stroke();
  ctx.restore();
}

/** سایهٔ چسبیده به زمین — چیزها را روی سطح می‌نشاند. */
function contact(cx, cy, rx, ry, alpha = .26) {
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
  g.addColorStop(0, `rgba(20, 12, 6, ${alpha})`);
  g.addColorStop(1, 'rgba(20, 12, 6, 0)');
  ctx.save();
  ctx.fillStyle = g;
  ctx.translate(cx, cy); ctx.scale(1, ry / Math.max(rx, ry));
  ctx.beginPath(); ctx.arc(0, 0, Math.max(rx, ry), 0, TAU); ctx.fill();
  ctx.restore();
}

const _tex = {};
/** بافتِ تکرارشونده؛ یک‌بار ساخته و بعد از حافظه خوانده می‌شود. */
function texture(key, w, h, paint) {
  if (_tex[key]) return _tex[key];
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const c = off.getContext('2d');
  paint(c, w, h);
  _tex[key] = ctx.createPattern(off, 'repeat');
  return _tex[key];
}

/** رگهٔ چوب. */
function texWood(base, grain) {
  return texture('w' + base + grain, 120, 120, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = grain; c.lineWidth = 1.4;
    for (let i = 0; i < 9; i++) {
      c.globalAlpha = .18 + noise1(i * 3.1) * .3;
      c.beginPath();
      const y0 = i * 14 + noise1(i) * 6;
      c.moveTo(0, y0);
      for (let x = 0; x <= w; x += 10) c.lineTo(x, y0 + Math.sin(x * .09 + i) * 2.6);
      c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** تارِ پارچه. */
function texCloth(base, thread) {
  return texture('c' + base + thread, 16, 16, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = thread; c.lineWidth = 1; c.globalAlpha = .5;
    for (let i = 0; i < w; i += 4) {
      c.beginPath(); c.moveTo(i, 0); c.lineTo(i, h); c.stroke();
      c.beginPath(); c.moveTo(0, i); c.lineTo(w, i); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** دانه‌های سنگ. */
function texStone(base, spec) {
  return texture('s' + base + spec, 90, 90, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) {
      c.globalAlpha = .05 + noise1(i * 1.7) * .16;
      c.fillStyle = spec;
      const r = .6 + noise1(i * 5.3) * 1.9;
      c.beginPath();
      c.arc(noise1(i * 2.1) * w, noise1(i * 3.7 + 1) * h, r, 0, TAU);
      c.fill();
    }
    c.globalAlpha = 1;
  });
}

/** الیافِ کاغذ. */
function texPaper(base) {
  return texture('p' + base, 100, 100, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 130; i++) {
      c.globalAlpha = .04 + noise1(i * 2.3) * .07;
      c.strokeStyle = i % 2 ? '#ffffff' : '#5a4326';
      c.lineWidth = .9;
      const x = noise1(i * 1.3) * w, y = noise1(i * 4.1 + 2) * h;
      const a = noise1(i * 7.7) * TAU, l = 4 + noise1(i * 9.1) * 12;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

function buildGrain() {
  const s = 260;
  const off = document.createElement('canvas');
  off.width = off.height = s;
  const c = off.getContext('2d');
  const img = c.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    const v = 214 + Math.random() * 41;
    img.data[i*4] = v; img.data[i*4+1] = v; img.data[i*4+2] = v; img.data[i*4+3] = 255;
  }
  c.putImageData(img, 0, 0);
  /* همان دانه‌ها به شکلِ سیاهِ کم‌رنگ، تا بشود بدونِ multiply گذاشتشان */
  const d = document.createElement('canvas');
  d.width = d.height = s;
  const dc = d.getContext('2d');
  const dimg = dc.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    dimg.data[i*4] = 0; dimg.data[i*4+1] = 0; dimg.data[i*4+2] = 0;
    dimg.data[i*4+3] = 255 - img.data[i*4];
  }
  dc.putImageData(dimg, 0, 0);
  _grainDark = d;
  _ovl = null; _ovlKey = '';
  return ctx.createPattern(off, 'repeat');
}

function toStage(e) {
  const r = CV.getBoundingClientRect();
  return {
    x: (e.clientX - r.left - view.ox) / view.scale,
    y: (e.clientY - r.top - view.oy) / view.scale,
  };
}

const inRect = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
const inCircle = (p, b, pad = 0) => Math.hypot(p.x - b.x, p.y - b.y) <= b.r + pad;

/* ───────── قلم‌های کاغذبُری ───────── */

/** دایره‌ای که انگار با قیچی بریده شده. */
function wobbleCircle(cx, cy, r, seed = 0, amp = 2.2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const rr = r + Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp * .45;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** بیضیِ ناصاف — برای چیزهایی که گرد نیستند ولی نرم‌اند. */
function wobbleEllipse(cx, cy, rx, ry, rot = 0, seed = 0, amp = 2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const w = 1 + (Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp*.45) / Math.max(rx, ry);
    const px = Math.cos(a) * rx * w, py = Math.sin(a) * ry * w;
    const x = cx + px*Math.cos(rot) - py*Math.sin(rot);
    const y = cy + px*Math.sin(rot) + py*Math.cos(rot);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** مستطیلِ گِرد با گوشه‌های کمی کج. */
function wobbleRect(x, y, w, h, r = 12, seed = 0, amp = 1.6) {
  const j = (k) => (noise1(seed*9.7 + k) - .5) * amp * 2;
  ctx.beginPath();
  ctx.moveTo(x + r + j(1), y + j(2));
  ctx.lineTo(x + w - r + j(3), y + j(4));
  ctx.quadraticCurveTo(x + w + j(5), y + j(6), x + w + j(7), y + r + j(8));
  ctx.lineTo(x + w + j(9), y + h - r + j(10));
  ctx.quadraticCurveTo(x + w + j(11), y + h + j(12), x + w - r + j(13), y + h + j(14));
  ctx.lineTo(x + r + j(15), y + h + j(16));
  ctx.quadraticCurveTo(x + j(17), y + h + j(18), x + j(19), y + h - r + j(20));
  ctx.lineTo(x + j(21), y + r + j(22));
  ctx.quadraticCurveTo(x + j(23), y + j(24), x + r + j(1), y + j(2));
  ctx.closePath();
}

/** سایهٔ نرم؛ نور از بالا-چپ. */
function withShadow(blur, dy, alpha, fn, hue = '78, 46, 24') {
  ctx.save();
  ctx.shadowColor = `rgba(${hue}, ${alpha})`;
  ctx.shadowBlur = blur;
  ctx.shadowOffsetY = dy;
  ctx.shadowOffsetX = dy * .35;
  fn();
  ctx.restore();
}

/** یک برگه‌ی کاغذ با سایه — پایه‌ی همه‌ی کارت‌ها و تابلوها. */
function paper(x, y, w, h, fill, seed = 1, r = 12, shadow = .26) {
  withShadow(16, 7, shadow, () => {
    ctx.fillStyle = fill;
    wobbleRect(x, y, w, h, r, seed, 2);
    ctx.fill();
  });
  /* الیافِ کاغذ و لبهٔ روشن، تا سطح تخت نماند */
  ctx.save();
  ctx.beginPath(); wobbleRect(x, y, w, h, r, seed, 2); ctx.clip();
  ctx.globalAlpha = .5;
  ctx.fillStyle = texPaper(fill);
  ctx.fillRect(x, y, w, h);
  ctx.globalAlpha = 1;
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.4, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(90,60,20,.1)');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
}

function text(str, x, y, o = {}) {
  const size = o.size || 20;
  const fam = o.family || 'Vazirmatn';
  ctx.save();
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.font = `${fam === 'Lalezar' ? '400' : (o.weight || 700)} ${size}px "${fam}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.baseline || 'middle';
  ctx.fillStyle = o.color || '#43291b';
  ctx.direction = 'rtl';
  if (o.stroke) {
    ctx.lineWidth = o.strokeWidth || 5;
    ctx.strokeStyle = o.stroke;
    ctx.lineJoin = 'round';
    ctx.strokeText(str, x, y, o.maxWidth);
  }
  ctx.fillText(str, x, y, o.maxWidth);
  ctx.restore();
}

/** متنِ چندخطی که خودش می‌شکند. ارتفاعِ اشغال‌شده را برمی‌گرداند. */
function textWrap(str, x, y, maxW, o = {}) {
  const size = o.size || 19, lh = o.lineHeight || size * 1.7;
  ctx.font = `${o.weight || 700} ${size}px "${o.family || 'Vazirmatn'}", Tahoma, sans-serif`;
  const lines = [];
  for (const para of str.split('\n')) {
    let line = '';
    for (const wd of para.split(' ')) {
      const t = line ? line + ' ' + wd : wd;
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = wd; }
      else line = t;
    }
    lines.push(line);
  }
  lines.forEach((l, i) => text(l, x, y + i * lh, o));
  return lines.length * lh;
}

/* ───────── ذره‌ها ───────── */

class Bits {
  constructor() { this.list = []; }
  add(x, y, n, kind, colors, opts = {}) {
    for (let i = 0; i < n; i++) {
      const a = opts.dir !== undefined ? opts.dir + (Math.random()-.5) * (opts.spread || 1) : Math.random() * TAU;
      const sp = (opts.speed || 200) * (.4 + Math.random());
      this.list.push({
        kind, x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - (opts.lift || 0),
        r: (opts.size || 4) * (.5 + Math.random()),
        rot: Math.random() * TAU, vr: (Math.random()-.5) * 10,
        col: colors[(Math.random() * colors.length) | 0],
        grav: opts.grav === undefined ? 620 : opts.grav,
        drag: opts.drag || .995,
        life: (opts.life || .9) * (.6 + Math.random() * .8), age: 0,
      });
    }
  }
  confetti(x, y, n, colors) {
    this.add(x, y, n, 'flake', colors, { speed: 420, lift: 190, size: 5, life: 1.6, grav: 780 });
  }
  spark(x, y, n, colors) {
    this.add(x, y, n, 'dot', colors, { speed: 180, lift: 30, size: 3.4, life: .7, grav: 260, drag: .93 });
  }
  step(dt) {
    for (const p of this.list) {
      p.age += dt;
      p.vy += p.grav * dt;
      p.vx *= p.drag; p.vy *= p.drag;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    }
    this.list = this.list.filter((p) => p.age < p.life);
  }
  draw() {
    for (const p of this.list) {
      const k = clamp(1 - p.age / p.life, 0, 1);
      ctx.save();
      ctx.globalAlpha = k;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.col;
      if (p.kind === 'flake') ctx.fillRect(-p.r, -p.r*1.5, p.r*2, p.r*3);
      else if (p.kind === 'leaf') { wobbleEllipse(0, 0, p.r*1.8, p.r*.8, 0, p.r, .6); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(0, 0, p.r * k, 0, TAU); ctx.fill(); }
      ctx.restore();
    }
  }
  clear() { this.list.length = 0; }
}

/* ───────── صدا (بدون فایل صوتی) ───────── */

const sfx = {
  ac: null, on: true,
  _c() {
    if (!this.on) return null;
    if (!this.ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; this.ac = new A(); }
    if (this.ac.state === 'suspended') this.ac.resume();
    return this.ac;
  },
  tone(f, dur = .16, type = 'sine', gain = .13, delay = 0) {
    const c = this._c(); if (!c) return;
    const t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(t0 + dur + .04);
  },
  tap()  { this.tone(430, .07, 'triangle', .09); },
  place(){ this.tone(620, .11, 'sine', .12); },
  pop()  { this.tone(760, .09, 'sine', .11); },
  slide(){ this.tone(240, .22, 'sine', .07); },
  good() { [523, 659, 784].forEach((f,i) => this.tone(f, .22, 'sine', .13, i*.07)); },
  win()  { [523, 659, 784, 1047].forEach((f,i) => this.tone(f, .34, 'triangle', .13, i*.10)); },
  nope() { this.tone(180, .2, 'sawtooth', .07); },
  tick() { this.tone(1100, .04, 'square', .05); },
};

/* ───────── قطعه‌های آماده ───────── */

function star(x, y, r, col, rot = 0) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = col;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI/2 + i * Math.PI/5;
    const rr = i % 2 ? r * .45 : r;
    const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/** دکمهٔ کاغذی. hovered را خودِ بازی می‌دهد؛ اینجا فقط کشیده می‌شود. */
/** رنگ را روشن‌تر (k>0) یا تیره‌تر (k<0) می‌کند. */
function shade(col, k) {
  const c = String(col).trim();
  let r, g2, b2;
  if (c[0] === '#') {
    const h = c.length === 4 ? c[1]+c[1]+c[2]+c[2]+c[3]+c[3] : c.slice(1, 7);
    r = parseInt(h.slice(0,2), 16); g2 = parseInt(h.slice(2,4), 16); b2 = parseInt(h.slice(4,6), 16);
  } else {
    const m = c.match(/[\d.]+/g);
    if (!m || m.length < 3) return col;
    r = +m[0]; g2 = +m[1]; b2 = +m[2];
  }
  const f = (v) => Math.round(clamp(k < 0 ? v * (1 + k) : v + (255 - v) * k, 0, 255));
  return 'rgb(' + f(r) + ',' + f(g2) + ',' + f(b2) + ')';
}

function button(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 3 : 0;
  const fill = o.disabled ? (o.off || '#bcaa92') : (hot ? (o.hotFill || o.fill) : o.fill);
  const r = o.r === undefined ? 14 : o.r;
  /* لبهٔ زیرینِ تیره — دکمه از صفحه بیرون می‌زند */
  ctx.fillStyle = shade(fill, -.36);
  wobbleRect(b.x, b.y + dy + 7, b.w, b.h, r, b.x + b.y, 2);
  ctx.fill();
  withShadow(hot ? 22 : 14, hot ? 5 : 8, .32, () => {
    ctx.fillStyle = fill;
    wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2);
    ctx.fill();
  });
  /* حجم: روشن از بالا، تیره به پایین */
  ctx.save();
  ctx.beginPath(); wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2); ctx.clip();
  const g = ctx.createLinearGradient(0, b.y + dy, 0, b.y + dy + b.h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.45, 'rgba(255,255,255,.04)');
  g.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = g;
  ctx.fillRect(b.x, b.y + dy, b.w, b.h);
  /* برقِ باریکِ لبهٔ بالا */
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.fillRect(b.x + r, b.y + dy + 2, b.w - r * 2, 2);
  ctx.restore();
  text(label, b.x + b.w/2, b.y + b.h/2 + dy - (o.sub ? 9 : 0), {
    size: o.size || 26, color: o.color || '#fdf6e8', family: o.family || 'Lalezar',
  });
  if (o.sub) text(o.sub, b.x + b.w/2, b.y + b.h/2 + dy + 17,
    { size: 14, color: o.subColor || 'rgba(255,255,255,.88)' });
}

/** دکمهٔ گرد کوچک (مثل + و −). */
function roundButton(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 2 : 0;
  withShadow(10, hot ? 3 : 5, .3, () => {
    ctx.fillStyle = o.disabled ? '#cbbba3' : (hot ? (o.hotFill || o.fill) : o.fill);
    wobbleCircle(b.x, b.y + dy, b.r, b.x, 1.4);
    ctx.fill();
  });
  text(label, b.x, b.y + dy - 1,
    { size: o.size || 32, color: o.disabled ? '#a8988a' : (o.color || '#fdf6e8'), family: 'Lalezar' });
}

/** پرده‌ی تمام‌صفحه: برای شروعِ پرده و برای جشنِ پایان. */
function overlay(o) {
  const k = easeOut(clamp(o.t / .5, 0, 1));
  ctx.fillStyle = `rgba(30, 22, 16, ${.66 * k})`;
  ctx.fillRect(0, 0, SW, SH);

  const w = o.w || 700, h = o.h || 290;
  const x = (SW - w) / 2, y = o.y || (SH * .22);
  const s = lerp(.9, 1, easeBack(clamp(o.t / .65, 0, 1)));
  ctx.save();
  ctx.translate(SW/2, y + h/2);
  ctx.scale(s, s);
  ctx.translate(-SW/2, -(y + h/2));

  withShadow(30, 14, .42, () => {
    ctx.fillStyle = o.paper || '#fbf3e2';
    wobbleRect(x, y, w, h, 18, 121, 2.4);
    ctx.fill();
  });
  ctx.fillStyle = o.band || '#c8434f';
  wobbleRect(x, y, w, 12, 6, 123, 1);
  ctx.fill();

  if (o.icon) o.icon(SW/2, y + 56);
  text(o.title, SW/2, y + (o.icon ? 108 : 62),
    { size: o.titleSize || 36, color: o.ink || '#43291b', family: 'Lalezar', alpha: k });
  textWrap(o.body, SW/2, y + (o.icon ? 158 : 116), w - 90,
    { size: 19, color: o.inkSoft || '#8a6a52', alpha: k });
  ctx.restore();

  button(o.btn, o.btnLabel, { hot: o.btnHot, fill: o.btnFill || '#7fa356', hotFill: o.btnHotFill || '#8fb45f', size: 28 });
}

/** پیامِ کوتاهِ بالای صحنه. */
class Toast {
  constructor() { this.msg = null; this.t = 0; this.kind = 'info'; }
  say(msg, kind = 'info') { this.msg = msg; this.kind = kind; this.t = 2.6; }
  step(dt) { if (this.t > 0) { this.t -= dt; if (this.t <= 0) this.msg = null; } }
  draw(y = 24, colors = {}) {
    if (!this.msg) return;
    const k = clamp(this.t, 0, 1) * clamp((2.6 - this.t) * 5, 0, 1);
    ctx.save();
    ctx.globalAlpha = k;
    ctx.font = `700 19px "Vazirmatn", Tahoma, sans-serif`;
    const w = ctx.measureText(this.msg).width + 76;
    const fill = this.kind === 'good' ? (colors.good || '#7fa356')
               : this.kind === 'bad' ? (colors.bad || '#c8434f')
               : (colors.info || '#fbf3e2');
    paper(SW/2 - w/2, y, w, 48, fill, 151, 12, .3);
    text(this.msg, SW/2, y + 25,
      { size: 19, color: this.kind === 'info' ? (colors.ink || '#43291b') : '#fff8ec' });
    ctx.restore();
  }
}

/* ───────── آموزشِ پرده‌ای ─────────
   پرده‌هایی که منتظرِ کارِ بچه نیستند با یک ضربه جلو می‌روند. تایمر فقط
   پشتیبان است؛ بچهٔ کلاس سومی باید فرصتِ خواندن داشته باشد، نه اینکه
   متن قبل از تمام شدنِ خواندنش برود.                                    */

/** اگر پردهٔ فعلی خواندنی است، ضربه را می‌خورد و می‌رود پردهٔ بعد. */
function tutTap(tut, tapSteps, lastStep) {
  if (!tut.on || tapSteps.indexOf(tut.step) < 0) return false;
  if (tut.step >= lastStep) tut.on = false;
  else { tut.step++; tut.t = 0; }
  sfx.tap();
  return true;
}

/** نشانهٔ «برای ادامه بزن» — زیرِ کارتِ آموزش. */
function tutMore(cx, y, t, ink = '#3a2a18', bg = 'rgba(255, 250, 238, .94)') {
  ctx.save();
  ctx.globalAlpha = .62 + .38 * Math.sin(t * 3.2);
  ctx.font = '700 15px "Vazirmatn", Tahoma, sans-serif';
  const label = 'برای ادامه، هرجا را بزن';
  const w = ctx.measureText(label).width + 40, h = 32, x = cx - w / 2, r = 16;
  withShadow(10, 4, .3, () => {
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath(); ctx.fill();
  });
  text(label, cx, y + h / 2, { size: 15, color: ink });
  ctx.restore();
}

/** فونت‌ها را می‌آورد و بعد بازی را شروع می‌کند.
    مهم: هر دو راه (رسیدنِ فونت و مهلتِ پشتیبان) ممکن است برسند، ولی
    شروع فقط باید یک بار انجام شود؛ وگرنه دو حلقهٔ فریم راه می‌افتد و
    بازی دوبرابر سریع می‌شود. */
function whenFontsReady(start) {
  let done = false;
  const go = () => { if (done) return; done = true; start(); };
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('400 40px Lalezar'),
      document.fonts.load('700 20px Vazirmatn'),
      document.fonts.load('900 20px Vazirmatn'),
    ]).then(go, go);
    setTimeout(go, 2600);
  } else go();
}

/** حلقهٔ فریم با dtِ محدودشده. */
/* ───────── کیفیتِ خودکار ─────────
   اگر دستگاه کُند بود، اوّل درخشش و بعد رنگ‌بندی خاموش می‌شود تا بازی
   روان بماند. روی دستگاهِ قوی همه‌چیز روشن است. */
let QUALITY = 2;
let _fAcc = 0, _fN = 0, _qHold = 0;

function _qualityTick(gap) {
  if (gap <= 0 || gap > 200) return;
  _fAcc += gap; _fN++;
  if (_fN < 45) return;
  const avg = _fAcc / _fN;
  _fAcc = 0; _fN = 0;
  if (_qHold > 0) { _qHold--; return; }
  /* فاصلهٔ بالا و پایین باید باز باشد، وگرنه کیفیت بین دو پله بالا و
     پایین می‌پرد و بازی مدام تغییرِ ظاهر می‌دهد. */
  const before = QUALITY;
  if (avg > 21 && QUALITY > 0) { QUALITY--; _qHold = 4; }
  else if (avg < 13.5 && QUALITY < 2) { QUALITY++; _qHold = 10; }
  /* در پایین‌ترین کیفیت، صحنه را با نقطه‌های کمتر می‌کشیم */
  if (before !== QUALITY && (before === 0 || QUALITY === 0) && _refit) _refit();
}

/* یک حلقه، نه بیشتر — دو حلقه یعنی زمانِ بازی دوبرابر می‌گذرد.

   MOTION: تا پیش از این، به‌خاطرِ باگِ دو حلقه، همهٔ بازی‌ها عملاً با
   سرعتِ دو برابر اجرا می‌شدند و زمان‌بندی‌ها هم با همان حس تنظیم شده
   بودند. حالا که باگ رفع شده، سرعتِ درست (یک برابر) کُند به نظر
   می‌رسد. این ضریب جانِ حرکت‌ها را برمی‌گرداند، ولی نه تا آن دو برابرِ
   تصادفی. فقط روی جانِ حرکت اثر دارد، نه روی هیچ قانونِ علمی. */
const MOTION = 1.45;
let _looping = false;
function runLoop(step) {
  if (_looping) return;
  _looping = true;
  let last = performance.now();
  const frame = (now) => {
    const gap = now - last;
    /* بریدنِ بعد از ضرب، تا یک فریمِ کُند پرشِ بزرگ نسازد */
    const dt = Math.min(gap / 1000 * MOTION, 1/15);
    last = now;
    _qualityTick(gap);
    step(dt);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

/* ═════════════════ بازی ═════════════════ */
/* ═══════════════════════════════════════════════════════════════════════
   کارگاهِ آینه — علومِ سوم، درس ۸ «جست‌وجو کنیم و بسازیم»  (بازی)

   کتاب می‌گوید با یک لولهٔ مقوّایی، یک بادکنک، زَرورق و چند حلقه‌کش
   خودت آینه بساز؛ بعد بادکنک را به بیرون بکش و به داخل فشار بده و
   ببین تصویرت چه می‌شود.

   اینجا همان کار است: اوّل آینه را می‌سازی — بادکنک را می‌بُری، روی
   لوله می‌کشی، کش می‌اندازی و چروک‌هایش را صاف می‌کنی — و بعد با
   پمپِ کوچک، غشا را فرو می‌بری یا بیرون می‌آوری.

   ── درستیِ فیزیکی ───────────────────────────────────────────────
   غشای کشیده‌شده یک «کلاهکِ کره» است. اگر شعاعِ دهانه a و بلندیِ
   برآمدگی s باشد، شعاعِ خمیدگیِ آن از هندسه به دست می‌آید:

           شعاعِ خمیدگی = (a² + s²) ÷ (۲s) ،   کانون = شعاع ÷ ۲

   و تصویر از همان قانونِ آینهٔ کروی می‌آید:
           ۱/فاصلهٔ جسم + ۱/فاصلهٔ تصویر = ۱/کانون
           بزرگ‌نمایی = − فاصلهٔ تصویر ÷ فاصلهٔ جسم

   پس هرچه بیشتر فشار بدهی، آینه گودتر و کانون نزدیک‌تر می‌شود؛ و
   همان‌طور که کتاب می‌پرسد، تصویر با فاصلهٔ جسم هم عوض می‌شود.
   بازی هیچ‌کدام از این‌ها را نمی‌گوید — فقط می‌گذارد ببینی.
   ═══════════════════════════════════════════════════════════════════════ */

const SCENE_W = 1200, SCENE_H = 760;
const HUD_H = 56;

const P = {
  bg:    '#1d1a26', bgLo: '#141119', bgHi: '#2b2636',
  wood:  '#8f6a42', woodDk: '#543d24', woodLt: '#b98d5c',
  tube:  '#c9a077', tubeDk: '#8d6b48',
  balloon: '#e2607f', balloonDk: '#a8394f', balloonLt: '#ff9db4',
  foil:  '#dfe8f2', foilDk: '#8d9bb0', foilLo: '#5b697d',
  band:  '#6ac0a8', bandDk: '#3d8571',
  paper: '#fbf6ea', card: '#ffffff',
  ink:   '#241d2c', inkSoft: '#7d7590',
  good:  '#5fb07f', bad: '#cd6a52', gold: '#e0a63f', accent: '#7f9fd8',
  toyA:  '#e05a4c', toyB: '#4f7fc4', toyC: '#f0c34a', skin: '#eebb90',
};

/* ───────── قانونِ آینهٔ ساخته‌شده ───────── */

const APER = 40;              /* شعاعِ دهانهٔ لوله، میلی‌متر */
const S_MAX = 14;             /* بیشترین فرورفتگی یا برآمدگی، میلی‌متر */
const FLAT_S = .4;            /* کمتر از این، غشا تخت است */

/** شعاعِ خمیدگیِ کلاهکِ کره از هندسه. */
const radiusOf = (s) => (APER * APER + s * s) / (2 * Math.abs(s));
/** کانون؛ مثبت برای فرورفته، منفی برای برآمده، بی‌نهایت برای تخت. */
function focalOf(s) {
  if (Math.abs(s) < FLAT_S) return Infinity;
  const f = radiusOf(s) / 2;
  return s > 0 ? f : -f;
}
/** بزرگ‌نمایی؛ منفی یعنی وارونه. */
function magOf(s, d) {
  const f = focalOf(s);
  if (!isFinite(f)) return 1;
  if (Math.abs(d - f) < 1e-6) return 999;
  const di = d * f / (d - f);
  return -di / d;
}

/* ───────── آلبومِ عکس‌ها ───────── */

const SHOTS = [
  { n: 'به همان اندازه', test: (m) => m > 0 && Math.abs(m - 1) < .06 },
  { n: 'کمی کوچک‌تر',    test: (m) => m > .32 && m < .72 },
  { n: 'خیلی کوچک',      test: (m) => m > 0 && m <= .3 },
  { n: 'بزرگ‌تر',        test: (m) => m > 1.6 },
  { n: 'وارونه',         test: (m) => m < 0 && Math.abs(m) <= 1.2 },
  { n: 'وارونه و بزرگ',  test: (m) => m < 0 && Math.abs(m) > 1.8 },
];

/* ───────── وضعیت ───────── */

const S = {
  phase: 'intro', phaseT: 0,
  build: 0,              /* گامِ ساخت ۰..۳ */
  cut: 0,                /* پیشرفتِ بریدن */
  cutX: null,
  onTube: false,
  bands: [false, false],
  wrinkle: [1, 1, 1, 1, 1, 1],
  s: 0,                  /* فرورفتگیِ غشا، میلی‌متر */
  toy: 300,              /* فاصلهٔ اسباب‌بازی، میلی‌متر */
  album: SHOTS.map(() => 0),
  flash: 0, shotT: 0,
  drag: null,
  t: 0, hover: null, tip: '', tipT: 0, shake: 0,
};

const bits = new Bits();
const toast = new Toast();
const cv = document.getElementById('stage');
initStage(cv, SCENE_W, SCENE_H);
function tip(msg) { S.tip = msg; S.tipT = 3.4; }

const curMag = () => magOf(S.s, S.toy);
const doneAll = () => S.album.every((v) => v);

/* ───────── جای‌ها ───────── */

/* پردهٔ ساخت */
const BAL0 = { x: 340, y: 430 };            /* بادکنک روی میز */
const CUT_Y = 430, CUT_X0 = 190, CUT_X1 = 256;
const TUBE = { x: 830, y: 300, w: 180, h: 250 };   /* لولهٔ ایستاده */
const MOUTH = { x: 920, y: 300, rx: 90, ry: 30 };
const HOOK = [{ x: 200, y: 214 }, { x: 200, y: 300 }];

/* پردهٔ آلبوم */
const VIEW = { x: 24, y: 72, w: 512, h: 548 };
const BEN = { x: 552, y: 72, w: 624, h: 548 };
const MIR = { x: VIEW.x + VIEW.w / 2, y: VIEW.y + 236, r: 168 };
const MX = BEN.x + BEN.w - 96;             /* رأسِ آینه روی نیمکت */
const BY = BEN.y + 330;                    /* خطِ نیمکت */
const PXMM = 1.16;
const TOY_MIN = 46, TOY_MAX = 420;
const PUMP = { x: BEN.x + 40, y: BEN.y + 430, w: BEN.w - 80, h: 40 };
const BTN_SHOT = { x: VIEW.x + 126, y: VIEW.y + 452, w: 260, h: 64 };
const BTN_GO = { x: SCENE_W / 2 - 150, y: 486, w: 300, h: 68 };
const BTN_AGAIN = { x: SCENE_W / 2 - 150, y: 492, w: 300, h: 68 };
function filmRect(i) { return { x: 26 + i * 192, y: 636, w: 180, h: 108 }; }

const toyX = () => MX - S.toy * PXMM;

/* ───────── ورودی ───────── */

function setPump(px) {
  const u = clamp((px - PUMP.x) / PUMP.w, 0, 1);
  let s = (u * 2 - 1) * S_MAX;
  if (Math.abs(s) < FLAT_S) s = 0;
  S.s = Math.round(s * 10) / 10;
}
const pumpX = () => PUMP.x + PUMP.w * (S.s / S_MAX + 1) / 2;

function setToy(px) { S.toy = clamp(Math.round((MX - px) / PXMM), TOY_MIN, TOY_MAX); }

function takeShot() {
  const m = curMag();
  for (let i = 0; i < SHOTS.length; i++) {
    if (S.album[i] || !SHOTS[i].test(m)) continue;
    S.album[i] = 1;
    S.flash = .5; S.shotT = 1.2;
    sfx.good();
    bits.confetti(MIR.x, MIR.y, 22, [P.gold, P.card, P.accent]);
    if (doneAll()) { S.phase = 'won'; S.phaseT = 0; sfx.win(); }
    else toast.say(SHOTS[i].n, 'good');
    return;
  }
  tip('این تصویر هنوز به هیچ‌کدام از قاب‌ها نمی‌خورد.');
  S.shake = .12; sfx.nope();
}

cv.addEventListener('pointermove', (e) => {
  const p = toStage(e);
  if (S.drag === 'pump') { setPump(p.x); return; }
  if (S.drag === 'toy') { setToy(p.x); return; }
  if (S.drag === 'cut' && S.build === 0) {
    if (Math.abs(p.y - CUT_Y) < 46 && p.x > CUT_X0 - 40 && p.x < CUT_X1 + 40) {
      const u = clamp((p.x - CUT_X0) / (CUT_X1 - CUT_X0), 0, 1);
      if (S.cutX === null || u > S.cutX) { S.cut = Math.max(S.cut, u); S.cutX = u; }
      if (S.cut >= .96) { S.build = 1; S.drag = null; sfx.pop(); }
    }
    return;
  }
  if (S.drag === 'bal' && S.build === 1) {
    S.balP = p;
    if (Math.hypot(p.x - MOUTH.x, (p.y - MOUTH.y) * 1.6) < 90) {
      S.onTube = true; S.build = 2; S.drag = null; sfx.place();
    }
    return;
  }
  if (typeof S.drag === 'object' && S.drag && S.drag.k === 'band') {
    S.drag.p = p;
    if (Math.hypot(p.x - MOUTH.x, (p.y - MOUTH.y - 30) * 1.4) < 96) {
      S.bands[S.drag.i] = true;
      S.drag = null;
      sfx.place();
      if (S.bands.every(Boolean)) S.build = 3;
    }
    return;
  }
  if (S.drag === 'smooth' && S.build === 3) {
    let n = 0;
    S.wrinkle.forEach((w, i) => {
      if (!w) return;
      const q = wrinkleAt(i);
      if (Math.hypot(p.x - q.x, p.y - q.y) < 34) { S.wrinkle[i] = 0; sfx.tick(); }
      else n++;
    });
    if (S.wrinkle.every((w) => !w)) {
      S.build = 4; S.drag = null;
      S.phase = 'album'; S.phaseT = 0;
      sfx.win();
      bits.confetti(MOUTH.x, MOUTH.y, 30, [P.foil, P.gold, P.band]);
    }
    return;
  }
  S.hover = null;
  if (S.phase === 'intro') { if (inRect(p, BTN_GO)) S.hover = BTN_GO; }
  else if (S.phase === 'won') { if (inRect(p, BTN_AGAIN)) S.hover = BTN_AGAIN; }
  else if (S.phase === 'album') {
    if (inRect(p, BTN_SHOT)) S.hover = { k: 'shot' };
    if (Math.abs(p.x - pumpX()) < 30 && Math.abs(p.y - (PUMP.y + PUMP.h / 2)) < 34) S.hover = { k: 'pump' };
    if (Math.abs(p.x - toyX()) < 40 && p.y > BY - 120 && p.y < BY + 16) S.hover = { k: 'toy' };
  }
  cv.style.cursor = S.hover ? 'pointer' : 'default';
});

cv.addEventListener('pointerdown', (e) => {
  const p = toStage(e);
  const cap = () => { try { cv.setPointerCapture(e.pointerId); } catch { /* ok */ } };
  if (S.phase === 'intro') { if (inRect(p, BTN_GO)) { S.phase = 'build'; S.phaseT = 0; sfx.good(); } return; }
  if (S.phase === 'won') {
    if (inRect(p, BTN_AGAIN)) {
      S.phase = 'intro'; S.phaseT = 0;
      S.build = 0; S.cut = 0; S.cutX = null; S.onTube = false;
      S.bands = [false, false]; S.wrinkle = [1, 1, 1, 1, 1, 1];
      S.album = SHOTS.map(() => 0); S.s = 0; S.toy = 300;
      sfx.tap();
    }
    return;
  }
  if (S.phase === 'build') {
    if (S.build === 0 && Math.abs(p.y - CUT_Y) < 60 && p.x > CUT_X0 - 60 && p.x < CUT_X1 + 60) {
      S.drag = 'cut'; S.cutX = null; cap(); sfx.slide(); return;
    }
    if (S.build === 1 && Math.hypot(p.x - BAL0.x, p.y - BAL0.y) < 110) {
      S.drag = 'bal'; S.balP = p; cap(); sfx.tap(); return;
    }
    if (S.build === 2) {
      for (let i = 0; i < 2; i++) {
        if (S.bands[i]) continue;
        if (Math.hypot(p.x - HOOK[i].x, p.y - HOOK[i].y) < 46) {
          S.drag = { k: 'band', i, p }; cap(); sfx.tap(); return;
        }
      }
    }
    if (S.build === 3) { S.drag = 'smooth'; cap(); return; }
    return;
  }
  /* پردهٔ آلبوم */
  if (inRect(p, BTN_SHOT)) { takeShot(); return; }
  if (inRect(p, PUMP) || (Math.abs(p.x - pumpX()) < 30 && Math.abs(p.y - (PUMP.y + PUMP.h / 2)) < 36)) {
    S.drag = 'pump'; setPump(p.x); cap(); sfx.tap(); return;
  }
  if (Math.abs(p.x - toyX()) < 40 && p.y > BY - 120 && p.y < BY + 16) {
    S.drag = 'toy'; cap(); sfx.tap(); return;
  }
});

function release() {
  if (S.drag === 'cut' && S.cut < .96) S.cut = 0;
  S.drag = null; S.cutX = null;
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
addEventListener('blur', release);

/* ───────── حلقه ───────── */

function step(dt) {
  S.t += dt;
  if (S.phaseT < 9) S.phaseT += dt;
  if (S.tipT > 0) S.tipT -= dt;
  if (S.flash > 0) S.flash -= dt;
  if (S.shotT > 0) S.shotT -= dt;
  if (S.shake > 0) S.shake = Math.max(0, S.shake - dt);
  bits.step(dt);
  toast.step(dt);
  draw();
}

whenFontsReady(() => runLoop(step));

/* ───────── ابزارِ نقاشی ───────── */

function rrPath(x, y, w, h, r) {
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function numText(str, x, y, o = {}) {
  ctx.save();
  ctx.direction = 'ltr';
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = o.color || P.ink;
  ctx.font = `${o.weight || 700} ${o.size || 18}px "${o.family || 'Vazirmatn'}", Tahoma, sans-serif`;
  ctx.fillText(str, x, y);
  ctx.restore();
}

function glowRing(x, y, r, col) {
  ctx.save();
  ctx.globalAlpha = .35 + .3 * Math.sin(S.t * 3.4);
  ctx.strokeStyle = col; ctx.lineWidth = 4;
  ctx.setLineDash([10, 9]);
  ctx.lineDashOffset = -S.t * 24;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
  ctx.restore();
}

function wrinkleAt(i) {
  const a = i * TAU / 6 + .4;
  return { x: MOUTH.x + Math.cos(a) * 52, y: MOUTH.y + Math.sin(a) * 17 };
}

/* ───────── اسباب‌بازی ───────── */

/** آدمکِ اسباب‌بازی: کلاهِ قرمز بالا، پایهٔ زرد پایین — وارونگی پیداست. */
function drawToy(x, base, k, flip) {
  ctx.save();
  ctx.translate(x, base);
  ctx.scale(k, (flip ? -1 : 1) * k);
  /* پایه */
  ctx.fillStyle = P.toyC;
  ctx.beginPath(); rrPath(-30, -14, 60, 14, 5); ctx.fill();
  /* تن */
  ctx.fillStyle = P.toyB;
  ctx.beginPath(); rrPath(-22, -62, 44, 50, 12); ctx.fill();
  /* دست‌ها */
  ctx.strokeStyle = P.toyB; ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-20, -50); ctx.lineTo(-34, -34); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(20, -50); ctx.lineTo(34, -34); ctx.stroke();
  /* سر */
  ctx.fillStyle = P.skin;
  ctx.beginPath(); ctx.arc(0, -78, 19, 0, TAU); ctx.fill();
  ctx.fillStyle = '#3a2b22';
  ctx.beginPath(); ctx.arc(-6, -80, 2.6, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(6, -80, 2.6, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#8a5a44'; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.arc(0, -74, 7, .3, Math.PI - .3); ctx.stroke();
  /* کلاه */
  ctx.fillStyle = P.toyA;
  ctx.beginPath(); rrPath(-24, -100, 48, 8, 4); ctx.fill();
  ctx.beginPath(); rrPath(-14, -116, 28, 18, 6); ctx.fill();
  ctx.restore();
}

/* ───────── پردهٔ ساخت ───────── */

function drawBalloon(x, y, cut) {
  ctx.save();
  ctx.translate(x, y);
  /* گردنِ بادکنک — با پیشرفتِ بریدن کوتاه می‌شود */
  if (cut < .96) {
    ctx.fillStyle = P.balloonDk;
    ctx.beginPath();
    rrPath(-166 + cut * 76, -15, 96 - cut * 76, 30, 11);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.14)';
    ctx.beginPath(); rrPath(-160 + cut * 76, -11, 84 - cut * 76, 6, 3); ctx.fill();
  }
  const g = ctx.createRadialGradient(-24, -30, 8, 0, 0, 96);
  g.addColorStop(0, P.balloonLt); g.addColorStop(.55, P.balloon); g.addColorStop(1, P.balloonDk);
  ctx.fillStyle = g;
  wobbleEllipse(0, 0, 86, 72, 0, 7, 2.4); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  wobbleEllipse(-30, -32, 20, 12, -.5, 3, 1.2); ctx.fill();
  ctx.restore();
}

function drawScissors(x, y, a) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(a);
  ctx.strokeStyle = P.foilDk; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(34, -13); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(34, 13); ctx.stroke();
  ctx.strokeStyle = P.gold; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(-18, -11, 11, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.arc(-18, 11, 11, 0, TAU); ctx.stroke();
  ctx.fillStyle = P.foil;
  ctx.beginPath(); ctx.arc(-6, 0, 4, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawTube(withSkin) {
  /* بدنهٔ لوله */
  ctx.save();
  ctx.beginPath(); rrPath(MOUTH.x - MOUTH.rx, MOUTH.y, MOUTH.rx * 2, TUBE.h, 8); ctx.clip();
  ctx.fillStyle = texWood(P.tube, '#8a6238');
  ctx.fillRect(MOUTH.x - MOUTH.rx, MOUTH.y, MOUTH.rx * 2, TUBE.h);
  ctx.fillStyle = vgrad(MOUTH.y, MOUTH.y + TUBE.h, 'rgba(255,255,255,.16)', 'rgba(0,0,0,.42)');
  ctx.fillRect(MOUTH.x - MOUTH.rx, MOUTH.y, MOUTH.rx * 2, TUBE.h);
  ctx.restore();
  /* دهانه */
  ctx.fillStyle = withSkin ? P.balloon : '#2a2130';
  ctx.beginPath(); ctx.ellipse(MOUTH.x, MOUTH.y, MOUTH.rx, MOUTH.ry, 0, 0, TAU); ctx.fill();
  if (withSkin) {
    const g = ctx.createRadialGradient(MOUTH.x - 26, MOUTH.y - 8, 6, MOUTH.x, MOUTH.y, MOUTH.rx);
    g.addColorStop(0, P.balloonLt); g.addColorStop(1, P.balloonDk);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(MOUTH.x, MOUTH.y, MOUTH.rx, MOUTH.ry, 0, 0, TAU); ctx.fill();
  }
  ctx.strokeStyle = P.tubeDk; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(MOUTH.x, MOUTH.y, MOUTH.rx, MOUTH.ry, 0, 0, TAU); ctx.stroke();
  /* حلقه‌های کش */
  S.bands.forEach((on, i) => {
    if (!on) return;
    ctx.strokeStyle = i ? P.bandDk : P.band; ctx.lineWidth = 9;
    ctx.beginPath();
    ctx.ellipse(MOUTH.x, MOUTH.y + 24 + i * 18, MOUTH.rx + 3, MOUTH.ry + 2, 0, 0, TAU);
    ctx.stroke();
  });
}

const BUILD_TIP = [
  'با قیچی، سرِ بادکنک را ببُر — انگشتت را روی خطِ چین بکش.',
  'بادکنک را بکش روی دهانهٔ لوله.',
  'دو حلقه‌کش را بینداز دورِ لوله.',
  'چروک‌ها را با انگشت صاف کن.',
];

function drawBuild() {
  ctx.save();
  /* میزِ کار */
  ctx.beginPath(); rrPath(24, 96, SCENE_W - 48, SCENE_H - 140, 18); ctx.clip();
  ctx.fillStyle = texWood(P.wood, P.woodDk);
  ctx.fillRect(24, 96, SCENE_W - 48, SCENE_H - 140);
  ctx.fillStyle = vgrad(96, SCENE_H - 44, 'rgba(255,255,255,.1)', 'rgba(0,0,0,.4)');
  ctx.fillRect(24, 96, SCENE_W - 48, SCENE_H - 140);
  ctx.restore();

  drawTube(S.onTube);

  /* بادکنک */
  if (!S.onTube) {
    const at = (S.drag === 'bal' && S.balP) ? S.balP : BAL0;
    drawBalloon(at.x, at.y, S.cut);
    if (S.build === 0) {
      /* خطِ چینِ برش و قیچی */
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 3;
      ctx.setLineDash([9, 8]);
      ctx.beginPath(); ctx.moveTo(CUT_X0, CUT_Y); ctx.lineTo(CUT_X1, CUT_Y); ctx.stroke();
      ctx.restore();
      drawScissors(CUT_X0 + (CUT_X1 - CUT_X0) * S.cut, CUT_Y - 26, .2 + Math.sin(S.t * 8) * .12 * (S.drag === 'cut' ? 1 : 0));
      glowRing((CUT_X0 + CUT_X1) / 2, CUT_Y, 76, P.gold);
    } else if (S.build === 1) {
      glowRing(BAL0.x, BAL0.y, 96, P.gold);
      glowRing(MOUTH.x, MOUTH.y, 100, P.band);
    }
  }

  /* حلقه‌های کشِ روی قلّاب */
  if (S.build <= 2) {
    HOOK.forEach((h, i) => {
      if (S.bands[i]) return;
      ctx.fillStyle = P.woodDk;
      ctx.beginPath(); rrPath(h.x - 5, h.y - 34, 10, 26, 4); ctx.fill();
      ctx.fillStyle = P.foilDk;
      ctx.beginPath(); ctx.arc(h.x, h.y - 34, 7, 0, TAU); ctx.fill();
      const at = (S.drag && S.drag.k === 'band' && S.drag.i === i) ? S.drag.p : h;
      ctx.strokeStyle = i ? P.bandDk : P.band; ctx.lineWidth = 9;
      ctx.beginPath(); ctx.ellipse(at.x, at.y, 30, 22, .3, 0, TAU); ctx.stroke();
      if (S.build === 2) glowRing(at.x, at.y, 44, P.band);
    });
  }

  /* چروک‌ها */
  if (S.build === 3) {
    S.wrinkle.forEach((w, i) => {
      if (!w) return;
      const q = wrinkleAt(i);
      ctx.strokeStyle = 'rgba(80,30,50,.6)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      for (let k = -1; k <= 1; k++) {
        ctx.beginPath();
        ctx.moveTo(q.x - 12, q.y + k * 5);
        ctx.quadraticCurveTo(q.x, q.y + k * 5 - 5, q.x + 12, q.y + k * 5);
        ctx.stroke();
      }
      glowRing(q.x, q.y, 26, P.gold);
    });
  }

  /* راهنمای گام */
  const w = 620;
  paper(SCENE_W / 2 - w / 2, 108, w, 52, P.paper, 61, 14, .35);
  text(BUILD_TIP[Math.min(S.build, 3)], SCENE_W / 2, 134, { size: 18, color: P.ink });
  /* دانه‌های گام */
  for (let i = 0; i < 4; i++) {
    ctx.fillStyle = i < S.build ? P.good : (i === S.build ? P.gold : 'rgba(255,255,255,.3)');
    ctx.beginPath(); ctx.arc(SCENE_W / 2 - 30 + i * 20, 176, 7, 0, TAU); ctx.fill();
  }
}

/* ───────── پردهٔ آلبوم ───────── */

/** نیمرخِ غشا: کلاهکِ کره با همان بلندیِ s. */
function membranePath(cx, cy, halfH, s) {
  const px = s * PXMM * 4;          /* بلندیِ برآمدگی روی صحنه */
  ctx.beginPath();
  ctx.moveTo(cx, cy - halfH);
  ctx.quadraticCurveTo(cx - px * 1.34, cy, cx, cy + halfH);
}

function drawBench() {
  ctx.fillStyle = '#221d2c';
  ctx.beginPath(); rrPath(BEN.x, BEN.y, BEN.w, BEN.h, 16); ctx.fill();
  ctx.strokeStyle = 'rgba(127,159,216,.22)'; ctx.lineWidth = 2;
  ctx.beginPath(); rrPath(BEN.x, BEN.y, BEN.w, BEN.h, 16); ctx.stroke();
  text('روی میز', BEN.x + BEN.w - 24, BEN.y + 28, { size: 16, color: 'rgba(240,236,250,.5)', align: 'right' });

  /* میزِ چوبی */
  ctx.save();
  ctx.beginPath(); rrPath(BEN.x + 20, BY, BEN.w - 40, 16, 6); ctx.clip();
  ctx.fillStyle = texWood(P.wood, P.woodDk);
  ctx.fillRect(BEN.x + 20, BY, BEN.w - 40, 16);
  ctx.restore();

  /* خط‌کشِ سانتی‌متری */
  const ry = BY + 34;
  line2(BEN.x + 28, ry, MX, ry, 'rgba(240,236,250,.3)', 2);
  for (let c = 0; c <= 44; c += 2) {
    const x = MX - c * 10 * PXMM;
    if (x < BEN.x + 28) break;
    const big = c % 10 === 0;
    line2(x, ry, x, ry + (big ? 11 : 6), 'rgba(240,236,250,.3)', big ? 2 : 1.3);
    if (big && c) numText(fa(c), x, ry + 24, { size: 12, color: 'rgba(240,236,250,.55)' });
  }

  /* لولهٔ خوابیده با غشا رو به چپ */
  const halfH = 64;
  ctx.save();
  ctx.beginPath(); rrPath(MX, BY - halfH - 6, 86, halfH * 2 + 12, 10); ctx.clip();
  ctx.fillStyle = texWood(P.tube, '#8a6238');
  ctx.fillRect(MX, BY - halfH - 6, 86, halfH * 2 + 12);
  ctx.fillStyle = vgrad(BY - halfH, BY + halfH, 'rgba(255,255,255,.14)', 'rgba(0,0,0,.4)');
  ctx.fillRect(MX, BY - halfH - 6, 86, halfH * 2 + 12);
  ctx.restore();
  /* غشای زَرورقی */
  ctx.save();
  ctx.lineCap = 'round';
  ctx.strokeStyle = P.foilLo; ctx.lineWidth = 12;
  membranePath(MX, BY, halfH, S.s); ctx.stroke();
  const g = ctx.createLinearGradient(MX - 30, 0, MX + 10, 0);
  g.addColorStop(0, P.foil); g.addColorStop(1, P.foilDk);
  ctx.strokeStyle = g; ctx.lineWidth = 7;
  membranePath(MX, BY, halfH, S.s); ctx.stroke();
  ctx.restore();
  /* کش‌ها */
  for (let i = 0; i < 2; i++) {
    ctx.strokeStyle = i ? P.bandDk : P.band; ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(MX + 14 + i * 16, BY - halfH - 4);
    ctx.lineTo(MX + 14 + i * 16, BY + halfH + 4);
    ctx.stroke();
  }

  /* اسباب‌بازی روی میز */
  const tx = toyX();
  contact(tx, BY + 2, 40, 9, .5);
  drawToy(tx, BY, .78, false);
  if (S.hover && S.hover.k === 'toy') glowRing(tx, BY - 46, 62, P.gold);

  /* فاصله */
  line2(tx, BY + 20, MX, BY + 20, 'rgba(224,166,63,.7)', 2, [7, 6]);
  const mid = (tx + MX) / 2;
  ctx.fillStyle = 'rgba(251,246,234,.92)';
  ctx.beginPath(); rrPath(mid - 62, BY - 178, 124, 34, 9); ctx.fill();
  numText(fa(Math.round(S.toy / 10)), mid - 16, BY - 161, { size: 18, color: P.ink });
  text('سانتی‌متر', mid + 26, BY - 161, { size: 12, color: P.inkSoft });

  /* پمپ */
  ctx.fillStyle = 'rgba(255,255,255,.08)';
  ctx.beginPath(); rrPath(PUMP.x, PUMP.y + 12, PUMP.w, 16, 8); ctx.fill();
  ctx.fillStyle = 'rgba(127,159,216,.35)';
  ctx.beginPath(); ctx.arc(PUMP.x + PUMP.w / 2, PUMP.y + 20, 5, 0, TAU); ctx.fill();
  const px = pumpX();
  withShadow(12, 5, .5, () => {
    ctx.fillStyle = S.hover && S.hover.k === 'pump' ? P.gold : '#c9cede';
    wobbleRect(px - 22, PUMP.y - 6, 44, PUMP.h + 12, 10, 7, 1.2); ctx.fill();
  }, '0,0,0');
  ctx.strokeStyle = 'rgba(40,30,60,.45)'; ctx.lineWidth = 2;
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath();
    ctx.moveTo(px + i * 7, PUMP.y + 4); ctx.lineTo(px + i * 7, PUMP.y + PUMP.h - 4);
    ctx.stroke();
  }
  text('بیرون بکش', PUMP.x + 56, PUMP.y + 56, { size: 14, color: 'rgba(240,236,250,.55)' });
  text('فشار بده', PUMP.x + PUMP.w - 52, PUMP.y + 56, { size: 14, color: 'rgba(240,236,250,.55)' });
}

function line2(x0, y0, x1, y1, col, w, dash) {
  ctx.save();
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  if (dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  ctx.restore();
}

function drawView() {
  ctx.fillStyle = '#221d2c';
  ctx.beginPath(); rrPath(VIEW.x, VIEW.y, VIEW.w, VIEW.h, 16); ctx.fill();
  ctx.strokeStyle = 'rgba(127,159,216,.22)'; ctx.lineWidth = 2;
  ctx.beginPath(); rrPath(VIEW.x, VIEW.y, VIEW.w, VIEW.h, 16); ctx.stroke();
  text('در آینه چه می‌بینی', VIEW.x + VIEW.w - 24, VIEW.y + 28,
    { size: 16, color: 'rgba(240,236,250,.5)', align: 'right' });

  /* قابِ فلزیِ آینه */
  withShadow(22, 8, .5, () => {
    ctx.fillStyle = P.tubeDk;
    ctx.beginPath(); ctx.arc(MIR.x, MIR.y, MIR.r + 16, 0, TAU); ctx.fill();
  }, '0,0,0');
  ctx.fillStyle = P.band;
  ctx.beginPath(); ctx.arc(MIR.x, MIR.y, MIR.r + 8, 0, TAU); ctx.fill();

  /* رویهٔ آینه */
  ctx.save();
  ctx.beginPath(); ctx.arc(MIR.x, MIR.y, MIR.r, 0, TAU); ctx.clip();
  const dish = clamp(S.s / S_MAX, -1, 1);
  const g = ctx.createRadialGradient(
    MIR.x - 40 * (1 - dish), MIR.y - 46 * (1 - dish), 10,
    MIR.x, MIR.y, MIR.r * 1.1);
  g.addColorStop(0, dish > 0 ? '#8ea3b8' : '#f2f7fc');
  g.addColorStop(.55, '#b9c8dc');
  g.addColorStop(1, dish > 0 ? '#e6eef7' : '#6d7d92');
  ctx.fillStyle = g;
  ctx.fillRect(MIR.x - MIR.r, MIR.y - MIR.r, MIR.r * 2, MIR.r * 2);

  /* تصویرِ اسباب‌بازی */
  const m = curMag();
  const am = Math.abs(m);
  /* بزرگ‌نماییِ خیلی زیاد را فشرده می‌کنیم تا تصویر از قاب بیرون نزند؛
     ترتیبِ بزرگی و وارونگی همان چیزی است که فیزیک می‌گوید. */
  const k = am <= 1.4 ? Math.max(am, .07) : Math.min(2.3, 1.4 + (am - 1.4) * .12);
  ctx.save();
  ctx.globalAlpha = .96;
  drawToy(MIR.x, MIR.y + (m < 0 ? -62 : 62) * k, k, m < 0);
  ctx.restore();

  /* برقِ آینه */
  ctx.globalAlpha = .3;
  ctx.fillStyle = '#ffffff';
  wobbleEllipse(MIR.x - 62, MIR.y - 94, 46, 22, -.5, 3, 2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();

  if (S.flash > 0) {
    ctx.save();
    ctx.globalAlpha = clamp(S.flash * 2, 0, 1);
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(MIR.x, MIR.y, MIR.r, 0, TAU); ctx.fill();
    ctx.restore();
  }

  button(BTN_SHOT, 'عکس بگیر', {
    hot: S.hover && S.hover.k === 'shot', fill: '#b07a2e', hotFill: '#d29a45', size: 26 });
}

function drawFilm() {
  for (let i = 0; i < SHOTS.length; i++) {
    const r = filmRect(i);
    ctx.fillStyle = S.album[i] ? '#f4efe2' : 'rgba(255,255,255,.06)';
    ctx.beginPath(); rrPath(r.x, r.y, r.w, r.h, 12); ctx.fill();
    ctx.strokeStyle = S.album[i] ? P.gold : 'rgba(255,255,255,.18)'; ctx.lineWidth = 2;
    ctx.setLineDash(S.album[i] ? [] : [7, 6]);
    ctx.beginPath(); rrPath(r.x, r.y, r.w, r.h, 12); ctx.stroke();
    ctx.setLineDash([]);
    /* نشانهٔ خواسته: آدمکِ کوچکِ نمونه */
    const kk = [.5, .3, .16, .7, .4, .7][i], fl = i >= 4;
    const ix = r.x + 42;
    ctx.save();
    ctx.globalAlpha = S.album[i] ? 1 : .5;
    drawToy(ix, fl ? r.y + 16 : r.y + r.h - 12, kk, fl);
    ctx.restore();
    text(SHOTS[i].n, r.x + r.w - 12, r.y + 26,
      { size: 14, color: S.album[i] ? P.ink : 'rgba(240,236,250,.7)', align: 'right' });
    if (S.album[i]) {
      ctx.fillStyle = P.good;
      ctx.beginPath(); ctx.arc(r.x + r.w - 20, r.y + r.h - 20, 12, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(r.x + r.w - 26, r.y + r.h - 20);
      ctx.lineTo(r.x + r.w - 22, r.y + r.h - 15);
      ctx.lineTo(r.x + r.w - 14, r.y + r.h - 26);
      ctx.stroke();
    }
  }
}

/* ───────── نوار و پرده‌ها ───────── */

function drawHUD() {
  ctx.fillStyle = '#100d16';
  ctx.fillRect(0, 0, SCENE_W, HUD_H);
  ctx.fillStyle = 'rgba(224,166,63,.22)';
  ctx.fillRect(0, HUD_H - 2, SCENE_W, 2);
  text('کارگاهِ آینه', SCENE_W - 130, HUD_H / 2, { size: 25, family: 'Lalezar', color: P.paper });
  const n = S.album.reduce((a, b) => a + b, 0);
  numText(fa(n) + ' / ' + fa(SHOTS.length), 300, HUD_H / 2, { size: 20, color: P.gold });
  ctx.fillStyle = 'rgba(255,255,255,.14)';
  ctx.beginPath(); rrPath(24, HUD_H - 9, 240, 5, 3); ctx.fill();
  ctx.fillStyle = P.gold;
  ctx.beginPath(); rrPath(24, HUD_H - 9, 240 * (n / SHOTS.length), 5, 3); ctx.fill();
}

function kitIcon(x, y) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = P.tube;
  ctx.beginPath(); rrPath(-30, -16, 60, 44, 8); ctx.fill();
  ctx.fillStyle = P.balloon;
  ctx.beginPath(); ctx.ellipse(0, -16, 30, 11, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = P.band; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.ellipse(0, -2, 32, 12, 0, 0, TAU); ctx.stroke();
  ctx.restore();
}

function drawIntro() {
  overlay({
    t: S.phaseT, w: 860, h: 306, y: 132,
    paper: P.paper, band: P.gold, ink: P.ink, inkSoft: P.inkSoft,
    icon: kitIcon,
    title: 'خودت آینه بساز',
    body: 'یک لولهٔ مقوّایی، یک بادکنک و دو حلقه‌کش.\nاوّل آینه را می‌سازی، بعد با پمپ غشا را فرو می‌بری یا بیرون می‌آوری.\nشش قابِ آلبوم منتظرِ شش‌جور تصویرند.',
    btn: BTN_GO, btnLabel: 'شروع', btnHot: S.hover === BTN_GO,
    btnFill: '#b07a2e', btnHotFill: '#d29a45',
  });
}

function drawWon() {
  overlay({
    t: S.phaseT, w: 820, h: 300, y: 140,
    paper: P.paper, band: P.good, ink: P.ink, inkSoft: P.inkSoft,
    icon: kitIcon,
    title: 'آلبوم پر شد',
    body: 'یک آینه ساختی که هم تخت می‌شود، هم فرورفته، هم برآمده.\nهرچه گودترش کردی تصویر زودتر عوض شد، و فاصلهٔ اسباب‌بازی\nهم کارِ خودش را کرد.',
    btn: BTN_AGAIN, btnLabel: 'از نو', btnHot: S.hover === BTN_AGAIN,
    btnFill: '#b07a2e', btnHotFill: '#d29a45',
  });
}

function draw() {
  beginScene(P.bgLo);
  const g = ctx.createLinearGradient(0, 0, 0, SCENE_H);
  g.addColorStop(0, P.bgHi); g.addColorStop(1, P.bgLo);
  ctx.fillStyle = g; ctx.fillRect(0, 0, SCENE_W, SCENE_H);

  ctx.save();
  if (S.shake > 0) {
    const k = S.shake * 10;
    ctx.translate(Math.sin(S.t * 55) * k, 0);
  }
  if (S.phase === 'build') drawBuild();
  else {
    drawView();
    drawBench();
    drawFilm();
  }
  bits.draw();
  ctx.restore();

  drawHUD();
  toast.draw(HUD_H + 8, { good: P.good, bad: P.bad, info: P.card, ink: P.ink });
  if (S.phase === 'intro') drawIntro();
  if (S.phase === 'won') drawWon();
  if (S.tipT > 0) {
    ctx.save();
    ctx.globalAlpha = clamp(S.tipT, 0, 1);
    const w = 520;
    paper(SCENE_W / 2 - w / 2, 596, w, 40, P.paper, 51, 12, .3);
    text(S.tip, SCENE_W / 2, 616, { size: 16, color: P.ink });
    ctx.restore();
  }
  endScene(.08, 'rgba(8, 6, 14, .44)', 0, .1);
}
