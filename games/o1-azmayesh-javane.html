<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#eef0e4">
<title>آزمایشگاهِ جوانه — زنگ علوم (آزمایش)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>
  /* صفحه نباید هیچ‌جا اسکرول یا زوم شود؛ بازی باید مثل یک برنامه رفتار کند. */
  html, body {
    margin: 0; padding: 0; background: #eef0e4;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body {
    position: fixed; inset: 0;          /* جلوی کشیده‌شدنِ صفحه در سافاریِ گوشی */
    width: 100%; height: 100vh; height: 100dvh;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none; -webkit-touch-callout: none;
  }

  /* گوشیِ عمودی صحنه را ریز می‌کند؛ بچه باید گوشی را بچرخاند. */
  #rotate { display: none; }
  @media (orientation: portrait) and (max-width: 860px) {
    #stage { display: none; }
    #rotate {
      display: flex; position: fixed; inset: 0;
      z-index: 9;
      flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      background: #eef0e4; color: #f6ead2;
      font: 700 20px "Vazirmatn", Tahoma, sans-serif; text-align: center; padding: 32px;
    }
    #rotate svg { animation: tilt 2.4s ease-in-out infinite; }
    @keyframes tilt { 0%, 45% { transform: rotate(0deg); } 65%, 100% { transform: rotate(-90deg); } }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="rotate">
  <svg width="86" height="126" viewBox="0 0 86 126" fill="none" aria-hidden="true">
    <rect x="3" y="3" width="80" height="120" rx="12" stroke="#e8b448" stroke-width="5"/>
    <rect x="15" y="19" width="56" height="88" rx="5" fill="#e8b448" opacity=".28"/>
    <circle cx="43" cy="115" r="4" fill="#e8b448"/>
  </svg>
  <div>گوشی را بچرخان</div>
  <div style="font-weight:400;opacity:.7;font-size:16px">این بازی خوابیده بازی می‌شود</div>
</div>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   هستهٔ مشترکِ بازی‌ها — سبک «کاغذبُری»
   ───────────────────────────────────────────────────────────────────────
   این فایل جعبه‌ابزار است، نه چارچوب: هر بازی حلقه و وضعیت خودش را دارد
   و فقط از این توابع برای کشیدن استفاده می‌کند. دلیلش این است که هر بازی
   باید حس‌وحال خودش را داشته باشد، نه اینکه همه شبیه هم دربیایند.

   قاعده‌های ثابتِ تصویری:
   • نور همیشه از بالا-چپ می‌تابد، پس سایه‌ها به پایین-راست می‌افتند.
   • هیچ لبه‌ای کاملاً صاف نیست؛ همه کمی موج دارند (انگار با قیچی بریده).
   • هیچ خاکستریِ خالصی نداریم؛ همه‌ی خنثی‌ها به گرمیِ صحنه می‌زنند.
   • یک لایه‌ی دانه‌دانه‌ی کاغذ روی کلِ تصویر ضرب می‌شود.
   ═══════════════════════════════════════════════════════════════════════ */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const FA_D = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
const fa = (n) => String(n).replace(/\d/g, (d) => FA_D[+d]);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeIn = (t) => t * t * t;
const easeInOut = (t) => (t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2);
const easeBack = (t) => 1 + 2.7 * Math.pow(t-1, 3) + 1.7 * Math.pow(t-1, 2);
const easeElastic = (t) => t === 0 || t === 1 ? t : Math.pow(2, -9*t) * Math.sin((t*10 - .75) * 2.094) + 1;

/** تصادفِ تکرارپذیر: با یک بذر همیشه همان عدد. برای اینکه تزئین‌ها هر فریم نپرند. */
function noise1(x) {
  const s = Math.sin(x * 127.1) * 43758.5453;
  return s - Math.floor(s);
}
const pick = (arr, seed) => arr[Math.floor(noise1(seed) * arr.length) % arr.length];

/* ───────── بوم و صحنهٔ ثابت ───────── */

let ctx, SW, SH, CV, _refit = null;
let view = { scale: 1, ox: 0, oy: 0, w: 0, h: 0, dpr: 1 };
let _grain = null;

function initStage(canvas, w, h) {
  CV = canvas; SW = w; SH = h;
  ctx = canvas.getContext('2d');

  /* اندازه را از خودِ بوم می‌گیریم نه از innerHeight؛ چون در سافاریِ گوشی
     نوارِ آدرس باز و بسته می‌شود و innerHeight دروغ می‌گوید. */
  const fit = () => {
    const r = canvas.getBoundingClientRect();
    const vw = Math.round(r.width), vh = Math.round(r.height);
    if (vw < 20 || vh < 20) return;
    const dpr = Math.min(devicePixelRatio || 1, QUALITY > 0 ? 2 : 1);
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    const scale = Math.min(vw / SW, vh / SH);
    view = { scale, ox: (vw - SW*scale)/2, oy: (vh - SH*scale)/2, w: vw, h: vh, dpr };
    _grain = buildGrain();
  };
  _refit = fit;
  addEventListener('resize', fit);
  /* چرخاندنِ گوشی: اندازهٔ درست چند لحظه بعد می‌رسد، پس چندبار اندازه می‌گیریم. */
  addEventListener('orientationchange', () => {
    fit(); setTimeout(fit, 140); setTimeout(fit, 460);
  });
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(canvas);

  /* صدا در گوشی فقط بعد از اوّلین لمس اجازهٔ پخش دارد. */
  const unlock = () => { sfx._c(); removeEventListener('pointerdown', unlock); removeEventListener('touchstart', unlock); };
  addEventListener('pointerdown', unlock, { passive: true });
  addEventListener('touchstart', unlock, { passive: true });
  /* نگه‌داشتنِ انگشت نباید منوی مرورگر را باز کند. */
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  fit();
  return ctx;
}

/** قابِ صحنه را باز می‌کند: بعد از این، مختصات همیشه در فضای SW×SH است. */
function beginScene(bg) {
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, view.w, view.h);
  ctx.save();
  ctx.translate(view.ox, view.oy);
  ctx.scale(view.scale, view.scale);
  ctx.beginPath();
  ctx.rect(0, 0, SW, SH);
  ctx.clip();
}

/** بافتِ کاغذ، تیرگیِ گوشه‌ها، رنگ‌بندی و درخششِ نور را می‌گذارد و قاب را می‌بندد. */
function endScene(grainAlpha = .15, vignette = 'rgba(48,28,14,.30)', bloom = .34, grade = .14) {
  if (QUALITY < 1) { grade = 0; grainAlpha *= .5; }
  if (QUALITY < 2) bloom = 0;
  if (grade > 0) {
    /* رنگ‌بندیِ نرم: بالای صحنه گرم‌تر، پایین سردتر — عمق می‌دهد */
    const g = ctx.createLinearGradient(0, 0, 0, SH);
    g.addColorStop(0, `rgba(255, 214, 150, ${grade})`);
    g.addColorStop(.55, 'rgba(255, 255, 255, 0)');
    g.addColorStop(1, `rgba(40, 60, 110, ${grade * .9})`);
    ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalCompositeOperation = 'source-over';
  }
  if (_grain && grainAlpha > 0) {
    ctx.globalCompositeOperation = 'multiply';
    ctx.globalAlpha = grainAlpha;
    ctx.fillStyle = _grain;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
  if (vignette) {
    const g = ctx.createRadialGradient(SW/2, SH/2, SH*.42, SW/2, SH/2, SH*1.05);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, vignette);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
  }
  ctx.restore();
  bloomPass(bloom);
}

/* ───────── درخششِ نور (bloom) ─────────
   قابِ رسم‌شده را کوچک می‌کنیم، دو بار در خودش ضرب می‌کنیم تا فقط
   روشن‌ها بمانند، محوش می‌کنیم و با حالتِ «lighter» رویش می‌گذاریم.
   نتیجه: چراغ‌ها، شعله‌ها و رنگ‌های روشن نور پخش می‌کنند. */
let _bl, _blc, _bl2, _bl2c, _blNo = false, _blTick = 0;

function bloomPass(amount) {
  if (!amount || _blNo || !CV.width) return;
  /* کوچک‌کردن و بزرگ‌کردنِ دوباره، خودش محو می‌کند — از filter خیلی ارزان‌تر است */
  const W = Math.max(4, Math.round(CV.width * .2)), H = Math.max(4, Math.round(CV.height * .2));
  const W2 = Math.max(2, Math.round(W * .28)), H2 = Math.max(2, Math.round(H * .28));
  try {
    if (!_bl) {
      _bl = document.createElement('canvas'); _blc = _bl.getContext('2d');
      _bl2 = document.createElement('canvas'); _bl2c = _bl2.getContext('2d');
      if (!_blc || !_bl2c) { _blNo = true; return; }
    }
    if (_bl.width !== W || _bl.height !== H) { _bl.width = W; _bl.height = H; }
    if (_bl2.width !== W2 || _bl2.height !== H2) { _bl2.width = W2; _bl2.height = H2; }
    /* ساختنِ نور یک قاب در میان کافی است؛ گذاشتنش هر قاب. */
    _blTick = (_blTick + 1) & 1;
    if (!_blTick) {
      _blc.globalCompositeOperation = 'source-over';
      _blc.clearRect(0, 0, W, H);
      _blc.drawImage(CV, 0, 0, W, H);
      _blc.globalCompositeOperation = 'multiply';
      _blc.drawImage(_bl, 0, 0);
      _blc.drawImage(_bl, 0, 0);
      _blc.globalCompositeOperation = 'source-over';
      _bl2c.clearRect(0, 0, W2, H2);
      _bl2c.drawImage(_bl, 0, 0, W2, H2);
    }

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = amount;
    ctx.drawImage(_bl2, 0, 0, CV.width, CV.height);
    ctx.restore();
  } catch (e) { _blNo = true; }
}

/* ───────── لایهٔ ثابت ─────────
   هرچه در صحنه تکان نمی‌خورد را یک‌بار می‌کشیم و بعد فقط کپی می‌کنیم. */
const _layers = {};
function staticLayer(key, w, h, paint) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const L = _layers[key];
  if (L && L.q === q && L.w === w && L.h === h) return L.cv;
  const off = document.createElement('canvas');
  off.width = Math.max(1, Math.round(w * q));
  off.height = Math.max(1, Math.round(h * q));
  const c = off.getContext('2d');
  c.setTransform(q, 0, 0, q, 0, 0);
  const prev = ctx;
  ctx = c;
  try { paint(); } finally { ctx = prev; }
  _layers[key] = { cv: off, q, w, h };
  return off;
}

/* ───────── نورپردازی و بافت ─────────
   کارِ این‌ها این است که هیچ سطحی «تختِ یک‌رنگ» نماند. */

/** شیبِ عمودی: بالا روشن، پایین تیره. */
function vgrad(y0, y1, top, bot) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, top); g.addColorStop(1, bot);
  return g;
}

/** حجمِ کروی: نور از بالا-چپ، سایه در پایین-راست. */
function ball(cx, cy, r, lit, base, dark) {
  const g = ctx.createRadialGradient(cx - r * .38, cy - r * .42, r * .06, cx, cy, r * 1.06);
  g.addColorStop(0, lit); g.addColorStop(.45, base); g.addColorStop(1, dark);
  return g;
}

/** لبهٔ روشنِ بالا-چپِ یک مسیر — همان «rim light». */
function rim(pathFn, col, w = 2.2) {
  ctx.save();
  ctx.beginPath(); pathFn();
  ctx.clip();
  ctx.beginPath(); pathFn();
  ctx.strokeStyle = col; ctx.lineWidth = w * 2; ctx.lineJoin = 'round';
  ctx.translate(-w * .5, -w * .6);
  ctx.stroke();
  ctx.restore();
}

/** سایهٔ چسبیده به زمین — چیزها را روی سطح می‌نشاند. */
function contact(cx, cy, rx, ry, alpha = .26) {
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
  g.addColorStop(0, `rgba(20, 12, 6, ${alpha})`);
  g.addColorStop(1, 'rgba(20, 12, 6, 0)');
  ctx.save();
  ctx.fillStyle = g;
  ctx.translate(cx, cy); ctx.scale(1, ry / Math.max(rx, ry));
  ctx.beginPath(); ctx.arc(0, 0, Math.max(rx, ry), 0, TAU); ctx.fill();
  ctx.restore();
}

const _tex = {};
/** بافتِ تکرارشونده؛ یک‌بار ساخته و بعد از حافظه خوانده می‌شود. */
function texture(key, w, h, paint) {
  if (_tex[key]) return _tex[key];
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const c = off.getContext('2d');
  paint(c, w, h);
  _tex[key] = ctx.createPattern(off, 'repeat');
  return _tex[key];
}

/** رگهٔ چوب. */
function texWood(base, grain) {
  return texture('w' + base + grain, 120, 120, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = grain; c.lineWidth = 1.4;
    for (let i = 0; i < 9; i++) {
      c.globalAlpha = .18 + noise1(i * 3.1) * .3;
      c.beginPath();
      const y0 = i * 14 + noise1(i) * 6;
      c.moveTo(0, y0);
      for (let x = 0; x <= w; x += 10) c.lineTo(x, y0 + Math.sin(x * .09 + i) * 2.6);
      c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** تارِ پارچه. */
function texCloth(base, thread) {
  return texture('c' + base + thread, 16, 16, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = thread; c.lineWidth = 1; c.globalAlpha = .5;
    for (let i = 0; i < w; i += 4) {
      c.beginPath(); c.moveTo(i, 0); c.lineTo(i, h); c.stroke();
      c.beginPath(); c.moveTo(0, i); c.lineTo(w, i); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** دانه‌های سنگ. */
function texStone(base, spec) {
  return texture('s' + base + spec, 90, 90, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) {
      c.globalAlpha = .05 + noise1(i * 1.7) * .16;
      c.fillStyle = spec;
      const r = .6 + noise1(i * 5.3) * 1.9;
      c.beginPath();
      c.arc(noise1(i * 2.1) * w, noise1(i * 3.7 + 1) * h, r, 0, TAU);
      c.fill();
    }
    c.globalAlpha = 1;
  });
}

/** الیافِ کاغذ. */
function texPaper(base) {
  return texture('p' + base, 100, 100, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 130; i++) {
      c.globalAlpha = .04 + noise1(i * 2.3) * .07;
      c.strokeStyle = i % 2 ? '#ffffff' : '#5a4326';
      c.lineWidth = .9;
      const x = noise1(i * 1.3) * w, y = noise1(i * 4.1 + 2) * h;
      const a = noise1(i * 7.7) * TAU, l = 4 + noise1(i * 9.1) * 12;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

function buildGrain() {
  const s = 260;
  const off = document.createElement('canvas');
  off.width = off.height = s;
  const c = off.getContext('2d');
  const img = c.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    const v = 214 + Math.random() * 41;
    img.data[i*4] = v; img.data[i*4+1] = v; img.data[i*4+2] = v; img.data[i*4+3] = 255;
  }
  c.putImageData(img, 0, 0);
  return ctx.createPattern(off, 'repeat');
}

function toStage(e) {
  const r = CV.getBoundingClientRect();
  return {
    x: (e.clientX - r.left - view.ox) / view.scale,
    y: (e.clientY - r.top - view.oy) / view.scale,
  };
}

const inRect = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
const inCircle = (p, b, pad = 0) => Math.hypot(p.x - b.x, p.y - b.y) <= b.r + pad;

/* ───────── قلم‌های کاغذبُری ───────── */

/** دایره‌ای که انگار با قیچی بریده شده. */
function wobbleCircle(cx, cy, r, seed = 0, amp = 2.2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const rr = r + Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp * .45;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** بیضیِ ناصاف — برای چیزهایی که گرد نیستند ولی نرم‌اند. */
function wobbleEllipse(cx, cy, rx, ry, rot = 0, seed = 0, amp = 2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const w = 1 + (Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp*.45) / Math.max(rx, ry);
    const px = Math.cos(a) * rx * w, py = Math.sin(a) * ry * w;
    const x = cx + px*Math.cos(rot) - py*Math.sin(rot);
    const y = cy + px*Math.sin(rot) + py*Math.cos(rot);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** مستطیلِ گِرد با گوشه‌های کمی کج. */
function wobbleRect(x, y, w, h, r = 12, seed = 0, amp = 1.6) {
  const j = (k) => (noise1(seed*9.7 + k) - .5) * amp * 2;
  ctx.beginPath();
  ctx.moveTo(x + r + j(1), y + j(2));
  ctx.lineTo(x + w - r + j(3), y + j(4));
  ctx.quadraticCurveTo(x + w + j(5), y + j(6), x + w + j(7), y + r + j(8));
  ctx.lineTo(x + w + j(9), y + h - r + j(10));
  ctx.quadraticCurveTo(x + w + j(11), y + h + j(12), x + w - r + j(13), y + h + j(14));
  ctx.lineTo(x + r + j(15), y + h + j(16));
  ctx.quadraticCurveTo(x + j(17), y + h + j(18), x + j(19), y + h - r + j(20));
  ctx.lineTo(x + j(21), y + r + j(22));
  ctx.quadraticCurveTo(x + j(23), y + j(24), x + r + j(1), y + j(2));
  ctx.closePath();
}

/** سایهٔ نرم؛ نور از بالا-چپ. */
function withShadow(blur, dy, alpha, fn, hue = '78, 46, 24') {
  ctx.save();
  ctx.shadowColor = `rgba(${hue}, ${alpha})`;
  ctx.shadowBlur = blur;
  ctx.shadowOffsetY = dy;
  ctx.shadowOffsetX = dy * .35;
  fn();
  ctx.restore();
}

/** یک برگه‌ی کاغذ با سایه — پایه‌ی همه‌ی کارت‌ها و تابلوها. */
function paper(x, y, w, h, fill, seed = 1, r = 12, shadow = .26) {
  withShadow(16, 7, shadow, () => {
    ctx.fillStyle = fill;
    wobbleRect(x, y, w, h, r, seed, 2);
    ctx.fill();
  });
  /* الیافِ کاغذ و لبهٔ روشن، تا سطح تخت نماند */
  ctx.save();
  ctx.beginPath(); wobbleRect(x, y, w, h, r, seed, 2); ctx.clip();
  ctx.globalAlpha = .5;
  ctx.fillStyle = texPaper(fill);
  ctx.fillRect(x, y, w, h);
  ctx.globalAlpha = 1;
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.4, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(90,60,20,.1)');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
}

function text(str, x, y, o = {}) {
  const size = o.size || 20;
  const fam = o.family || 'Vazirmatn';
  ctx.save();
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.font = `${fam === 'Lalezar' ? '400' : (o.weight || 700)} ${size}px "${fam}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.baseline || 'middle';
  ctx.fillStyle = o.color || '#43291b';
  ctx.direction = 'rtl';
  if (o.stroke) {
    ctx.lineWidth = o.strokeWidth || 5;
    ctx.strokeStyle = o.stroke;
    ctx.lineJoin = 'round';
    ctx.strokeText(str, x, y, o.maxWidth);
  }
  ctx.fillText(str, x, y, o.maxWidth);
  ctx.restore();
}

/** متنِ چندخطی که خودش می‌شکند. ارتفاعِ اشغال‌شده را برمی‌گرداند. */
function textWrap(str, x, y, maxW, o = {}) {
  const size = o.size || 19, lh = o.lineHeight || size * 1.7;
  ctx.font = `${o.weight || 700} ${size}px "${o.family || 'Vazirmatn'}", Tahoma, sans-serif`;
  const lines = [];
  for (const para of str.split('\n')) {
    let line = '';
    for (const wd of para.split(' ')) {
      const t = line ? line + ' ' + wd : wd;
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = wd; }
      else line = t;
    }
    lines.push(line);
  }
  lines.forEach((l, i) => text(l, x, y + i * lh, o));
  return lines.length * lh;
}

/* ───────── ذره‌ها ───────── */

class Bits {
  constructor() { this.list = []; }
  add(x, y, n, kind, colors, opts = {}) {
    for (let i = 0; i < n; i++) {
      const a = opts.dir !== undefined ? opts.dir + (Math.random()-.5) * (opts.spread || 1) : Math.random() * TAU;
      const sp = (opts.speed || 200) * (.4 + Math.random());
      this.list.push({
        kind, x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - (opts.lift || 0),
        r: (opts.size || 4) * (.5 + Math.random()),
        rot: Math.random() * TAU, vr: (Math.random()-.5) * 10,
        col: colors[(Math.random() * colors.length) | 0],
        grav: opts.grav === undefined ? 620 : opts.grav,
        drag: opts.drag || .995,
        life: (opts.life || .9) * (.6 + Math.random() * .8), age: 0,
      });
    }
  }
  confetti(x, y, n, colors) {
    this.add(x, y, n, 'flake', colors, { speed: 420, lift: 190, size: 5, life: 1.6, grav: 780 });
  }
  spark(x, y, n, colors) {
    this.add(x, y, n, 'dot', colors, { speed: 180, lift: 30, size: 3.4, life: .7, grav: 260, drag: .93 });
  }
  step(dt) {
    for (const p of this.list) {
      p.age += dt;
      p.vy += p.grav * dt;
      p.vx *= p.drag; p.vy *= p.drag;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    }
    this.list = this.list.filter((p) => p.age < p.life);
  }
  draw() {
    for (const p of this.list) {
      const k = clamp(1 - p.age / p.life, 0, 1);
      ctx.save();
      ctx.globalAlpha = k;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.col;
      if (p.kind === 'flake') ctx.fillRect(-p.r, -p.r*1.5, p.r*2, p.r*3);
      else if (p.kind === 'leaf') { wobbleEllipse(0, 0, p.r*1.8, p.r*.8, 0, p.r, .6); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(0, 0, p.r * k, 0, TAU); ctx.fill(); }
      ctx.restore();
    }
  }
  clear() { this.list.length = 0; }
}

/* ───────── صدا (بدون فایل صوتی) ───────── */

const sfx = {
  ac: null, on: true,
  _c() {
    if (!this.on) return null;
    if (!this.ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; this.ac = new A(); }
    if (this.ac.state === 'suspended') this.ac.resume();
    return this.ac;
  },
  tone(f, dur = .16, type = 'sine', gain = .13, delay = 0) {
    const c = this._c(); if (!c) return;
    const t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(t0 + dur + .04);
  },
  tap()  { this.tone(430, .07, 'triangle', .09); },
  place(){ this.tone(620, .11, 'sine', .12); },
  pop()  { this.tone(760, .09, 'sine', .11); },
  slide(){ this.tone(240, .22, 'sine', .07); },
  good() { [523, 659, 784].forEach((f,i) => this.tone(f, .22, 'sine', .13, i*.07)); },
  win()  { [523, 659, 784, 1047].forEach((f,i) => this.tone(f, .34, 'triangle', .13, i*.10)); },
  nope() { this.tone(180, .2, 'sawtooth', .07); },
  tick() { this.tone(1100, .04, 'square', .05); },
};

/* ───────── قطعه‌های آماده ───────── */

function star(x, y, r, col, rot = 0) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = col;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI/2 + i * Math.PI/5;
    const rr = i % 2 ? r * .45 : r;
    const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/** دکمهٔ کاغذی. hovered را خودِ بازی می‌دهد؛ اینجا فقط کشیده می‌شود. */
/** رنگ را روشن‌تر (k>0) یا تیره‌تر (k<0) می‌کند. */
function shade(col, k) {
  const c = String(col).trim();
  let r, g2, b2;
  if (c[0] === '#') {
    const h = c.length === 4 ? c[1]+c[1]+c[2]+c[2]+c[3]+c[3] : c.slice(1, 7);
    r = parseInt(h.slice(0,2), 16); g2 = parseInt(h.slice(2,4), 16); b2 = parseInt(h.slice(4,6), 16);
  } else {
    const m = c.match(/[\d.]+/g);
    if (!m || m.length < 3) return col;
    r = +m[0]; g2 = +m[1]; b2 = +m[2];
  }
  const f = (v) => Math.round(clamp(k < 0 ? v * (1 + k) : v + (255 - v) * k, 0, 255));
  return 'rgb(' + f(r) + ',' + f(g2) + ',' + f(b2) + ')';
}

function button(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 3 : 0;
  const fill = o.disabled ? (o.off || '#bcaa92') : (hot ? (o.hotFill || o.fill) : o.fill);
  const r = o.r === undefined ? 14 : o.r;
  /* لبهٔ زیرینِ تیره — دکمه از صفحه بیرون می‌زند */
  ctx.fillStyle = shade(fill, -.36);
  wobbleRect(b.x, b.y + dy + 7, b.w, b.h, r, b.x + b.y, 2);
  ctx.fill();
  withShadow(hot ? 22 : 14, hot ? 5 : 8, .32, () => {
    ctx.fillStyle = fill;
    wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2);
    ctx.fill();
  });
  /* حجم: روشن از بالا، تیره به پایین */
  ctx.save();
  ctx.beginPath(); wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2); ctx.clip();
  const g = ctx.createLinearGradient(0, b.y + dy, 0, b.y + dy + b.h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.45, 'rgba(255,255,255,.04)');
  g.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = g;
  ctx.fillRect(b.x, b.y + dy, b.w, b.h);
  /* برقِ باریکِ لبهٔ بالا */
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.fillRect(b.x + r, b.y + dy + 2, b.w - r * 2, 2);
  ctx.restore();
  text(label, b.x + b.w/2, b.y + b.h/2 + dy - (o.sub ? 9 : 0), {
    size: o.size || 26, color: o.color || '#fdf6e8', family: o.family || 'Lalezar',
  });
  if (o.sub) text(o.sub, b.x + b.w/2, b.y + b.h/2 + dy + 17,
    { size: 14, color: o.subColor || 'rgba(255,255,255,.88)' });
}

/** دکمهٔ گرد کوچک (مثل + و −). */
function roundButton(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 2 : 0;
  withShadow(10, hot ? 3 : 5, .3, () => {
    ctx.fillStyle = o.disabled ? '#cbbba3' : (hot ? (o.hotFill || o.fill) : o.fill);
    wobbleCircle(b.x, b.y + dy, b.r, b.x, 1.4);
    ctx.fill();
  });
  text(label, b.x, b.y + dy - 1,
    { size: o.size || 32, color: o.disabled ? '#a8988a' : (o.color || '#fdf6e8'), family: 'Lalezar' });
}

/** پرده‌ی تمام‌صفحه: برای شروعِ پرده و برای جشنِ پایان. */
function overlay(o) {
  const k = easeOut(clamp(o.t / .5, 0, 1));
  ctx.fillStyle = `rgba(30, 22, 16, ${.66 * k})`;
  ctx.fillRect(0, 0, SW, SH);

  const w = o.w || 700, h = o.h || 290;
  const x = (SW - w) / 2, y = o.y || (SH * .22);
  const s = lerp(.9, 1, easeBack(clamp(o.t / .65, 0, 1)));
  ctx.save();
  ctx.translate(SW/2, y + h/2);
  ctx.scale(s, s);
  ctx.translate(-SW/2, -(y + h/2));

  withShadow(30, 14, .42, () => {
    ctx.fillStyle = o.paper || '#fbf3e2';
    wobbleRect(x, y, w, h, 18, 121, 2.4);
    ctx.fill();
  });
  ctx.fillStyle = o.band || '#c8434f';
  wobbleRect(x, y, w, 12, 6, 123, 1);
  ctx.fill();

  if (o.icon) o.icon(SW/2, y + 56);
  text(o.title, SW/2, y + (o.icon ? 108 : 62),
    { size: o.titleSize || 36, color: o.ink || '#43291b', family: 'Lalezar', alpha: k });
  textWrap(o.body, SW/2, y + (o.icon ? 158 : 116), w - 90,
    { size: 19, color: o.inkSoft || '#8a6a52', alpha: k });
  ctx.restore();

  button(o.btn, o.btnLabel, { hot: o.btnHot, fill: o.btnFill || '#7fa356', hotFill: o.btnHotFill || '#8fb45f', size: 28 });
}

/** پیامِ کوتاهِ بالای صحنه. */
class Toast {
  constructor() { this.msg = null; this.t = 0; this.kind = 'info'; }
  say(msg, kind = 'info') { this.msg = msg; this.kind = kind; this.t = 2.6; }
  step(dt) { if (this.t > 0) { this.t -= dt; if (this.t <= 0) this.msg = null; } }
  draw(y = 24, colors = {}) {
    if (!this.msg) return;
    const k = clamp(this.t, 0, 1) * clamp((2.6 - this.t) * 5, 0, 1);
    ctx.save();
    ctx.globalAlpha = k;
    ctx.font = `700 19px "Vazirmatn", Tahoma, sans-serif`;
    const w = ctx.measureText(this.msg).width + 76;
    const fill = this.kind === 'good' ? (colors.good || '#7fa356')
               : this.kind === 'bad' ? (colors.bad || '#c8434f')
               : (colors.info || '#fbf3e2');
    paper(SW/2 - w/2, y, w, 48, fill, 151, 12, .3);
    text(this.msg, SW/2, y + 25,
      { size: 19, color: this.kind === 'info' ? (colors.ink || '#43291b') : '#fff8ec' });
    ctx.restore();
  }
}

/* ───────── آموزشِ پرده‌ای ─────────
   پرده‌هایی که منتظرِ کارِ بچه نیستند با یک ضربه جلو می‌روند. تایمر فقط
   پشتیبان است؛ بچهٔ کلاس سومی باید فرصتِ خواندن داشته باشد، نه اینکه
   متن قبل از تمام شدنِ خواندنش برود.                                    */

/** اگر پردهٔ فعلی خواندنی است، ضربه را می‌خورد و می‌رود پردهٔ بعد. */
function tutTap(tut, tapSteps, lastStep) {
  if (!tut.on || tapSteps.indexOf(tut.step) < 0) return false;
  if (tut.step >= lastStep) tut.on = false;
  else { tut.step++; tut.t = 0; }
  sfx.tap();
  return true;
}

/** نشانهٔ «برای ادامه بزن» — زیرِ کارتِ آموزش. */
function tutMore(cx, y, t, ink = '#3a2a18', bg = 'rgba(255, 250, 238, .94)') {
  ctx.save();
  ctx.globalAlpha = .62 + .38 * Math.sin(t * 3.2);
  ctx.font = '700 15px "Vazirmatn", Tahoma, sans-serif';
  const label = 'برای ادامه، هرجا را بزن';
  const w = ctx.measureText(label).width + 40, h = 32, x = cx - w / 2, r = 16;
  withShadow(10, 4, .3, () => {
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath(); ctx.fill();
  });
  text(label, cx, y + h / 2, { size: 15, color: ink });
  ctx.restore();
}

/** فونت‌ها را می‌آورد و بعد بازی را شروع می‌کند.
    مهم: هر دو راه (رسیدنِ فونت و مهلتِ پشتیبان) ممکن است برسند، ولی
    شروع فقط باید یک بار انجام شود؛ وگرنه دو حلقهٔ فریم راه می‌افتد و
    بازی دوبرابر سریع می‌شود. */
function whenFontsReady(start) {
  let done = false;
  const go = () => { if (done) return; done = true; start(); };
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('400 40px Lalezar'),
      document.fonts.load('700 20px Vazirmatn'),
      document.fonts.load('900 20px Vazirmatn'),
    ]).then(go, go);
    setTimeout(go, 2600);
  } else go();
}

/** حلقهٔ فریم با dtِ محدودشده. */
/* ───────── کیفیتِ خودکار ─────────
   اگر دستگاه کُند بود، اوّل درخشش و بعد رنگ‌بندی خاموش می‌شود تا بازی
   روان بماند. روی دستگاهِ قوی همه‌چیز روشن است. */
let QUALITY = 2;
let _fAcc = 0, _fN = 0, _qHold = 0;

function _qualityTick(gap) {
  if (gap <= 0 || gap > 200) return;
  _fAcc += gap; _fN++;
  if (_fN < 45) return;
  const avg = _fAcc / _fN;
  _fAcc = 0; _fN = 0;
  if (_qHold > 0) { _qHold--; return; }
  const before = QUALITY;
  if (avg > 25 && QUALITY > 0) { QUALITY--; _qHold = 3; }
  else if (avg < 18.5 && QUALITY < 2) { QUALITY++; _qHold = 6; }
  /* در پایین‌ترین کیفیت، صحنه را با نقطه‌های کمتر می‌کشیم */
  if (before !== QUALITY && (before === 0 || QUALITY === 0) && _refit) _refit();
}

/* یک حلقه، نه بیشتر — دو حلقه یعنی زمانِ بازی دوبرابر می‌گذرد. */
let _looping = false;
function runLoop(step) {
  if (_looping) return;
  _looping = true;
  let last = performance.now();
  const frame = (now) => {
    const gap = now - last;
    const dt = Math.min(gap / 1000, 1/20);
    last = now;
    _qualityTick(gap);
    step(dt);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

/* ═════════════════ بازی ═════════════════ */
/* ═══════════════════════════════════════════════════════════════════════
   آزمایشگاهِ جوانه — علوم سوم، درس ۱ «زنگ علوم» (آزمایش)
   ───────────────────────────────────────────────────────────────────────
   آزمایشِ کتاب: «مادر پرسید کدام قسمتِ مزرعه برای کاشتنِ دانه‌های کاهو
   مناسب‌تر است؟ … مریم و سارا تعدادِ یکسانی دانهٔ کاهو را در دو ظرفِ
   کاملاً مشابه کاشتند. یکی جلوی خانه (۲۵ درجه) و یکی پشتِ خانه (۱۵
   درجه)… هر روز جوانه‌ها را شمردند.»

   اینجا همان آزمایش، مرحله‌به‌مرحله، با قانونِ واقعیِ جوانه‌زنی:

   ▸ سرعتِ جوانه‌زنی با دما بالا و پایین می‌رود. برای کاهو دمای کمینه
     نزدیکِ ۲ درجه، بهینه نزدیکِ ۲۴ و بیشینه نزدیکِ ۳۰ درجه است. مدلِ
     «دماهای اصلی» (cardinal temperatures) همین است: نرخ از Tmin تا
     Topt بالا می‌رود و از Topt تا Tmax سریع می‌افتد؛ بیرونِ این بازه
     صفر است. برای همین است که ۲۵ درجه از ۱۵ درجه تندتر جوانه می‌زند —
     همان چیزی که در جدولِ کتاب می‌بینیم — ولی ۳۵ درجه اصلاً جوانه
     نمی‌زند (خوابِ گرماییِ کاهو).
   ▸ آب هم لازم است: خاکِ خشک جوانه نمی‌دهد و خاکِ غرقاب هم دانه را
     خفه می‌کند (ریشه به هوا نیاز دارد).
   ▸ نور برای کاهو مهم است: بذرِ کاهو «نوردوست» است (photoblastic). در
     روشنایی فیتوکرومِ بذر فعّال می‌شود و جوانه می‌زند؛ در تاریکی خوابِ
     بذر می‌ماند — و هرچه هوا گرم‌تر باشد این خواب عمیق‌تر است. برای
     همین در تاریکی و ۲۵ درجه تقریباً چیزی سبز نمی‌شود، ولی در تاریکی و
     ۱۵ درجه بیشترشان بالاخره سبز می‌شوند.
   ▸ «رنگِ ظرف» عمداً گذاشته شده و هیچ اثری ندارد — تا بچّه ببیند هر
     عاملی که عوض می‌کنی لزوماً مهم نیست و نتیجهٔ «فرقی نکرد» هم یک
     نتیجهٔ درستِ علمی است.
   ▸ همهٔ دانه‌ها با هم جوانه نمی‌زنند؛ پخشِ زمانی دارند و درصدی هم
     هیچ‌وقت جوانه نمی‌زنند.

   قانونِ اصلیِ درس هم رعایت می‌شود: تا وقتی بیش از یک چیز را بینِ دو
   ظرف عوض کرده باشی، آزمایشگاه نتیجه‌گیری را قبول نمی‌کند — چون معلوم
   نیست کدام عامل اثر داشته. این همان «آزمایشِ منصفانه» است.
   ═══════════════════════════════════════════════════════════════════════ */

const SCENE_W = 1200, SCENE_H = 760;
const HUD_H = 52;

const P = {
  wall:  '#eef0e4', wallLo: '#cfd4c0', wallHi: '#f8faf0',
  wood:  '#b08a52', woodDk: '#7a5a2e', woodLt: '#d8b47e',
  steel: '#8d99a3', steelDk: '#5c6870', steelLt: '#c3ced6',
  soil:  '#6b4a2c', soilDk: '#3f2a15', soilLt: '#8d6742',
  leaf:  '#5da24e', leafDk: '#356b2c', leafLt: '#8fc97a',
  glass: '#cfe8ef',
  paper: '#fbfaf2', card: '#ffffff', ink: '#25302a', inkSoft: '#7d8a80',
  warm:  '#d9663f', cool: '#4a86c4',
  good:  '#4e8f5c', bad: '#c04a34', gold: '#c9962c', accent: '#3f7d8c',
};

/* ───────── قانونِ جوانه‌زنی ─────────
   مدلِ دماهای اصلی + اثرِ رطوبت. خروجی: نرخِ جوانه‌زنیِ روزانه.
   Tmin = ۲، Topt = ۲۴، Tmax = ۳۰ (کاهو).                              */

const T_MIN = 2, T_OPT = 24, T_MAX = 30;
const MAX_FRAC = .92;            /* چند درصد از دانه‌ها اصلاً توانِ جوانه‌زدن دارند */

/** ضریبِ دما: صفر بیرونِ بازه، ۱ در دمای بهینه. */
function fTemp(T) {
  if (T <= T_MIN || T >= T_MAX) return 0;
  if (T <= T_OPT) return (T - T_MIN) / (T_OPT - T_MIN);
  return (T_MAX - T) / (T_MAX - T_OPT);
}
/** ضریبِ آب: خاکِ خشک و خاکِ غرقاب هر دو بد است؛ بهینه نزدیکِ نیمه‌مرطوب. */
function fWater(w) {
  if (w <= .08) return 0;
  if (w >= .98) return .06;                 /* غرقاب: تقریباً هیچ */
  const x = (w - .55) / .34;
  return clamp(1 - x * x, .05, 1);
}
/** ضریبِ نور: بذرِ کاهو نوردوست است. روشنایی جوانه‌زنی را راه می‌اندازد؛
    در تاریکی هرچه گرم‌تر، خوابِ بذر عمیق‌تر (خوابِ گرمایی). */
function fLight(on, T) {
  if (on) return 1;
  return clamp(1 - (T - 12) / 16, .06, .85);
}
/** رنگِ ظرف هیچ اثری بر جوانه‌زنی ندارد — و باید هم نداشته باشد. */
const DISH_N = ['سفالی', 'آبی'];
const DISH_C = ['#b9714a', '#5a8fb8'];

/** شمارِ دانه‌های جوانه‌زده تا روزِ day، با نرخِ r در روز و تأخیرِ lag. */
function sprouted(seeds, r, day, lag) {
  if (r <= 0) return 0;
  const t = Math.max(0, day - lag);
  return Math.round(seeds * MAX_FRAC * (1 - Math.exp(-r * t)));
}

function makePot() {
  return { seeds: 20, temp: 25, water: .55, light: true, dish: 0, day: 0 };
}
const potRate = (p) => .62 * fTemp(p.temp) * fWater(p.water) * fLight(p.light, p.temp);
/* هرچه از دمای بهینه دورتر، دیرتر هم شروع می‌کند — نه فقط کندتر پیش می‌رود */
const potLag = (p) => 1 + 3.2 * (1 - fTemp(p.temp));
const potCount = (p, day) => sprouted(p.seeds, potRate(p), day === undefined ? p.day : day, potLag(p));

/* ───────── وضعیت ───────── */

const STEPS = [
  { n: 'پرسش',   t: 'می‌خواهیم اثرِ چه چیزی را بفهمیم؟' },
  { n: 'دو ظرف', t: 'دو ظرف را بچین — فقط یک چیز را فرق بده.' },
  { n: 'روزها',  t: 'روزها را جلو ببر و جوانه‌ها را ببین.' },
  { n: 'جدول',   t: 'شمارشِ هر روز در جدول نشسته است.' },
  { n: 'نتیجه',  t: 'کدام ظرف بهتر بود؟ رویش بزن.' },
];

const QUESTIONS = [
  { id: 'temp',  n: 'گرمای هوا', f: 'temp' },
  { id: 'water', n: 'آبِ خاک',   f: 'water' },
  { id: 'light', n: 'روشنایی',   f: 'light' },
  { id: 'dish',  n: 'رنگِ ظرف',   f: 'dish'  },
];

const S = {
  stepI: 0,
  q: 0,
  pot: [makePot(), makePot()],
  day: 0, running: false, runT: 0,
  note: [],
  verdict: null, fairMsg: 0,
  drag: null,
  t: 0, hover: null, tip: '', tipT: 0, flash: 0,
};

const cv = document.getElementById('stage');
initStage(cv, SCENE_W, SCENE_H);
whenFontsReady(() => runLoop(step));

/* ───────── منصفانه بودنِ آزمایش ───────── */

/** کدام عامل‌ها بینِ دو ظرف فرق دارند؟ */
function diffs() {
  const a = S.pot[0], b = S.pot[1], out = [];
  if (a.seeds !== b.seeds) out.push('seeds');
  if (Math.abs(a.temp - b.temp) > .5) out.push('temp');
  if (Math.abs(a.water - b.water) > .02) out.push('water');
  if (a.light !== b.light) out.push('light');
  if (a.dish !== b.dish) out.push('dish');
  return out;
}
const fair = () => diffs().length === 1;
const testing = () => diffs()[0] || null;

/* ───────── حلقه ───────── */

function step(dt) {
  S.t += dt;
  if (S.tipT > 0) S.tipT -= dt;
  if (S.fairMsg > 0) S.fairMsg -= dt;
  if (S.flash > 0) S.flash -= dt;
  if (S.running) {
    S.runT += dt;
    if (S.runT >= .5) { S.runT = 0; nextDay(); }
  }
  draw();
}

function nextDay() {
  if (S.day >= 12) { S.running = false; return; }
  S.day++;
  S.pot[0].day = S.day; S.pot[1].day = S.day;
  S.note.push({ day: S.day, a: potCount(S.pot[0]), b: potCount(S.pot[1]) });
  sfx.tone(400 + S.day * 16, .06, 'sine', .05);
  if (S.stepI === 2 && S.day >= 7) S.stepI = 3;
  if (S.day >= 12) S.running = false;
}

function resetRun() {
  S.day = 0; S.note = []; S.running = false; S.runT = 0;
  S.pot[0].day = 0; S.pot[1].day = 0;
  S.verdict = null;
}

function tip(msg) { S.tip = msg; S.tipT = 3.6; }

/** نتیجه‌گیری: فقط وقتی آزمایش منصفانه بوده و روزها گذشته باشد. */
function conclude(i) {
  if (S.day < 7) { tip('اوّل دستِ‌کم تا روزِ هفتم صبر کن.'); S.flash = 1; sfx.nope(); return; }
  if (!fair()) {
    S.fairMsg = 3.6;
    sfx.nope();
    tip('بیش از یک چیز فرق دارد؛ معلوم نمی‌شود کدام اثر داشته.');
    return;
  }
  /* داوری از رویِ همهٔ روزهای جدول، نه فقط روزِ آخر.
     دما سرعت را عوض می‌کند نه سقف را: تا روزِ دوازدهم هر دو ظرف پُر
     می‌شوند و عددِ آخر یکی می‌شود، ولی یکی زودتر سبز شده است. اگر فقط
     روزِ آخر را نگاه کنیم، آزمایشگاه به غلط می‌گوید «دما اثری نداشت». */
  let sa = 0, sb = 0;
  for (const r of S.note) { sa += r.a; sb += r.b; }
  const win = sa === sb ? -1 : (sa > sb ? 0 : 1);
  if (win === -1) {
    S.verdict = { pick: i, ok: true, tie: true };
    sfx.good();
    tip('هر روز هر دو یکی بودند — پس این عامل اثری نداشت.');
    S.stepI = 4;
    return;
  }
  const last = [potCount(S.pot[0]), potCount(S.pot[1])];
  S.verdict = { pick: i, ok: i === win, win, sooner: last[0] === last[1] };
  if (i === win) {
    sfx.win();
    tip(last[0] === last[1] ? 'درست است؛ عددِ آخر یکی شد ولی این ظرف زودتر سبز شد.'
                            : 'درست است؛ همین ظرف بیشتر جوانه داد.');
  } else {
    sfx.nope();
    tip('به جدولِ همهٔ روزها نگاه کن، نه فقط روزِ آخر.');
  }
  S.stepI = 4;
}

/* ───────── جای‌ها ───────── */

const potBox = (i) => ({ x: 44 + i * 292, y: 112, w: 268, h: 596 });
const SIDE = { x: 636, y: 112, w: 528, h: 596 };
const CTRL = ['seeds', 'temp', 'water', 'light', 'dish'];
const CTRL_N = ['دانه', 'دما', 'آبِ خاک', 'نور', 'رنگِ ظرف'];
function ctrlRow(i, k) {
  const b = potBox(i);
  return { x: b.x + 12, y: b.y + 362 + k * 46, w: b.w - 24, h: 42 };
}
function trackOf(i, k) {
  const r = ctrlRow(i, k);
  return { x: r.x + 78, y: r.y + r.h / 2, w: r.w - 132 };
}
function qChip(i) {
  return { x: SIDE.x + 22 + i * 124, y: SIDE.y + 62, w: 112, h: 58 };
}
const TABLE = { x: SIDE.x + 20, y: SIDE.y + 148, w: SIDE.w - 40, h: 292 };
const BTN_DAY = { x: SIDE.x + 22, y: SIDE.y + 462, w: 200, h: 62 };
const BTN_RUN = { x: SIDE.x + 238, y: SIDE.y + 462, w: 148, h: 62 };
const BTN_NEW = { x: SIDE.x + 402, y: SIDE.y + 462, w: 104, h: 62 };
const potPick = (i) => { const b = potBox(i); return { x: b.x + 30, y: b.y + 288, w: b.w - 60, h: 46 }; };

/* ───────── ورودی ───────── */

function setCtrl(i, k, px) {
  const t = trackOf(i, k), p = S.pot[i];
  const u = clamp((px - t.x) / t.w, 0, 1);
  if (CTRL[k] === 'seeds') p.seeds = Math.round(lerp(10, 30, u));
  else if (CTRL[k] === 'temp') p.temp = Math.round(lerp(2, 38, u));
  else if (CTRL[k] === 'water') p.water = Math.round(u * 100) / 100;
  resetRun();
}

cv.addEventListener('pointermove', (e) => {
  const p = toStage(e);
  if (S.drag) { setCtrl(S.drag.i, S.drag.k, p.x); return; }
  S.hover = null;
  for (let i = 0; i < 2; i++) {
    for (let k = 0; k < CTRL.length; k++) {
      const r = ctrlRow(i, k);
      if (inRect(p, r)) S.hover = { k: 'ctrl', i, c: k };
    }
    if (inRect(p, potPick(i))) S.hover = { k: 'pick', i };
  }
  for (let i = 0; i < QUESTIONS.length; i++) if (inRect(p, qChip(i))) S.hover = { k: 'q', i };
  if (inRect(p, BTN_DAY)) S.hover = { k: 'day' };
  if (inRect(p, BTN_RUN)) S.hover = { k: 'run' };
  if (inRect(p, BTN_NEW)) S.hover = { k: 'new' };
  cv.style.cursor = S.hover ? 'pointer' : 'default';
});

cv.addEventListener('pointerdown', (e) => {
  const p = toStage(e);
  for (let i = 0; i < QUESTIONS.length; i++) if (inRect(p, qChip(i))) {
    S.q = i; S.stepI = Math.max(S.stepI, 1); sfx.tap();
    /* دو ظرف را همسان می‌کنیم و فقط همان عامل را فرق می‌دهیم */
    S.pot = [makePot(), makePot()];
    const f = QUESTIONS[i].f;
    if (f === 'temp') { S.pot[0].temp = 25; S.pot[1].temp = 15; }
    if (f === 'water') { S.pot[0].water = .55; S.pot[1].water = .12; }
    if (f === 'light') { S.pot[0].light = true; S.pot[1].light = false; }
    if (f === 'dish') { S.pot[0].dish = 0; S.pot[1].dish = 1; }
    resetRun();
    return;
  }
  if (inRect(p, BTN_DAY)) { if (S.day < 12) { S.stepI = Math.max(S.stepI, 2); nextDay(); } else tip('دوازده روز تمام شد.'); return; }
  if (inRect(p, BTN_RUN)) { S.stepI = Math.max(S.stepI, 2); S.running = !S.running && S.day < 12; sfx.tap(); return; }
  if (inRect(p, BTN_NEW)) { resetRun(); sfx.tap(); tip('از روزِ صفر شروع شد.'); return; }
  for (let i = 0; i < 2; i++) {
    if (inRect(p, potPick(i))) { conclude(i); return; }
    for (let k = 0; k < CTRL.length; k++) {
      const r = ctrlRow(i, k);
      if (!inRect(p, r)) continue;
      if (CTRL[k] === 'light') { S.pot[i].light = !S.pot[i].light; resetRun(); sfx.tap(); return; }
      if (CTRL[k] === 'dish') { S.pot[i].dish = 1 - S.pot[i].dish; resetRun(); sfx.tap(); return; }
      S.drag = { i, k };
      setCtrl(i, k, p.x);
      try { cv.setPointerCapture(e.pointerId); } catch { /* بعضی مرورگرها */ }
      return;
    }
  }
});

cv.addEventListener('pointerup', () => { S.drag = null; });
cv.addEventListener('pointercancel', () => { S.drag = null; });
cv.addEventListener('pointerleave', () => { S.drag = null; });

/* ───────── ابزارِ نقاشی ───────── */

function rrPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function numText(str, x, y, o = {}) {
  ctx.save();
  ctx.font = `${o.family === 'Vazirmatn' ? (o.weight || 700) : '400'} ${o.size || 20}px "${o.family || 'Lalezar'}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  ctx.direction = 'ltr';
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.fillStyle = o.color || P.ink;
  ctx.fillText(str, x, y);
  ctx.restore();
}

const waterName = (w) => w < .12 ? 'خشک' : (w < .38 ? 'کم‌آب' : (w < .74 ? 'نمناک' : (w < .95 ? 'خیس' : 'غرقاب')));

/* ───────── پس‌زمینهٔ ثابت ───────── */

function paintLabStatic() {
  const g = ctx.createLinearGradient(0, 0, 0, SCENE_H);
  g.addColorStop(0, P.wallHi); g.addColorStop(.5, P.wall); g.addColorStop(1, P.wallLo);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, SCENE_W, SCENE_H);
  ctx.save();
  ctx.globalAlpha = .5;
  ctx.fillStyle = texPaper(P.wall);
  ctx.fillRect(0, 0, SCENE_W, SCENE_H);
  ctx.restore();
  /* کاشیِ کفِ آزمایشگاه */
  ctx.strokeStyle = 'rgba(90, 105, 85, .12)'; ctx.lineWidth = 1.6;
  for (let x = 0; x < SCENE_W; x += 60) { ctx.beginPath(); ctx.moveTo(x, HUD_H); ctx.lineTo(x, SCENE_H); ctx.stroke(); }
  for (let y = HUD_H; y < SCENE_H; y += 60) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(SCENE_W, y); ctx.stroke(); }
  /* میزِ کار */
  for (let i = 0; i < 2; i++) {
    const b = potBox(i);
    ctx.fillStyle = 'rgba(255,255,255,.62)';
    ctx.beginPath(); rrPath(b.x - 8, b.y - 8, b.w + 16, b.h + 16, 16); ctx.fill();
    ctx.strokeStyle = 'rgba(90, 105, 85, .22)'; ctx.lineWidth = 2;
    ctx.beginPath(); rrPath(b.x - 8, b.y - 8, b.w + 16, b.h + 16, 16); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(255,255,255,.66)';
  ctx.beginPath(); rrPath(SIDE.x - 10, SIDE.y - 8, SIDE.w + 20, SIDE.h + 16, 16); ctx.fill();
  ctx.strokeStyle = 'rgba(90, 105, 85, .22)'; ctx.lineWidth = 2;
  ctx.beginPath(); rrPath(SIDE.x - 10, SIDE.y - 8, SIDE.w + 20, SIDE.h + 16, 16); ctx.stroke();
}

/* ───────── صحنه ───────── */

function draw() {
  beginScene(P.wall);
  ctx.drawImage(staticLayer('lab', SCENE_W, SCENE_H, paintLabStatic), 0, 0, SCENE_W, SCENE_H);
  for (let i = 0; i < 2; i++) drawPot(i);
  drawSide();
  drawSteps();
  drawTip();
  endScene(.12, 'rgba(90, 100, 70, .22)', .2, .08);
}

function drawSteps() {
  ctx.fillStyle = 'rgba(37, 48, 42, .95)';
  ctx.fillRect(0, 0, SCENE_W, HUD_H);
  ctx.fillStyle = P.accent;
  ctx.fillRect(0, HUD_H - 3, SCENE_W, 3);
  text('آزمایشگاهِ جوانه', SCENE_W - 22, HUD_H / 2, { size: 22, family: 'Lalezar', color: P.card, align: 'right' });
  const w = 132, gap = 8, total = STEPS.length * w + (STEPS.length - 1) * gap;
  for (let i = 0; i < STEPS.length; i++) {
    const x = 24 + i * (w + gap);
    const on = i <= S.stepI;
    ctx.fillStyle = on ? (i === S.stepI ? P.accent : 'rgba(63, 125, 140, .45)') : 'rgba(255,255,255,.1)';
    ctx.beginPath(); rrPath(x, 8, w, HUD_H - 16, 9); ctx.fill();
    numText(fa(i + 1), x + 20, HUD_H / 2, { size: 17, color: on ? '#fff' : 'rgba(255,255,255,.4)' });
    text(STEPS[i].n, x + w / 2 + 12, HUD_H / 2, { size: 16, family: 'Lalezar', color: on ? '#fff' : 'rgba(255,255,255,.45)' });
  }
  void total;
}

function drawTip() {
  const msg = S.tipT > 0 ? S.tip : STEPS[S.stepI].t;
  ctx.save();
  ctx.globalAlpha = S.tipT > 0 ? clamp(S.tipT, 0, 1) : .8;
  ctx.font = '700 17px "Vazirmatn", Tahoma, sans-serif';
  const w = ctx.measureText(msg).width + 60;
  const x = SCENE_W / 2 - w / 2, y = SCENE_H - 44;
  ctx.fillStyle = S.tipT > 0 ? 'rgba(63, 125, 140, .95)' : 'rgba(37, 48, 42, .8)';
  ctx.beginPath(); rrPath(x, y, w, 34, 17); ctx.fill();
  text(msg, SCENE_W / 2, y + 18, { size: 17, color: '#fff' });
  ctx.restore();
}

/* ───────── ظرف ───────── */

function sprout(x, y, h, seed) {
  ctx.strokeStyle = P.leafDk; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
  const sway = Math.sin(S.t * 1.2 + seed) * .06;
  ctx.save();
  ctx.translate(x, y); ctx.rotate(sway);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(1.6, -h * .5, 0, -h); ctx.stroke();
  ctx.fillStyle = P.leaf;
  wobbleEllipse(-5, -h + 1, 6, 3.4, -.5, seed, .5); ctx.fill();
  ctx.fillStyle = P.leafLt;
  wobbleEllipse(5, -h - 2, 6, 3.4, .45, seed + 2, .5); ctx.fill();
  ctx.restore();
}

function drawPot(i) {
  const b = potBox(i), p = S.pot[i];
  const other = S.pot[1 - i];
  text('ظرفِ ' + fa(i + 1), b.x + b.w - 12, b.y + 22, { size: 20, family: 'Lalezar', color: P.ink, align: 'right' });
  /* نشانِ اینکه چه چیزی فرق دارد */
  const d = diffs();
  if (d.length) {
    const names = { seeds: 'دانه', temp: 'دما', water: 'آب', light: 'نور', dish: 'رنگِ ظرف' };
    const lbl = d.map((x) => names[x]).join('، ');
    ctx.fillStyle = d.length === 1 ? 'rgba(78, 143, 92, .18)' : 'rgba(192, 74, 52, .16)';
    ctx.beginPath(); rrPath(b.x + 12, b.y + 8, 150, 28, 8); ctx.fill();
    text((d.length === 1 ? 'فرق: ' : 'چند فرق: ') + lbl, b.x + 87, b.y + 22,
      { size: 13, color: d.length === 1 ? P.good : P.bad });
  }

  /* ظرفِ شیشه‌ای با خاک — سمتِ راست برای دماسنج باز مانده */
  const dx = b.x + 20, dw = b.w - 86, dy = b.y + 200, dh = 92;
  ctx.fillStyle = 'rgba(120, 150, 160, .18)';
  ctx.beginPath(); rrPath(dx - 6, dy - 116, dw + 12, 116 + dh, 10); ctx.fill();
  /* خاک — هرچه خیس‌تر، تیره‌تر */
  const wet = clamp(p.water, 0, 1);
  ctx.save();
  ctx.beginPath(); rrPath(dx, dy, dw, dh, 8); ctx.clip();
  ctx.fillStyle = shade(P.soil, -wet * .45);
  ctx.fillRect(dx, dy, dw, dh);
  ctx.fillStyle = texStone(shade(P.soil, -wet * .45), shade(P.soilLt, -wet * .3));
  ctx.globalAlpha = .6;
  ctx.fillRect(dx, dy, dw, dh);
  ctx.globalAlpha = 1;
  if (wet > .95) {
    ctx.fillStyle = 'rgba(120, 170, 200, .5)';
    ctx.fillRect(dx, dy, dw, 12);
  }
  ctx.restore();
  ctx.strokeStyle = 'rgba(90, 105, 85, .3)'; ctx.lineWidth = 2;
  ctx.beginPath(); rrPath(dx, dy, dw, dh, 8); ctx.stroke();
  ctx.strokeStyle = DISH_C[p.dish]; ctx.lineWidth = 3;
  ctx.beginPath(); rrPath(dx - 6, dy - 116, dw + 12, 116 + dh, 10); ctx.stroke();

  /* جوانه‌ها */
  const n = potCount(p);
  const cols = 10;
  for (let k = 0; k < n; k++) {
    const col = k % cols, row = Math.floor(k / cols);
    const x = dx + 12 + col * ((dw - 24) / (cols - 1));
    const y = dy + 8 + row * 9;
    /* بلندیِ جوانه به روزهایی که از سبز شدنش گذشته بستگی دارد */
    const born = Math.max(1, potLag(p) + (k / Math.max(1, p.seeds)) * 4);
    const age = Math.max(0, S.day - born);
    sprout(x, y, 8 + Math.min(34, age * 7), k * 3 + i);
  }
  /* شمارشِ جوانه بالای شیشه می‌نشیند تا روی خودِ جوانه‌ها نیفتد */
  const ly = dy - 116 - 14;
  if (!n) text(S.day ? 'هنوز جوانه‌ای نیست' : 'دانه‌ها کاشته شد', dx + dw / 2, ly,
    { size: 14, color: 'rgba(37, 48, 42, .45)' });
  else {
    ctx.fillStyle = 'rgba(93, 162, 78, .16)';
    ctx.beginPath(); rrPath(dx + dw / 2 - 56, ly - 13, 112, 26, 8); ctx.fill();
    numText(fa(n) + ' جوانه', dx + dw / 2, ly, { size: 18, color: P.leafDk });
  }

  /* ظرفِ تاریک زیرِ سرپوش است — باید دیده شود که تاریک است */
  if (!p.light) {
    ctx.fillStyle = 'rgba(24, 30, 26, .5)';
    ctx.beginPath(); rrPath(dx - 8, dy - 118, dw + 16, 118 + dh + 2, 11); ctx.fill();
  }

  /* دماسنج کنارِ ظرف */
  const tx = b.x + b.w - 34, ty = b.y + 80;
  const TH = 168;
  ctx.fillStyle = '#e8ecec';
  ctx.beginPath(); rrPath(tx - 7, ty, 14, TH, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(tx, ty + TH + 10, 13, 0, TAU); ctx.fill();
  const kk = clamp(p.temp / 40, 0, 1);
  const col = p.temp >= 24 ? P.warm : (p.temp <= 12 ? P.cool : '#8a9a55');
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(tx, ty + TH + 10, 9, 0, TAU); ctx.fill();
  ctx.beginPath(); rrPath(tx - 4, ty + TH - 4 - kk * (TH - 14), 8, kk * (TH - 14) + 14, 4); ctx.fill();
  ctx.strokeStyle = 'rgba(90, 105, 85, .5)'; ctx.lineWidth = 1.4;
  for (let v = 0; v <= 40; v += 10) {
    const y = ty + TH - 4 - (v / 40) * (TH - 14);
    ctx.beginPath(); ctx.moveTo(tx + 7, y); ctx.lineTo(tx + 13, y); ctx.stroke();
  }

  /* دکمهٔ نتیجه */
  const pb = potPick(i);
  const chosen = S.verdict && S.verdict.pick === i;
  ctx.fillStyle = chosen ? (S.verdict.ok ? 'rgba(78, 143, 92, .22)' : 'rgba(192, 74, 52, .18)') : 'rgba(63, 125, 140, .12)';
  ctx.beginPath(); rrPath(pb.x, pb.y, pb.w, pb.h, 10); ctx.fill();
  ctx.strokeStyle = chosen ? (S.verdict.ok ? P.good : P.bad)
                           : (S.hover && S.hover.k === 'pick' && S.hover.i === i ? P.accent : 'rgba(63, 125, 140, .35)');
  ctx.lineWidth = chosen || (S.hover && S.hover.k === 'pick' && S.hover.i === i) ? 3 : 1.8;
  ctx.beginPath(); rrPath(pb.x, pb.y, pb.w, pb.h, 10); ctx.stroke();
  text(chosen ? (S.verdict.tie ? 'فرقی نکرد' : (S.verdict.ok ? (S.verdict.sooner ? 'درست — زودتر' : 'درست') : 'دوباره ببین'))
              : 'این یکی بهتر بود', pb.x + pb.w / 2, pb.y + pb.h / 2,
    { size: 16, family: 'Lalezar', color: chosen ? (S.verdict.ok ? P.good : P.bad) : P.accent });

  /* تنظیم‌ها */
  for (let k = 0; k < CTRL.length; k++) {
    const r = ctrlRow(i, k), t2 = trackOf(i, k), cy = r.y + r.h / 2;
    const hot = S.hover && S.hover.k === 'ctrl' && S.hover.i === i && S.hover.c === k;
    const key = CTRL[k];
    const same = key === 'seeds' ? p.seeds === other.seeds
               : key === 'temp' ? Math.abs(p.temp - other.temp) <= .5
               : key === 'water' ? Math.abs(p.water - other.water) <= .02
               : key === 'dish' ? p.dish === other.dish
               : p.light === other.light;
    ctx.fillStyle = same ? 'rgba(37, 48, 42, .04)' : 'rgba(217, 102, 63, .1)';
    ctx.beginPath(); rrPath(r.x, r.y, r.w, r.h, 9); ctx.fill();
    if (!same) {
      ctx.strokeStyle = 'rgba(217, 102, 63, .5)'; ctx.lineWidth = 1.6;
      ctx.beginPath(); rrPath(r.x, r.y, r.w, r.h, 9); ctx.stroke();
    }
    text(CTRL_N[k], r.x + r.w - 8, r.y + 14, { size: 13, color: P.inkSoft, align: 'right' });
    if (key === 'light' || key === 'dish') {
      const on = key === 'light' ? p.light : !!p.dish;
      const bx = t2.x + t2.w - 62;
      ctx.fillStyle = key === 'dish' ? DISH_C[p.dish] : (on ? P.gold : 'rgba(37, 48, 42, .2)');
      ctx.beginPath(); rrPath(bx, cy - 13, 58, 26, 13); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(on ? bx + 44 : bx + 14, cy, 10, 0, TAU); ctx.fill();
      text(key === 'dish' ? DISH_N[p.dish] : (on ? 'روشن' : 'تاریک'), t2.x + 26, cy,
        { size: 14, color: P.ink });
      if (hot) { ctx.strokeStyle = P.accent; ctx.lineWidth = 2;
        ctx.beginPath(); rrPath(r.x, r.y, r.w, r.h, 9); ctx.stroke(); }
      continue;
    }
    const u = key === 'seeds' ? (p.seeds - 10) / 20 : (key === 'temp' ? (p.temp - 2) / 36 : p.water);
    ctx.fillStyle = 'rgba(37, 48, 42, .12)';
    ctx.beginPath(); rrPath(t2.x, t2.y - 5, t2.w, 10, 5); ctx.fill();
    ctx.fillStyle = key === 'temp' ? col : (key === 'water' ? '#5b9dc4' : P.leaf);
    ctx.beginPath(); rrPath(t2.x, t2.y - 5, t2.w * u, 10, 5); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(t2.x + t2.w * u, t2.y, hot ? 12 : 10, 0, TAU); ctx.fill();
    ctx.strokeStyle = P.steelDk; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(t2.x + t2.w * u, t2.y, hot ? 12 : 10, 0, TAU); ctx.stroke();
    const val = key === 'seeds' ? fa(p.seeds) : (key === 'temp' ? fa(p.temp) + '°' : waterName(p.water));
    numText(val, r.x + 34, cy, { size: key === 'water' ? 15 : 19, color: P.ink,
      family: key === 'water' ? 'Vazirmatn' : 'Lalezar' });
  }
}

/* ───────── تختهٔ کنار: پرسش، جدول، روزها ───────── */

function drawSide() {
  text('پرسشِ آزمایش', SIDE.x + SIDE.w - 20, SIDE.y + 26,
    { size: 20, family: 'Lalezar', color: P.ink, align: 'right' });
  text('کدام‌یک را می‌آزماییم؟', SIDE.x + 130, SIDE.y + 27, { size: 14, color: P.inkSoft });
  for (let i = 0; i < QUESTIONS.length; i++) {
    const b = qChip(i), on = S.q === i;
    const hot = S.hover && S.hover.k === 'q' && S.hover.i === i;
    ctx.fillStyle = on ? 'rgba(63, 125, 140, .18)' : 'rgba(37, 48, 42, .05)';
    ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 10); ctx.fill();
    ctx.strokeStyle = on ? P.accent : (hot ? 'rgba(63,125,140,.5)' : 'rgba(37, 48, 42, .16)');
    ctx.lineWidth = on ? 3 : 1.6;
    ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 10); ctx.stroke();
    text(QUESTIONS[i].n, b.x + b.w / 2, b.y + b.h / 2, { size: 16, family: 'Lalezar', color: on ? P.accent : P.ink });
  }
  /* نشانِ منصفانه بودن */
  const d = diffs();
  const ok = d.length === 1;
  const fy = SIDE.y + 128;
  ctx.fillStyle = ok ? 'rgba(78, 143, 92, .14)' : 'rgba(192, 74, 52, .12)';
  ctx.beginPath(); rrPath(SIDE.x + 20, fy - 3, SIDE.w - 40, 32, 8); ctx.fill();
  text(ok ? 'آزمایشِ منصفانه: فقط یک چیز فرق دارد.'
          : (d.length === 0 ? 'دو ظرف کاملاً یکی‌اند؛ چیزی برای مقایسه نیست.'
                            : 'بیش از یک چیز فرق دارد؛ نتیجه معلوم نمی‌شود.'),
    SIDE.x + SIDE.w / 2, fy + 13, { size: 15, color: ok ? P.good : P.bad });
  if (S.fairMsg > 0) {
    ctx.save();
    ctx.globalAlpha = clamp(S.fairMsg, 0, 1);
    ctx.strokeStyle = P.bad; ctx.lineWidth = 3;
    ctx.beginPath(); rrPath(SIDE.x + 16, fy - 7, SIDE.w - 32, 40, 10); ctx.stroke();
    ctx.restore();
  }

  /* جدول */
  ctx.fillStyle = 'rgba(37, 48, 42, .04)';
  ctx.beginPath(); rrPath(TABLE.x, TABLE.y, TABLE.w, TABLE.h, 10); ctx.fill();
  text('روز', TABLE.x + TABLE.w - 26, TABLE.y + 20, { size: 14, color: P.inkSoft, align: 'right' });
  text('ظرفِ ۱', TABLE.x + TABLE.w - 96, TABLE.y + 20, { size: 14, color: P.inkSoft, align: 'right' });
  text('ظرفِ ۲', TABLE.x + 96, TABLE.y + 20, { size: 14, color: P.inkSoft, align: 'right' });
  ctx.strokeStyle = 'rgba(37, 48, 42, .16)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(TABLE.x + 12, TABLE.y + 32); ctx.lineTo(TABLE.x + TABLE.w - 12, TABLE.y + 32); ctx.stroke();
  if (!S.note.length) {
    text('هنوز روزی نگذشته است.', TABLE.x + TABLE.w / 2, TABLE.y + 120, { size: 16, color: 'rgba(37,48,42,.4)' });
  }
  const maxSeeds = Math.max(S.pot[0].seeds, S.pot[1].seeds, 1);
  const rows = S.note.slice(-12);
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i], y = TABLE.y + 48 + i * 20;
    numText(fa(r.day), TABLE.x + TABLE.w - 34, y, { size: 15, color: P.ink });
    numText(fa(r.a), TABLE.x + TABLE.w - 116, y, { size: 15, color: P.leafDk });
    numText(fa(r.b), TABLE.x + 76, y, { size: 15, color: P.leafDk });
    /* دو میلهٔ کوچک برای مقایسه با چشم */
    const bx = TABLE.x + 106, bw = TABLE.w - 250;
    ctx.fillStyle = 'rgba(37,48,42,.08)';
    ctx.beginPath(); rrPath(bx, y - 7, bw, 6, 3); ctx.fill();
    ctx.beginPath(); rrPath(bx, y + 1, bw, 6, 3); ctx.fill();
    ctx.fillStyle = '#6fae5c';
    ctx.beginPath(); rrPath(bx + bw - bw * (r.a / maxSeeds), y - 7, bw * (r.a / maxSeeds), 6, 3); ctx.fill();
    ctx.fillStyle = '#3f7d8c';
    ctx.beginPath(); rrPath(bx + bw - bw * (r.b / maxSeeds), y + 1, bw * (r.b / maxSeeds), 6, 3); ctx.fill();
  }

  /* دکمه‌های روز */
  const dayHot = S.hover && S.hover.k === 'day';
  button(BTN_DAY, 'یک روز جلو', { hot: dayHot, fill: '#3f7d8c', hotFill: '#4f97a8', size: 20,
    sub: 'روزِ ' + fa(S.day) + ' از ۱۲', subColor: 'rgba(255,255,255,.85)' });
  button(BTN_RUN, S.running ? 'ایست' : 'پخشِ روزها',
    { hot: S.hover && S.hover.k === 'run', fill: S.running ? '#c9962c' : '#5f8f6a', hotFill: S.running ? '#dda93c' : '#71a67c', size: 19 });
  button(BTN_NEW, 'از نو', { hot: S.hover && S.hover.k === 'new', fill: '#8d99a3', hotFill: '#a3aeb7', size: 19 });
  if (S.flash > 0) {
    ctx.save();
    ctx.globalAlpha = clamp(S.flash, 0, 1);
    ctx.strokeStyle = P.bad; ctx.lineWidth = 3;
    ctx.beginPath(); rrPath(BTN_DAY.x - 4, BTN_DAY.y - 4, BTN_DAY.w + 8, BTN_DAY.h + 8, 16); ctx.stroke();
    ctx.restore();
  }
}
