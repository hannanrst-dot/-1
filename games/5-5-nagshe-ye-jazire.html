<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2f2015">
<title>نقشهٔ جزیره — واحدِ اندازه‌گیریِ سطح</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>
  /* صفحه نباید هیچ‌جا اسکرول یا زوم شود؛ بازی باید مثل یک برنامه رفتار کند. */
  html, body {
    margin: 0; padding: 0; background: #2f2015;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body {
    position: fixed; inset: 0;          /* جلوی کشیده‌شدنِ صفحه در سافاریِ گوشی */
    width: 100%; height: 100vh; height: 100dvh;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none; -webkit-touch-callout: none;
  }

  /* گوشیِ عمودی صحنه را ریز می‌کند؛ بچه باید گوشی را بچرخاند. */
  #rotate { display: none; }
  @media (orientation: portrait) and (max-width: 860px) {
    #stage { display: none; }
    #rotate {
      display: flex; position: fixed; inset: 0;
      z-index: 9;
      flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      background: #2f2015; color: #f6ead2;
      font: 700 20px "Vazirmatn", Tahoma, sans-serif; text-align: center; padding: 32px;
    }
    #rotate svg { animation: tilt 2.4s ease-in-out infinite; }
    @keyframes tilt { 0%, 45% { transform: rotate(0deg); } 65%, 100% { transform: rotate(-90deg); } }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="rotate">
  <svg width="86" height="126" viewBox="0 0 86 126" fill="none" aria-hidden="true">
    <rect x="3" y="3" width="80" height="120" rx="12" stroke="#e8b448" stroke-width="5"/>
    <rect x="15" y="19" width="56" height="88" rx="5" fill="#e8b448" opacity=".28"/>
    <circle cx="43" cy="115" r="4" fill="#e8b448"/>
  </svg>
  <div>گوشی را بچرخان</div>
  <div style="font-weight:400;opacity:.7;font-size:16px">این بازی خوابیده بازی می‌شود</div>
</div>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   هستهٔ مشترکِ بازی‌ها — سبک «کاغذبُری»
   ───────────────────────────────────────────────────────────────────────
   این فایل جعبه‌ابزار است، نه چارچوب: هر بازی حلقه و وضعیت خودش را دارد
   و فقط از این توابع برای کشیدن استفاده می‌کند. دلیلش این است که هر بازی
   باید حس‌وحال خودش را داشته باشد، نه اینکه همه شبیه هم دربیایند.

   قاعده‌های ثابتِ تصویری:
   • نور همیشه از بالا-چپ می‌تابد، پس سایه‌ها به پایین-راست می‌افتند.
   • هیچ لبه‌ای کاملاً صاف نیست؛ همه کمی موج دارند (انگار با قیچی بریده).
   • هیچ خاکستریِ خالصی نداریم؛ همه‌ی خنثی‌ها به گرمیِ صحنه می‌زنند.
   • یک لایه‌ی دانه‌دانه‌ی کاغذ روی کلِ تصویر ضرب می‌شود.
   ═══════════════════════════════════════════════════════════════════════ */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const FA_D = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
const fa = (n) => String(n).replace(/\d/g, (d) => FA_D[+d]);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeIn = (t) => t * t * t;
const easeInOut = (t) => (t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2);
const easeBack = (t) => 1 + 2.7 * Math.pow(t-1, 3) + 1.7 * Math.pow(t-1, 2);
const easeElastic = (t) => t === 0 || t === 1 ? t : Math.pow(2, -9*t) * Math.sin((t*10 - .75) * 2.094) + 1;

/** تصادفِ تکرارپذیر: با یک بذر همیشه همان عدد. برای اینکه تزئین‌ها هر فریم نپرند. */
function noise1(x) {
  const s = Math.sin(x * 127.1) * 43758.5453;
  return s - Math.floor(s);
}
const pick = (arr, seed) => arr[Math.floor(noise1(seed) * arr.length) % arr.length];

/* ───────── بوم و صحنهٔ ثابت ───────── */

let ctx, SW, SH, CV, _refit = null;
let view = { scale: 1, ox: 0, oy: 0, w: 0, h: 0, dpr: 1 };
let _grain = null;

function initStage(canvas, w, h) {
  CV = canvas; SW = w; SH = h;
  ctx = canvas.getContext('2d');

  /* اندازه را از خودِ بوم می‌گیریم نه از innerHeight؛ چون در سافاریِ گوشی
     نوارِ آدرس باز و بسته می‌شود و innerHeight دروغ می‌گوید. */
  const fit = () => {
    const r = canvas.getBoundingClientRect();
    const vw = Math.round(r.width), vh = Math.round(r.height);
    if (vw < 20 || vh < 20) return;
    const dpr = Math.min(devicePixelRatio || 1, QUALITY > 0 ? 2 : 1);
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    const scale = Math.min(vw / SW, vh / SH);
    view = { scale, ox: (vw - SW*scale)/2, oy: (vh - SH*scale)/2, w: vw, h: vh, dpr };
    _grain = buildGrain();
  };
  _refit = fit;
  addEventListener('resize', fit);
  /* چرخاندنِ گوشی: اندازهٔ درست چند لحظه بعد می‌رسد، پس چندبار اندازه می‌گیریم. */
  addEventListener('orientationchange', () => {
    fit(); setTimeout(fit, 140); setTimeout(fit, 460);
  });
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(canvas);

  /* صدا در گوشی فقط بعد از اوّلین لمس اجازهٔ پخش دارد. */
  const unlock = () => { sfx._c(); removeEventListener('pointerdown', unlock); removeEventListener('touchstart', unlock); };
  addEventListener('pointerdown', unlock, { passive: true });
  addEventListener('touchstart', unlock, { passive: true });
  /* نگه‌داشتنِ انگشت نباید منوی مرورگر را باز کند. */
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  fit();
  return ctx;
}

/** قابِ صحنه را باز می‌کند: بعد از این، مختصات همیشه در فضای SW×SH است. */
function beginScene(bg) {
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, view.w, view.h);
  ctx.save();
  ctx.translate(view.ox, view.oy);
  ctx.scale(view.scale, view.scale);
  ctx.beginPath();
  ctx.rect(0, 0, SW, SH);
  ctx.clip();
}

/** بافتِ کاغذ، تیرگیِ گوشه‌ها، رنگ‌بندی و درخششِ نور را می‌گذارد و قاب را می‌بندد. */
function endScene(grainAlpha = .15, vignette = 'rgba(48,28,14,.30)', bloom = .34, grade = .14) {
  if (QUALITY < 1) { grade = 0; grainAlpha *= .5; }
  if (QUALITY < 2) bloom = 0;
  if (grade > 0) {
    /* رنگ‌بندیِ نرم: بالای صحنه گرم‌تر، پایین سردتر — عمق می‌دهد */
    const g = ctx.createLinearGradient(0, 0, 0, SH);
    g.addColorStop(0, `rgba(255, 214, 150, ${grade})`);
    g.addColorStop(.55, 'rgba(255, 255, 255, 0)');
    g.addColorStop(1, `rgba(40, 60, 110, ${grade * .9})`);
    ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalCompositeOperation = 'source-over';
  }
  if (_grain && grainAlpha > 0) {
    ctx.globalCompositeOperation = 'multiply';
    ctx.globalAlpha = grainAlpha;
    ctx.fillStyle = _grain;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
  if (vignette) {
    const g = ctx.createRadialGradient(SW/2, SH/2, SH*.42, SW/2, SH/2, SH*1.05);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, vignette);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
  }
  ctx.restore();
  bloomPass(bloom);
}

/* ───────── درخششِ نور (bloom) ─────────
   قابِ رسم‌شده را کوچک می‌کنیم، دو بار در خودش ضرب می‌کنیم تا فقط
   روشن‌ها بمانند، محوش می‌کنیم و با حالتِ «lighter» رویش می‌گذاریم.
   نتیجه: چراغ‌ها، شعله‌ها و رنگ‌های روشن نور پخش می‌کنند. */
let _bl, _blc, _bl2, _bl2c, _blNo = false, _blTick = 0;

function bloomPass(amount) {
  if (!amount || _blNo || !CV.width) return;
  /* کوچک‌کردن و بزرگ‌کردنِ دوباره، خودش محو می‌کند — از filter خیلی ارزان‌تر است */
  const W = Math.max(4, Math.round(CV.width * .2)), H = Math.max(4, Math.round(CV.height * .2));
  const W2 = Math.max(2, Math.round(W * .28)), H2 = Math.max(2, Math.round(H * .28));
  try {
    if (!_bl) {
      _bl = document.createElement('canvas'); _blc = _bl.getContext('2d');
      _bl2 = document.createElement('canvas'); _bl2c = _bl2.getContext('2d');
      if (!_blc || !_bl2c) { _blNo = true; return; }
    }
    if (_bl.width !== W || _bl.height !== H) { _bl.width = W; _bl.height = H; }
    if (_bl2.width !== W2 || _bl2.height !== H2) { _bl2.width = W2; _bl2.height = H2; }
    /* ساختنِ نور یک قاب در میان کافی است؛ گذاشتنش هر قاب. */
    _blTick = (_blTick + 1) & 1;
    if (!_blTick) {
      _blc.globalCompositeOperation = 'source-over';
      _blc.clearRect(0, 0, W, H);
      _blc.drawImage(CV, 0, 0, W, H);
      _blc.globalCompositeOperation = 'multiply';
      _blc.drawImage(_bl, 0, 0);
      _blc.drawImage(_bl, 0, 0);
      _blc.globalCompositeOperation = 'source-over';
      _bl2c.clearRect(0, 0, W2, H2);
      _bl2c.drawImage(_bl, 0, 0, W2, H2);
    }

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = amount;
    ctx.drawImage(_bl2, 0, 0, CV.width, CV.height);
    ctx.restore();
  } catch (e) { _blNo = true; }
}

/* ───────── لایهٔ ثابت ─────────
   هرچه در صحنه تکان نمی‌خورد را یک‌بار می‌کشیم و بعد فقط کپی می‌کنیم. */
const _layers = {};
function staticLayer(key, w, h, paint) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const L = _layers[key];
  if (L && L.q === q && L.w === w && L.h === h) return L.cv;
  const off = document.createElement('canvas');
  off.width = Math.max(1, Math.round(w * q));
  off.height = Math.max(1, Math.round(h * q));
  const c = off.getContext('2d');
  c.setTransform(q, 0, 0, q, 0, 0);
  const prev = ctx;
  ctx = c;
  try { paint(); } finally { ctx = prev; }
  _layers[key] = { cv: off, q, w, h };
  return off;
}

/* ───────── نورپردازی و بافت ─────────
   کارِ این‌ها این است که هیچ سطحی «تختِ یک‌رنگ» نماند. */

/** شیبِ عمودی: بالا روشن، پایین تیره. */
function vgrad(y0, y1, top, bot) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, top); g.addColorStop(1, bot);
  return g;
}

/** حجمِ کروی: نور از بالا-چپ، سایه در پایین-راست. */
function ball(cx, cy, r, lit, base, dark) {
  const g = ctx.createRadialGradient(cx - r * .38, cy - r * .42, r * .06, cx, cy, r * 1.06);
  g.addColorStop(0, lit); g.addColorStop(.45, base); g.addColorStop(1, dark);
  return g;
}

/** لبهٔ روشنِ بالا-چپِ یک مسیر — همان «rim light». */
function rim(pathFn, col, w = 2.2) {
  ctx.save();
  ctx.beginPath(); pathFn();
  ctx.clip();
  ctx.beginPath(); pathFn();
  ctx.strokeStyle = col; ctx.lineWidth = w * 2; ctx.lineJoin = 'round';
  ctx.translate(-w * .5, -w * .6);
  ctx.stroke();
  ctx.restore();
}

/** سایهٔ چسبیده به زمین — چیزها را روی سطح می‌نشاند. */
function contact(cx, cy, rx, ry, alpha = .26) {
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
  g.addColorStop(0, `rgba(20, 12, 6, ${alpha})`);
  g.addColorStop(1, 'rgba(20, 12, 6, 0)');
  ctx.save();
  ctx.fillStyle = g;
  ctx.translate(cx, cy); ctx.scale(1, ry / Math.max(rx, ry));
  ctx.beginPath(); ctx.arc(0, 0, Math.max(rx, ry), 0, TAU); ctx.fill();
  ctx.restore();
}

const _tex = {};
/** بافتِ تکرارشونده؛ یک‌بار ساخته و بعد از حافظه خوانده می‌شود. */
function texture(key, w, h, paint) {
  if (_tex[key]) return _tex[key];
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const c = off.getContext('2d');
  paint(c, w, h);
  _tex[key] = ctx.createPattern(off, 'repeat');
  return _tex[key];
}

/** رگهٔ چوب. */
function texWood(base, grain) {
  return texture('w' + base + grain, 120, 120, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = grain; c.lineWidth = 1.4;
    for (let i = 0; i < 9; i++) {
      c.globalAlpha = .18 + noise1(i * 3.1) * .3;
      c.beginPath();
      const y0 = i * 14 + noise1(i) * 6;
      c.moveTo(0, y0);
      for (let x = 0; x <= w; x += 10) c.lineTo(x, y0 + Math.sin(x * .09 + i) * 2.6);
      c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** تارِ پارچه. */
function texCloth(base, thread) {
  return texture('c' + base + thread, 16, 16, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = thread; c.lineWidth = 1; c.globalAlpha = .5;
    for (let i = 0; i < w; i += 4) {
      c.beginPath(); c.moveTo(i, 0); c.lineTo(i, h); c.stroke();
      c.beginPath(); c.moveTo(0, i); c.lineTo(w, i); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** دانه‌های سنگ. */
function texStone(base, spec) {
  return texture('s' + base + spec, 90, 90, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) {
      c.globalAlpha = .05 + noise1(i * 1.7) * .16;
      c.fillStyle = spec;
      const r = .6 + noise1(i * 5.3) * 1.9;
      c.beginPath();
      c.arc(noise1(i * 2.1) * w, noise1(i * 3.7 + 1) * h, r, 0, TAU);
      c.fill();
    }
    c.globalAlpha = 1;
  });
}

/** الیافِ کاغذ. */
function texPaper(base) {
  return texture('p' + base, 100, 100, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 130; i++) {
      c.globalAlpha = .04 + noise1(i * 2.3) * .07;
      c.strokeStyle = i % 2 ? '#ffffff' : '#5a4326';
      c.lineWidth = .9;
      const x = noise1(i * 1.3) * w, y = noise1(i * 4.1 + 2) * h;
      const a = noise1(i * 7.7) * TAU, l = 4 + noise1(i * 9.1) * 12;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

function buildGrain() {
  const s = 260;
  const off = document.createElement('canvas');
  off.width = off.height = s;
  const c = off.getContext('2d');
  const img = c.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    const v = 214 + Math.random() * 41;
    img.data[i*4] = v; img.data[i*4+1] = v; img.data[i*4+2] = v; img.data[i*4+3] = 255;
  }
  c.putImageData(img, 0, 0);
  return ctx.createPattern(off, 'repeat');
}

function toStage(e) {
  const r = CV.getBoundingClientRect();
  return {
    x: (e.clientX - r.left - view.ox) / view.scale,
    y: (e.clientY - r.top - view.oy) / view.scale,
  };
}

const inRect = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
const inCircle = (p, b, pad = 0) => Math.hypot(p.x - b.x, p.y - b.y) <= b.r + pad;

/* ───────── قلم‌های کاغذبُری ───────── */

/** دایره‌ای که انگار با قیچی بریده شده. */
function wobbleCircle(cx, cy, r, seed = 0, amp = 2.2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const rr = r + Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp * .45;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** بیضیِ ناصاف — برای چیزهایی که گرد نیستند ولی نرم‌اند. */
function wobbleEllipse(cx, cy, rx, ry, rot = 0, seed = 0, amp = 2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const w = 1 + (Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp*.45) / Math.max(rx, ry);
    const px = Math.cos(a) * rx * w, py = Math.sin(a) * ry * w;
    const x = cx + px*Math.cos(rot) - py*Math.sin(rot);
    const y = cy + px*Math.sin(rot) + py*Math.cos(rot);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** مستطیلِ گِرد با گوشه‌های کمی کج. */
function wobbleRect(x, y, w, h, r = 12, seed = 0, amp = 1.6) {
  const j = (k) => (noise1(seed*9.7 + k) - .5) * amp * 2;
  ctx.beginPath();
  ctx.moveTo(x + r + j(1), y + j(2));
  ctx.lineTo(x + w - r + j(3), y + j(4));
  ctx.quadraticCurveTo(x + w + j(5), y + j(6), x + w + j(7), y + r + j(8));
  ctx.lineTo(x + w + j(9), y + h - r + j(10));
  ctx.quadraticCurveTo(x + w + j(11), y + h + j(12), x + w - r + j(13), y + h + j(14));
  ctx.lineTo(x + r + j(15), y + h + j(16));
  ctx.quadraticCurveTo(x + j(17), y + h + j(18), x + j(19), y + h - r + j(20));
  ctx.lineTo(x + j(21), y + r + j(22));
  ctx.quadraticCurveTo(x + j(23), y + j(24), x + r + j(1), y + j(2));
  ctx.closePath();
}

/** سایهٔ نرم؛ نور از بالا-چپ. */
function withShadow(blur, dy, alpha, fn, hue = '78, 46, 24') {
  ctx.save();
  ctx.shadowColor = `rgba(${hue}, ${alpha})`;
  ctx.shadowBlur = blur;
  ctx.shadowOffsetY = dy;
  ctx.shadowOffsetX = dy * .35;
  fn();
  ctx.restore();
}

/** یک برگه‌ی کاغذ با سایه — پایه‌ی همه‌ی کارت‌ها و تابلوها. */
function paper(x, y, w, h, fill, seed = 1, r = 12, shadow = .26) {
  withShadow(16, 7, shadow, () => {
    ctx.fillStyle = fill;
    wobbleRect(x, y, w, h, r, seed, 2);
    ctx.fill();
  });
  /* الیافِ کاغذ و لبهٔ روشن، تا سطح تخت نماند */
  ctx.save();
  ctx.beginPath(); wobbleRect(x, y, w, h, r, seed, 2); ctx.clip();
  ctx.globalAlpha = .5;
  ctx.fillStyle = texPaper(fill);
  ctx.fillRect(x, y, w, h);
  ctx.globalAlpha = 1;
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.4, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(90,60,20,.1)');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
}

function text(str, x, y, o = {}) {
  const size = o.size || 20;
  const fam = o.family || 'Vazirmatn';
  ctx.save();
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.font = `${fam === 'Lalezar' ? '400' : (o.weight || 700)} ${size}px "${fam}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.baseline || 'middle';
  ctx.fillStyle = o.color || '#43291b';
  ctx.direction = 'rtl';
  if (o.stroke) {
    ctx.lineWidth = o.strokeWidth || 5;
    ctx.strokeStyle = o.stroke;
    ctx.lineJoin = 'round';
    ctx.strokeText(str, x, y, o.maxWidth);
  }
  ctx.fillText(str, x, y, o.maxWidth);
  ctx.restore();
}

/** متنِ چندخطی که خودش می‌شکند. ارتفاعِ اشغال‌شده را برمی‌گرداند. */
function textWrap(str, x, y, maxW, o = {}) {
  const size = o.size || 19, lh = o.lineHeight || size * 1.7;
  ctx.font = `${o.weight || 700} ${size}px "${o.family || 'Vazirmatn'}", Tahoma, sans-serif`;
  const lines = [];
  for (const para of str.split('\n')) {
    let line = '';
    for (const wd of para.split(' ')) {
      const t = line ? line + ' ' + wd : wd;
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = wd; }
      else line = t;
    }
    lines.push(line);
  }
  lines.forEach((l, i) => text(l, x, y + i * lh, o));
  return lines.length * lh;
}

/* ───────── ذره‌ها ───────── */

class Bits {
  constructor() { this.list = []; }
  add(x, y, n, kind, colors, opts = {}) {
    for (let i = 0; i < n; i++) {
      const a = opts.dir !== undefined ? opts.dir + (Math.random()-.5) * (opts.spread || 1) : Math.random() * TAU;
      const sp = (opts.speed || 200) * (.4 + Math.random());
      this.list.push({
        kind, x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - (opts.lift || 0),
        r: (opts.size || 4) * (.5 + Math.random()),
        rot: Math.random() * TAU, vr: (Math.random()-.5) * 10,
        col: colors[(Math.random() * colors.length) | 0],
        grav: opts.grav === undefined ? 620 : opts.grav,
        drag: opts.drag || .995,
        life: (opts.life || .9) * (.6 + Math.random() * .8), age: 0,
      });
    }
  }
  confetti(x, y, n, colors) {
    this.add(x, y, n, 'flake', colors, { speed: 420, lift: 190, size: 5, life: 1.6, grav: 780 });
  }
  spark(x, y, n, colors) {
    this.add(x, y, n, 'dot', colors, { speed: 180, lift: 30, size: 3.4, life: .7, grav: 260, drag: .93 });
  }
  step(dt) {
    for (const p of this.list) {
      p.age += dt;
      p.vy += p.grav * dt;
      p.vx *= p.drag; p.vy *= p.drag;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    }
    this.list = this.list.filter((p) => p.age < p.life);
  }
  draw() {
    for (const p of this.list) {
      const k = clamp(1 - p.age / p.life, 0, 1);
      ctx.save();
      ctx.globalAlpha = k;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.col;
      if (p.kind === 'flake') ctx.fillRect(-p.r, -p.r*1.5, p.r*2, p.r*3);
      else if (p.kind === 'leaf') { wobbleEllipse(0, 0, p.r*1.8, p.r*.8, 0, p.r, .6); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(0, 0, p.r * k, 0, TAU); ctx.fill(); }
      ctx.restore();
    }
  }
  clear() { this.list.length = 0; }
}

/* ───────── صدا (بدون فایل صوتی) ───────── */

const sfx = {
  ac: null, on: true,
  _c() {
    if (!this.on) return null;
    if (!this.ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; this.ac = new A(); }
    if (this.ac.state === 'suspended') this.ac.resume();
    return this.ac;
  },
  tone(f, dur = .16, type = 'sine', gain = .13, delay = 0) {
    const c = this._c(); if (!c) return;
    const t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(t0 + dur + .04);
  },
  tap()  { this.tone(430, .07, 'triangle', .09); },
  place(){ this.tone(620, .11, 'sine', .12); },
  pop()  { this.tone(760, .09, 'sine', .11); },
  slide(){ this.tone(240, .22, 'sine', .07); },
  good() { [523, 659, 784].forEach((f,i) => this.tone(f, .22, 'sine', .13, i*.07)); },
  win()  { [523, 659, 784, 1047].forEach((f,i) => this.tone(f, .34, 'triangle', .13, i*.10)); },
  nope() { this.tone(180, .2, 'sawtooth', .07); },
  tick() { this.tone(1100, .04, 'square', .05); },
};

/* ───────── قطعه‌های آماده ───────── */

function star(x, y, r, col, rot = 0) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = col;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI/2 + i * Math.PI/5;
    const rr = i % 2 ? r * .45 : r;
    const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/** دکمهٔ کاغذی. hovered را خودِ بازی می‌دهد؛ اینجا فقط کشیده می‌شود. */
/** رنگ را روشن‌تر (k>0) یا تیره‌تر (k<0) می‌کند. */
function shade(col, k) {
  const c = String(col).trim();
  let r, g2, b2;
  if (c[0] === '#') {
    const h = c.length === 4 ? c[1]+c[1]+c[2]+c[2]+c[3]+c[3] : c.slice(1, 7);
    r = parseInt(h.slice(0,2), 16); g2 = parseInt(h.slice(2,4), 16); b2 = parseInt(h.slice(4,6), 16);
  } else {
    const m = c.match(/[\d.]+/g);
    if (!m || m.length < 3) return col;
    r = +m[0]; g2 = +m[1]; b2 = +m[2];
  }
  const f = (v) => Math.round(clamp(k < 0 ? v * (1 + k) : v + (255 - v) * k, 0, 255));
  return 'rgb(' + f(r) + ',' + f(g2) + ',' + f(b2) + ')';
}

function button(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 3 : 0;
  const fill = o.disabled ? (o.off || '#bcaa92') : (hot ? (o.hotFill || o.fill) : o.fill);
  const r = o.r === undefined ? 14 : o.r;
  /* لبهٔ زیرینِ تیره — دکمه از صفحه بیرون می‌زند */
  ctx.fillStyle = shade(fill, -.36);
  wobbleRect(b.x, b.y + dy + 7, b.w, b.h, r, b.x + b.y, 2);
  ctx.fill();
  withShadow(hot ? 22 : 14, hot ? 5 : 8, .32, () => {
    ctx.fillStyle = fill;
    wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2);
    ctx.fill();
  });
  /* حجم: روشن از بالا، تیره به پایین */
  ctx.save();
  ctx.beginPath(); wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2); ctx.clip();
  const g = ctx.createLinearGradient(0, b.y + dy, 0, b.y + dy + b.h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.45, 'rgba(255,255,255,.04)');
  g.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = g;
  ctx.fillRect(b.x, b.y + dy, b.w, b.h);
  /* برقِ باریکِ لبهٔ بالا */
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.fillRect(b.x + r, b.y + dy + 2, b.w - r * 2, 2);
  ctx.restore();
  text(label, b.x + b.w/2, b.y + b.h/2 + dy - (o.sub ? 9 : 0), {
    size: o.size || 26, color: o.color || '#fdf6e8', family: o.family || 'Lalezar',
  });
  if (o.sub) text(o.sub, b.x + b.w/2, b.y + b.h/2 + dy + 17,
    { size: 14, color: o.subColor || 'rgba(255,255,255,.88)' });
}

/** دکمهٔ گرد کوچک (مثل + و −). */
function roundButton(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 2 : 0;
  withShadow(10, hot ? 3 : 5, .3, () => {
    ctx.fillStyle = o.disabled ? '#cbbba3' : (hot ? (o.hotFill || o.fill) : o.fill);
    wobbleCircle(b.x, b.y + dy, b.r, b.x, 1.4);
    ctx.fill();
  });
  text(label, b.x, b.y + dy - 1,
    { size: o.size || 32, color: o.disabled ? '#a8988a' : (o.color || '#fdf6e8'), family: 'Lalezar' });
}

/** پرده‌ی تمام‌صفحه: برای شروعِ پرده و برای جشنِ پایان. */
function overlay(o) {
  const k = easeOut(clamp(o.t / .5, 0, 1));
  ctx.fillStyle = `rgba(30, 22, 16, ${.66 * k})`;
  ctx.fillRect(0, 0, SW, SH);

  const w = o.w || 700, h = o.h || 290;
  const x = (SW - w) / 2, y = o.y || (SH * .22);
  const s = lerp(.9, 1, easeBack(clamp(o.t / .65, 0, 1)));
  ctx.save();
  ctx.translate(SW/2, y + h/2);
  ctx.scale(s, s);
  ctx.translate(-SW/2, -(y + h/2));

  withShadow(30, 14, .42, () => {
    ctx.fillStyle = o.paper || '#fbf3e2';
    wobbleRect(x, y, w, h, 18, 121, 2.4);
    ctx.fill();
  });
  ctx.fillStyle = o.band || '#c8434f';
  wobbleRect(x, y, w, 12, 6, 123, 1);
  ctx.fill();

  if (o.icon) o.icon(SW/2, y + 56);
  text(o.title, SW/2, y + (o.icon ? 108 : 62),
    { size: o.titleSize || 36, color: o.ink || '#43291b', family: 'Lalezar', alpha: k });
  textWrap(o.body, SW/2, y + (o.icon ? 158 : 116), w - 90,
    { size: 19, color: o.inkSoft || '#8a6a52', alpha: k });
  ctx.restore();

  button(o.btn, o.btnLabel, { hot: o.btnHot, fill: o.btnFill || '#7fa356', hotFill: o.btnHotFill || '#8fb45f', size: 28 });
}

/** پیامِ کوتاهِ بالای صحنه. */
class Toast {
  constructor() { this.msg = null; this.t = 0; this.kind = 'info'; }
  say(msg, kind = 'info') { this.msg = msg; this.kind = kind; this.t = 2.6; }
  step(dt) { if (this.t > 0) { this.t -= dt; if (this.t <= 0) this.msg = null; } }
  draw(y = 24, colors = {}) {
    if (!this.msg) return;
    const k = clamp(this.t, 0, 1) * clamp((2.6 - this.t) * 5, 0, 1);
    ctx.save();
    ctx.globalAlpha = k;
    ctx.font = `700 19px "Vazirmatn", Tahoma, sans-serif`;
    const w = ctx.measureText(this.msg).width + 76;
    const fill = this.kind === 'good' ? (colors.good || '#7fa356')
               : this.kind === 'bad' ? (colors.bad || '#c8434f')
               : (colors.info || '#fbf3e2');
    paper(SW/2 - w/2, y, w, 48, fill, 151, 12, .3);
    text(this.msg, SW/2, y + 25,
      { size: 19, color: this.kind === 'info' ? (colors.ink || '#43291b') : '#fff8ec' });
    ctx.restore();
  }
}

/* ───────── آموزشِ پرده‌ای ─────────
   پرده‌هایی که منتظرِ کارِ بچه نیستند با یک ضربه جلو می‌روند. تایمر فقط
   پشتیبان است؛ بچهٔ کلاس سومی باید فرصتِ خواندن داشته باشد، نه اینکه
   متن قبل از تمام شدنِ خواندنش برود.                                    */

/** اگر پردهٔ فعلی خواندنی است، ضربه را می‌خورد و می‌رود پردهٔ بعد. */
function tutTap(tut, tapSteps, lastStep) {
  if (!tut.on || tapSteps.indexOf(tut.step) < 0) return false;
  if (tut.step >= lastStep) tut.on = false;
  else { tut.step++; tut.t = 0; }
  sfx.tap();
  return true;
}

/** نشانهٔ «برای ادامه بزن» — زیرِ کارتِ آموزش. */
function tutMore(cx, y, t, ink = '#3a2a18', bg = 'rgba(255, 250, 238, .94)') {
  ctx.save();
  ctx.globalAlpha = .62 + .38 * Math.sin(t * 3.2);
  ctx.font = '700 15px "Vazirmatn", Tahoma, sans-serif';
  const label = 'برای ادامه، هرجا را بزن';
  const w = ctx.measureText(label).width + 40, h = 32, x = cx - w / 2, r = 16;
  withShadow(10, 4, .3, () => {
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath(); ctx.fill();
  });
  text(label, cx, y + h / 2, { size: 15, color: ink });
  ctx.restore();
}

/** فونت‌ها را می‌آورد و بعد بازی را شروع می‌کند. */
function whenFontsReady(start) {
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('400 40px Lalezar'),
      document.fonts.load('700 20px Vazirmatn'),
      document.fonts.load('900 20px Vazirmatn'),
    ]).then(start, start);
    setTimeout(start, 2600);
  } else start();
}

/** حلقهٔ فریم با dtِ محدودشده. */
/* ───────── کیفیتِ خودکار ─────────
   اگر دستگاه کُند بود، اوّل درخشش و بعد رنگ‌بندی خاموش می‌شود تا بازی
   روان بماند. روی دستگاهِ قوی همه‌چیز روشن است. */
let QUALITY = 2;
let _fAcc = 0, _fN = 0, _qHold = 0;

function _qualityTick(gap) {
  if (gap <= 0 || gap > 200) return;
  _fAcc += gap; _fN++;
  if (_fN < 45) return;
  const avg = _fAcc / _fN;
  _fAcc = 0; _fN = 0;
  if (_qHold > 0) { _qHold--; return; }
  const before = QUALITY;
  if (avg > 25 && QUALITY > 0) { QUALITY--; _qHold = 3; }
  else if (avg < 18.5 && QUALITY < 2) { QUALITY++; _qHold = 6; }
  /* در پایین‌ترین کیفیت، صحنه را با نقطه‌های کمتر می‌کشیم */
  if (before !== QUALITY && (before === 0 || QUALITY === 0) && _refit) _refit();
}

function runLoop(step) {
  let last = performance.now(), started = false;
  const frame = (now) => {
    const gap = now - last;
    const dt = Math.min(gap / 1000, 1/20);
    last = now;
    _qualityTick(gap);
    step(dt);
    requestAnimationFrame(frame);
  };
  if (!started) { started = true; requestAnimationFrame(frame); }
}

   نقشهٔ جزیره — ریاضی سوم، فصل ۵، درس ۵ (واحدِ اندازه‌گیریِ سطح)
   ───────────────────────────────────────────────────────────────────────
   درسِ صفحهٔ ۹۱ دو حرف دارد:
     ۱) مساحتِ یک شکلِ کج‌ومعوج یک عدد نیست؛ «بینِ دو عدد» است — آن‌هایی
        که کاملاً تویش‌اند، و آن‌هایی که فقط لبه‌شان را گرفته.
     ۲) هرچه واحد ریزتر باشد، این دو عدد به هم نزدیک‌ترند، یعنی
        اندازه‌گیری دقیق‌تر است.

   پس بازی این شد: نقشه‌بردارِ کشتی هستی. جزیره‌ای پیدا شده و باید

     • مدادِ راه‌راه برای خانه‌ای که فقط لبه‌اش روی جزیره است.

   قابِ درشت زود تمام می‌شود ولی فاصلهٔ دو عدد زیاد است؛ قابِ ریز وقت

   ═══════════════════════════════════════════════════════════════════════ */

  cells: [],             // { c, r, x, y, s, kind: 0 بیرون|1 نیمه|2 پُر, mark: 0|1|2, bad }
  tool: 2,               // ۲ طلایی، ۱ راه‌راه
  full: 0, part: 0,      // پاسخِ درست (برای بررسی، نه نمایش)
  stage: 'grid',         // grid → mark → done
  record: null,
  timeLeft: 0,
  flag: 3,
  cleared: 0, quota: 0,
  score: 0, best: 0, combo: 0,
  done: 0, gulls: [],
  t: 0, phaseT: 0, hover: null, shake: 0,
  tut: { on: true, step: 0, t: 0 },
};

const bits = new Bits();
const toast = new Toast();
const L = () => LEVELS[S.level];

function loadBest() { try { return +localStorage.getItem('jazire-best') || 0; } catch { return 0; } }
function saveBest(v) { try { localStorage.setItem('jazire-best', String(v)); } catch { /* حالتِ خصوصی */ } }

const cv = document.getElementById('stage');
initStage(cv, SCENE_W, SCENE_H);
S.best = loadBest();
for (let i = 0; i < 5; i++) S.gulls.push({ x: Math.random() * SCENE_W, y: 70 + Math.random() * 40,
  sp: 18 + Math.random() * 26, ph: Math.random() * TAU });
whenFontsReady(() => runLoop(step));

/* ───────── جزیره ───────── */

/** شعاعِ جزیره در زاویهٔ داده‌شده — پس «تویِ جزیره بودن» یک مقایسهٔ ساده است. */
function isleR(is, th) {
  let k = 1;
  for (let i = 0; i < is.a.length; i++) k += is.a[i] * Math.sin((i + 2) * th + is.p[i]);
  return is.R * k;
}
function inIsle(is, x, y) {
  const dx = x - is.cx, dy = y - is.cy;
  return Math.hypot(dx, dy) <= isleR(is, Math.atan2(dy, dx));
}
/** فاصلهٔ شعاعی تا لبه — مثبت یعنی داخل. برای اطمینان از «آشکار بودنِ» حالتِ هر خانه. */
function isleMargin(is, x, y) {
  const dx = x - is.cx, dy = y - is.cy;
  return isleR(is, Math.atan2(dy, dx)) - Math.hypot(dx, dy);
}

function makeIsle() {
  const lv = L();
  const n = 3;
  const a = [], p = [];
  for (let i = 0; i < n; i++) { a.push((Math.random() * 2 - 1) * lv.wob / (i + 1)); p.push(Math.random() * TAU); }
  /* مرکزِ جزیره را نزدیکِ گوشهٔ خانه‌های قابِ درشت می‌گذاریم تا جزیره
     همیشه از هر دو خطِ درشت رد شود؛ وگرنه قابِ درشت گاهی الکی «دقیق»
     درمی‌آید و درسِ «ریزتر یعنی دقیق‌تر» به هم می‌ریزد. */
  const big = FRAMES[0].c;
  const xs = [], ys = [];
  for (let x = big; x < CHART.w; x += big) xs.push(x);
  for (let y = big; y < CHART.h; y += big) ys.push(y);
  return {
    cx: CHART.x + xs[Math.floor(Math.random() * xs.length)] + (Math.random() * 2 - 1) * 16,
    cy: CHART.y + ys[Math.floor(Math.random() * ys.length)] + (Math.random() * 2 - 1) * 14,
    R: lv.rMin + Math.random() * (lv.rMax - lv.rMin), a, p,
  };
}

/** نیم‌پهنای خطِ ساحل. قاعده با چشم دیدنی است: خانه‌ای که خطِ ساحل از
    تویش رد شود «نیمه» است، وگرنه یا کاملاً روی جزیره است یا بیرون. */
const COAST = 4;

function classify(is, cell) {
  const out = [];
  const cols = Math.round(CHART.w / cell), rows = Math.round(CHART.h / cell);
  const N = 10;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const x = CHART.x + c * cell, y = CHART.y + r * cell;
    let mMin = 1e9, mMax = -1e9;
    for (let i = 0; i <= N; i++) for (let j = 0; j <= N; j++) {
      const m = isleMargin(is, x + cell * i / N, y + cell * j / N);
      if (m < mMin) mMin = m;
      if (m > mMax) mMax = m;
    }
    const kind = mMin >= COAST ? 2 : (mMax <= -COAST ? 0 : 1);
    out.push({ c, r, x, y, s: cell, kind, mark: 0, bad: 0 });
  }
  return out;
}

function newChart() {
  for (let tries = 0; tries < 200; tries++) {
    const is = makeIsle();
    /* جزیره باید کاملاً توی نقشه بماند */
    let fits = true;
    for (let i = 0; i < 64; i++) {
      const th = i * TAU / 64, rr = isleR(is, th);
      const x = is.cx + Math.cos(th) * rr, y = is.cy + Math.sin(th) * rr;
      if (x < CHART.x + 16 || x > CHART.x + CHART.w - 16 || y < CHART.y + 16 || y > CHART.y + CHART.h - 16) { fits = false; break; }
    }
    if (!fits) continue;
    /* هر قاب باید دستِ‌کم یک خانهٔ نیمه داشته باشد، وگرنه درس بی‌معنی است */
    if (!FRAMES.every((f) => classify(is, f.c).some((q) => q.kind === 1))) continue;
    S.isle = is;
    S.frame = null;
    S.cells = [];
    S.stage = 'grid';
    S.record = null;
    S.tool = 2;
    S.done = 0;
    return;
  }
  S.isle = { cx: CHART.x + CHART.w / 2, cy: CHART.y + CHART.h / 2, R: 110, a: [0, 0, 0], p: [0, 0, 0] };
  S.frame = null; S.cells = []; S.stage = 'grid'; S.record = null; S.tool = 2; S.done = 0;
}

function chooseFrame(f) {
  S.frame = f;
  S.cells = classify(S.isle, f.c);
  S.full = S.cells.filter((q) => q.kind === 2).length;
  S.part = S.cells.filter((q) => q.kind === 1).length;
  S.stage = 'mark';
  sfx.tone(460, .14, 'triangle', .06);
}

function startLevel(i, keep) {
  const lv = LEVELS[i];
  S.level = i;
  S.cleared = 0;
  S.quota = lv.endless ? Infinity : lv.quota;
  S.combo = 0;
  S.timeLeft = lv.time;
  if (!keep) { S.score = 0; S.flag = 3; }
  S.phase = 'play'; S.phaseT = 0;
  S.tut.on = i === 0 && !keep; S.tut.step = 0; S.tut.t = 0;
  newChart();
  toast.say(lv.hint, 'info');
}

/* ───────── حلقه ───────── */

function step(dt) {
  S.t += dt; S.phaseT += dt;
  if (S.shake > 0) S.shake -= dt;
  for (const q of S.cells) if (q.bad > 0) q.bad -= dt;
  for (const g of S.gulls) { g.x += g.sp * dt; if (g.x > SCENE_W + 30) { g.x = -30; g.y = 66 + Math.random() * 40; } }

  if (S.phase === 'play') {
    const frozen = S.tut.on && S.tut.step < 2;
    if (!frozen && !S.done) {
      S.timeLeft -= dt;
      if (S.timeLeft <= 0) { S.timeLeft = 0; loseFlag('مدّ رسید! نقشه خیس شد.'); }
    }
    if (S.done) { S.done += dt; if (S.done > 2.2) { S.done = 0; newChart(); } }
    if (S.tut.on) S.tut.t += dt;
  }
  bits.step(dt);
  toast.step(dt);
  draw();
}

function loseFlag(msg) {
  S.flag--;
  S.combo = 0;
  S.shake = .4;
  sfx.nope();
  toast.say(msg, 'bad');
  if (S.flag <= 0) { S.phase = 'lost'; S.phaseT = 0; return; }
  S.timeLeft = L().time;
  newChart();
}

/** پهنای نادانستگی، به پیکسلِ مربع — هرچه کمتر، ثبت دقیق‌تر. */
const bandArea = () => S.part * S.frame.c * S.frame.c;

function finish() {
  if (S.done) return;
  S.done = .001;
  S.combo++;
  S.cleared++;
  const band = bandArea();
  const worst = 5 * 160 * 160;
  const acc = clamp(1 - band / worst, 0, 1);
  const pts = 200 + Math.round(1400 * acc) + Math.round(S.timeLeft * 4) + Math.min(S.combo, 6) * 60;
  S.score += pts;
  if (S.score > S.best) { S.best = S.score; saveBest(S.best); }
  S.record = { lo: S.full, hi: S.full + S.part, unit: S.frame.n, acc };
  bits.confetti(CHART.x + CHART.w / 2, CHART.y + CHART.h / 2, 44,
    [P.gold, P.brass, '#fff', P.sand]);
  sfx.win();
  if (S.frame.id === 'big') toast.say('ثبت شد. با قابِ ریزتر، فاصلهٔ دو عدد کمتر می‌شد.', 'info');
  else if (S.frame.id === 'fin') toast.say('ثبتِ دقیق! ناخدا راضی است.', 'good');
  else toast.say('ثبت شد.', 'good');
  if (S.tut.on) S.tut.on = false;
  if (!L().endless && S.cleared >= S.quota) { S.score += 800; S.phase = 'won'; S.phaseT = 0; }
}

function checkDone() {
  for (const q of S.cells) if (q.mark !== q.kind) return;
  finish();
}

/* ───────── ورودی ───────── */

function frameBox(i) {
  return { x: LEFT.x + 22, y: LEFT.y + 78 + i * 134, w: LEFT.w - 44, h: 116 };
}
function toolBox(i) {
  return { x: LEFT.x + 22, y: LEFT.y + 96 + i * 144, w: LEFT.w - 44, h: 124 };
}
function cellAt(p) {
  if (!S.frame) return null;
  if (p.x < CHART.x || p.x > CHART.x + CHART.w || p.y < CHART.y || p.y > CHART.y + CHART.h) return null;
  const c = Math.floor((p.x - CHART.x) / S.frame.c), r = Math.floor((p.y - CHART.y) / S.frame.c);
  return S.cells.find((q) => q.c === c && q.r === r) || null;
}

cv.addEventListener('pointermove', (e) => {
  const p = toStage(e);
  if (S.phase !== 'play') { S.hover = inRect(p, BTN_GO) ? BTN_GO : null; cv.style.cursor = S.hover ? 'pointer' : 'default'; return; }
  S.hover = null;
  if (S.stage === 'grid') {
    for (let i = 0; i < 3; i++) if (inRect(p, frameBox(i))) S.hover = i;
    cv.style.cursor = S.hover !== null ? 'pointer' : 'default';
  } else {
    for (let i = 0; i < 2; i++) if (inRect(p, toolBox(i))) S.hover = 'tool' + i;
    cv.style.cursor = (S.hover || cellAt(p)) ? 'pointer' : 'default';
  }
});

cv.addEventListener('pointerdown', (e) => {
  const p = toStage(e);
  if (S.phase === 'intro') { startLevel(0); return; }
  if (S.phase === 'won') {
    if (!inRect(p, BTN_GO)) return;
    if (L().endless) startLevel(S.level, true);
    else if (S.level + 1 < LEVELS.length) startLevel(S.level + 1, true);
    else startLevel(0);
    return;
  }
  if (S.phase === 'lost') { if (inRect(p, BTN_GO)) startLevel(S.level); return; }
  if (S.done) return;
  if (tutTap(S.tut, TUT_TAP, TUT_LAST)) return;

  if (S.stage === 'grid') {
    for (let i = 0; i < 3; i++) if (inRect(p, frameBox(i))) {
      chooseFrame(FRAMES[i]);
      if (S.tut.on && S.tut.step === 1) { S.tut.step = 2; S.tut.t = 0; }
      return;
    }
    return;
  }
  for (let i = 0; i < 2; i++) if (inRect(p, toolBox(i))) {
    S.tool = i === 0 ? 2 : 1;
    sfx.tap();
    return;
  }
  const q = cellAt(p);
  if (!q) return;
  if (q.mark === S.tool) { q.mark = 0; sfx.tone(240, .07, 'sine', .04); return; }
  if (S.tool !== q.kind) {
    q.bad = .5; S.shake = .1; sfx.nope();
    S.timeLeft = Math.max(2, S.timeLeft - 2);
    return;
  }
  q.mark = S.tool;
  sfx.tone(S.tool === 2 ? 520 : 380, .07, 'triangle', .045);
  checkDone();
});

const TUT_TAP = [0, 2], TUT_LAST = 2;

/* ───────── ابزارِ نقاشی ───────── */

function rrPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function numText(str, x, y, o = {}) {
  ctx.save();
  ctx.font = `${o.family === 'Vazirmatn' ? (o.weight || 700) : '400'} ${o.size || 20}px "${o.family || 'Lalezar'}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  ctx.direction = 'ltr';
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  if (o.stroke) { ctx.lineWidth = o.strokeWidth || 5; ctx.lineJoin = 'round';
    ctx.strokeStyle = o.stroke; ctx.strokeText(str, x, y); }
  ctx.fillStyle = o.color || P.ink;
  ctx.fillText(str, x, y);
  ctx.restore();
}

function spot(rects, alpha) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, SCENE_W, SCENE_H);
  for (const r of rects) rrPath(r.x - 12, r.y - 12, r.w + 24, r.h + 24, 22);
  ctx.fillStyle = `rgba(14, 8, 4, ${alpha})`;
  ctx.fill('evenodd');
  ctx.restore();
}

function tutCard(x, y, w, lines, title) {
  const h = 26 + (title ? 44 : 0) + lines.length * 30;
  withShadow(24, 10, .5, () => {
    ctx.fillStyle = 'rgba(251, 241, 216, .97)';
    wobbleRect(x, y, w, h + 20, 16, 101, 2.2); ctx.fill();
  }, '10, 6, 2');
  ctx.fillStyle = P.brassDk;
  wobbleRect(x, y, w, 9, 4, 103, 1); ctx.fill();
  let yy = y + 34;
  if (title) { text(title, x + w / 2, yy + 6, { size: 25, family: 'Lalezar', color: P.ink }); yy += 44; }
  for (const l of lines) { text(l, x + w / 2, yy, { size: 18, color: '#6f5c3c' }); yy += 30; }
  return h + 20;
}

function islePath(is) {
  ctx.beginPath();
  for (let i = 0; i <= 120; i++) {
    const th = i * TAU / 120, rr = isleR(is, th);
    const x = is.cx + Math.cos(th) * rr, y = is.cy + Math.sin(th) * rr;
    ctx[i ? 'lineTo' : 'moveTo'](x, y);
  }
  ctx.closePath();
}

function stripes(x, y, w, h, col, gap) {
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.strokeStyle = col; ctx.lineWidth = 3;
  for (let d = -h; d < w; d += gap) {
    ctx.beginPath(); ctx.moveTo(x + d, y + h); ctx.lineTo(x + d + h, y); ctx.stroke();
  }
  ctx.restore();
}

/* ───────── صحنه ───────── */

function draw() {
  beginScene(P.desk);
  ctx.save();
  if (S.shake > 0) {
    const k = S.shake * 9;
    ctx.translate(Math.sin(S.t * 55) * k, Math.cos(S.t * 43) * k * .4);
  }
  drawDesk();
  drawChart();
  drawLeft();
  drawRight();
  drawRecord();
  bits.draw();
  ctx.restore();

  drawHUD();
  if (!(S.phase === 'play' && S.tut.on)) {
    ctx.save();
    ctx.translate(CHART.x + CHART.w / 2 - SCENE_W / 2, 0);
    toast.draw(HUD_H + 10, { good: P.good, bad: P.bad, info: P.paper, ink: P.ink });
    ctx.restore();
  }
  if (S.phase === 'play' && S.tut.on) drawTutorial();
  if (S.phase === 'intro') drawIntro();
  if (S.phase === 'won') drawWon();
  if (S.phase === 'lost') drawLost();
  endScene(.14, 'rgba(8, 4, 2, .52)');
}

function drawDesk() {
  const g = ctx.createRadialGradient(SCENE_W / 2, 300, 80, SCENE_W / 2, 340, 780);
  g.addColorStop(0, P.deskLt);
  g.addColorStop(1, P.deskDk);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, SCENE_W, SCENE_H);
  /* رگهٔ چوب */
  ctx.save();
  ctx.globalAlpha = .1;
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
  for (let i = 0; i < 22; i++) {
    ctx.beginPath();
    const y0 = 60 + i * 34;
    ctx.moveTo(0, y0);
    for (let x = 0; x <= SCENE_W; x += 40) ctx.lineTo(x, y0 + Math.sin(x * .006 + i) * 7);
    ctx.stroke();
  }
  ctx.restore();
  /* مرغِ دریایی */
  ctx.strokeStyle = 'rgba(240, 226, 192, .3)'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
  for (const g2 of S.gulls) {
    const f = Math.sin(S.t * 4 + g2.ph) * 5;
    ctx.beginPath();
    ctx.moveTo(g2.x - 10, g2.y + f); ctx.quadraticCurveTo(g2.x, g2.y - 5, g2.x + 10, g2.y + f);
    ctx.stroke();
  }
}

function drawChart() {
  const b = CHART;
  withShadow(30, 12, .5, () => {
    ctx.fillStyle = P.paper;
    wobbleRect(b.x - 18, b.y - 18, b.w + 36, b.h + 36, 8, 11, 2.6); ctx.fill();
  }, '8, 4, 2');
  /* دریا */
  ctx.fillStyle = P.sea;
  ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.save();
  ctx.beginPath(); ctx.rect(b.x, b.y, b.w, b.h); ctx.clip();
  ctx.strokeStyle = P.seaLine; ctx.lineWidth = 2;
  for (let i = 0; i < 22; i++) {
    ctx.beginPath();
    const y0 = b.y + 12 + i * 20;
    ctx.moveTo(b.x, y0);
    for (let x = b.x; x <= b.x + b.w; x += 20) ctx.lineTo(x, y0 + Math.sin(x * .05 + i * 1.3) * 3.5);
    ctx.stroke();
  }
  /* جزیره */
  if (S.isle) {
    const is = S.isle;
    ctx.fillStyle = P.seaDk;
    ctx.save(); ctx.translate(4, 5); islePath(is); ctx.fill(); ctx.restore();
    ctx.fillStyle = P.sandDk; islePath(is); ctx.fill();
    ctx.save();
    islePath(is); ctx.clip();
    ctx.fillStyle = P.sand;
    ctx.beginPath();
    for (let i = 0; i <= 120; i++) {
      const th = i * TAU / 120, rr = isleR(is, th) - 9;
      ctx[i ? 'lineTo' : 'moveTo'](is.cx + Math.cos(th) * rr, is.cy + Math.sin(th) * rr);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = P.palmDk;
    ctx.beginPath();
    for (let i = 0; i <= 120; i++) {
      const th = i * TAU / 120, rr = isleR(is, th) * .62 + Math.sin(th * 3 + 1) * 8;
      ctx[i ? 'lineTo' : 'moveTo'](is.cx + Math.cos(th) * rr, is.cy + Math.sin(th) * rr);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = P.palm;
    ctx.beginPath();
    for (let i = 0; i <= 120; i++) {
      const th = i * TAU / 120, rr = isleR(is, th) * .58 + Math.sin(th * 3 + 1) * 8;
      ctx[i ? 'lineTo' : 'moveTo'](is.cx + Math.cos(th) * rr - 2, is.cy + Math.sin(th) * rr - 3);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
    /* خطِ ساحل — همان چیزی که «نیمه» بودن را معلوم می‌کند */
    ctx.strokeStyle = '#4a3a22'; ctx.lineWidth = COAST * 2;
    islePath(is); ctx.stroke();
    ctx.strokeStyle = '#8d6b3a'; ctx.lineWidth = 2;
    islePath(is); ctx.stroke();
  }
  ctx.restore();

  /* رنگ‌آمیزیِ خانه‌ها */
  for (const q of S.cells) {
    if (q.mark === 2) {
      ctx.fillStyle = 'rgba(229, 171, 60, .62)';
      ctx.fillRect(q.x + 1, q.y + 1, q.s - 2, q.s - 2);
      ctx.strokeStyle = P.goldDk; ctx.lineWidth = 2.4;
      ctx.strokeRect(q.x + 2, q.y + 2, q.s - 4, q.s - 4);
    } else if (q.mark === 1) {
      ctx.fillStyle = 'rgba(185, 138, 72, .3)';
      ctx.fillRect(q.x + 1, q.y + 1, q.s - 2, q.s - 2);
      stripes(q.x + 2, q.y + 2, q.s - 4, q.s - 4, 'rgba(141, 100, 48, .65)', 12);
      ctx.strokeStyle = P.stripeDk; ctx.lineWidth = 2;
      ctx.strokeRect(q.x + 2, q.y + 2, q.s - 4, q.s - 4);
    }
    if (q.bad > 0) {
      ctx.save();
      ctx.globalAlpha = clamp(q.bad * 2, 0, 1);
      ctx.fillStyle = 'rgba(201, 86, 63, .5)';
      ctx.fillRect(q.x + 1, q.y + 1, q.s - 2, q.s - 2);
      ctx.restore();
    }
  }

  /* قابِ شبکه */
  if (S.frame) {
    ctx.save();
    ctx.strokeStyle = 'rgba(58, 40, 28, .5)'; ctx.lineWidth = 1.6;
    const c = S.frame.c;
    for (let x = b.x; x <= b.x + b.w + .5; x += c) { ctx.beginPath(); ctx.moveTo(x, b.y); ctx.lineTo(x, b.y + b.h); ctx.stroke(); }
    for (let y = b.y; y <= b.y + b.h + .5; y += c) { ctx.beginPath(); ctx.moveTo(b.x, y); ctx.lineTo(b.x + b.w, y); ctx.stroke(); }
    ctx.restore();
  }

  /* قابِ برنجیِ دورِ نقشه */
  ctx.strokeStyle = P.brassDk; ctx.lineWidth = 6;
  ctx.strokeRect(b.x - 3, b.y - 3, b.w + 6, b.h + 6);
  ctx.strokeStyle = P.brass; ctx.lineWidth = 2.4;
  ctx.strokeRect(b.x - 3, b.y - 3, b.w + 6, b.h + 6);

  /* گلِ قطب‌نما */
  const cx = b.x + b.w - 46, cy = b.y + b.h - 46;
  ctx.save();
  ctx.globalAlpha = .3;
  ctx.strokeStyle = P.ink; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, 22, 0, TAU); ctx.stroke();
  ctx.fillStyle = P.ink;
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2 - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * 20, cy + Math.sin(a) * 20);
    ctx.lineTo(cx + Math.cos(a + 2.4) * 7, cy + Math.sin(a + 2.4) * 7);
    ctx.lineTo(cx + Math.cos(a - 2.4) * 7, cy + Math.sin(a - 2.4) * 7);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

/** ستونِ چپ: یا سه قابِ شبکه، یا دو مداد. */
function drawLeft() {
  const b = LEFT;
  withShadow(20, 9, .45, () => {
    ctx.fillStyle = P.paperDk;
    wobbleRect(b.x, b.y, b.w, b.h, 14, 21, 2.2); ctx.fill();
  }, '8, 4, 2');
  ctx.fillStyle = P.brassDk;
  wobbleRect(b.x, b.y, b.w, 10, 5, 23, 1); ctx.fill();

  if (S.stage === 'grid') {
    text('کدام قابِ شبکه؟', b.x + b.w / 2, b.y + 40, { size: 22, family: 'Lalezar', color: P.ink });
    for (let i = 0; i < FRAMES.length; i++) {
      const f = FRAMES[i], r = frameBox(i), hot = S.hover === i;
      const dy = hot ? 3 : 0;
      withShadow(hot ? 16 : 8, hot ? 5 : 3, .3, () => {
        ctx.fillStyle = hot ? P.paperLt : P.paper;
        wobbleRect(r.x, r.y + dy, r.w, r.h, 12, r.y, 1.4); ctx.fill();
      }, '8, 4, 2');
      /* یک خانهٔ همین قاب، با نسبتِ واقعی نسبت به بقیه */
      const s = f.c * .42;
      const gx0 = r.x + 20, gy0 = r.y + r.h / 2 - s / 2 + dy;
      ctx.fillStyle = 'rgba(156, 198, 212, .55)';
      ctx.fillRect(gx0, gy0, s, s);
      ctx.strokeStyle = 'rgba(58, 40, 28, .6)'; ctx.lineWidth = 1.8;
      ctx.strokeRect(gx0, gy0, s, s);
      text(f.n, r.x + r.w - 26, r.y + r.h / 2 - 12 + dy, { size: 25, family: 'Lalezar', color: P.ink, align: 'right' });
      text(f.id === 'big' ? 'زود، ولی سرانگشتی' : (f.id === 'fin' ? 'کُند، ولی دقیق' : 'میانه'),
        r.x + r.w - 26, r.y + r.h / 2 + 16 + dy, { size: 14, color: P.inkSoft, align: 'right' });
    }
    return;
  }

  text('مدادها', b.x + b.w / 2, b.y + 42, { size: 22, family: 'Lalezar', color: P.ink });
  const tools = [
    { k: 2, n: 'کاملاً روی جزیره', sub: 'طلایی' },
    { k: 1, n: 'فقط لبه‌اش', sub: 'راه‌راه' },
  ];
  tools.forEach((t, i) => {
    const r = toolBox(i), on = S.tool === t.k, hot = S.hover === 'tool' + i;
    const dy = hot && !on ? 2 : 0;
    withShadow(on ? 16 : 7, on ? 5 : 3, .3, () => {
      ctx.fillStyle = on ? P.paperLt : P.paper;
      wobbleRect(r.x, r.y + dy, r.w, r.h, 12, r.y, 1.4); ctx.fill();
    }, '8, 4, 2');
    if (on) { ctx.strokeStyle = P.brassDk; ctx.lineWidth = 3.4;
      wobbleRect(r.x, r.y + dy, r.w, r.h, 12, r.y, 1.4); ctx.stroke(); }
    /* نمونهٔ رنگ */
    const sx = r.x + 20, sy = r.y + 22 + dy;
    if (t.k === 2) {
      ctx.fillStyle = 'rgba(229, 171, 60, .62)';
      ctx.fillRect(sx, sy, 56, 56);
      ctx.strokeStyle = P.goldDk; ctx.lineWidth = 2.6; ctx.strokeRect(sx, sy, 56, 56);
    } else {
      ctx.fillStyle = 'rgba(185, 138, 72, .3)';
      ctx.fillRect(sx, sy, 56, 56);
      stripes(sx, sy, 56, 56, 'rgba(141, 100, 48, .65)', 12);
      ctx.strokeStyle = P.stripeDk; ctx.lineWidth = 2.2; ctx.strokeRect(sx, sy, 56, 56);
    }
    text(t.n, r.x + r.w - 20, r.y + r.h / 2 - 10 + dy, { size: 19, color: P.ink, align: 'right' });
    text(t.sub, r.x + r.w - 20, r.y + r.h / 2 + 16 + dy, { size: 14, color: P.inkSoft, align: 'right' });
  });
  text('روی خانه بزن. دوباره بزنی، پاک می‌شود.', b.x + b.w / 2, b.y + b.h - 34,
    { size: 14, color: P.inkSoft });
}

/** ستونِ راست: ناخدا، قابِ انتخاب‌شده، و مدّ آب. */
function drawRight() {
  const b = RIGHT;
  withShadow(20, 9, .45, () => {
    ctx.fillStyle = P.paperDk;
    wobbleRect(b.x, b.y, b.w, b.h, 14, 31, 2.2); ctx.fill();
  }, '8, 4, 2');
  ctx.fillStyle = P.brassDk;
  wobbleRect(b.x, b.y, b.w, 10, 5, 33, 1); ctx.fill();
  text('دفترِ ناخدا', b.x + b.w / 2, b.y + 40, { size: 22, family: 'Lalezar', color: P.ink });

  /* ناخدا */
  const cx = b.x + b.w / 2, hy = b.y + 108;
  const bob = Math.sin(S.t * 1.8) * 2;
  ctx.fillStyle = '#2f4a63';
  ctx.beginPath();
  ctx.moveTo(cx - 34, hy - 12 + bob); ctx.quadraticCurveTo(cx, hy - 34 + bob, cx + 34, hy - 12 + bob);
  ctx.quadraticCurveTo(cx, hy - 6 + bob, cx - 34, hy - 12 + bob); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#f2d7b3';
  wobbleCircle(cx, hy + 10 + bob, 19, 5, 1.2); ctx.fill();
  ctx.fillStyle = '#3d2a16';
  ctx.beginPath(); ctx.arc(cx - 7, hy + 6 + bob, 2.6, 0, TAU); ctx.arc(cx + 7, hy + 6 + bob, 2.6, 0, TAU); ctx.fill();
  ctx.fillStyle = '#8d7a56';
  ctx.beginPath(); ctx.ellipse(cx, hy + 20 + bob, 15, 7, 0, 0, Math.PI); ctx.fill();
  ctx.fillStyle = '#2f4a63';
  wobbleRect(cx - 26, hy + 30 + bob, 52, 34, 8, 9, 1.2); ctx.fill();

  if (S.frame) {
    text('قابِ ' + S.frame.n, cx, b.y + 196, { size: 21, family: 'Lalezar', color: P.ink });
    ctx.fillStyle = 'rgba(58, 40, 28, .08)';
    ctx.beginPath(); rrPath(b.x + 20, b.y + 214, b.w - 40, 88, 12); ctx.fill();
    const s = S.frame.c * .42;
    const gx0 = cx - s / 2, gy0 = b.y + 258 - s / 2;
    ctx.fillStyle = 'rgba(156, 198, 212, .55)';
    ctx.fillRect(gx0, gy0, s, s);
    ctx.strokeStyle = 'rgba(58, 40, 28, .6)'; ctx.lineWidth = 1.8;
    ctx.strokeRect(gx0, gy0, s, s);
  } else {
    textWrap('جزیره‌ای پیدا شده.\nمساحتش را ثبت کن.', cx, b.y + 200, b.w - 50,
      { size: 17, color: P.inkSoft, lineHeight: 26 });
  }

  /* مدّ آب = وقت */
  const k = clamp(S.timeLeft / L().time, 0, 1);
  const gy1 = b.y + b.h - 118, gh = 92;
  ctx.fillStyle = 'rgba(58, 40, 28, .14)';
  ctx.beginPath(); rrPath(b.x + 26, gy1, b.w - 52, gh, 12); ctx.fill();
  ctx.save();
  ctx.beginPath(); rrPath(b.x + 26, gy1, b.w - 52, gh, 12); ctx.clip();
  const wh = gh * (1 - k);
  ctx.fillStyle = k < .3 ? '#c9563f' : P.seaDk;
  ctx.fillRect(b.x + 26, gy1 + gh - wh, b.w - 52, wh);
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.beginPath();
  ctx.moveTo(b.x + 26, gy1 + gh - wh);
  for (let x = 0; x <= b.w - 52; x += 12) ctx.lineTo(b.x + 26 + x, gy1 + gh - wh + Math.sin(x * .09 + S.t * 3) * 3);
  ctx.lineTo(b.x + b.w - 26, gy1 + gh - wh + 5); ctx.lineTo(b.x + 26, gy1 + gh - wh + 5);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  text(k < .3 ? 'آب دارد بالا می‌آید!' : 'تا مدّ آب', cx, gy1 - 16,
    { size: 15, color: k < .3 ? '#a8402c' : P.inkSoft });
}

/** ثبتِ نهایی: «مساحت بین … و … است» — از روی همان چیزی که رنگ زده. */
function drawRecord() {
  if (!S.record) return;
  const t = S.done;
  const k = easeOut(clamp(t / .4, 0, 1));
  const w = 620, h = 116, x = SCENE_W / 2 - w / 2, y = 606;
  ctx.save();
  ctx.globalAlpha = k;
  withShadow(24, 10, .5, () => {
    ctx.fillStyle = P.paperLt;
    wobbleRect(x, y, w, h, 14, 51, 2.2); ctx.fill();
  }, '8, 4, 2');
  ctx.fillStyle = P.brassDk;
  wobbleRect(x, y, w, 9, 4, 53, 1); ctx.fill();
  text('در دفترِ ناخدا ثبت شد', x + w / 2, y + 32, { size: 17, color: P.inkSoft });
  const R = S.record;
  text('مساحتِ جزیره بین', x + w / 2 + 152, y + 74, { size: 22, family: 'Lalezar', color: P.ink });
  numText(fa(R.lo), x + w / 2 + 40, y + 74, { size: 38, color: P.goldDk });
  text('و', x + w / 2 - 6, y + 74, { size: 22, family: 'Lalezar', color: P.ink });
  numText(fa(R.hi), x + w / 2 - 56, y + 74, { size: 38, color: P.stripeDk });
  text(R.unit + ' است', x + w / 2 - 158, y + 74, { size: 22, family: 'Lalezar', color: P.ink });
  ctx.restore();
}

function drawHUD() {
  ctx.fillStyle = 'rgba(30, 18, 10, .88)';
  ctx.fillRect(0, 0, SCENE_W, HUD_H);
  ctx.fillStyle = 'rgba(203, 166, 79, .3)';
  ctx.fillRect(0, HUD_H - 2, SCENE_W, 2);
  text(L().name, SCENE_W - 24, HUD_H / 2, { size: 23, family: 'Lalezar', color: P.paper, align: 'right' });
  /* پرچم‌ها = جان */
  for (let i = 0; i < 3; i++) {
    const x = SCENE_W - 208 - i * 32;
    ctx.save();
    ctx.globalAlpha = i < S.flag ? 1 : .22;
    ctx.strokeStyle = i < S.flag ? P.brassLt : '#8d8577'; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.moveTo(x - 8, HUD_H / 2 - 13); ctx.lineTo(x - 8, HUD_H / 2 + 13); ctx.stroke();
    ctx.fillStyle = i < S.flag ? '#c9563f' : '#8d8577';
    ctx.beginPath(); ctx.moveTo(x - 6, HUD_H / 2 - 12); ctx.lineTo(x + 12, HUD_H / 2 - 6);
    ctx.lineTo(x - 6, HUD_H / 2); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  if (!L().endless) {
    numText(fa(Math.min(S.cleared, L().quota)) + ' / ' + fa(L().quota), SCENE_W / 2, HUD_H / 2, { size: 22, color: P.brassLt });
  } else {
    text('بی‌پایان', SCENE_W / 2, HUD_H / 2, { size: 22, family: 'Lalezar', color: P.brassLt });
  }
  numText(fa(S.score), 24, HUD_H / 2, { size: 25, color: P.brassLt, align: 'left' });
  numText('بیشترین ' + fa(S.best), 140, HUD_H / 2 + 1,
    { size: 14, color: 'rgba(242, 227, 192, .5)', align: 'left', family: 'Vazirmatn', weight: 700 });
  if (S.combo > 1) numText('×' + fa(S.combo), 248, HUD_H / 2, { size: 22, color: P.brassLt, align: 'left' });
}

function drawTutorial() {
  const st = S.tut.step;
  if (st === 0) {
    spot([CHART], .74);
    const h = tutCard(300, 556, 600,
      ['جزیره‌ای پیدا شده و باید مساحتش ثبت شود.', 'ولی لبه‌اش کج است و درست روی خانه‌ها نمی‌افتد.'], 'نقشهٔ جزیره');
    tutMore(600, 556 + h + 10, S.t, P.ink);
  } else if (st === 1) {
    spot([LEFT], .7);
    tutCard(330, 566, 540, ['یک قابِ شبکه بردار.',
      'درشت زود تمام می‌شود، ریز دقیق‌تر است.']);
  } else {
    spot([CHART, LEFT], .66);
    const h = tutCard(300, 548, 600,
      ['طلایی: خانه‌ای که کاملاً روی جزیره است.', 'راه‌راه: خانه‌ای که فقط لبه‌اش روی جزیره است.',
       'آخرش می‌بینی مساحت بینِ دو عدد است.'], 'دو مداد');
    tutMore(600, 548 + h + 10, S.t, P.ink);
  }
}

/* ───────── پرده‌ها ───────── */

function compassIcon(x, y) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = P.brassDk;
  wobbleCircle(0, 0, 28, 3, 1.4); ctx.fill();
  ctx.fillStyle = P.paperLt;
  wobbleCircle(0, 0, 23, 5, 1.2); ctx.fill();
  ctx.fillStyle = '#c9563f';
  ctx.beginPath(); ctx.moveTo(0, -19); ctx.lineTo(6, 0); ctx.lineTo(-6, 0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#3b3020';
  ctx.beginPath(); ctx.moveTo(0, 19); ctx.lineTo(6, 0); ctx.lineTo(-6, 0); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawIntro() {
  overlay({
    t: S.phaseT, w: 760, h: 286, y: 138,
    paper: P.paperLt, band: P.brassDk, ink: P.ink, inkSoft: '#7f6c48',
    icon: compassIcon,
    title: 'نقشهٔ جزیره',
    body: 'لبهٔ جزیره کج است و درست روی خانه‌ها نمی‌افتد.\nپس مساحتش یک عدد نیست: بینِ دو عدد است.\nقابِ شبکه را انتخاب کن و با دو مداد رنگ بزن.',
    btn: BTN_GO, btnLabel: 'برو سرِ نقشه', btnHot: S.hover === BTN_GO,
    btnFill: '#9a7930', btnHotFill: '#b18f3d',
  });
}

function drawWon() {
  const last = S.level + 1 >= LEVELS.length;
  overlay({
    t: S.phaseT, w: 720, h: 250, y: 160,
    paper: P.paperLt, band: P.brass, ink: P.ink, inkSoft: '#7f6c48',
    icon: compassIcon,
    title: L().endless ? 'دفتر پر شد' : 'همهٔ جزیره‌ها ثبت شد!',
    body: 'امتیاز: ' + fa(S.score) + (last ? '\nهمهٔ دریاها را گشتی. از اوّل؟' : ''),
    btn: BTN_GO, btnLabel: last ? 'دوباره' : 'دریای بعد', btnHot: S.hover === BTN_GO,
    btnFill: '#9a7930', btnHotFill: '#b18f3d',
  });
}

function drawLost() {
  overlay({
    t: S.phaseT, w: 720, h: 250, y: 160,
    paper: P.paperLt, band: P.bad, ink: P.ink, inkSoft: '#7f6c48',
    icon: (x, y) => { ctx.fillStyle = P.seaDk;
      ctx.beginPath(); ctx.moveTo(x - 34, y + 14);
      for (let i = 0; i <= 8; i++) ctx.lineTo(x - 34 + i * 8.5, y + 14 + Math.sin(i * 1.1) * 7);
      ctx.lineTo(x + 34, y + 26); ctx.lineTo(x - 34, y + 26); ctx.closePath(); ctx.fill(); },
    title: 'مدّ آب رسید',
    body: 'امتیاز: ' + fa(S.score) + '\nقابِ درشت‌تر زودتر تمام می‌شود.',
    btn: BTN_GO, btnLabel: 'دوباره', btnHot: S.hover === BTN_GO,
    btnFill: '#9a7930', btnHotFill: '#b18f3d',
  });
}
