<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b2333">
<title>کششِ زمین — نیرو همه‌جا (آزمایش)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>
  /* صفحه نباید هیچ‌جا اسکرول یا زوم شود؛ بازی باید مثل یک برنامه رفتار کند. */
  html, body {
    margin: 0; padding: 0; background: #1b2333;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body {
    position: fixed; inset: 0;          /* جلوی کشیده‌شدنِ صفحه در سافاریِ گوشی */
    width: 100%; height: 100vh; height: 100dvh;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none; -webkit-touch-callout: none;
  }

  /* گوشیِ عمودی صحنه را ریز می‌کند؛ بچه باید گوشی را بچرخاند. */
  #rotate { display: none; }
  @media (orientation: portrait) and (max-width: 860px) {
    #stage { display: none; }
    #rotate {
      display: flex; position: fixed; inset: 0;
      z-index: 9;
      flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      background: #1b2333; color: #f6ead2;
      font: 700 20px "Vazirmatn", Tahoma, sans-serif; text-align: center; padding: 32px;
    }
    #rotate svg { animation: tilt 2.4s ease-in-out infinite; }
    @keyframes tilt { 0%, 45% { transform: rotate(0deg); } 65%, 100% { transform: rotate(-90deg); } }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="rotate">
  <svg width="86" height="126" viewBox="0 0 86 126" fill="none" aria-hidden="true">
    <rect x="3" y="3" width="80" height="120" rx="12" stroke="#e8b448" stroke-width="5"/>
    <rect x="15" y="19" width="56" height="88" rx="5" fill="#e8b448" opacity=".28"/>
    <circle cx="43" cy="115" r="4" fill="#e8b448"/>
  </svg>
  <div>گوشی را بچرخان</div>
  <div style="font-weight:400;opacity:.7;font-size:16px">این بازی خوابیده بازی می‌شود</div>
</div>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   هستهٔ مشترکِ بازی‌ها — سبک «کاغذبُری»
   ───────────────────────────────────────────────────────────────────────
   این فایل جعبه‌ابزار است، نه چارچوب: هر بازی حلقه و وضعیت خودش را دارد
   و فقط از این توابع برای کشیدن استفاده می‌کند. دلیلش این است که هر بازی
   باید حس‌وحال خودش را داشته باشد، نه اینکه همه شبیه هم دربیایند.

   قاعده‌های ثابتِ تصویری:
   • نور همیشه از بالا-چپ می‌تابد، پس سایه‌ها به پایین-راست می‌افتند.
   • هیچ لبه‌ای کاملاً صاف نیست؛ همه کمی موج دارند (انگار با قیچی بریده).
   • هیچ خاکستریِ خالصی نداریم؛ همه‌ی خنثی‌ها به گرمیِ صحنه می‌زنند.
   • یک لایه‌ی دانه‌دانه‌ی کاغذ روی کلِ تصویر ضرب می‌شود.
   ═══════════════════════════════════════════════════════════════════════ */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const FA_D = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
const fa = (n) => String(n).replace(/\d/g, (d) => FA_D[+d]);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeIn = (t) => t * t * t;
const easeInOut = (t) => (t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2);
const easeBack = (t) => 1 + 2.7 * Math.pow(t-1, 3) + 1.7 * Math.pow(t-1, 2);
const easeElastic = (t) => t === 0 || t === 1 ? t : Math.pow(2, -9*t) * Math.sin((t*10 - .75) * 2.094) + 1;

/** تصادفِ تکرارپذیر: با یک بذر همیشه همان عدد. برای اینکه تزئین‌ها هر فریم نپرند. */
function noise1(x) {
  const s = Math.sin(x * 127.1) * 43758.5453;
  return s - Math.floor(s);
}
const pick = (arr, seed) => arr[Math.floor(noise1(seed) * arr.length) % arr.length];

/* ───────── بوم و صحنهٔ ثابت ───────── */

let ctx, SW, SH, CV, _refit = null;
let view = { scale: 1, ox: 0, oy: 0, w: 0, h: 0, dpr: 1 };
let _grain = null, _grainDark = null;

function initStage(canvas, w, h) {
  CV = canvas; SW = w; SH = h;
  ctx = canvas.getContext('2d');

  /* اندازه را از خودِ بوم می‌گیریم نه از innerHeight؛ چون در سافاریِ گوشی
     نوارِ آدرس باز و بسته می‌شود و innerHeight دروغ می‌گوید. */
  const fit = () => {
    const r = canvas.getBoundingClientRect();
    const vw = Math.round(r.width), vh = Math.round(r.height);
    if (vw < 20 || vh < 20) return;
    const dpr = Math.min(devicePixelRatio || 1, QUALITY > 0 ? 2 : 1);
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    const scale = Math.min(vw / SW, vh / SH);
    view = { scale, ox: (vw - SW*scale)/2, oy: (vh - SH*scale)/2, w: vw, h: vh, dpr };
    _grain = buildGrain();
  };
  _refit = fit;
  addEventListener('resize', fit);
  /* چرخاندنِ گوشی: اندازهٔ درست چند لحظه بعد می‌رسد، پس چندبار اندازه می‌گیریم. */
  addEventListener('orientationchange', () => {
    fit(); setTimeout(fit, 140); setTimeout(fit, 460);
  });
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(canvas);

  /* صدا در گوشی فقط بعد از اوّلین لمس اجازهٔ پخش دارد. */
  const unlock = () => { sfx._c(); removeEventListener('pointerdown', unlock); removeEventListener('touchstart', unlock); };
  addEventListener('pointerdown', unlock, { passive: true });
  addEventListener('touchstart', unlock, { passive: true });
  /* نگه‌داشتنِ انگشت نباید منوی مرورگر را باز کند. */
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  fit();
  return ctx;
}

/** قابِ صحنه را باز می‌کند: بعد از این، مختصات همیشه در فضای SW×SH است. */
function beginScene(bg) {
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, view.w, view.h);
  ctx.save();
  ctx.translate(view.ox, view.oy);
  ctx.scale(view.scale, view.scale);
  ctx.beginPath();
  ctx.rect(0, 0, SW, SH);
  ctx.clip();
}

/* ───────── پوششِ پایانِ قاب ─────────
   دانه‌های کاغذ و تیرگیِ گوشه‌ها هر دو ثابت‌اند و تغییر نمی‌کنند، ولی
   قبلاً هر فریم از نو کشیده می‌شدند: یکی با «multiply» روی کلِّ صفحه و
   یکی با یک گرادیانِ شعاعیِ تازه. اندازه‌گیری نشان داد همین دو تا
   ۱۱ تا ۱۶ میلی‌ثانیه از هر فریم را می‌خوردند — بیشتر از کشیدنِ خودِ
   صحنه. حالا یک بار در یک بومِ جدا پخته می‌شوند و هر فریم فقط یک
   drawImage است.                                                       */

let _ovl = null, _ovlKey = '';

function overlayLayer(grainAlpha, vignette) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const w = Math.max(2, Math.round(SW * q)), h = Math.max(2, Math.round(SH * q));
  const key = w + 'x' + h + '|' + grainAlpha + '|' + vignette;
  if (_ovl && _ovlKey === key) return _ovl;
  let c;
  try {
    c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g2 = c.getContext('2d');
    if (!g2) return null;
    if (_grainDark && grainAlpha > 0) {
      /* همان دانه‌ها، ولی به‌جای multiply به شکلِ سیاهِ کم‌رنگ */
      g2.globalAlpha = clamp(grainAlpha * 1.15, 0, 1);
      g2.fillStyle = g2.createPattern(_grainDark, 'repeat');
      g2.fillRect(0, 0, w, h);
      g2.globalAlpha = 1;
    }
    if (vignette) {
      const g = g2.createRadialGradient(w / 2, h / 2, h * .42, w / 2, h / 2, h * 1.05);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, vignette);
      g2.fillStyle = g;
      g2.fillRect(0, 0, w, h);
    }
  } catch (e) { return null; }
  _ovl = c; _ovlKey = key;
  return c;
}

/** بافتِ کاغذ، تیرگیِ گوشه‌ها، رنگ‌بندی و درخششِ نور را می‌گذارد و قاب را می‌بندد. */
function endScene(grainAlpha = .15, vignette = 'rgba(48,28,14,.30)', bloom = .34, grade = .14) {
  /* درخششِ نور خاموش است. اندازه‌گیری نشان داد هر فریم ۲۱ میلی‌ثانیه
     می‌گیرد — بیشتر از تمامِ کارهای دیگرِ یک فریم روی هم — چون برای
     ساختنش باید کلِّ بوم دوباره خوانده شود. از آن بدتر: متنِ فارسی را
     مه‌آلود می‌کرد و خواندنش را سخت‌تر. بی‌آن، صحنه تمیزتر است. */
  bloom = 0;
  if (QUALITY < 1) { grade = 0; grainAlpha *= .5; }
  if (QUALITY < 2) grade = 0;
  if (grade > 0) {
    /* رنگ‌بندیِ نرم: بالای صحنه گرم‌تر، پایین سردتر — عمق می‌دهد */
    const g = ctx.createLinearGradient(0, 0, 0, SH);
    g.addColorStop(0, `rgba(255, 214, 150, ${grade})`);
    g.addColorStop(.55, 'rgba(255, 255, 255, 0)');
    g.addColorStop(1, `rgba(40, 60, 110, ${grade * .9})`);
    ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalCompositeOperation = 'source-over';
  }
  const ov = (grainAlpha > 0 || vignette) ? overlayLayer(grainAlpha, vignette) : null;
  if (ov) ctx.drawImage(ov, 0, 0, SW, SH);
  ctx.restore();
  bloomPass(bloom);
}

/* ───────── درخششِ نور (bloom) ─────────
   قابِ رسم‌شده را کوچک می‌کنیم، دو بار در خودش ضرب می‌کنیم تا فقط
   روشن‌ها بمانند، محوش می‌کنیم و با حالتِ «lighter» رویش می‌گذاریم.
   نتیجه: چراغ‌ها، شعله‌ها و رنگ‌های روشن نور پخش می‌کنند. */
let _bl, _blc, _bl2, _bl2c, _blNo = false, _blTick = 0;

function bloomPass(amount) {
  if (!amount || _blNo || !CV.width) return;
  /* کوچک‌کردن و بزرگ‌کردنِ دوباره، خودش محو می‌کند — از filter خیلی ارزان‌تر است */
  const W = Math.max(4, Math.round(CV.width * .2)), H = Math.max(4, Math.round(CV.height * .2));
  const W2 = Math.max(2, Math.round(W * .28)), H2 = Math.max(2, Math.round(H * .28));
  try {
    if (!_bl) {
      _bl = document.createElement('canvas'); _blc = _bl.getContext('2d');
      _bl2 = document.createElement('canvas'); _bl2c = _bl2.getContext('2d');
      if (!_blc || !_bl2c) { _blNo = true; return; }
    }
    if (_bl.width !== W || _bl.height !== H) { _bl.width = W; _bl.height = H; }
    if (_bl2.width !== W2 || _bl2.height !== H2) { _bl2.width = W2; _bl2.height = H2; }
    /* ساختنِ نور یک قاب در میان کافی است؛ گذاشتنش هر قاب. */
    _blTick = (_blTick + 1) & 1;
    if (!_blTick) {
      _blc.globalCompositeOperation = 'source-over';
      _blc.clearRect(0, 0, W, H);
      _blc.drawImage(CV, 0, 0, W, H);
      _blc.globalCompositeOperation = 'multiply';
      _blc.drawImage(_bl, 0, 0);
      _blc.drawImage(_bl, 0, 0);
      _blc.globalCompositeOperation = 'source-over';
      _bl2c.clearRect(0, 0, W2, H2);
      _bl2c.drawImage(_bl, 0, 0, W2, H2);
    }

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = amount;
    ctx.drawImage(_bl2, 0, 0, CV.width, CV.height);
    ctx.restore();
  } catch (e) { _blNo = true; }
}

/* ───────── لایهٔ ثابت ─────────
   هرچه در صحنه تکان نمی‌خورد را یک‌بار می‌کشیم و بعد فقط کپی می‌کنیم. */
const _layers = {};
function staticLayer(key, w, h, paint) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const L = _layers[key];
  if (L && L.q === q && L.w === w && L.h === h) return L.cv;
  const off = document.createElement('canvas');
  off.width = Math.max(1, Math.round(w * q));
  off.height = Math.max(1, Math.round(h * q));
  const c = off.getContext('2d');
  c.setTransform(q, 0, 0, q, 0, 0);
  const prev = ctx;
  ctx = c;
  try { paint(); } finally { ctx = prev; }
  _layers[key] = { cv: off, q, w, h };
  return off;
}

/* ───────── نورپردازی و بافت ─────────
   کارِ این‌ها این است که هیچ سطحی «تختِ یک‌رنگ» نماند. */

/** شیبِ عمودی: بالا روشن، پایین تیره. */
function vgrad(y0, y1, top, bot) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, top); g.addColorStop(1, bot);
  return g;
}

/** حجمِ کروی: نور از بالا-چپ، سایه در پایین-راست. */
function ball(cx, cy, r, lit, base, dark) {
  const g = ctx.createRadialGradient(cx - r * .38, cy - r * .42, r * .06, cx, cy, r * 1.06);
  g.addColorStop(0, lit); g.addColorStop(.45, base); g.addColorStop(1, dark);
  return g;
}

/** لبهٔ روشنِ بالا-چپِ یک مسیر — همان «rim light». */
function rim(pathFn, col, w = 2.2) {
  ctx.save();
  ctx.beginPath(); pathFn();
  ctx.clip();
  ctx.beginPath(); pathFn();
  ctx.strokeStyle = col; ctx.lineWidth = w * 2; ctx.lineJoin = 'round';
  ctx.translate(-w * .5, -w * .6);
  ctx.stroke();
  ctx.restore();
}

/** سایهٔ چسبیده به زمین — چیزها را روی سطح می‌نشاند. */
function contact(cx, cy, rx, ry, alpha = .26) {
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
  g.addColorStop(0, `rgba(20, 12, 6, ${alpha})`);
  g.addColorStop(1, 'rgba(20, 12, 6, 0)');
  ctx.save();
  ctx.fillStyle = g;
  ctx.translate(cx, cy); ctx.scale(1, ry / Math.max(rx, ry));
  ctx.beginPath(); ctx.arc(0, 0, Math.max(rx, ry), 0, TAU); ctx.fill();
  ctx.restore();
}

const _tex = {};
/** بافتِ تکرارشونده؛ یک‌بار ساخته و بعد از حافظه خوانده می‌شود. */
function texture(key, w, h, paint) {
  if (_tex[key]) return _tex[key];
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const c = off.getContext('2d');
  paint(c, w, h);
  _tex[key] = ctx.createPattern(off, 'repeat');
  return _tex[key];
}

/** رگهٔ چوب. */
function texWood(base, grain) {
  return texture('w' + base + grain, 120, 120, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = grain; c.lineWidth = 1.4;
    for (let i = 0; i < 9; i++) {
      c.globalAlpha = .18 + noise1(i * 3.1) * .3;
      c.beginPath();
      const y0 = i * 14 + noise1(i) * 6;
      c.moveTo(0, y0);
      for (let x = 0; x <= w; x += 10) c.lineTo(x, y0 + Math.sin(x * .09 + i) * 2.6);
      c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** تارِ پارچه. */
function texCloth(base, thread) {
  return texture('c' + base + thread, 16, 16, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = thread; c.lineWidth = 1; c.globalAlpha = .5;
    for (let i = 0; i < w; i += 4) {
      c.beginPath(); c.moveTo(i, 0); c.lineTo(i, h); c.stroke();
      c.beginPath(); c.moveTo(0, i); c.lineTo(w, i); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** دانه‌های سنگ. */
function texStone(base, spec) {
  return texture('s' + base + spec, 90, 90, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) {
      c.globalAlpha = .05 + noise1(i * 1.7) * .16;
      c.fillStyle = spec;
      const r = .6 + noise1(i * 5.3) * 1.9;
      c.beginPath();
      c.arc(noise1(i * 2.1) * w, noise1(i * 3.7 + 1) * h, r, 0, TAU);
      c.fill();
    }
    c.globalAlpha = 1;
  });
}

/** الیافِ کاغذ. */
function texPaper(base) {
  return texture('p' + base, 100, 100, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 130; i++) {
      c.globalAlpha = .04 + noise1(i * 2.3) * .07;
      c.strokeStyle = i % 2 ? '#ffffff' : '#5a4326';
      c.lineWidth = .9;
      const x = noise1(i * 1.3) * w, y = noise1(i * 4.1 + 2) * h;
      const a = noise1(i * 7.7) * TAU, l = 4 + noise1(i * 9.1) * 12;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

function buildGrain() {
  const s = 260;
  const off = document.createElement('canvas');
  off.width = off.height = s;
  const c = off.getContext('2d');
  const img = c.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    const v = 214 + Math.random() * 41;
    img.data[i*4] = v; img.data[i*4+1] = v; img.data[i*4+2] = v; img.data[i*4+3] = 255;
  }
  c.putImageData(img, 0, 0);
  /* همان دانه‌ها به شکلِ سیاهِ کم‌رنگ، تا بشود بدونِ multiply گذاشتشان */
  const d = document.createElement('canvas');
  d.width = d.height = s;
  const dc = d.getContext('2d');
  const dimg = dc.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    dimg.data[i*4] = 0; dimg.data[i*4+1] = 0; dimg.data[i*4+2] = 0;
    dimg.data[i*4+3] = 255 - img.data[i*4];
  }
  dc.putImageData(dimg, 0, 0);
  _grainDark = d;
  _ovl = null; _ovlKey = '';
  return ctx.createPattern(off, 'repeat');
}

function toStage(e) {
  const r = CV.getBoundingClientRect();
  return {
    x: (e.clientX - r.left - view.ox) / view.scale,
    y: (e.clientY - r.top - view.oy) / view.scale,
  };
}

const inRect = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
const inCircle = (p, b, pad = 0) => Math.hypot(p.x - b.x, p.y - b.y) <= b.r + pad;

/* ───────── قلم‌های کاغذبُری ───────── */

/** دایره‌ای که انگار با قیچی بریده شده. */
function wobbleCircle(cx, cy, r, seed = 0, amp = 2.2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const rr = r + Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp * .45;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** بیضیِ ناصاف — برای چیزهایی که گرد نیستند ولی نرم‌اند. */
function wobbleEllipse(cx, cy, rx, ry, rot = 0, seed = 0, amp = 2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const w = 1 + (Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp*.45) / Math.max(rx, ry);
    const px = Math.cos(a) * rx * w, py = Math.sin(a) * ry * w;
    const x = cx + px*Math.cos(rot) - py*Math.sin(rot);
    const y = cy + px*Math.sin(rot) + py*Math.cos(rot);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** مستطیلِ گِرد با گوشه‌های کمی کج. */
function wobbleRect(x, y, w, h, r = 12, seed = 0, amp = 1.6) {
  const j = (k) => (noise1(seed*9.7 + k) - .5) * amp * 2;
  ctx.beginPath();
  ctx.moveTo(x + r + j(1), y + j(2));
  ctx.lineTo(x + w - r + j(3), y + j(4));
  ctx.quadraticCurveTo(x + w + j(5), y + j(6), x + w + j(7), y + r + j(8));
  ctx.lineTo(x + w + j(9), y + h - r + j(10));
  ctx.quadraticCurveTo(x + w + j(11), y + h + j(12), x + w - r + j(13), y + h + j(14));
  ctx.lineTo(x + r + j(15), y + h + j(16));
  ctx.quadraticCurveTo(x + j(17), y + h + j(18), x + j(19), y + h - r + j(20));
  ctx.lineTo(x + j(21), y + r + j(22));
  ctx.quadraticCurveTo(x + j(23), y + j(24), x + r + j(1), y + j(2));
  ctx.closePath();
}

/** سایهٔ نرم؛ نور از بالا-چپ. */
function withShadow(blur, dy, alpha, fn, hue = '78, 46, 24') {
  ctx.save();
  ctx.shadowColor = `rgba(${hue}, ${alpha})`;
  ctx.shadowBlur = blur;
  ctx.shadowOffsetY = dy;
  ctx.shadowOffsetX = dy * .35;
  fn();
  ctx.restore();
}

/** یک برگه‌ی کاغذ با سایه — پایه‌ی همه‌ی کارت‌ها و تابلوها. */
function paper(x, y, w, h, fill, seed = 1, r = 12, shadow = .26) {
  withShadow(16, 7, shadow, () => {
    ctx.fillStyle = fill;
    wobbleRect(x, y, w, h, r, seed, 2);
    ctx.fill();
  });
  /* الیافِ کاغذ و لبهٔ روشن، تا سطح تخت نماند */
  ctx.save();
  ctx.beginPath(); wobbleRect(x, y, w, h, r, seed, 2); ctx.clip();
  ctx.globalAlpha = .5;
  ctx.fillStyle = texPaper(fill);
  ctx.fillRect(x, y, w, h);
  ctx.globalAlpha = 1;
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.4, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(90,60,20,.1)');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
}

function text(str, x, y, o = {}) {
  const size = o.size || 20;
  const fam = o.family || 'Vazirmatn';
  ctx.save();
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.font = `${fam === 'Lalezar' ? '400' : (o.weight || 700)} ${size}px "${fam}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.baseline || 'middle';
  ctx.fillStyle = o.color || '#43291b';
  ctx.direction = 'rtl';
  if (o.stroke) {
    ctx.lineWidth = o.strokeWidth || 5;
    ctx.strokeStyle = o.stroke;
    ctx.lineJoin = 'round';
    ctx.strokeText(str, x, y, o.maxWidth);
  }
  ctx.fillText(str, x, y, o.maxWidth);
  ctx.restore();
}

/** متنِ چندخطی که خودش می‌شکند. ارتفاعِ اشغال‌شده را برمی‌گرداند. */
function textWrap(str, x, y, maxW, o = {}) {
  const size = o.size || 19, lh = o.lineHeight || size * 1.7;
  ctx.font = `${o.weight || 700} ${size}px "${o.family || 'Vazirmatn'}", Tahoma, sans-serif`;
  const lines = [];
  for (const para of str.split('\n')) {
    let line = '';
    for (const wd of para.split(' ')) {
      const t = line ? line + ' ' + wd : wd;
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = wd; }
      else line = t;
    }
    lines.push(line);
  }
  lines.forEach((l, i) => text(l, x, y + i * lh, o));
  return lines.length * lh;
}

/* ───────── ذره‌ها ───────── */

class Bits {
  constructor() { this.list = []; }
  add(x, y, n, kind, colors, opts = {}) {
    for (let i = 0; i < n; i++) {
      const a = opts.dir !== undefined ? opts.dir + (Math.random()-.5) * (opts.spread || 1) : Math.random() * TAU;
      const sp = (opts.speed || 200) * (.4 + Math.random());
      this.list.push({
        kind, x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - (opts.lift || 0),
        r: (opts.size || 4) * (.5 + Math.random()),
        rot: Math.random() * TAU, vr: (Math.random()-.5) * 10,
        col: colors[(Math.random() * colors.length) | 0],
        grav: opts.grav === undefined ? 620 : opts.grav,
        drag: opts.drag || .995,
        life: (opts.life || .9) * (.6 + Math.random() * .8), age: 0,
      });
    }
  }
  confetti(x, y, n, colors) {
    this.add(x, y, n, 'flake', colors, { speed: 420, lift: 190, size: 5, life: 1.6, grav: 780 });
  }
  spark(x, y, n, colors) {
    this.add(x, y, n, 'dot', colors, { speed: 180, lift: 30, size: 3.4, life: .7, grav: 260, drag: .93 });
  }
  step(dt) {
    for (const p of this.list) {
      p.age += dt;
      p.vy += p.grav * dt;
      p.vx *= p.drag; p.vy *= p.drag;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    }
    this.list = this.list.filter((p) => p.age < p.life);
  }
  draw() {
    for (const p of this.list) {
      const k = clamp(1 - p.age / p.life, 0, 1);
      ctx.save();
      ctx.globalAlpha = k;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.col;
      if (p.kind === 'flake') ctx.fillRect(-p.r, -p.r*1.5, p.r*2, p.r*3);
      else if (p.kind === 'leaf') { wobbleEllipse(0, 0, p.r*1.8, p.r*.8, 0, p.r, .6); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(0, 0, p.r * k, 0, TAU); ctx.fill(); }
      ctx.restore();
    }
  }
  clear() { this.list.length = 0; }
}

/* ───────── صدا (بدون فایل صوتی) ───────── */

const sfx = {
  ac: null, on: true,
  _c() {
    if (!this.on) return null;
    if (!this.ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; this.ac = new A(); }
    if (this.ac.state === 'suspended') this.ac.resume();
    return this.ac;
  },
  tone(f, dur = .16, type = 'sine', gain = .13, delay = 0) {
    const c = this._c(); if (!c) return;
    const t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(t0 + dur + .04);
  },
  tap()  { this.tone(430, .07, 'triangle', .09); },
  place(){ this.tone(620, .11, 'sine', .12); },
  pop()  { this.tone(760, .09, 'sine', .11); },
  slide(){ this.tone(240, .22, 'sine', .07); },
  good() { [523, 659, 784].forEach((f,i) => this.tone(f, .22, 'sine', .13, i*.07)); },
  win()  { [523, 659, 784, 1047].forEach((f,i) => this.tone(f, .34, 'triangle', .13, i*.10)); },
  nope() { this.tone(180, .2, 'sawtooth', .07); },
  tick() { this.tone(1100, .04, 'square', .05); },
};

/* ───────── قطعه‌های آماده ───────── */

function star(x, y, r, col, rot = 0) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = col;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI/2 + i * Math.PI/5;
    const rr = i % 2 ? r * .45 : r;
    const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/** دکمهٔ کاغذی. hovered را خودِ بازی می‌دهد؛ اینجا فقط کشیده می‌شود. */
/** رنگ را روشن‌تر (k>0) یا تیره‌تر (k<0) می‌کند. */
function shade(col, k) {
  const c = String(col).trim();
  let r, g2, b2;
  if (c[0] === '#') {
    const h = c.length === 4 ? c[1]+c[1]+c[2]+c[2]+c[3]+c[3] : c.slice(1, 7);
    r = parseInt(h.slice(0,2), 16); g2 = parseInt(h.slice(2,4), 16); b2 = parseInt(h.slice(4,6), 16);
  } else {
    const m = c.match(/[\d.]+/g);
    if (!m || m.length < 3) return col;
    r = +m[0]; g2 = +m[1]; b2 = +m[2];
  }
  const f = (v) => Math.round(clamp(k < 0 ? v * (1 + k) : v + (255 - v) * k, 0, 255));
  return 'rgb(' + f(r) + ',' + f(g2) + ',' + f(b2) + ')';
}

function button(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 3 : 0;
  const fill = o.disabled ? (o.off || '#bcaa92') : (hot ? (o.hotFill || o.fill) : o.fill);
  const r = o.r === undefined ? 14 : o.r;
  /* لبهٔ زیرینِ تیره — دکمه از صفحه بیرون می‌زند */
  ctx.fillStyle = shade(fill, -.36);
  wobbleRect(b.x, b.y + dy + 7, b.w, b.h, r, b.x + b.y, 2);
  ctx.fill();
  withShadow(hot ? 22 : 14, hot ? 5 : 8, .32, () => {
    ctx.fillStyle = fill;
    wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2);
    ctx.fill();
  });
  /* حجم: روشن از بالا، تیره به پایین */
  ctx.save();
  ctx.beginPath(); wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2); ctx.clip();
  const g = ctx.createLinearGradient(0, b.y + dy, 0, b.y + dy + b.h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.45, 'rgba(255,255,255,.04)');
  g.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = g;
  ctx.fillRect(b.x, b.y + dy, b.w, b.h);
  /* برقِ باریکِ لبهٔ بالا */
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.fillRect(b.x + r, b.y + dy + 2, b.w - r * 2, 2);
  ctx.restore();
  text(label, b.x + b.w/2, b.y + b.h/2 + dy - (o.sub ? 9 : 0), {
    size: o.size || 26, color: o.color || '#fdf6e8', family: o.family || 'Lalezar',
  });
  if (o.sub) text(o.sub, b.x + b.w/2, b.y + b.h/2 + dy + 17,
    { size: 14, color: o.subColor || 'rgba(255,255,255,.88)' });
}

/** دکمهٔ گرد کوچک (مثل + و −). */
function roundButton(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 2 : 0;
  withShadow(10, hot ? 3 : 5, .3, () => {
    ctx.fillStyle = o.disabled ? '#cbbba3' : (hot ? (o.hotFill || o.fill) : o.fill);
    wobbleCircle(b.x, b.y + dy, b.r, b.x, 1.4);
    ctx.fill();
  });
  text(label, b.x, b.y + dy - 1,
    { size: o.size || 32, color: o.disabled ? '#a8988a' : (o.color || '#fdf6e8'), family: 'Lalezar' });
}

/** پرده‌ی تمام‌صفحه: برای شروعِ پرده و برای جشنِ پایان. */
function overlay(o) {
  const k = easeOut(clamp(o.t / .5, 0, 1));
  ctx.fillStyle = `rgba(30, 22, 16, ${.66 * k})`;
  ctx.fillRect(0, 0, SW, SH);

  const w = o.w || 700, h = o.h || 290;
  const x = (SW - w) / 2, y = o.y || (SH * .22);
  const s = lerp(.9, 1, easeBack(clamp(o.t / .65, 0, 1)));
  ctx.save();
  ctx.translate(SW/2, y + h/2);
  ctx.scale(s, s);
  ctx.translate(-SW/2, -(y + h/2));

  withShadow(30, 14, .42, () => {
    ctx.fillStyle = o.paper || '#fbf3e2';
    wobbleRect(x, y, w, h, 18, 121, 2.4);
    ctx.fill();
  });
  ctx.fillStyle = o.band || '#c8434f';
  wobbleRect(x, y, w, 12, 6, 123, 1);
  ctx.fill();

  if (o.icon) o.icon(SW/2, y + 56);
  text(o.title, SW/2, y + (o.icon ? 108 : 62),
    { size: o.titleSize || 36, color: o.ink || '#43291b', family: 'Lalezar', alpha: k });
  textWrap(o.body, SW/2, y + (o.icon ? 158 : 116), w - 90,
    { size: 19, color: o.inkSoft || '#8a6a52', alpha: k });
  ctx.restore();

  button(o.btn, o.btnLabel, { hot: o.btnHot, fill: o.btnFill || '#7fa356', hotFill: o.btnHotFill || '#8fb45f', size: 28 });
}

/** پیامِ کوتاهِ بالای صحنه. */
class Toast {
  constructor() { this.msg = null; this.t = 0; this.kind = 'info'; }
  say(msg, kind = 'info') { this.msg = msg; this.kind = kind; this.t = 2.6; }
  step(dt) { if (this.t > 0) { this.t -= dt; if (this.t <= 0) this.msg = null; } }
  draw(y = 24, colors = {}) {
    if (!this.msg) return;
    const k = clamp(this.t, 0, 1) * clamp((2.6 - this.t) * 5, 0, 1);
    ctx.save();
    ctx.globalAlpha = k;
    ctx.font = `700 19px "Vazirmatn", Tahoma, sans-serif`;
    const w = ctx.measureText(this.msg).width + 76;
    const fill = this.kind === 'good' ? (colors.good || '#7fa356')
               : this.kind === 'bad' ? (colors.bad || '#c8434f')
               : (colors.info || '#fbf3e2');
    paper(SW/2 - w/2, y, w, 48, fill, 151, 12, .3);
    text(this.msg, SW/2, y + 25,
      { size: 19, color: this.kind === 'info' ? (colors.ink || '#43291b') : '#fff8ec' });
    ctx.restore();
  }
}

/* ───────── آموزشِ پرده‌ای ─────────
   پرده‌هایی که منتظرِ کارِ بچه نیستند با یک ضربه جلو می‌روند. تایمر فقط
   پشتیبان است؛ بچهٔ کلاس سومی باید فرصتِ خواندن داشته باشد، نه اینکه
   متن قبل از تمام شدنِ خواندنش برود.                                    */

/** اگر پردهٔ فعلی خواندنی است، ضربه را می‌خورد و می‌رود پردهٔ بعد. */
function tutTap(tut, tapSteps, lastStep) {
  if (!tut.on || tapSteps.indexOf(tut.step) < 0) return false;
  if (tut.step >= lastStep) tut.on = false;
  else { tut.step++; tut.t = 0; }
  sfx.tap();
  return true;
}

/** نشانهٔ «برای ادامه بزن» — زیرِ کارتِ آموزش. */
function tutMore(cx, y, t, ink = '#3a2a18', bg = 'rgba(255, 250, 238, .94)') {
  ctx.save();
  ctx.globalAlpha = .62 + .38 * Math.sin(t * 3.2);
  ctx.font = '700 15px "Vazirmatn", Tahoma, sans-serif';
  const label = 'برای ادامه، هرجا را بزن';
  const w = ctx.measureText(label).width + 40, h = 32, x = cx - w / 2, r = 16;
  withShadow(10, 4, .3, () => {
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath(); ctx.fill();
  });
  text(label, cx, y + h / 2, { size: 15, color: ink });
  ctx.restore();
}

/** فونت‌ها را می‌آورد و بعد بازی را شروع می‌کند.
    مهم: هر دو راه (رسیدنِ فونت و مهلتِ پشتیبان) ممکن است برسند، ولی
    شروع فقط باید یک بار انجام شود؛ وگرنه دو حلقهٔ فریم راه می‌افتد و
    بازی دوبرابر سریع می‌شود. */
function whenFontsReady(start) {
  let done = false;
  const go = () => { if (done) return; done = true; start(); };
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('400 40px Lalezar'),
      document.fonts.load('700 20px Vazirmatn'),
      document.fonts.load('900 20px Vazirmatn'),
    ]).then(go, go);
    setTimeout(go, 2600);
  } else go();
}

/** حلقهٔ فریم با dtِ محدودشده. */
/* ───────── کیفیتِ خودکار ─────────
   اگر دستگاه کُند بود، اوّل درخشش و بعد رنگ‌بندی خاموش می‌شود تا بازی
   روان بماند. روی دستگاهِ قوی همه‌چیز روشن است. */
let QUALITY = 2;
let _fAcc = 0, _fN = 0, _qHold = 0;

function _qualityTick(gap) {
  if (gap <= 0 || gap > 200) return;
  _fAcc += gap; _fN++;
  if (_fN < 45) return;
  const avg = _fAcc / _fN;
  _fAcc = 0; _fN = 0;
  if (_qHold > 0) { _qHold--; return; }
  /* فاصلهٔ بالا و پایین باید باز باشد، وگرنه کیفیت بین دو پله بالا و
     پایین می‌پرد و بازی مدام تغییرِ ظاهر می‌دهد. */
  const before = QUALITY;
  if (avg > 21 && QUALITY > 0) { QUALITY--; _qHold = 4; }
  else if (avg < 13.5 && QUALITY < 2) { QUALITY++; _qHold = 10; }
  /* در پایین‌ترین کیفیت، صحنه را با نقطه‌های کمتر می‌کشیم */
  if (before !== QUALITY && (before === 0 || QUALITY === 0) && _refit) _refit();
}

/* یک حلقه، نه بیشتر — دو حلقه یعنی زمانِ بازی دوبرابر می‌گذرد.

   MOTION: تا پیش از این، به‌خاطرِ باگِ دو حلقه، همهٔ بازی‌ها عملاً با
   سرعتِ دو برابر اجرا می‌شدند و زمان‌بندی‌ها هم با همان حس تنظیم شده
   بودند. حالا که باگ رفع شده، سرعتِ درست (یک برابر) کُند به نظر
   می‌رسد. این ضریب جانِ حرکت‌ها را برمی‌گرداند، ولی نه تا آن دو برابرِ
   تصادفی. فقط روی جانِ حرکت اثر دارد، نه روی هیچ قانونِ علمی. */
const MOTION = 1.45;
let _looping = false;
function runLoop(step) {
  if (_looping) return;
  _looping = true;
  let last = performance.now();
  const frame = (now) => {
    const gap = now - last;
    /* بریدنِ بعد از ضرب، تا یک فریمِ کُند پرشِ بزرگ نسازد */
    const dt = Math.min(gap / 1000 * MOTION, 1/15);
    last = now;
    _qualityTick(gap);
    step(dt);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

/* ═════════════════ بازی ═════════════════ */
/* ═══════════════════════════════════════════════════════════════════════
   کششِ زمین — علومِ سوم، درس ۹ «نیرو همه‌جا (۱)»

   آزمایشِ کتاب: «زمین چه اجسامی را با نیروی بیشتری به طرفِ خود
   می‌کشد؟ اجسام را در دست بگیرید و سنگینی‌شان را مقایسه کنید. جرمِ
   هرکدام را با ترازو اندازه بگیرید. به فنر وصل کنید و طولِ فنر را
   اندازه بگیرید و در جدول بنویسید.»

   همان جدول اینجاست و خودش پر نمی‌شود: هر جسم را باید اوّل روی ترازو
   بگذاری و بعد به فنر آویزان کنی، بعد ثبت کنی. آخرِ کار هم باید
   خودت اجسام را از پرکشش‌ترین به کم‌کشش‌ترین بچینی.

   ── درستیِ فیزیکی ───────────────────────────────────────────────
   فنر از قانونِ هوک پیروی می‌کند و وزن از قانونِ گرانش:

        وزن = جرم × شتابِ گرانش (۹٫۸۱ نیوتون بر کیلوگرم)
        کشیدگیِ فنر = وزن ÷ ثابتِ فنر
        طولِ فنر = طولِ آزاد + کشیدگی

   ثابتِ فنر ۴۹ نیوتون بر متر است؛ پس نیم‌کیلو آب فنر را ۱۰ سانتی‌متر
   می‌کشد. جرم‌ها هم جرم‌های واقعیِ همان چیزهاست. هیچ عددی دستی
   نوشته نشده — همه از همین دو قانون درمی‌آید.
   ═══════════════════════════════════════════════════════════════════════ */

const SCENE_W = 1200, SCENE_H = 760;
const HUD_H = 56;

const P = {
  bg:    '#1b2333', bgLo: '#121824', bgHi: '#28344a',
  wood:  '#96703f', woodDk: '#5b4526', woodLt: '#c39a63',
  steel: '#9aa9ba', steelDk: '#5d6a79', steelLt: '#d6e0ea',
  paper: '#fbf7ec', card: '#ffffff',
  ink:   '#1e2733', inkSoft: '#78838f',
  good:  '#4e9f6c', bad: '#c04a34', gold: '#e0a63f', accent: '#5b8fd6',
  apple: '#d34b47', appleLf: '#4e9f5c', water: '#68b6d8', ball: '#c9d84a',
  rock:  '#8a8f96', book: '#7f5aa8', rubber: '#e8829f',
};

/* ───────── قانونِ فنر و وزن ───────── */

const G = 9.81;                /* نیوتون بر کیلوگرم */
const K_SPRING = 49;           /* نیوتون بر متر */
const L0_CM = 8;               /* طولِ آزادِ فنر، سانتی‌متر */
const PXCM = 17;               /* پیکسل بر سانتی‌متر */

/** طولِ فنر وقتی جسمی به جرمِ m گرم از آن آویزان است. */
function springLen(gramme) {
  const w = gramme / 1000 * G;             /* نیوتون */
  const x = w / K_SPRING * 100;            /* سانتی‌متر */
  return L0_CM + x;
}

const OBJS = [
  { id: 'pak',   n: 'پاک‌کن',        g: 20 },
  { id: 'tenis', n: 'توپِ تنیس',     g: 58 },
  { id: 'sib',   n: 'سیب',           g: 150 },
  { id: 'sang',  n: 'سنگ',           g: 240 },
  { id: 'ketab', n: 'کتاب',          g: 350 },
  { id: 'botri', n: 'بطریِ نیم‌لیتری آب', g: 500 },
];
const objBy = (id) => OBJS.find((o) => o.id === id);
const NEED = 4;

/* ───────── وضعیت ───────── */

const S = {
  phase: 'intro', phaseT: 0,
  onScale: null, onHook: null,
  weighed: {},                /* شناسه → جرمِ خوانده‌شده */
  rows: [],                   /* {id, g, len} */
  order: [null, null, null, null],
  mark: null, markT: 0,
  drag: null,                 /* {id, x, y, from} */
  springT: 0, springV: 0, springL: L0_CM,
  t: 0, hover: null, tip: '', tipT: 0, shake: 0,
};

const bits = new Bits();
const toast = new Toast();
const cv = document.getElementById('stage');
initStage(cv, SCENE_W, SCENE_H);
function tip(msg) { S.tip = msg; S.tipT = 3.6; }

const hungMass = () => (S.onHook ? objBy(S.onHook).g : 0);
const targetLen = () => springLen(hungMass());
const recorded = (id) => S.rows.some((r) => r.id === id);

/* ───────── جای‌ها ───────── */

const PAN = { x: 24, y: 96, w: 320, h: 640 };
const STAND = { x: 360, y: 96, w: 430, h: 640 };
const SHELF = { x: 806, y: 96, w: 370, h: 400 };
const SCALE = { x: 806, y: 512, w: 370, h: 224 };

const SPRING_X = STAND.x + 232;
const SPRING_TOP = STAND.y + 96;
const BTN_REC = { x: PAN.x + 16, y: PAN.y + 470, w: PAN.w - 32, h: 56 };
const BTN_GO = { x: SCENE_W / 2 - 150, y: 486, w: 300, h: 68 };
const BTN_AGAIN = { x: SCENE_W / 2 - 150, y: 492, w: 300, h: 68 };
const BTN_CHECK = { x: SCENE_W / 2 - 150, y: 634, w: 300, h: 60 };

function shelfSlot(i) {
  const c = i % 2, r = (i / 2) | 0;
  return { x: SHELF.x + 22 + c * 172, y: SHELF.y + 66 + r * 110, w: 150, h: 96 };
}
const HOOK = () => ({ x: SPRING_X, y: SPRING_TOP + S.springL * PXCM });
const PAN_SCALE = { x: SCALE.x + 96, y: SCALE.y + 92, w: 180, h: 20 };
/* جای ۱ سمتِ راست است: از پرکشش‌ترین به کم‌کشش‌ترین */
function orderSlot(i) { return { x: 1000 - i * 210, y: 462, w: 180, h: 132 }; }
function poolSlot(i) { return { x: 1000 - i * 210, y: 232, w: 180, h: 132 }; }

/* ───────── ورودی ───────── */

function pickFrom(id, from) {
  S.drag = { id, x: 0, y: 0, from };
  if (from === 'scale') S.onScale = null;
  if (from === 'hook') S.onHook = null;
  sfx.tap();
}

function dropDrag(p) {
  const d = S.drag;
  if (!d) return;
  S.drag = null;
  if (inRect(p, SCALE)) {
    if (S.onScale && S.onScale !== d.id) { tip('اوّل این را از ترازو بردار.'); sfx.nope(); return; }
    S.onScale = d.id;
    S.weighed[d.id] = objBy(d.id).g;
    sfx.place();
    return;
  }
  const h = HOOK();
  if (Math.hypot(p.x - h.x, p.y - h.y) < 150 && p.x > STAND.x && p.x < STAND.x + STAND.w) {
    if (S.onHook && S.onHook !== d.id) { tip('اوّل این را از فنر بردار.'); sfx.nope(); return; }
    S.onHook = d.id;
    sfx.place();
    return;
  }
  sfx.pop();
}

cv.addEventListener('pointermove', (e) => {
  const p = toStage(e);
  if (S.drag) { S.drag.x = p.x; S.drag.y = p.y; return; }
  S.hover = null;
  if (S.phase === 'intro') { if (inRect(p, BTN_GO)) S.hover = BTN_GO; }
  else if (S.phase === 'won') { if (inRect(p, BTN_AGAIN)) S.hover = BTN_AGAIN; }
  else if (S.phase === 'order') {
    if (inRect(p, BTN_CHECK)) S.hover = { k: 'check' };
    for (let i = 0; i < 4; i++) if (inRect(p, orderSlot(i))) S.hover = { k: 'slot', i };
  } else {
    if (inRect(p, BTN_REC)) S.hover = { k: 'rec' };
    for (let i = 0; i < OBJS.length; i++) if (inRect(p, shelfSlot(i))) S.hover = { k: 'obj', i };
  }
  cv.style.cursor = S.hover ? 'pointer' : 'default';
});

cv.addEventListener('pointerdown', (e) => {
  const p = toStage(e);
  const cap = () => { try { cv.setPointerCapture(e.pointerId); } catch { /* ok */ } };
  if (S.phase === 'intro') { if (inRect(p, BTN_GO)) { S.phase = 'lab'; S.phaseT = 0; sfx.good(); } return; }
  if (S.phase === 'won') {
    if (inRect(p, BTN_AGAIN)) {
      S.phase = 'intro'; S.phaseT = 0;
      S.rows = []; S.weighed = {}; S.onScale = null; S.onHook = null;
      S.order = [null, null, null, null]; S.mark = null;
      sfx.tap();
    }
    return;
  }
  if (S.phase === 'order') {
    if (inRect(p, BTN_CHECK)) { checkOrder(); return; }
    /* برداشتن از جای چیدمان */
    for (let i = 0; i < 4; i++) {
      if (!inRect(p, orderSlot(i)) || !S.order[i]) continue;
      S.drag = { id: S.order[i], x: p.x, y: p.y, from: 'order' + i };
      S.order[i] = null; S.mark = null; cap(); sfx.tap();
      return;
    }
    /* برداشتن از ردیفِ پایین */
    const rest = S.rows.filter((r) => S.order.indexOf(r.id) < 0);
    for (let i = 0; i < rest.length; i++) {
      if (!inRect(p, poolSlot(i))) continue;
      S.drag = { id: rest[i].id, x: p.x, y: p.y, from: 'pool' };
      S.mark = null; cap(); sfx.tap();
      return;
    }
    return;
  }
  if (inRect(p, BTN_REC)) { record(); return; }
  if (S.onScale) {
    const b = PAN_SCALE;
    if (Math.abs(p.x - (b.x + b.w / 2)) < 90 && Math.abs(p.y - (b.y - 40)) < 80) {
      pickFrom(S.onScale, 'scale'); S.drag.x = p.x; S.drag.y = p.y; cap(); return;
    }
  }
  if (S.onHook) {
    const h = HOOK();
    if (Math.hypot(p.x - h.x, p.y - h.y - 44) < 70) {
      pickFrom(S.onHook, 'hook'); S.drag.x = p.x; S.drag.y = p.y; cap(); return;
    }
  }
  for (let i = 0; i < OBJS.length; i++) {
    if (!inRect(p, shelfSlot(i))) continue;
    const id = OBJS[i].id;
    if (S.onScale === id || S.onHook === id) return;
    pickFrom(id, 'shelf'); S.drag.x = p.x; S.drag.y = p.y; cap();
    return;
  }
});

function release(e) {
  if (!S.drag) return;
  const p = { x: S.drag.x, y: S.drag.y };
  if (S.phase === 'order') {
    for (let i = 0; i < 4; i++) {
      if (!inRect(p, orderSlot(i)) || S.order[i]) continue;
      S.order[i] = S.drag.id; S.drag = null; sfx.place(); return;
    }
    S.drag = null; sfx.pop();
    return;
  }
  dropDrag(p);
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
addEventListener('blur', release);

function record() {
  if (!S.onHook) { tip('اوّل یک جسم به فنر آویزان کن.'); S.shake = .1; sfx.nope(); return; }
  const id = S.onHook;
  if (recorded(id)) { tip('این را ثبت کرده‌ای.'); return; }
  if (S.weighed[id] === undefined) { tip('جرمش را هنوز با ترازو اندازه نگرفته‌ای.'); S.shake = .12; sfx.nope(); return; }
  if (Math.abs(S.springL - targetLen()) > .4) { tip('صبر کن فنر آرام بگیرد.'); return; }
  S.rows.push({ id, g: objBy(id).g, len: targetLen() });
  sfx.good();
  bits.confetti(PAN.x + PAN.w / 2, PAN.y + 300, 16, [P.good, P.gold, P.card]);
  if (S.rows.length >= NEED) {
    S.phase = 'order'; S.phaseT = 0;
    toast.say('حالا بچین', 'good');
  } else toast.say('ثبت شد', 'good');
}

function checkOrder() {
  if (S.order.some((o) => !o)) { tip('هر چهار جا را پر کن.'); S.shake = .1; sfx.nope(); return; }
  const want = S.rows.slice().sort((a, b) => b.g - a.g).map((r) => r.id);
  S.mark = S.order.map((id, i) => id === want[i]);
  S.markT = 2.6;
  if (S.mark.every(Boolean)) {
    sfx.win();
    S.phase = 'won'; S.phaseT = 0;
  } else { sfx.nope(); S.shake = .14; }
}

/* ───────── حلقه ───────── */

function step(dt) {
  S.t += dt;
  if (S.phaseT < 9) S.phaseT += dt;
  if (S.tipT > 0) S.tipT -= dt;
  if (S.markT > 0) S.markT -= dt;
  if (S.shake > 0) S.shake = Math.max(0, S.shake - dt);
  /* فنر با نوسانِ میرا به طولِ تازه می‌رسد */
  const tgt = targetLen();
  S.springV += (tgt - S.springL) * 90 * dt;
  S.springV *= Math.exp(-8 * dt);
  S.springL += S.springV * dt;
  if (Math.abs(tgt - S.springL) < .01 && Math.abs(S.springV) < .05) { S.springL = tgt; S.springV = 0; }
  bits.step(dt);
  toast.step(dt);
  draw();
}

whenFontsReady(() => runLoop(step));

/* ───────── ابزارِ نقاشی ───────── */

function rrPath(x, y, w, h, r) {
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function numText(str, x, y, o = {}) {
  ctx.save();
  ctx.direction = 'ltr';
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = o.color || P.ink;
  ctx.font = `${o.weight || 700} ${o.size || 18}px "${o.family || 'Vazirmatn'}", Tahoma, sans-serif`;
  ctx.fillText(str, x, y);
  ctx.restore();
}

const faNum = (v, d) => fa(v.toFixed(d)).replace('.', '٫');

/* ───────── اجسام ───────── */

function drawObj(id, x, y, k) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(k, k);
  if (id === 'sib') {
    ctx.fillStyle = ball(0, 0, 28, '#f08a72', P.apple, '#9c2f2c');
    wobbleCircle(0, 2, 27, 3, 1.6); ctx.fill();
    ctx.strokeStyle = '#6b4526'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, -24); ctx.lineTo(3, -38); ctx.stroke();
    ctx.fillStyle = P.appleLf;
    wobbleEllipse(14, -36, 13, 7, -.5, 5, 1); ctx.fill();
  } else if (id === 'tenis') {
    ctx.fillStyle = ball(0, 0, 24, '#e6f07a', P.ball, '#8a9a2c');
    wobbleCircle(0, 0, 23, 7, 1.2); ctx.fill();
    ctx.strokeStyle = '#fbfbee'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(-26, 0, 22, -.7, .7); ctx.stroke();
    ctx.beginPath(); ctx.arc(26, 0, 22, Math.PI - .7, Math.PI + .7); ctx.stroke();
  } else if (id === 'botri') {
    ctx.fillStyle = 'rgba(190,225,240,.5)';
    ctx.beginPath(); rrPath(-20, -46, 40, 88, 12); ctx.fill();
    ctx.fillStyle = P.water;
    ctx.beginPath(); rrPath(-17, -18, 34, 57, 9); ctx.fill();
    ctx.fillStyle = '#dfe8f2';
    ctx.beginPath(); rrPath(-9, -60, 18, 18, 5); ctx.fill();
    ctx.fillStyle = '#4f7fc4';
    ctx.beginPath(); rrPath(-11, -66, 22, 10, 4); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.4)';
    ctx.beginPath(); rrPath(-14, -40, 6, 70, 3); ctx.fill();
  } else if (id === 'sang') {
    ctx.fillStyle = ball(0, 0, 30, '#b4b9bf', P.rock, '#5d636a');
    wobbleCircle(0, 0, 28, 11, 3.4); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.18)';
    wobbleEllipse(-9, -10, 11, 6, -.4, 3, 1); ctx.fill();
  } else if (id === 'ketab') {
    ctx.fillStyle = '#4e3670';
    ctx.beginPath(); rrPath(-32, -24, 64, 50, 5); ctx.fill();
    ctx.fillStyle = P.book;
    ctx.beginPath(); rrPath(-32, -28, 64, 50, 5); ctx.fill();
    ctx.fillStyle = '#f2eee2';
    ctx.beginPath(); rrPath(24, -24, 8, 42, 3); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.4)';
    ctx.beginPath(); rrPath(-24, -20, 34, 5, 2); ctx.fill();
    ctx.beginPath(); rrPath(-24, -8, 26, 5, 2); ctx.fill();
  } else {
    ctx.fillStyle = '#c05f7c';
    ctx.beginPath(); rrPath(-26, -12, 52, 26, 6); ctx.fill();
    ctx.fillStyle = P.rubber;
    ctx.beginPath(); rrPath(-26, -16, 52, 26, 6); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.45)';
    ctx.beginPath(); rrPath(-20, -12, 30, 5, 2); ctx.fill();
  }
  ctx.restore();
}

/* ───────── پایه و فنر ───────── */

function drawStand() {
  ctx.fillStyle = '#151d2b';
  ctx.beginPath(); rrPath(STAND.x, STAND.y, STAND.w, STAND.h, 16); ctx.fill();
  ctx.strokeStyle = 'rgba(91,143,214,.2)'; ctx.lineWidth = 2;
  ctx.beginPath(); rrPath(STAND.x, STAND.y, STAND.w, STAND.h, 16); ctx.stroke();
  text('فنر و خط‌کش', STAND.x + STAND.w - 20, STAND.y + 28,
    { size: 16, color: 'rgba(236,242,250,.5)', align: 'right' });

  /* پایهٔ فلزی */
  const baseY = STAND.y + STAND.h - 40;
  ctx.fillStyle = P.steelDk;
  ctx.beginPath(); rrPath(SPRING_X + 60, STAND.y + 52, 20, baseY - STAND.y - 52, 6); ctx.fill();
  ctx.fillStyle = P.steel;
  ctx.beginPath(); rrPath(SPRING_X + 62, STAND.y + 52, 12, baseY - STAND.y - 52, 5); ctx.fill();
  ctx.fillStyle = P.steelDk;
  ctx.beginPath(); rrPath(SPRING_X - 40, baseY, 160, 22, 8); ctx.fill();
  ctx.fillStyle = P.steel;
  ctx.beginPath(); rrPath(SPRING_X - 40, baseY - 4, 160, 20, 8); ctx.fill();
  /* بازوی افقی */
  ctx.fillStyle = P.steel;
  ctx.beginPath(); rrPath(SPRING_X - 14, SPRING_TOP - 22, 96, 16, 6); ctx.fill();

  /* خط‌کشِ عمودی */
  const rx = SPRING_X - 118;
  ctx.fillStyle = '#f0e6c8';
  ctx.beginPath(); rrPath(rx - 26, SPRING_TOP - 10, 52, 24 * PXCM + 20, 8); ctx.fill();
  ctx.strokeStyle = '#c9b98d'; ctx.lineWidth = 2;
  ctx.beginPath(); rrPath(rx - 26, SPRING_TOP - 10, 52, 24 * PXCM + 20, 8); ctx.stroke();
  for (let c = 0; c <= 24; c++) {
    const y = SPRING_TOP + c * PXCM;
    const big = c % 5 === 0;
    ctx.strokeStyle = '#8a7c58'; ctx.lineWidth = big ? 2 : 1.2;
    ctx.beginPath();
    ctx.moveTo(rx + 18, y); ctx.lineTo(rx + 18 - (big ? 18 : 10), y);
    ctx.stroke();
    if (big) numText(fa(c), rx - 12, y, { size: 12, color: '#6b6047' });
  }

  /* فنر */
  const h = HOOK();
  ctx.save();
  ctx.strokeStyle = P.steelLt; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath();
  const coils = 12, len = h.y - SPRING_TOP;
  for (let i = 0; i <= 90; i++) {
    const u = i / 90;
    const y = SPRING_TOP + u * len;
    const x = SPRING_X + Math.sin(u * coils * TAU) * 15;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke();
  ctx.strokeStyle = P.steelDk; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i <= 90; i++) {
    const u = i / 90;
    const y = SPRING_TOP + u * len + 2;
    const x = SPRING_X + Math.sin(u * coils * TAU) * 15;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke();
  ctx.restore();
  /* قلّاب */
  ctx.strokeStyle = P.steel; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(h.x, h.y + 8, 9, Math.PI * .1, Math.PI * 1.9); ctx.stroke();

  /* جسمِ آویزان */
  if (S.onHook) {
    drawObj(S.onHook, h.x, h.y + 52, 1);
    /* پیکانِ کششِ زمین */
    const w = objBy(S.onHook).g / 1000 * G;
    const al = clamp(26 + w * 22, 26, 92);
    ctx.save();
    ctx.strokeStyle = P.gold; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(h.x - 62, h.y + 40); ctx.lineTo(h.x - 62, h.y + 40 + al);
    ctx.stroke();
    ctx.fillStyle = P.gold;
    ctx.beginPath();
    ctx.moveTo(h.x - 62, h.y + 50 + al);
    ctx.lineTo(h.x - 71, h.y + 36 + al);
    ctx.lineTo(h.x - 53, h.y + 36 + al);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  /* خواندنِ طولِ فنر */
  const bx = STAND.x + 20, by = STAND.y + STAND.h - 76;
  ctx.fillStyle = 'rgba(251,247,236,.94)';
  ctx.beginPath(); rrPath(bx, by, 230, 46, 12); ctx.fill();
  text('طولِ فنر', bx + 216, by + 23, { size: 14, color: P.inkSoft, align: 'right' });
  numText(faNum(S.springL, 1), bx + 96, by + 23, { size: 20, color: P.ink });
  text('سانتی‌متر', bx + 16, by + 23, { size: 11, color: P.inkSoft, align: 'left' });
}

function drawShelf() {
  ctx.fillStyle = '#151d2b';
  ctx.beginPath(); rrPath(SHELF.x, SHELF.y, SHELF.w, SHELF.h, 16); ctx.fill();
  ctx.strokeStyle = 'rgba(91,143,214,.2)'; ctx.lineWidth = 2;
  ctx.beginPath(); rrPath(SHELF.x, SHELF.y, SHELF.w, SHELF.h, 16); ctx.stroke();
  text('چیزها', SHELF.x + SHELF.w - 20, SHELF.y + 28,
    { size: 16, color: 'rgba(236,242,250,.5)', align: 'right' });
  OBJS.forEach((o, i) => {
    const b = shelfSlot(i);
    const away = S.onScale === o.id || S.onHook === o.id || (S.drag && S.drag.id === o.id);
    const done = recorded(o.id);
    ctx.fillStyle = away ? 'rgba(255,255,255,.03)' : (done ? 'rgba(78,159,108,.16)' : 'rgba(255,255,255,.07)');
    ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 12); ctx.fill();
    ctx.strokeStyle = done ? 'rgba(78,159,108,.6)' : 'rgba(214,224,234,.22)'; ctx.lineWidth = 2;
    ctx.setLineDash(away ? [6, 6] : []);
    ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 12); ctx.stroke();
    ctx.setLineDash([]);
    if (!away) {
      ctx.save();
      ctx.globalAlpha = 1;
      drawObj(o.id, b.x + b.w / 2, b.y + 44, .62);
      ctx.restore();
    }
    text(o.n, b.x + b.w / 2, b.y + b.h - 14,
      { size: o.n.length > 12 ? 12 : 14, color: 'rgba(236,242,250,.8)' });
  });
}

function drawScale() {
  ctx.fillStyle = '#151d2b';
  ctx.beginPath(); rrPath(SCALE.x, SCALE.y, SCALE.w, SCALE.h, 16); ctx.fill();
  ctx.strokeStyle = 'rgba(91,143,214,.2)'; ctx.lineWidth = 2;
  ctx.beginPath(); rrPath(SCALE.x, SCALE.y, SCALE.w, SCALE.h, 16); ctx.stroke();
  text('ترازو', SCALE.x + SCALE.w - 20, SCALE.y + 28,
    { size: 16, color: 'rgba(236,242,250,.5)', align: 'right' });
  /* جسمِ روی ترازو */
  if (S.onScale) drawObj(S.onScale, PAN_SCALE.x + PAN_SCALE.w / 2, PAN_SCALE.y - 6, .82);
  /* کفه */
  ctx.fillStyle = P.steelDk;
  ctx.beginPath(); rrPath(PAN_SCALE.x - 6, PAN_SCALE.y, PAN_SCALE.w + 12, PAN_SCALE.h, 6); ctx.fill();
  ctx.fillStyle = P.steel;
  ctx.beginPath(); rrPath(PAN_SCALE.x, PAN_SCALE.y - 3, PAN_SCALE.w, PAN_SCALE.h - 3, 6); ctx.fill();
  /* بدنه */
  ctx.fillStyle = '#3d4757';
  ctx.beginPath(); rrPath(SCALE.x + 60, PAN_SCALE.y + 20, 250, 76, 12); ctx.fill();
  /* نمایشگر */
  ctx.fillStyle = '#0d1a14';
  ctx.beginPath(); rrPath(SCALE.x + 96, PAN_SCALE.y + 36, 178, 44, 8); ctx.fill();
  const g = S.onScale ? objBy(S.onScale).g : 0;
  numText(fa(g), SCALE.x + 168, PAN_SCALE.y + 58, { size: 26, color: '#7fe3a2' });
  text('گرم', SCALE.x + 230, PAN_SCALE.y + 58, { size: 14, color: '#4e9f6c' });
}

/* ───────── دفترچه ───────── */

function drawPanel() {
  paper(PAN.x, PAN.y, PAN.w, PAN.h, P.paper, 31, 16, .4);
  ctx.fillStyle = P.accent;
  ctx.beginPath(); rrPath(PAN.x, PAN.y, PAN.w, 10, 5); ctx.fill();
  text('جدولِ من', PAN.x + PAN.w / 2, PAN.y + 44, { size: 26, family: 'Lalezar', color: P.ink });
  text('اوّل ترازو، بعد فنر، بعد ثبت', PAN.x + PAN.w / 2, PAN.y + 74, { size: 14, color: P.inkSoft });

  /* سرستون */
  const x0 = PAN.x + 14, w = PAN.w - 28;
  ctx.fillStyle = '#e7e3d4';
  ctx.beginPath(); rrPath(x0, PAN.y + 92, w, 32, 8); ctx.fill();
  text('جسم', x0 + w - 14, PAN.y + 108, { size: 13, color: P.inkSoft, align: 'right' });
  text('جرم', x0 + 118, PAN.y + 108, { size: 13, color: P.inkSoft });
  text('طولِ فنر', x0 + 44, PAN.y + 108, { size: 13, color: P.inkSoft });
  for (let i = 0; i < NEED; i++) {
    const y = PAN.y + 130 + i * 46;
    const r = S.rows[i];
    ctx.fillStyle = r ? '#f4f1e4' : '#eceadd';
    ctx.beginPath(); rrPath(x0, y, w, 40, 8); ctx.fill();
    if (!r) { text('—', x0 + w / 2, y + 20, { size: 16, color: '#c3c0b0' }); continue; }
    text(objBy(r.id).n, x0 + w - 12, y + 20,
      { size: objBy(r.id).n.length > 12 ? 11 : 13, color: P.ink, align: 'right' });
    numText(fa(r.g), x0 + 118, y + 20, { size: 15, color: P.ink });
    numText(faNum(r.len, 1), x0 + 44, y + 20, { size: 15, color: P.accent });
  }

  /* نمودارِ جرم و کشیدگی */
  const gx = x0 + 12, gy = PAN.y + 330, gw = w - 34, gh = 116;
  ctx.fillStyle = '#eceadd';
  ctx.beginPath(); rrPath(gx - 10, gy - 12, gw + 22, gh + 34, 10); ctx.fill();
  ctx.strokeStyle = '#b9b5a2'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(gx + gw, gy); ctx.lineTo(gx + gw, gy + gh); ctx.lineTo(gx, gy + gh);
  ctx.stroke();
  text('جرم ←', gx + gw / 2, gy + gh + 14, { size: 11, color: P.inkSoft });
  for (const r of S.rows) {
    const px = gx + gw - (r.g / 520) * gw;
    const py = gy + gh - ((r.len - L0_CM) / 12) * gh;
    ctx.fillStyle = P.accent;
    ctx.beginPath(); ctx.arc(px, py, 5.4, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(px - 1.4, py - 1.4, 2, 0, TAU); ctx.fill();
  }

  button(BTN_REC, 'ثبت کن', {
    hot: S.hover && S.hover.k === 'rec', fill: '#3f6fb5', hotFill: '#5b8fd6', size: 24 });
}

/* ───────── پردهٔ چیدن ───────── */

function drawOrder() {
  ctx.fillStyle = 'rgba(16, 22, 34, .96)';
  ctx.fillRect(0, HUD_H, SCENE_W, SCENE_H - HUD_H);
  text('زمین کدام را با نیروی بیشتری می‌کشد؟', SCENE_W / 2, 132,
    { size: 30, family: 'Lalezar', color: P.paper });
  text('از پرکشش‌ترین تا کم‌کشش‌ترین بچین', SCENE_W / 2, 176,
    { size: 17, color: 'rgba(236,242,250,.66)' });

  const rest = S.rows.filter((r) => S.order.indexOf(r.id) < 0);
  rest.forEach((r, i) => {
    const b = poolSlot(i);
    if (S.drag && S.drag.id === r.id) return;
    ctx.fillStyle = 'rgba(255,255,255,.08)';
    ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 12); ctx.fill();
    ctx.strokeStyle = 'rgba(214,224,234,.28)'; ctx.lineWidth = 2;
    ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 12); ctx.stroke();
    drawObj(r.id, b.x + b.w / 2, b.y + 64, .68);
    text(objBy(r.id).n, b.x + b.w / 2, b.y + b.h - 16,
      { size: objBy(r.id).n.length > 12 ? 11 : 13, color: 'rgba(236,242,250,.8)' });
  });

  text('بیشترین', orderSlot(0).x + 90, 428, { size: 16, color: P.gold });
  text('کمترین', orderSlot(3).x + 90, 428, { size: 16, color: 'rgba(236,242,250,.55)' });
  ctx.strokeStyle = 'rgba(224,166,63,.4)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(orderSlot(0).x + 20, 428); ctx.lineTo(orderSlot(3).x + 160, 428);
  ctx.setLineDash([7, 7]); ctx.stroke(); ctx.setLineDash([]);

  for (let i = 0; i < 4; i++) {
    const b = orderSlot(i);
    const hot = S.hover && S.hover.k === 'slot' && S.hover.i === i;
    const ok = (S.mark && S.markT > 0) ? S.mark[i] : null;
    ctx.fillStyle = ok === true ? 'rgba(78,159,108,.22)'
      : ok === false ? 'rgba(192,74,52,.22)' : (hot ? 'rgba(255,255,255,.13)' : 'rgba(255,255,255,.05)');
    ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 12); ctx.fill();
    ctx.strokeStyle = ok === true ? P.good : ok === false ? P.bad : 'rgba(224,166,63,.55)';
    ctx.lineWidth = 3;
    ctx.setLineDash(S.order[i] ? [] : [8, 7]);
    ctx.beginPath(); rrPath(b.x, b.y, b.w, b.h, 12); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(224,166,63,.85)';
    ctx.beginPath(); ctx.arc(b.x + b.w - 20, b.y + 20, 14, 0, TAU); ctx.fill();
    numText(fa(i + 1), b.x + b.w - 20, b.y + 20, { size: 15, color: '#221a08' });
    if (S.order[i] && !(S.drag && S.drag.id === S.order[i])) {
      drawObj(S.order[i], b.x + b.w / 2, b.y + 70, .68);
      text(objBy(S.order[i]).n, b.x + b.w / 2, b.y + b.h - 16,
        { size: objBy(S.order[i]).n.length > 12 ? 11 : 13, color: 'rgba(236,242,250,.85)' });
    }
  }
  button(BTN_CHECK, 'ببین درست است؟', {
    hot: S.hover && S.hover.k === 'check', fill: '#3f6fb5', hotFill: '#5b8fd6', size: 22 });
}

/* ───────── نوار و پرده‌ها ───────── */

function drawHUD() {
  ctx.fillStyle = '#0e1420';
  ctx.fillRect(0, 0, SCENE_W, HUD_H);
  ctx.fillStyle = 'rgba(224,166,63,.22)';
  ctx.fillRect(0, HUD_H - 2, SCENE_W, 2);
  text('کششِ زمین', SCENE_W - 140, HUD_H / 2, { size: 25, family: 'Lalezar', color: P.paper });
  numText(fa(S.rows.length) + ' / ' + fa(NEED), 300, HUD_H / 2, { size: 20, color: P.gold });
  ctx.fillStyle = 'rgba(255,255,255,.14)';
  ctx.beginPath(); rrPath(24, HUD_H - 9, 240, 5, 3); ctx.fill();
  ctx.fillStyle = P.gold;
  ctx.beginPath(); rrPath(24, HUD_H - 9, 240 * (S.rows.length / NEED), 5, 3); ctx.fill();
}

function springIcon(x, y) {
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle = P.steelLt; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let i = 0; i <= 60; i++) {
    const u = i / 60;
    const yy = -34 + u * 52;
    const xx = Math.sin(u * 7 * TAU) * 11;
    i ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy);
  }
  ctx.stroke();
  ctx.fillStyle = P.apple;
  ctx.beginPath(); ctx.arc(0, 32, 13, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawIntro() {
  overlay({
    t: S.phaseT, w: 880, h: 310, y: 130,
    paper: P.paper, band: P.accent, ink: P.ink, inkSoft: P.inkSoft,
    icon: springIcon,
    title: 'زمین کدام را بیشتر می‌کشد؟',
    body: 'هر چیزی را اوّل روی ترازو بگذار تا جرمش را ببینی،\nبعد به فنر آویزانش کن و طولِ فنر را از خط‌کش بخوان.\nچهار تا را در جدول ثبت کن، بعد خودت بچینشان.',
    btn: BTN_GO, btnLabel: 'شروع', btnHot: S.hover === BTN_GO,
    btnFill: '#3f6fb5', btnHotFill: '#5b8fd6',
  });
}

function drawWon() {
  overlay({
    t: S.phaseT, w: 840, h: 300, y: 140,
    paper: P.paper, band: P.good, ink: P.ink, inkSoft: P.inkSoft,
    icon: springIcon,
    title: 'درست چیدی',
    body: 'هرچه جرمِ جسم بیشتر بود، فنر بیشتر کشیده شد.\nیعنی زمین آن را با نیروی بیشتری به سمتِ خودش می‌کشد،\nو نقطه‌های نمودارت هم روی یک خط افتادند.',
    btn: BTN_AGAIN, btnLabel: 'از نو', btnHot: S.hover === BTN_AGAIN,
    btnFill: '#3f6fb5', btnHotFill: '#5b8fd6',
  });
}

function draw() {
  beginScene(P.bgLo);
  const g = ctx.createLinearGradient(0, 0, 0, SCENE_H);
  g.addColorStop(0, P.bgHi); g.addColorStop(1, P.bgLo);
  ctx.fillStyle = g; ctx.fillRect(0, 0, SCENE_W, SCENE_H);
  ctx.save();
  if (S.shake > 0) {
    const k = S.shake * 10;
    ctx.translate(Math.sin(S.t * 55) * k, 0);
  }
  drawPanel();
  drawStand();
  drawShelf();
  drawScale();
  if (S.phase === 'order') drawOrder();
  if (S.drag) {
    ctx.save();
    ctx.globalAlpha = .95;
    drawObj(S.drag.id, S.drag.x, S.drag.y, .9);
    ctx.restore();
  }
  bits.draw();
  ctx.restore();
  drawHUD();
  toast.draw(HUD_H + 8, { good: P.good, bad: P.bad, info: P.card, ink: P.ink });
  if (S.phase === 'intro') drawIntro();
  if (S.phase === 'won') drawWon();
  if (S.tipT > 0) {
    ctx.save();
    ctx.globalAlpha = clamp(S.tipT, 0, 1);
    const w = 470;
    paper(SCENE_W / 2 - w / 2, SCENE_H - 54, w, 42, P.paper, 51, 12, .3);
    text(S.tip, SCENE_W / 2, SCENE_H - 33, { size: 16, color: P.ink });
    ctx.restore();
  }
  endScene(.08, 'rgba(6, 10, 20, .44)', 0, .1);
}

</script>
