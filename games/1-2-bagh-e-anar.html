<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#17281c">
<title>باغِ انار — شمارش چندتا چندتا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>
  /* صفحه نباید هیچ‌جا اسکرول یا زوم شود؛ بازی باید مثل یک برنامه رفتار کند. */
  html, body {
    margin: 0; padding: 0; background: #17281c;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body {
    position: fixed; inset: 0;          /* جلوی کشیده‌شدنِ صفحه در سافاریِ گوشی */
    width: 100%; height: 100vh; height: 100dvh;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none; -webkit-touch-callout: none;
  }

  /* گوشیِ عمودی صحنه را ریز می‌کند؛ بچه باید گوشی را بچرخاند. */
  #rotate { display: none; }
  @media (orientation: portrait) and (max-width: 860px) {
    #stage { display: none; }
    #rotate {
      display: flex; position: fixed; inset: 0;
      z-index: 9;
      flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      background: #17281c; color: #f6ead2;
      font: 700 20px "Vazirmatn", Tahoma, sans-serif; text-align: center; padding: 32px;
    }
    #rotate svg { animation: tilt 2.4s ease-in-out infinite; }
    @keyframes tilt { 0%, 45% { transform: rotate(0deg); } 65%, 100% { transform: rotate(-90deg); } }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="rotate">
  <svg width="86" height="126" viewBox="0 0 86 126" fill="none" aria-hidden="true">
    <rect x="3" y="3" width="80" height="120" rx="12" stroke="#e8b448" stroke-width="5"/>
    <rect x="15" y="19" width="56" height="88" rx="5" fill="#e8b448" opacity=".28"/>
    <circle cx="43" cy="115" r="4" fill="#e8b448"/>
  </svg>
  <div>گوشی را بچرخان</div>
  <div style="font-weight:400;opacity:.7;font-size:16px">این بازی خوابیده بازی می‌شود</div>
</div>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   هستهٔ مشترکِ بازی‌ها — سبک «کاغذبُری»
   ───────────────────────────────────────────────────────────────────────
   این فایل جعبه‌ابزار است، نه چارچوب: هر بازی حلقه و وضعیت خودش را دارد
   و فقط از این توابع برای کشیدن استفاده می‌کند. دلیلش این است که هر بازی
   باید حس‌وحال خودش را داشته باشد، نه اینکه همه شبیه هم دربیایند.

   قاعده‌های ثابتِ تصویری:
   • نور همیشه از بالا-چپ می‌تابد، پس سایه‌ها به پایین-راست می‌افتند.
   • هیچ لبه‌ای کاملاً صاف نیست؛ همه کمی موج دارند (انگار با قیچی بریده).
   • هیچ خاکستریِ خالصی نداریم؛ همه‌ی خنثی‌ها به گرمیِ صحنه می‌زنند.
   • یک لایه‌ی دانه‌دانه‌ی کاغذ روی کلِ تصویر ضرب می‌شود.
   ═══════════════════════════════════════════════════════════════════════ */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const FA_D = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
const fa = (n) => String(n).replace(/\d/g, (d) => FA_D[+d]);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeIn = (t) => t * t * t;
const easeInOut = (t) => (t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2);
const easeBack = (t) => 1 + 2.7 * Math.pow(t-1, 3) + 1.7 * Math.pow(t-1, 2);
const easeElastic = (t) => t === 0 || t === 1 ? t : Math.pow(2, -9*t) * Math.sin((t*10 - .75) * 2.094) + 1;

/** تصادفِ تکرارپذیر: با یک بذر همیشه همان عدد. برای اینکه تزئین‌ها هر فریم نپرند. */
function noise1(x) {
  const s = Math.sin(x * 127.1) * 43758.5453;
  return s - Math.floor(s);
}
const pick = (arr, seed) => arr[Math.floor(noise1(seed) * arr.length) % arr.length];

/* ───────── بوم و صحنهٔ ثابت ───────── */

let ctx, SW, SH, CV, _refit = null;
let view = { scale: 1, ox: 0, oy: 0, w: 0, h: 0, dpr: 1 };
let _grain = null;

function initStage(canvas, w, h) {
  CV = canvas; SW = w; SH = h;
  ctx = canvas.getContext('2d');

  /* اندازه را از خودِ بوم می‌گیریم نه از innerHeight؛ چون در سافاریِ گوشی
     نوارِ آدرس باز و بسته می‌شود و innerHeight دروغ می‌گوید. */
  const fit = () => {
    const r = canvas.getBoundingClientRect();
    const vw = Math.round(r.width), vh = Math.round(r.height);
    if (vw < 20 || vh < 20) return;
    const dpr = Math.min(devicePixelRatio || 1, QUALITY > 0 ? 2 : 1);
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    const scale = Math.min(vw / SW, vh / SH);
    view = { scale, ox: (vw - SW*scale)/2, oy: (vh - SH*scale)/2, w: vw, h: vh, dpr };
    _grain = buildGrain();
  };
  _refit = fit;
  addEventListener('resize', fit);
  /* چرخاندنِ گوشی: اندازهٔ درست چند لحظه بعد می‌رسد، پس چندبار اندازه می‌گیریم. */
  addEventListener('orientationchange', () => {
    fit(); setTimeout(fit, 140); setTimeout(fit, 460);
  });
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(canvas);

  /* صدا در گوشی فقط بعد از اوّلین لمس اجازهٔ پخش دارد. */
  const unlock = () => { sfx._c(); removeEventListener('pointerdown', unlock); removeEventListener('touchstart', unlock); };
  addEventListener('pointerdown', unlock, { passive: true });
  addEventListener('touchstart', unlock, { passive: true });
  /* نگه‌داشتنِ انگشت نباید منوی مرورگر را باز کند. */
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  fit();
  return ctx;
}

/** قابِ صحنه را باز می‌کند: بعد از این، مختصات همیشه در فضای SW×SH است. */
function beginScene(bg) {
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, view.w, view.h);
  ctx.save();
  ctx.translate(view.ox, view.oy);
  ctx.scale(view.scale, view.scale);
  ctx.beginPath();
  ctx.rect(0, 0, SW, SH);
  ctx.clip();
}

/** بافتِ کاغذ، تیرگیِ گوشه‌ها، رنگ‌بندی و درخششِ نور را می‌گذارد و قاب را می‌بندد. */
function endScene(grainAlpha = .15, vignette = 'rgba(48,28,14,.30)', bloom = .34, grade = .14) {
  if (QUALITY < 1) { grade = 0; grainAlpha *= .5; }
  if (QUALITY < 2) bloom = 0;
  if (grade > 0) {
    /* رنگ‌بندیِ نرم: بالای صحنه گرم‌تر، پایین سردتر — عمق می‌دهد */
    const g = ctx.createLinearGradient(0, 0, 0, SH);
    g.addColorStop(0, `rgba(255, 214, 150, ${grade})`);
    g.addColorStop(.55, 'rgba(255, 255, 255, 0)');
    g.addColorStop(1, `rgba(40, 60, 110, ${grade * .9})`);
    ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalCompositeOperation = 'source-over';
  }
  if (_grain && grainAlpha > 0) {
    ctx.globalCompositeOperation = 'multiply';
    ctx.globalAlpha = grainAlpha;
    ctx.fillStyle = _grain;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
  if (vignette) {
    const g = ctx.createRadialGradient(SW/2, SH/2, SH*.42, SW/2, SH/2, SH*1.05);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, vignette);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
  }
  ctx.restore();
  bloomPass(bloom);
}

/* ───────── درخششِ نور (bloom) ─────────
   قابِ رسم‌شده را کوچک می‌کنیم، دو بار در خودش ضرب می‌کنیم تا فقط
   روشن‌ها بمانند، محوش می‌کنیم و با حالتِ «lighter» رویش می‌گذاریم.
   نتیجه: چراغ‌ها، شعله‌ها و رنگ‌های روشن نور پخش می‌کنند. */
let _bl, _blc, _bl2, _bl2c, _blNo = false, _blTick = 0;

function bloomPass(amount) {
  if (!amount || _blNo || !CV.width) return;
  /* کوچک‌کردن و بزرگ‌کردنِ دوباره، خودش محو می‌کند — از filter خیلی ارزان‌تر است */
  const W = Math.max(4, Math.round(CV.width * .2)), H = Math.max(4, Math.round(CV.height * .2));
  const W2 = Math.max(2, Math.round(W * .28)), H2 = Math.max(2, Math.round(H * .28));
  try {
    if (!_bl) {
      _bl = document.createElement('canvas'); _blc = _bl.getContext('2d');
      _bl2 = document.createElement('canvas'); _bl2c = _bl2.getContext('2d');
      if (!_blc || !_bl2c) { _blNo = true; return; }
    }
    if (_bl.width !== W || _bl.height !== H) { _bl.width = W; _bl.height = H; }
    if (_bl2.width !== W2 || _bl2.height !== H2) { _bl2.width = W2; _bl2.height = H2; }
    /* ساختنِ نور یک قاب در میان کافی است؛ گذاشتنش هر قاب. */
    _blTick = (_blTick + 1) & 1;
    if (!_blTick) {
      _blc.globalCompositeOperation = 'source-over';
      _blc.clearRect(0, 0, W, H);
      _blc.drawImage(CV, 0, 0, W, H);
      _blc.globalCompositeOperation = 'multiply';
      _blc.drawImage(_bl, 0, 0);
      _blc.drawImage(_bl, 0, 0);
      _blc.globalCompositeOperation = 'source-over';
      _bl2c.clearRect(0, 0, W2, H2);
      _bl2c.drawImage(_bl, 0, 0, W2, H2);
    }

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = amount;
    ctx.drawImage(_bl2, 0, 0, CV.width, CV.height);
    ctx.restore();
  } catch (e) { _blNo = true; }
}

/* ───────── لایهٔ ثابت ─────────
   هرچه در صحنه تکان نمی‌خورد را یک‌بار می‌کشیم و بعد فقط کپی می‌کنیم. */
const _layers = {};
function staticLayer(key, w, h, paint) {
  const q = Math.min(2, (view.scale || 1) * (view.dpr || 1));
  const L = _layers[key];
  if (L && L.q === q && L.w === w && L.h === h) return L.cv;
  const off = document.createElement('canvas');
  off.width = Math.max(1, Math.round(w * q));
  off.height = Math.max(1, Math.round(h * q));
  const c = off.getContext('2d');
  c.setTransform(q, 0, 0, q, 0, 0);
  const prev = ctx;
  ctx = c;
  try { paint(); } finally { ctx = prev; }
  _layers[key] = { cv: off, q, w, h };
  return off;
}

/* ───────── نورپردازی و بافت ─────────
   کارِ این‌ها این است که هیچ سطحی «تختِ یک‌رنگ» نماند. */

/** شیبِ عمودی: بالا روشن، پایین تیره. */
function vgrad(y0, y1, top, bot) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, top); g.addColorStop(1, bot);
  return g;
}

/** حجمِ کروی: نور از بالا-چپ، سایه در پایین-راست. */
function ball(cx, cy, r, lit, base, dark) {
  const g = ctx.createRadialGradient(cx - r * .38, cy - r * .42, r * .06, cx, cy, r * 1.06);
  g.addColorStop(0, lit); g.addColorStop(.45, base); g.addColorStop(1, dark);
  return g;
}

/** لبهٔ روشنِ بالا-چپِ یک مسیر — همان «rim light». */
function rim(pathFn, col, w = 2.2) {
  ctx.save();
  ctx.beginPath(); pathFn();
  ctx.clip();
  ctx.beginPath(); pathFn();
  ctx.strokeStyle = col; ctx.lineWidth = w * 2; ctx.lineJoin = 'round';
  ctx.translate(-w * .5, -w * .6);
  ctx.stroke();
  ctx.restore();
}

/** سایهٔ چسبیده به زمین — چیزها را روی سطح می‌نشاند. */
function contact(cx, cy, rx, ry, alpha = .26) {
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
  g.addColorStop(0, `rgba(20, 12, 6, ${alpha})`);
  g.addColorStop(1, 'rgba(20, 12, 6, 0)');
  ctx.save();
  ctx.fillStyle = g;
  ctx.translate(cx, cy); ctx.scale(1, ry / Math.max(rx, ry));
  ctx.beginPath(); ctx.arc(0, 0, Math.max(rx, ry), 0, TAU); ctx.fill();
  ctx.restore();
}

const _tex = {};
/** بافتِ تکرارشونده؛ یک‌بار ساخته و بعد از حافظه خوانده می‌شود. */
function texture(key, w, h, paint) {
  if (_tex[key]) return _tex[key];
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const c = off.getContext('2d');
  paint(c, w, h);
  _tex[key] = ctx.createPattern(off, 'repeat');
  return _tex[key];
}

/** رگهٔ چوب. */
function texWood(base, grain) {
  return texture('w' + base + grain, 120, 120, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = grain; c.lineWidth = 1.4;
    for (let i = 0; i < 9; i++) {
      c.globalAlpha = .18 + noise1(i * 3.1) * .3;
      c.beginPath();
      const y0 = i * 14 + noise1(i) * 6;
      c.moveTo(0, y0);
      for (let x = 0; x <= w; x += 10) c.lineTo(x, y0 + Math.sin(x * .09 + i) * 2.6);
      c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** تارِ پارچه. */
function texCloth(base, thread) {
  return texture('c' + base + thread, 16, 16, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    c.strokeStyle = thread; c.lineWidth = 1; c.globalAlpha = .5;
    for (let i = 0; i < w; i += 4) {
      c.beginPath(); c.moveTo(i, 0); c.lineTo(i, h); c.stroke();
      c.beginPath(); c.moveTo(0, i); c.lineTo(w, i); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

/** دانه‌های سنگ. */
function texStone(base, spec) {
  return texture('s' + base + spec, 90, 90, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) {
      c.globalAlpha = .05 + noise1(i * 1.7) * .16;
      c.fillStyle = spec;
      const r = .6 + noise1(i * 5.3) * 1.9;
      c.beginPath();
      c.arc(noise1(i * 2.1) * w, noise1(i * 3.7 + 1) * h, r, 0, TAU);
      c.fill();
    }
    c.globalAlpha = 1;
  });
}

/** الیافِ کاغذ. */
function texPaper(base) {
  return texture('p' + base, 100, 100, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 130; i++) {
      c.globalAlpha = .04 + noise1(i * 2.3) * .07;
      c.strokeStyle = i % 2 ? '#ffffff' : '#5a4326';
      c.lineWidth = .9;
      const x = noise1(i * 1.3) * w, y = noise1(i * 4.1 + 2) * h;
      const a = noise1(i * 7.7) * TAU, l = 4 + noise1(i * 9.1) * 12;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();
    }
    c.globalAlpha = 1;
  });
}

function buildGrain() {
  const s = 260;
  const off = document.createElement('canvas');
  off.width = off.height = s;
  const c = off.getContext('2d');
  const img = c.createImageData(s, s);
  for (let i = 0; i < s*s; i++) {
    const v = 214 + Math.random() * 41;
    img.data[i*4] = v; img.data[i*4+1] = v; img.data[i*4+2] = v; img.data[i*4+3] = 255;
  }
  c.putImageData(img, 0, 0);
  return ctx.createPattern(off, 'repeat');
}

function toStage(e) {
  const r = CV.getBoundingClientRect();
  return {
    x: (e.clientX - r.left - view.ox) / view.scale,
    y: (e.clientY - r.top - view.oy) / view.scale,
  };
}

const inRect = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
const inCircle = (p, b, pad = 0) => Math.hypot(p.x - b.x, p.y - b.y) <= b.r + pad;

/* ───────── قلم‌های کاغذبُری ───────── */

/** دایره‌ای که انگار با قیچی بریده شده. */
function wobbleCircle(cx, cy, r, seed = 0, amp = 2.2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const rr = r + Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp * .45;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** بیضیِ ناصاف — برای چیزهایی که گرد نیستند ولی نرم‌اند. */
function wobbleEllipse(cx, cy, rx, ry, rot = 0, seed = 0, amp = 2, steps = 60) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const w = 1 + (Math.sin(a*3 + seed) * amp + Math.sin(a*7 + seed*2.3) * amp*.45) / Math.max(rx, ry);
    const px = Math.cos(a) * rx * w, py = Math.sin(a) * ry * w;
    const x = cx + px*Math.cos(rot) - py*Math.sin(rot);
    const y = cy + px*Math.sin(rot) + py*Math.cos(rot);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** مستطیلِ گِرد با گوشه‌های کمی کج. */
function wobbleRect(x, y, w, h, r = 12, seed = 0, amp = 1.6) {
  const j = (k) => (noise1(seed*9.7 + k) - .5) * amp * 2;
  ctx.beginPath();
  ctx.moveTo(x + r + j(1), y + j(2));
  ctx.lineTo(x + w - r + j(3), y + j(4));
  ctx.quadraticCurveTo(x + w + j(5), y + j(6), x + w + j(7), y + r + j(8));
  ctx.lineTo(x + w + j(9), y + h - r + j(10));
  ctx.quadraticCurveTo(x + w + j(11), y + h + j(12), x + w - r + j(13), y + h + j(14));
  ctx.lineTo(x + r + j(15), y + h + j(16));
  ctx.quadraticCurveTo(x + j(17), y + h + j(18), x + j(19), y + h - r + j(20));
  ctx.lineTo(x + j(21), y + r + j(22));
  ctx.quadraticCurveTo(x + j(23), y + j(24), x + r + j(1), y + j(2));
  ctx.closePath();
}

/** سایهٔ نرم؛ نور از بالا-چپ. */
function withShadow(blur, dy, alpha, fn, hue = '78, 46, 24') {
  ctx.save();
  ctx.shadowColor = `rgba(${hue}, ${alpha})`;
  ctx.shadowBlur = blur;
  ctx.shadowOffsetY = dy;
  ctx.shadowOffsetX = dy * .35;
  fn();
  ctx.restore();
}

/** یک برگه‌ی کاغذ با سایه — پایه‌ی همه‌ی کارت‌ها و تابلوها. */
function paper(x, y, w, h, fill, seed = 1, r = 12, shadow = .26) {
  withShadow(16, 7, shadow, () => {
    ctx.fillStyle = fill;
    wobbleRect(x, y, w, h, r, seed, 2);
    ctx.fill();
  });
  /* الیافِ کاغذ و لبهٔ روشن، تا سطح تخت نماند */
  ctx.save();
  ctx.beginPath(); wobbleRect(x, y, w, h, r, seed, 2); ctx.clip();
  ctx.globalAlpha = .5;
  ctx.fillStyle = texPaper(fill);
  ctx.fillRect(x, y, w, h);
  ctx.globalAlpha = 1;
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.4, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(90,60,20,.1)');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
}

function text(str, x, y, o = {}) {
  const size = o.size || 20;
  const fam = o.family || 'Vazirmatn';
  ctx.save();
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.font = `${fam === 'Lalezar' ? '400' : (o.weight || 700)} ${size}px "${fam}", Tahoma, sans-serif`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.baseline || 'middle';
  ctx.fillStyle = o.color || '#43291b';
  ctx.direction = 'rtl';
  if (o.stroke) {
    ctx.lineWidth = o.strokeWidth || 5;
    ctx.strokeStyle = o.stroke;
    ctx.lineJoin = 'round';
    ctx.strokeText(str, x, y, o.maxWidth);
  }
  ctx.fillText(str, x, y, o.maxWidth);
  ctx.restore();
}

/** متنِ چندخطی که خودش می‌شکند. ارتفاعِ اشغال‌شده را برمی‌گرداند. */
function textWrap(str, x, y, maxW, o = {}) {
  const size = o.size || 19, lh = o.lineHeight || size * 1.7;
  ctx.font = `${o.weight || 700} ${size}px "${o.family || 'Vazirmatn'}", Tahoma, sans-serif`;
  const lines = [];
  for (const para of str.split('\n')) {
    let line = '';
    for (const wd of para.split(' ')) {
      const t = line ? line + ' ' + wd : wd;
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = wd; }
      else line = t;
    }
    lines.push(line);
  }
  lines.forEach((l, i) => text(l, x, y + i * lh, o));
  return lines.length * lh;
}

/* ───────── ذره‌ها ───────── */

class Bits {
  constructor() { this.list = []; }
  add(x, y, n, kind, colors, opts = {}) {
    for (let i = 0; i < n; i++) {
      const a = opts.dir !== undefined ? opts.dir + (Math.random()-.5) * (opts.spread || 1) : Math.random() * TAU;
      const sp = (opts.speed || 200) * (.4 + Math.random());
      this.list.push({
        kind, x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - (opts.lift || 0),
        r: (opts.size || 4) * (.5 + Math.random()),
        rot: Math.random() * TAU, vr: (Math.random()-.5) * 10,
        col: colors[(Math.random() * colors.length) | 0],
        grav: opts.grav === undefined ? 620 : opts.grav,
        drag: opts.drag || .995,
        life: (opts.life || .9) * (.6 + Math.random() * .8), age: 0,
      });
    }
  }
  confetti(x, y, n, colors) {
    this.add(x, y, n, 'flake', colors, { speed: 420, lift: 190, size: 5, life: 1.6, grav: 780 });
  }
  spark(x, y, n, colors) {
    this.add(x, y, n, 'dot', colors, { speed: 180, lift: 30, size: 3.4, life: .7, grav: 260, drag: .93 });
  }
  step(dt) {
    for (const p of this.list) {
      p.age += dt;
      p.vy += p.grav * dt;
      p.vx *= p.drag; p.vy *= p.drag;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    }
    this.list = this.list.filter((p) => p.age < p.life);
  }
  draw() {
    for (const p of this.list) {
      const k = clamp(1 - p.age / p.life, 0, 1);
      ctx.save();
      ctx.globalAlpha = k;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.col;
      if (p.kind === 'flake') ctx.fillRect(-p.r, -p.r*1.5, p.r*2, p.r*3);
      else if (p.kind === 'leaf') { wobbleEllipse(0, 0, p.r*1.8, p.r*.8, 0, p.r, .6); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(0, 0, p.r * k, 0, TAU); ctx.fill(); }
      ctx.restore();
    }
  }
  clear() { this.list.length = 0; }
}

const sfx = {
  ac: null, on: true,
  _c() {
    if (!this.on) return null;
    if (!this.ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; this.ac = new A(); }
    if (this.ac.state === 'suspended') this.ac.resume();
    return this.ac;
  },
  tone(f, dur = .16, type = 'sine', gain = .13, delay = 0) {
    const c = this._c(); if (!c) return;
    const t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(t0 + dur + .04);
  },
  tap()  { this.tone(430, .07, 'triangle', .09); },
  place(){ this.tone(620, .11, 'sine', .12); },
  pop()  { this.tone(760, .09, 'sine', .11); },
  slide(){ this.tone(240, .22, 'sine', .07); },
  good() { [523, 659, 784].forEach((f,i) => this.tone(f, .22, 'sine', .13, i*.07)); },
  win()  { [523, 659, 784, 1047].forEach((f,i) => this.tone(f, .34, 'triangle', .13, i*.10)); },
  nope() { this.tone(180, .2, 'sawtooth', .07); },
  tick() { this.tone(1100, .04, 'square', .05); },
};

/* ───────── قطعه‌های آماده ───────── */

function star(x, y, r, col, rot = 0) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = col;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI/2 + i * Math.PI/5;
    const rr = i % 2 ? r * .45 : r;
    const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/** دکمهٔ کاغذی. hovered را خودِ بازی می‌دهد؛ اینجا فقط کشیده می‌شود. */
/** رنگ را روشن‌تر (k>0) یا تیره‌تر (k<0) می‌کند. */
function shade(col, k) {
  const c = String(col).trim();
  let r, g2, b2;
  if (c[0] === '#') {
    const h = c.length === 4 ? c[1]+c[1]+c[2]+c[2]+c[3]+c[3] : c.slice(1, 7);
    r = parseInt(h.slice(0,2), 16); g2 = parseInt(h.slice(2,4), 16); b2 = parseInt(h.slice(4,6), 16);
  } else {
    const m = c.match(/[\d.]+/g);
    if (!m || m.length < 3) return col;
    r = +m[0]; g2 = +m[1]; b2 = +m[2];
  }
  const f = (v) => Math.round(clamp(k < 0 ? v * (1 + k) : v + (255 - v) * k, 0, 255));
  return 'rgb(' + f(r) + ',' + f(g2) + ',' + f(b2) + ')';
}

function button(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 3 : 0;
  const fill = o.disabled ? (o.off || '#bcaa92') : (hot ? (o.hotFill || o.fill) : o.fill);
  const r = o.r === undefined ? 14 : o.r;
  /* لبهٔ زیرینِ تیره — دکمه از صفحه بیرون می‌زند */
  ctx.fillStyle = shade(fill, -.36);
  wobbleRect(b.x, b.y + dy + 7, b.w, b.h, r, b.x + b.y, 2);
  ctx.fill();
  withShadow(hot ? 22 : 14, hot ? 5 : 8, .32, () => {
    ctx.fillStyle = fill;
    wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2);
    ctx.fill();
  });
  /* حجم: روشن از بالا، تیره به پایین */
  ctx.save();
  ctx.beginPath(); wobbleRect(b.x, b.y + dy, b.w, b.h, r, b.x + b.y, 2); ctx.clip();
  const g = ctx.createLinearGradient(0, b.y + dy, 0, b.y + dy + b.h);
  g.addColorStop(0, 'rgba(255,255,255,.3)');
  g.addColorStop(.45, 'rgba(255,255,255,.04)');
  g.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = g;
  ctx.fillRect(b.x, b.y + dy, b.w, b.h);
  /* برقِ باریکِ لبهٔ بالا */
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.fillRect(b.x + r, b.y + dy + 2, b.w - r * 2, 2);
  ctx.restore();
  text(label, b.x + b.w/2, b.y + b.h/2 + dy - (o.sub ? 9 : 0), {
    size: o.size || 26, color: o.color || '#fdf6e8', family: o.family || 'Lalezar',
  });
  if (o.sub) text(o.sub, b.x + b.w/2, b.y + b.h/2 + dy + 17,
    { size: 14, color: o.subColor || 'rgba(255,255,255,.88)' });
}

/** دکمهٔ گرد کوچک (مثل + و −). */
function roundButton(b, label, o = {}) {
  const hot = o.hot && !o.disabled;
  const dy = hot ? 2 : 0;
  withShadow(10, hot ? 3 : 5, .3, () => {
    ctx.fillStyle = o.disabled ? '#cbbba3' : (hot ? (o.hotFill || o.fill) : o.fill);
    wobbleCircle(b.x, b.y + dy, b.r, b.x, 1.4);
    ctx.fill();
  });
  text(label, b.x, b.y + dy - 1,
    { size: o.size || 32, color: o.disabled ? '#a8988a' : (o.color || '#fdf6e8'), family: 'Lalezar' });
}

/** پرده‌ی تمام‌صفحه: برای شروعِ پرده و برای جشنِ پایان. */
function overlay(o) {
  const k = easeOut(clamp(o.t / .5, 0, 1));
  ctx.fillStyle = `rgba(30, 22, 16, ${.66 * k})`;
  ctx.fillRect(0, 0, SW, SH);

  const w = o.w || 700, h = o.h || 290;
  const x = (SW - w) / 2, y = o.y || (SH * .22);
  const s = lerp(.9, 1, easeBack(clamp(o.t / .65, 0, 1)));
  ctx.save();
  ctx.translate(SW/2, y + h/2);
  ctx.scale(s, s);
  ctx.translate(-SW/2, -(y + h/2));

  withShadow(30, 14, .42, () => {
    ctx.fillStyle = o.paper || '#fbf3e2';
    wobbleRect(x, y, w, h, 18, 121, 2.4);
    ctx.fill();
  });
  ctx.fillStyle = o.band || '#c8434f';
  wobbleRect(x, y, w, 12, 6, 123, 1);
  ctx.fill();

  if (o.icon) o.icon(SW/2, y + 56);
  text(o.title, SW/2, y + (o.icon ? 108 : 62),
    { size: o.titleSize || 36, color: o.ink || '#43291b', family: 'Lalezar', alpha: k });
  textWrap(o.body, SW/2, y + (o.icon ? 158 : 116), w - 90,
    { size: 19, color: o.inkSoft || '#8a6a52', alpha: k });
  ctx.restore();

  button(o.btn, o.btnLabel, { hot: o.btnHot, fill: o.btnFill || '#7fa356', hotFill: o.btnHotFill || '#8fb45f', size: 28 });
}

/** پیامِ کوتاهِ بالای صحنه. */
class Toast {
  constructor() { this.msg = null; this.t = 0; this.kind = 'info'; }
  say(msg, kind = 'info') { this.msg = msg; this.kind = kind; this.t = 2.6; }
  step(dt) { if (this.t > 0) { this.t -= dt; if (this.t <= 0) this.msg = null; } }
  draw(y = 24, colors = {}) {
    if (!this.msg) return;
    const k = clamp(this.t, 0, 1) * clamp((2.6 - this.t) * 5, 0, 1);
    ctx.save();
    ctx.globalAlpha = k;
    ctx.font = `700 19px "Vazirmatn", Tahoma, sans-serif`;
    const w = ctx.measureText(this.msg).width + 76;
    const fill = this.kind === 'good' ? (colors.good || '#7fa356')
               : this.kind === 'bad' ? (colors.bad || '#c8434f')
               : (colors.info || '#fbf3e2');
    paper(SW/2 - w/2, y, w, 48, fill, 151, 12, .3);
    text(this.msg, SW/2, y + 25,
      { size: 19, color: this.kind === 'info' ? (colors.ink || '#43291b') : '#fff8ec' });
    ctx.restore();
  }
}

/* ───────── آموزشِ پرده‌ای ─────────
   پرده‌هایی که منتظرِ کارِ بچه نیستند با یک ضربه جلو می‌روند. تایمر فقط
   پشتیبان است؛ بچهٔ کلاس سومی باید فرصتِ خواندن داشته باشد، نه اینکه
   متن قبل از تمام شدنِ خواندنش برود.                                    */

/** اگر پردهٔ فعلی خواندنی است، ضربه را می‌خورد و می‌رود پردهٔ بعد. */
function tutTap(tut, tapSteps, lastStep) {
  if (!tut.on || tapSteps.indexOf(tut.step) < 0) return false;
  if (tut.step >= lastStep) tut.on = false;
  else { tut.step++; tut.t = 0; }
  sfx.tap();
  return true;
}

/** نشانهٔ «برای ادامه بزن» — زیرِ کارتِ آموزش. */
function tutMore(cx, y, t, ink = '#3a2a18', bg = 'rgba(255, 250, 238, .94)') {
  ctx.save();
  ctx.globalAlpha = .62 + .38 * Math.sin(t * 3.2);
  ctx.font = '700 15px "Vazirmatn", Tahoma, sans-serif';
  const label = 'برای ادامه، هرجا را بزن';
  const w = ctx.measureText(label).width + 40, h = 32, x = cx - w / 2, r = 16;
  withShadow(10, 4, .3, () => {
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath(); ctx.fill();
  });
  text(label, cx, y + h / 2, { size: 15, color: ink });
  ctx.restore();
}

/** فونت‌ها را می‌آورد و بعد بازی را شروع می‌کند.
    مهم: هر دو راه (رسیدنِ فونت و مهلتِ پشتیبان) ممکن است برسند، ولی
    شروع فقط باید یک بار انجام شود؛ وگرنه دو حلقهٔ فریم راه می‌افتد و
    بازی دوبرابر سریع می‌شود. */
function whenFontsReady(start) {
  let done = false;
  const go = () => { if (done) return; done = true; start(); };
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('400 40px Lalezar'),
      document.fonts.load('700 20px Vazirmatn'),
      document.fonts.load('900 20px Vazirmatn'),
    ]).then(go, go);
    setTimeout(go, 2600);
  } else go();
}

/** حلقهٔ فریم با dtِ محدودشده. */
/* ───────── کیفیتِ خودکار ─────────
   اگر دستگاه کُند بود، اوّل درخشش و بعد رنگ‌بندی خاموش می‌شود تا بازی
   روان بماند. روی دستگاهِ قوی همه‌چیز روشن است. */
let QUALITY = 2;
let _fAcc = 0, _fN = 0, _qHold = 0;

function _qualityTick(gap) {
  if (gap <= 0 || gap > 200) return;
  _fAcc += gap; _fN++;
  if (_fN < 45) return;
  const avg = _fAcc / _fN;
  _fAcc = 0; _fN = 0;
  if (_qHold > 0) { _qHold--; return; }
  const before = QUALITY;
  if (avg > 25 && QUALITY > 0) { QUALITY--; _qHold = 3; }
  else if (avg < 18.5 && QUALITY < 2) { QUALITY++; _qHold = 6; }
  /* در پایین‌ترین کیفیت، صحنه را با نقطه‌های کمتر می‌کشیم */
  if (before !== QUALITY && (before === 0 || QUALITY === 0) && _refit) _refit();
}

/* یک حلقه، نه بیشتر — دو حلقه یعنی زمانِ بازی دوبرابر می‌گذرد. */
let _looping = false;
function runLoop(step) {
  if (_looping) return;
  _looping = true;
  let last = performance.now();
  const frame = (now) => {
    const gap = now - last;
    const dt = Math.min(gap / 1000, 1/20);
    last = now;
    _qualityTick(gap);
    step(dt);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

  box: 3,
  crates: [],        // هر جعبه: آرایه‌ای از انارها
  tree: [],          // انارهای روی درخت
  flying: [],
  t: 0, introT: 0, doneT: 0,
  hover: null,
  stars: 0,
  gardener: 'idle', gardenerT: 0,
  wind: 0,
  leaves: [],        // برگ‌های در حال افتادن
  bees: [],
  lastFull: -1, fullT: 0,
};

const bits = new Bits();
const toast = new Toast();
const L = () => LEVELS[S.level];

function boxSize() { return L().free ? S.box : L().box; }
function crateCount() { return Math.ceil(L().total / boxSize()); }
function packed() { return S.crates.reduce((a, c) => a + c.length, 0); }

function loadLevel(i) {
  S.level = i;
  const lv = LEVELS[i];
  S.box = lv.free ? 3 : lv.box;
  rebuild();
  S.phase = 'intro'; S.introT = 0;
  S.leaves = Array.from({ length: 14 }, (_, k) => ({
    x: 60 + noise1(k * 3.1) * (SCENE_W - 120),
    y: -noise1(k * 7.7) * 500,
    v: 24 + noise1(k) * 30, a: noise1(k * 5) * TAU, s: .7 + noise1(k * 2) * .6,
  }));
  S.bees = Array.from({ length: 3 }, (_, k) => ({ a: k * 2.1, r: 60 + k * 26, cx: 300 + k * 300, cy: 300 + k * 40 }));
}

/** انارها را روی درخت می‌چیند و جعبه‌های خالی را می‌سازد. */
function rebuild() {
  const lv = L();
  S.crates = Array.from({ length: crateCount() }, () => []);
  S.tree = Array.from({ length: lv.total }, (_, k) => ({
    id: k,
    x: TREE.x + Math.cos(k * 2.4 + .6) * (66 + (k % 4) * 34) + noise1(k * 9) * 26 - 13,
    y: TREE.y + Math.sin(k * 1.7) * 58 + (k % 3) * 26 - 20,
    sway: noise1(k * 4.3) * TAU,
  }));
  S.flying.length = 0;
  S.lastFull = -1;
}

/* ───────── چیدمان ───────── */

const TREE = { x: 306, y: 244 };
const BENCH = { x: 430, y: 604, w: 648, h: 26 };
const CRATE_H = 96;
const CRATE_Y = BENCH.y - CRATE_H;
const ROPE_L = { x: 404, y: 396 }, ROPE_R = { x: 1058, y: 372 };
const BOX_L = { x: 108, y: 664, r: 24 };
const BOX_R = { x: 244, y: 664, r: 24 };
const BTN_GO = { x: 470, y: 556, w: 260, h: 76 };
const BTN_RESET = { x: 84, y: 700, w: 184, h: 44 };

function crateBox(i) {
  const n = crateCount();
  const gap = 12;
  const w = (BENCH.w - gap * (n + 1)) / n;
  return { x: BENCH.x + gap + i * (w + gap), y: CRATE_Y, w, h: CRATE_H };
}

/** جای هر انار داخل جعبه. تا سه‌تا یک ردیف، بیشتر از آن دو ردیف. */
function slotPos(ci, k) {
  const b = crateBox(ci);
  const size = boxSize();
  const per = size <= 3 ? size : Math.ceil(size / 2);
  const rows = size <= 3 ? 1 : 2;
  const row = Math.floor(k / per), col = k % per;
  const cw = (b.w - 14) / per;
  const rh = (b.h - 26) / rows;
  return {
    x: b.x + 7 + cw * (col + .5),
    y: b.y + 12 + rh * (row + .5),
  };
}

/** شعاعِ انار داخل جعبه، متناسب با جای موجود. */
function slotR(ci) {
  const b = crateBox(ci);
  const size = boxSize();
  const per = size <= 3 ? size : Math.ceil(size / 2);
  const rows = size <= 3 ? 1 : 2;
  return Math.min((b.w - 14) / per, (b.h - 26) / rows) * .40;
}

/* ───────── حلقه ───────── */

const cv = document.getElementById('stage');
initStage(cv, SCENE_W, SCENE_H);
loadLevel(0);
whenFontsReady(() => runLoop(step));

function step(dt) {
  S.t += dt;
  S.wind = Math.sin(S.t * .7) * .5 + Math.sin(S.t * 1.9) * .2;
  if (S.phase === 'intro') S.introT += dt;
  if (S.phase === 'done') S.doneT += dt;
  if (S.fullT > 0) S.fullT -= dt;
  if (S.gardenerT > 0) { S.gardenerT -= dt; if (S.gardenerT <= 0) S.gardener = 'idle'; }

  for (const f of S.flying) {
    f.t += dt * 2.2;
    if (f.t >= 1) { f.done = true; landPom(f); }
  }
  S.flying = S.flying.filter((f) => !f.done);

  for (const l of S.leaves) {
    l.y += l.v * dt;
    l.x += Math.sin(S.t * 1.2 + l.a) * 22 * dt;
    l.a += dt * 1.6;
    if (l.y > SCENE_H + 30) { l.y = -30; l.x = 60 + Math.random() * (SCENE_W - 120); }
  }
  for (const b of S.bees) b.a += dt * 1.5;

  bits.step(dt);
  toast.step(dt);
  draw();
}

/* ───────── چیدنِ انار ───────── */

function firstOpenCrate() {
  for (let i = 0; i < S.crates.length; i++) if (S.crates[i].length < boxSize()) return i;
  return -1;
}

function pickPom(pom) {
  const ci = firstOpenCrate();
  if (ci === -1) { toast.say('همهٔ جعبه‌ها پر شده‌اند', 'info'); return; }
  const k = S.crates[ci].length;
  S.crates[ci].push(pom.id);
  S.tree = S.tree.filter((p) => p.id !== pom.id);
  const dest = slotPos(ci, k);
  S.flying.push({ t: 0, id: pom.id, sx: pom.x, sy: pom.y, dx: dest.x, dy: dest.y, ci, k });
  sfx.pop();
}

function landPom(f) {
  bits.add(f.dx, f.dy + 10, 6, 'dot', [P.pomLit, P.leafSun], { speed: 70, lift: 24, size: 2.4, life: .45 });
  sfx.place();
  const crate = S.crates[f.ci];
  if (crate.length === boxSize()) {
    S.lastFull = f.ci;
    S.fullT = 1;
    sfx.good();
    const b = crateBox(f.ci);
    bits.confetti(b.x + b.w/2, b.y + 20, 18, [P.pomLit, P.gold, P.leafSun]);
    S.gardener = 'happy'; S.gardenerT = 1.6;
  }
  if (packed() === L().total) {
    setTimeout(() => {
      if (S.phase !== 'play') return;
      S.phase = 'done'; S.doneT = 0;
      S.stars++;
      sfx.win();
      bits.confetti(SCENE_W/2, 320, 70, [P.pomLit, P.gold, P.leafSun, P.crateLit]);
    }, 520);
  }
}

/* ───────── ورودی ───────── */

function hitTest(p) {
  if (S.phase === 'intro' || S.phase === 'done') return inRect(p, BTN_GO) ? BTN_GO : null;
  if (L().free) {
    if (inCircle(p, BOX_L, 6)) return BOX_L;
    if (inCircle(p, BOX_R, 6)) return BOX_R;
    if (inRect(p, BTN_RESET)) return BTN_RESET;
  }
  for (const pom of S.tree) if (Math.hypot(p.x - pom.x, p.y - pom.y) < 30) return pom;
  return null;
}

cv.addEventListener('pointermove', (e) => {
  S.hover = hitTest(toStage(e));
  cv.style.cursor = S.hover ? 'pointer' : 'default';
});
cv.addEventListener('pointerleave', () => { S.hover = null; });
cv.addEventListener('pointerdown', (e) => {
  const h = hitTest(toStage(e));
  if (!h) return;
  if (S.phase === 'intro') { S.phase = 'play'; sfx.tap(); return; }
  if (S.phase === 'done') {
    if (S.level + 1 < LEVELS.length) loadLevel(S.level + 1);
    else { loadLevel(LEVELS.length - 1); S.phase = 'play'; }
    return;
  }
  if (h === BOX_L) return setBox(S.box - 1);
  if (h === BOX_R) return setBox(S.box + 1);
  if (h === BTN_RESET) { rebuild(); sfx.tap(); return; }
  pickPom(h);
});

function setBox(n) {
  const v = clamp(n, 2, 6);
  if (v === S.box) return;
  S.box = v;
  rebuild();
  sfx.tap();
  toast.say(`جعبه‌های ${fa(v)}تایی — ${fa(crateCount())} جعبه لازم است`, 'info');
}

/* ───────── ترسیم ───────── */

function draw() {
  beginScene('#17281c');
  drawSky();
  drawFarTrees();
  drawGround();
  drawTree();
  drawFallingLeaves();
  drawBench();
  drawCrates();
  drawRope();
  drawTreePoms();
  drawFlying();
  drawGardener(1116, 606);
  drawBees();
  if (L().free) drawBoxDial();
  bits.draw();
  toast.draw(20, { ink: P.ink });
  if (S.phase === 'intro') drawIntro();
  if (S.phase === 'done') drawDone();
  endScene(.10, 'rgba(24,44,26,.34)');
}

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, 470);
  g.addColorStop(0, P.skyTop);
  g.addColorStop(1, P.skyLow);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, SW, 470);
  // نورِ نرمِ خورشید از بالا-چپ
  const halo = ctx.createRadialGradient(210, 60, 20, 210, 60, 420);
  halo.addColorStop(0, 'rgba(255,248,214,.7)');
  halo.addColorStop(1, 'rgba(255,248,214,0)');
  ctx.fillStyle = halo;
  ctx.fillRect(0, 0, SW, 470);
}

/** ردیفِ درخت‌های دور، کم‌رنگ و مه‌آلود. */
function drawFarTrees() {
  for (let i = 0; i < 12; i++) {
    const x = -40 + i * 108 + noise1(i * 3.3) * 40;
    const y = 428 + noise1(i * 7.1) * 14;
    const r = 46 + noise1(i * 2.2) * 22;
    ctx.globalAlpha = .3;
    ctx.fillStyle = P.leafMid;
    wobbleCircle(x, y - r * .7, r, i, 3);
    ctx.fill();
    ctx.fillStyle = P.trunk;
    ctx.fillRect(x - 5, y - r * .4, 10, r * .8);
    ctx.globalAlpha = 1;
  }
}

function drawGround() {
  const g = ctx.createLinearGradient(0, 452, 0, SH);
  g.addColorStop(0, P.grassDk);
  g.addColorStop(.3, P.grass);
  g.addColorStop(1, '#3f5a2a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 452, SW, SH - 452);

  // نورِ لکه‌لکهٔ لابه‌لای برگ‌ها روی چمن
  for (let i = 0; i < 16; i++) {
    const x = noise1(i * 5.7) * SW, y = 470 + noise1(i * 2.9) * 200;
    ctx.globalAlpha = .13 + noise1(i) * .1;
    ctx.fillStyle = P.grassLit;
    wobbleEllipse(x, y, 40 + noise1(i * 3) * 60, 11, 0, i, 3);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // تُرّهٔ علف در پیش‌زمینه
  ctx.strokeStyle = P.grassDk;
  ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (let i = 0; i < 40; i++) {
    const x = noise1(i * 8.1) * SW, y = 630 + noise1(i * 1.3) * 130;
    const h = 12 + noise1(i * 4) * 16;
    const bend = Math.sin(S.t * 1.4 + i) * 4 * S.wind;
    ctx.globalAlpha = .5;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + bend, y - h * .6, x + bend * 2 + 4, y - h);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

/* ───────── درختِ انار ───────── */

function drawTree() {
  const sway = S.wind * .012;
  ctx.save();
  ctx.translate(TREE.x, 520);
  ctx.rotate(sway * .3);
  // تنه
  withShadow(20, 10, .28, () => {
    ctx.fillStyle = P.trunk;
    ctx.beginPath();
    ctx.moveTo(-30, 0);
    ctx.quadraticCurveTo(-20, -110, -26, -210);
    ctx.lineTo(24, -212);
    ctx.quadraticCurveTo(20, -110, 30, 0);
    ctx.closePath(); ctx.fill();
  });
  ctx.fillStyle = P.trunkDk;                 // بافتِ پوستِ تنه
  ctx.globalAlpha = .5;
  for (let i = 0; i < 6; i++) {
    const y = -20 - i * 32;
    ctx.beginPath();
    ctx.moveTo(-16 + noise1(i) * 22, y);
    ctx.quadraticCurveTo(-10 + noise1(i * 3) * 20, y - 18, -14 + noise1(i * 5) * 24, y - 34);
    ctx.lineWidth = 3; ctx.strokeStyle = P.trunkDk; ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // شاخه‌های اصلی
  ctx.strokeStyle = P.trunk;
  ctx.lineWidth = 15; ctx.lineCap = 'round';
  for (const [dx, dy] of [[-96, -282], [92, -276], [-24, -320]]) {
    ctx.beginPath();
    ctx.moveTo(0, -206);
    ctx.quadraticCurveTo(dx * .4, -260, dx, dy);
    ctx.stroke();
  }
  ctx.restore();

  // تاجِ برگ: به‌جای چند تودهٔ بزرگ، خوشه‌های کوچکِ زیاد. لبهٔ تاج هم
  // برگ‌های تکیِ بیرون‌زده دارد تا مثل یک لکهٔ سبز به‌نظر نرسد.
  const clusters = [];
  for (let i = 0; i < 30; i++) {
    const a = noise1(i * 3.7) * TAU;
    const rad = 26 + noise1(i * 5.1) * 86;
    clusters.push({
      x: Math.cos(a) * rad * 1.6,
      y: 208 + Math.sin(a) * rad * 1.05,
      r: 46 + noise1(i * 7.3) * 34,
      tone: noise1(i * 2.9),
      seed: i,
    });
  }
  clusters.sort((a, b) => a.tone - b.tone);      // تیره‌ها اوّل، روشن‌ها رو
  for (const c of clusters) {
    const sw = Math.sin(S.t * .9 + c.seed) * 3 * (1 + S.wind);
    const col = c.tone > .78 ? P.leafSun : c.tone > .52 ? P.leafLit
              : c.tone > .26 ? P.leafMid : P.leafDark;
    ctx.fillStyle = col;
    wobbleCircle(TREE.x + c.x + sw, c.y, c.r, c.seed, 6, 40);
    ctx.fill();
  }
  // برگ‌های تکِ لبه
  for (let i = 0; i < 30; i++) {
    const a = (i / 30) * TAU + noise1(i) * .2;
    const rad = 108 + noise1(i * 4.4) * 26;
    const x = TREE.x + Math.cos(a) * rad * 1.62 + Math.sin(S.t + i) * 3;
    const y = 208 + Math.sin(a) * rad * 1.06;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(a + 1.2);
    ctx.fillStyle = noise1(i * 6) > .5 ? P.leafLit : P.leafMid;
    ctx.beginPath();
    ctx.moveTo(-13, 0);
    ctx.quadraticCurveTo(0, -8, 15, 0);
    ctx.quadraticCurveTo(0, 8, -13, 0);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // نردبانِ چوبی که به درخت تکیه داده
  ctx.save();
  ctx.strokeStyle = P.crateDk;
  ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(TREE.x + 178, 560); ctx.lineTo(TREE.x + 104, 288);
  ctx.moveTo(TREE.x + 212, 556); ctx.lineTo(TREE.x + 138, 284);
  ctx.stroke();
  ctx.lineWidth = 5;
  ctx.strokeStyle = P.crate;
  for (let i = 0; i < 9; i++) {
    const t = i / 9;
    ctx.beginPath();
    ctx.moveTo(lerp(TREE.x + 178, TREE.x + 104, t), lerp(560, 288, t));
    ctx.lineTo(lerp(TREE.x + 212, TREE.x + 138, t), lerp(556, 284, t));
    ctx.stroke();
  }
  ctx.restore();
}

/** انارهای روی درخت — بزرگ‌ترین و پررنگ‌ترین چیزِ صحنه. */
function drawTreePoms() {
  for (const pom of S.tree) {
    const sw = Math.sin(S.t * 1.5 + pom.sway) * 3 * (1 + S.wind);
    const hot = S.hover === pom && S.phase === 'play';
    drawPom(pom.x + sw, pom.y, 25, hot);
    if (hot) {
      ctx.strokeStyle = 'rgba(255,246,214,.9)';
      ctx.lineWidth = 3;
      wobbleCircle(pom.x + sw, pom.y, 31, pom.id, 1.6);
      ctx.stroke();
    }
  }
}

/** انار: بدنِ گِرد و کمی پهن، با تاجِ پنج‌پرِ بالا و برقِ نور از بالا-چپ.
 *  تاج همان چیزی است که انار را از سیب جدا می‌کند، پس بزرگ و واضح است. */
function drawPom(x, y, r, hot) {
  // تاج، پشتِ بدنه تا از دو طرف بیرون بزند
  ctx.save();
  ctx.translate(x, y - r * .78);
  ctx.fillStyle = P.crown;
  for (let k = -2; k <= 2; k++) {
    ctx.save();
    ctx.rotate(k * .38);
    ctx.beginPath();
    ctx.moveTo(-r * .10, r * .26);
    ctx.quadraticCurveTo(-r * .05, -r * .05, 0, -r * .30);
    ctx.quadraticCurveTo(r * .05, -r * .05, r * .10, r * .26);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = '#a56a33';
  wobbleCircle(0, r * .18, r * .2, x, r * .04);
  ctx.fill();
  ctx.restore();

  withShadow(9, 5, .3, () => {
    ctx.fillStyle = hot ? P.pomLit : P.pom;
    wobbleEllipse(x, y, r, r * .94, 0, x + y, r * .05);
    ctx.fill();
  }, '60, 20, 24');

  ctx.save();
  wobbleEllipse(x, y, r, r * .94, 0, x + y, r * .05);
  ctx.clip();
  ctx.fillStyle = P.pomDk;                       // سایهٔ پایین-راست
  ctx.globalAlpha = .42;
  wobbleCircle(x + r * .5, y + r * .42, r * .86, x, r * .05);
  ctx.fill();
  ctx.globalAlpha = .2;                          // انحنای پهلوها
  ctx.strokeStyle = P.pomDk;
  ctx.lineWidth = r * .09;
  for (const d of [-.5, .5]) {
    ctx.beginPath();
    ctx.ellipse(x + d * r * .5, y, r * .3, r * .9, 0, 0, TAU);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  ctx.fillStyle = 'rgba(255,228,216,.6)';        // برقِ نور
  wobbleEllipse(x - r * .36, y - r * .38, r * .24, r * .16, -.55, x, r * .04);
  ctx.fill();
}

function drawFlying() {
  for (const f of S.flying) {
    const t = easeInOut(clamp(f.t, 0, 1));
    const x = lerp(f.sx, f.dx, t);
    const y = lerp(f.sy, f.dy, t) - Math.sin(Math.PI * t) * 120;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(t * 2.4);
    drawPom(0, 0, 25 - t * 3, false);
    ctx.restore();
  }
}

function drawFallingLeaves() {
  for (const l of S.leaves) {
    ctx.save();
    ctx.translate(l.x, l.y);
    ctx.rotate(l.a);
    ctx.scale(l.s, l.s * (.5 + Math.abs(Math.cos(l.a)) * .5));
    ctx.fillStyle = noise1(l.x) > .5 ? P.leafSun : P.gold;
    ctx.beginPath();
    ctx.moveTo(-9, 0);
    ctx.quadraticCurveTo(0, -7, 9, 0);
    ctx.quadraticCurveTo(0, 7, -9, 0);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

/** نیمکتِ چوبیِ برداشت — جعبه‌ها رویش می‌نشینند تا روی چمن شناور نباشند. */
function drawBench() {
  const b = BENCH;
  ctx.globalAlpha = .22;                         // سایهٔ روی چمن
  ctx.fillStyle = '#2f4a22';
  wobbleEllipse(b.x + b.w/2 + 14, b.y + 112, b.w * .52, 20, 0, 3, 4);
  ctx.fill();
  ctx.globalAlpha = 1;

  for (const px of [b.x + 44, b.x + b.w - 44]) { // پایه‌ها
    ctx.fillStyle = P.crateDk;
    wobbleRect(px - 13, b.y + 18, 26, 96, 4, px, 1.4);
    ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.12)';
    wobbleRect(px + 4, b.y + 18, 9, 96, 3, px + 1, 1);
    ctx.fill();
  }
  withShadow(14, 7, .3, () => {                  // صفحهٔ نیمکت
    ctx.fillStyle = P.crate;
    wobbleRect(b.x - 16, b.y, b.w + 32, b.h, 5, 31, 1.6);
    ctx.fill();
  }, '46, 70, 34');
  ctx.fillStyle = 'rgba(255,240,204,.3)';
  wobbleRect(b.x - 12, b.y + 2, b.w + 24, 6, 3, 33, 1);
  ctx.fill();
  ctx.strokeStyle = P.crateDk;                   // درزِ تخته‌ها
  ctx.lineWidth = 2;
  ctx.globalAlpha = .5;
  for (let x = b.x + 60; x < b.x + b.w; x += 132) {
    ctx.beginPath(); ctx.moveTo(x, b.y + 3); ctx.lineTo(x - 2, b.y + b.h - 3); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

/* ───────── جعبه‌ها ───────── */

function drawCrates() {
  const n = crateCount();
  for (let i = 0; i < n; i++) {
    const b = crateBox(i);
    const filled = S.crates[i].length === boxSize();
    const justFull = S.lastFull === i && S.fullT > 0;

    // بدنهٔ جعبه — تخته‌های چوبیِ افقی
    withShadow(14, 7, .3, () => {
      ctx.fillStyle = filled ? P.crateLit : P.crate;
      wobbleRect(b.x, b.y, b.w, b.h, 6, i * 11, 1.6);
      ctx.fill();
    }, '46, 70, 34');
    ctx.strokeStyle = P.crateDk;
    ctx.lineWidth = 2;
    for (let k = 1; k < 3; k++) {
      ctx.beginPath();
      ctx.moveTo(b.x + 4, b.y + k * b.h / 3);
      ctx.lineTo(b.x + b.w - 4, b.y + k * b.h / 3);
      ctx.stroke();
    }
    ctx.fillStyle = P.crateDk;                 // پایه‌های کناری
    wobbleRect(b.x, b.y, 9, b.h, 3, i * 3, 1);
    ctx.fill();
    wobbleRect(b.x + b.w - 9, b.y, 9, b.h, 3, i * 5, 1);
    ctx.fill();

    // جای خالیِ انارها
    for (let k = 0; k < boxSize(); k++) {
      const sp = slotPos(i, k);
      if (k < S.crates[i].length) continue;
      ctx.save();
      ctx.globalAlpha = .3;
      ctx.setLineDash([5, 5]);
      ctx.strokeStyle = P.crateDk;
      ctx.lineWidth = 2;
      wobbleCircle(sp.x, sp.y, slotR(i), i * 7 + k, 1);
      ctx.stroke();
      ctx.restore();
    }
    // انارهای داخلِ جعبه
    for (let k = 0; k < S.crates[i].length; k++) {
      const sp = slotPos(i, k);
      const pop = justFull ? 1 + Math.sin(S.fullT * 12) * .05 : 1;
      ctx.save();
      ctx.translate(sp.x, sp.y);
      ctx.scale(pop, pop);
      drawPom(0, 0, slotR(i), false);
      ctx.restore();
    }
  }
}

/** طنابِ شمارش: بالای جعبه‌ها کشیده شده و از هر جعبه یک پلاکِ چوبی
 *  آویزان است. پلاک تا وقتی جعبه پر نشده خالی است؛ پرشدنِ جعبه عددِ
 *  روی‌هم را می‌آورد. یعنی ۳،۶،۹ را بچه می‌سازد، نه اینکه بخوانَد.     */
function drawRope() {
  const n = crateCount();
  const sag = 26;
  const ropeAt = (t) => ({
    x: lerp(ROPE_L.x, ROPE_R.x, t),
    y: lerp(ROPE_L.y, ROPE_R.y, t) + Math.sin(Math.PI * t) * sag,
  });

  // تیرکِ سمت راست
  ctx.fillStyle = P.trunkDk;
  wobbleRect(ROPE_R.x - 7, ROPE_R.y, 14, 236, 4, 5, 1.4);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.14)';
  wobbleRect(ROPE_R.x - 7, ROPE_R.y, 5, 236, 3, 7, 1);
  ctx.fill();

  ctx.strokeStyle = P.rope;
  ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(ROPE_L.x, ROPE_L.y);
  ctx.quadraticCurveTo((ROPE_L.x + ROPE_R.x)/2, (ROPE_L.y + ROPE_R.y)/2 + sag * 2, ROPE_R.x, ROPE_R.y);
  ctx.stroke();

  for (let i = 0; i < n; i++) {
    const cb = crateBox(i);
    const t = clamp((cb.x + cb.w/2 - ROPE_L.x) / (ROPE_R.x - ROPE_L.x), 0, 1);
    const at = ropeAt(t);
    const on = S.crates[i].length === boxSize();
    const pop = S.lastFull === i && S.fullT > 0 ? 1 + Math.sin(S.fullT * 14) * .16 : 1;
    const swing = Math.sin(S.t * 1.6 + i) * .04 * (1 + S.wind);

    ctx.save();
    ctx.translate(at.x, at.y);
    ctx.rotate(swing);
    ctx.strokeStyle = P.rope;                    // بندِ آویز
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 26); ctx.stroke();
    ctx.scale(pop, pop);
    withShadow(on ? 12 : 5, 4, on ? .32 : .18, () => {
      ctx.fillStyle = on ? P.knot : 'rgba(224,204,160,.5)';
      wobbleRect(-30, 26, 60, 46, 7, i * 9, 1.4);
      ctx.fill();
    }, '80, 60, 20');
    if (on) {
      text(fa(boxSize() * (i + 1)), 0, 51, { size: 26, color: P.ink, family: 'Lalezar' });
    } else {
      text('؟', 0, 51, { size: 22, color: 'rgba(51,48,31,.35)', family: 'Lalezar' });
    }
    ctx.restore();
  }

  // جملهٔ جمع — همان چیزی که کتاب می‌خواهد بنویسند، اینجا خودش نوشته می‌شود
  const full = S.crates.filter((c) => c.length === boxSize()).length;
  if (full > 0) {
    const parts = Array.from({ length: full }, () => fa(boxSize())).join(' + ');
    const sum = `${parts}  =  ${fa(boxSize() * full)}`;
    ctx.font = '400 27px "Lalezar", Tahoma, sans-serif';
    const sw = ctx.measureText(sum).width + 64;
    const sy = BENCH.y + 62;
    paper(BENCH.x + BENCH.w/2 - sw/2, sy, sw, 50, P.paper, 91, 8, .3);
    text(sum, BENCH.x + BENCH.w/2, sy + 26, { size: 27, color: P.pom, family: 'Lalezar' });
  }
}

/* ───────── دستگیرهٔ اندازهٔ جعبه (حالتِ آزاد) ───────── */

function drawBoxDial() {
  const x = 58, y = 608, w = 236, h = 122;
  paper(x, y, w, h, P.paper, 71, 10, .3);
  text('جعبه‌ها چندتایی باشند؟', x + w/2, y + 20, { size: 15, color: P.inkSoft });
  roundButton(BOX_L, '−', { fill: P.crateDk, hot: S.hover === BOX_L, size: 26 });
  text(fa(S.box), x + w/2, y + 56, { size: 40, color: P.pom, family: 'Lalezar' });
  roundButton(BOX_R, '+', { fill: P.crate, hot: S.hover === BOX_R, size: 26 });
  text(`${fa(crateCount())} جعبه لازم است`, x + w/2, y + 92, { size: 14, color: P.inkSoft });
  button(BTN_RESET, 'از نو بچین', { hot: S.hover === BTN_RESET, fill: P.leafMid, hotFill: P.leafLit, size: 19 });
}

/* ───────── باغبان ───────── */

function drawGardener(x, footY) {
  const happy = S.gardener === 'happy';
  const bob = Math.sin(S.t * 1.4) * 3 + (happy ? Math.abs(Math.sin(S.t * 8)) * -7 : 0);
  ctx.save();
  ctx.translate(x, footY + bob);
  ctx.scale(.94, .94);

  ctx.globalAlpha = .22;                        // سایه
  ctx.fillStyle = '#2f4a22';
  wobbleEllipse(8, 4, 52, 10, 0, 3, 2);
  ctx.fill();
  ctx.globalAlpha = 1;

  ctx.fillStyle = P.trunkDk;                    // چکمه
  wobbleRect(-32, -20, 28, 22, 5, 21, 1.2); ctx.fill();
  wobbleRect(6, -20, 28, 22, 5, 23, 1.2); ctx.fill();

  withShadow(16, 8, .26, () => {                // پیراهن
    ctx.fillStyle = '#c9744a';
    ctx.beginPath();
    ctx.moveTo(-44, -14);
    ctx.quadraticCurveTo(-52, -108, -30, -136);
    ctx.lineTo(30, -136);
    ctx.quadraticCurveTo(52, -108, 44, -14);
    ctx.closePath(); ctx.fill();
  });
  ctx.fillStyle = '#a85c39';
  ctx.beginPath();
  ctx.moveTo(14, -14);
  ctx.quadraticCurveTo(36, -100, 26, -134);
  ctx.lineTo(30, -136);
  ctx.quadraticCurveTo(52, -108, 44, -14);
  ctx.closePath(); ctx.fill();

  ctx.strokeStyle = '#d8a878';                  // دست‌ها
  ctx.lineWidth = 14; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-36, -108); ctx.lineTo(-54, -70 + (happy ? -40 : 0));
  ctx.moveTo(36, -108);  ctx.lineTo(54, -70 + (happy ? -40 : 0));
  ctx.stroke();

  withShadow(12, 6, .22, () => {                // سر
    ctx.fillStyle = '#d8a878';
    wobbleCircle(0, -166, 36, 9, 1.8);
    ctx.fill();
  });
  ctx.fillStyle = '#4a3524';                    // مو
  ctx.beginPath();
  ctx.moveTo(-36, -172);
  ctx.quadraticCurveTo(-38, -212, 0, -206);
  ctx.quadraticCurveTo(38, -212, 36, -172);
  ctx.quadraticCurveTo(18, -190, 0, -188);
  ctx.quadraticCurveTo(-18, -190, -36, -172);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = P.ink;
  for (const s of [-1, 1]) {
    if (happy) {
      ctx.strokeStyle = P.ink; ctx.lineWidth = 3.2;
      ctx.beginPath(); ctx.arc(s * 13, -172, 7.5, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    } else { ctx.beginPath(); ctx.ellipse(s * 13, -170, 4.2, 5, 0, 0, TAU); ctx.fill(); }
  }
  ctx.strokeStyle = P.ink; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
  ctx.beginPath();
  if (happy) ctx.arc(0, -152, 12, .15 * Math.PI, .85 * Math.PI);
  else ctx.arc(0, -154, 9, .2 * Math.PI, .8 * Math.PI);
  ctx.stroke();
  ctx.globalAlpha = .3;
  ctx.fillStyle = P.pom;
  wobbleCircle(-24, -158, 7, 1, .6); ctx.fill();
  wobbleCircle(24, -158, 7, 2, .6); ctx.fill();
  ctx.globalAlpha = 1;

  // سبدِ حصیریِ دستش
  ctx.save();
  ctx.translate(58, -58 + (happy ? -40 : 0));
  ctx.fillStyle = '#c9a06a';
  ctx.beginPath();
  ctx.moveTo(-22, 0); ctx.lineTo(22, 0);
  ctx.quadraticCurveTo(18, 26, 0, 26);
  ctx.quadraticCurveTo(-18, 26, -22, 0);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#a67f4d'; ctx.lineWidth = 2;
  for (let k = -1; k <= 1; k++) {
    ctx.beginPath();
    ctx.moveTo(k * 11, 2); ctx.lineTo(k * 8, 24);
    ctx.stroke();
  }
  ctx.strokeStyle = '#a67f4d'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, 22, Math.PI, TAU); ctx.stroke();
  ctx.restore();
  ctx.restore();
}

function drawBees() {
  for (const b of S.bees) {
    const x = b.cx + Math.cos(b.a) * b.r;
    const y = b.cy + Math.sin(b.a * 1.7) * 24;
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = P.gold;
    wobbleEllipse(0, 0, 6, 4, 0, b.r, .5);
    ctx.fill();
    ctx.fillStyle = '#3a3018';
    ctx.fillRect(-1, -3.4, 2, 6.8);
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    const f = Math.sin(S.t * 30 + b.a) * 3;
    wobbleEllipse(-1, -5 - f * .3, 5, 2.4, -.4, b.r + 2, .4);
    ctx.fill();
    ctx.restore();
  }
}

/* ───────── پرده‌ها ───────── */

function drawIntro() {
  overlay({
    t: S.introT, title: L().name, body: L().story,
    btn: BTN_GO, btnLabel: 'شروع', btnHot: S.hover === BTN_GO,
    paper: P.paper, band: P.pom, ink: P.ink, inkSoft: P.inkSoft,
    btnFill: P.leafMid, btnHotFill: P.leafLit,
    icon: (cx, cy) => {
      for (let k = 0; k < 3; k++) drawPom(cx - 40 + k * 40, cy, 19, false);
    },
  });
}

function drawDone() {
  const n = crateCount(), b = boxSize();
  const parts = Array.from({ length: n }, () => fa(b)).join(' + ');
  const last = S.level + 1 >= LEVELS.length;
  overlay({
    t: S.doneT,
    title: `${fa(L().total)} انار، ${fa(n)} جعبه`,
    body: `${parts}  =  ${fa(L().total)}\n` +
      (L().free
        ? 'هر اندازه‌ای برای جعبه بگذاری، تهش باز هم همان تعداد انار است.'
        : `یعنی ${fa(b)}تا${fa(b)}تا شمردی و ${fa(n)} بار شمردن کافی بود.`),
    btn: BTN_GO, btnLabel: last ? 'یک بار دیگر' : 'باغِ بعدی', btnHot: S.hover === BTN_GO,
    paper: P.paper, band: P.leafMid, ink: P.ink, inkSoft: P.inkSoft,
    btnFill: P.leafMid, btnHotFill: P.leafLit,
    icon: (cx, cy) => star(cx, cy, 28, P.gold),
  });
}
