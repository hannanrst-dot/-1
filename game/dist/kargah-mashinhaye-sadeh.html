/* ---------- نشانه‌های طراحی ---------- */
:root {
  --font: 'Vazirmatn', 'Segoe UI', Tahoma, system-ui, sans-serif;

  --sky-1: #dcf0fb;
  --sky-2: #eef6fb;
  --paper: #ffffff;
  --paper-2: #f6f8fb;
  --ink: #16283c;
  --ink-2: #4a627a;
  --ink-3: #7c93a8;
  --line: #d9e3ec;
  --line-strong: #b8c9d8;

  --primary: #0b7fc4;
  --primary-soft: #e2f2fd;
  --primary-ink: #075985;
  --accent: #f0900c;
  --accent-soft: #fff2dc;
  --accent-ink: #a2560a;
  --ok: #10935f;
  --ok-soft: #e2f7ee;
  --warn: #cc7a00;
  --warn-soft: #fff4e0;
  --bad: #d33b4a;
  --bad-soft: #fdeaec;
  --violet: #7b5cd6;
  --violet-soft: #f0ecfd;

  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 18px;
  --r-xl: 24px;

  --sh-1: 0 1px 2px rgba(16, 40, 60, .06), 0 2px 8px rgba(16, 40, 60, .05);
  --sh-2: 0 4px 12px rgba(16, 40, 60, .09), 0 12px 32px rgba(16, 40, 60, .07);
  --sh-3: 0 18px 48px rgba(16, 40, 60, .22);

  --topbar-h: 62px;
  --ease: cubic-bezier(.34, 1.3, .64, 1);
}

/* اگر هنوز تمی انتخاب نشده، از تنظیم سیستم کاربر پیروی می‌کنیم */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky-1: #0d1a26; --sky-2: #0a141d; --paper: #132433; --paper-2: #0f1d29;
    --ink: #e8f1f8; --ink-2: #a8becf; --ink-3: #7690a5; --line: #24394c; --line-strong: #365167;
    --primary: #45b2f0; --primary-soft: #12354c; --primary-ink: #9ad6fb;
    --accent: #fbb03b; --accent-soft: #3d2d10; --accent-ink: #fcd08a;
    --ok: #3ed99b; --ok-soft: #10352a; --warn: #f2b23c; --warn-soft: #3a2c12;
    --bad: #ff7b8a; --bad-soft: #401a22; --violet: #a891f5; --violet-soft: #241d3f;
    --sh-1: 0 1px 2px rgba(0, 0, 0, .3);
    --sh-2: 0 6px 18px rgba(0, 0, 0, .4);
    --sh-3: 0 20px 50px rgba(0, 0, 0, .6);
  }
}

[data-theme="dark"] {
  --sky-1: #0d1a26;
  --sky-2: #0a141d;
  --paper: #132433;
  --paper-2: #0f1d29;
  --ink: #e8f1f8;
  --ink-2: #a8becf;
  --ink-3: #7690a5;
  --line: #24394c;
  --line-strong: #365167;

  --primary: #45b2f0;
  --primary-soft: #12354c;
  --primary-ink: #9ad6fb;
  --accent: #fbb03b;
  --accent-soft: #3d2d10;
  --accent-ink: #fcd08a;
  --ok: #3ed99b;
  --ok-soft: #10352a;
  --warn: #f2b23c;
  --warn-soft: #3a2c12;
  --bad: #ff7b8a;
  --bad-soft: #401a22;
  --violet: #a891f5;
  --violet-soft: #241d3f;

  --sh-1: 0 1px 2px rgba(0, 0, 0, .3);
  --sh-2: 0 6px 18px rgba(0, 0, 0, .4);
  --sh-3: 0 20px 50px rgba(0, 0, 0, .6);
}

[data-contrast="high"] {
  --paper: #fff;
  --paper-2: #fff;
  --sky-1: #fff;
  --sky-2: #fff;
  --ink: #000;
  --ink-2: #000;
  --ink-3: #1c1c1c;
  --line: #000;
  --line-strong: #000;
  --primary: #00407a;
  --primary-soft: #fff;
  --primary-ink: #00325e;
  --accent: #8a4b00;
  --accent-soft: #fff;
  --accent-ink: #6b3a00;
  --ok: #045c39;
  --ok-soft: #fff;
  --warn: #7a4a00;
  --warn-soft: #fff;
  --bad: #9b0d1c;
  --bad-soft: #fff;
  --violet: #3d2a80;
  --violet-soft: #fff;
  --sh-1: none;
  --sh-2: none;
  --sh-3: 0 0 0 3px #000;
}
[data-contrast="high"] .card,
[data-contrast="high"] .chip,
[data-contrast="high"] .btn,
[data-contrast="high"] .hud-chip,
[data-contrast="high"] .iconbtn,
[data-contrast="high"] .tab { border-width: 2px; }

/* ---------- پایه ---------- */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.65;
  color: var(--ink);
  background:
    radial-gradient(1200px 620px at 78% -10%, var(--sky-1), transparent 62%),
    linear-gradient(180deg, var(--sky-2), var(--paper-2));
  background-attachment: fixed;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

h1, h2, h3, h4 { line-height: 1.35; font-weight: 800; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.skip-link {
  position: absolute; inset-inline-start: 12px; top: -60px; z-index: 200;
  background: var(--primary); color: #fff; padding: 10px 16px;
  border-radius: 0 0 var(--r-md) var(--r-md); text-decoration: none; font-weight: 700;
  transition: top .2s;
}
.skip-link:focus { top: 0; }

.sr-only {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}

/* ═══════════ نوار بالا ═══════════ */
.topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 9px clamp(12px, 2vw, 22px);
  min-height: var(--topbar-h);
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 40;
}

.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark {
  font-size: 26px; line-height: 1;
  background: var(--accent-soft); border: 1px solid var(--line);
  border-radius: var(--r-md); padding: 6px 8px;
}
.brand-text h1 { font-size: 1.05rem; color: var(--primary-ink); white-space: nowrap; }
.brand-text p { font-size: .74rem; color: var(--ink-3); font-weight: 600; white-space: nowrap; }

.tabs {
  display: flex; gap: 4px; margin-inline: auto;
  background: var(--paper-2); border: 1px solid var(--line);
  border-radius: 999px; padding: 4px;
}
.tab {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 16px; border-radius: 999px;
  font-weight: 700; font-size: .9rem; color: var(--ink-2);
  border: 1px solid transparent; transition: all .18s;
}
.tab:hover { color: var(--ink); background: color-mix(in srgb, var(--primary-soft) 60%, transparent); }
.tab.is-active {
  background: var(--paper); color: var(--primary-ink);
  border-color: var(--line-strong); box-shadow: var(--sh-1);
}

.topbar-actions { display: flex; gap: 6px; align-items: center; }
.iconbtn {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 12px; border-radius: var(--r-md);
  background: var(--paper); border: 1px solid var(--line);
  font-size: .85rem; font-weight: 700; color: var(--ink-2);
  transition: all .18s;
}
.iconbtn:hover { border-color: var(--primary); color: var(--primary-ink); transform: translateY(-1px); }
.pill {
  background: var(--accent); color: #fff; font-size: .72rem; font-weight: 800;
  border-radius: 999px; padding: 0 7px; min-width: 20px; text-align: center;
}

/* ═══════════ چیدمان اصلی ═══════════ */
.workspace {
  display: grid;
  grid-template-columns: minmax(0, 1.55fr) minmax(340px, .95fr);
  gap: 14px;
  padding: 14px clamp(12px, 2vw, 22px) 16px;
  max-width: 1680px; width: 100%; margin: 0 auto;
  min-height: 0;
}

/* ---------- صحنه ---------- */
.stage {
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 10px; min-height: 0; min-width: 0;
}
/* اندازهٔ ذاتی بوم نباید عرض چیدمان را بکشد */
.stage > * { min-width: 0; }

.stage-toolbar {
  display: flex; gap: 7px; overflow-x: auto; padding-bottom: 2px;
  scrollbar-width: thin;
}
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto;
  padding: 7px 13px; border-radius: 999px;
  background: var(--paper); border: 1px solid var(--line);
  font-size: .84rem; font-weight: 700; color: var(--ink-2);
  white-space: nowrap; transition: all .18s;
}
.chip:hover { border-color: var(--primary); transform: translateY(-1px); }
.chip.is-active {
  background: var(--primary); border-color: var(--primary); color: #fff;
  box-shadow: 0 3px 10px color-mix(in srgb, var(--primary) 35%, transparent);
}
.chip.is-done { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.chip.is-done.is-active { background: var(--ok); color: #fff; }
.chip.is-locked { opacity: .5; }
.chip-num {
  background: color-mix(in srgb, currentColor 16%, transparent);
  border-radius: 999px; width: 19px; height: 19px;
  display: grid; place-items: center; font-size: .72rem;
}

.stage-canvas-wrap {
  position: relative; min-height: 0;
  border-radius: var(--r-xl); overflow: hidden;
  border: 1px solid var(--line-strong); box-shadow: var(--sh-2);
  background: linear-gradient(180deg, var(--sky-1), var(--paper-2));
}
#stageCanvas { display: block; width: 100%; max-width: 100%; height: 100%; touch-action: none; }

.stage-overlay {
  position: absolute; inset-inline: 10px; top: 10px;
  display: flex; flex-direction: column; gap: 8px;
  pointer-events: none;
}

.hud { display: flex; flex-wrap: wrap; gap: 7px; }
.hud-chip {
  display: flex; align-items: baseline; gap: 6px;
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(6px);
  border: 1px solid var(--line); border-inline-start: 3px solid var(--ink-3);
  border-radius: var(--r-md); padding: 5px 11px;
  box-shadow: var(--sh-1); font-size: .78rem;
}
.hud-chip b { font-size: 1.02rem; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }
.hud-chip span { color: var(--ink-3); font-weight: 600; }
.hud-chip.t-ok { border-inline-start-color: var(--ok); }
.hud-chip.t-ok b { color: var(--ok); }
.hud-chip.t-bad { border-inline-start-color: var(--bad); }
.hud-chip.t-bad b { color: var(--bad); }
.hud-chip.t-primary { border-inline-start-color: var(--primary); }
.hud-chip.t-primary b { color: var(--primary-ink); }
.hud-chip.t-accent { border-inline-start-color: var(--accent); }
.hud-chip.t-accent b { color: var(--accent-ink); }

.canvas-alt { display: none; }

.captions {
  position: absolute; inset-inline-start: 12px; bottom: 12px;
  background: rgba(11, 22, 32, .84); color: #fff;
  padding: 6px 14px; border-radius: 999px; font-size: .82rem; font-weight: 600;
  opacity: 0; transform: translateY(6px); transition: all .25s; pointer-events: none;
}
.captions.is-on { opacity: 1; transform: none; }

.verdict {
  position: absolute; inset-inline: 0; bottom: 14px; margin-inline: auto;
  width: max-content; max-width: min(92%, 560px);
  display: none; align-items: center; gap: 9px;
  padding: 10px 18px; border-radius: 999px;
  font-weight: 700; font-size: .9rem; box-shadow: var(--sh-2);
  animation: pop .3s var(--ease);
}
.verdict.is-on { display: flex; }
.verdict.v-ok { background: var(--ok); color: #fff; }
.verdict.v-bad { background: var(--bad); color: #fff; }

.stage-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spacer { flex: 1; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 11px 20px; border-radius: var(--r-md);
  font-weight: 800; font-size: .92rem; border: 1px solid transparent;
  transition: transform .16s var(--ease), box-shadow .18s, background .18s, border-color .18s;
}
.btn:active { transform: translateY(1px) scale(.99); }
.btn-primary {
  background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 92%, #fff), var(--accent));
  color: #3a1e00; box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 40%, transparent);
  min-width: 148px;
}
[data-theme="dark"] .btn-primary { color: #2a1a00; }
.btn-primary:hover { box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 52%, transparent); transform: translateY(-1px); }
.btn-primary:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; transform: none; }
.btn-ghost { background: var(--paper); border-color: var(--line); color: var(--ink-2); }
.btn-ghost:hover { border-color: var(--line-strong); color: var(--ink); }
.btn-toggle {
  background: var(--paper); border-color: var(--line); color: var(--ink-2);
  padding: 9px 14px; font-size: .84rem;
}
.btn-toggle[aria-pressed="true"] {
  background: var(--primary-soft); border-color: var(--primary); color: var(--primary-ink);
}

/* ---------- پنل کناری ---------- */
.sidepanel {
  display: flex; flex-direction: column; gap: 12px;
  overflow-y: auto; overscroll-behavior: contain;
  padding-inline-end: 4px; min-height: 0; min-width: 0;
  scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent;
}
.sidepanel::-webkit-scrollbar { width: 8px; }
.sidepanel::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 99px; }

.card {
  background: var(--paper); border: 1px solid var(--line);
  border-radius: var(--r-lg); padding: 15px; box-shadow: var(--sh-1);
}
.card-title {
  display: flex; align-items: center; gap: 8px;
  font-size: .95rem; color: var(--ink); margin-bottom: 12px;
}
.card-title .dot {
  width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center;
  background: var(--primary-soft); font-size: .95rem;
}
.card-note { font-size: .8rem; color: var(--ink-3); line-height: 1.6; }

/* داستان */
.story { display: flex; gap: 12px; background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 32%, transparent); }
.story .avatar {
  font-size: 1.9rem; background: var(--paper); border: 1px solid var(--line);
  border-radius: var(--r-md); width: 52px; height: 52px; flex: 0 0 auto;
  display: grid; place-items: center;
}
.story h3 { font-size: .92rem; color: var(--accent-ink); margin-bottom: 3px; }
.story p { font-size: .88rem; color: var(--ink-2); }
.story .goal {
  margin-top: 8px; font-size: .84rem; font-weight: 700; color: var(--accent-ink);
  background: var(--paper); border: 1px dashed color-mix(in srgb, var(--accent) 45%, transparent);
  border-radius: var(--r-sm); padding: 6px 10px;
}

/* پرسش پیش‌بینی */
.quiz { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 28%, transparent); }
.quiz .q { font-size: .88rem; font-weight: 700; color: var(--ink); margin-bottom: 10px; }
.options { display: flex; flex-direction: column; gap: 7px; }
.option {
  display: flex; align-items: center; gap: 9px; text-align: start;
  background: var(--paper); border: 1px solid var(--line);
  border-radius: var(--r-md); padding: 9px 12px; font-size: .86rem;
  transition: all .18s;
}
.option:hover { border-color: var(--ok); }
.option .mark {
  flex: 0 0 auto; width: 21px; height: 21px; border-radius: 50%;
  border: 2px solid var(--line-strong); display: grid; place-items: center;
  font-size: .72rem; font-weight: 800;
}
.option.is-picked { border-color: var(--primary); background: var(--primary-soft); }
.option.is-picked .mark { border-color: var(--primary); background: var(--primary); color: #fff; }
.option.is-right { border-color: var(--ok); background: var(--ok-soft); }
.option.is-right .mark { border-color: var(--ok); background: var(--ok); color: #fff; }
.option.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.option.is-wrong .mark { border-color: var(--bad); background: var(--bad); color: #fff; }
.feedback {
  margin-top: 9px; font-size: .84rem; font-weight: 600; line-height: 1.6;
  padding: 8px 11px; border-radius: var(--r-sm);
  background: var(--paper); border-inline-start: 3px solid var(--ok); color: var(--ink-2);
}

/* کنترل‌ها */
.field { margin-bottom: 14px; }
.field:last-child { margin-bottom: 0; }
.field > label, .field-label {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  font-size: .84rem; font-weight: 700; margin-bottom: 7px; color: var(--ink);
}
.field-value {
  font-variant-numeric: tabular-nums; font-weight: 800; color: var(--primary-ink);
  background: var(--primary-soft); border-radius: var(--r-sm); padding: 1px 8px; font-size: .84rem;
}
.field-hint { font-size: .76rem; color: var(--ink-3); margin-top: 5px; line-height: 1.5; }

/* شیارِ لغزنده روی خود عنصر رسم می‌شود تا متغیرهای CSS در همهٔ مرورگرها کار کنند */
input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 22px; cursor: pointer;
  background-color: transparent;
  background-image: linear-gradient(to left, var(--primary) var(--fill, 50%), var(--line) var(--fill, 50%));
  background-size: 100% 7px;
  background-position: center;
  background-repeat: no-repeat;
  border-radius: 99px;
}
input[type="range"]::-webkit-slider-runnable-track { height: 7px; background: transparent; border-radius: 99px; }
input[type="range"]::-moz-range-track { height: 7px; background: transparent; border-radius: 99px; }
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 21px; height: 21px; border-radius: 50%; margin-top: -7px;
  background: var(--paper); border: 3px solid var(--primary); box-shadow: var(--sh-1);
  transition: transform .15s;
}
input[type="range"]::-moz-range-thumb {
  width: 15px; height: 15px; border-radius: 50%;
  background: var(--paper); border: 3px solid var(--primary); box-shadow: var(--sh-1);
}
input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.15); }

.segment { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 7px; }
.segment.cols-2 { grid-template-columns: repeat(2, 1fr); }
.seg {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 9px 8px; border-radius: var(--r-md); text-align: center;
  background: var(--paper-2); border: 1px solid var(--line);
  font-size: .8rem; font-weight: 700; color: var(--ink-2); line-height: 1.35;
  transition: all .18s;
}
.seg .seg-icon { font-size: 1.15rem; }
.seg .seg-sub { font-size: .7rem; font-weight: 600; color: var(--ink-3); }
.seg:hover { border-color: var(--primary); transform: translateY(-1px); }
.seg.is-active {
  background: var(--primary); border-color: var(--primary); color: #fff;
  box-shadow: 0 3px 10px color-mix(in srgb, var(--primary) 32%, transparent);
}
.seg.is-active .seg-sub { color: color-mix(in srgb, #fff 82%, transparent); }

.switch {
  display: flex; align-items: center; gap: 10px; cursor: pointer;
  background: var(--paper-2); border: 1px solid var(--line);
  border-radius: var(--r-md); padding: 9px 12px; font-size: .85rem; font-weight: 700;
  transition: all .18s;
}
.switch:hover { border-color: var(--primary); }
.switch input { position: absolute; opacity: 0; pointer-events: none; }
.switch .track {
  flex: 0 0 auto; width: 40px; height: 23px; border-radius: 99px;
  background: var(--line-strong); position: relative; transition: background .2s;
}
.switch .track::after {
  content: ''; position: absolute; top: 3px; inset-inline-end: 3px;
  width: 17px; height: 17px; border-radius: 50%; background: #fff;
  transition: transform .2s var(--ease); box-shadow: 0 1px 3px rgba(0, 0, 0, .3);
}
.switch input:checked + .track { background: var(--ok); }
.switch input:checked + .track::after { transform: translateX(-17px); }
.switch input:focus-visible + .track { outline: 3px solid var(--accent); outline-offset: 2px; }
.switch .switch-sub { font-size: .75rem; font-weight: 600; color: var(--ink-3); display: block; }

/* جدول داده‌ها */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-md); }
table { border-collapse: collapse; width: 100%; font-size: .8rem; }
th, td { padding: 7px 9px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { background: var(--paper-2); font-weight: 800; color: var(--ink-2); font-size: .76rem; position: sticky; top: 0; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--primary-soft); }
td b { font-variant-numeric: tabular-nums; }
.t-empty { padding: 18px; text-align: center; color: var(--ink-3); font-size: .84rem; }

/* نمودار */
.chart { width: 100%; height: 150px; display: block; }

/* راهنمایی */
.hint {
  display: flex; gap: 9px; align-items: flex-start;
  background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 32%, transparent);
  border-radius: var(--r-md); padding: 10px 12px; font-size: .85rem; color: var(--ink-2);
  line-height: 1.6;
}

/* نشان‌ها و کارت کشف */
.badges { display: flex; flex-wrap: wrap; gap: 7px; }
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
  color: var(--accent-ink); border-radius: 999px; padding: 5px 12px;
  font-size: .8rem; font-weight: 800;
}
.discovery {
  text-align: center; padding: 22px 18px; border-radius: var(--r-lg);
  background: var(--ok-soft); border: 2px dashed var(--ok);
}
.discovery .d-icon { font-size: 3rem; line-height: 1; margin-bottom: 6px; display: block; }
.discovery h3 { color: var(--ok); font-size: 1.15rem; margin-bottom: 4px; }
.discovery .d-topic { font-size: .8rem; font-weight: 800; color: var(--ink-3); margin-bottom: 10px; }
.discovery p { font-size: .93rem; color: var(--ink-2); line-height: 1.8; }
.formula {
  margin-top: 12px; background: var(--paper); border: 1px solid var(--line);
  border-radius: var(--r-md); padding: 9px 12px;
  font-size: .92rem; font-weight: 800; color: var(--primary-ink);
  direction: ltr; text-align: center; letter-spacing: .3px;
}

/* شبکهٔ کارت‌ها در مودال */
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.mini-card {
  background: var(--paper-2); border: 1px solid var(--line);
  border-radius: var(--r-md); padding: 12px; display: flex; gap: 10px; align-items: flex-start;

.mini-card p { font-size: .78rem; color: var(--ink-3); line-height: 1.55; }

/* ═══════════ مودال ═══════════ */
.modal { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px; }
.modal[hidden] { display: none; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(10, 22, 34, .55); backdrop-filter: blur(3px); }
.modal-card {
  position: relative; width: min(680px, 100%); max-height: min(88vh, 820px);
  display: flex; flex-direction: column;
  background: var(--paper); border: 1px solid var(--line);
  border-radius: var(--r-xl); box-shadow: var(--sh-3);
  animation: pop .28s var(--ease);
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 16px 20px; border-bottom: 1px solid var(--line);
}
.modal-head h2 { font-size: 1.08rem; color: var(--primary-ink); }
.modal-close {
  width: 34px; height: 34px; border-radius: 50%; flex: 0 0 auto;
  background: var(--paper-2); border: 1px solid var(--line);
  display: grid; place-items: center; font-size: .95rem; color: var(--ink-2);
}
.modal-close:hover { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
.modal-body { padding: 18px 20px 22px; overflow-y: auto; }
.modal-body > * + * { margin-top: 14px; }
.modal-body h3 { font-size: .96rem; color: var(--ink); }
.modal-body p, .modal-body li { font-size: .87rem; color: var(--ink-2); line-height: 1.75; }
.modal-body ul { padding-inline-start: 20px; }
.modal-actions { display: flex; gap: 10px; justify-content: center; padding-top: 4px; }

@keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }

/* ═══════════ واکنش‌گرایی ═══════════ */
@media (max-width: 1100px) {
  body { grid-template-rows: auto auto; }
  .workspace { grid-template-columns: 1fr; }
  /* ستون صحنه به جای شبکه، ستونی می‌شود تا نسبت‌ابعادِ بوم سرریز نکند */
  .stage { display: flex; flex-direction: column; }
  .stage-canvas-wrap { aspect-ratio: 16 / 10; }
  .sidepanel { overflow: visible; max-height: none; }
  .iconbtn-text { display: none; }
  .iconbtn { padding: 8px 10px; }
}

@media (max-width: 720px) {
  body { font-size: 14px; }

  .brand-mark { font-size: 21px; padding: 4px 6px; }

  .modal-card { max-height: 92vh; }
}

@media (max-width: 420px) {
  .segment { grid-template-columns: repeat(2, 1fr); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }

/* ═══════════ چاپ ═══════════ */
@media print {

/* ══════ src/core/format.js ══════ */
// قالب‌بندی اعداد و متن فارسی
const PERSIAN_DIGITS = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];

/** تبدیل ارقام لاتین به فارسی (و نقطه اعشار به ممیز فارسی) */
function fa(value) {
  if (value === null || value === undefined || value === '') return '';
  return String(value)
    .replace(/[0-9]/g, (d) => PERSIAN_DIGITS[+d])
    .replace(/\./g, '٫');
}

/** گرد کردن هوشمند: اعداد بزرگ بدون اعشار، اعداد کوچک با یک/دو رقم اعشار */
function round(value, digits) {
  if (!Number.isFinite(value)) return 0;
  if (digits === undefined) {
    if (Math.abs(value) >= 100) digits = 0;
    else if (Math.abs(value) >= 10) digits = 1;
    else digits = 2;
  }
  const f = 10 ** digits;
  const r = Math.round(value * f) / f;
  return Object.is(r, -0) ? 0 : r;
}

/** عدد آمادهٔ نمایش: گرد شده + ارقام فارسی */
function num(value, digits) {
  return fa(String(round(value, digits)));
}

/** محدود کردن یک مقدار بین کمینه و بیشینه */
function clamp(value, min, max) {
  return Math.min(max, Math.max(min, value));
}

/** درون‌یابی خطی */
function lerp(a, b, t) {
  return a + (b - a) * t;
}

/** نگاشت بازه به بازه */
function mapRange(v, inMin, inMax, outMin, outMax) {
  if (inMax === inMin) return outMin;
  return outMin + ((v - inMin) / (inMax - inMin)) * (outMax - outMin);
}

/** نرم‌کنندهٔ حرکت برای انیمیشن */
function easeInOut(t) {
  return t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;

  GEARS:          { id: 'GEARS',          name: 'چرخ‌دنده‌ها',         short: 'چرخ‌دنده',    icon: '⚙️',  color: '#14b8a6' }
};

// ————————————————————————————————————————————————————————
// کمکی‌ها
// ————————————————————————————————————————————————————————

function finish(result, pullerId = DEFAULT_PULLER) {
  const puller = PULLERS[pullerId] || PULLERS[DEFAULT_PULLER];
  const effortN = result.effortN;
  const out = {
    ...result,
    puller,
    humanLimitN: puller.limitN,
    feasible: effortN <= puller.limitN,
    // کار مفید و کار ورودی (پایستگی انرژی: کار ورودی همیشه ≥ کار مفید)
    workOutJ: result.workOutJ ?? (result.loadN * result.loadDistanceM),
    workInJ: result.workInJ ?? (effortN * result.effortDistanceM)
  };
  out.energyLostJ = Math.max(0, out.workInJ - out.workOutJ);
  return roundResult(out);
}

function roundResult(r) {
  const numericKeys = [
    'loadN', 'effortIdealN', 'frictionN', 'effortN', 'maIdeal', 'maActual',
    'efficiency', 'loadDistanceM', 'effortDistanceM', 'workOutJ', 'workInJ', 'energyLostJ'
  ];
  for (const k of numericKeys) {
    if (typeof r[k] === 'number') r[k] = round(r[k]);
  }
  return r;
}

function surfaceOf(surfaceId, useRollers) {
  if (useRollers) return ROLLERS;
  return SURFACES[surfaceId] || SURFACES.ROUGH_STONE;
}

// ————————————————————————————————————————————————————————
// ۱) اصطکاک، چرخ و غلتک — کشیدن بار روی سطح افقی
// ————————————————————————————————————————————————————————

function friction({
  massKg = 50,
  surfaceId = 'ROUGH_STONE',
  useRollers = false,
  distanceM = 6,
  pullerId = DEFAULT_PULLER
} = {}) {
  const surface = surfaceOf(surfaceId, useRollers);
  const loadN = massKg * G;
  // روی سطح افقی، تمام نیروی لازم صرف غلبه بر اصطکاک می‌شود
  const effortN = loadN * surface.mu;

  const baseline = loadN * SURFACES.ROUGH_STONE.mu; // مقایسه با سنگ ناهموار
  const savedPercent = clamp(Math.round(((baseline - effortN) / baseline) * 100), 0, 100);

  return finish({
    machine: 'FRICTION',
    massKg,
    surface,
    useRollers,
    loadN,
    effortIdealN: 0,          // در حالت آرمانیِ بدون اصطکاک، نیرویی لازم نیست
    frictionN: effortN,
    effortN,
    maIdeal: null,            // چرخ و غلتک «مزیت مکانیکی» ندارند؛ اصطکاک را کم می‌کنند
    maActual: null,
    efficiency: null,
    loadDistanceM: distanceM,
    effortDistanceM: distanceM,
    workOutJ: 0,              // بار بالا نمی‌رود؛ همهٔ کار صرف اصطکاک می‌شود
    workInJ: effortN * distanceM,
    forceRatioPercent: Math.round((effortN / loadN) * 100),
    savedPercent,
    geom: { distanceM, mu: surface.mu },
    insightFa: useRollers
      ? 'غلتک‌ها اصطکاکِ مالشی را به اصطکاکِ غلتشی تبدیل کردند؛ نیروی لازم به کمترین مقدار رسید.'
      : surface.mu >= 0.5
        ? 'سطحِ زبر، اصطکاکِ زیادی می‌سازد؛ نیروی لازم نزدیک به وزن بار است.'
        : 'صاف‌تر شدن سطح، اصطکاک را کم کرد؛ اما غلتک از این هم بهتر عمل می‌کند.'
  }, pullerId);
}

// ————————————————————————————————————————————————————————
// ۲) سطح شیب‌دار
// ————————————————————————————————————————————————————————

function inclinedPlane({
  massKg = 50,
  heightM = 2,
  lengthM = 4,
  surfaceId = 'WOOD_PLANKS',
  useRollers = false,
  pullerId = DEFAULT_PULLER
} = {}) {
  const surface = surfaceOf(surfaceId, useRollers);
  const loadN = massKg * G;

  // طول رمپ هرگز نمی‌تواند از ارتفاع کمتر باشد
  const L = Math.max(heightM * 1.02, lengthM);
  const sin = heightM / L;
  const cos = Math.sqrt(Math.max(0, 1 - sin * sin));
  const angleDeg = round((Math.asin(clamp(sin, 0, 1)) * 180) / Math.PI, 0);

  const effortIdealN = loadN * sin;               // مؤلفهٔ وزن در راستای شیب
  const frictionN = loadN * cos * surface.mu;     // اصطکاک در راستای شیب
  const effortN = effortIdealN + frictionN;

  const maIdeal = L / heightM;
  const maActual = loadN / effortN;

  return finish({
    machine: 'INCLINED_PLANE',
    massKg,
    surface,
    useRollers,
    loadN,
    effortIdealN,
    frictionN,
    effortN,
    maIdeal,
    maActual,
    efficiency: maActual / maIdeal,
    loadDistanceM: heightM,        // بار به اندازهٔ ارتفاع بالا می‌رود
    effortDistanceM: L,            // ولی ما در طول کل رمپ آن را می‌کشیم
    angleDeg,
    heightM,
    lengthM: L,
    directLiftN: loadN,
    savedPercent: clamp(Math.round(((loadN - effortN) / loadN) * 100), 0, 100),
    geom: { heightM, lengthM: L, angleDeg, sin, cos, mu: surface.mu },
    insightFa: angleDeg <= 20
      ? 'شیب ملایم شد: نیروی لازم کم است، اما مسیر درازتری را باید طی کنیم.'
      : angleDeg >= 45
        ? 'شیب خیلی تند است؛ نیروی لازم تقریباً به اندازهٔ بلند کردن مستقیم بار شد.'
        : 'با درازتر کردن رمپ، نیرو کمتر و مسافت بیشتر می‌شود؛ کار انجام‌شده تقریباً ثابت می‌ماند.'
  }, pullerId);
}

// ————————————————————————————————————————————————————————
// ۳) اهرم
// ————————————————————————————————————————————————————————

/** تشخیص نوع اهرم از روی ترتیب تکیه‌گاه، بار و نیرو */
function leverClass(fulcrumM, loadM, effortM) {
  const between = (x, a, b) => x > Math.min(a, b) && x < Math.max(a, b);
  if (between(fulcrumM, loadM, effortM)) {
    return { type: 1, name: 'اهرم نوع اول', desc: 'تکیه‌گاه بین بار و نیرو است — مانند الاکلنگ، قیچی و دیلم.' };
  }
  if (between(loadM, fulcrumM, effortM)) {
    return { type: 2, name: 'اهرم نوع دوم', desc: 'بار بین تکیه‌گاه و نیرو است — مانند فرغون و دربازکن.' };
  }
  return { type: 3, name: 'اهرم نوع سوم', desc: 'نیرو بین تکیه‌گاه و بار است — مانند انبرک و ساعد دست؛ نیرو بیشتر می‌شود ولی سرعت و مسافتِ بار زیاد.' };
}

function lever({
  massKg = 80,
  beamLengthM = 3,
  fulcrumM = 1,
  loadM = 0.3,
  effortM = 3,
  liftHeightM = 0.3,
  pullerId = DEFAULT_PULLER
} = {}) {
  const loadN = massKg * G;

  const loadArmM = Math.max(0.05, Math.abs(fulcrumM - loadM));
  const effortArmM = Math.max(0.05, Math.abs(effortM - fulcrumM));

  // تعادل گشتاور:  W × d_بار = F × d_نیرو
  const effortIdealN = (loadN * loadArmM) / effortArmM;
  const effortN = effortIdealN / LEVER_EFFICIENCY;
  const frictionN = effortN - effortIdealN;

  const maIdeal = effortArmM / loadArmM;
  const maActual = loadN / effortN;

  // بار به اندازهٔ liftHeightM بالا می‌رود ⇒ دست ما به همان نسبت بازوها پایین می‌آید
  const effortDistanceM = liftHeightM * maIdeal;

  return finish({
    machine: 'LEVER',
    massKg,
    loadN,
    effortIdealN,
    frictionN,
    effortN,
    maIdeal,
    maActual,
    efficiency: maActual / maIdeal,
    loadDistanceM: liftHeightM,
    effortDistanceM,
    loadArmM: round(loadArmM, 2),
    effortArmM: round(effortArmM, 2),
    leverClass: leverClass(fulcrumM, loadM, effortM),
    geom: { beamLengthM, fulcrumM, loadM, effortM, loadArmM, effortArmM, liftHeightM },
    insightFa: maIdeal >= 3
      ? 'بازوی نیرو چند برابر بازوی بار شد؛ با زور کم، بار سنگین بلند می‌شود (اما دستمان مسیر بیشتری پایین می‌رود).'
      : maIdeal >= 1
        ? 'اهرم کمی به ما کمک می‌کند؛ تکیه‌گاه را به بار نزدیک‌تر کن تا مزیت مکانیکی بیشتر شود.'
        : 'بازوی نیرو از بازوی بار کوتاه‌تر است؛ این اهرم نیرو را زیاد نمی‌کند، فقط بار را تندتر و بیشتر جابه‌جا می‌کند.'
  }, pullerId);
}

// ————————————————————————————————————————————————————————
// ۴) قرقره
// ————————————————————————————————————————————————————————

function pulley({
  massKg = 60,
  systemId = 'FIXED',
  liftHeightM = 4,
  pullerId = DEFAULT_PULLER
} = {}) {
  const system = PULLEYS[systemId] || PULLEYS.FIXED;
  const loadN = massKg * G;

  const effortIdealN = loadN / system.strands;
  const efficiency = SHEAVE_EFFICIENCY ** system.sheaves;
  const effortN = effortIdealN / efficiency;
  const frictionN = effortN - effortIdealN;

  const maIdeal = system.strands;
  const maActual = loadN / effortN;
  const ropeM = liftHeightM * system.strands;

  return finish({
    machine: 'PULLEY',
    massKg,
    system,
    loadN,
    effortIdealN,
    frictionN,
    effortN,
    maIdeal,
    maActual,
    efficiency: maActual / maIdeal,
    loadDistanceM: liftHeightM,
    effortDistanceM: ropeM,
    ropeM: round(ropeM, 1),
    strands: system.strands,
    changesDirection: system.changesDirection,
    savedPercent: clamp(Math.round(((loadN - effortN) / loadN) * 100), 0, 100),
    geom: { liftHeightM, strands: system.strands, sheaves: system.sheaves, movable: system.movable },
    insightFa: system.strands === 1
      ? (system.changesDirection
          ? 'قرقرهٔ ثابت فقط جهت نیرو را عوض کرد؛ عدد نیروسنج همان وزن بار ماند.'
          : 'بدون قرقره، تمام وزن بار روی دست ماست و باید رو به بالا زور بزنیم.')
      : `وزن بار بین ${system.strands} رشته طناب تقسیم شد؛ نیرو حدود یک‌${system.strands === 2 ? 'دوم' : system.strands === 3 ? 'سوم' : 'چهارم'} شد ولی باید ${system.strands} برابر طناب بکشیم.`
  }, pullerId);
}

// ————————————————————————————————————————————————————————
// ۵) چرخ و محور (چرخ‌چاه / وینچ)
// ————————————————————————————————————————————————————————

function wheelAxle({
  massKg = 40,
  wheelRadiusM = 0.5,
  axleRadiusM = 0.1,
  liftHeightM = 3,
  pullerId = DEFAULT_PULLER
} = {}) {
  const loadN = massKg * G;
  const R = Math.max(axleRadiusM * 1.05, wheelRadiusM);
  const r = Math.max(0.02, axleRadiusM);

  const effortIdealN = (loadN * r) / R;
  const effortN = effortIdealN / WHEEL_AXLE_EFFICIENCY;
  const frictionN = effortN - effortIdealN;

  const maIdeal = R / r;
  const maActual = loadN / effortN;
  const turns = liftHeightM / (2 * Math.PI * r);
  const handleTravelM = turns * 2 * Math.PI * R;

  return finish({
    machine: 'WHEEL_AXLE',
    massKg,
    loadN,
    effortIdealN,
    frictionN,
    effortN,
    maIdeal,
    maActual,
    efficiency: maActual / maIdeal,
    loadDistanceM: liftHeightM,
    effortDistanceM: handleTravelM,
    wheelRadiusM: R,
    axleRadiusM: r,
    turns: round(turns, 1),
    geom: { wheelRadiusM: R, axleRadiusM: r, liftHeightM, turns },
    insightFa: 'چرخ و محور یک اهرمِ چرخان است: شعاع چرخ نقشِ بازوی نیرو و شعاع محور نقشِ بازوی بار را دارد.'
  }, pullerId);
}

// ————————————————————————————————————————————————————————
// ۶) گوه (تبر، اسکنه، چاقو)
// ————————————————————————————————————————————————————————

function wedge({
  resistanceN = 900,
  lengthM = 0.24,
  thicknessM = 0.06,
  pullerId = DEFAULT_PULLER
} = {}) {
  const L = Math.max(thicknessM * 1.05, lengthM);
  const t = Math.max(0.005, thicknessM);

  const effortIdealN = (resistanceN * t) / L;
  const effortN = effortIdealN / WEDGE_EFFICIENCY;
  const frictionN = effortN - effortIdealN;

  const maIdeal = L / t;
  const maActual = resistanceN / effortN;

  return finish({
    machine: 'WEDGE',
    loadN: resistanceN,
    effortIdealN,
    frictionN,
    effortN,
    maIdeal,
    maActual,
    efficiency: maActual / maIdeal,
    loadDistanceM: t,       // چوب به اندازهٔ ضخامت گوه از هم باز می‌شود
    effortDistanceM: L,     // ولی گوه باید تمام طولش فرو برود
    lengthM: L,
    thicknessM: t,
    geom: { lengthM: L, thicknessM: t },
    insightFa: 'گوه در واقع یک سطح شیب‌دارِ متحرک است: هرچه باریک‌تر و بلندتر باشد، با ضربهٔ کم‌تری چوب را می‌شکافد.'
  }, pullerId);
}

// ————————————————————————————————————————————————————————
// ۷) پیچ (جک پیچی)
// ————————————————————————————————————————————————————————

function screw({
  massKg = 300,
  pitchM = 0.01,
  handleRadiusM = 0.35,
  liftHeightM = 0.2,
  pullerId = DEFAULT_PULLER
} = {}) {
  const loadN = massKg * G;
  const p = Math.max(0.002, pitchM);
  const R = Math.max(0.05, handleRadiusM);

  const circumference = 2 * Math.PI * R;
  const effortIdealN = (loadN * p) / circumference;
  const effortN = effortIdealN / SCREW_EFFICIENCY;
  const frictionN = effortN - effortIdealN;

  const maIdeal = circumference / p;
  const maActual = loadN / effortN;
  const turns = liftHeightM / p;

  return finish({
    machine: 'SCREW',
    massKg,
    loadN,
    effortIdealN,
    frictionN,
    effortN,
    maIdeal,
    maActual,
    efficiency: maActual / maIdeal,
    loadDistanceM: liftHeightM,
    effortDistanceM: turns * circumference,
    pitchM: p,
    handleRadiusM: R,
    turns: round(turns, 0),
    geom: { pitchM: p, handleRadiusM: R, liftHeightM, turns },
    insightFa: 'پیچ یک سطح شیب‌دار است که دور یک استوانه پیچیده شده؛ گام کوچک‌تر یعنی شیب ملایم‌تر و نیروی کمتر، اما تعداد چرخش بیشتر.'
  }, pullerId);
}

// ————————————————————————————————————————————————————————
// ۸) چرخ‌دنده‌ها (دادوستد گشتاور و سرعت)
// ————————————————————————————————————————————————————————

function gears({
  driverTeeth = 12,
  drivenTeeth = 36,
  inputTorqueNm = 10,
  inputRpm = 60
} = {}) {
  const z1 = Math.max(6, Math.round(driverTeeth));
  const z2 = Math.max(6, Math.round(drivenTeeth));
  const ratio = z2 / z1;

  const outputTorqueNm = inputTorqueNm * ratio * GEAR_EFFICIENCY;
  const outputRpm = inputRpm / ratio;

  return roundResult({
    machine: 'GEARS',
    driverTeeth: z1,
    drivenTeeth: z2,
    ratio: round(ratio, 2),
    inputTorqueNm,
    outputTorqueNm: round(outputTorqueNm, 1),
    inputRpm,
    outputRpm: round(outputRpm, 1),
    efficiency: GEAR_EFFICIENCY,
    reversesDirection: true,
    feasible: true,
    geom: { z1, z2, ratio },
    insightFa: ratio > 1
      ? 'چرخ‌دندهٔ بزرگ‌تر کندتر می‌چرخد ولی گشتاور (قدرتِ چرخاندن) بیشتری دارد — درست مثل دنده‌سنگین دوچرخه در سربالایی.'
      : ratio < 1
        ? 'چرخ‌دندهٔ کوچک‌تر تندتر می‌چرخد ولی گشتاورش کمتر است — مثل دنده‌سبک دوچرخه در سرازیری.'
        : 'با تعداد دندانهٔ برابر، سرعت و گشتاور تغییری نمی‌کند؛ فقط جهت چرخش برعکس می‌شود.'
  });
}

// ————————————————————————————————————————————————————————
// حل‌کنندهٔ یکپارچه
// ————————————————————————————————————————————————————————

const SOLVERS = {
  FRICTION: friction,
  INCLINED_PLANE: inclinedPlane,
  LEVER: lever,
  PULLEY: pulley,
  WHEEL_AXLE: wheelAxle,
  WEDGE: wedge,
  SCREW: screw,
  GEARS: gears
};

/** محاسبهٔ نتیجهٔ هر ماشین از روی شناسه و پارامترها */
function solve(machineId, params = {}) {
  const fn = SOLVERS[machineId];
  if (!fn) throw new Error(`ماشین ناشناخته: ${machineId}`);
  return fn(params);
}


/* ══════ src/physics/capstone.js ══════ */
// مأموریت پایانی: زنجیرهٔ چند مرحله‌ای رساندن محمولهٔ دارو به درمانگاه




/** هزینهٔ مصالح هر انتخاب (واحد: قطعه) */
const MATERIAL_COST = {
  rollers: 2,
  rampPerTwoMeters: 1,
  bridgeBeam: 1,
  pulley: { NONE: 0, FIXED: 1, MOVABLE: 2, COMPOUND_2: 3, COMPOUND_3: 4, COMPOUND_4: 5 }
};

const MATERIAL_BUDGET = 12;

/** هزینهٔ مصالح یک طرح */
function materialCostOf({ useRollers, rampLengthM, bridgeBeams, pulleySystemId }) {
  return (
    (useRollers ? MATERIAL_COST.rollers : 0) +
    Math.ceil(rampLengthM / 2) * MATERIAL_COST.rampPerTwoMeters +
    bridgeBeams * MATERIAL_COST.bridgeBeam +
    (MATERIAL_COST.pulley[pulleySystemId] ?? 2)
  );
}

function capstone({
  massKg = 60,
  surfaceId = 'WOOD_PLANKS',
  useRollers = true,
  dragDistanceM = 6,
  cliffHeightM = 2,
  rampLengthM = 6,
  bridgeBeams = 2,
  pulleySystemId = 'MOVABLE',
  balconyHeightM = 4,
  pullerId = DEFAULT_PULLER,
  budget = MATERIAL_BUDGET
} = {}) {
  const puller = PULLERS[pullerId] || PULLERS[DEFAULT_PULLER];

  const stageA = friction({ massKg, surfaceId, useRollers, distanceM: dragDistanceM, pullerId });
  const stageB = inclinedPlane({ massKg, heightM: cliffHeightM, lengthM: rampLengthM, surfaceId, useRollers, pullerId });
  const stageC = pulley({ massKg, systemId: pulleySystemId, liftHeightM: balconyHeightM, pullerId });

  const bridgeStable = bridgeBeams >= 2;

  const materialsUsed = materialCostOf({ useRollers, rampLengthM, bridgeBeams, pulleySystemId });

  const withinBudget = materialsUsed <= budget;
  const stages = [
    { id: 'A', title: 'کشیدن روی دشت سنگی', result: stageA, ok: stageA.feasible },
    { id: 'B', title: 'بالا بردن از دیوارهٔ سنگی', result: stageB, ok: stageB.feasible },
    { id: 'C', title: 'بالا کشیدن تا ایوان درمانگاه', result: stageC, ok: stageC.feasible }
  ];

  const blockingStage = stages.find((s) => !s.ok) || null;
  const maxForceN = Math.max(stageA.effortN, stageB.effortN, stageC.effortN);
  const totalWorkJ = round(stageA.workInJ + stageB.workInJ + stageC.workInJ, 0);
  const success = !blockingStage && bridgeStable && withinBudget;

  const badges = [];
  if (success) {
    badges.push({ id: 'RESCUE', title: 'قهرمان نجات کوهستان', icon: '🏅', desc: 'داروها سالم و به‌موقع به درمانگاه رسیدند.' });
    if (maxForceN <= puller.limitN * 0.6) {
      badges.push({ id: 'LOW_FORCE', title: 'مهندسِ نیروی کم', icon: '⚡', desc: 'در هیچ مرحله‌ای بیش از ۶۰٪ توان کشش لازم نشد.' });
    }
    if (materialsUsed <= budget * 0.6) {
      badges.push({ id: 'THRIFTY', title: 'مصرف هوشمند مصالح', icon: '🪵', desc: 'با کمترین قطعات، بهترین نتیجه گرفته شد.' });
    }
    if (bridgeBeams >= 3) {
      badges.push({ id: 'SAFE', title: 'ایمن و استوار', icon: '🛡️', desc: 'پل میانی با تیرک اضافی، کاملاً پایدار ساخته شد.' });
    }
    if (useRollers && stageC.strands >= 3) {
      badges.push({ id: 'CREATIVE', title: 'طراحی خلاق', icon: '🌟', desc: 'ترکیب هوشمندانهٔ غلتک، سطح شیب‌دار و قرقرهٔ مرکب.' });
    }
  }

  return {
    machine: 'CAPSTONE',
    massKg,
    stages,
    stageA,
    stageB,
    stageC,
    bridgeBeams,
    bridgeStable,
    materialsUsed,
    budget,
    withinBudget,
    maxForceN: round(maxForceN),
    totalWorkJ,
    puller,

/** پارامترهای وابسته را کامل می‌کند (مثلاً محل دستِ اهرم همیشه سرِ تیرک است) */
function resolveParams(machineId, params) {
  const p = { ...params };
  if (machineId === 'LEVER') {
    p.effortM = p.beamLengthM;
    p.fulcrumM = Math.min(p.fulcrumM, p.beamLengthM - 0.2);
    p.loadM = Math.min(p.loadM, p.fulcrumM - 0.1);
  }
  if (machineId === 'INCLINED_PLANE' && p.lengthM < p.heightM * 1.05) {
    p.lengthM = Math.round(p.heightM * 1.05 * 4) / 4;
  }
  if (machineId === 'WHEEL_AXLE' && p.axleRadiusM >= p.wheelRadiusM) {
    p.axleRadiusM = Math.max(0.03, p.wheelRadiusM * 0.5);
  }
  if (machineId === 'WEDGE' && p.thicknessM >= p.lengthM) {
    p.thicknessM = Math.max(0.01, p.lengthM * 0.5);
  }
  return p;
}

/** برچسب کوتاه پیکربندی برای دفترچهٔ ثبت آزمایش */
function describeSetup(machineId, params, result) {
  switch (machineId) {
    case 'FRICTION':
      return `${fa(params.massKg)} کیلوگرم روی ${result.surface.name}${params.useRollers ? ' با غلتک' : ''}`;
    case 'INCLINED_PLANE':
      return `${fa(params.massKg)} کیلوگرم، ارتفاع ${fa(params.heightM)} م، رمپ ${fa(num(result.lengthM, 1))} م${params.useRollers ? ' با غلتک' : ''}`;
    case 'LEVER':
      return `${fa(params.massKg)} کیلوگرم، بازوی بار ${fa(result.loadArmM)} م، بازوی نیرو ${fa(result.effortArmM)} م`;
    case 'PULLEY':
      return `${fa(params.massKg)} کیلوگرم با ${result.system.name} (${fa(result.strands)} رشته)`;
    case 'WHEEL_AXLE':
      return `شعاع چرخ ${fa(num(params.wheelRadiusM, 2))} م و محور ${fa(num(params.axleRadiusM, 2))} م`;
    case 'WEDGE':
      return `گوهٔ ${fa(num(params.lengthM * 100, 0))}×${fa(num(params.thicknessM * 100, 0))} سانتی‌متر`;
    case 'SCREW':
      return `گام ${fa(num(params.pitchM * 1000, 0))} میلی‌متر، دسته ${fa(num(params.handleRadiusM * 100, 0))} سانتی‌متر`;
    case 'GEARS':
      return `${fa(params.driverTeeth)} به ${fa(params.drivenTeeth)} دندانه`;
    case 'CAPSTONE':
      return `رمپ ${fa(params.rampLengthM)} م، ${fa(params.bridgeBeams)} تیرک، ${PULLEYS[params.pulleySystemId].shortName}`;
    default:
      return '—';
  }
}

/** ساخت صفحهٔ HTML قابل چاپ از گزارش آزمایش‌ها */
function notebookHTML({ studentName = 'مخترع کوهستان', rows = [], discoveries = [], badges = [] }) {
  const date = new Date().toLocaleDateString('fa-IR');
  const rowsHTML = rows.length
    ? rows.map((r, i) => `
      <tr>
        <td>${fa(i + 1)}</td>
        <td>${escapeHtml(r.machineName)}</td>
        <td class="right">${escapeHtml(r.setup)}</td>
        <td><b>${fa(num(r.effortN, 0))}</b></td>
        <td>${fa(num(r.effortDistanceM, 1))}</td>
        <td>${fa(num(r.workInJ, 0))}</td>
        <td>${r.success ? '✅' : '⚠️'}</td>
      </tr>`).join('')
    : '<tr><td colspan="7">هنوز آزمایشی ثبت نشده است.</td></tr>';

  return `<!DOCTYPE html>
<html dir="rtl" lang="fa"><head><meta charset="UTF-8">
<title>دفترچهٔ مخترع — کارگاه ماشین‌های ساده</title>

/* ══════ src/render/draw.js ══════ */
// ابزارهای پایهٔ نقاشی روی بوم — همهٔ صحنه‌ها از این‌ها استفاده می‌کنند


/** پالت رنگ صحنه (در تم تیره کمی کدرتر می‌شود) */
const PALETTE = {
  light: {
    skyTop: '#8fd0f2', skyMid: '#bfe6fa', skyLow: '#e6f5fd',
    sun: '#fff3c4', sunGlow: 'rgba(255,236,150,.55)',
    farRock: '#93a9c4', midRock: '#6f88ab', nearRock: '#55708f',
    snow: '#f4f9ff', grassTop: '#7cbf6a', grassLow: '#5aa356',
    soil: '#8a6a4a', soilDark: '#6f5238',
    wood: '#c08b4f', woodDark: '#8d6134', woodLight: '#dcae74',
    rope: '#b98a55', ropeDark: '#8a6136',
    metal: '#8fa2b5', metalDark: '#5d7186', metalLight: '#c3d1de',
    crate: '#d09a5c', crateDark: '#9a6c37',
    stone: '#8d8378', stoneDark: '#6a6157',
    ink: '#1d3247', inkSoft: '#4a627a', paper: '#ffffff',
    ok: '#12a06a', bad: '#e0435a', effort: '#ef7d17', load: '#2b6fd6',
    friction: '#b5477f', normal: '#0f9b8e'
  },
  dark: {
    skyTop: '#16324a', skyMid: '#1d4260', skyLow: '#255074',
    sun: '#f6e6a8', sunGlow: 'rgba(246,230,168,.20)',
    farRock: '#2c4258', midRock: '#243849', nearRock: '#1c2c3b',
    snow: '#cfe3f2', grassTop: '#2f5f43', grassLow: '#244a35',
    soil: '#3f3226', soilDark: '#2e251c',
    wood: '#9b6f3f', woodDark: '#6d4b28', woodLight: '#b98a56',
    rope: '#9a7549', ropeDark: '#6f5334',
    metal: '#647689', metalDark: '#3d4c5b', metalLight: '#8ea0b1',
    crate: '#a87a45', crateDark: '#77542c',
    stone: '#5f5a53', stoneDark: '#46423c',
    ink: '#e8f1f8', inkSoft: '#a8becf', paper: '#132433',
    ok: '#3ed99b', bad: '#ff7b8a', effort: '#fbb03b', load: '#6fa8ff',
    friction: '#e08ab8', normal: '#4fd0c4'
  }
};

/** پالت فعال — تا برچسب‌ها در تم تیره هم خوانا بمانند */
let ACTIVE = PALETTE.light;
function setPalette(p) { ACTIVE = p; }

/** مستطیل گردگوشه */
function rr(ctx, x, y, w, h, r = 6) {
  const rad = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + rad, y);
  ctx.arcTo(x + w, y, x + w, y + h, rad);
  ctx.arcTo(x + w, y + h, x, y + h, rad);
  ctx.arcTo(x, y + h, x, y, rad);
  ctx.arcTo(x, y, x + w, y, rad);
  ctx.closePath();
}

/** گرادیان خطی سریع */
function grad(ctx, x0, y0, x1, y1, stops) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  for (const [pos, color] of stops) g.addColorStop(pos, color);
  return g;
}

/** متن با پس‌زمینهٔ کوچک (برچسب روی صحنه) */
function label(ctx, x, y, text, opts = {}) {
  const {
    size = 12, weight = 700, color = ACTIVE.ink, bg = `${ACTIVE.paper}ee`,
    border = ACTIVE === PALETTE.dark ? 'rgba(255,255,255,.16)' : 'rgba(0,0,0,.10)',
    align = 'center', pad = 5, radius = 7
  } = opts;
  ctx.save();
  ctx.font = `${weight} ${size}px Vazirmatn, Tahoma, sans-serif`;
  ctx.direction = 'rtl';
  ctx.textBaseline = 'middle';
  const w = ctx.measureText(text).width + pad * 2;
  const h = size + pad * 1.7;
  let bx = x - w / 2;
  if (align === 'start') bx = x - w;
  if (align === 'end') bx = x;
  if (bg) {
    ctx.fillStyle = bg;
    rr(ctx, bx, y - h / 2, w, h, radius);
    ctx.fill();
    if (border) { ctx.strokeStyle = border; ctx.lineWidth = 1; ctx.stroke(); }
  }
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.fillText(text, bx + w / 2, y + 0.5);
  ctx.restore();
}

/** پیکان نیرو با برچسب */
function arrow(ctx, x1, y1, x2, y2, opts = {}) {
  const { color = '#ef7d17', width = 3.5, head = 10, text = null, dashed = false, textSize = 11, labelAt = 'middle' } = opts;
  const ang = Math.atan2(y2 - y1, x2 - x1);
  const len = Math.hypot(x2 - x1, y2 - y1);
  if (len < 2) return;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  if (dashed) ctx.setLineDash([6, 5]);
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2 - Math.cos(ang) * head * 0.8, y2 - Math.sin(ang) * head * 0.8);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - Math.cos(ang - 0.4) * head, y2 - Math.sin(ang - 0.4) * head);
  ctx.lineTo(x2 - Math.cos(ang + 0.4) * head, y2 - Math.sin(ang + 0.4) * head);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  if (text) {
    const mx = labelAt === 'tip' ? x2 + Math.cos(ang) * 20 : (x1 + x2) / 2 - Math.sin(ang) * 13;
    const my = labelAt === 'tip' ? y2 + Math.sin(ang) * 14 : (y1 + y2) / 2 + Math.cos(ang) * 13;
    label(ctx, mx, my, text, { size: textSize, color });
  }
}

/** خط اندازه‌گیری با دو سرِ کوتاه و برچسب وسط */
function dim(ctx, x1, y1, x2, y2, text, opts = {}) {
  const { color = '#4a627a', offset = 0, size = 11 } = opts;
  const ang = Math.atan2(y2 - y1, x2 - x1);
  const ox = -Math.sin(ang) * offset;
  const oy = Math.cos(ang) * offset;
  const ax = x1 + ox, ay = y1 + oy, bx = x2 + ox, by = y2 + oy;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.4;
  ctx.setLineDash([4, 3]);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(ax, ay);
  ctx.moveTo(x2, y2); ctx.lineTo(bx, by);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
  for (const [px, py, dir] of [[ax, ay, 1], [bx, by, -1]]) {
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(px + Math.cos(ang + 0.35) * 8 * dir, py + Math.sin(ang + 0.35) * 8 * dir);
    ctx.lineTo(px + Math.cos(ang - 0.35) * 8 * dir, py + Math.sin(ang - 0.35) * 8 * dir);
    ctx.closePath(); ctx.fillStyle = color; ctx.fill();
  }
  ctx.restore();
  if (text) label(ctx, (ax + bx) / 2, (ay + by) / 2, text, { size, color });
}

/** کمان زاویه با برچسب درجه */
function angleArc(ctx, x, y, radius, a0, a1, text, color = '#4a627a') {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.arc(x, y, radius, a0, a1, a1 < a0);
  ctx.stroke();
  ctx.restore();
  if (text) {
    const mid = (a0 + a1) / 2;
    label(ctx, x + Math.cos(mid) * (radius + 15), y + Math.sin(mid) * (radius + 15), text, { size: 11, color });
  }
}

/** تختهٔ چوبی با رگه (زاویه بر حسب رادیان، حول نقطهٔ شروع) */
function plank(ctx, x, y, w, h, angle, P, opts = {}) {
  const { radius = 3 } = opts;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.fillStyle = grad(ctx, 0, 0, 0, h, [[0, P.woodLight], [0.45, P.wood], [1, P.woodDark]]);
  rr(ctx, 0, 0, w, h, radius);
  ctx.fill();
  ctx.strokeStyle = P.woodDark;
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,.10)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(4, (h / 3) * i);
    ctx.lineTo(w - 4, (h / 3) * i + (i % 2 ? 1 : -1));
    ctx.stroke();
  }
  ctx.restore();
}

/** صندوق بار با علامت هلال‌احمر و برچسب جرم */
function crate(ctx, x, y, size, angle, P, opts = {}) {
  const { massKg = null, shadow = true } = opts;
  const w = size, h = size * 0.82;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  if (shadow) {
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,.16)';
    ctx.beginPath();
    ctx.ellipse(0, h / 2 + 4, w / 2, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = grad(ctx, -w / 2, -h / 2, w / 2, h / 2, [[0, P.crate], [1, P.crateDark]]);
  rr(ctx, -w / 2, -h / 2, w, h, 4);
  ctx.fill();
  ctx.strokeStyle = P.crateDark; ctx.lineWidth = 2; ctx.stroke();
  // نوارهای ضربدری
  ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(-w / 2 + 3, -h / 2 + 3); ctx.lineTo(w / 2 - 3, h / 2 - 3);
  ctx.moveTo(w / 2 - 3, -h / 2 + 3); ctx.lineTo(-w / 2 + 3, h / 2 - 3);
  ctx.stroke();
  // هلال احمر
  ctx.fillStyle = '#e0435a';
  ctx.beginPath();
  ctx.arc(0, 0, size * 0.17, 0.5, Math.PI * 2 - 0.5);
  ctx.arc(size * 0.055, 0, size * 0.135, Math.PI * 2 - 0.75, 0.75, true);
  ctx.closePath();
  ctx.fill();
  if (massKg !== null) {
    label(ctx, 0, h / 2 - 8, `${fa(massKg)} کیلوگرم`, { size: 10, color: '#5b3a12', bg: 'rgba(255,255,255,.88)' });
  }
  ctx.restore();
}

/** طناب با افتادگی طبیعی بین دو نقطه */
function rope(ctx, pts, P, opts = {}) {
  const { width = 3, sag = 0, color = null } = opts;
  if (pts.length < 2) return;
  ctx.save();
  ctx.strokeStyle = color || P.rope;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1];
    const [x1, y1] = pts[i];
    if (sag > 0) {
      ctx.quadraticCurveTo((x0 + x1) / 2, (y0 + y1) / 2 + sag, x1, y1);
    } else {
      ctx.lineTo(x1, y1);
    }
  }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.28)';
  ctx.lineWidth = Math.max(1, width * 0.32);
  ctx.stroke();
  ctx.restore();
}

/** چرخ قرقره */
function sheave(ctx, x, y, r, angle, P, opts = {}) {
  const { mount = 'none' } = opts; // 'top' | 'hook' | 'none'
  ctx.save();
  if (mount === 'top') {
    ctx.strokeStyle = P.metalDark; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(x, y - r - 16); ctx.lineTo(x, y); ctx.stroke();
    ctx.fillStyle = P.metalDark;
    rr(ctx, x - 5, y - r - 20, 10, 8, 2); ctx.fill();
  }
  ctx.translate(x, y);
  ctx.fillStyle = grad(ctx, -r, -r, r, r, [[0, P.metalLight], [1, P.metalDark]]);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = P.metalDark; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = P.woodDark;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.72, 0, Math.PI * 2); ctx.fill();
  ctx.rotate(angle);
  ctx.strokeStyle = 'rgba(255,255,255,.55)';
  ctx.lineWidth = 2.4;
  for (let i = 0; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(-r * 0.6, 0); ctx.lineTo(r * 0.6, 0);
    ctx.stroke();
    ctx.rotate(Math.PI / 4);
  }
  ctx.rotate(-angle - Math.PI);
  ctx.fillStyle = P.metalLight;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.2, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = P.metalDark; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.restore();
  if (mount === 'hook') {
    ctx.save();
    ctx.strokeStyle = P.metalDark; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x, y + r); ctx.lineTo(x, y + r + 12); ctx.stroke();
    ctx.restore();
  }
}

/** چرخ‌دنده */
function gear(ctx, x, y, r, teeth, angle, color, P) {
  const inner = r * 0.78;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.beginPath();
  for (let i = 0; i < teeth; i++) {
    const a0 = (i / teeth) * Math.PI * 2;
    const step = (Math.PI * 2) / teeth / 4;
    ctx.lineTo(Math.cos(a0) * inner, Math.sin(a0) * inner);
    ctx.lineTo(Math.cos(a0 + step) * r, Math.sin(a0 + step) * r);
    ctx.lineTo(Math.cos(a0 + step * 2) * r, Math.sin(a0 + step * 2) * r);
    ctx.lineTo(Math.cos(a0 + step * 3) * inner, Math.sin(a0 + step * 3) * inner);
  }
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.lineWidth = 1.6; ctx.stroke();
  ctx.fillStyle = P.paper;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.24, 0, Math.PI * 2); ctx.fill();
  ctx.stroke();
  // پره‌ها برای دیده شدن چرخش
  ctx.strokeStyle = 'rgba(0,0,0,.22)'; ctx.lineWidth = 3;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos((i / 3) * Math.PI * 2) * inner * 0.85, Math.sin((i / 3) * Math.PI * 2) * inner * 0.85);
    ctx.stroke();
  }
  ctx.restore();
}

/**
 * شخصیت بازی.
 * pose: 'pull' | 'push' | 'crank' | 'hammer' | 'idle' | 'cheer'
 * dir: ۱ رو به راست، ۱- رو به چپ
 * effortLevel: ۰ تا ۱ — هرچه بیشتر، خمیدگی بدن بیشتر
 */
function person(ctx, x, y, height, opts = {}) {
  const {
    P, pose = 'idle', dir = -1, t = 0, effort = 0.4, skin = '#f2c396',
    shirt = '#f07f24', pants = '#31527a', hat = '#1f9d63'
  } = opts;
  const s = height / 100;
  const lean = pose === 'pull' ? -0.18 - effort * 0.22 : pose === 'push' ? 0.12 + effort * 0.16 : 0;
  const bob = pose === 'idle' ? Math.sin(t * 2) * 1.2 : Math.sin(t * 7) * (1.5 + effort * 2);

  ctx.save();
  ctx.translate(x, y + bob * s);
  ctx.scale(dir, 1);

  // سایه
  ctx.fillStyle = 'rgba(0,0,0,.15)';
  ctx.beginPath(); ctx.ellipse(0, 2 * s, 20 * s, 4.5 * s, 0, 0, Math.PI * 2); ctx.fill();

  const stride = pose === 'pull' ? 16 : pose === 'push' ? 13 : 7;
  // پاها
  ctx.strokeStyle = pants; ctx.lineWidth = 7 * s; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, -34 * s); ctx.lineTo(-stride * s, 0);
  ctx.moveTo(0, -34 * s); ctx.lineTo(stride * 0.55 * s, 0);
  ctx.stroke();
  // کفش
  ctx.strokeStyle = '#3b2a1d'; ctx.lineWidth = 5 * s;
  ctx.beginPath();
  ctx.moveTo(-stride * s, 0); ctx.lineTo((-stride - 5) * s, 0);
  ctx.moveTo(stride * 0.55 * s, 0); ctx.lineTo((stride * 0.55 + 5) * s, 0);
  ctx.stroke();

  ctx.rotate(lean);

  // تنه
  ctx.fillStyle = shirt;
  rr(ctx, -8 * s, -70 * s, 16 * s, 38 * s, 6 * s);
  ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.12)';
  rr(ctx, -8 * s, -44 * s, 16 * s, 12 * s, 4 * s);
  ctx.fill();

  // سر
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(0, -80 * s, 11 * s, 0, Math.PI * 2); ctx.fill();
  // کلاه
  ctx.fillStyle = hat;
  ctx.beginPath();
  ctx.arc(0, -82 * s, 11.5 * s, Math.PI, 0);
  ctx.lineTo(14 * s, -82 * s); ctx.lineTo(-12 * s, -82 * s);
  ctx.closePath(); ctx.fill();
  // چشم
  ctx.fillStyle = '#243244';
  ctx.beginPath(); ctx.arc(6 * s, -80 * s, 1.7 * s, 0, Math.PI * 2); ctx.fill();
  // دهان (تلاش)
  ctx.strokeStyle = '#243244'; ctx.lineWidth = 1.4 * s;
  ctx.beginPath();
  if (effort > 0.7) ctx.arc(5 * s, -75 * s, 2.4 * s, 0, Math.PI);
  else ctx.arc(5 * s, -76 * s, 2.6 * s, 0.15, Math.PI - 0.15);
  ctx.stroke();

  // بازوها
  ctx.strokeStyle = skin; ctx.lineWidth = 6 * s; ctx.lineCap = 'round';
  let hand = [18 * s, -58 * s];
  ctx.beginPath();
  if (pose === 'pull') {
    hand = [24 * s, -52 * s - Math.sin(t * 7) * 2 * s];
    ctx.moveTo(-2 * s, -64 * s); ctx.lineTo(12 * s, -58 * s); ctx.lineTo(hand[0], hand[1]);
  } else if (pose === 'push') {
    hand = [22 * s, -62 * s];
    ctx.moveTo(-2 * s, -64 * s); ctx.lineTo(12 * s, -63 * s); ctx.lineTo(hand[0], hand[1]);
  } else if (pose === 'crank') {
    const a = t * 3;
    hand = [(16 + Math.cos(a) * 8) * s, (-58 + Math.sin(a) * 8) * s];
    ctx.moveTo(-2 * s, -64 * s); ctx.lineTo(10 * s, -60 * s); ctx.lineTo(hand[0], hand[1]);
  } else if (pose === 'hammer') {
    const a = Math.sin(t * 6) * 0.9;
    hand = [(16 + Math.cos(a - 1) * 12) * s, (-62 + Math.sin(a - 1) * 12) * s];
    ctx.moveTo(-2 * s, -64 * s); ctx.lineTo(8 * s, -64 * s); ctx.lineTo(hand[0], hand[1]);
  } else if (pose === 'cheer') {
    hand = [10 * s, -96 * s];
    ctx.moveTo(-2 * s, -64 * s); ctx.lineTo(10 * s, -80 * s); ctx.lineTo(hand[0], hand[1]);
    ctx.moveTo(-2 * s, -64 * s); ctx.lineTo(-12 * s, -80 * s); ctx.lineTo(-12 * s, -96 * s);
  } else {
    ctx.moveTo(-2 * s, -64 * s); ctx.lineTo(10 * s, -50 * s);
  }
  ctx.stroke();
  ctx.restore();

  // مختصات دستِ کاری در فضای صفحه (برای وصل کردن طناب)
  const cos = Math.cos(lean), sin = Math.sin(lean);
  return {
    x: x + dir * (hand[0] * cos - hand[1] * sin),
    y: y + bob * s + (hand[0] * sin + hand[1] * cos)
  };
}

/** ذرات (گرد و خاک، جرقه) */
class Particles {
  constructor() { this.items = []; }
  burst(x, y, count, color, opts = {}) {
    const { speed = 3, life = 0.9, size = 4, gravity = 0.12, spread = Math.PI * 2, dir = 0 } = opts;
    for (let i = 0; i < count; i++) {
      const a = dir + (Math.random() - 0.5) * spread;
      const sp = speed * (0.4 + Math.random() * 0.9);
      this.items.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.6,
        life: life * (0.6 + Math.random() * 0.7), age: 0,
        size: size * (0.6 + Math.random() * 0.8), color, gravity
      });
    }
  }
  update(dt) {
    for (let i = this.items.length - 1; i >= 0; i--) {
      const p = this.items[i];
      p.x += p.vx; p.y += p.vy; p.vy += p.gravity; p.age += dt;
      if (p.age >= p.life) this.items.splice(i, 1);
    }
  }
  draw(ctx) {
    for (const p of this.items) {
      const k = 1 - p.age / p.life;
      ctx.save();
      ctx.globalAlpha = clamp(k, 0, 1);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (0.4 + k * 0.8), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }
  clear() { this.items.length = 0; }
}
