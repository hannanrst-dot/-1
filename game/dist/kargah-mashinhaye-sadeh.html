// پس‌زمینهٔ مشترک همهٔ صحنه‌ها: آسمان، کوه، دشت و درمانگاه



/** مولد عدد شبه‌تصادفی قطعی — تا کوه‌ها در هر بار اجرا یکسان باشند */
function makeRng(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

/** ساخت خط‌الرأس یک رشته‌کوه */
function ridge(seed, points, baseY, amp, x0, x1) {
  const rng = makeRng(seed);
  const pts = [];
  for (let i = 0; i <= points; i++) {
    const x = x0 + ((x1 - x0) * i) / points;
    const peak = Math.sin((i / points) * Math.PI * 1.7 + seed) * 0.5 + 0.5;
    pts.push([x, baseY - (peak * 0.55 + rng() * 0.45) * amp]);
  }
  return pts;
}

function drawRidge(ctx, pts, bottomY, fill, opts = {}) {
  const { snow = null, snowLine = 0 } = opts;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(pts[0][0], bottomY);
  for (const [x, y] of pts) ctx.lineTo(x, y);
  ctx.lineTo(pts[pts.length - 1][0], bottomY);
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();

  if (snow) {
    ctx.save();
    ctx.clip();
    ctx.fillStyle = snow;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], snowLine);
    for (const [x, y] of pts) ctx.lineTo(x, y - 1);
    ctx.lineTo(pts[pts.length - 1][0], snowLine);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function pine(ctx, x, y, h, P) {
  ctx.save();
  ctx.fillStyle = '#4a3524';
  ctx.fillRect(x - h * 0.045, y - h * 0.16, h * 0.09, h * 0.17);
  ctx.fillStyle = P.grassLow;
  for (let i = 0; i < 3; i++) {
    const k = 1 - i * 0.24;
    ctx.beginPath();
    ctx.moveTo(x, y - h * (0.55 + i * 0.22));
    ctx.lineTo(x - h * 0.26 * k, y - h * (0.12 + i * 0.22));
    ctx.lineTo(x + h * 0.26 * k, y - h * (0.12 + i * 0.22));
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function cloud(ctx, x, y, size, alpha = 0.85) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(x, y, size * 0.42, 0, Math.PI * 2);
  ctx.arc(x + size * 0.38, y - size * 0.13, size * 0.32, 0, Math.PI * 2);
  ctx.arc(x - size * 0.36, y + size * 0.04, size * 0.28, 0, Math.PI * 2);
  ctx.arc(x + size * 0.1, y + size * 0.16, size * 0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function bird(ctx, x, y, size, flap) {
  ctx.save();
  ctx.strokeStyle = 'rgba(40,60,80,.65)';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  const w = Math.sin(flap) * size * 0.45;
  ctx.beginPath();
  ctx.moveTo(x - size, y + w);
  ctx.quadraticCurveTo(x - size * 0.4, y - w, x, y);
  ctx.quadraticCurveTo(x + size * 0.4, y - w, x + size, y + w);
  ctx.stroke();
  ctx.restore();
}

/** ساختمان درمانگاه روی صخرهٔ سمت چپ */
function clinic(ctx, x, y, scale, P, opts = {}) {
  const { showLabel = true } = opts;
  const w = 92 * scale, h = 78 * scale;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.12)';
  ctx.beginPath(); ctx.ellipse(x, y + 3, w * 0.6, 6 * scale, 0, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = grad(ctx, x - w / 2, y - h, x + w / 2, y, [[0, '#f5f2ea'], [1, '#ddd7ca']]);
  rr(ctx, x - w / 2, y - h, w, h, 4 * scale);
  ctx.fill();
  ctx.strokeStyle = '#b9b1a2'; ctx.lineWidth = 1.5; ctx.stroke();

  // شیروانی
  ctx.fillStyle = '#a1553a';
  ctx.beginPath();
  ctx.moveTo(x - w / 2 - 9 * scale, y - h);
  ctx.lineTo(x, y - h - 30 * scale);
  ctx.lineTo(x + w / 2 + 9 * scale, y - h);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#7d3f2b'; ctx.stroke();

  // هلال احمر
  ctx.fillStyle = '#e0435a';
  ctx.beginPath();
  ctx.arc(x, y - h * 0.60, 12 * scale, 0.55, Math.PI * 2 - 0.55);
  ctx.arc(x + 4.5 * scale, y - h * 0.60, 9.5 * scale, Math.PI * 2 - 0.8, 0.8, true);
  ctx.closePath();
  ctx.fill();

  // در و پنجره
  ctx.fillStyle = '#7a5a3c';
  rr(ctx, x - 12 * scale, y - h * 0.36, 24 * scale, h * 0.36, 3 * scale); ctx.fill();
  ctx.fillStyle = '#9fd0e8';
  rr(ctx, x - w / 2 + 8 * scale, y - h * 0.34, 15 * scale, 14 * scale, 2 * scale); ctx.fill();
  rr(ctx, x + w / 2 - 23 * scale, y - h * 0.34, 15 * scale, 14 * scale, 2 * scale); ctx.fill();
  ctx.restore();

  if (showLabel) label(ctx, x, y - h - 44 * scale, 'درمانگاه روستا', { size: 11, color: P.ink });
}

/** ایوان/سکوی چوبی */
function balcony(ctx, x, y, w, P) {
  ctx.save();
  ctx.fillStyle = P.woodDark;
  rr(ctx, x - w / 2, y, w, 10, 3); ctx.fill();
  ctx.fillStyle = P.wood;
  rr(ctx, x - w / 2, y - 4, w, 8, 3); ctx.fill();
  ctx.strokeStyle = P.woodDark; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x - w / 2 + 8, y + 10); ctx.lineTo(x - w / 2 + 14, y + 30);
  ctx.moveTo(x + w / 2 - 8, y + 10); ctx.lineTo(x + w / 2 - 14, y + 30);
  ctx.stroke();
  ctx.restore();
}

/**
 * پس‌زمینه: آسمان، خورشید، ابر، کوه‌ها، دشت.
 * groundY نسبت ارتفاع زمین است (۰ تا ۱)
 */
function drawWorld(ctx, w, h, P, time, opts = {}) {
  const { groundY = 0.80, trees = true, birds = true } = opts;
  const gy = h * groundY;

  // آسمان
  ctx.fillStyle = grad(ctx, 0, 0, 0, gy, [[0, P.skyTop], [0.55, P.skyMid], [1, P.skyLow]]);
  ctx.fillRect(0, 0, w, gy + 2);

  // خورشید
  const sx = w * 0.14, sy = h * 0.16;
  ctx.save();
  ctx.fillStyle = P.sunGlow;
  ctx.beginPath(); ctx.arc(sx, sy, 62, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = P.sun;
  ctx.beginPath(); ctx.arc(sx, sy, 30, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // ابرها
  const clouds = [[0.30, 0.13, 62, 10], [0.62, 0.09, 84, 7], [0.86, 0.20, 52, 13]];
  for (const [fx, fy, size, speed] of clouds) {
    let x = (w * fx + time * speed) % (w + size * 2) - size;
    cloud(ctx, x, h * fy, size, 0.9);
  }

  // رشته‌کوه‌های پشت‌سرهم
  const far = ridge(3, 9, gy - h * 0.06, h * 0.44, -20, w + 20);
  drawRidge(ctx, far, gy, P.farRock, { snow: P.snow, snowLine: h * 0.12 });
  const mid = ridge(11, 8, gy - h * 0.02, h * 0.34, -30, w + 30);
  drawRidge(ctx, mid, gy, P.midRock, { snow: P.snow, snowLine: h * 0.2 });
  const near = ridge(23, 7, gy + h * 0.02, h * 0.2, -40, w + 40);
  drawRidge(ctx, near, gy, P.nearRock);

  if (trees) {
    const rng = makeRng(77);
    for (let i = 0; i < 12; i++) {
      const x = rng() * w;
      const th = 24 + rng() * 18;
      pine(ctx, x, gy + 1, th, P);
    }
  }

  if (birds) {
    bird(ctx, (w * 0.68 + time * 14) % (w + 60) - 30, h * 0.22 + Math.sin(time * 0.8) * 8, 9, time * 5);
    bird(ctx, (w * 0.74 + time * 14) % (w + 60) - 30, h * 0.27 + Math.sin(time * 0.8 + 1) * 8, 6, time * 5 + 1);
  }

  // دشت
  ctx.fillStyle = grad(ctx, 0, gy - 12, 0, h, [[0, P.grassTop], [0.22, P.grassLow], [0.3, P.soil], [1, P.soilDark]]);
  ctx.beginPath();
  ctx.moveTo(0, gy);
  for (let x = 0; x <= w; x += 24) ctx.lineTo(x, gy + Math.sin(x * 0.02 + 1.2) * 2.2);
  ctx.lineTo(w, h); ctx.lineTo(0, h);
  ctx.closePath();
  ctx.fill();

  // خط علف
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.20)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, gy);
  for (let x = 0; x <= w; x += 24) ctx.lineTo(x, gy + Math.sin(x * 0.02 + 1.2) * 2.2);
  ctx.stroke();
  ctx.restore();

  return gy;
}


/* ══════ src/render/scenes.js ══════ */
// صحنه‌های تعاملی هر ماشین ساده




const N = (v) => `${num(v, 0)} نیوتون`;

/** ارتفاع امن برای برچسب‌های زیر خط زمین (تا از پایین بوم بیرون نزنند) */
const under = (gy, h, offset = 34) => Math.min(gy + offset, h - 16);

/** نوار سطح مسیر با بافت مخصوص هر جنس */
function surfaceStrip(ctx, x0, x1, y, surface, P, thickness = 12) {
  const w = x1 - x0;
  ctx.save();
  ctx.fillStyle = surface.id === 'ICE'
    ? grad(ctx, 0, y - thickness, 0, y + 4, [[0, '#eaf7ff'], [1, '#a8d8ee']])
    : surface.id === 'ROUGH_STONE'
      ? grad(ctx, 0, y - thickness, 0, y + 4, [[0, '#a89e92'], [1, '#6a6157']])
      : grad(ctx, 0, y - thickness, 0, y + 4, [[0, P.woodLight], [1, P.woodDark]]);
  rr(ctx, x0, y - thickness, w, thickness + 4, 3);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.18)';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.strokeStyle = 'rgba(0,0,0,.16)';
  ctx.lineWidth = 1.2;
  if (surface.id === 'ROUGH_STONE') {
    for (let x = x0 + 6; x < x1; x += 13) {
      ctx.beginPath();
      ctx.moveTo(x, y - thickness + 2);
      ctx.lineTo(x + 3, y - thickness + 7);
      ctx.lineTo(x - 2, y);
      ctx.stroke();
    }
  } else if (surface.id === 'WOOD_PLANKS' || surface.id === 'SMOOTH_TRACK') {
    for (let x = x0 + 28; x < x1; x += 34) {
      ctx.beginPath(); ctx.moveTo(x, y - thickness); ctx.lineTo(x, y + 3); ctx.stroke();
    }
  }
  if (surface.id === 'SMOOTH_TRACK' || surface.id === 'ICE') {
    ctx.strokeStyle = 'rgba(255,255,255,.65)';
    ctx.lineWidth = 2;
    for (let x = x0 + 14; x < x1; x += 46) {
      ctx.beginPath(); ctx.moveTo(x, y - thickness + 3); ctx.lineTo(x + 18, y - thickness + 3); ctx.stroke();
    }
  }
  ctx.restore();
}

/** دیوارهٔ سنگی با لبهٔ ناهموار (به جای بلوک تخت) */
function rockFace(ctx, x0, x1, topY, bottomY, P, seed = 5) {
  let n = seed * 9973;
  const rnd = () => ((n = (n * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
  const steps = 7;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x0, bottomY + 4);
  ctx.lineTo(x0, topY + 14);
  for (let i = 0; i <= steps; i++) {
    const x = x0 + ((x1 - x0) * i) / steps;
    ctx.lineTo(x, topY + (i === steps ? 0 : rnd() * 16 - 6));
  }
  ctx.lineTo(x1, bottomY + 4);
  ctx.closePath();
  ctx.fillStyle = grad(ctx, x0, topY, x1, bottomY, [[0, P.nearRock], [1, P.midRock]]);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.20)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  // درزهای سنگ
  ctx.save();
  ctx.clip();
  ctx.strokeStyle = 'rgba(0,0,0,.13)';
  ctx.lineWidth = 1.6;
  for (let i = 0; i < 9; i++) {
    const y = topY + rnd() * (bottomY - topY);
    const x = x0 + rnd() * (x1 - x0);
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + (rnd() - 0.5) * 70, y + rnd() * 26);
    ctx.stroke();
  }
  ctx.restore();
  ctx.restore();
}

/** غلتک‌های چوبی زیر بار */
function rollers(ctx, cx, y, width, spin, P) {
  const r = 9;
  const count = Math.max(3, Math.round(width / 26));
  for (let i = 0; i < count; i++) {
    const x = cx - width / 2 + (width / (count - 1)) * i;
    ctx.save();
    ctx.translate(x, y - r);
    ctx.rotate(spin);
    ctx.fillStyle = grad(ctx, -r, -r, r, r, [[0, P.woodLight], [1, P.woodDark]]);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = P.woodDark; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-r * 0.7, 0); ctx.lineTo(r * 0.7, 0); ctx.stroke();
    ctx.restore();
  }
}

/**
 * بردارهای نیرو روی بار.
 * angle = راستای حرکت (رادیان)؛ نیروی محرک در همین راستا و اصطکاک خلاف آن است.
 */
function forceVectors(ctx, cx, cy, size, state, P, opts = {}) {
  const { angle = 0, showNormal = true } = opts;
  const forces = [state.loadN, state.effortN, state.frictionN].filter((f) => f > 0);
  const maxF = Math.max(...forces, 1);
  // ریشهٔ دوم تا بردارهای کوچک هم دیده شوند ولی ترتیب بزرگی حفظ شود
  const len = (f) => clamp(Math.sqrt(clamp(f, 0, maxF) / maxF) * 84, 30, 92);
  const A = (dx, dy, f, color, text, extra = {}) =>
    arrow(ctx, cx, cy, cx + dx * len(f), cy + dy * len(f),
      { color, width: 3.2, text, textSize: 10, labelAt: 'tip', ...extra });

  A(0, 1, state.loadN, P.load, `وزن ${N(state.loadN)}`);
  if (showNormal && state.machine !== 'PULLEY') {
    // عمود بر راستای حرکت و رو به بالا
    A(-Math.sin(angle), Math.cos(angle), state.loadN * Math.abs(Math.cos(angle)), P.normal, 'نیروی تکیه‌گاه', { dashed: true, width: 2.4 });
  }
  if (state.frictionN > 0.5) {
    A(-Math.cos(angle), -Math.sin(angle), state.frictionN, P.friction, `اصطکاک ${N(state.frictionN)}`, { width: 2.6 });
  }
  A(Math.cos(angle), Math.sin(angle), state.effortN, P.effort, `نیروی تو ${N(state.effortN)}`, { width: 3.6 });
}

// ═══════════════ ۱) اصطکاک، چرخ و غلتک ═══════════════
function sceneFriction(ctx, env) {
  const { w, h, gy, P, t, state, showVectors, particles, time } = env;
  const x0 = w * 0.74, x1 = w * 0.22;
  const size = clamp(40 + state.massKg * 0.32, 44, 78);
  const cx = lerp(x0, x1, t);
  const lift = state.useRollers ? 18 : 0;
  const cy = gy - size * 0.41 - lift;

  surfaceStrip(ctx, w * 0.12, w * 0.86, gy, state.surface, P);

  if (state.useRollers) {
    rollers(ctx, cx, gy, size * 1.1, -t * 26, P);
  }
  crate(ctx, cx, cy, size, 0, P, { massKg: state.massKg });

  const px = cx - size * 0.5 - 76;
  const hand = person(ctx, px, gy, 92, {
    P, pose: 'pull', dir: 1, t: time * 3,
    effort: clamp(state.effortN / state.humanLimitN, 0, 1)
  });
  rope(ctx, [[hand.x, hand.y], [cx - size * 0.5, cy + size * 0.1]], P, { width: 3.4, sag: 3 });

  if (t > 0 && t < 1 && particles && Math.random() < 0.4) {
    particles.burst(cx + size * 0.4, gy - 2, 1, state.useRollers ? 'rgba(200,180,150,.5)' : 'rgba(190,170,140,.75)',
      { speed: 1.4, life: 0.6, size: 3, gravity: 0.03, dir: 0.5, spread: 1.6 });
  }

  if (h - gy > 82) {
    dim(ctx, x0, gy + 24, x1, gy + 24, `مسافت ${fa(state.geom.distanceM)} متر`, { color: P.inkSoft });
  }
  label(ctx, w * 0.5, under(gy, h, 50),
    `${state.surface.icon} ${state.surface.fullName} — ضریب اصطکاک ${fa(state.surface.mu)}`,
    { size: 11, color: P.ink });

  if (showVectors) forceVectors(ctx, cx, cy, size, state, P, { angle: Math.PI });
  return [];
}

// ═══════════════ ۲) سطح شیب‌دار ═══════════════
function sceneIncline(ctx, env) {
  const { w, h, gy, P, t, state, showVectors, particles, time } = env;
  const { heightM, lengthM, angleDeg } = state.geom;

  const mscale = Math.min((w * 0.46) / lengthM, (h * 0.40) / Math.max(heightM, 0.5), 105);
  const hPx = heightM * mscale;
  const lPx = lengthM * mscale;
  const ang = Math.asin(clamp(hPx / lPx, 0, 1));

  const baseX = Math.min(w * 0.88, w * 0.30 + Math.cos(ang) * lPx);
  const topX = baseX - Math.cos(ang) * lPx;
  const topY = gy - hPx;

  // دیوارهٔ سنگی که رمپ به آن تکیه دارد
  rockFace(ctx, -12, topX + 10, topY, gy, P, 4);
  clinic(ctx, Math.max(64, topX * 0.4), topY - 4, 0.55, P);

  // رمپ (از پایینِ راست به بالای چپ)
  const thick = 13;
  ctx.save();
  ctx.translate(baseX, gy);
  ctx.rotate(ang);
  ctx.fillStyle = state.useRollers
    ? grad(ctx, 0, -thick, 0, 2, [[0, P.woodLight], [1, P.woodDark]])
    : grad(ctx, 0, -thick, 0, 2, [[0, state.surface.color], [1, 'rgba(0,0,0,.35)']]);
  rr(ctx, -lPx, -thick, lPx, thick, 3);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.restore();

  // بار روی رمپ
  const size = clamp(38 + state.massKg * 0.26, 40, 68);
  const bx = lerp(baseX - size * 0.55, topX + size * 0.55, t);
  const by = lerp(gy, topY, t) - thick;

  ctx.save();
  ctx.translate(bx, by);
  ctx.rotate(ang);
  if (state.useRollers) rollers(ctx, 0, 0, size * 1.05, -t * 24, P);
  crate(ctx, 0, -size * 0.42 - (state.useRollers ? 17 : 0), size, 0, P, { massKg: state.massKg, shadow: false });
  ctx.restore();

  // کارگر بالای دیواره
  const hand = person(ctx, topX - 30, topY, clamp(mscale * 1.7, 78, 132), {
    P, pose: 'pull', dir: 1, t: time * 3,
    effort: clamp(state.effortN / state.humanLimitN, 0, 1)
  });
  rope(ctx, [[hand.x, hand.y], [bx - Math.cos(ang) * size * 0.45, by - size * 0.5]], P, { width: 3.2, sag: 2 });

  if (t > 0 && t < 1 && particles && Math.random() < 0.3) {
    particles.burst(bx + 6, by, 1, 'rgba(190,170,140,.7)', { speed: 1.2, life: 0.5, size: 2.6, gravity: 0.04, dir: 0.6, spread: 1.4 });
  }

  // اندازه‌ها
  ctx.save();
  ctx.strokeStyle = 'rgba(70,95,120,.45)'; ctx.lineWidth = 1.2; ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(topX, topY); ctx.lineTo(baseX + 46, topY); ctx.stroke();
  ctx.restore();
  dim(ctx, baseX + 38, gy, baseX + 38, topY, `ارتفاع ${fa(heightM)} متر`, { color: P.load });
  dim(ctx, baseX, gy, topX, topY, `طول رمپ ${fa(state.lengthM)} متر`, { color: P.effort, offset: 32 });
  angleArc(ctx, baseX, gy, 56, Math.PI, Math.PI + ang, `${fa(angleDeg)}°`, P.inkSoft);

  if (showVectors) forceVectors(ctx, bx, by - size * 0.55, size, state, P, { angle: Math.PI + ang });

  return [{
    id: 'rampLength', x: topX + 16, y: topY - 26, r: 15,
    hint: 'بالای رمپ را بکش تا شیب عوض شود',
    toValue: (px) => {
      const run = Math.max(6, baseX - px);
      return Math.hypot(run, hPx) / mscale;
    }
  }];
}

// ═══════════════ ۳) اهرم ═══════════════
function sceneLever(ctx, env) {
  const { w, h, gy, P, t, state, showVectors, time } = env;
  const g = state.geom;
  const scale = Math.min((w * 0.68) / g.beamLengthM, 210);
  const originX = w * 0.86;                 // متر صفرِ تیرک، سمت راست
  const X = (m) => originX - m * scale;

  const fx = X(g.fulcrumM);
  const beamY = gy - 34;

  // سنگ‌های زمینه
  ctx.save();
  ctx.fillStyle = P.stoneDark;
  ctx.beginPath(); ctx.ellipse(w * 0.12, gy - 6, 54, 20, 0, Math.PI, 0); ctx.fill();
  ctx.restore();

  // زاویهٔ چرخش تیرک
  const dxLoad = (g.fulcrumM - g.loadM) * scale;
  const liftPx = g.liftHeightM * scale * 0.55;
  const maxSin = dxLoad > 4 ? clamp(liftPx / dxLoad, 0, 0.6) : 0;
  const theta = -Math.asin(maxSin) * t;

  const pt = (m) => {
    const dx = X(m) - fx;
    return [fx + dx * Math.cos(theta), beamY + dx * Math.sin(theta)];
  };

  const [lx, ly] = pt(g.loadM);
  const [ex, ey] = pt(g.effortM);
  const [ax, ay] = pt(0);
  const [bx, by] = pt(g.beamLengthM);

  // تیرک
  ctx.save();
  ctx.translate(fx, beamY);
  ctx.rotate(theta);
  plank(ctx, X(g.beamLengthM) - fx, -7, g.beamLengthM * scale, 14, 0, P);
  ctx.restore();

  // تکیه‌گاه
  ctx.save();
  ctx.fillStyle = grad(ctx, fx - 26, beamY, fx + 26, gy, [[0, P.stone], [1, P.stoneDark]]);
  ctx.beginPath();
  ctx.moveTo(fx, beamY + 2);
  ctx.lineTo(fx + 27, gy);
  ctx.lineTo(fx - 27, gy);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.restore();
  label(ctx, fx, gy + 18, 'تکیه‌گاه', { size: 11, color: P.ink });

  // تخته‌سنگ روی سرِ بار
  const rSize = clamp(30 + state.massKg * 0.28, 34, 62);
  ctx.save();
  ctx.fillStyle = grad(ctx, lx - rSize, ly - rSize * 2, lx + rSize, ly, [[0, '#a49a8d'], [1, '#6d655a']]);
  ctx.beginPath();
  ctx.ellipse(lx, ly - rSize * 0.75, rSize, rSize * 0.78, theta, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#575047'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.22)';
  ctx.beginPath(); ctx.ellipse(lx - rSize * 0.3, ly - rSize * 1.05, rSize * 0.3, rSize * 0.2, theta, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  label(ctx, lx, ly - rSize * 1.9, `تخته‌سنگ ${fa(state.massKg)} کیلوگرم`, { size: 10, color: P.ink });

  // کارگر روی سرِ نیرو
  const pDir = ex < fx ? -1 : 1;
  person(ctx, ex - pDir * 26, ey + 4, 86, {
    P, pose: 'push', dir: pDir, t: time * 3,
    effort: clamp(state.effortN / state.humanLimitN, 0, 1)
  });

  // بازوها
  dim(ctx, fx, beamY + 46, lx, beamY + 46, `بازوی بار ${fa(state.loadArmM)} م`, { color: P.load });
  dim(ctx, ex, beamY + 68, fx, beamY + 68, `بازوی نیرو ${fa(state.effortArmM)} م`, { color: P.effort });

  if (showVectors) {
    const s = (f) => clamp((f / Math.max(state.loadN, 1)) * 78, 18, 86);
    arrow(ctx, lx, ly - rSize * 1.5, lx, ly - rSize * 1.5 + s(state.loadN), { color: P.load, width: 3.2, text: `وزن ${N(state.loadN)}` });
    arrow(ctx, ex, ey - 12, ex, ey - 12 + s(state.effortN), { color: P.effort, width: 3.4, text: `نیروی تو ${N(state.effortN)}` });
    arrow(ctx, fx, gy - 4, fx, gy - 4 - 34, { color: P.normal, width: 2.4, text: 'تکیه‌گاه', dashed: true, textSize: 10 });
  }

  label(ctx, w * 0.5, 34, state.leverClass.name, { size: 12, color: P.ink, bg: 'rgba(255,255,255,.9)' });

  return [{
    id: 'fulcrum', x: fx, y: gy - 12, r: 20,
    hint: 'تکیه‌گاه را بکش و جابه‌جا کن',
    toValue: (px) => clamp((originX - px) / scale, 0.1, g.beamLengthM - 0.1)
  }];
}

// ═══════════════ ۴) قرقره ═══════════════
/** مسیر طناب برای هر سامانهٔ قرقره */
function pulleyLayout(system, geom) {
  const { cx, topY, crateTopY, handGroundY, R } = geom;
  const L = { sheavesTop: [], sheavesBottom: [], anchor: null, path: [], handAt: null, pullDown: system.changesDirection };

  if (system.id === 'NONE') {
    // بدون قرقره باید بالای بار بایستیم و طناب را رو به بالا بکشیم
    L.handAt = [cx + 34, topY + 96];
    L.path = [[cx, crateTopY], L.handAt];
    L.pullDown = false;
  } else if (system.id === 'FIXED') {
    const S = [cx, topY + R + 6];
    L.sheavesTop = [S];
    L.handAt = [cx + 130, handGroundY - 52];
    L.path = [[cx, crateTopY], [S[0] - R, S[1]], [S[0], S[1] - R], [S[0] + R, S[1]], [L.handAt[0], L.handAt[1]]];
  } else if (system.id === 'MOVABLE') {
    const M = [cx, crateTopY - R - 8];
    L.sheavesBottom = [M];
    L.anchor = [cx - R, topY + 10];
    L.handAt = [cx + R + 74, topY + 96];
    L.path = [L.anchor, [M[0] - R, M[1]], [M[0], M[1] + R], [M[0] + R, M[1]], L.handAt];
    L.pullDown = false;
  } else if (system.id === 'COMPOUND_2') {
    const M = [cx, crateTopY - R - 8];
    const T = [cx + R * 2.6, topY + R + 6];
    L.sheavesBottom = [M]; L.sheavesTop = [T];
    L.anchor = [cx - R, topY + 10];
    L.handAt = [T[0] + 110, handGroundY - 52];
    L.path = [L.anchor, [M[0] - R, M[1]], [M[0], M[1] + R], [M[0] + R, M[1]],
      [T[0] - R, T[1]], [T[0], T[1] - R], [T[0] + R, T[1]], L.handAt];
  } else if (system.id === 'COMPOUND_3') {
    const M = [cx, crateTopY - R - 8];
    const T1 = [cx - R * 2.4, topY + R + 6];
    const T2 = [cx + R * 2.4, topY + R + 6];
    L.sheavesBottom = [M]; L.sheavesTop = [T1, T2];
    L.anchor = [M[0] - R * 0.2, M[1] + R + 4];   // سر طناب به قرقرهٔ متحرک بسته است
    L.handAt = [T2[0] + 104, handGroundY - 52];
    L.path = [L.anchor, [T1[0] - R, T1[1]], [T1[0], T1[1] - R], [T1[0] + R, T1[1]],
      [M[0] - R, M[1]], [M[0], M[1] + R], [M[0] + R, M[1]],
      [T2[0] - R, T2[1]], [T2[0], T2[1] - R], [T2[0] + R, T2[1]], L.handAt];
  } else { // COMPOUND_4
    const M1 = [cx - R * 1.15, crateTopY - R - 10];
    const M2 = [cx + R * 1.15, crateTopY - R - 10];
    const T1 = [cx - R * 1.15, topY + R + 6];
    const T2 = [cx + R * 1.15, topY + R + 6];
    L.sheavesBottom = [M1, M2]; L.sheavesTop = [T1, T2];
    L.anchor = [cx - R * 2.6, topY + 10];
    L.handAt = [T2[0] + 108, handGroundY - 52];
    L.path = [L.anchor,
      [M1[0] - R, M1[1]], [M1[0], M1[1] + R], [M1[0] + R, M1[1]],
      [T1[0] - R, T1[1]], [T1[0], T1[1] - R], [T1[0] + R, T1[1]],
      [M2[0] - R, M2[1]], [M2[0], M2[1] + R], [M2[0] + R, M2[1]],
      [T2[0] - R, T2[1]], [T2[0], T2[1] - R], [T2[0] + R, T2[1]], L.handAt];
  }
  return L;
}

function scenePulley(ctx, env) {
  const { w, h, gy, P, t, state, showVectors, time } = env;
  const system = state.system;
  const topY = h * 0.13;
  const cx = w * 0.44;
  const R = 17;
  const size = clamp(40 + state.massKg * 0.28, 44, 70);

  const liftPx = (gy - topY - 120) * t;
  const crateCY = gy - size * 0.42 - liftPx;
  const crateTopY = crateCY - size * 0.41;

  // صخره و درمانگاه سمت چپ
  rockFace(ctx, -12, w * 0.19, topY + 52, gy, P, 6);
  clinic(ctx, w * 0.085, topY + 52, 0.55, P);

  // تیر افقی بالا روی دو پایه
  const beamX0 = w * 0.20, beamX1 = w * 0.86;
  ctx.save();
  ctx.fillStyle = P.stoneDark;
  rr(ctx, beamX1 - 26, topY + 8, 22, gy - topY - 4, 4); ctx.fill();
  ctx.restore();
  plank(ctx, beamX0, topY, beamX1 - beamX0, 16, 0, P);
  label(ctx, beamX1 - 60, topY - 13, 'تیرِ سقف', { size: 10, color: P.ink });

  const L = pulleyLayout(system, { cx, topY, crateTopY, handGroundY: gy, R });

  // طناب
  rope(ctx, L.path, P, { width: 3.2 });

  // قرقره‌ها
  const spin = t * 12;
  for (const [sx, sy] of L.sheavesTop) sheave(ctx, sx, sy, R, spin, P, { mount: 'top' });
  for (const [sx, sy] of L.sheavesBottom) sheave(ctx, sx, sy, R, -spin, P, { mount: 'hook' });

  if (L.anchor && L.sheavesBottom.length && L.anchor[1] < topY + 40) {
    ctx.save();
    ctx.fillStyle = P.metalDark;
    rr(ctx, L.anchor[0] - 5, L.anchor[1] - 8, 10, 10, 2); ctx.fill();
    ctx.restore();
  }

  // قلاب بین قرقرهٔ متحرک و بار
  if (L.sheavesBottom.length) {
    const mid = L.sheavesBottom.length === 1
      ? L.sheavesBottom[0]
      : [(L.sheavesBottom[0][0] + L.sheavesBottom[1][0]) / 2, L.sheavesBottom[0][1]];
    ctx.save();
    ctx.strokeStyle = P.metalDark; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(mid[0], mid[1] + R + 2); ctx.lineTo(cx, crateTopY); ctx.stroke();
    ctx.restore();
  }

  crate(ctx, cx, crateCY, size, 0, P, { massKg: state.massKg, shadow: t < 0.05 });

  // کارگر
  const [hx, hy] = L.handAt;
  const effort = clamp(state.effortN / state.humanLimitN, 0, 1);
  if (L.pullDown) {
    person(ctx, hx + 16, gy, 92, { P, pose: 'pull', dir: -1, t: time * 3, effort });
  } else {
    // برای کشیدن رو به بالا باید روی سکو، بالای بار ایستاد
    balcony(ctx, hx + 34, hy + 54, 86, P);
    person(ctx, hx + 26, hy + 54, 86, { P, pose: 'cheer', dir: -1, t: time * 3, effort });
    label(ctx, hx + 34, hy + 100, 'باید بالای بار بایستی و رو به بالا بکشی', { size: 10, color: P.ink });
  }

  // اندازه‌ها
  dim(ctx, w * 0.30, gy, w * 0.30, gy - liftPx - 1, `ارتفاع ${fa(num(state.loadDistanceM * t, 1))} از ${fa(state.loadDistanceM)} متر`,
    { color: P.inkSoft });
  label(ctx, w * 0.66, gy - 16,
    `${fa(state.strands)} رشتهٔ نگهدارندهٔ بار • طول طنابی که می‌کشی: ${fa(state.ropeM)} متر`,
    { size: 11, color: P.ink });

  if (showVectors) {
    const s = (f) => clamp((f / Math.max(state.loadN, 1)) * 78, 18, 86);
    arrow(ctx, cx, crateCY, cx, crateCY + s(state.loadN), { color: P.load, width: 3.2, text: `وزن ${N(state.loadN)}` });
    const dirY = L.pullDown ? 1 : -1;
    arrow(ctx, hx, hy, hx, hy + dirY * s(state.effortN), { color: P.effort, width: 3.4, text: `نیروی تو ${N(state.effortN)}` });
    for (const [sx, sy] of L.sheavesBottom) {
      arrow(ctx, sx, sy - R - 4, sx, sy - R - 4 - s(state.effortN) * 0.7,
        { color: P.ok, width: 2, dashed: true, textSize: 9 });
    }
  }
  return [];
}

// ═══════════════ ۵) چرخ و محور ═══════════════
function sceneWheelAxle(ctx, env) {
  const { w, h, gy, P, t, state, showVectors, time } = env;
  const g = state.geom;
  const axleY = h * 0.34;
  const cx = w * 0.46;
  const Rpx = clamp(g.wheelRadiusM * 150, 46, h * 0.2);
  const rpx = clamp(Rpx * (g.axleRadiusM / g.wheelRadiusM), 7, Rpx * 0.72);

  // چاه سنگی
  ctx.save();
  ctx.fillStyle = P.stoneDark;
  rr(ctx, cx - 74, gy - 44, 148, 46, 6); ctx.fill();
  ctx.fillStyle = '#2c2620';
  ctx.beginPath(); ctx.ellipse(cx, gy - 44, 62, 13, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = P.stone;
  for (let i = 0; i < 5; i++) rr(ctx, cx - 70 + i * 29, gy - 40, 26, 17, 3), ctx.fill();
  // پایه‌ها
  ctx.fillStyle = P.woodDark;
  rr(ctx, cx - 74, axleY, 13, gy - 44 - axleY, 3); ctx.fill();
  rr(ctx, cx + 61, axleY, 13, gy - 44 - axleY, 3); ctx.fill();
  ctx.restore();

  const spin = -t * 9;

  // محور
  ctx.save();
  ctx.translate(cx, axleY);
  ctx.fillStyle = grad(ctx, -rpx, -rpx, rpx, rpx, [[0, P.woodLight], [1, P.woodDark]]);
  ctx.beginPath(); ctx.arc(0, 0, rpx, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = P.woodDark; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();

  // چرخ بزرگ با دسته
  ctx.save();
  ctx.translate(cx, axleY);
  ctx.rotate(spin);
  ctx.strokeStyle = P.wood; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.arc(0, 0, Rpx, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = P.woodDark; ctx.lineWidth = 4;
  for (let i = 0; i < 6; i++) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos((i / 6) * Math.PI * 2) * Rpx, Math.sin((i / 6) * Math.PI * 2) * Rpx);
    ctx.stroke();
  }
  ctx.fillStyle = P.metalDark;
  ctx.beginPath(); ctx.arc(Rpx, 0, 8, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  const handleX = cx + Math.cos(spin) * Rpx;
  const handleY = axleY + Math.sin(spin) * Rpx;

  // طناب و سطل
  const liftPx = (gy - 44 - axleY - 60) * t;
  const bucketY = gy - 60 - liftPx;
  rope(ctx, [[cx - rpx, axleY], [cx - rpx, bucketY - 26]], P, { width: 3 });
  const size = clamp(34 + state.massKg * 0.3, 38, 62);
  crate(ctx, cx - rpx, bucketY, size, 0, P, { massKg: state.massKg, shadow: false });

  // کارگر
  person(ctx, cx + Rpx + 34, gy, 92, {
    P, pose: 'crank', dir: -1, t: time * 3,
    effort: clamp(state.effortN / state.humanLimitN, 0, 1)
  });

  dim(ctx, cx, axleY - Rpx - 16, cx + Rpx, axleY - Rpx - 16, `شعاع چرخ ${fa(num(g.wheelRadiusM, 2))} متر`, { color: P.effort });
  dim(ctx, cx - rpx, axleY + Rpx + 22, cx, axleY + Rpx + 22, `شعاع محور ${fa(num(g.axleRadiusM, 2))} متر`, { color: P.load, offset: 16 });
  label(ctx, cx, under(gy, h, 30), `مزیت مکانیکی = شعاع چرخ ÷ شعاع محور = ${fa(num(state.maIdeal, 1))}`, { size: 11, color: P.ink });

  if (showVectors) {
    const s = (f) => clamp((f / Math.max(state.loadN, 1)) * 78, 18, 84);
    arrow(ctx, handleX, handleY, handleX, handleY + s(state.effortN), { color: P.effort, width: 3.2, text: `نیروی تو ${N(state.effortN)}` });
    arrow(ctx, cx - rpx, bucketY, cx - rpx, bucketY + s(state.loadN), { color: P.load, width: 3.2, text: `وزن ${N(state.loadN)}` });
  }
  return [];
}

// ═══════════════ ۶) گوه ═══════════════
function sceneWedge(ctx, env) {
  const { w, h, gy, P, t, state, showVectors, particles, time } = env;
  const g = state.geom;
  const scale = 620;
  const wl = clamp(g.lengthM * scale, 70, h * 0.34);
  const wt = clamp(g.thicknessM * scale, 12, wl * 0.7);

  const cx = w * 0.5;
  const logY = gy - 34;
  const logW = w * 0.44, logH = 62;

  const gap = wt * t;
  // دو نیمهٔ چوب
  for (const side of [-1, 1]) {
    ctx.save();
    ctx.translate(cx + side * (gap / 2), logY);
    ctx.fillStyle = grad(ctx, 0, -logH / 2, 0, logH / 2, [[0, P.woodLight], [1, P.woodDark]]);
    rr(ctx, side === -1 ? -logW / 2 : 0, -logH / 2, logW / 2, logH, 5);
    ctx.fill();
    ctx.strokeStyle = P.woodDark; ctx.lineWidth = 1.5; ctx.stroke();
    // حلقه‌های سالیانه
    ctx.strokeStyle = 'rgba(0,0,0,.16)'; ctx.lineWidth = 1.4;
    for (let i = 1; i <= 3; i++) {
      ctx.beginPath();
      ctx.arc(side === -1 ? -logW / 2 + 4 : logW / 2 - 4, 0, i * 11, side === -1 ? -1.2 : Math.PI - 1.2, side === -1 ? 1.2 : Math.PI + 1.2);
      ctx.stroke();
    }
    ctx.restore();
  }
  // پایه
  ctx.save();
  ctx.fillStyle = P.stoneDark;
  rr(ctx, cx - logW / 2 - 8, gy - 6, logW + 16, 12, 4); ctx.fill();
  ctx.restore();

  // گوه
  const wedgeTop = logY - logH / 2 - wl + (wl + 10) * t;
  ctx.save();
  ctx.translate(cx, wedgeTop);
  ctx.fillStyle = grad(ctx, -wt / 2, 0, wt / 2, wl, [[0, P.metalLight], [1, P.metalDark]]);
  ctx.beginPath();
  ctx.moveTo(-wt / 2, 0); ctx.lineTo(wt / 2, 0); ctx.lineTo(0, wl);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = P.metalDark; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = P.woodDark;
  rr(ctx, -wt / 2 - 3, -13, wt + 6, 14, 3); ctx.fill();
  ctx.restore();

  // ضربه‌زننده به‌همراه پتک
  const hand = person(ctx, cx + 104, gy, 94, { P, pose: 'hammer', dir: -1, t: time * 3, effort: clamp(state.effortN / state.humanLimitN, 0, 1) });
  ctx.save();
  ctx.strokeStyle = P.woodDark; ctx.lineWidth = 5; ctx.lineCap = 'round';
  const mAng = Math.atan2(wedgeTop - 16 - hand.y, cx - hand.x);
  ctx.beginPath();
  ctx.moveTo(hand.x, hand.y);
  ctx.lineTo(hand.x + Math.cos(mAng) * 40, hand.y + Math.sin(mAng) * 40);
  ctx.stroke();
  ctx.fillStyle = P.metalDark;
  ctx.save();
  ctx.translate(hand.x + Math.cos(mAng) * 46, hand.y + Math.sin(mAng) * 46);
  ctx.rotate(mAng);
  rr(ctx, -12, -9, 24, 18, 3); ctx.fill();
  ctx.restore();
  ctx.restore();

  if (t > 0 && t < 1 && particles && Math.random() < 0.25) {
    particles.burst(cx, wedgeTop + wl, 2, 'rgba(215,185,140,.85)', { speed: 2.2, life: 0.6, size: 3, gravity: 0.2, dir: -Math.PI / 2, spread: 2.4 });
  }

  dim(ctx, cx - wt / 2 - 44, wedgeTop, cx - wt / 2 - 44, wedgeTop + wl, `طول گوه ${fa(num(g.lengthM * 100, 0))} سانتی‌متر`, { color: P.effort });
  dim(ctx, cx - wt / 2, wedgeTop - 26, cx + wt / 2, wedgeTop - 26, `ضخامت ${fa(num(g.thicknessM * 100, 0))} سانتی‌متر`, { color: P.load });
  label(ctx, w * 0.5, under(gy, h, 34), `گوه = سطح شیب‌دارِ متحرک • مزیت مکانیکی = طول ÷ ضخامت = ${fa(num(state.maIdeal, 1))}`, { size: 11, color: P.ink });

  if (showVectors) {
    const s = (f) => clamp((f / Math.max(state.loadN, 1)) * 76, 18, 82);
    arrow(ctx, cx, wedgeTop - 22, cx, wedgeTop - 22 + s(state.effortN), { color: P.effort, width: 3.4, text: `ضربهٔ تو ${N(state.effortN)}` });
    arrow(ctx, cx - wt / 2 - 6, logY, cx - wt / 2 - 6 - s(state.loadN) * 0.6, logY, { color: P.load, width: 3, text: 'مقاومت چوب' });
    arrow(ctx, cx + wt / 2 + 6, logY, cx + wt / 2 + 6 + s(state.loadN) * 0.6, logY, { color: P.load, width: 3 });
  }
  return [];
}

// ═══════════════ ۷) پیچ ═══════════════
function sceneScrew(ctx, env) {
  const { w, h, gy, P, t, state, showVectors, time } = env;
  const g = state.geom;
  const cx = w * 0.46;
  const shaftH = h * 0.30;
  const shaftW = 30;
  const baseY = gy - 10;
  const liftPx = 52 * t;
  const topY = baseY - shaftH - liftPx;

  // پایه
  ctx.save();
  ctx.fillStyle = P.metalDark;
  rr(ctx, cx - 56, baseY - 16, 112, 18, 4); ctx.fill();
  ctx.restore();

  // بدنهٔ پیچ با رزوه
  ctx.save();
  ctx.fillStyle = grad(ctx, cx - shaftW / 2, 0, cx + shaftW / 2, 0, [[0, P.metalLight], [0.5, P.metal], [1, P.metalDark]]);
  rr(ctx, cx - shaftW / 2, topY, shaftW, baseY - 16 - topY, 3);
  ctx.fill();
  ctx.strokeStyle = P.metalDark; ctx.lineWidth = 1.4; ctx.stroke();
  // خطوط رزوه (گام)
  const pitchPx = clamp(g.pitchM * 900, 6, 26);
  const phase = (t * 240) % pitchPx;
  for (let y = topY + 4 + phase; y < baseY - 18; y += pitchPx) {
    ctx.strokeStyle = 'rgba(0,0,0,.42)'; ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.moveTo(cx - shaftW / 2, y);
    ctx.lineTo(cx + shaftW / 2, y - pitchPx * 0.55);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.moveTo(cx - shaftW / 2, y + 2.4);
    ctx.lineTo(cx + shaftW / 2, y - pitchPx * 0.55 + 2.4);
    ctx.stroke();
  }
  ctx.restore();

  // صفحهٔ بالا و تخته‌سنگ
  ctx.save();
  ctx.fillStyle = P.metalDark;
  rr(ctx, cx - 46, topY - 12, 92, 14, 4); ctx.fill();
  ctx.restore();
  const rSize = clamp(38 + state.massKg * 0.09, 44, 84);
  ctx.save();
  ctx.fillStyle = grad(ctx, cx - rSize, topY - rSize, cx + rSize, topY, [[0, '#a49a8d'], [1, '#676056']]);
  ctx.beginPath();
  ctx.ellipse(cx, topY - 12 - rSize * 0.62, rSize, rSize * 0.66, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#575047'; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
  label(ctx, cx, topY - 12 - rSize * 1.5, `تخته‌سنگ ${fa(state.massKg)} کیلوگرم`, { size: 10, color: P.ink });

  // دستهٔ چرخان (پایینِ بدنه، جایی که دست به آن می‌رسد)
  const ang = t * 10;
  const Rpx = clamp(g.handleRadiusM * 190, 46, 112);
  const handleY = baseY - 54;
  const e1 = [cx + Math.cos(ang) * Rpx, handleY + Math.sin(ang) * Rpx * 0.22];
  const e2 = [cx - Math.cos(ang) * Rpx, handleY - Math.sin(ang) * Rpx * 0.22];
  const near = e1[0] >= e2[0] ? e1 : e2;   // سرِ نزدیک به کارگر
  const far = near === e1 ? e2 : e1;
  ctx.save();
  ctx.strokeStyle = P.metalDark; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(far[0], far[1]); ctx.lineTo(near[0], near[1]); ctx.stroke();
  ctx.fillStyle = P.woodDark;
  ctx.beginPath(); ctx.arc(near[0], near[1], 9, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(far[0], far[1], 7, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  const hx = near[0], hy = near[1];

  person(ctx, hx + 34, gy, 90, { P, pose: 'crank', dir: -1, t: time * 3, effort: clamp(state.effortN / state.humanLimitN, 0, 1) });

  dim(ctx, cx, handleY + 34, cx + Rpx, handleY + 34, `شعاع دسته ${fa(num(g.handleRadiusM * 100, 0))} سانتی‌متر`, { color: P.effort });
  label(ctx, cx - shaftW / 2 - 66, topY + 60, `گامِ پیچ ${fa(num(g.pitchM * 1000, 0))} میلی‌متر`, { size: 10, color: P.load });
  label(ctx, w * 0.5, under(gy, h, 32), `پیچ = سطح شیب‌دارِ پیچیده‌شده دور استوانه • ${fa(state.turns)} دور چرخش لازم است`, { size: 11, color: P.ink });

  if (showVectors) {
    const s = (f) => clamp((f / Math.max(state.loadN, 1)) * 300, 20, 84);
    arrow(ctx, hx, hy, hx, hy + s(state.effortN), { color: P.effort, width: 3.2, text: `نیروی تو ${N(state.effortN)}` });
    arrow(ctx, cx, topY - 18, cx, topY - 18 + 60, { color: P.load, width: 3.2, text: `وزن ${N(state.loadN)}` });
  }
  return [];
}

// ═══════════════ ۸) چرخ‌دنده‌ها ═══════════════
function sceneGears(ctx, env) {
  const { w, h, P, state, time, t } = env;
  const cy = h * 0.5;
  const base = Math.min(w, h) * 0.17;
  const r1 = base, r2 = base * (state.drivenTeeth / state.driverTeeth);
  const rr2 = clamp(r2, base * 0.4, Math.min(w, h) * 0.32);
  const scaleFix = rr2 / r2;
  const R1 = r1 * (rr2 === r2 ? 1 : scaleFix);
  const gap = (R1 + rr2) * 0.885;   // فاصلهٔ مرکزها تا دندانه‌ها واقعاً درگیر شوند
  const x1 = w * 0.62, x2 = x1 - gap;

  const spin = (time * 0.9 + t * 3) * (state.inputRpm / 60);
  const a1 = spin;
  const a2 = -spin * (state.driverTeeth / state.drivenTeeth);

  // تخته پشت
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  rr(ctx, w * 0.1, h * 0.16, w * 0.8, h * 0.68, 20); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.10)'; ctx.stroke();
  ctx.restore();

  gear(ctx, x1, cy, R1, state.driverTeeth, a1, '#f0900c', P);
  gear(ctx, x2, cy, rr2, state.drivenTeeth, a2 + Math.PI / state.drivenTeeth, '#0b7fc4', P);

  label(ctx, x1, cy + R1 + 26, `چرخ‌دندهٔ محرک • ${fa(state.driverTeeth)} دندانه`, { size: 11, color: P.ink });
  label(ctx, x2, cy + rr2 + 26, `چرخ‌دندهٔ متحرک • ${fa(state.drivenTeeth)} دندانه`, { size: 11, color: P.ink });
  label(ctx, x1, cy - R1 - 24, `${fa(state.inputRpm)} دور بر دقیقه`, { size: 11, color: '#a2560a' });
  label(ctx, x2, cy - rr2 - 24, `${fa(state.outputRpm)} دور بر دقیقه`, { size: 11, color: '#075985' });

  // پیکان جهت چرخش
  for (const [x, r, dir, color] of [[x1, R1, 1, '#a2560a'], [x2, rr2, -1, '#075985']]) {
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(x, cy, r * 0.42, dir > 0 ? -0.6 : Math.PI + 0.6, dir > 0 ? 1.6 : Math.PI - 1.6, dir < 0);
    ctx.stroke();
    ctx.restore();
  }

  label(ctx, w * 0.5, h * 0.80,
    `گشتاور خروجی ${fa(state.outputTorqueNm)} نیوتون‌متر • نسبت دنده ${fa(state.ratio)} به ۱`,
    { size: 12, color: P.ink });
  return [];
}

// ═══════════════ ۹) مأموریت پایانی ═══════════════
function sceneCapstone(ctx, env) {
  const { w, h, gy, P, t, state, time } = env;
  const size = 40;

  // ── هندسهٔ سه مرحله (از راست به چپ) ──
  const cliffTopY = gy - h * 0.19;          // بالای دیوارهٔ میانی
  const towerTopY = h * 0.14;               // تیرِ قرقرهٔ برج درمانگاه
  const cliffRight = w * 0.56;              // لبهٔ راست دیوارهٔ میانی
  const bridgeX0 = w * 0.30, bridgeX1 = w * 0.40;   // دهانهٔ پل

  const rampH = gy - cliffTopY;
  const lPx = clamp(state.stageB.lengthM * (rampH / state.stageB.heightM), rampH * 1.05, w * 0.34);
  const ang = Math.asin(clamp(rampH / lPx, 0, 1));
  const rampBaseX = cliffRight + Math.cos(ang) * lPx;

  // ── صخره‌ها ──
  rockFace(ctx, bridgeX1, cliffRight, cliffTopY, gy, P, 8);      // دیوارهٔ میانی
  rockFace(ctx, -12, bridgeX0, towerTopY + 54, gy, P, 3);        // برج درمانگاه
  clinic(ctx, w * 0.08, towerTopY + 54, 0.52, P);

  // ── رمپ مرحلهٔ ۲ ──
  ctx.save();
  ctx.translate(rampBaseX, gy);
  ctx.rotate(ang);
  plank(ctx, -lPx, -11, lPx, 11, 0, P);
  ctx.restore();

  // ── پل میانی ──
  for (let i = 0; i < state.bridgeBeams; i++) {
    plank(ctx, bridgeX0 - 8, cliffTopY - 4 + i * 8, (bridgeX1 - bridgeX0) + 16, 8, 0, P);
  }
  if (!state.bridgeStable) {
    label(ctx, (bridgeX0 + bridgeX1) / 2, cliffTopY - 26, '⚠️ پل ناپایدار است', { size: 10, color: '#c02a3c', bg: 'rgba(253,234,236,.95)' });
  }

  // ── قرقرهٔ برج ──
  const R = 15;
  plank(ctx, w * 0.10, towerTopY, w * 0.20, 12, 0, P);
  const pulX = w * 0.205;
  sheave(ctx, pulX, towerTopY + R + 8, R, t * 10, P, { mount: 'top' });
  balcony(ctx, w * 0.12, towerTopY + 54, 74, P);

  // ── مسیر حرکت بار در سه مرحله ──
  let cx, cy, tilt = 0, phase;
  if (t < 0.34) {
    phase = 'A';
    cx = lerp(w * 0.94, rampBaseX, t / 0.34);
    cy = gy - size * 0.45;
  } else if (t < 0.72) {
    phase = 'B';
    const k = (t - 0.34) / 0.38;
    cx = lerp(rampBaseX, cliffRight, k);
    cy = lerp(gy, cliffTopY, k) - size * 0.5;
    tilt = ang;
  } else {
    phase = 'C';
    const k = (t - 0.72) / 0.28;
    cx = lerp(cliffRight - 10, pulX, Math.min(1, k * 2.2));
    cy = lerp(cliffTopY - size * 0.5, towerTopY + 72, k);
  }

  // ── کارگر و طناب ──
  if (phase === 'C') {
    rope(ctx, [[pulX - R, towerTopY + R + 8], [cx, cy - size * 0.45]], P, { width: 3 });
    rope(ctx, [[pulX + R, towerTopY + R + 8], [pulX + 52, gy - 62]], P, { width: 3 });
    person(ctx, pulX + 66, gy, 88, { P, pose: 'pull', dir: -1, t: time * 3, effort: clamp(state.stageC.effortN / state.humanLimitN, 0, 1) });
  } else {
    const eff = clamp((phase === 'A' ? state.stageA : state.stageB).effortN / state.humanLimitN, 0, 1);
    const px = cx - size * 0.6 - 66 * Math.cos(tilt);
    const py = phase === 'A' ? gy : cy + size * 0.5 - Math.tan(tilt) * 0;
    const hand = person(ctx, phase === 'B' ? cliffRight - 30 : px, phase === 'B' ? cliffTopY : py, 86,
      { P, pose: 'pull', dir: 1, t: time * 3, effort: eff });
    rope(ctx, [[hand.x, hand.y], [cx - size * 0.45, cy]], P, { width: 3, sag: 2 });
  }

  // ── بار ──
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(tilt);
  if (state.stageA.useRollers && phase !== 'C') rollers(ctx, 0, size * 0.45, size, -t * 30, P);
  crate(ctx, 0, 0, size, 0, P, { massKg: state.massKg, shadow: false });
  ctx.restore();

  // ── برچسب مراحل ──
  const stages = [
    [w * 0.86, gy - 66, '۱) کشیدن', state.stageA],
    [rampBaseX - Math.cos(ang) * lPx * 0.5 + 52, gy - rampH * 0.5 - 8, '۲) رمپ', state.stageB],
    [pulX + 4, towerTopY + 96, '۳) قرقره', state.stageC]
  ];
  for (const [x, y, name, st] of stages) {
    label(ctx, x, y, `${st.feasible ? '✓' : '✕'} ${name} — ${N(st.effortN)}`, {
      size: 11,
      color: st.feasible ? '#0d7a52' : '#c02a3c',
      bg: st.feasible ? 'rgba(226,247,238,.96)' : 'rgba(253,234,236,.96)'
    });
  }
  label(ctx, w * 0.5, under(gy, h, 32),
    `مصالح مصرفی ${fa(state.materialsUsed)} از ${fa(state.budget)} • بیشترین نیرو ${N(state.maxForceN)} • توان ${state.puller.name}: ${fa(state.humanLimitN)} نیوتون`,
    { size: 11, color: P.ink });
  return [];
}

const SCENES = {
  FRICTION: sceneFriction,
  INCLINED_PLANE: sceneIncline,
  LEVER: sceneLever,
  PULLEY: scenePulley,
  WHEEL_AXLE: sceneWheelAxle,
  WEDGE: sceneWedge,
  SCREW: sceneScrew,
  GEARS: sceneGears,
  CAPSTONE: sceneCapstone
};

// مدیریت بوم: اندازه، حلقهٔ انیمیشن، تم، ذرات و کشیدن دستگیره‌ها




class Stage {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.dpr = 1;
    this.w = 0;
    this.h = 0;
    this.time = 0;
    this.theme = 'light';
    this.particles = new Particles();
    this.handles = [];
    this.activeHandle = null;
    this.hoverHandle = null;
    this.reducedMotion = false;
    this.getState = () => null;
    this.onHandleChange = () => {};
    this.running = false;
    this._lastFrame = 0;

    this._bindPointer();

    if (typeof ResizeObserver !== 'undefined') {
      this._ro = new ResizeObserver(() => this.resize());
      this._ro.observe(canvas);
    }
  }

  get palette() {
    return this.theme === 'dark' ? PALETTE.dark : PALETTE.light;
  }

  setTheme(theme) { this.theme = theme; }

  resize() {
    const rect = this.canvas.getBoundingClientRect();
    if (rect.width < 2 || rect.height < 2) return;
    this.dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    this.w = rect.width;
    this.h = rect.height;
    this.canvas.width = Math.round(rect.width * this.dpr);
    this.canvas.height = Math.round(rect.height * this.dpr);
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    this.render();
  }

  start() {
    if (this.running) return;
    this.running = true;
    this._lastFrame = performance.now();
    const loop = (now) => {
      if (!this.running) return;
      const dt = Math.min(0.05, (now - this._lastFrame) / 1000);
      this._lastFrame = now;
      if (!this.reducedMotion) this.time += dt;
      this.particles.update(dt);
      this.render();
      this._raf = requestAnimationFrame(loop);
    };
    this._raf = requestAnimationFrame(loop);
  }

  stop() {
    this.running = false;
    if (this._raf) cancelAnimationFrame(this._raf);
  }

  render() {
    const view = this.getState();
    if (!view || !this.w) return;
    const ctx = this.ctx;
    const P = this.palette;
    setPalette(P);
    ctx.clearRect(0, 0, this.w, this.h);

    const groundY = view.machine === 'GEARS' ? 0.92 : 0.80;
    const gy = drawWorld(ctx, this.w, this.h, P, this.time, {
      groundY,
      trees: view.machine !== 'GEARS',
      birds: !this.reducedMotion
    });

    const scene = SCENES[view.machine];
    let handles = [];
    if (scene) {
      ctx.save();
      try {
        handles = scene(ctx, {
          w: this.w, h: this.h, gy, P,
          time: this.time,
          t: clamp(view.t ?? 0, 0, 1),
          state: view.state,
          showVectors: !!view.showVectors,
          particles: this.reducedMotion ? null : this.particles
        }) || [];
      } catch (err) {
        console.error('خطا در رسم صحنه:', err);
      }
      ctx.restore();
    }

    this.particles.draw(ctx);

    this.handles = view.interactive === false ? [] : handles;
    this._drawHandles(ctx, P);

    if (this.theme === 'contrast') {
      ctx.save();
      ctx.globalCompositeOperation = 'saturation';
      ctx.fillStyle = 'hsl(0,0%,50%)';
      ctx.fillRect(0, 0, this.w, this.h);
      ctx.restore();
    }
  }

  _drawHandles(ctx, P) {
    for (const hd of this.handles) {
      const active = this.activeHandle === hd.id || this.hoverHandle === hd.id;
      ctx.save();
      ctx.translate(hd.x, hd.y);
      ctx.beginPath();
      ctx.arc(0, 0, hd.r, 0, Math.PI * 2);
      ctx.fillStyle = active ? 'rgba(240,144,12,.30)' : 'rgba(255,255,255,.55)';
      ctx.fill();
      ctx.setLineDash([5, 4]);
      ctx.strokeStyle = active ? '#f0900c' : 'rgba(30,50,70,.55)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = active ? '#f0900c' : 'rgba(30,50,70,.7)';
      ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
      // پیکان‌های راهنما
      ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 2; ctx.lineCap = 'round';
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(s * (hd.r - 4), 0);
        ctx.lineTo(s * (hd.r - 9), -4);
        ctx.moveTo(s * (hd.r - 4), 0);
        ctx.lineTo(s * (hd.r - 9), 4);
        ctx.stroke();
      }
      ctx.restore();
      if (active && hd.hint) {
        ctx.save();
        ctx.font = '700 11px Vazirmatn, Tahoma, sans-serif';
        ctx.direction = 'rtl';
        ctx.textAlign = 'center';
        const tw = ctx.measureText(hd.hint).width + 14;
        ctx.fillStyle = 'rgba(20,35,50,.9)';
        rr(ctx, hd.x - tw / 2, hd.y - hd.r - 30, tw, 22, 8);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.textBaseline = 'middle';
        ctx.fillText(hd.hint, hd.x, hd.y - hd.r - 19);
        ctx.restore();
      }
    }
  }

  _pos(e) {
    const rect = this.canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  _hit(pos) {
    for (const hd of this.handles) {
      if (Math.hypot(pos.x - hd.x, pos.y - hd.y) <= hd.r + 8) return hd;
    }
    return null;
  }

  _bindPointer() {
    const c = this.canvas;
    c.addEventListener('pointerdown', (e) => {
      const hit = this._hit(this._pos(e));
      if (hit) {
        this.activeHandle = hit.id;
        c.setPointerCapture(e.pointerId);
        e.preventDefault();
      }
    });
    c.addEventListener('pointermove', (e) => {
      const pos = this._pos(e);
      if (this.activeHandle) {
        const hd = this.handles.find((x) => x.id === this.activeHandle);
        if (hd && hd.toValue) this.onHandleChange(hd.id, hd.toValue(pos.x, pos.y));
        return;
      }
      const hit = this._hit(pos);
      const id = hit ? hit.id : null;
      if (id !== this.hoverHandle) {
        this.hoverHandle = id;
        c.style.cursor = id ? 'grab' : 'default';
      }
    });
    const end = () => {
      if (this.activeHandle) this.activeHandle = null;
      c.style.cursor = this.hoverHandle ? 'grab' : 'default';
    };
    c.addEventListener('pointerup', end);
    c.addEventListener('pointercancel', end);
    c.addEventListener('pointerleave', () => { this.hoverHandle = null; });
  }

  celebrate(x, y) {
    if (this.reducedMotion) return;
    const colors = ['#f0900c', '#12a06a', '#0b7fc4', '#e0435a', '#fbbf24'];
    for (let i = 0; i < 5; i++) {
      this.particles.burst(x ?? this.w / 2, y ?? this.h / 2, 14, colors[i % colors.length],
        { speed: 5, life: 1.4, size: 5, gravity: 0.16 });
    }
  }
}

// اجزای رابط کاربری: کنترل‌های اعلانی، تراشه‌های عددی، جدول و نمودار





/** سازندهٔ کوتاه عناصر DOM */
function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k === 'text') node.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'dataset') Object.assign(node.dataset, v);
    else node.setAttribute(k, v === true ? '' : String(v));
  }
  for (const c of [].concat(children)) {
    if (c === null || c === undefined || c === false) continue;
    node.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return node;
}

function card(titleText, icon, children, cls = '') {
  return el('section', { class: `card ${cls}` }, [
    titleText ? el('h2', { class: 'card-title' }, [
      icon ? el('span', { class: 'dot', 'aria-hidden': 'true' }, [icon]) : null,
      el('span', {}, [titleText])
    ]) : null,
    ...[].concat(children)
  ]);
}

// ─────────── کنترل‌ها ───────────

function decimalsOf(control) {
  if (control.decimals !== undefined) return control.decimals;
  return Number.isInteger(control.step) ? 0 : 1;
}

function sliderField(control, value, max, onChange) {
  const out = el('span', { class: 'field-value' });
  const d = decimalsOf(control);
  const paint = (v) => {
    out.textContent = `${fa(num(v, d))} ${control.unit || ''}`.trim();
  };
  const input = el('input', {
    type: 'range', min: control.min, max, step: control.step, value,
    'aria-label': control.label
  });
  const setFill = () => {
    const pct = ((Number(input.value) - control.min) / (max - control.min)) * 100;
    input.style.setProperty('--fill', `${clamp(pct, 0, 100)}%`);
  };
  input.addEventListener('input', () => {
    const v = Number(input.value);
    paint(v);
    setFill();
    onChange(control.key, v);
  });
  paint(value);
  setFill();
  return el('div', { class: 'field' }, [
    el('label', {}, [el('span', {}, [control.label]), out]),
    input,
    control.cost ? el('p', { class: 'field-hint' }, [`💰 ${control.cost}`]) : null
  ]);
}

function segmentField(control, value, onChange) {
  const wrap = el('div', { class: `segment${control.options.length === 2 ? ' cols-2' : ''}`, role: 'group', 'aria-label': control.label });
  for (const opt of control.options) {
    const active = String(opt.value) === String(value);
    wrap.append(el('button', {
      class: `seg${active ? ' is-active' : ''}`,
      type: 'button',
      'aria-pressed': active ? 'true' : 'false',
      onclick: () => onChange(control.key, control.numeric ? Number(opt.value) : opt.value)
    }, [
      opt.icon ? el('span', { class: 'seg-icon', 'aria-hidden': 'true' }, [opt.icon]) : null,
      el('span', {}, [opt.label]),
      opt.sub ? el('span', { class: 'seg-sub' }, [opt.sub]) : null
    ]));
  }
  return el('div', { class: 'field' }, [
    el('p', { class: 'field-label' }, [el('span', {}, [control.label])]),
    wrap
  ]);
}

function switchField(control, value, onChange) {
  const input = el('input', {
    type: 'checkbox', checked: !!value,
    onchange: (e) => onChange(control.key, e.target.checked)
  });
  return el('label', { class: 'field switch' }, [
    input,
    el('span', { class: 'track', 'aria-hidden': 'true' }),
    el('span', {}, [
      control.label,
      control.sub ? el('span', { class: 'switch-sub' }, [control.sub]) : null
    ])
  ]);
}

/** ساخت کنترل‌های یک ماشین؛ keys اختیاری برای محدود کردن به زیرمجموعه */
function buildControls(machineId, params, onChange, keys = null) {
  const defs = MACHINE_CONTROLS[machineId] || [];
  const frag = document.createDocumentFragment();
  for (const c of defs) {
    if (keys && !keys.includes(c.key)) continue;
    const value = params[c.key];
    if (c.kind === 'slider') {
      const max = c.maxKey ? Number(params[c.maxKey]) + (c.maxOffset || 0) : c.max;
      frag.append(sliderField(c, clamp(value, c.min, max), Math.max(c.min + c.step, max), onChange));
    } else if (c.kind === 'segment') {
      frag.append(segmentField(c, value, onChange));
    } else if (c.kind === 'switch') {
      frag.append(switchField(c, value, onChange));
    }
  }
  return frag;
}

/** فهرست خوانش‌های عددی متناسب با هر ماشین */

function renderHud(container, result) {

// ─────────── نمودار ───────────

/** پارامتری که نمودارِ هر ماشین بر حسب آن رسم می‌شود */
const CHART_SPEC = {
  FRICTION: { type: 'bars', key: 'surfaceId', values: ['ROUGH_STONE', 'WOOD_PLANKS', 'SMOOTH_TRACK', 'ICE'], labels: ['سنگ', 'چوب', 'صیقلی', 'یخ'], title: 'نیروی لازم روی سطح‌های گوناگون' },
  PULLEY: { type: 'bars', key: 'systemId', values: ['NONE', 'FIXED', 'MOVABLE', 'COMPOUND_2', 'COMPOUND_3', 'COMPOUND_4'], labels: ['بدون', 'ثابت', 'متحرک', 'مرکب۲', 'مرکب۳', 'مرکب۴'], title: 'نیروی لازم با سامانه‌های قرقره' },
  INCLINED_PLANE: { type: 'line', key: 'lengthM', title: 'نیرو بر حسب طول رمپ', xUnit: 'متر' },
  LEVER: { type: 'line', key: 'fulcrumM', title: 'نیرو بر حسب جای تکیه‌گاه', xUnit: 'متر' },
  WHEEL_AXLE: { type: 'line', key: 'wheelRadiusM', title: 'نیرو بر حسب شعاع چرخ', xUnit: 'متر' },
  WEDGE: { type: 'line', key: 'thicknessM', title: 'نیرو بر حسب ضخامت گوه', xUnit: 'متر' },
  SCREW: { type: 'line', key: 'pitchM', title: 'نیرو بر حسب گام پیچ', xUnit: 'متر' },
  GEARS: { type: 'line', key: 'drivenTeeth', title: 'گشتاور خروجی بر حسب دندانه‌ها', xUnit: 'دندانه', yKey: 'outputTorqueNm', yLabel: 'گشتاور (N·m)' }
};

function evaluate(machineId, params) {
  const p = resolveParams(machineId, params);
  return machineId === 'CAPSTONE' ? capstone(p) : solve(machineId, p);
}

/** نمودار نیرو (یا گشتاور) بر حسب یک پارامتر — روی بوم کوچک کنار کنترل‌ها */
function drawChart(canvas, machineId, params, theme = 'light') {
  const spec = CHART_SPEC[machineId];
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rect = canvas.getBoundingClientRect();
  const w = rect.width || 300, h = rect.height || 150;
  canvas.width = w * dpr; canvas.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  if (!spec) return;

  const dark = theme === 'dark';
  const ink = dark ? '#a8becf' : '#4a627a';
  const line = dark ? '#24394c' : '#d9e3ec';
  const accent = '#0b7fc4';
  const yKey = spec.yKey || 'effortN';

  const pad = { t: 12, r: 12, b: 26, l: 40 };
  const pw = w - pad.l - pad.r, ph = h - pad.t - pad.b;

  const points = [];
  if (spec.type === 'bars') {
    spec.values.forEach((v, i) => {
      const r = evaluate(machineId, { ...params, [spec.key]: v, useRollers: false });
      points.push({ x: i, y: r[yKey], label: spec.labels[i], current: String(params[spec.key]) === String(v) });
    });
  } else {
    const def = (MACHINE_CONTROLS[machineId] || []).find((c) => c.key === spec.key);
    if (!def) return;
    const steps = 26;
    for (let i = 0; i <= steps; i++) {
      const x = def.min + ((def.max - def.min) * i) / steps;
      const r = evaluate(machineId, { ...params, [spec.key]: x });
      points.push({ x, y: r[yKey] });
    }
  }

  const ys = points.map((p) => p.y);
  const yMax = Math.max(...ys) * 1.12 || 1;
  const xs = points.map((p) => p.x);
  const xMin = Math.min(...xs), xMax = Math.max(...xs);
  const X = (x) => pad.l + (spec.type === 'bars' ? ((x + 0.5) / points.length) * pw : ((x - xMin) / (xMax - xMin || 1)) * pw);
  const Y = (y) => pad.t + ph - (y / yMax) * ph;

  // شبکه
  ctx.strokeStyle = line; ctx.lineWidth = 1;
  ctx.font = '600 10px Vazirmatn, Tahoma, sans-serif';
  ctx.fillStyle = ink;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (let i = 0; i <= 3; i++) {
    const y = pad.t + (ph / 3) * i;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
    ctx.fillText(fa(num((yMax * (3 - i)) / 3, 0)), pad.l - 6, y);
  }

  if (spec.type === 'bars') {
    const bw = (pw / points.length) * 0.62;
    points.forEach((p) => {
      const x = X(p.x);
      ctx.fillStyle = p.current ? '#f0900c' : accent;
      ctx.globalAlpha = p.current ? 1 : 0.55;
      const y = Y(p.y);
      ctx.fillRect(x - bw / 2, y, bw, pad.t + ph - y);
      ctx.globalAlpha = 1;
      ctx.fillStyle = ink;
      ctx.textAlign = 'center';
      ctx.fillText(p.label, x, h - 12);
    });
  } else {
    ctx.strokeStyle = accent; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
    ctx.beginPath();
    points.forEach((p, i) => (i ? ctx.lineTo(X(p.x), Y(p.y)) : ctx.moveTo(X(p.x), Y(p.y))));
    ctx.stroke();
    // نقطهٔ جاری
    const cur = Number(params[spec.key]);
    const curY = evaluate(machineId, params)[yKey];
    ctx.fillStyle = '#f0900c';
    ctx.beginPath(); ctx.arc(X(cur), Y(curY), 5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = ink;
    ctx.textAlign = 'center';
    ctx.fillText(`${fa(num(xMin, 1))} ${spec.xUnit}`, pad.l + 16, h - 10);
    ctx.fillText(`${fa(num(xMax, 1))} ${spec.xUnit}`, w - pad.r - 16, h - 10);
  }
}

// Audio Synthesizer using Web Audio API (100% self-contained, no external audio files needed)

class SoundEngine {
  constructor() {
    this.ctx = null;
    this.ambientGain = null;
    this.sfxGain = null;
    this.masterGain = null;
    this.isMuted = false;
    this.ambientPlaying = false;
    this.captionsEnabled = true;
    this.captionCallback = null;
    this.windNode = null;
    this.birdTimer = null;
    this.volumes = {
      master: 0.8,
      sfx: 0.8,
      ambient: 0.4
    };
  }

  init() {
    if (this.ctx) return;
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    this.ctx = new AudioContext();

    this.masterGain = this.ctx.createGain();
    this.masterGain.gain.value = this.volumes.master;
    this.masterGain.connect(this.ctx.destination);

    this.sfxGain = this.ctx.createGain();
    this.sfxGain.gain.value = this.volumes.sfx;
    this.sfxGain.connect(this.masterGain);

    this.ambientGain = this.ctx.createGain();
    this.ambientGain.gain.value = this.volumes.ambient;
    this.ambientGain.connect(this.masterGain);
  }

  resume() {
    if (!this.ctx) this.init();
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  setCaptionCallback(cb) {
    this.captionCallback = cb;
  }

  showCaption(text, icon = '🔊') {
    if (this.captionsEnabled && this.captionCallback) {
      this.captionCallback({ text, icon });
    }
  }

  setVolumes({ master, sfx, ambient }) {
    if (master !== undefined) {
      this.volumes.master = master;
      if (this.masterGain) this.masterGain.gain.value = this.isMuted ? 0 : master;
    }
    if (sfx !== undefined) {
      this.volumes.sfx = sfx;
      if (this.sfxGain) this.sfxGain.gain.value = sfx;
    }
    if (ambient !== undefined) {
      this.volumes.ambient = ambient;
      if (this.ambientGain) this.ambientGain.gain.value = ambient;
    }
  }

  toggleMute() {
    this.isMuted = !this.isMuted;
    if (this.masterGain) {
      this.masterGain.gain.value = this.isMuted ? 0 : this.volumes.master;
    }
    return this.isMuted;
  }

  startMountainAmbience() {
    this.resume();
    if (!this.ctx || this.ambientPlaying) return;
    this.ambientPlaying = true;

    // Mountain wind (filtered pink/brown noise)
    const bufferSize = this.ctx.sampleRate * 2;
    const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    let lastOut = 0.0;
    for (let i = 0; i < bufferSize; i++) {
      const white = Math.random() * 2 - 1;
      output[i] = (lastOut + 0.02 * white) / 1.02;
      lastOut = output[i];
      output[i] *= 1.5;
    }

    const whiteNoise = this.ctx.createBufferSource();
    whiteNoise.buffer = noiseBuffer;
    whiteNoise.loop = true;

    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 320;
    filter.Q.value = 3.0;

    // Gentle LFO for wind gusting
    const lfo = this.ctx.createOscillator();
    lfo.frequency.value = 0.15; // slow gust
    const lfoGain = this.ctx.createGain();
    lfoGain.gain.value = 180;
    lfo.connect(lfoGain);
    lfoGain.connect(filter.frequency);
    lfo.start();

    whiteNoise.connect(filter);
    filter.connect(this.ambientGain);
    whiteNoise.start();
    this.windNode = whiteNoise;

    // Occasional gentle mountain bird chirps
    this.scheduleNextBird();
  }

  scheduleNextBird() {
    const delay = 6000 + Math.random() * 8000;
    this.birdTimer = setTimeout(() => {
      if (this.ambientPlaying && !this.isMuted) {
        this.playBirdChirp();
      }
      this.scheduleNextBird();
    }, delay);
  }

  playBirdChirp() {
    if (!this.ctx || this.isMuted) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';

    // Bird chirp pitch envelope
    const baseFreq = 2200 + Math.random() * 600;
    osc.frequency.setValueAtTime(baseFreq, now);
    osc.frequency.exponentialRampToValueAtTime(baseFreq + 800, now + 0.08);
    osc.frequency.exponentialRampToValueAtTime(baseFreq - 200, now + 0.18);

    gain.gain.setValueAtTime(0.01, now);
    gain.gain.linearRampToValueAtTime(0.06, now + 0.04);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

    osc.connect(gain);
    gain.connect(this.ambientGain);

    osc.start(now);
    osc.stop(now + 0.25);
  }

  playClick() {
    this.resume();
    if (!this.ctx || this.isMuted) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(540, now);
    osc.frequency.exponentialRampToValueAtTime(180, now + 0.05);

    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

    osc.connect(gain);
    gain.connect(this.sfxGain);
    osc.start(now);
    osc.stop(now + 0.06);
  }

  playSnap() {
    this.resume();
    if (!this.ctx || this.isMuted) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(400, now);
    osc.frequency.exponentialRampToValueAtTime(80, now + 0.07);

    gain.gain.setValueAtTime(0.18, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

    osc.connect(gain);
    gain.connect(this.sfxGain);
    osc.start(now);
    osc.stop(now + 0.08);
    this.showCaption('اتصال قطعه چوبی', '🪵');
  }

  playRopeTension() {
    this.resume();
    if (!this.ctx || this.isMuted) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(140, now);
    osc.frequency.linearRampToValueAtTime(260, now + 0.15);
    osc.frequency.linearRampToValueAtTime(210, now + 0.3);

    const filter = this.ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 600;
    filter.Q.value = 5;

    gain.gain.setValueAtTime(0.02, now);
    gain.gain.linearRampToValueAtTime(0.12, now + 0.1);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(this.sfxGain);
    osc.start(now);
    osc.stop(now + 0.36);
    this.showCaption('کشش طناب', '🪢');
  }

  playPulleyWhir() {
    this.resume();
    if (!this.ctx || this.isMuted) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(320, now);
    osc.frequency.linearRampToValueAtTime(480, now + 0.2);
    osc.frequency.linearRampToValueAtTime(360, now + 0.45);

    gain.gain.setValueAtTime(0.08, now);
    gain.gain.linearRampToValueAtTime(0.14, now + 0.1);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

    osc.connect(gain);
    gain.connect(this.sfxGain);
    osc.start(now);
    osc.stop(now + 0.52);
    this.showCaption('چرخش قرقره', '⚙️');
  }

  playRollingSound() {
    this.resume();
    if (!this.ctx || this.isMuted) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(90, now);
    osc.frequency.linearRampToValueAtTime(140, now + 0.3);
    osc.frequency.linearRampToValueAtTime(100, now + 0.6);

    gain.gain.setValueAtTime(0.02, now);
    gain.gain.linearRampToValueAtTime(0.15, now + 0.2);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);

    osc.connect(gain);
    gain.connect(this.sfxGain);
    osc.start(now);
    osc.stop(now + 0.75);
    this.showCaption('حرکت روان چرخ و غلتک', '🪵');
  }

  playHeavyGrind() {
    this.resume();
    if (!this.ctx || this.isMuted) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(65, now);
    osc.frequency.linearRampToValueAtTime(75, now + 0.3);

    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 240;

    gain.gain.setValueAtTime(0.05, now);
    gain.gain.linearRampToValueAtTime(0.18, now + 0.2);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(this.sfxGain);
    osc.start(now);
    osc.stop(now + 0.65);
    this.showCaption('اصطکاک شدید روی سنگ', '🪨');
  }

  playDiscoveryJingle() {
    this.resume();
    if (!this.ctx || this.isMuted) return;
    const now = this.ctx.currentTime;
    // Pentatonic celebratory chime (Dastgah inspired warm notes: D5, F#5, A5, B5, D6)
    const notes = [587.33, 739.99, 880.00, 987.77, 1174.66];
    notes.forEach((freq, idx) => {
      const noteOsc = this.ctx.createOscillator();
      const noteGain = this.ctx.createGain();
      const noteTime = now + idx * 0.1;

      noteOsc.type = 'sine';
      noteOsc.frequency.setValueAtTime(freq, noteTime);

      noteGain.gain.setValueAtTime(0.001, noteTime);
      noteGain.gain.linearRampToValueAtTime(0.16, noteTime + 0.02);
      noteGain.gain.exponentialRampToValueAtTime(0.0001, noteTime + 0.6);

      noteOsc.connect(noteGain);
      noteGain.connect(this.sfxGain);

      noteOsc.start(noteTime);
      noteOsc.stop(noteTime + 0.65);
    });
    this.showCaption('نوای موفقیت و کشف علمی!', '✨');
  }

  playGentleFanfare() {
    this.resume();
    if (!this.ctx || this.isMuted) return;
    const now = this.ctx.currentTime;
    const chord = [440, 554.37, 659.25, 880];
    chord.forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      const noteTime = now + idx * 0.08;

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, noteTime);

      gain.gain.setValueAtTime(0.001, noteTime);
      gain.gain.linearRampToValueAtTime(0.12, noteTime + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.0001, noteTime + 1.2);

      osc.connect(gain);
      gain.connect(this.sfxGain);

      osc.start(noteTime);
      osc.stop(noteTime + 1.25);
    });
    this.showCaption('رسیدن به درمانگاه کوهستان!', '🏔️');
  }
}
