/* ---------- نشانه‌های طراحی ---------- */
:root {
  --font: 'Vazirmatn', 'Segoe UI', Tahoma, system-ui, sans-serif;

  --sky-1: #dcf0fb;
  --sky-2: #eef6fb;
  --paper: #ffffff;
  --paper-2: #f6f8fb;
  --ink: #16283c;
  --ink-2: #4a627a;
  --ink-3: #7c93a8;
  --line: #d9e3ec;
  --line-strong: #b8c9d8;

  --primary: #0b6fa8;
  --primary-hover: #085b8c;
  --primary-soft: #e6f2fa;
  --primary-ink: #075172;
  --accent: #f0900c;
  --accent-soft: #fff2dc;
  --accent-ink: #a2560a;
  --ok: #10935f;
  --ok-soft: #e2f7ee;
  --warn: #cc7a00;
  --warn-soft: #fff4e0;
  --bad: #d33b4a;
  --bad-soft: #fdeaec;
  --violet: #7b5cd6;
  --violet-soft: #f0ecfd;

  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 18px;
  --r-xl: 24px;

  --sh-1: 0 1px 2px rgba(16, 40, 60, .06), 0 2px 8px rgba(16, 40, 60, .05);
  --sh-2: 0 4px 12px rgba(16, 40, 60, .09), 0 12px 32px rgba(16, 40, 60, .07);
  --sh-3: 0 18px 48px rgba(16, 40, 60, .22);

  --topbar-h: 62px;
  --ease: cubic-bezier(.34, 1.3, .64, 1);
}

/* اگر هنوز تمی انتخاب نشده، از تنظیم سیستم کاربر پیروی می‌کنیم */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky-1: #0d1a26; --sky-2: #0a141d; --paper: #132433; --paper-2: #0f1d29;
    --ink: #e8f1f8; --ink-2: #a8becf; --ink-3: #7690a5; --line: #24394c; --line-strong: #365167;
    --primary: #3ba3e0; --primary-hover: #58b4ea; --primary-soft: #11303f; --primary-ink: #9ad6fb;
    --accent: #fbb03b; --accent-soft: #3d2d10; --accent-ink: #fcd08a;
    --ok: #3ed99b; --ok-soft: #10352a; --warn: #f2b23c; --warn-soft: #3a2c12;
    --bad: #ff7b8a; --bad-soft: #401a22; --violet: #a891f5; --violet-soft: #241d3f;
    --sh-1: 0 1px 2px rgba(0, 0, 0, .3);
    --sh-2: 0 6px 18px rgba(0, 0, 0, .4);
    --sh-3: 0 20px 50px rgba(0, 0, 0, .6);
  }
}

[data-theme="dark"] {
  --sky-1: #0d1a26;
  --sky-2: #0a141d;
  --paper: #132433;
  --paper-2: #0f1d29;
  --ink: #e8f1f8;
  --ink-2: #a8becf;
  --ink-3: #7690a5;
  --line: #24394c;
  --line-strong: #365167;

  --primary: #3ba3e0;
  --primary-hover: #58b4ea;
  --primary-soft: #11303f;
  --primary-ink: #9ad6fb;
  --accent: #fbb03b;
  --accent-soft: #3d2d10;
  --accent-ink: #fcd08a;
  --ok: #3ed99b;
  --ok-soft: #10352a;
  --warn: #f2b23c;
  --warn-soft: #3a2c12;
  --bad: #ff7b8a;
  --bad-soft: #401a22;
  --violet: #a891f5;
  --violet-soft: #241d3f;

  --sh-1: 0 1px 2px rgba(0, 0, 0, .3);
  --sh-2: 0 6px 18px rgba(0, 0, 0, .4);
  --sh-3: 0 20px 50px rgba(0, 0, 0, .6);
}

[data-contrast="high"] {
  --paper: #fff;
  --paper-2: #fff;
  --sky-1: #fff;
  --sky-2: #fff;
  --ink: #000;
  --ink-2: #000;
  --ink-3: #1c1c1c;
  --line: #000;
  --line-strong: #000;
  --primary: #00407a;
  --primary-soft: #fff;
  --primary-ink: #00325e;
  --accent: #8a4b00;
  --accent-soft: #fff;
  --accent-ink: #6b3a00;
  --ok: #045c39;
  --ok-soft: #fff;
  --warn: #7a4a00;
  --warn-soft: #fff;
  --bad: #9b0d1c;
  --bad-soft: #fff;
  --violet: #3d2a80;
  --violet-soft: #fff;
  --sh-1: none;
  --sh-2: none;
  --sh-3: 0 0 0 3px #000;
}
[data-contrast="high"] .card,
[data-contrast="high"] .chip,
[data-contrast="high"] .btn,
[data-contrast="high"] .hud-chip,
[data-contrast="high"] .iconbtn,
[data-contrast="high"] .tab { border-width: 2px; }

/* ---------- پایه ---------- */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.65;
  color: var(--ink);
  background: var(--paper-2);
  display: grid;
  grid-template-rows: auto auto minmax(0, 1fr);
  -webkit-text-size-adjust: 100%;
}

h1, h2, h3 { line-height: 1.35; font-weight: 800; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.skip-link {
  position: absolute; inset-inline-start: 12px; top: -60px; z-index: 200;
  background: var(--primary); color: #fff; padding: 10px 16px;
  border-radius: 0 0 var(--r-md) var(--r-md); text-decoration: none; font-weight: 700;
}
.skip-link:focus { top: 0; }
.muted { color: var(--ink-3); font-size: .85rem; }

/* ═══════════ نوار بالا ═══════════ */
.topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 9px clamp(12px, 2vw, 22px);
  background: var(--paper);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark {
  font-size: 22px; line-height: 1;
  background: var(--primary-soft); border: 1px solid var(--line);
  border-radius: var(--r-md); padding: 6px 9px;
}
.brand h1 { font-size: 1.02rem; color: var(--primary-ink); white-space: nowrap; }
.brand p { font-size: .74rem; color: var(--ink-3); font-weight: 600; white-space: nowrap; }

.topbar-actions { display: flex; gap: 6px; margin-inline-start: auto; }
.iconbtn {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 12px; border-radius: var(--r-md);
  background: var(--paper-2); border: 1px solid var(--line);
  font-size: .84rem; font-weight: 700; color: var(--ink-2);
  transition: border-color .18s, color .18s;
}
.iconbtn:hover { border-color: var(--primary); color: var(--primary-ink); }

/* ═══════════ نوار انتخاب ماشین ═══════════ */
.machine-bar {
  display: flex; gap: 6px; overflow-x: auto;
  padding: 9px clamp(12px, 2vw, 22px);
  background: var(--paper); border-bottom: 1px solid var(--line);
  scrollbar-width: thin;
}
.chip {
  display: inline-flex; align-items: center; gap: 7px; flex: 0 0 auto;
  padding: 7px 13px; border-radius: 999px;
  background: var(--paper-2); border: 1px solid var(--line);
  font-size: .85rem; font-weight: 700; color: var(--ink-2);
  white-space: nowrap; transition: all .16s;
}
.chip:hover { border-color: var(--primary); color: var(--primary-ink); }
.chip.is-active {
  background: var(--primary); border-color: var(--primary); color: #fff;
}
.chip kbd {
  font-family: inherit; font-size: .68rem; font-weight: 700;
  background: color-mix(in srgb, currentColor 14%, transparent);
  border-radius: 4px; padding: 0 4px; opacity: .8;
}

/* ═══════════ چیدمان ═══════════ */
.workspace {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(360px, .9fr);
  gap: 14px;
  padding: 14px clamp(12px, 2vw, 22px) 16px;
  max-width: 1720px; width: 100%; margin: 0 auto;
  min-height: 0;
}

.stage { display: flex; flex-direction: column; gap: 10px; min-height: 0; min-width: 0; }
.stage > * { min-width: 0; }

.stage-canvas-wrap {
  position: relative; flex: 1; min-height: 320px;
  border-radius: var(--r-lg); overflow: hidden;
  border: 1px solid var(--line-strong);
  background: var(--paper);
}
#stageCanvas { display: block; width: 100%; max-width: 100%; height: 100%; touch-action: none; }

.stage-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sep { flex: 1; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 10px 18px; border-radius: var(--r-md);
  font-weight: 800; font-size: .9rem; border: 1px solid transparent;
  transition: transform .14s, background .18s, border-color .18s;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--primary); color: #fff; min-width: 150px; }
.btn-primary:hover { background: var(--primary-hover, var(--primary-ink)); }
.btn-primary:disabled { opacity: .55; cursor: default; }
.btn-ghost { background: var(--paper); border-color: var(--line); color: var(--ink-2); }
.btn-ghost:hover { border-color: var(--line-strong); }
.btn-quiet {
  background: var(--paper-2); border-color: var(--line); color: var(--ink-2);
  padding: 7px 14px; font-size: .82rem; font-weight: 700;
}
.btn-quiet:hover { border-color: var(--primary); color: var(--primary-ink); }
.btn-toggle {
  background: var(--paper); border-color: var(--line); color: var(--ink-2);
  padding: 9px 13px; font-size: .82rem;
}
.btn-toggle[aria-pressed="true"] {
  background: var(--primary-soft); border-color: var(--primary); color: var(--primary-ink);
}

/* ═══════════ پنل کناری ═══════════ */
.sidepanel {
  display: flex; flex-direction: column; gap: 12px;
  overflow-y: auto; overscroll-behavior: contain;
  padding-inline-end: 4px; min-height: 0; min-width: 0;
  scrollbar-width: thin;
}
.sidepanel::-webkit-scrollbar { width: 8px; }
.sidepanel::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 99px; }

.card { flex: 0 0 auto; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.card-title {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  width: 100%; text-align: start;
  font-size: .9rem; font-weight: 800; color: var(--ink);
  padding: 12px 15px; border-bottom: 1px solid var(--line);
  background: var(--paper-2);
}
.card-title.is-toggle:hover { color: var(--primary-ink); }
.card-title .chev { transition: transform .2s; color: var(--ink-3); }
.card-title[aria-expanded="false"] .chev { transform: rotate(-90deg); }
.card-title[aria-expanded="false"] { border-bottom: none; }
.card-body { padding: 14px 15px; }

/* ---------- پارامترها ---------- */
.lab-row {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  padding-bottom: 12px; margin-bottom: 14px; border-bottom: 1px dashed var(--line);
}
.lab-label { display: block; font-size: .75rem; font-weight: 700; color: var(--ink-3); margin-bottom: 5px; }

.field { margin-bottom: 15px; }
.field:last-child { margin-bottom: 0; }
.field-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
.field-head label, .field-label { font-size: .84rem; font-weight: 700; color: var(--ink); }
.field-label { display: block; margin-bottom: 7px; }
.field-input { display: flex; align-items: center; gap: 5px; flex: 0 0 auto; }
.field-number {
  width: 78px; text-align: center;
  font-variant-numeric: tabular-nums; font-weight: 800; font-size: .88rem;
  color: var(--primary-ink); background: var(--primary-soft);
  border: 1px solid transparent; border-radius: var(--r-sm); padding: 3px 6px;
}
.field-number:hover { border-color: var(--primary); }
.field-number::-webkit-outer-spin-button, .field-number::-webkit-inner-spin-button { opacity: .5; }
.field-input .unit { font-size: .74rem; color: var(--ink-3); font-weight: 600; }

/* شیارِ لغزنده روی خود عنصر رسم می‌شود تا متغیرهای CSS همه‌جا کار کنند */
input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 20px; cursor: pointer;
  background-color: transparent;
  background-image: linear-gradient(to left, var(--primary) var(--fill, 50%), var(--line) var(--fill, 50%));
  background-size: 100% 6px; background-position: center; background-repeat: no-repeat;
  border-radius: 99px;
}
input[type="range"]::-webkit-slider-runnable-track { height: 6px; background: transparent; }
input[type="range"]::-moz-range-track { height: 6px; background: transparent; }
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 18px; height: 18px; border-radius: 50%; margin-top: -6px;
  background: var(--paper); border: 3px solid var(--primary); box-shadow: var(--sh-1);
}
input[type="range"]::-moz-range-thumb {
  width: 13px; height: 13px; border-radius: 50%;
  background: var(--paper); border: 3px solid var(--primary);
}

.segment { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: 6px; }
.segment.cols-2 { grid-template-columns: repeat(2, 1fr); }
.seg {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 6px; border-radius: var(--r-md); text-align: center;
  background: var(--paper-2); border: 1px solid var(--line);
  font-size: .79rem; font-weight: 700; color: var(--ink-2); line-height: 1.3;
  transition: all .16s;
}
.seg .seg-icon { font-size: 1.05rem; }
.seg .seg-sub { font-size: .68rem; font-weight: 600; color: var(--ink-3); }
.seg:hover { border-color: var(--primary); }
.seg.is-active { background: var(--primary); border-color: var(--primary); color: #fff; }
.seg.is-active .seg-sub { color: color-mix(in srgb, #fff 80%, transparent); }

.switch {
  display: flex; align-items: center; gap: 10px; cursor: pointer;
  background: var(--paper-2); border: 1px solid var(--line);
  border-radius: var(--r-md); padding: 9px 12px; font-size: .84rem; font-weight: 700;
}
.switch:hover { border-color: var(--primary); }
.switch input { position: absolute; opacity: 0; pointer-events: none; }
.switch .track {
  flex: 0 0 auto; width: 38px; height: 22px; border-radius: 99px;
  background: var(--line-strong); position: relative; transition: background .2s;
}
.switch .track::after {
  content: ''; position: absolute; top: 3px; inset-inline-end: 3px;
  width: 16px; height: 16px; border-radius: 50%; background: #fff;
  transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3);
}
.switch input:checked + .track { background: var(--ok); }
.switch input:checked + .track::after { transform: translateX(-16px); }
.switch input:focus-visible + .track { outline: 3px solid var(--accent); outline-offset: 2px; }
.switch .switch-sub { display: block; font-size: .73rem; font-weight: 600; color: var(--ink-3); }

/* ---------- جدول‌ها ---------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-md); }
table { border-collapse: collapse; width: 100%; font-size: .8rem; }
th, td { padding: 6px 9px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { background: var(--paper-2); font-weight: 800; color: var(--ink-3); font-size: .74rem; }
tbody tr:last-child td { border-bottom: none; }
td.wrap { white-space: normal; text-align: start; min-width: 140px; }
.row-end { display: flex; justify-content: flex-end; margin-top: 9px; }

.q-table td { font-variant-numeric: tabular-nums; }
.q-table .q-name { text-align: start; color: var(--ink-2); white-space: normal; }
.q-table .q-sym { font-weight: 700; color: var(--ink-3); direction: ltr; }
.q-table .q-val { font-weight: 800; font-size: .95rem; }
.q-table .q-unit { color: var(--ink-3); font-size: .74rem; }
.q-table tr.t-primary .q-val { color: var(--primary-ink); }
.q-table tr.t-effort .q-val { color: var(--accent-ink); }
.q-table tr.t-accent .q-val { color: var(--violet); }
.q-table tr.t-ok .q-val { color: var(--ok); }
.q-table tr.t-effort { background: color-mix(in srgb, var(--accent-soft) 60%, transparent); }

.insight {
  margin-top: 11px; font-size: .84rem; line-height: 1.7; color: var(--ink-2);
  background: var(--primary-soft); border-inline-start: 3px solid var(--primary);
  border-radius: var(--r-sm); padding: 9px 12px;
}
.t-empty { font-size: .84rem; color: var(--ink-3); line-height: 1.7; }

/* ---------- محاسبهٔ گام‌به‌گام ---------- */
.steps { list-style: none; counter-reset: st; display: flex; flex-direction: column; gap: 10px; }
.steps li {
  counter-increment: st; position: relative;
  padding: 9px 12px 9px 12px; padding-inline-start: 38px;
  background: var(--paper-2); border: 1px solid var(--line); border-radius: var(--r-md);
}
.steps li::before {
  content: counter(st); position: absolute; inset-inline-start: 10px; top: 9px;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--primary); color: #fff;
  font-size: .7rem; font-weight: 800;
  display: grid; place-items: center;
}
.st-name { font-size: .8rem; font-weight: 700; color: var(--ink-2); }
.st-formula {
  direction: ltr; text-align: left; font-family: Consolas, 'Courier New', monospace;
  font-size: .84rem; font-weight: 700; color: var(--primary-ink); margin-top: 2px;
}
.st-work { direction: ltr; text-align: left; font-size: .84rem; margin-top: 1px; font-variant-numeric: tabular-nums; }
.st-work .st-sub { color: var(--ink-3); }
.st-work b { color: var(--ink); font-size: .95rem; }
.st-work .st-unit { color: var(--ink-3); font-size: .76rem; }
.st-note { font-size: .76rem; color: var(--ink-3); margin-top: 4px; line-height: 1.6; }

.chart { width: 100%; height: 160px; display: block; }

/* ═══════════ پنجره ═══════════ */
.modal { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px; }
.modal[hidden] { display: none; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(10, 22, 34, .55); }
.modal-card {
  position: relative; width: min(660px, 100%); max-height: 88vh;
  display: flex; flex-direction: column;
  background: var(--paper); border: 1px solid var(--line);
  border-radius: var(--r-lg); box-shadow: var(--sh-3);
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 18px; border-bottom: 1px solid var(--line);
}
.modal-head h2 { font-size: 1.02rem; color: var(--primary-ink); }
.modal-close {
  width: 32px; height: 32px; border-radius: 50%; flex: 0 0 auto;
  background: var(--paper-2); border: 1px solid var(--line);
  display: grid; place-items: center; color: var(--ink-2);
}
.modal-body { padding: 16px 18px 20px; overflow-y: auto; }
.modal-body > * + * { margin-top: 12px; }
.modal-body h3 { font-size: .93rem; color: var(--ink); }
.modal-body p, .modal-body li { font-size: .85rem; color: var(--ink-2); line-height: 1.75; }
.modal-body ul { padding-inline-start: 20px; }

/* ═══════════ واکنش‌گرایی ═══════════ */
@media (max-width: 1100px) {
  body { grid-template-rows: auto auto auto; }
  .workspace { grid-template-columns: 1fr; }
  .stage-canvas-wrap { aspect-ratio: 16 / 10; flex: none; min-height: 0; }
  .sidepanel { overflow: visible; }
}

@media (max-width: 720px) {
  body { font-size: 14px; }
  .topbar { padding: 8px 12px; }
  .brand p { display: none; }
  .iconbtn-text { display: none; }
  .workspace { padding: 10px; gap: 12px; }
  .stage-canvas-wrap { aspect-ratio: 4 / 3; }
  .sep { display: none; }
  .btn-primary { flex: 2 1 150px; min-width: 0; }
  .btn-ghost { flex: 1 1 92px; }
  .btn-toggle { flex: 1 1 116px; }
  .lab-row { grid-template-columns: 1fr; }
  .chip kbd { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

@media print {
  .topbar, .machine-bar, .stage-actions, .modal, .skip-link { display: none !important; }
  .workspace { grid-template-columns: 1fr; }
}

/* در نسخهٔ تک‌فایلی، ریشهٔ سند ممکن است در اختیار ما نباشد */
html, body { direction: rtl; }
</style>
</head>
<body>

<a class="skip-link" href="#stage">پرش به محیط آزمایش</a>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">📐</span>
    <div>
      <h1>آزمایشگاه ماشین‌های ساده</h1>
      <p>اندازه‌گیری نیرو، مزیت مکانیکی، کار و بازده</p>
    </div>
  </div>
  <div class="topbar-actions">
    <button class="iconbtn" id="btnTheme" aria-label="تغییر تم روشن و تیره" title="تم روشن / تیره"><span aria-hidden="true">◐</span></button>
    <button class="iconbtn" id="btnReport" title="گزارش قابل چاپ">
      <span aria-hidden="true">🖨</span><span class="iconbtn-text">گزارش</span>
    </button>
    <button class="iconbtn" id="btnHelp" title="راهنما و میان‌برها">
      <span aria-hidden="true">؟</span><span class="iconbtn-text">راهنما</span>
    </button>
  </div>
</header>

<nav class="machine-bar" id="machineBar" aria-label="انتخاب ماشین ساده"></nav>

<main class="workspace">
  <section class="stage" id="stage" aria-label="محیط آزمایش">
    <div class="stage-canvas-wrap">
      <canvas id="stageCanvas" role="img" aria-label="نمای آزمایش"></canvas>
    </div>
    <div class="stage-actions">
      <button class="btn btn-primary" id="btnRun"><span aria-hidden="true">▶</span><span id="btnRunText">اجرای حرکت</span></button>
      <button class="btn btn-ghost" id="btnReset"><span aria-hidden="true">↺</span><span>بازنشانی</span></button>
      <span class="sep" aria-hidden="true"></span>
      <button class="btn btn-toggle" id="btnVectors" aria-pressed="false"><span aria-hidden="true">→</span><span class="btn-text">بردارهای نیرو</span></button>
      <button class="btn btn-toggle" id="btnDims" aria-pressed="true"><span aria-hidden="true">⇤⇥</span><span class="btn-text">خط‌های اندازه</span></button>
      <button class="btn btn-toggle" id="btnSlow" aria-pressed="false"><span aria-hidden="true">🐢</span><span class="btn-text">آهسته</span></button>
    </div>
  </section>

  <aside class="sidepanel" id="sidepanel" aria-label="پارامترها و اندازه‌گیری‌ها"></aside>
</main>

<div class="modal" id="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <header class="modal-head">
      <h2 id="modalTitle"></h2>

// قالب‌بندی اعداد و متن فارسی
const PERSIAN_DIGITS = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];

/** تبدیل ارقام لاتین به فارسی (و نقطه اعشار به ممیز فارسی) */
function fa(value) {
  if (value === null || value === undefined || value === '') return '';
  return String(value)
    .replace(/[0-9]/g, (d) => PERSIAN_DIGITS[+d])
    .replace(/\./g, '٫');
}

/** تبدیل رشتهٔ فارسی/عربی به عدد (برای کادرهای ورودی) */
function parseFa(str) {
  if (typeof str === 'number') return str;
  const normalized = String(str)
    .replace(/[۰-۹]/g, (d) => String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d)))
    .replace(/[٠-٩]/g, (d) => String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)))
    .replace(/[٫،]/g, '.')
    .replace(/[^\d.\-]/g, '');
  const n = Number(normalized);
  return Number.isFinite(n) ? n : NaN;
}

/** گرد کردن هوشمند: اعداد بزرگ بدون اعشار، اعداد کوچک با یک/دو رقم اعشار */
function round(value, digits) {
  if (!Number.isFinite(value)) return 0;
  if (digits === undefined) {
    if (Math.abs(value) >= 100) digits = 0;
    else if (Math.abs(value) >= 10) digits = 1;
    else digits = 2;
  }
  const f = 10 ** digits;
  const r = Math.round(value * f) / f;
  return Object.is(r, -0) ? 0 : r;
}

/** عدد آمادهٔ نمایش: گرد شده + ارقام فارسی */
function num(value, digits) {
  return fa(String(round(value, digits)));
}

/** محدود کردن یک مقدار بین کمینه و بیشینه */
function clamp(value, min, max) {
  return Math.min(max, Math.max(min, value));
}

/** درون‌یابی خطی */
function lerp(a, b, t) {
  return a + (b - a) * t;
}

/** نگاشت بازه به بازه */
function mapRange(v, inMin, inMax, outMin, outMax) {
  if (inMax === inMin) return outMin;
  return outMin + ((v - inMin) / (inMax - inMin)) * (outMax - outMin);
}

/** نرم‌کنندهٔ حرکت برای انیمیشن */
function easeInOut(t) {
  return t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;
}

/** حذف کاراکترهای خطرناک پیش از درج در HTML */
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

// موتور فیزیک ماشین‌های ساده — قطعی، قابل تست و مستقل از رابط کاربری
//
// همهٔ توابع یک «نتیجهٔ استاندارد» برمی‌گردانند تا رابط کاربری و رندرر
// بتوانند بدون دانستن نوع ماشین با آن کار کنند:
//
//   loadN            وزن (یا نیروی مقاومِ) باری که باید بر آن غلبه کنیم
//   effortIdealN     نیروی لازم در حالت آرمانی (بدون اصطکاک)
//   frictionN        سهم اصطکاک از نیروی لازم
//   effortN          نیروی واقعی لازم = آرمانی + اصطکاک

//   maActual         مزیت مکانیکی واقعی = loadN / effortN
//   efficiency       بازده = maActual / maIdeal  (بین ۰ و ۱)
//   loadDistanceM    مسافتی که بار جابه‌جا می‌شود
//   effortDistanceM  مسافتی که دست ما باید طی کند
//   workOutJ         کار مفید = loadN × loadDistanceM
//   workInJ          کار انجام‌شده توسط ما = effortN × effortDistanceM
//   geom             داده‌های هندسی مورد نیاز رندرر
//   insightFa        جمله‌ای که نتیجهٔ علمی آزمایش را توضیح می‌دهد

/**
 * تنظیم‌های سراسری آزمایشگاه که آموزگار انتخاب می‌کند.
 *   g     شتاب گرانش (۱۰ برای محاسبهٔ کلاسی، ۹٫۸۱ برای مقدار واقعی)
 *   ideal اگر روشن باشد، همهٔ اصطکاک‌ها صفر فرض می‌شوند (ماشین آرمانی)
 */
const LAB = { g: G, ideal: false };

function setLab({ g, ideal }) {
  if (typeof g === 'number' && g > 0) LAB.g = g;
  if (typeof ideal === 'boolean') LAB.ideal = ideal;
  return LAB;
}

/** ضریب اصطکاک مؤثر با توجه به حالت آرمانی */
const mu = (surface) => (LAB.ideal ? 0 : surface.mu);
/** بازدهٔ مؤثر با توجه به حالت آرمانی */
const eff = (value) => (LAB.ideal ? 1 : value);

/** فهرست ماشین‌های ساده‌ای که آزمایشگاه پشتیبانی می‌کند */
const MACHINE_IDS = [
  'FRICTION', 'INCLINED_PLANE', 'LEVER', 'PULLEY',

];

const MACHINES = {

  INCLINED_PLANE: { id: 'INCLINED_PLANE', name: 'سطح شیب‌دار',        short: 'سطح شیب‌دار', icon: '📐', color: '#0ea5e9' },

  WHEEL_AXLE:     { id: 'WHEEL_AXLE',     name: 'چرخ و محور',         short: 'چرخ و محور',  icon: '🎡',  color: '#ec4899' },
  WEDGE:          { id: 'WEDGE',          name: 'گُوِه',               short: 'گوه',         icon: '🔺',  color: '#ef4444' },

  GEARS:          { id: 'GEARS',          name: 'چرخ‌دنده‌ها',         short: 'چرخ‌دنده',    icon: '⚙️',  color: '#14b8a6' }
};

// ————————————————————————————————————————————————————————
// کمکی‌ها

function finish(result) {
  const out = {
    ...result,
    g: LAB.g,
    ideal: LAB.ideal,
    // کار مفید و کار ورودی (پایستگی انرژی: کار ورودی همیشه ≥ کار مفید)
    workOutJ: result.workOutJ ?? (result.loadN * result.loadDistanceM),
    workInJ: result.workInJ ?? (result.effortN * result.effortDistanceM)
  };
  out.energyLostJ = Math.max(0, out.workInJ - out.workOutJ);
  return roundResult(out);
}

function roundResult(r) {
  const numericKeys = [
    'loadN', 'effortIdealN', 'frictionN', 'effortN', 'maIdeal', 'maActual',
    'efficiency', 'loadDistanceM', 'effortDistanceM', 'workOutJ', 'workInJ', 'energyLostJ'
  ];
  for (const k of numericKeys) {
    if (typeof r[k] === 'number') r[k] = round(r[k]);
  }
  return r;
}

function surfaceOf(surfaceId, useRollers) {
  if (useRollers) return ROLLERS;
  return SURFACES[surfaceId] || SURFACES.ROUGH_STONE;
}

// ————————————————————————————————————————————————————————
// ۱) اصطکاک، چرخ و غلتک — کشیدن بار روی سطح افقی
// ————————————————————————————————————————————————————————

function friction({
  massKg = 50,
  surfaceId = 'ROUGH_STONE',
  useRollers = false,
  distanceM = 6
} = {}) {
  const surface = surfaceOf(surfaceId, useRollers);
  const loadN = massKg * LAB.g;
  // روی سطح افقی، تمام نیروی لازم صرف غلبه بر اصطکاک می‌شود
  const effortN = loadN * mu(surface);

  const baseline = loadN * SURFACES.ROUGH_STONE.mu; // مقایسه با سنگ ناهموار
  const savedPercent = clamp(Math.round(((baseline - effortN) / baseline) * 100), 0, 100);

  return finish({
    machine: 'FRICTION',
    massKg,
    surface,
    useRollers,
    loadN,
    effortIdealN: 0,          // در حالت آرمانیِ بدون اصطکاک، نیرویی لازم نیست
    frictionN: effortN,
    effortN,
    maIdeal: null,            // چرخ و غلتک «مزیت مکانیکی» ندارند؛ اصطکاک را کم می‌کنند
    maActual: null,
    efficiency: null,
    loadDistanceM: distanceM,
    effortDistanceM: distanceM,
    workOutJ: 0,              // بار بالا نمی‌رود؛ همهٔ کار صرف اصطکاک می‌شود
    workInJ: effortN * distanceM,
    forceRatioPercent: Math.round((effortN / loadN) * 100),
    savedPercent,
    geom: { distanceM, mu: mu(surface) },
    insightFa: LAB.ideal
      ? 'در حالت آرمانی اصطکاکی وجود ندارد، پس برای ادامهٔ حرکتِ بار هیچ نیرویی لازم نیست (قانون اول نیوتون).'
      : useRollers
      ? 'غلتک‌ها اصطکاکِ مالشی را به اصطکاکِ غلتشی تبدیل کردند؛ نیروی لازم به کمترین مقدار رسید.'
      : surface.mu >= 0.5
        ? 'سطحِ زبر، اصطکاکِ زیادی می‌سازد؛ نیروی لازم نزدیک به وزن بار است.'
        : 'صاف‌تر شدن سطح، اصطکاک را کم کرد؛ اما غلتک از این هم بهتر عمل می‌کند.'
  });
}

// ————————————————————————————————————————————————————————
// ۲) سطح شیب‌دار
// ————————————————————————————————————————————————————————

function inclinedPlane({
  massKg = 50,
  heightM = 2,
  lengthM = 4,
  surfaceId = 'WOOD_PLANKS',
  useRollers = false
} = {}) {
  const surface = surfaceOf(surfaceId, useRollers);
  const loadN = massKg * LAB.g;

  // طول رمپ هرگز نمی‌تواند از ارتفاع کمتر باشد
  const L = Math.max(heightM * 1.02, lengthM);
  const sin = heightM / L;
  const cos = Math.sqrt(Math.max(0, 1 - sin * sin));
  const angleDeg = round((Math.asin(clamp(sin, 0, 1)) * 180) / Math.PI, 0);

  const effortIdealN = loadN * sin;               // مؤلفهٔ وزن در راستای شیب
  const frictionN = loadN * cos * mu(surface);   // اصطکاک در راستای شیب
  const effortN = effortIdealN + frictionN;

  const maIdeal = L / heightM;
  const maActual = loadN / effortN;

  return finish({
    machine: 'INCLINED_PLANE',
    massKg,
    surface,
    useRollers,
    loadN,
    effortIdealN,
    frictionN,
    effortN,
    maIdeal,
    maActual,
    efficiency: maActual / maIdeal,
    loadDistanceM: heightM,        // بار به اندازهٔ ارتفاع بالا می‌رود
    effortDistanceM: L,            // ولی ما در طول کل رمپ آن را می‌کشیم
    angleDeg,
    heightM,
    lengthM: L,
    directLiftN: loadN,
    savedPercent: clamp(Math.round(((loadN - effortN) / loadN) * 100), 0, 100),
    geom: { heightM, lengthM: L, angleDeg, sin, cos, mu: mu(surface) },
    insightFa: angleDeg <= 20
      ? 'شیب ملایم شد: نیروی لازم کم است، اما مسیر درازتری را باید طی کنیم.'
      : angleDeg >= 45
        ? 'شیب خیلی تند است؛ نیروی لازم تقریباً به اندازهٔ بلند کردن مستقیم بار شد.'
        : 'با درازتر کردن رمپ، نیرو کمتر و مسافت بیشتر می‌شود؛ کار انجام‌شده تقریباً ثابت می‌ماند.'
  });
}

/** تشخیص نوع اهرم از روی ترتیب تکیه‌گاه، بار و نیرو */
function leverClass(fulcrumM, loadM, effortM) {
  const between = (x, a, b) => x > Math.min(a, b) && x < Math.max(a, b);
  if (between(fulcrumM, loadM, effortM)) {
    return { type: 1, name: 'اهرم نوع اول', desc: 'تکیه‌گاه بین بار و نیرو است — مانند الاکلنگ، قیچی و دیلم.' };
  }
  if (between(loadM, fulcrumM, effortM)) {
    return { type: 2, name: 'اهرم نوع دوم', desc: 'بار بین تکیه‌گاه و نیرو است — مانند فرغون و دربازکن.' };
  }
  return { type: 3, name: 'اهرم نوع سوم', desc: 'نیرو بین تکیه‌گاه و بار است — مانند انبرک و ساعد دست؛ نیرو بیشتر می‌شود ولی سرعت و مسافتِ بار زیاد.' };
}

function lever({
  massKg = 80,
  beamLengthM = 3,
  fulcrumM = 1,
  loadM = 0.3,
  effortM = 3,
  liftHeightM = 0.3
} = {}) {
  const loadN = massKg * LAB.g;

  const loadArmM = Math.max(0.05, Math.abs(fulcrumM - loadM));
  const effortArmM = Math.max(0.05, Math.abs(effortM - fulcrumM));

  // تعادل گشتاور:  W × d_بار = F × d_نیرو
  const effortIdealN = (loadN * loadArmM) / effortArmM;
  const effortN = effortIdealN / eff(LEVER_EFFICIENCY);
  const frictionN = effortN - effortIdealN;

  const maIdeal = effortArmM / loadArmM;
  const maActual = loadN / effortN;

  // بار به اندازهٔ liftHeightM بالا می‌رود ⇒ دست ما به همان نسبت بازوها پایین می‌آید
  const effortDistanceM = liftHeightM * maIdeal;

  return finish({
    machine: 'LEVER',
    massKg,
    loadN,
    effortIdealN,
    frictionN,
    effortN,
    maIdeal,
    maActual,
    efficiency: maActual / maIdeal,
    loadDistanceM: liftHeightM,
    effortDistanceM,
    loadArmM: round(loadArmM, 2),
    effortArmM: round(effortArmM, 2),
    leverClass: leverClass(fulcrumM, loadM, effortM),
    geom: { beamLengthM, fulcrumM, loadM, effortM, loadArmM, effortArmM, liftHeightM },
    insightFa: maIdeal >= 3
      ? 'بازوی نیرو چند برابر بازوی بار شد؛ با زور کم، بار سنگین بلند می‌شود (اما دستمان مسیر بیشتری پایین می‌رود).'
      : maIdeal >= 1
        ? 'اهرم کمی به ما کمک می‌کند؛ تکیه‌گاه را به بار نزدیک‌تر کن تا مزیت مکانیکی بیشتر شود.'
        : 'بازوی نیرو از بازوی بار کوتاه‌تر است؛ این اهرم نیرو را زیاد نمی‌کند، فقط بار را تندتر و بیشتر جابه‌جا می‌کند.'
  });
}

// ————————————————————————————————————————————————————————
// ۴) قرقره
// ————————————————————————————————————————————————————————

function pulley({
  massKg = 60,
  systemId = 'FIXED',
  liftHeightM = 4
} = {}) {
  const system = PULLEYS[systemId] || PULLEYS.FIXED;
  const loadN = massKg * LAB.g;

  const effortIdealN = loadN / system.strands;
  const efficiency = eff(SHEAVE_EFFICIENCY ** system.sheaves);
  const effortN = effortIdealN / efficiency;
  const frictionN = effortN - effortIdealN;

  const maIdeal = system.strands;
  const maActual = loadN / effortN;
  const ropeM = liftHeightM * system.strands;

  return finish({
    machine: 'PULLEY',
    massKg,
    system,
    loadN,
    effortIdealN,
    frictionN,
    effortN,
    maIdeal,
    maActual,
    efficiency: maActual / maIdeal,
    loadDistanceM: liftHeightM,
    effortDistanceM: ropeM,
    ropeM: round(ropeM, 1),
    strands: system.strands,
    changesDirection: system.changesDirection,
    savedPercent: clamp(Math.round(((loadN - effortN) / loadN) * 100), 0, 100),
    geom: { liftHeightM, strands: system.strands, sheaves: system.sheaves, movable: system.movable },
    insightFa: system.strands === 1
      ? (system.changesDirection
          ? 'قرقرهٔ ثابت فقط جهت نیرو را عوض کرد؛ عدد نیروسنج همان وزن بار ماند.'
          : 'بدون قرقره، تمام وزن بار روی دست ماست و باید رو به بالا زور بزنیم.')
      : `وزن بار بین ${system.strands} رشته طناب تقسیم شد؛ نیرو حدود یک‌${system.strands === 2 ? 'دوم' : system.strands === 3 ? 'سوم' : 'چهارم'} شد ولی باید ${system.strands} برابر طناب بکشیم.`
  });
}

// ————————————————————————————————————————————————————————
// ۵) چرخ و محور (چرخ‌چاه / وینچ)
// ————————————————————————————————————————————————————————

function wheelAxle({
  massKg = 40,
  wheelRadiusM = 0.5,
  axleRadiusM = 0.1,
  liftHeightM = 3
} = {}) {
  const loadN = massKg * LAB.g;
  const R = Math.max(axleRadiusM * 1.05, wheelRadiusM);
  const r = Math.max(0.02, axleRadiusM);

  const effortIdealN = (loadN * r) / R;
  const effortN = effortIdealN / eff(WHEEL_AXLE_EFFICIENCY);
  const frictionN = effortN - effortIdealN;

  const maIdeal = R / r;
  const maActual = loadN / effortN;
  const turns = liftHeightM / (2 * Math.PI * r);
  const handleTravelM = turns * 2 * Math.PI * R;

  return finish({
    machine: 'WHEEL_AXLE',
    massKg,
    loadN,
    effortIdealN,
    frictionN,
    effortN,
    maIdeal,
    maActual,
    efficiency: maActual / maIdeal,
    loadDistanceM: liftHeightM,
    effortDistanceM: handleTravelM,
    wheelRadiusM: R,
    axleRadiusM: r,
    turns: round(turns, 1),
    geom: { wheelRadiusM: R, axleRadiusM: r, liftHeightM, turns },
    insightFa: 'چرخ و محور یک اهرمِ چرخان است: شعاع چرخ نقشِ بازوی نیرو و شعاع محور نقشِ بازوی بار را دارد.'
  });
}

// ————————————————————————————————————————————————————————
// ۶) گوه (تبر، اسکنه، چاقو)
// ————————————————————————————————————————————————————————

function wedge({
  resistanceN = 900,
  lengthM = 0.24,
  thicknessM = 0.06
} = {}) {
  const L = Math.max(thicknessM * 1.05, lengthM);
  const t = Math.max(0.005, thicknessM);

  const effortIdealN = (resistanceN * t) / L;
  const effortN = effortIdealN / eff(WEDGE_EFFICIENCY);
  const frictionN = effortN - effortIdealN;

  const maIdeal = L / t;
  const maActual = resistanceN / effortN;

  return finish({
    machine: 'WEDGE',
    loadN: resistanceN,
    effortIdealN,
    frictionN,
    effortN,
    maIdeal,
    maActual,
    efficiency: maActual / maIdeal,
    loadDistanceM: t,       // چوب به اندازهٔ ضخامت گوه از هم باز می‌شود
    effortDistanceM: L,     // ولی گوه باید تمام طولش فرو برود
    lengthM: L,
    thicknessM: t,
    geom: { lengthM: L, thicknessM: t },
    insightFa: 'گوه در واقع یک سطح شیب‌دارِ متحرک است: هرچه باریک‌تر و بلندتر باشد، با ضربهٔ کم‌تری چوب را می‌شکافد.'
  });
}

// ————————————————————————————————————————————————————————
// ۷) پیچ (جک پیچی)
// ————————————————————————————————————————————————————————

function screw({
  massKg = 300,
  pitchM = 0.01,
  handleRadiusM = 0.35,
  liftHeightM = 0.2
} = {}) {
  const loadN = massKg * LAB.g;
  const p = Math.max(0.002, pitchM);
  const R = Math.max(0.05, handleRadiusM);

  const circumference = 2 * Math.PI * R;
  const effortIdealN = (loadN * p) / circumference;
  const effortN = effortIdealN / eff(SCREW_EFFICIENCY);
  const frictionN = effortN - effortIdealN;

  const maIdeal = circumference / p;
  const maActual = loadN / effortN;
  const turns = liftHeightM / p;

  return finish({
    machine: 'SCREW',
    massKg,
    loadN,
    effortIdealN,
    frictionN,
    effortN,
    maIdeal,
    maActual,
    efficiency: maActual / maIdeal,
    loadDistanceM: liftHeightM,
    effortDistanceM: turns * circumference,
    pitchM: p,
    handleRadiusM: R,
    turns: round(turns, 0),
    geom: { pitchM: p, handleRadiusM: R, liftHeightM, turns },
    insightFa: 'پیچ یک سطح شیب‌دار است که دور یک استوانه پیچیده شده؛ گام کوچک‌تر یعنی شیب ملایم‌تر و نیروی کمتر، اما تعداد چرخش بیشتر.'
  });
}

// ————————————————————————————————————————————————————————
// ۸) چرخ‌دنده‌ها (دادوستد گشتاور و سرعت)
// ————————————————————————————————————————————————————————

function gears({
  driverTeeth = 12,
  drivenTeeth = 36,
  inputTorqueNm = 10,
  inputRpm = 60
} = {}) {
  const z1 = Math.max(6, Math.round(driverTeeth));
  const z2 = Math.max(6, Math.round(drivenTeeth));
  const ratio = z2 / z1;

  const outputTorqueNm = inputTorqueNm * ratio * eff(GEAR_EFFICIENCY);
  const outputRpm = inputRpm / ratio;

  return roundResult({
    machine: 'GEARS',
    driverTeeth: z1,
    drivenTeeth: z2,
    ratio: round(ratio, 2),
    inputTorqueNm,
    outputTorqueNm: round(outputTorqueNm, 1),
    inputRpm,
    outputRpm: round(outputRpm, 1),
    efficiency: eff(GEAR_EFFICIENCY),
    reversesDirection: true,
    geom: { z1, z2, ratio },
    insightFa: ratio > 1
      ? 'چرخ‌دندهٔ بزرگ‌تر کندتر می‌چرخد ولی گشتاور (قدرتِ چرخاندن) بیشتری دارد — درست مثل دنده‌سنگین دوچرخه در سربالایی.'
      : ratio < 1
        ? 'چرخ‌دندهٔ کوچک‌تر تندتر می‌چرخد ولی گشتاورش کمتر است — مثل دنده‌سبک دوچرخه در سرازیری.'
        : 'با تعداد دندانهٔ برابر، سرعت و گشتاور تغییری نمی‌کند؛ فقط جهت چرخش برعکس می‌شود.'
  });
}

// ————————————————————————————————————————————————————————
// حل‌کنندهٔ یکپارچه
// ————————————————————————————————————————————————————————

const SOLVERS = {
  FRICTION: friction,
  INCLINED_PLANE: inclinedPlane,
  LEVER: lever,
  PULLEY: pulley,
  WHEEL_AXLE: wheelAxle,
  WEDGE: wedge,
  SCREW: screw,
  GEARS: gears
};

/** محاسبهٔ نتیجهٔ هر ماشین از روی شناسه و پارامترها */
function solve(machineId, params = {}) {
  const fn = SOLVERS[machineId];
  if (!fn) throw new Error(`ماشین ناشناخته: ${machineId}`);
  return fn(params);
}


/* ══════ src/physics/explain.js ══════ */
// محاسبهٔ گام‌به‌گام هر آزمایش — همان چیزی که آموزگار روی تخته می‌نویسد.
// هر گام: عنوان، فرمول نمادین، جای‌گذاری اعداد، و نتیجه با یکا.


const step = (name, formula, work, value, unit = '', note = '') =>
  ({ name, formula, work, value, unit, note });

/** عدد آمادهٔ نمایش داخل فرمول */
const v = (x, d) => fa(num(x, d));

function energySteps(r) {
  return [
    step('کار مفید — روی بار', 'W_out = F_w × d_w', `${v(r.loadN, 0)} × ${v(r.loadDistanceM, 2)}`, v(r.workOutJ, 0), 'ژول'),
    step('کارِ انجام‌شده توسط ما', 'W_in = F × d_F', `${v(r.effortN, 0)} × ${v(r.effortDistanceM, 2)}`, v(r.workInJ, 0), 'ژول'),
    step('بازده', 'η = W_out ÷ W_in', `${v(r.workOutJ, 0)} ÷ ${v(r.workInJ, 0)}`, `${fa(Math.round(r.efficiency * 100))}٪`, '',
      r.energyLostJ > 0.5 ? `${fa(num(r.energyLostJ, 0))} ژول صرف غلبه بر اصطکاک شد.` : 'در حالت آرمانی هیچ انرژی‌ای هدر نمی‌رود.')
  ];
}

function maSteps(r) {
  return [
    step('مزیت مکانیکی آرمانی', 'MA₀ = d_F ÷ d_w', `${v(r.effortDistanceM, 2)} ÷ ${v(r.loadDistanceM, 2)}`, v(r.maIdeal, 2), 'برابر'),
    step('مزیت مکانیکی واقعی', 'MA = F_w ÷ F', `${v(r.loadN, 0)} ÷ ${v(r.effortN, 0)}`, v(r.maActual, 2), 'برابر')
  ];
}

const weightStep = (r) =>
  step('وزن بار', 'F_w = m × g', `${fa(r.massKg)} × ${fa(num(r.g, 2))}`, v(r.loadN, 0), 'نیوتون');

function explain(r) {
  switch (r.machine) {
    case 'FRICTION':
      return [
        weightStep(r),
        step('نیروی اصطکاک', 'f = μ × F_w', `${fa(num(r.geom.mu, 2))} × ${v(r.loadN, 0)}`, v(r.effortN, 0), 'نیوتون',
          r.ideal ? 'در حالت آرمانی μ برابر صفر است.' : `ضریب اصطکاک ${r.surface.name}: ${fa(r.surface.mu)}`),
        step('نیروی لازم برای کشیدن', 'F = f', '—', v(r.effortN, 0), 'نیوتون',
          'روی سطح افقی، تمام نیروی ما صرف غلبه بر اصطکاک می‌شود.'),
        step('کارِ انجام‌شده', 'W_in = F × d', `${v(r.effortN, 0)} × ${fa(r.geom.distanceM)}`, v(r.workInJ, 0), 'ژول',
          'چون بار بالا نمی‌رود، کار مفید صفر است و همهٔ این انرژی به گرما تبدیل می‌شود.')
      ];

    case 'INCLINED_PLANE':
      return [
        weightStep(r),
        step('سینوس زاویهٔ شیب', 'sin θ = h ÷ L', `${fa(num(r.heightM, 2))} ÷ ${fa(num(r.lengthM, 2))}`, v(r.geom.sin, 3), `≈ ${fa(r.angleDeg)}°`),
        step('مؤلفهٔ وزن در راستای شیب', 'F₀ = F_w × sin θ', `${v(r.loadN, 0)} × ${v(r.geom.sin, 3)}`, v(r.effortIdealN, 0), 'نیوتون'),
        step('نیروی اصطکاک روی رمپ', 'f = μ × F_w × cos θ', `${fa(num(r.geom.mu, 2))} × ${v(r.loadN, 0)} × ${v(r.geom.cos, 3)}`, v(r.frictionN, 0), 'نیوتون'),
        step('نیروی لازم', 'F = F₀ + f', `${v(r.effortIdealN, 0)} + ${v(r.frictionN, 0)}`, v(r.effortN, 0), 'نیوتون'),
        step('مزیت مکانیکی آرمانی', 'MA₀ = L ÷ h', `${fa(num(r.lengthM, 2))} ÷ ${fa(num(r.heightM, 2))}`, v(r.maIdeal, 2), 'برابر'),
        step('مزیت مکانیکی واقعی', 'MA = F_w ÷ F', `${v(r.loadN, 0)} ÷ ${v(r.effortN, 0)}`, v(r.maActual, 2), 'برابر'),
        ...energySteps(r)
      ];

    case 'LEVER':
      return [
        weightStep(r),
        step('بازوی بار', 'd_w = |x_f − x_w|', `|${fa(num(r.geom.fulcrumM, 2))} − ${fa(num(r.geom.loadM, 2))}|`, v(r.loadArmM, 2), 'متر'),
        step('بازوی نیرو', 'd_F = |x_F − x_f|', `|${fa(num(r.geom.effortM, 2))} − ${fa(num(r.geom.fulcrumM, 2))}|`, v(r.effortArmM, 2), 'متر'),
        step('تعادل گشتاور', 'F_w × d_w = F × d_F', `${v(r.loadN, 0)} × ${v(r.loadArmM, 2)} = F × ${v(r.effortArmM, 2)}`, v(r.effortIdealN, 0), 'نیوتون'),
        step('نیروی لازم با اصطکاک تکیه‌گاه', 'F = F₀ ÷ η', `${v(r.effortIdealN, 0)} ÷ ${fa(num(r.effortIdealN / r.effortN, 2))}`, v(r.effortN, 0), 'نیوتون'),
        step('مزیت مکانیکی آرمانی', 'MA₀ = d_F ÷ d_w', `${v(r.effortArmM, 2)} ÷ ${v(r.loadArmM, 2)}`, v(r.maIdeal, 2), 'برابر',
          r.leverClass.name),
        step('مسافتی که دست طی می‌کند', 'd_F = d_w × MA₀', `${v(r.loadDistanceM, 2)} × ${v(r.maIdeal, 2)}`, v(r.effortDistanceM, 2), 'متر'),
        ...energySteps(r)
      ];

    case 'PULLEY':
      return [
        weightStep(r),
        step('رشته‌های نگهدارندهٔ بار', 'n', '—', fa(r.strands), 'رشته', r.system.name),
        step('نیروی آرمانی', 'F₀ = F_w ÷ n', `${v(r.loadN, 0)} ÷ ${fa(r.strands)}`, v(r.effortIdealN, 0), 'نیوتون'),
        step('نیروی لازم با اصطکاک قرقره‌ها', 'F = F₀ ÷ η', `${v(r.effortIdealN, 0)} ÷ ${fa(num(r.effortIdealN / r.effortN, 2))}`, v(r.effortN, 0), 'نیوتون'),
        step('طول طنابی که می‌کشیم', 'd_F = n × h', `${fa(r.strands)} × ${fa(num(r.loadDistanceM, 2))}`, v(r.effortDistanceM, 2), 'متر'),
        step('مزیت مکانیکی آرمانی', 'MA₀ = n', '—', fa(r.maIdeal), 'برابر'),
        step('مزیت مکانیکی واقعی', 'MA = F_w ÷ F', `${v(r.loadN, 0)} ÷ ${v(r.effortN, 0)}`, v(r.maActual, 2), 'برابر'),
        ...energySteps(r)
      ];

    case 'WHEEL_AXLE':
      return [
        weightStep(r),
        step('مزیت مکانیکی آرمانی', 'MA₀ = R ÷ r', `${fa(num(r.wheelRadiusM, 2))} ÷ ${fa(num(r.axleRadiusM, 2))}`, v(r.maIdeal, 2), 'برابر'),
        step('نیروی آرمانی', 'F₀ = F_w × r ÷ R', `${v(r.loadN, 0)} × ${fa(num(r.axleRadiusM, 2))} ÷ ${fa(num(r.wheelRadiusM, 2))}`, v(r.effortIdealN, 0), 'نیوتون'),
        step('نیروی لازم با اصطکاک محور', 'F = F₀ ÷ η', `${v(r.effortIdealN, 0)} ÷ ${fa(num(r.effortIdealN / r.effortN, 2))}`, v(r.effortN, 0), 'نیوتون'),
        step('تعداد دورهای لازم', 'n = h ÷ (2πr)', `${fa(num(r.loadDistanceM, 2))} ÷ (۲π × ${fa(num(r.axleRadiusM, 2))})`, v(r.turns, 1), 'دور'),
        step('مسیری که دست طی می‌کند', 'd_F = n × 2πR', `${v(r.turns, 1)} × ۲π × ${fa(num(r.wheelRadiusM, 2))}`, v(r.effortDistanceM, 2), 'متر'),
        ...energySteps(r)
      ];

    case 'WEDGE':
      return [
        step('نیروی مقاومِ چوب', 'F_w', '—', v(r.loadN, 0), 'نیوتون'),
        step('مزیت مکانیکی آرمانی', 'MA₀ = L ÷ t', `${fa(num(r.lengthM * 100, 1))} ÷ ${fa(num(r.thicknessM * 100, 1))}`, v(r.maIdeal, 2), 'برابر', 'اندازه‌ها بر حسب سانتی‌متر'),
        step('نیروی آرمانی', 'F₀ = F_w × t ÷ L', `${v(r.loadN, 0)} × ${fa(num(r.thicknessM * 100, 1))} ÷ ${fa(num(r.lengthM * 100, 1))}`, v(r.effortIdealN, 0), 'نیوتون'),
        step('نیروی واقعی ضربه', 'F = F₀ ÷ η', `${v(r.effortIdealN, 0)} ÷ ${fa(num(r.effortIdealN / r.effortN, 2))}`, v(r.effortN, 0), 'نیوتون',
          'گوه بازدهٔ پایینی دارد؛ بخش بزرگی از نیرو صرف اصطکاک با چوب می‌شود.'),
        ...energySteps(r)
      ];

    case 'SCREW':
      return [
        weightStep(r),
        step('محیط دایره‌ای که دسته می‌پیماید', 'C = 2πR', `۲π × ${fa(num(r.handleRadiusM, 2))}`, v(2 * Math.PI * r.handleRadiusM, 3), 'متر'),
        step('مزیت مکانیکی آرمانی', 'MA₀ = C ÷ p', `${v(2 * Math.PI * r.handleRadiusM, 3)} ÷ ${fa(num(r.pitchM, 3))}`, v(r.maIdeal, 1), 'برابر'),
        step('نیروی آرمانی', 'F₀ = F_w ÷ MA₀', `${v(r.loadN, 0)} ÷ ${v(r.maIdeal, 1)}`, v(r.effortIdealN, 1), 'نیوتون'),
        step('نیروی واقعی', 'F = F₀ ÷ η', `${v(r.effortIdealN, 1)} ÷ ${fa(num(r.effortIdealN / r.effortN, 2))}`, v(r.effortN, 1), 'نیوتون',
          'اصطکاک زیادِ پیچ همان چیزی است که نمی‌گذارد بار خودبه‌خود پایین بیاید.'),
        step('تعداد دورهای لازم', 'n = h ÷ p', `${fa(num(r.loadDistanceM, 2))} ÷ ${fa(num(r.pitchM, 3))}`, fa(r.turns), 'دور'),
        ...energySteps(r)
      ];

    case 'GEARS':
      return [
        step('نسبت دنده', 'i = z₂ ÷ z₁', `${fa(r.drivenTeeth)} ÷ ${fa(r.driverTeeth)}`, v(r.ratio, 2), 'برابر'),
        step('سرعت چرخش خروجی', 'n₂ = n₁ ÷ i', `${fa(r.inputRpm)} ÷ ${v(r.ratio, 2)}`, v(r.outputRpm, 1), 'دور بر دقیقه'),
        step('گشتاور خروجی', 'τ₂ = τ₁ × i × η', `${fa(r.inputTorqueNm)} × ${v(r.ratio, 2)} × ${fa(num(r.efficiency, 2))}`, v(r.outputTorqueNm, 1), 'نیوتون‌متر'),

          'هرچه گشتاور بیشتر شود سرعت کمتر می‌شود؛ توان تقریباً ثابت می‌ماند.')
      ];

    default:
      return [];
  }
}

/** پارامترهای وابسته را کامل می‌کند (مثلاً محل دستِ اهرم همیشه سرِ تیرک است) */
function resolveParams(machineId, params) {
  const p = { ...params };
  if (machineId === 'LEVER') {
    p.effortM = p.beamLengthM;
    p.fulcrumM = Math.min(p.fulcrumM, p.beamLengthM - 0.2);
    p.loadM = Math.min(p.loadM, p.fulcrumM - 0.1);
  }
  if (machineId === 'INCLINED_PLANE' && p.lengthM < p.heightM * 1.05) {
    p.lengthM = Math.round(p.heightM * 1.05 * 4) / 4;
  }
  if (machineId === 'WHEEL_AXLE' && p.axleRadiusM >= p.wheelRadiusM) {
    p.axleRadiusM = Math.max(0.03, p.wheelRadiusM * 0.5);
  }
  if (machineId === 'WEDGE' && p.thicknessM >= p.lengthM) {
    p.thicknessM = Math.max(0.01, p.lengthM * 0.5);
  }
  return p;
}

/** برچسب کوتاه پیکربندی برای دفترچهٔ ثبت آزمایش */
function describeSetup(machineId, params, result) {
  switch (machineId) {
    case 'FRICTION':
      return `${fa(params.massKg)} کیلوگرم روی ${result.surface.name}${params.useRollers ? ' با غلتک' : ''}`;
    case 'INCLINED_PLANE':
      return `${fa(params.massKg)} کیلوگرم، ارتفاع ${fa(params.heightM)} م، رمپ ${fa(num(result.lengthM, 1))} م${params.useRollers ? ' با غلتک' : ''}`;
    case 'LEVER':
      return `${fa(params.massKg)} کیلوگرم، بازوی بار ${fa(result.loadArmM)} م، بازوی نیرو ${fa(result.effortArmM)} م`;
    case 'PULLEY':
      return `${fa(params.massKg)} کیلوگرم با ${result.system.name} (${fa(result.strands)} رشته)`;
    case 'WHEEL_AXLE':
      return `شعاع چرخ ${fa(num(params.wheelRadiusM, 2))} م و محور ${fa(num(params.axleRadiusM, 2))} م`;
    case 'WEDGE':
      return `گوهٔ ${fa(num(params.lengthM * 100, 0))}×${fa(num(params.thicknessM * 100, 0))} سانتی‌متر`;
    case 'SCREW':
      return `گام ${fa(num(params.pitchM * 1000, 0))} میلی‌متر، دسته ${fa(num(params.handleRadiusM * 100, 0))} سانتی‌متر`;
    case 'GEARS':
      return `${fa(params.driverTeeth)} به ${fa(params.drivenTeeth)} دندانه`;
    default:
      return '—';
  }
}
