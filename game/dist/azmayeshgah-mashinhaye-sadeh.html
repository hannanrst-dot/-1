/** پالت فعال — تا برچسب‌ها در تم تیره هم خوانا بمانند */
let ACTIVE = PALETTE.light;
function setPalette(p) { ACTIVE = p; }

/** مستطیل گردگوشه */
function rr(ctx, x, y, w, h, r = 6) {
  const rad = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + rad, y);
  ctx.arcTo(x + w, y, x + w, y + h, rad);
  ctx.arcTo(x + w, y + h, x, y + h, rad);
  ctx.arcTo(x, y + h, x, y, rad);
  ctx.arcTo(x, y, x + w, y, rad);
  ctx.closePath();
}

/** گرادیان خطی سریع */
function grad(ctx, x0, y0, x1, y1, stops) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  for (const [pos, color] of stops) g.addColorStop(pos, color);
  return g;
}

/** متن با پس‌زمینهٔ کوچک (برچسب روی صحنه) */
function label(ctx, x, y, text, opts = {}) {
  const {
    size = 12, weight = 700, color = ACTIVE.ink, bg = `${ACTIVE.paper}ee`,
    border = ACTIVE === PALETTE.dark ? 'rgba(255,255,255,.16)' : 'rgba(0,0,0,.10)',
    align = 'center', pad = 5, radius = 7
  } = opts;
  ctx.save();
  ctx.font = `${weight} ${size}px Vazirmatn, Tahoma, sans-serif`;
  ctx.direction = 'rtl';
  ctx.textBaseline = 'middle';
  const w = ctx.measureText(text).width + pad * 2;
  const h = size + pad * 1.7;
  let bx = x - w / 2;
  if (align === 'start') bx = x - w;
  if (align === 'end') bx = x;
  if (bg) {
    ctx.fillStyle = bg;
    rr(ctx, bx, y - h / 2, w, h, radius);
    ctx.fill();
    if (border) { ctx.strokeStyle = border; ctx.lineWidth = 1; ctx.stroke(); }
  }
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.fillText(text, bx + w / 2, y + 0.5);
  ctx.restore();
}

/** پیکان نیرو با برچسب */
function arrow(ctx, x1, y1, x2, y2, opts = {}) {
  const { color = '#ef7d17', width = 3.5, head = 10, text = null, dashed = false, textSize = 11, labelAt = 'middle' } = opts;
  const ang = Math.atan2(y2 - y1, x2 - x1);
  const len = Math.hypot(x2 - x1, y2 - y1);
  if (len < 2) return;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  if (dashed) ctx.setLineDash([6, 5]);
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2 - Math.cos(ang) * head * 0.8, y2 - Math.sin(ang) * head * 0.8);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - Math.cos(ang - 0.4) * head, y2 - Math.sin(ang - 0.4) * head);
  ctx.lineTo(x2 - Math.cos(ang + 0.4) * head, y2 - Math.sin(ang + 0.4) * head);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  if (text) {
    const mx = labelAt === 'tip' ? x2 + Math.cos(ang) * 20 : (x1 + x2) / 2 - Math.sin(ang) * 13;
    const my = labelAt === 'tip' ? y2 + Math.sin(ang) * 14 : (y1 + y2) / 2 + Math.cos(ang) * 13;
    label(ctx, mx, my, text, { size: textSize, color });
  }
}

/** خط اندازه‌گیری با دو سرِ کوتاه و برچسب وسط */
function dim(ctx, x1, y1, x2, y2, text, opts = {}) {
  const { color = '#4a627a', offset = 0, size = 11 } = opts;
  const ang = Math.atan2(y2 - y1, x2 - x1);
  const ox = -Math.sin(ang) * offset;
  const oy = Math.cos(ang) * offset;
  const ax = x1 + ox, ay = y1 + oy, bx = x2 + ox, by = y2 + oy;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.4;
  ctx.setLineDash([4, 3]);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(ax, ay);
  ctx.moveTo(x2, y2); ctx.lineTo(bx, by);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
  for (const [px, py, dir] of [[ax, ay, 1], [bx, by, -1]]) {
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(px + Math.cos(ang + 0.35) * 8 * dir, py + Math.sin(ang + 0.35) * 8 * dir);
    ctx.lineTo(px + Math.cos(ang - 0.35) * 8 * dir, py + Math.sin(ang - 0.35) * 8 * dir);
    ctx.closePath(); ctx.fillStyle = color; ctx.fill();
  }
  ctx.restore();
  if (text) label(ctx, (ax + bx) / 2, (ay + by) / 2, text, { size, color });
}

/** کمان زاویه با برچسب درجه */
function angleArc(ctx, x, y, radius, a0, a1, text, color = '#4a627a') {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.arc(x, y, radius, a0, a1, a1 < a0);
  ctx.stroke();
  ctx.restore();
  if (text) {
    const mid = (a0 + a1) / 2;
    label(ctx, x + Math.cos(mid) * (radius + 15), y + Math.sin(mid) * (radius + 15), text, { size: 11, color });
  }
}

/** تختهٔ چوبی با رگه (زاویه بر حسب رادیان، حول نقطهٔ شروع) */
function plank(ctx, x, y, w, h, angle, P, opts = {}) {
  const { radius = 3 } = opts;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.fillStyle = grad(ctx, 0, 0, 0, h, [[0, P.woodLight], [0.45, P.wood], [1, P.woodDark]]);
  rr(ctx, 0, 0, w, h, radius);
  ctx.fill();
  ctx.strokeStyle = P.woodDark;
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,.10)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(4, (h / 3) * i);
    ctx.lineTo(w - 4, (h / 3) * i + (i % 2 ? 1 : -1));
    ctx.stroke();
  }
  ctx.restore();
}

/** صندوق بار با علامت هلال‌احمر و برچسب جرم */
function crate(ctx, x, y, size, angle, P, opts = {}) {
  const { massKg = null, shadow = true } = opts;
  const w = size, h = size * 0.82;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  if (shadow) {
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,.16)';
    ctx.beginPath();
    ctx.ellipse(0, h / 2 + 4, w / 2, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = grad(ctx, -w / 2, -h / 2, w / 2, h / 2, [[0, P.crate], [1, P.crateDark]]);
  rr(ctx, -w / 2, -h / 2, w, h, 4);
  ctx.fill();
  ctx.strokeStyle = P.crateDark; ctx.lineWidth = 2; ctx.stroke();
  // نوارهای ضربدری
  ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(-w / 2 + 3, -h / 2 + 3); ctx.lineTo(w / 2 - 3, h / 2 - 3);
  ctx.moveTo(w / 2 - 3, -h / 2 + 3); ctx.lineTo(-w / 2 + 3, h / 2 - 3);
  ctx.stroke();
  // هلال احمر
  ctx.fillStyle = '#e0435a';
  ctx.beginPath();
  ctx.arc(0, 0, size * 0.17, 0.5, Math.PI * 2 - 0.5);
  ctx.arc(size * 0.055, 0, size * 0.135, Math.PI * 2 - 0.75, 0.75, true);
  ctx.closePath();
  ctx.fill();
  if (massKg !== null) {
    label(ctx, 0, h / 2 - 8, `${fa(massKg)} کیلوگرم`, { size: 10, color: '#5b3a12', bg: 'rgba(255,255,255,.88)' });
  }
  ctx.restore();
}

/** طناب با افتادگی طبیعی بین دو نقطه */
function rope(ctx, pts, P, opts = {}) {
  const { width = 3, sag = 0, color = null } = opts;
  if (pts.length < 2) return;
  ctx.save();
  ctx.strokeStyle = color || P.rope;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1];
    const [x1, y1] = pts[i];
    if (sag > 0) {
      ctx.quadraticCurveTo((x0 + x1) / 2, (y0 + y1) / 2 + sag, x1, y1);
    } else {
      ctx.lineTo(x1, y1);
    }
  }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.28)';
  ctx.lineWidth = Math.max(1, width * 0.32);
  ctx.stroke();
  ctx.restore();
}

/** چرخ قرقره */
function sheave(ctx, x, y, r, angle, P, opts = {}) {
  const { mount = 'none' } = opts; // 'top' | 'hook' | 'none'
  ctx.save();
  if (mount === 'top') {
    ctx.strokeStyle = P.metalDark; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(x, y - r - 16); ctx.lineTo(x, y); ctx.stroke();
    ctx.fillStyle = P.metalDark;
    rr(ctx, x - 5, y - r - 20, 10, 8, 2); ctx.fill();
  }
  ctx.translate(x, y);
  ctx.fillStyle = grad(ctx, -r, -r, r, r, [[0, P.metalLight], [1, P.metalDark]]);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = P.metalDark; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = P.woodDark;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.72, 0, Math.PI * 2); ctx.fill();
  ctx.rotate(angle);
  ctx.strokeStyle = 'rgba(255,255,255,.55)';
  ctx.lineWidth = 2.4;
  for (let i = 0; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(-r * 0.6, 0); ctx.lineTo(r * 0.6, 0);
    ctx.stroke();
    ctx.rotate(Math.PI / 4);
  }
  ctx.rotate(-angle - Math.PI);
  ctx.fillStyle = P.metalLight;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.2, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = P.metalDark; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.restore();
  if (mount === 'hook') {
    ctx.save();
    ctx.strokeStyle = P.metalDark; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x, y + r); ctx.lineTo(x, y + r + 12); ctx.stroke();
    ctx.restore();
  }
}

/** چرخ‌دنده */
function gear(ctx, x, y, r, teeth, angle, color, P) {
  const inner = r * 0.78;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.beginPath();
  for (let i = 0; i < teeth; i++) {
    const a0 = (i / teeth) * Math.PI * 2;
    const step = (Math.PI * 2) / teeth / 4;
    ctx.lineTo(Math.cos(a0) * inner, Math.sin(a0) * inner);
    ctx.lineTo(Math.cos(a0 + step) * r, Math.sin(a0 + step) * r);
    ctx.lineTo(Math.cos(a0 + step * 2) * r, Math.sin(a0 + step * 2) * r);
    ctx.lineTo(Math.cos(a0 + step * 3) * inner, Math.sin(a0 + step * 3) * inner);
  }
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.lineWidth = 1.6; ctx.stroke();
  ctx.fillStyle = P.paper;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.24, 0, Math.PI * 2); ctx.fill();
  ctx.stroke();
  // پره‌ها برای دیده شدن چرخش
  ctx.strokeStyle = 'rgba(0,0,0,.22)'; ctx.lineWidth = 3;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos((i / 3) * Math.PI * 2) * inner * 0.85, Math.sin((i / 3) * Math.PI * 2) * inner * 0.85);
    ctx.stroke();
  }
  ctx.restore();
}

/**
 * پیکرهٔ آزمایشگر.
 * همهٔ اندام‌ها حول «لگن» می‌چرخند تا تنه و پاها هیچ‌وقت از هم جدا نیفتند.
 * pose: 'pull' | 'push' | 'crank' | 'hammer' | 'idle'
 * dir: ۱ رو به راست، ۱- رو به چپ
 * effort: ۰ تا ۱ — هرچه بیشتر، خمیدگی بدن بیشتر
 */
function person(ctx, x, y, height, opts = {}) {
  const {
    P, pose = 'idle', dir = -1, t = 0, effort = 0.4,
    skin = '#efbf95', shirt = '#e07a2c', pants = '#33506f'
  } = opts;
  const s = height / 100;
  const HIP = -36;                       // ارتفاع لگن بر حسب واحد پیکره
  const lean = pose === 'pull' ? -0.16 - effort * 0.20
    : pose === 'push' ? 0.12 + effort * 0.14 : 0;
  const bob = pose === 'idle' ? Math.sin(t * 2) * 0.8 : Math.sin(t * 6) * (1 + effort * 1.6);
  const stride = pose === 'pull' ? 17 : pose === 'push' ? 14 : 8;

  ctx.save();
  ctx.translate(x, y + bob * s);
  ctx.scale(dir, 1);

  // سایه
  ctx.fillStyle = 'rgba(0,0,0,.14)';
  ctx.beginPath(); ctx.ellipse(0, 1.5 * s, 19 * s, 4 * s, 0, 0, Math.PI * 2); ctx.fill();

  // پاها — از لگن تا کف
  ctx.lineCap = 'round';
  ctx.strokeStyle = pants; ctx.lineWidth = 8 * s;
  ctx.beginPath();
  ctx.moveTo(0, HIP * s); ctx.lineTo(-stride * s, -2 * s);
  ctx.moveTo(0, HIP * s); ctx.lineTo(stride * 0.5 * s, -2 * s);
  ctx.stroke();
  // کفش
  ctx.strokeStyle = '#3a2b1e'; ctx.lineWidth = 5.5 * s;
  ctx.beginPath();
  ctx.moveTo(-stride * s, 0); ctx.lineTo((-stride - 5) * s, 0);
  ctx.moveTo(stride * 0.5 * s, 0); ctx.lineTo((stride * 0.5 + 5) * s, 0);
  ctx.stroke();

  // ── از اینجا به بعد همه‌چیز حول لگن می‌چرخد ──
  ctx.translate(0, HIP * s);
  ctx.rotate(lean);

  // تنه (کمی پایین‌تر از لگن کشیده می‌شود تا درز دیده نشود)
  ctx.fillStyle = shirt;
  rr(ctx, -8.5 * s, -34 * s, 17 * s, 38 * s, 7 * s);
  ctx.fill();
  // کمربند
  ctx.fillStyle = 'rgba(0,0,0,.16)';
  rr(ctx, -8.5 * s, -3 * s, 17 * s, 6 * s, 3 * s);
  ctx.fill();
  // مفصل لگن
  ctx.fillStyle = pants;
  ctx.beginPath(); ctx.arc(0, 0, 8 * s, 0, Math.PI * 2); ctx.fill();

  // گردن و سر
  ctx.strokeStyle = skin; ctx.lineWidth = 6 * s;
  ctx.beginPath(); ctx.moveTo(0, -33 * s); ctx.lineTo(0, -38 * s); ctx.stroke();
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(0, -47 * s, 11 * s, 0, Math.PI * 2); ctx.fill();
  // مو
  ctx.fillStyle = '#43301f';
  ctx.beginPath();
  ctx.arc(0, -48 * s, 11.2 * s, Math.PI * 1.05, Math.PI * 2.05);
  ctx.closePath(); ctx.fill();
  // چشم و دهان
  ctx.fillStyle = '#22303f';
  ctx.beginPath(); ctx.arc(6 * s, -47 * s, 1.6 * s, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#22303f'; ctx.lineWidth = 1.3 * s;
  ctx.beginPath();
  if (effort > 0.7) ctx.arc(5 * s, -41.5 * s, 2.2 * s, 0, Math.PI);
  else ctx.arc(5 * s, -43 * s, 2.4 * s, 0.2, Math.PI - 0.2);
  ctx.stroke();

  // بازوها — شانه در ارتفاع ۳۰- نسبت به لگن
  const shoulder = [0, -30 * s];
  let hand = [14 * s, -14 * s];
  let elbow = [9 * s, -22 * s];
  if (pose === 'pull') {
    hand = [24 * s, (-17 + Math.sin(t * 6) * 1.2) * s];
    elbow = [13 * s, -24 * s];
  } else if (pose === 'push') {
    hand = [22 * s, -27 * s];
    elbow = [12 * s, -29 * s];
  } else if (pose === 'crank') {
    const a = t * 3;
    hand = [(15 + Math.cos(a) * 8) * s, (-23 + Math.sin(a) * 8) * s];
    elbow = [10 * s, -26 * s];
  } else if (pose === 'up') {
    hand = [9 * s, (-48 + Math.sin(t * 5) * 1.5) * s];
    elbow = [12 * s, -38 * s];
  } else if (pose === 'hammer') {
    const a = Math.sin(t * 5) * 0.9 - 1;
    hand = [(15 + Math.cos(a) * 12) * s, (-27 + Math.sin(a) * 12) * s];
    elbow = [8 * s, -29 * s];
  }
  ctx.strokeStyle = skin; ctx.lineWidth = 6.5 * s;
  ctx.beginPath();
  ctx.moveTo(shoulder[0], shoulder[1]);
  ctx.lineTo(elbow[0], elbow[1]);
  ctx.lineTo(hand[0], hand[1]);
  ctx.stroke();
  // بازوی دور (کمی تیره‌تر برای حس عمق)
  ctx.strokeStyle = 'rgba(0,0,0,.16)'; ctx.lineWidth = 6.5 * s;
  ctx.beginPath();
  ctx.moveTo(shoulder[0] - 2 * s, shoulder[1] + 1 * s);
  ctx.lineTo(elbow[0] - 3 * s, elbow[1] + 3 * s);
  ctx.lineTo(hand[0] - 3 * s, hand[1] + 3 * s);
  ctx.stroke();
  ctx.restore();

  // مختصات دستِ کاری در فضای صفحه (برای وصل کردن طناب یا دسته)
  const c = Math.cos(lean), sn = Math.sin(lean);
  return {
    x: x + dir * (hand[0] * c - hand[1] * sn),
    y: y + bob * s + HIP * s + (hand[0] * sn + hand[1] * c)
  };
}

/**
 * نیروسنج (دینامومتر) — ابزار اندازه‌گیریِ روی طناب.
 * عدد را هم روی عقربه و هم به شکل رقمی نشان می‌دهد.
 */
function gauge(ctx, x, y, valueN, maxN, P, opts = {}) {
  const { title = 'نیروسنج', angle = 0 } = opts;
  const w = 86, h = 44;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);

  ctx.fillStyle = ACTIVE.paper;
  rr(ctx, -w / 2, -h / 2, w, h, 8);
  ctx.fill();
  ctx.strokeStyle = ACTIVE === PALETTE.dark ? 'rgba(255,255,255,.22)' : 'rgba(20,40,60,.28)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // کمان مدرج
  const cx = 0, cy = h / 2 - 9, r = 22;
  ctx.strokeStyle = ACTIVE.inkSoft;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI, 0); ctx.stroke();
  for (let i = 0; i <= 4; i++) {
    const a = Math.PI + (Math.PI * i) / 4;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
    ctx.lineTo(cx + Math.cos(a) * (r - 4), cy + Math.sin(a) * (r - 4));
    ctx.stroke();
  }
  // عقربه
  const k = clamp(valueN / (maxN || 1), 0, 1);
  const a = Math.PI + Math.PI * k;
  ctx.strokeStyle = k > 0.85 ? '#d33b4a' : '#0b7fc4';
  ctx.lineWidth = 2.6;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx + Math.cos(a) * (r - 3), cy + Math.sin(a) * (r - 3));
  ctx.stroke();
  ctx.fillStyle = ACTIVE.ink;
  ctx.beginPath(); ctx.arc(cx, cy, 2.6, 0, Math.PI * 2); ctx.fill();

  // عدد
  ctx.font = `800 13px Vazirmatn, Tahoma, sans-serif`;
  ctx.direction = 'rtl';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = ACTIVE.ink;
  ctx.fillText(`${fa(Math.round(valueN))} N`, 0, -h / 2 + 12);
  ctx.font = `600 8.5px Vazirmatn, Tahoma, sans-serif`;
  ctx.fillStyle = ACTIVE.inkSoft;
  ctx.fillText(title, 0, -h / 2 + 24);
  ctx.restore();
}

/** ذرات (گرد و خاک، جرقه) */
class Particles {
  constructor() { this.items = []; }
  burst(x, y, count, color, opts = {}) {
    const { speed = 3, life = 0.9, size = 4, gravity = 0.12, spread = Math.PI * 2, dir = 0 } = opts;
    for (let i = 0; i < count; i++) {
      const a = dir + (Math.random() - 0.5) * spread;
      const sp = speed * (0.4 + Math.random() * 0.9);
      this.items.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.6,
        life: life * (0.6 + Math.random() * 0.7), age: 0,
        size: size * (0.6 + Math.random() * 0.8), color, gravity
      });
    }
  }
  update(dt) {
    for (let i = this.items.length - 1; i >= 0; i--) {
      const p = this.items[i];
      p.x += p.vx; p.y += p.vy; p.vy += p.gravity; p.age += dt;
      if (p.age >= p.life) this.items.splice(i, 1);
    }
  }
  draw(ctx) {
    for (const p of this.items) {
      const k = 1 - p.age / p.life;
      ctx.save();
      ctx.globalAlpha = clamp(k, 0, 1);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (0.4 + k * 0.8), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }
  clear() { this.items.length = 0; }
}


/* ══════ src/render/world.js ══════ */
// پس‌زمینهٔ آرام و بی‌حاشیهٔ صحنه — چیزی که حواس را از اندازه‌گیری پرت نکند


/**
 * زمینِ آزمایشگاه: یک شیبِ ملایمِ رنگی، خط زمین و شبکهٔ کمکی.
 * برمی‌گرداند: ارتفاع خط زمین بر حسب پیکسل.
 */
function drawWorld(ctx, w, h, P, opts = {}) {
  const { groundRatio = 0.80, grid = true } = opts;
  const gy = Math.round(h * groundRatio);

  // آسمان/زمینهٔ کاری
  ctx.fillStyle = grad(ctx, 0, 0, 0, gy, [[0, P.skyTop], [1, P.skyLow]]);
  ctx.fillRect(0, 0, w, gy);

  // شبکهٔ کمکی — مانند کاغذ میلی‌متری، برای حس اندازه
  if (grid) {
    ctx.save();
    ctx.strokeStyle = P.gridLine;
    ctx.lineWidth = 1;
    const s = 40;
    ctx.beginPath();
    for (let x = s; x < w; x += s) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, gy); }
    for (let y = gy - s; y > 0; y -= s) { ctx.moveTo(0, y + 0.5); ctx.lineTo(w, y + 0.5); }
    ctx.stroke();
    ctx.restore();
  }

  // زمین، با هاشورِ ملایمِ نقشه‌کشی
  ctx.fillStyle = grad(ctx, 0, gy, 0, h, [[0, P.ground], [1, P.groundDeep]]);
  ctx.fillRect(0, gy, w, h - gy);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, gy, w, h - gy); ctx.clip();
  ctx.strokeStyle = P.groundLine;
  ctx.globalAlpha = 0.35;
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = -(h - gy); x < w; x += 13) { ctx.moveTo(x, h); ctx.lineTo(x + (h - gy), gy); }
  ctx.stroke();
  ctx.restore();
  ctx.strokeStyle = P.groundLine;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, gy + 1); ctx.lineTo(w, gy + 1);
  ctx.stroke();

  return gy;
}

/** دیوارهٔ سنگی/بتنی که رمپ یا تیرک به آن تکیه می‌کند */
function wall(ctx, x0, x1, topY, bottomY, P) {
  ctx.save();
  ctx.fillStyle = grad(ctx, x0, topY, x1, bottomY, [[0, P.structure], [1, P.structureDeep]]);
  rr(ctx, x0, topY, x1 - x0, bottomY - topY, 3);
  ctx.fill();
  ctx.strokeStyle = P.structureLine;
  ctx.lineWidth = 1.5;
  ctx.stroke();
  // درزهای آجرچینی
  ctx.save();
  rr(ctx, x0, topY, x1 - x0, bottomY - topY, 3);
  ctx.clip();
  ctx.strokeStyle = P.structureLine;
  ctx.globalAlpha = 0.5;
  ctx.lineWidth = 1;
  for (let y = topY + 24; y < bottomY; y += 24) {
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
  }
  ctx.restore();
  ctx.restore();
}

/** سکوی افقی (برای ایستادن یا نصب تیر) */
function platform(ctx, x, y, width, P) {
  ctx.save();
  ctx.fillStyle = P.structure;
  rr(ctx, x - width / 2, y, width, 11, 3);
  ctx.fill();
  ctx.strokeStyle = P.structureLine;
  ctx.lineWidth = 1.4;
  ctx.stroke();
  ctx.restore();
}


/* ══════ src/render/scenes.js ══════ */
// صحنهٔ هر ماشین ساده — یک نمودار فیزیکِ دقیق، نه یک تصویر تزئینی.
// هر صحنه هندسه را از روی اعداد واقعی می‌سازد و ابزارهای اندازه‌گیری را نشان می‌دهد.




const N = (x) => `${num(x, 0)} نیوتون`;

/** جای خط زمین در هر صحنه (نسبت به ارتفاع بوم) */
const GROUND_RATIO = {
  FRICTION: 0.66, INCLINED_PLANE: 0.84, LEVER: 0.86, PULLEY: 0.92,
  WHEEL_AXLE: 0.90, WEDGE: 0.70, SCREW: 0.86, GEARS: 0.95
};

/** ضریب بزرگ‌نمایی پیکره‌ها متناسب با اندازهٔ بوم */
const zoom = (h) => clamp(h / 620, 0.85, 2.1);

/** ارتفاع امن برای برچسب‌های زیر خط زمین */
const under = (gy, h, off = 30) => Math.min(gy + off, h - 15);

/** نوار سطح مسیر */
function surfaceStrip(ctx, x0, x1, y, surface, P, thickness = 11) {
  ctx.save();
  ctx.fillStyle = surface.id === 'ICE'
    ? grad(ctx, 0, y - thickness, 0, y + 3, [[0, '#e8f6fd'], [1, '#a9d4e8']])
    : surface.id === 'ROUGH_STONE'
      ? grad(ctx, 0, y - thickness, 0, y + 3, [[0, '#a49a8f'], [1, '#726a60']])
      : grad(ctx, 0, y - thickness, 0, y + 3, [[0, P.woodLight], [1, P.woodDark]]);
  rr(ctx, x0, y - thickness, x1 - x0, thickness + 3, 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.20)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,.16)'; ctx.lineWidth = 1.2;
  if (surface.id === 'ROUGH_STONE') {
    for (let x = x0 + 6; x < x1; x += 12) {
      ctx.beginPath(); ctx.moveTo(x, y - thickness + 2); ctx.lineTo(x + 3, y - thickness + 6); ctx.lineTo(x - 2, y); ctx.stroke();
    }
  } else if (surface.id === 'WOOD_PLANKS' || surface.id === 'SMOOTH_TRACK') {
    for (let x = x0 + 30; x < x1; x += 34) { ctx.beginPath(); ctx.moveTo(x, y - thickness); ctx.lineTo(x, y + 2); ctx.stroke(); }
  }
  ctx.restore();
}

/** غلتک‌های چوبی زیر بار */
function rollers(ctx, cx, y, width, spin, P, z = 1) {
  const r = 8 * z;
  const count = Math.max(3, Math.round(width / 26));
  for (let i = 0; i < count; i++) {
    const x = cx - width / 2 + (width / (count - 1)) * i;
    ctx.save();
    ctx.translate(x, y - r);
    ctx.rotate(spin);
    ctx.fillStyle = grad(ctx, -r, -r, r, r, [[0, P.woodLight], [1, P.woodDark]]);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = P.woodDark; ctx.lineWidth = 1.4; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-r * 0.7, 0); ctx.lineTo(r * 0.7, 0); ctx.stroke();
    ctx.restore();
  }
}

/** بردارهای نیرو روی بار؛ angle = راستای حرکت بار */
function forceVectors(ctx, cx, cy, state, P, opts = {}) {
  const { angle = Math.PI, showNormal = true } = opts;
  const maxF = Math.max(state.loadN, state.effortN, state.frictionN, 1);
  const len = (f) => clamp(Math.sqrt(clamp(f, 0, maxF) / maxF) * 82, 28, 90);
  const A = (dx, dy, f, color, text, extra = {}) =>
    arrow(ctx, cx, cy, cx + dx * len(f), cy + dy * len(f),
      { color, width: 3.2, text, textSize: 10, labelAt: 'tip', ...extra });

  A(0, 1, state.loadN, P.load, `وزن ${N(state.loadN)}`);
  if (showNormal && state.machine !== 'PULLEY') {
    A(-Math.sin(angle), Math.cos(angle), state.loadN * Math.abs(Math.cos(angle)), P.normal, 'نیروی تکیه‌گاه', { dashed: true, width: 2.4 });
  }
  if (state.frictionN > 0.5) {
    A(-Math.cos(angle), -Math.sin(angle), state.frictionN, P.friction, `اصطکاک ${N(state.frictionN)}`, { width: 2.6 });
  }
  if (state.effortN > 0.5) {
    A(Math.cos(angle), Math.sin(angle), state.effortN, P.effort, `نیروی ما ${N(state.effortN)}`, { width: 3.6 });
  }
}

/** شمارندهٔ مسافتِ زنده هنگام اجرای حرکت */
function travelReadout(ctx, x, y, title, doneM, totalM, color, P) {
  label(ctx, x, y, `${title}: ${fa(num(doneM, 2))} از ${fa(num(totalM, 2))} متر`, { size: 10.5, color });
}

// ══════════════ ۱) اصطکاک، چرخ و غلتک ══════════════
function sceneFriction(ctx, env) {
  const { w, h, gy, P, t, state, showVectors, showDims } = env;
  const z = zoom(h);
  const x0 = w * 0.74, x1 = w * 0.24;
  const size = clamp((38 + state.massKg * 0.3) * z, 44, h * 0.22);
  const cx = lerp(x0, x1, t);
  const cy = gy - size * 0.41 - (state.useRollers ? 16 * z : 0);

  surfaceStrip(ctx, w * 0.12, w * 0.88, gy, state.surface, P, 11 * z);
  if (state.useRollers) rollers(ctx, cx, gy, size * 1.1, -t * 26, P, z);
  crate(ctx, cx, cy, size, 0, P, { massKg: state.massKg });

  const hand = person(ctx, cx - size * 0.5 - 78 * z, gy, 92 * z, {
    P, pose: 'pull', dir: 1, t: env.time * 3, effort: clamp(state.effortN / Math.max(state.loadN, 1) * 1.4, 0.15, 1)
  });
  const gx = (hand.x + cx - size * 0.5) / 2;
  rope(ctx, [[hand.x, hand.y], [cx - size * 0.5, cy + size * 0.08]], P, { width: 3.2 });
  gauge(ctx, gx, Math.min(hand.y, cy) - 52 * z, state.effortN, Math.max(state.loadN, state.effortN), P);

  if (showDims && h - gy > 76) {
    dim(ctx, x0, gy + 22, x1, gy + 22, `مسافت ${fa(num(state.geom.distanceM, 2))} متر`, { color: P.inkSoft });
  }
  label(ctx, w * 0.5, under(gy, h, 48),
    `${state.surface.icon} ${state.surface.fullName} — ضریب اصطکاک μ = ${fa(num(state.geom.mu, 2))}`,
    { size: 11 });
  if (t > 0 && t < 1) {
    travelReadout(ctx, w * 0.5, h * 0.10, 'مسافت پیموده‌شده', state.geom.distanceM * t, state.geom.distanceM, P.effort, P);
  }
  if (showVectors) forceVectors(ctx, cx, cy, state, P, { angle: Math.PI });
  return [];
}

// ══════════════ ۲) سطح شیب‌دار ══════════════
function sceneIncline(ctx, env) {
  const { w, h, gy, P, t, state, showVectors, showDims } = env;
  const { heightM, lengthM, angleDeg } = state.geom;

  const mscale = Math.min((w * 0.56) / lengthM, (h * 0.52) / Math.max(heightM, 0.4), 190);
  const hPx = heightM * mscale;
  const lPx = lengthM * mscale;
  const ang = Math.asin(clamp(hPx / lPx, 0, 1));

  const baseX = w * 0.88;
  const topX = baseX - Math.cos(ang) * lPx;
  const topY = gy - hPx;

  // سکوی بلندی که رمپ به آن می‌رسد
  wall(ctx, Math.max(w * 0.03, topX - w * 0.24), topX + 8, topY, gy, P);

  const thick = 12;
  ctx.save();
  ctx.translate(baseX, gy);
  ctx.rotate(ang);
  ctx.fillStyle = state.useRollers
    ? grad(ctx, 0, -thick, 0, 2, [[0, P.woodLight], [1, P.woodDark]])
    : grad(ctx, 0, -thick, 0, 2, [[0, state.surface.color], [1, 'rgba(0,0,0,.35)']]);
  rr(ctx, -lPx, -thick, lPx, thick, 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.restore();

  const size = clamp((36 + state.massKg * 0.24) * zoom(h) * 0.8, 38, 78);
  const bx = lerp(baseX - size * 0.55, topX + size * 0.55, t);
  const by = lerp(gy, topY, t) - thick;

  ctx.save();
  ctx.translate(bx, by);
  ctx.rotate(ang);
  if (state.useRollers) rollers(ctx, 0, 0, size * 1.05, -t * 24, P);
  crate(ctx, 0, -size * 0.42 - (state.useRollers ? 15 : 0), size, 0, P, { massKg: state.massKg, shadow: false });
  ctx.restore();

  const hand = person(ctx, topX - 34, topY, clamp(mscale * 1.7, 80, h * 0.30), {
    P, pose: 'pull', dir: 1, t: env.time * 3, effort: clamp(state.effortN / Math.max(state.loadN, 1) * 1.6, 0.15, 1)
  });
  const anchor = [bx - Math.cos(ang) * size * 0.45, by - size * 0.5];
  rope(ctx, [[hand.x, hand.y], anchor], P, { width: 3 });
  gauge(ctx, (hand.x + anchor[0]) / 2 - 8, (hand.y + anchor[1]) / 2 - 34, state.effortN, Math.max(state.loadN, state.effortN), P);

  if (showDims) {
    ctx.save();
    ctx.strokeStyle = P.gridStrong; ctx.lineWidth = 1.2; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(topX, topY); ctx.lineTo(baseX + 46, topY); ctx.stroke();
    ctx.restore();
    dim(ctx, baseX + 38, gy, baseX + 38, topY, `ارتفاع h = ${fa(num(heightM, 2))} متر`, { color: P.load });
    dim(ctx, baseX, gy, topX, topY, `طول رمپ L = ${fa(num(state.lengthM, 2))} متر`, { color: P.effort, offset: 34 });
    angleArc(ctx, baseX, gy, 56, Math.PI, Math.PI + ang, `θ = ${fa(angleDeg)}°`, P.inkSoft);
  }
  if (t > 0 && t < 1) {
    travelReadout(ctx, w * 0.5, h * 0.07, 'بار بالا رفت', heightM * t, heightM, P.load, P);
    travelReadout(ctx, w * 0.5, h * 0.07 + 20, 'طناب کشیده شد', state.lengthM * t, state.lengthM, P.effort, P);
  }
  if (showVectors) forceVectors(ctx, bx, by - size * 0.55, state, P, { angle: Math.PI + ang });

  return [{
    id: 'rampLength', x: topX + 16, y: topY - 26, r: 15,
    hint: 'بالای رمپ را بکش تا شیب عوض شود',
    toValue: (px) => Math.hypot(Math.max(6, baseX - px), hPx) / mscale
  }];
}

// ══════════════ ۳) اهرم ══════════════
function sceneLever(ctx, env) {
  const { w, h, gy, P, t, state, showVectors, showDims } = env;
  const g = state.geom;
  const z = zoom(h);
  const scale = Math.min((w * 0.74) / g.beamLengthM, 230);
  const originX = w * 0.88;
  const X = (m) => originX - m * scale;
  const fx = X(g.fulcrumM);

  // تکیه‌گاه آن‌قدر بلند است که چرخش تیرک دیده شود
  const dxLoad = (g.fulcrumM - g.loadM) * scale;
  const dxEffort = (g.fulcrumM - g.effortM) * scale;
  const liftPx = g.liftHeightM * scale;
  const sinT = clamp(dxLoad > 4 ? liftPx / dxLoad : 0, 0, 0.55);
  const drop = Math.abs(dxEffort) * sinT;             // سرِ نیرو چقدر پایین می‌آید
  const fulcrumH = clamp(Math.max(liftPx, drop) + 46 * z, 74 * z, h * 0.5);
  const beamY = gy - fulcrumH;

  const theta = -Math.asin(sinT) * t;
  const pt = (m) => {
    const dx = X(m) - fx;
    return [fx + dx * Math.cos(theta), beamY + dx * Math.sin(theta)];
  };
  const [lx, ly] = pt(g.loadM);
  const [ex, ey] = pt(g.effortM);

  // تیرک
  ctx.save();
  ctx.translate(fx, beamY);
  ctx.rotate(theta);
  plank(ctx, X(g.beamLengthM) - fx, -7 * z, g.beamLengthM * scale, 14 * z, 0, P);
  ctx.restore();

  // تکیه‌گاه
  const fw = 26 * z;
  ctx.save();
  ctx.fillStyle = grad(ctx, fx - fw, beamY, fx + fw, gy, [[0, P.structure], [1, P.structureDeep]]);
  ctx.beginPath();
  ctx.moveTo(fx, beamY + 2); ctx.lineTo(fx + fw, gy); ctx.lineTo(fx - fw, gy);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = P.structureLine; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.restore();
  label(ctx, fx, under(gy, h, 18), 'تکیه‌گاه', { size: 10.5 });

  // بار روی سرِ تیرک
  const size = clamp((32 + state.massKg * 0.2) * z * 0.85, 36, h * 0.16);
  crate(ctx, lx, ly - size * 0.55, size, theta, P, { massKg: state.massKg, shadow: false });

  // کارگر روی زمین، دست‌ها روی سرِ تیرک
  const pDir = ex < fx ? -1 : 1;
  // قد را طوری می‌گیریم که دست دقیقاً به سرِ تیرک برسد
  const ph = clamp((gy - ey) / 0.63, 70, h * 0.34);
  person(ctx, ex - pDir * 0.22 * ph, gy, ph, {
    P, pose: 'push', dir: pDir, t: env.time * 3,
    effort: clamp(state.effortN / Math.max(state.loadN, 1), 0.15, 1)
  });
  gauge(ctx, ex - pDir * 6, ey - 52 * z, state.effortN, Math.max(state.loadN, state.effortN), P);

  if (showDims) {
    const dy = gy + 20;
    dim(ctx, fx, dy, lx, dy, `بازوی بار d_w = ${fa(num(state.loadArmM, 2))} م`, { color: P.load });
    dim(ctx, ex, dy + 24, fx, dy + 24, `بازوی نیرو d_F = ${fa(num(state.effortArmM, 2))} م`, { color: P.effort });
  }
  label(ctx, w * 0.5, h * 0.06, state.leverClass.name, { size: 11.5 });
  if (t > 0 && t < 1) {
    travelReadout(ctx, w * 0.5, h * 0.06 + 22, 'بار بالا رفت', state.loadDistanceM * t, state.loadDistanceM, P.load, P);
    travelReadout(ctx, w * 0.5, h * 0.06 + 42, 'دست پایین رفت', state.effortDistanceM * t, state.effortDistanceM, P.effort, P);
  }

  if (showVectors) {
    const mx = Math.max(state.loadN, state.effortN, 1);
    const L = (f) => clamp(Math.sqrt(f / mx) * 78, 26, 86);
    arrow(ctx, lx, ly - size * 1.1, lx, ly - size * 1.1 + L(state.loadN), { color: P.load, width: 3.2, text: `وزن ${N(state.loadN)}`, labelAt: 'tip', textSize: 10 });
    arrow(ctx, ex, ey - 14, ex, ey - 14 + L(state.effortN), { color: P.effort, width: 3.4, text: `نیروی ما ${N(state.effortN)}`, labelAt: 'tip', textSize: 10 });
    arrow(ctx, fx, gy - 6, fx, gy - 6 - fulcrumH * 0.5, { color: P.normal, width: 2.4, text: 'تکیه‌گاه', dashed: true, labelAt: 'tip', textSize: 10 });
  }

  return [{
    id: 'fulcrum', x: fx, y: gy - fulcrumH * 0.4, r: 20,
    hint: 'تکیه‌گاه را بکش و جابه‌جا کن',
    toValue: (px) => clamp((originX - px) / scale, 0.1, g.beamLengthM - 0.1)
  }];
}

// ══════════════ ۴) قرقره ══════════════
function pulleyLayout(system, geo) {
  const { cx, topY, crateTopY, groundY, R } = geo;
  const L = { top: [], bottom: [], anchor: null, path: [], hand: null, pullDown: system.changesDirection };

  if (system.id === 'NONE') {
    L.hand = [cx + 30, topY + 88];
    L.path = [[cx, crateTopY], L.hand];
    L.pullDown = false;
  } else if (system.id === 'FIXED') {
    const S = [cx, topY + R + 6];
    L.top = [S];
    L.hand = [cx + 132, groundY - 54];
    L.path = [[cx, crateTopY], [S[0] - R, S[1]], [S[0], S[1] - R], [S[0] + R, S[1]], L.hand];
  } else if (system.id === 'MOVABLE') {
    const M = [cx, crateTopY - R - 8];
    L.bottom = [M];
    L.anchor = [cx - R, topY + 10];
    L.hand = [cx + R + 70, topY + 92];
    L.path = [L.anchor, [M[0] - R, M[1]], [M[0], M[1] + R], [M[0] + R, M[1]], L.hand];
    L.pullDown = false;
  } else if (system.id === 'COMPOUND_2') {
    const M = [cx, crateTopY - R - 8];
    const T = [cx + R * 2.6, topY + R + 6];
    L.bottom = [M]; L.top = [T];
    L.anchor = [cx - R, topY + 10];
    L.hand = [T[0] + 112, groundY - 54];
    L.path = [L.anchor, [M[0] - R, M[1]], [M[0], M[1] + R], [M[0] + R, M[1]],
      [T[0] - R, T[1]], [T[0], T[1] - R], [T[0] + R, T[1]], L.hand];
  } else if (system.id === 'COMPOUND_3') {
    const M = [cx, crateTopY - R - 8];
    const T1 = [cx - R * 2.4, topY + R + 6];
    const T2 = [cx + R * 2.4, topY + R + 6];
    L.bottom = [M]; L.top = [T1, T2];
    L.anchor = [M[0] - R * 0.2, M[1] + R + 4];
    L.hand = [T2[0] + 106, groundY - 54];
    L.path = [L.anchor, [T1[0] - R, T1[1]], [T1[0], T1[1] - R], [T1[0] + R, T1[1]],
      [M[0] - R, M[1]], [M[0], M[1] + R], [M[0] + R, M[1]],
      [T2[0] - R, T2[1]], [T2[0], T2[1] - R], [T2[0] + R, T2[1]], L.hand];
  } else {
    const M1 = [cx - R * 1.15, crateTopY - R - 10];
    const M2 = [cx + R * 1.15, crateTopY - R - 10];
    const T1 = [cx - R * 1.15, topY + R + 6];
    const T2 = [cx + R * 1.15, topY + R + 6];
    L.bottom = [M1, M2]; L.top = [T1, T2];
    L.anchor = [cx - R * 2.6, topY + 10];
    L.hand = [T2[0] + 110, groundY - 54];
    L.path = [L.anchor,
      [M1[0] - R, M1[1]], [M1[0], M1[1] + R], [M1[0] + R, M1[1]],
      [T1[0] - R, T1[1]], [T1[0], T1[1] - R], [T1[0] + R, T1[1]],
      [M2[0] - R, M2[1]], [M2[0], M2[1] + R], [M2[0] + R, M2[1]],
      [T2[0] - R, T2[1]], [T2[0], T2[1] - R], [T2[0] + R, T2[1]], L.hand];
  }
  return L;
}

function scenePulley(ctx, env) {
  const { w, h, gy, P, t, state, showVectors, showDims } = env;
  const system = state.system;
  const topY = h * 0.13;
  const cx = w * 0.44;
  const R = 17;
  const size = clamp(36 + state.massKg * 0.24, 40, 66);

  const liftPx = (gy - topY - 118) * t;
  const crateCY = gy - size * 0.42 - liftPx;
  const crateTopY = crateCY - size * 0.41;

  // تیر سقف روی دو پایه
  const beamX0 = w * 0.16, beamX1 = w * 0.86;
  wall(ctx, beamX1 - 26, beamX1 - 2, topY + 8, gy, P);
  wall(ctx, beamX0 + 2, beamX0 + 26, topY + 8, gy, P);
  plank(ctx, beamX0, topY, beamX1 - beamX0, 15, 0, P);

  const L = pulleyLayout(system, { cx, topY, crateTopY, groundY: gy, R });
  rope(ctx, L.path, P, { width: 3.2 });

  const spin = t * 12;
  for (const [sx, sy] of L.top) sheave(ctx, sx, sy, R, spin, P, { mount: 'top' });
  for (const [sx, sy] of L.bottom) sheave(ctx, sx, sy, R, -spin, P, { mount: 'hook' });

  if (L.bottom.length) {
    const mid = L.bottom.length === 1 ? L.bottom[0]
      : [(L.bottom[0][0] + L.bottom[1][0]) / 2, L.bottom[0][1]];
    ctx.save();
    ctx.strokeStyle = P.metalDark; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(mid[0], mid[1] + R + 2); ctx.lineTo(cx, crateTopY); ctx.stroke();
    ctx.restore();
  }
  crate(ctx, cx, crateCY, size, 0, P, { massKg: state.massKg, shadow: t < 0.05 });

  const [hx, hy] = L.hand;
  const effort = clamp(state.effortN / Math.max(state.loadN, 1), 0.15, 1);
  if (L.pullDown) {
    person(ctx, hx + 16, gy, 92, { P, pose: 'pull', dir: -1, t: env.time * 3, effort });
    gauge(ctx, hx - 54, hy - 34, state.effortN, Math.max(state.loadN, state.effortN), P);
  } else {
    platform(ctx, hx + 32, hy + 52, 88, P);
    person(ctx, hx + 22, hy + 52, 86, { P, pose: 'up', dir: -1, t: env.time * 3, effort });
    gauge(ctx, hx - 30, hy - 18, state.effortN, Math.max(state.loadN, state.effortN), P);
    label(ctx, hx + 32, hy + 78, 'بدون تغییر جهت: باید رو به بالا بکشیم', { size: 10 });
  }

  if (showDims) {
    dim(ctx, w * 0.28, gy, w * 0.28, gy - liftPx - 1,
      `بار: ${fa(num(state.loadDistanceM * t, 2))} از ${fa(num(state.loadDistanceM, 2))} متر`, { color: P.load });
  }
  label(ctx, w * 0.5, h * 0.07,
    `${fa(state.strands)} رشتهٔ نگهدارندهٔ بار — طنابی که می‌کشیم ${fa(num(state.effortDistanceM, 2))} متر`,
    { size: 11 });

  if (showVectors) {
    const mx = Math.max(state.loadN, state.effortN, 1);
    const Lf = (f) => clamp(Math.sqrt(f / mx) * 78, 26, 86);
    arrow(ctx, cx, crateCY, cx, crateCY + Lf(state.loadN), { color: P.load, width: 3.2, text: `وزن ${N(state.loadN)}`, labelAt: 'tip', textSize: 10 });
    arrow(ctx, hx, hy, hx, hy + (L.pullDown ? 1 : -1) * Lf(state.effortN), { color: P.effort, width: 3.4, text: `نیروی ما ${N(state.effortN)}`, labelAt: 'tip', textSize: 10 });
  }
  return [];
}

// ══════════════ ۵) چرخ و محور ══════════════
function sceneWheelAxle(ctx, env) {
  const { w, h, gy, P, t, state, showVectors, showDims } = env;
  const g = state.geom;
  const z = zoom(h);
  const cx = w * 0.46;

  // قدِ کارگر مبنای همهٔ ارتفاع‌هاست تا صحنه واقعی به‌نظر برسد
  const ph = clamp(h * 0.40, 100, 300);
  const wellH = 0.30 * ph;
  const wellTop = gy - wellH;
  const axleY = gy - ph * 0.86;                    // محور در ارتفاع سینهٔ کارگر

  // مقیاس متر→پیکسل طوری که چرخ از فاصلهٔ محور تا لبهٔ چاه بزرگ‌تر نشود
  const pxPerM = Math.min(150 * z, (ph * 0.50) / Math.max(g.wheelRadiusM, 0.05));
  const Rpx = Math.max(24, g.wheelRadiusM * pxPerM);
  const rpx = clamp(g.axleRadiusM * pxPerM, 5, Rpx * 0.8);

  // چاه
  wall(ctx, cx - 74 * z, cx + 74 * z, wellTop, gy, P);
  ctx.save();
  ctx.fillStyle = '#2b241d';
  ctx.beginPath(); ctx.ellipse(cx, wellTop, 52 * z, 9 * z, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // پایه‌ها
  plank(ctx, cx - 74 * z, axleY, 12 * z, wellTop - axleY + 4, 0, P);
  plank(ctx, cx + 62 * z, axleY, 12 * z, wellTop - axleY + 4, 0, P);

  const spin = -t * 9;
  // محور
  ctx.save();
  ctx.translate(cx, axleY);
  ctx.fillStyle = grad(ctx, -rpx, -rpx, rpx, rpx, [[0, P.woodLight], [1, P.woodDark]]);
  ctx.beginPath(); ctx.arc(0, 0, rpx, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = P.woodDark; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
  // چرخ
  ctx.save();
  ctx.translate(cx, axleY);
  ctx.rotate(spin);
  ctx.strokeStyle = P.wood; ctx.lineWidth = 6 * z;
  ctx.beginPath(); ctx.arc(0, 0, Rpx, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = P.woodDark; ctx.lineWidth = 3.5 * z;
  for (let i = 0; i < 6; i++) {
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos((i / 6) * Math.PI * 2) * Rpx, Math.sin((i / 6) * Math.PI * 2) * Rpx);
    ctx.stroke();
  }
  ctx.fillStyle = P.metalDark;
  ctx.beginPath(); ctx.arc(Rpx, 0, 7 * z, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // طناب و سطل — پس از چرخ رسم می‌شوند تا جلوتر دیده شوند
  const size = clamp((30 + state.massKg * 0.28) * z * 0.8, 30, ph * 0.30);
  const bucketCY = lerp(wellTop + wellH * 0.9, axleY + rpx + size * 0.62, t);
  rope(ctx, [[cx, axleY], [cx, bucketCY - size * 0.45]], P, { width: 2.6 });
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, w, wellTop);           // بخشی که داخل چاه است دیده نمی‌شود
  ctx.clip();
  crate(ctx, cx, bucketCY, size, 0, P, { massKg: state.massKg, shadow: false });
  ctx.restore();

  const handleX = cx + Math.cos(spin) * Rpx;
  const handleY = axleY + Math.sin(spin) * Rpx;


  person(ctx, cx + Rpx + 0.22 * ph, gy, ph, {
    P, pose: 'crank', dir: -1, t: env.time * 3,
    effort: clamp(state.effortN / Math.max(state.loadN, 1), 0.15, 1)
  });
  gauge(ctx, cx + Rpx + 0.5 * ph, axleY - 12, state.effortN, Math.max(state.loadN, state.effortN), P);

  if (showDims) {
    dim(ctx, cx, axleY - Rpx - 16, cx + Rpx, axleY - Rpx - 16, `شعاع چرخ R = ${fa(num(g.wheelRadiusM, 2))} م`, { color: P.effort });
    dim(ctx, cx - rpx, axleY - rpx - 6, cx, axleY - rpx - 6, `شعاع محور r = ${fa(num(g.axleRadiusM, 2))} م`, { color: P.load, offset: 30 });
  }
  label(ctx, cx, under(gy, h, 26), `مزیت مکانیکی = R ÷ r = ${fa(num(state.maIdeal, 2))}`, { size: 11 });
  if (t > 0 && t < 1) {
    travelReadout(ctx, w * 0.5, h * 0.06, 'بار بالا رفت', state.loadDistanceM * t, state.loadDistanceM, P.load, P);
    travelReadout(ctx, w * 0.5, h * 0.06 + 20, 'دست پیمود', state.effortDistanceM * t, state.effortDistanceM, P.effort, P);
  }
  if (showVectors) {
    const mx = Math.max(state.loadN, state.effortN, 1);
    const Lf = (f) => clamp(Math.sqrt(f / mx) * 78, 26, 84);
    arrow(ctx, handleX, handleY, handleX, handleY + Lf(state.effortN), { color: P.effort, width: 3.2, text: `نیروی ما ${N(state.effortN)}`, labelAt: 'tip', textSize: 10 });
    arrow(ctx, cx, bucketCY, cx, bucketCY + Lf(state.loadN), { color: P.load, width: 3.2, text: `وزن ${N(state.loadN)}`, labelAt: 'tip', textSize: 10 });
  }
  return [];
}

// ══════════════ ۶) گوه ══════════════
function sceneWedge(ctx, env) {
  const { w, h, gy, P, t, state, showVectors, showDims } = env;
  const g = state.geom;
  const z = zoom(h);
  const scale = 620 * z;
  const wl = clamp(g.lengthM * scale, 70, h * 0.34);
  const wt = clamp(g.thicknessM * scale, 12, wl * 0.7);

  const cx = w * 0.48;
  const logH = clamp(60 * z, 56, h * 0.20);
  const logY = gy - logH * 0.55;
  const logW = w * 0.46;
  const gap = wt * t;

  for (const side of [-1, 1]) {
    ctx.save();
    ctx.translate(cx + side * (gap / 2), logY);
    ctx.fillStyle = grad(ctx, 0, -logH / 2, 0, logH / 2, [[0, P.woodLight], [1, P.woodDark]]);
    rr(ctx, side === -1 ? -logW / 2 : 0, -logH / 2, logW / 2, logH, 4);
    ctx.fill();
    ctx.strokeStyle = P.woodDark; ctx.lineWidth = 1.4; ctx.stroke();
    ctx.strokeStyle = 'rgba(0,0,0,.16)'; ctx.lineWidth = 1.3;
    for (let i = 1; i <= 3; i++) {
      ctx.beginPath();
      ctx.arc(side === -1 ? -logW / 2 + 4 : logW / 2 - 4, 0, i * 11,
        side === -1 ? -1.2 : Math.PI - 1.2, side === -1 ? 1.2 : Math.PI + 1.2);
      ctx.stroke();
    }
    ctx.restore();
  }
  platform(ctx, cx, gy - 8, logW + 18, P);

  const wedgeTop = logY - logH / 2 - wl + (wl + 8) * t;
  ctx.save();
  ctx.translate(cx, wedgeTop);
  ctx.fillStyle = grad(ctx, -wt / 2, 0, wt / 2, wl, [[0, P.metalLight], [1, P.metalDark]]);
  ctx.beginPath();
  ctx.moveTo(-wt / 2, 0); ctx.lineTo(wt / 2, 0); ctx.lineTo(0, wl);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = P.metalDark; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();

  const hand = person(ctx, cx + logW * 0.30, gy, clamp(94 * z, 84, h * 0.30), {
    P, pose: 'hammer', dir: -1, t: env.time * 3,
    effort: clamp(state.effortN / Math.max(state.loadN, 1) * 2, 0.15, 1)
  });
  ctx.save();
  ctx.strokeStyle = P.woodDark; ctx.lineWidth = 5; ctx.lineCap = 'round';
  const mAng = Math.atan2(wedgeTop - 14 - hand.y, cx - hand.x);
  ctx.beginPath();
  ctx.moveTo(hand.x, hand.y);
  ctx.lineTo(hand.x + Math.cos(mAng) * 38, hand.y + Math.sin(mAng) * 38);
  ctx.stroke();
  ctx.fillStyle = P.metalDark;
  ctx.translate(hand.x + Math.cos(mAng) * 44, hand.y + Math.sin(mAng) * 44);
  ctx.rotate(mAng);
  rr(ctx, -11, -8, 22, 16, 3); ctx.fill();
  ctx.restore();
  gauge(ctx, cx - logW * 0.34, wedgeTop + 6, state.effortN, Math.max(state.loadN, state.effortN), P);

  if (showDims) {
    dim(ctx, cx - wt / 2 - 34, wedgeTop, cx - wt / 2 - 34, wedgeTop + wl, `طول گوه L = ${fa(num(g.lengthM * 100, 1))} سانتی‌متر`, { color: P.effort });
    dim(ctx, cx - wt / 2, wedgeTop - 24, cx + wt / 2, wedgeTop - 24, `ضخامت t = ${fa(num(g.thicknessM * 100, 1))} سانتی‌متر`, { color: P.load });
  }
  label(ctx, w * 0.5, under(gy, h, 30), `گوه = سطح شیب‌دارِ متحرک • MA = L ÷ t = ${fa(num(state.maIdeal, 2))}`, { size: 11 });
  if (showVectors) {
    const mx = Math.max(state.loadN, state.effortN, 1);
    const Lf = (f) => clamp(Math.sqrt(f / mx) * 76, 26, 82);
    arrow(ctx, cx, wedgeTop - 22, cx, wedgeTop - 22 + Lf(state.effortN), { color: P.effort, width: 3.4, text: `ضربهٔ ما ${N(state.effortN)}`, labelAt: 'tip', textSize: 10 });
    arrow(ctx, cx - wt / 2 - 6, logY, cx - wt / 2 - 6 - Lf(state.loadN) * 0.6, logY, { color: P.load, width: 3, text: 'مقاومت چوب', labelAt: 'tip', textSize: 10 });
    arrow(ctx, cx + wt / 2 + 6, logY, cx + wt / 2 + 6 + Lf(state.loadN) * 0.6, logY, { color: P.load, width: 3 });
  }
  return [];
}

// ══════════════ ۷) پیچ ══════════════
function sceneScrew(ctx, env) {
  const { w, h, gy, P, t, state, showVectors, showDims } = env;
  const g = state.geom;
  const z = zoom(h);
  const cx = w * 0.46;
  const shaftH = h * 0.34;
  const shaftW = 30 * z;
  const baseY = gy - 8;
  const liftPx = 50 * t;
  const topY = baseY - shaftH - liftPx;

  ctx.save();
  ctx.fillStyle = P.metalDark;
  rr(ctx, cx - 54, baseY - 16, 108, 18, 4); ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.fillStyle = grad(ctx, cx - shaftW / 2, 0, cx + shaftW / 2, 0, [[0, P.metalLight], [0.5, P.metal], [1, P.metalDark]]);
  rr(ctx, cx - shaftW / 2, topY, shaftW, baseY - 16 - topY, 3);
  ctx.fill();
  ctx.strokeStyle = P.metalDark; ctx.lineWidth = 1.4; ctx.stroke();
  const pitchPx = clamp(g.pitchM * 900, 6, 26);
  const phase = (t * 240) % pitchPx;
  for (let y = topY + 4 + phase; y < baseY - 18; y += pitchPx) {
    ctx.strokeStyle = 'rgba(0,0,0,.40)'; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(cx - shaftW / 2, y); ctx.lineTo(cx + shaftW / 2, y - pitchPx * 0.55); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.42)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(cx - shaftW / 2, y + 2.2); ctx.lineTo(cx + shaftW / 2, y - pitchPx * 0.55 + 2.2); ctx.stroke();
  }
  ctx.restore();

  ctx.save();
  ctx.fillStyle = P.metalDark;
  rr(ctx, cx - 44, topY - 12, 88, 14, 4); ctx.fill();
  ctx.restore();
  const rSize = clamp(36 + state.massKg * 0.08, 42, 78);
  ctx.save();
  ctx.fillStyle = grad(ctx, cx - rSize, topY - rSize, cx + rSize, topY, [[0, '#9d958a'], [1, '#645d54']]);
  ctx.beginPath(); ctx.ellipse(cx, topY - 12 - rSize * 0.6, rSize, rSize * 0.62, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#544d45'; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
  label(ctx, cx, topY - 12 - rSize * 1.45, `تخته‌سنگ ${fa(state.massKg)} کیلوگرم`, { size: 10 });

  const ang = t * 10;
  const Rpx = clamp(g.handleRadiusM * 190, 46, 112);
  const handleY = gy - clamp(96 * z, 84, h * 0.30) * 0.62;
  const e1 = [cx + Math.cos(ang) * Rpx, handleY + Math.sin(ang) * Rpx * 0.22];
  const e2 = [cx - Math.cos(ang) * Rpx, handleY - Math.sin(ang) * Rpx * 0.22];
  const near = e1[0] >= e2[0] ? e1 : e2;
  const far = near === e1 ? e2 : e1;
  ctx.save();
  ctx.strokeStyle = P.metalDark; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(far[0], far[1]); ctx.lineTo(near[0], near[1]); ctx.stroke();
  ctx.fillStyle = P.woodDark;
  ctx.beginPath(); ctx.arc(near[0], near[1], 9, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(far[0], far[1], 7, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  person(ctx, near[0] + 0.24 * clamp(96 * z, 84, h * 0.30), gy, clamp(96 * z, 84, h * 0.30), {
    P, pose: 'crank', dir: -1, t: env.time * 3,
    effort: clamp(state.effortN / Math.max(state.loadN, 1) * 6, 0.15, 1)
  });
  gauge(ctx, near[0] + 8, handleY - 54, state.effortN, Math.max(state.effortN * 2, 1), P);

  if (showDims) {
    dim(ctx, cx, handleY + 34, cx + Rpx, handleY + 34, `شعاع دسته R = ${fa(num(g.handleRadiusM * 100, 1))} سانتی‌متر`, { color: P.effort });
    label(ctx, cx - shaftW / 2 - 66, topY + 58, `گام پیچ = ${fa(num(g.pitchM * 1000, 1))} میلی‌متر`, { size: 10, color: P.load });
  }
  label(ctx, w * 0.5, under(gy, h, 28), `${fa(state.turns)} دور چرخش برای ${fa(num(state.loadDistanceM, 2))} متر بالا رفتن`, { size: 11 });
  if (showVectors) {
    arrow(ctx, near[0], near[1], near[0], near[1] + 50, { color: P.effort, width: 3.2, text: `نیروی ما ${N(state.effortN)}`, labelAt: 'tip', textSize: 10 });
    arrow(ctx, cx, topY - 18, cx, topY - 18 + 62, { color: P.load, width: 3.2, text: `وزن ${N(state.loadN)}`, labelAt: 'tip', textSize: 10 });
  }
  return [];
}

// ══════════════ ۸) چرخ‌دنده‌ها ══════════════
function sceneGears(ctx, env) {
  const { w, h, P, state, time, t } = env;
  const cy = h * 0.46;
  // اندازه‌ها نسبت واقعی دندانه‌ها را نگه می‌دارند و بعد در کادر جا داده می‌شوند
  const u1 = 1, u2 = state.drivenTeeth / state.driverTeeth;
  const span = 0.885 * (u1 + u2) + u1 + u2;
  const k = Math.min((w * 0.80) / span, (h * 0.38) / Math.max(u1, u2));
  const R1 = u1 * k, r2 = u2 * k;
  const gap = (R1 + r2) * 0.885;
  const x2 = (w - (span * k)) / 2 + r2;
  const x1 = x2 + gap;

  const spin = (time * 0.9 + t * 3) * (state.inputRpm / 60);
  gear(ctx, x1, cy, R1, state.driverTeeth, spin, '#e08a1e', P);
  gear(ctx, x2, cy, r2, state.drivenTeeth, -spin * (state.driverTeeth / state.drivenTeeth) + Math.PI / state.drivenTeeth, '#1a7fb8', P);

  label(ctx, x1, cy + R1 + 24, `چرخ‌دندهٔ محرک — ${fa(state.driverTeeth)} دندانه`, { size: 11 });
  label(ctx, x2, cy + r2 + 24, `چرخ‌دندهٔ متحرک — ${fa(state.drivenTeeth)} دندانه`, { size: 11 });
  label(ctx, x1, cy - R1 - 22, `${fa(state.inputRpm)} دور/دقیقه`, { size: 10.5, color: '#a2560a' });
  label(ctx, x2, cy - r2 - 22, `${fa(num(state.outputRpm, 1))} دور/دقیقه`, { size: 10.5, color: '#0f5f8c' });

  for (const [x, r, dir, color] of [[x1, R1, 1, '#a2560a'], [x2, r2, -1, '#0f5f8c']]) {
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(x, cy, r * 0.42, dir > 0 ? -0.6 : Math.PI + 0.6, dir > 0 ? 1.6 : Math.PI - 1.6, dir < 0);
    ctx.stroke();
    ctx.restore();
  }
  return [];
}

const SCENES = {
  FRICTION: sceneFriction,
  INCLINED_PLANE: sceneIncline,
  LEVER: sceneLever,
  PULLEY: scenePulley,
  WHEEL_AXLE: sceneWheelAxle,
  WEDGE: sceneWedge,
  SCREW: sceneScrew,
  GEARS: sceneGears
};

// مدیریت بوم: اندازه، حلقهٔ انیمیشن، تم، ذرات و کشیدن دستگیره‌ها




class Stage {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.dpr = 1;
    this.w = 0;
    this.h = 0;
    this.time = 0;
    this.theme = 'light';
    this.handles = [];
    this.activeHandle = null;
    this.hoverHandle = null;
    this.reducedMotion = false;
    this.getState = () => null;
    this.onHandleChange = () => {};
    this.running = false;
    this._lastFrame = 0;

    this._bindPointer();

    if (typeof ResizeObserver !== 'undefined') {
      this._ro = new ResizeObserver(() => this.resize());
      this._ro.observe(canvas);
    }
  }

  get palette() {
    return this.theme === 'dark' ? PALETTE.dark : PALETTE.light;
  }

  setTheme(theme) { this.theme = theme; }

  resize() {
    const rect = this.canvas.getBoundingClientRect();
    if (rect.width < 2 || rect.height < 2) return;
    this.dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    this.w = rect.width;
    this.h = rect.height;
    this.canvas.width = Math.round(rect.width * this.dpr);
    this.canvas.height = Math.round(rect.height * this.dpr);
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    this.render();
  }

  start() {
    if (this.running) return;
    this.running = true;
    this._lastFrame = performance.now();
    const loop = (now) => {
      if (!this.running) return;
      const dt = Math.min(0.05, (now - this._lastFrame) / 1000);
      this._lastFrame = now;
      if (!this.reducedMotion) this.time += dt;
      this.render();
      this._raf = requestAnimationFrame(loop);
    };
    this._raf = requestAnimationFrame(loop);
  }

  stop() {
    this.running = false;
    if (this._raf) cancelAnimationFrame(this._raf);
  }

  render() {
    const view = this.getState();
    if (!view || !this.w) return;
    const ctx = this.ctx;
    const P = this.palette;
    setPalette(P);
    ctx.clearRect(0, 0, this.w, this.h);

    const gy = drawWorld(ctx, this.w, this.h, P, { groundRatio: GROUND_RATIO[view.machine] ?? 0.84 });

    const scene = SCENES[view.machine];
    let handles = [];
    if (scene) {
      ctx.save();
      try {
        handles = scene(ctx, {
          w: this.w, h: this.h, gy, P,
          time: this.time,
          t: clamp(view.t ?? 0, 0, 1),
          state: view.state,
          showVectors: !!view.showVectors,
          showDims: view.showDims !== false
        }) || [];
      } catch (err) {
        console.error('خطا در رسم صحنه:', err);
      }
      ctx.restore();
    }

    this.handles = view.interactive === false ? [] : handles;
    this._drawHandles(ctx, P);

    if (this.theme === 'contrast') {
      ctx.save();
      ctx.globalCompositeOperation = 'saturation';
      ctx.fillStyle = 'hsl(0,0%,50%)';
      ctx.fillRect(0, 0, this.w, this.h);
      ctx.restore();
    }
  }

  _drawHandles(ctx, P) {
    for (const hd of this.handles) {
      const active = this.activeHandle === hd.id || this.hoverHandle === hd.id;
      ctx.save();
      ctx.translate(hd.x, hd.y);
      ctx.beginPath();
      ctx.arc(0, 0, hd.r, 0, Math.PI * 2);
      ctx.fillStyle = active ? 'rgba(240,144,12,.30)' : 'rgba(255,255,255,.55)';
      ctx.fill();
      ctx.setLineDash([5, 4]);
      ctx.strokeStyle = active ? '#f0900c' : 'rgba(30,50,70,.55)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = active ? '#f0900c' : 'rgba(30,50,70,.7)';
      ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
      // پیکان‌های راهنما
      ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 2; ctx.lineCap = 'round';
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(s * (hd.r - 4), 0);
        ctx.lineTo(s * (hd.r - 9), -4);
        ctx.moveTo(s * (hd.r - 4), 0);
        ctx.lineTo(s * (hd.r - 9), 4);
        ctx.stroke();
      }
      ctx.restore();
      if (active && hd.hint) {
        ctx.save();
        ctx.font = '700 11px Vazirmatn, Tahoma, sans-serif';
        ctx.direction = 'rtl';
        ctx.textAlign = 'center';
        const tw = ctx.measureText(hd.hint).width + 14;
        ctx.fillStyle = 'rgba(20,35,50,.9)';
        rr(ctx, hd.x - tw / 2, hd.y - hd.r - 30, tw, 22, 8);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.textBaseline = 'middle';
        ctx.fillText(hd.hint, hd.x, hd.y - hd.r - 19);
        ctx.restore();
      }
    }
  }

  _pos(e) {
    const rect = this.canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  _hit(pos) {
    for (const hd of this.handles) {
      if (Math.hypot(pos.x - hd.x, pos.y - hd.y) <= hd.r + 8) return hd;
    }
    return null;
  }

  _bindPointer() {
    const c = this.canvas;
    c.addEventListener('pointerdown', (e) => {
      const hit = this._hit(this._pos(e));
      if (hit) {
        this.activeHandle = hit.id;
        c.setPointerCapture(e.pointerId);
        e.preventDefault();
      }
    });
    c.addEventListener('pointermove', (e) => {
      const pos = this._pos(e);
      if (this.activeHandle) {
        const hd = this.handles.find((x) => x.id === this.activeHandle);
        if (hd && hd.toValue) this.onHandleChange(hd.id, hd.toValue(pos.x, pos.y));
        return;
      }
      const hit = this._hit(pos);
      const id = hit ? hit.id : null;
      if (id !== this.hoverHandle) {
        this.hoverHandle = id;
        c.style.cursor = id ? 'grab' : 'default';
      }
    });
    const end = () => {
      if (this.activeHandle) this.activeHandle = null;
      c.style.cursor = this.hoverHandle ? 'grab' : 'default';
    };
    c.addEventListener('pointerup', end);
    c.addEventListener('pointercancel', end);
    c.addEventListener('pointerleave', () => { this.hoverHandle = null; });
  }

}

/** سازندهٔ کوتاه عناصر DOM */
function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, val] of Object.entries(props)) {
    if (val === null || val === undefined || val === false) continue;
    if (k === 'class') node.className = val;
    else if (k === 'text') node.textContent = val;
    else if (k.startsWith('on') && typeof val === 'function') node.addEventListener(k.slice(2).toLowerCase(), val);
    else node.setAttribute(k, val === true ? '' : String(val));
  }
  for (const c of [].concat(children)) {
    if (c === null || c === undefined || c === false) continue;
    node.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return node;
}

/** کارت بخش‌بندی؛ collapsible = قابل باز و بسته شدن */
function card(title, children, opts = {}) {
  const { open = true, collapsible = false, id = null, onToggle = null } = opts;
  const body = el('div', { class: 'card-body' }, [].concat(children).filter(Boolean));
  if (!collapsible) {
    return el('section', { class: 'card' }, [title ? el('h2', { class: 'card-title' }, [title]) : null, body]);
  }
  const head = el('button', {
    class: 'card-title is-toggle', type: 'button', 'aria-expanded': open ? 'true' : 'false',
    onclick: () => {
      const now = head.getAttribute('aria-expanded') !== 'true';
      head.setAttribute('aria-expanded', now ? 'true' : 'false');
      body.hidden = !now;
      if (onToggle) onToggle(now);
    }
  }, [el('span', {}, [title]), el('span', { class: 'chev', 'aria-hidden': 'true' }, ['▾'])]);
  body.hidden = !open;
  return el('section', { class: 'card', id }, [head, body]);
}

// ─────────── کنترل‌ها ───────────

const decimalsOf = (c) => (c.decimals !== undefined ? c.decimals : (Number.isInteger(c.step) ? 0 : 1));

function sliderField(control, value, max, onChange) {
  const d = decimalsOf(control);
  const out = el('input', {
    class: 'field-number', type: 'text', inputmode: 'decimal',
    value: fa(num(value, d)),
    'aria-label': `${control.label} بر حسب ${control.unit || ''}`,
    title: `بین ${fa(num(control.min, d))} و ${fa(num(max, d))}`
  });
  const range = el('input', {
    type: 'range', min: control.min, max, step: control.step, value,
    tabindex: '-1', 'aria-hidden': 'true'
  });
  const setFill = (v) => {
    const pct = ((v - control.min) / (max - control.min)) * 100;
    range.style.setProperty('--fill', `${clamp(pct, 0, 100)}%`);
  };
  const apply = (v, fromRange) => {
    const clamped = clamp(v, control.min, max);
    setFill(clamped);
    out.value = fa(num(clamped, d));
    range.value = clamped;
    onChange(control.key, clamped);
  };
  range.addEventListener('input', () => apply(Number(range.value), true));
  const commit = () => {
    const v = parseFa(out.value);
    if (Number.isFinite(v)) apply(v, false);
    else out.value = fa(num(Number(range.value), d));
  };
  out.addEventListener('change', commit);
  out.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); commit(); } });
  setFill(value);

  return el('div', { class: 'field' }, [
    el('div', { class: 'field-head' }, [
      el('label', {}, [control.label]),
      el('div', { class: 'field-input' }, [out, control.unit ? el('span', { class: 'unit' }, [control.unit]) : null])
    ]),
    range
  ]);
}

function segmentField(control, value, onChange) {
  const wrap = el('div', { class: `segment${control.options.length <= 2 ? ' cols-2' : ''}`, role: 'group', 'aria-label': control.label });
  for (const opt of control.options) {
    const active = String(opt.value) === String(value);
    wrap.append(el('button', {
      class: `seg${active ? ' is-active' : ''}`, type: 'button',
      'aria-pressed': active ? 'true' : 'false',
      onclick: () => onChange(control.key, control.numeric ? Number(opt.value) : opt.value)
    }, [
      opt.icon ? el('span', { class: 'seg-icon', 'aria-hidden': 'true' }, [opt.icon]) : null,
      el('span', {}, [opt.label]),
      opt.sub ? el('span', { class: 'seg-sub' }, [opt.sub]) : null
    ]));
  }
  return el('div', { class: 'field' }, [el('p', { class: 'field-label' }, [control.label]), wrap]);
}

function switchField(control, value, onChange) {
  return el('label', { class: 'field switch' }, [
    el('input', { type: 'checkbox', checked: !!value, onchange: (e) => onChange(control.key, e.target.checked) }),
    el('span', { class: 'track', 'aria-hidden': 'true' }),
    el('span', {}, [control.label, control.sub ? el('span', { class: 'switch-sub' }, [control.sub]) : null])
  ]);
}

function buildControls(machineId, params, onChange) {
  const frag = document.createDocumentFragment();
  for (const c of MACHINE_CONTROLS[machineId] || []) {
    const value = params[c.key];
    if (c.kind === 'slider') {
      const max = c.maxKey ? Number(params[c.maxKey]) + (c.maxOffset || 0) : c.max;
      frag.append(sliderField(c, clamp(value, c.min, max), Math.max(c.min + c.step, max), onChange));
    } else if (c.kind === 'segment') frag.append(segmentField(c, value, onChange));
    else if (c.kind === 'switch') frag.append(switchField(c, value, onChange));
  }
  return frag;
}

const CHART_SPEC = {
  FRICTION: { type: 'bars', key: 'surfaceId', values: ['ROUGH_STONE', 'WOOD_PLANKS', 'SMOOTH_TRACK', 'ICE'], labels: ['سنگ', 'چوب', 'صیقلی', 'یخ'], title: 'نیروی لازم روی سطح‌های گوناگون' },
  PULLEY: { type: 'bars', key: 'systemId', values: ['NONE', 'FIXED', 'MOVABLE', 'COMPOUND_2', 'COMPOUND_3', 'COMPOUND_4'], labels: ['بدون', 'ثابت', 'متحرک', 'مرکب۲', 'مرکب۳', 'مرکب۴'], title: 'نیروی لازم با سامانه‌های قرقره' },
  INCLINED_PLANE: { type: 'line', key: 'lengthM', title: 'نیرو بر حسب طول رمپ', xUnit: 'متر' },
  LEVER: { type: 'line', key: 'fulcrumM', title: 'نیرو بر حسب جای تکیه‌گاه', xUnit: 'متر' },
  WHEEL_AXLE: { type: 'line', key: 'wheelRadiusM', title: 'نیرو بر حسب شعاع چرخ', xUnit: 'متر' },
  WEDGE: { type: 'line', key: 'thicknessM', title: 'نیرو بر حسب ضخامت گوه', xUnit: 'متر' },
  SCREW: { type: 'line', key: 'pitchM', title: 'نیرو بر حسب گام پیچ', xUnit: 'متر' },
  GEARS: { type: 'line', key: 'drivenTeeth', title: 'گشتاور خروجی بر حسب دندانه‌ها', xUnit: 'دندانه', yKey: 'outputTorqueNm', yLabel: 'گشتاور' }
};

function drawChart(canvas, machineId, params, dark) {
  const spec = CHART_SPEC[machineId];
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rect = canvas.getBoundingClientRect();
  const w = rect.width || 300, h = rect.height || 150;
  canvas.width = w * dpr; canvas.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  if (!spec) return;

  const ink = dark ? '#a8becf' : '#4a627a';
  const line = dark ? '#24394c' : '#dde5ec';
  const accent = '#0b7fc4';
  const yKey = spec.yKey || 'effortN';
  const pad = { t: 12, r: 12, b: 26, l: 44 };
  const pw = w - pad.l - pad.r, ph = h - pad.t - pad.b;
  const evaluate = (p) => solve(machineId, resolveParams(machineId, p));

  const points = [];
  if (spec.type === 'bars') {
    spec.values.forEach((val, i) => {
      points.push({ x: i, y: evaluate({ ...params, [spec.key]: val, useRollers: false })[yKey], label: spec.labels[i], current: String(params[spec.key]) === String(val) });
    });
  } else {
    const def = (MACHINE_CONTROLS[machineId] || []).find((c) => c.key === spec.key);
    if (!def) return;
    for (let i = 0; i <= 30; i++) {
      const x = def.min + ((def.max - def.min) * i) / 30;
      points.push({ x, y: evaluate({ ...params, [spec.key]: x })[yKey] });
    }
  }

  const yMax = Math.max(...points.map((p) => p.y)) * 1.12 || 1;
  const xs = points.map((p) => p.x);
  const xMin = Math.min(...xs), xMax = Math.max(...xs);
  const X = (x) => pad.l + (spec.type === 'bars' ? ((x + 0.5) / points.length) * pw : ((x - xMin) / (xMax - xMin || 1)) * pw);
  const Y = (y) => pad.t + ph - (y / yMax) * ph;

  ctx.strokeStyle = line; ctx.lineWidth = 1;
  ctx.font = '600 10px Vazirmatn, Tahoma, sans-serif';
  ctx.fillStyle = ink; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let i = 0; i <= 3; i++) {
    const y = pad.t + (ph / 3) * i;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
    ctx.fillText(fa(num((yMax * (3 - i)) / 3, 0)), pad.l - 6, y);
  }

  if (spec.type === 'bars') {
    const bw = (pw / points.length) * 0.6;
    ctx.textAlign = 'center';
    for (const p of points) {
      const x = X(p.x), y = Y(p.y);
      ctx.fillStyle = p.current ? '#e08a1e' : accent;
      ctx.globalAlpha = p.current ? 1 : 0.5;
      ctx.fillRect(x - bw / 2, y, bw, pad.t + ph - y);
      ctx.globalAlpha = 1;
      ctx.fillStyle = ink;
      ctx.fillText(p.label, x, h - 12);
    }
  } else {
    ctx.strokeStyle = accent; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
    ctx.beginPath();
    points.forEach((p, i) => (i ? ctx.lineTo(X(p.x), Y(p.y)) : ctx.moveTo(X(p.x), Y(p.y))));
    ctx.stroke();
    const cur = Number(params[spec.key]);
    ctx.fillStyle = '#e08a1e';
    ctx.beginPath(); ctx.arc(X(cur), Y(evaluate(params)[yKey]), 5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = ink; ctx.textAlign = 'center';
    ctx.fillText(`${fa(num(xMin, 2))} ${spec.xUnit}`, pad.l + 20, h - 10);
    ctx.fillText(`${fa(num(xMax, 2))} ${spec.xUnit}`, w - pad.r - 20, h - 10);
  }
}

const SAVE_KEY = 'azmayeshgah_mashinhaye_sadeh_v1';
const RUN_SECONDS = 3.4;

function preferredTheme() {
  const stamped = document.documentElement.dataset.theme;
  if (stamped === 'dark' || stamped === 'light') return stamped;
  return window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

class App {
  constructor() {
    this.state = {
      machine: 'INCLINED_PLANE',
      params: {},
      log: [],
      view: { vectors: false, dims: true, steps: true, chart: false, records: false },
      lab: { g: 10, ideal: false },
      theme: null
    };
    this.t = 0;
    this.running = false;
    this.slow = false;

    this.load();
    for (const id of MACHINE_IDS) {
      if (!this.state.params[id]) this.state.params[id] = { ...DEFAULT_PARAMS[id] };
    }
    if (!this.state.theme) this.state.theme = preferredTheme();
    setLab(this.state.lab);
  }

  load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return;
      const saved = JSON.parse(raw);
      this.state = {
        ...this.state, ...saved,
        view: { ...this.state.view, ...(saved.view || {}) },
        lab: { ...this.state.lab, ...(saved.lab || {}) }
      };
    } catch { /* ذخیرهٔ خراب را نادیده بگیر */ }
  }

  save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.state)); } catch { /* حافظه پر */ }
  }

  get machine() { return this.state.machine; }
  get params() { return this.state.params[this.state.machine]; }

  compute() {
    setLab(this.state.lab);
    return solve(this.machine, resolveParams(this.machine, this.params));
  }

  // ─────────── راه‌اندازی ───────────
  init() {
    this.dom = {
      bar: document.getElementById('machineBar'),
      canvas: document.getElementById('stageCanvas'),
      side: document.getElementById('sidepanel'),
      btnRun: document.getElementById('btnRun'),
      btnRunText: document.getElementById('btnRunText'),
      btnVectors: document.getElementById('btnVectors'),
      btnDims: document.getElementById('btnDims'),
      btnSlow: document.getElementById('btnSlow'),
      modal: document.getElementById('modal'),
      modalTitle: document.getElementById('modalTitle'),
      modalBody: document.getElementById('modalBody')
    };

    this.stage = new Stage(this.dom.canvas);
    this.stage.getState = () => this.viewState();
    this.stage.onHandleChange = (id, v) => this.onDrag(id, v);

    this.applyTheme();
    this.bind();
    this.stage.resize();
    this.stage.start();
    this.renderBar();
    this.renderSide();

    document.fonts?.ready.then(() => this.stage.render());
    window.addEventListener('resize', () => { this.stage.resize(); this.refreshChart(); });
  }

  viewState() {
    const state = this.compute();
    this.dom.canvas.setAttribute('aria-label', this.describe(state));
    return {
      machine: this.machine, state, t: this.t,
      showVectors: this.state.view.vectors,
      showDims: this.state.view.dims,
      interactive: !this.running
    };
  }

  describe(r) {
    if (r.machine === 'GEARS') {
      return `${MACHINES[r.machine].name}: نسبت دنده ${fa(num(r.ratio, 2))}، گشتاور خروجی ${fa(num(r.outputTorqueNm, 1))} نیوتون‌متر.`;
    }
    return `${MACHINES[r.machine].name}: وزن بار ${fa(num(r.loadN, 0))} نیوتون، نیروی لازم ${fa(num(r.effortN, 1))} نیوتون، مزیت مکانیکی ${fa(num(r.maActual || 1, 2))}.`;
  }

  applyTheme() {
    document.documentElement.dataset.theme = this.state.theme;
    this.stage.setTheme(this.state.theme);
  }

  bind() {
    const d = this.dom;
    d.btnRun.addEventListener('click', () => this.run());
    document.getElementById('btnReset').addEventListener('click', () => this.reset());
    d.btnVectors.addEventListener('click', () => this.toggleView('vectors', d.btnVectors));
    d.btnDims.addEventListener('click', () => this.toggleView('dims', d.btnDims));
    d.btnSlow.addEventListener('click', () => {
      this.slow = !this.slow;
      d.btnSlow.setAttribute('aria-pressed', this.slow ? 'true' : 'false');
    });
    d.btnDims.setAttribute('aria-pressed', this.state.view.dims ? 'true' : 'false');
    d.btnVectors.setAttribute('aria-pressed', this.state.view.vectors ? 'true' : 'false');

    document.getElementById('btnTheme').addEventListener('click', () => {
      this.state.theme = this.state.theme === 'dark' ? 'light' : 'dark';
      this.applyTheme();
      this.refreshChart();
      this.save();
    });
    document.getElementById('btnReport').addEventListener('click', () => this.printReport());
    document.getElementById('btnHelp').addEventListener('click', () => this.openHelp());
    d.modal.querySelectorAll('[data-close]').forEach((n) => n.addEventListener('click', () => this.closeModal()));
    window.addEventListener('keydown', (e) => this.onKey(e));
  }

  toggleView(key, btn) {
    this.state.view[key] = !this.state.view[key];
    btn.setAttribute('aria-pressed', this.state.view[key] ? 'true' : 'false');
    this.save();
  }

  onKey(e) {
    if (e.key === 'Escape') { this.closeModal(); return; }
    if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
    const k = e.key.toLowerCase();
    if (e.code === 'Space') { e.preventDefault(); this.run(); }
    else if (k === 'r' || k === 'ق') this.reset();
    else if (k === 'v' || k === 'و') this.dom.btnVectors.click();
    else if (k === 'd' || k === 'ی') this.dom.btnDims.click();
    else if (/^[1-8]$/.test(e.key)) this.setMachine(MACHINE_IDS[Number(e.key) - 1]);
  }

  // ─────────── ناوبری و پارامترها ───────────
  setMachine(id) {
    if (!id || id === this.state.machine) return;
    this.state.machine = id;
    this.reset();
    this.renderBar();
    this.renderSide();
    this.save();
  }

  setParam(key, value) {
    const p = this.params;
    p[key] = value;
    if (key === 'beamLengthM') {
      p.fulcrumM = Math.min(p.fulcrumM, value - 0.1);
      p.loadM = Math.min(p.loadM, p.fulcrumM - 0.05);
    }
    this.reset();
    this.refreshResults();
    this.save();
  }

  onDrag(id, value) {
    const p = this.params;
    if (id === 'fulcrum' && 'fulcrumM' in p) {
      const def = MACHINE_CONTROLS.LEVER.find((c) => c.key === 'fulcrumM');
      p.fulcrumM = Math.round(clamp(value, Math.max(def.min, p.loadM + 0.05), p.beamLengthM - 0.1) * 20) / 20;
    } else if (id === 'rampLength' && 'lengthM' in p) {
      const def = MACHINE_CONTROLS.INCLINED_PLANE.find((c) => c.key === 'lengthM');
      p.lengthM = Math.round(clamp(value, Math.max(def.min, p.heightM * 1.05), def.max) * 10) / 10;
    } else return;
    this.reset();
    this.renderSide();
    this.save();
  }

  // ─────────── اجرای حرکت ───────────
  run() {
    if (this.running) return;
    this.running = true;
    this.t = 0;
    this.dom.btnRun.disabled = true;
    this.dom.btnRunText.textContent = 'در حال حرکت…';
    const duration = (this.slow ? RUN_SECONDS * 2.6 : RUN_SECONDS) * 1000;
    const start = performance.now();
    const step = (now) => {
      const raw = clamp((now - start) / duration, 0, 1);
      this.t = easeInOut(raw);
      if (raw < 1) this._raf = requestAnimationFrame(step);
      else {
        this.running = false;
        this.dom.btnRun.disabled = false;
        this.dom.btnRunText.textContent = 'دوباره اجرا کن';
      }
    };
    this._raf = requestAnimationFrame(step);
  }

  reset() {
    if (this._raf) cancelAnimationFrame(this._raf);
    this.running = false;
    this.t = 0;
    if (this.dom) {
      this.dom.btnRun.disabled = false;
      this.dom.btnRunText.textContent = 'اجرای حرکت';
    }
  }

  // ─────────── نوار ماشین‌ها ───────────
  renderBar() {
    this.dom.bar.replaceChildren(...MACHINE_IDS.map((id, i) => el('button', {
      class: `chip${id === this.state.machine ? ' is-active' : ''}`,
      type: 'button',
      'aria-current': id === this.state.machine ? 'true' : null,
      onclick: () => this.setMachine(id)
    }, [
      el('span', { 'aria-hidden': 'true' }, [MACHINES[id].icon]),
      el('span', {}, [MACHINES[id].short]),
      el('kbd', { 'aria-hidden': 'true' }, [fa(i + 1)])
    ])));
  }

  // ─────────── پنل کناری ───────────
  renderSide() {
    const side = this.dom.side;
    const r = this.compute();
    const id = this.machine;

    // ۱) پارامترها
    const controls = el('div', {});
    controls.append(buildControls(id, this.params, (k, v) => this.setParam(k, v)));
    this._controls = controls;

    const labRow = el('div', { class: 'lab-row' }, [
      el('div', { class: 'lab-item' }, [
        el('span', { class: 'lab-label' }, ['شتاب گرانش g']),
        el('div', { class: 'segment cols-2' }, [10, 9.81].map((g) => el('button', {
          class: `seg${this.state.lab.g === g ? ' is-active' : ''}`, type: 'button',
          onclick: () => { this.state.lab.g = g; setLab(this.state.lab); this.reset(); this.renderSide(); this.save(); }
        }, [el('span', {}, [`${fa(g)} m/s²`]), el('span', { class: 'seg-sub' }, [g === 10 ? 'کتاب درسی' : 'مقدار واقعی'])])))
      ]),
      el('div', { class: 'lab-item' }, [
        el('span', { class: 'lab-label' }, ['اصطکاک']),
        el('div', { class: 'segment cols-2' }, [false, true].map((ideal) => el('button', {
          class: `seg${this.state.lab.ideal === ideal ? ' is-active' : ''}`, type: 'button',
          onclick: () => { this.state.lab.ideal = ideal; setLab(this.state.lab); this.reset(); this.renderSide(); this.save(); }
        }, [el('span', {}, [ideal ? 'آرمانی' : 'واقعی']), el('span', { class: 'seg-sub' }, [ideal ? 'بدون اصطکاک' : 'با اصطکاک'])])))
      ])
    ]);

    // ۲) اندازه‌گیری‌ها
    const measure = el('div', {});
    this._measure = measure;
    measure.append(quantityTable(r), el('p', { class: 'insight' }, [r.insightFa]));

    // ۳) محاسبهٔ گام‌به‌گام
    const steps = el('div', {});
    this._steps = steps;
    steps.append(stepsList(explain(r)));

    // ۴) نمودار
    const chartCanvas = CHART_SPEC[id] ? el('canvas', { class: 'chart' }) : null;
    this._chart = chartCanvas;

    // ۵) ثبت
    const records = el('div', {});
    this._records = records;
    records.append(
      el('div', { class: 'row-end' }, [
        el('button', { class: 'btn btn-quiet', onclick: () => this.record() }, ['➕ ثبت اندازه‌گیری'])
      ]),
      logTable(this.state.log.slice(0, 15), () => { this.state.log = []; this.save(); this.renderSide(); })
    );

    side.replaceChildren(
      card('پارامترهای آزمایش', [labRow, controls]),
      card('اندازه‌گیری‌ها', [measure]),
      card('محاسبهٔ گام‌به‌گام', [steps], {
        collapsible: true, open: this.state.view.steps,
        onToggle: (v) => { this.state.view.steps = v; this.save(); }
      }),
      chartCanvas ? card(CHART_SPEC[id].title, [chartCanvas], {
        collapsible: true, open: this.state.view.chart,
        onToggle: (v) => { this.state.view.chart = v; this.save(); if (v) this.refreshChart(); }
      }) : null,
      card(`ثبت و مقایسه${this.state.log.length ? ` (${fa(this.state.log.length)})` : ''}`, [records], {
        collapsible: true, open: this.state.view.records,
        onToggle: (v) => { this.state.view.records = v; this.save(); }
      })
    );
    this.refreshChart();
  }

  /** فقط بخش‌های وابسته به عدد را تازه می‌کند تا لغزنده‌ها پرش نکنند */
  refreshResults() {
    const r = this.compute();
    if (this._measure) this._measure.replaceChildren(quantityTable(r), el('p', { class: 'insight' }, [r.insightFa]));
    if (this._steps) this._steps.replaceChildren(stepsList(explain(r)));
    this.refreshChart();
  }

  refreshChart() {
    if (this._chart && CHART_SPEC[this.machine] && !this._chart.closest('[hidden]')) {
      drawChart(this._chart, this.machine, resolveParams(this.machine, this.params), this.state.theme === 'dark');
    }
  }

  record() {
    const r = this.compute();
    const isGears = this.machine === 'GEARS';
    this.state.log.unshift({
      machineName: MACHINES[this.machine].short,
      setup: describeSetup(this.machine, resolveParams(this.machine, this.params), r),
      // برای چرخ‌دنده «نیرو» و «مسافت» معنا ندارد؛ به جای صفرِ گمراه‌کننده خالی می‌ماند
      effortN: isGears ? null : r.effortN,
      maActual: isGears ? r.ratio : r.maActual ?? null,
      effortDistanceM: isGears ? null : r.effortDistanceM,
      efficiencyPercent: Math.round((r.efficiency ?? 1) * 100),
      loadN: isGears ? null : r.loadN,
      workInJ: isGears ? null : r.workInJ,
      g: this.state.lab.g,
      ideal: this.state.lab.ideal
    });
    if (this.state.log.length > 60) this.state.log.length = 60;
    this.state.view.records = true;
    this.save();
    this.renderSide();
  }

  // ─────────── پنجره‌ها ───────────
  openModal(title, nodes) {
    this.dom.modalTitle.textContent = title;
    this.dom.modalBody.replaceChildren(...[].concat(nodes).filter(Boolean));
    this.dom.modal.hidden = false;
    this.dom.modal.querySelector('.modal-close').focus();
  }

  closeModal() { this.dom.modal.hidden = true; }

  openHelp() {
    this.openModal('راهنمای آموزگار', [
      el('h3', {}, ['این ابزار چه کاری می‌کند؟']),
      el('p', {}, ['هر ماشین ساده را با اعداد واقعی می‌سازید، آزمایش را اجرا می‌کنید و نتیجه را در سه سطح می‌بینید: نمای صحنه، جدول کمیت‌ها و محاسبهٔ گام‌به‌گام با فرمول. همهٔ اعداد از یک موتور فیزیک واحد می‌آیند؛ هیچ عددی دستی نوشته نشده است.']),
      el('h3', {}, ['پیشنهاد برای کلاس']),
      el('ul', {}, CLASSROOM_TIPS.map((t) => el('li', {}, [t]))),
      el('h3', {}, ['اهداف برنامهٔ درسی']),
      el('ul', {}, CURRICULUM.map((g) => el('li', {}, [el('b', {}, [`${g.title}: `]), g.text]))),
      el('h3', {}, ['میان‌برهای صفحه‌کلید']),
      el('p', { class: 'muted' }, ['فاصله = اجرای حرکت • R = بازنشانی • V = بردارهای نیرو • D = خط‌های اندازه • ۱ تا ۸ = انتخاب ماشین • Esc = بستن'])
    ]);
  }

  printReport() {
    const r = this.compute();
    const html = reportHTML({
      machineName: MACHINES[this.machine].name,
      setup: describeSetup(this.machine, resolveParams(this.machine, this.params), r),
      lab: this.state.lab,
      steps: explain(r),
      result: r,
      log: this.state.log
    });
    try {
      const frame = document.createElement('iframe');
      frame.setAttribute('title', 'گزارش آزمایش');
      frame.style.cssText = 'position:fixed;inset:auto 0 0 auto;width:0;height:0;border:0;opacity:0;';
      frame.srcdoc = html;
      frame.addEventListener('load', () => {
        try { frame.contentWindow.focus(); frame.contentWindow.print(); }
        catch { this.openReportWindow(html); }
        setTimeout(() => frame.remove(), 60000);
      }, { once: true });
      document.body.append(frame);
    } catch { this.openReportWindow(html); }
  }

  openReportWindow(html) {
    const win = window.open('', '_blank');
    if (!win) return;
    win.document.write(html);
    win.document.close();
  }
}

const app = new App();
window.addEventListener('DOMContentLoaded', () => { app.init(); window.lab = app; });

})();
</script>
