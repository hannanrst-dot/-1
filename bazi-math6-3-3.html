<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>پخشِ مساوی — تقسیم اعشاری بر عدد طبیعی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1a2452;--muted:#5b6bb0;--pk:#ff5d8f;--or:#ff9f45;--yl:#ffd23f;--gr:#22c993;--bl:#3aa0ff;--pu:#9b6cff;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:'Vazirmatn',sans-serif;color:var(--ink);
    background:linear-gradient(160deg,#8fe3ff 0%,#b19bff 48%,#ffc0e0 100%);
    min-height:100vh;padding:8px;overflow:hidden;user-select:none}
  .wrap{max-width:440px;margin:0 auto;position:relative}
  .hud{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .chip{background:#fff;border-radius:16px;padding:6px 12px;font-weight:800;font-size:14px;display:flex;gap:6px;align-items:center;box-shadow:0 4px 12px rgba(80,80,160,.18)}
  .chip .lbl{color:var(--muted);font-size:11px;font-weight:700}.grow{flex:1}.hearts{font-size:15px}
  .qbar{background:#fff;border-radius:16px;padding:9px 12px;text-align:center;margin-bottom:6px;box-shadow:0 4px 12px rgba(80,80,160,.18)}
  .qbar b{font-size:16px;font-weight:900}.qbar .s{color:var(--muted);font-size:12px;margin-top:2px}
  .track{height:9px;background:#fff;border-radius:6px;overflow:hidden;margin-bottom:6px;box-shadow:0 2px 8px rgba(80,80,160,.14)}
  #prog{height:100%;width:0;background:linear-gradient(90deg,var(--bl),var(--gr));transition:width .2s}
  .stage{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(80,80,160,.25)}
  canvas{display:block;width:100%;touch-action:none}
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;gap:12px;background:rgba(255,255,255,.86);backdrop-filter:blur(3px);z-index:5}
  .ov h1{margin:0;font-size:23px;color:var(--pu)}.ov p{margin:0;color:#43508f;font-size:14px;line-height:1.9;font-weight:700}
  .btn{border:0;cursor:pointer;font-family:inherit;font-weight:900;font-size:18px;color:#fff;padding:14px 34px;border-radius:18px;background:linear-gradient(180deg,#5bd7ae,var(--gr));box-shadow:0 8px 20px rgba(34,201,147,.45);margin-top:4px}.btn:active{transform:translateY(2px)}
  .stars{font-size:40px;letter-spacing:6px}.emoji{font-size:46px}.hidden{display:none}
  .pill{background:#eef1ff;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:800;color:var(--muted)}
  .scoreBig{font-size:15px;font-weight:800}.scoreBig b{color:var(--gr);font-size:22px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div class="chip"><span class="lbl">امتیاز</span><span id="score">۰</span></div>
    <div class="chip"><span class="lbl">مرحله</span><span id="round">۱/۸</span></div>
    <div class="grow"></div>
    <div class="chip hearts" id="hearts">❤️❤️❤️</div>
  </div>
  <div class="qbar"><b id="q"></b><div class="s">وقتی مجموع برابرِ کل شد، «نگه‌دار» بزن</div></div>
  <div class="track"><div id="prog"></div></div>
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="ov" id="ovStart">
      <div class="emoji">🥤</div><h1>پخشِ مساوی</h1>
      <p>سهمِ همه‌ی لیوان‌ها با هم بالا می‌رود.<br>
      دقیقاً وقتی <b>مجموعِ لیوان‌ها</b> برابرِ <b>کل</b> شد، برای <b>نگه‌داشتن</b> بزن!<br>
      این یعنی <b>کل ÷ تعداد لیوان = سهمِ هر لیوان</b>. 🎯</p>
      <button class="btn" id="btnStart">شروع بازی</button>
    </div>
    <div class="ov hidden" id="ovEnd">
      <div class="emoji" id="ef">🎉</div><h1 id="et">آفرین!</h1>
      <div class="stars" id="es">⭐⭐⭐</div>
      <div class="scoreBig">امتیاز: <b id="esc">۰</b></div>
      <div class="pill" id="em"></div>
      <button class="btn" id="btnAgain">دوباره</button>
    </div>
  </div>
</div>
<script>
(function(){"use strict";
  const GAMEID='math6-3-3';
  const fa=s=>(''+s).replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
  const faD=x=>{let n=Math.round(x*100)/100;return fa((''+n).replace('.','/'));};
  const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  let AC=null;const ac=()=>{if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC};
  function beep(f,d,t,v){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();
    o.type=t||'sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);const n=c.currentTime;
    g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v||.16,n+.01);
    g.gain.exponentialRampToValueAtTime(.0001,n+(d||.15));o.start(n);o.stop(n+(d||.15)+.02);}
  const sTic=()=>beep(440,.03,'square',.05);
  const sOk=()=>{beep(680,.1,'square',.14);setTimeout(()=>beep(940,.12,'square',.13),80)};
  const sBad=()=>beep(160,.28,'sawtooth',.16);
  const sWin=()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.16,'square',.15),i*110));
  const sLose=()=>[392,330,262].forEach((f,i)=>setTimeout(()=>beep(f,.2,'sawtooth',.14),i*140));

  const ROUNDS=[
    {T:4.8,n:3},{T:3.6,n:4},{T:2.4,n:2},{T:6.3,n:3},
    {T:7.5,n:5},{T:9.6,n:4},{T:4.2,n:6},{T:5.5,n:5},
  ];
  const TOTAL=ROUNDS.length;
  const cv=$('cv'),ctx=cv.getContext('2d');let W,H,dpr;
  function layout(){const st=cv.parentElement;W=st.clientWidth;
    H=Math.max(400,Math.min(510,Math.round(window.innerHeight-190)));
    dpr=Math.min(2,window.devicePixelRatio||1);cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);}
  layout();window.addEventListener('resize',layout);

  let state='start',ri=0,score=0,lives=3,R,per,maxStep,step,tacc,interval,maxLvl,stopped,confetti=[];
  function loadRound(i){ri=i;R=ROUNDS[i];per=Math.round((R.T/R.n)*10)/10;
    maxStep=Math.round(per/0.1)+3;maxLvl=(maxStep)*0.1;step=0;tacc=0;stopped=false;
    interval=Math.max(0.2,0.5-i*0.035);
    $('round').textContent=fa((i+1)+'/'+TOTAL);
    $('q').innerHTML='<span style="direction:ltr;display:inline-block">'+faD(R.T)+' لیتر ÷ '+fa(R.n)+' لیوان</span>';
    updateHud();}
  function updateHud(){$('score').textContent=fa(score);
    $('hearts').textContent='❤️'.repeat(Math.max(0,lives))+'🤍'.repeat(Math.max(0,3-lives));
    $('prog').style.width=(100*ri/TOTAL)+'%';}

  cv.addEventListener('pointerdown',()=>{if(state==='play'&&!stopped)stop();});
  function stop(){stopped=true;const share=Math.round(step*0.1*100)/100,sum=Math.round(share*R.n*100)/100;
    if(Math.abs(sum-R.T)<1e-6){score+=10;sOk();for(let i=0;i<18;i++)confetti.push(spawnConf(W/2,H*0.4));
      updateHud();setTimeout(next,900);}
    else{lives--;sBad();updateHud();if(lives<=0){setTimeout(()=>endGame(false),300);return;}
      setTimeout(()=>{step=0;tacc=0;stopped=false;},700);}}
  function next(){if(ri>=TOTAL-1){endGame(true);return;}loadRound(ri+1);}

  function draw(dt){
    const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#eef7ff');sky.addColorStop(1,'#f7efff');
    ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
    if(state!=='start'&&R){
      if(state==='play'&&!stopped){tacc+=dt;if(tacc>=interval){tacc=0;step++;sTic();
        if(step>maxStep){lives--;sBad();updateHud();if(lives<=0){setTimeout(()=>endGame(false),200);}step=0;}}}
      const share=Math.round(step*0.1*100)/100, sum=Math.round(share*R.n*100)/100;
      const good=Math.abs(sum-R.T)<1e-6;
      // لیوان‌ها
      const n=R.n, gap=Math.min(60,(W-40)/n), cw=Math.min(40,gap-8), gx0=(W-gap*n)/2+gap/2;
      const topY=64, gh=150;
      for(let k=0;k<n;k++){const cx=gx0+k*gap;
        ctx.strokeStyle='#9fb0e0';ctx.lineWidth=2.5;ctx.fillStyle='rgba(255,255,255,.5)';
        ctx.beginPath();ctx.roundRect(cx-cw/2,topY,cw,gh,{tl:6,tr:6,br:14,bl:14});ctx.fill();ctx.stroke();
        const lvl=clamp(share/maxLvl,0,1),fh=(gh-6)*lvl;
        ctx.save();ctx.beginPath();ctx.roundRect(cx-cw/2+3,topY+3,cw-6,gh-6,{tl:4,tr:4,br:12,bl:12});ctx.clip();
        const juice=ctx.createLinearGradient(0,topY+gh-fh,0,topY+gh);juice.addColorStop(0,'#ff9f45');juice.addColorStop(1,'#ff7e3d');
        ctx.fillStyle=juice;ctx.fillRect(cx-cw/2,topY+gh-fh,cw,fh);ctx.restore();}
      // خواننده‌ها
      ctx.textAlign='center';ctx.textBaseline='alphabetic';
      ctx.fillStyle='#1a2452';ctx.font='900 18px Vazirmatn';
      ctx.fillText('سهمِ هر لیوان: '+faD(share)+' لیتر',W/2,topY+gh+34);
      // نوارِ مجموع در مقابل کل
      const bx=40,bw=W-80,by=topY+gh+52,bh=22;
      ctx.fillStyle='#e6ebff';ctx.beginPath();ctx.roundRect(bx,by,bw,bh,10);ctx.fill();
      const frac=clamp(sum/(R.T*1.25),0,1);
      ctx.fillStyle=good?'#22c993':(sum>R.T+1e-6?'#ff5d8f':'#3aa0ff');
      ctx.beginPath();ctx.roundRect(bx,by,bw*frac,bh,10);ctx.fill();
      // خطِ هدف روی نوار
      const tX=bx+bw*clamp(R.T/(R.T*1.25),0,1);
      ctx.strokeStyle='#ff5d8f';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(tX,by-6);ctx.lineTo(tX,by+bh+6);ctx.stroke();
      ctx.fillStyle='#1a2452';ctx.font='900 14px Vazirmatn';
      ctx.fillText('مجموع: '+faD(sum)+'   /   کل: '+faD(R.T),W/2,by+bh+26);
      // دکمه‌ی نگه‌دار
      const by2=by+bh+44, r=34;
      ctx.fillStyle=good?'#22c993':'#3aa0ff';ctx.beginPath();ctx.arc(W/2,by2+r,r,0,7);ctx.fill();
      ctx.fillStyle='#fff';ctx.font='900 16px Vazirmatn';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('نگه‌دار',W/2,by2+r);ctx.textBaseline='alphabetic';
    }
    confetti=confetti.filter(c=>{c.vy+=.35;c.x+=c.vx;c.y+=c.vy;c.r+=c.vr;c.life-=.02;
      ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.r);ctx.globalAlpha=clamp(c.life,0,1);
      ctx.fillStyle=c.c;ctx.fillRect(-4,-3,8,5);ctx.restore();return c.life>0&&c.y<H+20;});
    ctx.globalAlpha=1;}
  const _rr=CanvasRenderingContext2D.prototype.roundRect;
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(typeof r==='object'){this.beginPath();this.moveTo(x+r.tl,y);
      this.arcTo(x+w,y,x+w,y+h,r.tr);this.arcTo(x+w,y+h,x,y+h,r.br);
      this.arcTo(x,y+h,x,y,r.bl);this.arcTo(x,y,x+w,y,r.tl);this.closePath();return this;}
    if(_rr)return _rr.call(this,x,y,w,h,r);
    this.beginPath();this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this;};
  function spawnConf(x,y){const cols=['#ffd23f','#ff5d8f','#3aa0ff','#22c993','#9b6cff','#ff9f45'];
    return{x,y,vx:(Math.random()-.5)*8,vy:-Math.random()*7-2,r:Math.random()*6,vr:(Math.random()-.5)*.4,
      c:cols[(Math.random()*cols.length)|0],life:1.4+Math.random()};}

  function endGame(won){state='end';const pct=score/(TOTAL*10);
    const stars=pct>=.8?3:pct>=.55?2:1;
    for(let i=0;i<70;i++)confetti.push(spawnConf(Math.random()*W,-Math.random()*30));
    $('ef').textContent=won?'🎉':'😅';$('et').textContent=won?'تمام شد، آفرین!':'باختی! دوباره تلاش کن';
    $('es').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);$('esc').textContent=fa(score);
    $('em').textContent=won?'تقسیمِ اعشاری بر عددِ طبیعی را یاد گرفتی!':'سهمِ هر لیوان = کل ÷ تعداد 💪';
    $('prog').style.width='100%';$('ovEnd').classList.remove('hidden');won?sWin():sLose();
    if(window.parent!==window){window.parent.postMessage(
      {type:'setareh_game',event:'complete',score:score,stars:stars,gameId:GAMEID},'*');}}
  let last=0;function loop(ts){if(!last)last=ts;let dt=(ts-last)/1000;last=ts;dt=Math.min(dt,.05);
    draw(dt);requestAnimationFrame(loop);}
  $('btnStart').onclick=()=>{ac();$('ovStart').classList.add('hidden');score=0;lives=3;loadRound(0);state='play';};
  $('btnAgain').onclick=()=>{$('ovEnd').classList.add('hidden');score=0;lives=3;confetti=[];loadRound(0);state='play';};
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
