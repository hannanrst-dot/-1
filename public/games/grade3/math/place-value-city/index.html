<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شهر عددها — ریاضی سوم</title>
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏙️</text></svg>">
<style>
  body { overflow: hidden; height: 100dvh; display: flex; flex-direction: column; }

  .readout {
    display: flex; align-items: center; justify-content: center; gap: 20px;
    padding: 10px 16px 4px; flex-wrap: wrap;
  }
  .bignum {
    display: flex; gap: 2px; direction: ltr;   /* عدد همیشه چپ‌به‌راست خوانده می‌شود */
    font-size: clamp(2.2rem, 7vw, 3.4rem); font-weight: 900; line-height: 1;
  }
  .bignum span { transition: transform .2s; }
  .bignum .digit-flash { animation: popIn .35s cubic-bezier(.2,1.5,.4,1); }
  .expanded {
    direction: ltr;                            /* ۳۰۰ + ۲۰ + ۴ ، نه برعکسش */
    font-size: clamp(.85rem, 2.4vw, 1.1rem); font-weight: 800; color: var(--ink-soft);
    background: #fff; border-radius: 999px; padding: .4em 1.1em; box-shadow: var(--shadow);
    white-space: nowrap;
  }
  .mission {
    text-align: center; font-weight: 800; padding: 6px 16px 8px; font-size: 1rem;
  }
  .mission b { color: var(--purple); }

  .canvas-wrap { flex: 1; min-height: 0; padding: 0 12px 8px; position: relative; }
  canvas { width: 100%; height: 100%; display: block; border-radius: var(--radius); background: #fff; box-shadow: var(--shadow); }

  .controls {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    padding: 0 12px calc(70px + env(safe-area-inset-bottom));
  }
  .colctrl { display: flex; gap: 6px; justify-content: center; }
  .sq {
    width: 100%; max-width: 62px; height: 44px; border: none; border-radius: 12px; cursor: pointer;
    font-size: 1.4rem; font-weight: 900; color: #fff; box-shadow: 0 4px 0 rgba(0,0,0,.18);
    transition: transform .1s;
  }
  .sq:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
  .sq--minus { background: #b9c4dd; }
</style>
</head>
<body>

<div class="topbar">
  <a class="btn btn--ghost" href="/">◀ خانه</a>
  <div>
    <h1 class="topbar__title">🏙️ شهر عددها</h1>
    <p class="topbar__sub">ریاضی سوم — فصل ۲: عددهای چهار رقمی</p>
  </div>
  <div class="topbar__spacer"></div>
  <span class="chip chip--star">⭐ <span id="stars">۰</span></span>
  <span class="chip">مأموریت <span id="lvl">۱</span> از <span id="lvlTotal">۸</span></span>
  <div class="progress"><div class="progress__fill" id="bar"></div></div>
</div>

<div class="readout">
  <div class="bignum" id="bignum"></div>
  <div class="expanded" id="expanded">۰</div>
</div>
<div class="mission" id="mission">…</div>

<div class="canvas-wrap"><canvas id="cv"></canvas></div>

<div class="controls" id="controls"></div>

<div class="hintbar" data-hint>با دکمه‌های <b>+</b> بلوک بساز. وقتی یک ستون <b>پُر</b> شد، خودش جادو می‌کند!</div>
<div class="toasts" data-toasts></div>

<script type="module" src="./game.js"></script>
</body>
</html>
