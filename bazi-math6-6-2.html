<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>نقاشِ درصد — درصد</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1a2452;--muted:#5b6bb0;--pk:#ff5d8f;--or:#ff9f45;--yl:#ffd23f;--gr:#22c993;--bl:#3aa0ff;--pu:#9b6cff;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:'Vazirmatn',sans-serif;color:var(--ink);
    background:linear-gradient(160deg,#8fe3ff 0%,#b19bff 48%,#ffc0e0 100%);
    min-height:100vh;padding:8px;overflow:hidden;user-select:none}
  .wrap{max-width:440px;margin:0 auto;position:relative}
  .hud{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .chip{background:#fff;border-radius:16px;padding:6px 12px;font-weight:800;font-size:14px;display:flex;gap:6px;align-items:center;box-shadow:0 4px 12px rgba(80,80,160,.18)}
  .chip .lbl{color:var(--muted);font-size:11px;font-weight:700}.grow{flex:1}.hearts{font-size:15px}
  .qbar{background:#fff;border-radius:16px;padding:8px 12px;text-align:center;margin-bottom:6px;box-shadow:0 4px 12px rgba(80,80,160,.18)}
  .qbar b{font-size:15px;font-weight:900}.qbar .s{color:var(--pu);font-size:20px;margin-top:2px;font-weight:900;direction:ltr;display:inline-block}
  .fr{display:inline-flex;flex-direction:column;line-height:1;vertical-align:middle;text-align:center}
  .fr .n{border-bottom:2.5px solid currentColor;padding:0 5px}.fr .d{padding:2px 5px 0}
  .track{height:9px;background:#fff;border-radius:6px;overflow:hidden;margin-bottom:6px;box-shadow:0 2px 8px rgba(80,80,160,.14)}
  #prog{height:100%;width:0;background:linear-gradient(90deg,var(--bl),var(--pu));transition:width .2s}
  .stage{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(80,80,160,.25)}
  canvas{display:block;width:100%;touch-action:none}
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;gap:12px;background:rgba(255,255,255,.9);backdrop-filter:blur(3px);z-index:5}
  .ov h1{margin:0;font-size:22px;color:var(--pu)}.ov p{margin:0;color:#43508f;font-size:14px;line-height:1.9;font-weight:700}
  .btn{border:0;cursor:pointer;font-family:inherit;font-weight:900;font-size:18px;color:#fff;padding:14px 34px;border-radius:18px;background:linear-gradient(180deg,#b98aff,var(--pu));box-shadow:0 8px 20px rgba(155,108,255,.45);margin-top:4px}.btn:active{transform:translateY(2px)}
  .stars{font-size:40px;letter-spacing:6px}.emoji{font-size:46px}.hidden{display:none}
  .pill{background:#f0eaff;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:800;color:var(--muted)}
  .scoreBig{font-size:15px;font-weight:800}.scoreBig b{color:var(--pu);font-size:22px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div class="chip"><span class="lbl">امتیاز</span><span id="score">۰</span></div>
    <div class="chip"><span class="lbl">مرحله</span><span id="round">۱/۸</span></div>
    <div class="grow"></div>
    <div class="chip hearts" id="hearts">❤️❤️❤️</div>
  </div>
  <div class="qbar"><b>این مقدار از ۱۰۰ خانه را رنگ کن:</b> <span class="s" id="target"></span></div>
  <div class="track"><div id="prog"></div></div>
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="ov" id="ovStart">
      <div class="emoji">🎨🔲</div><h1>نقاشِ درصد</h1>
      <p>یک صفحه‌ی <b>۱۰۰ خانه‌ای</b> داری. <b>درصد یعنی از ۱۰۰</b>.<br>
      اگر هدف کسر یا اعشاری باشد، اول به درصد تبدیلش کن، بعد همان تعداد خانه را رنگ کن.<br>
      با دکمه‌ها تعداد را تنظیم کن و <b>تأیید</b> بزن! 🎯</p>
      <button class="btn" id="btnStart">شروع بازی</button>
    </div>
    <div class="ov hidden" id="ovEnd">
      <div class="emoji" id="ef">🎉</div><h1 id="et">آفرین!</h1>
      <div class="stars" id="es">⭐⭐⭐</div>
      <div class="scoreBig">امتیاز: <b id="esc">۰</b></div>
      <div class="pill" id="em"></div>
      <button class="btn" id="btnAgain">دوباره</button>
    </div>
  </div>
</div>
<script>
(function(){"use strict";
  const GAMEID='math6-6-2';
  const fa=s=>(''+s).replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
  const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  let AC=null;const ac=()=>{if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC};
  function beep(f,d,t,v){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();
    o.type=t||'sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);const n=c.currentTime;
    g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v||.16,n+.01);
    g.gain.exponentialRampToValueAtTime(.0001,n+(d||.15));o.start(n);o.stop(n+(d||.15)+.02);}
  const sTic=()=>beep(480,.04,'square',.06);
  const sOk=()=>{beep(680,.1,'square',.14);setTimeout(()=>beep(940,.12,'square',.13),80)};
  const sCombo=()=>{beep(880,.08,'square',.12);setTimeout(()=>beep(1180,.1,'square',.12),70);};
  const sBad=()=>beep(160,.28,'sawtooth',.16);
  const sWin=()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.16,'square',.15),i*110));
  const sLose=()=>[392,330,262].forEach((f,i)=>setTimeout(()=>beep(f,.2,'sawtooth',.14),i*140));

  // هدف‌ها: نوعِ نمایش متفاوت تا تبدیل سنجیده شود؛ pct = درصدِ درست
  const ROUNDS=[
    {type:'pct', pct:30}, {type:'frac', n:3,d:4, pct:75}, {type:'dec', dec:'۰/۴', pct:40},
    {type:'pct', pct:65}, {type:'frac', n:1,d:5, pct:20}, {type:'dec', dec:'۰/۹', pct:90},
    {type:'frac', n:7,d:10, pct:70}, {type:'pct', pct:25}
  ];
  const TOTAL=ROUNDS.length;
  const cv=$('cv'),ctx=cv.getContext('2d');let W,H,dpr;
  function layout(){const st=cv.parentElement;W=st.clientWidth;
    H=Math.max(410,Math.min(500,Math.round(W*1.08)));dpr=Math.min(2,window.devicePixelRatio||1);
    cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);}
  layout();window.addEventListener('resize',layout);

  let state='start',ri=0,score=0,lives=3,R,n,combo=0,timeLeft,timeMax,paused,confetti=[],floaters=[];
  function loadRound(i){ri=i;R=ROUNDS[i];n=0;paused=false;timeMax=Math.max(10,16-i*0.7);timeLeft=timeMax;
    $('round').textContent=fa((i+1)+'/'+TOTAL);
    let t;if(R.type==='pct')t=fa(R.pct)+'٪';
    else if(R.type==='frac')t='<span class="fr"><span class="n">'+fa(R.n)+'</span><span class="d">'+fa(R.d)+'</span></span>';
    else t=R.dec;
    $('target').innerHTML=t;updateHud();}
  function updateHud(){$('score').textContent=fa(score);
    $('hearts').textContent='❤️'.repeat(Math.max(0,lives))+'🤍'.repeat(Math.max(0,3-lives));
    $('prog').style.width=(100*ri/TOTAL)+'%';}
  function grid(){const gs=Math.min((W-40)/10,(H-150)/10);return{gs,gx:(W-gs*10)/2,gy:54};}
  function btns(){const y=H-42;return{m10:{x:W*0.16,y,r:24,d:-10},m1:{x:W*0.34,y,r:24,d:-1},p1:{x:W*0.52,y,r:24,d:1},p10:{x:W*0.70,y,r:24,d:10},ok:{x:W*0.89,y,r:27,ok:1}};}

  cv.addEventListener('pointerdown',e=>{if(state!=='play'||paused)return;
    const rc=cv.getBoundingClientRect();const x=(e.clientX-rc.left)*(W/rc.width),y=(e.clientY-rc.top)*(H/rc.height);
    const b=btns();
    for(const key of ['m10','m1','p1','p10']){const bt=b[key];if(Math.hypot(x-bt.x,y-bt.y)<bt.r+6){n=clamp(n+bt.d,0,100);sTic();return;}}
    if(Math.hypot(x-b.ok.x,y-b.ok.y)<b.ok.r+8){confirm();}});
  function confirm(){
    if(n===R.pct){paused=true;const speed=Math.round(clamp(timeLeft,0,10));combo++;
      const gain=10+speed+(combo>=2?combo*2:0);score+=gain;combo>=2?sCombo():sOk();
      floaters.push({x:W/2,y:H*0.45,t:0,txt:'+'+fa(gain)+(combo>=2?' ×'+fa(combo):'')});
      for(let i=0;i<18;i++)confetti.push(spawnConf(W/2,H*0.4));updateHud();setTimeout(next,1300);}
    else{lives--;combo=0;sBad();floaters.push({x:W/2,y:H*0.45,t:0,txt:'درست نیست!'});updateHud();
      if(lives<=0)setTimeout(()=>endGame(false),350);}}
  function timeout(){if(state!=='play'||paused)return;lives--;combo=0;sBad();
    floaters.push({x:W/2,y:H*0.45,t:0,txt:'دیر شد!'});updateHud();if(lives<=0){endGame(false);return;}timeLeft=timeMax;}
  function next(){if(ri>=TOTAL-1){endGame(true);return;}loadRound(ri+1);}

  function draw(dt){
    const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#eef4ff');bg.addColorStop(1,'#f6eefc');
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    if(state!=='start'&&R){
      const{gs,gx,gy}=grid();
      // ۱۰۰ خانه، پرشدن از پایین
      for(let idx=0;idx<100;idx++){const rowFromBottom=Math.floor(idx/10),col=idx%10;
        const cx=gx+col*gs, cy=gy+(9-rowFromBottom)*gs;const filled=idx<n;
        ctx.fillStyle=filled?'#9b6cff':'#eceaf6';ctx.fillRect(cx+1,cy+1,gs-2,gs-2);}
      // خطوطِ دسته‌ی ۱۰تایی
      ctx.strokeStyle='rgba(90,107,176,.45)';ctx.lineWidth=1.5;
      ctx.strokeRect(gx,gy,gs*10,gs*10);
      // شمارنده
      const good=n===R.pct;
      ctx.fillStyle=good?'#12a06e':'#1a2452';ctx.font='900 19px Vazirmatn';ctx.textAlign='center';ctx.textBaseline='alphabetic';
      ctx.fillText('رنگ‌شده: '+fa(n)+' از ۱۰۰ = '+fa(n)+'٪'+(good?'  ✅':''),W/2,gy+gs*10+28);
      if(combo>=2){ctx.fillStyle='#c2185b';ctx.font='900 14px Vazirmatn';ctx.textAlign='right';ctx.fillText('کومبو ×'+fa(combo)+' 🔥',W-8,gy-6);}
      // دکمه‌ها
      const b=btns();rbtn(b.m10,'−۱۰','#ff7e7e');rbtn(b.m1,'−۱','#ff9f45');rbtn(b.p1,'+۱','#5cc8ff');rbtn(b.p10,'+۱۰','#22c993');rbtn(b.ok,'تأیید','#9b6cff',true);
      // زمان
      if(!paused){timeLeft-=dt;if(timeLeft<=0)timeout();}
      ctx.fillStyle='rgba(0,0,0,.07)';ctx.beginPath();ctx.roundRect(16,H-12,W-32,6,3);ctx.fill();
      ctx.fillStyle=timeLeft<3.5?'#ff5d8f':'#22c993';ctx.beginPath();ctx.roundRect(16,H-12,(W-32)*clamp(timeLeft/timeMax,0,1),6,3);ctx.fill();
    }
    floaters=floaters.filter(f=>{f.t+=dt;f.y-=28*dt;ctx.globalAlpha=clamp(1-f.t,0,1);
      ctx.fillStyle=f.txt[0]==='+'?'#0d7a4f':'#ff5d8f';ctx.font='900 20px Vazirmatn';ctx.textAlign='center';ctx.textBaseline='alphabetic';
      ctx.fillText(f.txt,f.x,f.y);ctx.globalAlpha=1;return f.t<1.2;});
    confetti=confetti.filter(c=>{c.vy+=.35;c.x+=c.vx;c.y+=c.vy;c.r+=c.vr;c.life-=.02;
      ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.r);ctx.globalAlpha=clamp(c.life,0,1);
      ctx.fillStyle=c.c;ctx.fillRect(-4,-3,8,5);ctx.restore();return c.life>0&&c.y<H+20;});
    ctx.globalAlpha=1;}
  function rbtn(b,t,col,big){ctx.fillStyle=col;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='900 '+(big?14:15)+'px Vazirmatn';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(t,b.x,b.y);ctx.textBaseline='alphabetic';}
  const _rr=CanvasRenderingContext2D.prototype.roundRect;
  if(!_rr)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){this.beginPath();
    this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this;};
  function spawnConf(x,y){const cols=['#ffd23f','#ff5d8f','#3aa0ff','#22c993','#9b6cff','#ff9f45'];
    return{x,y,vx:(Math.random()-.5)*8,vy:-Math.random()*7-2,r:Math.random()*6,vr:(Math.random()-.5)*.4,
      c:cols[(Math.random()*cols.length)|0],life:1.4+Math.random()};}

  function endGame(won){state='end';const pct=score/(TOTAL*14);
    const stars=pct>=.8?3:pct>=.55?2:1;
    for(let i=0;i<70;i++)confetti.push(spawnConf(Math.random()*W,-Math.random()*30));
    $('ef').textContent=won?'🎉':'😅';$('et').textContent=won?'تمام شد، آفرین!':'باختی! دوباره تلاش کن';
    $('es').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);$('esc').textContent=fa(score);
    $('em').textContent=won?'درصد یعنی از ۱۰۰ — و تبدیلِ کسر/اعشاری به درصد را یاد گرفتی!':'کسر/اعشاری را به «از ۱۰۰» تبدیل کن 💪';
    $('prog').style.width='100%';$('ovEnd').classList.remove('hidden');won?sWin():sLose();
    if(window.parent!==window){window.parent.postMessage(
      {type:'setareh_game',event:'complete',score:score,stars:stars,gameId:GAMEID},'*');}}
  let last=0;function loop(ts){if(!last)last=ts;let dt=(ts-last)/1000;last=ts;dt=Math.min(dt,.05);
    draw(dt);requestAnimationFrame(loop);}
  $('btnStart').onclick=()=>{ac();$('ovStart').classList.add('hidden');score=0;lives=3;combo=0;loadRound(0);state='play';};
  $('btnAgain').onclick=()=>{$('ovEnd').classList.add('hidden');score=0;lives=3;combo=0;confetti=[];loadRound(0);state='play';};
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
