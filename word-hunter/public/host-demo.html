<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>پنل معلم — شکارچی کلمات</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; font-family: Vazirmatn, Tahoma, system-ui, sans-serif; }
  body { margin:0; background:#0b1020; color:#e2e8f0; display:flex; height:100dvh; overflow:hidden; }
  .panel { width:340px; flex-shrink:0; border-left:1px solid #1e293b; background:#0f172a;
           display:flex; flex-direction:column; }
  .panel header { padding:16px 18px; border-bottom:1px solid #1e293b; }
  h1 { margin:0; font-size:15px; color:#fbbf24; }
  .sub { font-size:11px; color:#64748b; margin-top:4px; line-height:1.7; }
  .body { padding:18px; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:20px; }

  .step { display:flex; flex-direction:column; gap:9px; }
  .step > .q { font-size:13px; font-weight:800; color:#e2e8f0; display:flex; align-items:center; gap:8px; }
  .step > .q .n { width:20px; height:20px; border-radius:6px; background:#fbbf24; color:#0f172a;
                  font-size:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .opt { padding:11px 10px; border-radius:12px; border:1px solid #334155; background:#020617;
         cursor:pointer; user-select:none; text-align:center; font-size:12px; font-weight:700;
         transition:.12s; }
  .opt:hover { border-color:#475569; }
  .opt.on { background:#fbbf24; color:#0f172a; border-color:#fbbf24; }
  .opt small { display:block; font-weight:500; font-size:10px; opacity:.7; margin-top:2px; }

  button.go { width:100%; padding:15px; border-radius:14px; border:0; cursor:pointer; margin-top:2px;
    background:linear-gradient(to left,#fbbf24,#fde047); color:#0f172a; font-weight:900; font-size:15px; }
  button.go:active { transform:scale(.98); }

  details { border-top:1px solid #1e293b; padding-top:14px; }
  summary { cursor:pointer; font-size:12px; color:#94a3b8; font-weight:700; user-select:none; }
  details[open] summary { margin-bottom:12px; }
  .adv { display:flex; flex-direction:column; gap:12px; }
  label { display:block; font-size:11px; color:#94a3b8; margin-bottom:5px; font-weight:700; }
  input, textarea { width:100%; padding:9px 11px; border-radius:10px; background:#020617;
    border:1px solid #334155; color:#e2e8f0; font-size:13px; }
  textarea { resize:vertical; min-height:80px; line-height:2; }
  .row { display:flex; gap:9px; } .row > * { flex:1; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { padding:5px 9px; border-radius:9px; border:1px solid #334155; background:#020617;
    font-size:11px; cursor:pointer; user-select:none; }
  .chip.on { background:#38bdf8; color:#0f172a; border-color:#38bdf8; font-weight:800; }

  .log { min-height:120px; max-height:200px; background:#020617; border:1px solid #1e293b;
    border-radius:12px; padding:10px; overflow-y:auto; font-size:11px; line-height:1.9;
    direction:ltr; text-align:left; font-family: ui-monospace, monospace; }
  .log .ev { color:#38bdf8; } .log .ok { color:#34d399; } .log .no { color:#f87171; }
  iframe { flex:1; border:0; background:#05070f; }
</style>
</head>
<body>
<div class="panel">
  <header>
    <h1>پنل معلم — نمونهٔ آزمایشی</h1>
    <div class="sub">
      این صفحه نقش پلتفرم شما را بازی می‌کند. همین سه گام را در پنل واقعی
      خودتان بسازید؛ بقیه‌اش را بازی انجام می‌دهد.
    </div>
  </header>

  <div class="body">
    <div class="step">
      <div class="q"><span class="n">۱</span> امروز چه چیزی تمرین کنیم؟</div>
      <div class="grid" id="topics"></div>
    </div>

    <div class="step">
      <div class="q"><span class="n">۲</span> چقدر طول بکشد؟</div>
      <div class="grid" id="lengths"></div>
    </div>

    <button class="go" onclick="launch()">شروع برای کلاس ▸</button>

    <details>
      <summary>تنظیمات بیشتر</summary>
      <div class="adv">
        <div class="row">
          <div><label>نام دانش‌آموز</label><input id="name" value="سارا محمدی" /></div>
          <div><label>شناسه</label><input id="sid" value="u_42" /></div>
        </div>
        <div><label>عنوان مأموریت</label><input id="title" value="املای درس ۴ — پایهٔ ششم" /></div>
        <div class="row">
          <div><label>جان</label><input id="lives" type="number" value="5" min="1" max="20" /></div>
          <div><label>تعداد پرسش</label><input id="qc" type="number" value="10" min="3" max="60" /></div>
        </div>
        <div>
          <label>حالت‌های بازی</label>
          <div class="chips" id="modes"></div>
        </div>
        <div>
          <label>واژه‌های همین درس — هر سطر: <span style="color:#94a3b8">درست | غلط‌ها | قاعده</span></label>
          <textarea id="words" placeholder="مدرسه | مدرثه، مدرصه | هم‌خانوادهٔ «درس» است، پس با «س».&#10;صابون | سابون، ثابون | واژه‌ای عربی است و با «ص» آغاز می‌شود."></textarea>
        </div>
      </div>
    </details>

    <div>
      <label>رویدادهای دریافتی از بازی</label>
      <div class="log" id="log"></div>
    </div>
  </div>
</div>
<iframe id="game" title="بازی" allow="autoplay"></iframe>

<script>
const TOPICS = [
  { id:'lesson',   label:'واژه‌های درس من', hint:'از کادر پایین',   cats:[] },
  { id:'all',      label:'همهٔ قاعده‌ها',    hint:'مرور کلی',        cats:[] },
  { id:'s_s_th',   label:'س / ص / ث',       hint:'',                cats:['s_s_th'] },
  { id:'z_z_z_z',  label:'ز / ض / ظ / ذ',   hint:'',                cats:['z_z_z_z'] },
  { id:'t_gh',     label:'ت/ط و غ/ق',       hint:'',                cats:['t_t','gh_gh'] },
  { id:'h_khva',   label:'ه/ح و خوا/خا',    hint:'',                cats:['h_h','khva'] },
  { id:'gozar',    label:'گزار / گذار',     hint:'',                cats:['gozar'] },
  { id:'peyvaste', label:'نیم‌فاصله و تنوین', hint:'',              cats:['peyvaste','tanvin'] },
];
const LENGTHS = [
  { id:'short',  label:'کوتاه',  hint:'۵ پرسش · ۳ دقیقه',  q:5,  m:3 },
  { id:'normal', label:'معمولی', hint:'۱۰ پرسش · ۵ دقیقه', q:10, m:5 },
  { id:'long',   label:'کامل',   hint:'۱۵ پرسش · ۸ دقیقه', q:15, m:8 },
  { id:'free',   label:'بدون زمان', hint:'۱۰ پرسش',        q:10, m:0 },
];
const MODES = [['word_hunt','شکار کلمه'],['letter_snipe','جای خالی'],['sentence_hunt','در جمله'],
               ['word_rescue','نجات کلمه'],['monster_combat','هیولا']];

let topic = 'all', length = 'normal';
const pickedModes = new Set(['word_hunt','letter_snipe','sentence_hunt']);

function paintOptions(hostId, list, current, onPick) {
  const host = document.getElementById(hostId);
  host.innerHTML = '';
  list.forEach(o => {
    const el = document.createElement('div');
    el.className = 'opt' + (o.id === current() ? ' on' : '');
    el.innerHTML = o.label + (o.hint ? `<small>${o.hint}</small>` : '');
    el.onclick = () => { onPick(o.id); paintAll(); };
    host.appendChild(el);
  });
}
function paintChips() {
  const host = document.getElementById('modes');
  host.innerHTML = '';
  MODES.forEach(([v, label]) => {
    const el = document.createElement('div');
    el.className = 'chip' + (pickedModes.has(v) ? ' on' : '');
    el.textContent = label;
    el.onclick = () => {
      pickedModes.has(v) ? pickedModes.delete(v) : pickedModes.add(v);
      if (pickedModes.size === 0) pickedModes.add(v);
      paintChips();
    };
    host.appendChild(el);
  });
}
function paintAll() {
  paintOptions('topics', TOPICS, () => topic, v => topic = v);
  paintOptions('lengths', LENGTHS, () => length, v => length = v);
}
paintAll(); paintChips();

function parseWords(text) {
  return text.split('\n').map(l => l.trim()).filter(Boolean).map(line => {
    const [w, bad, rule] = line.split('|').map(x => (x || '').trim());
    if (!w) return null;
    return {
      word: w,
      incorrectVariants: (bad || '').split(/[،,]/).map(x => x.trim()).filter(Boolean),
      ruleExplanation: rule || undefined,
    };
  }).filter(x => x && x.incorrectVariants.length > 0);
}

function log(kind, text) {
  const el = document.getElementById('log');
  const line = document.createElement('div');
  line.innerHTML = `<span class="${kind}">${text}</span>`;
  el.appendChild(line); el.scrollTop = el.scrollHeight;
}

function buildConfig() {
  const t = TOPICS.find(x => x.id === topic);
  const L = LENGTHS.find(x => x.id === length);
  const words = parseWords(document.getElementById('words').value);
  return {
    sessionId: 'sess_' + Date.now(),
    student: { id: document.getElementById('sid').value, name: document.getElementById('name').value },
    kind: 'exam',
    title: document.getElementById('title').value,
    questionCount: +document.getElementById('qc').value || L.q,
    durationSec: L.m * 60,
    lives: +document.getElementById('lives').value,
    categories: t.cats,
    grade: 'all',
    difficulty: 2,
    gameModes: [...pickedModes],
    words: (topic === 'lesson' && words.length) ? words : undefined,
    showEconomy: false,
  };
}

const b64 = o => btoa(unescape(encodeURIComponent(JSON.stringify(o))))
  .replace(/\+/g, '-').replace(/\//g, '_');

function launch() {
  const cfg = buildConfig();
  if (topic === 'lesson' && !cfg.words) {
    log('no', '! «واژه‌های درس من» انتخاب شده ولی کادر واژه‌ها خالی است — بانک پیش‌فرض به کار می‌رود');
  }
  document.getElementById('qc').value = cfg.questionCount;
  log('ev', `→ ${cfg.sessionId} · ${cfg.questionCount} پرسش · ${cfg.durationSec/60 || '∞'} دقیقه`);
  document.getElementById('game').src = './index.html#mission=' + b64(cfg);
}

window.addEventListener('message', (e) => {
  const d = e.data;
  if (!d || typeof d.type !== 'string' || !d.type.startsWith('wordhunter:')) return;
  if (d.type === 'wordhunter:progress') {
    log(d.last.correct ? 'ok' : 'no',
      `${d.answered}/${d.questionCount}  «${d.last.word}» ${d.last.correct ? '✓' : '✗ ' + d.last.chosen}` +
      `  ${(d.last.ms/1000).toFixed(1)}s  acc=${Math.round(d.accuracy*100)}%  ♥${d.livesLeft}`);
  } else if (d.type === 'wordhunter:finished') {
    const r = d.result;
    log('ev', `━━ نمره ${r.grade20}/20 · ${r.correct}/${r.questionCount} · دقت ${Math.round(r.accuracy*100)}%`);
    log('ev', `   اشتباه‌ها: ${r.missed.map(m => m.correctSpelling).join('، ') || '—'}`);
    log('ev', '   POST /api/spelling/results ← ارسال به سرور شما');
  } else if (d.type === 'wordhunter:exit') {
    log('ev', '← دانش‌آموز بازی را بست');
  } else {
    log('ev', '← ' + d.type);
  }
});
</script>
</body>
</html>
