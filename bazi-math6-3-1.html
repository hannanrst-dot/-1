<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>تیراندازِ اعشاری — ارزش مکانی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1a2452;--muted:#5b6bb0;--pk:#ff5d8f;--or:#ff9f45;--yl:#ffd23f;--gr:#22c993;--bl:#3aa0ff;--pu:#9b6cff;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:'Vazirmatn',sans-serif;color:var(--ink);
    background:linear-gradient(160deg,#8fe3ff 0%,#b7e39a 55%,#ffe6a0 100%);
    min-height:100vh;padding:8px;overflow:hidden;user-select:none}
  .wrap{max-width:440px;margin:0 auto;position:relative}
  .hud{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .chip{background:#fff;border-radius:16px;padding:6px 12px;font-weight:800;font-size:14px;display:flex;gap:6px;align-items:center;box-shadow:0 4px 12px rgba(80,80,160,.18)}
  .chip .lbl{color:var(--muted);font-size:11px;font-weight:700}.grow{flex:1}.hearts{font-size:15px}
  .qbar{background:#fff;border-radius:16px;padding:8px 12px;text-align:center;margin-bottom:6px;box-shadow:0 4px 12px rgba(80,80,160,.18)}
  .qbar b{font-size:15px;font-weight:900}.qbar .big{color:var(--pu);font-size:26px;font-weight:900;margin-top:2px}
  .track{height:9px;background:#fff;border-radius:6px;overflow:hidden;margin-bottom:6px;box-shadow:0 2px 8px rgba(80,80,160,.14)}
  #prog{height:100%;width:0;background:linear-gradient(90deg,var(--bl),var(--gr));transition:width .2s}
  .stage{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(80,80,160,.25)}
  canvas{display:block;width:100%;touch-action:none}
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;gap:12px;background:rgba(255,255,255,.86);backdrop-filter:blur(3px);z-index:5}
  .ov h1{margin:0;font-size:23px;color:var(--pu)}.ov p{margin:0;color:#43508f;font-size:14px;line-height:1.9;font-weight:700}
  .btn{border:0;cursor:pointer;font-family:inherit;font-weight:900;font-size:18px;color:#fff;padding:14px 34px;border-radius:18px;background:linear-gradient(180deg,#ff9d6b,var(--or));box-shadow:0 8px 20px rgba(255,159,69,.45);margin-top:4px}.btn:active{transform:translateY(2px)}
  .stars{font-size:40px;letter-spacing:6px}.emoji{font-size:46px}.hidden{display:none}
  .pill{background:#eef1ff;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:800;color:var(--muted)}
  .scoreBig{font-size:15px;font-weight:800}.scoreBig b{color:var(--or);font-size:22px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div class="chip"><span class="lbl">امتیاز</span><span id="score">۰</span></div>
    <div class="chip"><span class="lbl">مرحله</span><span id="round">۱/۸</span></div>
    <div class="grow"></div>
    <div class="chip hearts" id="hearts">❤️❤️❤️</div>
  </div>
  <div class="qbar"><b>وقتی نشانگر به این عدد رسید، شلیک کن:</b><div class="big" id="target">۰/۵</div></div>
  <div class="track"><div id="prog"></div></div>
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="ov" id="ovStart">
      <div class="emoji">🏹</div><h1>تیراندازِ اعشاری</h1>
      <p>یک نشانگر روی خطِ اعداد چپ و راست می‌رود.<br>
      دقیقاً وقتی روی عددِ خواسته‌شده رسید، برای <b>شلیکِ تیر</b> بزن!<br>
      هر خانه یک <b>دهم</b> (۰/۱) است. هرچه جلوتر بروی، تندتر می‌شود. 🎯</p>
      <button class="btn" id="btnStart">شروع بازی</button>
    </div>
    <div class="ov hidden" id="ovEnd">
      <div class="emoji" id="ef">🎉</div><h1 id="et">آفرین!</h1>
      <div class="stars" id="es">⭐⭐⭐</div>
      <div class="scoreBig">امتیاز: <b id="esc">۰</b></div>
      <div class="pill" id="em"></div>
      <button class="btn" id="btnAgain">دوباره</button>
    </div>
  </div>
</div>
<script>
(function(){"use strict";
  const GAMEID='math6-3-1';
  const fa=s=>(''+s).replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
  const faD=x=>fa((Math.round(x*100)/100).toString().replace('.','/'));
  const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  let AC=null;const ac=()=>{if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC};
  function beep(f,d,t,v){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();
    o.type=t||'sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);const n=c.currentTime;
    g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v||.16,n+.01);
    g.gain.exponentialRampToValueAtTime(.0001,n+(d||.15));o.start(n);o.stop(n+(d||.15)+.02);}
  const sShoot=()=>{beep(300,.06,'sawtooth',.1);setTimeout(()=>beep(180,.08,'sawtooth',.08),40);};
  const sHit=()=>{beep(700,.09,'square',.14);setTimeout(()=>beep(1000,.12,'square',.13),80)};
  const sMiss=()=>beep(160,.28,'sawtooth',.16);
  const sWin=()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.16,'square',.15),i*110));
  const sLose=()=>[392,330,262].forEach((f,i)=>setTimeout(()=>beep(f,.2,'sawtooth',.14),i*140));

  const TARGETS=[0.5,0.3,0.7,0.2,0.8,0.6,0.4,0.9];
  const TOTAL=TARGETS.length, TOL=0.035;
  const cv=$('cv'),ctx=cv.getContext('2d');let W,H,dpr;
  function layout(){const st=cv.parentElement;W=st.clientWidth;
    H=Math.max(360,Math.min(470,Math.round(window.innerHeight-200)));
    dpr=Math.min(2,window.devicePixelRatio||1);cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);}
  layout();window.addEventListener('resize',layout);

  let state='start',ri=0,score=0,lives=3,target,phase,rate,aim,shot,confetti=[];
  const LX=()=>32,RX=()=>W-32,LY=()=>H*0.42;
  const xOf=v=>LX()+v*(RX()-LX());
  const archer=()=>({x:W/2,y:H-42});

  function loadRound(i){ri=i;target=TARGETS[i];phase=Math.random()*2;rate=0.75+i*0.11;aim=0;shot=null;
    $('round').textContent=fa((i+1)+'/'+TOTAL);$('target').textContent=faD(target);updateHud();}
  function updateHud(){$('score').textContent=fa(score);
    $('hearts').textContent='❤️'.repeat(Math.max(0,lives))+'🤍'.repeat(Math.max(0,3-lives));
    $('prog').style.width=(100*ri/TOTAL)+'%';}

  cv.addEventListener('pointerdown',()=>{ if(state==='play'&&!shot) fire(); });
  function fire(){const v=aim;const a=archer();
    shot={v,t:0,x0:a.x,y0:a.y-24,x1:xOf(v),y1:LY(),good:Math.abs(v-target)<=TOL,done:false};
    sShoot();}
  function resolveShot(){
    if(shot.good){score+=10;sHit();for(let i=0;i<16;i++)confetti.push(spawnConf(xOf(shot.v),LY()));}
    else{lives--;sMiss();}
    updateHud();shot.done=true;shot.reveal=0;
    setTimeout(()=>{if(lives<=0){endGame(false);return;}
      if(ri>=TOTAL-1)endGame(true);else loadRound(ri+1);},1100);}

  function draw(dt){
    const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#dff3ff');sky.addColorStop(1,'#eafbe6');
    ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
    // زمین
    ctx.fillStyle='#a6e08a';ctx.beginPath();ctx.moveTo(0,H-26);
    for(let x=0;x<=W;x+=22)ctx.lineTo(x,H-26+Math.sin(x*0.06)*3);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
    if(state!=='start'&&target!=null){
      const y=LY(),lx=LX(),rx=RX();
      // خطِ اعداد
      ctx.strokeStyle='#3a4a86';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(lx,y);ctx.lineTo(rx,y);ctx.stroke();
      for(let k=0;k<=100;k+=5){const x=xOf(k/100),big=(k%10===0);
        ctx.strokeStyle=big?'#3a4a86':'rgba(90,107,176,.4)';ctx.lineWidth=big?2.5:1;
        ctx.beginPath();ctx.moveTo(x,y-(big?10:5));ctx.lineTo(x,y+(big?10:5));ctx.stroke();
        if(big){ctx.fillStyle='#1a2452';ctx.font='800 11px Vazirmatn';ctx.textAlign='center';ctx.textBaseline='top';
          ctx.fillText(faD(k/100),x,y+14);}}
      ctx.textBaseline='alphabetic';
      // حرکتِ نشانگر (فقط وقتی شلیک نشده)
      if(!shot){phase+=dt*rate;let tri=Math.abs(((phase)%2)-1);aim=tri;}
      const ax=xOf(aim);
      // نشانگر (هدف‌گیر)
      if(!shot||!shot.done){
        ctx.strokeStyle='rgba(255,93,143,.7)';ctx.lineWidth=2;ctx.setLineDash([4,4]);
        ctx.beginPath();ctx.moveTo(ax,y-26);ctx.lineTo(ax,y+26);ctx.stroke();ctx.setLineDash([]);
        ctx.fillStyle='#ff5d8f';ctx.beginPath();ctx.moveTo(ax,y-26);ctx.lineTo(ax-7,y-38);ctx.lineTo(ax+7,y-38);ctx.closePath();ctx.fill();
      }
      // تیر
      if(shot){shot.t=Math.min(1,shot.t+dt*3.2);const e=shot.t;
        const cx=shot.x0+(shot.x1-shot.x0)*e, cy=shot.y0+(shot.y1-shot.y0)*e-Math.sin(e*Math.PI)*60;
        // بدنه‌ی تیر
        const ang=Math.atan2((shot.y1-shot.y0),(shot.x1-shot.x0));
        ctx.save();ctx.translate(cx,cy);ctx.rotate(shot.t<1?(-1.1+e*1.1):0);
        ctx.strokeStyle='#7a4a1e';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-14,0);ctx.lineTo(10,0);ctx.stroke();
        ctx.fillStyle='#5b6bb0';ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(4,-4);ctx.lineTo(4,4);ctx.fill();
        ctx.strokeStyle='#ff5d8f';ctx.beginPath();ctx.moveTo(-14,0);ctx.lineTo(-18,-4);ctx.moveTo(-14,0);ctx.lineTo(-18,4);ctx.stroke();
        ctx.restore();
        if(shot.t>=1&&!shot.done)resolveShot();
        if(shot.done){
          // تیرِ نشسته + نتیجه
          ctx.strokeStyle=shot.good?'#22c993':'#ff5d8f';ctx.lineWidth=3;
          ctx.beginPath();ctx.moveTo(shot.x1,y-22);ctx.lineTo(shot.x1,y);ctx.stroke();
          ctx.fillStyle=shot.good?'#12a06e':'#ff5d8f';ctx.font='900 13px Vazirmatn';ctx.textAlign='center';
          ctx.fillText(faD(shot.v),shot.x1,y-28);
          if(!shot.good){const tx=xOf(target);
            ctx.strokeStyle='#22c993';ctx.setLineDash([5,4]);ctx.lineWidth=2;
            ctx.beginPath();ctx.moveTo(tx,y-30);ctx.lineTo(tx,y+30);ctx.stroke();ctx.setLineDash([]);
            ctx.fillStyle='#12a06e';ctx.font='900 12px Vazirmatn';ctx.fillText('درست: '+faD(target),tx,y+44);}
          ctx.fillStyle=shot.good?'#12a06e':'#ff5d8f';ctx.font='900 20px Vazirmatn';ctx.textAlign='center';
          ctx.fillText(shot.good?'وسط! ✅':'خطا رفت ❌',W/2,y-52);
        }
      }
      // تیرانداز
      drawArcher(archer(),shot?shot.v:aim);
      if(!shot){ctx.fillStyle='rgba(26,36,82,.55)';ctx.font='800 12px Vazirmatn';ctx.textAlign='center';
        ctx.fillText('برای شلیک بزن! 🏹',W/2,H-6);}
    }
    confetti=confetti.filter(c=>{c.vy+=.35;c.x+=c.vx;c.y+=c.vy;c.r+=c.vr;c.life-=.02;
      ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.r);ctx.globalAlpha=clamp(c.life,0,1);
      ctx.fillStyle=c.c;ctx.fillRect(-4,-3,8,5);ctx.restore();return c.life>0&&c.y<H+20;});
    ctx.globalAlpha=1;}
  function drawArcher(a,aimV){
    ctx.save();ctx.translate(a.x,a.y);
    // بدن
    ctx.fillStyle='#3aa0ff';ctx.beginPath();ctx.roundRect(-11,-24,22,26,7);ctx.fill();
    // سر
    ctx.fillStyle='#ffd9a0';ctx.beginPath();ctx.arc(0,-32,9,0,7);ctx.fill();
    // کمان (به سمتِ بالا/نشانگر)
    ctx.strokeStyle='#7a4a1e';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(0,-24,16,-Math.PI*0.8,-Math.PI*0.2);ctx.stroke();
    ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(Math.cos(-Math.PI*0.8)*16,-24+Math.sin(-Math.PI*0.8)*16);
    ctx.lineTo(Math.cos(-Math.PI*0.2)*16,-24+Math.sin(-Math.PI*0.2)*16);ctx.stroke();
    ctx.restore();}
  const _rr=CanvasRenderingContext2D.prototype.roundRect;
  if(!_rr)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){this.beginPath();
    this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this;};
  function spawnConf(x,y){const cols=['#ffd23f','#ff5d8f','#3aa0ff','#22c993','#9b6cff','#ff9f45'];
    return{x,y,vx:(Math.random()-.5)*8,vy:-Math.random()*7-2,r:Math.random()*6,vr:(Math.random()-.5)*.4,
      c:cols[(Math.random()*cols.length)|0],life:1.4+Math.random()};}

  function endGame(won){state='end';const pct=score/(TOTAL*10);
    const stars=pct>=.8?3:pct>=.55?2:1;
    for(let i=0;i<70;i++)confetti.push(spawnConf(Math.random()*W,-Math.random()*30));
    $('ef').textContent=won?'🎉':'😅';$('et').textContent=won?'تمام شد، آفرین!':'باختی! دوباره تلاش کن';
    $('es').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);$('esc').textContent=fa(score);
    $('em').textContent=won?'جای عددهای اعشاری روی محور را نشانه گرفتی!':'هر خانه ۰/۱ است؛ به‌موقع شلیک کن 💪';
    $('prog').style.width='100%';$('ovEnd').classList.remove('hidden');won?sWin():sLose();
    if(window.parent!==window){window.parent.postMessage(
      {type:'setareh_game',event:'complete',score:score,stars:stars,gameId:GAMEID},'*');}}
  let last=0;function loop(ts){if(!last)last=ts;let dt=(ts-last)/1000;last=ts;dt=Math.min(dt,.05);
    draw(dt);requestAnimationFrame(loop);}
  $('btnStart').onclick=()=>{ac();$('ovStart').classList.add('hidden');score=0;lives=3;loadRound(0);state='play';};
  $('btnAgain').onclick=()=>{$('ovEnd').classList.add('hidden');score=0;lives=3;confetti=[];loadRound(0);state='play';};
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
