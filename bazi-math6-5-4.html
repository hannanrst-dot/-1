<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>زاویه‌ساز — خط و زاویه</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1a2452;--muted:#5b6bb0;--pk:#ff5d8f;--or:#ff9f45;--yl:#ffd23f;--gr:#22c993;--bl:#3aa0ff;--pu:#9b6cff;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:'Vazirmatn',sans-serif;color:var(--ink);
    background:linear-gradient(160deg,#ffe29a 0%,#ffa99f 50%,#a0c4ff 100%);
    min-height:100vh;padding:8px;overflow:hidden;user-select:none}
  .wrap{max-width:440px;margin:0 auto;position:relative}
  .hud{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .chip{background:#fff;border-radius:16px;padding:6px 12px;font-weight:800;font-size:14px;display:flex;gap:6px;align-items:center;box-shadow:0 4px 12px rgba(80,80,160,.18)}
  .chip .lbl{color:var(--muted);font-size:11px;font-weight:700}.grow{flex:1}.hearts{font-size:15px}
  .qbar{background:#fff;border-radius:16px;padding:9px 12px;text-align:center;margin-bottom:6px;box-shadow:0 4px 12px rgba(80,80,160,.18)}
  .qbar b{font-size:16px;font-weight:900}.qbar .s{color:var(--muted);font-size:12px;margin-top:2px}
  .track{height:9px;background:#fff;border-radius:6px;overflow:hidden;margin-bottom:6px;box-shadow:0 2px 8px rgba(80,80,160,.14)}
  #prog{height:100%;width:0;background:linear-gradient(90deg,var(--or),var(--bl));transition:width .2s}
  .stage{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(80,80,160,.25)}
  canvas{display:block;width:100%;touch-action:none}
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;gap:12px;background:rgba(255,255,255,.9);backdrop-filter:blur(3px);z-index:5}
  .ov h1{margin:0;font-size:23px;color:var(--bl)}.ov p{margin:0;color:#43508f;font-size:14px;line-height:1.9;font-weight:700}
  .btn{border:0;cursor:pointer;font-family:inherit;font-weight:900;font-size:18px;color:#fff;padding:14px 34px;border-radius:18px;background:linear-gradient(180deg,#8ab6ff,var(--bl));box-shadow:0 8px 20px rgba(58,160,255,.45);margin-top:4px}.btn:active{transform:translateY(2px)}
  .stars{font-size:40px;letter-spacing:6px}.emoji{font-size:46px}.hidden{display:none}
  .pill{background:#eef1ff;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:800;color:var(--muted)}
  .scoreBig{font-size:15px;font-weight:800}.scoreBig b{color:var(--bl);font-size:22px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div class="chip"><span class="lbl">امتیاز</span><span id="score">۰</span></div>
    <div class="chip"><span class="lbl">مرحله</span><span id="round">۱/۸</span></div>
    <div class="grow"></div>
    <div class="chip hearts" id="hearts">❤️❤️❤️</div>
  </div>
  <div class="qbar"><b id="q">این زاویه را بساز:</b><div class="s" id="qs"></div></div>
  <div class="track"><div id="prog"></div></div>
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="ov" id="ovStart">
      <div class="emoji">📐</div><h1>زاویه‌ساز</h1>
      <p>یک پرتوِ ثابت داری و یک پرتوِ <b>متحرک</b>.<br>
      پرتوِ متحرک را با انگشتت بچرخان تا زاویه‌ی بینِ آن‌ها برابرِ عددِ خواسته‌شده شود.<br>
      از روی <b>نقاله</b> بخوان و بعد <b>«تأیید»</b> بزن! 🎯</p>
      <button class="btn" id="btnStart">شروع بازی</button>
    </div>
    <div class="ov hidden" id="ovEnd">
      <div class="emoji" id="ef">🎉</div><h1 id="et">آفرین!</h1>
      <div class="stars" id="es">⭐⭐⭐</div>
      <div class="scoreBig">امتیاز: <b id="esc">۰</b></div>
      <div class="pill" id="em"></div>
      <button class="btn" id="btnAgain">دوباره</button>
    </div>
  </div>
</div>
<script>
(function(){"use strict";
  const GAMEID='math6-5-4';
  const fa=s=>(''+s).replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
  const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  let AC=null;const ac=()=>{if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC};
  function beep(f,d,t,v){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();
    o.type=t||'sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);const n=c.currentTime;
    g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v||.16,n+.01);
    g.gain.exponentialRampToValueAtTime(.0001,n+(d||.15));o.start(n);o.stop(n+(d||.15)+.02);}
  const sTic=()=>beep(500,.02,'square',.04);
  const sOk=()=>{beep(680,.1,'square',.14);setTimeout(()=>beep(940,.12,'square',.13),80)};
  const sBad=()=>beep(160,.28,'sawtooth',.16);
  const sWin=()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.16,'square',.15),i*110));
  const sLose=()=>[392,330,262].forEach((f,i)=>setTimeout(()=>beep(f,.2,'sawtooth',.14),i*140));

  const TARGETS=[90,45,120,60,150,30,135,90], TOTAL=TARGETS.length, TOL=5;
  const cv=$('cv'),ctx=cv.getContext('2d');let W,H,dpr;
  function layout(){const st=cv.parentElement;W=st.clientWidth;
    H=Math.max(360,Math.min(440,Math.round(W*0.92)));dpr=Math.min(2,window.devicePixelRatio||1);
    cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);}
  layout();window.addEventListener('resize',layout);

  let state='start',ri=0,score=0,lives=3,target,theta,timeLeft,timeMax,confetti=[];
  function vx(){return W/2;} function vy(){return H-56;} function Rp(){return Math.min(W*0.42,H-110);}
  function btn(){return{x:W-56,y:H-34,r:30};}
  function loadRound(i){ri=i;target=TARGETS[i];theta=20;timeMax=15;timeLeft=timeMax;
    $('round').textContent=fa((i+1)+'/'+TOTAL);$('qs').textContent='زاویه‌ی هدف: '+fa(target)+' درجه';updateHud();}
  function updateHud(){$('score').textContent=fa(score);
    $('hearts').textContent='❤️'.repeat(Math.max(0,lives))+'🤍'.repeat(Math.max(0,3-lives));
    $('prog').style.width=(100*ri/TOTAL)+'%';}

  function setTheta(e){const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*(W/r.width),y=(e.clientY-r.top)*(H/r.height);
    let a=Math.atan2(vy()-y,x-vx())*180/Math.PI;a=clamp(a,0,180);if(Math.round(a)!==Math.round(theta))sTic();theta=a;}
  cv.addEventListener('pointerdown',e=>{if(state!=='play')return;
    const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*(W/r.width),y=(e.clientY-r.top)*(H/r.height);
    const bt=btn();if(Math.hypot(x-bt.x,y-bt.y)<bt.r+8){confirm();return;}
    setTheta(e);});
  cv.addEventListener('pointermove',e=>{if(state==='play'&&e.buttons)setTheta(e);});
  function confirm(){const good=Math.abs(theta-target)<=TOL;
    if(good){score+=10;sOk();theta=target;for(let i=0;i<18;i++)confetti.push(spawnConf(vx(),vy()-Rp()*0.5));
      updateHud();setTimeout(next,900);}
    else{lives--;sBad();updateHud();if(lives<=0)setTimeout(()=>endGame(false),300);}}
  function next(){if(ri>=TOTAL-1){endGame(true);return;}loadRound(ri+1);}

  function ray(ang,len,col,wd){const a=ang*Math.PI/180;
    ctx.strokeStyle=col;ctx.lineWidth=wd;ctx.beginPath();ctx.moveTo(vx(),vy());
    ctx.lineTo(vx()+Math.cos(a)*len,vy()-Math.sin(a)*len);ctx.stroke();}
  function draw(dt){
    const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#fff6e8');bg.addColorStop(1,'#eef4ff');
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    if(state!=='start'){
      const R=Rp(),cx=vx(),cy=vy();
      // نقاله (نیم‌دایره)
      ctx.fillStyle='rgba(58,160,255,.08)';ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,Math.PI,0);ctx.closePath();ctx.fill();
      ctx.strokeStyle='rgba(90,107,176,.4)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,cy,R,Math.PI,0);ctx.stroke();
      // تیک‌ها و برچسب‌ها
      for(let d=0;d<=180;d+=10){const a=d*Math.PI/180,big=(d%30===0);
        const r1=R-(big?14:8),x1=cx+Math.cos(a)*r1,y1=cy-Math.sin(a)*r1,x2=cx+Math.cos(a)*R,y2=cy-Math.sin(a)*R;
        ctx.strokeStyle=big?'#3a4a86':'rgba(90,107,176,.5)';ctx.lineWidth=big?2:1;
        ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
        if(big){ctx.fillStyle='#3a4a86';ctx.font='800 11px Vazirmatn';ctx.textAlign='center';ctx.textBaseline='middle';
          ctx.fillText(fa(d),cx+Math.cos(a)*(R-26),cy-Math.sin(a)*(R-26));}}
      // کمانِ زاویه‌ی فعلی
      ctx.strokeStyle='rgba(255,159,69,.8)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,34,0,-theta*Math.PI/180,true);ctx.stroke();
      // پرتوِ ثابت (۰ درجه)
      ray(0,R,'#1a2452',4);
      // پرتوِ متحرک
      const good=Math.abs(theta-target)<=TOL;
      ray(theta,R,good?'#22c993':'#ff5d8f',4);
      // علامتِ قائمه اگر نزدیکِ ۹۰
      if(Math.abs(theta-90)<TOL){ctx.strokeStyle='#22c993';ctx.lineWidth=2;
        ctx.strokeRect(cx-1,cy-18,18,18);}
      // رأس
      ctx.fillStyle='#1a2452';ctx.beginPath();ctx.arc(cx,cy,5,0,7);ctx.fill();
      // خواندنِ زاویه
      ctx.fillStyle=good?'#12a06e':'#1a2452';ctx.font='900 22px Vazirmatn';ctx.textAlign='center';ctx.textBaseline='alphabetic';
      ctx.fillText('زاویه: '+fa(Math.round(theta))+'°',cx,28);
      // دکمه‌ی تأیید
      const bt=btn();ctx.fillStyle=good?'#22c993':'#3aa0ff';ctx.beginPath();ctx.arc(bt.x,bt.y,bt.r,0,7);ctx.fill();
      ctx.fillStyle='#fff';ctx.font='900 14px Vazirmatn';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('تأیید',bt.x,bt.y);ctx.textBaseline='alphabetic';
      // راهنما
      ctx.fillStyle='rgba(26,36,82,.55)';ctx.font='800 12px Vazirmatn';ctx.textAlign='right';
      ctx.fillText('پرتو را بچرخان 👆',12,H-14);
      // timer
      if(state==='play'){timeLeft-=dt;if(timeLeft<=0)timeout();}
    }
    confetti=confetti.filter(c=>{c.vy+=.35;c.x+=c.vx;c.y+=c.vy;c.r+=c.vr;c.life-=.02;
      ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.r);ctx.globalAlpha=clamp(c.life,0,1);
      ctx.fillStyle=c.c;ctx.fillRect(-4,-3,8,5);ctx.restore();return c.life>0&&c.y<H+20;});
    ctx.globalAlpha=1;}
  function spawnConf(x,y){const cols=['#ffd23f','#ff5d8f','#3aa0ff','#22c993','#9b6cff','#ff9f45'];
    return{x,y,vx:(Math.random()-.5)*8,vy:-Math.random()*7-2,r:Math.random()*6,vr:(Math.random()-.5)*.4,
      c:cols[(Math.random()*cols.length)|0],life:1.4+Math.random()};}
  function timeout(){if(state!=='play')return;lives--;sBad();timeLeft=timeMax;updateHud();if(lives<=0)endGame(false);}

  function endGame(won){state='end';const pct=score/(TOTAL*10);
    const stars=pct>=.8?3:pct>=.55?2:1;
    for(let i=0;i<70;i++)confetti.push(spawnConf(Math.random()*W,-Math.random()*30));
    $('ef').textContent=won?'🎉':'😅';$('et').textContent=won?'تمام شد، آفرین!':'باختی! دوباره تلاش کن';
    $('es').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);$('esc').textContent=fa(score);
    $('em').textContent=won?'خواندنِ زاویه با نقاله را یاد گرفتی!':'زاویه را از روی نقاله دقیق بخوان 💪';
    $('prog').style.width='100%';$('ovEnd').classList.remove('hidden');won?sWin():sLose();
    if(window.parent!==window){window.parent.postMessage(
      {type:'setareh_game',event:'complete',score:score,stars:stars,gameId:GAMEID},'*');}}
  let last=0;function loop(ts){if(!last)last=ts;let dt=(ts-last)/1000;last=ts;dt=Math.min(dt,.05);
    draw(dt);requestAnimationFrame(loop);}
  $('btnStart').onclick=()=>{ac();$('ovStart').classList.add('hidden');score=0;lives=3;loadRound(0);state='play';};
  $('btnAgain').onclick=()=>{$('ovEnd').classList.add('hidden');score=0;lives=3;confetti=[];loadRound(0);state='play';};
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
