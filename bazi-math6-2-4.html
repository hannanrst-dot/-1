<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>آشپزِ کسری — محاسبات با کسر</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1a2452;--muted:#5b6bb0;--pk:#ff5d8f;--or:#ff9f45;--yl:#ffd23f;--gr:#22c993;--bl:#3aa0ff;--pu:#9b6cff;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:'Vazirmatn',sans-serif;color:var(--ink);
    background:linear-gradient(160deg,#ffd9a0 0%,#ffb0c8 48%,#c3a0ff 100%);
    min-height:100vh;padding:8px;overflow:hidden;user-select:none}
  .wrap{max-width:440px;margin:0 auto;position:relative}
  .hud{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .chip{background:#fff;border-radius:16px;padding:6px 12px;font-weight:800;font-size:14px;display:flex;gap:6px;align-items:center;box-shadow:0 4px 12px rgba(80,80,160,.18)}
  .chip .lbl{color:var(--muted);font-size:11px;font-weight:700}.grow{flex:1}.hearts{font-size:15px}
  .qbar{background:#fff;border-radius:16px;padding:10px 12px;text-align:center;margin-bottom:6px;box-shadow:0 4px 12px rgba(80,80,160,.18)}
  .qbar b{font-size:22px;font-weight:900}.qbar .s{color:var(--muted);font-size:12px;margin-top:2px}
  .track{height:9px;background:#fff;border-radius:6px;overflow:hidden;margin-bottom:6px;box-shadow:0 2px 8px rgba(80,80,160,.14)}
  #prog{height:100%;width:0;background:linear-gradient(90deg,var(--or),var(--pk));transition:width .2s}
  .stage{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(80,80,160,.25)}
  canvas{display:block;width:100%;touch-action:none}
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;gap:12px;background:rgba(255,255,255,.88);backdrop-filter:blur(3px);z-index:5}
  .ov h1{margin:0;font-size:23px;color:var(--pu)}.ov p{margin:0;color:#43508f;font-size:14px;line-height:1.9;font-weight:700}
  .btn{border:0;cursor:pointer;font-family:inherit;font-weight:900;font-size:18px;color:#fff;padding:14px 34px;border-radius:18px;background:linear-gradient(180deg,#ff9d6b,var(--or));box-shadow:0 8px 20px rgba(255,159,69,.45);margin-top:4px}.btn:active{transform:translateY(2px)}
  .stars{font-size:40px;letter-spacing:6px}.emoji{font-size:46px}.hidden{display:none}
  .pill{background:#eef1ff;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:800;color:var(--muted)}
  .scoreBig{font-size:15px;font-weight:800}.scoreBig b{color:var(--or);font-size:22px}
  .eq{direction:ltr;display:inline-flex;align-items:center;gap:8px;justify-content:center;font-weight:900}
  .fr{display:inline-flex;flex-direction:column;line-height:1.05;text-align:center;vertical-align:middle}
  .fr .n{border-bottom:2.5px solid currentColor;padding:0 5px}
  .fr .d{padding:2px 5px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div class="chip"><span class="lbl">امتیاز</span><span id="score">۰</span></div>
    <div class="chip"><span class="lbl">مرحله</span><span id="round">۱/۸</span></div>
    <div class="grow"></div>
    <div class="chip hearts" id="hearts">❤️❤️❤️</div>
  </div>
  <div class="qbar"><b id="q"></b><div class="s">نتیجه‌ی درست را در دیگ بریز 🍲</div></div>
  <div class="track"><div id="prog"></div></div>
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="ov" id="ovStart">
      <div class="emoji">🍲</div><h1>آشپزِ کسری</h1>
      <p>روی کارتِ دستور، یک محاسبه‌ی کسری می‌بینی.<br>
      از میانِ سه ماده، <b>کارتی که نتیجه‌ی درست را دارد</b> در دیگ بریز.<br>
      درست = دیگ پُرتر می‌شود؛ اشتباه = یک قلب می‌رود! 🎯</p>
      <button class="btn" id="btnStart">شروع بازی</button>
    </div>
    <div class="ov hidden" id="ovEnd">
      <div class="emoji" id="ef">🎉</div><h1 id="et">آفرین!</h1>
      <div class="stars" id="es">⭐⭐⭐</div>
      <div class="scoreBig">امتیاز: <b id="esc">۰</b></div>
      <div class="pill" id="em"></div>
      <button class="btn" id="btnAgain">دوباره</button>
    </div>
  </div>
</div>
<script>
(function(){"use strict";
  const GAMEID='math6-2-4';
  const fa=s=>(''+s).replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
  const frH=(n,d)=>d===1?'<span>'+fa(n)+'</span>':'<span class="fr"><span class="n">'+fa(n)+'</span><span class="d">'+fa(d)+'</span></span>';
  const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  function drawFrac(x,y,n,d,size){ctx.font='900 '+size+'px Vazirmatn';ctx.textAlign='center';
    if(d===1){ctx.textBaseline='middle';ctx.fillText(fa(n),x,y);ctx.textBaseline='alphabetic';return;}
    const nw=ctx.measureText(fa(n)).width,dw=ctx.measureText(fa(d)).width,w=Math.max(nw,dw),g=size*0.16;
    ctx.textBaseline='alphabetic';ctx.fillText(fa(n),x,y-g);
    ctx.textBaseline='top';ctx.fillText(fa(d),x,y+g);ctx.textBaseline='alphabetic';
    ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=Math.max(2,size*0.07);
    ctx.beginPath();ctx.moveTo(x-w/2-3,y);ctx.lineTo(x+w/2+3,y);ctx.stroke();}
  let AC=null;const ac=()=>{if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC};
  function beep(f,d,t,v){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();
    o.type=t||'sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);const n=c.currentTime;
    g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v||.16,n+.01);
    g.gain.exponentialRampToValueAtTime(.0001,n+(d||.15));o.start(n);o.stop(n+(d||.15)+.02);}
  const sOk=()=>{beep(680,.09,'square',.13);setTimeout(()=>beep(920,.11,'square',.12),70)};
  const sBad=()=>beep(160,.28,'sawtooth',.16);
  const sWin=()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.16,'square',.15),i*110));
  const sLose=()=>[392,330,262].forEach((f,i)=>setTimeout(()=>beep(f,.2,'sawtooth',.14),i*140));

  // expr نمایش، ans پاسخ، dec دو گزینه‌ی نادرست (خطاهای رایج)
  const ROUNDS=[
    {a:{n:1,d:2},op:'×',b:{n:1,d:3}, ans:{n:1,d:6},  dec:[{n:2,d:5},{n:1,d:5}]},
    {a:{n:2,d:3},op:'+',b:{n:1,d:6}, ans:{n:5,d:6},  dec:[{n:3,d:9},{n:1,d:2}]},
    {a:{n:3,d:4},op:'−',b:{n:1,d:2}, ans:{n:1,d:4},  dec:[{n:2,d:2},{n:2,d:4}]},
    {a:{n:2,d:5},op:'×',b:{n:3,d:4}, ans:{n:3,d:10}, dec:[{n:5,d:9},{n:6,d:9}]},
    {a:{n:3,d:4},op:'÷',b:{n:1,d:2}, ans:{n:3,d:2},  dec:[{n:3,d:8},{n:2,d:3}]},
    {a:{n:1,d:3},op:'+',b:{n:1,d:2}, ans:{n:5,d:6},  dec:[{n:2,d:5},{n:1,d:6}]},
    {a:{n:5,d:6},op:'×',b:{n:3,d:5}, ans:{n:1,d:2},  dec:[{n:8,d:11},{n:3,d:5}]},
    {a:{n:7,d:8},op:'−',b:{n:3,d:8}, ans:{n:1,d:2},  dec:[{n:4,d:16},{n:4,d:8}]},
  ];
  const TOTAL=ROUNDS.length;
  const cv=$('cv'),ctx=cv.getContext('2d');let W,H,dpr;
  function layout(){const st=cv.parentElement;W=st.clientWidth;
    H=Math.max(400,Math.min(520,Math.round(window.innerHeight-190)));
    dpr=Math.min(2,window.devicePixelRatio||1);cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);}
  layout();window.addEventListener('resize',layout);

  let state='start',ri=0,score=0,lives=3,R,cards,potFill,timeLeft,timeMax,drop=null,puff=[],confetti=[];
  function loadRound(i){ri=i;R=ROUNDS[i];
    const opts=[{f:R.ans,ok:true},{f:R.dec[0],ok:false},{f:R.dec[1],ok:false}];
    for(let k=opts.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[opts[k],opts[j]]=[opts[j],opts[k]];}
    cards=opts;timeMax=13;timeLeft=timeMax;drop=null;
    $('round').textContent=fa((i+1)+'/'+TOTAL);
    $('q').innerHTML='<span class="eq">'+frH(R.a.n,R.a.d)+'<span>'+R.op+'</span>'+frH(R.b.n,R.b.d)+'<span>=</span><span>؟</span></span>';
    updateHud();}
  function updateHud(){$('score').textContent=fa(score);
    $('hearts').textContent='❤️'.repeat(clamp(lives,0,3))+'🤍'.repeat(clamp(3-lives,0,3));
    $('prog').style.width=(100*ri/TOTAL)+'%';}
  function cardRects(){const n=3,gap=10,cw=(W-40-gap*(n-1))/n,cy=H*0.30,ch=88;
    return cards.map((c,k)=>({x:20+k*(cw+gap),y:cy,w:cw,h:ch,c}));}

  cv.addEventListener('pointerdown',e=>{
    if(state!=='play'||drop)return;
    const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*(W/r.width),y=(e.clientY-r.top)*(H/r.height);
    for(const rc of cardRects()){if(x>=rc.x&&x<=rc.x+rc.w&&y>=rc.y&&y<=rc.y+rc.h){pick(rc);return;}}});
  function pick(rc){drop={x:rc.x+rc.w/2,y:rc.y+rc.h/2,ok:rc.c.ok,f:rc.c.f,t:0};}
  function resolve(){
    if(state!=='play'){drop=null;return;}
    if(drop.ok){score+=10;potFill=clamp(potFill+1/TOTAL,0,1);sOk();
      for(let i=0;i<16;i++)confetti.push(spawnConf(W/2,H*0.72));updateHud();setTimeout(next,600);}
    else{lives--;sBad();for(let i=0;i<10;i++)puff.push({x:W/2,y:H*0.66,a:Math.random()*7,t:0});
      updateHud();if(lives<=0){endGame(false);return;}drop=null;}}
  function next(){if(ri>=TOTAL-1){endGame(true);return;}loadRound(ri+1);}

  function potXY(){return{x:W/2,y:H*0.74};}
  function draw(dt){
    const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#fff2e0');bg.addColorStop(1,'#ffe6f0');
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    if(state!=='start'&&R){
      // کارت‌ها
      if(!drop||drop.t<1){for(const rc of cardRects()){
        ctx.fillStyle='#fff';ctx.strokeStyle='#ffcf99';ctx.lineWidth=3;
        ctx.beginPath();ctx.roundRect(rc.x,rc.y,rc.w,rc.h,14);ctx.fill();ctx.stroke();
        ctx.fillStyle='#1a2452';drawFrac(rc.x+rc.w/2,rc.y+rc.h/2,rc.c.f.n,rc.c.f.d,30);}}
      // دیگ
      const p=potXY();
      ctx.fillStyle='#6b7280';ctx.beginPath();ctx.roundRect(p.x-58,p.y-30,116,64,{tl:10,tr:10,br:22,bl:22});ctx.fill();
      // محتوای دیگ
      const fillH=54*clamp(potFill,0,1);
      ctx.save();ctx.beginPath();ctx.roundRect(p.x-52,p.y-24,104,54,{tl:6,tr:6,br:18,bl:18});ctx.clip();
      const soup=ctx.createLinearGradient(0,p.y+30-fillH,0,p.y+30);soup.addColorStop(0,'#ffb15d');soup.addColorStop(1,'#ff7e3d');
      ctx.fillStyle=soup;ctx.fillRect(p.x-52,p.y+30-fillH,104,fillH);
      // حباب‌ها
      ctx.fillStyle='rgba(255,255,255,.5)';for(let k=0;k<4;k++){
        const bx=p.x-40+k*26,by=p.y+26-((performance.now()/8+k*40)%Math.max(6,fillH));
        if(by>p.y+30-fillH){ctx.beginPath();ctx.arc(bx,by,3,0,7);ctx.fill();}}
      ctx.restore();
      // دسته‌ها
      ctx.strokeStyle='#6b7280';ctx.lineWidth=5;
      ctx.beginPath();ctx.arc(p.x-58,p.y-6,10,0.5,Math.PI-0.5,true);ctx.stroke();
      ctx.beginPath();ctx.arc(p.x+58,p.y-6,10,0.5+Math.PI,-0.5,true);ctx.stroke();
      // بخار
      ctx.fillStyle='rgba(255,255,255,.4)';
      for(let k=0;k<3;k++){const sy=p.y-40-((performance.now()/12+k*30)%50);
        ctx.beginPath();ctx.arc(p.x-20+k*20,sy,6,0,7);ctx.fill();}
      // افتادنِ کارتِ انتخابی
      if(drop){drop.t=Math.min(1,drop.t+dt*2.2);const e=drop.t;
        const dx=drop.x+(p.x-drop.x)*e,dy=drop.y+(p.y-20-drop.y)*e;
        if(drop.t<1){ctx.fillStyle='#fff';ctx.strokeStyle=drop.ok?'#22c993':'#ff5d8f';ctx.lineWidth=3;
          ctx.beginPath();ctx.roundRect(dx-34,dy-24,68,48,10);ctx.fill();ctx.stroke();
          ctx.fillStyle='#1a2452';drawFrac(dx,dy,drop.f.n,drop.f.d,24);}
        else resolve();}
      puff=puff.filter(q=>{q.t+=dt*1.8;q.x+=Math.cos(q.a)*1.5;q.y-=1.2;ctx.globalAlpha=clamp(1-q.t,0,1);
        ctx.fillStyle='#bbb';ctx.beginPath();ctx.arc(q.x,q.y,5+q.t*6,0,7);ctx.fill();ctx.globalAlpha=1;return q.t<1;});
      // timer
      if(state==='play'){timeLeft-=dt;
        ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.roundRect(20,H-12,W-40,7,3);ctx.fill();
        ctx.fillStyle=timeLeft<4?'#ff5d8f':'#22c993';ctx.beginPath();ctx.roundRect(20,H-12,(W-40)*clamp(timeLeft/timeMax,0,1),7,3);ctx.fill();
        if(timeLeft<=0)timeout();}
    }
    confetti=confetti.filter(c=>{c.vy+=.35;c.x+=c.vx;c.y+=c.vy;c.r+=c.vr;c.life-=.02;
      ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.r);ctx.globalAlpha=clamp(c.life,0,1);
      ctx.fillStyle=c.c;ctx.fillRect(-4,-3,8,5);ctx.restore();return c.life>0&&c.y<H+20;});
    ctx.globalAlpha=1;}
  const _rr=CanvasRenderingContext2D.prototype.roundRect;
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(typeof r==='object'){this.beginPath();this.moveTo(x+r.tl,y);
      this.arcTo(x+w,y,x+w,y+h,r.tr);this.arcTo(x+w,y+h,x,y+h,r.br);
      this.arcTo(x,y+h,x,y,r.bl);this.arcTo(x,y,x+w,y,r.tl);this.closePath();return this;}
    if(_rr)return _rr.call(this,x,y,w,h,r);
    this.beginPath();this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this;};
  function spawnConf(x,y){const cols=['#ffd23f','#ff5d8f','#3aa0ff','#22c993','#9b6cff','#ff9f45'];
    return{x,y,vx:(Math.random()-.5)*8,vy:-Math.random()*7-2,r:Math.random()*6,vr:(Math.random()-.5)*.4,
      c:cols[(Math.random()*cols.length)|0],life:1.4+Math.random()};}
  function timeout(){if(state!=='play')return;lives--;sBad();timeLeft=timeMax;updateHud();
    if(lives<=0)endGame(false);}

  function endGame(won){state='end';const pct=score/(TOTAL*10);
    const stars=pct>=.8?3:pct>=.55?2:1;
    for(let i=0;i<70;i++)confetti.push(spawnConf(Math.random()*W,-Math.random()*30));
    $('ef').textContent=won?'🎉':'😅';$('et').textContent=won?'تمام شد، آفرین!':'باختی! دوباره تلاش کن';
    $('es').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);$('esc').textContent=fa(score);
    $('em').textContent=won?'محاسباتِ کسری را خوب انجام دادی!':'مرحله‌به‌مرحله حساب کن 💪';
    $('prog').style.width='100%';$('ovEnd').classList.remove('hidden');won?sWin():sLose();
    if(window.parent!==window){window.parent.postMessage(
      {type:'setareh_game',event:'complete',score:score,stars:stars,gameId:GAMEID},'*');}}
  let last=0,potFill0=0;function loop(ts){if(!last)last=ts;let dt=(ts-last)/1000;last=ts;dt=Math.min(dt,.05);
    draw(dt);requestAnimationFrame(loop);}
  $('btnStart').onclick=()=>{ac();$('ovStart').classList.add('hidden');score=0;lives=3;potFill=0;loadRound(0);state='play';};
  $('btnAgain').onclick=()=>{$('ovEnd').classList.add('hidden');score=0;lives=3;potFill=0;confetti=[];loadRound(0);state='play';};
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
