<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>کدام نیرو؟ — ورزش و نیرو (۲)</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1a2452;--muted:#5b6bb0;--pk:#ff5d8f;--or:#ff9f45;--yl:#ffd23f;--gr:#22c993;--bl:#3aa0ff;--pu:#9b6cff;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:'Vazirmatn',sans-serif;color:var(--ink);
    background:linear-gradient(160deg,#8fd3ff 0%,#c6f0a8 55%,#ffe08a 100%);
    min-height:100vh;padding:8px;overflow:hidden;user-select:none}
  .wrap{max-width:440px;margin:0 auto;position:relative}
  .hud{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .chip{background:#fff;border-radius:16px;padding:6px 12px;font-weight:800;font-size:14px;display:flex;gap:6px;align-items:center;box-shadow:0 4px 12px rgba(40,60,90,.2)}
  .chip .lbl{color:var(--muted);font-size:11px;font-weight:700}.grow{flex:1}.hearts{font-size:15px}
  .qbar{background:#fff;border-radius:16px;padding:8px 12px;text-align:center;margin-bottom:6px;box-shadow:0 4px 12px rgba(40,60,90,.2)}
  .qbar b{font-size:15px;font-weight:900}.qbar .s{color:var(--or);font-size:13px;margin-top:2px;font-weight:800}
  .track{height:9px;background:#fff;border-radius:6px;overflow:hidden;margin-bottom:6px;box-shadow:0 2px 8px rgba(40,60,90,.16)}
  #prog{height:100%;width:0;background:linear-gradient(90deg,var(--gr),var(--yl));transition:width .2s}
  .stage{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(40,60,90,.3)}
  canvas{display:block;width:100%;touch-action:none}
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;gap:12px;background:rgba(255,255,255,.93);backdrop-filter:blur(3px);z-index:5}
  .ov h1{margin:0;font-size:22px;color:#2e8ee0}.ov p{margin:0;color:#2f4a6a;font-size:14px;line-height:1.9;font-weight:700}
  .btn{border:0;cursor:pointer;font-family:inherit;font-weight:900;font-size:18px;color:#fff;padding:14px 34px;border-radius:18px;background:linear-gradient(180deg,#5bb6ff,#3aa0ff);box-shadow:0 8px 20px rgba(58,160,255,.45);margin-top:4px}.btn:active{transform:translateY(2px)}
  .stars{font-size:40px;letter-spacing:6px}.emoji{font-size:46px}.hidden{display:none}
  .pill{background:#eaf3ff;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:800;color:var(--muted)}
  .scoreBig{font-size:15px;font-weight:800}.scoreBig b{color:#2e8ee0;font-size:22px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div class="chip"><span class="lbl">امتیاز</span><span id="score">۰</span></div>
    <div class="chip"><span class="lbl">مرحله</span><span id="round">۱/۸</span></div>

  </div>
  <div class="qbar"><b id="q">کدام نیرو؟</b><div class="s" id="qs"></div></div>
  <div class="track"><div id="prog"></div></div>
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="ov" id="ovStart">
      <div class="emoji">🍎🧲</div><h1>کدام نیرو؟</h1>
      <p>هر صحنه را ببین و بگو کدام نیرو کار می‌کند:<br>
      🌍 <b>گرانش</b> (به سمتِ زمین) · 🧲 <b>مغناطیس</b> · ⚡ <b>الکتریکی</b> · 🛑 <b>اصطکاک</b><br>
      روی نیروی درست بزن!</p>
      <button class="btn" id="btnStart">شروع بازی</button>
    </div>
    <div class="ov hidden" id="ovEnd">
      <div class="emoji" id="ef">🎉</div><h1 id="et">آفرین!</h1>
      <div class="stars" id="es">⭐⭐⭐</div>
      <div class="scoreBig">امتیاز: <b id="esc">۰</b></div>
      <div class="pill" id="em"></div>
      <button class="btn" id="btnAgain">دوباره</button>
    </div>
  </div>
</div>

  const cv=$('cv'),ctx=cv.getContext('2d');let W,H,dpr;
  function layout(){const st=cv.parentElement;W=st.clientWidth;
    H=Math.max(420,Math.min(520,Math.round(W*1.06)));dpr=Math.min(2,window.devicePixelRatio||1);
    cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);}
  layout();window.addEventListener('resize',layout);
  const _rr=CanvasRenderingContext2D.prototype.roundRect;
  if(!_rr)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){this.beginPath();
    this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this;};

  let state='start',ri=0,score=0,lives=3,combo=0,cur,phase,timeLeft,timeMax,pick=-1,t0=0;
  let confetti=[],floaters=[];
  function cardRect(i){const c=i%2,r=(i/2)|0,gap=10,w=(W-gap*3)/2,h=(H*0.30-gap)/2,y0=H*0.66;
    return{x:gap+c*(w+gap),y:y0+r*(h+gap),w,h};}
  function loadRound(i){ri=i;cur=ROUNDS[i];phase='aim';pick=-1;t0=performance.now();
    timeMax=Math.max(4,7-i*0.3);timeLeft=timeMax;
    $('round').textContent=fa((i+1)+'/'+TOTAL);$('q').textContent='کدام نیرو کار می‌کند؟';
    $('qs').textContent=cur.cap;updateHud();}
  function updateHud(){$('score').textContent=fa(score);
    $('hearts').textContent='❤️'.repeat(Math.max(0,lives))+'🤍'.repeat(Math.max(0,3-lives));
    $('prog').style.width=(100*ri/TOTAL)+'%';}
  cv.addEventListener('pointerdown',e=>{if(state!=='play'||phase!=='aim')return;
    const rc=cv.getBoundingClientRect();const x=(e.clientX-rc.left)*(W/rc.width),y=(e.clientY-rc.top)*(H/rc.height);
    for(let i=0;i<4;i++){const r=cardRect(i);if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h){choose(i);return;}}});
  function choose(i){pick=i;const good=FORCES[i]===cur.a;phase='res';
    if(good){combo++;const sp=Math.round(clamp(timeLeft,0,7));const g=10+sp*2+(combo>=2?combo*2:0);score+=g;combo>=2?sCombo():sOk();
      floaters.push({x:W/2,y:H*0.12,t:0,txt:'+'+fa(g)+(combo>=2?' ×'+fa(combo):'')});
      for(let k=0;k<18;k++)confetti.push(spawnConf(W/2,H*0.3));updateHud();setTimeout(next,1250);}
    else{lives--;combo=0;sBad();floaters.push({x:W/2,y:H*0.12,t:0,txt:'نه، '+cur.a+' بود!'});updateHud();
      setTimeout(()=>{if(state!=='play')return;if(lives<=0){endGame(false);return;}next();},1400);}}
  function timeup(){if(phase!=='aim')return;lives--;combo=0;sBad();floaters.push({x:W/2,y:H*0.12,t:0,txt:'دیر شد!'});updateHud();phase='wait';
    setTimeout(()=>{if(state!=='play')return;if(lives<=0){endGame(false);return;}next();},700);}
  function next(){if(ri>=TOTAL-1){endGame(true);return;}loadRound(ri+1);}

  function drawScene(){const cx=W/2,cy=H*0.32,tt=(performance.now()-t0)/1000;
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='44px serif';
    const m=cur.m;const ph=(tt%1.6)/1.6;// 0..1 loop
    if(m==='fall'){ctx.font='40px serif';ctx.fillText('🌳',cx-60,cy-6);
      const y=cy-40+ph*80;ctx.font='30px serif';ctx.fillText('🍎',cx+30,y);
      ctx.fillStyle='#7a5';ctx.fillRect(cx-90,cy+46,180,6);}
    else if(m==='pull'){ctx.font='40px serif';ctx.fillText('🧲',cx-60,cy);
      const x=cx+50-ph*70;ctx.font='28px serif';ctx.fillText('🔩',x,cy);
      arrows(cx+20,cy,-1);}
    else if(m==='attract'){ctx.font='40px serif';ctx.fillText('🪮',cx-40,cy);
      for(let k=0;k<4;k++){const p=(ph+k*0.2)%1;ctx.font='16px serif';ctx.fillText('📄',cx+40-p*60,cy-20+k*14);}}
    else if(m==='slow'){const x=cx-70+Math.min(1,ph*1.3)*140;ctx.font='34px serif';ctx.fillText('⚽',x,cy);
      ctx.fillStyle='#c9a06a';ctx.fillRect(cx-90,cy+26,180,6);
      if(ph>0.7){ctx.fillStyle='#c2185b';ctx.font='700 12px Vazirmatn';ctx.fillText('کند می‌شود…',cx,cy-40);}}
    else if(m==='orbit'){ctx.font='40px serif';ctx.fillText('🌍',cx,cy);
      const a=tt*2;ctx.font='24px serif';ctx.fillText('🌙',cx+Math.cos(a)*60,cy+Math.sin(a)*44);}
    else if(m==='repel'){const d=6+Math.sin(tt*5)*6+ph*10;ctx.font='34px serif';
      ctx.fillText('🧲',cx-30-d,cy);ctx.fillText('🧲',cx+30+d,cy);
      ctx.fillStyle='#c0392b';ctx.font='700 12px Vazirmatn';ctx.fillText('دفع',cx,cy-40);}
    else if(m==='stick'){ctx.font='40px serif';ctx.fillText('🧑',cx-24,cy);
      const x=cx+30-Math.min(1,ph*1.4)*36;ctx.font='30px serif';ctx.fillText('🎈',x,cy-6);}
    else if(m==='ice'){const x=cx-70+ph*150;ctx.font='30px serif';ctx.fillText('🧑‍🦯',x,cy);
      ctx.fillStyle='#bfe8ff';ctx.fillRect(cx-95,cy+24,190,10);
      ctx.fillStyle='#3aa0ff';ctx.font='700 12px Vazirmatn';ctx.fillText('یخِ لغزنده',cx,cy-40);}
  }
  function arrows(x,y,dir){ctx.strokeStyle='#c0392b';ctx.lineWidth=3;for(let k=0;k<3;k++){const xx=x+dir*k*10;
    ctx.beginPath();ctx.moveTo(xx,y);ctx.lineTo(xx+dir*8,y-5);ctx.moveTo(xx,y);ctx.lineTo(xx+dir*8,y+5);ctx.stroke();}}

  function draw(dt){
    if(BG.complete&&BG.naturalWidth)ctx.drawImage(BG,0,0,W,H);
    else{const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#bfe8ff');bg.addColorStop(1,'#eaf6d0');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);}
    if(state!=='start'&&cur){
      // پنلِ صحنه
      ctx.fillStyle='rgba(255,255,255,.82)';ctx.beginPath();ctx.roundRect(W*0.06,H*0.10,W*0.88,H*0.42,18);ctx.fill();
      drawScene();
      if(combo>=2){ctx.fillStyle='#c2185b';ctx.font='900 14px Vazirmatn';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText('🔥 کومبو ×'+fa(combo),W/2,H*0.055);}
      // کارت‌های نیرو
      const cols=['#3aa0ff','#9b6cff','#ff9f45','#22c993'];const ic=['🌍','🧲','⚡','🛑'];
      for(let i=0;i<4;i++){const r=cardRect(i),good=(phase==='res'&&FORCES[i]===cur.a),bad=(phase==='res'&&pick===i&&FORCES[i]!==cur.a);
        ctx.fillStyle=good?'#e3fbef':(bad?'#ffe6ea':'#fff');ctx.strokeStyle=good?'#22c993':(bad?'#ff5d6c':cols[i]);ctx.lineWidth=(good||bad)?4:3;
        ctx.beginPath();ctx.roundRect(r.x,r.y,r.w,r.h,14);ctx.fill();ctx.stroke();
        ctx.font='24px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(ic[i],r.x+r.w/2,r.y+r.h*0.36);
        ctx.fillStyle='#1a2452';ctx.font='900 15px Vazirmatn';ctx.fillText(FORCES[i],r.x+r.w/2,r.y+r.h*0.72);}
      ctx.textBaseline='alphabetic';
      if(phase==='aim'){timeLeft-=dt;if(timeLeft<=0)timeup();}
      ctx.fillStyle='rgba(0,0,0,.08)';ctx.beginPath();ctx.roundRect(16,H-10,W-32,5,3);ctx.fill();
      ctx.fillStyle=timeLeft<2?'#ff5d6c':'#3aa0ff';ctx.beginPath();ctx.roundRect(16,H-10,(W-32)*clamp(timeLeft/timeMax,0,1),5,3);ctx.fill();
    }
    floaters=floaters.filter(f=>{f.t+=dt;f.y-=24*dt;ctx.globalAlpha=clamp(1-f.t,0,1);
      ctx.fillStyle=f.txt[0]==='+'?'#0d7a4f':'#ff5d6c';ctx.font='900 19px Vazirmatn';ctx.textAlign='center';ctx.textBaseline='alphabetic';
      ctx.fillText(f.txt,f.x,f.y);ctx.globalAlpha=1;return f.t<1.3;});
    confetti=confetti.filter(c=>{c.vy+=.35;c.x+=c.vx;c.y+=c.vy;c.r+=c.vr;c.life-=.02;
      ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.r);ctx.globalAlpha=clamp(c.life,0,1);
      ctx.fillStyle=c.c;ctx.fillRect(-4,-3,8,5);ctx.restore();return c.life>0&&c.y<H+20;});
    ctx.globalAlpha=1;}
  function spawnConf(x,y){const cols=['#ffd23f','#ff5d8f','#3aa0ff','#22c993','#9b6cff','#ff9f45'];
    return{x,y,vx:(Math.random()-.5)*8,vy:-Math.random()*7-2,r:Math.random()*6,vr:(Math.random()-.5)*.4,
      c:cols[(Math.random()*cols.length)|0],life:1.4+Math.random()};}
  function endGame(won){state='end';const pct=score/(TOTAL*16);const stars=pct>=.8?3:pct>=.55?2:1;
    for(let i=0;i<70;i++)confetti.push(spawnConf(Math.random()*W,-Math.random()*30));
    $('ef').textContent=won?'🎉':'😅';$('et').textContent=won?'کارشناسِ نیرو شدی!':'باختی! دوباره تلاش کن';
    $('es').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);$('esc').textContent=fa(score);
    $('em').textContent=won?'گرانش، مغناطیس و الکتریکی بدونِ تماس‌اند؛ اصطکاک حرکت را کند می‌کند':'انواعِ نیرو را به یاد بسپار 💪';
    $('prog').style.width='100%';$('ovEnd').classList.remove('hidden');won?sWin():sLose();
    if(window.parent!==window){window.parent.postMessage({type:'setareh_game',event:'complete',score:score,stars:stars,gameId:GAMEID},'*');}}
  let last=0;function loop(ts){if(!last)last=ts;let dt=(ts-last)/1000;last=ts;dt=Math.min(dt,.05);draw(dt);requestAnimationFrame(loop);}
  $('btnStart').onclick=()=>{ac();$('ovStart').classList.add('hidden');score=0;lives=3;combo=0;loadRound(0);state='play';};
  $('btnAgain').onclick=()=>{$('ovEnd').classList.add('hidden');score=0;lives=3;combo=0;confetti=[];loadRound(0);state='play';};
  requestAnimationFrame(loop);
})();
</script>
