<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>حفّارِ اعماق — لایه‌های زمین</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1a2452;--muted:#5b6bb0;--pk:#ff5d8f;--or:#ff9f45;--yl:#ffd23f;--gr:#22c993;--bl:#3aa0ff;--pu:#9b6cff;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:'Vazirmatn',sans-serif;color:var(--ink);
    background:linear-gradient(160deg,#ffd9a8 0%,#ff9f7a 50%,#8a6bff 100%);
    min-height:100vh;padding:8px;overflow:hidden;user-select:none}
  .wrap{max-width:440px;margin:0 auto;position:relative}
  .hud{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .chip{background:#fff;border-radius:16px;padding:6px 12px;font-weight:800;font-size:14px;display:flex;gap:6px;align-items:center;box-shadow:0 4px 12px rgba(60,40,90,.2)}
  .chip .lbl{color:var(--muted);font-size:11px;font-weight:700}.grow{flex:1}.hearts{font-size:15px}
  .qbar{background:#fff;border-radius:16px;padding:8px 12px;text-align:center;margin-bottom:6px;box-shadow:0 4px 12px rgba(60,40,90,.2)}
  .qbar b{font-size:15px;font-weight:900}.qbar .s{color:var(--or);font-size:13px;margin-top:2px;font-weight:800}
  .track{height:9px;background:#fff;border-radius:6px;overflow:hidden;margin-bottom:6px;box-shadow:0 2px 8px rgba(60,40,90,.16)}
  #prog{height:100%;width:0;background:linear-gradient(90deg,var(--gr),var(--yl));transition:width .2s}
  .stage{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(60,40,90,.3)}
  canvas{display:block;width:100%;touch-action:none}
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;gap:12px;background:rgba(255,255,255,.93);backdrop-filter:blur(3px);z-index:5}
  .ov h1{margin:0;font-size:22px;color:#d2691e}.ov p{margin:0;color:#4a3a2a;font-size:14px;line-height:1.9;font-weight:700}
  .btn{border:0;cursor:pointer;font-family:inherit;font-weight:900;font-size:18px;color:#fff;padding:14px 34px;border-radius:18px;background:linear-gradient(180deg,#ff9f6b,#ff7a45);box-shadow:0 8px 20px rgba(255,122,69,.45);margin-top:4px}.btn:active{transform:translateY(2px)}
  .stars{font-size:40px;letter-spacing:6px}.emoji{font-size:46px}.hidden{display:none}
  .pill{background:#fff3e2;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:800;color:var(--muted)}
  .scoreBig{font-size:15px;font-weight:800}.scoreBig b{color:#d2691e;font-size:22px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div class="chip"><span class="lbl">امتیاز</span><span id="score">۰</span></div>
    <div class="chip"><span class="lbl">مرحله</span><span id="round">۱/۸</span></div>
    <div class="grow"></div>
    <div class="chip hearts" id="hearts">❤️❤️❤️</div>
  </div>
  <div class="qbar"><b id="q">کدام لایه؟</b><div class="s" id="qs"></div></div>
  <div class="track"><div id="prog"></div></div>
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="ov" id="ovStart">
      <div class="emoji">🌍🛰️</div><h1>حفّارِ اعماق</h1>
      <p>دانشمندان با <b>امواجِ لرزه‌ای</b> فهمیدند زمین چند <b>لایه</b> دارد.<br>
      سرنخ را بخوان و روی <b>لایه‌ی درست</b> در مقطعِ زمین بزن:<br>
      🟢 پوسته (بیرون) · 🟠 گوشته (میانی) · 🔴 هسته (مرکز)</p>
      <button class="btn" id="btnStart">شروع بازی</button>
    </div>
    <div class="ov hidden" id="ovEnd">
      <div class="emoji" id="ef">🎉</div><h1 id="et">آفرین!</h1>
      <div class="stars" id="es">⭐⭐⭐</div>
      <div class="scoreBig">امتیاز: <b id="esc">۰</b></div>
      <div class="pill" id="em"></div>
      <button class="btn" id="btnAgain">دوباره</button>
    </div>
  </div>
</div>

    ctx.fillStyle=bg;ctx.fillRect(-20,0,W+40,H);if(BG.complete&&BG.naturalWidth){ctx.drawImage(BG,0,0,W,H);}
    // ستاره‌ها
    ctx.fillStyle='rgba(255,255,255,.5)';for(let i=0;i<24;i++){const x=(i*73)%W,y=(i*131)%(H*0.4);ctx.fillRect(x,y,2,2);}
    if(state!=='start'&&cur){
      const r=RR(),cx=CX(),cy=CY();
      const hl=(phase==='res'&&picked)?picked:null;
      // دیسک‌های تودرتو از بیرون به مرکز
      disk(r,LAYERS.crust.c,LAYERS.crust.c2);
      disk(r*0.85,LAYERS.mantle.c,LAYERS.mantle.c2);
      disk(r*0.42,LAYERS.core.c,LAYERS.core.c2);
      // خطوطِ جداکننده
      ctx.strokeStyle='rgba(0,0,0,.18)';ctx.lineWidth=1.5;
      [0.42,0.85,1].forEach(f=>{ctx.beginPath();ctx.arc(cx,cy,r*f,0,Math.PI*2);ctx.stroke();});
      // برجسته‌سازیِ لایه‌ی انتخاب‌شده
      if(hl==='crust')hlBand(r*0.85,r);else if(hl==='mantle')hlBand(r*0.42,r*0.85);else if(hl==='core')hlBand(0,r*0.42);
      // برچسب‌ها
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.font='900 15px Vazirmatn';
      ctx.fillText('هسته',cx,cy);
      ctx.fillText('گوشته',cx,cy-r*0.63);
      ctx.fillStyle='#1a3a1a';ctx.font='900 12px Vazirmatn';ctx.fillText('پوسته',cx,cy-r*0.93);
      // نتیجه: علامتِ درست
      if(phase==='res'&&picked===cur.a){ctx.fillStyle='#fff';ctx.font='30px serif';ctx.fillText('✅',cx+ (cur.a==='core'?0:0), cy - (cur.a==='crust'?r*0.72:cur.a==='mantle'?r*0.45:0));}
      if(combo>=2){ctx.fillStyle='#ffd23f';ctx.font='900 15px Vazirmatn';ctx.textAlign='right';ctx.textBaseline='top';ctx.fillText('🔥 کومبو ×'+fa(combo),W-10,8);}
      ctx.fillStyle='rgba(255,255,255,.85)';ctx.font='800 12px Vazirmatn';ctx.textAlign='center';ctx.textBaseline='top';
      ctx.fillText('روی لایه‌ی درست بزن 👆',cx,cy+r+14);
      // تایمر
      if(phase==='aim'){timeLeft-=dt;if(timeLeft<=0)timeup();}
      ctx.fillStyle='rgba(255,255,255,.15)';ctx.beginPath();ctx.roundRect?ctx.roundRect(16,H-12,W-32,6,3):ctx.rect(16,H-12,W-32,6);ctx.fill();
      ctx.fillStyle=timeLeft<2.5?'#ff5d8f':'#ffd23f';ctx.beginPath();
      ctx.roundRect?ctx.roundRect(16,H-12,(W-32)*clamp(timeLeft/timeMax,0,1),6,3):ctx.rect(16,H-12,(W-32)*clamp(timeLeft/timeMax,0,1),6);ctx.fill();
    }
    floaters=floaters.filter(f=>{f.t+=dt;f.y-=26*dt;ctx.globalAlpha=clamp(1-f.t,0,1);
      ctx.fillStyle=f.txt[0]==='+'?'#7CFC9B':'#ffd23f';ctx.font='900 19px Vazirmatn';ctx.textAlign='center';ctx.textBaseline='alphabetic';
      ctx.fillText(f.txt,f.x,f.y);ctx.globalAlpha=1;return f.t<1.3;});
    confetti=confetti.filter(c=>{c.vy+=.35;c.x+=c.vx;c.y+=c.vy;c.r+=c.vr;c.life-=.02;
      ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.r);ctx.globalAlpha=clamp(c.life,0,1);
      ctx.fillStyle=c.c;ctx.fillRect(-4,-3,8,5);ctx.restore();return c.life>0&&c.y<H+20;});
    ctx.globalAlpha=1;ctx.restore();}
  if(!CanvasRenderingContext2D.prototype.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){this.beginPath();
    this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this;};

  function spawnConf(x,y){const cols=['#ffd23f','#ff5d8f','#3aa0ff','#22c993','#9b6cff','#ff9f45'];
    return{x,y,vx:(Math.random()-.5)*8,vy:-Math.random()*7-2,r:Math.random()*6,vr:(Math.random()-.5)*.4,
      c:cols[(Math.random()*cols.length)|0],life:1.4+Math.random()};}

  function endGame(won){state='end';const pct=score/(TOTAL*18);
    const stars=pct>=.8?3:pct>=.55?2:1;
    for(let i=0;i<70;i++)confetti.push(spawnConf(Math.random()*W,-Math.random()*30));
    $('ef').textContent=won?'🎉':'😅';$('et').textContent=won?'به مرکزِ زمین رسیدی!':'باختی! دوباره تلاش کن';
    $('es').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);$('esc').textContent=fa(score);
    $('em').textContent=won?'پوسته بیرون · گوشته میانی · هسته در مرکز':'لایه‌ها را از بیرون به مرکز به یاد بسپار 💪';
    $('prog').style.width='100%';$('ovEnd').classList.remove('hidden');won?sWin():sLose();
    if(window.parent!==window){window.parent.postMessage(
      {type:'setareh_game',event:'complete',score:score,stars:stars,gameId:GAMEID},'*');}}

  let last=0;function loop(ts){if(!last)last=ts;let dt=(ts-last)/1000;last=ts;dt=Math.min(dt,.05);
    draw(dt);requestAnimationFrame(loop);}
  $('btnStart').onclick=()=>{ac();$('ovStart').classList.add('hidden');score=0;lives=3;combo=0;loadRound(0);state='play';};
  $('btnAgain').onclick=()=>{$('ovEnd').classList.add('hidden');score=0;lives=3;combo=0;confetti=[];loadRound(0);state='play';};
  requestAnimationFrame(loop);
})();
</script>
